l_simp_chinese:
 textiles: "纺织业"
 textiles_desc: "从普通羊毛到精致奢侈布料的织造与布料生产。推广纺织业会提升整个领地对布料的需求，并加快选定区域内织工和工坊的建立。"
 crafts: "手工业"
 crafts_desc: "工匠和行会生产工具、加工钢材、皮革和石制品。这是城镇熟练行业的支柱。"
 arms: "军械业"
 arms_desc: "武器制造，以及后续的火器和大炮制造。一个得到扶持的军火产业能让军队从国内锻造工坊获得补给。"
 luxury: "奢侈品业"
 luxury_desc: "玻璃、珠宝、瓷器和漆器这类高价值手工艺品。这些声望产业让掌握它们的市民阶层变得富有。"
 paper_goods: "造纸与印刷业"
 paper_goods_desc: "造纸厂和书籍印刷。它推动了识字和行政发展，对商业的推动作用同样显著。"
 furnishings: "家具与陶器业"
 furnishings_desc: "面向各个阶层家庭的家具和陶器。"
 naval: "船具"
 naval_desc: "海军补给品和焦油，这些是建造和维护舰队的材料。"
 beverages: "酿造业"
 beverages_desc: "葡萄酒、烈酒和啤酒。这是一个渴求的市场，会回报供应它们的地区。"
