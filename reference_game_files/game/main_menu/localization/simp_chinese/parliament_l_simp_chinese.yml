 pa_reduce_naval_recruitment: "裁减海军员额"
 pa_reduce_naval_recruitment_simple: "$pa_reduce_naval_recruitment$"
 pa_reduce_naval_recruitment_desc: "该[estate|e]成员对水手的广泛征募深感担忧，并建议削减现役海军的在编人数。"
 pa_increase_entrenchment: "提高官僚部门固化"
 pa_increase_entrenchment_simple: "$pa_increase_entrenchment$"
 pa_increase_entrenchment_desc: "该[estate|e]的成员正在推动当前官僚部门的固化，可能是为了巩固他们在体制内的影响力。"
 pa_decrease_entrenchment: "减少官僚部门固化"
 pa_decrease_entrenchment_simple: "$pa_decrease_entrenchment$"
