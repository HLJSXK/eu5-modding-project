 #HRE
 pa_hre_lessen_tax_burden: "减轻帝国税"
 pa_hre_lessen_tax_burden_simple: "$pa_hre_lessen_tax_burden$"
 pa_hre_lessen_tax_burden_desc: "我们承诺减少帝国成员的[ShowPaymentName('imperial_contribution')]义务以换取他们的支持。"
 pa_hre_elevate_prussia_to_kingdom: "将[GetCountry('PRU').GetNameWithNoTooltip]升格为[ShowCountryRankNameWithNoTooltip('rank_kingdom')]"
 pa_hre_elevate_prussia_to_kingdom_simple: "升格[GetCountry('PRU').GetNameWithNoTooltip]头衔"
 pa_hre_elevate_prussia_to_kingdom_desc: "[GetCountry('PRU').GetName]的君主们一直在权力与荣耀的追求中展现出雄心壮志。他们甚至正式请求了国王的头衔，尽管最终只能以“[GetCountry('PRU').GetNameWithNoTooltip]人的国王”身份统治国家。将他们升格为一个真正的[ShowCountryRankName('rank_kingdom')]，或许能为我们赢得最后一点好感……"
 pa_hre_elevate_prussia_to_kingdom_tt: "[GetCountry('PRU').GetName]将触发关于收到我们决议的[event|e]。"
 pa_hre_grant_imperial_titles: "授予帝国头衔"
 pa_hre_grant_imperial_titles_simple: "$pa_hre_grant_imperial_titles$"
 pa_hre_grant_imperial_titles_desc: "众$elector_plural$会非常感激来自帝国皇室的额外头衔与声望。"
 pa_hre_affirmation_of_free_city_rights: "重申$free_city$特权"
 pa_hre_affirmation_of_free_city_rights_desc: "我们重申各个$free_city_plural$的权利与安全，确保它们在帝国内部的稳定与繁荣。"
 opinion_hre_pa_supports_free_cities: "为[ShowSpecialStatusNamePluralWithNoTooltip('free_city')]提供支持"
 pa_hre_affirmation_of_free_city_rights_tt: "所有独立的[ShowSpecialStatusName('free_city')]获得[ShowNamedValue('stability_mild_bonus')|+=2][stability|e]，且当前所有与他们的战争中作为对立方领导国的国家对[GetUniqueInternationalOrganization('hre').GetName][GetUniqueInternationalOrganization('hre').GetLeaderTitle]的好感减少[ShowBiasValue('opinion_hre_pa_supports_free_cities')|+]。"
 ### New Generic Parliament Issues – 1.2 Expansion ###
 ## Crown
 royal_monopoly_on_trade: "王室贸易垄断"
 royal_monopoly_on_trade_desc: "我们商人已凭借贸易利润获利过久。王室应该对核心商品实行垄断经营，将贸易收入收归王室所有，用以服务整个国家。"
 charter_subject_governors: "册封属国总督"
 charter_subject_governors_desc: "远方属国的臣民需要治理，而王室无力亲自兼顾。通过册封拥有王室权威的正式总督，我们加强对这些土地的掌控，并确保属地财政收入足额流入国库。"
 establish_colonial_administration: "建立殖民行政机构"
 establish_colonial_administration_desc: "我们在海外建立的殖民地，必须作为国家正式延伸进行治理，而非任由投机者随意处置。我们必须建立完善的行政机构以实现这一目标。"
 reform_the_royal_treasury: "改革王室国库"
 reform_the_royal_treasury_desc: "不受管控的铸币扩张引发物价上涨、货币贬值。对王室财政进行全面审计、改革国库管理制度，将为国家恢复稳健可靠的货币体系。"
 issue_royal_censure: "发布王室谴责令"
 issue_royal_censure_desc: "我们的宿敌采取了必须予以正式谴责的行径。经议会授权发布王室谴责令，向全世界明确表明：我们不会对此类行为坐视不理。"
 mandate_emergency_levies: "征召紧急征召军"
 mandate_emergency_levies_desc: "我们的战事需要来自全国各地的更多支援。王室必须号召各阶层臣民倾尽全力支援国家，共渡难关。"
 fund_royal_art_patronage: "资助王室艺术赞助事业"
 fund_royal_art_patronage_desc: "一个国家的伟大，不仅在于军队与财富，更在于其创造的艺术与文化成就。我们应当资助艺术家与工匠，让王朝的荣耀永世流传。"
 ## Nobles
 institute_feudal_levies: "巩固封建征召制度"
 institute_feudal_levies_desc: "强大军队的根基是骑兵贵族。将贵族家族的军事义务正式制度化，尤其是提供重骑兵的义务，能够强化我方野战军力。"
 establish_military_exercises: "设立军事演练制度"
 establish_military_exercises_desc: "和平时期贵族扈从日渐懈怠。强制开展定期野战演练与比武竞技，确保战士保持精锐，军队在战时能够随时应战。"
 establish_heralds_college: "建立纹章院"
 establish_heralds_college_desc: "爵位尊卑、纹章权利、贵族等级次序都是至关重要的事务。设立纹章院可以规范相关事务，并提升国家在国际舞台的声望。"
 promote_chivalric_orders: "扶持骑士团发展"
 promote_chivalric_orders_desc: "本国骑士团是贵族尚武美德的象征。王室给予官方认可与资金支持，能够巩固王室与顶尖战士之间的联系。"
 license_noble_privateers: "许可贵族私掠特许状"
 license_noble_privateers_desc: "海洋为勇者带来财富，贵族家族有充足能力武装战船牟利。发放私掠特许状，使其行动合法化、规范化，同时王室可从敌方贸易受损中获益。"
 monopolize_land_trade_routes: "垄断陆上商路贸易"
 monopolize_land_trade_routes_desc: "本国贵族掌控所有陆上贸易必经的道路、关隘与桥梁。正式授予贵族对陆上商人的征税权，将这笔收益交由最忠诚的臣民掌控。"
 fund_noble_colonization: "资助贵族殖民事业"
 fund_noble_colonization_desc: "国内顶尖贵族家族拥有殖民远征所需的财力与野心。我们应当册封并鼓励此类殖民行动，拓展国家的海外势力范围。"
 grant_exclusive_hunting_rights: "授予专属狩猎权"
 grant_exclusive_hunting_rights_desc: "国内森林与猎物天然属于贵族领地。授予贵族专属狩猎与林地管理权，能够强化贵族与其领地的联系，以及对王室的忠诚度。"
 establish_noble_garrison_law: "确立贵族驻防法"
 establish_noble_garrison_law_desc: "动乱威胁国家安定，没有强力地方驻防便无法镇压叛乱。依法要求贵族在领地内维持防御工事，随时准备保卫王室与国家。"
 ## Clergy
 establish_clergy_charity: "兴办教会慈善事业"
 establish_clergy_charity_desc: "贵族粮仓充盈富足，而百姓却忍饥挨饿。组织救济贫民饥民是教会的职责，如今我们必须将这项职责制度化并提供资金支持。"
 launch_religious_missions: "派遣宗教传教团"
 launch_religious_missions_desc: "本国大片疆域仍未沐浴真信之光。教会必须组织并派遣传教士，引领迷途灵魂归入信仰，我们将为他们提供所需支持以促成使命成功。"
 institute_canonical_law: "施行教会法"
 institute_canonical_law_desc: "信仰分裂的国度，精神也必将分裂。通过编纂教会法典、在各省统一施行，我们将加固维系国民的信仰纽带。"
 establish_inquisition_courts: "设立宗教裁判法庭"
 establish_inquisition_courts_desc: "异端思想已然生根发芽，唯有系统化的教会法庭行动才能将其根除。我们必须趁异端蔓延之前迅速采取行动。"
 promote_religious_tolerance: "推行宗教宽容政策"
 promote_religious_tolerance_desc: "本国境内生活着众多异信者，他们的不满正在滋生动乱。教会明智地认识到：宽容带来和平，远胜于无休止的冲突。"
 fund_monastery_network: "资助修道院体系"
 fund_monastery_network_desc: "本国修道院是学术、慈善与秩序的中心。我们应当扩建修道院网络并予以正式捐赠，让善举遍及国家每一处角落。"
 establish_pilgrimage_routes: "开辟朝圣路线"
 establish_pilgrimage_routes_desc: "信仰圣地吸引着远近信徒。正式保护并维护通往圣地的朝圣道路，既能彰显虔诚之心，也能为国家带来声望与荣耀。"
 regulate_tithe_collection: "规范什一税征收"
 regulate_tithe_collection_desc: "当前什一税征收混乱且争议不断。在全国统一教会收入分成标准，既能保障教士稳定合理的收入，也能免除民众不确定赋税带来的负担。"
 sponsor_theological_seminaries: "资助神学院"
 sponsor_theological_seminaries_desc: "学识渊博的教士是国家精神健康的根基。我们必须出资兴建并扩建神学院，培养新一代有学识的神职人员。"
 ## Burghers
 promote_export_trade: "扶持出口贸易"
 promote_export_trade_desc: "本国商人已准备好将商品运往世界各地，他们需要议会支持拓展贸易网络。大力发展出口贸易将富裕国家，并提升我国国际话语权。"
 establish_import_controls: "施行进口管制"
 establish_import_controls_desc: "我们不能任由外国商品泛滥冲击本土生产者。对入境商品设立正式管控，保护本土产业，保障本国商人竞争力。"
 fund_trade_expeditions: "资助远洋贸易远征"
 fund_trade_expeditions_desc: "商人行会已准备集资开展远洋商贸航行，但此类事业需要法律保障与议会支持以提振信心。"
 establish_commodity_exchange: "设立商品交易所"
 establish_commodity_exchange_desc: "各大市集繁华活跃，却缺少规范大宗货物有序交易的正式交易所。建成完善商品交易所，将使我国市场领先周边各国。"
 promote_maritime_trade: "扶持海运贸易"
 promote_maritime_trade_desc: "海上商路是勇者的财富大道。我们应当投资海运配套基建与机构，保障本国商人掌控海域贸易。"
 license_trading_companies: "特许设立贸易公司"
 license_trading_companies_desc: "远洋贸易风险与收益巨大，单个商人无力承担。特许成立正规贸易公司集资共担风险，惠及整个国家。"
 establish_customs_houses: "设立税关"
 establish_customs_houses_desc: "我国边境管控松散，外国商人走私入境逃税牟利。设立海关税关规范进口秩序，确保王室与本国商人获得应得收益。"
 fund_artisan_guilds: "资助手工业行会"
 fund_artisan_guilds_desc: "本国工匠技艺精湛、产品品质卓越，却缺乏组织与扶持难以发挥全部潜力。我们应当资助并保护手工业行会。"
 establish_trade_insurance: "设立贸易保险制度"
 establish_trade_insurance_desc: "海难、盗匪、战争等贸易风险，让许多商人不敢开展致富国家的商贸活动。建立正规保险制度，让商人更安心从事贸易。"
 expand_postal_relay_network: "扩建驿站邮传网络"
 expand_postal_relay_network_desc: "可靠通讯是商贸命脉。各大商号愿意出资建设驿站网络，让信件货物传递速度空前提升，这项投资将带来数倍回报。"
 ## Peasants
 establish_common_food_stores: "设立公共粮仓"
 establish_common_food_stores_desc: "收成歉收的残酷变故极易使民众陷入困境，饥饿会催生绝望。设立社区公共粮仓，便能保障无论饥荒多么严重，百姓都能有所依靠、不至走投无路。"
 promote_farming_innovation: "推广农业革新"
 promote_farming_innovation_desc: "其他地区已经证明，新式轮作与耕作法成效显著。我们应当在全国推广应用，让田地产出更为丰饶，减轻民众的匮乏困苦。"
 sponsor_irrigation_projects: "资助水利灌溉工程"
 sponsor_irrigation_projects_desc: "只要引水灌溉，国内大量土地就能大幅提升收成。我们应当出资修建水道与水利工程，将旱地改造为高产良田。"
 reduce_serfdom: "减轻农奴制压迫"
 reduce_serfdom_desc: "农奴制枷锁沉重束缚着底层民众，将他们束缚于土地，扼杀维系国家存续的劳动力。放宽束缚、赋予更多迁徙自由，能够提升民众忠诚度与生产效率。"
 establish_village_councils: "设立村社议事会"
 establish_village_councils_desc: "乡村由远在天边的贵族治理，他们既不了解也不关心地方需求。设立拥有地方事务管理权的村社议事会，让民众拥有话语权，让治理更贴近基层。"
 charter_artisan_guilds: "册封手工业行会特许状"
 charter_artisan_guilds_desc: "工坊的师傅与工匠辛勤劳作，却从未获得王室正式认可。为国内工匠同业公会颁发特许状，将行业纳入法治秩序，同时赢得维系国家繁荣的手工业者拥护。"
 subsidize_grain_imports: "补贴粮食进口"
 subsidize_grain_imports_desc: "国内市场具备供养百姓的能力，但前提是粮价在民众可承受范围之内。补贴粮食进口，可避免物资短缺与匮乏逼迫民众陷入绝望。"
 rural_crafts_charter: "乡村手工业特许令"
 rural_crafts_charter_desc: "城市行会垄断压制着乡村家庭赖以度日的副业。我们应当册封并保护乡村工匠，免受此类干涉，给予底层民众应有的经济自由。"
 prevent_noble_enclosure: "禁止圈占公地"
 prevent_noble_enclosure_desc: "大地主长期侵占农民赖以生存的公共土地，行径持续过久。我们必须出手保护农民仅剩的土地，避免动乱演变为更危险的叛乱。"
 ## Wartime
 declare_war_taxes: "征收战争税"
 declare_war_taxes_desc: "常规财政已无法支撑战事需求。议会必须批准面向所有阶层的紧急赋税——为国家存续与荣耀，全民共同分担这份重担。"
 wartime_cavalry_reserve: "战时骑兵预备役"
 wartime_cavalry_reserve_desc: "决战随时可能爆发，我们必须确保重骑兵处于完全战备状态。要求贵族家族将精锐骑兵时刻保持警戒，直至战争胜利。"
 fortify_frontier_passes: "加固边境关隘"
 fortify_frontier_passes_desc: "边境安危，全系于敌军必经的关隘。出资加固所有薄弱隘口，将天然地势改造为侵略者的葬身之地。"
 military_chaplaincy: "随军神职制度"
 military_chaplaincy_desc: "军队不仅为王室与国家而战，更为信仰与职责而战。派遣教士随军担任随军神父，在艰苦征战中维系士兵精神士气。"
 establish_field_hospitals: "设立战地医院"
 establish_field_hospitals_desc: "大量士兵并非死于敌军刀剑，而是死于可医治的创伤与可预防的疫病。由教会组织移动医院随军行动，拯救为国征战者的生命。"
 naval_supply_contracts: "海军补给承包合约"
 naval_supply_contracts_desc: "舰队远洋离不开稳定补给，而商人行会拥有完善供应网络。与行会签订正式补给合约保障舰队物资，让舰船无需担忧补给短缺便可作战。"
 fund_siege_engineers: "资助攻城工程师队伍"
 fund_siege_engineers_desc: "没有专业技术，敌军城墙便无法陷落。市民行会可出资供养专业工程师与攻城器械，攻克最坚固的要塞堡垒。"
 wartime_harvest_pooling: "战时收成配给制"
 wartime_harvest_pooling_desc: "兵马未动粮草先行，饥饿的军队毫无战力。将各地丰收盈余集中存入地区仓库，让民众直接供养保卫自身的军队。"
 supply_line_labor_draft: "补给线劳役征召"
 supply_line_labor_draft_desc: "前线补给道路必须持续维护、物资必须不间断运输。民众可通过补给线劳役支援战事，这份贡献与执剑作战同样重要。"
 ## Proximity
 royal_road_commission: "王室道路营建委员会"
 royal_road_commission_desc: "国内道路是王权与商贸流通的命脉。营建完善维护的王室道路网络，确保王室控制力快速通达国土每一处角落。"
 mountain_pass_charters: "山口关隘分封令"
 mountain_pass_charters_desc: "贵族掌控着分隔国土的山间隘口。册封其负责维护与驻防关隘，让地形距离不再使各省与王室隔绝。"
 establish_parish_waypoints: "设立教区驿站站点"
 establish_parish_waypoints_desc: "国内路途漫长，信使与旅人旅途疲惫。在主干道设立教区驿站，由教会提供休憩、指引与支援服务。"
 coastal_trading_post_network: "沿海商站网络"
 coastal_trading_post_network_desc: "我国海岸拥有天然良港与停泊点，却因设施不完善闲置。由商人出资建设沿海商站网络，降低海运成本风险，拉近远方省份与首都距离。"
 rural_road_upkeep_corvee: "乡村道路维护劳役"
 rural_road_upkeep_corvee_desc: "乡村道路因缺乏维护日渐破败。要求农户承担少量劳役维护本地道路畅通，确保国土任何地区都不与中央隔绝。"
