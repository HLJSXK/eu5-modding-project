 establish_standing_regiments: "Establish Standing Regiments"
 establish_standing_regiments_desc: "The age of mustering retainers at need has passed. Our noble houses should instead furnish trained officers to lead regiments kept permanent in royal service, a fighting force that owes its discipline to the crown rather than to its lord."
 mandate_wartime_conscription: "Mandate Wartime Conscription"
 mandate_wartime_conscription_desc: "Our enemies field armies of conscripted men, and we must do the same. Drawing reserves and recruits through the parish rolls will swell our forces in this hour of need."
 promote_industrial_workshops: "Promote Industrial Workshops"
 promote_industrial_workshops_desc: "The craft brotherhoods that once sustained our towns can no longer match the output our age demands. We should invest in the new manufactories and mechanized workshops that produce far more, far faster, and let our trades meet the times."
 wartime_officer_corps: "Reinforce the Officer Corps"
 wartime_officer_corps_desc: "The shock of cavalry no longer wins the day. What carries a battle now is the skill of those who command, and parliament should give the army its pick of our finest, trained and posted before the campaign opens."
 pa_accept_estate_culture: "Accept Estate Culture"
 pa_accept_estate_culture_simple: "笼络阶层"
 pa_accept_estate_culture_desc: "The [estate|e] demands that the dominant [culture|e] of its people be granted official acceptance."
 pa_convert_to_estate_religion: "Convert to Estate Religion"
 pa_convert_to_estate_religion_simple: "笼络阶层"
 pa_convert_to_estate_religion_desc: "The [estate|e] demands that the country convert to the [religion|e] of its people."
 pa_change_court_language_to_estate_language: "更改宫廷语言"
 pa_change_court_language_to_estate_language_simple: "笼络阶层"
 pa_change_court_language_to_estate_language_desc: "The [estate|e] demands that the [court_language|e] be changed to one that better reflects its identity."
 iw_militarize_country: "Militarize the Nation"
 iw_militarize_country_desc: "Call upon [parliament|e] to support an emergency military buildup, granting [army_tradition|e] and hardening our most experienced [army|e]."
