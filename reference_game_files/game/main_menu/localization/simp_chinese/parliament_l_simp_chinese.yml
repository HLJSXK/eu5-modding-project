 #Actions
 call_parliament: "召开议会"
 call_parliament_desc: "这将召开议会以获取支持，来解决[parliament_issue|e]、改变我们[laws|e]的[policies|e]、创造[casus_belli|e]、提高[taxes|e]或扩大[army_levies|e]和[navy_levies|e]。\n\n在会议期间我们将获得以下效果：[ShowModifier('parliament_in_session')]、[ShowModifier('parliament_location')]；并根据所选[location|e]的不同，[ShowModifier('parliament_in_capital')]或[ShowModifier('parliament_outside_capital')]。"
 request_more_taxes: "要求额外赋税"
 request_more_taxes_desc: "要求[Player.GetGovernment.GetParliament.GetName]允许我们从[estates|e]征收更多[tax|e]。"
 ask_for_larger_levies: "要求扩大征召"
 ask_for_larger_levies_desc: "要求我们[Player.GetGovernment.GetParliament.GetName]的[estates|e]在被召唤时提供更多的[army_levies|e]和[navy_levies|e]。"
 ask_for_law_changes: "要求变更法律"
 ask_for_law_changes_desc: "要求各[estates|e]批准我们改变[laws|e]的某项[policy|e]。"
 ask_for_law_changes_select_law_title: "选择一项[law|e]，以供我们的[Player.GetGovernment.GetParliament.GetName]批准修改。"
 ask_for_law_changes_select_policies_title: "选择一项[policy|e]，以供我们的[Player.GetGovernment.GetParliament.GetName]批准修改。"
 declare_holidays_request: "Declare Holidays"
 declare_holidays_request_desc: "Declaring an upcoming day to be a holiday for all our people will garner us popular support and also help us stabilize our affairs."
 prepare_for_war_select_title: "选择[country|e]以获得针对的[casus_belli|e]"
 prepare_for_war_select_province_title: "选择要设为[war_goal|e]的[province|e]"
 select_a_country_to_get_casus_belli_on: "选择一个[country|e]以让我们的[Player.GetGovernment.GetParliament.GetName]授予我们针对他们的[casus_belli|e]。"
 prepare_for_war: "制造宣战理由"
 prepare_for_war_desc: "要求[Player.GetGovernment.GetParliament.GetName]支持[war|e]，授予我们一个合法的[casus_belli|e]。\n•我们可以选择一个位于我国[diplomatic_range|e]内、非[rebel|e]、非我国[subject|e]且未处于[truce|e]状态的国家，从而获得一项针对他们的：\n[ShowCasusBelliName('cb_parliament_conquer_province')][casus_belli|e]\n•该[casus_belli|e]会持续[GetDefine('NDiplomacy','CASUS_BELLI_MONTHS')]个月（[Divide_int32(GetDefine('NDiplomacy','CASUS_BELLI_MONTHS'), '(int32)12')]年）。"
 PARLIAMENT_IN_SESSION: "[Player.GetGovernment.GetParliament.GetName]开庭中"
 #Issues
 #Infrastructure and Location Improvements Issues
 promote_castle_building: "改进$castle$工事"
 promote_castle_building_desc: "我们全国各地都有潜在防御工事的绝佳位置，随时准备阻挡我们的敌人。"
 promote_bastion_building: "改进$bastion$工事"
 promote_bastion_building_desc: "$promote_castle_building_desc$"
 promote_star_fort_building: "改进$star_fort$工事"
 promote_star_fort_building_desc: "$promote_castle_building_desc$"
 promote_fortress_building: "改进$fortress$工事"
 promote_fortress_building_desc: "$promote_castle_building_desc$"
 promote_pike_and_shot_tactics: "推广枪刺与射击战术"
 promote_pike_and_shot_tactics_desc: "将长矛兵与火绳枪兵编入同一支纪律严明的队伍，使之成为任何军队都不可小觑的力量。通过加强这些队伍的严格训练，我们将确保我军即便深入敌阵，也能在进攻和防守上胜过敌人。"
 promote_artillery_doctrine: "推广炮兵学说"
 promote_artillery_doctrine_desc: "火炮在战场上的决定性力量毋庸置疑，我们必须围绕这一事实构建我们的军事学说。我们必须确保我军配备能击溃敌军防线、摧毁防御工事的重型火炮。"
 sponsor_a_university: "赞助$university$"
 sponsor_a_university_desc: "在追求精神启蒙和理解神学的过程中传播知识是一个纯粹的目标，我们必须通过建立礼拜式的机构，用我们所有的财政和政治力量来支持这一目标。"
 pops_in_province_gain_20_satisfaction: "该[location|e]所在[province|e]的[pops|e]将获得[ShowNamedValue('pop_satisfaction_severe_bonus')|+=2%][pop_satisfaction|e]。"
 sponsor_a_confucian_academy: "赞助$confucian_academy$"
 sponsor_a_confucian_academy_desc: "为了追求更高的学问并为我们的学者提供大量的工作设施，我们应该投资于我们的学院。"
 sponsor_a_cathedral: "赞助$cathedral$"
 sponsor_a_cathedral_desc: "如果在我们最著名的城镇之一建立一座大教堂以颂扬我们的信仰，那我们的统治将永远受到尊重。"
 sponsor_a_opera_house: "赞助$opera_house$"
 sponsor_a_opera_house_desc: "我们的人民要求扩大我们的文化机构。为他们提供一个新的[ShowBuildingTypeNameWithNoTooltip('opera_house')]将满足这种文化热潮，同时为我们的城市地区提供必要的关注。"
 gravel_road_development: "扩展$gravel_road$网络"
 gravel_road_development_desc: "我们国家的支柱是连接我们省份和人口中心的东西。因此，我们必须铺设新的道路，并为其建设和扩建提供资金。"
 gravel_road_development_burghers: "$gravel_road_development$"
 gravel_road_development_burghers_desc: "$gravel_road_development_desc$"
 paved_road_development: "扩展$paved_road$网络"
 paved_road_development_desc: "$gravel_road_development_desc$"
 paved_road_development_burghers: "$paved_road_development$"
 paved_road_development_burghers_desc: "$gravel_road_development_desc$"
 modern_road_development: "扩展$modern_road$网络"
 modern_road_development_desc: "$gravel_road_development_desc$"
 railroad_development: "扩展$railroad$网络"
 railroad_development_desc: "$gravel_road_development_desc$"
 expand_mining_operations: "扩大采矿作业"
 expand_mining_operations_desc: "采矿业可以在我们的经济中发挥重要作用，但目前的经营状况并不令人满意。"
 expand_farming_operations: "资助农业田庄"
 expand_farming_operations_desc: "我们的农业阶层保证了许多基本必需品的生产。然而，土地所有者承诺，如果我们投入更多的时间和资源，产量将得到进一步提升。"
 expand_hunting_operations: "建立新狩猎场"
 expand_hunting_operations_desc: "我们尚未充分开发我们的狩猎场，许多的潜在利润因此白白流失了。"
 expand_gathering_operations: "扩大采集产业"
 expand_gathering_operations_desc: "我们应该扩大我们的采集和收集业务，以满足这些商品在建设和维护我们更广泛的经济中的需求。"
 expand_forestry_operations: "扩展林业开发"
 expand_forestry_operations_desc: "我国的森林有望获得更大的收益。我们应该扩大砍伐业务，以发挥其潜力。"
 #Economic Issues
 promote_integration: "推动整合进程"
 promote_integration_desc: "我们应该支持将我们领土内偏远省份整合并使其更紧密地融入核心领土的努力。"
 promote_urbanization: "推动城市化"
 promote_urbanization_desc: "显然，发展的道路在于促进我们主要城镇的城市化，以此作为扩大我们权力基础的一种手段。"
 grant_city_rights: "授予城市权"
 grant_city_rights_desc: "为了维持领土的繁荣，我们需要扩大城市地区的权利，授予更多城市权。"
 expand_food_stockpiles: "扩大食物储备"
 expand_food_stockpiles_desc: "我国人民正就粮食短缺的急迫问题向我们请愿。我们应该尝试扩大我们的[ShowBuildingTypeName('granary')]网络，从而防止将来再出现同样的问题。"
 #Military Issues
 back_the_war_effort: "支持战事"
 back_the_war_effort_desc: "我们立法机构的支持将为我们的战事雪中送炭。"
 finance_the_armory: "扩建$armory$设施"
 finance_the_armory_desc: "那些本可以正式纳入服役的后备兵员已经闲散很久了，我们继续新的征兵设施。"
 expand_barracks: "扩建$barracks$设施"
 expand_barracks_desc: "$finance_the_armory_desc$"
 sponsor_training_fields: "扩建$training_fields$设施"
 sponsor_training_fields_desc: "$finance_the_armory_desc$"
 sponsor_regimental_camp: "扩建$regimental_camp$设施"
 sponsor_regimental_camp_desc: "$finance_the_armory_desc$"
 sponsor_conscription_center: "扩建$conscription_center$设施"
 sponsor_conscription_center_desc: "$finance_the_armory_desc$"
 host_army_excercises: "举行军事演习"
 host_army_excercises_desc: "如果我们要维持一支多功能的军队，就必须推动军事演习，以使我们的士兵处于最佳状态并做好一切准备。"
 expand_officer_lists: "扩编军官团"
 expand_officer_lists_desc: "在军方高层提拔有识之士是确保领导有能的必由之路。"
 promote_noble_officers: "提拔贵族军官"
 promote_noble_officers_desc: "我们应该期待我们的中下贵族把新晋将官引荐进我们政府。"
 promote_noble_officers_passed.tt: "一位能力出众的[ShowEstateTypeName('nobles_estate')]成员会出现。"
 support_noble_sponsored_armies: "组建贵族赞助佣兵"
 support_noble_sponsored_armies_desc: "我们应该同意我们最英勇的领主组建一支雇佣兵部队，从而在我国的旗帜下捍卫我们的信仰和同胞。"
 #Naval Issues
 increase_naval_spending: "增加海军基建"
 increase_naval_spending_desc: "我们需要改善我们沿海城市城镇的基础设施，以支撑我们在领海的力量投射。"
 expand_docks: "扩建造船厂"
 expand_docks_desc: "我们需要扩大我们的造船能力，为我们的国家提供一支强大的舰队。"
 expand_dry_docks: "扩建造船厂"
 expand_dry_docks_desc: "我们需要扩大我们的造船能力，为我们的国家提供一支强大的舰队。"
 expand_shipyards: "扩建造船厂"
 expand_shipyards_desc: "我们需要扩大我们的造船能力，为我们的国家提供一支强大的舰队。"
 expand_grand_shipyards: "扩建造船厂"
 expand_grand_shipyards_desc: "我们需要扩大我们的造船能力，为我们的国家提供一支强大的舰队。"
 expand_naval_bases: "扩建造船厂"
 expand_naval_bases_desc: "我们需要扩大我们的造船能力，为我们的国家提供一支强大的舰队。"
 #Government Issues
 support_cabinet_generic_desc: "我国各地的官僚机构将从以提高效率为中心的立法改革中受益匪浅"
 support_noble_cabinet: "提拔贵族顾问"
 support_noble_cabinet_desc: "$support_cabinet_generic_desc$，而除了我们最受尊重的上流社会成员，还有谁是支持这项改革的最理想人选？"
 support_clergy_cabinet: "提拔神职顾问"
 support_clergy_cabinet_desc: "$support_cabinet_generic_desc$。最好的办法是求助于我们最虔诚的圣人。"
 support_burgher_cabinet: "提拔商界顾问"
 support_burgher_cabinet_desc: "$support_cabinet_generic_desc$，这当然离不开我们社会中的富有阶层倾囊相助。"
 support_peasant_cabinet: "提拔平民顾问"
 support_peasant_cabinet_desc: "$support_cabinet_generic_desc$，而得到广泛的民意支持将使改革顺利进行。"
 balance_the_budget: "平衡预算"
 balance_the_budget_desc: "沉重的财政危机问题高悬在我国人民头顶，这亟需尽快解决。"
 bolster_the_monarchy: "加强政府集权"
 bolster_the_monarchy_desc: "我国的中央权力理应凌驾于一切利益集团和特权精英之上。"
 bolster_the_republic: "$bolster_the_monarchy$"
 bolster_the_republic_desc: "$bolster_the_monarchy_desc$"
 bolster_the_divine_mandate: "$bolster_the_monarchy$"
 bolster_the_divine_mandate_desc: "$bolster_the_monarchy_desc$"
 bolster_the_tribal_leader: "$bolster_the_monarchy$"
 bolster_the_tribal_leader_desc: "$bolster_the_monarchy_desc$"
 bolster_the_khan: "$bolster_the_monarchy$"
 bolster_the_khan_desc: "$bolster_the_monarchy_desc$"
 conduct_a_census: "开展人口普查"
 conduct_a_census_desc: "适当地统计我们的人口，并促进他们的发展与繁荣。这是一种促进全国稳定和谐的伟大方式。"
 support_ruler: "支持政府"
 support_ruler_desc: "没有对其权力的正当承认，我们的政府就无法运作。通过议会的正式声明，我们可以巩固我们的统治并提升声誉。"
 increase_our_control: "加强控制"
 increase_our_control_desc: "对我们各省份下属地点的控制对我们国家行政至关重要。我们应完善对城镇实施控制的机构。"
 promote_state_religion: "推广国教"
 promote_state_religion_desc: "让我们的臣民追随我们国家的宗教是国家稳定的关键一步。我们应该加大力度让我们的人民皈依。"
 promote_burghers_member: "提拔市民成员"
 promote_burghers_member_desc: "作为商会和行会成员的市民对我国至关重要。我们应该将有能之士引荐进入我国政府。"
 promote_burghers_member_passed.tt: "一位能力出众的[ShowEstateTypeName('burghers_estate')]成员会出现。"
 #Diplomatic Issues
 expand_diplomatic_corps_generic_desc: "倚剑独行，寸步行止；持节按剑，可行千里。用书笔辅佐我们的刀剑，方能成就更大的事业。"
 expand_diplomatic_corps_minors: "睦邻外交"
 expand_diplomatic_corps_minors_desc: "$expand_diplomatic_corps_generic_desc$我们最应该惯性的是在我们周边的小国。"
 expand_diplomatic_corps_religion: "同宗外交"
 expand_diplomatic_corps_religion_desc: "$expand_diplomatic_corps_generic_desc$对我们来说，加强与同宗兄弟的联系是至关重要的。"
 expand_diplomatic_corps_majors: "强权外交"
 expand_diplomatic_corps_majors_desc: "$expand_diplomatic_corps_generic_desc$我们需要确保与世界级大国关系良好。"
 improve_subject_relations: "增加与附属国的联系"
 improve_subject_relations_desc: "通过加强我们同属国的外交和行政联系，使得他们能够取得与我国更为紧密的结合。"
 promote_clergy_member: "提拔教士成员"
 promote_clergy_member_desc: "我国政府可以倚仗神职人员的支持来取得更高的运作效率。通过在政府中为他们提供更高的职位，可以改善我们国家的状况。"
 promote_clergy_member_passed.tt: "一位能力出众的[ShowEstateTypeName('clergy_estate')]成员会出现。"
 #Trade Issues
 expand_our_market: "市场扩张行动"
 expand_our_market_desc: "放宽商业法规将使我们的市场受益匪浅。"
 protect_our_market: "进行市场监管"
 protect_our_market_desc: "衡量我国的市场竞争力，加强我国的商业监管，以确保我们的商人能够取得竞争优势，这是明智的做法。"
 sponsor_a_merchant_expedition: "资助贸易远征"
 sponsor_a_merchant_expedition_desc: "我们应该投资组建专门的商队，与其他市场建立贸易联系。"
 sponsor_urban_development: "开发内陆"
 sponsor_urban_development_desc: "我们不应该忽视内陆地区，而应该予以相应开发。"
 #Cultural Issues
 support_religious_art: "赞助宗教艺术"
 support_religious_art_desc: "我们的信仰是全国艺术家所汲取的灵感宝库。既然我们的宫廷有支持艺术家的能力，那么我们就应该聘请一位受到神圣启迪的大师。"
 support_nobles_art: "赞助贵族艺术"
 support_nobles_art_desc: "我们高雅的精英阶层是最渴望欣赏更多艺术的一批人。如果我们能雇佣更多的艺术家，一定能取悦他们。"
 support_religious_education: "支持宗教教育"
 support_religious_education_desc: "我们国家对信仰的仆从的依赖可以转化为对人口教育的巨大财富。浙江加速我们的科技进步，并反过来取得这些虔诚追随者们的忠心。"
 support_religious_education_passed.tt: "所有信仰我国主导宗教的[ShowPopTypeName('clergy')]和[ShowPopTypeName('peasants')]将获得[ShowNamedValue('pop_satisfaction_mild_bonus')|+=2%][pop_satisfaction|e]。"
 improve_relations_with_the_faith: "增进教派关系"
 improve_relations_with_the_faith_desc: "当信仰与国家的关系因多方决策而陷入紧张，尤其是在特定议题上信仰内部亦存在分歧时，扮演不同派系间的调解角色、促进对话与协商，或许能够避免更为深刻的分裂继续扩大。"
 #Revolution Issues
 curb_central_authority: "压制中央权威"
 curb_central_authority_desc: "[Player.GetGovernment.GetParliament.GetName]的权威不能被议会之外的任何权威所压倒。即便王室敕令压在头顶，为了我们的理想，我们也应该行使这一光荣的权利！"
 revoke_privilege_of_the_nobles: "撤销贵族特权"
 revoke_privilege_of_the_nobles_desc: "对于那些靠平民的劳动和汗水过活的人们，想想看当他们得知自己可怜的特权将被剥夺时将会多么瑟瑟发抖！"
 reduce_peasant_taxation: "削减农民租税"
 reduce_peasant_taxation_desc: "大众的一生就是被领主收税的一生。为了推动我们解放人民的议程，我们必须将这一税目压低再压低！"
 establish_a_constitution: "编纂宪法"
 establish_a_constitution_desc: "人民的意志必须浓缩为一部为众人广为接受的书面文件，从而在巩固我们权利的同时约束中央的权威。"
 random_noble_privilege_revoked_tt: "将为[ShowEstateTypeName('nobles_estate')]阶层撤销一项随机[estate_privilege|e]"
 #Unique Issues
 baronial_burghs_rights: "发展自治市镇"
 baronial_burghs_rights_desc: "扩大自治市镇的权利将促进我们国家的发展。"
 ecclesiastical_burghs_rights: "扩大自治教区"
 ecclesiastical_burghs_rights_desc: "扩大自治教区的权利将促进我们国家的发展。"
 compulsory_education_nobles: "贵族教育法案"
 compulsory_education_nobles_desc: "我们应该大力投资贵族教育，以推进我们的行政管理能力。"
 presbyterian_education: "长老会教育法案"
 presbyterian_education_desc: "我们应该在我国的每个教区建立一所学校，以进一步教育我们的人民。它们应由教会成员管理，并由我国地主缴纳的税款支付。"
 found_college_of_justice: "建立法学院"
 found_college_of_justice_desc: "目前，法律法规尚不发达，未达到我们的标准。我们应该建立一个新的机构，即法学院，来解决这些问题并建立一个强大的司法体系。"
 establish_the_signoria_of_venice: "建立威尼斯执政团"
 establish_the_signoria_of_venice_desc: "古老的威尼斯公社制度有着悠久的历史，并依然在我们国家内发挥着作用。然而，它的行政效率已显老态。我们可能需要重塑政府的最高机构，代之以一种能够主导解决国家内政问题的新制度。"
 appease_english_population: "安抚英格兰民众"
 appease_english_population_desc: "我们在不列颠岛上的臣民对我们的统治表示不满。向他们展现我们并非压迫者的一面有助于安抚他们。"
 increase_control_in_britain: "加强不列颠控制力"
 increase_control_in_britain_desc: "不列颠群岛隔绝于欧洲大陆之外，这使得我们在此地的统治异常难以开展。我们应该努力克服这一挑战，加强在那里的控制。"
 tolerance_of_non_hindus: "包容异教信众"
 tolerance_of_non_hindus_desc: "我们的国家囊括了众多信仰，我们的统治者也是一位宽容的信者，我们应该允许不同的信仰在我们国家落地生根。"
 VIJ_ALL_NON_HINDU_POPS_GAIN_SATISFACTION: "我们所有的[heretics|e]和[heathen|e][pops|e]会获得[ShowNamedValue('pop_satisfaction_severe_bonus')|+=2%][pop_satisfaction|e]。"
 increase_non_hindu_control: "约束异教信众"
 increase_non_hindu_control_desc: "与其让不同的信仰在我们的国家肆意泛滥，我们应该进一步控制他们，以免哪日他们向我们举起叛旗。"
 VIJ_ALL_NON_HINDU_POPS_LOCATIONS_GAIN_CONTROL: "治下所有至少有#Y 5%#![heretics|e]或[heathen|e][pops|e]的[locations|e]将获得[ShowNamedValue('control_mild_bonus')|+=2%][control|e]。"
 dlh_famine_reductions: "抗击饥馑"
 dlh_famine_reductions_desc: "与其坐视民众挨饿，我们应该为任何可能缺乏食物的地方提供援助。"
 new_model_army_pi: "新模范军"
 new_model_army_pi_desc: "正在进行的反对保王党的内战暴露出严重的军纪败坏问题，证明了我们的军队迫切需要全面改革。"
 edict_of_nantes_issue: "南特敕令"
 edict_of_nantes_issue_desc: "在多年漫长的宗教斗争之后，是时候让所有宗教共存团结，结束一切不必要的流血了。"
 end_the_french_wars_religion_tt: "[ShowDisasterName('french_wars_religion')][disaster|e]将会结束"
 mug_promote_rajput_officials: "提拔$rajasthani_language$官僚"
 mug_promote_rajput_officials_desc: "通过提拔国内讲$rajasthani_language$的民众，我们可以确保拥有一支可靠且可依赖的军事官员队伍。"
 promote_rajput_officials_passed_tt: "一位精通[ShowLanguageName('rajasthani_language')][language|e]的熟练成员将加入宫廷。"
 hussite_army_reform: "$hussite_ADJ$军事改革"
 hussite_army_reform_desc: "我们的人民在历史的低谷中披荆斩棘，克服了重重困难，在战争、迫害和十字军讨伐中幸存下来。如今，我们的军队应当采用最精妙的战术，转守为攻，对抗一切企图毁灭我们的敌人！"
 lit_measures_against_romuva: "镇压$romuva_ADJ$复兴"
 lit_measures_against_romuva_desc: "随着[ShowReligionAdjective('romuva')]信仰的复兴，许多人担心他们可能试图制造动乱。我们需要召集各阶层来处理此事。"
 lit_5_percent_of_pops_convert_to_our_religion_tt: "#Y 5%#!的[ShowReligionAdjective('romuva')][pops|e]会皈依[ROOT.GetCountry.GetReligion.GetName]"
 ### IO Parliament Issues ###
 #HRE
 hre_law_debate: "帝国法律辩论"
 hre_law_debate_desc: "[ShowSpecialStatusName('emperor')]希望在[GetUniqueInternationalOrganization('hre').GetName]境内实施一项新法律。现在，帝国各诸侯有机会就该提案进行支持或反对的辩论。"
 hre_request_additional_military_support: "帝国军事支持"
 hre_request_additional_military_support_desc: "[GetUniqueInternationalOrganization('hre').GetName]正面临外敌入侵的威胁。[GetUniqueInternationalOrganization('hre').GetLeaderTitle]被迫请求整个帝国及其所有成员提供军事支援。"
 hre_roman_month: "罗马月税"
 hre_roman_month_desc: "近来[GetUniqueInternationalOrganization('hre').GetName]的国库日渐空虚。[GetUniqueInternationalOrganization('hre').GetLeaderTitle]请求帝国各成员提供财政支持以确保其安全。"
 hre_roman_month_modifier_effect: "[ShowModifierEffect('pi_hre_increased_imperial_tax_modifier')]"
 hre_demand_internal_peace: "全境和平号召"
 hre_demand_internal_peace_desc: "[GetUniqueInternationalOrganization('hre').GetLeaderTitle]的权威因[GetUniqueInternationalOrganization('hre').GetName]的内部冲突而受到削弱。维护内部和平与稳定符合帝国的利益。"
 hre_demand_internal_peace_tt: "如果[THIS.GetInternationalOrganization.GetName][member|e]正在进行一场另一方也存在一个同组织[member]的[war|e]，那么他们将强制签署一份[white_peace|e]"
 hre_establish_perpetual_diet: "建立永久议会"
 hre_establish_perpetual_diet_desc: "$perpetual_diet_law_desc$"
 hre_establish_perpetual_diet_tt: "[GetUniqueInternationalOrganization('hre').GetName]将设立一个永久[parliament_seat|e]，作为唯一有效的[location|e]来召开[parliament|e]。"
 hre_force_emperor_to_abdicate: "逼迫皇帝退位"
 hre_force_emperor_to_abdicate_desc: "[GetUniqueInternationalOrganization('hre').GetLeaderCountry.GetLongName]的昏庸统治令各[ShowSpecialStatusNamePlural('elector')]深感不满，认为其难堪大任。值此帝国议会召开之际，必须立即就[GetUniqueInternationalOrganization('hre').GetName]未来的领导权归属做出决断。"
 #Union
 union_enforce_law_implementation: "强制联统集权"
 union_enforce_law_implementation_desc: "[GetInternationalOrganizationType('union').GetName]的一些成员要么是新加入的，要么已成功抵制了$union$中央集权的企图。如果我们希望顺利整合其他成员，就必须在每个成员中执行这些法律。"
 union_enforce_law_implementation_at: "每个[member|e]在[THIS.GetInternationalOrganization.GetName]中将他们的[union_integration_level_member|e]设置为[THIS.GetInternationalOrganization.GetModifierValueString('union_integration_level')]"
 #Agendas
 #Agenda to add a privilege for the estate
 pa_add_privilege: "授予特权"
 pa_add_privilege_simple: "贿赂阶层"
 pa_add_privilege_desc: "有时你必须给予[estate|e]永久的利益才能换取他们短期的支持。"
 #Agenda to change a policy prefered by the estate
 pa_change_policy: "更改政策"
 pa_change_policy_simple: "笼络阶层"
 pa_change_policy_desc: "该[estate|e]对我们当前的[policy|e]抱有异议，如果我们改变政策将能换来他们的支持。"
