 pa_reduce_opinion: "破坏关系"
 pa_reduce_opinion_simple: "$pa_reduce_opinion$"
 pa_reduce_opinion_desc: "该[estate|e]对我们可能将同这一国家建立友好关系而感到愤怒，他们要求我们向该国统治者写一封措辞强硬的信。"
