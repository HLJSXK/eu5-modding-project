 STATIC_MODIFIER_NAME_coffee_yemen_base: "阿拉比卡咖啡"
 STATIC_MODIFIER_DESC_coffee_yemen_base: "也门的土壤能够生产大量咖啡豆。"
 STATIC_MODIFIER_NAME_sahara_salt_mines_base: "撒哈拉盐矿"
 STATIC_MODIFIER_DESC_sahara_salt_mines_base: "这些盐矿生产了跨撒哈拉贸易的大部分食盐。"
 STATIC_MODIFIER_NAME_sikar_copper_mines_base: "凯德里铜矿"
 STATIC_MODIFIER_DESC_sikar_copper_mines_base: "凯德里丰富的铜矿提供了大量开采机会。"
 STATIC_MODIFIER_NAME_nishapur_gems_mines_base: "内沙布尔绿松石矿"
 STATIC_MODIFIER_DESC_nishapur_gems_mines_base: "内沙布尔绿松石矿蕴藏着丰富的珍贵宝石资源。"
 STATIC_MODIFIER_NAME_panjshir_valley_silver_mines_base: "潘杰希尔银谷"
 STATIC_MODIFIER_DESC_panjshir_valley_silver_mines_base: "潘杰希尔山谷沿线蕴藏着丰富的银矿资源，亟待开发。"
 STATIC_MODIFIER_NAME_turda_salt_mines_base: "图尔达盐矿"
 STATIC_MODIFIER_DESC_turda_salt_mines_base: "图尔达周边的盐矿堪称喀尔巴阡山脉地区储量最丰富的矿藏。"
 STATIC_MODIFIER_NAME_kutna_hora_silver_mines_base: "库滕堡银矿"
 STATIC_MODIFIER_DESC_kutna_hora_silver_mines_base: "库滕堡的银矿冠绝整个波西米亚。"
 STATIC_MODIFIER_NAME_rammelsberg_silver_mines_base: "拉默尔斯贝格银矿"
 STATIC_MODIFIER_DESC_rammelsberg_silver_mines_base: "拉默尔斯贝格的矿山蕴藏着丰富的白银。"
 STATIC_MODIFIER_NAME_mali_gold_mines_base: "马里金矿"
 STATIC_MODIFIER_DESC_mali_gold_mines_base: "布雷的金矿是曼萨·穆萨富那闻名于世的财富的源泉。"
 STATIC_MODIFIER_NAME_kremnica_gold_mines: "克雷姆尼察金矿"
 STATIC_MODIFIER_DESC_kremnica_gold_mines: "克雷姆尼察的金矿冠绝喀尔巴阡地区。"
 STATIC_MODIFIER_NAME_srebrenica_silver_mines_base: "斯雷布雷尼察银矿"
 STATIC_MODIFIER_DESC_srebrenica_silver_mines_base: "斯雷布雷尼察银矿冠绝巴尔干地区。"
 STATIC_MODIFIER_NAME_newfoundland_fishing_grounds_base: "纽芬兰大浅滩渔场"
 STATIC_MODIFIER_DESC_newfoundland_fishing_grounds_base: "纽芬兰岛周边海域堪称全球最丰饶的渔场。"
 STATIC_MODIFIER_NAME_amber_coast_base: "琥珀海岸"
 STATIC_MODIFIER_DESC_amber_coast_base: "该地区的海岸线蕴藏着大量琥珀矿藏。"
 STATIC_MODIFIER_NAME_sicily_sulfur_mines: "西西里硫矿"
 STATIC_MODIFIER_DESC_sicily_sulfur_mines: "西西里的硫磺矿蕴藏着火药生产所需的丰富的硝石生产原料。"
 STATIC_MODIFIER_NAME_damascus_base: "大马士革锻刀传统"
 STATIC_MODIFIER_DESC_damascus_base: "几个世纪以来，大马士革因其卓越的刀剑品质而闻名，这一工艺传统使该地的铁匠在武器制造领域拥有显著优势。"
 STATIC_MODIFIER_NAME_flanders_fine_cloth_base: "Flemish Cloth Tradition"
 STATIC_MODIFIER_DESC_flanders_fine_cloth_base: "The weavers of Flanders have refined their craft over generations, producing fine cloth of exceptional quality that commands premium prices across Europe."
 STATIC_MODIFIER_NAME_tuscany_fine_cloth_base: "Tuscan Textile Tradition"
 STATIC_MODIFIER_DESC_tuscany_fine_cloth_base: "Florence and Lucca have long been the pre-eminent centers of fine cloth production in Italy, with guilds whose techniques are the envy of Europe."
 STATIC_MODIFIER_NAME_venice_glass_base: "Murano Glassmaking Tradition"
 STATIC_MODIFIER_DESC_venice_glass_base: "The glassmakers of Murano have mastered techniques passed down through generations, producing glassware of unrivalled quality."
 STATIC_MODIFIER_NAME_toledo_weaponry_base: "Toledo Bladesmithing Tradition"
 STATIC_MODIFIER_DESC_toledo_weaponry_base: "Toledo has been renowned since antiquity for the exceptional quality of its blades, with smiths producing weapons of unmatched sharpness from the iron-rich ores of the region."
 STATIC_MODIFIER_NAME_bilbao_iron_base: "Basque Iron Deposits"
 STATIC_MODIFIER_DESC_bilbao_iron_base: "The iron deposits of Vizcaya are among the richest and highest-quality in Iberia, making Bilbao a major supplier of ore to smiths across the peninsula."
 STATIC_MODIFIER_NAME_milan_weaponry_base: "Milanese Arms Tradition"
 STATIC_MODIFIER_DESC_milan_weaponry_base: "Milan and Brescia are the armament capital of Europe, renowned for producing plate armour and weapons of unmatched quality."
 STATIC_MODIFIER_NAME_yorkshire_cloth_base: "Yorkshire Cloth Industry"
 STATIC_MODIFIER_DESC_yorkshire_cloth_base: "The towns of Yorkshire and the East Midlands have developed a thriving cloth industry, their weavers skilled in producing quality woollen cloth."
 STATIC_MODIFIER_NAME_england_wool_base: "English Wool Country"
 STATIC_MODIFIER_DESC_england_wool_base: "This region produces some of the finest wool in the world, sought after by cloth merchants across Europe."
 STATIC_MODIFIER_NAME_bengal_cotton_base: "Bengali Cotton Cultivation"
 STATIC_MODIFIER_DESC_bengal_cotton_base: "The warm and humid climate of Bengal is ideal for growing fine cotton, making this one of the most productive cotton-growing regions in the world."
 STATIC_MODIFIER_NAME_gujarat_cotton_base: "Gujarati Cotton Cultivation"
 STATIC_MODIFIER_DESC_gujarat_cotton_base: "Gujarat's fertile plains produce abundant cotton, a cornerstone of the region's textile trade."
