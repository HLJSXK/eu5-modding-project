l_simp_chinese:
 STATIC_MODIFIER_NAME_freiberg_base: "弗赖贝格银矿"
 STATIC_MODIFIER_DESC_freiberg_base: "该矿的开采始于12世纪。随着时间推移，它们已成为中欧的主要白银来源之一。"
 STATIC_MODIFIER_NAME_falun_base: "科帕尔贝里铜矿"
 STATIC_MODIFIER_DESC_falun_base: "这座矿山一直为欧洲源源不断地供应着大量的铜矿资源。"
 STATIC_MODIFIER_NAME_golconda_base: "戈尔孔达钻石矿"
 STATIC_MODIFIER_DESC_golconda_base: "全世界最优质、最珍贵的钻石都产自该矿。"
 STATIC_MODIFIER_NAME_skane_herring_market: "斯科讷鲱鱼市场"
 STATIC_MODIFIER_DESC_skane_herring_market: "建于约1200年，是整个斯堪的纳维亚的最大的鲱鱼交易市场。"
 STATIC_MODIFIER_NAME_almaden_base: "阿尔马登汞矿"
 STATIC_MODIFIER_DESC_almaden_base: "这座矿山贡献了全球水银使用量的三分之一。"
 STATIC_MODIFIER_NAME_huancavelica_base: "万卡韦利卡汞矿"
 STATIC_MODIFIER_DESC_huancavelica_base: "这些是西属美洲最重要的矿藏之一，以蕴藏大量水银而闻名。"
 STATIC_MODIFIER_NAME_idrija_base: "伊德里亚汞矿"
 STATIC_MODIFIER_DESC_idrija_base: "这些矿藏中富含大量液态汞及其固态形态（朱砂）。"
 STATIC_MODIFIER_NAME_lanmuchang_base: "滥木厂汞矿"
 STATIC_MODIFIER_DESC_lanmuchang_base: "自古以来，此地便是中国最为重要的汞矿产地。"
 STATIC_MODIFIER_NAME_potosi_base: "波托西里科山"
 STATIC_MODIFIER_DESC_potosi_base: "波托西山下，拥有世界上最丰富的银矿。"
 STATIC_MODIFIER_NAME_zacatecas_base: "萨卡特卡斯银矿"
 STATIC_MODIFIER_DESC_zacatecas_base: "萨卡特卡斯银矿冠绝整个美索美洲。"
 STATIC_MODIFIER_NAME_guanajuato_base: "瓜纳华托银矿"
 STATIC_MODIFIER_DESC_guanajuato_base: "瓜纳华托银矿冠绝中墨西哥。"
 STATIC_MODIFIER_NAME_spice_islands_base: "香料群岛丁香"
 STATIC_MODIFIER_DESC_spice_islands_base: "这座岛屿上广泛种植着备受青睐的香料——丁香。"
 STATIC_MODIFIER_NAME_nile_delta_rice_base: "尼罗河三角洲沃土"
 STATIC_MODIFIER_DESC_nile_delta_rice_base: "尼罗河的泛滥平原是适合各类作物生长的沃土。"
