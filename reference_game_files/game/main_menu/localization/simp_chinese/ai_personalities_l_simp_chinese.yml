l_simp_chinese:
 # AI Personality names (used as PdxDataLocalize(GetKey()) in CAiPersonality::GetName)
 ai_balanced: "平衡者"
 ai_aggressive: "侵略"
 ai_expansionist: "扩张"
 ai_defensive: "防御"
 ai_cautious: "谨慎"
 ai_opportunistic: "投机"
 ai_isolationist: "孤立"
 ai_friendly: "友善"
 # AI Personality descriptions (key + "_desc")
 ai_balanced_desc: "这个国家没有明显的倾向性。它的行为主要受统治者的性情、社会价值观以及所处环境的影响。"
 ai_aggressive_desc: "该国以武力谋求霸权，主动开战意愿强烈，会索要严苛的和平条款，将周边强权视为需要铲除的阻碍，而非可以结交的盟友。"
 ai_expansionist_desc: "该国致力于扩张领土与影响力，积极主张领土宣称、追求疆域增长；在条件允许时，更倾向于附庸臣服而非直接吞并。"
 ai_defensive_desc: "该国以守护现有领土为首要目标，尽量避免不必要冲突，专注国内发展建设，只会被动应对威胁，不会主动挑起争端。"
 ai_cautious_desc: "该国规避风险、行事耐心，优先选择外交解决争端，不发动无法必胜的战争，高度重视国家稳定，反对冒险激进政策。"
 ai_opportunistic_desc: "该国精于算计、务实利己，善于观察他国弱点并伺机牟利，但在战局前景不明时，不会轻易卷入冲突。"
 ai_isolationist_desc: "该国专注内政发展，拒绝外部纠葛，坚定偏好中立立场，对各类外交义务抱有猜忌与抵触态度。"
 ai_friendly_desc: "该国重视同盟、善意往来与公平外交，大力投入外交建设，接受合理和平条款，长期致力于积累可靠的外交伙伴。"
 # Diplomacy filter category header
