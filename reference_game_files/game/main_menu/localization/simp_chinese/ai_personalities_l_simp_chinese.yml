l_simp_chinese:
 # AI Personality names (used as PdxDataLocalize(GetKey()) in CAiPersonality::GetName)
 ai_aggressive: "侵略"
 ai_expansionist: "扩张"
 ai_defensive: "防御"
 ai_cautious: "谨慎"
 ai_opportunistic: "投机"
 ai_isolationist: "孤立"
 ai_friendly: "友善"
 # AI Personality descriptions (key + "_desc")
 ai_aggressive_desc: "该国以武力谋求霸权，主动开战意愿强烈，会索要严苛的和平条款，将周边强权视为需要铲除的阻碍，而非可以结交的盟友。"
 ai_expansionist_desc: "该国致力于扩张领土与影响力，积极主张领土宣称、追求疆域增长；在条件允许时，更倾向于附庸臣服而非直接吞并。"
 ai_defensive_desc: "该国以守护现有领土为首要目标，尽量避免不必要冲突，专注国内发展建设，只会被动应对威胁，不会主动挑起争端。"
 ai_cautious_desc: "该国规避风险、行事耐心，优先选择外交解决争端，不发动无法必胜的战争，高度重视国家稳定，反对冒险激进政策。"
 ai_opportunistic_desc: "该国精于算计、务实利己，善于观察他国弱点并伺机牟利，但在战局前景不明时，不会轻易卷入冲突。"
 ai_isolationist_desc: "该国专注内政发展，拒绝外部纠葛，坚定偏好中立立场，对各类外交义务抱有猜忌与抵触态度。"
 ai_friendly_desc: "该国重视同盟、善意往来与公平外交，大力投入外交建设，接受合理和平条款，长期致力于积累可靠的外交伙伴。"
 # Diplomacy filter category header
 CUSTOM_SEARCH_FILTER_AI_PERSONALITY_CATEGORY_NAME: "国家性格"
 # Tooltip section header
 AI_PERSONALITY_MODIFIERS: "行为修正"
 # AI disposition labels (how this country sees the player)
 AI_DISPOSITION_ALARMED: "受到威胁"
 AI_DISPOSITION_WARY: "警惕"
 AI_DISPOSITION_PLANNING_WAR: "摩拳擦掌"
 AI_DISPOSITION_COVETS: "觊觎领土"
 AI_DISPOSITION_RIVALS: "宿敌"
 AI_DISPOSITION_INDIFFERENT: "冷漠"
 # AI disposition descriptions (tooltip body for each disposition)
 AI_DISPOSITION_ALARMED_DESC: "This [country_disposition|e] means they see you as an existential threat and are likely to seek defensive alliances or take preemptive action against you."
 AI_DISPOSITION_WARY_DESC: "该[country_disposition|e]意味着他们对你保持谨慎，不愿作出让步，也不会放松警惕。"
 AI_DISPOSITION_PLANNING_WAR_DESC: "该[country_disposition|e]意味着他们持有有效领土宣称或不满诉求，并正准备以武力主张权益。"
 AI_DISPOSITION_COVETS_DESC: "该[country_disposition|e]意味着他们将你的领土视为诱人目标，时机成熟时可能会征服或降服你。"
 AI_DISPOSITION_RIVALS_DESC: "该[country_disposition|e]意味着他们将你视作竞争对手，会尽可能阻挠你的利益，包括扶持你的敌人。"
 AI_DISPOSITION_INDIFFERENT_DESC: "该[country_disposition|e]意味着他们当前对你并无强烈好恶。"
