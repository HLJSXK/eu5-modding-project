 AI_DISPOSITION_ALARMED: "受到威胁"
 AI_DISPOSITION_WARY: "警惕"
 AI_DISPOSITION_PLANNING_WAR: "摩拳擦掌"
 AI_DISPOSITION_COVETS: "觊觎领土"
 AI_DISPOSITION_DOMINEERING: "渴望支配"
 AI_DISPOSITION_RIVALS: "宿敌"
 AI_DISPOSITION_INDIFFERENT: "冷漠"
 AI_DISPOSITION_FRIENDLY: "友善"
 AI_DISPOSITION_SELF: "你的国家"
 # AI disposition descriptions (tooltip body for each disposition)
 AI_DISPOSITION_ALARMED_DESC: "该[country_disposition|e]意味着他们视你为生存威胁，可能会寻求建立防御性同盟或对你采取先发制人的行动。"
 AI_DISPOSITION_WARY_DESC: "该[country_disposition|e]意味着他们对你保持谨慎，不愿作出让步，也不会放松警惕。"
 AI_DISPOSITION_PLANNING_WAR_DESC: "该[country_disposition|e]意味着他们持有有效领土宣称或不满诉求，并正准备以武力主张权益。"
 AI_DISPOSITION_COVETS_DESC: "该[country_disposition|e]意味着他们将你的领土视为诱人目标，时机成熟时可能会征服或降服你。"
 AI_DISPOSITION_DOMINEERING_DESC: "该[country_disposition|e]意味着他们在实力上远超于你，并企图通过征服或附庸将你纳入其掌控之下，尽管他们并不觊觎你的任何特定省份。"
 AI_DISPOSITION_RIVALS_DESC: "该[country_disposition|e]意味着他们将你视作竞争对手，会尽可能阻挠你的利益，包括扶持你的敌人。"
 AI_DISPOSITION_INDIFFERENT_DESC: "该[country_disposition|e]意味着他们当前对你并无强烈好恶。"
 AI_DISPOSITION_FRIENDLY_DESC: "该[country_disposition|e]意味着他们视你为朋友，无论是通过常设的防御同盟还是仅仅因为良好的关系，他们都倾向于与你合作。"
