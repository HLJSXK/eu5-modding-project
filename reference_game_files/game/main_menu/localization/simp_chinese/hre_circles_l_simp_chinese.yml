 challenge_circle_leadership: "挑战行政圈领导权"
 challenge_circle_leadership_desc: "我们当前的行政圈领袖已证明自己无法胜任这一职位和责任。我们有机会质疑其权力、破坏其权威，以进一步削弱其控制力，或者直接发起公开挑战。"
 challenge_circle_leadership_act: "挑战当前行政圈领袖的权威。"
 challenge_circle_leadership_effect_text: "[SCOPE.sCountry('actor').GetName]挑战行政圈领导权。"
 challenge_circle_leadership_effect_text_past: "[SCOPE.sCountry('actor').GetName]挑战了行政圈领导权。"
 challenge_circle_leadership_tt: "我们在以下任一情况下赢得挑战：\n•我们行政圈的满意度低于15——公开叛乱\n•我们行政圈的满意度低于30，且我们的威望与他们至少齐平\n•我们的威望超过他们至少25\n\n失败或撤回会花费威望。新上任的领袖在2年内不会受到挑战。"
