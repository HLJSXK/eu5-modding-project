 bribe_imperial_circle_desc: "贿赂一个帝国行政圈的领袖和行政圈内所有成员，使其投票支持我们在帝国议会的提案。行政圈领袖获得满额贿赂，其他所有成员获得该数值的25%。所有成员的投票锁定为支持皇帝的选择，直至当前决议关闭。"
