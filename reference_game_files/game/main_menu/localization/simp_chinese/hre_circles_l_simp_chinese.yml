 demand_circle_loyalty_effect_text_past: "[SCOPE.sCountry('actor').GetName]要求其行政圈效忠。"
 reform_coinage_in_circle: "改革行政圈铸币"
 reform_coinage_in_circle_desc: "帝国已下放区域铸币权。推行货币及其使用的改革，将有助于行政圈内各成员的经济流通，同时也能提升我们在行政圈内的地位。遗憾的是，这将需要我们以自身铸币能力的损耗为代价。"
 reform_coinage_in_circle_act: "改革行政圈内铸币。"
 reform_coinage_in_circle_tt: "我们会获得[ShowModifier('reformed_circle_coinage_leader')]，行政圈内所有成员会获得[ShowModifier('reformed_circle_coinage_member')]，持续5年。所有行政圈成员对我们的[opinion|e]会提高[ShowBiasValue('opinion_reformed_circle_coinage')|+=2]，行政圈满意度提高5。"
 reform_coinage_in_circle_effect_text: "[SCOPE.sCountry('actor').GetName]改革行政圈的铸币。"
 reform_coinage_in_circle_text_past: "[SCOPE.sCountry('actor').GetName]改革了行政圈的铸币。"
 reduction_of_circle_titles: "精简行政圈头衔"
 reduction_of_circle_titles_desc: "我们的行政圈效率日渐低下，因头衔和行政职位相互掣肘而纠缠不清。精简头衔不仅能确保行政圈的运作效率，还能巩固我们的领袖地位。但这种头衔的集中化不会受到行政圈成员的欢迎，将导致他们满意度降低。"
 reduction_of_circle_titles_act: "执行精简行政圈头衔"
 reduction_of_circle_titles_tt: "我们会获得[ShowModifier('reduction_of_circle_titles')]，所有行政圈成员对我们的[opinion|e]会[ShowBiasValue('opinion_reduction_of_circle_titles')|+=2]。行政圈满意度会降低5。"
