 distribute_imperial_grant_desc: "从你的国库向行政圈成员分发金钱，提高关系和行政圈满意度。"
 distribute_imperial_grant_act: "向你的行政圈成员分发金钱。"
 distribute_imperial_grant_tt: "我们花费[SCOPE.GetValue('total_grant')|2V]@gold!（[economical_base|e]的20%）在[imperial_circle|e]所有非领袖成员间平均分发。所有接收者获得[ShowModifier('received_imperial_circle_grant')]，持续2年，对我们的[opinion|e]提高[ShowBiasValue('opinion_received_imperial_grant')|+=2]。"
