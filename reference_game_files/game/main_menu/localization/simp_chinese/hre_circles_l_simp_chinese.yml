 demand_circle_loyalty: "要求行政圈效忠"
 demand_circle_loyalty_desc: "确立我们对行政圈成员的权威。我们获得威望和外交地位，持续3年，但成员对这种强加要求感到不满，行政圈满意度降低。"
 demand_circle_loyalty_act: "确立你对行政圈成员的权威。"
 demand_circle_loyalty_tt: "我们获得[ShowModifier('imposed_circle_authority')]，持续3年。我们[imperial_circle|e]的所有非领袖成员获得[ShowModifier('pressured_circle_loyalty')]，持续3年，对我们的[opinion|e]改变[ShowBiasValue('opinion_demanded_loyalty')|+=2]。行政圈的满意度降低5。"
