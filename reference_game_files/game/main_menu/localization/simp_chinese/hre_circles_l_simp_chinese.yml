 IMPERIAL_CIRCLES_EVENTS_FLAVOR: "帝国行政圈"
 imperial_circles.1.title: "帝国行政圈组建完成"
 imperial_circles.1.desc: "帝国行政圈的形成期已经结束，帝国行政圈逐步固化成型。各行政圈领袖将肩负起治理帝国事务的重任，而神圣罗马帝国也由此迎来了崭新的篇章。"
 imperial_circles.1.a: "为了帝国的荣耀！"
 imperial_circles.2.title: "缺少资金"
 imperial_circles.2.desc: "在最近的帝国议会中，我们的行政圈支持了拟议中的帝国宪法改革。这一支持基于我圈成员间的共识，即作为行政圈领袖的我们会在他们之间分配资金。无论这种期望是否合理，我们未能按这些期望行事，已经引发了一些关于我们滥用权力、扣留本应分配给圈层成员的资金的不满。如果我们不对这些不满采取行动，这可能会在未来严重损害我们的领导地位。"
 imperial_circles.2.a: "他们说得对，我们现在就应该分配。"
 imperial_circles.2.b: "他们搞错了，根本不存在这样的贿赂。"
 imperial_circles.2.c: "向我们在[GetUniqueInternationalOrganization('hre').GetLeaderCountry.GetNameWithNoTooltip]的朋友发出呼吁。"
 imperial_circles.11.title: "行政圈内部不满"
 imperial_circles.11.desc: "我们行政圈内的各成员正日益显得焦躁不安。若不尽快采取行动，作为行政圈领导者，我们的权威恐怕将面临公然的挑战。"
 imperial_circles.11.a: "拨付应急资金以缓解紧张局势。"
 imperial_circles.11.b: "让他们抱怨去吧——我们有更要紧的事。"
 imperial_circles.12.title: "诸侯要求变革"
 imperial_circles.12.desc: "行政圈内部的积怨已经累积到了临界点。成员正在公开质疑我们的领导权。一场选举可能即将拉开帷幕。"
 imperial_circles.12.a: "我们必须在为时已晚之前采取行动。"
 imperial_circles.20.title: "我们的选票被收买了"
 imperial_circles.20.desc: "[SCOPE.sCountry('actor').GetName]已向我们帝国行政圈的领袖[SCOPE.sCountry('target').GetName]行贿，以支持当前提交至帝国议会的提案。我们分得[SCOPE.GetValue('received_bribe')|0V]@gold!，且当前决议中的[vote|e]已被锁定为皇帝的选择，直至该决议关闭。"
 imperial_circles.20.a: "黄金总有人想要。"
 imperial_circles.50.title: "挑战行政圈领袖地位"
 imperial_circles.50.desc: "我国已挺身而出向[recipient.GetName]发起挑战，争夺帝国行政圈的领袖之位。\n\n他们的软弱和疏忽已不能再被容忍，且必定有许多人会在我们的控诉背后支持我们。如果我们能成功将自己展现为明显更优秀、更强大的领导者，他们就会服从于我们的要求；但若失败，无疑会损害我们在外国及本国人民眼中的形象。"
 imperial_circles.50.a: "发起挑战。"
 imperial_circles.50.b: "撤回挑战。"
 imperial_circles.53.title: "挑战受挫"
 imperial_circles.53.desc: "我们向[recipient.GetName]发起的帝国行政圈领袖挑战已经失败。由于我方威望未能超过对方，这次尝试反而损害了我们自己的地位。在再次提出这一事项之前，我们必须等待更为成熟的时机。"
 imperial_circles.53.a: "我们将耐心等待时机。"
 imperial_circles.51.title: "行政圈领袖地位被夺走"
 imperial_circles.51.desc: "一位竞争者成功挑战了我们的领导地位。我们已被剥夺行政圈领袖头衔，当务之急是在行政圈内部重建声望。"
 imperial_circles.51.a: "这份屈辱不会被遗忘。"
 imperial_circles.52.title: "行政圈领袖地位得到巩固"
 imperial_circles.52.desc: "尽管有挑战者试图动摇我们的领袖地位，但其声望与影响力尚未构成真正威胁。我们作为行政圈领袖的地位依然稳如磐石。"
 imperial_circles.52.a: "我们的权威没那么容易动摇。"
 imperial_circles.70.title: "当选为行政圈领袖"
 imperial_circles.70.desc: "由于前任领袖已不再具备行政圈成员的资格，行政圈已推举我们担任新的领导者。如今，我们是行政圈的领袖了。"
 imperial_circles.70.a: "我们将以卓越才能领导行政圈。"
 imperial_circles.71.title: "行政圈缺乏领袖"
 imperial_circles.71.desc: "某个帝国行政圈至今未能产生合格的候选者来担任领袖。若该行政圈长期无人治理，皇帝的权威必将受到削弱。"
 imperial_circles.71.a: "我们必须亲自任命一个人选。"
 imperial_circles.80.title: "皇冠改变了一切"
 imperial_circles.80.desc: "如今，我们已加冕为帝国的皇帝。身为帝国的领导者，我们无法同时兼任行政圈领袖——这两项职责皆需投入全部心力来治理。为此，我们应该卸下行政圈领袖之位，让其他诸侯承继此任。"
 imperial_circles.80.a: "帝国事务必须优先。"
