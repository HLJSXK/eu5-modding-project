l_simp_chinese:
 flavor_cas.152.title: "举国统一税制"
 flavor_cas.152.entry: "$flavor_cas.152.title$"
 flavor_cas.152.desc: "我们对摩尔人的战争使国库承受了沉重的负担，[ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] 被迫寻求新的收入来源以资助这场战争。王国各城镇已同意授予我们一项销售税，但此提议使我们的许多顾问认为，这或许不应仅是临时之策，而应成为一项制度化的永久收入来源。"
 flavor_cas.152.a: "我们不能依赖临时的赠予。"
 flavor_cas.152.b: "我们不会滥用他们的慷慨。"
 flavor_cas.152.historical_info: "在阿方索十一世统治期间，卡斯蒂利亚因对格拉纳达的战事而面临财政困难。为资助围攻并征服阿尔赫西拉斯，卡斯蒂利亚各城市授予国王#italic阿尔卡瓦拉税#!，即对商业交易征收的一种销售税。此税原本只是经由科尔特斯会议批准、由各城镇提供的一项非常时期的战时献金，但很快便成为卡斯蒂利亚王室最重要的收入来源之一。此后的历代君主不断扩展并将此税制度化，使其转变为一项永久性征税，在此后数百年间为王室提供了相当大一部分的收入。"
