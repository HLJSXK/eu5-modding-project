 spa_council_of_crusade_decision.desc: "捍卫我们的信仰，即便远在异邦海岸，也必须获得最高权威的祝福。获得 [pope] 的许可下，我们将成为 [ShowReligionAdjective('catholic')] 信仰的第一座堡垒！"
 spa_council_of_crusade_decision.a: "请求教皇批准。"
