 spa_seize_control_of_the_orders.title: "夺取修会领地"
 spa_seize_control_of_the_orders.desc: "[ShowRegionName('iberia_region')]的宗教修会在击退穆斯林威胁、重建我们在半岛的统治中发挥了至关重要的作用。然而，如今我们的#italic收复失地运动#!已然完成，我们必须将这些修会纳入政府的直接管辖，引导它们从武士与骑士转变为未来的政务官与行政人员。"
 spa_seize_control_of_the_orders.a: "夺取他们所有的领地！"
 spa_seize_control_of_the_orders.b: "让他们保留大部分领地。"
