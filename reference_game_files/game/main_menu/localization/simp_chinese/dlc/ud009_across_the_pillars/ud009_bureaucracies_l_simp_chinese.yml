l_simp_chinese:
 dar_al_tiraz_bureaucracy: "缇拉兹坊（Dār al-Ṭirāz）"
 dar_al_tiraz_bureaucracy_desc: "源自波斯的华丽刺绣服饰，长久以来在伊斯兰世界中被用作君主赐予宠臣的荣誉长袍。若能设立一间资金充裕的皇家 #italic $dar_al_tiraz_bureaucracy$#! 作坊，织造丝绸、织锦与刺绣，便可令宫廷衣着华美，并将珍贵织物运销至各地市场。"
 diwan_al_mustakhlas_bureaucracy: "私产院（Dīwān al-Mustaḵlaṣ）"
 diwan_al_mustakhlas_bureaucracy_desc: "#italic$diwan_al_mustakhlas_bureaucracy$#!掌管苏丹私有的领地、磨坊与岁入，这些产业独立于国库之外，专供宫廷与$alhambra$之用。若管理勤勉，可使王室富足，无需仰赖领地以外的收入；然而一旦监督松懈，掌管此产的官员便会趁机中饱私囊，将财富据为己有。"
 diwan_al_qawafil_bureaucracy: "商队院（Dīwān al-Qawāfil）"
 diwan_al_qawafil_bureaucracy_desc: "#italic$diwan_al_qawafil_bureaucracy$#!掌管横贯撒哈拉的商路，途经西吉尔马萨的商道，黄金与奴隶北运，盐与布匹南下。若此机构治理得当，便可庇护商旅与驮兽，使穿越沙漠的财富日益增长；反之，商队将沦为劫匪的猎物，沙漠中的部族也会因不再受官府庇护而心生敌意。"
 ghuzat_mujahidin_bureaucracy: "圣战志愿军（Al-Ḡuzāt al-Mujāhidīn）"
 ghuzat_mujahidin_bureaucracy_desc: "#italic$ghuzat_mujahidin_bureaucracy$#!乃虔信之志愿者，是北非骑兵，他们跨越海峡，在自己的$rank_county_arabic_ruler_male$率领下于边境发动圣战。这些热忱的战士怀着虔诚而战，其信仰亦激励我方子民追随其热忱。"
 makhzan_bureaucracy: "马赫赞（Al-Maḵzan）"
 makhzan_bureaucracy_desc: "#italic$makhzan_bureaucracy$#!乃苏丹权威的中枢机构，其税吏与总督将王权延伸至四方。若#italic马赫赞#!强盛，便可加强王室对边远部族与城镇的掌控；然而一旦其行政力量衰弱，国家便真正沦为#italic反叛之地（bilād as-sība）#!，即异议横行之地，边远行省亦将滑向叛乱与自治。"
 marinid_madaris_bureaucracy: "经院庇护（Ri'āyat al-Madāris）"
 marinid_madaris_bureaucracy_desc: "#italic $marinid_madaris_bureaucracy$#! 乃王室对经学院的庇护，这些学院培养国家赖以维系的法学家、书吏与官员。若能慷慨资助，便可使朝堂中充满学识渊博而忠诚的臣仆，并巩固经院正统教法的地位。"
 qadi_al_jamaa_bureaucracy: "大法官（Qāḍī al-Jamā'a）"
 qadi_al_jamaa_bureaucracy_desc: "#italic$qadi_al_jamaa_bureaucracy$#!乃社群之首席法官，统辖$maliki_school$法庭，并任命全境各地的众多卡迪（qāḍī）。若司法体系受人敬重，便能依众所公认之法裁决纠纷，为王权增添公正之名，使民众更加倾心于正式的法学体系。"
 wulat_al_thughur_bureaucracy: "边关总督（Wulāt al-Ṯuḡūr）"
 wulat_al_thughur_bureaucracy_desc: "#italic$wulat_al_thughur_bureaucracy$#!乃边境要塞的守护者。他们驻守边城堡垒，把守关隘，并维系与基督教强国之间的休战与纳贡，以遏制其势。若边境防务得当，守军林立，谨慎的外交手腕便可为王国争取时间；但若疏于戍边，则会助长邻国的野心，令其嗅出我方的软弱，进而变本加厉地提出领土要求。"
 # Diwan al-Gharb
 diwan_al_gharb_bureaucracy: "西部大臣府"
 diwan_al_gharb_bureaucracy_desc: "#italic $diwan_al_gharb_bureaucracy$#!——西部大臣府——是我们在安达卢斯诸省设立的行政机构，用以治理那些既能说阿拉伯化罗曼语又能说阿拉伯语，且教区教堂数目仍多于清真寺的民众。其书吏征收苏丹的赋税，为混合法庭任命卡迪，并推行使征服转化为行省的同化政策。治理有方的大臣府能将这片西方土地紧系于我们的律法之下；一旦荒废，边疆便会落入任何能以武力自立的部族之手。"
 # Mozabite Bureaucracy
 mozabite_azzaba_bureaucracy: "阿扎巴议事会"
 mozabite_azzaba_bureaucracy_desc: "#italic ʿAzzāba #! 是伊巴迪学者的秘密议事会，构成了姆扎卜河谷伊巴迪社群真正的治理支柱，负责裁决教法、仲裁纠纷，并执行那套历经数百年外部压力仍得以保存伊巴迪身份的严格道德规范。我们将此议事会奉为我族公共生活的最高裁断者，供养其学者，并将其裁决尊为神圣律法之体现。资助充足的阿扎巴能赢得信众的敬服，将伊巴迪教法的影响力延伸至每一户人家；若资源匮乏，其权威便会分崩离析，异端思潮亦将乘虚而入。"
 # Pre-Formation Iberian Bureaucracies
 nav_diputacion_navarra_bureaucracy: "纳瓦拉省议会"
 nav_diputacion_navarra_bureaucracy_desc: "$nav_diputacion_navarra_bureaucracy$ 在科尔特斯会议休会期间管理纳瓦拉的宪制事务，监督 #italic 捐献金 #! 的征收，并确保严格遵守界定纳瓦拉自治权的 #italic 特权法 #!。其成员来自王国的三个等级，使贵族、教士与城镇在王国治理中拥有常设的机构代表。资金充足的议事会是特权法得以遵守的保障；若资源不足，它便无力抵御强大君主国不可避免地向其较小领地施加的中央集权压力。"
 por_desembargo_do_paco_bureaucracy: "王宫上诉院"
 por_desembargo_do_paco_bureaucracy_desc: "$por_desembargo_do_paco_bureaucracy$ 是葡萄牙的最高王室议事会，负责审议立法、颁布赦令，并监督司法任命，使王权得以延伸至王国的每一个角落。与仅受大学法学训练、供职于普通法庭的律师不同，王宫上诉院所用之人兼具法律专才与王室信任，将专业法理与对君主的直接效力融为一体。运作良好的王宫上诉院能加快行政运转的节奏，确保王室决议得以精确地依法施行。"
 por_mesa_da_consciencia_e_ordens_bureaucracy: "良心与骑士团议会"
 por_mesa_da_consciencia_e_ordens_bureaucracy_desc: "$por_mesa_da_consciencia_e_ordens_bureaucracy$ 的设立旨在管理葡萄牙的各骑士团——基督骑士团、圣地亚哥骑士团与阿维斯骑士团——其领地、岁入及宗教权威均由王室以大团长之名管辖。该法庭审理宗教豁免的申请，管理骑士团领地在王室宾客间的分配，并裁定教会法与王室恩庇之间的界限。此机构的建立，使各骑士团由自主的教会法人团体转变为紧密服从王室宗教方略的工具。"
 # Spanish Councils - Regional
 spa_council_of_aragon_bureaucracy: "阿拉贡议事会"
 spa_council_of_aragon_bureaucracy_desc: "[ShowRegionName('iberia_region')]境内，[ShowScriptedGeographyName('aragon_geography')]东部诸地，当由#italic$spa_council_of_aragon_bureaucracy$#!治理。此机构主要负责维系我方与地中海贸易的联系，并兼顾当地特权法的诉求。"
 spa_council_of_castile_bureaucracy: "Consejo de Castilla"
 spa_council_of_castile_bureaucracy_desc: "#italic$spa_council_of_castile_bureaucracy$#!负责管理[ShowScriptedGeographyName('castile_geography')]诸地，代我方治理这片广袤领土及其人民。"
 spa_council_of_flanders_bureaucracy: "佛兰德斯议事会"
 spa_council_of_flanders_bureaucracy_desc: "由于要治理远离我们传统领地的土地，#italic $spa_council_of_flanders_bureaucracy$ #! 必须牢牢掌控 [ShowScriptedGeographyName('spanish_netherlands_geography')] ，以维持该地区的秩序与生产力。"
 spa_council_of_italy_bureaucracy: "意大利议会"
 spa_council_of_italy_bureaucracy_desc: "随着我们在 [ShowRegionName('italy_region')] 的势力日益扩张，应当设立一个专门委员会来管理我们的新征服之地。治理这些土地，对我们而言将是一种与治理 [ShowRegionName('iberia_region')] 境内领土截然不同的挑战。"
 spa_council_of_portugal_bureaucracy: "Conselho de Portugal"
 spa_council_of_portugal_bureaucracy_desc: "随着我们领土的不断扩张，应当为我们在 [ShowScriptedGeographyName('portugal_geography')] 的属地设立一个专门委员会。该机构将主要负责管理我们的大西洋贸易与海事事务。"
 spa_viceroy_bureaucracy: "副王事务局"
 spa_viceroy_bureaucracy_desc: "$spa_council_of_indies_bureaucracy_desc$"
 # Spanish Councils - Statewide
 spa_council_of_crusade_bureaucracy: "十字军委员会"
 spa_council_of_crusade_bureaucracy_desc: "依照[GetUniqueInternationalOrganization('catholic_church').GetName]与[pope]之意设立，#italic“$spa_council_of_crusade_bureaucracy$”#!将指引我们的扩张，并致力于将[ShowReligionAdjective('catholic')]信仰之光带往世界的每一个角落。"
 spa_council_of_finance_bureaucracy: "财政委员会"
 spa_council_of_finance_bureaucracy_desc: "为取代此前的会计院与总会计院两个机构，#italic“$spa_council_of_finance_bureaucracy$”#!将消除两机构间的摩擦，建立统一的机关来处理国家财政事务。"
 spa_council_of_indies_bureaucracy: "印度委员会"
 spa_council_of_indies_bureaucracy_desc: "凡海外之地，皆归 #italic $spa_council_of_indies_bureaucracy$ #! 管辖。该机构将管理由殖民地流向我国本土及海外属民的一切贸易，确保财富源源不断地流入我们的国库。我们新近获得的属民之生计与规章，以及供殖民开发的土地分配，同样由此委员会掌管。"
 spa_council_of_inquisition_bureaucracy: "最高宗教裁判所委员会"
 spa_council_of_inquisition_bureaucracy_desc: "#italic“$spa_council_of_inquisition_bureaucracy$”#!由数名宗座异端裁判官组成，并由总异端裁判官统领，负责监督我国的宗教正统性与法庭事务。该机构将在教会与世俗事务中充当最高上诉法庭。"
 spa_council_of_military_orders_bureaucracy: "Consejo de las Órdenes"
 spa_council_of_military_orders_bureaucracy_desc: "负责管理其原有领地，#italic“$spa_council_of_military_orders_bureaucracy$”#!将在我方军事目的的土地授予中发挥重要作用，扩大我军的征募人力，并确保有能力的军官得到教育与招募，加入我们的军队。"
 spa_council_of_state_bureaucracy: "国务会议"
 spa_council_of_state_bureaucracy_desc: "#italic“$spa_council_of_state_bureaucracy$”#!由我方君主亲自领导，协助君主处理外交事务，不受外来势力的干涉。该会议由通晓外交与国际关系的贵族及教士精英组成，将负责管理我国驻外使馆，并为我方在复杂国际事务中的应对提供建议。"
 dawa_bureaucracy: "宣教大臣府"
 dawa_bureaucracy_desc: "#italic$dawa_bureaucracy$#!是苏丹用以治理海外信仰事务的机构，向那些统治已超越清真寺所及之地的遥远行省派遣卡迪与传教士。其#italic宣教士#!将伊斯兰的召唤传至彼岸诸民，其书吏则将新殖民地纳入乌玛律法的约束之中。若维持得当，它能使远方的征服化为安定的行省，令王权治下的信众日益壮大；一旦荒废，远方的信众便会逐渐脱离苏丹的掌控，而在无人俸禄供养之处，召唤之声也终将沉寂。"
