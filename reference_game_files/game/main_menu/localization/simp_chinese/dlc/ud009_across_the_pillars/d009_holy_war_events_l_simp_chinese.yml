l_simp_chinese:
 holy_war.11.title: "Raiders on the Frontier"
 holy_war.11.desc: "A #italic cabalgada#! out of [cabalgada_raider.GetName] has swept across our borderlands, burning villages and carrying off all they could before slipping back over the frontier. Our undefended lands lie plundered. Do we call up the levies to guard the marches, or let the outrage pass?"
 holy_war.11.a: "Rally the levies to the frontier!"
 holy_war.11.b: "We can do nothing but endure it."

 holy_war.12.title: "A Demand for Tribute"
 holy_war.12.desc: "Envoys from [parias_demander.GetName] arrive at our court with a stark message: a [crusade|e] is being raised against us, and unless we pay tribute, its armies will march on our lands. Our advisors warn that our gold will only buy time, dampening their bloodlust but never quenching it. Do we pay to postpone the reckoning, or defy them and prepare for the storm?"
 holy_war.12.a: "Pay the tribute and buy us time."
 holy_war.12.a.tt: "Delays the [crusade|e], setting its preparation back by #G 30#! and lowering its religious zeal by #G 10#!"
 holy_war.12.b: "We will not be cowed. Let them come."
 holy_war.12.b.tt: "Raises the [crusade|e]'s religious zeal by #R 10#!"

 holy_war.15.title: "Raiders from the South"
 holy_war.15.desc: "A #italic ḡazw#! out of [ghazw_raider.GetName] has swept across our borderlands, burning villages and carrying off all they could before slipping back over the frontier. Our undefended lands lie plundered. Do we call up the levies to guard the marches, or let the outrage pass?"
 holy_war.15.a: "Rally the levies to the frontier!"
 holy_war.15.b: "We can do nothing but endure it."

 holy_war.16.title: "Raiders from the Sea"
 holy_war.16.desc: "Corsairs out of [shore_raider.GetName] have fallen upon our coast, sacking the harbors and dragging our people off in chains before their sails slipped over the horizon. Our undefended shores lie plundered. Do we call up the levies to guard the coast, or let the outrage pass?"
 holy_war.16.a: "Rally the levies to the coast!"
 holy_war.16.b: "We can do nothing but endure it."
