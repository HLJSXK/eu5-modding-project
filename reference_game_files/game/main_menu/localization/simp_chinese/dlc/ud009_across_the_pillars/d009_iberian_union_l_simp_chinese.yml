 iberian_union_succession: "伊比利亚联合继承"
 iberian_union_succession_desc: "这是[ShowRegionName('iberia_region')]的基督教君主国之间因[ShowRelationTypeName('iberian_wedding_pact')]而采用的一种[heir_selection|e]。若某位统治者去世时没有自己的正统继承人，另一位统治者将继承其王位，从而将两顶王冠结合为一个[union|e]。"
 iberian_union_succession_tt: "缔结 [union|e]，以防我们的继任者并非前任统治者的继承人"
 iu_dynastic_primacy_seniority_tt: "当此[union|e]缔结时，[economical_base|e]最高的成员将被指定为[ShowSpecialStatusName('senior_partner')]，并为整个联盟施行[ShowPolicyName('union_establish_seniority_policy')]与[ShowPolicyName('union_senior_succession_law')]"
 iu_tanto_monta_no_seniority_tt: "不会以此方式指定 [ShowSpecialStatusName('senior_partner')]，[ShowPolicyName('union_establish_seniority_policy')] 与 [ShowPolicyName('union_senior_succession_law')] 亦不会在该 [union|e] 中施行"
