 cancel_iberian_wedding_pact_desc: "我们两国的王位将不再共享继承权，也可能因此无法结成一个 [union|e]。"
 cancel_iberian_wedding_pact_cta_to_unknown: "终止与某个[country|e]的$diplomatic_status_iberian_wedding_pact_name$"
 cancel_iberian_wedding_pact_desc_to_unknown: "$cancel_iberian_wedding_pact_desc$"
