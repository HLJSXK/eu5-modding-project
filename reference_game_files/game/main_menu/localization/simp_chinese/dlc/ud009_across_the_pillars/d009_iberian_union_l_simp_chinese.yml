 offer_iberian_wedding_pact_happened_desc: "[SCOPE.sCountry('recipient').GetName]现已通过$diplomatic_status_iberian_wedding_pact_name$与我们绑定。若我方或其君主中有一方无嗣而终，另一方将继承双方的王位，使两国王冠结成[union|e]。"
 offer_iberian_wedding_pact_proposal_question: "Propose the $diplomatic_status_iberian_wedding_pact_name$ with [COUNTRY.GetName]?\n$INFO$"
