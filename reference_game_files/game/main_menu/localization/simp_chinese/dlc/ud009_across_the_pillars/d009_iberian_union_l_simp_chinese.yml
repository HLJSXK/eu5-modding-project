l_simp_chinese:
 catholic_monarchs_law: "天主教双王"
 catholic_monarchs_law_desc: "缔结我等王冠的婚姻乃是此后一切的根基。王室伉俪选择以何种方式共治——平等并立，或以一方为尊——都将决定这一联合未来数代人的命运。"
 iu_establish_iberian_wedding_succession_tt: "在两顶王冠之间建立 [ShowRelationTypeName('iberian_wedding_pact')] ，并将其 [heir_selection|e] 设定为 [ShowHeirSelectionName('iberian_union_succession')] ，使双方的继承相互绑定，令共同的继承人得以统一诸国"
 composite_monarchy_law: "Composite Monarchy"
 composite_monarchy_law_desc: "Our realms are joined under one sovereign, yet each keeps its own laws and liberties. We must decide whether to honor the #italic fueros#! of every kingdom or to gather their governance into a single hand."
 asientos_law: "包税契约"
 asientos_law_desc: "The crown grants #italic asientos#!, exclusive contracts to supply and provision our overseas dominions, and whoever holds them reaps the wealth of empire. The union must decide whether the crown awards these contracts to itself, or shares them among the merchants of all its realms."
 religious_authority_law: "Religious Authority"
 religious_authority_law_desc: "我等合一的王冠必须决定如何行使信仰之权柄。王室既可透过 #italic 王室监护权 #! 掌管境内教会，亦可将此热忱转而向外，化为基督教世界的利剑与盾牌。"
 legislative_authority_law: "立法权"
 legislative_authority_law_desc: "诸国当由谁的意志治理？法律或可源自王室之手，以具约束力的 #italic pragmáticas #! 颁行，亦可依托各王国自身 #italic Cortes #! 之同意。"
 crown_settlement_law: "王冠之定制"
 crown_settlement_law_desc: "联合的最终形态必须予以确定。或以一法一币，将诸多王国锻铸为一个统一的君主国；或使各王冠作为平等的伙伴长久并存。"
 union_of_arms_law: "军备联合"
 union_of_arms_law_desc: "维护联合的安全，乃是其中每一邦国的职责。无论是依强制配额，还是凭自愿之力，诸王国都当共同承担武备之重任。"
 iu_tanto_monta_policy: "并肩齐王"
 iu_tanto_monta_policy_desc: "#italic Tanto monta, monta tanto#!——两位君主平等共治，彼此并无高下之分。这一地位对等的联合，以互敬之心与共同的王朝立场将诸国维系一体。"
 iu_dynastic_primacy_policy: "王朝首位"
 iu_dynastic_primacy_policy_desc: "共主之中，一顶王冠被公认为联盟之首，其王朝在诸国间尊崇无比。首领王室享有最高的威望，而所有成员亦共沐一个自信王权的荣光。"
 iu_dynastic_primacy_senior_only_tt: "若我方为 [senior_partner|e]："
 iu_respect_fueros_policy: "尊重特权法"
 iu_respect_fueros_policy_desc: "各王国古老的自由得到确认与保护。较小的诸国得以安然自治，而宗主王冠亦因恪守诸国传统而赢得应有的敬重。"
 iu_centralized_administration_policy: "中央集权行政"
 iu_centralized_administration_policy_desc: "诸国的治理被归并于统一的行政之下。宗主王冠借此扩展其权柄，而较小的诸国亦从统一国家的秩序中获得正统性。"
 iu_crown_asientos_policy: "王室包税契约"
 iu_crown_asientos_policy_desc: "王室亲自授予供应契约，将贸易与其金银集中于宗主王国。较小的诸王国则借供应领地之机获利，其产业因需求而兴盛。"
 iu_shared_asientos_policy: "共享包税契约"
 iu_shared_asientos_policy_desc: "契约分派于各国商人之间。较小的诸王国得以直接涉足利润丰厚的供应贸易，而宗主王冠亦借共享网络流通的廉价货物而受益。"
 iu_patronato_real_policy: "Patronato Real"
 iu_patronato_real_policy_desc: "依#italic王室教务保护权#!，王室掌管我方诸国境内的教会，任命其教长并汲取其岁入。由王座管理的信仰，便是与王座紧密相系的信仰。"
 iu_catholic_champion_policy: "信仰的捍卫者"
 iu_catholic_champion_policy_desc: "Our united crowns take up the banner of Christendom, championing the faith against unbeliever and heretic alike. Let our realms be known as the sword and shield of the Church."
 iu_pragmaticas_policy: "王室诏令"
 iu_pragmaticas_policy_desc: "法律当源于王室之意志。凭借具有约束力的诏令—— #italic 敕令 #! ——君主可同时为治下每一个国度立法，无需等待任何议会的准许。"
 iu_regional_cortes_policy: "地方议会"
 iu_regional_cortes_policy_desc: "各国依其自身 #italic 议会 #! 之同意而治。由旧有议会施行统治，可为每一顶王冠赋予正统性，并以自愿的忠诚维系联盟。"
 iu_una_ley_una_moneda_policy: "一法一币"
 iu_una_ley_una_moneda_policy_desc: "One law and one coin for all our realms. Unifying the crowns this way dilutes the old borders, strengthening the ties of the many kingdoms into a single, unified monarchy."
 iu_perpetual_crown_policy: "永久联合王冠"
 iu_perpetual_crown_policy_desc: "此联盟被封定为诸王冠间永久的契约。稳固而长久的结盟，可为每一国度带来正统性与安定，成员之间的纽带也将成为联盟中最为牢固的。"
 iu_proportional_levy_policy: "按比例征兵"
 iu_proportional_levy_policy_desc: "各国按其份额出兵，组成联合大军。联盟可借此募集一支规模更大、素质更精的军队，而宗主王冠则统率汇集于其麾下的各路军队。"
 iu_negotiated_contribution_policy: "协商分摊"
 iu_negotiated_contribution_policy_desc: "诸国凭相互协议、而非强制命令来分担共同防务。负担因出于自愿而显得更轻，承担此责亦能培养军中的纪律与成员间的和睦。"
 proclaim_spanish_monarchy: "宣布建立西班牙君主国"
 proclaim_spanish_monarchy_desc: "宣布我们联盟治下的诸多王冠，合而为一，成为统一的君主国，并冠以西班牙之名与尊号。"
 proclaim_spanish_monarchy_integration_tt: "我们的联盟必须已达到至少5级的整合度"
 diplomatic_status_iberian_wedding_pact_name: "伊比利亚联姻协定"
 iberian_wedding_pact_relation: "$diplomatic_status_iberian_wedding_pact_name$"
 iberian_wedding_pact_effect_text: "[SCOPE.sCountry('actor').GetName] 与 [SCOPE.sCountry('recipient').GetName] 缔结了伊比利亚联姻契约，将两国王位的继承绑定在一起。"
 iberian_wedding_pact_effect_text_past: "[SCOPE.sCountry('actor').GetName] 与 [SCOPE.sCountry('recipient').GetName] 缔结了伪比利亚联姻契约，将两国王位的继承绑定在一起。"
 diplomatic_status_iberian_wedding_pact_tooltip: "#T $diplomatic_status_iberian_wedding_pact_name$#!\nThese crowns share an Iberian Wedding Pact. If either ruler dies without an heir of their own, the other inherits the throne of the former, forming a [union|e] between the two countries."
 iberian_wedding_pact_list_who_tt: "$LIST$与$WHO$同处于一个[ShowRelationTypeName('iberian_wedding_pact')]中"
 iberian_wedding_pact_relation_desc: "这两个[countries|e]因$diplomatic_status_iberian_wedding_pact_name$而联系在一起，共享王位继承权，日后或将使两国王冠合并为一个[union|e]。"
 offer_iberian_wedding_pact: "同意$diplomatic_status_iberian_wedding_pact_name$"
 offer_iberian_wedding_pact_CATEGORY: "CATEGORY_FRIENDLY_ACTIONS"
