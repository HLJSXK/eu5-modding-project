 break_iberian_wedding_pact_happened_title: "终止$diplomatic_status_iberian_wedding_pact_name$"
 break_iberian_wedding_pact_happened_desc: "与[SCOPE.sCountry('recipient').GetName]缔结的$diplomatic_status_iberian_wedding_pact_name$已被解除。我们的王冠将不再共享同一继承。"
 break_iberian_wedding_pact_proposal_question: "我们将解除与[TARGET_COUNTRY.GetName]缔结的$diplomatic_status_iberian_wedding_pact_name$。"
 giving_iberian_wedding_pact_trigger: "与该国缔结有伊比利亚联姻盟约"
 diplomatic_status_giving_iberian_wedding_pact_name: "协定伙伴"
 diplomatic_status_giving_iberian_wedding_pact_tooltip: "该国与以下国家缔结有 $diplomatic_status_iberian_wedding_pact_name$ 的条约。"
