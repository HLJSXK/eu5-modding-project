 fate_of_phoenix_actions_price: "$fate_of_the_phoenix$行动花费"
 request_papal_donation: "请求$PAP_ADJ$捐赠"
 request_papal_donation_desc: "由于[actor.GetFlavorRank]捉襟见肘且国库空虚，我们可派遣使者，以[ShowReligionGroupName('christian')]同胞的名义向$PAP$请求援助。此类请求往往伴随代价，但他们的金援或能为我们在危急时刻争取喘息之机。"
 grant_latin_merchants_privileges: "授予[ShowCultureGroupNameWithNoTooltip('italian_group')]商人特权"
 grant_latin_merchants_privileges_desc: "通过向[ShowCultureGroupName('italian_group')]商业共和国授予特惠权益，我方有望重振贸易并获取海上支援。此类让步可促进[actor.GetCapital.GetName]的商贸发展，但也可能加剧[actor.GetCapital.GetRank.GetName]内部的外来势力渗透。"
 grant_latin_merchants_privileges_tooltip: "[ShowRegionName('italy_region')]任意[ShowGovernmentReformName('merchant_republic')][country|e]不是我们的附属国或宿敌"
 accept_catholic_delegation: "接见[ShowReligionAdjectiveWithNoTooltip('catholic')]代表团"
 accept_catholic_delegation_desc: "我们可邀请[GetUniqueInternationalOrganization('catholic_church').GetName]的使节来到[actor.GetCapital.GetName]，他们将带来团结宣言以及对妥协的隐晦期待。多数顾问认为，接待该代表团有助于改善与[ShowReligionAdjective('catholic')]世界的关系，但此举也会引发国内矛盾。"
 attract_italian_engineer: "招揽[ShowCultureGroupNameWithNoTooltip('italian_group')]工程师"
 attract_italian_engineer_desc: "我国可招募声名卓著的[ShowCultureGroupName('italian_group')]工程师，以修缮城防与军事工程。他们的技艺能以现代手段解决传统难题，但却可能导致我们过度依赖西方办法与影响。"
 demand_beylik_tribute: "要求贝伊国进贡"
 demand_beylik_tribute_desc: "随着我国在[ShowRegionName('anatolia_region')]重树权威，可再度迫使周边贝伊国承认[actor.GetAdjective]的霸主地位。当下征收贡赋可削弱潜在对手，并重塑各国对[actor.GetFlavorRank]实力的信心。"
 summon_patriarchate_member: "召唤自主教会成员"
 summon_patriarchate_member_desc: "作为[GetInternationalOrganizationType('autocephalous_patriarchate').GetNameWithNoTooltip]的领袖，我们可以召唤自主教会内其他[ShowReligionAdjective('orthodox')]国家协助我们对抗信仰之敌。这种呼吁依赖我们共同的信仰而非义务，可能会为我们的事业凝聚力量。"
 reform_imperial_armies: "改革[GetCountry('BYZ').GetAdjectiveWithNoTooltip]军队"
 reform_imperial_armies_desc: "[actor.GetFlavorRank]军队经历了数十年的忽视与放任。全面的改革有望重塑纪律和结构，但是这需要稳定、白银和改变根深蒂固习惯的决心。"
 patronize_orthodox_monastery: "赞助$orthodox_monastery$"
 patronize_orthodox_monastery_desc: "通过赞助地方[ShowBuildingTypeName('orthodox_monastery')]，我们展现了虔诚，增进了当地的宗教生活。这种慷慨无疑会提高当地的生活质量，提醒信徒们，[actor.GetLongName]仍然是正信的保护者。"
 reform_armed_forces_tt: "我们将可以改革[army|e]或[navy|e]，消除过去几个世纪的衰退"
 has_not_completed_all_six_reforms_tt: "我们尚未完成所有#Y 6#!项改革"
 patronize_orth_monastery_tt: "所选[location|e]会获得[ShowModifier('patronize_orthodox_monastery_modifier')][modifier|e]，而我们的许多[ShowReligionAdjective('orthodox')][pops|e]将获得[ShowNamedValue('pop_satisfaction_mild_bonus')|+=2%][pop_satisfaction|e]"
