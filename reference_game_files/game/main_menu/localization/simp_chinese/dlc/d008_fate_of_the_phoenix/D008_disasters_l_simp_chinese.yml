l_simp_chinese:
 #Fate of the Phoenix
 fate_of_the_phoenix: "凤凰的命运"
 fate_of_the_phoenix_desc: "近几个世纪以来，我们辉煌的[GetCountry('BYZ').GetFlavorRank]逐渐衰落。无尽的内斗、持续的内部动荡和[ShowSituationName('rise_of_the_ottomans')]给我们和我们的人民带来了厄运，而[GetCountry('SER').GetName]和[GetCountry('BUL').GetName]也不断蚕食着我们北方的疆域。我们必须依仗纯粹的力量和坚韧，在为时已晚之前结束腐败，恢复王权。"
 remember_no_turk_tt: "除我们外，没有其他[capital|e]位于[ShowRegionName('anatolia_region')]的[ShowCultureName('turkish_culture')]或[ShowCultureName('turkoman_culture')]或[ShowGovernmentReformName('anatolian_beylik')][government_reform|e][country|e]拥有超过#Y 100#!个[locations|e]（包括其[subjects|e]）"
 #Fate of the Phoenix Events (to be moved)
 fate_of_the_phoenix.1.title: "凤凰的命运"
 fate_of_the_phoenix.1.desc_a: "曾经，[ShowLocationName('constantinople')]的城墙圈定了世界的中心。法律、信仰和帝国秩序皆由此处传播开来，这确实是承袭自$ROM$的遗产。但现在，这份遗产的重担正压得我们喘不过气。\n\n经年累月的阴谋、徒有其表的胜利与日益衰落的权威，已让[ROOT.GetCountry.GetFlavorRank]在精神上走向衰微，尽管名义上仍在否定。国境之外，新兴势力正以耐心与贪婪伺机而动；国境之内，陈旧的机构因长期的疏忽而腐朽。我们的人民理应得到更好的道路，以配得上我们荣耀祖先的辉煌与富足！"
 fate_of_the_phoenix.1.desc_b: "消息从[ShowLocationName('constantinople')]传来。看来这古老的帝座正陷于困境，权威已在纷争与衰落的重压下逐渐瓦解。数代以来，[target_location.GetRank.GetName]的命运一直影响着[ShowRegionName('balkan_region')][ShowReligionGroupAdjective('christian')]诸国的秩序，通过信仰将我们的历史紧紧相连，使得多数时候，各方的剑拔弩张大多得以收敛。\n\n如今，随着其掌控力减弱，曾经维系我们边境的平衡变得岌岌可危。我们一些有影响力的家族主张谨慎行事，警告称如此支柱一旦倒塌，必将动摇所有信奉同一教义者的根基。另一些人则直言不讳：旧有的保障正在消散，以往靠传统解决的事情，可能很快就只能诉诸于武力。在这不安的时代，我们所选择的道路，其回响将远播于我们自身的[ROOT.GetCountry.GetFlavorRank]之外。"
 fate_of_the_phoenix.1.desc_c: "帝国的衰弱很少会伴随盛大的宣告。接二连三的软弱表现、无力守卫边境以及在[GetCountry('BYZ').GetLongName]丧失的威望，都表明他们的辉煌时代即将走到严酷而突然的终点。所以，西边的局势不再需要我们敬畏或保持谨慎——只需算计。吞食其残躯、并崛起取代其位置的，将是我们。"
 fate_of_the_phoenix.1.a: "希望尚未破灭。"
 fate_of_the_phoenix.1.b: "变革是一位残酷的情人……"
 fop_parameters_a_tt: "这场灾难的结果将决定我们的命运。在这一动荡时期，我们将通过[disaster|e]面板获得独特的[actions|e]选项"
 fop_parameters_b_tt: "如果我们能成功扭转衰退，终结这场[disaster|e]，或许能在史书上激起波澜，宣告我们的人民进入第二个黄金时代"
 fop_paramenters_bul_tur_ser_tt: "当[GetCountry('BYZ').GetLongName]处于[ShowDisasterName('fate_of_the_phoenix')][disaster|e]期间，我们将获得趁其虚弱从中获利的机会"
 fate_of_the_phoenix.2.title: "收复[target_location.GetName]！"
 fate_of_the_phoenix.2.desc: "[ROOT.GetCountry.GetFlavorRank]的旗帜再次飘扬在[target_location.GetName]上空。这座一直以来受到[ShowCultureName('turkish_culture')]军阀、海盗和敌对势力争夺的重要爱琴海港口现在又回到了[ROOT.GetCountry.GetAdjective]手中。这里的海港和市场遭受了重创，但未来无限光明。我们复兴这处新领土的决策将塑造我们在东地中海未来数代人的命运。"
 fate_of_the_phoenix.2.a: "重建港口。"
 fate_of_the_phoenix.2.b: "修复市场和仓库。"
 building_set_to_max_level_tt: "该[building|e]将达到最大等级"
 fate_of_the_phoenix.3.title: "$fate_of_the_phoenix.2.title$"
 fate_of_the_phoenix.3.desc: "1204年那场灾难后皇帝的避难所和帝国法统的延续之地——[target_location.GetName]，现已回归我们的统治。在这里的城墙之上，[ROOT.GetCountry.GetFlavorRank]经受了流亡，捍卫了法律，并维护了其普遍统治的主张。这里的光复不仅仅是领土上的收益。没错，这是对[ROOT.GetCountry.GetFlavorRank]未来道路的设想。"
 fate_of_the_phoenix.3.a: "[ROOT.GetCountry.GetGovernment.GetRulerOrRegent.GetNameWithNoTooltip]将亲自负责！"
 fate_of_the_phoenix.3.b: "这是帝国伟大复兴的标志！"
 fate_of_the_phoenix.3.c: "是时候重建[ShowRegionNameWithNoTooltip('anatolia_region')]的行政机构了！"
 fate_of_the_phoenix.4.title: "$fate_of_the_phoenix.2.title$"
 fate_of_the_phoenix.4.desc: "曾作为[GetCountry('TUR').GetAdjective]势力发源地的[target_location.GetName]，现已被帝国大军攻克。这座[target_location.GetRank.GetName]曾是各贝伊国汲取力量、滋生野心与征收贡赋的根基。此城陷落，足以向整个[ShowRegionName('anatolia_region')]半岛宣告：大势已逆转，我们的[ROOT.GetCountry.GetFlavorRank]已经转守为攻。"
 fate_of_the_phoenix.4.a: "我们已重新主宰[ShowRegionNameWithNoTooltip('anatolia_region')]！"
 unlocks_demand_beylik_tribute_disaster_action_tt: "在该[disaster|e]持续期间解锁[ShowGenericActionName('demand_beylik_tribute')][action|e]"
 fate_of_the_phoenix.5.title: "战胜[loser.GetNameWithNoTooltip]"
 fate_of_the_phoenix.5.desc: "诸贝伊国之间交战引发的日益动荡，最终导致了[loser.GetLongName]的崛起。他们凭借武力与娴熟的外交，开始对我们的[ROOT.GetCountry.GetFlavorRank]的独立构成持续威胁。然而，近期对他们的胜利提醒我们：我们仍是$ROM$的使者，即便身处动荡年代，我们依然如雄狮般战斗。愿此刻成为一个转折点，一个扫清多年衰败的新时代就此开启！"
 fate_of_the_phoenix.5.a: "大势正在逆转！"
 high_legitimacy_grants_extra_benefits_tt: "#Y 30#!年内维持超过#Y 50#![legitimacy|e]将大幅提高我们的[assimilation|e]和[locations|e][integration|e]"
 fate_of_the_phoenix.6.title: "[target_province.GetNameWithNoTooltip]抗拒中央权威"
 fate_of_the_phoenix.6.desc: "[target_province.GetName]在这一动荡时期拒绝服从管理。该省声称，若其自治要求得不到满足，可能会掀起公开叛乱。顾问们建议我们做出让步，但现在妥协将进一步削弱[ROOT.GetCountry.GetFlavorRank]的权威。"
 fate_of_the_phoenix.6.a: "凤凰何须在意麻雀的啜泣。"
 fate_of_the_phoenix.6.b: "或许可以交由[target_character.GetShortNameWithNoTooltip]处理？"
 fate_of_the_phoenix.6.c: "我们应当倾听民众的声音！"
 target_character_goes_to_target_province_to_restore_order_tt: "[target_character.GetName]将前往[target_province.GetName]主持恢复秩序。[target_character.GetSheHe|U]将在未来#Y 2#!年内无法指派其他任务"
 fate_of_the_phoenix.7.title: "[target_country.GetNameWithNoTooltip]的衰弱"
 fate_of_the_phoenix.7.desc: "[target_country.GetName]已显露明显的衰弱迹象，而我们近在咫尺，这是难得的良机。若要执行我方宣称，必须尽快行动，以免[target_character.GetName]恢复秩序与实力。"
 fate_of_the_phoenix.7.a: "时机来临了。"
 fate_of_the_phoenix.7.b: "必须维持力量的平衡！"
 we_may_have_another_chance_soon_tt: "#italic 我们未来还有机会获得这些宣称……#!"
 fate_of_the_phoenix.8.title: "[actor.GetNameWithNoTooltip]的战争"
 fate_of_the_phoenix.8.desc: "[actor.GetName]目前正与他们所宣称的真信仰之敌交战。作为[GetInternationalOrganizationType('autocephalous_patriarchate').GetNameWithNoTooltip]的教会同胞，他们此刻要求我们与他们并肩作战，对抗这一所谓的共同敌人。若我们拒绝，他们便威胁将我们逐出牧首区，这既是严重的精神羞辱，也将给两国关系蒙上长久阴影。"
 fate_of_the_phoenix.8.a: "开战！"
 fate_of_the_phoenix.8.b: "不值得浪费时间。"
 fate_of_the_phoenix.9.title: "[target_army.GetNameWithNoTooltip]出现逃兵"
 fate_of_the_phoenix.9.desc: "[target_army.GetName]的报告令人深感担忧。在[target_character.GetName]的指挥下，军队士气崩溃，逃兵人数不断上升。如此失败对[ROOT.GetCountry.GetFlavorRank]造成了不利影响，助长了我们敌人的气焰。"
 fate_of_the_phoenix.9.a: "懦夫！全都是！"
 target_army_suffers_losses_tt: "[target_army.GetName]遭受了#R [ROOT.GetVariable('visual_strength_loss_variable').GetValue|V2]%#![strength|e]打击"
 fate_of_the_phoenix.10.title: "忠诚的将军"
 fate_of_the_phoenix.10.desc: "几十年来，[target_unit.GetName]的指挥官[target_character.GetName]表现卓越，[target_character.GetSheHe]的忠诚和胜利成为士兵的榜样，在动荡的时代彰显了纪律与决心。"
 fate_of_the_phoenix.10.a: "[target_character.GetShortNameWithNoTooltip]将领导我们走向胜利！"
 major_victories_enhance_stats_tt: "如果[target_character.GetName]赢得重要[battles|e]，[target_character.GetHerHis]的[abilities|e]可能会提高"
 fate_of_the_phoenix.11.title: "[target_character.GetNameWithNoTooltip]实现伟大胜利"
 fate_of_the_phoenix.11.desc: "[target_unit.GetName]在[target_location.GetName]大败[target_losing_country.GetName]的军队。胜利的消息快速传播，重新确立了人们对凤凰不灭的信心。[target_character.GetShortName]正逐渐成为一名传奇。"
 fate_of_the_phoenix.11.a: "真希望[target_character.GetSheHe]能永远带领我们的军队！"
 fate_of_the_phoenix.12.title: "[target_character.GetNameWithNoTooltip]战败"
 fate_of_the_phoenix.12.desc: "凶兆频发，国运晦暗！[target_character.GetName]在[target_location.GetName]对阵[target_character_2.GetName]所率军队时遭遇重创。此战损失惨重，各方敌手必将密切关注我们显露的每一丝颓势。这是否意味着战局开始对我们不利？唯有祈愿天佑，全力争取战事胜利。"
 fate_of_the_phoenix.12.a: "丢人现眼！"
 fate_of_the_phoenix.13.title: "[target_character.GetNameWithNoTooltip]施政"
 fate_of_the_phoenix.13.desc: "我们所处的时期对[ROOT.GetCountry.GetFlavorRank]而言或许至关重要。长期以来，内部分裂、外敌侵扰与权威日渐沦丧始终困扰着国民。通过新一轮内阁革新举措，我们终将拨乱反正，重塑官僚体系纪律，明确治国理政方向。\n\n此类改革需要决心与牺牲，积弊已久，反对之声必不可免。但若能全力以赴，这些举措或将终结[ROOT.GetCountry.GetFlavorRank]长久以来的衰退之势，为复兴奠定根基；若迟疑不决，我们必将陷入更深的分裂与衰亡。"
 fate_of_the_phoenix.13.a: "重迎荣耀，必以牺牲为代价。"
 enable_unlock_spread_philhellenism_and_encourage_latin_militarism_tt: "我们会在[ShowDisasterName('fate_of_the_phoenix')][disaster|e]期间解锁[ShowCabinetActionName('spread_philhellenism')]和[ShowCabinetActionName('encourage_latin_militarism')][cabinet_actions|e]\n\n如果我们成功结束灾难，我们将#Y 永久#!获得这些内阁行动"
 fate_of_the_phoenix.14.title: "凤凰复兴"
 fate_of_the_phoenix.14.desc: "昔日沦陷的疆土已然光复，衰败时代就此终结。[ROOT.GetCountry.GetName]重归正统[ROOT.GetCountry.GetFlavorRank]之位，再度厉兵秣马，直面仇敌！如今，[ShowLocationName('rome')]故都正静待光复。"
 fate_of_the_phoenix.14.a: "在我们治下，绝不会再有空有皮囊的[ROOT.GetCountry.GetGovernment.GetRulerTitle]！"
 maintain_cabinet_actions_tt: "由于我们成功渡过了[disaster|e]，我们将能够继续使用[ShowCabinetActionName('spread_philhellenism')]和[ShowCabinetActionName('encourage_latin_militarism')][cabinet_actions|e]"
 because_we_made_military_reforms_tt: "由于我们通过[ShowGenericActionName('reform_imperial_armies')][action|e]实施了一项或多项军事改革："
 num_of_reforms_desc: "改革数量"
 unlock_allelengyon_bureaucracy_kephalai_bureaucracy_tt: "解锁$allelengyon_bureaucracy$和$kephalai_bureaucracy$[bureaucracies|e]"
 unlock_kritai_katholikoi_reformed_extra_effect: "[ShowModifierTypeName('country_cabinet_efficiency')]修正将永久绑定于[ShowGovernmentReformName('kritai_katholikoi_reformed')][government_reform|e]"
 italian_wars_empowerment_if_latin_tt: "如果我们在即将到来的[GetSituationByKey('italian_wars').GetName][situation|e]中率先攻击[GetUniqueInternationalOrganization('foreign_league_balkan').GetName]，[ShowCultureGroupName('italian_group')][countries|e]将可以更轻松地加入我们的联盟，具体取决于我们的[ShowSocietyDirectionName('latinization')]"
 fate_of_the_phoenix.15.title: "衰败时代仍将继续"
 fate_of_the_phoenix.15.desc: "尽管竭力奋战，新近沦陷的国土仍未能收复。周边贝伊国的崛起，加之[ShowRegionName('balkan_region')]半岛境外强敌环伺，逆转颓势已然无望。漫长的衰败仍在继续，[ROOT.GetCountry.GetFlavorRank]的未来笼罩在迷雾之中。"
 fate_of_the_phoenix.15.a: "我们的未来深陷阴影，前途未卜。"
 no_longer_access_to_the_cabinet_actions_tt: "我们将无法再使用[ShowCabinetActionName('spread_philhellenism')]和[ShowCabinetActionName('encourage_latin_militarism')][cabinet_actions|e]"
 fate_of_the_phoenix.16.title: "[actor.GetNameWithNoTooltip]请求捐赠"
 fate_of_the_phoenix.16.desc: "我们获悉[actor.GetName]正深陷内乱，已走投无路，于是派遣使节前来乞求财政援助。作为回报，他们承诺将向我国开放[actor.GetFlavorRank]的国门，推行我国的制度与风俗。此举前所未有，足见[actor.GetCapital.GetName]局势已危急万分。"
 fate_of_the_phoenix.16.a: "一点象征性援助即可。"
 fate_of_the_phoenix.16.b: "我们必须支援这面抵御[ShowRegionNameWithNoTooltip('anatolia_region')]蛮族的屏障。"
 fate_of_the_phoenix.16.c: "异端得不到半分钱！"
 no_money_for_byz_tt: "我们将不会向孱弱的[actor.GetName]提供援助"
 fate_of_the_phoenix.17.title: "[actor.GetNameWithNoTooltip]提供贸易特权"
 fate_of_the_phoenix.17.desc: "我国在[ShowLocationName('constantinople')]开展商贸往来业务已久，如今[actor.GetName]主动前来接洽，提议由我方为其舰队供应造船物资，以此换取在其首都市场的特惠贸易权。"
 fate_of_the_phoenix.17.a: "[target_country.GetGovernment.GetRulerOrRegent.GetShortNameWithNoTooltip]是个商人，做生意天经地义！"
 fate_of_the_phoenix.17.b: "不必再提。"
 selected_republic_may_donate_ships_to_our_cause_tt: "所选择的$merchant_republic$可捐助桨帆[ships|e]和[sailors|e]，以换取在[ShowLocationName('constantinople')]的[merchant_power|e]加成"
 byzantines_left_fend_themselves_tt: "[actor.GetLongName]只能自求多福"
 latin_merchant_privileges_key: "$italian_group$商人特权"
 fate_of_the_phoenix.18.title: "[target_character.GetNameWithNoTooltip]抵达[ROOT.GetCountry.GetCapital.GetNameWithNoTooltip]"
 fate_of_the_phoenix.18.desc: "经我国在[target_country.GetName]的可靠友人举荐，[target_character.GetName]从知名的[target_location.GetRank.GetName][target_location.GetName]远道而来，身怀[target_culture.GetName]人的闻名遐迩的技艺与学识。此人历练于多国宫廷，深受半岛方法熏陶，如今愿为[ROOT.GetCountry.GetFlavorRank]效力，诚意可嘉。\n\n[target_character.GetSheHe]到来不仅能带来实际裨益，更能深化我方与[ShowCultureGroupName('italian_group')]同胞的纽带，他们的学识与才智始终深刻影响着诸王与皇帝的国政决策。"
 fate_of_the_phoenix.18.a: "我们将密切关注[target_character.GetHerHis]的前程！"
 fate_of_the_phoenix.19.title: "[actor.GetNameWithNoTooltip]索取贡品"
 fate_of_the_phoenix.19.desc: "随着[ShowLocationName('bursa')]落入[actor.GetName]之手，[target_character_1.GetName]的权威得以重塑，放眼全境无人敢于忤逆。使节从[target_location_1.GetName]前来，出言并非问候，而是威逼索贡。他们以我方所谓异教行径为由要求纳贡，言辞间暗藏武力威胁。无论以金币、鲜血还是反抗回应，后果都将远播国境之外。"
 fate_of_the_phoenix.19.a: "我们别无选择，只能破财免灾。"
 fate_of_the_phoenix.19.b: "用身强力壮的士兵代替。"
 fate_of_the_phoenix.19.c: "他们什么都得不到！"
 fate_of_the_phoenix.20.title: "[actor.GetAdjectiveWithNoTooltip]军事改革"
 fate_of_the_phoenix.20.desc_a: "长年的训练废弛与财政拮据，使得[ROOT.GetCountry.GetFlavorRank]的军队已无力应对未来的考验。然而，在[target_character.GetName]的主持下，我们可颁布新的军规军法，以重整军纪、改组指挥体系，并复兴曾让[ROOT.GetCountry.GetCapital.GetName]军队威震四方边境的优良传统。此举虽耗费不菲，却有望遏制我军战力长期衰退的趋势。"
 fate_of_the_phoenix.20.desc_b: "海洋长久以来既是[ROOT.GetCountry.GetFlavorRank]的屏障，亦是她的生命线，可如今我们的舰队因制度陈旧、技艺衰退而日渐衰弱。在[target_character.GetName]的主导下，我们可着力革新海军指挥体系、强化训练，并对支撑海上力量的各类机构进行现代化改造。若改革成功，[ROOT.GetCountry.GetAdjective]海军将再度捍卫海岸与商贸安全，抗衡所有敌手。"
 fate_of_the_phoenix.20.a: "对抗衰退的必要一步。"
 fate_of_the_phoenix.20.b: "也许还不到时候。"
 reformation_of_the_school_of_admirals_better_stats_tt: "只要该[modifier|e]生效，使用[ShowGenericActionName('train_admiral')][action|e]将获得总体[abilities|e]更优秀的[characters|e]"
