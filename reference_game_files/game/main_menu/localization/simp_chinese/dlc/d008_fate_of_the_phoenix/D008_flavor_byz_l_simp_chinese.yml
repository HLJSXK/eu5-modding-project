l_simp_chinese:
 d008_flavor_byz.1.title: "炼金术的承诺"
 d008_flavor_byz.1.entry: "$d008_flavor_byz.1.title$"
 d008_flavor_byz.1.desc: "昔日，希腊火在整个地中海乃至更远的地区都声名远播，我们所有敌人的海军都对它闻风丧胆，以至于它已成为一个传奇。它燃烧的温度超越任何火焰，甚至能在水面上燃烧，且无法用常规手段扑灭，这意味着它能在瞬间将任何船只化为灰烬。其制造方法一直是我国严密守护的秘密，但遗憾的是，时间也让这项知识失传，我们已无法像过去那样生产它了。\n\n如今，我们最杰出的炼金术士之一，[target_artist.GetName]，向我们保证，[target_artist.GetSheHe]能够重新找到失传的配方并复制它。如果这是真的，我们将能够再次为我们的舰队配备这种致命的火焰。我们的[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]和[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]都为此消息感到振奋，不过，要实际研发它，[target_artist.GetNameWithNoTooltip]需要我们为[target_artist.GetHerHis]的实验提供一些资金。"
 d008_flavor_byz.1.a: "[target_artist.GetSheHe|U]要什么，我们就给什么！"
 d008_flavor_byz.1.b: "不需要那些过去的幻想，我们的海军已经足够强大。"
 d008_flavor_byz.1.a.tt: "[target_artist.GetName]将进行实验以寻找希腊火的配方"
 d008_flavor_byz.2.title: "寻火之艰"
 d008_flavor_byz.2.desc: "距离[target_artist.GetName]为了寻找希腊火配方而将自己关在实验室里，已经有一段时间了，但迄今为止，[target_artist.GetHerHis]唯一能取得的成果是一连串夜间爆炸和一对烧焦的眉毛。[target_artist.GetSheHe]显而易见的无能已让许多人怀疑[target_artist.GetHerHis|U]是否真的能在自己的努力中取得成功，尽管[target_artist.GetHerHis]向我们保证，[target_artist.GetSheHe]即将取得突破，并且只需要再多一点时间和资金。"
 d008_flavor_byz.2.a: "很好，为[target_artist.GetHerHim]提供额外的资金。"
 d008_flavor_byz.2.b: "我们已经受够这些幻想了。"
 d008_flavor_byz.2.a.tt: "[target_artist.GetName]将继续寻找希腊火配方的研究"
 d008_flavor_byz.3.title: "希腊火"
 d008_flavor_byz.3.desc: "[ROOT.GetCountry.GetCapital.GetName]的居民曾多次在睡梦中被[target_artist.GetName]实验引发的爆炸所惊扰。[target_artist.GetHerselfHimself]本人也多次在实验中被烧伤，但所有这些艰辛都已结出果实。经过反复试验，[target_artist.GetSheHe]终于成功地可靠复制了史料中记载的那种希腊火。现在我们可以扩大其生产规模，并为我们的舰船配备。尽管我们仍将严格保密其确切配方和制造工艺，但这次我们必须确保自己不会再次遗忘如何制造它。"
 d008_flavor_byz.3.a: "[ROOT.GetCountry.GetAdjectiveWithNoTooltip]的海军将再次点燃整片海洋！"
 unlocked_greek_fire_tt: "为我们解锁[ShowUnitDefinitionName('n_greek_fire_galley_renaissance')]、[ShowUnitDefinitionName('n_greek_fire_galley_discovery')]、[ShowUnitDefinitionName('a_greek_fire_renaissance_infantry')]和[ShowUnitDefinitionName('a_greek_fire_discovery_infantry')][unit_types|e]"
 d008_flavor_byz.5.title: "The Reformed Tágmata"
 d008_flavor_byz.5.entry: "$d008_flavor_byz.5.title$"
 d008_flavor_byz.5.desc: "The ordeal that brought the [ROOT.GetCountry.GetAdjective] state to the brink of ruin has finally passed. Among those who bore the burden most heavily were the Tágmata, the ancient professional regiments sworn directly to the [ROOT.GetCountry.GetGovernment.GetRulerTitle]. Though long diminished from their former glory, it was precisely their continued existence as a standing force distinct from the feudal levy that made our survival possible.\n\nWith stability restored, [target_character.GetName] has turned [target_character.GetHerHis] attention to what must now follow. The Tágmata are to be reformed in earnest: restored imperial funding, stricter discipline, and a renewed sense of purpose that will raise the [ROOT.GetCountry.GetAdjectiveWithNoTooltip] regiments above the common levy in substance, not merely in name. What the crisis forged in adversity, peace shall now temper into something truly worthy of the [ROOT.GetCountry.GetLongNameWithNoTooltip]."
 d008_flavor_byz.5.a: "Let the Tágmata be remade into the vanguard of [ROOT.GetCountry.GetNameWithNoTooltip]."
 d008_flavor_byz.5.a.entry: "Let the Tágmata be remade into the vanguard of Rome."
 d008_flavor_byz.5.b: "The regiments have already proven themselves in the crucible."
 d008_flavor_byz.4.title: "[target.GetNameWithNoTooltip]的研究无果而终"
 d008_flavor_byz.4.desc: "[target.GetName]的意外离世不幸地导致[target.GetHerHis]对希腊火的探索无果而终。[target.GetHerHis]的弟子和其他杰出的炼金术士们检查了[target.GetHerHis]的笔记，想看看是否能够挽救并延续[target.GetHerHis]的研究。遗憾的是，[target.GetHerHis|U]的实验似乎一直在原地打转，没有任何实质性的进展可供把握。因此，希腊火将永远作为一个谜团封存在历史之中。"
 d008_flavor_byz.4.a: "唉……算了，就这样吧……"
