l_simp_chinese:
 d008_orthodox_events.1.title: "[actor.GetNameWithNoTooltip]的提议"
 d008_orthodox_events.1.desc: "来自[actor.GetLongName]的代表团与我们[ROOT.GetCountry.GetGovernment.GetCourtTitle]接洽，提出将他们一件宏伟的宗教圣像[target.GetName]借给我们。当然，这并非完全免费，但这也将使我们两国的关系更加紧密。"
 d008_orthodox_events.1.a: "我们欣然接受。"
 d008_orthodox_events.1.b: "告诉他们我们已经有一件了。"
 d008_orthodox_events.2.title: "提议被接受"
 d008_orthodox_events.2.desc: "光荣的[target_country.GetLongName]决定接受我们出借[target.GetName]的慷慨提议。他们已经向我们支付了金钱补偿，这必将拉近我们两国的关系。我们只希望他们届时能归还这件圣像。"
 d008_orthodox_events.2.a: "在此期间请妥善保管。"
 d008_orthodox_events.3.title: "提议被拒绝"
 d008_orthodox_events.3.desc: "[target_country.GetName]那些不敬神的蠢货拒绝了我们出借[target.GetName]的提议。我们是出于诚意提出此议，而他们拒绝此举，恰恰证明了他们既无信仰也无善念。只有拒绝[ROOT.GetCountry.GetReligion.GetName]本身的人，才敢拒绝一件[ShowWorkOfArtTypeName('icon')]。"
 d008_orthodox_events.3.a: "让他们下地狱去吧！"
 d008_orthodox_events.4.title: "[target_art.GetNameWithNoTooltip]的出借期已到"
 d008_orthodox_events.4.desc: "[origin_country.GetName]借给我们的那件[ShowWorkOfArtTypeName('icon')]已到约定的借期。因此，现在是时候将[target_art.GetName]归还原主了，而他们显然也期待我们这样做。然而，我们可以声称我们“一时忘记放哪了”，从而拒绝履行归还义务。"
 d008_orthodox_events.4.desc_no_country: "[target_art.GetName]由我们保管已经有一段时间了。它最初是借给我们的，但由于原主人已不复存在，我们已无需将其归还给任何人。"
 d008_orthodox_events.4.a: "如期归还。"
 d008_orthodox_events.4.b: "它现在属于我们了！"
 d008_orthodox_events.5.title: "$d008_orthodox_events.4.title$"
 d008_orthodox_events.5.desc: "借给[target_country.GetLongName]的[target_art.GetName]租期已满。因此，他们举行了隆重的仪式将其归还给我们，完全履行了我们协议中的条款。"
 d008_orthodox_events.5.a: "这是一个体面的[ROOT.GetCountry.GetReligion.GetAdjectiveWithNoTooltip]国家应有的作为。"
 d008_orthodox_events.6.title: "$d008_orthodox_events.4.title$"
 d008_orthodox_events.6.desc: "借给[target_country.GetLongName]的[target_art.GetName]租期已满。然而，[target_country.GetName]的那些无耻之徒拒绝将其归还给我们，只找了些拙劣的借口来搪塞。"
 d008_orthodox_events.6.a: "他们会为这种侮辱付出代价！"
 d008_orthodox_events.7.title: "[target_pentarchy.GetNameWithNoTooltip]牧座"
 d008_orthodox_events.7.desc: "[target_pentarchy.GetName]，[ShowReligionGroupName('christian')]的伟大中心五大牧座之一，现已落入我们手中。[target_patriarch.GetName]如今将入主其座，我们将弘扬[ShowReligionAdjective('orthodox')]信仰的荣耀。"
 d008_orthodox_events.7.a: "五大牧首区将悉数属于我们！"
 d008_orthodox_events.8.title: "[target_pentarchy.GetNameWithNoTooltip]的沦陷"
 d008_orthodox_events.8.desc: "[target_pentarchy.GetName]已被他人夺走，随之而去的还有它所赋予的权力与尊重。上帝抛弃我们了吗？[ROOT.GetCountry.GetName]的[ShowReligionAdjective('orthodox')]教会必将因此损失而受创。"
 d008_orthodox_events.8.desc_all_pentarchy: "随着[target_pentarchy.GetName]失守，五大牧首区体系已被打破，因为我们不再掌控其全部牧座。若要确保信仰的力量，我们必须再次将全部五大牧座置于我们的旗帜之下。"
 d008_orthodox_events.8.a: "我们必须将其收复！"
 downgrade_pentarchy_modifier_tt: "我们将不再从掌控的五大牧座获得额外加成"
 d008_orthodox_events.9.title: "五大牧首区光复"
 d008_orthodox_events.9.desc: "随着[target_pentarchy.GetName]落入我们之手，五大牧首区的牧座已全部处于我们掌控之下。昔日各个牧座之间松散的关系，如今在我们的权威下得以统一。即使是那些曾落入异教徒和异端之手的席位，也因我们的恩典而重归正教。教会将再次统一，而我们的诸位牧首将引领其前进方向。"
 d008_orthodox_events.9.a: "教会将再次统一。"
 upgrade_pentarchy_modifier_tt: "所掌控的五大牧首区的效果将得到增强。"
 pentarchy_unlocked_abilities_tt: "解锁[ShowGenericActionName('D008_mend_schism')]和[ShowGenericActionName('D008_restore_rome_primacy')][actions|e]"
 d008_orthodox_events.10.title: "弥合教会大分裂"
 d008_orthodox_events.10.desc: "自[ShowLocationName('rome')]与[ShowLocationName('constantinople')]的两位牧首决裂以来，极具破坏性的教会大分裂已经在[ShowReligionGroupName('christian')]世界的核心地带侵蚀了数个世纪。西方教会的分裂只会曲解基督的教诲，唯恶魔本尊对此感到欣喜。\n\n如今，随着五大牧座全部归于我们的权威之下，东西方的牧首们再次统合于同一教会，秉持同一观点。尽管仍有许多异端拒绝承认真教会的确定地位，但所有迷途羔羊回归其真正牧羊人身边，只是时间问题。"
 d008_orthodox_events.10.a: "只有一个[ShowReligionGroupAdjectiveWithNoTooltip('christian')]教会。"
 d008_orthodox_events.11.title: "恢复[ShowLocationNameWithNoTooltip('rome')]的首席地位"
 d008_orthodox_events.11.desc: "帝国的起源与摇篮，古代文化与文明的灯塔；长久以来，这座永恒之城因异端与野蛮而笼罩在黑暗之中。如今，它重归我们的正义之手，其荣耀将得以恢复，其作为世界中心的地位将得以重建。\n\n从这座新的[ROOT.GetCountry.GetGovernment.GetAdjective]首都，我们[ROOT.GetCountry.GetFlavorRank]的力量将远播四方，世界各个角落的人们都将感受到我们的存在。荣耀归于[ShowLocationName('rome')]！荣耀归于[ROOT.GetCountry.GetLongName]！"
 d008_orthodox_events.11.a: "#italic 永恒之城重获新生！#!"
 patriarchate_will_relocate_to_rome_tt: "[ShowLocationName('rome')]牧首现在将成为我们[GetInternationalOrganizationType('autocephalous_patriarchate').GetName]的领袖"
 d008_orthodox_events.12.title: "教会大分裂宣告弥合"
 d008_orthodox_events.12.desc: "[scope:actor.GetName]宣称已弥合东西教会大分裂，使基督教世界在君士坦丁堡之下重新统一。"
 d008_orthodox_events.12.a: "加入东正教信仰。"
 d008_orthodox_events.12.b: "罗马是我们的牧羊人。"
 d008_orthodox_events.13.title: "教会大分裂宣告弥合"
 d008_orthodox_events.13.desc: "[scope:actor.GetName]擅自以自身标准宣布教会分裂已经弥合。"
 d008_orthodox_events.13.a: "令人愤慨。"
 d008_orthodox_events.14.title: "牧首迁至罗马"
 d008_orthodox_events.14.desc: "[scope:actor.GetName]已将普世牧首迁至罗马，直接对我们的圣城提出主权宣称。"
 d008_orthodox_events.14.a: "我们绝不放弃罗马。"
