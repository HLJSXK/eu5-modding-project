l_simp_chinese:
 loan_icon: "出借圣像"
 loan_icon_desc: "将一件[ShowWorkOfArtTypeName('icon')]出借给另一[country|e]，为期#Y 10#!年，费用取决于他们的[income|e]和[work_of_art|e]的[art_quality|e]。这也会提高两国间的[opinion|e]和[trust|e]。"
 loan_icon_tt_no_target: "我们会向目标[country|e]提议出借我们的一件[works_of_art|e]以换取[gold|e]"
 loan_icon_tt: "他们将收到出借[SCOPE.sWorkOfArt('target').GetName]换取[SCOPE.GetValue('icon_price_value')|2][gold_i]的提议"
 loan_icon_bad_economy_tt: "他们的经济状况似乎挺糟糕，因此如果[opinion|e]不足，#R 他们将不会同意#!"
 loan_icon_choose_icon: "选择要出借的[ShowWorkOfArtTypeName('icon')]"
 not_already_receiving_icon_tt: "他们不能已经借出[ShowWorkOfArtTypeName('icon')]"
 icon_not_already_loaned_tt: "我们当前不能正从其他[country|e]借用该[ShowWorkOfArtTypeName('icon')]"
 mend_schism: "弥合大分裂"
 mend_schism_desc: "[ShowReligionGroupName('christian')]已分裂了几个世纪。随着我们控制五大牧首的所有教座，是时候利用我们的影响力弥合分裂，促成教会间的和解了。"
 restore_rome_primacy: "恢复[ShowLocationNameWithNoTooltip('rome')]首要地位"
 restore_rome_primacy_desc: "[ShowLocationName('rome')]是帝国最初的首都，即使东西分治之后，它仍然是重要的都市，直到西帝国灭亡。现在，永恒之城再次处于我们控制之下，我们可以恢复其作为旧都的首要地位。"
 patriarch_not_in_rome_tt: "我们的[GetInternationalOrganizationType('autocephalous_patriarchate').GetName]不能已经以[ShowLocationName('rome')]为大本营"
 reestablish_hellenism: "重建[ShowReligionNameWithNoTooltip('hellenism_religion')]"
 reestablish_hellenism_desc: "我们民族的古老宗教的传统和神秘让王室着迷。我们可以恢复它过往的辉煌，让其再次成为一种主要宗教。"
 add_omen: "添加神谕"
 add_omen_god: "为神谕选择神灵"
 select_omen: "祈求神谕"
 select_omen_desc: "我们的统治者将祈求神谕。"
 select_omen_tt: "我们[country|e]会获得一项临时增益，强度取决于我们[ruler|e]的相关[ability|e]。"
 select_omen_god_is_active_tt: "[target.GetName]已经在忙于另一[omen|e]。"
 select_omen_god: "选择神谕"
 select_omen_god_desc: "我们的统治者将选择一名神灵降下[omen|e]。"
 select_omen_god_tt: "选择降下[omen|e]的神灵。"
 host_olympiad: "举办奥运会"
 host_olympiad_desc: "我们的统治者将在一处[ShowReligionAdjective('hellenism_religion')][holy_site|e]举办竞技大赛以纪念众神。"
 host_olympiad_location_tt: "所选[location|e]在奥运会期间获得[ShowModifier('host_olympiad_location_modifier')]"
 host_olympiad_effect_tt_location: "效果会随[target.GetName]的[target.GetImportance][holy_site_importance_short|e]提高。"
 host_olympiad_effect_tt_no_location: "效果会随所选[holy_site|e]的[holy_site_importance_short|e]提高。"
 sponsor_troop_feast: "犒劳士兵"
 sponsor_troop_feast_desc: "通过为我们的军队组织一场盛宴，我们将使士兵们保持最佳状态和士气，确保他们乐于为国效命。"
 roman_festivals: "组织罗马节日"
 roman_festivals_desc: "每个历月都有许多为敬奉我们众多神祇而设立的节庆，但这次节庆上，我们将动用国家力量来组织一场盛大的典礼。"
 explanation_roman_festivals_tt: "[ShowReligionAdjective('hellenism_religion')]信徒会庆祝许多献给其神祇的节庆。每月庆典各不相同，根据其举办方式，我们将获得不同的效果。"
 compitalia_tt: "路口节旨在敬奉#italic 路口守护神#!，即十字路口的家庭守护神。"
 lupercalia_tt: "牧神节围绕健康、生育与城市的净化展开。"
 quinquatria_tt: "智慧女神节是为敬奉女神[ShowGodName('athena_god')]而设的节庆。"
 fordicidia_tt: "丰产节是一个围绕生育、耕作和畜牧的节庆。在此期间，庆祝者会向大地女神#italic 忒路斯#!献祭一头怀孕的母牛。"
 mercuralia_tt: "神使节是为敬奉信使之神[ShowGodName('hermes_god')]而设的节庆。"
 vestalia_tt: "灶神节是为敬奉灶火女神#italic 维斯塔#!而设的节庆。"
 neptunalia_tt: "海神节是为敬奉神祇[ShowGodName('poseidon_god')]而设的节庆。"
 vinalia_rustica_tt: "乡村酒神节围绕葡萄收获、蔬菜生长和丰产展开，旨在同时敬奉[ShowGodName('zeus_god')]与[ShowGodName('aphrodite_god')]。"
 ludi_romani_tt: "罗马赛节包含一系列为敬奉[ShowGodName('zeus_god')]而举办的竞赛与娱乐活动。"
 equus_october_tt: "十月马节包含赛马庆典和为敬奉[ShowGodName('ares_god')]而进行的马匹献祭，与农事和军事行动季节的结束时间相吻合。"
 ludi_plebeii_tt: "平民赛会节是一个包含多场戏剧表演和体育竞赛的节庆，围绕平民大众展开。"
 saturnalia_tt: "农神节是纪念时间之神#italic 萨图恩#!的节日。"
 greek_festivals: "复兴古希腊节日"
 greek_festivals_desc: "我们国土上的每个地区都有一项纪念神灵的特殊节日。我们将利用国家的力量支持每个地区，帮助他们创造有史以来最盛大的典礼。"
 greek_festivals_tt: "我们在以下省份之一拥有地点：[ShowProvinceDefinitionName('laconia_province')]、[ShowProvinceDefinitionName('achaea_province')]、[ShowProvinceDefinitionName('arcadia_province')]、[ShowProvinceDefinitionName('attica_province')]、[ShowProvinceDefinitionName('smyrna_province')]、[ShowProvinceDefinitionName('central_macedonia_province')]、[ShowProvinceDefinitionName('lower_macedonia_province')]、[ShowProvinceDefinitionName('aetolia_province')]、[ShowProvinceDefinitionName('rodos_province')]、[ShowProvinceDefinitionName('messenia_province')]、[ShowProvinceDefinitionName('aydin_province')]。"
 gymnopaedia_tt: "裸童节在#italic 斯巴达#!举行，纪念#italic 阿波罗#!。"
 gymnopaedia_tt_mod: "我们会获得[ShowModifier('gymnopaedia_modifier')]。"
 laphria_tt: "拉弗里亚节在[ShowProvinceDefinitionName('achaea_province')]举行，纪念#italic 阿尔忒弥斯#!女神。"
 laphria_tt_mod: "我们会获得[ShowModifier('laphria_modifier')]。"
 lykaia_tt: "吕卡亚节在[ShowProvinceDefinitionName('arcadia_province')]举行，是青少年成年的仪式，以及对抗狼人威胁的保障。"
 lykaia_tt_mod: "我们会获得[ShowModifier('lykaia_modifier')]。"
 panathenaic_games_tt: "泛雅典娜运动会在[ShowProvinceDefinitionName('attica_province')]举行，纪念[ShowGodName('athena_god')]女神。"
 panathenaic_games_tt_mod: "我们会获得[ShowModifier('panathenaic_games_modifier')]。"
 apaturia_tt: "阿帕图利亚节在[ShowProvinceDefinitionName('smyrna_province')]举行，纪念[ShowGodName('zeus_god')]和[ShowGodName('athena_god')]。"
 apaturia_tt_mod: "我们会获得[ShowModifier('apaturia_modifier')]。"
 hetairideia_tt: "伙友节在[ShowProvinceDefinitionName('central_macedonia_province')]举行，纪念[ShowGodName('zeus_god')]。"
 hetairideia_tt_mod: "我们会获得[ShowModifier('hetairideia_modifier')]。"
 apellai_tt: "阿佩莱节在[ShowProvinceDefinitionName('aetolia_province')]举行，纪念#italic 阿波罗#!。"
 apellai_tt_mod: "我们会获得[ShowModifier('apellai_modifier')]。"
 halieia_tt: "哈利亚节在[ShowProvinceDefinitionName('rodos_province')]举行，纪念#italic 赫利俄斯#!。"
 halieia_tt_mod: "我们会获得[ShowModifier('halieia_modifier')]。"
 heraclean_games_tt: "赫拉克勒斯运动会在[ShowProvinceDefinitionName('lower_macedonia_province')]举行，纪念#italic 赫拉克勒斯#!。"
 heraclean_games_tt_mod: "我们会获得[ShowModifier('heraclean_games_modifier')]。"
 carneia_tt: "卡尔涅亚节在[ShowProvinceDefinitionName('messenia_province')]举行，纪念#italic 阿波罗#!。"
 carneia_tt_mod: "我们会获得[ShowModifier('carneia_modifier')]。"
 panionia_tt: "泛伊奥尼亚节在[ShowProvinceDefinitionName('aydin_province')]举行，纪念[ShowGodName('poseidon_god')]。"
 panionia_tt_mod: "我们会获得[ShowModifier('panionia_modifier')]。"
 hire_advisor_eunuch_chance_tt: "10%‑100%概率雇佣一位平均[abilities|e]较高的[ShowTraitName('eunuch')][character|e]，概率受[ShowBureaucracyTypeName('court_eunuchs_bureaucracy')]固化程度和[ShowModifierTypeName('eunuch_power')]影响。"
 grant_a_triumph: "授予凯旋式"
 grant_a_triumph_desc: "胜利应当被庆祝。一位能干的军队领袖应当通过壮观的凯旋游行向民众展示其胜利者的风采。"
 grant_a_triumph_tt: "我们在过去5年内赢得过战争。"
 grant_a_triumph_triumphant_bonus_tt: "指定的[character|e]将获得[ShowTraitName('triumphant')]特质"
