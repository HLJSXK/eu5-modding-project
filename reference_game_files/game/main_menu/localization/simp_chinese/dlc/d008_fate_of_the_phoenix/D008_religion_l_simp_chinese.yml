l_simp_chinese:
 # Hellenism
 #Religious Aspects
 civic_religion_aspect: "公民宗教"
 civic_religion_aspect_desc: "敬神等同于维护国家的利好。因此，为确保城邦的繁荣，宗教仪轨与庆典是我们必须履行的公民职责。"
 hero_cult_aspect: "英雄崇拜"
 hero_cult_aspect_desc: "我们的历史中充满了塑造了我们社会与品格的伟人。他们是诸神的凡生子嗣，拥有非凡能力却又常遭逢悲剧命运，他们曾保护并领导我们的祖先，最终建立起我们今天这个伟大的国家。敬拜他们并汲取他们的教训，是我们现在的责任。"
 dionysian_mysteries_aspect: "狄俄尼索斯秘仪"
 dionysian_mysteries_aspect_desc: "受酒神狄俄尼索斯秘仪启示者的仪式、舞蹈与音乐，为其成员提供解脱与释放，无分社会阶级。神灵的死亡与重生，就如同葡萄藤的生长周期——从大地中萌发，酿成葡萄酒，最终被信徒们饮下，以此荣耀狄俄尼索斯。"
 eleusinian_mysteries_aspect: "厄琉息斯秘仪"
 eleusinian_mysteries_aspect_desc: "厄琉息斯秘仪的追随者信奉这样一则神话：珀耳塞福涅被冥界之王哈迪斯从其母亲得墨忒耳身边劫走，珀耳塞福涅随后获释却又遭到欺骗。对已受启示者而言，这神话代表着所有植物生命生长与重生的循环，以及生命世代相传的永恒。"
 samothracian_mysteries_aspect: "萨莫色雷斯秘仪"
 samothracian_mysteries_aspect_desc: "在萨莫色雷斯岛上，一个神秘教派在希腊化时期蓬勃发展；它以广纳任何想加入的人而闻名，无论其社会阶层如何。据说许多神话英雄，如赫拉克勒斯、伊阿宋和俄耳甫斯，都在萨莫色雷斯接受了入会仪式。我们可以从遗迹和废墟中收集并重构这些奥秘，使该教派重现过去的辉煌。"
 olympiad_aspect: "奥林匹克运动会"
 olympiad_aspect_desc: "奥林匹克运动会是敬奉诸神的庆典，也是展示我国实力与团结的盛事。参与运动会是公民的职责，为我们的运动员带来荣耀。"
 mithraic_mysteries_aspect: "密特拉秘仪"
 mithraic_mysteries_aspect_desc: "密特拉秘仪的入教者自称为辛德西奥伊（意为“立誓同道者”），在罗马帝国全盛时期于罗马城及西罗马帝国极受欢迎。他们的仪式、集会和宴饮都在秘密的地下神庙中进行，但我们可以将他们重新带回光明，为我们的民众复兴这些习俗。"
 imperial_cult_aspect: "帝皇崇拜"
 imperial_cult_aspect_desc: "正如古罗马的皇帝曾被人民与元老院尊为神明，我们的统治者及其王朝也应被如此看待。他们的伟大、威严与权威，明示着他们不仅获神授之权，其本身即是神。"
 dii_familiares_aspect: "家神"
 dii_familiares_aspect_desc: "家宅诸神在我国人民的生活中扮演着极其重要的角色。他们守护并影响着个人领域中的一切，这通常指一个家庭，但也可以延伸至道路、社区，甚至整座城市。"
 mos_maiorum_aspect: "祖宗之法"
 mos_maiorum_aspect_desc: "自远古时代直至帝国鼎盛时期，支配罗马人生活的不成文法则便是“祖先之道”。这套传统与习俗定义了何谓罗马人，以及在家中和公共场合应如何行事。"
 monism_aspect: "太一论"
 monism_aspect_desc: "我国复兴时代的哲人主张，世间一切存在皆源自太一—— 这是唯一超越性本源，诸神与万物皆由其流溢而生。传统万神殿被赋予寓言意义，诸神皆为太一的不同显现。各类神谕预兆不再拥有独立神力，但对太一的信仰将渗透至一切治国理政之中。"
 #Omens
 #Zeus
 the_thunderer_omen: "雷霆之神"
 the_thunderer_omen_desc: "天空愤怒于是电闪雷鸣，任何与我们作对的人都会因恐惧而退缩。"
 supreme_of_gods_omen: "诸神至尊"
 supreme_of_gods_omen_desc: "烈日高悬，昭示我们得到了最强大神明的庇佑。无人会质疑我们的荣耀！"
 monarch_of_the_sky_omen: "天界君主"
 monarch_of_the_sky_omen_desc: "一群鸟儿展翅高飞，响应着[ShowGodName('zeus_god')]的召唤，承载着他的意志。"
 omnipotence_of_heaven_omen: "天国全能者"
 omnipotence_of_heaven_omen_desc: "我们确实身处[ShowGodName('zeus_god')]的威能之中，可感知到他的神力，深知于他无所不成。"
 the_liberator_omen: "解放者"
 the_liberator_omen_desc: "[ShowGodName('zeus_god')]之力曾助我们的祖先反抗波斯压迫；他将为我们解开镣铐。"
 the_bountiful_one_omen: "丰饶之神"
 the_bountiful_one_omen_desc: "凡仰望[ShowGodName('zeus_god')]者，皆将分享他的神力，并获得丰饶的恩赐。"
 the_holy_omen: "神圣者"
 the_holy_omen_desc: "没有什么比置身于至高神祇之前并获得其恩宠更加神圣。"
 king_of_all_omen: "众神之王"
 king_of_all_omen_desc: "[ShowGodName('zeus_god')]是神界的至高权威，正如我们的统治者高于人民。"
 immortal_omen: "不朽者"
 immortal_omen_desc: "神如何会被杀死？在[ShowGodName('zeus_god')]的庇佑下，我们的军队如何会失败？"
 splendor_omen: "辉煌者"
 splendor_omen_desc: "澄澈的天空彰显了[ShowGodName('zeus_god')]的荣耀无可置疑。全世界都将见证他对我们的恩宠。"
 #Aphrodite
 mother_of_love_omen: "爱之母"
 mother_of_love_omen_desc: "爱意自[ShowGodName('aphrodite_god')]涌流而出，我们的人民也将沉浸于这份爱之中。"
 the_foam_born_omen: "泡沫降生者"
 the_foam_born_omen_desc: "孕育[ShowGodName('aphrodite_god')]的海沫拍打着我们的海岸，她始终在那里，温柔地引导我们的船只航行。"
 the_seductress_omen: "魅惑者"
 the_seductress_omen_desc: "爱情与诱惑属于[ShowGodName('aphrodite_god')]的领域，她的技艺与恩宠将使众人归附于我们。"
 giver_of_joy_omen: "欢愉的赐予者"
 giver_of_joy_omen_desc: "没有什么比置身于美之女神的面前并获得她的恩宠更加令人欣悦。"
 nurturer_of_children_omen: "孩童的养育者"
 nurturer_of_children_omen_desc: "女神之爱最深的体现莫过于对孩童的关怀，她的母性之爱也延伸至我们所有人。"
 the_beautiful_omen: "美神"
 the_beautiful_omen_desc: "作为最美丽的女神，[ShowGodName('aphrodite_god')]收拢了众多支持者，有了她的青睐，我们也能一样。"
 the_secretive_omen: "守口如瓶者"
 the_secretive_omen_desc: "不是所有爱情都能公之于众。谨慎和保密也是女神的工具。"
 the_harmonizer_omen: "协调者"
 the_harmonizer_omen_desc: "[ShowGodName('aphrodite_god')]平等地爱着所有人，我们也应如此爱我们的人民。"
 the_lover_of_laughter_omen: "爱笑者"
 the_lover_of_laughter_omen_desc: "[ShowGodName('aphrodite_god')]脸上总是带着笑容，我们也应一样。"
 the_desired_omen: "众所渴求"
 the_desired_omen_desc: "作为最美的女神，[ShowGodName('aphrodite_god')]唤起万众的欲望。得到她的恩宠，自然会吸引他人。"
 #Poseidon
 tempest_omen: "风暴"
 tempest_omen_desc: "神的怒火激荡海水，掀起风暴，考验最勇敢的航海者。"
 lord_of_the_sea_omen: "海洋之主"
 lord_of_the_sea_omen_desc: "统治海洋意味着支配世界。"
 protector_of_horses_omen: "马匹保护者"
 protector_of_horses_omen_desc: "在万马之父的庇佑下，我们的坐骑将茁壮成长。"
 wielder_of_the_trident_omen: "三叉戟的主人"
 wielder_of_the_trident_omen_desc: "没有比海神的三叉戟更具标志性的武器了；这证明了多方向进攻是最好的选择。"
 earth_shaker_omen: "震地者"
 earth_shaker_omen_desc: "正如他震击大地创造泉水一样，踏上我们土地的敌人也会遭受如此打击。"
 leader_of_the_nymphs_omen: "宁芙的领袖"
 leader_of_the_nymphs_omen_desc: "[ShowGodName('poseidon_god')]的青睐将伴随着他手下宁芙的青睐，她们将保佑我们的水源。"
 the_watcher_omen: "观察者"
 the_watcher_omen_desc: "[ShowGodName('poseidon_god')]的目光无处不在，没有什么能逃避他的注视。"
 the_graceful_omen: "优雅者"
 the_graceful_omen_desc: "大海与波涛自有其美，细心体悟，亦能使心灵变得美丽。"
 master_of_the_waves_omen: "浪潮之主"
 master_of_the_waves_omen_desc: "未经[ShowGodName('poseidon_god')]允许，任何人都无法在海上通航。"
 dark_blue_haired_omen: "深蓝之发"
 dark_blue_haired_omen_desc: "浪潮是海神深蓝的头发，我们的船只将在他的庇佑下快速航行。"
 #Hermes
 messenger_omen: "信使"
 messenger_omen_desc: "那双生有羽翼的靴子总能迅捷而安全地传递一切讯息。"
 golden_wand_omen: "持金杖者"
 golden_wand_omen_desc: "双蛇杖曾被用来分开两条蛇，但分离之物亦能连接。"
 god_of_travelers_omen: "旅人之神"
 god_of_travelers_omen_desc: "所有旅行者和行商都会向[ShowGodName('hermes_god')]祈求安全和保护。"
 protector_of_merchants_omen: "商人保护者"
 protector_of_merchants_omen_desc: "在[ShowGodName('hermes_god')]的注视下，商人将安全而富足地穿行于我们的土地。"
 wing_footed_omen: "飞足之神"
 wing_footed_omen_desc: "[ShowGodName('hermes_god')]的恩宠将使我们的军队如同神祇般迅捷。"
 trickster_omen: "欺诈者"
 trickster_omen_desc: "风向的变幻昭示着即便是[ShowGodName('hermes_god')]也性情多变，万事皆可能转折与欺诈。"
 patron_of_thieves_omen: "窃贼的庇护者"
 patron_of_thieves_omen_desc: "灵敏的身手既能做好事也能做坏事，但无论如何，这都是一项优良的特质。"
 president_of_games_omen: "竞技之主"
 president_of_games_omen_desc: "[ShowGodName('hermes_god')]的恩宠降临于竞技赛事，为我们带来娱乐与健康。"
 guardian_of_the_gates_omen: "门之守护者"
 guardian_of_the_gates_omen_desc: "一切道路与旅者终将经过关隘，或被放行，或被阻挡。"
 giver_of_wealth_omen: "财富给予者"
 giver_of_wealth_omen_desc: "在[ShowGodName('hermes_god')]的支持下，贸易不仅是为了商品的流动，也是为了财富的流动。"
 #Ares
 throng_of_battle_omen: "战斗之众"
 throng_of_battle_omen_desc: "在每一场冲突、每一次纷争之中，[ShowGodName('ares_god')]都在其中，其意志决定着结局。"
 insatiable_at_war_omen: "嗜战无厌"
 insatiable_at_war_omen_desc: "[ShowGodName('ares_god')]沉醉于战斗，战事越漫长、越血腥，越能赢得他的恩宠。"
 slayer_of_men_omen: "人屠"
 slayer_of_men_omen_desc: "[ShowGodName('ares_god')]之怒将在战斗中伴随我们的士兵，他的力量将附着于他们的臂膊之上。"
 plague_of_mankind_omen: "人之瘟疫"
 plague_of_mankind_omen_desc: "面对战神，没人胆敢梦想再活一天。"
 warrior_omen: "战士"
 warrior_omen_desc: "单方面的屠杀不足以满足战士之神，唯有光荣的战斗才能取悦他。"
 audacious_omen: "无畏者"
 audacious_omen_desc: "冲向战场打击敌人，必将赢得[ShowGodName('ares_god')]的青睐与恩典。"
 blood_soaked_omen: "浴血者"
 blood_soaked_omen_desc: "敌人的鲜血将被倾洒，并献予索求它的神祇。" #Blood for the Blood God!
 malignant_omen: "恶毒者"
 malignant_omen_desc: "只要能毁灭敌人，再卑劣的计谋也不为过。"
 indestructible_omen: "坚不可摧者"
 indestructible_omen_desc: "[ShowGodName('ares_god')]不仅持矛攻敌，也执盾护身。"
 fickle_lord_of_war_omen: "善变的战争之主"
 fickle_lord_of_war_omen_desc: "战争与战局随时可能逆转，但[ShowGodName('ares_god')]的恩宠将确保它们向我们倾斜。"
 #Athena
 unseen_hand_omen: "看不见的手"
 unseen_hand_omen_desc: "没有计划会仅因偶然而失败；天意会引导入侵者作出错误决策。巡逻队误入埋伏，补给线被切断，指挥官被严重误导。"
 unwavering_omen: "坚定不移"
 unwavering_omen_desc: "如同[ShowGodName('athena_god')]般傲立不移，我们也将不受疲惫所扰。"
 she_who_fights_in_front_omen: "她迎敌而战"
 she_who_fights_in_front_omen_desc: "迅速迎战敌人、正面交锋，是消灭他们的最快方式。"
 the_industrious_omen: "勤勉者"
 the_industrious_omen_desc: "勤奋与专注于工作，是获得收益与成果的最佳途径。"
 the_judge_omen: "审判者"
 the_judge_omen_desc: "在[ShowGodName('athena_god')]的洞察与智慧之下，无罪者不会被冤枉，有罪者亦难逃惩罚。"
 the_chieftain_of_war_omen: "战争统帅"
 the_chieftain_of_war_omen_desc: "如同蚂蚁失去路线便会四散游走，军队若无指挥与引导亦会溃散。"
 teacher_of_the_waves_omen: "浪涛之师"
 teacher_of_the_waves_omen_desc: "[ShowGodName('poseidon_god')]或许统治着浪涛，但[ShowGodName('athena_god')]用船将它们驯服。"
 protector_of_the_anchorage_omen: "泊地庇护者"
 protector_of_the_anchorage_omen_desc: "[ShowGodName('athena_god')]是造船的大师，有了她的恩宠，我们的船只怎会不安全？"
 the_bright_eyed_omen: "睿眼者"
 the_bright_eyed_omen_desc: "在猫头鹰的符号下，我们真正获得了[ShowGodName('athena_god')]的恩宠与智慧。"
 the_armed_one_omen: "披甲者"
 the_armed_one_omen_desc: "[ShowGodName('athena_god')]自降生起便身披盔甲，这提醒我们，始终为战斗做好准备是最好的策略。"
 hellenism_religion.1.title: "[target_god.GetNameWithNoTooltip]对我们微笑"
 hellenism_religion.1.desc: "在这些平静的日子里，诸神并未将目光移开。种种征兆显现于奇异的巧合、突如其来的好运，以及在[ROOT.GetCountry.GetGovernment.GetCourtTitle]中弥漫的日常秩序。\n\n祭司们宣称[target_god.GetName]正眷顾着我们的[ROOT.GetCountry.GetFlavorRank]与我们所爱戴的[target_character.GetNameWithNoTooltip]。的确，我们的运势似乎正在转变，我们献上的祭祀终于开始影响命运！"
 hellenism_religion.1.a: "我们接受这份祝福。"
 fertile_ruler_and_family_tt: "[target_character.GetName]与[consort|e]的[fertility|e]提高"
 hellenism_religion.2.title: "[target_character.GetNameWithNoTooltip]之鹰"
 hellenism_religion.2.desc: "[target_character.GetName]的军事才能堪称我们[ROOT.GetCountry.GetFlavorRank]先辈所传承军事传统的光辉典范。其机智、坚韧与勇敢，堪与奥德修斯、伊阿宋或埃阿斯比肩。\n\n然而，[target_character.GetShortNameWithNoTooltip]更是我们对[ShowReligionAdjective('hellenism_religion')]信仰虔诚的结晶，是真正的战场雄鹰！"
 hellenism_religion.2.a: "[target_character.GetSheHe]会在阴影中作战吗？"
 hellenism_religion.2.b: "派遣[target_character.GetHerHim]前往学院任教！"
 hellenism_religion.3.title: "[target_location.GetNameWithNoTooltip]的哲学之翼"
 hellenism_religion.3.desc: "人类灵魂从何而来？死后将去往何处？若化作无羽双足之兽，生命是否更好？这些炽热的问题困扰着[target_location.GetName]的[ShowBuildingTypeName('university')]中那些才思过盛的学者与哲人。\n\n近日，一位富有的当地赞助者开始资助学院，并请求增加拨款，声称该机构能够传播真正创新与前沿的思想。"
 hellenism_religion.3.a: "只要他们别教授什么第欧根尼就好……"
 hellenism_religion.3.b: "他们难道不能想象自己已经有钱了吗？"
 hellenism_religion.4.title: "[target_character_2.GetNameWithNoTooltip]的护符"
 hellenism_religion.4.desc: "敌人与对手昼夜谋划着我们的覆灭。然而，只要[target_character_2.GetName]仍在，继承便是安全的。这个孩子将整个[ROOT.GetCountry.GetFlavorRank]的未来握在[target_character_2.GetHerHis]纤细的手中。\n\n沐浴着奥林匹斯诸神的光辉，[target_character_2.GetShortNameWithNoTooltip]注定伟大，这一点毋庸置疑。我们的一位[ROOT.GetCountry.GetGovernment.GetCourtTitle]廷臣，[target_character_3.GetName]这位神秘的[target_character_3.GetWomanMan]，愿意献出一件护符。据说其中蕴含一滴神性精华，可在[target_character_2.GetShortNameWithNoTooltip]成年前抵御邪祟。"
 hellenism_religion.4.a: "代表[target_character_2.GetShortNameWithNoTooltip]感谢[target_character_3.GetShortNameWithNoTooltip]。"
 hellenism_religion.4.b: "我们不屑于这种迷信！"
 talisman_tt: "给予小[target_character_2.GetName]的护符#italic 可能#!保护[target_character_2.GetHerHim]免受疾病相关[events|e]与狩猎事故的伤害"
 target_character_3_is_declined_tt: "礼貌地拒绝了[target_character_3.GetName]的提议"
 hellenism_religion.5.title: "[target_province.GetNameWithNoTooltip]庆祝[target_god.GetNameWithNoTooltip]"
 hellenism_religion.5.desc: "来自[target_province.GetName]的喜讯传来，当地民众走上街头庆祝[target_god.GetName]。在前所未有的虔诚氛围中，人们自发举办庆典，赞颂近期的好运。\n\n在这一天，统治的重担也显得轻松。诸神受敬，民众喧腾，虔诚的祭献如同奥林匹斯山上的神馐般在全省流淌。"
 hellenism_religion.5.a: "让这个省份庆祝吧。"
 every_pop_in_target_province_gains_10_satisfaction_tt: "我们在[target_province.GetName]的[pops|e]会获得[ShowNamedValue('pop_satisfaction_mild_bonus')|+=2%][pop_satisfaction|e]"
 hellenism_religion.6.title: "光耀之日"
 hellenism_religion.6.desc: "在奥林匹斯诸神的虔诚指引下，[target_character.GetName]的统治达到了前所未有的高度。良政、财富共享，以及整体稳定和平的时期，皆是神祇赐予我们的恩典。这无疑是一个黄金时代，人民高呼[target_character.GetShortNameWithNoTooltip]之名，将[target_character.GetHerHim]与赫拉克勒斯、伯里克利等传奇人物并列铭记。"
 hellenism_religion.6.a: "让我们在盛世中专注行政事务！"
 hellenism_religion.6.b: "让我们的外交威望统御世界。"
 hellenism_religion.6.c: "碾碎我们的敌人！"
 hellenism_religion.7.title: "[ShowGodNameWithNoTooltip('ares_god')]的化身"
 hellenism_religion.7.desc: "烈焰、硫磺与血腥的呐喊伴随着[target_character.GetName]的征途。[target_character.GetHerHis]自幼便展现出战斗天赋，这位[target_character.GetWomanMan]屡次证明自己终结敌人的能力。\n\n[target_character.GetSheHe]如今被军队称为[ShowGodName('ares_god')]的化身，[target_character.GetHerHis]注定将为我们的[ROOT.GetCountry.GetFlavorRank]四处征战，掀起毁灭。"
 hellenism_religion.7.a: "[target_character.GetSheHe|U]深知，胜者乃是愿意牺牲一切之人。"
 hellenism_religion.7.b: "我们不能冒险释放如此灾难性的力量……"
 hellenism_religion.8.title: "[ShowCultureNameWithNoTooltip('greek_culture')]史诗"
 hellenism_religion.8.desc: "荷马史诗长期以来一直指引着文化与识字的发展，是我们传统的珍贵遗产。\n\n为纪念这一传承，[target_character.GetName]提出资助出版《伊利亚特》与《奥德赛》的研究与著作。[target_character.GetSheHe|U]希望在审视这些传奇篇章的同时，向我们辉煌的过去致敬。"
 hellenism_religion.8.a: "[ROOT.GetCountry.Custom('common_string_ok')]"
 hellenism_religion.8.b: "$jurchen_confederation_events.3.b$"
 hellenism_religion.9.title: "富饶的[target_province.GetNameWithNoTooltip]"
 hellenism_religion.9.desc: "显而易见，[target_province.GetName]正受诸神眷顾，全省繁荣日益增长。近期，勘探者与当地开发者提出计划，将财富集中于城市中心，而牺牲周边村庄。这将推动城市化，但也会剥夺当地居民的额外收益。"
 hellenism_religion.9.a: "财富属于人民！"
 hellenism_religion.9.b: "让我们集中力量发展。"
 pops_in_aforementioned_provinces_weak_satisfaction_tt: "我们在上述[provinces|e]的[pops|e]会获得[ShowNamedValue('pop_satisfaction_weak_bonus')|+=2%][pop_satisfaction|e]"
 hellenism_religion.10.title: "[ROOT.GetCountry.Custom('GetDemeterMomName')]的祝福"
 hellenism_religion.10.desc: "在相当长的一段时间里，[target_market.GetName]的粮仓一直丰盈充足。这无疑表明丰收女神[ROOT.GetCountry.Custom('GetDemeterMomName')]正在眷顾我们。我们新近获得的繁荣正是神恩的体现。当地民众纷纷请求分发多余的粮食，而祭司则建议再向神明献上额外贡品。"
 hellenism_religion.10.a: "分给人民。"
 hellenism_religion.10.b: "献给诸神。"
 Demeter_latin_name: "刻瑞斯"
 Demeter_base_name: "得墨忒耳"
 hellenism_religion.11.title: "[target_god.GetNameWithNoTooltip]不悦"
 hellenism_religion.11.desc: "在神祇无情的注视之下，看来[target_god.GetName]对我们极为不满！深夜的不祥征兆、挥之不去的阴影，以及愈发强烈的末日预感正在民间蔓延。我们不知何事触怒了这位强大的神祇，唯有谦卑俯首，方能重新赢得其神圣的垂青。"
 hellenism_religion.11.a: "世事无常。"
 hellenism_religion.11.b: "立即筹办盛大祭典。"
 hellenism_religion.12.title: "畸形之诞"
 hellenism_religion.12.desc: "[ROOT.GetCountry.GetGovernment.GetCourtTitle]内一片寂静。在[ROOT.GetCountry.GetGovernment.GetAdjective]宫邸的育婴室中，[target_character_1.GetName]的孩子在惶恐祈祷与不眠之夜中降生，此子仿佛携带着[target_character_2.GetHerHim]本身的厄运而来。\n\n[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]称之为征兆，仆人称之为诅咒，敌人则会称之为软弱。然而[target_character_2.GetShortName]仍在呼吸，这样的存在或许将决定我们血脉的命运……"
 hellenism_religion.12.a: "愚蠢！[target_character_2.GetShortNameWithNoTooltip]不过是个孩子！"
 hellenism_religion.12.b: "我们不能招致神怒。"
 hellenism_religion.13.title: "腐败的祭司"
 hellenism_religion.13.desc: "神祇或许永恒，但其侍者却是血肉之躯。有报告称[target_character.GetName]正将[target_character.GetHerHis]的神圣职务当作私囊，收受恩惠与金钱，本应只属于供奉之物却被其据为己有。\n\n若我们干预，[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]将怒斥这是羞辱；若我们视而不见，则是在教导我们[ROOT.GetCountry.GetFlavorRank]境内的所有阴谋者，虔诚的信仰不过是一门交易，甚至可能冒犯诸神本身。"
 hellenism_religion.13.a: "[target_character.GetHerHis|U]的贪婪将毁掉我们所有人！"
 hellenism_religion.13.b: "视而不见。"
 hellenism_religion.14.title: "[target_province.GetNameWithNoTooltip]忽视了[target_god.GetNameWithNoTooltip]"
 hellenism_religion.14.desc: "来自[target_province.GetName]的消息令人不安。[target_god.GetNameWithNoTooltip]的礼仪被忽视，祭献延误，信徒抱怨神庙之门不再如往常般开启。\n\n无论是懒惰、贫困，还是暗中的抗拒，其实都不重要。一旦传出神明被忽视的说法，一切不幸都会被归咎于神意。祭司要求采取行动，而[target_province.GetNameWithNoTooltip]正等待我们的裁决。"
 hellenism_religion.14.a: "以强制手段征收祭献。"
 hellenism_religion.14.b: "我们不会以鞭子统治。"
 pops_in_target_province_mild_pop_satisfaction_malus_tt: "我们在[target_province.GetName]的[pops|e]会获得[ShowNamedValue('pop_satisfaction_mild_penalty')|+=2%][pop_satisfaction|e]"
 riots_destroy_temple_desc: "人群变得暴烈，神殿成为攻击目标。黎明时，只剩焦黑的石块。"
 riots_cause_minimal_damage_desc: "街头骚动不断，但最坏的情况得以避免。"
 hellenism_religion.15.title: "占兆之争"
 hellenism_religion.15.desc: "[ShowGodName('zeus_god')]的胡子啊，占卜师们竟然争吵不休！同样的征兆，却得出截然不同的预言，而且都言之凿凿。\n\n[ROOT.GetCountry.GetGovernment.GetCourtTitle]陷入两难。若我们的[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]如此分裂，世人将如何看待我们？我们是否已迷失方向？无论如何解读这些征兆，其结果终将降临于我们……"
 hellenism_religion.15.a: "我们厌倦了这些老人的喋喋不休！"
 hellenism_religion.16.title: "诸神之怒"
 hellenism_religion.16.desc: "宫廷内爆发争执，祭司坚称诸神正在注视。他们指向我们分散的疆域、对远方控制的薄弱，并低语傲慢将招致神罚。\n\n若诸神要提醒我们的脆弱，他们不会发来礼貌的信件，而会降下风暴、烈火与恐惧，并选择最痛之处打击我们。"
 hellenism_religion.16.a: "愿风暴尽快过去。"
 hellenism_religion.17.title: "潘多拉之盒"
 hellenism_religion.17.desc: "一件奇异之物传入[target_province.GetName]，在人们之间流转，伴随着心照不宣的笑意与愚蠢的挑战。有人说它无害，也有人坚称它带来厄运，会诱惑无知者并惩罚傲慢者。\n\n无论它是否真被诅咒，只要足够多人相信，不幸便会成为现实。一些当地祭司甚至报告，这个盒子上有一张痛苦扭曲、血红覆盖的人脸。"
 hellenism_religion.17.a: "我们不在乎迷信。"
 hellenism_religion.17.b: "付钱将其封存。"
 locations_and_pops_in_target_province_suffer_minimal_damage_tt: "[target_province.GetName]及当地居民将免受神罚"
 hellenism_religion.18.title: "至暗之夜"
 hellenism_religion.18.desc: "夜晚仿佛被拉长。在[ROOT.GetCountry.GetFlavorRank]的各个角落，人们谈论起毁灭、饥荒、失败以及诸神对我们的厌弃。显然我们正处于动荡时期，无论是因自身失误，还是触怒了奥林匹斯诸神。\n\n[ROOT.GetCountry.GetGovernment.GetRulerOrRegent.GetName]无法摆脱这些低语。当根基动摇，即便最坚固的王冠也会变得沉重。"
 hellenism_religion.18.a: "我们已陷入绝望。"
 hellenism_religion.18.b: "那就献祭吧，愿诸神倾听。"
 hellenism_religion.19.title: "恐惧与饥荒"
 hellenism_religion.19.desc: "恐慌比瘟疫传播得更快。一处歉收，一次离奇灾祸，顷刻间人人都成了带来凶兆的预言者。尽管我们竭力安抚民众，但似乎只需累积足够多的坏征兆，便能让整个社区陷入恐慌。\n\n祭司认为必须引导这种恐惧，否则它将演变为反抗。[target_province.GetName]的人民向我们寻求确定性，即便这种确定性需要付出代价。"
 hellenism_religion.19.a: "让土地承担代价。"
 hellenism_religion.19.b: "进行安抚，减轻冲击。"
 sacrifice_to_the_gods: "安抚诸神"
 hellenism_religion.20.title: "诸神不认可战争"
 hellenism_religion.20.desc: "并非所有神祇都喜爱杀戮。随着[target_war.GetName]的持续，祭司警告诸神对我们的事业愈发冷淡。不同于[ShowGodName('ares_god')]，其他神并不会认可所有战争。\n\n士兵或许仍为军旗欢呼，但民众已疲惫，每一份苦难都被归因于神怒。在这种时候，即便胜利也像惩罚，一条漫长而不确定的终点……"
 hellenism_religion.20.a: "我们将忍受他们的不悦。"
 hellenism_religion.21.title: "[target_location.GetNameWithNoTooltip]忽视礼仪"
 hellenism_religion.21.desc: "安逸或繁荣之时，人们忽视神祇并不罕见。在[target_location.GetName]，祭典的礼仪变得敷衍。游行队伍缩减，供品减少，古老的歌曲也唱得很不用心。\n\n祭司要求杀鸡儆猴。若城市不愿自发敬神，也许恐惧能教会虔诚。无论如何，我们不能让信仰衰败。"
 hellenism_religion.21.a: "给平民长长记性。"
 hellenism_religion.21.b: "上层过得太安逸了。"
 hellenism_religion.21.c: "任其发展，承担风险。"
 pops_go_unpunished_gods_angry_tt: "缺乏惩罚必将激怒诸神"
 hellenism_religion.22.title: "首都的鸟占术"
 hellenism_religion.22.desc: "[target_character.GetName]成为首都热议人物。尽管[target_character.GetHerHis]装束古怪，[target_character.GetSheHe]却自称能洞察未来。凭借鸟类、骨骼与笃定语气，[target_character.GetSheHe]宣称能够解读神意。\n\n[ROOT.GetCountry.GetGovernment.GetCourtTitle]中有人嘲笑，也有人暗中付钱，希望即便荒谬的征兆也可能有用。"
 hellenism_religion.22.a: "尽管叫吧，[target_character.GetShortNameWithNoTooltip]！"
 hellenism_religion.22.b: "这是耻辱。"
 birds_divinations_come_true_desc: "征兆契合，幸运随之而来。[ROOT.GetCountry.GetGovernment.GetCourtTitle]将其视为证明。"
 the_divinations_lie_desc: "毫无结果。鸟依旧是鸟，[ROOT.GetCountry.GetGovernment.GetCourtTitle]依旧不满。"
 hellenism_religion.23.title: "宗教用地扩建"
 hellenism_religion.23.desc: "祭司提出了一项雄心勃勃的计划，欲重塑神圣之地。[target_location.GetName]的神殿将被扩建，扩大殿宇内部空间，并装点庭院，以让信徒重新感受神的威严。\n\n然而石料不会自行移动，工匠也不会只靠祈祷工作。无论投入资金还是强征民力，代价都将显现，而诸神也会留意我们付出的方式。"
 hellenism_religion.23.a: "出资扩建。"
 hellenism_religion.23.b: "让人民承受负担。"
 hellenism_religion.24.title: "迷信恐惧"
 hellenism_religion.24.desc: "不安在[ROOT.GetCountry.GetGovernment.GetCourtTitle]蔓延，并尤其笼罩着[target_character.GetName]。小征兆被放大为大预兆，梦境成为警告，甚至巧合也被视为神意。\n\n这种恐惧既可能带来谨慎，也可能腐蚀行动意志。若[target_character.GetShortNameWithNoTooltip]无法摆脱，我们的统治或将被迷信而非理性主导。"
 hellenism_religion.24.a: "谨慎胜于轻率。"
 hellenism_religion.24.b: "我们不能拘泥于迷信。"
 hellenism_religion.25.title: "为战争献祭"
 hellenism_religion.25.desc: "战争吞噬一切，即便最坚强的士兵也会仰望天空。祭司坚称[target_war.GetName]的胜负不只取决于武力，必须取悦诸神。\n\n他们提议进行昂贵的祭祀，以打动神明并鼓舞民心。若拒绝，我们虽可节省金钱，却可能让疑虑滋生，让诸神只能听到我们的沉默。"
 hellenism_religion.25.a: "不惜代价。"
 hellenism_religion.25.b: "不需要他们的戏份我们也能赢。"
 we_will_win_the_ongoing_conflict_without_gods_tt: "我们不会依赖迷信神明赢得战争"
 hellenism_religion.26.title: "[target_god.GetNameWithNoTooltip]俯听我们的祈求"
 hellenism_religion.26.desc: "香火鼎盛，赞歌回荡，祭坛供品充足。祭司称我们的虔诚已传至奥林波斯，诸神如今近在咫尺。\n\n然而神恩从来不是无条件的慷慨。若我们请求祝福，就必须接受[target_god.GetName]的要求，而回应可能以我们难以预料的方式改变[ROOT.GetCountry.GetFlavorRank]的命运。"
 hellenism_religion.26.a: "让[target_god.GetNameWithNoTooltip]回应。"
 hellenism_religion.26.b: "我们不邀请他们审判。"
 gods_reward_our_piety_tt: "[target_god.GetName]以[gold|e]奖励我们的虔诚"
 gods_imbue_stability_tt: "[target_god.GetName]的恩宠提高了我们的[stability|e]"
 gods_sent_capable_character_tt: "通过[target_character_2.GetName]，[target_god.GetName]将显现"
 hellenism_religion.27.title: "哲学家悖论"
 hellenism_religion.27.desc: "牙尖嘴利的哲学家[target_character.GetName]开始在[ROOT.GetCountry.GetGovernment.GetCourtTitle]内发言，每句话都将确凿之事化为怀疑。廷臣们聚集起来倾听，半是取乐，半是不安，就连最朴素的真理也被他抽丝剥茧一一驳斥。\n\n智慧固然是馈赠，可若不肯屈就，亦能成为烦恼。若我们纵容这位思想者，[ROOT.GetCountry.GetGovernment.GetCourtTitle]或许会更加明智，也可能会变得躁动不安——毕竟，思想向来有蔓延的习性，从不甘于久居殿堂。"
 hellenism_religion.27.a: "让讨论继续。"
 hellenism_religion.27.b: "够了，把[target_character.GetHerHim]赶走。"
 hellenism_religion.28.title: "[ShowGodNameWithNoTooltip('athena_god')]的智慧"
 hellenism_religion.28.desc: "在和平时期，野心退却，审慎抬头，祭司常提及[ShowGodName('athena_god')]。他他们坚称，智慧不仅是一种美德，更是一件武器，且唯有在[ROOT.GetCountry.GetFlavorRank]不为战事所扰时，方能锻造得最为精良。\n\n而今，有一项提案摆在我们面前，耗费颇巨，却合情合理；它承诺在铺张之处建立秩序，在疑云密布之处带来明晰。倘若我们拒绝，或许能保全钱币，但[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]不会忘记，是我们自己拒绝了女神的箴言。。"
 hellenism_religion.28.a: "支付智慧的代价。"
 hellenism_religion.28.b: "我们无需女神替我们思考。"
 because_athena_omen_active_desc: "由于当前存在[ShowGodName('athena_god')]的[omen|e]，效果随[religious_unity|e]增减"
 if_athena_omen_was_active_tt: "如果当前存在[ShowGodName('athena_god')]的[omen|e]，该[event_option|e]的增益会加强"
 our_denial_angers_the_clergy_tt: "我们的拒绝无疑会激怒[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]"
 hellenism_religion.29.title: "[target_god.GetNameWithNoTooltip]要求献祭"
 hellenism_religion.29.desc: "祭司们面色凝重地到来，言辞迫切，坚称神明的不悦笼罩着我们的[ROOT.GetCountry.GetFlavorRank]。他们声称征兆已然清晰，唯有向[target_god.GetName]献祭，方能在灾祸降临前重获眷顾。\n\n金钱是最简单的供奉，自可毫不犹豫地奉上，然而神明鲜少仅因钱币而满足。若我们选择更为贵重的祭品，或许能赢得更多恩宠，却也会在这片土地上留下伤痕，而百姓将铭记是何人下达了此令。"
 hellenism_religion.29.a: "献上黄金。"
 hellenism_religion.29.b: "让这片土地承受这份重担。"
 hellenism_religion.29.c: "拒绝此要求。"
 hellenism_religion.30.title: "佣兵教派"
 hellenism_religion.30.desc: "在[target_province.GetName]，旅人带来的奇怪消息经由紧张的本地人之口传开。一个教派已在阴影中成形，信奉力量至上的佣兵之道，通过秘密仪式与庇护的承诺聚集追随者。其重要人物之一，[target_character.GetName]，以昔日密修者的身份走上前台，渴望进入我们[ROOT.GetCountry.GetFlavorRank]的政治舞台为他们代言，声称他们的忠诚可转为我们的优势。\n\n然而，阴影中的低语泄露了该教派暗藏的统治野心——一种对权力永不满足的渴求。若我们接纳他们，或许能在信仰薄弱之处获得影响，却也可能会将隐秘的腐化引入我们[ROOT.GetCountry.GetGovernment.GetCourtTitle]的腹地。"
 hellenism_religion.30.a: "接纳他们，并严加监视。"
 hellenism_religion.30.b: "将他们驱赶回阴影中。"
 cult_operates_shadows_tt: "该教派将继续在暗中活动……"
 hellenism_religion.empty: ""
 # Neoplatonism Events
 hellenism_religion.32.title: "万有本源"
 hellenism_religion.32.desc: "[ROOT.GetCountry.GetGovernment.GetCourtTitle]之中一位哲人完成了一部野心卓绝的著作。其行文克制而坚定，[target_character.GetSheHe]提出：第一本源——诸神与万物如同自无尽旭日散发光辉一般向外流溢的源头 ——并非诸神之一，而是神性本身的根基。[target_character.GetSheHe]坚称，传统万神殿依旧真实存在，但每一位神祇，都是那不可言说唯一本源的一种显现、一次流溢：秩序化为智性，智性化为灵魂，灵魂化为物质。\n\n这部论著已在[ROOT.GetCountry.GetGovernment.GetCourtTitle]各处传抄。其思想已然生根，无论我们采取何种行动，都必将广为传播。"
 hellenism_religion.32.a: "下令抄录，广为传播。"
 hellenism_religion.32.b: "任其思想自行流传发展。"
 hellenism_religion.33.title: "基督教议题"
 hellenism_religion.33.desc: "一位学识渊博的主教抵达[ROOT.GetCountry.GetGovernment.GetCourtTitle]，[target_character.GetHerHis]未携刀剑、亦无怨恨——仅带着诸多疑问。[target_character.GetName]毕生钻研柏拉图哲学，并沉稳坚定地主张：基督教的上帝，与哲人们所言的第一本源，乃是同一存在。[target_character.GetSheHe]认为，基督教三位一体，不过是太一、智性、灵魂这三重本源，改换措辞后的另一种表述。\n\n这一论点颇具说服力，[target_character.GetSheHe]言辞从容审慎，早已熟知一切反驳论调。无论我们选择交流还是拒绝，此次到访，[target_character.GetHerHis]都将在[ROOT.GetCountry.GetCapitalName]乃至远方各地都将引人注目。"
 hellenism_religion.33.a: "欢迎对话交流。思想并非疫病。"
 hellenism_religion.33.b: "拒绝等同论。第一本源并非他们的上帝。"
 hellenism_religion.34.title: "世界灵魂"
 hellenism_religion.34.desc: "[ROOT.GetCountry.GetGovernment.GetCourtTitle]哲人一直在探讨世界灵魂——这是第一本源的流溢之物，贯穿一切生灵造物，赋予原野、河流、躯体与气息以生命。他们认为，两位至高神祇不应被理解为海洋与苍穹的统治者，而应是这一灵魂的一体两面：穿行万物、并始终回归本源的力量。\n\n在四季和顺的[target_province.GetName]，民众发自内心认同这一学说。大地丰饶富足，哲人言道，这便是可见的天道神意——世界灵魂与太一和谐相融的体现。"
 hellenism_religion.34.a: "委任大地守护教化工作。照料大地即是守护灵魂。"
 hellenism_religion.34.b: "颁布神学宣言，将此教义明文立典。"
 hellenism_religion_34_work_of_art: "《宇宙灵魂》"
 hellenism_religion_34_work_of_art_desc: "一部柏拉图哲学神学研究著作，主张世界灵魂是一切生灵的生命本源，贯通自然万物，并最终复归于太一本源。"
 hellenism_religion.35.title: "灵魂升扬"
 hellenism_religion.35.desc: "[ROOT.GetCountry.GetGovernment.GetCourtTitle]传来噩耗：那位思想潜移默化影响整整一代人的哲人，[target_character.GetName]行将离世。临终最后数周，[target_character.GetSheHe]仍不间断讲学——不依托典籍，而是凭借直观沉思，以严谨言辞阐述灵魂升扬三境：第一境，灵魂超脱物质羁绊；第二境，理性官能与智性相合归一；最终境——[target_character.GetHerHis]的语声降至近乎呢喃——灵魂与太一本身融为一体，超越一切思虑，超越一切存在。\n\n统治者受邀亲临见证。[target_character.GetName]临行前的唯一心愿，便是不让这份教义就此消亡。"
 hellenism_religion.35.a: "记录并广为传布[target_character.GetHerHis]的临终遗教。"
 hellenism_religion.35.b: "以其名建立哲学院校。"
 target_character_ascends_to_the_one_tt: "[target_character.GetName]安然辞世，尽述毕生奥义"
 hellenism_religion.36.title: "奥林匹斯复旧派"
 hellenism_religion.36.desc: "[ROOT.GetCountry.GetFlavorRank]境内并非所有人都接纳这套新生神学。由[target_character.GetName]公开领导的[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]阶层，反对声浪日渐高涨。他们的主张朴素直白，发自本心而非理性思辨：民众需要宙斯、雅典娜、阿瑞斯与波塞冬。不要象征符号，不要本源流溢，不要那不可命名、不可祈愿、不可取悦的抽象太一之显现。民众需要真正的奥林匹斯诸神——拥有神容、拥有神殿、渴求献祭的古老诸神。\n\n[target_character.GetSheHe]宣称：抽象的太一无法听闻世人祈祷，唯有古老诸神可以。[target_character.GetName]公开请愿废除太一论教义，回归传统奥林匹斯祭祀信仰。"
 hellenism_religion.36.a: "捍卫太一教义，压制该派系。"
 hellenism_religion.36.b: "准许公开神学辩论，令双方各陈主张。"
 hellenism_religion.36.c: "废除太一论教义，回归奥林匹斯正统信仰。"
