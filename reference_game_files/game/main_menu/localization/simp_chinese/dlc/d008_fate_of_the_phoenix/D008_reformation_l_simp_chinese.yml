l_simp_chinese:
 contact_patriarch_of_constantinople: "联系君士坦丁堡牧首"
 contact_patriarch_of_constantinople_desc: "派遣梅兰希通前往君士坦丁堡，递交我方信仰告白，开启与[ShowReligionAdjective('orthodox')]牧首区的对话渠道。"
 reformation.17.title: "[GetCharacter('reformer_philip_melanchton').GetLastNameWithNoTooltip]致君士坦丁堡书函"
 reformation.17.desc: "我国首要神学家[melanchthon.GetName]提出一项大胆计划：派遣使节携我方信仰告白，觐见君士坦丁堡牧首。[ShowReligionAdjective('orthodox')]与[ShowReligionAdjective('lutheran')]信仰虽在诸多教义上存在分歧，但二者共同反对教宗至上权威。牧首或愿意接纳同为罗马反对者伸出的橄榄枝。"
 reformation.17.a: "派遣[GetCharacter('reformer_philip_melanchton').GetLastNameWithNoTooltip]携我方信仰告白出使"
 reformation.17.b: "当下并非发起此类接触的时机。"
 reformation.17.historical_info: "菲利普·梅兰希通（1497–1560），路德最亲密的合作者，1530年《奥格斯堡信仰告白》作者。他长期将东方教会视作对抗罗马的潜在盟友，其与希腊学者的通信，为后世路德宗向君士坦丁堡遣使交涉奠定基础。1573年，蒂宾根神学家将希腊语译本《信仰告白》送至耶利米二世牧首处，开启宗教改革时代路德宗与东正教之间持续最久的神学交流之一。"
 reformation.18.title: "路德宗改革者来函"
 reformation.18.desc: "[lutheran_country.GetLongName]代表团抵达君士坦丁堡，携带来一份神学论著——他们的《信仰告白》。[ShowReligionAdjective('lutheran')]改革者意图与我方牧首区展开对话，并以双方共同反对罗马主教为由作为依据。其意图究竟真诚无私还是利己谋私，尚待观察。"
 reformation.18.a: "谨慎与改革者开展神学对话。"
 reformation.18.b: "他们是异端，将其驱逐出境。"
 reformation.18.historical_info: "即便在1453年奥斯曼帝国征服之后，君士坦丁堡大公牧首区依旧对东正教基督徒保有属灵上的权威。耶利米二世牧首（在位期间为1572至1595年）以其渊博的学识著称，曾认真回复蒂宾根神学家的来信，并于1576年至1581年间接连作出三份详尽的答复。他反对路德宗关于因信称义、自由意志以及圣子流出的教义，但同时也认可对方问询的诚意。这种态度使其回复不同于简单的直接驳回，更显得平和与审慎。"
 reformation.19.title: "牧首饶有兴致地作出回应"
 reformation.19.desc: "牧首以十分审慎而又好奇的态度回应了我方使节到访。双方虽未达成任何教义共识，但此次交流打通了君士坦丁堡与我国国教会之间的沟通渠道，是[ShowReligionAdjective('lutheran')]世界与[ShowReligionAdjective('orthodox')]世界走向理解的微小却意义重大的一步。"
 reformation.19.a: "桥梁纵使狭窄，也好过毫无联系。"
 reformation.19.historical_info: "蒂宾根通信被视作早期大公对话的里程碑。耶利米二世牧首三份答复（于1576、1579、1581三年）在反对路德宗核心主张的同时，仍对其神学进行严肃探讨。牧首以详尽教父论据逐条回应唯独信心、自由意志、圣子流出等议题，体现了奥斯曼统治时期牧首区的思想活力。双方均妥善保存了全部通信文献。"
 reformation.20.title: "牧首遣返代表团"
 reformation.20.desc: "我方代表团在君士坦丁堡受到冷遇。牧首将我方信仰告白斥为另一类异端，我方使节未经礼遇便被遣返。这一事例警醒世人：[ShowReligionName('lutheran')]信仰独立于罗马，亦独立于君士坦丁堡。"
 reformation.20.a: "我们的信仰无需任何牧首区认可。"
 reformation.20.historical_info: "蒂宾根通信最终未能实现教义上的统一。耶利米二世牧首先后三次作出答复（于1576、1579、1581三年），均明确反对路德宗所主张的“唯独信心”、“唯独圣经”以及“圣子流出”等观点，并坚定表示东正教无法接受其所认定的种种革新。路德宗方面最终认为继续通信已无意义，遂于1581年终止了这一交流。"
 reformation.21.title: "东正教学者到访"
 reformation.21.desc: "我方与君士坦丁堡之间的通信意外取得了成果。[ShowReligionAdjective('orthodox')]学者[orthodox_scholar.GetName]抵达我方宫廷，期望延续由我方使节开启的神学交流。此次访问极具敏感性：若过于热情地款待，将会激怒本国的教士阶层；而若断然拒绝，则会损害我们在君士坦丁堡所建立的善意。"
 reformation.21.a: "安排长期学术交流。"
 reformation.21.b: "礼貌致谢，但拒绝进一步交流。"
 reformation.21.historical_info: "尽管蒂宾根通信未能实现教义合一，却在双方学界引发广泛关注。希腊东正教知识分子加深了对路德宗神学的了解，路德宗学者也更深入认识教父文献与东方基督教传统。这种跨教派交流推动了欧洲人文主义发展，使其将古希腊基督教视作独立于罗马之外的思想资源。"
