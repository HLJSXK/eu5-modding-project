l_simp_chinese:
 a_legionaries_1: "早期军团士兵"
 a_legionaries_1_desc: "$a_legionaries_1$秉承着最古老的操练与纪律传统。长矛、宽盾与坚定的凝聚力使他们即使身处战局变幻也能巍然不动。"
 a_legionaries_2: "军团士兵"
 a_legionaries_2_desc: "军团士兵精通近身格斗的精妙技艺，配备投枪与短剑。他们的力量源于稳固的阵型以及刻苦不懈的军事文化。"
 a_legionaries_3: "改良军团士兵"
 a_legionaries_3_desc: "$a_legionaries_3$是久经战阵的步兵，配备最精良的盔甲与武器，构成我们军队的核心。"
 a_legionaries_4: "重型军团士兵"
 a_legionaries_4_desc: "$a_legionaries_4$是优中选优的步兵，装备最精良的盔甲与武器。如同古罗马的重装军团，这些部队将成为我们粉碎敌人的铁锤。"
 a_legionaries_5: "近卫军团士兵"
 a_legionaries_5_desc: "$a_legionaries_5$体现了军团内部士兵的最高标准。他们从最优秀的队伍中选拔而出，被委以关键任务并负责保卫国家最高机构。"
 a_legionaries_6: "帝国军团士兵"
 a_legionaries_6_desc: "这些$a_legionaries_6$伫立于数百年军事演变的顶点。他们既是装备的大师，也是战术的大师，效命于近卫军，其存在本身便能稳定动摇的战线。"
 a_byzantine_cataphracts_2: "中古晚期全覆装甲骑兵"
 a_byzantine_cataphracts_2_desc: "$a_byzantine_cataphracts_2$是人马皆披锁甲的重装骑兵，手持长枪，高举坚盾，以雷霆万钧之势冲入战场。其毁灭性的冲锋与钢铁般的纪律对我们的敌人而言是骇人的景象。"
 a_byzantine_cataphracts_3: "改良全覆装甲骑兵"
 a_byzantine_cataphracts_3_desc: "$a_byzantine_cataphracts_3$将古老的帝国操典与较新的战术相结合，融长枪、弓箭与副武器于一体。他们作为一支灵活的重骑兵部队作战，能够远程袭扰，继而近身歼灭敌军。"
 a_byzantine_cataphracts_4: "重型全覆装甲骑兵"
 a_byzantine_cataphracts_4_desc: "$a_byzantine_cataphracts_4$身披多层铠甲，足以偏转大多数箭矢与兵刃。他们组成精锐战士的楔形阵，以连续冲锋撕裂敌军阵线，鲜有部队能够承受其攻势。"
 a_byzantine_cataphracts_5: "近卫全覆装甲骑兵"
 a_byzantine_cataphracts_5_desc: "$a_byzantine_cataphracts_5$从最精锐的枪骑兵中遴选而出，担任御座与都城的骑兵卫队。他们出现在每一场战斗中，既是一种武器，也是一个象征，能够凝聚我军士气并震慑敌人。"
 a_byzantine_cataphracts_6: "帝国全覆装甲骑兵"
 a_byzantine_cataphracts_6_desc: "$a_byzantine_cataphracts_6$是数百年骑兵传统的集大成者：他们是身披重甲的百战老兵，坐骑神骏，训练臻于完美。他们担任皇帝的贴身卫队，一次时机恰当的冲锋便能决定战役的胜负。"
 n_greek_fire_galley_renaissance: "火战船"
 n_greek_fire_galley_renaissance_desc: "这些舰船配备了用于施放希腊火的特殊喷管，能在敌舰上燃起一片火海，顷刻间将其化为灰烬。在近距离内，它们带来的唯有毁灭。"
 n_greek_fire_galley_discovery: "改良火战船"
 n_greek_fire_galley_discovery_desc: "希腊火喷射系统适配于更新型的舰船，使其得以继续将敌人的船只化为灰烬，并始终作为我们整个海军的象征。"
 a_greek_fire_renaissance_infantry: "喷火兵"
 a_greek_fire_renaissance_infantry_desc: "不仅舰船能从希腊火中受益，我们的步兵部队也能配备手持装置，向敌人喷射这种燃烧物质。火焰与毁灭将劈开敌人的队列，为我们的前进铺平道路。"
 a_greek_fire_discovery_infantry: "改良喷火兵"
 a_greek_fire_discovery_infantry_desc: "尽管军队与战术不断演变，但用火焰覆盖敌人并将其点燃，依然是一种有效的战斗方式。因此，希腊火继续存在于我们的军队中，并持续为我们的对手所畏惧。"
