l_simp_chinese:
 spread_philhellenism: "推广亲希腊主义"
 spread_philhellenism_desc: "通过推广[ShowCultureGroupName('greek_group')]文化的学术、艺术与哲学成就，我们致力于重塑国内外对国家形象的认知。学者、艺术家与[ShowCultureName('greek_culture')]文化的仰慕者纷至沓来，他们汇聚于此并非畏于强权，而是倾慕文化，从而增强了我们的威望与影响力。"
 spread_philhellenism_action: "$spread_philhellenism$"
 spread_philhellenism_active: "正在推广亲希腊主义"
 spread_philhellenism_action_progress: "[SCOPE.sCountry('actor').GetModifierValue('research_speed_modifier')]"
 spread_philhellenism_action_progress_wordier: "[SCOPE.sCountry('actor').GetModifierValue('research_speed_modifier')]"
 spread_philhellenism_action_progress_tooltip: "[research_progress|e]：[SCOPE.sCountry('actor').GetModifierValue('research_speed_modifier')]\n\n[cultural_influence|e]：[SCOPE.sCountry('actor').GetModifierValue('cultural_influence_modifier')]"
 spread_philhellenism_action_progress_long_wordier: "@research_progress![SCOPE.sCountry('actor').GetModifierValue('research_speed_modifier')]\n\n@cultural_influence![SCOPE.sCountry('actor').GetModifierValue('cultural_influence_modifier')]"
 encourage_latin_militarism: "鼓励拉丁军国主义"
 encourage_latin_militarism_desc: "我们将把我们的国家与拉丁式有序战争的理念紧密结合：严格执行军令、统一操练规范、将武装戍守的职责化为日常。这般军纪必将降低野战驻军的开销，并培育出职业化的服役传统。"
 encourage_latin_militarism_action: "鼓励拉丁军国主义"
 encourage_latin_militarism_active: "正在鼓励拉丁军国主义"
 encourage_latin_militarism_action_progress: "[SCOPE.sCountry('actor').GetModifierValue('army_maintenance_efficiency')]"
 encourage_latin_militarism_action_progress_wordier: "[army_maintenance|e]：[SCOPE.sCountry('actor').GetModifierValue('army_maintenance_efficiency')]"
 encourage_latin_militarism_action_progress_long_wordier: "@army_maintenance![SCOPE.sCountry('actor').GetModifierValue('army_maintenance_efficiency')]\n\n@army_tradition![SCOPE.sCountry('actor').GetModifierValue('monthly_army_tradition')]"
 encourage_latin_militarism_action_progress_tooltip: "[army_maintenance|e]：[SCOPE.sCountry('actor').GetModifierValue('army_maintenance_efficiency')]\n\n[army_tradition|e]：[SCOPE.sCountry('actor').GetModifierValue('monthly_army_tradition')]"
 AUTO_MODIFIER_NAME_bureaucracy_nomos_empsychos_high_legitimacy: "$nomos_empsychos_bureaucracy$"
 AUTO_MODIFIER_NAME_bureaucracy_nomos_empsychos_low_legitimacy: "$nomos_empsychos_bureaucracy$"
 cb_restore_roman_borders: "恢复$ROM_ADJ$疆界"
 cb_restore_roman_borders_desc: "旧帝国的荣光在召唤我们。凤凰是时候展开羽翼，毁灭胆敢阻挠我们恢复旧[ShowScriptedGeographyName('roman_borders_geography')]的一切敌人了。"
 roman_borders_geography: "$ROM_ADJ$疆界"
 epic_hellenic_history: "古希腊史诗"
 epic_hellenic_history_desc: "一部重述古希腊世界辉煌历史的巨著，以金箔书页装帧，配以精美书法。这件艺术珍品见证了我们的富庶，也彰显了我们引以为傲的伟大先祖。这部编年史收录了诸多传奇故事，包括特洛伊陷落与英雄阿喀琉斯殒命、传奇英雄奥德修斯的漂泊历险，以及伊阿宋与阿尔戈英雄们的远航探险等篇章。"
 nomos_empsychos_bureaucracy: "在世之法"
 nomos_empsychos_bureaucracy_desc: "这一理念源自古希腊#italic “活在世间的法律”#!之概念，即是指皇帝本人构成帝国行政体系的根本基石，是主权权威的人格化身。该原则最早由查士丁尼时期确立，将立法、司法与军事统帅权集于君主一身，使统治者居于罗马国家的核心。"
 honorary_titles_bureaucracy: "荣誉官衔"
 honorary_titles_bureaucracy_desc: "从#italic 贵族官#! 、#italic 代执政官#!，到#italic 重臣官#!、#italic 宫廷总管#!，我们的宫廷以尊严荣衔而非强制命令驾驭群臣的野心。\n\n这套围绕品级荣典、锦缎服饰与特权授予构建的精密体系，使皇帝能够通过犒赏忠诚笼络将领、元老与行省精英，化解权斗倾轧，将声望本身化为统治工具。"
 court_eunuchs_bureaucracy: "宫廷宦官"
 court_eunuchs_bureaucracy_desc: "受过良好教育、忠诚可靠且无谋朝篡位之念的宫廷宦官，构成了值得信赖的行政骨干。他们亲近皇帝、远离家族势力纠葛，是执掌宫廷事务、财政管理与帝国文书往来的理想人选。"
 ritualistic_court_bureaucracy: "礼仪宫廷"
 ritualistic_court_bureaucracy_desc: "礼仪，是权威的具象化彰显。通过规整的仪轨、森严的位次与盛大的朝典，皇宫将统治权化为神圣的政治展演，既在国内厘清等级秩序，又以这座被视为文明世界中心的伟大帝都的无上威仪，震慑外国使节。"
 sixty_books_of_the_basilika_bureaucracy: "巴西利卡法典"
 HAS_SIXTY_BOOKS_OF_THE_BASILIKA_TRIGGER: "有$sixty_books_of_the_basilika_bureaucracy$"
 THIRD_HAS_SIXTY_BOOKS_OF_THE_BASILIKA_TRIGGER: "有$sixty_books_of_the_basilika_bureaucracy$"
 FATE_OF_THE_PHOENIX_DISASTER_ACTIVE_TRIGGER: "$fate_of_the_phoenix$[disaster|e]正在发生"
 THIRD_FATE_OF_THE_PHOENIX_DISASTER_ACTIVE_TRIGGER: "$fate_of_the_phoenix$[disaster|e]正在发生"
 sixty_books_basilika_satisfaction_scale_tt: "农民[estate_satisfaction|e]惩罚随$sixty_books_of_the_basilika_bureaucracy$维护费比例变动。（全额维护时为#R -5%#!，零维护时为#R -20%#!）"
 sixty_books_of_the_basilika_bureaucracy_desc: "在查士丁尼大帝#italic 《民法大全》#!的基础上，《$sixty_books_of_the_basilika_bureaucracy$》六十卷将罗马法整合为一套体系完整的[ShowLanguageName('greek_language')]法律汇编。通过对数百年法学成果的梳理、统一与调和，使皇帝律法具备无可争议的权威性与普适性。"
 romanitas_bureaucracy: "罗马传承"
 romanitas_bureaucracy_desc: "$romanitas_bureaucracy$承载着一脉未断的罗马国祚。皇帝的统治并非依靠征服或族群身份，而是作为可追溯至千年之前的权威、律法与传统的合法继承者。这一身份认同将帝国与信仰紧密联结，彰显罗马统治的神授正当性与道德至上性。"
 imperial_senate_bureaucracy: "帝国元老院"
 imperial_senate_bureaucracy_desc: "由皇权任命的资深显贵组成，元老院作为拥戴与咨议机构存在。其认可赋予统治、继承及重大国策合法性，在维系罗马法统延续的同时，确保主权牢牢掌握在皇帝手中。"
 kephalai_bureaucracy: "法令集成"
 kephalai_bureaucracy_desc: "#italic 《法令集成》#!是为落实帝国治理而编纂的行政与法律纲要。它取代了#italic 首领辖区#!等旧式地方建制，将律法、税收与军事义务提炼为标准化政令，保障帝国在各行省施行统一统治。"
 won_fate_of_the_phoenix_disaster_tt: "我们已经成功渡过了[ShowDisasterName('D008_fate_of_the_phoenix')][disaster|e]"
 magister_militum_bureaucracy: "统帅府"
 magister_militum_bureaucracy_desc: "#italic 统帅府#!是帝国军队的制度化指挥机构。将领由官僚体系任免、轮换并加以制衡，确保军权服务于国家而非个人野心。战争由此成为一项行政职能，以等级秩序而非个人效忠为准则，同时保证唯有贤能者方能身居高位。"
 has_unlocked_bureaucracy_via_flavor_byz_31_tt: "我们已通过“$flavor_byz.31.title$”[event|e]解锁了该[bureaucracy|e]，该事件可在#Y 1400年#!后触发，并有以下触发条件：\n\n[ShowTriggerConditions('flavor_byz.31',PlayerScope.Self)]"
 themata_bureaucracy: "军区"
 themata_bureaucracy_desc: "为应对生死存亡的外部压力而设立，一个个#italic 军区#!将帝国划分为行省化的军政辖区。每个军区由一名#italic 将军#!统领，统合民政与军事权力，既能实现地方快速防御，又在制度上隶属于帝国中央统辖。"
 allelengyon_bureaucracy: "联保税制"
 allelengyon_bureaucracy_desc: "该制度最早由皇帝巴西尔二世，#italic “保加利亚屠夫”#!所创立，名称源自[ShowLanguageName('greek_language')]词汇#italic “互助联保”#!。#italic $allelengyon_bureaucracy$#!是一项税收义务，旨在重新分配财政负担：当自耕农无力缴纳税款时，法律将责任转嫁至辖区内更富有的土地所有者，既保障帝国财政收入，又防止农民土地破产并被兼并。以此，财政联保成为维系稳定与管控的杠杆。"
 katepanata: "大督军区"
 katepanata_desc: "应对好战邻邦的对策，是以强硬军事权威巩固新征服领土。$katepanata$名称源自拉丁语词汇#italic “居于上位者”#!，地位高于普通军区，将多个行省归于一位统掌民政与军政的指挥官管辖。该制度于10至11世纪被广泛推行，西至[ShowRegionName('italy_region')]的[ShowLocationName('bari')]督军区，东到巴西尔二世治下局势动荡的[ShowAreaNameWithNoTooltip('armenia_area')]边境，此类大型行政区避免了偏远争议地区陷入碎片化统治。就让这些意志堡垒成为旗帜，抵御一切觊觎我帝国皇冠之敌！"
 has_completed_fate_of_the_phoenix_disaster: "我们成功完成了[ShowDisasterName('D008_fate_of_the_phoenix')][disaster|e]"
