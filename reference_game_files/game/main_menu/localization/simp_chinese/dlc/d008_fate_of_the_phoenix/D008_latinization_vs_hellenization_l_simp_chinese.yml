l_simp_chinese:
 latinization_vs_hellenization.1.title: "[ShowCultureGroupNameWithNoTooltip('greek_group')]智慧的回响"
 latinization_vs_hellenization.1.desc: "在[target_location.GetName]的修道院和讲经堂里，神学著作和教父们的作品在信徒和饱学之士间流传。布道与评注汲取了东正教深厚的学识源泉，这些文本的抄本开始落入非希腊裔权贵手中，令宫廷中那些认为未来应与拉丁西方建立更紧密联系的人愈发不安。"
 latinization_vs_hellenization.1.a: "让他们的智慧为我们的土地增光添彩。"
 latinization_vs_hellenization.1.b: "对古老卷轴的这种迷恋已经够了。"
 target_character_disappears_tt: "[target_character.GetName]会消失无踪"
 latinization_vs_hellenization.2.title: "对[ShowLanguageNameWithNoTooltip('latin_language')]的日渐青睐"
 latinization_vs_hellenization.2.desc: "在[ROOT.GetCountry.GetName]的沙龙与庄园中，一股细微但日益强大的偏好[ShowLanguageName('latin_language')]习俗、法律与礼仪的潮流显现。年轻贵族在言谈中夹杂着外来词汇，与说[ShowLanguageNameWithNoTooltip('latin_language')]的宫廷通信，并呼吁进行改革，让我们的[ROOT.GetCountry.GetFlavorRank]更贴近西方的风尚，即使其他人对旧有确定性的迅速消逝愈发感到不安。"
 latinization_vs_hellenization.2.a: "此举不会有任何坏处。"
 latinization_vs_hellenization.2.b: "马上回头！"
 stability_scales_with_current_latinization_hellenization: "[stability|e]变化取决于我们当前的[ShowSocietyDirectionName('latinization')]或[ShowSocietyDirectionName('hellenization')]数值"
 while_this_modifier_active_reduced_latinization_gain_from_events_tt: "该[country_modifier|e]生效期间，之后触发的加强[ShowSocietyDirectionName('latinization')]的[events|e]被显著削弱，其增益降低"
 bonus_weakened_because_of_suppressing_latinization_modifier: "该选择的收益因[ShowModifier('suppressing_latinization_modifier')]而降低"
 latinization_vs_hellenization.3.title: "[ShowSocietyDirectionNameWithNoTooltip('latinization')]蓬勃发展"
 latinization_vs_hellenization.3.desc: "商人、法学家和学者们报告，近期的[ShowLanguageName('latin_language')]转型正开始结出硕果。合同起草更为清晰，外国伙伴觉得我们的惯例熟悉亲切，改革的活力似乎让[ROOT.GetCountry.GetName]的生活节奏加快——尽管有人低声议论，这些成果所依赖的基础可能尚不稳固。"
 latinization_vs_hellenization.3.a: "是时候收获我们良政的硕果了。"
 latinization_vs_hellenization.3.b: "智者会选择纠正过去的错误！"
 latinization_vs_hellenization.4.title: "荣耀归于[target_unit.GetNameWithNoTooltip]"
 latinization_vs_hellenization.4.desc: "有报告呈至[ROOT.GetCountry.GetGovernment.GetCourtTitle]，盛赞[target_unit.GetName]在近期战役中展现的模范纪律与勇气。他们的队伍在行军和操练中都稳如磐石，其事迹已在普通士兵和[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]中流传开来，二者将其视为[ROOT.GetCountry.GetName]军团的楷模。"
 latinization_vs_hellenization.4.a: "他们的服役对我们而言弥足珍贵。"
 target_character_will_receive_a_nickname_tt: "[target_character.GetName]将荣获一个恰如其分的绰号，以表彰[target_character.GetHerHis]的模范服役"
 latinization_vs_hellenization.5.title: "[target_location.GetNameWithNoTooltip]的课程之争"
 latinization_vs_hellenization.5.desc: "在[target_location.GetName]的[ShowBuildingTypeName('university')]，学者们就高等教育的适用语言争论不休。一些人坚持认为只有[ShowLanguageName('latin_language')]才能使我们的[ROOT.GetCountry.GetFlavorRank]立于列强之中，而另一些人则坚持维护君士坦丁堡和教会的传统。"
 latinization_vs_hellenization.5.a: "大学应以[ShowLanguageNameWithNoTooltip('latin_language')]授课。"
 latinization_vs_hellenization.5.b: "不能放弃教会和帝国的传统。"
 pops_in_target_province_mild_bonus_satisfaction: "我们在[target_province.GetName]的[pops|e]会获得[ShowNamedValue('pop_satisfaction_mild_bonus')|+=2%][pop_satisfaction|e]"
 pops_in_target_province_mild_penalty_satisfaction: "我们在[target_province.GetName]的[pops|e]会失去[ShowNamedValue('pop_satisfaction_mild_penalty')|+=2%][pop_satisfaction|e]"
 latinization_vs_hellenization.6.title: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')]的警告"
 latinization_vs_hellenization.6.desc: "德高望重的[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')][target_character.GetName]，十分忧虑地来到[ROOT.GetCountry.GetGovernment.GetCourtTitle]。[target_character.GetSheHe|U]警告说，教义与习俗中的[ShowLanguageName('latin_language')]风尚正在侵蚀我们信仰的根基，终将危及教权与君权。"
 latinization_vs_hellenization.6.a: "我们应明智地听从[target_character.GetHerHis]的劝诫。"
 latinization_vs_hellenization.6.b: "我们不能让胆怯之人左右国策。"
 latinization_vs_hellenization.7.title: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]效仿异域风尚"
 latinization_vs_hellenization.7.desc: "从[target_location.GetName]的大厅到偏远的庄园，我们的[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]热切地模仿着[target_culture.GetName]人的举止、时尚和语言。有人将此赞誉为文雅的体现，而另一些人则私下议论，认为我们的贵族正在遗忘作为[ROOT.GetCountry.GetAdjective]人的本分。"
 latinization_vs_hellenization.7.a: "让他们从[target_culture.GetNameWithNoTooltip]文化中汲取有用之处。"
 latinization_vs_hellenization.7.b: "这种对异域文化的迷恋已经过头了。"
 destabilize_our_realm: "我们对这些趋势的防御姿态动摇了我们的[ROOT.GetCountry.GetFlavorRank]"
 perceived_as_weakness: "禁止效仿异域习俗被视为软弱之举"
 latinization_vs_hellenization.8.title: "行省重组"
 latinization_vs_hellenization.8.desc: "[ROOT.GetCountry.GetCapital.GetName]的官员们已提议对包括[target_province.GetName]在内的各省进行全面重组，使辖区与行政管理更贴近我们的文化与政治中心。该计划有望加强控制，但可能打破早已形成的地方平衡。"
 latinization_vs_hellenization.8.a: "不惜一切代价推行新秩序。"
 latinization_vs_hellenization.8.b: "尊重地方安排，安抚其忧虑。"
 pops_in_selected_provinces_will_gain_mild_bonus_satisfaction_tt: "我们受影响[provinces|e]的[pops|e]会获得[ShowNamedValue('pop_satisfaction_mild_bonus')|+=2%]"
 latinization_vs_hellenization.9.title: "[target_character.GetShortNameWithNoTooltip]的教育"
 latinization_vs_hellenization.9.desc: "随着[target_character.GetName]长大成人，导师与廷臣们就[target_character.GetHerHis]的学业方向争执不休。对语言、典籍和导师的每一个选择，都可能成为关乎[ROOT.GetCountry.GetName]未来灵魂的代理人斗争。"
 latinization_vs_hellenization.9.a: "[target_character.GetHerHis|U]的教育必须遵循明确、审慎的路线。"
 latinization_vs_hellenization.9.b: "我们不会将[target_character.GetShortNameWithNoTooltip]的成长教育政治化。"
 refusal_to_politicize_tt: "我们拒绝公然干预[target_character.GetName]的教育，可能被[ROOT.GetCountry.GetGovernment.GetCourtTitle]上的某些人视为软弱"
 court_does_not_react: "[ROOT.GetCountry.GetGovernment.GetCourtTitle]未予置评"
 latinization_vs_hellenization.10.title: "重现[ShowCultureNameWithNoTooltip('roman_culture')]的辉煌"
 latinization_vs_hellenization.10.desc: "熟悉意大利各城市新兴建筑方法的建筑师们提议，以文艺复兴风格重塑[target_province.GetName]：宽阔的大道、整齐的街区布局，以及仿效拉丁西方大师重新构想的罗马式宏伟公共工程。欣赏这些宏伟蓝图的人看到了尊严的重生。或许，这种复兴唯有通过对西方敞开胸怀才能实现。"
 latinization_vs_hellenization.10.a: "让[target_province.GetNameWithNoTooltip]焕然一新。"
 latinization_vs_hellenization.10.b: "让定居点自然繁荣。"
 target_character_artist_skill: "[target_character.GetName]的[artistic_skill|e]"
 latinization_vs_hellenization.11.title: "在[target_province.GetNameWithNoTooltip]遵循帝国传统进行建设"
 latinization_vs_hellenization.11.desc: "艺术赞助者和当地行会游说推动以帝国诸城的伟大传统来翻新[target_province.GetName]：拱廊街道、开阔广场，以及曾让君士坦丁堡与罗马东方诸城卓然不凡的石造技艺。我们的许多顾问相信，恢复这些建筑形式能有力地彰显我们罗马遗产一脉相承的尊严。"
 latinization_vs_hellenization.11.a: "此等风雅正与我们的[ROOT.GetCountry.GetFlavorRank]相称。"
 latinization_vs_hellenization.11.b: "$latinization_vs_hellenization.10.b$"
 latinization_vs_hellenization.12.title: "新税制之争"
 latinization_vs_hellenization.12.desc: "财政官员提出了一项全面的税制改革方案，借鉴外国模式以加强赋税的核定与征收。这项激进的提议有望带来更佳的秩序与收入，但也可能动摇整个[ROOT.GetCountry.GetFlavorRank]的既得利益。"
 latinization_vs_hellenization.12.a: "实施新制度。"
 latinization_vs_hellenization.12.b: "暂时放弃这些想法。"
 proposed_taxation_upsets_estates_tt: "提议的税收方案将扰乱数个[estates|e]的既得特权"
 new_tax_code_will_destabilize_the_realm: "修订后的税收制度将动摇我们的[ROOT.GetCountry.GetFlavorRank]"
 latinization_vs_hellenization.13.title: "[target_location.GetNameWithNoTooltip]要求自治议会"
 latinization_vs_hellenization.13.desc: "[target_location.GetName]的显要人物向[ROOT.GetCountry.GetGovernment.GetCourtTitle]呈递请愿，要求设立自治市议会，并援引意大利城市自治公社的先例，证明地方治理能带来繁荣。同意请求将削弱中央控制，并推动[ROOT.GetCountry.GetFlavorRank]向拉丁治理模式靠拢；但若拒绝，或许会激怒那些向西寻求启迪的有影响力精英。"
 latinization_vs_hellenization.13.a: "准予他们成立议会。"
 latinization_vs_hellenization.13.b: "他们将继续处于我们的直接监督之下。"
 upper_class_pops_in_these_cities_angry: "我们受影响[locations|e]的[upper_class|e][pops|e]会对我们的拒绝感到不满，失去[ShowNamedValue('pop_satisfaction_mild_penalty')|+=2%][pop_satisfaction|e]"
 latinization_vs_hellenization.14.title: "[target_province.GetNameWithNoTooltip]的盛大节庆"
 latinization_vs_hellenization.14.desc: "[target_province.GetName]的地方领袖希望举办一场盛大的节庆，以感恩这片土地的习俗与丰饶。虽然这样的狂欢可以缓解紧张局势，加强共同身份认同，但这需要该省和我们国库共同投入资金，令我们的财政顾问感到不悦。"
 latinization_vs_hellenization.14.a: "仅为[target_province.GetNameWithNoTooltip]举办庆典。"
 latinization_vs_hellenization.14.b: "让邻近省份也一同加入庆典！"
 latinization_vs_hellenization.14.c: "如果他们有空无所事事，就有空工作。"
 pops_are_happier_tt: "我们在该[province|e]的非[upper_class|e][pops|e]会因进行中的节庆获得[ShowNamedValue('pop_satisfaction_mild_bonus')|+=2%][pop_satisfaction|e]"
 latinization_vs_hellenization.15.title: "拉丁办法手册"
 latinization_vs_hellenization.15.desc: "一本详尽记载操练与战场机动的手册，取材自拉丁西方佣兵队长与军事修会的方法，已开始在我国军官间流传。手册中的图示和指令若能被我们采纳为官方教条，将为我们的队列带来秩序与统一。"
 latinization_vs_hellenization.15.a: "分发手册！"
 latinization_vs_hellenization.15.b: "我们不需要此类影响。"
 latinization_vs_hellenization.16.title: "[target_character.GetShortNameWithNoTooltip]与[target_estate.GetNameWithNoTooltip]发生冲突"
 latinization_vs_hellenization.16.desc: "唉！[target_character.GetName]与[target_estate.GetName]的显要人物之间爆发了一场激烈的争执，双方互相指责对方越界。这场争端恐将使军官团与我们[ROOT.GetCountry.GetFlavorRank]的更大利益之间关系恶化。"
 latinization_vs_hellenization.16.a: "他们训斥了[target_character.GetHerHim]。做得很对。"
 latinization_vs_hellenization.16.b: "[target_estate.GetNameWithNoTooltip]无权干涉军事事务！"
 court_faction_increases_influence: "[ROOT.GetCountry.GetGovernment.GetCourtTitle]中的一个对立派系将增加其影响力"
 our_authority_will_suffer_penalty: "我们的权威将受损"
 latinization_vs_hellenization.17.title: "[target_character.GetShortNameWithNoTooltip]志愿服务"
 latinization_vs_hellenization.17.desc: "通过我们与[target_country.GetName]的联系，一位[target_culture.GetName]裔的资深战士因两国宫廷间日益加深的情谊，表达了在我方麾下效力的意愿。[target_character.GetSheHe|U]带来了拉丁西方的军事知识，愿将[target_character.GetHerHis]的专长奉献于我们的事业。"
 latinization_vs_hellenization.17.a: "欢迎每一位[target_culture.GetNameWithNoTooltip]指挥官！"
 latinization_vs_hellenization.18.title: "将领的分歧"
 latinization_vs_hellenization.18.desc: "我们的两位将领[target_character_1.GetName]和[target_character_2.GetName]在战术和训练方面存在公开分歧。他们的对抗可能会分裂军官队伍，让士兵在军事行动中困惑。这会导致军队分裂吗？无论如何，为了国家安全，我们最好终止他们的争吵。"
 latinization_vs_hellenization.18.a: "听从[target_character_1.GetShortNameWithNoTooltip]的建议。"
 latinization_vs_hellenization.18.b: "[target_character_2.GetNameWithNoTooltip]是对的！"
 latinization_vs_hellenization.19.title: "[target_province_destination.GetNameWithNoTooltip]吸引移民"
 latinization_vs_hellenization.19.desc: "[target_province_destination.GetName]的繁荣与美名，吸引着[target_province_origin.GetName]的人们踏上前往我们土地的旅程。如果他们来自拉丁西方，其定居将加深我们与西方的联系；如果他们来自东正教邻邦，他们的到来则将强化本行省的传统特质。"
 latinization_vs_hellenization.19.a: "他们将使我们的社会更加丰富多彩！"
 latinization_vs_hellenization.19.b: "他们不受欢迎。"
 latinization_vs_hellenization.20.title: "[target_character.GetNameWithNoTooltip]的忠诚"
 latinization_vs_hellenization.20.desc: "有谣言称[target_character.GetName]一直在与忠诚于他人的使节和密探会面。无论这些流言是出于恶意还是误解，都在侵蚀着我们指挥体系内的信任。尽管我们的密探报告称存在不信任，但谨慎权衡局势方为明智之举。"
 latinization_vs_hellenization.20.a: "[target_character.GetSheHe|U]该给[target_character.GetHerselfHimself]自己放个假了……"
 latinization_vs_hellenization.20.b: "我们不能听信这些闲言碎语！"
 target_character_spills_the_beans: "[target_character.GetShortName]将我们的秘密泄露给[rivals|e]与[rival_enemies|e]"
 target_character_lips_shut: "[target_character.GetHerHis|U]守口如瓶"
 latinization_vs_hellenization.21.title: "通胀政策"
 latinization_vs_hellenization.21.desc: "劣币和假币的大量涌入已开始扭曲[ROOT.GetCountry.GetName]各地的物价。[ROOT.GetCountry.GetGovernment.GetCourtTitle]内的一些顾问敦促立即干预，而另一些人则认为，治理之策带来的痛苦可能与疾病本身一样深重。"
 latinization_vs_hellenization.21.a: "加强对货币的控制。"
 latinization_vs_hellenization.21.b: "让市场自行调节。"
 inflation_creeping_in_tt: "如果不加遏制，[inflation|e]未来可能引发严重问题"
 burghers_pleased: "The [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] are pleased with our restraint"
 burghers_upset: "我们的不作为令[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]感到不满"
 inflation_causes_instability: "猖獗的[inflation|e]对我们的[stability|e]产生负面影响"
 latinization_vs_hellenization.22.title: "[target_character_1.GetShortNameWithNoTooltip]的导师挚友"
 latinization_vs_hellenization.22.desc: "[target_character_1.GetName]与[target_character_2.GetName]的关系变得格外亲密，后者的教导现已超越简单的读写与算术。有人说这段友谊拓宽了[target_character_1.GetHerHis]的视野，而另一些人则担心这会对我们未来的[ROOT.GetCountry.GetGovernment.GetRulerTitle]产生不当影响。"
 latinization_vs_hellenization.22.a: "只给我们的小[target_character_1.GetShortNameWithNoTooltip]最好的！"
 latinization_vs_hellenization.22.b: "[target_character_1.GetSheHe|U]生来就是为了领导，而不是为了读书！"
 heir_will_receive_more_tutoring_tt: "我们亲爱的[target_character_1.GetShortName]将接受补充辅导，这可能会提升[target_character_1.GetHerHis][abilities|e]。倘若[target_character_1.GetSheHe]未来继承王位，这可能会影响[target_character_1.GetHerHis]的决策。"
 latinization_vs_hellenization.23.title: "一位博学的[target_character.GetWomanMan|U]"
 latinization_vs_hellenization.23.desc: "一位游学的[target_culture.GetName]学者抵达了我们[ROOT.GetCountry.GetGovernment.GetCourtTitle]，此人受教于意大利诸城的人文主义传统，携有拉丁文手稿、哲学评注及源自西方蓬勃学术的思想。此类人物或可成为我们接触拉丁世界思潮的宝贵桥梁。然而，我们也需警惕[target_character.GetSheHe]可能随之带来的外国势力倾向。"
 latinization_vs_hellenization.23.a: "疲惫的旅者，暂且留在我们身边吧。"
 latinization_vs_hellenization.23.b: "我们对流浪乞丐的胡思乱想不感兴趣。"
 latinization_vs_hellenization.24.title: "博学的旅者"
 latinization_vs_hellenization.24.desc: "一位博学的[target_character.GetWomanMan]，精通教父著作与东正教伟大神学家的评注，请求获准居住于我们的[ROOT.GetCountry.GetGovernment.GetCourtTitle]，并愿分享其从东方各修道院收集的手稿，以及对帝国法律与东正教教义的深厚学识。这份智慧究竟会强化我们的传统，还是仅为喧嚣宫廷增添一种声音，还有待我们定夺。"
 latinization_vs_hellenization.24.a: "很好，[target_character.GetShortNameWithNoTooltip]可以留下。"
 latinization_vs_hellenization.24.b: "并无特别之处，[target_character.GetSheHe]不过是芸芸众生中的一员。"
 latinization_vs_hellenization.25.title: "文化衰微"
 latinization_vs_hellenization.25.desc: "编年史家哀叹，[ROOT.GetCountry.GetName]的文化活力正在消退。赞助凋零，传统荒废，曾经激励我们人民的作品如今在图书馆和库藏中积满灰尘。作为伟大文化的传承者，我们是否已与时代脱节？"
 latinization_vs_hellenization.25.a: "我们必须承认，我们的传统已然黯淡。"
 latinization_vs_hellenization.25.b: "不，错的是其他所有人！"
 latinization_vs_hellenization.26.title: "[ROOT.GetCountry.GetGovernment.GetCourtTitle]的东方风尚"
 latinization_vs_hellenization.26.desc: "来自东方宫廷的商人与使节所带来的丝绸、香料及风俗，已令我们的[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]心驰神往。一些人视此为一个久处东西方之间的帝国自然的现象，另一些人则称我们的未来取决于拉丁诸强，而一个目光东望的宫廷只会疏远我们的西方盟友。"
 latinization_vs_hellenization.26.a: "东方始终是我们世界的一部分。"
 latinization_vs_hellenization.26.b: "我们必须向西看，而不是向东。"
 latinization_vs_hellenization.27.title: "[ShowSocietyDirectionNameWithNoTooltip('hellenization')]政策初见成效"
 latinization_vs_hellenization.27.desc: "我们所推行的文化政策终于结出硕果。学者们赞颂重现的明晰，海军将领们谈论着恢复的信心，民众也感觉到，我们的道路无论充满多少争议，都正通向一个有意义的目标。"
 latinization_vs_hellenization.27.a: "微笑吧，我们让祖先感到骄傲。"
 strength_of_hellenization_desc: "我们的[ShowModifierTypeName('monthly_towards_hellenization')][country_modifier|e]的强度"
 latinization_vs_hellenization.28.title: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]抵制当前潮流"
 latinization_vs_hellenization.28.desc: "[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]中的显赫家族抱怨称，[ROOT.GetCountry.GetFlavorRank]在文化政策上偏离过远、过快。他们坚持认为，只有他们稳健的双手才能防止[ROOT.GetCountry.GetName]彻底丧失本色。"
 latinization_vs_hellenization.28.a: "顺应他们的要求。"
 latinization_vs_hellenization.28.b: "我们不会改变路线。"
 latinization_vs_hellenization.29.title: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')]抵制当前潮流"
 latinization_vs_hellenization.29.desc: "令我们不安的是，[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]近来开始对我们的文化走向表达忧虑。有人认为这些变化具有腐蚀性，甚至带来危险，但所有人都一致认为，必须保护信仰免受此类有害趋势的侵蚀。"
 latinization_vs_hellenization.29.a: "倾听他们的警告。"
 latinization_vs_hellenization.29.b: "教义不能高于政策。"
 refusal_leads_instability: "我们的拒绝遵从导致了不稳定"
 situation_dissipates: "激烈的交锋并未升级"
 latinization_vs_hellenization.30.title: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('peasants_estate')]抵制当前潮流"
 latinization_vs_hellenization.30.desc: "在[ROOT.GetCountry.GetName]的田野与乡村之中，许多下层民众抱怨，那些关于追逐宏伟与习俗的遥远争论，只给他们带来了新的负担和陌生的官员。若不加以回应，他们这种沉默的抵触或将愈发高涨。"
 latinization_vs_hellenization.30.a: "安抚[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('peasants_estate')]。"
 latinization_vs_hellenization.30.b: "强制他们顺应当前潮流。"
