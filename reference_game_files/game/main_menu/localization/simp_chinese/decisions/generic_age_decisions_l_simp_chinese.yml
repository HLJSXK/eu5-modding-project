l_simp_chinese:
 sponsor_a_cathedral_decision.title: "赞助修建大教堂"
 sponsor_a_cathedral_decision.desc: "我国仍然缺乏供人礼拜和修行信仰的场所。我们应当赞助修建一座新的 [ShowBuildingTypeName('cathedral')] ，以满足百姓的需求。"
 sponsor_a_cathedral_decision.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 sponsor_a_cathedral_decision.a.entry: "$common_string_brilliant$"
 sponsor_a_cathedral_decision.b: "This is not the right time."
 sponsor_a_cathedral_cooldown_tt: "本任统治者在位期间尚未使用过此 [decision|e] "
 sponsor_a_great_madrasa_decision.title: "赞助修建大伊斯兰经学院"
 sponsor_a_great_madrasa_decision.desc: "尽管我国已有许多礼拜场所，但普通的 [ShowBuildingTypeName('temple')] 与 [ShowBuildingTypeName('madrasa')] 已不足以满足我国学者的博大才智。我们应当投资修建一座新的 [ShowBuildingTypeName('great_madrasa')]，为他们提供充足的空间以研习、传播知识。"
 sponsor_a_great_madrasa_decision.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 sponsor_a_great_madrasa_decision.a.entry: "$common_string_brilliant$"
 sponsor_a_great_madrasa_decision.b: "This is not the right time."
 sponsor_a_great_madrasa_cooldown_tt: "$sponsor_a_cathedral_cooldown_tt$"
 construct_a_grand_palace_decision.title: "兴建新王宫"
 construct_a_grand_palace_decision.desc: "我们的宫廷与统治者家族都缺乏一处与其威望相称的居所。我们应当聘请一位[ShowArtistTypeName('architect')]来规划修建一座新的[ShowBuildingTypeName('grand_palace')]。"
 construct_a_grand_palace_decision.a: "这将是一处相称的居所。"
 strive_towards_thalassocracy_decision.title: "建立海上霸权"
 strive_towards_thalassocracy_decision.desc: "只要我们能够充分掌控沿岸的水域，浩瀚的海洋便可成为我国及其经济扩张的重要一环。将大量资源投入海军的扩充，将使我们的基础建设与这一全新的海外雄心相契合。"
 strive_towards_thalassocracy_decision.a: "让我们拥抱大海吧。"
 strive_towards_thalassocracy_decision.a.tt: "我们将有20年时间来建立一支强大的海军"
 strive_thalassocracy_coastal_markets_tt: "拥有至少一个沿海 [market_center|e]"
 abandon_thalassocracy_decision.title: "放弃海洋霸权"
 abandon_thalassocracy_decision.desc: "凭借海上霸权进行统治已不再符合我们的雄心。我们应当将精力转回我们所居住的这片土地上。"
 abandon_thalassocracy_decision.a: "让我们重回坚实的大地。"
 found_trade_company_india_decision.title: "支持我们的亚洲贸易航线"
 found_trade_company_india_decision.desc: "The wealthy shores of [ShowSubContinentName('south_asia')] 与 [ShowSubContinentName('south_east_asia')] 的富庶海岸向我们许诺了丰厚的利润。尽管我们目前的贸易活动大多由个体商人自行开展，但这显然不符合我们这样一个大国的身份。我们应当动用国家的力量，在那些海外市场与我们本国之间建立更大规模的贸易使团。"
 found_trade_company_india_decision.a: "投资建立一家印度贸易公司。"
 invite_foreign_advisor_decision.title: "购买外国的革新"
 invite_foreign_advisor_decision.desc: "我国在世界其他列强面前严重落后。我们不能坐视其他国家在技术与创新领域超越我们。若能以丰厚薪酬延揽这些国家的人才，我们或可迎头赶上，在追求现代化的道路上不至于进一步落后。"
 invite_foreign_advisor_decision.a: "欢迎这位外国学者。"
 invite_foreign_advisor_decision.a.tt: "一位来自外国的 [country|e] 学者将加入我们的 [court|e]"
 invite_foreign_advisor_decision.b: "我们自己的顾问已经足够。"
 invite_foreign_advisor_cooldown_tt: "$sponsor_a_cathedral_cooldown_tt$"
 disempower_the_parliament_decision: "Challenge the Rights of the Parliament"
 disempower_the_parliament_decision_desc: "Over the last centuries our parliament has acquired certain rights that limit our government in its own freedom. We should look towards those with entrenched seats in the parliament and revoke their rights!"
 disempower_the_parliament_decision.a: "我们需要削减议会的权力。"
 disempower_the_parliament_decision.b: "现在不是挑战议会的合适时机。"
 abolish_serfdom_decision.title: "废除农奴制"
 abolish_serfdom_decision.desc: "农奴制在我国已实行已久，如今已成为我们经济发展的阻碍。考虑到当下动荡的政治局势，以法令废除这一制度或许是明智之举，既能安抚日益壮大的中产阶级，也能减轻鞭下之人的苦难。"
 abolish_serfdom_decision.a: "签署法令。"
 abolish_serfdom_decision.b: "这样做太具破坏性了。"
 abandon_absolutism_decision.title: "放弃专制统治"
 abandon_absolutism_decision.desc: "我们统治者的专制统治，已越来越成为我国内部稳定的威胁。叛乱的传闻愈发频繁，镀压反对我们政权的人也绝非易事。也许现在正是时候摒弃旧日的专制理念，为我们的国家拥抱一种更为自由的政体？"
 abandon_absolutism_decision.a: "专制统治已不再适合我们。"
 abandon_absolutism_decision.b: "我们的权威至高无上！"
 construct_a_grand_palace_decision.a_tt: "受聘的[ShowArtistTypeName('architect')]将加入我们的[court|e]"
 disempower_the_parliament_decision.a_building_tt: "我们将在我们的一处[locations|e]中移除一座[ShowBuildingTypeName('urban_parliament_seat')]"
 disempower_the_parliament_decision.a_tt: "[location|e]中的每个[pop|e]都将损失[ShowNamedValue('pop_satisfaction_severe_penalty')|+=2%][pop_satisfaction|e]"
 disempower_the_parliament_decision.desc: "在过去的几个世纪里，我们的议会获得了某些权利，限制了我们政府自身的自由。我们应该关注那些在议会中占据固定席位的人，并废除他们的权利！"
 disempower_the_parliament_decision.title: "挑战议会的权利"
 disempower_the_parliament_decision_cooldown_tt: "$sponsor_a_cathedral_cooldown_tt$"
 jewish_expulsion_threat.a: "发出最后通牒。"
 jewish_expulsion_threat_cooldown_tt: "$sponsor_a_cathedral_cooldown_tt$"
