l_simp_chinese:
 aragon_develop_sitges.title: "Invest in Sitges"
 aragon_develop_sitges.desc: "Sitges has long been a quiet fishing port on the Catalan coast. With Aragonese backing, the town's harbor and salt trade could be developed into a more substantial Mediterranean outpost."
 aragon_develop_sitges.a: "Fund the development (+1 development in Sitges)"
 aragon_develop_sitges.b: "Not now"
 ara_coronate_ruler.title: "$flavor_ara.22.entry$"
 ara_coronate_ruler.title.entry: "$flavor_ara.22.entry$"
 ara_coronate_ruler.desc: "[target_character.GetName] 已经登上王位，[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] 与 [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')] 齐聚一堂，共同见证在 [ShowLocationName('zaragoza')] 这一显赫之地举行的加冕大典，[ROOT.GetCountry.GetGovernment.GetRulerTitle] 将在此宣誓维护 [ROOT.GetCountry.GetFlavorRank] 的法律、人民的自由以及各等级的特权。"
 ara_coronate_ruler.desc.entry: "新君登基后，若不举行适当的加冕典礼，便难以真正获得 [ShowEstateTypeName('nobles_estate')] 与 [ShowEstateTypeName('peasants_estate')] 的效忠。未加冕的君主，便是不被承认的君主。"
 ara_coronate_ruler.a: "$flavor_ara.23.a$"
 ara_unite_barcelona_dynasty.title: "Unite The Dynasty"
 ara_unite_barcelona_dynasty.desc: "With the [ShowCultureName('sicilian')] Vespers securing the throne for our dynasty, our influence in [ShowRegionName('italy_region')] has grown. Despite this, [ShowAreaName('sicily_area')] still maintains its sovereignty, distancing itself from our dynastic politics. Rather than allowing this opportunity to pass us by, perhaps we can contact our relatives there, establishing a stronger dynastic union and potentially kickstarting our ambitions in [ShowRegionNameWithNoTooltip('italy_region')]."
 ara_unite_barcelona_dynasty.a: "Let us try and unite both crowns."
 ara_unite_barcelona_dynasty.b: "They will serve as our subject."
 ara_unite_barcelona_dynasty.c: "It is not time yet"
 ara_effects_only_take_place_if_sic_accepts_tt: "The effects will only take place if [GetCountry('SIC').GetName] accepts"
 ara_vassalize_bosnia.title: "Demand Vassalization from [GetCountry('BOS').GetNameWithNoTooltip]"
 ara_vassalize_bosnia.desc: "The great ruler of [GetCountry('BOS').GetName] has long struggled to maintain the country's sovereignty against power-hungry neighbors. Unable to defend themselves alone, several among the [GetCountry('BOS').GetGovernment.GetEstateName('nobles_estate')] have approached our ruler and the court, asking that we protect them from any invasion. They would prefer to become our subjects rather than fall into heathen hands, something we can exploit to our advantage."
 ara_vassalize_bosnia.a: "It is time to ask for their subjugation."
 ara_vassalize_bosnia.b: "还不是时候。"
 ara_ask_bosnia_for_vassalization: "我们将要求 [GetCountry('BOS').GetName] 臣服"
 ara_coronate_ruler.b: "让我们废除这一传统吧。"
