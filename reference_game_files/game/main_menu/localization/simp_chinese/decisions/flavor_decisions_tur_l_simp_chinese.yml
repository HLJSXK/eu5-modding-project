l_simp_chinese:
 tur_enderun_academy_decision.title: "恩德伦内廷学院"
 tur_enderun_academy_decision.desc: "为了培养我们不断扩张的国家所需的行政官员与将领，我们可以创设一所由宫廷核心圈层主持的学院，将学生置于君主身边。这不仅有助于洞察其成长历程，也能将他们与皇室牢牢绑定，确保[ROOT.GetCountry.GetGovernment.GetRuler.GetDynasty.GetName]王朝在政务中始终占据核心地位。\n\n不过，我们不应只让贵族子弟入学——任何有天赋的年轻人，无论出身为何，都应获得机会。"
 tur_enderun_academy_decision.desc.entry: "在宫廷中长大的仆人,其地位全系于王朝,与其父之名毫无关系。若由内廷开设学校,便能培养出仕途始终仰赖我们心意的官员与将领,而这些学堂之席,实在没有理由只留给出身高贵之人。"
 tur_enderun_academy_decision.a: "这就是未来！"
 tur_enderun_academy_decision.historical_info: "穆罕默德二世在新建的托普卡帕宫庭院内设立学院，学生多选自德夫希尔梅制度下被征募的基督徒少年，接受伊斯兰信仰、科学、军事以及语言等全面教育。宫廷学校出身的忠诚臣僚成为奥斯曼家族治理体系的骨干力量，贯穿十五至十六世纪。"
 tur_expanded_timariot_decision.title: "扩大蒂马尔制度"
 tur_expanded_timariot_decision.desc: "为资助蒂玛尔采邑制度的扩张，机智的顾问提出可从瓦合甫中调拨一部分收入。瓦合甫是以清真寺为中心的慈善基金，服务于贫苦大众。虽然此举会大幅强化军队、削弱[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]的权力，但当虔诚信众得知此事后，恐将引发广泛不满。"
 tur_expanded_timariot_decision.desc.entry: "授予骑兵的土地能自给自足,而慈善基金却养不出一兵一卒。挪用瓦克夫的资产,既能增添更多骑兵上阵,又能顺势削弱 $clergy_estate$ 的势力,只不过虔诚之人恐怕不会看不出这笔钱去了何处。"
 tur_expanded_timariot_decision.a: "国家需要这些钱。"
 tur_expanded_timariot_decision.b: "瓦合甫不可亵渎！"
 tur_expanded_timariot_decision.historical_info: "穆罕默德二世不惜一切代价扩张其个人权力。在他统治末期，他试图削弱乌理玛宗教学者的势力，将原供养他们的#italic 瓦合甫#!收入改拨予蒂玛尔采邑制度，从而强化军队。然而，这一举动最终引发了不小的争议……"
 tur_enderun_service_decision.title: "内廷服务"
 tur_enderun_service_decision.desc: "宦官奴隶虽长期在政府中作用有限，但这些被阉割、没有家族和世俗权力野心的人潜力巨大。宫中几位聪颖的年轻奴隶男孩也是如此。我们可让这些能干的廷臣在我们的宫廷中担任正式职务，从而将其与[ROOT.GetCountry.GetGovernment.GetRuler.GetDynasty.GetName]王朝更紧密绑定——当然，这会损害那些过去常争夺此类职位的、阿谀奉承的老牌[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]的利益。"
 tur_enderun_service_decision.desc.entry: "一个无法诞下自家王朝的男人,没什么理由为自己谋私利建立世系。若为宫中宦官设立正式的宫廷职位,便可让其中最能干者凌驾于 $nobles_estate$ 之上,而后者长久以来一直将这些职位视为世袭之物。"
 tur_enderun_service_decision.a: "宫廷改革早该进行了。"
 tur_enderun_service_decision.b: "不，我们必须继续依靠[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]。"
 tur_enderun_service_decision.b.entry: "No, we must continue to rely on the $nobles_estate$."
 tur_enderun_service_decision.historical_info: "#italic 恩德伦#!一词源自波斯语#italic “内部”#!，专指最接近奥斯曼苏丹的宫廷侍从。与之相对的是#italic 比伦#!——即外廷，也就是帝国的官僚体系。内廷成员主要由宦官和年轻的基督教奴隶组成，其职责本是侍奉和教育皇室成员，但随着时间推移，其中一些人获得了巨大的政治权力。"
 tur_imperial_harem_decision.title: "后宫之整顿"
 tur_imperial_harem_decision.desc: "至今，[ROOT.GetCountry.GetGovernment.GetRuler.GetDynasty.GetName]的宫廷尚分散于多处宫殿和职位之中。但若我们真欲迈向伟业，或许应将权力与威望集中于[capital_location.GetName]。这将意味着将所有皇室侍妾迁至此地，安置于奢华密闭之所中。\n\n但[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]可能将此视为对他们的直接挑衅——毕竟这将剥夺他们长久以来享有的觐见[target_ruler.GetName]的个人权利。"
 tur_imperial_harem_decision.desc.entry: "权力总是追随离统治者最近之人,而如今恰恰归于那恰好拥有最近王宫者。若将后宫集中安置于都城一处戒备森严的宅邸,便可一劳永逸地解决此事,而这正是$nobles_estate$必定心生怨怼之故。"
 tur_imperial_harem_decision.a: "建立帝国后宫。"
 tur_imperial_harem_decision.b: "我们目前的宫廷体制运转良好，无需更改。"
 tur_imperial_harem_decision.historical_info: "十六世纪时，奥斯曼王朝的权力集中于君士坦丁堡的托普卡帕宫，皇室成员（尤其是女性）终身生活其间。这使后宫转变为一套组织严密的等级制度，其封闭性赋予觐见苏丹者极高的特权，亦彰显了苏丹的权柄。"
 tur_eunuch_viziers_decision.title: "设立女官总管一职"
 tur_eunuch_viziers_decision.desc: "[mehmed_agha.GetName]是一位才华横溢的[ROOT.GetCountry.GetGovernment.GetCourtTitle]太监，也是[ROOT.GetCountry.GetGovernment.GetAdjective]后宫的守护者。[ROOT.GetCountry.GetGovernment.GetCourtTitle]的诸派系希望为他设立新职位：#italic 克兹拉尔·阿瑟#!（后宫总管太监），此职将监管[ROOT.GetCountry.GetGovernment.GetRulerTitle]的私室，并作为后宫与高议会之间的调解者。他亦将凌驾于负责[ROOT.GetCountry.GetGovernment.GetCourtTitle]童仆的白人太监首领#italic 卡珀·阿瑟#!之上，后者素来不甚可靠。"
 tur_eunuch_viziers_decision.desc.entry: "掌控通往统治者私人寝殿之门者,所掌控的远不止一扇门而已。$name_muhammad.turkish_language$颇具担当此职之智,擢升其为#italic黑人宦官长#!,亦可就白人宦官长忠诚与否这一旧日疑虑一锤定音。"
 tur_eunuch_viziers_decision.a: "提拔后宫总管太监。"
 tur_eunuch_viziers_decision.b: "反而应加强后宫总管太监。"
 tur_eunuch_viziers_decision.c: "太监不应再得权。"
 valide_sultan_objects.tt: "太后苏丹不接受。"
 mehmed_agha_fired.tt: "[mehmed_agha.GetNameWithNoTooltip]离开了[ROOT.GetCountry.GetGovernment.GetCourtTitle]。"
 tur_eunuch_viziers_decision.historical_info: "奥斯曼宫廷中的太监人数逐渐增长。1574年，为麦赫迈德·阿迦设立了后宫总管太监之职，太监由此权力空前。由于非洲太监的故土遥远，被视为更可靠，故渐超白人太监。而得益于其与太后苏丹等权势女性的密切关系，该职位最终位列大维齐尔与$common_string_shaikh_al_islam$之下的最高层。"
 tur_sekban_system_decision.title: "终结 [ShowAdvanceNameWithNoTooltip('timariots')]"
 tur_sekban_system_decision.desc: "长期以来，[ShowAdvanceName('timariots')]制度为我们效力甚多，然今正面临危机。我们给予骑兵的土地愈发贫瘠且支离破碎，火枪武装的敌军亦使得骑兵不复往日战场主导地位。若不再分封蒂玛尔采邑，随着持有者老去辞世，这些土地可改设为税农制，归国家直接征收。同时，军队亦可实现现代化，转向以火器步兵为主。"
 tur_sekban_system_decision.a: "我们必须与时俱进。"
 tur_sekban_system_decision.b: "骑兵永远为王。"
 timars_unavailable.tt: "蒂玛尔采邑[reforms|e]将永久无法实施。"
 tur_sekban_system_decision.historical_info: "蒂玛尔采邑制度为奥斯曼帝国向西帕希骑兵授地的制度，但随征服减缓而趋于不可持续。军中其他派系，尤其是禁卫军，也开始要求获得封地。奥斯曼朝最终认识到改革之必要，遂废止蒂玛尔采邑制度，转而依赖从农民中招募塞克班步兵。"
 tur_kanum_i_osmani_decision.title: "[ShowPolicyNameWithNoTooltip('tur_kanum_i_osmani')]"
 tur_kanum_i_osmani_decision.desc: "随着[ROOT.GetCountry.GetFlavorRank]的成长，生活在其境内的人口愈加多样。许多人已牢牢融入国家体系，遵循古老的[ROOT.GetCountry.GetAdjective]法律。然而，这些法律似乎已无法应对当下局势。[target_character.GetName]，一位以改革著称的人物，主张彻底重写[ROOT.GetCountry.GetNameWithNoTooltip]的法律体系，追求国内稳定，而非靠征服扩张国土。"
 tur_kanum_i_osmani_decision.desc.entry: "为边疆小国而立的法律,治理不了一个囊括众多民族的帝国。以我们之名颁布并约束所有臣民的统一法典,能换来进一步征服所无法带来的内部秩序,而我们这一世征战,已然足够。"
 tur_kanum_i_osmani_decision.a: "这些法律将引领我们走向新时代。"
 tur_kanum_i_osmani_decision.b: "我们会铭记这些改革。"
 tur_change_tur_kanum_policy_to_give_values_weighted_by_crown_power: "[ShowPolicyName('tur_kanum_i_osmani')][policy|e]给予的[modifiers|e]效果会增强#Y 50%#!，但也会受到[GetEstateName('crown_estate')][estate_power|e]的影响"
 tur_autonomous_kadiluks_decision.title: "赋予卡迪权力"
 tur_autonomous_kadiluks_decision.desc: "#italic 噶最#!是负责审判一切的人，在[ShowReligionGroupAdjective('muslim')]世界中十分重要，一向是国家的柱石，噶最的职位更是为无数学者梦寐以求。然而，随着治理与税务制度的革新，噶最们如今要求对他们负责的#italic 噶最教法区#!享有更大的自治权。他们声称，这将有助于巩固我们在[ShowReligionGroupNameWithNoTooltip('muslim')]世界中的宗主地位，并永固他们与高门之间的信任。"
 tur_autonomous_kadiluks_decision.a: "他们值得我们信任。"
 tur_autonomous_kadiluks_decision.b: "他们已经权力过盛了。"
 has_enabled_kadiluks_privilege: "已通过“$tur_autonomous_kadiluks_decision.title$”这一[decision|e]启用此[estate_privilege|e]"
 tur_autonomous_kadiluks_decision.historical_info: "在17世纪，奥斯曼帝国的苏丹权力逐渐削弱，权力日益转移至诸如近卫军和噶最等制度之中。噶最教法区为噶最的管辖地，在其中，噶最统筹税收与兵役征调。在远离王权中心的省份，噶最通过噶最教法区掌握巨大权势。1703年埃迪尔内事件后，穆斯塔法二世被废，噶最的地位达到了顶峰。"
 tur_malikane_decision.title: "The $ottoman_tax_farming$ Reform"
 tur_malikane_decision.desc: "为改善我朝财政，[grand_vizier.GetName]提出一种新的税务承包制度，称为#italic 马利卡内#!。一个村庄或地区将被拍卖给出价最高者，由其终生拥有征税权。[grand_vizier.GetSheHe]称，此法比旧制优越，能促使承包人更关注土地的长期繁荣，而非在短期内榨干资源。此举也可免去我们年年更换合同的行政烦扰——不过，旧制度的油水也颇为可观。"
 tur_malikane_decision.desc.entry: "包税人若只握有一村一年之权,便会将其榨干;若终身握有,则会悉心经营。#italic终身包税制#!将此终身权利卖予出价最高者,以往那些丰厚的年度拍卖便换成了十年后依然值得征税的地方。"
 tur_malikane_decision.a: "实施此项改革。"
 tur_malikane_decision.b: "依旧用老办法征税。"
 malikane_available.tt: "将解锁[ShowGovernmentReformName('ottoman_malikane_tax_reform')][government_reform|e]。"
 tur_malikane_decision.historical_info: "马利卡内制度由大维齐尔埃尔马斯·穆罕默德帕夏于1695年引入。他原意在于提升长期经济收益，但改革遭到原税农阶层的激烈反对，加之国家对终身承包缺乏监管，因此最终部分失败。改革后不久，帝国遭受军事失败，并因无力支付军饷而陷入困境。埃尔马斯于1697年被军队杀害，1703年，未得军饷的耶尼切里近卫军推翻了穆斯塔法二世。"
 tur_coffee_house_espionage_decision.title: "渗透咖啡馆"
 tur_coffee_house_espionage_decision.desc: "[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]常聚集的咖啡馆，往往成为叛徒结社的温床，甚至是阴谋叛乱的策源地，尤其在$janissaries_advance$之中更是如此。尽管这些围绕着浓黑咖啡与甜美点心展开的激烈讨论有利于商业与社区发展，但若能扩张我们的间谍网络，确保没有任何秘密交流被遗漏，也未尝不是好事。"
 tur_coffee_house_espionage_decision.desc.entry: "人在咖啡杯前吐露真言,远胜过在审讯时坦白,而$burghers_estate$聚集之处议论纷纷,尽是$janissaries_advance$宁愿我们永远听不到的话。若将其关闭,固然会同时失去贸易与流言,但若安插我们自己的耳目,则两者皆可兼得。"
 tur_coffee_house_espionage_decision.a: "信息即力量。"
 tur_coffee_house_espionage_decision.b: "取缔咖啡馆。"
 tur_coffee_house_espionage_decision.c: "咖啡必须畅流无阻。"
 coffee_house_espionage_available.tt: "将解锁[ShowGovernmentReformName('ottoman_coffee_house_espionage')][government_reform|e]。"
 tur_coffee_house_espionage_decision.historical_info: "奥斯曼帝国的咖啡馆是多种职业、种族与宗教的男子汇聚之所——土耳其工匠可与俄国流浪汉、威尼斯人商人共席而坐。如此场所成为了公共话语、新思想、艺术、乃至叛乱的论坛。尤其是属于耶尼切里部队的咖啡馆，常常作为暗杀行动、情报收集与资源获取的地下网络的联络点。政府曾在咖啡馆及其他公共机构中安插大量间谍，以窥探民意，监听关于犯罪或叛乱的密谈。"
 tur_new_order_army_decision.title: "新秩序陆军"
 tur_new_order_army_decision.desc: "考虑到劲敌强盛、世界局势剧变的威胁，尤其是来自腐败堕落的$janissaries_advance$的不断叛乱威胁，[target_ruler.GetName]萌生了改革军队的想法。[target_ruler.GetSheHe|U]希望建立一支高度专业化、现代化的军队，引入来自[ShowContinentName('europe')]的教官与全新的制服、传统和训练方式。但如此一来，[target_ruler.GetSheHe]势必会激怒$janissaries_advance$、$bashi_bazouks$和$sekban_system$等既得利益者。"
 tur_new_order_army_decision.desc.entry: "建立现代化军队的阻碍并非金钱或教官的匮乏，而是我们如今维系的这支军队本身。若要在 $janissaries_advance$ 之外扶植一支纪律严明的新军，便等于武装了那些终将被下令解散他们的人，而 $bashi_bazouks$ 与 $sekban_system$ 洞察这一意图的敏锐，绝不亚于我们。"
 tur_new_order_army_decision.a: "我们需要这一改革。"
 tur_new_order_army_decision.b: "老方法就足够好了。"
 new_order_army_available.tt: "将解锁[ShowGovernmentReformName('ottoman_new_order_army')][government_reform|e]。"
 tur_new_order_army: "解锁了[ShowGovernmentReformNameWithNoTooltip('ottoman_new_order_army')]"
 tur_new_order_army_decision.historical_info: "新秩序陆军#italic （尼扎姆·杰迪德）#!成立于1797年，是塞利姆三世改革计划的核心内容。他希望借此逐步取代旧有的耶尼切里军团，以此遏止帝国的地方分裂，并削弱耶尼切里的既得权力。"
 mehmed_agha_tt: "一位精明能干的 [character|e] 将加入我们的宫廷,并获得 [ShowModifier('kizlar_agha_modifier')][modifier|e]"
