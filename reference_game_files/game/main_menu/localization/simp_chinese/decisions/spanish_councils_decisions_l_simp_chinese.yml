l_simp_chinese:
 spa_establish_the_council_of_castile_decision.title: "设立$royal_council_of_castile$。"
 spa_establish_the_council_of_castile_decision.desc: "长久以来，[ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')]一直受制于琐碎的[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]以及低效的地方司法拼凑体系。由[target_character.GetName]提出，并受到改革派与王党支持的[ShowGovernmentReformName('royal_council_of_castile')]，展现了一个更加集中化、专业治理的国家愿景。通过赋予该枢密院监督税收、司法事务与任命的权力，我们可以更好地将[ROOT.GetCountry.GetFlavorRank]的资源引向国家利益，而非地方总督的享乐。"
 spa_establish_the_council_of_castile_decision.desc.entry: "以地方司法权拼凑而成的统治方式，使$crown_estate$依赖于各地掌权者。只对我们负责，由受过训练的官员组成的常设机构[ShowGovernmentReformName('royal_council_of_castile')]，能让税收、司法和任命事务脱离地方利益的掌控。"
 spa_establish_the_council_of_castile_decision.a: "让枢密院监督[ROOT.GetCountry.GetFlavorRank]。"
 spa_establish_the_council_of_castile_decision.a.entry: "让议会监管王国。"
 establish_the_council_of_castile_tt: "设立[ShowBureaucracyTypeName('spa_council_of_castile_bureaucracy')]"
 established_the_council_of_castile_tt: "使用$spa_establish_the_council_of_castile_decision.title$设立[ShowBureaucracyTypeName('spa_council_of_castile_bureaucracy')]。"
 spa_establish_the_council_of_castile_decision.historical_info: "卡斯蒂利亚御前最高枢密院在15世纪晚期由天主教双王阿拉贡的斐迪南二世与卡斯蒂利亚的伊莎贝拉一世设立。最初它是一个中世纪的咨议机构，后来被改造为王权的核心工具。它旨在削弱高等贵族的权力，绕过地方特权，并通过任用受过大学教育的法律人士和官僚来实现国家治理的专业化。"
