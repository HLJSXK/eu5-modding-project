l_simp_chinese:
 prospect_for_coal.title: "勘探煤矿"
 prospect_for_coal.desc: "蒸汽与钢铁的时代靠煤炭运转，而我们自己的土地或许仍蕴藏着我们的工业迫切渴求之物。让我们拨出政治资本，派遣地质学家与矿业工程师团队深入产煤地带，勘测地形，沿有希望的煤层开挖试井，并在煤炭蕴藏最丰富之处开辟新的矿井。勘测队将从产出最少的乡间田地入手，这些田地改作煤矿开采所失甚微，新矿场起初规模不大，日后自会不断扩展，以供我们的炉火所需。"
 prospect_for_coal.a: "下令展开勘测。"
 prospect_for_coal_effect_tt: "[coal_prospect_location.GetName] 现在将产出 [ShowGoodsName('coal')]，而非 [coal_prospect_location.GetRawMaterial.GetName]"
 prospect_for_coal.historical_info: "鲁尔、上西里西亚与南威尔士的大煤田为工业革命提供了动力，系统性的煤炭勘探将宁静的乡村地区变成了地球上最密集的工业区之一。地质勘测在十八世纪末与十九世纪初逐渐发展为一门专业学科，各国政府与企业家竞相寻找新机械时代所依赖的燃料。"
