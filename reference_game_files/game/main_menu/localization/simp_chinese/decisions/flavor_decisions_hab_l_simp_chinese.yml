l_simp_chinese:
 hab_monastery_reform_melk_decision.title: "[ShowLocationNameWithNoTooltip('melk')]修院改革"
 hab_monastery_reform_melk_decision.desc: "近期，[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]阶层的一些成员齐聚[ShowLocationName('melk')]，商讨[ROOT.GetCountry.GetName]修道院文化日渐衰落的问题。随着不满之声日益高涨，显而易见，我们的修道体系亟待改革。若能及时行动，我们或能成为[ROOT.GetCountry.GetReligion.GetAdjective]改革的典范。"
 hab_monastery_reform_melk_decision.desc.entry: "一座已经忘却会规的修道院，其价值还不如一块荒地，而我们的修道院早已荒废多年。在 [ShowLocationName('melk')] 的这场集会，正好给了我们一个借口来采取行动——趁着整个 [ShowReligionAdjective('catholic')] 世界都在关注之际，让人看到我们是在引领，而非跟随。"
 hab_monastery_reform_melk_decision.a: "推行改革。"
 hab_monastery_reform_melk_decision.b: "现行制度已然完善。"
 hab_vienna_concordat_decision.title: "[ShowLocationNameWithNoTooltip('vienna')]协议"
 hab_vienna_concordat_decision.desc: "经过与教廷代表的漫长谈判，我们终于达成了一项协议，既能维护[ROOT.GetCountry.GetName]的利益，又兼顾[GetCountry('PAP').GetName]的诉求。长久以来，[GetUniqueInternationalOrganization('hre').GetName]与[GetUniqueInternationalOrganization('catholic_church').GetLeaderTitle]之间充满敌意与猜忌，而今，此协约或能成为双方关系的转折点，为未来的友好合作奠定基石。"
 hab_vienna_concordat_decision.desc.entry: "皇帝与教皇为了谁有权任命谁，已经争论了数百年，这场争执从未使任何一方受益。与教皇达成一项确定的协议，意味着我们要放弃部分任命的自由，来换取一件我们从未拥有过的东西：一个不再将 $hre$ 视为对手的教廷。"
 hab_vienna_concordat_decision.a: "签署协议！"
 hab_vienna_concordat_decision.b: "我们无须依赖[GetUniqueInternationalOrganization('catholic_church').GetLeaderTitle]的援助。"
 hab_monastery_reform_accepted_decision.title: "[ROOT.GetCountry.GetNameWithNoTooltip]的[ShowBuildingTypeNameWithNoTooltip('monastery')]参议会"
 hab_monastery_reform_accepted_decision.title.entry: "The [ShowBuildingTypeNameWithNoTooltip('monastery')] Council of $HAB$"
 hab_monastery_reform_accepted_decision.desc: "宗教改革波及我国，对[ShowBuildingTypeName('monastery')]体系造成了深远影响。[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]抱怨[ShowBuildingTypeNameWithNoTooltip('monastery')]修院缺乏新成员，同时面临严重的财政困境。或许，我们可以设立一个参议会，接管[ShowBuildingTypeNameWithNoTooltip('monastery')]的管理，以期解决这一问题。"
 hab_monastery_reform_accepted_decision.desc.entry: "空荡的初学修士堂与空虚的钱库，首先是行政上的问题，其次才是灵性上的问题。若由一个议会掌管我们领地内每一座[ShowBuildingTypeName('monastery')]的钱袋，其整顿速度必定远快于$clergy_estate$独自应对。"
 hab_monastery_reform_accepted_decision.a: "改革[ShowBuildingTypeNameWithNoTooltip('monastery')]体系。"
 hab_monastery_reform_accepted_decision.a.tt: "将为我国所有[ShowBuildingTypeNameWithNoTooltip('monastery')]建筑解锁[ShowProductionMethodName('hab_reformed_monastery_maintenance')]。"
 hab_monastery_reform_accepted_decision.b: "他们只能自己适应。"
 hab_tractatus_incorporalibus_decision.title: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('peasants_estate')]阶层的困境"
 hab_tractatus_incorporalibus_decision.title.entry: "The Struggles of the $peasants_estate$"
 hab_tractatus_incorporalibus_decision.desc: "[ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')]的代表觐见[target_ruler.GetName]，请求朝廷干预，以缓解战争带来的沉重负担。虽然我们素来不以农民之诉求为意，但毋庸置疑，如果我们想要确保税收稳固、兵源充足，则必须争取他们的合作。倘若我们能够颁布一套明确的法规，规范农民与地主之间的义务与权利，则租佃关系也许能够得到调解，未来纠纷亦更容易解决。"
 hab_tractatus_incorporalibus_decision.desc.entry: "仅凭习俗而存在的义务，每逢歉收之年便会引发争执，而战争已使得年年歉收。将 $peasants_estate$ 应尽的义务明文订立，既能约束他们，也同样约束他们的领主；一个清楚知道自己该缴纳多少的农民，才会如数缴纳。"
 hab_tractatus_incorporalibus_decision.a: "授予他们特权。"
 hab_tractatus_incorporalibus_decision.b: "小小[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('peasants_estate')]也敢对我提要求？"
 hab_tractatus_incorporalibus_decision.b.entry: "The $peasants_estate$ dare to demand things from us?"
 hab_geheime_kabinettskanzlei_decision.title: "[ShowGovernmentReformNameWithNoTooltip('geheime_kabinettskanzlei')]"
 hab_geheime_kabinettskanzlei_decision.desc: "情报工作总是充满了不确定性，特别是在我们必须依靠特定个人来构建情报网络的情况下。许多国家已经建立了专门的机构来满足这些需求，我们也应该效仿，创建一个属于我们国家的“情报暗室”。[ShowGovernmentReformName('geheime_kabinettskanzlei')]将利用邮政机构作为掩护，以便轻松截取国内流通的信件，执行秘密侦查的任务。"
 hab_geheime_kabinettskanzlei_decision.a: "[ROOT.GetCountry.Custom('common_string_ok')]"
 hab_geheime_kabinettskanzlei_decision.a.entry: "$common_string_alright$"
 hab_geheime_kabinettskanzlei_decision.b: "谍报不过徒劳无益。"
 hab_geheimer_rat_decision.title: "[ShowAdvanceNameWithNoTooltip('geheimrat')]制度化"
 hab_geheimer_rat_decision.desc: "近期建立的[ShowAdvanceName('geheimrat')]受到了广泛称赞，不过[ROOT.GetCountry.GetGovernment.GetCourtTitle]中部分人担心维持其非正式运作是否足够。他们认为，也许应该将其制度化，成为[ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')]政策的一部分，确保只有最可信、最有能力的人才能影响[ROOT.GetCountry.GetFlavorRank]事务。"
 hab_geheimer_rat_decision.desc.entry: "一个非正式的顾问圈子，其存续也仅限于召集它的君主在位之时。若将其纳入$crown_estate$的官职体系之中，[ShowAdvanceName('geheimrat')]便能在我们身后长存，将国事牢牢掌握在少数够资格听闻机密之人手中。"
 hab_geheimer_rat_decision.a: "将它制度化！"
 hab_geheimer_rat_decision.a.tt: "解锁关于重要[ShowGovernmentReformName('hab_geheimer_rat')]成员的事件。"
 hab_geheimer_rat_decision.b: "当前的形式已经够用了。"
 hab_privilegium_maius_decision.title: "《大特权书》终归我手"
 hab_privilegium_maius_decision.desc: "如今，我国已登上[GetUniqueInternationalOrganization('hre').GetLeaderTitle]之位，终于能纠正前任[GetUniqueInternationalOrganization('hre').GetLeaderTitle]所犯下的重大错误。作为[GetUniqueInternationalOrganization('hre').GetName]的领导者，我们将亲自授予[target_ruler.GetDynasty.GetName]家族应得的特权。"
 hab_privilegium_maius_decision.desc.entry: "The privileges our house has always claimed were never granted by anyone with the authority to grant them. Now that the imperial title is ours, that inconvenience can be settled from the other side of the table, and the $hre$ can confirm what our predecessors merely asserted."
 hab_privilegium_maius_decision.a: "是时候拨乱反正了。"
 hab_privilegium_maius_decision.privilegium_not_granted_tt: "《大特权状》尚未完全获得授予"
 hab_privilegium_maius_decision.privilegium_not_decided_tt: "现已过了1370年，而《大特权状》尚未被提出"
