l_simp_chinese:
 mos_prikazi_decision.title: "建立 $prikazi_reform$ 衙署"
 mos_prikazi_decision.desc: "由于缺乏高效的行政机构，[ROOT.GetCountry.GetName]难以在列强中占据应有的位置。通过设立一套行政部门来监督不同的政府事务，我们可以加速[ROOT.GetCountry.GetGovernment.GetRuler.GetName]法令的执行，并有助于权力的集中。"
 mos_prikazi_decision.desc.entry: "统治者签署的诏令，无法保证下游之地有人会去阅读,更别提遵行了。设立常设衙署，各司国务一端，其传达君命之力，将远胜君主声名所能及。"
 mos_prikazi_decision.a: "否则我们怎能管理国家。"
 mos_prikazi_decision.b: "权力的自由发挥是成功的秘诀。"
 mos_prikazi_decision.tt1: "设立多个部门，[cabinet|e]成员可通过[cabinet_action|e]予以监督。"
 enable_prikazi_reform: "解锁[ShowGovernmentReformName('prikazi_reform')][government_reform|e]"
 mos_prikazi_decision.historical_info: "衙门是指沙皇俄国及早期俄罗斯帝国时期的各个行政机关，对于贯彻沙皇的各项政策和决策不可或缺，也处理与国家事务相关的日常工作。其中一些较大的部门专责外交事务，在俄罗斯四面受敌、尚在努力摆脱金帐汗国长期影响、巩固国家独立地位的时期，这些机构发挥了至关重要的作用。"
 mos_razriadnyi_decision.title: "[ShowGovernmentReformNameWithNoTooltip('razriadnyi_reform')]"
 mos_razriadnyi_decision.desc: "缺乏有效的人口、财产及税收记录，使得控制开支和扩大行政规模变得更加困难。我们可通过新设立的[ShowGovernmentReformName('razriadnyi_reform')]开展定期的人口普查，记录[ROOT.GetCountry.GetName]境内的个人及家庭的详细信息，评估臣民的资源和义务。"
 mos_razriadnyi_decision.desc.entry: "一个连臣民都数不清的国库，又如何能诚实地征税，而我们的国库已经猜测了多年。设立常设的户籍衙署，将为我们能征募多少兵员和钱粮定下一个真实的数字，即便在其所资助的第一场战役开始之前，这也是值得知晓的。"
 mos_razriadnyi_decision.a: "查遍每一个角落。"
 mos_razriadnyi_decision.b: "这是对隐私与尊严的侵犯。"
 enable_razriadnyi_reform: "解锁[ShowGovernmentReformName('razriadnyi_reform')][government_reform|e]"
 mos_razriadnyi_decision.historical_info: "#italic 军务衙门#!推行了一项新人口普查用于根据财富、财产及社会地位，以此评估应缴的税负。它还确保各阶层履行义务，提供所需的士兵及军需品。这些记录成为统治广阔而多样的领土的重要工具。"
 mos_build_kremlin_decision.title: "修建克里姆林宫"
 mos_build_kremlin_decision.desc: "罗斯诸地屡遭袭击，我们必须能够在危难时刻保护人民。环绕[target_location.GetName]的防御工事体系不堪重负，可能被攻破，从而阻碍我们成为地区强国的进程。\n\n我们应该建造一个强大的防御工事，其城墙部分要比附近的任何地方都要坚固。"
 mos_build_kremlin_decision.desc.entry: "劫掠者不会等城墙修好后再来试探，而我们的城墙经不起这样的试探。重建 [ShowLocationName('moscow')] 的防御，耗费巨大，我们本不愿如此破费，但失去这座城市，代价要大得多。"
 mos_build_kremlin_decision.a: "把最好的[ShowGoodsNameWithNoTooltip('lumber')]运进来。"
 mos_build_kremlin_decision.b: "我们不想激怒我们的邻居。"
 mos_build_kremlin_decision.c: "掠夺一个属国的[ShowBuildingTypeNameWithNoTooltip('castle')]作为材料。"
 threatened_by_military_expansion: "因军事扩张受到威胁"
 safe_haven_during_raids: "袭击期间提供安全庇护"
 mos_build_kremlin_decision.tt1: "敌对的邻国将建造强大的[ShowBuildingTypeNameWithNoTooltip('kremlin')]视为敌对行为"
 mos_build_kremlin_decision.tt2: "周边的属国认为建造一座强大的[ShowBuildingTypeNameWithNoTooltip('kremlin')]是袭击期间的安全避难所"
 mos_build_kremlin_decision.a.custom1: "所有相邻国家对[target_root_country.GetName]的[opinion|e]降低[ShowBiasValue('threatened_by_military_expansion')|+=0]"
 mos_build_kremlin_decision.a.custom2: "所有相邻[subject|e]对[target_root_country.GetName]的[opinion|e]提高[ShowBiasValue('safe_haven_during_raids')|+=0]"
 mos_build_kremlin_decision.b.custom1: "每个邻国获得#G 3#!对[target_root_country.GetName]的[trust|e]"
 mos_build_kremlin_decision.b.custom2: "所有相邻[subject|e]对[target_root_country.GetName]的[opinion|e]降低[ShowBiasValue('lack_of_protection')|+=0]"
 lack_of_protection: "缺乏保护设施"
 mos_kremlin_construction: "建造克里姆林宫"
 mos_build_kremlin_decision.tt3: "几乎所有需要的[ShowGoodsName('clay')]和[ShowGoodsName('lumber')]都是通过强行拆除位于[castle_location.GetName]的[ShowBuildingTypeNameWithNoTooltip('castle')]得到的。"
 mos_build_kremlin_decision.historical_info: "最初的莫斯科克里姆林主要由木材建造，不仅包括城墙和塔楼，还包括许多行政建筑。其建造是一项耗资巨大的工程，但被认为是必要的，因为此前所使用的简易木制防御工事在面对鞑靼人反复的掳掠袭击和敌军围攻时已被证明无效。"
 mos_vestiarium_decision.title: "皇家衣柜"
 mos_vestiarium_decision.desc: "皇家国库尚未被系统记录，缺乏清单，使得评估财产总值和利用资产变得困难。我们必须建立一种更高效的财富管理方式，以推动外交目标并强化[ROOT.GetCountry.GetFlavorRank]的统治。"
 mos_vestiarium_decision.a: "高效的治理是成功的关键。"
 mos_vestiarium_decision.b: "外交之网必须被精心编织。"
 mos_vestiarium_decision.custom: "解锁[ShowLawName('vestiarium')][law|e]"
 mos_vestiarium_decision.historical_info: "瓦西里一世引入的#italic 皇家衣柜#!是一份详细的金库记录，涵盖贵金属、珠宝、纺织品及礼仪用品。这些物品不仅用于国家庆典，也作为外交礼品之用。"
 mos_byzantine_court_ceremonies_decision.title: "与古老的$BYZ_ADJ$王朝联姻"
 mos_byzantine_court_ceremonies_decision.desc: "[ShowLocationName('constantinople')]陷落后，我们可以选择与[GetCountry('BYZ').GetName]的前统治家族联姻。与[sophia_palaiologina.GetName]的婚姻将为宫廷带来拜占庭文化的影响，加强我们作为罗马帝国天然继承者和[ShowReligionAdjective('orthodox')]领袖的宣称，[ROOT.GetCountry.GetGovernment.GetRulerTitle]的子嗣都将可以自称为陨落帝国皇帝的后裔。"
 mos_byzantine_court_ceremonies_decision.desc.entry: "靠征服夺来的王冠，终究是靠武力夺来的王冠；而靠联姻得来的王冠，看起来更像是继承而来。若将 [ShowLocationName('constantinople')] 的血脉与我们的家族联姻，这段婚姻所生的子嗣，日后便可自称是皇帝的血脉，而非仅仅是征服者的后裔。"
 mos_byzantine_court_ceremonies_decision.a: "注定的一对。"
 mos_byzantine_court_ceremonies_decision.b: "这没什么好处。"
 mos_byzantine_court_ceremonies_decision.tt1: "添加[character|e]索菲娅"
 enable_byzantine_court_ceremonies_reform: "解锁[ShowGovernmentReformName('byzantine_court_ceremonies_reform')][government_reform|e]"
 mos_byzantine_court_ceremonies_decision.tt2: "她对某些外交官表现出的怨恨将破坏与[target_root_country.GetName]及其[heathen|e]邻国的外交关系"
 STATIC_MODIFIER_NAME_mongol_intolerance: "抗拒蒙古"
 mos_byzantine_court_ceremonies_decision.historical_info: "伊凡三世与索菲娅·巴列奥略的婚姻将繁复的宫廷礼仪引入了俄罗斯宫廷，进一步巩固了莫斯科作为“第三罗马”的地位。索菲娅生下了11个孩子，是臭名昭著的伊凡雷帝的祖母。她对蒙古宗主权的反抗引发了多起外交事件，加速了莫斯科公国于1480年脱离金帐汗国的进程。"
 mos_monastic_reformation_decision.title: "确立尼尔·索尔斯基的教义体制"
 mos_monastic_reformation_decision.desc: "索拉的尼尔，一位宗教先驱，察觉到[ROOT.GetCountry.GetAdjective]修道院中悄然滋生的奢靡和物质主义，并开始为教会内部的改革奔走呼号。他发起的名为“无产派”的改革运动提议回到安贫戒骄的原则，强调完全忠于基督教义的简单生活方式。显然，任何这样的尝试都可能遭到教会既得利益者的抵制，因为他们认为必须维持一定的物质财富才能保障教会正常运转。"
 mos_monastic_reformation_decision.desc.entry: "尼尔·索尔斯基宣扬，一个拥有土地的修士，已经在“一无所有”这一论点上败下阵来，而不少教士对此深有同感，令教会颇为不安。支持无产派会令我们失去每一座富庶修道院的善意，却能换来每一位从未想要土地的修士的忠诚。"
 mos_monastic_reformation_decision.a: "支持无产派。"
 mos_monastic_reformation_decision.b: "支持有产派"
 mos_monastic_reformation_decision.custom1: "解锁[ShowLawName('monastic_reformation_movement')][law|e]"
 mos_monastic_reformation_decision.custom2: "每10年才能更改一次[ShowLawName('monastic_reformation_movement')][law|e]下的[policy|e]"
 mos_monastic_reformation_decision.historical_info: "索拉的尼尔是俄罗斯的一位东正教苦行僧，他曾经推动了被称为“无产派”的修道院改革运动。该运动由一群严格遵守修院禁奢原则的僧侣组成，批评修道院对土地和财富的占有。这些观点遭到教会内部一些人的反对，并在众人的抵制中宣告改革失败。尽管如此，他的思想在俄罗斯的精神信仰中留下了永恒印记，今天，索拉的尼尔被尊奉为东正教圣人。"
 mos_stroganov_school_decision.title: "创立斯特罗加诺夫画派"
 mos_stroganov_school_decision.desc: "富有的[ShowDynastyName('stroganov_dynasty')]商人家族是艺术的坚定支持者，正在考虑资助一个专注于宗教圣像创作的地方学校，许多作品将用于装饰[ROOT.GetCountry.GetFlavorRank]各地的宫殿。虽然这些艺术品主要为私人使用，未必惠及国家整体，但它们会加强这个强大家族的支持，并提升[ROOT.GetCountry.GetName]的精神福祉。"
 mos_stroganov_school_decision.desc.entry: "[ShowDynastyName('stroganov_dynasty')] 只想为自家礼拜堂添置圣像，而非为国家塑造圣徒，为此他们愿意出钱。用他们的钱建立的画派，国库分毫不得，只落得一个欠我们更少、却对我们期望更多的家族。"
 mos_stroganov_school_decision.a: "我们互惠互利。"
 mos_stroganov_school_decision.b: "推广他们的商业活动。"
 mos_stroganov_school_decision.c: "让他们在宫廷中施加影响力。"
 enable_stroganov_influences_cabinet_action: "[ShowDynastyNameWithNoTooltip('stroganov_dynasty')]家族成员可以使用[ShowCabinetActionName('stroganov_influences')][cabinet_action|e]"
 mos_stroganov_school_decision.historical_info: "斯特罗加诺夫画派兴起于中世纪绘画繁荣的俄罗斯，早于西化艺术传播到东欧之前，其艺术创作在很大程度上迎合皇室和贵族赞助人的品味，甚至包括沙皇的需求。该画派在彼得堡的建立后逐渐衰落，因西方艺术的影响逐渐占据主导地位。"
 mos_novodevichy_convent_decision.title: "新圣女修道院"
 mos_novodevichy_convent_decision.desc: "在成功征服[ShowAreaName('smolensk_area')]后，出现了一个机会，通过加强[ShowLocationName('moscow')]南部的防御带来保障[ROOT.GetCountry.GetName]安全的胜利纪念。修建一座防御性的修院不仅出于战略需要，还可作为许多被迫戴上修女头巾的[ShowPopTypeName('nobles')]女性的住所，借此争取[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]的支持。"
 mos_novodevichy_convent_decision.desc.entry: "一场胜利若能被石砌之物永久铭记，便更显其价值。在 [ShowLocationName('moscow')] 以南修建一座设防修道院，既可守卫在 [ShowAreaName('smolensk_area')] 赢得的通道，又能悄然收容那些无人愿娶的 [ShowPopTypeName('nobles')] 家女子，这份便利， $nobles_estate$ 是不会公开承认自己想要的。"
 mos_novodevichy_convent_decision.a: "事半功倍的选择。"
 mos_novodevichy_convent_decision.b: "[ShowLocationNameWithNoTooltip('moscow')]的防御已足够。"
 mos_novodevichy_convent_decision.c: "向受影响的女性提供津贴。"
 mos_novodevichy_convent_decision.historical_info: "新圣女修道院由瓦西里三世大公创建，以纪念成功征服斯摩棱斯克地区。修院作为一座防御堡垒和宗教机构保护城市西部入口，同时为俄罗斯皇室中被鼓励进入修院生活的女性提供住所。"
 mos_limit_namestnik_decision.title: "总督的权力"
 mos_limit_namestnik_decision.desc: "统治[ROOT.GetCountry.GetName]偏远地区的总督拥有相当大的权力。这种安排带来了一系列挑战，例如相当大一部分收入收不上来，以及难以让他们保持服从。我们应该直辖这些地区，并进行集中管理，这也许会牺牲当地精英的利益。"
 mos_limit_namestnik_decision.desc.entry: "总督若无监督地治理一省，久而久之便会将其视为自己的领地来统治。由中枢直接治理，可将总督们目前私自留存的岁入收归国有，其代价，是那些衙署赖以建立的一切地方忠诚。"
 mos_limit_namestnik_decision.a: "这是项过时的制度。"
 mos_limit_namestnik_decision.b: "不要惹是生非。"
 disable_namestnik_policy: "[ShowPolicyName('namestnik_policy')][policy|e]将不可用"
 mos_limit_namestnik_decision.historical_info: "总督在俄罗斯拥有重要的行政权力，担任君主在边远领土的代表。在伊凡四世统治时期，他们的权力有所削弱，但直到彼得大帝发起一系列改革，彻底改变俄罗斯的行政架构，他们才完全消失。"
 mos_posolsky_prikaz_decision.title: "使节衙门"
 mos_posolsky_prikaz_decision.desc: "[ivan_viskovatiy.GetName]的勤奋工作取得了成果，提升了外交事务的效率并简化了官僚体系。目前有人提议设立一个独立的部门来专门处理与外交相关的事务，以制定适用于其他政府领域的相同标准。"
 mos_posolsky_prikaz_decision.desc.entry: "$name_john.east_slavic_language$ $Viskovatiy$ 在没有正式衙署可供其施展的情况下，已高效地处理外交事务有些时日了。将这一安排常设化，不会耗费我们分毫，因为他的才干早已在悄然提供着这一切。"
 mos_posolsky_prikaz_decision.a: "明智的选择。"
 mos_posolsky_prikaz_decision.b: "国际阴谋策源地。"
 enable_posolsky_cabinet_action: "解锁[ShowCabinetActionName('posolsky')][cabinet_action|e]"
 mos_posolsky_prikaz_decision.historical_info: "#italic 使节衙门#!是监管对外事务和外交事务的政府部门，在外交关系管理、使节派遣和国际事务管理方面发挥了重要作用。"
 mos_moscow_artillery_yard_decision.title: "[ShowLocationNameWithNoTooltip('moscow')]炮场"
 mos_moscow_artillery_yard_decision.desc: "随着战场上火炮技术的进步，维持战争所需的充足弹药供应变得愈发重要。我们应指派工程师建立一个专门的设施，专注于火炮生产，将[ShowLocationName('moscow')]转变为技术创新中心及可靠的供应基地。"
 mos_moscow_artillery_yard_decision.a: "绝佳的交易。"
 mos_moscow_artillery_yard_decision.b: "最好把时间花在军事演习上。"
 mos_moscow_artillery_yard_decision.historical_info: "莫斯科炮场建于伊凡四世统治时期，对提升俄罗斯的军事能力发挥了重要作用。大炮和火炮的生产对俄罗斯不断扩大的军事影响力至关重要，并为多个冲突中的胜利做出了贡献。"
 mos_ban_oprichniki_decision.title: "特辖军出击"
 mos_ban_oprichniki_decision.desc: "特辖军仍在执行对被视为不忠之人的处决。最近，数个[ShowPopTypeName('nobles')]的乡村庄园成为目标，导致被分配到这些土地的[ShowPopTypeName('peasants')]因被禁止离开庄园而流离失所。如果不及时解决这一局面，我们将面临大规模粮食短缺的风险。"
 mos_ban_oprichniki_decision.a: "废止特辖军。"
 mos_ban_oprichniki_decision.b: "不关我们的事。"
 STATIC_MODIFIER_NAME_displaced_farmers: "农民流离失所"
 disable_oprichnik_policy: "[ShowPolicyName('oprichnik_policy')][policy|e]将不可用"
 mos_ban_oprichniki_decision.historical_info: "特辖军参与没收了那些被视为国家之敌的人的财产，而这进一步巩固了沙皇和他忠诚的支持者的经济实力，但产生了农民流离失所的负面影响，因为他们曾经的主人被杀或被捕。这反过来又对粮食生产造成了毁灭性影响，因为田地无人管理。"
 mos_aptekarsky_prikaz_decision.title: "药房衙门"
 mos_aptekarsky_prikaz_decision.desc: "根[ShowGovernmentReformName('prikazi_reform')]制度下设立的政府部门在行政中各司其职，然而最近的瘟疫流行提醒了我们需要重新关注与国民健康和福祉相关的事务。我们必须设立一个单独的办公机构，以便在下一次神罚或致命疾病爆发时更好地协调必要的应对措施，否则就有可能出现缺少有能力的工人来耕种土地和保卫我们伟大的[ROOT.GetCountry.GetFlavorRank]的风险。"
 mos_aptekarsky_prikaz_decision.desc.entry: "The prikazi handle war, trade, and law well enough, and handle plague not at all. A separate office for public health would matter little in a healthy year and matter a great deal in the next bad one, and we have had enough bad years to know which is coming."
 mos_aptekarsky_prikaz_decision.a: "给每个人分发水蛭放血。"
 mos_aptekarsky_prikaz_decision.b: "我们只需要祈祷。"
 mos_aptekarsky_prikaz_decision.tt1: "宫廷对药房衙门优先为社会上层提供医疗非常满意"
 enable_aptekarsky_cabinet_action: "解锁[ShowCabinetActionName('aptekarsky')][cabinet_action|e]"
 mos_aptekarsky_prikaz_decision.historical_info: "药房衙门是一个职权范围很广的政府机构，它负责监督药物的生产、销售，管理医院和药房以及解决一切和公共卫生相关的问题。此外，它还负责确保沙皇本人和宫廷成员的身心健康。药房衙门长期作为沙皇俄国行政机构中的重要组成部分，直到1917年十月革命后被解散。"
 mos_bolshogo_dvortsa_prikaz_decision.title: "$bolshogo_dvortsa$"
 mos_bolshogo_dvortsa_prikaz_decision.desc: "最近，[ShowLocationName('nizhny_novgorod')]的省长[alexey_lvov.GetName]返回了宫廷，并担任“御前近侍”的职位，这一官职使他能承担更多的行政职责。而在[ShowGovernmentReformName('prikazi_reform')]体制下，我们可以将这些权责进一步扩展至对修道院和宫廷事务的监管上，从而更好地处理宫廷开销，并确保我们在修道院管理上的[ShowPolicyName('non_possessors')]政策得到落实。"
 mos_bolshogo_dvortsa_prikaz_decision.desc.entry: "$name_alexis.east_slavic_language$ 已经拥有近侍官职位所赋予的信任，唯独缺少与之相配的官署。将宫廷领地与各修道院统归一位忠诚之人管理，能够整顿这个长期以来管理不善且各自为政的行政体系。"
 mos_bolshogo_dvortsa_prikaz_decision.a: "令人信服的方案。"
 mos_bolshogo_dvortsa_prikaz_decision.b: "别再弄一个督管了。"
 enable_bolshogo_dvortsa_cabinet_action: "解锁[ShowCabinetActionName('bolshogo_dvortsa')][cabinet_action|e]"
 enable_bolshogo_dvortsa_cabinet_action.tt2: "[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]对受到充分的信任而感到欣喜若狂"
 mos_bolshogo_dvortsa_prikaz_decision.historical_info: "阿列克谢·米哈伊洛维奇·利沃夫亲王曾是一名副省长，在沙皇政府中迅速崛起，被任命为沙皇宫廷的总管后，他领导外交代表团并担任大使。他担任大宫廷衙门的首长，直到最终退休。"
 mos_greek_latin_academy_decision.title: "Establish the $greek_latin_academy$"
 mos_greek_latin_academy_decision.desc: "一位来自[ShowLocationName('polotsk')]的虔诚学者建议我们建立一座语言学校，主要用于教育公职人员使用以[latin.GetName]语为首的外交语言。作为一位时常提出争议性意见的人士，[simon_sitnianowicz.GetName]同时也提出由他担任教师以向普通人教授语法、格律学和修辞学。这样一项提议值得我们的推崇，我们应该拨出资金以确保其成果。"
 mos_greek_latin_academy_decision.desc.entry: "Diplomacy is conducted in [ShowLanguageName('latin_language')], and our officials mostly are not. $name_simeon.east_slavic_language$ $Sitnianowicz$ proposes to teach it properly, and has further offered to teach the common people rhetoric as well, an ambition well past what the funding was meant to cover."
 mos_greek_latin_academy_decision.a: "交流是语言的关键。"
 mos_greek_latin_academy_decision.b: "最好把精力放在布道和传教上。"
 mos_greek_latin_academy_decision.c: "聘请他担任私人教师。"
 mos_greek_latin_academy_decision.d: "必须让民众处于蒙昧之中。"
 mos_greek_latin_academy_decision.tt1: "添加[character|e]西蒙·西特尼亚诺维奇"
 mos_greek_latin_academy_decision.tt2: "他将时间用于传播启蒙思想和创作诗歌"
 mos_greek_latin_academy_decision.tt3: "[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]对我们流放了一个思想不端分子而感到满意"
 mos_greek_latin_academy_decision.historical_info: "波洛茨克的西蒙是白俄罗斯东正教修士、诗人和翻译家。他因文学贡献而为人所铭记，并被认为对塑造俄罗斯东正教传统起到了重要作用。他在俄罗斯引入了希腊语和拉丁语的教学，并在生涯中协助翻译了多部西方神学家著作，从而促进了东正教会思想的传播。"
 mos_collegium_decision.title: "部院"
 mos_collegium_decision.desc: "近来，我们对政府机构进行了全面的改革。为了改正行政机关叠床架屋的现象，提高部级政府的行政效率，我们将废除旧有的[ShowGovernmentReformName('prikazi_reform')]制度，以一系列“部院”取而代之。每个部院权责分明，且确保权力制衡，可以在需要征求意见时对未决事项发表提议。"
 mos_collegium_decision.a: "新人上任，旧人退位。"
 mos_collegium_decision.b: "政治机构是一个精密的机器，不能草率地动摇它。"
 variable_prikazi_tt: "衙门制度治理国家"
 enable_collegium_reform: "解锁[ShowGovernmentReformName('collegium_reform')][government_reform|e]"
 mos_collegium_decision.tt1: "[ShowGovernmentReformNameWithNoTooltip('prikazi_reform')][government_reform|e]和其他所有相关[cabinet_action|e]都将不可用"
 mos_collegium_decision.tt2: "在[ShowPolicyName('dop_law_governing_senate')][policy|e]下，我们采取措施加强了对[ShowLocationName('neva')]的管理"
 mos_collegium_decision.historical_info: "在建立了参议院制度后，彼得大帝又设立了一系列的部院作为行政机构，负责不同部门的管理工作，如宗教会议和海军院。这项改革的灵感来自于邻国瑞典最近实施的类似改革。而俄罗斯帝国领土的快速扩张又加快了改革的急迫性。"
 mos_sukharev_tower_decision.title: "苏哈列夫塔"
 mos_sukharev_tower_decision.desc: "海军需要稳定的水手供应和知识的代代相传。为了实现我们的海军雄心，我们应该建立一所提供专业教育的学校，为继续扩大武装力量奠定基础。最近有人提交了一份宏伟的塔楼设计，在作为学校的同时还能为[ShowLocationName('moscow')]城市景观增添几分色彩。"
 mos_sukharev_tower_decision.a: "很适合。"
 mos_sukharev_tower_decision.b: "没必要这么奢侈。"
 mos_sukharev_tower_decision.c: "它必须满足[target_location.GetRank.GetNameWithNoTooltip]的需要。"
 mos_sukharev_tower_decision.c.entry: "It must meet the needs of the city."
 mos_sukharev_tower_decision.tt1: "顶楼被指定给詹姆斯·布鲁斯用来建立观星天文台"
 mos_sukharev_tower_decision.tt2: "二楼建造了最先进的供水系统供[ShowLocationName('moscow')]使用"
 mos_sukharev_tower_decision.historical_info: "苏哈列夫塔建于17世纪末，用以纪念彼得大帝战胜几年前造反的射击军。多年来，这座塔有各种用途，例如军营、教育设施、基础设施和商用仓库，直到1934年最终被苏联当局拆毁。"
 mos_chosen_rada_decision.title: "重臣会议"
 mos_chosen_rada_decision.desc: "[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]势力正在阻碍快速决策所需的集权。有人建议我们挑选人才成立执行委员会，以加快政府程序，遏制贵族影响力，解决各种问题并实施必要改革。[alexi_adashev.GetName]和[sylvestr_the_priest.GetName]是[ROOT.GetCountry.GetGovernment.GetRulerTitle]的密友，预计会加入这一委员会。"
 mos_chosen_rada_decision.desc.entry: "宠臣议事会向统治者负责；而 $nobles_estate$ 却不向任何人负责，这正是问题所在。让 $name_alexander.east_slavic_language$ · $adashev$ 与 $name_silvester.east_slavic_language$ 置身于政府核心，便能将决策权从议会手中移出，转入我们真正能掌控的房间之内。"
 mos_chosen_rada_decision.a: "由人才组成的强大力量。"
 mos_chosen_rada_decision.b: "这样的议会将毫无影响力。"
 mos_chosen_rada_decision.tt3: "亚历山大·阿达舍夫和西尔维斯特被逮捕并处决，让[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]大为欢喜"
 enable_chosen_rada_reform: "解锁[ShowGovernmentReformName('chosen_rada_reform')][government_reform|e]"
 mos_chosen_rada_decision.historical_info: "重臣会议在伊凡四世统治前期发挥着重要作用，其成员包括阿列克谢·阿达舍夫和西尔维斯特神甫等伊凡四世大公可靠的顾问，为伊凡集权、改革法律和解决各类国家大事做出了重要贡献。"
 rus_russian_absolutism_decision.title: "行政大改革"
 rus_russian_absolutism_decision.desc: "是时候摒弃过时的传统和低效的管理手段，实现[ROOT.GetCountry.GetName]行政的现代化了。通过加强[ROOT.GetCountry.GetGovernment.GetRulerTitle]的立法权，并确保[ROOT.GetCountry.GetGovernment.GetRuler.GetHisHer]的敕令得到协调集权的政府的迅速执行，我们可以突飞猛进，保证任何改革都不会因腐败和耗时的上诉而脱轨。"
 rus_russian_absolutism_decision.desc.entry: "一项法令若须先通过议会审议才能付诸实践，那它其实早已失败了一半。将权力集中于统治者与一个统一协调的部门之下，便能让改革摆脱那些曾埋葬历次尝试的申诉与拖延。"
 rus_russian_absolutism_decision.a: "新的开始。"
 rus_russian_absolutism_decision.b: "旧体制更好！"
 enable_russian_absolutism_reform: "解锁[ShowGovernmentReformName('russian_absolutism')][government_reform|e]"
 rus_russian_absolutism_decision.tt1: "[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]对公然无视他们的特权感到愤怒"
 rus_russian_absolutism_decision.historical_info: "在彼得大帝在位期间，他用强有力的独裁统治取代了中世纪的和过时的政府体制。1711年，他彻底废除了波雅尔议会，建立了参议院作为国家最高权力机关，来协调中央与地方机构的职权，监督财政收入和订立法律。军事纪律扩展到民政系统，参议院总有一名卫队军官执勤。"
 rus_state_controlled_church_decision.title: "政府管制教会"
 rus_state_controlled_church_decision.desc: "牧首制度仍然拥有相当大的权力和影响力，但却偏袒传统与教权，阻碍了进步与创新。必须废除牧首制度，建立新的体系，加强政府对教会的控制，确保教会服从国家。"
 rus_state_controlled_church_decision.a: "废除牧首职位。"
 rus_state_controlled_church_decision.b: "$common_string_leave_them_be$"
 rus_state_controlled_church_decision.c: "一切照旧，但有条件。"
 rus_state_controlled_church_decision.tt1: "神圣宗教会议会对所有出版物实行严格审查"
 rus_state_controlled_church_decision.historical_info: "1721年，彼得大帝为了让正教会隶属于国家，废除了莫斯科牧首的职位。一个代表沙皇意志的宗教机构——神圣宗教会议取代了牧首的地位。神圣会议对反对者进行了严酷的宗教迫害，并对出版物实行审查，而沙皇会委任一名大检察官监督神圣宗教会议。"
 rus_academy_of_sciences_decision.title: "科学院"
 rus_academy_of_sciences_decision.desc: "培养对知识和科学的追求，以确保[ROOT.GetCountry.GetName]维持当前的国际地位，对我们来说非常重要。我们可以在新的启蒙之都建立一所科学院，使其成为数学、天文学、物理学、化学等领域的创新堡垒。"
 rus_academy_of_sciences_decision.desc.entry: "一个依赖进口数学与物理知识的大国，永远落后于那些自主产出这些知识的强国。在我们最新建立的城市中设立一所科学院，将比任何一场胜利都更能昭示：$RUS$ 意欲跻身后者之列。"
 rus_academy_of_sciences_decision.a: "智力才能必须与军事实力相匹配。"
 rus_academy_of_sciences_decision.b: "通过对话取得进步。"
 rus_academy_of_sciences_decision.tt1: "瓦西里·塔季谢夫对学院的贡献大幅加快了其建成速度，[ShowLocationName('neva')]也从中获得了好处"
 rus_academy_of_sciences_decision.tt2: "詹姆斯·布鲁斯的文学作品被加入学院收藏，丰富了其学术资源"
 rus_academy_of_sciences_decision.tt3: "[target_root_country.GetName]最优秀的人才积极与欧洲其他教育机构展开思想与外交交流"
 rus_academy_of_sciences_decision.historical_info: "彼得大帝随“大使团”一起游历欧洲后，建立了圣彼得堡科学院，灵感来自于巴黎学院和伦敦皇家学会，同样以促进科学和学术研究为目标。该学院在推动俄罗斯的科学知识和文化发展方面发挥了重要作用。"
 rus_manifesto_of_freedom_decision.title: "自由诏书"
 rus_manifesto_of_freedom_decision.desc: "治理国家的能力需要稳定的国情以及一位掌控全局的强势统治者。目前，[ROOT.GetCountry.GetGovernment.GetRuler.GetName]的政策引发了一定程度的不满，明智之举是确保[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]的持续支持，以渡过难关。我们可以提出慷慨的让步，包括豁免[ShowPopTypeName('nobles')]的国家义务，并赋予其他公民自由权利，使我们能够专注于稳定目前脆弱的专制统治。"
 rus_manifesto_of_freedom_decision.desc.entry: "一位统治者若拥有一个心怀不满的 $nobles_estate$ ，那么他的专制在实际上便算不得多么专制。免除 $nobles_estate$ 的强制服役义务，虽使国家失去了他们应尽的责任，却也换来了一个在王权尚未稳固之时，更少有理由密谋反叛的 $nobles_estate$ 。"
 rus_manifesto_of_freedom_decision.a: "必要之恶。"
 rus_manifesto_of_freedom_decision.b: "让我们寻找一项折衷方案。"
 rus_manifesto_of_freedom_decision.c: "令人反感的提议。"
 rus_manifesto_of_freedom_decision.tt1: "授予[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]的广泛特权在[target_root_country.GetGovernment.GetRuler.GetName]统治期间无法剥夺"
 revoke_manifesto_of_freedom: "授予[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]的广泛特权在授予者统治期间无法剥夺"
 rus_manifesto_of_freedom_decision.tt2: "[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]利用国家困境，积极阻碍[target_root_country.GetGovernment.GetRuler.GetName]的统治。"
 rus_manifesto_of_freedom_decision.historical_info: "#italic 《贵族自由宣言》#!由彼得三世皇帝在其短暂而失败的统治期间颁布。这一想法背后有多个因素，由于地缘政治联盟的变化，他设法疏远了大多数贵族，这使俄罗斯丧失了对普鲁士的重大军事胜利。为稳定自身统治，彼得削减了贵族的义务，并没收教会的土地以支付成本，此举却得罪了教会。他强行推行普鲁士军事训练几乎引发叛乱，最终被妻子叶卡捷琳娜发动政变推翻。"
 rus_speransky_liberalization_decision.title: "变革的火花"
 rus_speransky_liberalization_decision.desc: "实施新的宪法制度仍然是在内阁负责引领变革的进步先驱[mikhail_speransky.GetName]的首要任务。让我们拥抱变革之风，在自由的指南针的指引下，驶入未知的水域。"
 rus_speransky_liberalization_decision.desc.entry: "$name_michael.east_slavic_language$ $Speransky$ 已花费数年时间起草了一部宪法，却至今无人有勇气颁布。此刻支持他，便意味着我们将投身于一场我们无法完全预知其形态的改革——而这正是我们之前的每一位统治者都选择观望的原因。"
 rus_speransky_liberalization_decision.a: "风啊，起航吧！"
 rus_speransky_liberalization_decision.b: "有争议，而且很危险。"
 enable_speransky_liberalization_reform: "解锁[ShowGovernmentReformName('speransky_liberalization_reform')][government_reform|e]"
 rus_speransky_liberalization_decision.tt1: "尽管[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]反对，仍采取了渐进措施实现[target_root_country.GetName]行政的现代化"
 rus_speransky_liberalization_decision.historical_info: "锐意改革的沙皇亚历山大一世在他统治期间做出了实质性的改革。1802年，他设立了八个部门，使行政更具组织性，兑现了他高效治理的承诺。这个时代见证了米哈伊尔·斯佩兰斯基的影响力，他是沙皇的重要顾问，现代化的提倡者。"
 rus_free_economic_society_decision.title: "自由经济协会"
 rus_free_economic_society_decision.desc: "Agriculture remains a staple in our society, yet the cultivation methods and farming techniques used by the [ShowPopTypeName('peasants')] are static and low-yielding in comparison to competing powers. For a modest cost, power architect [grigory_orlov.GetName] has proposed the creation of an economic organization to advance the knowledge in agriculture and commerce, and has also offered to take on a leading role in its administration.\n\nShould the organization succeed, it must also aim to improve the education of farmers and promote the training of skilled workers by providing practical advice and publishing journals and research papers on the topic."
 rus_free_economic_society_decision.desc.entry: "一个像祖辈一样耕作的农民，养活的人口也不会比祖辈更多。$name_gregory.east_slavic_language$ $Orlov$ 主动提出，愿以低廉的花费创立一个学会，教授更好的耕作方法，尽管其承诺的期刊与农民教育计划，远远超出了最初的请求范围。"
 rus_free_economic_society_decision.a: "我们终究需要养活自己。"
 rus_free_economic_society_decision.b: "这样不行。"
 STATIC_MODIFIER_NAME_potato_varieties_introduced: "引入马铃薯品种"
 rus_free_economic_society_decision.tt1: "协会引入了新[ShowGoodsName('potato')]品种和突破性的耕作方式，有助于提高作物产量"
 rus_free_economic_society_decision.tt2: "[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]对于维护他们对[ShowPopTypeName('peasants')]的权势非常满意"
 rus_free_economic_society_decision.historical_info: "帝国自由经济协会由格里戈里·奥尔洛夫在叶卡捷琳娜二世女皇的支持下建立，女皇认为俄罗斯的农业方式已经过时，落后于其他大国，尤其是英国。该协会发表了几篇关于新农业技术的论文，介绍了作物，并组织活动教育农民，以便他们能更有效地耕作，生产更多粮食。"
 rus_imperial_academy_arts_decision.title: "帝国艺术学院"
 rus_imperial_academy_arts_decision.desc: "远见卓识的改革者[ivan_shuvalov.GetName]正在继续[ivan_shuvalov.GetHisHer]对教育体系的改革，并持续支持艺术事业。[ivan_shuvalov.GetSheHe|U]正致力于创办一所追求艺术和建筑最高标准的学院，培养和发展[ROOT.GetCountry.GetAdjective]的艺术人才，资助最有潜力的学生前往欧洲各创新城市深造。让我们拥抱这一倡议，建立一个文化进步的堡垒，将[ShowLocationName('neva')]打造成古典主义的灯塔。"
 rus_imperial_academy_arts_decision.desc.entry: "$name_john.east_slavic_language$ $Shuvalov$ 已经改革了学校体制；如今他希望建立一所学院，将我们最有前途的画家与建筑师送往海外深造，并培养出足够优秀的艺术家，使 [ShowLocationName('neva')] 无需再从欧洲进口审美品味。"
 rus_imperial_academy_arts_decision.a: "高尚的提案。"
 rus_imperial_academy_arts_decision.b: "内阁职责优先。"
 rus_imperial_academy_arts_decision.c: "不破不立。"
 rus_imperial_academy_arts_decision.tt1: "尊敬的格雷戈里·奥尔洛夫捐赠了他艺术收藏中相当一部分给新成立的学院"
 rus_imperial_academy_arts_decision.tt2: "约翰·舒瓦洛夫全心专注于[cabinet|e]事务，在[ivan_shuvalov.GetHisher]的岗位上表现出色，并提升了公共服务的标准。"
 rus_imperial_academy_arts_decision.tt3: "当前的建筑风格得到了加强，迎来了第二次文艺复兴。"
 rus_imperial_academy_arts_decision.historical_info: "帝国艺术学院位于圣彼得堡涅瓦河畔，由政治家和艺术爱好者伊万·舒瓦洛夫于1757年创建。学院提倡新古典主义风格和技法，旨在效仿欧洲艺术学院，并邀请外国艺术家来教授俄罗斯学生。"
 mos_moscow_orphanage_decision.title: "善意的孤儿院"
 mos_moscow_orphanage_decision.desc: "内阁大臣 [ivan_betskoy.GetName] 提出了一项值得关注的构想，旨在解决目前被视为最严重弊病之一的问题，即弃婴现象。他建议我们设立一处安全的庇护所，为这些不幸的孩子提供食粮与教育，确保他们长大后能成为社会中有用之人。资金来源问题尚未解决，但目前正在考虑数种切实可行的方案，以维持这项计划的运作。"
 mos_moscow_orphanage_decision.desc.entry: "一个自出生便被遗弃的孩童，如今不会耗费国家分毫，但二十年后，无论如何都将付出沉重代价。$name_john.east_slavic_language$ $Betskoy$ 提议建立一处庇护所，将他们培养成有用之臣民，只是尚需有人愿意出资支持。"
 mos_moscow_orphanage_decision.a: "一项利润丰厚的投资。"
 mos_moscow_orphanage_decision.b: "崇高的事业。"
 mos_moscow_orphanage_decision.c: "各扫门前雪。"
 mos_moscow_orphanage_decision.tt1: "为孤儿院成立几家私人银行，管理贷款和储蓄，为运营提供资金"
 mos_moscow_orphanage_decision.tt2: "资金将由国库慷慨提供"
 mos_moscow_orphanage_decision.historical_info: "莫斯科孤儿院与1763年在叶卡捷琳娜大帝和伊万·别茨科伊的领导下成立，后者是女皇政府的一名大臣，教育改革的伟大倡导者。当时，启蒙思想在俄罗斯和欧洲各地深入人心，该机构应运而生。尽管资金充足，但受限于婴儿的高死亡率，孤儿院对弃婴的影响其实有限，不过，确实有一些人受益于孤儿院提供的教育，成功获得了工作。"
 rus_institute_of_noble_maidens_decision.title: "贵族女子学院"
 rus_institute_of_noble_maidens_decision.desc: "女性教育仍是一个备受争议的话题，热情的倡导者[ivan_betskoy.GetName]召集内阁，旨在创建一所专门培养贤妻良母的教育机构。这些女性被期望成为家庭和社会的有价值的贡献者。让我们委托一座适合的建筑，致力于进步的理念和包容性，开始塑造一个新一代，远离愚昧的父母对子女的不良影响。"
 rus_institute_of_noble_maidens_decision.desc.entry: "一个只为料理家务而抚养长大的女儿，永远不会有超出家务的作为。$name_john.east_slavic_language$ $Betskoy$ 希望建立一所学院，教导年轻女性成为不止于此的人，其立论在于：受过教育的母亲，比愚昧无知的母亲，更能养育出有能力的下一代。"
 rus_institute_of_noble_maidens_decision.a: "建造它。"
 rus_institute_of_noble_maidens_decision.b: "改建[ShowBuildingTypeNameWithNoTooltip('novodevichy_convent')]。"
 rus_institute_of_noble_maidens_decision.c: "这是对既定秩序的威胁。"
 rus_institute_of_noble_maidens_decision.tt1: "所有[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]和[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]少女都将获得凭证"
 rus_printed_charters: "印刷凭证"
 rus_institute_of_noble_maidens_decision.historical_info: "伊万·别茨科伊在叶卡捷琳娜大帝的有力支持下建立了贵族女子学院，旨在让女性了解伏尔泰和洛克等当时的思想家。孩子们在年幼时就进入女校，与父母分别六年。该学院将多次更换地点，并且需要缴纳年金，以确保排他性，限制社会底层成员进入。"
 mos_nakaz_decision.title: "《立法圣谕》"
 mos_nakaz_decision.desc: "推动[ROOT.GetCountry.GetName]进入一个新的启蒙和进步时代变得越来越重要。欧洲正在掀起一股革新潮流，我们需要对法律体系进行一场与此相适应的改革，融入理性、正义和人道主义等理念。通过接受这些价值观，我们可以最终摆脱那些阻碍社会发展的过时法律实践。让我们走上改革的道路，实现所有公民在法律面前的平等。"
 mos_nakaz_decision.desc.entry: "A legal code inherited rather than written reflects the century that wrote it, not the one we live in. Rebuilding it around reason and equality before the law would put $RUS$ in step with the ideas now sweeping Europe, at the cost of every custom that code currently protects."
 mos_nakaz_decision.a: "进步会带来阵痛。"
 mos_nakaz_decision.b: "启动刑法改革。"
 mos_nakaz_decision.c: "我们不敢这么做。"
 enable_nakaz_reform: "解锁[ShowGovernmentReformName('nakaz_reform')][government_reform|e]"
 mos_nakaz_decision.tt1: "[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]对其自身权力地位受到威胁感到愤怒"
 mos_nakaz_decision.tt2: "对罪犯采取更人道的态度而不解决社会改革的需求，导致大城市犯罪率的增加"
 mos_nakaz_decision.tt3: "向保守势力妥协，使其议程得以强化"
 mos_nakaz_decision.historical_info: "叶卡捷琳娜大帝为了现代化和改革法律体系，下达了#italic 《圣谕》#!，又称#italic 《立法圣谕》#!。受启蒙思想的影响，它试图创造一个符合当时进步哲学的法律体系，并简化和澄清法律。它引入了更加人道的惩罚，限制了酷刑的使用，并强调了所有公民在法律面前的平等。由于反对它的保守势力众多，《圣谕》从未得到全面实施，叶卡捷琳娜大帝最终将她的重心转移到了其他优先事项上。"
 rus_intellectual_movements_decision.title: "民族主义的兴起"
 rus_intellectual_movements_decision.desc: "[ShowCultureGroupName('slavic_group')]文化的定义，以及其至高无上的地位是学者们激烈辩论的话题。对于我们是否应该采取更亲西方的立场，以确保[ROOT.GetCountry.GetName]不会在传统的无尽循环中停滞不前，以及传统的重要性是否被低估了，应该维持传统保护[ROOT.GetCountry.GetAdjectiveWithNoTooltip]身份认同，人们意见不一。这种分歧推动了两个著名知识运动的产生，希望引导我们走向相反的方向，我们必须选择一条符合我们对未来的愿景的道路。"
 rus_intellectual_movements_decision.desc.entry: "学者们因 [ShowCultureGroupName('slavic_group')] 身份究竟应完整保留，还是应为西方式的进步而舍弃，而产生了分裂，这场争论已固化为两个阵营，二者不可能同时塑造 $RUS$ 的未来。在两者之间做出选择，无论选哪一方，都无法令另一方心甘接受。"
 rus_intellectual_movements_decision.a: "支持斯拉夫派。"
 rus_intellectual_movements_decision.b: "支持西化派。"
 rus_intellectual_movements_decision.custom1: "解锁[ShowLawName('intellectual_movements')][law|e]"
 rus_intellectual_movements_decision.custom2: "[ShowLawName('intellectual_movements')][law|e]下的[policy|e]只能每十年更改一次"
 rus_intellectual_movements_decision.historical_info: "西化派和斯拉夫派是19世纪俄罗斯的两个截然不同的思想和意识形态运动。他们对俄罗斯的发展道路、与西欧的关系以及对俄罗斯文化认同的保护有着不同看法。西化派倾向于通过采用西方思想、制度和技术来实现现代化，而斯拉夫派则强调保护俄罗斯传统的价值观、信仰和社区结构。"
 rus_secretnoye_byuro_decision.title: "秘密与调查事务办公厅"
 rus_secretnoye_byuro_decision.desc: "对于利用[current_policy.GetName]抑制权贵的挑战，人们对于[ROOT.GetCountry.GetName]政府的相应能力的担忧日益加剧。[ShowCabinetActionName('bironovshchina')]部门的外国势力提出了一项计划，建议成立一个专门机构，以强硬手段实现震慑。我们应复兴鞭刑的使用，重组秘密警察，重新树立权威，阻止任何破坏我们至高统治的企图。"
 rus_secretnoye_byuro_decision.desc.entry: "一项仅能遏制叛乱、却不能真正杜绝叛乱的政策，与真正能防患于未然的政策截然不同，官僚体系中的外国间谍已经察觉到了这一区别。重启鞭刑、设立专门的密探机构可以回应这一诉求，但代价是彻底放弃 $RUS$ 以任何比恐惧更温和的方式治理国家的伪装。"
 rus_secretnoye_byuro_decision.a: "服从需要偶尔的牺牲。"
 rus_secretnoye_byuro_decision.b: "我们不屑于此等行径。"
 enable_secretnoye_byuro_policy: "解锁[ShowPolicyName('secretnoye_byuro_policy')][policy|e]"
 rus_secretnoye_byuro_decision.tt1: "此选项仅在[cabinet|e]成员执行[ShowCabinetActionName('bironovshchina')][cabinet_action|e]时可用。"
 rus_secretnoye_byuro_decision.historical_info: "秘密与调查事务办公厅在安娜·伊万诺夫娜女皇的统治时期发挥了重要作用，用以打压政治对手，维护其专制统治。惩罚方式包括割鼻和用长柄皮鞭抽打致死，这是一种特制的鞭子，其特点是用生牛皮皮带或绳子连接到延长的木柄上。据估计，约两万名贵族成为政治清洗的受害者。"
 rus_proclaim_tsardom_decision.title: "宣布 $tsardom$"
 rus_proclaim_tsardom_decision.desc: "The gathering of the Rus' lands is complete, and the [GetInternationalOrganizationType('tatar_yoke').GetName] is broken. Our [GetCountry('RUS').GetFlavorRank] now stands supreme among the principalities, and our [GetCountry('RUS').GetGovernment.GetEstateName('clergy_estate')] urge us to claim a dignity to match: our sovereign should be crowned [SelectLocalization(GetCountry('RUS').GetGovernment.GetRulerOrRegent.IsFemale,'rank_empire_tsar_ruler_female','rank_empire_tsar_ruler_male')], heir to the emperors of old and guardian of the [ShowReligionAdjective('orthodox')] faith.\n\nSuch a coronation would proclaim to every court in Europe and every khanate of the steppe that [GetCountry('RUS').GetName] bow to no foreign crown."
 rus_proclaim_tsardom_decision.desc.entry: "罗斯诸地已经统一，[GetInternationalOrganizationType('tatar_yoke').GetName] 已被打破，一位早已完成帝国伟业的统治者，如今唯独缺少帝国的尊号。获取这一尊号无需付出别的代价，只需一份自信，却会向欧洲每一个宫廷明确宣告：从今往后，我们期望别人如何称呼我们。"
 rus_proclaim_tsardom_decision.a: "让我们的君主加冕为全俄罗斯 [SelectLocalization(GetCountry('RUS').GetGovernment.GetRulerOrRegent.IsFemale,'rank_empire_tsar_ruler_female','rank_empire_tsar_ruler_male')]。"
 rus_proclaim_tsardom_decision.historical_info: "On 16 January 1547, Ivan IV of Moscow was crowned in the Cathedral of the Dormition within the Kremlin, the first Muscovite ruler to be formally invested with the title of Tsar. Metropolitan Macarius, who had championed the new dignity, placed upon him the Cap of Monomakh, a jeweled fur-trimmed crown that court tradition held to be a gift from the Byzantine emperor Constantine IX to Grand Prince Vladimir Monomakh centuries earlier.\n\nThe new title marked a deliberate break from the older style of Grand Prince, asserting a rank equal to that of an emperor and heir to the fallen Christian empires of the East. Foreign courts were slow to recognize it: it took decades of diplomacy before the Holy Roman Empire and the Papacy accepted Tsar as the equivalent of King, rather than a mere translation of Grand Prince."
 mos_byzantine_court_ceremonies_decision.a_tt: "我方统治者将迎娶拜占庭统治王朝的后裔，若有必要，将与现任配偶离异。"
 mos_chosen_rada_decision.a_tt: "$name_alexander.east_slavic_language$·$adashev$与$name_silvester.east_slavic_language$将加入我们的[court|e]"
 rus_institute_of_noble_maidens_decision.b.tt: "若 [ShowBuildingTypeNameWithNoTooltip('novodevichy_convent')] 已存在，我们将对其加以改造利用。否则，我们将在 [ShowLocationNameWithNoTooltip('moscow')] 建造 [ShowBuildingTypeNameWithNoTooltip('institute_of_noble_maidens')]"
 rus_nakaz_decision.desc.entry: "推行新法典的需要日益明显，许多开明的学者正在向我们的统治者请愿，要求进行法律改革。然而，强行推动改革可能会招致政府内部某些势力的强烈反弹。"
