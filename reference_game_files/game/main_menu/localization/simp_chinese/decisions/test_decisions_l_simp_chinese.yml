l_simp_chinese:
 test_decision_simple.title: "测试决议（多选项）"
 test_decision_simple.desc: "一项包含三个选项的测试决议，用于验证决议数据模型能否正确解析，以及各选项的效果能否完整生效。"
 test_decision_simple.a: "获取黄金（+10）"
 test_decision_simple.b: "支付黄金（-10）"
 test_decision_simple.c: "什么也不做。"
 test_decision_only_once.title: "测试决议（每局游戏仅限一次）"
 test_decision_only_once.desc: "一项每场战役只能采取一次的测试决议，用于验证“仅限一次”标记能否在存档与读档间持续保留，并阻止再次执行。"
 test_decision_only_once.a: "领取意外之财（+50黄金）"
 test_decision_only_once.b: "减少"
