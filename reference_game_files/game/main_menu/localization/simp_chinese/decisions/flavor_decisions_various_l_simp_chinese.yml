l_simp_chinese:
 ser_novo_brdo_mine_decision.title: "[ShowLocationNameWithNoTooltip('novo_brdo')]采矿法"
 ser_novo_brdo_mine_decision.desc: "繁忙的采矿城镇[ShowLocationName('novo_brdo')]已制定出一套规章制度，来管理其利润丰厚的产业内的各项复杂作业与权利。最近，越来越多人呼吁根据其原则制定一部全面的全国性采矿法规。拟议的《[ShowPolicyName('novo_brdo_mining_law')]》将规范采矿城镇的组织，明确矿工的权利和责任，并确保[ROOT.GetCountry.GetName]的规定公平，措施安全。"
 ser_novo_brdo_mine_decision.desc.entry: "一座矿业小镇历经反复试验与争执，终于摸索出了一套既能保证矿井盈利、又能防止矿工们为此自相残杀的规矩。将[ShowLocationName('novo_brdo')]的惯例定为$SER$境内所有矿场共通的法律，会使其他城镇失去各自的地方习俗，却能让它们免去粗劣地另行制定同样规矩的麻烦。"
 ser_novo_brdo_mine_decision.a: "在全国范围内落实这部采矿法。"
 ser_novo_brdo_mine_decision.b: "维持当前的采矿法规。"
 has_unlocked_novo_brdo_tt: "已通过#Y《[ShowLocationNameWithNoTooltip('novo_brdo')]法典》#!解锁该法律 [decision|e]"
 STATIC_MODIFIER_NAME_ser_novo_brdo_code: "新布尔多采矿法"
 ser_novo_brdo_mine_decision.historical_info: "1412年由斯特凡·拉扎列维奇制定的《新布尔多采矿法》是一部规范了中世纪塞尔维亚采矿作业、工人权利和采矿城镇组织的全面法规。它提供了关于产权、安全措施和经济实践的详细指导方针，对采矿社区的发展和繁荣产生了重大影响。"
 chi_grand_pronouncements_decision.title: "大诰"
 chi_grand_pronouncements_decision.desc: "[target_character.GetName|U]通过研究前朝历史教训指出，政府官员的腐败和权力滥用是导致王朝覆灭的根本原因。为此，[target_character.GetHeShe]强烈建议[ROOT.GetCountry.GetName]应当建立更加严格和完善的法律体系，通过法治手段从根本上遏制腐败现象，避免重蹈前朝灭亡的覆辙。"
 chi_grand_pronouncements_decision.desc.entry: "王朝的覆灭，往往并非因为外敌入侵，而是因为那些本应为其效力的大臣。朝廷打算制定一部足够严苛的律法，使任何大臣都不敢将朝廷视作自己的私产，不论这将使那些惯于享受灵活余地的人付出何等代价。"
 chi_grand_pronouncements_decision.a: "整肃贪腐。"
 chi_grand_pronouncements_decision.b: "我朝吏治清明，何来贪腐？"
 chi_ming_dynasty_code_will_be_changed: "[ShowPolicyName('chi_ming_dynasty_code_policy')]政策将增强并附加[ShowModifier('chi_grand_pronouncements')]修正"
 integrated_grand_prounouncements: "已将《[ShowModifier('chi_grand_pronouncements')]》编入《[ShowPolicyName('chi_ming_dynasty_code_policy')]》"
 cas_right_of_possession_decision.title: "[ShowPolicyNameWithNoTooltip('right_of_possesion')]"
 cas_right_of_possession_decision.desc: "在[ShowLawName('mesta_council_law')]的稳健指导下，我们的[ShowGoodsName('wool')]行业在[ROOT.GetCountry.GetAdjective]土地上繁荣发展并扩大了影响力。为了保持该组织的繁荣和控制，实施[ShowPolicyName('right_of_possesion')]将是有益的，这是一项将规范牧场使用并对必要的租金支付设定合理限制的法律。"
 cas_right_of_possession_decision.desc.entry: "一个只由自身来监督自己的行会，最终只会维护自己的利益。[ShowLawName('mesta_council_law')] 已借 [ShowGoodsName('wool')] 积累起巨额财富，若能为牧场租金设定固定上限，便可防止这笔财富被完全从租用这片土地的农民身上榨取殆尽。"
 cas_right_of_possession_decision.a: "设立[ShowPolicyNameWithNoTooltip('right_of_possesion')]。"
 cas_right_of_possession_decision.b: "现状更好。"
 cas_right_of_possession_decision.c: "废除[ShowLawNameWithNoTooltip('mesta_council_law')]！"
 cas_right_of_possession_decision.c.tt: "治下[ShowRegionName('iberia_region')]区域内所有原产[ShowGoodsNameWithNoTooltip('wool')]的地点将永久失去[ShowModifier('merino_wool')]修正"
 cas_altered_nueva_recopilacion_decision.title: "《最新编法典》"
 cas_altered_nueva_recopilacion_decision.desc: "尽管[ShowAdvanceName('enlightenment_advance')]正在[ROOT.GetCountry.GetName]蔓延，但现行《[ShowPolicyName('nueva_recopilacion_policy')]》等法律明显滞后于时代。[target_character.GetName]主张剔除罗马教会法残余的传统主义理念，通过法典修订实现全民教育普及，打破[ROOT.GetCountry.GetReligion.GetAdjective]信仰对司法体系的垄断。"
 cas_altered_nueva_recopilacion_decision.desc.entry: "一部在 [ShowAdvanceName('enlightenment_advance')] 之前制定的法典，至今仍如同此事从未发生一般统治着我们。若将 [ShowPolicyName('nueva_recopilacion_policy')] 从罗马教会法中改写出来，便能教导民众除了法庭一个世纪以来所依赖的信仰之外的东西。"
 cas_altered_nueva_recopilacion_decision.a: "应该让进步的思想蓬勃发展。"
 cas_altered_nueva_recopilacion_decision.b: "让我们不要背离我们的传统。"
 cas_altered_nueva_recopilacion_decision.historical_info: "作为《新编法典》的改进版本，1805年颁布的《最新编法典》摒弃了前版中的罗马教会法特征，成为西班牙统一卡斯蒂利亚与阿拉贡法律体系的关键步骤。虽其现代化程度不及同期《拿破仑法典》，但仍为西班牙司法案件审理提供了统一标准。"
 spa_alter_nueva_recopilacion_policy_tt: "[ShowPolicyName('nueva_recopilacion_policy')][policy|e]的增益效果将转向侧重[research|e]领域，其强度取决于[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]的[estate_power|e]"
 cas_spanish_cloth_industry_decision.title: "享有盛誉的美利奴 [ShowGoodsNameWithNoTooltip('wool')]"
 cas_spanish_cloth_industry_decision.desc: "我们[ShowGoodsName('wool')]质量提升，在其他欧洲市场的声誉也随之增加，国外的需求大增。如果我们给予支持，这可能会使由[ShowLawName('mesta_council_law')]领导的行业开放，出口非常有利可图。一些[ShowLawNameWithNoTooltip('mesta_council_law')]的成员还主张以这种优质的[ShowGoodsNameWithNoTooltip('wool')]为基础，创建[ROOT.GetCountry.GetAdjective]的[ShowGoodsName('fine_cloth')]行业，并建设强大的[ROOT.GetCountry.GetCulture.GetName]纺织业！"
 cas_spanish_cloth_industry_decision.desc.entry: "原 [ShowGoodsName('wool')] 出口海外，肥的是外国织工，而非我们自己。若能借 [ShowLawName('mesta_council_law')] 之力发展 [ShowGoodsName('fine_cloth')] 贸易，便可转而出售成品，只要能说服议会相信这多出的一步值得投资。"
 cas_spanish_cloth_industry_decision.a: "专注出口！"
 cas_spanish_cloth_industry_decision.a.tt: "治下[ShowRegionName('iberia_region')]区域内所有原产[ShowGoodsNameWithNoTooltip('wool')]的地点会获得为期50年的[ShowModifier('quality_merino_wool')]修正"
 cas_spanish_cloth_industry_decision.b: "支持国内产业。"
 cas_spanish_cloth_industry_decision.b.tt: "为[ShowBuildingTypeNameWithNoTooltip('fine_cloth_guild')]解锁西班牙布料生产方式。"
 has_unlocked_spanish_cloth_industry: "已在相关事件中选择支持西班牙纺织业"
 STATIC_MODIFIER_NAME_quality_merino_wool: "高质量美利奴羊毛"
 por_casa_de_india_decision.title: "印度事务院"
 por_casa_de_india_decision.desc: "我们需要有效监管[ROOT.GetCountry.GetAdjective]在$india$及[ShowContinentName('africa')]的利益和财产。有提议指出最好的方法是建立一个直属于[ROOT.GetCountry.GetGovernment.GetAdjective]财务大臣的机构，在相关贸易路线及货物上拥有垄断权。"
 por_casa_de_india_decision.desc.entry: "散布于$india$与[ShowContinentName('africa')]各地的贸易，如今无人能妥善核算。若能在财政大臣之下设立一个机构，垂断最重要的货物，便可将这一切统归于一本账册之中。"
 por_casa_de_india_decision.a: "听起来是个好主意。"
 por_casa_de_india_decision.a.tt: "解锁[ShowGovernmentReformName('por_casa_de_india')][government_reform|e]"
 hol_ned_shipbuilding_decision.title: "福禄特帆船"
 hol_ned_shipbuilding_decision.desc: "庞大的[ROOT.GetCountry.GetCulture.GetName]经济规模需要庞大的商船队。[ROOT.GetCountry.GetCulture.GetNameWithNoTooltip]的浅水环境意味着比如卡拉维尔这样的常用商船无法停泊在很多[ROOT.GetCountry.GetAdjectiveWithNoTooltip]港口，迄今为止这个问题都是利用更小的曲艏船来解决。但是在一位来自[ShowLocationName('hoorn')]的商人[target_character.GetName]的资助下，一种新型船研发成功。\n福禄特帆船的船体更长，具有典型的梨形船尾，专门建造便于船员较少时操控。这种帆船能够装运体积更大的货物，在尼德兰浅水区和外海也都能够表现良好，对我们的商人来说简直是天赐之物。"
 hol_ned_shipbuilding_decision.desc.entry: "小型平底船能驶入我们港口所需的浅水，却装载太少，不值得出海一趟。$name_peter.dutch_dialect$·$name_john.dutch_dialect$·$Liorne$资助设计出一种更长、船尾呈梨形的新船型，能兼顾两者，即便水深仅够行一艘小舟，也能运载真正的货物。"
 hol_ned_shipbuilding_decision.a: "这绝对是个好主意！"
 hol_ned_shipbuilding_decision.b: "不错的主意，但时机未到。也许迟些？"
 hol_ned_shipbuilding_decision.c: "我认为我们的造船业还没有准备好。"
 nov_ivan_hundred_strong_decision.title: "商人联合会[ShowEstatePrivilegeNameWithNoTooltip('novgorod_ivans_hundred')]"
 nov_ivan_hundred_strong_decision.desc: "作为主要贸易中心之一，[ROOT.GetCountry.GetName]已经成为许多强大的商业联合会的所在地。[ShowEstatePrivilegeName('novgorod_ivans_hundred')]是其中最具影响力的联合会之一，对[ShowGoodsName('beeswax')]贸易保持着强有力的控制。为了进一步扩大影响力，该会许多高级官员联系了[our_ruler.GetName]和卫彻，希望获得进一步的支持。部分[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]秘密劝说[our_ruler.GetNameWithNoTooltip]避免进一步授权，因为他们可能会对[ROOT.GetCountry.GetNameWithNoTooltip]的贸易产生太大的影响力。"
 nov_ivan_hundred_strong_decision.desc.entry: "[ShowEstatePrivilegeName('novgorod_ivans_hundred')]对[ShowGoodsName('beeswax')]贸易的掌控，已远远超出任何一个行会应有的程度，而其官员们还想获得更多支持。$nobles_estate$正暗中请求我们拒绝他们，担心一个势力过大、根本无需向维彻会议负责的商人团体。"
 nov_ivan_hundred_strong_decision.a: "给予他们卫彻的支持。"
 nov_ivan_hundred_strong_decision.b: "转而孤立[ShowEstatePrivilegeNameWithNoTooltip('novgorod_ivans_hundred')]。"
 empower_ivan_hundred_privilege: "[ShowEstatePrivilegeName('novgorod_ivans_hundred')]会获得以下效果25年：\n#R ‑5.00%#![ShowModifierTypeName('global_crown_estate_power')]和#G +20.00%#![ShowModifierTypeName('global_merchant_capacity_modifier')]"
 ivan_hundred_strengthened_requirement: "以下加成可通过 $nov_ivan_hundred_strong_decision.title$ [decision|e] 获得："
 variable_ivan_hundred_strengthened_tt: "[ShowEstatePrivilegeName('novgorod_ivans_hundred')]已得到加强"
 ivan_hundred_strengthened: "加强伊凡百人会"
 nov_ivan_hundred_beeswax_decision.title: "[ShowEstatePrivilegeNameWithNoTooltip('novgorod_ivans_hundred')]要求[ShowGoodsNameWithNoTooltip('beeswax')]垄断权"
 nov_ivan_hundred_beeswax_decision.desc: "在获得卫彻的进一步支持后，[ShowEstatePrivilegeName('novgorod_ivans_hundred')]拥有了更高的地位。如今，他们请求获得诺夫哥罗德[ShowGoodsName('beeswax')]生产的垄断权。虽然该会一直对这一行业保持着很大的影响力，但垄断将牢牢巩固他们对该商品的控制。"
 nov_ivan_hundred_beeswax_decision.a: "同意他们的请求，授予[ShowGoodsNameWithNoTooltip('beeswax')]垄断权。"
 nov_ivan_hundred_beeswax_decision.b: "阻止[ShowEstatePrivilegeNameWithNoTooltip('novgorod_ivans_hundred')]获得更大影响力。"
 ivan_hundred_beeswax_increase: "[ShowEstatePrivilegeName('novgorod_ivans_hundred')]会获得以下效果25年：\n#G +10.00%#![ShowModifierTypeName('selling_efficiency')]和#G +25.00%#![ShowModifierTypeName('global_beeswax_output_modifier')]"
 ivan_hundred_beeswax_increase_requirement: "以下加成可通过 $nov_ivan_hundred_beeswax_decision.title$ [decision|e] 获得："
 ivan_hundred_beeswax: "对蜂蜡贸易的更大影响力"
 kbo_serfdom_reform_decision.title: "延续奴隶劫掠"
 kbo_serfdom_reform_decision.desc: "正如在非洲大陆的许多地区所见，我们的经济在很大程度上依赖于强迫劳动的输入和利用。频繁的军事和地方军阀袭击，为我们的市场提供了源源不断的新劳动力，服务于社会的各个领域。然而，随着我们在这些活动中的进展和投资，我们已经积累了大量这样的劳动力。因此，我们必须做出选择：是继续投资于这种掠夺行为，扩大被征服者在我们市场中的流动性，还是决定在我们的社会中赋予他们地位，让他们作为社会的成员得以繁荣发展。"
 kbo_serfdom_reform_decision.a: "我们的经济将从这一贸易中受益匪浅。"
 kbo_serfdom_reform_decision.b: "让我们努力使所有人融入我们的社会。"
 kbo_pop_promotion_more_potent_tt: "我们将解锁特色[cabinet|e]行动[ShowCabinetActionName('kbo_pop_promote_action')]"
 kbo_amenokal_salt_traders_decision.title: "食盐商道"
 kbo_amenokal_salt_traders_decision.desc: "几个世纪以来，随着骆驼被引入西非和中非，众多商人开始勇敢地穿越恶劣的沙漠环境，沿着阿扎赖或泰加利迈特等商道寻找利润和商业机遇。这些勇敢的个体被称为“盐巡吏”，他们负责监督穿越沙漠的旅程，从一个绿洲到另一个绿洲，连接遥远的地区并进行珍贵食盐的交易。在这些市场中，[ShowGoodsName('salt')]以盐板或盐砖的形式出售，以换取食物、牛只以及其他重要商品。而赋予一位有权势者监督这些贸易职位是否适宜，是一个需要我们最信赖的顾问慎重考虑的微妙问题。"
 kbo_amenokal_salt_traders_decision.a: "为每支商队配备一名盐巡吏。"
 kbo_amenokal_salt_traders_decision.b: "这项重要的权限必须由[ROOT.GetCountry.GetGovernment.GetRuler.GetNameWithNoTooltip]本人掌管！"
 kbo_amenokal_salt_traders_decision.b.entry: "This authority is reserved for the ruler!"
 kbo_sharia_courts_decision.title: "$KBO$的$sharia$"
 kbo_sharia_courts_decision.desc: "我们伟大的国家始终是[ShowReligionAdjective('sunni')]伊斯兰教最古老和最迅速的接纳者之一。我们带着对真正信仰的新活力和不懈的努力，致力于巩固我们的宗教价值观，并保护我们的人民免受异教徒的侵扰。然而，在我们的信仰体系中，有一个方面尚未完全确立，那就是$sharia$。一系列宗教法律不仅可能影响我们的行政效率，还可能对我们的人民产生深远的影响。尽管我们众多顾问支持实施$sharia$，但也有其他人提醒我们，要谨慎处理宗教与行政之间的关系。"
 kbo_sharia_courts_decision.a: "接下来推行$sharia$是合乎逻辑的！"
 kbo_sharia_courts_decision.b: "暂且维持现状。"
 kbo_enable_sharia_courts_cabinet_action_tt: "我们将解锁特色[cabinet|e]行动[ShowCabinetActionName('kbo_sharia_courts')]"
 teu_kulm_law_revised_decision.title: "修订 $kulm_law$"
 teu_kulm_law_revised_decision.desc: "[ShowSituationName('black_death')]肆虐了整个[ShowContinentName('europe')]大陆，摧毁无数城镇，使聚居地沦为废墟。尽管其对[ROOT.GetCountry.GetLongName]的经济造成了可怕影响，但更糟糕的是，德国人口数量的减少降低了移民压力，致使[ShowAreaName('prussia_area')]人口增长放缓。除非我们能提供更多激励措施吸引移民迁入[ROOT.GetCountry.GetAdjectiveWithNoTooltip]领土，否则我们将失去构成我们基督教化使命重要组成部分的移民群体。"
 teu_kulm_law_revised_decision.desc.entry: "[ShowSituationName('black_death')] 已使德意志人口锐减，能够东迁的移民也随之减少，而我们在 [ShowAreaName('prussia_area')] 的秩序全赖持续不断的移民供给。放宽定居条件意味着放弃我们本想保留的让步，但一片荒芜的边疆是招不到人的。"
 teu_kulm_law_revised_decision.a: "给予移民更多优待。"
 teu_kulm_law_revised_decision.b: "我们必须应对这一局面。"
 bra_kreditwerk_reformed_decision.title: "改革 $bra_kreditwerk$"
 bra_kreditwerk_reformed_decision.desc: "尽管我们授予了信誉社许多权力，但这个机构还是负债累累，对我们的财务管理相当不善。目前，信誉社濒临破产边缘，我们必须对其未来作出决策。我们的顾问分成了多派，有些人建立改革信誉社，由王室直接管理，还有一些人则建议完全废除这个机构。"
 bra_kreditwerk_reformed_decision.a: "改革信誉社，将其置于王室管理下。"
 bra_kreditwerk_reformed_decision.b: "让我们彻底摆脱这个魔鬼。"
 bra_kreditwerk_reformed_decision.c: "出资救助，让它经营下去。"
 boh_unity_brethren_decision.title: "支持弟兄合一会"
 boh_unity_brethren_decision.desc: "在过去几年中，随着我们实践[ShowReligionAdjective('hussite')]礼仪，我们的信仰之树在国内蓬勃发展，枝繁叶茂。许多信徒涌向教会，参与教会仪式，净化并远离误入歧途的异端。\n\n然而，在这种虔诚和神圣崇拜的环境中，我们的[ShowEstateTypeName('clergy_estate')]中越来越多的人转向了对[ShowReligionNameWithNoTooltip('hussite')]的极端解释，主张排除贵族和商人成为教会代表，礼仪以简单和谦卑的仪式进行，同时拒绝使徒统绪。"
 boh_unity_brethren_decision.desc.entry: "一种信仰若持续壮大，终将超出其创立者的初衷，我们的信仰便是如此。如今部分 $clergy_estate$ 宣称贵族与商人在教会中根本没有立足之地，这比我们当初立教时的信条更为纯粹，也更具颠覆性。"
 boh_unity_brethren_decision.a: "让他们讲道，他们言语是真理。"
 boh_unity_brethren_decision.b: "我们不能让这些声音撕裂社会。"
 unity_brethren_privilege: "弟兄合一会"
 unity_brethren_privilege_desc: "激进的[ShowReligionName('hussite')]运动，围绕着简朴的布道和崇拜，专注于将[ShowEstateTypeName('burghers_estate')]和[ShowEstateTypeName('nobles_estate')]的权贵排除在外，并推广共融圣事的母语和简化仪式。"
 ara_sindicat_remenca_decision.title: "赎身农农会"
 ara_sindicat_remenca_decision.desc: "The nobility in the [ROOT.GetCountry.GetLongName] has begun to strictly enforce the rules that tie peasants to the land, and this combined with a stricter enforcement of seignorial rights in general has led to unrest among the peasants. The poorest peasants strongly support open rebellion while the better off favor appealing to us for reforms and the end of seignorial abuses.\n\nIt would be an excellent opportunity to gain the support of the peasants, as we are in a constant power struggle with the nobility. Suggestions have been made regarding allowing the peasants to form a [ShowEstatePrivilegeName('ara_sindicat_remenca')], a peasants' guild or primitive trade union, which will grant them more liberty."
 ara_sindicat_remenca_decision.desc.entry: "一个被彻底束缚于土地的农民，没有合法的手段来对抗领主，唯有不合法的手段，而这正是最贫苦者如今所选择的道路。特许行会则为境况较好的农民提供了一条合法的出路，也能以极小的代价为王室换来他们对抗贵族的忠诚。"
 ara_sindicat_remenca_decision.a: "允许农民成立赎身农会。"
 ara_sindicat_remenca_decision.b: "无视这些乡巴佬的胡言乱语。"
 ara_sindicat_remenca: "赎身农农会"
 ara_sindicat_remenca_desc: "赎身农农会是农民行会或原始工会，于1448年首次引入加泰罗尼亚。"
 nov_tysiatskii_influential_decision.title: "老千夫长"
 nov_tysiatskii_influential_decision.desc: "尽管[ShowEstatePrivilegeName('tysiatskii_privilege')]在[ROOT.GetCountry.GetName]仍然由选举产生，但它在很大程度上受到[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]的紧密控制，许多当选的千夫长都出身于[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]家族。然而，近期，前千夫长即使在离职后也开始对之后的选举保持着相当大的影响力，经常推举其子继承其职务。这些人被称为#italic 老千夫长#!，已经成为卫彻内部不可忽视的力量。"
 nov_tysiatskii_influential_decision.desc.entry: "如果同一批家族总能赢得选举，那么选举官职对权力的制约便形同虚设。#italic老千夫长派#!如今即便离任，仍在暗中操控选票，扶植自己的儿子上位，$nobles_estate$已悄然将这一职位变成了自己的禁脔，虽无其名，却有其实。"
 nov_tysiatskii_influential_decision.a: "我们应该尝试发挥他们的影响力。"
 nov_tysiatskii_influential_decision.b: "尽力削弱[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]对该职位的影响。"
 nov_tysiatskii_influential_decision.b.entry: "Strive to weaken $nobles_estate$ influence over the office."
 nov_tysiatskii_influence_weakened: "削弱千夫长影响力"
 nov_influential_tysiatskii: "有影响力的千夫长"
 nov_tysiatskii_influence_weakened_benefits: "[ShowEstatePrivilegeName('tysiatskii_privilege')]会获得以下效果30年：\n#R ‑25.00%#![ShowModifierTypeName('global_nobles_estate_power')]和#G +0.10#![ShowModifierTypeName('stability_investment')]"
 nov_tysiatskii_influence_event_happened: "千夫长获得了更多影响力！"
 nov_tysiatskii_influence_event_happened_possible_event: "千夫长未来可能试图对[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]施加控制。"
 nov_influential_tysiatskii_benefits: "[ShowEstatePrivilegeName('tysiatskii_privilege')]会获得以下效果30年：\n#G +25.00%#![ShowModifierTypeName('global_nobles_estate_power')]和#G +15.00%#![ShowModifierTypeName('army_heavy_infantry_power')]"
 nov_influential_tysiatskii_requirement: "以下加成可通过 $nov_tysiatskii_influential_decision.title$ [decision|e] 获得："
 nov_tysiatskii_influence_weakened_requirement: "以下加成可通过 $nov_tysiatskii_influential_decision.title$ [decision|e] 获得："
 boh_district_paving_decision.title: "[ShowLocationNameWithNoTooltip('prague')] 各区的征税权"
 boh_district_paving_decision.desc: "随着[ShowLocationName('prague')]城市边界扩展，许多担任各市区（如小城区）负责人的知名人物纷纷要求对其辖区内的市民征税。\n\n此举无疑会将大量影响力从我们的财政部门转移到[ShowEstateTypeName('nobles_estate')]手中，因此必须非常谨慎地进行审查。"
 boh_district_paving_decision.a: "很好，同意他们的要求。"
 boh_district_paving_decision.b: "这没得谈！"
 boh_joint_assembly_decrees_decision.title: "联合大会"
 boh_joint_assembly_decrees_decision.desc: "自从我国领导[GetUniqueInternationalOrganization('hre').GetName]以来，我国注意到帝国的司法程序与我国的程序有明显的不同。随着我国努力捍卫和合法化我国的统治，这种差距因文化和传统差异而进一步扩大。\n\n为了巩固我国的地位并使我国的人民更接近帝国，[target_character.GetName]的许多顾问建议召开联合大会，包括[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]的成员和所有帝国诸侯的代表，与我国的代表一起确认与特权相关的诸多现有罗马法律。"
 boh_joint_assembly_decrees_decision.desc.entry: "统治 $hre$ 与统治我们自己的领地，实际上是两份不同的差事，各有各的一套法度，而每多戴一年这两顶王冠，两者之间的裂隙便愈发显得别扭。若设立一个联合议会，让我们的 $nobles_estate$ 与帝国诸侯同席而坐，便可确认他们所看重的罗马法度，但代价是要以近乎平等之礼相待。"
 boh_joint_assembly_decrees_decision.a: "合法化我国统治的关键且必须的一步。"
 boh_joint_assembly_decrees_decision.b: "还是不要把国内外政策混为一谈。"
 every_elector_25_opinion_tt: "所有选帝侯对我们的好感增加[ShowBiasValue('granted_joint_assembly_decrees_modifier')|+=0]"
 ven_doges_palace_decision.title: "扩建[ShowBuildingTypeNameWithNoTooltip('doges_palace')]"
 ven_doges_palace_decision.desc: "[ShowLocationName('venice')][ShowBuildingTypeName('doges_palace')]始建于9世纪，数个世纪来不断扩建。其最初为一座堡垒式建筑，后逐渐演变为哥特式建筑的宏伟代表。这座宫殿不仅是[ROOT.GetCountry.GetGovernment.GetRulerTitle]——[GetCountry('VEN').GetLongNameWithNoTooltip]最高政治领袖的官邸，还兼为政务办公及司法审判之所。\n\n然而时光荏苒，此建筑已渐显老态，也许我们应考虑将其改建为一座超越西方诸王宫殿的宏伟宫廷。"
 ven_doges_palace_decision.desc.entry: "这座始建于九世纪的要塞式宫殿，其恢弘气象并非出自精心设计，而是历经岁月的偶然堆叠，如今已显露无遗。将 [ShowBuildingTypeName('doges_palace')] 重建为一座胜过西方诸王居所的殿堂，势必耗费巨资——而这笔钱本可用于造船。"
 ven_doges_palace_decision.a: "好主意！"
 ven_doges_palace_decision.b: "宫殿现在就很好。"
 ven_doges_palace_decision.historical_info: "到了16世纪，总督宫进行了大规模的扩建与修缮，其宏伟程度大幅提升。最引人注目的成果之一是面向大运河的标志性立面完工，向所有水路访客展示了威尼斯的建筑魅力。这一时期的扩建巩固了宫殿作为威权象征的地位，其华丽的厅堂与装饰不仅见证了数世纪的政治活动，也象征着威尼斯辉煌的历史与世界舞台上的重要地位。"
 ven_piazza_san_marco_decision.title: "[ShowBuildingTypeNameWithNoTooltip('piazza_san_marco')]"
 ven_piazza_san_marco_decision.desc: "随着我们伟大的[ROOT.GetCountry.GetFlavorRank]日益强盛和富庶，是时候投资发展我们的首都，以确保[ShowLocationName('venice')]的繁荣在城市的宏伟之中得以体现。有人提出提案，建议对中央广场[ShowBuildingTypeName('piazza_san_marco')]进行翻新，使用宏伟的拱门与大理石来重塑其面貌，彰显我们海洋帝国的辉煌。如此翻修不仅能提升城市美观，也将成为我们持久权力与文化卓越的象征。"
 ven_piazza_san_marco_decision.desc.entry: "一个在国内显得寒酸的海上帝国，绝难令外邦相信其富庶。将 [ShowLocationName('venice')] 宫殿前的广场以大理石与拱廊重新修建，花的钱换不来一粒粮食，却能换来一份令金钱也难以叩开的门径的声望。"
 ven_piazza_san_marco_decision.a: "我们将资助这次翻修。"
 ven_piazza_san_marco_decision.b: "翻修费用实在过高。"
 unlocked_piazza_san_marco_tt: "我们通过一项风味 [decision|e] 解锁了 $piazza_san_marco$ [building|e]"
 ven_piazza_san_marco_decision.historical_info: "#italic 圣马尔谷广场#!是意大利威尼斯的主要公共广场，也是这座城市最著名的地标之一。广场最初在9世纪形成，至12世纪扩展为现今规模，历经多次翻修和地标建设。四周围绕着圣马尔谷宗座圣殿、威尼斯总督宫与钟楼等标志性建筑，几个世纪以来一直是威尼斯的政治、宗教与社交中心。"
 ven_teatro_san_cassiano_decision.title: "[ShowBuildingTypeNameWithNoTooltip('teatro_san_cassiano')]"
 ven_teatro_san_cassiano_decision.desc: "[ShowLocationName('venice')]，作为[ShowRegionName('italy_region')]文化版图上的璀璨明珠，长期以来是艺术家与表演者的家园。为了进一步巩固其艺术中心的地位，也为了给本城人才提供舞台，建设一座宏伟的剧院与歌剧院的呼声日益高涨。提议中的[ShowBuildingTypeName('teatro_san_cassiano')]将成为一座象征财富与辉煌的地标，展示[ShowLocationNameWithNoTooltip('venice')]的艺术才华，吸引远近宾客。"
 ven_teatro_san_cassiano_decision.desc.entry: "一座早已因艺术闻名的城市，却没有一处足以搬演其最佳作品的舞台。拟议中的 [ShowBuildingTypeName('teatro_san_cassiano')] 将为 [ShowLocationName('venice')] 提供一座配得上其声誉的舞台，也会让每个竞争对手港口多一分嫉妒我们的理由。"
 ven_teatro_san_cassiano_decision.a: "下令建造！"
 ven_teatro_san_cassiano_decision.b: "国帑恐难支撑。"
 unlocked_teatro_san_cassiano_tt: "我们通过一项风味[decision|e]解锁了$teatro_san_cassiano$[building|e]"
 ven_teatro_san_cassiano_decision.historical_info: "圣卡西亚诺剧院建于1637年，是世界上第一座公共歌剧院，标志着表演艺术发展的重要里程碑，也巩固了威尼斯作为文化中心的地位。"
 ven_walls_of_ston_decision.title: "加强[ShowLocationNameWithNoTooltip('dubrovnik')]的防御"
 ven_walls_of_ston_decision.desc: "[ShowLocationName('dubrovnik')]是我们海洋帝国中最重要的贸易[target_location.GetRank.GetName]之一，其战略价值不可小觑。然而目前[ShowLocationNameWithNoTooltip('dubrovnik')]的防御体系极其薄弱，易受陆上与海上敌军侵袭。若拨款建造坚固的防御工事，其效益必将远超投入。"
 ven_walls_of_ston_decision.desc.entry: "[ShowLocationName('dubrovnik')] 在一个丰收的贸易季所赚的钱，比我们大多数省份一年所得还多，然而它却可能被一支根本不屑于正式围攻的劫掠队轻易攻取。修筑坚固城墙要花去我们宁愿用于他处的黄金——直到这座城市在无墙可依之日陷落为止。"
 ven_walls_of_ston_decision.a: "[ShowLocationNameWithNoTooltip('dubrovnik')]必须坚固设防。"
 ven_walls_of_ston_decision.b: "现有防御已足够。"
 ven_walls_of_ston_decision.historical_info: "修建于14世纪的斯通城墙位于克罗地亚佩列沙茨半岛，是一系列保护盐田与斯通城镇的重要防御工事。其长度约7公里，为欧洲最长的防御墙之一，因其防御价值和宏伟结构而著称于世。"
 zan_husuni_kubwa_decision.title: "[ShowBuildingTypeNameWithNoTooltip('husuni_kubwa')]"
 zan_husuni_kubwa_decision.desc: "[GetCharacter('zan_abu_al_mawahib_al_hasan_ibn_suleiman').GetName]最初下令在[target_location.GetName]中心建造[ROOT.GetCountry.GetGovernment.GetAdjective]宫殿，意图打造最宏伟的皇家居所。然而厄运连连，资金挪用与君主患病使工程屡屡受阻。尽管困难重重，我们的建筑师仍提交了新方案：增设专门用于商贸的货仓与厅堂，并配以辉煌的觐见大厅。如今唯一阻碍，便是资金短缺。"
 zan_husuni_kubwa_decision.desc.entry: "在我们之前的每一位统治者都盼望这座宫殿竣工，而在我们之前的每一位统治者也都能找出理由令其半途而废。为 [ShowLocationName('kilwa_kisiwani')] 制定一份新的规划——建起足以匹配我们贸易规模的仓库，修一间值得接待宾客的觐见大殿——如今只差此前历次尝试同样缺乏的那笔钱了。"
 zan_husuni_kubwa_decision.a: "批准建造工程。"
 zan_husuni_kubwa_decision.b: "眼下开支过大……"
 zan_husuni_kubwa_decision.historical_info: "胡苏尼库布瓦宫殿是14世纪基卢瓦苏丹国建筑与政治实力的见证。由苏丹哈桑·伊本·苏莱曼在基卢瓦基西瓦尼建造，这座占地1.6公顷的珊瑚石宫殿融合了斯瓦希里、伊斯兰与波斯建筑风格，包含豪华寝宫、庭院、浴场与仓库，兼具王宫、商站与要塞功能。"
 construct_the_building_at_another_time_tt: "我们可以选择之后建造[ShowBuildingTypeNameWithNoTooltip('husuni_kubwa')]……"
 unlocked_husuni_kubwa_tt: "我们通过特色[event|e]解锁了$husuni_kubwa$[building|e]"
 pap_quirinal_palace_decision.title: "教宗的夏宫"
 pap_quirinal_palace_decision.desc: "[GetCountry('PAP').GetGovernment.GetRulerTitle]有意在远离[ShowLocationName('rome')]中心拥挤街道的地方建立一座夏宫。作为[ShowLocationNameWithNoTooltip('rome')]七丘之一的奎里纳尔山被视为理想选址，那里宁静清幽，能同时享受凉爽微风与全城视野。如果我们决定推进此事，著名建筑师[fontana.GetName]可负责宫殿的设计与建造工作。"
 pap_quirinal_palace_decision.desc.entry: "The bustle of central [ShowLocationName('rome')] is exactly what a Pope wants to avoid, and Quirinal Hill offers the breeze and the view without the crowd. $name_dominic$ $Fontana$ is the architect capable of building it, provided the Holy See is willing to pay for a second residence it does not strictly need."
 pap_quirinal_palace_decision.a: "在奎里纳尔山建造夏宫。"
 pap_quirinal_palace_decision.b: "现在不是大兴土木的时候。"
 pap_quirinal_palace_decision.historical_info: "奎里纳尔宫由教宗额我略十三世于1583年下令建造，作为教宗避暑行宫。经多梅尼科·丰塔纳等著名建筑师设计，该宫殿成为远离罗马市中心酷暑与喧嚣的静居之所。新成立的意大利王国吞并教宗国残余领土后，奎里纳尔宫遂成为意大利国王的官邸。"
 nav_camara_comptos_decision.title: "纳瓦拉审计院"
 nav_camara_comptos_decision.desc: "王国的财政事务至关重要，我们的[ROOT.GetCountry.GetGovernment.GetRuler.GetName]认为，[ROOT.GetCountry.GetLongName]若能设立一个常设机构来管理这些事务，将大有裨益。\n\n借鉴[GetCountry('FRA').GetLongName]的类似机构，我们将使国家在经济上更具活力，并更好地应对当前微妙局势可能带来的财政困境。"
 nav_camara_comptos_decision.desc.entry: "一个全凭临机应变运作的财库，在丰年尚可勉强维持，在荒年却往往一败涂地，而 $FRA$ 的先例表明，一个常设机构总比二者都更为可靠。若设立我们自己的机构，便是以君主对钱袋的部分个人裁量权，换取一个能延续于任何一位统治者关注之外的常设官署。"
 nav_camara_comptos_decision.a: "我们将设立一个常设机构。"
 nav_camara_comptos_decision.historical_info: "审计院的历史可追溯至#italic 听审法官#!（词源为西语的#italic “听取”#!），这些官员至少从1258年，第一本审计账册出台时起就负责管理并监督王室财政。该机构深受法国类似机构（如巴黎的#italic Chambre des Comptes#!）影响，由夏尔二世国王确立为常设机构，负责控制王国的开支，并在财政事务上为统治者提供建议。\n\n它被认为是西班牙最古老的审计法庭，至今仍在运作，为纳瓦拉特许自治区议会服务。"
 hun_bibliotheca_corviniana_decision.title: "[ShowBuildingTypeNameWithNoTooltip('bibliotheca_corviniana')]"
 hun_bibliotheca_corviniana_decision.desc: "[ShowInstitutionName('renaissance')]如野火般在整个大陆传播，点燃了知识与文化复兴的火焰，我们的[ROOT.GetCountry.GetGovernment.GetCourtTitle]一直在热议它带来的可能性。受席卷[ShowContinentName('europe')]的新一波思想浪潮启发，学者、艺术家和思想家开始在我们的城市聚集。有人建议在[ROOT.GetCountry.GetCapital.GetName]修建一座大图书馆，它将吸引远方的学者，让[GetCountry('HUN').GetName]成为[ShowInstitutionNameWithNoTooltip('renaissance')]的堡垒。但是，投资这样一个充满野心的项目耗费巨大。我们应该投资[ShowBuildingTypeName('bibliotheca_corviniana')]的建造吗？"
 hun_bibliotheca_corviniana_decision.desc.entry: "每一个自诩引领 [ShowInstitutionName('renaissance')] 的城市都已建成某种建筑以为明证，唯独 $HUN$ 尚未有此举。在都城兴建一座宏大的图书馆，将吸引如今与我们失之交臂的学者，其耗费如今看来沉重，日后回望却会显得理所应当。"
 hun_bibliotheca_corviniana_decision.a: "美轮美奂！"
 hun_bibliotheca_corviniana_decision.b: "国帑恐难支撑。"
 unlocked_bibliotheca_corviniana_tt: "我们通过一项风味[decision|e]解锁了$bibliotheca_corviniana$[building|e]"
 hun_bibliotheca_corviniana_decision.historical_info: "绰号文艺复兴王的马加什一世是一位伟大的艺术和科学赞助者。在他统治期间，匈牙利成为意大利以外第一个拥抱文艺复兴的国家，科尔温图书馆成为他对匈牙利文化复兴的最大贡献之一。它作为学术交流的中心，发挥了在整个国家传播知识的关键作用。来自整个大陆的学者都被吸引到这个图书馆，为文艺复兴时期的知识活力做出了贡献。它象征着文艺复兴时期的知识热情和赞助在培养知识与创新中的力量。"
 mam_ablaq_palace_decision.title: "[ShowLocationNameWithNoTooltip('cairo')]的宏伟宫殿"
 mam_ablaq_palace_decision.desc: "作为[ROOT.GetCountry.GetFlavorRank]蓬勃发展的核心，[target_location.GetName]成为了连接[ShowContinentName('africa')]与地中海世界的知识、启蒙和繁荣贸易的中心。这里的城堡，历经数代杰出且声名显赫的统治者，一直发挥着重要作用。现任[ROOT.GetCountry.Custom('GetRulerOrRegentTitle')]提出了宏伟的扩建计划，旨在新建一座清真寺、扩建一个观众厅以及建立一个幔帐布生产中心。"
 mam_ablaq_palace_decision.desc.entry: "一座历经数代统治者驻跸的城堡，仍可被装点得仿佛只曾接待过其中最伟大的那几位。为其增建一座新的清真寺兼经学院、一间更为宏伟的觐见大殿，以及一处克斯瓦织造工坊，这份功绩足以彰显我们的统治，堪比任何一场战役，却要少流不知多少鲜血。"
 mam_ablaq_palace_decision.a: "很好。"
 mam_ablaq_palace_decision.b: "相反，我们得勤俭节约。"
 unlocked_ablaq_palace_tt: "我们通过“$mam_ablaq_palace_decision.title$”[decision|e]解锁了这座[building|e]"
 son_trans_saharan_decision.title: "跨撒哈拉贸易的繁荣"
 son_trans_saharan_decision.desc: "自从我们掌控了这些商路，跨撒哈拉贸易达到了新的高度。我们可以在商队所到之处扩建前哨，尤其是[ShowLocationName('alexandria')]、[ShowLocationName('tunis')]和[ShowLocationName('fez')]，都是最该投入的主要目标。"
 son_trans_saharan_decision.a: "让这些驿站繁荣起来。"
 son_trans_saharan_decision.b: "我们不应加强地点，而是应该加强整个贸易。"
 son_trans_saharan_decision.c: "这不值得投入资金。"
 son_unlock_unique_buildings_in_alexandria_tunis_and_fez_tt: "解锁在[ShowLocationName('fez')]、[ShowLocationName('tunis')]和[ShowLocationName('alexandria')]建造[ShowBuildingTypeName('trans_saharan_trade_outposts')]的能力"
 son_conversion_west_africa_decision.title: "对[ShowReligionGroupAdjectiveWithNoTooltip('folk_african_group')]国家传教"
 son_conversion_west_africa_decision.desc: "尽管我们是[ShowRegionName('guinea_region')]最强大的国家，但仍有一些国家未信奉[ShowReligionGroupName('muslim')]。虽然我们可以使用武力传教，但[target_character.GetName]打算采取更和平的策略。[target_character.GetSheHe|U]希望使用外交传播[ShowReligionGroupNameWithNoTooltip('muslim')]，而不是使用刀剑来制造更多动乱。"
 son_conversion_west_africa_decision.desc.entry: "刀剑不能使幸存者真正皈依，只能令那些原本会争辩的人闭口不言。统治者宁愿向 [ShowRegionName('guinea_region')] 派遣传教士，而非士兵，以更缓慢的信仰传播换取一片不会留下焦土残村的土地。"
 son_conversion_west_africa_decision.a: "听起来是个好主意。"
 son_conversion_west_africa_decision.b: "使用武力是更好的选择。"
 son_unlock_diplo_action_to_demand_conversion_tt: "我们将解锁针对[ShowRegionName('guinea_region')]不信者的[ShowCountryInteractionName('demand_conversion_to_islam')][country_interaction|E]"
 ori_elephant_hunting_grounds_decision.title: "狩猎[ShowGoodsNameWithNoTooltip('elephants')]"
 ori_elephant_hunting_grounds_decision.desc: "随着[ROOT.GetCountry.GetName]中[ShowGoodsName('elephants')]的过剩，关于增加使用这些强大野兽的军团的讨论已经出现。然而，我们目前的[ShowBuildingTypeName('elephant_hunting_grounds')]缺乏扩大狩猎行动和提供足够装备所需的资源。也许是时候为他们提供所需的支持了。[target_character.GetName]和[ROOT.GetCountry.GetGovernment.GetCourtTitle]甚至愿意为此投入部分资金。"
 ori_elephant_hunting_grounds_decision.desc.entry: "一头战象在被捕获、训练、装备之前，对军队而言价值寥寥，而我们的 [ShowBuildingTypeName('elephant_hunting_grounds')] 目前对此几乎毫无作为。宫廷已准备好自掏腰包扩建此地，于是问题便不再是钱够不够，而是更多战象是否合乎我们当下的雄心。"
 ori_elephant_hunting_grounds_decision.a: "让我们赞助这些狩猎活动。"
 ori_elephant_hunting_grounds_decision.b: "没必要在这上面浪费钱。"
 ori_double_elephant_hunting_ground_level_tt: "[ShowBuildingTypeName('elephant_hunting_grounds')][building|e]的最高等级将增加#G +2#!"
 INCREASED_MAX_LEVEL_ELEPHANT_HUNTING_GROUND: "由[events|e]提升的最大等级"
 jap_rangaku_decision.title: "兰学"
 jap_rangaku_decision.desc: "至今为止，来自[target_country.GetAdjective]的商人在[target_location.GetName]出岛上居住有一段时间了。尽管我们严格控制百姓同出岛住民之间的接触，但两国的文化总是会不期而遇。[target_country.GetAdjectiveWithNoTooltip]人似乎掌握着一些我们未曾得知的智慧，尤其是在医学、科学、生产和机械工程方面。对于一些富裕的臣民而言，他们生病时宁愿选择来自出岛的[target_country.GetAdjectiveWithNoTooltip]大夫，而不是本地的和医。\n\n可以预料的是，如果我们愿意冒险向他们开放我们的省份，那么在与这些西方客商的交流之中，我们便能学到很多东西。"
 jap_rangaku_decision.desc.entry: "一处受到严密监视的贸易站，仍会让些许知识透过本该封闭一切的墙壁渗漏出来，而 $NED_ADJ$ 的飞地多年来一直在渗透医术、机械与科学知识。若放松我们的监视，便会让更多知识涌入，但代价是失去这份监视本欲维护的孤立状态。"
 jap_rangaku_decision.a: "放开港口，放进兰学。"
 jap_rangaku_decision.a.entry: "向 $NED_ADJ$ 的知识开放我们的领地。"
 jap_rangaku_decision.a.tt: "解锁[ShowGovernmentReformName('jap_rangaku')][government_reform|e]"
 jap_rangaku_decision.b: "锁国体制不可动摇。"
 mch_mandarin_language_reforms_decision.title: "因循旧制"
 mch_mandarin_language_reforms_decision.desc: "我们不过是[GetInternationalOrganization('middle_kingdom').GetName]正朔之最新承继。前代王朝成熟的官僚体系曾有效维系$china$广袤的疆域。采纳这些早已证明是行之有效的制度既能提升[ShowSocietyDirectionName('sinicized')]程度，又可保持施政之连贯，更能收揽民心，巩固统治。"
 mch_mandarin_language_reforms_decision.a: "全面承袭旧制。"
 mch_mandarin_language_reforms_decision.b: "首崇[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')]勋旧。"
 mch_mandarin_language_reforms_decision.b.entry: "Favor the $tribes_estate$."
 unlock_chinese_language_reforms: "这会解锁[ShowGovernmentReformName('three_departments_system')][government_reform|e]。"
 MCH_conditional_benefit: "若未采用[ShowGovernmentReformName('three_departments_system')][government_reform|e]，[ShowEstatePrivilegeName('mch_tribal_favor')]将提供额外增益"
 pru_unified_legal_system_decision.title: "法律改革"
 pru_unified_legal_system_decision.desc: "像我们这样的国家需要随时适应变化。现在有一位前途光明的人物从法律体系中崛起，也许能引领我们急需的法律改革。这个[target_character.GetName]一直担任着#italic 最高法院#!院长，并且草拟了改革全[ROOT.GetCountry.GetName]法律制度的方案。只要能得到我们的支持，他就能迅速而彻底地改革我国法律。"
 pru_unified_legal_system_decision.desc.entry: "一套继承自十几个不同时代的法律体系，向来不能特别令人满意，但这通常已足以让它不经改革地延续到下一代。#italic最高法院#!的院长已草拟了改变这一切的方案，而支持他，就意味着我们将投身一场我们尚未看清全貌的改革。"
 pru_unified_legal_system_decision.a: "支持他的改革！"
 pru_unified_legal_system_decision.a.tt: "改革进度将显著加快"
 pru_unified_legal_system_decision.b: "遏制他的野心。"
 pru_unified_legal_system_decision.b.tt: "改革进度将显著减缓"
 boh_bohemian_commonwealth_decision.title: "建立共和联邦"
 boh_bohemian_commonwealth_decision.desc: "我们的历史之路见证了[ROOT.GetCountry.GetName]从一个小国崛起为帝国的巅峰，成为全球舞台的列强，统治着广阔的地区和众多民族。然而，治理这样一个国家需要稳健的手段。由于对[ROOT.GetCountry.GetFlavorRank]各民族之间分裂主义和紧张局势的担忧，有人建议通过新宪法。他们认为必须超越传统上被认为是[ROOT.GetCountry.GetNameWithNoTooltip]的范围，建立一个更大的联邦。我们的帝国将跨越[ShowContinentName('europe')]的广阔地区，我们将在世界大国之林占据一席之地。"
 boh_bohemian_commonwealth_decision.desc.entry: "一个由弱小王国崛起而成的帝国，从来不是靠将其众多民族视为一体而立足的，而如今要维系这些民族的团结，或许终须承认它们本就并非一体。一个比传统疆域更为广阔的新联邦，为了不让帝国沿着自身的裂缝分崩离析，甘冒动摇那曾缔造这个帝国的根本认同之险。"
 boh_bohemian_commonwealth_decision.a: "通过新宪法。"
 boh_bohemian_commonwealth_decision.b: "保持现有宪法。"
 ned_unified_dutch_admiralties_decision.title: "建立五海军部"
 ned_unified_dutch_admiralties_decision.desc: "尽管[target_character.GetName]掌控着这片土地，各省之间的分歧却使得我们的[ShowBuildingTypeName('admiralty')]处于分裂状态。[ShowLocationName('groningen')]、[ShowLocationName('hoorn')]、[ShowLocationName('rotterdam')]、[ShowLocationName('middelburg')]以及[ShowLocationName('amsterdam')]之间的派系斗争阻碍了海军的统一。然而，如果允许它们保持独立运作，或许能够激发各海军部更大的积极性。"
 ned_unified_dutch_admiralties_decision.desc.entry: "五个海军部各自听命于五个港口，等于是五支海军在争夺同一批船只。将 [ShowLocationName('groningen')]、[ShowLocationName('hoorn')]、[ShowLocationName('rotterdam')]、[ShowLocationName('middelburg')] 与 [ShowLocationName('amsterdam')] 统一于一个指挥之下，可以终结这种内耗，然而，让各方再各自追逐一段时间的利益，或许比强行合并更能从这五方身上获得更多。"
 ned_unified_dutch_admiralties_decision.a: "就让这些海军部保持自治。"
 ned_unified_dutch_admiralties_decision.b: "必须将它们统一起来。"
 NED_UNLOCKS_UNIFIED_ADMIRALTIES_GOV_REFORM: "解锁[ShowGovernmentReformName('unified_admiralty_reform')][government_reform|e]。"
 ned_unified_dutch_admiralties_decision.historical_info: "在反抗哈布斯堡王朝统治的起义过程中，荷兰人建立了一个邦联体系，该体系允许各省保留自治权，确保每个省份能够维护自己的利益。然而，这一制度并未能摆脱派系斗争的困扰，议会派与奥兰治派为了控制各省而相互竞争。直至拿破仑时期的巴达维亚共和国，这一体系被废除，从而奠定了现今荷兰王国的基础。"
 hol_ned_seven_provinces_decision.title: "七省联合"
 hol_ned_seven_provinces_decision.desc: "尽管低地国家因共同目标而联合，法理主张和文化差异却导致了各省的分歧。然而，我们可以将这一劣势转化为优势：通过建立一个邦联制度，各省可以保留其自治法律和权利，同时服从中央政府的领导。这样既能确保各省的安全与繁荣，也能让我们集中精力于对外发展。"
 hol_ned_seven_provinces_decision.a: "建立这个邦联。"
 hol_ned_seven_provinces_decision.b: "分权并非解决之道。"
 swe_age_of_freedom_decision.title: "重新审视专制制度"
 swe_age_of_freedom_decision.desc: "[ROOT.GetCountry.GetName|U]正濒临崩溃。现任[ROOT.GetCountry.GetGovernment.GetActiveRegentTitle]所面临的支持与反对声浪均达到前所未有的高度，每天都有新兴势力涌现，支持不同的王位竞争者。外国势力对[ROOT.GetCountry.GetAdjectiveWithNoTooltip]内政的干涉已深入骨髓，使我国更像是受操控的傀儡而非独立强国。与此同时，各阶层民众对专制重压的怨恨情绪已公开化。\n\n若执意维持绝对控制，恐怕将成为[ROOT.GetCountry.GetGovernment.GetActiveRegentTitle]的致命失误。无论我们作出何种选择，都必须为可能爆发的暴力冲突做好充分准备。"
 swe_age_of_freedom_decision.desc.entry: "一位在国内各处都有对手的摄政者，实际上并非在统治，而只是在裁判纠纷，外国的宫廷已如我国臣民一样清楚地察觉到了这种差别。如今坚持君主专制，无论我们如何应对，都可能引发一场谁都无法确保能赢的争斗。"
 swe_age_of_freedom_decision.a: "放弃专制。"
 swe_age_of_freedom_decision.b: "握紧缰绳……"
 swe_age_of_freedom_always: "这是一项被锁定的改革，无法主动移除。"
 swe_age_of_freedom_decision.historical_info: "无嗣的卡尔十二世去世后，其妹乌尔丽卡·埃莉诺拉继位为女王。坚定的议会派首相阿尔维德·霍恩立即抓住这一时机，着手推翻专制统治并强化议会权力。虽然他的民主倾向在某种程度上值得称道，但其行动却使瑞典陷入彻底动荡，并在随后五十年间沦为外国势力的傀儡。这段所谓“自由时代”也见证了贵族阶层重获失去的部分权力。然而，年轻的女王认为，任何激进变革都可能过度激怒饱受战争之苦的国民，故未寻求其他明显可行的替代方案。"
 iro_iroquois_interactions_decision.title: "大媾和家的遗产"
 iro_iroquois_interactions_decision.desc: "曾经分裂的[ShowCultureGroupName('haudenosaunee_group')]族群通过大媾和家德加纳维达的努力走向统一，他将曾经互为宿敌的部族联合成了一个家族般的联盟。自[ShowCultureGroupNameWithNoTooltip('haudenosaunee_group')]部落联盟成立以来，这些部族始终团结共存。但如今，一些背地里的议论开始浮现，有人认为应当有一个主导部族站出来，担任首领。然而，这样的企图或许将破坏德加纳维达创立[ShowCultureGroupNameWithNoTooltip('haudenosaunee_group')]部落联盟的初衷。"
 iro_iroquois_interactions_decision.a: "时代在改变。"
 may_unify_haudenosaunee_confederation: "解锁对其他[ShowCultureGroupName('haudenosaunee_group')]国家的[ShowCountryInteractionName('form_closer_bond_iroquois')]与[ShowCountryInteractionName('merge_tribe_iroquois')]互动。一统[ShowCultureGroupNameWithNoTooltip('haudenosaunee_group')]领土后，我们将能够成为统一的[ShowCultureGroupNameWithNoTooltip('haudenosaunee_group')]部族联盟。"
 hol_ned_shipbuilding_decision_tt: "$name_peter.dutch_dialect$·$name_john.dutch_dialect$·$Liorne$将加入我们的[court|e]"
 kulm_law_not_revised_tooltip: "已通过$teu_kulm_law_revised_decision.title$[decision|e]选择不修订[ShowEstatePrivilegeName('kulm_law')]。"
 kulm_law_revised_tooltip: "已通过$teu_kulm_law_revised_decision.title$[decision|e]修订了[ShowEstatePrivilegeName('kulm_law')]。"
 pru_unified_legal_system_decision.a_tt: "提议改革的[character|e]将出现在我们的[court|e]之中"
