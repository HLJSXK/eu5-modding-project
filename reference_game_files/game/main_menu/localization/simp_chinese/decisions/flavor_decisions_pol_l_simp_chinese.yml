l_simp_chinese:
 pol_shooting_societies_decision.title: "射击协会"
 pol_shooting_societies_decision.desc: "生活常常充满危险，外来侵略者觊觎着我们富饶的土地。为了保卫家园，许多[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]的成员在[ShowLocationName('krakow')]成立了一个射击协会，旨在维护繁荣，并培养一支精锐的射手民兵。\n\n随着我国领土和人口的扩张，新的城镇也纷纷寻求建立自己的射击协会，因此许多城镇的代表正式请求官方支持，以在各自的城镇建立此类协会。"
 pol_shooting_societies_decision.desc.entry: "自备火药与铅弹操练的市民不花国库分文，征召之时却依旧应召而至。始于[ShowLocationName('krakow')]的一个射击会，或许有朝一日会成为特许状，赐予每一座愿意出资组建此类社团的城镇——只要$burghers_estate$值得托付武器。"
 pol_shooting_societies_decision.a: "射鸡可不是#italic 闹着玩的#!——这需要精准和技巧！"
 pol_shooting_societies_decision.b: "在[ShowLocationNameWithNoTooltip('krakow')]组建一个就足够了。"
 pol_shooting_societies_decision.c: "让我们更有效地利用资金……"
 pol_shooting_societies_decision.historical_info: "被称为“公鸡社团”的组织，其名称的起源可以追溯到兄弟会早期的射击比赛。最初，他们使用活的母鸡和公鸡作为靶子，后来逐渐演变为使用被称为#italic 库尔#!的木制公鸡模型。这种转变导致了最初名称#italic 库尔兄弟会#!的产生，#italic 库尔#!在波兰口语中意为#italic 公鸡#!。\n\n随着火器的出现，击锤与公鸡头部之间的相似之处变得非常明显。射手在射击前拉动击锤的动作被描述为“cocking”（公鸡/扣扳机），进一步巩固了与公鸡的联系。"
 pol_privilege_of_koszyce_decision.title: "科希策特权"
 pol_privilege_of_koszyce_decision.desc: "[ruler_scope.GetName]向[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]提出请求，如果死后没有男性后代，可以让女儿继承王位。对于[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]来说，这是一个从[ROOT.GetCountry.GetGovernment.GetRulerTitle]那里获得更多特权的好机会，他们所有人对此都表示赞同。有了这样的特权，[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]赋税将会降低，未经他们同意，就不会再设立新的税种。此外，未来的[ROOT.GetCountry.GetGovernment.GetRulerTitle]都必须支付他们的访问费用，这对[ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')]来说无疑是一种羞辱。"
 pol_privilege_of_koszyce_decision.desc.entry: "王位传给女儿需要各方同意，而在这片王国里，同意是有价的。 $nobles_estate$ 将以金钱与豁免开出价目，如今每一项让步一旦应允，便会成为日后任何 $crown_estate$ 都无法收回的先例。"
 pol_privilege_of_koszyce_decision.a: "我们将贯彻到底。"
 POL_may_form_union_with_lit_at_later_date: "随着[ShowEstatePrivilegeName('privilege_of_koszyce')]的颁布，[ROOT.GetCountry.GetName]将能够通过$flavor_pol.55.title$事件建立与[GetCountry('LIT').GetName]的共主邦联。"
 pol_privilege_of_koszyce_decision.historical_info: "拉约什一世，这位以共主邦联形式统治任匈牙利和波兰的君主，将科希采特权授予什拉赫塔贵族们。这项特权确保了他其中一位女儿享有继承权，但代价却是给予了贵族大量特权，最终使波兰在未来走上了“贵族民主”的道路。他女儿雅德维加的继承促成了她与立陶宛大公雅盖沃的联姻，造就了波兰和立陶宛的共主邦联，并最终形成了波兰立陶宛联邦。"
 pol_nihil_novi_decision.title: "非公认，无新法"
 pol_nihil_novi_decision.desc: "在最近的[ROOT.GetCountry.GetGovernment.GetParliament.GetName]上，[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]提出了一个极其荒谬的请愿——他们对[ROOT.GetCountry.GetGovernment.GetAdjective]王权的软弱深信不疑，以至于提出了“如果他们不对某项法律达成完全赞成，这项法律就不得通过”的要求。何其大逆不道！尽管如此，如果得不到他们的支持，我们哪来的资金进行下一步的行动呢？因此，尽管这个提案如此荒谬，我们还是必须认真考虑他们的想法。此外，他们还要求限制市民的权力、约束农奴的迁徙自由。我们可能会被迫接受[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]的过分条件。"
 pol_nihil_novi_decision.desc.entry: "我们的议会正有一项请愿，若获通过，将使 $nobles_estate$ 不受任何未经他们自身批准之法律的约束，与此同时市民与农奴也被束缚得更紧。这是一份包装成请求的侮辱，但若拒绝，就得另寻他法为我们的战争筹措钱粮。"
 pol_nihil_novi_decision.a: "让他们为这个小特权沾沾自喜吧。"
 pol_nihil_novi_decision.b: "那我们也不会再给他们什么特权了。"
 pol_nihil_novi_decision.historical_info: "“如果未经公认，则不得另立新法”（#italic 非公认，无新法#!）是1505年波兰瑟姆议会签订的法案。该法案规定，如果一项法律不能得到所有贵族的一致同意，那就不能得到通过。这项法案被认为是波兰贵族民主制的开端，也奠定了后来的#italic “黄金自由”#!的基础。"
 pol_rule_of_the_sejm_decision.title: "波兰的选举君主制"
 pol_rule_of_the_sejm_decision.desc: "对其特权充满信心的[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]开始重提其古老的主张。越来越多的[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]引用历史先例，宣称其拥有选择[ROOT.GetCountry.GetFlavorRank]继任者的不可剥夺的权利。虽然我们很想反对这种荒谬的主张，但难以忽视的一点是，[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]的影响力正在上升，而[ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')]的影响力却在下降。不幸的是，无论我们是否乐意，都必须在未来君主的选举中对他们公开表示信任。"
 pol_rule_of_the_sejm_decision.desc.entry: "谁选出君主，谁便掌控王权。$nobles_estate$ 已强大到足以公然提出此等主张，而 $crown_estate$ 已不再强大到能够回应此言。"
 pol_rule_of_the_sejm_decision.a: "我们信任瑟姆议会！"
 pol_rule_of_the_sejm_decision.historical_info: "14世纪和15世纪，波兰贵族享有多项特权，其中包括选举波兰统治者的权利。最初，雅盖隆王朝的各继承人在继承权上没有争议，因此选举只是一种形式。但随着雅盖隆王朝绝嗣，这种情况发生了变化，什拉赫塔第一次必须从多个外国贵族中进行选择。真正的选王始于1573年瓦卢瓦的亨利当选，此后直到18世纪波兰立陶宛联邦灭亡，历任君主都是从外国候选人中选出的。"
 pol_nihil_novi_decision.b_tt: "我们日后将能够选择 $nihil_novi$"
