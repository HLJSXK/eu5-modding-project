l_simp_chinese:
 charter_manila_galleon.title: "组建马尼拉大帆船队"
 charter_manila_galleon.desc: "横跨太平洋的返程航线已完成测绘并得到验证，这片海洋不再是屏障，而是一条通途。我们在西海岸装备一艘大型盖伦帆船，把船舱装满白银，让它沿着北部航道前往亚洲再返航——白银运出去，丝绸和香料运回来。这笔开销很大，航程也很长，但只要一艘盖伦帆船平安返回，就能赚回数倍于成本的收益。它年内不会返航，大海仍有可能将它吞没；但只要它能回来，船上的财富也会一同抵达。"
 charter_manila_galleon.a: "准备好盖伦帆船，装满一整季开采的白银。"
