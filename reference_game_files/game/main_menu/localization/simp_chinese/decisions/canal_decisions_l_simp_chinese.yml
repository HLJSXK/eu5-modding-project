l_simp_chinese:
 build_suez_canal.title: "Construct the Suez Canal"
 build_suez_canal.desc: "我方工程师报告称，开凿一条穿越苏伊士地峡的运河已在我们的技术能力范围之内。这项工程规模浩大，但其奖赏——掌控整个东方贸易——更为丰厚。"
 build_suez_canal.a: "动工开凿运河。"
 build_suez_canal.b: "Not at this time."
 build_panama_canal.title: "Construct the Panama Canal"
 build_panama_canal.desc: "我方工程师已勘测了新大陆的狭窄地峡。开凿一条连接两大洋的运河并非不可能。耗资将极为庞大，而回报也将不可估量。"
 build_panama_canal.a: "动工开凿运河。"
 build_panama_canal.b: "Not at this time."
