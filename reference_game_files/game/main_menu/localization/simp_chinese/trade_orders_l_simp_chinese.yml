 TRADE_ORDER_MODE_PROFIT_TT: "指令会将[merchant_capacity|e]花费在所选商品和市场中利润最高的[trades|e]上。"
 TRADE_ORDER_MODE_FOOD_TT: "指令会将[merchant_capacity|e]花费在为正在失去食物，且[food_stockpile|e]低于[GetDefine('NAI','TRADE_ORDER_FOOD_MAINTAIN_STOCKPILE_FRACTION')|V0%]的市场进口最多[food|e]的[trades|e]上。"
 TRADE_ORDER_MODE_NEEDS_TT: "指令会将[merchant_capacity|e]花费在覆盖目标市场的[goods|e]短缺上，按顺序逐条满足。只有[stockpile|e]低于[GetDefine('NAI','TRADE_ORDER_NEEDS_STOCKPILE_EXCLUSION_FRACTION')|V0%]的商品会进行补给。"
 TRADE_ORDER_MODE_PROFIT_INFO: "该指令优先考虑#italic 利润#!：它会将[merchant_capacity|e]用于所选择的商品和市场中最有利可图的[trades|e]。"
 TRADE_ORDER_MODE_FOOD_INFO: "该指令优先考虑#italic 食物#!：它会将[merchant_capacity|e]用于能将最多[food|e]运往急需市场的[trades|e]。\n\n只有当市场在没有该指令的情况下会缺粮，且其[food_stockpile|e]低于[GetDefine('NAI','TRADE_ORDER_FOOD_MAINTAIN_STOCKPILE_FRACTION')|V0%]时，市场才会获得供应。当储备低于[GetDefine('NAI','TRADE_ORDER_FOOD_GROWTH_STOCKPILE_FRACTION')|V0%]时，该指令还会每月补充其最大储备的[GetDefine('NAI','TRADE_ORDER_FOOD_MONTHLY_STOCKPILE_GAIN')|V0%]。当储备高于[GetDefine('NAI','TRADE_ORDER_FOOD_MAINTAIN_STOCKPILE_FRACTION')|V0%]时，该市场被视为已得到供应，不再获得食物。\n\n当指令自身市场的[food_stockpile]低于[GetDefine('NAI','TRADE_ORDER_FOOD_EXPORT_SELF_STOP_FRACTION')|V0%]时，出口将暂停；低于[GetDefine('NAI','TRADE_ORDER_FOOD_EXPORT_SELF_CANCEL_FRACTION')|V0%]时，出口将被取消。"
 TRADE_ORDER_MODE_NEEDS_INFO: "该指令优先考虑#italic 需求#!：它会按商品在列表中的顺序，将[merchant_capacity|e]用于满足列表中的每种商品。\n\n只有当目标市场对商品的消费量超出其本地产量，且其[stockpile|e]低于[GetDefine('NAI','TRADE_ORDER_NEEDS_STOCKPILE_EXCLUSION_FRACTION')|V0%]时，商品才会获得供应。指令将仅调动足够使供需平衡归零的贸易量（计入已从其他渠道获得的援助），并忽略仅由出口造成的短缺。\n\n当商品的[stockpile|e]低于[GetDefine('NAI','TRADE_ORDER_NEEDS_GROWTH_STOCKPILE_FRACTION')|V0%]时，该指令还会每月补充其最大储备的[GetDefine('NAI','TRADE_ORDER_NEEDS_MONTHLY_STOCKPILE_GAIN')|V1%]；若储备介于该值与[GetDefine('NAI','TRADE_ORDER_NEEDS_STOCKPILE_EXCLUSION_FRACTION')|V0%]之间，则仅补足平衡缺口。"
