 TRADE_ORDER_MIN_PROFIT_TT: "该指令将不被允许进行低于此阈值的[trades]，以确保一定的盈利能力。\n\n若阈值设为负值或未加限制，[trade_order]将被允许以净亏损的方式进行[trades]，实际上相当于补贴[trade]。\n\n一种商品的最高[trade]利润越接近此阈值，指令为该商品投入的贸易容量就越慢、越小——它宁愿闲置部分容量，也不愿压低该商品的价格；而利润越高于阈值，投入的规模和速度就越大越快。"
