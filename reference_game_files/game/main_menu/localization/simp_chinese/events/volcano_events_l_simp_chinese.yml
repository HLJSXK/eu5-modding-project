l_simp_chinese:
 STATIC_MODIFIER_NAME_volcanic_soil: "火山沃土"
 volcano_events_weak.title: "火山上的烟尘"
 volcano_events_weak.desc: "位于[ROOT.GetLocation.GetName]边缘的著名山脉已持续喷发烟雾多日，而今日突然剧烈爆发，喷涌的火山灰与熔岩焚毁了沿途的一切。这场灾难虽未击垮[ROOT.GetLocation.GetNameWithNoTooltip]人民的精神，但若无外界援助，他们恐难恢复往日的生机与活力。"
 volcano_events_weak.a: "我们无能为力。"
 volcano_events_weak.b: "赶快去帮助他们。"
 volcano_events_minor.title: "烈焰喷薄"
 volcano_events_minor.desc: "[ROOT.GetLocation.GetName]火山猛烈喷发，炽热岩浆奔腾肆虐，遮天蔽日的火山灰云席卷大地，所到之处满目疮痍。\n\n[ROOT.GetLocation.GetNameWithNoTooltip]民众正在为守护家园与生命而奋战，此时此刻，我们理应倾力相助。"
 volcano_events_minor.a: "这是大自然对我们的惩罚。"
 volcano_events_minor.b: "我们不会被击垮。"
 volcano_events_major.title: "烈焰与愤怒"
 volcano_events_major.desc: "在吞噬夜色的黑暗中，火焰如同开放的伤口般从大山山坡上奔涌而下，刺眼的红色令人睁不开眼。炽热的火山灰如同不耐烦的猎手紧随其后，张开大口渴望吞噬路径上的一切，直到其饥饿最终得到满足。不幸的[ROOT.GetLocation.GetName]人民已无生机可寻，大半的郊野与无数村落已经尽数湮没于熔岩之下。大山的愤怒无边无际，唯有来自宫廷的援手能够阻止这场灾难。"
 volcano_events_major.a: "连大地都在与我们为敌。"
 volcano_events_major.b: "我们将进行重建。"
 volcano_events_catastrophic.title: "大山的怒火"
 volcano_events_catastrophic.desc: "[ROOT.GetLocation.GetName]的渺小居民在大自然的愤怒面前显得完全无能为力。毫无预警之下，散布在各地的众多村庄被完全摧毁，陷入那座高耸于他们上方的火山的灾难性喷发中。\n\n大山的怒火以无情的力量降临，形成一股渴望吞噬一切的火山灰雪崩。许多炽热的熔岩从山心喷涌而出，烧毁并摧毁了路径上的一切。\n\n随着眼前的景象不断变化，[ROOT.GetLocation.GetNameWithNoTooltip]的人民痛苦地意识到，面对这场浩劫，他们几乎无能为力。"
 volcano_events_catastrophic.a: "一切都完了。"
 volcano_events_catastrophic.b: "还有希望。"
