 flavor_ara.220.title: "巴塞罗那兑换银行"
 flavor_ara.220.entry: "$flavor_ara.220.title$"
 flavor_ara.220.desc: "[taula_bank_hq.GetName][ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]中的商人和富裕成员一直表示需要一个可靠的机构来处理货币兑换并保证存款的价值。在[taula_bank_hq.GetNameWithNoTooltip]建立一个城市兑换台将为[ROOT.GetCountry.GetFlavorRank]提供稳定的财务基础，并吸引地中海各地的商业。"
 flavor_ara.220.historical_info: "#italic 巴塞罗那兑换银行#!，又称巴塞罗那兑换台，建于1401年，被视为世界上最古老的公共银行之一。它由阿拉贡王冠领应#italic 百人议会#!的要求在巴塞罗那建立，很快在王国其他城市也出现仿效的类似#italic 银行#!，例如巴伦西亚和赫罗纳。它的稳定性和可靠性使其成为欧洲后来公共银行的典范。"
 flavor_ara.220.a: "合理的[ROOT.GetCountry.GetFlavorRank]机构！"
 flavor_ara.220.b: "让我们推广这一银行实践。"
 flavor_ara.221.title: "$flavor_ara.220.title$"
 flavor_ara.221.desc: "我们受[ROOT.GetCountry.GetDiplomacy.GetOverlord.GetLongName]和[taula_bank_hq.GetName]商人的委托负责金融和货币兑换。我们的兑换台将为所有存款者提供稳定和安全的服务。"
 flavor_ara.221.a: "账簿已开放营业。"
 flavor_ara.1000.entry: "$flavor_ara.1000.title$"
 flavor_ara.1000.title: "继承的妥协"
 flavor_ara.1000.desc: "[ROOT.GetCountry.GetName]目前的动荡局势，使得许多[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]都在寻求为[ROOT.GetCountry.GetFlavorRank]另立新君。由于国内已有多位觊觎王位的人选彼此争夺不休，许多人认为最好还是将王位交给外邦王室的一员。[trastamara_candidate.GetName]已成为最有力的候选人，不仅赢得了各阶层的支持，还与历代统治者建立了联系。然而，也有一些家族希望邀请来自[first_country.GetName]和[second_country.GetName]的人选，认为他们的利益更贴近己方。"
 flavor_ara.1000.a: "让我们为此做好准备。"
 flavor_ara.1000.b: "我们为何要将王位拱手让给外邦人？"
 ara_trigger_election_of_new_ruler_event_in_a_year_tt: "选举将于一年内举行，届时来自 [first_country.GetName] 与 [second_country.GetName] 的候选人均有资格参与"
 flavor_ara.1001.title: "$flavor_ara.1000.title$"
 flavor_ara.1001.desc: "由于[from_country.GetFlavorRank]内部爆发的继承危机，[from_country.GetName]的[from_country.GetGovernment.GetEstateName('nobles_estate')]向我们提出机会，希望[target_character.GetName]能参与[election_location.GetName]的妥协方案。这对我们而言是个大好机会，但[target_character.GetNameWithNoTooltip]或许更适合继续为我国效力，而非统治整个国家。"
 flavor_ara.1001.a: "让 [target_character.GetHerHim] 参与。"
 flavor_ara.1001.b: "我们对他们的继承问题不感兴趣。"
 ara_character_will_participate_in_the_selection_of_new_aragonese_ruler_tt: "[target_character.GetName]将参与#Y[election_location.GetName]的妥协方案#!"
 flavor_ara.1002.title: "$flavor_ara.1000.title$"
 flavor_ara.1002.desc: "随着 [election_location.GetName] 妥协方案的准备工作已经完成，来自 [ROOT.GetCountry.GetName] 各地的众多 [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] 家族齐聚一堂，就他们中意的候选人发表意见。然而，普遍的情绪都倾向于 [trastamara_candidate.GetName]，此人似乎已凭借动人的言辞与激昂的演说赢得了这些家族的心。不过，我们仍有机会否决他们属意的人选，转而选择一位更有能力之人，此人或许能为我们与世界其他地方建立起宝贵的联系。"
 flavor_ara.1002.a: "[trastamara_candidate.GetNameWithNoTooltip] 是各家族所选中的候选人。"
 flavor_ara.1002.b: "[first_foreign_candidate.GetNameWithNoTooltip] 似乎是最有能力的人选。"
 flavor_ara.1002.c: "[second_foreign_candidate.GetNameWithNoTooltip] 的人脉关系或许大有用处。"
 flavor_ara.1100.entry: "$flavor_ara.1100.title$"
 flavor_ara.1100.title: "Words from [GetCountry('BOS').GetNameWithNoTooltip]"
 flavor_ara.1100.desc: "The great [target_character.GetName] of [GetCountry('BOS').GetName] has long struggled to maintain their sovereignty against power-hungry neighbors. Unable to defend themselves alone, several [GetCountry('BOS').GetGovernment.GetEstateName('nobles_estate')] have approached [target_character2.GetName] and the [ROOT.GetCountry.GetGovernment.GetCourtTitle], asking that we protect them from any invasion. They would prefer to become our subjects rather than fall into heathen hands, something we can exploit to our advantage."
 flavor_ara.1100.a: "Let us see what we can do."
 ara_unlock_decision_to_demand_vassalization_of_bosnia_tt: "We will unlock the $ara_vassalize_bosnia$ [decision|e]"
 flavor_ara.1101.title: "Diplomats from [from_country.GetNameWithNoTooltip]"
 flavor_ara.1101.desc: "Wishing to protect us from foreign threats, our [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] have reached out to [from_country.GetName] for aid, and in response they have sent a delegation to discuss these matters. Knowing that we would choose dishonor rather than death, they have requested that we become their subjects. In doing so, their troops and their [from_country.GetGovernment.GetEstateName('nobles_estate')] will be able to protect us more directly, rather than relying on a loose alliance between our two countries."
 flavor_ara.1101.a: "We shall submit to them."
 flavor_ara.1101.b: "Then let death claim us, but let them know that we will die standing free!"
 ara_gain_4_hounfince_in_capital: "我们将在[ROOT.GetCountry.GetCapital.GetName]获得4个[ShowUnitDefinitionName('a_houfnice')][regiments|e]"
