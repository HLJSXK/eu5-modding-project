l_simp_chinese:
 flavor_mfa.1.title: "$BYZ_ADJ$传统"
 flavor_mfa.1.entry: "$BYZ_ADJ$传统"
 flavor_mfa.1.desc: "[ROOT.GetCountry.GetLongName]正站在十字路口上。就在几十年前，[ROOT.GetCountry.GetFlavorRank]见证了骄傲的[target_character.GetDynasty.GetName]家族的成员[target_character2.GetName]的登基。尽管[ShowModifier('byz_born_in_the_purple_modifier')]，但[target_character2.GetSheHe]却改信了[ShowReligionName('catholic')]并接受了[ShowCultureName('piedmontese')]文化，放弃了[target_character2.GetHerHis]的[target_country.GetAdjective]根源。\n\n如今，[ROOT.GetCountry.GetNameWithNoTooltip]由[target_character2.GetHerHis]的后代[target_character.GetName]统治，而[target_character.GetSheHe]也许会畅想如果[target_character.GetSheHe]不是出生在[target_character.GetLocation.GetName]，会在[target_country.GetLongNameWithNoTooltip]过上何等的生活。"
 flavor_mfa.1.a: "[target_character2.GetNameWithNoTooltip]的改变十分明智。"
 flavor_mfa.1.a.entry: "统治者的改变十分明智。"
 flavor_mfa.1.b: "我们不应放弃自己的根源！"
 mfa_extra_information_about_reform: "[target_government_reform.GetName]的[modifiers|e]的效果由负到正取决于[ShowCultureName('greek_culture')][culture|e]占比和[ShowReligionAdjective('orthodox')][religion|e]占比。如果[ROOT.GetCountry.GetName]转变文化和宗教，惩罚会逐渐转为正面效果。修正在#N ‑1#!到#G +1#!之间浮动"
 mfa_opportunity_for_thessaloniki: "如果采用了[target_government_reform.GetName]且我们达到#W 75.0%#!的[ShowCultureName('greek_culture')][culture|e]和[ShowReligionAdjective('orthodox')][religion|e]占比，我们将可以向[target_country.GetName]索取[ShowLocationName('thessaloniki')]及周边的采邑"
 flavor_mfa.2.title: "[target_character.GetNameWithNoTooltip]"
 flavor_mfa.2.entry: "法奇诺·卡内"
 flavor_mfa.2.desc: "[target_character.GetName]，出身于[target_character.GetBirthLocation.GetName]的著名佣兵队长，如今来到了我们[ROOT.GetCountry.GetFlavorRank]。[target_character.GetNameWithNoTooltip]多年来曾服务于多个国家，成为了一名优秀的指挥官。根据[target_character.GetHerHis]国外的事迹，我们认为[target_character.GetSheHe]非常适合我们，而[target_character.GetHerHis]的佣兵团能成为我们对抗本地区其他国家的强大资产。"
 flavor_mfa.2.a: "我们需要雇佣[target_character.GetHerHim]。"
 flavor_mfa.2.a.entry: "我们需要雇佣他。"
 flavor_mfa.2.b: "给[target_character.GetHerHim]一些领地，以此雇佣[target_character.GetHerHis]。"
 flavor_mfa.2.b.entry: "给他一些领地，以此雇佣他。"
 flavor_mfa.2.c: "呸！让这个流浪者去别处找工作去。"
 mfa_facino_condotierro: "法奇诺兵团"
 flavor_mfa.3.title: "堪配皇帝的雄心"
 flavor_mfa.3.entry: "$flavor_mfa.3.title$"
 flavor_mfa.3.desc: "[target_character.GetName]可能并非如此[ShowModifier('byz_born_in_the_purple_modifier')]或者身为皇帝的后裔，但却是皇室血统的[target_character.GetDynasty.GetName]贯穿[target_character.GetHerHis]静脉。[target_character.GetSheHe|U]不甘心仅仅成为众多小统治者之一[ShowAreaName('piemonte_area')]。[target_character.GetShortNameWithNoTooltip]有资格统治远比这更伟大的事物[ShowCountryRankName('rank_county')]。"
 flavor_mfa.3.a: "[ShowAreaNameWithNoTooltip('piemonte_area')]需要一位新霸主。"
 flavor_mfa.3.b: "[target_character.GetHerHis|U]的野心只是让其他人都反对我们。"
 flavor_mfa.3.b.entry: "他的野心只是让其他人都反对我们。"
 mfa_if_we_conquer_enough_in_20_years: "如果[ROOT.GetCountry.GetName]在#W 20#!年内达到至少#W [DisplayPopulationNumber('(CFixedPoint)500')]#![population_i|e][population|e]，他们将获得[SCOPE.ScriptValue('prestige_mild_bonus')|+=][prestige_i|e][prestige|e]以及持续#W 40#!年的[ShowModifier('mfa_elevation_modifier')][modifier|e]，如果还不是[ShowCountryRankName('rank_duchy')]则升级为公国\n如果[ROOT.GetCountry.GetName]未能达成目标，他们将失去[SCOPE.ScriptValue('prestige_extreme_penalty')|+=][prestige_i|e][prestige|e]和[SCOPE.ScriptValue('stability_weak_penalty')|+=][stability_i|e][stability|e]，其所有邻国将获得针对其的[ShowCasusBelliName('cb_cut_down_in_size')][casus_belli|e]"
 flavor_mfa.4.title: "[ShowRegionNameWithNoTooltip('italy_region')]的笑柄"
 flavor_mfa.4.desc: "数十年前，[target_character.GetName]曾立下誓言，要成为[ShowAreaName('piemonte_area')]的霸主。然而时至今日，当初的宏图愿景，只剩下了对[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]成员们的恶毒嘲弄。[ROOT.GetCountry.GetLongName]的[target_character.GetDynasty.GetName]家族不仅未能实现其野心，反而在此过程中结下了众多新的仇敌。面对这般悲惨的处境，那位[ROOT.GetCountry.GetFlavorRank]的友好邻邦，是否还能抱有一丝同情之心？"
 flavor_mfa.4.a: "我们做了能做的。"
 flavor_mfa.5.title: "成熟的水果"
 flavor_mfa.5.desc: "在过去数年间，[from_country.GetLongName]一直在努力让邻国树敌。如今，他们的野心只为他们赢得了嘲笑和愤怒。我们和许多其他人都希望他们的悲惨处境受到蔑视。"
 flavor_mfa.5.a: "哦，惨啊。"
 flavor_mfa.6.title: "[ShowAreaNameWithNoTooltip('piemonte_area')]公爵"
 flavor_mfa.6.desc: "几年前，[target_character.GetName]曾立下誓言，[target_character.GetHerHis]的家族，[ROOT.GetCountry.GetAdjective]的[target_character.GetDynasty.GetName]家族，总有一天会得到它应得的辉煌。如今，[target_character.GetHerHis]的努力终于得到了认可，这颗[ShowAreaName('piemonte_area')]的明珠已经升格成为了[ShowCountryRankName('rank_duchy')]。"
 flavor_mfa.6.a: "也行[ROOT.GetCountry.GetAdjectiveWithNoTooltip]统治者也配得上生于紫室的称号？"
 flavor_mfa.6.b: "荣耀归于[ROOT.GetCountry.GetNameWithNoTooltip]！"
 mfa_purple_color: "我们的国家颜色将变为#W 深紫#!色"
 flavor_mfa.7.title: "我们对[ShowScriptedGeographyNameWithNoTooltip('claims_of_thessalonica_geography')]的宣称"
 flavor_mfa.7.entry: "$flavor_mfa.7.title$"
 flavor_mfa.7.desc: "[target_character.GetName]是[target_character2.GetName]开创的[target_character.GetDynasty.GetName]世系的一员，通过[target_character.GetHerHis]的家族拥有对[target_country.GetLongName]天然（尽管遥远）的宣称。而[target_character.GetHerHis]另一项不那么出名的宣称，是对[ShowScriptedGeographyName('claims_of_thessalonica_geography')]的宣称，可以追溯至[target_character3.GetName]和[target_character3.GetDynasty.GetName]家族。与[target_country.GetCapital.GetName]的[target_character.GetDynasty.GetNameWithNoTooltip]家族密切合作后，[target_character.GetName]相信我们可能会获得[target_location.GetName]及周边地点，以换取我们的帮助。"
 flavor_mfa.7.a: "提出宣称。"
 flavor_mfa.7.b: "我们不应该滥用他们的善意。"
 MFA_request_thessalonica: "我们会向[target_country.GetLongName]索要[ShowProvinceDefinitionName('chalkidiki_province')]、[ShowProvinceDefinitionName('lower_macedonia_province')]和[ShowProvinceDefinitionName('central_macedonia_province')]作为[ShowSubjectTypeName('fiefdom')]"
 flavor_mfa.8.title: "[from_country.GetNameWithNoTooltip]的要求"
 flavor_mfa.8.desc: "我们在[from_country.GetLongName]的[target_character.GetDynasty.GetName]同族，已在[ShowRegionName('italy_region')]半岛建立起一个名副其实的[target_country.GetAdjective]国家。那里的人民信奉[ROOT.GetCountry.GetReligion.GetAdjective]，操持着我们的[ROOT.GetCountry.GetCulture.GetName]语言；他们身披紫袍，与我们的声息相通。基于我们共同的历史与彼此间的合作，其统治者[target_character.GetName]正凭借[target_character.GetHerHis]对帖[ShowScriptedGeographyName('claims_of_thessalonica_geography')]的传统诉求，请求将[target_location.GetName]及周边地区赐封为其领地。"
 flavor_mfa.8.a: "他们应当认识到，[target_character.GetSheHe|U]所援引的那句[ShowLanguageNameWithNoTooltip('latin_language')]措辞是欠妥的。"
 flavor_mfa.8.b: "我们会尊重他们的宣称。"
 mfa_make_thessaloniki_subject: "我们在[ShowProvinceDefinitionName('chalkidiki_province')]、[ShowProvinceDefinitionName('lower_macedonia_province')]和[ShowProvinceDefinitionName('central_macedonia_province')]的[locations|e]将释放为[from_country.GetName]的[ShowSubjectTypeName('fiefdom')]"
 flavor_mfa.1000.title: "$flavor_mfa.7.title$"
 flavor_mfa.1000.entry: "$flavor_mfa.7.title$"
 flavor_mfa.1000.desc: "作为光荣的[target_character.GetDynasty.GetName]血脉，[target_character.GetName]拥有一项相当重要的宣称，可以追溯至[target_character3.GetName]。那就是对[ShowScriptedGeographyName('claims_of_thessalonica_geography')]的宣称。尽管这一宣称并不那么有力，但我们可以依靠其他国家的支持，许多[ShowCultureGroupName('italian_group')]国家都希望趁[target_country.GetLongName]经历[ShowDisasterName('byzantine_succession_crisis')]时分一杯羹。"
 flavor_mfa.1000.a: "让我们组织一次军事行动。"
 flavor_mfa.1000.b: "就靠这种虚无缥缈的宣称发动战争也太蠢了。"
 recipient_agrees_to_join_war: "[recipient.GetName]将承诺加入[actor.GetName]在若干年内针对[GetCountry('BYZ').GetLongName]的战争"
 MFA_gather_allies: "[ROOT.GetCountry.GetName]将尝试使用[ShowCountryInteractionName('mfa_join_against_byz')][country_interaction|e]集结盟友\n在#W 3年#!内，将触发发动[war|e]的[event|e]，并得到集结的支持者的帮助"
 flavor_mfa.1001.title: "安抚[from_country.GetAdjectiveWithNoTooltip]觊觎者"
 flavor_mfa.1001.desc: "卑鄙的[from_country.GetAdjective][target_character.GetDynasty.GetName]家族正使用其[target_character3.GetDynasty.GetName]血统宣称[ShowScriptedGeographyName('claims_of_thessalonica_geography')]。我们的间谍报告称，他们正试图组建一个[ShowCultureGroupName('italian_group')]联盟，在我们处于[ShowDisasterName('byzantine_succession_crisis')]实力虚弱时夺取这些土地。"
 flavor_mfa.1001.a: "我们不会给那些叛徒一寸土地！"
 flavor_mfa.1001.b: "象征性给他们一点。"
 flavor_mfa.1001.c: "全给他们算了，我们不在乎！"
 mfa_offer_few_provinces: "我们会向[from_country.GetName]提供[ShowProvinceDefinitionName('chalkidiki_province')]、[ShowProvinceDefinitionName('lower_macedonia_province')]和[ShowProvinceDefinitionName('central_macedonia_province')][provinces|e]以安抚他们"
 mfa_offer_entire_geography: "我们会向[from_country.GetName]提供我们在[ShowScriptedGeographyName('claims_of_thessalonica_geography')]的所有土地"
 flavor_mfa.1002.title: "时机"
 flavor_mfa.1002.desc: "自我们开始集结盟友准备对[target_country.GetLongName]的军事行动，已经过去了许久。我们的敌人因内乱实力大幅削弱，成为征服战争的理想目标。随着许多盟友承诺支持我们的事业，也许是时候证明[target_dynasty.GetName]家族的哪一条世系更加优秀了。"
 flavor_mfa.1002.a: "释放战争之犬！"
 flavor_mfa.1002.b: "现在还不是时候。"
 flavor_mfa.1002.c: "我们最好放弃这个计划。"
 flavor_mfa.1003.title: "履行协议"
 flavor_mfa.1003.desc: "与[target_country.GetLongName]的战争终于爆发了，我们被要求履行对[from_country.GetName]的承诺。我们是要在[target_character.GetDynasty.GetName]家族的内战中提供帮助，还是让[from_country.GetLongNameWithNoTooltip]在[target_war.GetName]中自生自灭？"
 flavor_mfa.1003.a: "我们不会放弃盟友。"
 flavor_mfa.1003.b: "在场外观看才是正确的道路。"
 flavor_mfa.1005.title: "[target_country.GetNameWithNoTooltip]的提议"
 flavor_mfa.1005.desc: "怯懦的[target_country.GetLongName]终于找回了理性，提出将[ShowScriptedGeographyName('claims_of_thessalonica_geography')]的领土交给我们。我们应该谨慎考虑这一提议，因为整场远征本身就是风险。"
 flavor_mfa.1005.a: "能拿点是点。"
 flavor_mfa.1005.b: "以为这就能阻止我们，实在太蠢了！"
 mfa_make_thessaloniki_subject_out_of_provinces: "[target_country.GetAdjective]在[ShowProvinceDefinitionName('chalkidiki_province')]、[ShowProvinceDefinitionName('lower_macedonia_province')]和[ShowProvinceDefinitionName('central_macedonia_province')]的[locations|e]将被释放为[from_country.GetName]的[ShowSubjectTypeName('fiefdom')]"
 mfa_make_thessaloniki_subject_out_of_geography: "[target_country.GetAdjective]在[ShowScriptedGeographyName('claims_of_thessalonica_geography')]的[locations|e]将被释放为[from_country.GetName]的[ShowSubjectTypeName('fiefdom')]"
 flavor_mfa.1006.title: "[from_country.GetLongNameWithNoTooltip]的回应"
 flavor_mfa.1006.desc.affirmative: "[target_character.GetDynasty.GetName]家族的内战终得避免！看来，[from_country.GetAdjective]那支卑鄙的家族分支终于幡然悔悟，决定停止侵略，并接受我方提出的土地转移方案。"
 flavor_mfa.1006.desc.negative: "卑鄙无耻、背信弃义的[from_country.GetAdjective][target_character.GetDynasty.GetName]世系根本不可信任！我们提出的和平解决方案已被他们断然拒绝。那些讲[ShowLanguageName('latin_language')]的魔鬼分明就是路西法的仆从！"
 flavor_mfa.1006.affirmative: "和平在今天到来。"
 flavor_mfa.1006.negative: "亲人的背叛伤得最深。"
