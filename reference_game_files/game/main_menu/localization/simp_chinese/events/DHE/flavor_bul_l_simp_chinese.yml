l_simp_chinese:
 flavor_bul.1.title: "[GetCountry('KVN').GetLongNameWithNoTooltip]"
 flavor_bul.1.entry: "多布罗加公国"
 flavor_bul.1.desc: "近些年来[ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')]中央权力的持续衰弱，导致我国[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]影响力显著增加。这种情况在[ShowProvinceDefinitionName('north_dobruja_province')]和[ShowProvinceDefinitionName('south_dobruja_province')]表现得尤为明显：统治这里的[target_character.GetName]几乎已成为独立领主，掌控着当地的城堡、舰队和贸易。许多人认为我们应正式承认他们为附庸，并给予自治权以防止分裂，而另一些人则催促我们重申对这两个省份逐渐衰弱的权威。"
 flavor_bul.1.a: "承认其自治权。"
 dobrujan_revolt: "多布罗加叛乱"
 flavor_bul.1.b: "那里是国家不可分割的一部分。"
 flavor_bul.1.b.tt: "治下$KVN$核心地点的所有[pops|e]会失去[ShowNamedValue('pop_satisfaction_severe_penalty')|+=2%][pop_satisfaction|e]并加入叛乱"
 flavor_bul.1.c: "肩负起[GetCountry('KVN').GetNameWithNoTooltip]的重任。"
 flavor_bul.1.c.entry: "肩负起$KVN$的重任。"
 flavor_bul.1.historical_info: "14世纪时，保加利亚中央权力的逐渐瓦解，促成了卡尔武纳专制国的建立。它最初可能作为半独立的附庸运作，但最终实现了事实上的独立，因为它铸造自己的货币、开展外交并独立于特尔诺沃进行战争。"
 flavor_bul.2.title: "动荡的继承"
 flavor_bul.2.entry: "$flavor_bul.2.title$"
 flavor_bul.2.desc: "随着[target_ruler.GetName]日渐年迈，[target_ruler.GetHisHer]越来越担忧[ROOT.GetCountry.GetName]在自己死后的命运。[ROOT.GetCountry.GetGovernment.GetRulerTitle]十分担心一旦[target_ruler.GetSheHe]离世，[target_ruler.GetHisHer]的儿子们之间的争斗可能会让[ROOT.GetCountry.GetFlavorRank]陷入内战。为避免这种情况，有人建议将[ShowLocationName('vidin')]周边的西北部土地委托给[targer_brother.GetName]管理，同时确认[target_heir.GetName]为[ROOT.GetCountry.GetCapital.GetName]皇位的[ROOT.GetCountry.GetGovernment.GetHeirTitle]。"
 flavor_bul.2.a: "愿诸子各安其治。"
 flavor_bul.2.b: "只能有一顶王冠。"
 flavor_bul.2.c: "我们将从[ShowLocationNameWithNoTooltip('vidin')]进行统治。"
 flavor_bul.2.historical_info: "保加利亚在伊凡·亚历山大统治时期的分裂主要是由其子共治皇帝兼继承人米哈伊尔·阿森四世在与奥斯曼人的战斗中意外阵亡所致。出于对死后爆发内战的担忧，伊凡·亚历山大于是决定将沙皇头衔及维丁的统治权授予其子伊凡·斯拉齐米尔，而另一子伊凡·希什曼则继承了特尔诺沃的皇位。"
 flavor_bul.3.title: "[ROOT.GetCountry.GetNameWithNoTooltip]第二个黄金时代"
 flavor_bul.3.entry: "$flavor_bul.3.title$"
 flavor_bul.3.desc: "[target_ruler.GetName]有志于重现西美昂大帝统治时期[ROOT.GetCountry.GetName]作为学术与文化中心的辉煌。[target_ruler.GetSheHe|U]希望下令重振我们的精神和艺术遗产，资助修道院的修复工作，并向修道团体给予大笔资金支持。许多人担心这一抱负的代价将十分巨大，但[ROOT.GetCountry.GetGovernment.GetRulerTitle]相信，长远来看这将使[ROOT.GetCountry.GetFlavorRank]受益匪浅。"
 flavor_bul.3.a: "批准这些想法。"
 flavor_bul.3.b: "这将耗尽我们的国库。"
 flavor_bul.3.historical_info: "与伊凡·亚历山大统治后期国家分裂、走向衰落的局面不同，在他统治初期，保加利亚文化迎来了重大复兴，这段时期有时甚至被称作“保加利亚第二个黄金时代”。伊凡·亚历山大支持建造和修缮修道院，对宗教事务满怀兴趣，还努力强化保加利亚东正教会。保加利亚的文学活动也日益活跃，大量手稿和编年史作品都在这一时期问世。"
 flavor_bul.4.title: "沙皇伊万·亚历山大福音书"
 flavor_bul.4.entry: "$flavor_bul.4.title$"
 flavor_bul.4.desc: "我们[ROOT.GetCountry.GetGovernment.GetRulerTitle]支持[ROOT.GetCountry.GetName]文化复兴的决定已初见成效。一本献给[bul_ivan.GetName]的彩绘福音书，已由一位名为[target_artist.GetShortName]的修士在[ShowLocationName('tarnovo')]直接受[ROOT.GetCountry.GetGovernment.GetAdjective]委托创作完成。这清楚地证明，无论怎样，我们仍能创作出足以媲美[ShowLocationName('constantinople')]的艺术。"
 flavor_bul.4.a: "美轮美奂！"
 flavor_bul.4.historical_info: "《沙皇伊凡·亚历山大福音书》很可能是保加利亚第二帝国存世的最重要作品，也是所谓的“第二黄金时代”期间制作的最精美的作品之一。这部手稿包含了福音书的完整文本，并配有366幅细节丰富的细密画。"
 flavor_bul.5.title: "[ROOT.GetCountry.GetAdjectiveWithNoTooltip]‑[GetCountry('TUR').GetAdjectiveWithNoTooltip]战争"
 flavor_bul.5.entry: "保加利亚-奥斯曼战争"
 flavor_bul.5.desc_common: "我国军队在[target_location.GetName]与[GetCountry('TUR').GetAdjective]军队发生了历史上的首次交锋。"
 flavor_bul.5.desc_victory: "$flavor_bul.5.desc_common$尽管此战告捷，但我军将领中鲜有人相信这场胜利标志着斗争的终结。他们是个强大的对手，在其他地方的军事胜利让他们士气大振。若真如此，今天的战斗或许只是众多战斗中的第一场。"
 flavor_bul.5.desc_defeat: "$flavor_bul.5.desc_common$这场战斗的惨烈结局证明，我们面对的是一个纪律严明且意志坚定的敌人。若要保全我们的[ROOT.GetCountry.GetFlavorRank]，我们必须准备与这个野心不断扩张的对手进行一场漫长而艰苦的斗争。"
 flavor_bul.5.a: "我们将为即将到来的风暴做好准备。"
 flavor_bul.5.b: "主动性必须掌握在我们手中。"
 flavor_bul.5.historical_info: "保加利亚与奥斯曼的战争是保加利亚历史上的关键转折点。随着奥斯曼帝国在十四世纪向巴尔干半岛扩张，本就内部衰弱且分裂的保加利亚处在了一个崛起的大国的前线上。尽管保加利亚军队有时能抵抗奥斯曼的推进并进行了几场未分胜负的战斗，但他们最终仍败于更强大的奥斯曼军队。1396年维丁的陷落，终结了保加利亚独立的最后残余，标志着奥斯曼对保加利亚土地近五个世纪统治的开始。"
 flavor_bul.6.title: "[ROOT.GetCountry.GetGovernment.GetAdjective|U]离婚"
 flavor_bul.6.entry: "$flavor_bul.6.title$"
 flavor_bul.6.desc: "[ROOT.GetCountry.GetGovernment.GetCourtTitle]因[target_ruler.GetName]最近发布的声明而震动，他宣布希望与妻子[target_oldwife.GetName]离婚，转而迎娶一位出身低微、皈依了[ShowCultureGroupName('jewish_group')]信仰的名叫[target_newwife.GetShortName]的女子。许多人担心，这一决定只会进一步动摇[ROOT.GetCountry.GetFlavorRank]的稳定，甚至会在[ROOT.GetCountry.GetFlavorRank]的各位王子间挑起纷争，最终使继承问题愈发复杂。尽管如此，几乎无人敢挑战[ROOT.GetCountry.GetGovernment.GetRulerTitle]的意志。"
 flavor_bul.6.a: "让我们开始婚礼吧。"
 flavor_bul.6.b: "[ROOT.GetCountry.GetFlavorRank]的利益高于一切。"
 flavor_bul.6.b.entry: "国家的利益高于一切。"
 flavor_bul.6.historical_info: "伊凡·亚历山大与其新妻狄奥多拉的婚姻共育有六名子女，其中包括后来在特尔诺沃继承父位的伊凡·希什曼。据信，狄奥多拉曾极力主张由其子继承主要王位，剥夺伊凡与前妻瓦拉几亚的狄奥多拉所生的最年长且最后在世的儿子伊凡·斯拉齐米尔的继承权。这场婚姻对保加利亚分割为特尔诺沃和维丁起到了重要作用。"
 flavor_bul.7.title: "有名无实的帝国"
 flavor_bul.7.entry: "$flavor_bul.7.title$"
 flavor_bul.7.desc: "我们的统治者自豪地称自己为皇帝，然而对外国人来说，我们不是皇帝，只是披着借来的华丽外衣的国王。外国人辩称，仅[GetCountry('BYZ').GetName]和[GetUniqueInternationalOrganization('hre').GetName]的最高统治者才有资格自称皇帝。我们如何看待自己和世界如何看待我们存在分歧，这是对皇位的威胁，我们必须尽最大努力建立合法性。"
 flavor_bul.7.a: "我们得让他们承认我们！"
 flavor_bul.7.a.tt: "尽管我们在开局时是帝国，但国家等级的增益被削弱至王国等级\n有数种方式可以提高我们的合法性，从[ROOT.GetCountry.GetName]移除[ShowModifier('bul_unrecognized_imperial_title')][modifier|e]，包括：\n——解决[ShowDisasterName('twilight_of_the_tsardom')][disaster|e]，同时拥有[ShowLocationName('constantinople')]或是[great_power|e]\n——在解决[ShowDisasterName('twilight_of_the_tsardom')][disaster|e]后征服[ShowLocationName('constantinople')]\n——在解决[ShowDisasterName('twilight_of_the_tsardom')][disaster|e]后成为[great_power|e]"
 flavor_bul.7.historical_info: "1204年，保加利亚统治者卡洛扬得到了教宗依诺增爵三世派遣的教宗特使加冕。加冕期间，由于卡洛扬被授予了国王而非皇帝头衔，紧张局势加剧。根据教会的教义，仅神圣罗马帝国的统治者有资格获得皇帝头衔。卡洛扬否定这一限制，宣称自己已加冕为皇帝。因此，在保加利亚国内帝国头衔得到认可，但其合法性在国外受到质疑。"
 flavor_bul.8.title: "摇摇欲坠的帝国"
 flavor_bul.8.entry: "$flavor_bul.8.title$"
 flavor_bul.8.desc: "$twilight_of_the_tsardom.1.title$结束了，[ROOT.GetCountry.GetName]已经从几十年的内部斗争中恢复过来。然而，对于[GetCountry('BYZ').GetName]来说情况却并非如此，他们已经支离破碎，无比脆弱。当前的形势正是我们出击的良机，我们不能等待帝国从创伤中恢复，让这绝佳的机会从手中溜走。"
 flavor_bul.8.a: "现在正是出击的时刻！"
 flavor_bul.8.b: "我们还没准备好。"
 flavor_bul.9.title: "公认的列强"
 flavor_bul.9.entry: "$flavor_bul.9.title$"
 flavor_bul.9.desc: "[ROOT.GetCountry.GetAdjective]$rank_empire_bulgarian$已崛起为世界列强。如今，我们国家在许多方面已能与[ROOT.GetCountry.GetAdjectiveWithNoTooltip]第一帝国媲美，甚至超越它。我们再也无需与外国怀疑者争辩我们的合法性。我们的力量不言自明，世界也认可了这一点。"
 flavor_bul.9.a: "$rank_empire_bulgarian$万岁！"
 flavor_bul.1000.title: "新帝国的黎明"
 flavor_bul.1000.entry: "$flavor_bul.1000.title$"
 flavor_bul.1000.desc: "终于，[ShowLocationName('constantinople')]的城墙在[ROOT.GetCountry.GetName]的力量前倒塌。这座曾经的宏伟城市如今将开启一个新时代，不同于过去几个世纪——那几个世纪只给[ShowReligionAdjective('orthodox')]世界带来衰落、屈辱与软弱。凤凰已化为灰烬，从今日起，[target_ruler.GetName]将被铭记为$STATIC_MODIFIER_NAME_bul_conqueror_of_constantinople$。"
 flavor_bul.1000.a: "宣告新帝国的诞生！"
 flavor_bul.1000.a.tt: "所有与我们不是[alliance|e]、也不是我们[subject|e]的相邻[countries|e]，以及我们的所有[rivals|e]，对我们的[opinion|e]会提高[ShowBiasValue('opinion_bul_proclaimed_an_empire')|+=]。"
 flavor_bul.1000.b: "我们的胜利无需宏大的头衔。"
 flavor_bul.1001.title: "皇帝之城"
 flavor_bul.1001.desc: "我们崛起为帝国，改变了[ROOT.GetCountry.GetName]在世界的地位。凭借新得的威望，[ROOT.GetCountry.GetGovernment.GetCourtTitle]中许多人开始质疑[ROOT.GetCountry.GetCapital.GetName]是否真正反映了[ROOT.GetCountry.GetLongNameWithNoTooltip]的荣耀与权威。他们建议将首都迁至[ShowLocationName('constantinople')]——几个世纪以来[ShowReligionAdjective('orthodox')]世界的政治与宗教中心。"
 flavor_bul.1001.a: "我们需要一座配得上帝国的首都！"
 flavor_bul.1001.b: "[ROOT.GetCountry.GetCapital.GetNameWithNoTooltip]已经很好了。"
 flavor_bul.1001.b.entry: "现在的首都对我们很合适。"
 flavor_bul.1001.historical_info: "历史上，许多势力都觊觎过君士坦丁堡，保加利亚也不例外。几个世纪里，多位保加利亚君主都试图将这座伟大的城市纳入自己的统治范围，却都未能如愿。其中最引人注目的努力发生在西美昂大帝统治时期。尽管该城本身未被征服，但战争仍以拜占庭的深刻耻辱告终。帝国被迫承认西美昂的皇帝级头衔沙皇，从而实质上使保加利亚成为巴尔干地区的大国。"
