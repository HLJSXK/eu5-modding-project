l_simp_chinese:
 flavor_bul.1.title: "[GetCountry('KVN').GetLongNameWithNoTooltip]"
 flavor_bul.1.entry: "多布罗加公国"
 flavor_bul.1.desc: "近些年来[ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')]中央权力的持续衰弱，导致我国[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]影响力显著增加。这种情况在[ShowProvinceDefinitionName('north_dobruja_province')]和[ShowProvinceDefinitionName('south_dobruja_province')]表现得尤为明显：统治这里的[target_character.GetName]几乎已成为独立领主，掌控着当地的城堡、舰队和贸易。许多人认为我们应正式承认他们为附庸，并给予自治权以防止分裂，而另一些人则催促我们重申对这两个省份逐渐衰弱的权威。"
 flavor_bul.1.a: "承认其自治权。"
 dobrujan_revolt: "多布罗加叛乱"
 flavor_bul.1.b: "那里是国家不可分割的一部分。"
 flavor_bul.1.b.tt: "治下$KVN$核心地点的所有[pops|e]会失去[ShowNamedValue('pop_satisfaction_severe_penalty')|+=2%][pop_satisfaction|e]并加入叛乱"
 flavor_bul.1.c: "肩负起[GetCountry('KVN').GetNameWithNoTooltip]的重任。"
 flavor_bul.1.c.entry: "肩负起$KVN$的重任。"
 flavor_bul.1.historical_info: "14世纪时，保加利亚中央权力的逐渐瓦解，促成了卡尔武纳专制国的建立。它最初可能作为半独立的附庸运作，但最终实现了事实上的独立，因为它铸造自己的货币、开展外交并独立于特尔诺沃进行战争。"
 flavor_bul.2.title: "动荡的继承"
 flavor_bul.2.entry: "$flavor_bul.2.title$"
 flavor_bul.2.desc: "随着[target_ruler.GetName]日渐年迈，[target_ruler.GetHisHer]越来越担忧[ROOT.GetCountry.GetName]在自己死后的命运。[ROOT.GetCountry.GetGovernment.GetRulerTitle]十分担心一旦[target_ruler.GetSheHe]离世，[target_ruler.GetHisHer]的儿子们之间的争斗可能会让[ROOT.GetCountry.GetFlavorRank]陷入内战。为避免这种情况，有人建议将[ShowLocationName('vidin')]周边的西北部土地委托给[targer_brother.GetName]管理，同时确认[target_heir.GetName]为[ROOT.GetCountry.GetCapital.GetName]皇位的[ROOT.GetCountry.GetGovernment.GetHeirTitle]。"
 flavor_bul.2.a: "愿诸子各安其治。"
 flavor_bul.2.b: "只能有一顶王冠。"
 flavor_bul.2.c: "我们将从[ShowLocationNameWithNoTooltip('vidin')]进行统治。"
 flavor_bul.2.historical_info: "The fragmentation of Bulgaria during the reign of Ivan Alexander was primarily caused by the unexpected death of his son, co-emperor, and successor Michael Asen IV, who perished in a battle against the Ottomans. Likely fearing a civil war after his death, Ivan Alexander decided to grant the title of Tsar and the rule over Vidin to his son Ivan Sratsimir, while his other son Ivan Shishman inherited the throne in Tarnovo."
 flavor_bul.3.title: "[ROOT.GetCountry.GetNameWithNoTooltip]第二个黄金时代"
 flavor_bul.3.entry: "$flavor_bul.3.title$"
 flavor_bul.3.desc: "[target_ruler.GetName]有志于重现西美昂大帝统治时期[ROOT.GetCountry.GetName]作为学术与文化中心的辉煌。[target_ruler.GetSheHe|U]希望下令重振我们的精神和艺术遗产，资助修道院的修复工作，并向修道团体给予大笔资金支持。许多人担心这一抱负的代价将十分巨大，但[ROOT.GetCountry.GetGovernment.GetRulerTitle]相信，长远来看这将使[ROOT.GetCountry.GetFlavorRank]受益匪浅。"
 flavor_bul.3.a: "批准这些想法。"
 flavor_bul.3.b: "这将耗尽我们的国库。"
 flavor_bul.3.historical_info: "与伊凡·亚历山大统治后期国家分裂、走向衰落的局面不同，在他统治初期，保加利亚文化迎来了重大复兴，这段时期有时甚至被称作“保加利亚第二个黄金时代”。伊凡·亚历山大支持建造和修缮修道院，对宗教事务满怀兴趣，还努力强化保加利亚东正教会。保加利亚的文学活动也日益活跃，大量手稿和编年史作品都在这一时期问世。"
 flavor_bul.4.title: "沙皇伊万·亚历山大福音书"
 flavor_bul.4.entry: "$flavor_bul.4.title$"
 flavor_bul.4.desc: "The decision of our [ROOT.GetCountry.GetGovernment.GetRulerTitle] to support the cultural revival of [ROOT.GetCountry.GetName] is already bearing fruit. An illuminated Gospel book, dedicated to [bul_ivan.GetName], was created in [ShowLocationName('tarnovo')] by a monk called [target_artist.GetShortName] under direct [ROOT.GetCountry.GetGovernment.GetAdjective] commission. It is a clear proof that despite everything, we are still able to produce art worthy of comparison with [ShowLocationName('constantinople')] itself."
 flavor_bul.4.a: "美轮美奂！"
 flavor_bul.4.historical_info: "《沙皇伊凡·亚历山大福音书》很可能是保加利亚第二帝国存世的最重要作品，也是所谓的“第二黄金时代”期间制作的最精美的作品之一。这部手稿包含了福音书的完整文本，并配有366幅细节丰富的细密画。"
 flavor_bul.5.title: "[ROOT.GetCountry.GetAdjectiveWithNoTooltip]‑[GetCountry('TUR').GetAdjectiveWithNoTooltip]战争"
 flavor_bul.5.entry: "保加利亚-奥斯曼战争"
 flavor_bul.5.desc_common: "我国军队在[target_location.GetName]与[GetCountry('TUR').GetAdjective]军队发生了历史上的首次交锋。"
 flavor_bul.5.desc_victory: "$flavor_bul.5.desc_common$尽管此战告捷，但我军将领中鲜有人相信这场胜利标志着斗争的终结。他们是个强大的对手，在其他地方的军事胜利让他们士气大振。若真如此，今天的战斗或许只是众多战斗中的第一场。"
 flavor_bul.5.desc_defeat: "$flavor_bul.5.desc_common$这场战斗的惨烈结局证明，我们面对的是一个纪律严明且意志坚定的敌人。若要保全我们的[ROOT.GetCountry.GetFlavorRank]，我们必须准备与这个野心不断扩张的对手进行一场漫长而艰苦的斗争。"
 flavor_bul.5.a: "我们将为即将到来的风暴做好准备。"
 flavor_bul.5.b: "主动性必须掌握在我们手中。"
 flavor_bul.5.historical_info: "The Bulgarian-Ottoman Wars marked a turning point in the history of Bulgaria. As the Ottomans expanded into the Balkans during the fourteenth century, Bulgaria, already internally weakened and fragmented, found itself on the front line of a rising great power. Though Bulgarian forces were at times able to resist the Ottoman advance and fought several indecisive battles, they eventually fell to the superior Ottoman armies. The fall of Vidin in 1396 brought the last remnants of Bulgarian independence to an end and marked the beginning of nearly half a millennium of Ottoman rule over Bulgarian lands."
 flavor_bul.6.title: "[ROOT.GetCountry.GetGovernment.GetAdjective|U]离婚"
 flavor_bul.6.entry: "$flavor_bul.6.title$"
 flavor_bul.6.desc: "[ROOT.GetCountry.GetGovernment.GetCourtTitle]因[target_ruler.GetName]最近发布的声明而震动，他宣布希望与妻子[target_oldwife.GetName]离婚，转而迎娶一位出身低微、皈依了[ShowCultureGroupName('jewish_group')]信仰的名叫[target_newwife.GetShortName]的女子。许多人担心，这一决定只会进一步动摇[ROOT.GetCountry.GetFlavorRank]的稳定，甚至会在[ROOT.GetCountry.GetFlavorRank]的各位王子间挑起纷争，最终使继承问题愈发复杂。尽管如此，几乎无人敢挑战[ROOT.GetCountry.GetGovernment.GetRulerTitle]的意志。"
 flavor_bul.6.a: "让我们开始婚礼吧。"
 flavor_bul.6.b: "[ROOT.GetCountry.GetFlavorRank]的利益高于一切。"
 flavor_bul.6.b.entry: "国家的利益高于一切。"
 flavor_bul.6.historical_info: "The marriage between Ivan Alexander and his new wife Sara-Theodora produced six children, among them Ivan Shishman, who succeeded his father as ruler in Tarnovo. Sara-Theodora is believed to have strongly advocated for her son to inherit the principal throne, effectively disinheriting Ivan Sratsimir, who was the eldest child and the last surviving son of Ivan's former wife, Theodora of Wallachia. This marriage played a major role in the partition of Bulgaria between Tarnovo and Vidin."
 flavor_bul.7.title: "Empire Only in Name"
 flavor_bul.7.entry: "$flavor_bul.7.title$"
 flavor_bul.7.desc: "Our rulers proudly bear the title of Emperor, although to foreigners, we are no emperors — merely kings cloaked in borrowed grandeur. Foreigners argue that the title is reserved solely for the Emperors of [GetCountry('BYZ').GetName] and of the [GetUniqueInternationalOrganization('hre').GetName]. The divide between how we see ourselves and how the world sees us is a threat to the throne, and we must do our best to establish our legitimacy."
 flavor_bul.7.a: "We shall make them recognize us!"
 flavor_bul.7.a.tt: "Although we start as an Empire, the bonuses of our government rank are reduced to that of a Kingdom\nThere are several ways to legitimize ourselves and remove the [ShowModifier('bul_unrecognized_imperial_title')] [modifier|e] from [ROOT.GetCountry.GetName], namely:\n- Resolving the [ShowDisasterName('twilight_of_the_tsardom')] [disaster|e] while owning [ShowLocationName('constantinople')] or being a [great_power|e]\n- Conquering [ShowLocationName('constantinople')] after the [ShowDisasterName('twilight_of_the_tsardom')] [disaster|e] has been resolved\n- Becoming a [great_power|e] after the [ShowDisasterName('twilight_of_the_tsardom')] [disaster|e] has been resolved"
 flavor_bul.7.historical_info: "In 1204, Bulgarian ruler Kaloyan was crowned by a Papal envoy sent by Pope Innocent III. Tensions rose during the coronation as Kaloyan was given the title of king, not emperor. According to the doctrine of the Church, the imperial title was reserved solely for the ruler of the Holy Roman Empire. Kaloyan rejected this limitation and asserted that he had been crowned as emperor. Thus, while the Bulgarian imperial title was acknowledged at home, its legitimacy was questioned abroad."
 flavor_bul.8.title: "A Crumbling Empire"
 flavor_bul.8.entry: "$flavor_bul.8.title$"
 flavor_bul.8.desc: "The $twilight_of_the_tsardom.1.title$ has ended, and [ROOT.GetCountry.GetName] has recovered from decades of internal struggle. The same, however, cannot be said about [GetCountry('BYZ').GetName], which stand fractured and vulnerable. The events currently unfolding present us with a unique opportunity to strike before the empire recovers from its wounds and the moment slips from our grasp."
 flavor_bul.8.a: "Now is the time to strike!"
 flavor_bul.8.b: "时机尚未成熟。"
 flavor_bul.9.title: "A Recognized Great Power"
 flavor_bul.9.entry: "$flavor_bul.9.title$"
 flavor_bul.9.desc: "The [ROOT.GetCountry.GetAdjective] $rank_empire_bulgarian$ has risen to stand among the great powers of the world. In many ways, this moment echoes the glory of the First [ROOT.GetCountry.GetAdjectiveWithNoTooltip] Empire, and perhaps even surpasses it. No longer must we justify our claims or assert our legitimacy before foreign skeptics. Our power speaks for itself, and the world now recognizes it."
 flavor_bul.9.a: "Long live the $rank_empire_bulgarian$!"
 flavor_bul.1000.title: "[ShowLocationNameWithNoTooltip('constantinople')]的陷落"
 flavor_bul.1000.entry: "$flavor_bul.1000.title$"
 flavor_bul.1000.desc: "At long last, the walls of [ShowLocationName('constantinople')] have fallen before the might of [ROOT.GetCountry.GetName]. The once-mighty city shall now enter a new era unlike the centuries that came before, which brought only decline, humiliation, and weakness upon the [ShowReligionAdjective('orthodox')] world. The Phoenix has been permanently reduced to ashes, and from this day onward, [target_ruler.GetName] shall be remembered as the $STATIC_MODIFIER_NAME_bul_conqueror_of_constantinople$. Never again shall the legitimacy of our imperial title be questioned!"
 flavor_bul.1000.a: "宣告新帝国的诞生！"
 flavor_bul.1000.a.tt: "All neighboring [countries|e] that do not have an [alliance|e] with us or are not our [subject|e] countries, as well as each of our [rivals|e], will gain [ShowBiasValue('opinion_bul_proclaimed_an_empire')|+=] [opinion|e] of us."
 flavor_bul.1000.b: "我们的胜利无需宏大的头衔。"
 flavor_bul.1001.title: "皇帝之城"
 flavor_bul.1001.desc: "我们崛起为帝国，改变了[ROOT.GetCountry.GetName]在世界的地位。凭借新得的威望，[ROOT.GetCountry.GetGovernment.GetCourtTitle]中许多人开始质疑[ROOT.GetCountry.GetCapital.GetName]是否真正反映了[ROOT.GetCountry.GetLongNameWithNoTooltip]的荣耀与权威。他们建议将首都迁至[ShowLocationName('constantinople')]——几个世纪以来[ShowReligionAdjective('orthodox')]世界的政治与宗教中心。"
 flavor_bul.1001.a: "我们需要一座配得上帝国的首都！"
 flavor_bul.1001.b: "[ROOT.GetCountry.GetCapital.GetNameWithNoTooltip]已经很好了。"
 flavor_bul.1001.b.entry: "现在的首都对我们很合适。"
 flavor_bul.1001.historical_info: "Historically, many powers coveted Constantinople, and Bulgaria was no exception. Over the centuries, several Bulgarian rulers attempted to bring the great city under their control, yet none succeeded. The most notable effort came during the reign of Simeon the Great. Though the city itself remained unconquered, the war nevertheless ended in a profound Byzantine humiliation. The empire was compelled to recognize Simeon's imperial title, acknowledging him as Tsar and effectively elevating Bulgaria to the rank of a great power in the Balkans."
