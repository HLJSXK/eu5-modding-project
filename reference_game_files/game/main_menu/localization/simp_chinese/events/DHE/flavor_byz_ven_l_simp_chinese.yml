l_simp_chinese:
 flavor_byz_ven.1.title: "极端困境"
 flavor_byz_ven.1.entry: "$flavor_byz_ven.1.title$"
 flavor_byz_ven.1.desc: "[ShowDisasterName('byzantine_succession_crisis')]之下，我们的国库正在枯竭，随着冲突继续，我们的地位越来越难以维持。如果我们的内部动荡持续下去，[origin_country.GetLongName]的存在将受到威胁。\n\n在这种极端的困境中，一个曾经无法置信的想法浮现——以[target_woa.GetName]为抵押，向一个商业共和国借取贷款。"
 flavor_byz_ven.1.a: "危急时刻需要非常措施。"
 flavor_byz_ven.1.b: "简直荒谬。"
 BYZ_crown_jewels_tt: "如果[THIS.GetCountry.GetName]接受，他们会向我们[loan|e][SCOPE.GetLocalVariable('loan_size').GetValue|+=][gold_i|e]，我们会获得[ShowModifier('BYZ_lacking_jewels')]，直到[work_of_art|e][target_woa.GetName]被归还"
 flavor_byz_ven.2.title: "抵押[origin_country.GetAdjectiveWithNoTooltip]皇冠宝石"
 flavor_byz_ven.2.entry: "抵押$BYZ_ADJ$皇冠御宝"
 flavor_byz_ven.2.desc: "[origin_country.GetLongName]正处于最严峻的困境中。由于经历[ShowDisasterName('byzantine_succession_crisis')]，他们的战争金库迅速见底，迫切需要额外的资金。事实上，他们的处境是如此糟糕，以至于向我们提出了一项令人无比惊讶的提议：以[target_woa.GetName]为抵押贷款。这被一些人视为对我们的信任……也被一些人视为他们的绝望。"
 flavor_byz_ven.2.a: "它将成为我们收藏中的瑰宝。"
 flavor_byz_ven.2.b: "让邪恶的[origin_country.GetFlavorRank]就此灭亡。"
 flavor_byz_ven.2.b.entry: "让邪恶的国家就此灭亡。"
 pawning_of_crown_jewels: "抵押皇冠宝石"
 LOAN_SHORT_NAME_pawning_of_crown_jewels_L: "$pawning_of_crown_jewels$"
 LOAN_SHORT_NAME_pawning_of_crown_jewels_B: "$pawning_of_crown_jewels$"
 LOAN_TOOLTIP_pawning_of_crown_jewels: "双方已达成协议，借款方以$byzantine_crown_jewels$为抵押，向贷款方借取贷款。当贷款偿清时，抵押的宝石也应当被归还——至少理论上如此。"
 LOAN_TITLE_pawning_of_crown_jewels: "$pawning_of_crown_jewels$"
 LOAN_NAME_pawning_of_crown_jewels_L: "$pawning_of_crown_jewels$"
 LOAN_NAME_pawning_of_crown_jewels_B: "$pawning_of_crown_jewels$"
 flavor_byz_ven.3.title: "偿清贷款"
 flavor_byz_ven.3.entry: "$flavor_byz_ven.3.title$"
 flavor_byz_ven.3.desc: "[origin_country.GetLongName]刚刚偿清了欠我们的贷款，现在要求我们归还[target_woa.GetName]。根据协议，我们必须归还，但这样做会让我们失去对他们的影响力。\n\n当然，即使我们不归还宝石，也不会发生什么大事……"
 flavor_byz_ven.3.a: "我们可不能赌上自己的信誉。"
 flavor_byz_ven.3.b: "我们有何理由不保留它呢？"
 flavor_byz_ven.4.title: "归还皇冠宝石"
 flavor_byz_ven.4.desc: "根据协议，我们已偿清了欠[target_country.GetLongName]的贷款，随后[target_woa.GetName]被送还到了[origin_country.GetAdjective]的[target_location.GetName]。\n\n真高兴能与最尊贵的[ShowGovernmentReformName('merchant_republic')]做生意。"
 flavor_byz_ven.4.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 flavor_byz_ven.4.a.entry: "$common_string_brilliant$"
 flavor_byz_ven.5.title: "撕毁协议"
 flavor_byz_ven.5.desc: "尽管我们按照协议偿清了贷款，但[target_country.GetAdjective]一方无视了我们归还[target_woa.GetName]的要求。只有一个词能解释这件事——重大盗窃！\n\n他们将面临[origin_country.GetLongName]的愤怒……"
 flavor_byz_ven.5.a: "就不该与魔鬼做交易。"
 flavor_byz_ven.6.title: "$flavor_byz_ven.4.title$"
 flavor_byz_ven.6.desc: "[target_army.GetName]终于将[target_woa.GetName]归还我方。这批珍宝已送回[target.GetName]，并受到[ROOT.GetCountry.GetGovernment.GetCourtTitle]的热烈迎接。敌人再也无法利用这些珍宝要挟我们了！"
 flavor_byz_ven.6.desc_recovered: "随着[target.GetName]重归版图，[target_woa.GetName]再度回到我们手中。这份本就属于我们的财产重返首都，受到[ROOT.GetCountry.GetGovernment.GetCourtTitle]的欣然接纳。敌人再也无法利用这些珍宝，对我们施加胁迫！"
 flavor_byz_ven.6.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 flavor_byz_ven.6.a.entry: "$common_string_brilliant$"
 flavor_byz_ven.7.title: "[target_woa.GetNameWithNoTooltip]"
 flavor_byz_ven.7.desc: "[ROOT.GetCountry.GetName]近期成功夺取[location.GetName]，取得了巨大胜利。我们的[target_army.GetName]对该地区进行了全面“清查”，并缴获了[target_woa.GetName]。这对我们的[origin_country.GetName]盟友而言是重要资产。我们可以将其归还……但难道，我方不配将其作为战利品收入囊中吗？"
 flavor_byz_ven.7.a: "我们应将珍宝归还亲爱的盟友。"
 flavor_byz_ven.7.b: "凭“战功”所得，本就应为我们所有！"
 flavor_byz_ven.8.title: "宝石被盗！"
 flavor_byz_ven.8.desc: "有消息传来，我们的债权人实在无能至极！他们以珍贵的[target_woa.GetName]作为抵押向我方出借黄金，如今竟让这批珍宝在眼皮底下失窃。我们衷心希望他们能寻回宝物。如若不然，我们得亲自从[target.GetName]手中夺回……"
 flavor_byz_ven.8.a: "除了囤积黄金，他们还能办成什么事？"
 byz_woa_was_moved: "[target_woa.GetName]移动至[target.GetName]"
 flavor_byz_ven.9.title: "交易达成"
 flavor_byz_ven.9.entry: "$flavor_byz_ven.9.title$"
 flavor_byz_ven.9.desc: "我方使节从[target_country.GetName]归来，带来了振奋人心的消息：[target_country.GetAdjective]商人应允了我们的提议。以[target_woa.GetName]为条件，对方向我们提供了一笔贷款，为拮据的国库争取到了急需的喘息之机。我们务必好好利用这段缓冲期。"
 flavor_byz_ven.9.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 flavor_byz_ven.9.a.entry: "$common_string_brilliant$"
 flavor_byz_ven.10.title: "最尊贵共和国回绝交易"
 flavor_byz_ven.10.entry: "$flavor_byz_ven.10.title$"
 flavor_byz_ven.10.desc: "我方使节空手而归。[target_country.GetLongName]拒绝了我们的提议，即便以[target_woa.GetName]作为抵押，也不愿提供贷款。这份羞辱带来的刺痛，几乎不亚于财政遭受的打击。我们必须另寻出路，渡过此次危机。"
 flavor_byz_ven.10.a: "就这样吧。"
 flavor_byz_ven.11.title: "失去抵押品"
 flavor_byz_ven.11.entry: "$flavor_byz_ven.11.title$"
 flavor_byz_ven.11.desc: "我国国库已毁于一旦。在这场财政崩溃中，我方对[origin_country.GetLongName]发放的、以[target_woa.GetName]为担保的抵押贷款亦随之失效。契约既已作废，珠宝理应归还[origin_country.GetAdjectiveWithNoTooltip]之手，而我们原本希望借此施加的影响力也随之付诸东流。"
 flavor_byz_ven.11.a: "艰苦岁月中的惨痛失败。"
 flavor_byz_ven.12.title: "威尼斯的倾覆"
 flavor_byz_ven.12.entry: "$flavor_byz_ven.12.title$"
 flavor_byz_ven.12.desc: "消息自潟湖之滨传入[ROOT.GetCountry.GetGovernment.GetCourtTitle]。[target_country.GetLongName]已宣告破产，债主们正步步逼近这座“最尊贵共和国”仅存的财富。在混乱之中，[target_country.GetNameWithNoTooltip]持有的我方贷款抵押品[target_woa.GetName]，已悄然归还至我们手中。契约就此作废，珍宝终复归原主。"
 flavor_byz_ven.12.a: "天命庇佑，使我们免遭此等羞辱。"
 flavor_byz_ven.13.title: "违约与没收"
 flavor_byz_ven.13.entry: "$flavor_byz_ven.13.title$"
 flavor_byz_ven.13.desc: "我国国库空虚，债务已无力偿还。我们以[target_woa.GetName]作为抵押向[target_country.GetLongName]借取的贷款出现违约。依照协议条款，珠宝将被[target_country.GetNameWithNoTooltip]没收，而我方蒙羞的消息也迅速传遍了基督教各国的宫廷。"
 flavor_byz_ven.13.a: "我们的荣光与国库一同坠入深渊。"
 flavor_byz_ven.14.title: "债务人违约"
 flavor_byz_ven.14.entry: "$flavor_byz_ven.14.title$"
 flavor_byz_ven.14.desc: "[ROOT.GetCountry.GetGovernment.GetCourtTitle]从[origin_country.GetLongName]处获悉一则令人不安的消息：该国已单方面违约，其国库亦陷入瘫痪。我方发放的以[target_woa.GetName]为抵押的贷款将无法收回。不过，根据协议条款，该抵押物理应归属我方——如今，它将作为我们审慎决策的回报，为“最尊贵共和国”增添荣光。"
 flavor_byz_ven.14.a: "失之东隅，收之桑榆。"
 flavor_byz_ven.15.title: "对抗[GetCountry('GEN').GetAdjectiveWithNoTooltip]威胁的良机"
 flavor_byz_ven.15.entry: "对抗热那亚威胁的良机"
 flavor_byz_ven.15.desc: "[GetCountry('GEN').GetAdjective]强行夺取了[GetCountry('BYZ').GetLongName]的[ShowLocationName('chios')]及其邻近岛屿，令潟湖之城的商人们深感忧虑。伟大的[ROOT.GetCountry.GetFlavorRank]绝不能容忍[GetCountry('GEN').GetAdjectiveWithNoTooltip]在[ShowAreaName('aegean_sea_area')]确立支配地位，而饱受创伤的[GetCountry('BYZ').GetAdjectiveWithNoTooltip]政权，恰恰是我们最天然的盟友。\n\n我们是否应当向[GetCountry('BYZ').GetAdjectiveWithNoTooltip][GetCountry('BYZ').GetGovernment.GetCourtTitle]伸出友谊之手？"
 flavor_byz_ven.15.a: "派遣使节，提议缔结盟约。"
 flavor_byz_ven.15.b: "我们将独自追求我们的利益。"
 flavor_byz_ven.16.title: "[GetCountry('VEN').GetAdjectiveWithNoTooltip]的提议"
 flavor_byz_ven.16.entry: "威尼斯的提议"
 flavor_byz_ven.16.desc: "[GetCountry('VEN').GetLongName]的使者来到我方[ROOT.GetCountry.GetGovernment.GetCourtTitle]，带来了一项极受欢迎的提议——与我国共同签署针对[GetCountry('GEN').GetLongName]的联合谅解。自该国夺取[ShowLocationName('chios')]以来，其商船舰队在[ShowAreaName('aegean_sea_area')]的活动日益猖獗，气焰嚣张。\n\n尽管我方与[GetCountry('VEN').GetNameWithNoTooltip]近期的交往并非总是融洽，但在共同遏制[GetCountry('GEN').GetAdjectiveWithNoTooltip]野心这一点上，我们却达成了难得的利益共识。"
 flavor_byz_ven.16.a: "强敌之前，旧日宿敌化为得力盟友。"
 flavor_byz_ven.16.b: "这些拉丁人没有一个值得信任。"
