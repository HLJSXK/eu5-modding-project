l_simp_chinese:
 flavor_tre.1.title: "[target_location.GetNameWithNoTooltip]要塞"
 flavor_tre.1.entry: "特拉比松要塞"
 flavor_tre.1.desc: "屹立数世纪的[target_location.GetName]是[ShowRegionName('anatolia_region')]腹地王权的象征。作为文化传统的灯塔，这座伟大而古老的[target_location.GetRank.GetName]凭借壮丽海港与优越地理位置繁荣发展。\n\n拥有商业区、市场与引水渠等城市设施，它已成为我们权威的象征、骄傲的瑰宝。近期人口增长表明有必要扩建[target_location.GetRank.GetNameWithNoTooltip]城墙，以容纳更多住户。"
 flavor_tre.1.historical_info: "特拉比松始建于公元前756年，作为基督教文化与希腊文明的重要堡垒而屹立千年。在罗马帝国统治时期，这座城市便成为本都·波勒摩尼亚库斯军团的战略要地。至查士丁尼大帝时代，更发展为亚美尼亚远征军的核心集结地。\n\n公元8世纪，特拉比松晋升为大主教区；10世纪初年，更成为都主教驻地。1204年，阿莱克修斯·梅加斯科穆宁与大卫·科穆宁在此建立特拉比松帝国。凭借本都山脉的天然屏障、固若金汤的城防体系及精妙的政治联姻，这个帝国顽强存续至1461年。尽管1438年时小城内居民仅约4000人，却拥有圣索菲亚修道院与金首圣母主教座堂等璀璨建筑瑰宝，最终成为拜占庭诸残余政权中最后陷落的战略据点，具备文化和历史重要意义。"
 flavor_tre.1.a: "资助扩建工程！"
 flavor_tre.1.b: "让他们在城墙外自生自灭……"
 flavor_tre.2.title: "斯科拉里奥伊的叛乱"
 flavor_tre.2.entry: "$flavor_tre.2.title$"
 flavor_tre.2.desc: "由于中央权威的衰落和贪欲的不断膨胀，众多地方贵族民兵成员已控制了[target_location.GetName]政坛的大片区域。他们向来热衷于攫取新官职、特权及丰厚地产，但如今不少[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]成员的行为已逾越界限……倘若我们不立即采取果断措施，他们的腐败行径很可能将整个国家拖入内战的深渊！"
 flavor_tre.2.a: "勒住这些疯狗！"
 flavor_tre.2.b: "[ROOT.GetCountry.Custom('common_string_nothing_we_can_do')]"
 flavor_tre.2.b.entry: "$common_string_nothing_we_can_do_about_it$"
 flavor_tre.2.historical_info: "斯科拉里奥伊是特拉布宗帝国最具影响力的#italic 权贵#!家族之一。最初以皇家民兵部队的形式组建，负责城防事务，但很快蜕变为腐败的政治集团。1340年，他们公然挑战女皇伊琳娜的统治权威，不仅阻挠其登基，更引发全国性内战。与此同时，土库曼部落持续袭扰帝国南部边境。最终，外敌乘虚攻入都城，纵火劫掠，堆积如山的腐烂尸体引发瘟疫，恶臭弥漫全城，酿成惨剧。"
 flavor_tre.3.title: "[target_character1.GetNameWithNoTooltip]毒杀案"
 flavor_tre.3.entry: "巴西尔·梅加斯科穆宁毒杀案"
 flavor_tre.3.desc: "在妒恨交织的情绪驱使下，[target_character2.GetName]向[target_character1.GetShortName]投下了致命的毒药。这场悲剧的导火索，源于[target_character1.GetShortNameWithNoTooltip]长期对[target_character2.GetHerHim]的冷漠相待，以及他那数不清的情妇……"
 flavor_tre.3.a: "爱情与战争皆可不择手段。"
 flavor_tre.3.b: "我们绝不姑息！"
 flavor_tre.3.historical_info: "伊琳娜与巴西尔的联姻本质上是科穆宁家族与拜占庭皇帝结盟的政治工具。作为安德罗尼卡三世的私生女，伊琳娜未能诞下子嗣，而巴西尔则长期沉迷于宫廷情妇。这段充满矛盾的皇室婚姻最终以巴西尔被暗杀告终，由此开启了特拉比松帝国动荡的伊琳娜统治时期。"
 flavor_tre.4.title: "[target_character_2.GetNameWithNoTooltip]的遗产"
 flavor_tre.4.entry: "阿莱克修斯二世的遗产"
 flavor_tre.4.desc: "[target_character_1.GetName]的统治标志着[ROOT.GetCountry.GetFlavorRank]伟大时代的延续。新任[ROOT.GetCountry.GetGovernment.GetRulerTitle]从[target_character_2.GetName]手中继承王位后，如今必须在由王朝传统、地方贵族以及[ShowAreaName('black_sea_area')]外国势力所塑造的政治格局中施政。\n\n这段统治将如何被铭记，不仅取决于未来的所作所为，也取决于他能在多大程度上坚守或重塑其前任留下的遗产。"
 flavor_TRE_4_historical_info: "阿莱克修斯二世·梅加斯·科穆宁是特拉比松帝国在位时间最长的皇帝之一。在其统治时期，帝国主要依靠外交、贸易和家族延续，而非领土扩张。他的去世成为了转折点：尽管统治家族权威仍在，但宫廷各派系与外国商人之间的微妙平衡已经变得脆弱。"
 flavor_tre.4.a: "安息吧，伟大的[ROOT.GetCountry.GetGovernment.GetRulerTitle]……"
 flavor_tre.4.a.entry: "安息吧，伟大的统治者……"
 flavor_tre.5.title: "樱桃的故乡"
 flavor_tre.5.entry: "$flavor_tre.5.title$"
 flavor_tre.5.desc: "一直以来，[target_location.GetRank.GetName][ShowLocationName('giresun')]作为[ShowAreaName('black_sea_area')]南岸一个规模不大却颇为重要的港口，将[ROOT.GetCountry.GetAdjective]山区的内陆路线与海上贸易连接起来，如果得到妥善扶持，将带来发展的机遇。\n\n无论是通过直接投资还是良好治理，[target_location.GetNameWithNoTooltip]的未来都将影响当地繁荣以及[ROOT.GetCountry.GetNameWithNoTooltip]更广泛的商业地位。"
 flavor_TRE_5_historical_info: "凯拉苏斯，即今天的吉雷松，是本都地区一个历史悠久的定居点，作为沿海港口具有很大战略价值。对于特拉比松帝国而言，这类城镇是进入黑海商贸的通道，同时充当着山区经济与国际商业网络之间的中介。据说，它的名字#italic 凯拉苏斯#!日后被用于指代一种当地的甜美果实——樱桃。"
 flavor_tre.5.a: "一项明智的投资。"
 flavor_tre.5.b: "任其自然繁荣发展吧。"
 flavor_tre.6.title: "[ShowCultureGroupNameWithNoTooltip('italian_group')]商人日益增长的影响"
 flavor_tre.6.entry: "拉丁商人日益增长的影响"
 flavor_tre.6.desc: "来自[GetCountry('VEN').GetName]和[GetCountry('GEN').GetName]的[ShowCultureGroupName('italian_group')]商人在我国港口长期享有广泛特权，这些豁免资格通过条约和共同需求得以保障。他们的船只带来财富与货物，但其自治权日益引发本地[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]和官员的批评。\n\n开征新税可以充实国库并彰显主权，但此举可能导致与那些影响力远超[ShowAreaName('black_sea_area')]的强大海洋共和国的外交冲突，且会破坏已实施数十年的贸易协议。"
 flavor_tre.6.a: "征收新税。"
 flavor_tre.6.b: "不要激怒他们。"
 flavor_tre.7.title: "阿斯普龙"
 flavor_tre.7.entry: "$flavor_tre.7.title$"
 flavor_tre.7.desc: "从[ShowLocationName('gumushane')]周边地区开采出的[ShowGoodsName('silver')]带来的不只是物质财富。事实上，它们支撑着人们对货币和[ROOT.GetCountry.GetGovernment.GetRulerTitle]的权威的信心。通过在该[target_location.GetRank.GetName]扩大采矿和铸币活动，[ROOT.GetCountry.GetFlavorRank]可以巩固其货币体系并刺激地方发展。\n\n然而，这样的举措需要强有力的管理和即时的投入，而且如果过度开采，引发的问题可能会扰乱土地与人民。"
 flavor_tre.7.a: "专注于扩大开采！"
 flavor_tre.7.b: "这么贪婪可不明智。"
 flavor_tre.8.title: "[target_location.GetNameWithNoTooltip]的继承问题"
 flavor_tre.8.entry: "君士坦丁堡的继承问题"
 flavor_tre.8.desc: "世世代代以来，[ROOT.GetCountry.GetName]的[target_dynasty.GetName]家族守住了他人未能守护的一切。当其他文明任由自己走向衰微之时，他们在[ShowAreaName('black_sea_area')]沿岸延续了这个古老的[ROOT.GetCountry.GetFlavorRank]。这份坚守从未动摇，对最终结局的信念也从未有过疑问。\n\n如今，[target_ruler.GetName]已站在唯有古之伟人能立足的顶点。宏伟的[target_location.GetRank.GetName]——[target_location.GetName]，即将敞开城门与尘封的档案。历经数个世纪治理沉淀而成的浩瀚理政智慧，本就不属于窃据宝位之人。我们此番归来，正是为了将其交还给真正的主人。"
 flavor_tre.8.historical_info: "特拉比松的梅加斯·科穆宁王朝由拜占庭皇帝安德洛尼卡一世之孙阿莱克修斯一世·科穆宁于1204年建立。在王朝存续期间，特拉比松诸帝始终承袭罗马皇帝尊号，自认是拜占庭帝国正统遗产的合法继承者。传奇的东罗马帝都君士坦丁堡，不仅是政治瑰宝，更是绵延千年文明的精神与文化核心。"
 flavor_tre.8.a: "此乃[ROOT.GetCountry.GetFlavorRank]之天命所归。"
 flavor_tre.8.a.tt: "我们将获得多项全新的[bureaucracies|e]"
