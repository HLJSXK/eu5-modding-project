l_simp_chinese:
 flavor_hun_ven.1.title: "[ShowCultureNameWithNoTooltip('dalmatian')|U]协议"
 flavor_hun_ven.1.entry: "匈牙利与《扎达尔条约》"
 flavor_hun_ven.1.desc: "多年来，[ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')]一直梦想着摆脱内陆的束缚，在[ShowAreaName('adriatic_sea_area')]开辟一扇窗户。我们的间谍传来了[GetCountry('VEN').GetAdjective]衰弱的消息，[ROOT.GetCountry.GetGovernment.GetCourtTitle]中一些人这正是我们等待许久的良机。还有些人认为，我们不应贸然开战，而应通过外交手段向[GetCountry('VEN').GetNameWithNoTooltip]施压，迫使其做出让步。"
 flavor_hun_ven.1.a: "谈判就是浪费时间。"
 flavor_hun_ven.1.b: "尝试外交施压。"
 flavor_hun_ven.1.historical_info: "在路易一世统治期间，匈牙利试图扩大其亚得里亚海出海口，削弱威尼斯在达尔马提亚海岸的主导地位。1356年，路易对威尼斯发动进攻，并迅速占领了许多重要的达尔马提亚城镇。到1358年，威尼斯遭受了一系列重大失败，国内也出现问题，因此共和国同意进行谈判。根据由此产生的《扎达尔条约》，威尼斯放弃了对达尔马提亚的控制，拉古萨共合作作为匈牙利的半独立附属国就此崛起。"
 flavor_hun_ven.2.title: "[ShowCultureNameWithNoTooltip('dalmatian')|U]协议"
 flavor_hun_ven.2.desc: "[ROOT.GetCountry.GetFlavorRank]内部的麻烦并未被他国忽视。[GetCountry('HUN').GetName]提议两国召开代表会议，就我们向[GetCountry('HUN').GetNameWithNoTooltip]割让[ShowCultureName('dalmatian')|U]财产进行谈判。[ROOT.GetCountry.GetGovernment.GetCourtTitle]在此事上存在分歧。许多人谴责这一提议是对我们荣誉和力量的羞辱性打击。还有些人建议我们谨慎行事，认为拒绝他们的条款可能会引发战争，而一旦开战，我们可能会失去的不只是达尔马提亚。"
 flavor_hun_ven.2.a: "这提议就和他们[GetCountry('HUN').GetGovernment.GetRulerTitle]一样愚蠢！"
 flavor_hun_ven.2.a.entry: "这提议就和他们的统治者一样愚蠢！"
 flavor_hun_ven.2.b: "我们别无选择，只能接受。"
