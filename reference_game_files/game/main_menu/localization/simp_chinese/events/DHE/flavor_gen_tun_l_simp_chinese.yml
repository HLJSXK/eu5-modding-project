l_simp_chinese:
 flavor_gen_tun.1.title: "唾手可得"
 flavor_gen_tun.1.entry: "$flavor_gen_tun.1.title$"
 flavor_gen_tun.1.desc: "古老而美丽的[target_location.GetName][target_location.GetRank.GetName]矗立于[ShowLocationName('cape_tajura')]之上。尽管它对[ShowScriptedGeographyName('mediterranean_sea_geography')]经济举足轻重，却依然掌握在[target_country.GetLongName]手中——此国势单力薄，根本无力独自抵御我们的入侵。我们可以在[ShowProvinceDefinitionName('tripolitania_province')]登陆，劫掠沿海地区，事后再将战果拍卖给邻国——又或者，干脆据为己有。"
 flavor_gen_tun.1.a: "绝好的主意！"
 flavor_gen_tun.1.b: "这种机会，只属于好战之徒。"
 flavor_gen_tun.2.title: "出售 $tripoli$"
 flavor_gen_tun.2.entry: "$flavor_gen_tun.1.title$"
 flavor_gen_tun.2.desc: "在征服并洗劫 [target_location.GetName] 之后，我们的 [ROOT.GetCountry.GetFlavorRank] 如今在 [target_location.GetArea.GetName] 地区拥有了一片颇具规模的殖民地——这片土地无论在文化还是宗教上，都与我们位于 [ROOT.GetCountry.GetCapital.GetName] 的本土大相径庭。也许我们应当将其所有权转让给附近的某个部落。"
 flavor_gen_tun.2.a: "将其出售给邻近的巴努·塔比特部落。"
 flavor_gen_tun.2.b: "也许巴努·马基部落会有意愿买回他们的故土。"
 flavor_gen_tun.2.c: "我们确信 [tunis_location.GetOwner.GetLongNameWithNoTooltip] 会对此感兴趣。"
 flavor_gen_tun.2.d: "[target_location.GetNameWithNoTooltip] 归我们所有！"
 flavor_gen_tun.2.d.entry: "$tripoli$ 归我们所有！"
 sale_of_tripoli_tt: "我们将以[SCOPE.GetLocalVariable('proposed_price_of_sale').GetValue|+] [gold_i|e] [gold|e]的价格出售我们在[target_location.GetName]的殖民地，并转让所有相连的[locations|e]——总计#Y[SCOPE.GetLocalVariable('num_of_locations_to_be_sold').GetValue]#! [locations|e]"
 flavor_gen_tun.3.title: "$flavor_gen_tun.2.title$"
 flavor_gen_tun.3.desc: "来自[from_country.GetName]的使者抵达了[ROOT.GetCountry.GetCapital.GetName]，提出愿以高价向我们出售他们在[target_location.GetName]的领土。然而，[target_location.GetRank.GetName]的价值不可小觑——对[ROOT.GetCountry.GetFlavorRank]而言，这将是一次不错的收获。"
 flavor_gen_tun.3.desc_banu_makki: "[from_country.GetLongName] 如此厚颜无耻，理应由 [ROOT.GetCountry.GetReligion.GetGodName] 亲自降下惩罚！他们侵占了我们美丽的 [target_location.GetRankAndName]，如今竟"
 flavor_gen_tun.3.a: "好吧，我们同意。"
 flavor_gen_tun.3.b: "既然能够征服，为何还要花钱购买？"
 flavor_gen_tun.3.c: "恕我们直言，我们对此毫不在意。"
