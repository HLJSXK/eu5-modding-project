l_simp_chinese:
 flavor_ham.1.title: "贝伦贝格银行"
 flavor_ham.1.entry: "$flavor_ham.1.title$"
 flavor_ham.1.desc: "许多商人和金融家被流经我们土地的财富吸引来到[ROOT.GetCountry.GetFlavorRank]。其中就包括精通商业和金融的[GetDynasty('berenberg_dynasty').GetName]家族，他们希望在[berenberg_bank_hq.GetName]建立一家私人银行。这样一个机构在管理贸易信贷和促进北海两岸的商品交易方面具有不可估量的价值。"
 flavor_ham.1.historical_info: "1509年，在西班牙重新征服安特卫普后逃离的佛兰德商人汉斯·贝伦贝格和保罗·贝伦贝格建立了#italic 贝伦贝格银行#!，这是世界上最古老的商业银行之一，至今仍在营业。该银行以汉堡为总部，作为为北欧贸易融资的私人家族企业，通过谨慎管理商业信贷和投资蓬勃发展，并且一直掌握在私人手中。"
 flavor_ham.1.a: "我们欢迎所有有能力的商人。"
 flavor_ham.1.b: "让我们看看他们能达成什么成就！"
 flavor_ham.2.title: "$flavor_ham.1.title$"
 flavor_ham.2.desc: "我们已在宏伟的[berenberg_bank_hq.GetRank.GetName]，[berenberg_bank_hq.GetName]设立了银行。凭借与北欧乃至更广泛区域商人的深厚联系，我们已做好准备，成为本地区商业版图中不可或缺的一环。"
 flavor_ham.2.a: "每一笔借贷都让我们的财富增长。"
 flavor_ham.3.title: "汉堡银行"
 flavor_ham.3.entry: "$flavor_ham.3.title$"
 flavor_ham.3.desc: "经由[hamburger_bank_hq.GetName]市场的贸易量的持续增长，凸显了对稳定可靠的公共兑换银行的迫切需求——这类银行不仅能保障货币价值，还能促进大规模商业交易的顺利进行。借鉴同类机构的成功经验，在[hamburger_bank_hq.GetNameWithNoTooltip]设立一家公共银行，将为我们的金融繁荣奠定坚实基础。"
 flavor_ham.3.historical_info: "#italic 汉堡银行#!于1619年在汉堡自由市成立，其设立模式高度效仿了十数年前建立的阿姆斯特丹银行。作为一家公共兑换银行，它以可靠的银行货币接收存款并处理国际支付业务。在超过两个世纪的时间里，该行一直是北欧地区最重要的金融机构之一，直至1875年被德意志帝国银行兼并。"
 flavor_ham.3.a: "这家银行将为我们的利益服务。"
 flavor_ham.3.b: "我们将在金币中畅游！"
 flavor_ham.4.title: "$flavor_ham.3.title$"
 flavor_ham.4.desc: "我们肩负着管理资助人及其贸易伙伴财务的重任。守护北海的繁荣景象是我们的使命，我们必将牢牢把握这一机遇。"
 flavor_ham.4.a: "$flavor_ham.3.b$"
