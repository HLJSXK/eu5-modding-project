l_simp_chinese:
 flavor_mll.1.title: "与[target_country.GetNameWithNoTooltip]的紧张关系"
 flavor_mll.1.entry: "与阿拉贡的紧张关系"
 flavor_mll.1.desc: "尽管自[GetCharacter('ara_jacme_i_arago').GetName]去世以来，[ROOT.GetCountry.GetLongName]与[target_country.GetLongName]一直保持着密切的历史联系，[ROOT.GetCountry.GetNameWithNoTooltip]亦承认[target_country.GetAdjectiveWithNoTooltip]的宗主权，但[our_ruler.GetName]近期的继位导致与[target_country.GetCapital.GetName]的关系趋于紧张。[our_ruler.GetNameWithNoTooltip]认为自己的[ROOT.GetCountry.GetGovernment.GetRulerTitle]地位与[ara_ruler.GetName]相当，因此颁布法令，宣称一位[ROOT.GetCountry.GetGovernment.GetRulerTitle]不应该成为另一位[ROOT.GetCountry.GetGovernment.GetRulerTitle]的臣属。\n\n尽管[target_country.GetNameWithNoTooltip]尚未对[target_country.GetNameWithNoTooltip]采取任何敌对行动，但[ROOT.GetCountry.GetGovernment.GetCourtTitle]中许多人都担心，[our_ruler.GetNameWithNoTooltip]的鲁莽之举可能成为[target_country.GetAdjectiveWithNoTooltip][target_country.GetGovernment.GetCourtTitle]未来吞并[ROOT.GetCountry.GetNameWithNoTooltip]的借口。"
 flavor_mll.1.a: "未来数年我们必须谨慎行事。"
 repair_or_damage_relations_with_aragon_tt: "如果[ROOT.GetCountry.GetName]能在未来数年内与[target_country.GetName]的关系达到#G +190#!，则与[target_country.GetAdjectiveWithNoTooltip][target_country.GetGovernment.GetCourtTitle]的关系有可能得到修复。此外，我们亦可做好准备，彻底摆脱[target_country.GetNameWithNoTooltip]的统治"
 flavor_mll.2.title: "从与[target_country_1.GetAdjectiveWithNoTooltip]的冲突中恢复"
 flavor_mll.2.entry: "从与热那亚的冲突中恢复"
 flavor_mll.2.desc: "近期[target_country.GetName]与[target_country_1.GetName]之间的冲突对[ROOT.GetCountry.GetLongName]造成了严重冲击，许多[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]的船只被[target_country.GetName]征用，用于其对[ShowAreaName('sardinia_area')]的军事行动。尽管冲突已经结束，但[ROOT.GetCountry.GetAdjectiveWithNoTooltip]的商路遭到严重破坏，[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')]中有许多人正请求[ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')]提供帮助。然而，[ROOT.GetCountry.GetGovernment.GetCourtTitle]中的另一些人则认为必须开征新税，因为大量船只的损失使[ROOT.GetCountry.GetNameWithNoTooltip]更容易遭受来自[ShowRegionName('maghreb_region')]的劫掠。"
 flavor_mll.2.a: "必须开征新税以充实[ROOT.GetCountry.GetFlavorRank]的国库。"
 flavor_mll.2.b: "调拨[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')]资产，协助[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')]恢复。"
 flavor_mll.3.title: "[our_ruler.GetNameWithNoTooltip]的帕拉蒂纳法令"
 flavor_mll.3.entry: "海梅三世的帕拉蒂纳法令"
 flavor_mll.3.desc: "为进一步巩固自身作为独立统治者对抗[target_country.GetName]的地位，[our_ruler.GetName]着手奠定一部新[ShowLawNameWithNoTooltip('legal_code_law')]的基础，即《[ShowPolicyName('mll_leges_palatinae')]》。[ShowPolicyNameWithNoTooltip('mll_leges_palatinae')]不仅强化了[ROOT.GetCountry.GetNameWithNoTooltip]的独立地位，也进一步增强了[ROOT.GetCountry.GetGovernment.GetAdjective][ROOT.GetCountry.GetGovernment.GetCourtTitle]的治理权力。"
 flavor_mll.3.a: "我们应当颁布这部新[ShowLawNameWithNoTooltip('legal_code_law')]，以巩固我们的地位！"
 flavor_mll.3.b: "保留新[ShowLawNameWithNoTooltip('legal_code_law')]的框架，但暂缓颁布。"
 flavor_mll.3.c: "我们无需对现有的[ShowLawNameWithNoTooltip('legal_code_law')]进行改动。"
 flavor_mll.4.title: "《[ShowPolicyNameWithNoTooltip('mll_leges_palatinae')]》彩绘手稿"
 flavor_mll.4.entry: "《帕拉蒂纳法令》彩绘手稿"
 flavor_mll.4.desc: "在新[ShowLawName('legal_code_law')]的框架完成之后，[our_ruler.GetName]委托了数位[ShowCultureGroupName('italian_group')]艺术家，创作一部彩绘手稿，以进一步巩固[our_ruler.GetHisHer]的威望。如今这部作品已然完成，[ROOT.GetCountry.GetGovernment.GetCourtTitle]中有人建议，将这部[ShowWorkOfArtNameWithNoTooltip('illuminated_manuscrpt_of_the_legas_palatinae')]作为外交礼物，因该[ShowWorkOfArtTypeNameWithNoTooltip('treatise')]品质精良，堪称一份厚重之礼。"
 flavor_mll.4.a: "暂时将其作为[ROOT.GetCountry.GetGovernment.GetCourtTitle]藏品保存。"
 flavor_mll.4.b: "这将是送给[target_country_1.GetNameWithNoTooltip]的[fra_ruler.GetShortNameWithNoTooltip]的一份上好礼物。"
 flavor_mll.4.b.entry: "这将是送给法国统治者的一份上好礼物。"
 flavor_mll.4.c: "将手稿送往[target_country.GetCapital.GetNameWithNoTooltip]，作为[ROOT.GetCountry.GetAdjectiveWithNoTooltip]威望的象征。"
 flavor_mll.4.c.entry: "将手稿送往阿拉贡，作为马略卡威望的象征。"
 flavor_mll.5.title: "与[target_location.GetNameWithNoTooltip]的联系"
 flavor_mll.5.entry: "与蒙彼利埃的联系"
 flavor_mll.5.desc: "[GetCharacter('ara_jacme_i_arago').GetName]去世后，其领土的划分使得[ROOT.GetCountry.GetName]在[ShowContinentName('europe')]大陆获得了数块领地。在这些[target_location.GetRank.GetName]中，[target_location.GetName]凭借其与[target_country_1.GetAdjective][target_country_1.GetGovernment.GetCourtTitle]的紧密联系，成为[ROOT.GetCountry.GetNameWithNoTooltip]统治者至关重要的枢纽。\n\n考虑到[target_country.GetName]与[ROOT.GetCountry.GetNameWithNoTooltip]之间的关系颇为紧张，[ROOT.GetCountry.GetGovernment.GetCourtTitle]中一些成员力劝[our_ruler.GetName]号召[target_location.GetNameWithNoTooltip]的[ShowCultureName('languedocien')][ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]提供支持；然而，也有人建议我们利用[target_location.GetNameWithNoTooltip]的重要地位，来争取[target_country_1.GetNameWithNoTooltip][target_country_1.GetGovernment.GetCourtTitle]的好感。"
 flavor_mll.5.a: "利用我们与[target_location.GetNameWithNoTooltip][ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]的联系以获取支持。"
 flavor_mll.5.a.entry: "利用我们与蒙彼利埃贵族的联系以获取支持。"
 flavor_mll.5.b: "转而专注于[ROOT.GetCountry.GetNameWithNoTooltip]内部的事务。"
 flavor_mll.5.c: "安排与[target_country_1.GetNameWithNoTooltip]交换[target_location.GetNameWithNoTooltip]。"
 flavor_mll.5.c.entry: "安排与法国交换蒙彼利埃。"
 mll_unlock_sale_of_montpellier_decision_tt: "解锁$mll_exchange_of_montpellier.title$[decision|e]，提供获得对[target_country_1.GetName]的外交影响力的机会"
 flavor_mll.6.title: "[ShowAreaNameWithNoTooltip('balearics_area')]的防御"
 flavor_mll.6.entry: "[ShowAreaNameWithNoTooltip('balearics_area')]的防御"
 flavor_mll.6.desc: "尽管[target_country.GetAdjective]的巡逻队在过去曾成功遏制了[ShowCultureGroupName('maghrebi_group')]海盗对[ShowAreaName('balearics_area')]的劫掠，但近年来，这些袭击活动对[ROOT.GetCountry.GetLongName]造成的困扰愈发严重。\n\n由于与[target_country.GetNameWithNoTooltip]之间的关系已相当紧张，[ROOT.GetCountry.GetGovernment.GetCourtTitle]一些成员已着手起草了沿海防御工事的建设计划——一方面是为了抵御[ShowCultureGroupNameWithNoTooltip('maghrebi_group')]劫掠者，另一方面则是为了增加[target_country.GetNameWithNoTooltip]发动入侵的难度。"
 flavor_mll.6.a: "提供必要资金，使[ShowAreaNameWithNoTooltip('balearics_area')]固若金汤。"
 flavor_mll.6.b: "我们无力承担这项昂贵的工程。"
 mll_area_gains_naval_defensives_tt: "[ShowAreaName('balearics_area')]所有[locations|e]将获得[ShowModifier('mll_expansion_of_coastal_fortifications')]，持续60年"
 flavor_mll.7.title: "争取境外支持"
 flavor_mll.7.entry: "$flavor_mll.7.title$"
 flavor_mll.7.desc: "随着[ROOT.GetCountry.GetName]与[target_country.GetLongName]之间的关系比以往任何时候都更加晦暗不明，[ROOT.GetCountry.GetGovernment.GetCourtTitle]中的许多顾问敦促[our_ruler.GetName]联络[target_country.GetNameWithNoTooltip]过往的对手，以期获得支持，从而真正摆脱[target_country.GetCapital.GetName]的掌控。"
 flavor_mll.7.a: "寻求[target_country_2.GetAdjectiveWithNoTooltip]的支持。"
 flavor_mll.7.a.entry: "寻求卡斯蒂利亚的支持。"
 flavor_mll.7.b: "寻求[target_country_3.GetLongNameWithNoTooltip]的支持。"
 flavor_mll.7.b.entry: "寻求那不勒斯王国的支持。"
 flavor_mll.7.c: "向我们在[target_country_4.GetNameWithNoTooltip]的旧敌求助。"
 flavor_mll.7.c.entry: "向我们在热那亚的旧敌求助。"
 flavor_mll.7.d: "我们必须转而依靠我们的[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]。"
 mll_conditions_for_castile_support_tt: "如果[ROOT.GetCountry.GetName]在未来数年内与[target_country_2.GetName]的关系达到#G +150#!，则对方将对我们可能发起的所有独立运动获得#G +50#!接受度"
 mll_conditions_for_naples_support_tt: "如果[ROOT.GetCountry.GetName]在未来数年内与[target_country_3.GetName]的关系达到#G +120#!，则对方将对我们可能发起的所有独立运动获得#G +50#!接受度"
 mll_conditions_for_genoa_support_tt: "如果[ROOT.GetCountry.GetName]在未来数年内与[target_country_4.GetName]的关系达到#G +100#!，则对方将对我们可能发起的所有独立运动获得#G +50#!接受度"
 MLL_PLEDGED_SUPPORT: "已承诺支持"
 flavor_mll.8.title: "拒绝效忠"
 flavor_mll.8.entry: "拒绝向阿拉贡效忠"
 flavor_mll.8.desc: "[ROOT.GetCountry.GetName]与[target_country.GetName]之间的所有外交途径均已告失败，[target_country.GetAdjectiveWithNoTooltip]的外交官已无意与[our_ruler.GetName]寻求妥协。[target_country.GetLongNameWithNoTooltip]很可能会编造阴谋，以此为借口直接吞并[ROOT.GetCountry.GetNameWithNoTooltip]。"
 flavor_mll.8.a: "我们已经忍无可忍！"
 mll_ara_will_likely_pursue_subjugation_tt: "[target_country.GetName]的[target_country.GetGovernment.GetCourtTitle]可能会试图直接吞并[ROOT.GetCountry.GetName]，以将其纳入[target_country.GetAdjectiveWithNoTooltip]王室的统治之下"
 flavor_mll.9.title: "关系修复"
 flavor_mll.9.entry: "与阿拉贡的关系修复"
 flavor_mll.9.desc: "曾经注定走向灾难的关系，如今已通过[target_country.GetAdjective]与[ROOT.GetCountry.GetAdjective]外交官之间的谨慎谈判而大体修复。尽管[target_country.GetNameWithNoTooltip]仍然不愿承认我们对独立统治的主张，但此前应向[target_country.GetNameWithNoTooltip]承担的大部分财政义务已被免除。虽然[ROOT.GetCountry.GetGovernment.GetCourtTitle]中有些人将此视为[our_ruler.GetNameWithNoTooltip]的胜利，但一些与[ROOT.GetCountry.GetGovernment.GetRulerTitle]关系密切的盟友已请求[our_ruler.GetHeShe]寻求真正摆脱[target_country.GetNameWithNoTooltip]达成独立的道路。"
 flavor_mll.9.a: "危机暂时得以避免。"
 mll_ara_will_not_pursue_hostile_action_tt: "[target_country.GetName]将不再采取侵略性手段吞并[ROOT.GetCountry.GetName]。与此同时，[ROOT.GetCountry.GetNameWithNoTooltip]仍可自由寻求获取自身独立的途径"
 flavor_mll.10.title: "总督辖区升格"
 flavor_mll.10.entry: "[ROOT.GetCountry.GetNameWithNoTooltip]总督辖区"
 flavor_mll.10.desc: "随着[target_country.GetName]与[ROOT.GetCountry.GetName]的关系大体恢复至以往水平，[target_country.GetLongNameWithNoTooltip]对[ShowAreaName('balearics_area')]重新产生了关注。鉴于该地区大部分经济因过往[ShowCultureGroupName('maghrebi_group')]人的劫掠以及与[target_country_1.GetName]的早期冲突而陷入瘫痪，[target_country.GetAdjectiveWithNoTooltip][ROOT.GetCountry.GetGovernment.GetCourtTitle]提议授予[ROOT.GetCountry.GetLongNameWithNoTooltip]总督领地位，使其获得来自[target_country.GetAdjectiveWithNoTooltip][ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')]的更多支持。"
 flavor_mll.10.a: "利用新获得的总督地位来加强[ROOT.GetCountry.GetNameWithNoTooltip]。"
 flavor_mll.10.b: "努力维护[target_country.GetAdjectiveWithNoTooltip]与[ROOT.GetCountry.GetAdjectiveWithNoTooltip]在[ShowScriptedGeographyNameWithNoTooltip('mediterranean_sea_geography')]的利益。"
 flavor_mll.10.b.entry: "努力维护阿拉贡与马略卡在地中海的利益。"
 flavor_mll.10.c: "拒绝[target_country.GetNameWithNoTooltip]授予总督地位的提议。"
 flavor_mll.10.c.entry: "拒绝阿拉贡授予总督地位的提议。"
 flavor_mll.11.title: "[source_of_piracy.GetNameWithNoTooltip]海盗之患"
 flavor_mll.11.entry: "[ShowCultureGroupNameWithNoTooltip('maghrebi_group')]海盗之患"
 flavor_mll.11.desc: "尽管[ROOT.GetCountry.GetLongName]曾遭受[ShowRegionName('maghreb_region')]海盗的多次劫掠，但近年来，源自[source_of_piracy.GetName]的海盗对[ROOT.GetCountry.GetGovernment.GetCourtTitle]造成的损失最为惨重。在[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]日益增长的愤怒之中，许多人向[our_ruler.GetNameWithNoTooltip]请愿，要求入侵[source_of_piracy.GetNameWithNoTooltip]，以彻底铲除海盗威胁。"
 flavor_mll.11.a: "[source_of_piracy.GetNameWithNoTooltip]的海盗必须得到处置。"
 flavor_mll.11.a.entry: "海盗必须得到处置。"
 flavor_mll.11.b: "只有直接夺取[source_of_piracy.GetAdjectiveWithNoTooltip]的领地，才能迅速镇压他们。"
 flavor_mll.11.b.entry: "只有直接夺取他们的领地，才能迅速镇压他们。"
 flavor_mll.12.title: "阿尔库迪亚城墙"
 flavor_mll.12.entry: "$flavor_mll.12.title$"
 flavor_mll.12.desc: "阿尔库迪亚坐落于[target_location.GetName]的郊外，过去一个世纪以来一直处于来自[ShowRegionName('maghreb_region')]劫掠的最前线。由于该地区易受侵袭，[GetCharacter('mll_jacme_ii_mallorca').GetName]此前曾委托修筑新的城墙，以保护该定居点将来免受劫掠。尽管城墙尚未完全竣工，但现有结构已证明相当有效，[ROOT.GetCountry.GetGovernment.GetCourtTitle]中一些人认为[ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')]应当启动一项新工程，采用类似的设计来加强[target_location.GetNameWithNoTooltip][target_location.GetRank.GetName]本身的防御。"
 flavor_mll.12.a: "资助扩建新的防御工事，将[target_location.GetNameWithNoTooltip]全境纳入保护范围。"
 flavor_mll.12.a.entry: "资助扩建新的防御工事，将马纳科尔全境纳入保护范围。"
 flavor_mll.12.b: "拨付资金以完成阿尔库迪亚城墙的修筑。"
 flavor_mll.12.c: "取消阿尔库迪亚的所有后续建筑工程。"
 flavor_mll.13.title: "摆脱[target_country.GetNameWithNoTooltip]"
 flavor_mll.13.entry: "重获独立"
 flavor_mll.13.desc: "通过[our_ruler.GetName]与[ROOT.GetCountry.GetGovernment.GetAdjective][ROOT.GetCountry.GetGovernment.GetCourtTitle]的斗争，[ROOT.GetCountry.GetNameWithNoTooltip]最终真正摆脱[target_country.GetLongName]赢得了独立。随着[target_country.GetNameWithNoTooltip]被迫承认[ROOT.GetCountry.GetAdjectiveWithNoTooltip]的分离，[ROOT.GetCountry.GetGovernment.GetAdjective][ROOT.GetCountry.GetGovernment.GetCourtTitle]如今可以放眼[ShowScriptedGeographyName('mediterranean_sea_geography')]，而不再受制于[target_country.GetCapital.GetName]的意志。"
 flavor_mll.13.a: "[ROOT.GetCountry.GetNameWithNoTooltip]将从此开创自己的未来。"
 flavor_mll.14.title: "[target_location.GetNameWithNoTooltip][ShowBuildingTypeNameWithNoTooltip('university')]支持[our_ruler.GetNameWithNoTooltip]的统治"
 flavor_mll.14.entry: "蒙彼利埃大学支持我们的统治"
 flavor_mll.14.desc: "尽管[target_location.GetName]一直是[ROOT.GetCountry.GetAdjectiveWithNoTooltip][ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')]在大陆的领地，但[target_location.GetNameWithNoTooltip][ShowBuildingTypeName('university')]的学者们已被证明是[our_ruler.GetNameWithNoTooltip]的坚定支持者。从颁布新的[ShowPolicyName('mll_leges_palatinae')][ShowLawNameWithNoTooltip('legal_code_law')]到巩固[ROOT.GetCountry.GetGovernment.GetAdjective][ROOT.GetCountry.GetGovernment.GetCourtTitle]，[target_location.GetNameWithNoTooltip]的学者们为[our_ruler.GetName]的统治提供了有力的政治筹码。"
 flavor_mll.14.a: "我们欢迎他们的支持！"
 flavor_mll.14.b: "利用他们的赞誉进一步巩固[our_ruler.GetShortNameWithNoTooltip]的政治地位。"
 flavor_mll.14.b.entry: "利用他们的赞誉进一步巩固我们统治者的政治地位。"
 flavor_mll.15.title: "重建[ROOT.GetCountry.GetAdjectiveWithNoTooltip]的贸易影响力"
 flavor_mll.15.entry: "重建马略卡的贸易影响力"
 flavor_mll.15.desc: "随着[ROOT.GetCountry.GetLongName]不再受制于[target_country.GetName]的意志，我们的许多商人迫切希望开展独立贸易，以恢复[ROOT.GetCountry.GetName]曾经在[ShowScriptedGeographyName('mediterranean_sea_geography')]拥有的贸易影响力。尽管[ROOT.GetCountry.GetAdjectiveWithNoTooltip]影响力的衰退主要受到[target_country_1.GetName]与[target_country.GetNameWithNoTooltip]过往冲突的影响，但新近获得独立的[ROOT.GetCountry.GetAdjectiveWithNoTooltip][ROOT.GetCountry.GetFlavorRank]很可能会促使整个[ShowScriptedGeographyNameWithNoTooltip('mediterranean_sea_geography')]的商人们重新审视我们在该区域的存在。\n\n为鼓励我们在该区域重建影响力，[ROOT.GetCountry.GetGovernment.GetCourtTitle]中有人建议向[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')]提供额外特权，同时免除一些此前在[target_country.GetAdjectiveWithNoTooltip]统治期间施加的限制。然而，一些人担心加强[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')]可能导致[ROOT.GetCountry.GetNameWithNoTooltip]变得更像[ShowRegionName('italy_region')]那里的[ShowGovernmentTypeName('republic')]。"
 flavor_mll.15.a: "向[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')]提供广泛特权以换取他们的协助。"
 flavor_mll.15.b: "[ROOT.GetCountry.GetGovernment.GetCourtTitle]应独自承担这项事业。"
 flavor_mll.15.c: "我们应更加专注于内部事务。"
 # Decisions
 mll_a_hub_of_mediterranean_trade.title: "[ShowScriptedGeographyNameWithNoTooltip('mediterranean_sea_geography')]贸易枢纽"
 mll_a_hub_of_mediterranean_trade.desc: "尽管许多旧日[GetCountry('MLL').GetAdjective]商路因[GetCountry('ARA').GetAdjective]与[GetCountry('GEN').GetAdjective]过往的冲突而中断，但[GetCountry('MLL').GetLongNameWithNoTooltip]重新获得的独立地位为恢复这些曾经利润丰厚的商路创造了契机。此外，[ShowAreaNameWithNoTooltip('balearics_area')]的优越地理位置为我们提供了成为[ShowScriptedGeographyNameWithNoTooltip('mediterranean_sea_geography')]贸易主要竞争者的机会。"
 mll_a_hub_of_mediterranean_trade.a: "[GetCountry('MLL').GetNameWithNoTooltip]如今已准备好主导[ShowScriptedGeographyNameWithNoTooltip('mediterranean_sea_geography')]的贸易。"
 mll_exchange_of_montpellier.title: "交换[ShowLocationNameWithNoTooltip('montpellier')]"
