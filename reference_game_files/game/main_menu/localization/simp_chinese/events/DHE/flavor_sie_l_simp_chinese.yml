l_simp_chinese:
 unlocked_advance_marble_tradition_tt: "已触发$flavor_sie.1.title$[dynamic_historical_event|e]"
 flavor_sie.1.title: "牧山银行"
 flavor_sie.1.entry: "$flavor_sie.1.title$"
 flavor_sie.1.desc: "#italic 慈善典当行#!在我国及周边地区日益普及。这些慈善机构利用捐赠者的资金，为经济困难者提供低息贷款。在[monte_paschi_bank_hq.GetName]资助这样一家机构，将有助于提升我国[ROOT.GetCountry.GetFlavorRank]的财富与整体繁荣，并使其成为我们的国家银行。"
 flavor_sie.1.a: "金钱将会流动。"
 flavor_sie.1.b: "真是个虔诚的组织！"
 flavor_sie.1.historical_info: "#italic 锡耶纳牧山银行#!于1472年在锡耶纳共和国成立，是世界上持续运营最久的银行。它最初是一家慈善典当行，在托斯卡纳大公国时期转型为现代银行，意大利统一后业务范围扩展至整个亚平宁半岛。"
 flavor_sie.2.title: "$flavor_sie.1.title$"
 flavor_sie.2.desc: "慈善典当行是旨在帮助弱势群体的慈善机构。然而，我们的起源虽如此，却不意味着我们不能从这些及其他业务中获利，并在此过程中使自己致富。"
 flavor_sie.2.a: "钱必将属于我们！"
 flavor_sie.3.entry: "$flavor_sie.3.title$"
 flavor_sie.3.title: "[ShowLocationNameWithNoTooltip('siena')]的黄金时代"
 flavor_sie.3.desc: "[ROOT.GetCountry.GetAdjective]疆域的不断扩张，加上长期的和平与繁荣，共同缔造了[target_location.GetName]城的黄金时代。在[target_location.GetRank.GetName]的街头巷尾，辛勤劳作与欢庆活动交相辉映，财富与丰裕源源不断地涌现。几乎没有人能够想象这样的盛景会有终结的一天——事实上，许多人正殷切期盼这一辉煌时代能够永远护佑[target_location.GetRank.GetNameWithNoTooltip]的百姓。"
 flavor_sie.3.a: "这个黄金时代将永续不衰！"
 sie_gain_modifier_until_the_black_death: "[ShowLocationName('siena')]将获得[ShowModifierTypeName('sie_golden_age_of_siena')][location_modifier|e]，直至[ShowSituationNameWithNoTooltip('black_death')][situation|e]爆发"
 flavor_sie.4.entry: "$flavor_sie.4.title$"
 flavor_sie.4.title: "从[ShowSituationNameWithNoTooltip('black_death')]中复苏"
 flavor_sie.4.desc: "肆虐[ShowRegionName('italy_region')]乃至整个[ShowContinentName('europe')]的瘟疫，给[target_location.GetName]刻下了难以磨灭的伤痕。曾经充满生机的街道，如今只回荡着死亡面前人人平等的残酷警示——无论是罪人还是圣人，在苍白骑士的审判面前都别无二致。与其坐视这片废墟继续沉沦，我们不如伸出援手，帮助[target_location.GetNameWithNoTooltip]人民重建家园。"
 flavor_sie.4.a: "我们将动用国库，尝试重建这座[target_location.GetRank.GetNameWithNoTooltip]。"
 flavor_sie.4.a.entry: "我们将动用国库，尝试重建这座城市。"
 sie_all_pops_lose_satisfaction: "[target_location.GetName]的所有[pops|e]会失去[ShowNamedValue('pop_satisfaction_extreme_penalty')|+=2%][pop_satisfaction|e]"
 flavor_sie.4.b: "生与死的轮回永恒而无从逃避。"
 flavor_sie.5.entry: "$flavor_sie.5.title$"
 flavor_sie.5.title: "建造[ShowLocationNameWithNoTooltip('grosseto')]港口"
 flavor_sie.5.desc: "我们在[ShowRegionName('italy_region')]沿海的海上力量尚处于起步阶段。尽管如此，不少[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]持续呼吁[ROOT.GetCountry.GetName]大力扩充海军规模。他们为此计划选定的首批[target_location.GetRank.GetName]之一，便是近期获得的[target_location.GetName]城。\n\n许多新居民已在[target_location.GetNameWithNoTooltip]定居，他们期待我们能够重视该地在我们[ROOT.GetCountry.GetFlavorRank]体系中的战略地位，并致力于在此建设一座设施完备的港口。"
 flavor_sie.5.a: "我们将保护海上贸易。"
 flavor_sie.5.b: "应当转而专注于陆上边界。"
 flavor_sie.6.entry: "$flavor_sie.6.title$"
 flavor_sie.6.title: "[ShowLocationNameWithNoTooltip('pitigliano')]的海上影响力"
 flavor_sie.6.desc: "长期以来，我们的[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]一直受限于资源匮乏，难以成为[ShowRegionName('italy_region')]真正具备竞争力的海上贸易力量。尽管他们在[target_location.GetMarket.GetName]缺乏自己的港口网络，但这并不意味着我们束手无策。\n\n[target_location.GetName]城已引起众多[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')]的关注，他们在[ROOT.GetCountry.GetGovernment.GetCourtTitle]中积极倡议：应投资扩建该[target_location.GetRank.GetName]的港口，将其打造为面向所有商人的贸易枢纽。"
 flavor_sie.6.a: "让我们扩建这个港口。"
 flavor_sie.6.b: "我们不会把整个国库都用来满足[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')]的想法。"
 flavor_sie.6.b.entry: "我们不会把整个国库都用来满足富人的想法。"
 flavor_sie.7.entry: "$flavor_sie.7.title$"
 flavor_sie.7.title: "[ShowLocationNameWithNoTooltip('piombino')]港"
 flavor_sie.7.desc: "商人、[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]和[ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')]纷纷迁往[target_location.GetName]城，这座[target_location.GetRank.GetName]已引起[ROOT.GetCountry.GetGovernment.GetCourtTitle]的高度关注。\n\n鉴于扩建港口将强化我们的海上贸易路线，许多[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')]已向[target_character.GetName]提议，动用国库资金将此[target_location.GetRank.GetNameWithNoTooltip]打造为全[ShowRegionName('italy_region')]最瞩目的城市之一。"
 flavor_sie.7.a: "为加强贸易，我们将建造这座港。"
 flavor_sie.7.b: "我们不需要更多那样的港口。"
 flavor_sie.8.entry: "$flavor_sie.8.title$"
 flavor_sie.8.title: "流亡者的归来"
 flavor_sie.8.desc: "在我国[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]中，许多家族都曾对[ROOT.GetCountry.GetAdjective]的政治产生影响，但无一能与[GetDynasty('petrucci').GetName]家族相提并论——至少，在他们因政变未遂的传言而被流放之前是如此。\n\n不过，如今[GetDynasty('petrucci').GetNameWithNoTooltip]家族的一位成员已重返[target_character.GetHerHis]的先祖出生的[target_capital.GetRank.GetName]——历史悠久的[target_capital.GetName]。众多平民热烈欢迎[target_character.GetHerHis]的归来，高呼[target_character.GetHerHis]的名字，期盼[target_character.GetSheHe]能够带领大家摆脱当前[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]阶层的腐败统治。然而，也有人担忧这个[target_character.GetWomanMan]重拾昔日野心，呼吁[ROOT.GetCountry.GetGovernment.GetCourtTitle]在这个[GetDynasty('petrucci').GetNameWithNoTooltip]家的子孙可能再度发动政变之前，就将其驱逐出境。"
 flavor_sie.8.a: "我们不怕任何个人的影响。"
 flavor_sie.8.b: "让某人安分守己的方法多的是……"
 flavor_sie.8.c: "这个家族被流放是有原因的。"
 sie_triumphant_return_means_possibility_of_coup: "随着[target_character.GetName]返回[ROOT.GetCountry.GetName]，若[target_character.GetSheHe]成为我国[ruler|e]，则一定会试图完全掌控权力"
 flavor_sie.9.entry: "$flavor_sie.9.title$"
 flavor_sie.9.title: "崛起掌权"
 flavor_sie.9.desc: "多年以前，[ROOT.GetCountry.GetLongName]四分五裂，各个家族分据要职，导致领导层在几乎所有事务上都难以达成共识。然而，随着[target_character.GetName]的崛起，许多重要职位已被其忠诚的支持者占据——这些人或是[target_character.GetHerHis]的亲信，或是完全拥护此次权力格局变革的家族成员。\n\n在[ROOT.GetCountry.GetGovernment.GetCourtTitle]会议中，无人敢公开反对[target_character.GetHerHim]，因为所有人都惧怕[target_character.GetSheHe]那足以压制任何政敌的强大影响力。\n\n如今，[target_character.GetDynasty.GetName]家族凭借对[ROOT.GetCountry.GetFlavorRank]的牢牢掌控，已然成为[ROOT.GetCountry.GetNameWithNoTooltip]的主导势力。"
 flavor_sie.9.a: "一家一姓之国。"
 flavor_sie.10.entry: "$flavor_sie.10.title$"
 flavor_sie.10.title: "[ShowLocationNameWithNoTooltip('siena')]艺术风格"
 flavor_sie.10.desc: "[ShowInstitutionName('renaissance')]极大地改变了[ShowRegionName('italy_region')]各地的艺术风格。其中尤为引人注目的发展是[ROOT.GetCountry.GetAdjective]风格，它侧重于表现手法中的神秘主义与宗教元素。这一风格直接挑战了源自[ShowLocationName('florence')]、更富人文主义与表现主义色彩的传统。[ROOT.GetCountry.GetGovernment.GetCourtTitle]的众多成员将其视为向[ShowContinentName('europe')]各地传播我国文化、彰显我国威望的重要契机。"
 flavor_sie.10.a: "我们将使[ShowLocationNameWithNoTooltip('siena')]成为最负盛名的地方！"
 flavor_sie.10.b: "我们没有资金去实现如此宏大的抱负。"
 flavor_sie.11.entry: "$flavor_sie.11.title$"
 flavor_sie.11.title: "扩建[ShowLocationNameWithNoTooltip('siena')]学堂"
 flavor_sie.11.desc: "[ShowInstitutionName('renaissance')]的鼎盛时期彻底重塑了[ShowRegionName('italy_region')]的文化认同，推动众多城市形成了独特的艺术风格。值得庆幸的是，一批热衷于运用[ROOT.GetCountry.GetAdjective]风格进行创作的新锐艺术家已然崭露头角。\n\n其中，[target_character.GetName]便是这一流派的代表，这位杰出的[target_character.GetWomanMan]致力于在[ShowLocationName('siena')]开创一种更具宗教感染力的美学理念。"
 flavor_sie.11.a: "我们将接纳像[target_character.GetHerHim]这样的新艺术家。"
 flavor_sie.11.a.entry: "我们将接纳新艺术家。"
 flavor_sie.11.b: "与其固守我们当前的风格，或许我们应当向他人寻求灵感。"
 flavor_sie.12.entry: "$flavor_sie.12.title$"
 flavor_sie.12.title: "[ShowLocationNameWithNoTooltip('siena')]的圣人"
 flavor_sie.12.desc: "[target_character.GetName]将全身心敬奉予了[target_character.GetReligion.GetGodName]，在[ShowLocationName('siena')]的众多市民眼中，他被视为[ShowRegionName('italy_region')]最虔诚的人物，地位仅次于教宗。\n\n[ROOT.GetCountry.GetGovernment.GetCourtTitle]已留意到[target_character.GetHerHis]深厚的宗教热忱和对神学著作的专注钻研。[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]们将此视为向整个[ROOT.GetCountry.GetReligion.GetAdjective]世界彰显我们虔诚信仰的良机，而普通[ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')]则视[target_character.GetHerHim]为行走于人间的圣徒，相信[target_character.GetHerHim]能为他们带来繁荣与福祉。"
 flavor_sie.12.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 flavor_sie.12.a.entry: "太棒了！"
