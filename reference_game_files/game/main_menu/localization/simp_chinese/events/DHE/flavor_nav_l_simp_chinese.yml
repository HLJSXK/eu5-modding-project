l_simp_chinese:
 flavor_nav.1.title: "[target_character.GetNameWithNoTooltip] 与 [target_character_2.GetNameWithNoTooltip] 的共治"
 flavor_nav.1.entry: "琼娜二世与埃夫勒的腓力的共治"
 flavor_nav.1.desc: "Following their ascension to the throne of [ROOT.GetCountry.GetName] in 1329, [target_character.GetName] and [target_character_2.GetName] have ruled the [ROOT.GetCountry.GetFlavorRank] closely; however, [target_character_2.GetNameWithNoTooltip]'s possessions in [ShowRegionName('france_region')] are clearly preferred by the joint rulers, who frequently leave [ROOT.GetCountry.GetNameWithNoTooltip] to take up residence in their [ShowCultureGroupNameWithNoTooltip('french_group')] holdings.\n\nAlthough the [ROOT.GetCountry.GetGovernment.GetCourtTitle] has found many capable regents to govern the [ROOT.GetCountry.GetFlavorRank] in the rulers' absence, there have been growing qualms over the past few years, with many [ROOT.GetCountry.GetAdjectiveWithNoTooltip] lords wishing to petition the two rulers to take up more permanent residence in [ROOT.GetCountry.GetCapital.GetName] lest the [ROOT.GetCountry.GetFlavorRank] appear weak in the eyes of covetous foreign powers."
 flavor_nav.1.a: "我们在 [ShowRegionNameWithNoTooltip('france_region')] 的领地才是最重要的。"
 flavor_nav.1.b: "两国应当受到同等的治理。"
 flavor_nav.1.c: "[ROOT.GetCountry.GetNameWithNoTooltip] 的土地必须是我们最优先考虑的事务。"
 flavor_nav.2.title: "[target_character.GetNameWithNoTooltip] 的登基"
 flavor_nav.2.entry: "纳瓦拉的查理登基"
 flavor_nav.2.desc: "随着 [GetCharacter('nav_jeanne_ii_capet').GetName] 的逝世，野心勃勃的 [target_character.GetName] 登上了王位。[target_character.GetSheHe] 抵达 [ROOT.GetCountry.GetCapital.GetName] 参加 [ROOT.GetCountry.GetGovernment.GetAdjective|U] 仪式与加冕典礼后，就已经展现出 [target_character.GetHerselfHimself] 与众不同之处，因为 [target_character.GetNameWithNoTooltip] 表示有意以 [ShowDialectName('aragonese_dialect')] 宣誓效忠。此举令 [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] 颇感不满，他们更希望誓言以传统的 [ShowLanguageNameWithNoTooltip('latin_language')] 进行。"
 flavor_nav.2.a: "以罗曼语宣誓。"
 flavor_nav.2.b: "荒唐之念：誓言必须以 [ShowLanguageNameWithNoTooltip('latin_language')] 宣读。"
 flavor_nav.2.c: "改以 [ShowLanguageNameWithNoTooltip('basque_language')] 宣誓。"
 flavor_nav.3.title: "[target_character.GetNameWithNoTooltip] 的领地"
 flavor_nav.3.entry: "纳瓦拉的查理在法兰西的领地"
 flavor_nav.3.desc: "Having inherited both the lands of [GetCharacter('nav_philip_iii_evreux').GetName] and [GetCharacter('nav_jeanne_ii_capet').GetName], [target_character.GetName] now rules an expansive territory, encompassing [ROOT.GetCountry.GetName] and several holdings within [ShowRegionName('france_region')]. Though [GetCharacter('nav_jeanne_ii_capet').GetNameWithNoTooltip] and [GetCharacter('nav_philip_iii_evreux').GetNameWithNoTooltip] ruled [ROOT.GetCountry.GetNameWithNoTooltip] jointly, they only visited the [ROOT.GetCountry.GetFlavorRank] briefly, preferring to maintain residence in [ShowRegionNameWithNoTooltip('france_region')].\n\nWith [target_character.GetNameWithNoTooltip] ascension, many allies in the [ROOT.GetCountry.GetGovernment.GetCourtTitle] have urged [target_character.GetHerHim] to take up a more permanent residence in [ROOT.GetCountry.GetNameWithNoTooltip], although others feel the [ROOT.GetCountry.GetGovernment.GetRulerTitle] may have greater ambitions towards the contested throne of [ShowRegionNameWithNoTooltip('france_region')]."
 flavor_nav.3.a: "在我们位于 [ShowRegionNameWithNoTooltip('france_region')] 的领地中，继续处理 [ROOT.GetCountry.GetGovernment.GetCourtTitle] 的事务。"
 flavor_nav.3.b: "让[ROOT.GetCountry.GetNameWithNoTooltip]的主要[ROOT.GetCountry.GetGovernment.GetCourtTitle]坐镇于此。"
 flavor_nav.3.c: "将我们的统治重心置于 [evr_country.GetNameWithNoTooltip] 。"
 flavor_nav.3.c.entry: "将我们的统治重心置于埃夫勒。"
 nav_will_be_able_to_rally_other_appanages_tt: "Reaching #G 190#! relations with a Appanage subject of [GetCountry('FRA').GetName] will make them more inclined to support us in a war against [GetCountry('FRA').GetNameWithNoTooltip] to seize the throne"
 flavor_nav.4.title: "[ShowDynastyNameWithNoTooltip('capet_dynasty')] 的主张"
 flavor_nav.4.entry: "卡佩家族的主张"
 flavor_nav.4.desc: "Though many had suspected [target_character.GetName] to be an ambitious [ROOT.GetCountry.GetGovernment.GetRulerTitle], many did not expect to hear [target_character.GetHerHis] desire to claim the throne of [fra_country.GetName] directly. While [target_character.GetNameWithNoTooltip] claim is strong through [GetCharacter('nav_jeanne_ii_capet').GetShortName]'s [ShowDynastyName('capet_dynasty')] blood, one of the conditions of [GetCharacter('nav_jeanne_ii_capet').GetHerHis] inheritance of [ROOT.GetCountry.GetName] was to forfeit the claim to [fra_country.GetNameWithNoTooltip].\n\nWhile many lords of [fra_country.GetNameWithNoTooltip] are also unlikely to fully acknowledge [target_character.GetNameWithNoTooltip]'s claim due to the ancient [ShowHeirSelectionName('salic_law')], some feel [target_character.GetNameWithNoTooltip] should utilize [target_character.GetHerHis] political influence within [fra_country.GetNameWithNoTooltip] to persuade the more powerful lords."
 flavor_nav.4.a: "[fra_country.GetNameWithNoTooltip]的王位理应属于[target_character.GetNameWithNoTooltip]！"
 flavor_nav.4.a.entry: "法兰西的王位理应属于查理！"
 flavor_nav.4.b: "利用这些主张，在我们的 [ShowCultureGroupNameWithNoTooltip('french_group')] 臣民中树立正统性。"
 flavor_nav.4.c: "[GetCharacter('nav_jeanne_ii_capet').GetNameWithNoTooltip] 已然放弃了 [GetCharacter('nav_jeanne_ii_capet').GetHerHis] 的主张：让我们转而专注于治理 [ROOT.GetCountry.GetNameWithNoTooltip]。"
 unlocks_enforce_the_capetian_claim_to_france_tt: "解锁$navarre_charles_ii_claim_to_france.title$[decision|e]"
 nav_appanage_support_for_french_throne_tt: "If [ROOT.GetCountry.GetNameWithNoTooltip] is an Appanage, reaching #G +190#! relations with other Appanage subjects of [GetCountry('FRA').GetNameWithNoTooltip] will incline them to to support us in a war against [GetCountry('FRA').GetNameWithNoTooltip] to seize the throne"
 flavor_nav.5.title: "与 [target_character_2.GetNameWithNoTooltip] 结盟"
 flavor_nav.5.entry: "与艾蒂安·马塞尔结盟"
 flavor_nav.5.desc: "Initially, many of [target_character.GetName]'s efforts to garner support were stalled, with multiple [fra_country.GetAdjectiveWithNoTooltip] lords expressing their loyalty to [fra_ruler.GetName] and rejecting [target_character.GetName]'s claim. But while [target_character.GetNameWithNoTooltip] has managed to sway some lesser [fra_country.GetAdjectiveWithNoTooltip] lords, many of [target_character.GetShortNameWithNoTooltip]'s advisors did not expect to hear that the prominent [target_character_2.GetName] was willing to throw [target_character_2.GetHerHis] support behind [target_character.GetNameWithNoTooltip]. Although a member of the [fra_country.GetAdjectiveWithNoTooltip] [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')], [target_character_2.GetNameWithNoTooltip] has long been a thorn in the side of [fra_ruler.GetNameWithNoTooltip], stalling many of [target_character_3.GetHerHis] efforts in the Estates-General. Although [target_character_2.GetNameWithNoTooltip] would prove an invaluable asset, some fear [target_character_2.GetHerHis] ambitions may diverge from those of [target_character.GetNameWithNoTooltip], and therefore [target_character_2.GetSheHe] may prove a liability.\n\nFurthermore, [target_character_2.GetNameWithNoTooltip] has brought news that the lords of [nrm_country.GetName] have grown discontent with [fra_ruler.GetNameWithNoTooltip], and would likely be willing to offer their support to [target_character.GetShortNameWithNoTooltip]."
 flavor_nav.5.a: "[target_character_2.GetNameWithNoTooltip]将证明是一位不可多得的盟友。"
 flavor_nav.5.a.entry: "艾蒂安·马塞尔将证明是一位不可多得的盟友。"
 flavor_nav.5.b: "让 [target_character_2.GetHerHim] 从 [fra_country.GetNameWithNoTooltip] 掠夺岁入输入我们的国库。"
 flavor_nav.5.b.entry: "让他把法兰西的岁入源源不断地输入我们的国库。"
 flavor_nav.5.c: "断然拒绝 [target_character_2.GetHerHis] 的援助。我们将凭自己的力量夺取 [fra_country.GetNameWithNoTooltip]，无需 [target_character_2.GetHerHis] 的算计。"
 flavor_nav.5.c.entry: "断然拒绝他的援助。我们将凭自己的力量夺取法兰西，无需他的算计。"
 nav_decision_seizure_of_duchy_of_normandy_tt: "解锁 $nav_coercing_of_normandy.title$ [decision|e]"
 flavor_nav.6.title: "烈焰之终"
 flavor_nav.6.entry: "纳瓦拉的查理之焚死"
 flavor_nav.6.desc: "Although [target_character.GetName]'s health has declined in recent years, the [ROOT.GetCountry.GetGovernment.GetCourtTitle] was still stunned by the news that [target_character.GetSheHe] had died in a fire in [target_character.GetHerHis] chambers the previous night. Rumors swirling in the [ROOT.GetCountry.GetGovernment.GetCourtTitle] whispered that while being treated for [target_character.GetHerHis] illness, a candle fell into [target_character.GetNameWithNoTooltip]'s bed and set it ablaze.\n\n[our_ruler.GetName] now ascends the throne with fewer ambitions than [our_ruler.GetHerHis] predecessor, and many wonder how the scribes of [ROOT.GetCountry.GetName] will remember [target_character.GetNameWithNoTooltip]'s rule."
 flavor_nav.6.a: "[target_character.GetHerHis] reign will be remembered as an ambitious, but terrible one."
 flavor_nav.6.b: "[target_character.GetSheHe] shall be remembered as the Conqueror of [GetCountry('FRA').GetNameWithNoTooltip]!"
 flavor_nav.6.c: "[target_character.GetSheHe] shall be remembered for [target_character.GetHerHis] shift towards [ROOT.GetCountry.GetNameWithNoTooltip], despite [target_character.GetHerHis] [ShowCultureGroupNameWithNoTooltip('french_group')] origins."
 flavor_nav.6.d: "我们理应将目光转向未来。"
 flavor_nav.7.title: "有争议的边境地区"
 flavor_nav.7.entry: "边境地区的分割"
 flavor_nav.7.desc: "Although relations between [ROOT.GetCountry.GetName] and [cas_country.GetName] have been hostile in the past, the rulers of [cas_country.GetNameWithNoTooltip] have never sought a full conquest of the [ROOT.GetCountry.GetFlavorRank]. However, in the borderlands of [ShowProvinceDefinitionName('biscay_province')], [ShowProvinceDefinitionName('gipuzkoa_province')], and [ShowProvinceDefinitionName('alava_province')], tensions have been mounting between the more powerful local families for some time over the region's poorly defined borders.\n\nWhile representatives for [cas_country.GetName] and [our_ruler.GetName] have worked towards resolving the border disputes, the outbreak of the [ShowDisasterName('castilian_civil_war')] in [cas_country.GetNameWithNoTooltip] has greatly stalled further negotiations, resulting in even more strife between the prominent regional dynasties.\n\nWith [cas_country.GetNameWithNoTooltip] now mired in internal conflict, representatives from these local families have petitioned [our_ruler.GetNameWithNoTooltip] to launch an invasion to claim the disputed lands."
 flavor_nav.7.a: "若这些领土争端得不到解决，恐将继续激怒 [ROOT.GetCountry.GetAdjectiveWithNoTooltip] 家族。"
 flavor_nav.7.b: "暂停一切进一步的外交谈判：我们必须确保对该地区的主张稳如磐石！"
 flavor_nav.8.title: "权力真空蔓延至 [ROOT.GetCountry.GetNameWithNoTooltip]"
 flavor_nav.8.entry: "权力真空蔓延至纳瓦拉"
 flavor_nav.8.desc: "While the [ShowDisasterName('castilian_civil_war')] has ended, the aftermath throughout [ShowRegionName('iberia_region')] are still being felt. With much of the borderlands now less garrisoned, many of the bad blood between families of the region has evolved into open warfare.\n\nDue to the low strength of [cas_country.GetName], the intensity of the conflict of the region would prove a daunting task for the [ROOT.GetCountry.GetGovernment.GetCourtTitle] of [ROOT.GetCountry.GetName] to resolve alone."
 flavor_nav.8.a: "危险的时局正等待着 [ROOT.GetCountry.GetNameWithNoTooltip]。"
 nav_end_blood_feud_decision_enabled_tt: "解锁 $nav_end_the_blood_feuds.title$ [decision|e]"
 nav_sow_division_in_the_borderlands_enabled_tt: "解锁 $nav_sow_division_in_the_borderlands.title$ [decision|e]"
 flavor_nav.9.title: "[ShowProvinceDefinitionNameWithNoTooltip('biscay_province')]的解体"
 flavor_nav.9.entry: "比斯开的解体"
 flavor_nav.9.desc: "Though control of [ShowProvinceDefinitionName('biscay_province')] has long been contested by [cas_country.GetName] and [ROOT.GetCountry.GetName], the region has been home to many prominent families, of which the Haro dynasty have served as the most influential and faithful vassals. However, [cas_country.GetName] have taken to directly dissolving titles in the region, and subsequently annexing areas within [ShowProvinceDefinitionNameWithNoTooltip('biscay_province')] that were in dispute.\n\nThese actions by [cas_country.GetNameWithNoTooltip] have greatly enraged the Haro family, who have urged the [ROOT.GetCountry.GetGovernment.GetCourtTitle] to fund the rebels in [ShowProvinceDefinitionNameWithNoTooltip('biscay_province')] as to crack down on those who sided with [cas_country.GetAdjectiveWithNoTooltip]'s annexation of the region."
 flavor_nav.9.a: "我们不能答应哈罗家族的请求，否则将招致 [cas_country.GetAdjectiveWithNoTooltip] 的愤怒。"
 flavor_nav.9.a.entry: "我们不能答应哈罗家族的请求，否则将招致卡斯蒂利亚的愤怒。"
 flavor_nav.9.b: "支持哈罗家族煽动当地的混乱局势。"
 flavor_nav.10.title: "教会的呼召"
 flavor_nav.10.entry: "$flavor_nav.10.title$"
 flavor_nav.10.desc: "[target_character.GetName]——我们[ROOT.GetCountry.GetGovernment.GetRuler.GetName]最年长的女儿，正等待护送她前往[ShowLocationName('paris')]开始新生活的随行队伍。\n\n她出生时，群星仿佛都在为她微笑，作为父母全部财产的继承人，但这一切已成过往。她与[GetCountry('ARA').GetGovernment.GetRuler.GetName]的婚约被取消，如今反而成为她妹妹[target_sister.GetShortName]的阻碍。\n\n现在她将加入[ShowLocationNameWithNoTooltip('paris')]的[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]，侍奉我主基督。\n\n不过仍有人认为，她或许还能为国家效力，成为其他外交谈判中的潜在筹码。"
 flavor_nav.10.a: "她将成为一名修女。"
 flavor_nav.10.a.entry: "运用王室权威，以阻止进一步的流血冲突。"
 flavor_nav.10.b: "她仍有利用价值。"
 flavor_nav.11.title: "受[ROOT.GetCountry.GetAdjectiveWithNoTooltip]支持的家族在[ShowScriptedGeographyNameWithNoTooltip('nav_contested_basque_borderlands')]取得优势"
 flavor_nav.11.entry: "受纳瓦拉支持的家族在边境地区取得优势"
 flavor_nav.11.desc: "Although the conflicts between the Pro [ROOT.GetCountry.GetAdjective] and [GetCountry('CAS').GetAdjective] families in the [ShowScriptedGeographyName('nav_contested_basque_borderlands')] has left a devastating effect on the region, [ROOT.GetCountry.GetAdjective] families have managed to do the near impossible, and restore much of [ROOT.GetCountry.GetNameWithNoTooltip]'s influence over the [ShowScriptedGeographyNameWithNoTooltip('nav_contested_basque_borderlands')]. While [GetCountry('CAS').GetNameWithNoTooltip] may still maneuver to reassert its control over the region, it will undoubtedly prove a costly affair for the [GetCountry('CAS').GetAdjectiveWithNoTooltip] [GetCountry('CAS').GetGovernment.GetCourtTitle]."
 flavor_nav.11.a: "让此事为一个更强大的 [ROOT.GetCountry.GetNameWithNoTooltip] 铺平道路。"
 navarre_gains_castile_basque_lands_tt: "除非 [GetCountry('CAS').GetNameWithNoTooltip] 决定采取果断措施以维持对该领土的控制，否则 [GetCountry('CAS').GetName] 在 [ShowScriptedGeographyName('nav_contested_basque_borderlands')] 拥有的所有地区都极有可能转归 [ROOT.GetCountry.GetName] 所有"
 flavor_nav.12.title: "兄弟会的强化"
 flavor_nav.12.entry: "$flavor_nav.12.title$"
 flavor_nav.12.desc: "Although the Hermandades of [ROOT.GetCountry.GetName] have proven capable allies in the past, the decades of blood feuds between various families of [ROOT.GetCountry.GetAdjectiveWithNoTooltip] has reached a boiling point.\n\nMany members of the [ROOT.GetCountry.GetGovernment.GetCourtTitle] have contributed funds to sponsor the [ROOT.GetCountry.GetGovernment.GetAdjective|U] branch of the Hermandades. Although an expensive affair, once empowered, the Hermandades will help enforce [our_ruler.GetName]'s authority over the feuding families and help rein them in for good."
 flavor_nav.12.a: "兄弟会终将平息这些家族纷争。"
 flavor_nav.13.title: "[target_character.GetNameWithNoTooltip] 与 [scope_our_heir.GetNameWithNoTooltip] 的教导"
 flavor_nav.13.entry: "胡安·德·博蒙特与继承人的教导"
 flavor_nav.13.desc: "尽管博蒙特家族在 [ROOT.GetCountry.GetName] 中掌有影响力已有一段时日，但他们主动提出要亲自教导 [scope_our_heir.GetName] ，此事仍令人意外。虽然 [target_character.GetName] 素来以正直闻名，但一些顾问担忧， [target_character.GetHerHis] 提出的教导之议或许只是拉拢 [scope_our_heir.GetNameWithNoTooltip] ——未来将统治 [ROOT.GetCountry.GetAdjectiveWithNoTooltip] 之人——的手段。"
 flavor_nav.13.a: "[target_character.GetHeShe] would make for an excellent tutor."
 flavor_nav.13.a.entry: "他会是一位出色的教师。"
 flavor_nav.13.b: "我们不能冒险让 [target_character.GetHerHim] 对我们的 [scope_our_heir.GetNameWithNoTooltip] 施加影响。"
 flavor_nav.13.b.entry: "我们不能冒险让他对我们的继承人施加影响。"
 flavor_nav.14.title: "[scope_our_consort.GetNameWithNoTooltip] 与 [target_character.GetNameWithNoTooltip]"
 flavor_nav.14.entry: "王妃的影响力与佩德罗·德·佩拉尔塔"
 flavor_nav.14.desc: "阿格拉蒙特家族是 [ROOT.GetCountry.GetGovernment.GetCourtTitle] 中的显赫家族之一，他们在 [target_character.GetName] 治下积累了相当大的影响力，同时也与 [scope_our_consort.GetName] 建立了密切的合作关系。虽然他们的付出为 [ROOT.GetCountry.GetName] 带来了成果，但仍有人担忧，其算计背后或许隐藏着更为阴暗的目的。"
 flavor_nav.14.a: "阿格拉蒙特家族一直忠心效力于我们。"
 flavor_nav.14.b: "[target_character.GetHerHis] influence with [scope_our_consort.GetNameWithNoTooltip] is concerning: move to seperate them."
 flavor_nav.14.b.entry: "他对配偶的影响令人担忧：设法将二人分开。"
 flavor_nav.15.title: "[the_legal_heir.GetNameWithNoTooltip]的篡位阴云"
 flavor_nav.15.entry: "继承人的篡位阴云"
 flavor_nav.15.desc: "Though [our_ruler.GetName] has maintained a steady rule, [our_ruler.GetSheHe] has recently become bedridden and ill. Fearing the end of the [ROOT.GetCountry.GetGovernment.GetRulerTitle]'s life is near, Agramontese supporters loyal to [the_consort_usurper.GetName] have quietly crowned [the_consort_usurper.GetHerHim] the new ruler of [ROOT.GetCountry.GetName].\n\nWhile [the_legal_heir.GetNameWithNoTooltip] is away from [ROOT.GetCountry.GetGovernment.GetCourtTitle], some among the Beaumonteses have secretly sent letters to [the_legal_heir.GetNameWithNoTooltip] to inform [the_legal_heir.GetHerHim] of the betrayal, hoping to crush the Agramontese plot before it can come to fruition."
 flavor_nav.15.a: "[the_consort_usurper.GetNameWithNoTooltip] 更适合领导 [ROOT.GetCountry.GetNameWithNoTooltip]。"
 flavor_nav.15.a.entry: "宫廷更适合领导纳瓦拉。"
 flavor_nav.15.b: "Side with [the_legal_heir.GetNameWithNoTooltip], the legal ruler of [ROOT.GetCountry.GetNameWithNoTooltip!"
 flavor_nav.15.b.entry: "支持我们的继承人，纳瓦拉合法的统治者！"
 flavor_nav.15.historical_info: "共治君主布兰卡一世与胡安二世曾颁令，规定他们的儿子——维亚纳亲王查理——应在布兰卡去世后继承纳瓦拉王位。然而，王位并未传给查理，胡安二世选择继续掌控纳瓦拉的领地，实际上自立为王，推翻了自己的儿子。在博蒙特派与阿格拉蒙特派的支持下，父子二人后来在纳瓦拉内战中兵戎相见，最终胡安二世获胜，保住了纳瓦拉的王位。"
 flavor_nav.16.title: "[target_country.GetAdjectiveWithNoTooltip]的主张"
 flavor_nav.16.desc: "在整个[ShowRegionName('france_region')]赢得了相当多的支持后，[target_character.GetName]已公开宣称对[ShowRegionNameWithNoTooltip('france_region')]王位的主张，并派遣使者遍及[ShowRegionNameWithNoTooltip('france_region')]，给予最后一次机会加入[target_character.GetHerHim]为夺取王位而进行的[target_character.GetHerHis]行动。尽管[target_character.GetShortNameWithNoTooltip]已在我们的[ROOT.GetCountry.GetGovernment.GetCourtTitle]中大获人心，但议会中有些人担心，若[target_character.GetSheHe]成功，[target_character.GetSheHe]将极大动摇[ShowRegionNameWithNoTooltip('france_region')]的稳定。"
 flavor_nav.16.a: "我们将宣布支持 [target_character.GetNameWithNoTooltip]。"
 flavor_nav.16.b: "不介入此次冲突。"
 flavor_nav.16.c: "[target_character.GetSheHe] must be stopped."
 flavor_nav.17.title: "[ShowScriptedGeographyNameWithNoTooltip('nav_contested_basque_borderlands')] 的困境"
 flavor_nav.17.desc: "我们在 [ShowScriptedGeographyName('nav_contested_basque_borderlands')] 与 [GetCountry('NAV').GetName] 之间的许多领土已被亲 [GetCountry('NAV').GetAdjectiveWithNoTooltip] 派系占领，许多效忠于 [ROOT.GetCountry.GetName] 的 [ShowCultureName('basque')] 家族因此陷入困顿。尽管 [ROOT.GetCountry.GetGovernment.GetCourtTitle] 中仍有人认为此地区尚未彻底失去，但要重新确立权威将十分困难，因为当地许多百姓如今已依附于势力强大的 [GetCountry('NAV').GetAdjectiveWithNoTooltip] 家族。"
 flavor_nav.17.a: "让边境地区脱离，归入 [GetCountry('NAV').GetNameWithNoTooltip]。"
 flavor_nav.17.b: "我们将铭记这次 [ShowCultureNameWithNoTooltip('basque')] 民族的叛乱。"
 flavor_nav.17.c: "不惜一切代价，迅速平定叛乱！"
 flavor_nav.20.title: "奥利特的圣方济各会修道院"
 flavor_nav.20.entry: "$flavor_nav.20.title$"
 flavor_nav.20.desc: "作为虔诚的信徒，[ROOT.GetCountry.GetGovernment.GetRuler.GetName]无法容忍[ShowLocationName('olite')]圣方济各修道院工程的缓慢进展。\n\n这座修道院开工已逾百年，至今仍未完工。\n\n尽管加速工程将耗费国库，但此举能极大提升当地声望与我们的威望。"
 flavor_nav.20.a: "赞美天主！"
 flavor_nav.20.b: "既然等了这么久，不妨再等等。"
 flavor_nav.20.historical_info: "据传，亚西西的圣方济各在1213至1214年朝圣圣地亚哥的旅途中，创立了奥利特修道院。\n\n自特奥巴尔多二世国王奠定基础以来，纳瓦拉的历代君主，尤其是让娜二世和夏尔二世，不断提供财政和精神上的支持，推动了修道院的发展和深化了其宗教信仰。\n\n随着时间的流逝，修道院经历了多次变革，最终演变成一所“宗徒学院”，专门用于培训和派遣传教士前往西班牙和美洲。在1795年的比利牛斯山战争期间，修道院还曾被用作战地医院。"
 flavor_nav.21.title: "教会的呼召"
 flavor_nav.21.entry: "$flavor_nav.21.title$"
 flavor_nav.21.desc: "[target_character.GetName]——我们[ROOT.GetCountry.GetGovernment.GetRuler.GetName]最年长的女儿，正等待护送她前往[ShowLocationName('paris')]开始新生活的随行队伍。\n\n她出生时，群星仿佛都在为她微笑，作为父母全部财产的继承人，但这一切已成过往。她与[GetCountry('ARA').GetGovernment.GetRuler.GetName]的婚约被取消，如今反而成为她妹妹[target_sister.GetShortName]的阻碍。\n\n现在她将加入[ShowLocationNameWithNoTooltip('paris')]的[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]，侍奉我主基督。\n\n不过仍有人认为，她或许还能为国家效力，成为其他外交谈判中的潜在筹码。"
 flavor_nav.21.a: "她将成为一名修女。"
 flavor_nav.21.b: "她仍有利用价值。"
 flavor_nav.21.historical_info: "Despite the fact that Jeanne was betrothed to Peter IV of Aragon, the marriage never happened. Historians propose that she may have suffered a condition or illness that made her unappealing as a spouse. Maria, her younger sister, took her place and married Peter instead.\n\nBecause this marriage happened, Jeanne was forced to renounce her succession rights, and entered the Franciscan Abbey of Longchamp near Paris as a member of the Poor Clares."
 flavor_nav.30.title: "图德拉灌溉工程"
 flavor_nav.30.entry: "$flavor_nav.30.title$"
 flavor_nav.30.desc: "即便[ROOT.GetCountry.GetGovernment.GetRulerTitle]常驻[ShowRegionName('france_region')]领地，[ROOT.GetCountry.GetGovernment.GetRuler.GetSheHe]仍持续关注[ROOT.GetCountry.GetLongName]的发展蓝图，不断提出新的开发项目。\n\n在[ROOT.GetCountry.GetFlavorRank]南部的[ShowLocationName('tudela')]周边地区，土地肥沃但水源稀缺，干旱问题长期困扰着当地居民。为了解决这一难题，[ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis]计划开凿水渠以改善灌溉系统，这将使作物生长更加茁壮，并显著提升作物产量。"
 flavor_nav.30.a: "这能极大地肥沃这些土地。"
 flavor_nav.30.b: "我们不能纵容国库承担这些开销。"
 flavor_nav.30.historical_info: "在让娜二世和菲利佩三世的统治时期，纳瓦拉王国各地实施了一系列经济发展项目，其中包括扩展王国南部主要城镇图德拉的灌溉系统。"
 flavor_nav.40.title: "《纳瓦拉法典》的抄本"
 flavor_nav.40.entry: "$flavor_nav.40.title$"
 flavor_nav.40.desc: "随着[ROOT.GetCountry.GetGovernment.GetRulerTitle]越来越多地参与王国的日常事务，已下令为[ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis]本人制作一份#italic 《纳瓦拉法典》#!的抄本。\n\n这份抄本将制作精美，采用最优质的皮革封面，并由王国最熟练的抄写员书写。按照传统，文本将使用[spanish_language.GetName]撰写，其中夹杂着一些有趣的[basque_language.GetName]术语。\n\n遗憾的是，我们的[ROOT.GetCountry.GetGovernment.GetRulerTitle]讲的是[french_language.GetName]，并不懂纳瓦拉罗曼语。"
 flavor_nav.40.a: "顺带制作一部[french_language.GetNameWithNoTooltip]译本。"
 flavor_nav.40.a.entry: "顺带制作一部[ShowLanguageNameWithNoTooltip('french_language')]译本。"
 flavor_nav.40.b: "或许是时候让我们的统治者学习这片土地的语言了。"
 flavor_nav.40.c: "如果人人都说巴斯克语，那么它就应该成为官方语言。"
 flavor_nav.40.historical_info: "尽管纳瓦拉王国的大部分人口很可能以巴斯克语（#italic Lingua Navarrorum#!）为母语，但王国的官方文件主要使用纳瓦拉‑阿拉贡语（#italic Ydiomate Navarre Terrae#!、#italic Ydiomate Navarre#!或#italic Lengoage de Navarra#!），因为曾经作为通用宫廷语言的奥克语逐渐衰落。\n\n此外，自1234年香槟家族入主纳瓦拉王国以来，法语变体也在官方文件中变得日益普遍。"
 flavor_nav.50.title: "阿尔赫西拉斯之围"
 flavor_nav.50.entry: "$flavor_nav.50.title$"
 flavor_nav.50.desc: "[target_country.GetAdjective]边境的战争消息已传至王国。[GetCountry('CAS').GetName]已重新对[target_country.GetNameWithNoTooltip]发起十字军征讨，[target_character.GetName]迅速返回[ROOT.GetCountry.GetName]参战。\n\n尽管我们的[ROOT.GetCountry.GetFlavorRank]似乎难以从中获益，但我们始终认为帮助邻邦将[ShowReligionGroupAdjective('muslim')]驱逐出[ShowRegionName('iberia_region')]是我们的责任。"
 flavor_nav.50.a: "[target_character.GetShortNameWithNoTooltip]将指挥我们的战士。"
 flavor_nav.50.a.entry: "角色将指挥我们的战士。"
 flavor_nav.50.b: "我们必须派遣士兵参加十字军，但我们不会派[target_character.GetShortNameWithNoTooltip]去。"
 flavor_nav.50.b.entry: "我们必须派遣士兵参加十字军，但我们不会派他去。"
 flavor_nav.50.c: "这不关[ROOT.GetCountry.GetNameWithNoTooltip]的事。"
 flavor_nav.50.c.entry: "这不关我们的事。"
 flavor_nav.50.historical_info: "1343年，纳瓦拉国王菲利佩准备加入针对格拉纳达的十字军，履行他作为伊比利亚众王国统治者之一的责任。尽管兵力较少，但得到了比斯开湾物资支持的菲利佩在阿尔赫西拉斯之围中发挥了重要作用。但不幸的是，菲利佩染上了疾病，并最终于1343年9月去世。他的遗体被送回潘普洛纳安葬，而他的心脏则被送至巴黎。他的遗孀让娜得到了教宗克莱孟六世的慰问。阿尔赫西拉斯最终被攻陷，让娜继续统治直到于1349年去世，并将王位传给了他们的儿子，夏尔二世。"
 flavor_nav.60.title: "女王的遗愿"
 flavor_nav.60.entry: "$flavor_nav.60.title$"
 flavor_nav.60.desc: "[target_character.GetName]去世了，人们宣读了她的遗嘱。在遗嘱中，[target_character.GetHeSheFormal]要求她的继承人为[ShowLocationName('olite')]的王家圣玛利亚教堂添加一座礼拜堂。\n\n交际花中有人建议将这座礼拜堂献给圣母始胎。这说服了我们的统治者[ROOT.GetCountry.GetGovernment.GetRuler.GetName]，因为[ROOT.GetCountry.GetGovernment.GetRuler.GetSheHe]很了解[target_character.GetShortNameWithNoTooltip]有多么虔诚。"
 flavor_nav.60.a: "母亲的遗愿必须遵从。"
 flavor_nav.60.b: "我们的钱有更好的用途。"
 flavor_nav.60.historical_info: "女王让娜二世于1349年死于黑死病时，在遗嘱中要求她的儿子夏尔二世在奥利特王家圣玛利亚哥特教堂投资建造一座礼拜堂。\n\n这座教堂曾被埃夫勒家族用于宗教活动，其风格受到了巴黎圣母院的影响。"
 flavor_nav.70.title: "纳瓦拉审计院"
 flavor_nav.70.entry: "$flavor_nav.70.title$"
 flavor_nav.70.desc: "王国的财政事务至关重要，我们的[ROOT.GetCountry.GetGovernment.GetRuler.GetName]认为，[ROOT.GetCountry.GetLongName]若能设立一个常设机构来管理这些事务，将大有裨益。\n\n借鉴[GetCountry('FRA').GetLongName]的类似机构，我们将使国家在经济上更具活力，并更好地应对当前微妙局势可能带来的财政困境。"
 flavor_nav.70.a: "我们将设立一个常设机构。"
 flavor_nav.70.historical_info: "审计院的历史可追溯至#italic 听审法官#!（词源为西语的#italic “听取”#!），这些官员至少从1258年，第一本审计账册出台时起就负责管理并监督王室财政。该机构深受法国类似机构（如巴黎的#italic Chambre des Comptes#!）影响，由夏尔二世国王确立为常设机构，负责控制王国的开支，并在财政事务上为统治者提供建议。\n\n它被认为是西班牙最古老的审计法庭，至今仍在运作，为纳瓦拉特许自治区议会服务。"
 #Decisions
 navarre_charles_ii_claim_to_france.title: "对 [GetCountry('FRA').GetNameWithNoTooltip] 的正统主张"
 navarre_charles_ii_claim_to_france.desc: "Although [GetCharacter('nav_jeanne_ii_capet').GetName] abandoned [GetCharacter('nav_jeanne_ii_capet').GetHerHis] claim to [GetCountry('FRA').GetNameWithNoTooltip], [GetCharacter('nav_charles_ii_evreux').GetName] still maintains a direct blood lineage to the old [GetCharacter('fra_louis_x_capet').GetName]. Even should the [ShowHeirSelectionName('salic_law')] wrongly decree [GetCharacter('nav_charles_ii_evreux').GetNameWithNoTooltip] ineligible, [GetCharacter('nav_charles_ii_evreux').GetName]'s claim is still stronger than that of the current rulers of [GetCountry('FRA').GetNameWithNoTooltip]!"
 navarre_charles_ii_claim_to_france.a: "如今正是重申我们对 [GetCountry('FRA').GetNameWithNoTooltip] 的正统主张的时候！"
 navarre_charles_ii_claim_to_france.b: "The time has come to launch a civil war to claim the throne!"
 navarre_charles_ii_claim_to_france.c: "No, now is not the time to act."
 nav_appanage_willingness_to_join_tt: "Reaching #G +190#! relations with other Appanage subjects of [GetCountry('FRA').GetNameWithNoTooltip] will make them incline to support us in a war against [GetCountry('FRA').GetNameWithNoTooltip] to seize the throne"
 nav_coercing_of_normandy.title: "胁迫 [GetCountry('NRM').GetNameWithNoTooltip]"
 nav_coercing_of_normandy.desc: "由于身处[ShowSituationNameWithNoTooltip('hundred_years_war')]前线，[GetCountry('NRM').GetName]的许多领主对[GetCountry('FRA').GetName]现任统治者日益不满。通过继承[GetCharacter('nav_philip_iii_evreux').GetName]的领地，[GetCharacter('nav_charles_ii_evreux').GetName]与[GetCountry('NRM').GetFlavorRank]中的人士保持着密切联系，其中一些人或许愿意接受[GetCharacter('nav_philip_iii_evreux').GetShortNameWithNoTooltip]作为他们的新领主。"
 nav_coercing_of_normandy.a: "夺取 [GetCountry('NRM').GetNameWithNoTooltip] 的控制权！"
 nav_end_the_blood_feuds.title: "终结血仇"
 nav_end_the_blood_feuds.desc: "自[ShowDisasterName('castilian_civil_war')]结束以来，[GetCountry('NAV').GetName]的许多地区一直深陷各家族间长久的血仇之中，这些家族因[GetCountry('CAS').GetAdjectiveWithNoTooltip]地区影响力的削弱而愈发肆无忌惮。如今[GetCountry('NAV').GetAdjectiveWithNoTooltip]的影响力已然增强，我们可以借此彻底终结这些仇怨。"
 nav_end_the_blood_feuds.a: "权威已然恢复！"
 nav_sow_division_in_the_borderlands.title: "在边境地带散播分裂"
 nav_sow_division_in_the_borderlands.desc: "由于 [GetCountry('CAS').GetAdjective] 在 [ShowScriptedGeographyName('nav_contested_basque_borderlands')] 的影响力已大不如前，若我们选择支持效忠 [GetCountry('NAV').GetName] 的家族对仍效忠 [GetCountry('CAS').GetNameWithNoTooltip] 的其他家族展开公开战争，该地区持续不断的家族仇怨或许能派上用场。虽然此举代价不菲，但 [ShowScriptedGeographyNameWithNoTooltip('nav_contested_basque_borderlands')] 或许能再度与 [GetCountry('NAV').GetNameWithNoTooltip] 合并。"
 nav_sow_division_in_the_borderlands.a: "准许摧毁敌对家族的领地。"
 nav_sow_division_in_the_borderlands.b: "焚烧边境地带的外围村落。"
 nav_sow_division_in_the_borderlands.c: "在[GetCountry('CAS').GetAdjectiveWithNoTooltip]治下的领地内散播猜忌。"
 nav_sow_division_in_the_borderlands_a_tt: "凡由[GetCountry('CAS').GetName]在[ShowScriptedGeographyName('nav_contested_basque_borderlands')]内[owned|e]的每个[location|e]，将获得[ShowModifier('nav_feud_crossfire')]，持续3年，并将严重损失[prosperity|e]与[pop_satisfaction|e]"
 nav_sow_division_in_the_borderlands_b_tt: "凡由[GetCountry('CAS').GetName]在[ShowScriptedGeographyName('nav_contested_basque_borderlands')]内[owned|e]的每个[location|e]，将获得[ShowModifier('nav_destructive_feuds')]，持续3年，并将小幅损失[prosperity|e]、[pop_satisfaction|e]与[development|e]"
 nav_sow_division_in_the_borderlands_c_tt: "凡由[GetCountry('CAS').GetName]在[ShowScriptedGeographyName('nav_contested_basque_borderlands')]内[owned|e]的每个[location|e]，将获得[ShowModifier('nav_widespread_distrust_caused_by_feuds')]，持续3年，并将小幅损失[prosperity|e]、[pop_satisfaction|e]与[control|e]"
