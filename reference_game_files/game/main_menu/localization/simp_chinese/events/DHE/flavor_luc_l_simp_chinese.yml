l_simp_chinese:
 flavor_luc.1.entry: "$flavor_luc.1.title$"
 flavor_luc.1.title: "[ShowLocationNameWithNoTooltip('lucca')]的[ShowGoodsNameWithNoTooltip('silk')]产业"
 flavor_luc.1.desc: "[ShowGoodsName('silk')]被视为[ShowContinentName('europe')]最稀有的物产之一，因此被许多[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]视为制作衣物最上乘的材料。[ShowLocationName('lucca')]已经是桑蚕的栖息之地，也拥有初具规模的[ShowGoodsNameWithNoTooltip('silk')]产业，尽管其产量尚未达到全部潜力。[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]和[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]都认为投资这一商品将使我们能够扩大[ShowGoodsName('fine_cloth')]的生产，超越[ShowRegionName('italy_region')]半岛上任何试图与我们竞争的对手。"
 flavor_luc.1.a: "我们将投资这些桑蚕。"
 flavor_luc.1.b: "要是他们想追求利润，就得自己花钱。"
 flavor_luc.2.entry: "$flavor_luc.2.title$"
 flavor_luc.2.title: "[ShowLocationNameWithNoTooltip('lucca')]的[ShowGoodsNameWithNoTooltip('fine_cloth')]贸易"
 flavor_luc.2.desc: "[ShowLocationName('lucca')]以发达的[ShowGoodsName('fine_cloth')]产业而自豪。[ShowRegionName('italy_region')]半岛还有许多其他城市在生产数量上远超我们，但它们无法媲美我们精纺布料的上乘品质——这些精纺品由最杰出的市民凭借多年的工艺经验精心制作而成。即便是最富有的人也将[ROOT.GetCountry.GetAdjective]风格的服饰视为奢侈品，这一事实促使产量不断提高以满足需求。"
 flavor_luc.2.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 flavor_luc.2.a.entry: "太好了！"
 luc_fine_cloth_demand: "精纺品需求"
 flavor_luc.3.entry: "$flavor_luc.3.title$"
 flavor_luc.3.title: "抵达[ShowLocationNameWithNoTooltip('london')]"
 flavor_luc.3.desc: "我们[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]中更具投机精神的成员构想了一项在[target_market.GetName]内的扩张计划。具体而言，许多人已经制定了将生意迁往[ShowLocationName('london')]的计划，该地由[target_country.GetName]所有，并且对我们态度友好。\n\n这一提议已呈交[ROOT.GetCountry.GetGovernment.GetCourtTitle]，部分成员对扩展我们的贸易网络充满热情。然而，另一些人则指出，这可能会引发[target_country.GetNameWithNoTooltip]的不信任，外国商人在当地可能不受欢迎，并且与他们寻求合作比竞争对我们更为有利。"
 flavor_luc.3.a: "我们将扩展贸易网络。"
 flavor_luc.3.b: "与其竞争，不如合作。"
 flavor_luc.4.entry: "$flavor_luc.4.title$"
 flavor_luc.4.title: "自由万岁！"
 flavor_luc.4.desc: "纵观[ROOT.GetCountry.GetName]的历史，我们的人民曾历经无数挫败与屈辱。然而，即便如此，我们依然屹立不倒。\n\n屈服并接受失败，绝非[ROOT.GetCountry.GetAdjectiveWithNoTooltip]公民的行事风格。相反，每当危机降临或我军在战斗中遭遇失利，我们随时准备挺身而出，保卫[ShowLocationName('lucca')]。"
 flavor_luc.4.a: "无论胜算几何，我们永不示弱！"
 flavor_luc.4.b: "最好的防御就是犀利的进攻。"
 flavor_luc.5.entry: "$flavor_luc.5.title$"
 flavor_luc.5.title: "[ShowBuildingTypeNameWithNoTooltip('walls_of_lucca')]"
 flavor_luc.5.desc: "战争与饥荒或许并不总是降临[ShowLocationName('lucca')]，但当它们来临时，每位公民都会遭受苦难。城墙上的守卫时刻警惕着敌人，他们深知一旦战败，家园便将危在旦夕。[ROOT.GetCountry.GetGovernment.GetCourtTitle]中的许多人提议扩建城墙，使其尽可能宏伟，以赢得人民的信心并确保每位公民的安全。"
 flavor_luc.5.a: "我们将扩建城墙。"
 flavor_luc.5.b: "我们会确保军事失败绝不会发生。"
 flavor_luc.1000.entry: "$flavor_luc.1000.title$"
 flavor_luc.1000.title: "出售[GetCountry('LUC').GetNameWithNoTooltip]"
 flavor_luc.1000.desc: "[target_country.GetName]当前的战事为我们提供了一个转换效忠的契机——当然，这取决于我们的意愿。[ROOT.GetCountry.GetGovernment.GetCourtTitle]内部许多人建议，不必通过武力达成这一目标，而是可以将我们自身“卖给”[GetCountry('PIS').GetName]，既为了牟利，也是为了示好。"
 flavor_luc.1000.a: "让我们向[target_country.GetNameWithNoTooltip]提出这一建议。"
 flavor_luc.1000.a.entry: "让我们向宗主提出这一建议。"
 flavor_luc.1000.b: "如果想要独立，就必须通过战争。"
 flavor_luc.1001.title: "$flavor_luc.1000.title$"
 flavor_luc.1001.desc: "正值与[enemy_country.GetName]的战事日益激烈之际，[GetCountry('LUC').GetName]的使节到访了。他们讨论了当前的战况，并指出[GetCountry('PIS').GetName]一直在调兵遣将，意图对我方实施军事干预。为防患于未然，他们提议将[GetCountry('LUC').GetNameWithNoTooltip]自身作为换取和平的筹码——这同时也是出于其自身经济利益的考量。"
 flavor_luc.1001.a: "我们不能再在[ShowRegionNameWithNoTooltip('italy_region')]树敌了。"
 flavor_luc.1001.b: "我不会出售我们的臣属。"
 flavor_luc.1002.title: "$flavor_luc.1000.title$"
 flavor_luc.1002.desc: "[target_country.GetName]向我们提出了一项特殊交易。他们希望将其附属国[GetCountry('LUC').GetName]转让给我们，作为交换，我们将与其达成停战协议，并且保证不介入他们当前与[enemy_country.GetName]的冲突。"
 flavor_luc.1002.a: "一笔划算的交易。"
 flavor_luc.1002.b: "能用军队拿到的东西，为什么要花钱？"
 flavor_luc.1100.entry: "$flavor_luc.1100.title$"
 flavor_luc.1100.title: "互利同盟"
 flavor_luc.1100.desc: "我们目前在[ShowRegionName('italy_region')]的根基稳固，但若稍有疏忽，外部威胁仍可能浮现。为此，[ROOT.GetCountry.GetGovernment.GetCourtTitle]中许多人建议与[GetCountry('GEN').GetName]结盟。此举将使双方获益，确保任何试图征服这片土地的力量都将面对一个更强大、更团结的对手。"
 flavor_luc.1100.a: "这样的同盟将非常理想。"
 flavor_luc.1100.b: "我们应尝试通过扩张来巩固边界。"
 flavor_luc.1101.title: "$flavor_luc.1100.title$"
 flavor_luc.1101.desc: "[ShowRegionName('italy_region')]当前的紧张局势迫使许多国家不得不独自应对威胁，但这绝不意味着我们应当走向孤立。正因如此，来自[from_country.GetName]的使节才主动与我们商讨结盟的可能性。[target_character.GetName]与[target_character2.GetName]都将有能力捍卫自身的主权，甚至有望携手合作，共同抵御来自区域之外的威胁。"
 flavor_luc.1101.a: "这无疑对双方都有益处。"
 flavor_luc.1101.b: "他们不值得帮助。不妨考虑征服他们……"
