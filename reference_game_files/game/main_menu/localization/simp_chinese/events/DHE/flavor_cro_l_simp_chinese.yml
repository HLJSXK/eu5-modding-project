l_simp_chinese:
 flavor_cro.1000.title: "[ShowAreaNameWithNoTooltip('croatia_area')]和[ShowAreaNameWithNoTooltip('slavonia_area')]的统一"
 flavor_cro.1000.entry: "克罗地亚和斯拉沃尼亚的统合——克罗地亚"
 flavor_cro.1000.desc: "[GetCountry('TUR').GetName]的持续扩张对我们[ROOT.GetCountry.GetFlavorRank]构成了严重威胁，而[GetCountry('HUN').GetAdjectiveWithNoTooltip][GetCountry('HUN').GetGovernment.GetEstateNameWithNoTooltip('crown_estate')]的土地划分可能会产生敌人可以利用的弱点。由于这种情况，我们的[ROOT.GetCountry.GetGovernment.GetCourtTitle]建议[GetCountry('HUN').GetNameWithNoTooltip]将[ShowAreaName('croatia_area')]和[ShowAreaName('slavonia_area')]的行政区划合并。他们认为，这将大大提高我们的防御能力，缓解行政压力。"
 flavor_cro.1000.a: "执行该提案。"
 flavor_cro.1001.a.tt: "治下所有$SVN$[core|e]或[ShowAreaName('slavonia_area')]内[location|e]将被转让给[GetCountry('CRO').GetName]"
 flavor_cro.1000.b: "这会成为行政机构的负担。"
 flavor_cro.1000.historical_info: "历史上，斯拉沃尼亚在行政上与克罗地亚分离，由匈牙利王室下属的总督统治。然而，奥斯曼帝国的扩张重塑了该地区的政治格局，战争造成的破坏迫使人们向北逃离。1476年，马加什一世国王合并了克罗地亚和达尔马提亚总督区以及斯拉沃尼亚总督区，寻求更有效地协调防御奥斯曼帝国的入侵。合并真正完成于1558年，克罗地亚和斯拉沃尼亚的议会实现了政治整合和统一。"
 flavor_cro.1001.title: "$flavor_cro.1000.title$"
 flavor_cro.1001.desc: "我国在[GetCountry('CRO').GetName]的属臣遣使抵达[ROOT.GetCountry.GetGovernment.GetCourtTitle]，提议合并[ShowAreaName('croatia_area')]总督与[ShowAreaName('slavonia_area')]总督之职。他们声称，面对[GetCountry('TUR').GetAdjective]人的威胁，统一指挥将强化防御、减轻行政负担。"
 flavor_cro.1001.a: "统一的边疆有助于防御。"
 flavor_cro.1001.b: "[ShowAreaNameWithNoTooltip('slavonia_area')]属于[GetCountry('HUN').GetAdjectiveWithNoTooltip][GetCountry('HUN').GetGovernment.GetEstateNameWithNoTooltip('crown_estate')]。"
 flavor_cro.1001.b.entry: "[ShowAreaNameWithNoTooltip('slavonia_area')]属于$HUN_ADJ$$crown_estate$。"
 flavor_cro.1100.title: "[target_character.GetNameWithNoTooltip]的领地"
 flavor_cro.1100.entry: "伊万·内利皮奇的统治"
 flavor_cro.1100.desc: "一位名叫[target_character.GetName]的强大权贵对[ROOT.GetCountry.GetName]事务的影响力越来越大。在他的家乡，他成功地铲除了许多敌人，并解开了[GetCountry('HUN').GetAdjective][GetCountry('HUN').GetGovernment.GetEstateNameWithNoTooltip('crown_estate')]对当地事务的掌控。尽管许多人开始接受这一现实，认为这种安排有利，但也有人担心[GetCountry('HUN').GetNameWithNoTooltip]可能随时试图重申其权威。为了解决这种情况，有人建议，如果[target_character.GetNameWithNoTooltip]能承认[GetCountry('HUN').GetGovernment.GetEstateNameWithNoTooltip('crown_estate')]的权威，那么作为回报，[GetCountry('HUN').GetNameWithNoTooltip]也应该承认他对[ROOT.GetCountry.GetNameWithNoTooltip]的统治权。"
 flavor_cro.1100.a: "不要干预[GetCountry('HUN').GetGovernment.GetEstateNameWithNoTooltip('crown_estate')]。"
 flavor_cro.1100.a.entry: "不要干预$crown_estate$。"
 flavor_cro.1100.b: "送出提议。"
 flavor_cro.1100.historical_info: "克罗地亚贵族伊万·内利皮奇在推翻总督姆拉登二世·舒比奇之后，于1322年有效控制了克罗地亚的大部分地区。在他统治期间，克罗地亚总督头衔空缺，克罗地亚几乎完全脱离了匈牙利的统治。匈牙利王室或斯拉沃尼亚总督曾多次试图废黜内利皮奇，但最终都失败了。直到1345年伊万·内利皮奇去世后，匈牙利才重新确立了对克罗地亚的王室权力。"
 flavor_cro.1101.title: "[GetCountry('CRO').GetNameWithNoTooltip]寻求妥协"
 flavor_cro.1101.desc: "自[ShowCultureNameWithNoTooltip('dalmatian')|U][ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]于1322年的布利斯卡战役取得胜利以来，[GetCountry('CRO').GetName]一直由强大的权贵[target_character.GetName]主导，[GetCountry('HUN').GetAdjective][GetCountry('HUN').GetGovernment.GetEstateNameWithNoTooltip('crown_estate')]在当地的权威日益削弱。令人惊讶的是，[target_character.GetLastNameWithNoTooltip]已向[ROOT.GetCountry.GetGovernment.GetCourtTitle]派出特使，提出妥协方案。[target_character.GetSheHe|U]准备正式承认[GetCountry('HUN').GetAdjective][GetCountry('HUN').GetGovernment.GetEstateNameWithNoTooltip('crown_estate')]的权威，并宣誓效忠。作为回报，[target_character.GetSheHe]请求我们将承认[target_character.GetHerHim]是[GetCountry('CRO').GetNameWithNoTooltip]的合法统治者。"
 flavor_cro.1101.a: "联合必须得到维系。"
 flavor_cro.1101.b: "承认[target_character.GetHerHim]的合法地位。"
 flavor_cro.1101.b.entry: "承认其合法地位。"
 flavor_cro.1102.title: "[GetCountry('HUN').GetNameWithNoTooltip]驳回我们的宣称"
 flavor_cro.1102.desc: "我们的使节带回了令人不安的消息。[GetCountry('HUN').GetAdjective][GetCountry('HUN').GetGovernment.GetEstateNameWithNoTooltip('crown_estate')]拒绝了我方提议，拒不承认[target_character.GetName]为[GetCountry('CRO').GetName]之主，并坚称我们的[ROOT.GetCountry.GetFlavorRank]乃是共主邦联不可分割的一部分。尽管[ROOT.GetCountry.GetGovernment.GetCourtTitle]内普遍认为对此无可奈何，但亦有人主张采取极端手段：废除维系我方王权与[GetCountry('HUN').GetNameWithNoTooltip]之间的《登基协定》，并直接为为[target_character.GetLastNameWithNoTooltip]加冕，使其成为两百余年来[GetCountry('CRO').GetNameWithNoTooltip]首位本土国王。"
 flavor_cro.1102.a: "[ROOT.GetCountry.Custom('common_string_nothing_we_can_do')]。"
 flavor_cro.1102.a.entry: "$common_string_nothing_we_can_do_about_it$"
 flavor_cro.1102.b: "废除协定，为[target_character.GetLastNameWithNoTooltip]加冕！"
 flavor_cro.1102.b.entry: "废除协定，为其加冕！"
 flavor_cro.1103.title: "[GetCountry('CRO').GetNameWithNoTooltip]终止登基协定"
 flavor_cro.1103.desc: "只因我国拒绝承认[target_character.GetName]的权威，[GetCountry('CRO').GetName]当局决意采取远超各方预料的极端举措。他们宣布维系该国与我国[GetCountry('HUN').GetGovernment.GetEstateNameWithNoTooltip('crown_estate')]联合统治的《登基协定》无效作废！此外，[target_character.GetLastNameWithNoTooltip]已被拥立为他们新的[GetCountry('CRO').GetGovernment.GetRulerTitle]。"
 flavor_cro.1103.a: "决不能容忍如此叛乱！"
 flavor_cro.1103.b: "我们不会干涉。"
