l_simp_chinese:
 banu_al_wad: "阿卜杜勒瓦德部族"
 FATE_OF_TLEMCEN: "[ShowLocationNameWithNoTooltip('tlemcen')] 的命运"
 flavor_tle.1.title: "[capital_scope.GetNameWithNoTooltip]的陷落"
 flavor_tle.1.desc: "[ROOT.GetCountry.GetFlavorRank]首都[capital_scope.GetName]不幸落入可恶的敌人手中，更悲剧的是，我们敬爱的统治者[ruler_scope.GetName]和他的儿子在战斗中丧生。\n\n这严重打击了整个[ROOT.GetCountry.GetFlavorRank]的士气，让对抗我们的敌人变得无比困难。"
 flavor_tle.1.a: "[ROOT.GetCountry.Custom('common_string_negative')]"
 tle_morrocan_tlemcen_war: "如果 [target_location.GetName] 在 [target_war.GetName] 中被 [mor_scope.GetLongName] 占领，[mor_scope.GetName] 将能够强行将 [tle_scope.GetName] 变为 [ShowSubjectTypeName('fiefdom')]"
 tle_additional_warning: "必须尽快解除 [target_siege.GetName]！"
 flavor_tle.2.title: "[target.GetNameWithNoTooltip]的陷落"
 flavor_tle.2.desc: "[target.GetArea.GetName]的明珠[target.GetName]终于在我军的围攻下屈服，向我军强大的军队投降。城门一开，我军便冲入[target.GetRank.GetName]，试图占领主城堡，以期获得战利品和俘虏。城堡内有许多[target_country.GetGovernment.GetAdjective]家族的成员，我军士兵迅速将其擒获，押送至[from_country.GetAdjective]各位将领面前。这是否可能是[target_war.GetName]的终结？"
 flavor_tle.2.a: "务必确保 [target_dynasty.GetNameWithNoTooltip] 不会成为阻碍。"
 flavor_tle.2.b: "前进，向 [ShowLocationNameWithNoTooltip('oran')] 进发！"
 TLE_once_truce_ends_zayyanid_pretenders_tt: "Once the [truce|e] with [target_country.GetName] ends, they will have access to the [ShowDecisionName('zayyanid_pretenders_decision')] [decision|e], allowing them to declare a special [ShowCasusBelliName('cb_independence')] [war|e]"
 flavor_tle.3.title: "$flavor_tle.2.title$"
 flavor_tle.3.desc: "The capital of our beloved [ROOT.GetCountry.GetFlavorRank], [target.GetName], has fallen to our heinous enemies from the [from_country.GetLongName]. To add to this tragedy, many of our beloved [target_dynasty.GetName] family members were killed during the assault.\n\nThis calamity has sent a shockwave of despair throughout the [ROOT.GetCountry.GetLongName], and has made continuing the war practically impossible. Though the killings alone are not enough to paralyze the country, the loss of trust in the leadership certainly is. Having been abandoned by our tribal allies, our morale is at an all-time low, and with no established resistance movement, this marks the end of the [target_war.GetName]."
 flavor_tle.3.a: "[ROOT.GetCountry.Custom('common_string_negative')]"
 TLE_as_per_the_warning: "我们没有听从警告，任由我们敬爱的 [target.GetName] 沦陷。[target_dynasty.GetName] 家族惨遭屠戮，如今我们已沦为 [from_country.GetName] 的 [ShowSubjectTypeName('fiefdom')]。"
 zayyanid_pretenders_decision.title: "拥立一位 [ShowDynastyNameWithNoTooltip('zayyanid_dynasty')] 王子登基"
 zayyanid_pretenders_decision.desc: "[ROOT.GetCountry.GetDiplomacy.GetOverlord.GetName]的统治，往轻了说令[ROOT.GetCountry.GetLongName]不便，往重了说堪称暴虐。让我们迎请一位[ShowDynastyName('zayyanid_dynasty')]王子重新统治我们，团结所有[ShowEstateTypeName('tribes_estate')]共同对抗敌人。"
 zayyanid_pretenders_decision.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 zayyanid_prince_takes_over: "[ShowDynastyName('zayyanid_dynasty')][dynasty|e]的一位王子夺取了权力"
 flavor_tle.4.title: "$flavor_tle.7.title$"
 flavor_tle.4.desc: "The situation in [from_country.GetName] is becoming more and more unsustainable every day. Many of the [target_dynasty.GetName] pretenders have come out of hiding and are actively seeking support amongst the [ShowCultureName('zenati')] tribes in the area. Should we fail to appease the local estates, [target_location.GetName] could become a hotbed of popular rebellion, ending our hegemony over the [ShowRegionName('maghreb_region')]. Will [target_country.GetName] be able to weather such a storm?"
 flavor_tle.4.a: "我们必须听取这些警示。"
 tle_rules_for_zayyanid_pretenders: "If [target_country.GetName] fails to keep the [from_country.GetLongName] [subject_loyalty|e] above #Y 30#! for the following #Y 20#! years, [from_country.GetName] will be able to declare [ShowCasusBelliName('cb_independence_war')] [war|e] with the [ShowDecisionName('zayyanid_pretenders_decision')] [decision|e]"
 tle_rules_part_two: "若此事发生，[from_country.GetName] 的军事实力将获得显著加成，而 [target_country.GetName] 将获得以下效果："
 flavor_tle.5.title: "[ShowDynastyNameWithNoTooltip('zayyanid_dynasty')] 重返 [ROOT.GetCountry.GetCapital.GetNameWithNoTooltip]！"
 flavor_tle.5.desc: "[target_character.GetName], a pretender to the [from_country.GetAdjective] throne, has just entered [ROOT.GetCountry.GetCapital.GetName] to an ovation from the [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] and representatives of the [ROOT.GetCountry.GetGovernment.GetEstateName('tribes_estate')]. This act is an open declaration of war from [from_country.GetName] against the [target_country.GetLongName], the state that has ruled [ROOT.GetCountry.GetCapital.GetName] for far too long. [target_character.GetShortNameWithNoTooltip] enjoys widespread support in [from_country.GetNameWithNoTooltip], but most importantly has secured the [ShowModifier('tle_zayyanid_tribe_support')]: the backing of the largest and most powerful [ShowCultureName('zenati')] tribe in the [ROOT.GetCountry.GetFlavorRank], and the home tribe of the [target_dynasty.GetName].\n\nWe will show those [target_country.GetAdjectiveWithNoTooltip] bastards who shall be victorious in the [target_war.GetName]!"
 flavor_tle.5.a: "荣耀归于 [ROOT.GetCountry.GetReligion.GetGodName]！"
 zayyanid_pretender_effect: "我们将对我们的[overlord|e]宣布[ShowCasusBelliName('cb_independence_war')]，并将从以下事件中获得额外好处："
 flavor_tle.6.title: "[from_country.GetLongNameWithNoTooltip]的叛乱！"
 flavor_tle.6.desc: "Our ardent efforts — privileges bestowed, diplomatic missions, luxurious gifts, posts granted — have all been for naught, as the tribes of [from_country.GetName] still choose to support the tyrannical [target_character.GetName] from the [target_dynasty.GetName] over more benevolent [target_country.GetAdjective] rule.\n\nSo it shall be, then! Let them face the wrath of our armies! We will inflict the divine punishment of [ROOT.GetCountry.GetReligion.GetGodName] upon them and seize victory in the [target_war.GetName]!"
 flavor_tle.6.a: "我们在 [ShowRegionNameWithNoTooltip('maghreb_region')] 的霸权不容撼动！"
 flavor_tle.7.title: "[target_dynasty.GetNameWithNoTooltip] 觊觎者"
 flavor_tle.7.entry: "[ShowDynastyNameWithNoTooltip('zayyanid_dynasty')] 觊觎者"
 flavor_tle.7.desc: "过去几年间， [target_dynasty.GetName] 王朝的许多幸存成员纷纷现身，试图争夺 [target_location.GetName] 及 [from_country.GetAdjective] 王位。他们在民众和 [target_country.GetGovernment.GetEstateName('tribes_estate')] 之中获得了些许支持，民心也在逐渐转向他们一方。若我们在 [target_country.GetLongName] 的宗主继续加剧 [target_location.GetProvince.GetName] 的危机，我们很可能会看到 [target_dynasty.GetNameWithNoTooltip] 重掌大权。"
 flavor_tle.7.a: "这对我们或许有利。"
 flavor_tle.8.title: "The [ShowDecisionNameWithNoTooltip('oran_fatwa_decision')]"
 flavor_tle.8.desc: "The [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] of [ROOT.GetCountry.GetName] have recently issued a new fatwā, permitting our religious brethren to practice #italic Taqiyya#! when faced with persecution. Named after the place where it was proclaimed, the [ShowDecisionName('oran_fatwa_decision')] has reached [ShowRegionName('iberia_region')] and is being widely distributed amongst the oppressed [ShowReligionAdjective('sunni')] kin.\n\nThis permission to practice Taqiyya allows the hidden practice of [ShowReligionGroupName('muslim')] while pretending to be of another faith. Normally forbidden in the #italic 'Umma#!, this fatwā allows such practice in [ShowRegionName('iberia_region')]."
 flavor_tle.8.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 oran_fatwa_decision.title: "[ShowLocationNameWithNoTooltip('oran')] Fatwā"
 oran_fatwa_decision.desc: "$flavor_tle.8.desc$"
 oran_fatwa_decision.a: "$flavor_tle.8.a$"
 has_more_prestige_than_root_tt: "Has more [prestige|e] than [ROOT.GetCountry.GetName]"
 tle_enable_free_the_mudejar_cb_tt: "[ShowReligionAdjective('sunni')] [countries|e] with [capital|e] in [ShowRegionName('maghreb_region')] will be able to fabricate the [ShowCasusBelliName('cb_free_the_mudejar')] [casus_belli|e] on [ShowReligionGroupAdjective('christian')] targets that have [provinces|e] with [ShowReligionAdjective('sunni')] [pops|e] in [ShowRegionName('iberia_region')]"
 tle_enable_events_for_liberating_mudejar_tt: "[ShowReligionAdjective('sunni')] [countries|e] that [occupy|e] [locations|e] with [ShowReligionAdjective('sunni')] [pops|e] in a [ShowCasusBelliName('cb_free_the_mudejar')] [war|e] will receive [events|e] about liberating the local population"
 flavor_tle.9.title: "Liberation of [target.GetNameWithNoTooltip]"
 flavor_tle.9.desc: "The times of oppression for our [ROOT.GetCountry.GetReligion.GetAdjective] brethren in [target.GetName] might finally be over. For decades now, those poor souls have suffered maltreatment under the tyrannical rule of the [target.GetOwner.GetLongName]. Yet now, having been liberated by our forces, they may finally practice [ShowReligionGroupName('muslim')] in peace. They shall conceal their faith no more."
 flavor_tle.9.a: "Rejoice, brethren!"
 tle_fires_for_all_locations: "This [effect|e] works for every liberated [location|e], but this [event|e] notification is only for [province_capitals|e]"
 flavor_tle.10.title: "Arabization of [ROOT.GetCountry.GetNameWithNoTooltip]"
 flavor_tle.10.entry: "Arabization of $TLE$"
 flavor_tle.10.desc: "[ShowAreaName('algiers_area')] is but one of the areas of [ShowRegionName('maghreb_region')] being heavily Arabized under the influence of the [ShowCultureGroupName('arabic_group')] [ShowEstateTypeName('tribes_estate')]. As this process progresses, [ShowLanguageName('tamazight_language')] is falling out of use, and the urban elites are embracing the local [ShowLanguageName('arabic_language')] dialect in earnest. Indeed, with increasing immigration from [ShowRegionName('iberia_region')], we are seeing our [ShowEstateTypeName('nobles_estate')] adopt those customs in full. Our state might very well embrace being [ShowCultureName('algerian')] soon."
 flavor_tle.10.a: "We need to strengthen our roots."
 flavor_tle.10.b: "That is our future!"
 flavor_tle.11.title: "忠诚已固"
 flavor_tle.11.desc: "自[from_country.GetName]被[target_country.GetAdjective]征服以来，已过去数十年，关于[ShowDynastyName('zayyanid_dynasty')]复辟的传闻也已大多平息。看来我们终于成功压制了[ShowCultureName('zenati')]的[from_country.GetGovernment.GetEstateName('tribes_estate')]，以及他们当中的$banu_al_wad$首领。一旦其领地被完全整合，我们将为[ShowRegionName('maghreb_region')]开启一个繁荣的新时代。"
 flavor_tle.11.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 tle_secured: "[from_country.GetName] 将无法再通过 [ShowDecisionName('zayyanid_pretenders_decision')] 发动叛乱"
 flavor_tle.12.title: "Throwing Off Our Tribal Roots"
 flavor_tle.12.entry: "$flavor_tle.12.title$"
 flavor_tle.12.desc: "The foundations of the [target_country.GetAdjective] state are based upon the [target_government_reform.GetName], the most populous tribe in the vicinity of [target_location.GetName]. It is from this tribe that the [target_dynasty.GetName] dynasty originated, which in turn gave rise to the [target_country.GetFlavorRank] we are today. However, recent times have seen the gradual weakening of the [target_estate.GetName], which threatens the balance of power in the [ROOT.GetCountry.GetGovernment.GetCourtTitle]. If nothing is done to empower the $banu_al_wad$, their political privileges will fade into the pages of history."
 flavor_tle.12.a: "We must seek legitimacy from more than just the tribes."
 flavor_tle.12.b: "The primacy of the $banu_al_wad$ must be maintained!"
 tle_empower_banu_al_wad_reform: "[ShowGovernmentReformName('tle_support_of_banu_al_wad')] will additionally provide unscaled [ShowNamedValue('small_stability_investment')|+=] [ShowModifierTypeName('stability_investment')] [modifier|e]"
 flavor_tle.13.title: "[ShowLocationNameWithNoTooltip('oran')] 的成长"
 flavor_tle.13.entry: "$flavor_tle.13.title$"
 flavor_tle.13.desc: "如果 [target_location2.GetName] 是我们通往 [ShowScriptedGeographyName('sahara_desert_geography')] 贸易的门户，那么 [target_location.GetName] 便是我们与 [ShowContinentName('europe')] 通商的窗口。没有哪个港口能像 [target_location.GetNameWithNoTooltip] 那样举足轻重，它是连接我们与 [ShowScriptedGeographyName('mediterranean_sea_geography')] 海上贸易伙伴的最重要港湾。或许 [target_location.GetRank.GetName] 应当获得额外的特权，以增强当地 [target_estate.GetName] 的势力。"
 flavor_tle.13.a: "A splendid idea!"
 flavor_tle.13.b: "[target_location.GetNameWithNoTooltip] 不该享有特殊待遇。"
 flavor_tle.8.a.entry: "$common_string_great$"
 has_most_prestige_out_of_all_maghrebi_sunni_countries: "[prestige|e]高于[ShowRegionName('maghreb_region')]所有[capital|e]位于当地的[ShowReligionAdjective('sunni')]国家"
 oran_fatwa_decision.desc.entry: "我们在[ShowRegionName('iberia_region')]的[ShowReligionAdjective('sunni')]教友正遭受压迫。我们不能让他们持续处于#italic塔基亚#!之中，任凭信仰动摇。必须颁布一项教令来助他们渡过难关。"
 zayyanid_pretenders_decision.a.entry: "$common_string_great$"
 zayyanid_pretenders_decision.desc.entry: "我们宗主的统治堪称暴虐至极，动摇了 $banu_al_wad$ 部族至高地位的根基。让我们迎请一位 [ShowDynastyName('zayyanid_dynasty')] 王子重新统治我们，团结所有 [ShowEstateTypeName('tribes_estate')] 共同对抗敌人。"
