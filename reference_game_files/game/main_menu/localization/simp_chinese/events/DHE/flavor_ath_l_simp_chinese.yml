l_simp_chinese:
 flavor_ath.1.title: "[target_country.GetAdjectiveWithNoTooltip]近期劫掠"
 flavor_ath.1.entry: "艾登近期劫掠"
 flavor_ath.1.desc: "近年来，我们[ShowAreaName('aegean_sea_area')]沿岸的土地遭受了[target_country.GetAdjective]土耳其人的多次毁灭性劫掠。这些劫掠都是由[target_character.GetName]发动的，因此我们本以为他的好死能让我们解脱。然而，他的继任者最近在[ShowAreaName('thrace_area')]的劫掠无疑表明了他的意图——[target_character2.GetName]将重返[ShowScriptedGeographyName('greece_geography')]再次掠夺。我们必须城市遭受更多苦难前解决这一威胁——有必要发动一次反劫掠或[GetInternationalOrganizationType('crusade').GetName]。"
 flavor_ath.1.a: "以彼之道，还施彼身！"
 flavor_ath.2.title: "[scope_ruler.GetShortNameWithNoTooltip]突然离世"
 flavor_ath.2.entry: "吉列姆二世公爵突然离世"
 flavor_ath.2.desc: "悲剧！[scope_ruler.GetName]突发急病，经[regent_of_athens.GetName]宣告不治身亡。[regent_of_athens.GetName]已着手组建临时摄政机构，处理继承相关事宜。尽管[scope_ruler.GetShortNameWithNoTooltip]生前指定[scope_heir.GetName]为[scope_ruler.GetHisHer]的继承人，但[scope_heir.GetHeShe]目前身处[sic_country.GetName]，需要一段时间才能抵达。\n\n随着[ROOT.GetCountry.GetName]出现权力真空，国内[ROOT.GetCountry.GetGovernment.GetCourtTitle]中一些对[ShowCultureName('catalan')]佣兵团心怀不满的人，已向[regent_of_athens.GetShortNameWithNoTooltip]请愿，提议邀请[arg_ruler.GetName]来统治[ROOT.GetCountry.GetNameWithNoTooltip]。他们认为这是一个让[arg_ruler.GetDynasty.GetName]王朝重掌[ROOT.GetCountry.GetNameWithNoTooltip]的机会。然而，此举将被视为叛乱行为，可能导致[sic_country.GetNameWithNoTooltip]加强对[ROOT.GetCountry.GetFlavorRank]自治权的压制。此外，若[arg_ruler.GetHeShe]接受邀请，还需说服[ShowCultureNameWithNoTooltip('catalan')]公司接受[arg_ruler.GetShortNameWithNoTooltip]的接管。"
 flavor_ath.2.a: "允许[scope_heir.GetNameWithNoTooltip]继承[scope_ruler.GetShortNameWithNoTooltip]。"
 flavor_ath.2.a.entry: "允许继承人继位。"
 flavor_ath.2.b: "将[ROOT.GetCountry.GetFlavorRank]献给[arg_ruler.GetShortNameWithNoTooltip]。"
 flavor_ath.2.b.entry: "将领地献给阿拉贡。"
 ath_sicily_may_declare_war: "如果[arg_ruler.GetName]成为[ROOT.GetCountry.GetNameWithNoTooltip]的新统治者，[sic_country.GetName]将获得针对[ROOT.GetCountry.GetName]的[ShowCasusBelliName('cb_subject_broke_free')][casus_belli|e]"
 flavor_ath.3.title: "[scope_athens.GetAdjectiveWithNoTooltip][scope_athens.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]献上[scope_athens.GetLongNameWithNoTooltip]"
 flavor_ath.3.desc: "一位来自[scope_athens.GetName]的外交官抵达[ROOT.GetCountry.GetGovernment.GetCourtTitle]，带来了一份看似诱人、实则暗藏凶险的提议。他带来消息，[scope_athens.GetNameWithNoTooltip]的[scope_ath_william.GetName]在短暂患病后突然离世，他的死让[ROOT.GetCountry.GetFlavorRank]失去统治者。尽管[scope_athens.GetNameWithNoTooltip]的许多[scope_athens.GetGovernment.GetEstateName('nobles_estate')]都在等待[scope_ath_william.GetShortNameWithNoTooltip]的继承人，但代理摄政[regent_of_athens.GetShortName]已与其他仍忠于[arg_ruler.GetDynasty.GetName]家族的[scope_athens.GetAdjectiveWithNoTooltip][scope_athens.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]达成了协议，他们更希望看到[arg_ruler.GetName]成为新统治者。\n\n[regent_of_athens.GetShortNameWithNoTooltip]指出，[ShowCultureName('catalan')]佣兵团对[scope_ath_william.GetDynasty.GetName]心存不满。虽然由于当年推翻[scope_slained_brienne.GetName]一事，[arg_ruler.GetShortNameWithNoTooltip]与军团的关系紧张，但只要运作得当，仍可说服其领导层支持[arg_ruler.GetDynasty.GetNameWithNoTooltip]重掌[scope_athens.GetFlavorRank]。若能获得他们的支持，[scope_sic_country.GetAdjective][scope_sic_country.GetGovernment.GetCourtTitle]或许愿意在不引发冲突的情况下，放任[scope_athens.GetNameWithNoTooltip]脱离其掌控。"
 flavor_ath.3.a: "接受[scope_athens.GetAdjectiveWithNoTooltip]的提议。"
 flavor_ath.3.a.entry: "接受$ATH_ADJ$的提议。"
 flavor_ath.3.b: "拒绝提议，这风险太大了。"
 flavor_ath.3_become_athens: "[ROOT.GetCountry.GetName]将被并入[scope_athens.GetLongName]，并获得所有[scope_athens.GetAdjectiveWithNoTooltip][core|e][locations|e]的[cores|e]"
 ath_arg_sicily_may_declare_war: "[scope_athens.GetName]将获得独立，而[scope_sic_country.GetName]将对[scope_athens.GetNameWithNoTooltip]的[ShowCasusBelliName('cb_subject_broke_free')][casus_belli|e]"
 flavor_ath.4.title: "[arg_ruler.GetNameWithNoTooltip]接受！"
 flavor_ath.4.desc: "在[regent_of_athens.GetShortName]秘密派遣使者前往[arg_country_scope.GetName]后，[arg_ruler.GetNameWithNoTooltip]接受了我们的提议，将接管对[ROOT.GetCountry.GetLongName]的统治。随着[scope_ath_william.GetName]去世的消息传开，[sic_country_scope.GetAdjective][sic_country_scope.GetGovernment.GetCourtTitle]很快就会知晓[regent_of_athens.GetNameWithNoTooltip]发动的政变。\n\n虽然[ShowCultureName('catalan')]佣兵团于1311年从[scope_slained_brienne.GetName]手中征服了[ROOT.GetCountry.GetFlavorRank]，但他们近来对[sic_country_scope.GetAdjectiveWithNoTooltip][sic_country_scope.GetGovernment.GetCourtTitle]日益不满。只要达成妥协，他们愿意接受[arg_ruler.GetShortNameWithNoTooltip]对[ROOT.GetCountry.GetFlavorRank]的统治。"
 flavor_ath.4.a: "现在需要与[ShowCultureNameWithNoTooltip('catalan')]的佣兵进行谈判。"
 flavor_ath.5.title: "安抚[ShowCultureNameWithNoTooltip('catalan')]雇佣军"
 flavor_ath.5.desc: "自1312年起，[scope_ath_william.GetDynasty.GetName]家族一直保有[ROOT.GetCountry.GetName]的公爵头衔，但在整个[ROOT.GetCountry.GetFlavorRank]，行使[sic_country_scope.GetAdjectiveWithNoTooltip]权力的却一直是[ShowCultureName('catalan')]佣兵团。在[regent_of_athens.GetName]私底下采取手段后，[ROOT.GetCountry.GetNameWithNoTooltip]的许多[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]开始倾向于支持[scope_ruler.GetDynasty.GetName]家族对[ROOT.GetCountry.GetNameWithNoTooltip]的宣称。\n\n尽管[ShowCultureNameWithNoTooltip('catalan')]雇佣军内部有部分人对[sic_country_scope.GetAdjectiveWithNoTooltip][sic_country_scope.GetGovernment.GetCourtTitle]心生不满，但若能得到妥善补偿，其中许多人仍愿意背弃他们对[sic_country_scope.GetNameWithNoTooltip]的封臣誓言。"
 flavor_ath.5.a: "将部分[ROOT.GetCountry.GetFlavorRank]收入分配给佣兵团。"
 flavor_ath.5.a.entry: "将部分国家收入分配给佣兵团。"
 flavor_ath.5.b: "授予佣兵团额外的特权和土地权利。"
 flavor_ath.5.c: "强行将佣兵团逐出[ROOT.GetCountry.GetFlavorRank]。"
 flavor_ath.5.c.entry: "强行将佣兵团逐出国家。"
 flavor_ath.6.title: "[scope_athens.GetNameWithNoTooltip]推翻[ShowDynastyNameWithNoTooltip('barcelona_dynasty')]统治"
 flavor_ath.6.desc: "可怕的消息传到了[ROOT.GetCountry.GetGovernment.GetCourtTitle]！[scope_ath_william.GetName]因突发疾病去世，在他死后留下的权力真空中，[scope_athens.GetAdjective]精英阶层将[scope_athens.GetFlavorRank]献给了[arg_ruler.GetName]，而[arg_ruler.GetName]则背弃了作为封臣对[scope_ruler.GetName]应尽的义务。"
 flavor_ath.6.a: "必须收复[scope_athens.GetNameWithNoTooltip]！"
 flavor_ath.6.a.entry: "$ATH$必须被收复！"
 flavor_ath.7.title: "[arg_ruler.GetNameWithNoTooltip]拒绝！"
 flavor_ath.7.entry: "阿尔戈斯公爵拒绝"
 flavor_ath.7.desc: "我们秘密派往[arg_country.GetName]的使者带回了令人遗憾的消息：[arg_ruler.GetName]拒绝了我们恢复其为[ROOT.GetCountry.GetName]统治者的提议。为尽快挽救局势，[regent_of_athens.GetName]已囚禁了许多参与此阴谋的[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]，不过[ROOT.GetCountry.GetGovernment.GetCourtTitle]的其他成员建议，在[scope_heir.GetName]抵达[ROOT.GetCountry.GetNameWithNoTooltip]之前，应将[regent_of_athens.GetName]也一同囚禁起来。"
 flavor_ath.7.a: "暂时放过[regent_of_athens.GetShortNameWithNoTooltip]。"
 flavor_ath.7.a.entry: "暂且赦免他。"
 flavor_ath.7.b: "逮捕[regent_of_athens.GetShortNameWithNoTooltip]！"
 flavor_ath.7.b.entry: "囚禁他！"
 flavor_ath.8.title: "[ShowCultureNameWithNoTooltip('catalan')]佣兵团的统治"
 flavor_ath.8.entry: "加泰罗尼亚佣兵团的统治"
 flavor_ath.8.desc: "自1311年[ShowCultureName('catalan')]佣兵团征服[ROOT.GetCountry.GetLongName]并向[sic_country.GetLongName]效忠以来，[scope_ruler.GetDynasty.GetName]家族便一直统治着[ROOT.GetCountry.GetLongNameWithNoTooltip]。虽然[scope_ruler.GetName]仍是现任[ROOT.GetCountry.GetGovernment.GetRulerTitle]，但[ROOT.GetCountry.GetNameWithNoTooltip]的大部分实权掌握在[ShowCultureNameWithNoTooltip('catalan')]佣兵团及其军事力量的手中，宣称者[arg_ruler.GetName]无法夺回[ROOT.GetCountry.GetFlavorRank]。\n\n尽管[ShowCultureNameWithNoTooltip('catalan')]佣兵团一直忠诚于[sic_country.GetAdjectiveWithNoTooltip][sic_country.GetGovernment.GetCourtTitle]，但一些当地的[ROOT.GetCountry.GetAdjectiveWithNoTooltip][ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]怀疑，佣兵团成员对当权的[scope_ruler.GetDynasty.GetNameWithNoTooltip]家族早已产生不满。"
 flavor_ath.8.a: "继续信任[ShowCultureNameWithNoTooltip('catalan')]佣兵团以守护[ROOT.GetCountry.GetNameWithNoTooltip]。"
 flavor_ath.8.a.entry: "继续信任[ShowCultureNameWithNoTooltip('catalan')]佣兵团以守护我们。"
 flavor_ath.8.b: "对关于[ShowCultureNameWithNoTooltip('catalan')]不忠的传闻提高警惕。"
 flavor_ath.9.title: "[byz_country.GetAdjectiveWithNoTooltip]内乱"
 flavor_ath.9.entry: "拜占庭内乱"
 flavor_ath.9.desc: "消息传到了[ROOT.GetCountry.GetAdjective][ROOT.GetCountry.GetGovernment.GetCourtTitle]：[byz_country.GetName]在与[ROOT.GetCountry.GetNameWithNoTooltip]接壤的边境地区已失去大部分控制权，导致驻军规模缩减。由于[byz_country.GetAdjectiveWithNoTooltip][byz_country.GetGovernment.GetCourtTitle]内部正陷入王朝纷争的混乱，且其注意力还被分散在[ShowRegionName('anatolia_region')]的[ShowCultureName('turkish_culture')]贝伊国身上，[ROOT.GetCountry.GetAdjectiveWithNoTooltip][ROOT.GetCountry.GetGovernment.GetCourtTitle]中部分成员认为，现在是进攻[byz_country.GetLongNameWithNoTooltip]、扩大我们在[ShowProvinceDefinitionName('thessaly_province')]既得利益的时机。\n\n另一种选择是，[ShowCultureNameWithNoTooltip('catalan')]佣兵团内部有人提议，对[byz_country.GetAdjectiveWithNoTooltip][ShowAreaName('northern_greece_area')]发动劫掠，以此充实[ROOT.GetCountry.GetFlavorRank]的金库。"
 flavor_ath.9.a: "现在是进一步进军[ShowProvinceDefinitionNameWithNoTooltip('thessaly_province')]的时候了！"
 flavor_ath.9.b: "派遣[ShowCultureNameWithNoTooltip('catalan')]佣兵团劫掠[ShowAreaNameWithNoTooltip('northern_greece_area')]。"
 flavor_ath.9.c: "我们静观其变。"
 flavor_ath.10.title: "[ROOT.GetCountry.GetNameWithNoTooltip]的[ShowCultureNameWithNoTooltip('greek_culture')]民众"
 flavor_ath.10.entry: "统治希腊"
 flavor_ath.10.desc: "自[GetCountry('LAT').GetAdjective]统治[ShowScriptedGeographyName('greece_geography')]以来，许多[ShowCultureName('greek_culture')]精英的头衔被剥夺，转而授予了[GetCountry('LAT').GetAdjectiveWithNoTooltip]十字军的精英成员。尽管帝国在1261年陷落，十字军在[ShowScriptedGeographyNameWithNoTooltip('greece_geography')]的统治自此瓦解，但其遗留的影响至今仍笼罩着[ROOT.GetCountry.GetLongName]。\n\n为了争取更多的土地权益，[ROOT.GetCountry.GetCulture.GetName][ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]中的许多人已向[ROOT.GetCountry.GetGovernment.GetCourtTitle]请愿，希望能在[ROOT.GetCountry.GetNameWithNoTooltip]获得更多[ShowCultureNameWithNoTooltip('greek_culture')]的土地。然而，也有人认为这是一个争取[ShowCultureNameWithNoTooltip('greek_culture')]民众好感的机会。"
 flavor_ath.10.a: "支持[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]的土地权利扩张。"
 flavor_ath.10.a.entry: "支持$nobles_estate$土地权的扩张。"
 flavor_ath.10.b: "安抚[ShowCultureNameWithNoTooltip('greek_culture')]民众。"
 flavor_ath.10.c: "将部分土地权利转移给[ShowCultureNameWithNoTooltip('catalan')]佣兵团。"
 flavor_ath.10.d: "维持现状。"
 ath_greek_pops_lose_mild_satisfaction: "我们的所有[ShowCultureName('greek_culture')][pops|e]会失去[ShowNamedValue('pop_satisfaction_mild_penalty')|+=2%][pop_satisfaction|e]"
 ath_greek_pops_gain_severe_satisfaction: "我们的所有[ShowCultureName('greek_culture')][pops|e]会获得[ShowNamedValue('estate_satisfaction_severe_bonus')|+=2%][pop_satisfaction|e]"
 ath_greek_pops_lose_severe_satisfaction: "我们的所有[ShowCultureName('greek_culture')][pops|e]会失去[ShowNamedValue('estate_satisfaction_severe_penalty')|+=2%][pop_satisfaction|e]"
 flavor_ath.11.title: "[ShowCultureNameWithNoTooltip('catalan')]佣兵团对抗[target_conflict_location.GetNameWithNoTooltip]的[ShowCultureNameWithNoTooltip('greek_culture')]民众"
 flavor_ath.11.entry: "加泰罗尼亚佣兵团与希腊人冲突"
 flavor_ath.11.desc: "[ShowCultureName('catalan')]佣兵团享受着[ROOT.GetCountry.GetName][ROOT.GetCountry.GetGovernment.GetCourtTitle]授予的特权，引发了[target_conflict_location.GetName]当地[ShowCultureName('greek_culture')]民众的强烈抗议，他们指控雇佣军非法侵占了土地。尽管[ROOT.GetCountry.GetGovernment.GetCourtTitle]中有些人早就知道[ShowCultureNameWithNoTooltip('catalan')]人对[target_conflict_location.GetNameWithNoTooltip]有所企图，但另一些人担心，这一事件可能会蔓延至附近省份，引发大规模[ShowCultureNameWithNoTooltip('greek_culture')]人暴动，因此请求[scope_ruler.GetName]出面干预此事。"
 flavor_ath.11.a: "支持土地侵占。"
 flavor_ath.11.b: "谴责[ShowCultureNameWithNoTooltip('catalan')]佣兵团。"
 flavor_ath.11.c: "借此机会将[ShowCultureNameWithNoTooltip('catalan')]佣兵团赶出[ROOT.GetCountry.GetNameWithNoTooltip]！"
 flavor_ath.11.c.entry: "借此机会将[ShowCultureNameWithNoTooltip('catalan')]佣兵团赶走！"
 flavor_ath.12.title: "[thebes_location.GetNameWithNoTooltip]与[athens_location.GetNameWithNoTooltip]的变迁首都"
 flavor_ath.12.entry: "变迁的首都"
 flavor_ath.12.desc: "尽管[athens_location.GetName]的[athens_location.GetRank.GetName]长久以来一直是[ROOT.GetCountry.GetFlavorRank]最重要的定居点之一，但过去的历任统治者——从旧[GetCountry('LAT').GetAdjective]继承者到近期的[ShowCultureNameWithNoTooltip('catalan')]佣兵团——都选择在战略位置更佳的[thebes_location.GetName]建立据点。尽管[thebes_location.GetNameWithNoTooltip]的地位有所上升，[athens_location.GetNameWithNoTooltip]仍是一个重要的[athens_location.GetRank.GetNameWithNoTooltip]，我国大部分官僚机构仍设于此地。\n\n虽然两地都被证明极具价值，但[ROOT.GetCountry.GetGovernment.GetCourtTitle]已要求[scope_ruler.GetName]就此事正式达成共识，并明确决定将哪里定为[ROOT.GetCountry.GetName]的法定首都。"
 flavor_ath.12.a: "保持现有结构，两地都各有重要性。"
 flavor_ath.12.b: "我们应当重返[athens_location.GetNameWithNoTooltip]，并再次将其定为首都。"
 flavor_ath.12.b.entry: "我们应当重返[ShowLocationNameWithNoTooltip('athens')]，并再次将其定为首都。"
 flavor_ath.12.c: "宣布[thebes_location.GetNameWithNoTooltip]为[ROOT.GetCountry.GetFlavorRank]的正式首都。"
 flavor_ath.12.c.entry: "宣布[ShowLocationNameWithNoTooltip('thebes')]为国家的正式首都。"
 flavor_ath.13.title: "[scope_epi_ruler.GetNameWithNoTooltip]夺取[epi_country.GetNameWithNoTooltip]权力"
 flavor_ath.13.entry: "伊庇鲁斯分离"
 flavor_ath.13.desc: "1337年，[epi_country.GetName]归入[scope_epi_governor.GetName]统治之下，重新回到了[byz_country.GetName]的势力范围。然而，此后[scope_epi_ruler.GetName]的支持者发动了一场成功的叛乱，反抗[byz_country.GetAdjectiveWithNoTooltip]总督，推翻了当地政权，让[scope_epi_ruler.GetLastNameWithNoTooltip]重新复辟为[epi_country.GetFlavorRank]。尽管[byz_country.GetNameWithNoTooltip]尚未采取行动，但[ROOT.GetCountry.GetLongName]内部有人建议我们趁此权力真空之机，夺取[epi_country.GetNameWithNoTooltip]。"
 flavor_ath.13.a: "我们将宣称[epi_country.GetLongNameWithNoTooltip]。"
 flavor_ath.13.a.entry: "我们应宣称$EPI$。"
 flavor_ath.13.b: "我们应转而支持[scope_epi_ruler.GetNameWithNoTooltip]。"
 flavor_ath.13.b.entry: "我们应转而支持他。"
 flavor_ath.13.c: "[epi_country.GetAdjectiveWithNoTooltip]的事务与我们无关。"
 flavor_ath.13.c.entry: "$EPI_ADJ$不关我们的事。"
 flavor_ath.14.title: "[scope_ach_country.GetNameWithNoTooltip]的[GetCountry('LAT').GetAdjectiveWithNoTooltip]虚名统治者"
 flavor_ath.14.entry: "亚该亚的虚名皇帝"
 flavor_ath.14.desc: "尽管[scope_ach_country.GetLongNameWithNoTooltip]长期受到[scope_nap_country.GetName]的保护，但它在[ShowScriptedGeographyName('greece_geography')]的许多[GetCountry('LAT').GetAdjective]国家中影响力日益增强，[scope_ach_ruler.GetName]也积极利用其作为[GetCountry('LAT').GetLongNameWithNoTooltip]统治者的宣称权。尽管该头衔在1261年[GetCountry('LAT').GetLongNameWithNoTooltip]覆灭后基本丧失了实权，但[ShowScriptedGeographyNameWithNoTooltip('greece_geography')]各地的许多[GetCountry('LAT').GetAdjectiveWithNoTooltip]统治者仍继续支持[scope_ach_ruler.GetShortNameWithNoTooltip]。\n\n随着[ROOT.GetCountry.GetName]在剩余的[GetCountry('LAT').GetAdjectiveWithNoTooltip]国家中实力不断增强，[ROOT.GetCountry.GetGovernment.GetCourtTitle]内部有人认为，现在是时候对[scope_ach_country.GetNameWithNoTooltip]采取行动，彻底终结其对[GetCountry('LAT').GetLongNameWithNoTooltip]的宣称了。"
 flavor_ath.14.a: "我们应该入侵[scope_ach_country.GetNameWithNoTooltip]，进一步削弱其宣称。"
 flavor_ath.14.a.entry: "我们应该入侵$ACH$，进一步削弱其宣称。"
 flavor_ath.14.b: "我们应转而寻求与[scope_ach_ruler.GetShortNameWithNoTooltip]修好关系。"
 flavor_ath.14.b.entry: "我们应转而寻求与他修好关系。"
 flavor_ath.14.c: "[scope_ach_ruler.GetShortNameWithNoTooltip]的事务与[ROOT.GetCountry.GetNameWithNoTooltip]无关。"
 flavor_ath.14.c.entry: "统治者的事与我们无关。"
 flavor_ath.15.title: "[the_pope.GetNameWithNoTooltip]为复兴[GetCountry('LAT').GetLongNameWithNoTooltip]寻求[ROOT.GetCountry.GetAdjectiveWithNoTooltip]支持"
 flavor_ath.15.entry: "教宗提议重建拉丁帝国"
 flavor_ath.15.desc: "一位外交官从[scope_papal_states.GetLongName]抵达[ROOT.GetCountry.GetName]的[ROOT.GetCountry.GetGovernment.GetCourtTitle]，带来了一项雄心勃勃的提议。[the_pope.GetNameWithNoTooltip]注意到了[ROOT.GetCountry.GetNameWithNoTooltip]日益增长的势力以及[scope_byz.GetName]衰退的影响力，现在视我们为恢复[GetCountry('LAT').GetLongName]在[constantinople_location.GetName]统治地位的有力人选。\n\n如果我们同意他们的一些要求，并实现[GetCountry('LAT').GetLongNameWithNoTooltip]的重建，[the_pope.GetShortNameWithNoTooltip]将提供[scope_papal_states.GetLongNameWithNoTooltip]的全面支持，并承认[scope_ruler.GetName]为[constantinople_location.GetNameWithNoTooltip]的合法统治者。"
 flavor_ath.15.a: "接受[the_pope.GetShortNameWithNoTooltip]重建[GetCountry('LAT').GetLongNameWithNoTooltip]的请求。"
 flavor_ath.15.a.entry: "接受他重建$LAT$的请求。"
 flavor_ath.15.b: "我们不会受制于[the_pope.GetShortNameWithNoTooltip]的野心。"
 flavor_ath.15.b.entry: "我们不会受制于教宗的野心。"
 flavor_ath.16.title: "[GetCountry('THE').GetLongNameWithNoTooltip]的宣称"
 flavor_ath.16.entry: "收复帖撒罗尼迦失地"
 flavor_ath.16.desc: "虽然[GetCountry('THE').GetFlavorRank]存在时间短暂，且曾是旧[GetCountry('LAT').GetLongName]的附庸国，但在1224年被[scope_theodoros_doukas.GetName]摧毁之前，[GetCountry('THE').GetName]的统治者曾在[GetCountry('LAT').GetLongNameWithNoTooltip]内部拥有强大的政治影响力。\n\n尽管[achaea_country.GetLongName]仍保留着该头衔的象征性宣称，但[ROOT.GetCountry.GetName]最近征服了旧[GetCountry('THE').GetFlavorRank]所属的领土，这使得[ROOT.GetCountry.GetGovernment.GetCourtTitle]中的一些人认为，我们应当将此头衔据为己有，以进一步强化我们作为[GetCountry('LAT').GetLongNameWithNoTooltip]继承者的正统性。"
 flavor_ath.16.a: "宣称[GetCountry('THE').GetLongNameWithNoTooltip]！"
 flavor_ath.16.a.entry: "宣称$THE$！"
 flavor_ath.16.b: "在此宣告一个新的[GetCountry('THE').GetFlavorRank]。"
 flavor_ath.16.b.entry: "在此宣告一个新的国家。"
 flavor_ath.16.c: "我们不应觊觎过去那些有争议的头衔。"
 may_form_thessalonica: "在[ShowScriptedGeographyName('claims_of_thessalonica_geography')]内建立[GetCountry('THE').GetLongNameWithNoTooltip]所需的[locations|e]数量减少#L 30.00%#!"
 flavor_ath.17.title: "[constantinople_location.GetNameWithNoTooltip]的再征服"
 flavor_ath.17.entry: "征服君士坦丁堡！"
 flavor_ath.17.desc: "[ROOT.GetCountry.GetName]的士兵们完成了不可能的任务，征服了[constantinople_location.GetName]！吸取过往教训后，[scope_ruler.GetName]下令停止在[constantinople_location.GetRank.GetName]内的劫掠，以避免重蹈第四次十字军东征的覆辙。随着旧有的[ShowCultureNameWithNoTooltip('greek_culture')]精英阶层再次被驱逐，[scope_ruler.GetShortNameWithNoTooltip]向[ROOT.GetCountry.GetAdjectiveWithNoTooltip]的[ROOT.GetCountry.GetGovernment.GetCourtTitle]提出了一项重建[GetCountry('LAT').GetLongName]的建议。不过也有人认为，我们应避免再次翻下过去[GetCountry('LAT').GetFlavorRank]的错误，应首先重新确立我们对[ShowScriptedGeographyName('greece_geography')]的控制权。"
 flavor_ath.17.a: "宣告[GetCountry('LAT').GetLongNameWithNoTooltip]复国！"
 flavor_ath.17.a.entry: "宣告$LAT$复国！"
 flavor_ath.17.b: "首要目标是先稳固我们在[ShowScriptedGeographyNameWithNoTooltip('greece_geography')]的地位。"
 flavor_ath.17.c: "我们还是继续以[ROOT.GetCountry.GetLongNameWithNoTooltip]的身份统治。"
 flavor_ath.17.c.entry: "我们还是继续以我们的身份统治。"
