l_simp_chinese:
 flavor_lat.1.title: "建立全新的[latin_country.GetAdjectiveWithNoTooltip]官僚体系"
 flavor_lat.1.entry: "全新的拉丁官僚体系"
 flavor_lat.1.desc: "随着我们恢复对[constantinople_location.GetName]的统治，众多[latin_country.GetAdjective]精英如今正为新官僚体系奠定基础，以取代早已腐朽的[GetCountry('BYZ').GetAdjectiveWithNoTooltip]制度。当初的[ROOT.GetCountry.GetLongNameWithNoTooltip]有一个短板，即当时各地此起彼伏的压力使得[ROOT.GetCountry.GetFlavorRank]无法形成统一的统治架构。\n\n在[scope_ruler.GetName]的领导下，[ROOT.GetCountry.GetFlavorRank]可走上一条不同的道路，形成一个紧密团结的[ROOT.GetCountry.GetCulture.GetName]官僚体系。"
 flavor_lat.1.a: "建立一套独特的[ROOT.GetCountry.GetCulture.GetNameWithNoTooltip]新官僚体系。"
 flavor_lat.1.a.entry: "建立一套独特的新官僚体系。"
 flavor_lat.1.b: "仿效旧十字军国家的模式建立新官僚体系。"
 flavor_lat.1.c: "采纳[GetCountry('BYZ').GetAdjectiveWithNoTooltip]官僚体系的若干方面。"
 flavor_lat.1.c.entry: "采纳$BYZ_ADJ$官僚体系的若干方面。"
 flavor_lat.1.d: "实行受[ShowCultureNameWithNoTooltip('catalan')]启发的官僚体系。"
 flavor_lat.1.e: "实行受[ShowCultureNameWithNoTooltip('neapolitan')]启发的官僚体系。"
 flavor_lat.2.title: "[ShowCultureNameWithNoTooltip('turkish_culture')]势力在[ShowRegionNameWithNoTooltip('anatolia_region')]崛起"
 flavor_lat.2.entry: "危险的土耳其人在安纳托利亚崛起"
 flavor_lat.2.desc: "甚至在我们夺回[constantinople_location.GetName]之前，[GetCountry('BYZ').GetAdjectiveWithNoTooltip]在[ShowRegionName('anatolia_region')]的领地就已面临当地[ShowCultureName('turkish_culture')]人的严重威胁。在这些[ShowCultureNameWithNoTooltip('turkish_culture')]军阀中，[rising_turkish_country_ruler.GetName]被证明是最强有力的人物之一，不断在[ShowRegionNameWithNoTooltip('anatolia_region')]兼并土地。[ROOT.GetCountry.GetAdjective][ROOT.GetCountry.GetGovernment.GetCourtTitle]中许多人担心他们可能会趁我们夺回[constantinople_location.GetNameWithNoTooltip]之机，发动对[ShowScriptedGeographyName('greece_geography')]的入侵。而[ROOT.GetCountry.GetGovernment.GetCourtTitle]中的其他人则向[scope_ruler.GetName]提议乘胜进军，发动对[ShowRegionNameWithNoTooltip('anatolia_region')]的入侵，以削弱[ShowCultureNameWithNoTooltip('turkish_culture')][rising_turkish_country.GetFlavorRank]。"
 flavor_lat.2.a: "我们将击退[rising_turkish_country.GetFlavorRank]！"
 flavor_lat.2.a.entry: "我们将击退该势力！"
 flavor_lat.2.b: "我们应保持谨慎，采取更具防御性的方略。"
 flavor_lat.3.title: "[ROOT.GetCountry.GetLongNameWithNoTooltip]的更大宣称"
 flavor_lat.3.entry: "$flavor_lat.3.title$"
 flavor_lat.3.desc: "1204年[constantinople_location.GetName]陷落之后，昔日[ROOT.GetCountry.GetAdjective]精英们迅速行动，巩固了对整个[ShowScriptedGeographyName('greece_geography')]地区[GetCountry('BYZ').GetAdjective]领地的控制，并宣称对[ShowRegionNameWithNoTooltip('balkan_region')]拥有宗主权。然而，当时[serbia_country.GetName]和[bul_country.GetName]是[ROOT.GetCountry.GetNameWithNoTooltip]的主要竞争对手，尤其是[bul_country.GetNameWithNoTooltip]，他们不断向[ROOT.GetCountry.GetNameWithNoTooltip]领土发动军事行动，最终在当初的[ROOT.GetCountry.GetFlavorRank]的覆灭中扮演了重要角色。\n\n如今[ROOT.GetCountry.GetLongNameWithNoTooltip]已在[scope_ruler.GetName]治下重建，我们或可宣称对这些土地拥有统治权，实现昔日[ROOT.GetCountry.GetFlavorRank]未竟之业。"
 flavor_lat.3.a: "我们将奋力推进[ROOT.GetCountry.GetFlavorRank]的扩张，对付这些宿敌。"
 flavor_lat.3.a.entry: "我们将奋力推进领土扩张，对付这些宿敌。"
 flavor_lat.3.b: "让我们避免重复过去的错误。"
 flavor_lat.4.title: "恢复神圣的[constantinople_location.GetName]宗主教区"
 flavor_lat.4.entry: "恢复神圣的君士坦丁堡宗主教区"
 flavor_lat.4.desc: "尽管1204年[constantinople_location.GetName]最初遭洗劫时遭到[pap_country.GetGovernment.GetRulerTitle]反对，但[constantinople_location.GetNameWithNoTooltip]被[ShowReligionAdjective('catholic')]十字军夺取，却为恢复宗主教区、提升[pap_country.GetAdjective]权威提供了契机。然而，1261年[scope_michael_palaiologos.GetName]重新夺取[constantinople_location.GetNameWithNoTooltip]使得这一称号再度失效。\n\n如今[ROOT.GetCountry.GetAdjective]恢复了对[constantinople_location.GetNameWithNoTooltip]的统治，[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]内部许多人敦促我们恢复宗主教区。"
 flavor_lat.4.a: "允许恢复宗主教区。"
 flavor_lat.4.b: "承诺保护恢复后的宗主教区！"
 flavor_lat.4.c: "利用恢复后的宗主教区施加影响力。"
 flavor_lat.4.d: "拒绝恢复宗主教区。"
 latin_patriarchate_of_constantinople: "[ShowLocationNameWithNoTooltip('constantinople')]宗主教区"
 flavor_lat.5.title: "重新确立对[ShowRegionNameWithNoTooltip('anatolia_region')]的控制"
 flavor_lat.5.entry: "重新确立对安纳托利亚的控制"
 flavor_lat.5.desc: "虽然重建的[ROOT.GetCountry.GetLongName]最初视之为一项艰巨任务，但我军将士奋力进取，已在[ShowRegionName('anatolia_region')]大展声威。尽管[ShowRegionNameWithNoTooltip('anatolia_region')]仍残存数个[ShowCultureName('turkish_culture')]邦国，但他们对[ROOT.GetCountry.GetNameWithNoTooltip]应已构不成严重威胁。"
 flavor_lat.5.a: "荣耀归于[ROOT.GetCountry.GetLongNameWithNoTooltip]！"
 flavor_lat.5.a.entry: "荣耀归于我们！"
 flavor_lat_anatolia_secured: "[ShowRegionName('anatolia_region')]内由[ROOT.GetCountry.GetName]或我方[subjects|e]拥有的每个[location|e]将获得[ShowModifier('lat_improved_location_integration')][modifier|e]，持续#Y 15#!年"
 flavor_lat.6.title: "对[target_country.GetNameWithNoTooltip]的征伐大获全胜"
 flavor_lat.6.entry: "击溃保加利亚"
 flavor_lat.6.desc: "曾经对当初的[ROOT.GetCountry.GetLongName]构成重大威胁的[target_country.GetLongName]现已被大幅削弱，其许多旧日领土如今落入[ROOT.GetCountry.GetAdjective]掌控之中。[target_country.GetAdjectiveWithNoTooltip]的精英不太可能恢复元气并对[ROOT.GetCountry.GetFlavorRank]构成威胁了。"
 flavor_lat.6.a: "我们应着手整合之前[target_country.GetAdjectiveWithNoTooltip]的行省。"
 flavor_lat.6.a.entry: "我们应着手整合旧国的行省。"
 flavor_lat_balkan_rival_lands_secured: "[ShowRegionName('balkan_region')]内属于[target_country.GetName]的[core|e]且由[ROOT.GetCountry.GetName]或我方[subjects|e]拥有的每个[location|e]将获得[ShowModifier('lat_improved_location_integration')][modifier|e]，持续#Y 15#!年"
 flavor_lat.7.title: "[target_country.GetAdjectiveWithNoTooltip]的野心被击溃"
 flavor_lat.7.entry: "塞尔维亚的野心被挫败"
 flavor_lat.7.desc: "尽管他们在一段时期内声势逐渐壮大，但[target_country.GetAdjective]的野心已被[ROOT.GetCountry.GetAdjective]将士摧毁，我军对[target_country.GetNameWithNoTooltip]的征伐使其力量衰减。随着[target_country.GetAdjectiveWithNoTooltip]在[ShowRegionName('balkan_region')]沦为一个次要势力，其野心应不再让我们担忧。"
 flavor_lat.7.a: "迅速行动以稳定从[target_country.GetNameWithNoTooltip]手中夺回的行省。"
 flavor_lat.7.a.entry: "迅速行动以稳定从他们手中夺回的行省。"
 flavor_lat.8.title: "旧[GetCountry('BYZ').GetAdjectiveWithNoTooltip]的精英"
 flavor_lat.8.entry: "旧拜占庭精英"
 flavor_lat.8.desc: "[constantinople_location.GetName]再度被攻克，不仅使[ROOT.GetCountry.GetLongName]得以重建，也彻底终结了旧[GetCountry('BYZ').GetLongName]复振的任何希望。许多旧[GetCountry('BYZ').GetAdjectiveWithNoTooltip]精英如今只是勉为其难地向[ROOT.GetCountry.GetNameWithNoTooltip]宣誓效忠。\n\n[ROOT.GetCountry.GetGovernment.GetCourtTitle]中许多人认为，[GetCountry('BYZ').GetLongNameWithNoTooltip]的篇章终于落幕，现在是时候让[ROOT.GetCountry.GetLongNameWithNoTooltip]在世界舞台上正式占据一席之地，并确立自身独特的身份认同了。"
 flavor_lat.8.a: "是时候让旧[GetCountry('BYZ').GetAdjectiveWithNoTooltip]文化安息了。"
 flavor_lat.8.a.entry: "是时候让旧$BYZ_ADJ$文化安息了。"
 flavor_lat.8.b: "我们应在新的[ROOT.GetCountry.GetFlavorRank]中保留[GetCountry('BYZ').GetAdjectiveWithNoTooltip]遗产。"
 flavor_lat.8.b.entry: "我们应在新的国度中保留$BYZ_ADJ$遗产。"
 flavor_lat.9.title: "[pap_country.GetAdjectiveWithNoTooltip]要求[ShowReligionAdjectiveWithNoTooltip('orthodox')]的旧土归信"
 flavor_lat.9.entry: "教宗要求拜占庭的旧土归信"
 flavor_lat.9.desc: "作为[pap_country.GetAdjective]支持重建[ROOT.GetCountry.GetLongName]的回报，[pap_country.GetGovernment.GetRulerTitle]曾要求在[constantinople_location.GetName]最终克复之时，新的[ROOT.GetCountry.GetAdjectiveWithNoTooltip]精英将颁布政令以削弱[ShowReligionAdjective('orthodox')]影响，并巩固[ShowReligionAdjective('catholic')]信仰。如今[constantinople_location.GetNameWithNoTooltip]再度属于我们，[ROOT.GetCountry.GetLongNameWithNoTooltip]也已重建，[scope_pope_ruler.GetName]要求我们兑现协议并开始实施这些政策。"
 flavor_lat.9.a: "兑现我们与[scope_pope_ruler.GetShortNameWithNoTooltip]的协议。"
 flavor_lat.9.a.entry: "兑现我们与他的协议。"
 flavor_lat.9.b: "允许这些政策生效，但放松执行力度。"
 flavor_lat.9.c: "撕毁协议，倾向对[ShowReligionAdjectiveWithNoTooltip('orthodox')]民众采取宽容政策。"
 lat_accepted_pope_latin_empire_proposal_tt: "已接受教宗复辟拉丁帝国的提案"
