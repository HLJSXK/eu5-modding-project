l_simp_chinese:
 flavor_byz_ser.1.title: "强大的专制公"
 flavor_byz_ser.1.entry: "$flavor_byz_ser.1.title$"
 flavor_byz_ser.1.desc: "[ROOT.GetCountry.GetAdjective][ShowProvinceDefinitionName('vardar_province')]由名望甚高的强大权贵[target_character.GetName]统治，其影响力巨大，几乎称得上独立。虽然[target_character.GetSheHe]目前效忠于[ROOT.GetCountry.GetFlavorRank]，但拥有如此财富和权威的君主往往不会长期尊重其宗主的统治。\n\n有传言称[target_character.GetNameWithNoTooltip]正在考虑放弃[target_character.GetHerHis]当前的附庸关系，转而投靠[target_country2.GetLongName]，甚至[target_country3.GetLongName]。"
 flavor_byz_ser.1.a: "这就是为什么要将更多权力集中于[ROOT.GetCountry.GetGovernment.GetRulerTitle]手中。"
 flavor_byz_ser.1.a.entry: "这就是为什么要将更多权力集中于统治者手中。"
 flavor_byz_ser.1.b: "我们必须确保[target_character.GetHerHis]的忠诚。"
 flavor_byz_ser.1.b.entry: "我们必须确保他的忠诚。"
 flavor_byz_ser.2.title: "$flavor_byz_ser.1.title$"
 flavor_byz_ser.2.entry: "$flavor_byz_ser.2.title$"
 flavor_byz_ser.2.desc: "[ShowProvinceDefinitionName('vardar_province')]地区曾经归属于强大的[ROOT.GetCountry.GetLongName]，但早已落入蛮族之手。如今，在几十年之后，我们也许可以通过一个难以置信的盟友将其带回我们的怀抱。\n\n统治[origin_country.GetName]的[target_country.GetAdjective]权贵[target_character.GetName]，似乎分得清轻重缓急。虽然名义上效忠于[target_country.GetLongNameWithNoTooltip]，但我们的间谍报告称，[target_character.GetHerHis]的这种效忠并不稳固，或许可以通过一些秘密手段让[target_character.GetSheHe]倒向我们。"
 flavor_byz_ser.2.a: "用金钱把[target_character.GetHerHim]淹没！"
 flavor_byz_ser.2.a.entry: "付给他大把大把金子！"
 flavor_byz_ser.3.title: "$flavor_byz_ser.1.title$"
 flavor_byz_ser.3.entry: "$flavor_byz_ser.3.title$"
 flavor_byz_ser.3.desc: "[target_character.GetName]从血腥的[target_country2.GetAdjective]内战中崛起，在[ROOT.GetCountry.GetAdjective][ShowProvinceDefinitionName('vardar_province')]拥有很大的权力和影响力。由于[target_country.GetNameWithNoTooltip]的[ShowSocietyDirectionName('decentralization')]，尽管名义上是[target_country.GetName]的[ShowSubjectTypeName('vassal')]，但[target_character.GetHerHis]的统治事实上接近独立。[target_character.GetSheHe]有望成为该地区的拥王者。"
 flavor_byz_ser.3.a: "权力导致腐败，专制的权力导致专制的腐败。"
 SER_threat_of_secession: "如果[origin_country.GetName]在#W 1341#!年开始时[subject_loyalty|e]低于#Y 50.0%#!，他们会改换阵营，成为[target_country2.GetName]的[ShowSubjectTypeName('vassal')]"
 SMC_player: "由于[origin_country.GetName]是人类玩家，最终决定完全取决于其在相关[event|e]中的选择"
 BYZ_threat_of_secession: "如果[origin_country.GetName]在#W 1341#!年开始时[subject_loyalty|e]低于#Y 50.0%#!，他们会改换阵营，成为[ROOT.GetCountry.GetName]的[ShowSubjectTypeName('vassal')]"
 SMC_threat_of_secession: "在#W 1341#!年，我们将可以选择成为[target_country2.GetName]的[ShowSubjectTypeName('vassal')]。根据我们的[subject_loyalty|e]，选择一方可能会消耗[stability|e]"
 flavor_byz_ser.4.title: "清算之时"
 flavor_byz_ser.4.entry: "$flavor_byz_ser.4.title$"
 flavor_byz_ser.4.desc: "几年过去了，[target_country2.GetAdjective]特使多次访问[ROOT.GetCountry.GetAdjective][ROOT.GetCountry.GetGovernment.GetCourtTitle]。他们的目标——将我们从[target_country.GetName]拉开，推向南方的[target_country2.GetFlavorRank]。不过，我们能看穿他们的手段，我们不会那么轻易被他们的口头承诺拉拢。我们拥有最终的决定权，无论我们支持哪个国家，都将在未来几十年对[ShowRegionName('balkan_region')]区域产生深远影响。"
 flavor_byz_ser.4.a: "我们的忠诚毋容置疑。"
 flavor_byz_ser.4.b: "有必要做出改变。"
 flavor_byz_ser.5.title: "[origin_country.GetLongNameWithNoTooltip]的命运"
 flavor_byz_ser.5.desc: "尽管关于[origin_country.GetAdjective]不忠的传言甚嚣尘上，但事实证明，权贵与[target_country.GetAdjective]之间流动的[ShowCultureName('serbian_culture')]纽带比他们的贪婪更深……即使有[target_country2.GetAdjective]的干预，[origin_country.GetNameWithNoTooltip][origin_country.GetGovernment.GetRulerTitle]不为所动——[origin_country.GetNameWithNoTooltip]仍将是[target_country.GetLongNameWithNoTooltip]的一部分。"
 flavor_byz_ser.5.byz: "唉，总有一天我们会征服这里……"
 flavor_byz_ser.5.ser: "正如所料。"
 flavor_byz_ser.6.title: "$flavor_byz_ser.5.title$"
 flavor_byz_ser.6.desc: "一件不寻常事件发生，在[target_country.GetName]和[target_country2.GetLongName]间引起了外交冲突！[origin_country.GetName]的领主们站在[target_country2.GetNameWithNoTooltip]一边，转而宣誓效忠他们前主人的敌人。权贵们很少有胆量背叛他们的宗主！\n\n[origin_country.GetNameWithNoTooltip]的[origin_country.GetGovernment.GetRulerTitle]已经决定了[ShowProvinceDefinitionName('vardar_province')]的命运——[origin_country.GetNameWithNoTooltip]不再服从于[target_country.GetNameWithNoTooltip]，他们的未来取决于[target_country2.GetNameWithNoTooltip]。"
 flavor_byz_ser.6.byz: "他们做出了明智的选择。"
 flavor_byz_ser.6.ser: "有人会为此遭殃！"
 SMC_remains_vassal_of_serbia: "[origin_country.GetName]仍然是[target_country.GetName]的[ShowSubjectTypeName('vassal')]"
