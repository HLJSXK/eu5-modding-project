l_simp_chinese:
 flavor_bos.1.title: "独立诉求"
 flavor_bos.1.entry: "$flavor_bos.1.title$"
 flavor_bos.1.desc: "[hun_robert.GetName]的逝世带来了前所未有的机遇。随着[GetCountry('HUN').GetName]衰弱且分身乏术，[target_ruler.GetName]开始设想让[ROOT.GetCountry.GetName]摆脱[GetCountry('HUN').GetAdjectiveWithNoTooltip]的统治。有人建议，我们不应公开发起叛乱，而应暗中破坏他们的统治，并与其敌人展开外交接触——这或许能在我们追求自由的道路上派上用场。"
 flavor_bos.1.a: "我们必须利用这个机会。"
 flavor_bos.1.b: "我们应该继续效忠于[GetCountry('HUN').GetAdjectiveWithNoTooltip][GetCountry('HUN').GetGovernment.GetEstateNameWithNoTooltip('crown_estate')]。"
 flavor_bos.1.b.entry: "我们应当继续忠于$HUN_ADJ$$crown_estate$。"
 flavor_bos.1.a.tt: "持续削弱[GetCountry('HUN').GetAdjectiveWithNoTooltip]的权威，例如改善与其宿敌的关系和降低我们的忠诚度，可能会迫使[GetCountry('HUN').GetNameWithNoTooltip]重新考虑我们作为其附属国的地位。"
 flavor_bos.1.historical_info: "斯特凡二世统治时，致力于通过挑动匈牙利与其对手的矛盾，实现波斯尼亚从匈牙利统治下的独立。在匈牙利的关键盟友，如查理·罗贝尔国王和斯拉沃尼亚的米卡茨去世后，斯特凡开始利用匈牙利与威尼斯的战争，通过贿赂、拒绝效忠，甚至泄露军事部署等手段从中渔利。这些举动让斯特凡有了“魔鬼学徒”的绰号，也让新任匈牙利国王对他极不信任，但精疲力竭的匈牙利王室既没能力也没意愿将其除去。斯特凡二世统治结束时，匈牙利对波斯尼亚的掌控已经名存实亡。"
 flavor_bos.2.title: "[GetCountry('SER').GetNameWithNoTooltip]的衰落"
 flavor_bos.2.entry: "塞尔维亚的衰落"
 flavor_bos.2.desc: "[ser_dusan.GetName]去世后，[GetCountry('SER').GetName]多年来一直陷入内部争斗。统治权威的日益衰弱导致多位地方领主争夺权力，但他们中无人拥有足以宣称王位的王朝合法性或权威。鉴于我们的统治者与[ser_dusan.GetDynasty.GetName]王朝拥有血缘纽带，我们有权合法地宣称其王冠。"
 flavor_bos.2.a: "利用其分裂局面扩大我们的影响力。"
 flavor_bos.2.b: "让我们专注于内部事务。"
 flavor_bos.2.historical_info: "内马尼奇王朝的覆灭使塞尔维亚王位实际上处于空缺状态，地方势力各自统治着前帝国支离破碎的领土。特夫尔特科一世利用了这一权力真空，凭借其祖母传下的内马尼奇血统，宣称拥有塞尔维亚王位继承权，并致力于向东扩张波斯尼亚的影响力。"
 flavor_bos.3.title: "[ROOT.GetCountry.GetNameWithNoTooltip]第一位国王"
 flavor_bos.3.entry: "$flavor_bos.3.title$"
 flavor_bos.3.desc: "我们军事行动的成功将大片前[GetCountry('SER').GetAdjective]领土纳入掌控。这次胜利鼓舞了[target_ruler.GetName]，使其进一步提出一个大胆的建议。[target_ruler.GetSheHe|U]不仅希望正式登上[GetCountry('SER').GetNameWithNoTooltip]宝座，还要将[ROOT.GetCountry.GetName]升格到王国，加冕为我国历史上的第一位国王。"
 flavor_bos.3.a: "我们国家需要一位国王。"
 flavor_bos.3.b: "王冠带来的麻烦远多于权力。"
 flavor_bos.3.historical_info: "到14世纪70年代初，前塞尔维亚帝国已经解体，并被包括波斯尼亚的特夫尔特科在内的多位地方领主瓜分。然而，特夫尔特科与其他领主的地位有着根本的不同，他早已统治着一个独立国家，其中包含塞尔维亚帝国的大片土地。更重要的是，他声称自己拥有内马尼奇家族的王室血统，这为其赋予了其他塞尔维亚领主所不具备的合法性。基于这些权利，他的宫廷明确了他加冕的基础以及他拥有双重王冠的权利，最终使特夫尔特科于1377年秋加冕为塞尔维亚人和波斯尼亚的国王。"
 flavor_bos.4.title: "斯特罗伊尼奇议会召开"
 flavor_bos.4.entry: "$flavor_bos.4.title$"
 flavor_bos.4.desc: "[ROOT.GetCountry.GetAdjective]教会的长老会成员，即斯特罗伊尼奇，已齐聚一堂，商讨我们信仰未来的走向。长期存在的争端、教义问题以及许多其他事项都在这次议会面前坦陈于众。"
 flavor_bos.4.a: "教会将稳定置于一切之上。"
 flavor_bos.4.b: "我们应致力于阐明我们的教义。"
 flavor_bos.4.c: "专注于解决内部争端。"
 flavor_bos.4.d: "我们将打理教会的财产。"
 flavor_bos.5.title: "[ROOT.GetCountry.GetAdjectiveWithNoTooltip]教会的命运"
 flavor_bos.5.entry: "$flavor_bos.5.title$"
 flavor_bos.5.desc: "[GetUniqueInternationalOrganization('catholic_church').GetName]对[ROOT.GetCountry.GetFlavorRank]施加的压力越来越难以承受。有消息称，[target_pope.GetName]指控我国庇护危险异端，再度考虑对[ROOT.GetCountry.GetName]发起十字军。数代以来，我们始终捍卫本土教会的存续，但或许现在是时候屈服，在[ShowReligionAdjective('catholic')]世界的各国中谋得一个位置了。"
 flavor_bos.5.a: "我们的教会将屹立不倒！"
 flavor_bos.5.b: "我们将加入[ShowReligionAdjectiveWithNoTooltip('catholic')]世界。"
 flavor_bos.5.c: "我们将转而投向[ShowLocationNameWithNoTooltip('constantinople')]。"
 flavor_bos.5_catholic_unhappy: "所有[ShowReligionAdjective('catholic')][pops|e]失去[ShowNamedValue('pop_satisfaction_severe_penalty')|+=2%][pop_satisfaction|e]"
 flavor_bos.5_krstjani_unhappy: "所有[ShowReligionAdjective('bosnian_church')][pops|e]失去[ShowNamedValue('pop_satisfaction_severe_penalty')|+=2%][pop_satisfaction|e]"
 flavor_bos.5_orthodox_unhappy: "所有[ShowReligionAdjective('orthodox')][pops|e]失去[ShowNamedValue('pop_satisfaction_severe_penalty')|+=2%][pop_satisfaction|e]"
 flavor_bos.5.historical_info: "波斯尼亚教会因常被指控庇护异端信仰，成为教廷长期批评与干预的对象。1203年，该教会的代表签署了《比利诺波列弃绝书》，同意放弃被视为异端的行为并遵从天主教教义。尽管如此，许多人仍秘密维持着他们的传统习俗。1337年，教宗本笃十二世号召再次发动十字军，但这些努力最终失败。波斯尼亚教会一直存续到奥斯曼帝国占领该地区。"
