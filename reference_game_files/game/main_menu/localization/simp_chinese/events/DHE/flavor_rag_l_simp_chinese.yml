l_simp_chinese:
 flavor_rag.1000.title: "门口的敌人"
 flavor_rag.1000.entry: "$flavor_rag.1000.title$"
 flavor_rag.1000.desc: "坏消息传到了[ROOT.GetCountry.GetGovernment.GetCourtTitle]：强大的[GetCountry('TUR').GetAdjective]军队终于抵达了我们的边境。很明显我们[ROOT.GetCountry.GetFlavorRank]永远不可能以武力抵挡他们，因此我们的一些贵族提出了一个大胆的建议。他们认为，[GetCountry('TUR').GetNameWithNoTooltip]和[ROOT.GetCountry.GetName]并没有根本的利益冲突，承认他们的至高权威并缴纳贡品，以换取保护和自由，这也是我们生存的一种方式。"
 flavor_rag.1000.a: "派一名使者与[GetCountry('TUR').GetGovernment.GetRulerTitle]谈判。"
 flavor_rag.1000.a.entry: "派一名使者与他们谈判。"
 flavor_rag.1000.b: "我们将不惜一切代价捍卫独立！"
 flavor_rag.1000.historical_info: "1458年，拉古萨共和国正式与奥斯曼帝国建立了朝贡关系。尽管该协议迫使拉古萨每年缴纳约12500金币，但它保留了大量自治权，并能够维持其商船队和进行外交活动。这种互利关系持续了几个世纪，拉古萨一直是奥斯曼帝国的附属国，直到1808年拿破仑战争期间共和国被废除。"
 flavor_rag.1001.title: "[GetCountry('RAG').GetNameWithNoTooltip]的提议"
 flavor_rag.1001.desc: "一位来自[GetCountry('RAG').GetName]的特使已抵达[ROOT.GetCountry.GetGovernment.GetCourtTitle]，并向[ROOT.GetCountry.GetGovernment.GetRulerTitle]提出了一个谦卑的提议。[GetCountry('RAG').GetAdjectiveWithNoTooltip]特使承认，他们的[GetCountry('RAG').GetFlavorRank]无望抵制我们的力量，于是寻求一种务实的安排。他们愿意承认我们的至高权威，并每年向我们纳贡，以换取我们的保护和贸易自由。虽然有些人认为这是一项公平的协议，将有利于扩大我们的势力范围，但也有一些人认为，应该彻底征服这样一个弱国。"
 flavor_rag.1001.a: "接受他们的贡品。"
 flavor_rag.1001.b: "卧榻之侧，岂容他人鼾睡。"
