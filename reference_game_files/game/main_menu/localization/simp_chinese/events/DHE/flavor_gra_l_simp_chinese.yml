l_simp_chinese:
 flavor_gra.1.title: "摩尔难民"
 flavor_gra.1.desc: "以至仁至慈的安拉之名。格拉纳达被异教徒攻陷了！这颗安达卢斯最后的珍宝，学术的灯塔现在落入了卡斯蒂利亚人手中。伊斯兰世界还沉浸在此次陷落的悲痛中时，摩尔难民如潮水般涌入了北非和中东的穆斯林城市，同时带来了他们传承自伊本·路世德、宰赫拉威、图费勒等著名学者的知识。邀请这些难民到[ROOT.GetCountry.GetName]将为我们在科学和文化方面的发展带来巨大的帮助。"
 flavor_gra.1.a: "用尽一切办法让他们来[ROOT.GetCountry.GetNameWithNoTooltip]！"
 flavor_gra.1.a.entry: "用尽一切办法让他们来！"
 flavor_gra.1.b: "不，我们并不需要他们。"
 flavor_gra.2.title: "西西里埃米尔国"
 flavor_gra.2.entry: "$flavor_gra.2.title$"
 flavor_gra.2.desc: "西西里埃米尔国曾是我们信仰的坚固堡垒，直到1087年十字军征服了这座岛屿。\n\n现在我们拥有了这片令人垂涎的土地，我们不会再次失去它！"
 flavor_gra.2.a: "绝对的权威需要绝对的统治。"
 STATIC_MODIFIER_NAME_sicily_in_safe_hands: "行政投资"
 STATIC_MODIFIER_NAME_DESC_sicily_in_safe_hands: "西西里岛由我们直接控制能够发挥更大的作用——因此，我们能够投资更多资源，诱使这个岛屿走向繁荣。"
 flavor_gra.3.title: "[GetCountry('TUR').GetNameWithNoTooltip]的援助"
 flavor_gra.3.entry: "请求奥斯曼支持"
 flavor_gra.3.desc: "由于我们现在正将与[GetCountry('CAS').GetName]展开一场无望的战争，我们必须向远隔汪洋的同宗兄弟发出绝望的呼救。如果我们能忍受低三下四求人的屈辱，[GetCountry('TUR').GetGovernment.GetRuler.GetDynasty.GetName]也许会向我们伸出援手！"
 flavor_gra.3.a: "他们是我们的救命稻草！"
 flavor_gra.3.tt: "[GetCountry('TUR').GetNameWithNoTooltip|U]可能会保护我们免受[GetCountry('CAS').GetNameWithNoTooltip]的威胁"
 flavor_gra.3.b: "我们必须孤军奋战。"
 flavor_gra.3.historical_info: "格拉纳达的奈斯尔王朝埃米尔向奥斯曼土耳其和$mamluks$同时派出了使节，以请求援助对抗卡斯蒂利亚。由于奥斯曼一直试图增强他们在西地中海的存在，格拉纳达大胆地提出了派遣20万土耳其军队在巴伦西亚登陆以支援他们的计划。"
 flavor_gra.4.title: "令人沮丧的回应"
 flavor_gra.4.entry: "$flavor_gra.4.title$"
 flavor_gra.4.desc: "我们收到了来自[GetCountry('TUR').GetName]的消息，结果是他们#italic 婉拒#!了对我们的支援。他们称，尽管他们急切地想要帮助我们，但还有其他更要紧的事务要处理。不过，他们在信中不吝辞藻地盛赞了安达卢西亚昔日的辉煌——可是漂亮话值几个师呢？"
 flavor_gra.4.a: "我们必须继续战斗！"
 flavor_gra.4.historical_info: "格拉纳达埃米尔急切地希望得到奥斯曼和$mamluk$的支持，然而由于奥斯曼和$mamluks$之间很快爆发了战争，因此两国都无法提供直接支援。土耳其派出了一支由凯末尔·雷斯领导的私掠舰队以袭击卡斯蒂利亚在西地中海的领地，这只舰队后来帮助了许多难民渡海求生。"
 ibn_khaldun_patronage: "一位才智非凡且声名显赫的人士已抵达我们的[ROOT.GetCountry.GetGovernment.GetCourtTitle]。[target_character.GetName]是著名的历史学家和哲学家，希望获得资助以继续[target_character.GetHerHis]的研究与写作。以[target_character.GetHerHis]对治国之道、经济学以及帝国兴衰的深刻见解而闻名，[target_character.GetHerHis]的到来将提升我们[ROOT.GetCountry.GetGovernment.GetCourtTitle]的声望，并为我们提供宝贵的建议。我们是否应授予[target_character.GetHerHim]渴望的职位？"
 flavor_gra.5.title: "[target_character.GetNameWithNoTooltip]请求资助"
 flavor_gra.5.entry: "伊本·赫勒敦请求赞助"
 flavor_gra.5.desc: "$ibn_khaldun_patronage$"
 flavor_gra.5.a: "很好。"
 flavor_gra.5.b: "我们不在乎这种无谓的开支！"
 flavor_gra.6.title: "海峡明珠"
 flavor_gra.6.entry: "$flavor_gra.6.title$"
 flavor_gra.6.desc: "一封来自[target_location.GetName]#italic 总督#!的喜报送达案头。当地城墙坚不可摧，港口繁忙不息，本月国库收到的汇款，是全年[ROOT.GetCountry.GetFlavorRank]各地单次汇款数额最大的一笔。从阿尔卡萨瓦城堡，乃至其上方高耸的希布拉法罗城堡的瞭望哨望去，海峡对岸在每个晴朗的早晨都清晰可见——这已是[ROOT.GetCountry.GetGovernment.GetCourtTitle]所需知晓的大部分情形。\n\n[ROOT.GetCountry.GetCapital.GetName]赋予我们王座，而[target_location.GetNameWithNoTooltip]赋予我们其余的一切。它的码头承载了我们关税收入的大头。[GetCountry('GEN').GetAdjective]商人惯例在此度过寒冬，而其腹地酿造的高烈度甜葡萄酒，远销至[GetCountry('FLA').GetName]。这是我们最最不能失去的一座城市。\n\n而这，恰恰是他人对其垂涎三尺的原因。[GetCountry('CAS').GetName]觊觎此港已两代之久。我们诸多宗亲亦不例外：不止一位日后戴上王冠之人，从那里的城墙上首举叛旗；而他们后来镇压的叛军中，也有人做过同样的事。"
 flavor_gra.6.a: "我们将如同守卫王冠本身一样，守护马拉加。"
 flavor_gra.6.historical_info: "马拉加是格拉纳达埃米尔国治下的第二大城市，也是中世纪伊斯兰世界最重要的地中海港口之一。1239年，奈斯尔王朝吞并哈穆德王朝最后一个泰法后，该城由苏丹直接任命的#italic 瓦利#!（总督）管辖。首任总督为穆罕默德一世的兄弟伊斯玛仪，此后这一职位几乎始终由近支王室成员担任。\n\n马拉加的防御体系以阿尔卡萨瓦城堡为核心——这是一座俯瞰港口的山顶宫殿式要塞，并辅以更高处的希布拉法罗城堡，两者由一道带顶盖的城墙相连。从那些高地之上，瞭望哨能够在船只抵达港口数日前，便发现绕过直布罗陀海峡的船影。下方，#italic 商旅驿馆#!中居住着热那亚、加泰罗尼亚及马格里布商人，而马拉加的海关收入，则是奈斯尔王朝国库中最大的单项财源。\n\n马拉加出口的商品远达佛兰德与埃及。安达卢斯的丝绸和光泽彩陶、阿克萨尔基亚的无花果干与葡萄干以及使该城在欧洲市场上享有持久声誉的高烈度甜葡萄酒，均从这些码头启程远航。瓜达尔梅迪纳河上的造船厂为奈斯尔王朝提供了桨帆战舰，与其马林王朝的盟友共同巡弋于海峡之上。\n\n马拉加的统治权既带来声望，也伴随着危险。此职位既是通向王座的踏脚石，也是每当王朝内部分裂时反复出现的叛乱策源地。所谓的“红苏丹”穆罕默德六世于1359年在此城举旗起事，而马拉加最终于1487年陷落于天主教双王之手，比格拉纳达本城的陷落早了整整五年，从而终结了半岛上的安达卢斯统治。"
 flavor_gra.7.entry: "$flavor_gra.7.title$"
 flavor_gra.7.title: "收复[ShowLocationNameWithNoTooltip('cordoba')]"
 flavor_gra.7.desc: "以[ROOT.GetReligion.GetGodName]之名，[target_location.GetName]城已然光复。这座[target_location.GetRank.GetName]昔日是$ADU$王朝的重要据点，如今[target_character.GetName]与[ROOT.GetCountry.GetGovernment.GetCourtTitle]意欲重振其曾经拥有的[ROOT.GetCountry.GetReligion.GetAdjective]影响力。"
 flavor_gra.7.a: "我们必须维护其[ROOT.GetCountry.GetReligion.GetAdjectiveWithNoTooltip]传统信仰。"
 gra_convert_cordoba_to_root_religion: "[target_location.GetName]#Y 40%#!的[pops|e]将皈依[ROOT.GetCountry.GetReligion.GetName]"
 flavor_gra.7.b: "与其强制改宗，不如接纳并融合他们。"
 flavor_gra.8.entry: "$flavor_gra.8.title$"
 flavor_gra.8.title: "[ShowRegionNameWithNoTooltip('iberia_region')]的明珠"
 flavor_gra.8.desc: "在[ShowRegionName('iberia_region')]的中心地带，坐落着一座在漫长岁月中始终作为[ShowReligionGroupAdjective('christian')]、[ShowReligionGroupAdjective('muslim')]与[ShowReligionGroupAdjective('judaism')]文化交汇枢纽的[target_location.GetRank.GetName]。如今，这座名城已置于我们的掌控之下，[ROOT.GetCountry.GetRank.GetName]将得以决定其未来走向。\n\n[ROOT.GetCountry.GetGovernment.GetCourtTitle]与[target_character.GetName]皆期盼这座[target_location.GetRank.GetNameWithNoTooltip]能绽放出更加璀璨的光辉。各阶层已倾注心力，致力于将[target_location.GetName]塑造成[ShowRegionNameWithNoTooltip('iberia_region')]半岛上的一颗明珠。"
 flavor_gra.8.a: "让[ShowLocationNameWithNoTooltip('toledo')]繁荣昌盛！"
 flavor_gra.9.entry: "$flavor_gra.9.title$"
 flavor_gra.9.title: "塞法迪犹太人"
 flavor_gra.9.desc: "[ShowRegionName('iberia_region')]半岛长期以来一直是[ShowReligionName('judaism')]信仰者的重要中心，他们聚居在繁荣的[target_location.GetRank.GetName]之中，形成了各自的社区。其中许多人选择将[target_location.GetName]打造为一处避难所，期望在那里能够免受迫害与歧视，自由生活。\n\n[ROOT.GetCountry.GetGovernment.GetCourtTitle]已注意到这一发展态势。有些人对此表示支持，而另一些人在信仰问题上则更为极端。他们认为这是对[ROOT.GetCountry.GetFlavorRank]一切神圣之物的亵渎，绝不应允许这些人腐蚀[target_location.GetNameWithNoTooltip]！"
 flavor_gra.9.a: "我们将保护[ShowReligionAdjectiveWithNoTooltip('judaism')]信徒的权利。"
 flavor_gra.9.b: "[ROOT.GetCountry.GetReligion.GetGodName]绝不允许这些不信者安居乐业！"
 gra_jewish_people_in_target_location_become_unhappy: "[target_location.GetName]所有[ShowReligionAdjective('judaism')][pop|e]会失去[ShowNamedValue('pop_satisfaction_extreme_penalty')|+=2%]"
 flavor_gra.10.entry: "统治者遇刺"
 flavor_gra.10.title: "刺杀[target_character.GetNameWithNoTooltip]"
 flavor_gra.10.desc: "悲剧降临了[ROOT.GetCountry.GetName]！\n\n在[target_location.GetName]的祈祷结束后，一名心怀不轨的凶徒袭击了[target_character.GetName]，导致[target_character.GetHerHim]身受重伤。即便最杰出的医师也无力挽救[target_character.GetSheHe]身上那数不清的创伤，几个小时后，[target_character.GetSheHe]被宣告离世。\n\n尽管此事令[ROOT.GetCountry.GetGovernment.GetCourtTitle]上下悲痛欲绝，但仍有人坚称这是一场精心策划的阴谋。他们声称，某些反对[target_character.GetHerHis]统治的人故意引开了卫兵的注意，让那名凶手得以抓住其等待已久的时机。然而，真相无人知晓，最好的选择或许是让棺木就此永远合上。"
 flavor_gra.10.a: "[ROOT.GetCountry.GetNameWithNoTooltip]的未来将会如何？"
 flavor_gra.11.entry: "$flavor_gra.11.title$"
 flavor_gra.11.title: "[ShowLocationNameWithNoTooltip('granada')][ShowGoodsNameWithNoTooltip('silk')]"
 flavor_gra.11.desc: "[ROOT.GetCountry.GetName]出产的[ShowGoodsName('silk')]，或许在整个[ShowContinentName('europe')]都享有最高的声誉。来自[ShowLocationName('genoa')]、[ShowLocationName('venice')]，甚至远至[ShowLocationName('prague')]的商人，都渴望购买这一奢侈品，以满足其[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]的需求。而对我们来说，这无疑是一项利润丰厚的交易。\n\n然而，我们的[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]希望我们不应仅仅满足于出口[ShowGoodsNameWithNoTooltip('silk')]所带来的金钱收益，更应努力推广这一商品，使其成为全世界争相购买的对象，并通过垄断其贸易来提升我们的声望。"
 flavor_gra.11.a: "[ShowLocationNameWithNoTooltip('granada')]的[ShowGoodsNameWithNoTooltip('silk')]将举世闻名！"
 unlock_expand_iberian_silk_decision: "在征服[ShowLocationName('murcia')]后，我们将解锁$gra_expand_seda_de_granada.title$[decision|e]"
 flavor_gra.12.entry: "$flavor_gra.12.title$"
 flavor_gra.12.title: "商业拓展"
 flavor_gra.12.desc: "我们的[ShowGoodsName('silk')]在整个[ShowContinentName('europe')]享有最高的声誉。[ROOT.GetCountry.GetName]各地的[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]不仅希望销售此商品以获取利润，还希望向世界展示其无与伦比的品质。虽然他们无法独自完成这一目标，但他们请求我们建立贸易路线以确保贸易持续进行。这也将帮助我们在[ShowGoodsNameWithNoTooltip('silk')]贸易方面维护我们的声誉与威望。"
 flavor_gra.12.a: "让我们以外交手段寻求拓展贸易。"
 flavor_gra.13.entry: "$flavor_gra.13.title$"
 flavor_gra.13.title: "$ghuzat_mujahidin_bureaucracy$"
 flavor_gra.13.desc: "为了[ROOT.GetCountry.GetName]的存续，众多志愿兵加入了我们的军队。\n\n这些士兵主要来自[ShowCultureGroupName('amazigh_group')]族群，由[target_character2.GetName]统辖——此人虽有能力，却反复无常。为了确保我们在[ShowSituationName('battle_for_the_strait')]中的独立地位，我们必须尽可能掌控更多不确定因素，而这些志愿兵作为拥立者，其作用至关重要。与其让他们受制于外部因素，我们应尝试在其队伍中灌输[target_character.GetDynasty.GetName]王朝的领导力，从而消除背叛的风险。"
 flavor_gra.13.a: "让这些人为我们效力，一个不少。"
 flavor_gra.13.b: "我们将剔除那些并非完全忠于我们的人。"
 gra_mercenary_company_will_be_weaker_and_more_expensive: "该[mercenary|e]连队将仅拥有#Y 一半#!的兵员，且费用更为高昂"
 flavor_gra.14.entry: "$flavor_gra.14.title$"
 flavor_gra.14.title: "幸园宫"
 flavor_gra.14.desc: "坐落于[ShowLocationName('granada')]的[ShowBuildingTypeName('alhambra')]，向来是我们作为[ShowRegionName('iberia_region')]半岛强大[ROOT.GetCountry.GetRank.GetName]的威望象征。然而，对于像[target_character.GetName]这般永远无法满足的统治者而言，这还远远不够。[target_character.GetSheHe]渴望向整个[ShowReligionGroupAdjective('muslim')]世界彰显[target_character.GetDynasty.GetName]王朝的辉煌，于是决意聘请最杰出的建筑师，在[ShowBuildingTypeNameWithNoTooltip('alhambra')]的核心区域再建一座宫殿，以狮子雕像与#italic 穆卡纳斯#!穹顶作为装饰。"
 flavor_gra.14.a: "我们将资助这一工程。"
 flavor_gra.14.b: "让世界见证[target_character.GetDynasty.GetNameWithNoTooltip]王朝的荣耀！"
 flavor_gra.14.b.entry: "让世界见证我们王朝的荣耀！"
 flavor_gra.14.c: "我们不应试图满足那些永不满足之人。"
 flavor_gra.15.entry: "$flavor_gra.15.title$"
 flavor_gra.15.title: "斗争中的机遇"
 flavor_gra.15.desc: "我们的外交官与间谍报告称，[target_country.GetName]内部已出现严重分歧。这场纷争之剧烈，使得[target_character2.GetName]不得不将精力转向国内事务，从而让我们在其强加于我们的枷锁之下得以喘息。[target_character.GetName]认为，这一局面可被用于在[ShowSituationName('battle_for_the_strait')]中争取优势，因为我们已无需再将主要精力集中于[target_country.GetNameWithNoTooltip]方向的战线。"
 flavor_gra.15.a: "让我们祈祷他们的困境持续下去。"
 gra_gain_granadan_sovereignty_for_the_rest_of_the_disaster: "只要[GetCountry('CAS').GetName]或[GetCountry('MOR').GetName]仍处于[disaster|e]，我们将每月获得#G 0.1#![granadan_sovereignty|e]"
 flavor_gra.16.entry: "$flavor_gra.16.title$"
 flavor_gra.16.title: "[ShowProvinceDefinitionNameWithNoTooltip('malaga_province')]的纷争"
 flavor_gra.16.desc: "尽管我们在[ShowRegionName('iberia_region')]半岛依然保有主权，但[GetCountry('MOR').GetName]的统治者已在[ShowProvinceDefinitionName('malaga_province')]一带的领地中站稳了脚跟——这些领土本应属于我们[ROOT.GetCountry.GetRank.GetName]的管辖范围。\n\n[target_character2.GetName]认为，鉴于[GetCountry('MOR').GetNameWithNoTooltip]过去对我们提供的种种援助，应当允许他们保留这些领地。然而，[ROOT.GetCountry.GetName]国内各阶层均视其为对我们独立的威胁，强烈希望我们能够收复原本属于我们的土地。"
 flavor_gra.16.a: "让我们挺身而出，收复领土。"
 flavor_gra.16.b: "我们不应如此激怒邻邦。"
 flavor_gra.17.entry: "$flavor_gra.17.title$"
 flavor_gra.17.title: "旧哈里发国的都城"
 flavor_gra.17.desc: "[ShowLocationName('cordoba')]这座重要都会，长期以来在[ROOT.GetCountry.GetName]的历史中扮演着举足轻重的角色。它曾是一座繁荣昌盛的[ShowLocationRankName('city')]，也是[ShowRegionName('iberia_region')]半岛的核心所在。然而如今，城中的街巷却充斥着罪恶的气息，居民们纷纷诅咒降临于此的衰败颓势。在与[ShowReligionGroupAdjective('christian')]统治者的冲突过后，许多古迹依然荒废无人问津。\n\n[target_character.GetName]绝不容许这种腐朽败落持续下去。这座城市曾享有赫赫声名，[ShowContinentName('europe')]最有权势的人物曾在此统治一方——既然如此，[target_character.GetSheHe]为何不能将其重新打造为举世无双的伟大都城？"
 flavor_gra.17.a: "[ShowLocationNameWithNoTooltip('cordoba')]将再次繁荣昌盛！"
 flavor_gra.17.b: "我们应将[ROOT.GetCountry.GetGovernment.GetCourtTitle]留在现在的城市。"
 flavor_gra.18.entry: "$flavor_gra.18.title$"
 flavor_gra.18.title: "对抗[GetCountry('CAS').GetNameWithNoTooltip]"
 flavor_gra.18.desc: "作为$ADU$王朝的传承者，我们心中满怀自豪，然而，被迫向[GetCountry('CAS').GetName]进贡，却成为我们[ROOT.GetCountry.GetGovernment.GetCourtTitle]中无法抹去的深切耻辱。这些沉重的贡赋不仅拖累了我们的经济发展，更助长了我们在[ShowRegionName('iberia_region')]斗争中的宿敌势力。许多军队人士认为，与其继续忍受这种屈辱的局面，不如将此刻视为挣脱枷锁、卸下外来负担的转折点。"
 flavor_gra.18.a: "即便此次未能成功，终有一日我们将打破这些锁链。"
 flavor_gra.18.b: "暂且顺从。日后我们还会另有机会。"
 flavor_gra.19.title: "收紧枷锁"
 flavor_gra.19.desc: "我们与[from_country.GetName]建立的关系已然破裂。[target_character.GetName]并未安于享受其繁荣局面，反而察觉到我方边境的薄弱之处，并决定停止进贡。此事已引起我们的关注，如今[ROOT.GetCountry.GetGovernment.GetCourtTitle]上下坚持要求我们提醒其履行应尽之义务。倘若他们继续拒绝缴纳应纳的贡赋，这或许将成为我们彻底吞并[from_country.GetNameWithNoTooltip]的绝佳契机。"
 flavor_gra.19.a: "[from_country.GetCapital.GetNameWithNoTooltip]必将陷落！"
 flavor_gra.19.a.entry: "他们会为此付出代价！"
 flavor_gra.20.entry: "$flavor_gra.20.title$"
 flavor_gra.20.title: "[ShowLocationNameWithNoTooltip('granada')]市场的繁荣"
 flavor_gra.20.desc: "我们的[ShowGoodsName('silk')]产业，以及[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]阶层在整个[ShowContinentName('europe')]积极从事贸易的热忱，推动[ShowLocationName('granada')]建立了新的市场。这一发展激励了许多[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')]拓展贸易，他们动用自己所能调集的一切影响力和资金，全力推进这项事业。\n\n一座宏伟的[ShowBuildingTypeName('marketplace')]——[ShowBuildingTypeName('al_qaysariyya_market')]即将拔地而起，其目标在于成为整个[ShowRegionName('iberia_region')]半岛最伟大的贸易枢纽，吸引外国商人前来，并鼓励我们的商人与世界最遥远的角落进行交易。"
 flavor_gra.20.a: "让我们建造[ShowBuildingTypeNameWithNoTooltip('al_qaysariyya_market')]。"
 flavor_gra.20.b: "我们大概得让[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')]们失望了。"
 flavor_gra.21.entry: "$flavor_gra.21.title$"
 flavor_gra.21.title: "宫殿之都：[ShowLocationNameWithNoTooltip('cordoba')]"
 flavor_gra.21.desc: "11世纪的菲特纳动荡使[ShowRegionName('iberia_region')]半岛的[ShowReligionGroupAdjective('muslim')]统治区域陷入混乱，众多重要场所随之湮没于历史长河。其间，[ShowBuildingTypeName('madinat_al_zahra')]便是其中之一——这座宏伟的宫殿群遍布[ShowLocationName('cordoba')]西郊，内部充盈着奢华的清真寺、繁茂的花园以及装备精良的营房，曾作为$rank_empire_muslim_ruler_male$凌驾于[ShowReligionGroupAdjectiveWithNoTooltip('muslim')]世界其他地区之上的荣耀象征。\n\n[target_character.GetName]渴望重建这座[ShowLocationRankName('city')]，以让[target_character.GetHerselfHimself]本人超越那些可能挑战[target_character.GetHerHim]地位的其他统治者与觊觎者。"
 flavor_gra.21.a: "世人将见证我们的威望！"
 flavor_gra.21.b: "无需修复那些旧日废墟。"
 flavor_gra.22.entry: "$flavor_gra.22.title$"
 flavor_gra.22.title: "[ShowBuildingTypeNameWithNoTooltip('library_cordoba')]"
 flavor_gra.22.desc: "随着[ShowBuildingTypeName('library_cordoba')]的重建，[ShowLocationName('cordoba')]的民众迎来了文学繁荣的新纪元。\n\n如同往昔一般，来自[ShowReligionGroupAdjective('islam')]世界各地的学者慕名而至，阅览[ShowLocationNameWithNoTooltip('cordoba')]收藏的涵盖文学、科学、神学等众多领域的丰富典籍。这反过来也为当地民众带来了繁荣，他们得以了解远方的多元文化，并将其中许多习俗融入日常生活之中。"
 flavor_gra.22.a: "[ShowLocationNameWithNoTooltip('cordoba')]的人民将享受真正的繁荣！"
 add_pop_satisfaction_based_on_literacy: "该[location|e]所有[pop|e]会获得[ShowNamedValue('pop_satisfaction_extreme_bonus')|+=2%][pop_satisfaction|e]，受[pop_literacy|e]修正"
 flavor_gra.23.entry: "$flavor_gra.23.title$"
 flavor_gra.23.title: "众生的学术乐土"
 flavor_gra.23.desc: "我们的自由创新政策已使[ROOT.GetCountry.GetName]成为知识与智慧的避风港。我们在学术领域的进步清晰可见，赢得了外部统治者的赞誉，越来越多的宾客涌向我们声名卓著的大学求学。\n\n[ROOT.GetCountry.GetGovernment.GetCourtTitle]如今也聚集了更多受过良好教育的成员，他们希望通过消除教育体系内冗余的限制，来进一步扩展这一学术事业。"
 flavor_gra.23.a: "这正是我们的进步！"
 flavor_gra.24.title: "[ShowReligionGroupNameWithNoTooltip('muslim')]的壁垒"
 flavor_gra.24.desc: "我们在[ShowRegionName('iberia_region')]之战获胜的消息已传遍整个[ShowReligionGroupAdjective('muslim')]世界，这一壮举对于我们度过即将到来的风暴具有里程碑式的意义。[target_character.GetName]如今在[ROOT.GetCountry.GetName]内被赞誉为英雄、守护者以及抵御那些企图扑灭我们火焰的敌人的盾牌。"
 flavor_gra.24.a: "让我们庆祝。"
 flavor_gra.1000.entry: "$flavor_gra.1000.title$"
 flavor_gra.1000.title: "显赫人物"
 flavor_gra.1000.desc: "在近年来与邻国的血腥冲突中，[ShowDynastyName('nasrid_dynasty')]家族的一位成员在整个[ROOT.GetCountry.GetName]声名远扬。[target_character.GetSheHe]叫[target_character.GetName]，已证明自己是一位卓越的军事领袖，能够激励成千上万的士兵。正是因此，[target_character2.GetName]注意到了这位[target_character.GetWomanMan]，希望拉近[target_character.GetHerHim]与[ROOT.GetCountry.GetGovernment.GetCourtTitle]的关系。然而，[target_character.GetName]表现出的无尽野心，令许多[target_character2.GetNameWithNoTooltip]的亲近之人感到忧虑。"
 flavor_gra.1000.a: "伟大的人属于伟大的国家。"
 gra_yusuf_will_most_likely_rebel: "邀请[target_character.GetName]为[ROOT.GetCountry.GetName]服务会使[target_character.GetHerHim]尝试推翻[target_character2.GetName]的概率提升到最高"
 flavor_gra.1000.b: "最好不要冒这个险。"
 gra_banishing_yusuf_prevents_the_rebellion: "驱逐[target_character.GetName]会确保[target_character.GetSheHe]无法发起叛乱"
 flavor_gra.1000.c: "我们的线报称此计划将适得其反。"
 flavor_gra.1001.title: "[target_character.GetNameWithNoTooltip]叛乱"
 flavor_gra.1001.desc: "[target_character.GetName]凭借其声望聚集了大批追随者，如今其实力与影响力已可与[target_character2.GetName]抗衡。[target_character.GetHerHim]的支持者已向我们现任领导层发出最后通牒：要么让位于[target_character.GetNameWithNoTooltip]，要么让[ROOT.GetCountry.GetName]被一场毁灭性的战争吞没。"
 flavor_gra.1001.a: "我们不会把统治权让给篡位者！"
 flavor_gra.1001.b: "没必要流血。[target_character2.GetNameWithNoTooltip]会退位。"
 flavor_gra.1001.b.entry: "没必要流血。我们会退位。"
 flavor_gra.1100.entry: "$flavor_gra.1100.title$"
 flavor_gra.1100.title: "冉冉升起的新星"
 flavor_gra.1100.desc: "前线士兵中流传着关于一位年轻有为的[target_character.GetWomanMan]的传闻。[target_character.GetSheHe]叫[target_character.GetName]，已在军中稳步晋升，现已升任将军。据说[target_character.GetSheHe]有着鹰隼般的双目，能够纵观整个战场，即使在激战之中也能做出明智的战略决策。还有人称[target_character.GetSheHe]剑术无人能敌，曾击败过所有对手。然而，这些传言是否属实，唯有时间才能证明……"
 flavor_gra.1100.a: "我们将投以最关注的目光。"
 flavor_gra.1100.b: "这种人只会带来麻烦。"
 flavor_gra.1101.title: "众人之一"
 flavor_gra.1101.desc: "看来[ROOT.GetCountry.GetGovernment.GetRulerOrRegent.GetOralAddress]在我军士兵中的那些骇人传言至少部分属实——那位[target_character.GetWomanMan]确实能完成奇迹般的壮举，仅凭[target_character.GetHerHis]的部下便击退了侧翼的骑兵冲锋。[ROOT.GetCountry.GetGovernment.GetCourtTitle]中的朝臣似乎认为应赐予[target_character.GetSheHe]显赫的头衔，而褒奖如此英勇之举，似乎也是明智的。[target_character.GetSheHe|U]或许只是众多将士中的一员，但也可能正是哈立德·伊本·瓦利德再世。"
 flavor_gra.1101.a: "我们需要更多这样的人才。"
 flavor_gra.1102.title: "被党羽环伺"
 flavor_gra.1102.desc: "自从我们赐予[target_character.GetName][target_character.GetHerHis]的贵族头衔以来，[target_character.GetHerHis]最亲近的同伴们便开始表现得像是[target_character.GetHerHis]的侍从，事事以[target_character.GetHerHis]为中心，在[target_character.GetSheHe]不在场时也以[target_character.GetHerHis]的代言人的身份说话。[target_character.GetSheHe]在[ROOT.GetCountry.GetCapital.GetName]获赐的宅邸近来门庭若市，民众蜂拥而至，渴望一睹[target_character.GetHerHis]的容颜。有些人甚至将[target_character.GetHerHis]的功绩渲染到近乎宗教狂热的地步，仿佛在崇拜[target_character.GetHerHim]一般。"
 flavor_gra.1102.a: "引人注目……"
 flavor_gra.1103.title: "觊觎者崛起"
 flavor_gra.1103.desc: "我们终于发现了[target_character.GetName]的随从们采取如此过分举动的原因。他们散布谣言，称这位将军是传奇的、带领[ShowRegionName('iberia_region')]进入黄金时代的[ShowDynastyName('umayyad_dynasty')]王朝支系的后裔。虽然我们既无法反驳也无法证实这种说法，但一些[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]看到了机会，希望通过从龙之功提高自己的地位。[target_character.GetHerHis|U]如今壮得厉害，手上足有一个满编师，可能威胁到我们对军队的统辖权。"
 flavor_gra.1103.a: "但愿此事不了了之。"
 flavor_gra.1104.title: "清算之日"
 flavor_gra.1104.desc: "该死！[target_character.GetHerHis]竟背叛了君主！[target_character.GetSheHe]以[ShowDynastyName('umayyad_dynasty')]后裔的身份，集结了忠实的随从，命令他们向我们的最大城市进军，在那里煽动大规模骚乱，并散布[target_character.GetHerHis]对王位的宣称。[ShowDynastyNameWithNoTooltip('umayyad_dynasty')]统治[ShowLocationName('cordoba')]的时代曾为我们的祖先带来巨大繁荣，这无可否认，但此人自称[ShowDynastyNameWithNoTooltip('umayyad_dynasty')]后裔的说法，根本毫无依据。尽管如此，民众并不在意，他们早已听闻[target_character.GetHerHis]在战场上的传奇事迹。各行各业无数人都愿意支持[target_character.GetHerHis]，并已开始高呼要求[ROOT.GetCountry.GetGovernment.GetRulerOrRegent.GetName]退位。"
 flavor_gra.1104.a: "粉碎这个篡位者！"
 flavor_gra.1104.b: "我们没有机会。"
 flavor_gra.1200.entry: "$flavor_gra.1200.title$"
 flavor_gra.1200.title: "[ShowRegionNameWithNoTooltip('maghreb_region')]的帮助"
 flavor_gra.1200.desc: "随着[ShowSituationName('battle_for_the_strait')]愈演愈烈，我们的生存比以往任何时候都更仰赖外部干预。[GetCountry('CAS').GetName]与[GetCountry('MOR').GetName]竞相征服我们，在此情形下，我们尝试向第三方寻求帮助，自是理所当然。[ShowRegionName('maghreb_region')]诸国与我们同气连枝，但在此事上各有立场，其中尤以[strongest_maghreb_country.GetName]最为强大。或许通过向[target_character2.GetName]求援，我们能在这场斗争中取得军事优势。"
 flavor_gra.1200.a: "我们亟需援助。"
 flavor_gra.1200.b: "我们为何要为自保而仰赖外力干预？"
 flavor_gra.1201.title: "$flavor_gra.1200.title$"
 flavor_gra.1201.desc: "[from_country.GetName]已就[ShowRegionName('iberia_region')]当前局势与我们接触。鉴于他们已陷入绝境，该国请求我们尽一切可能援助其抵御对其主权日益增长的威胁。无论是黄金还是兵员，皆足以助其保卫家园。"
 flavor_gra.1201.a: "我们将赠予他们黄金。"
 flavor_gra.1201.b: "他们将获得我方的兵员援助。"
 flavor_gra.1201.c: "黄金与兵员皆可。"
 flavor_gra.1201.d: "我们为何要介入此冲突？"
 flavor_gra.1300.entry: "$flavor_gra.1300.title$"
 flavor_gra.1300.title: "来自东方的援助"
 flavor_gra.1300.desc: "随着[ShowLocationName('constantinople')]陷落于[target_country.GetName]之手，[ShowReligionGroupAdjective('muslim')]世界已对[ShowContinentName('europe')]的[ShowReligionGroupAdjective('christian')]诸王国施以重创。[target_character2.GetName]在胜利之余，已表现出将影响力扩展至已知世界更远之处的兴趣。或许我们可以借此机会派遣使团前往[target_country.GetCapital.GetName]，以期从中获得一些经验丰富的将领与士兵。"
 flavor_gra.1300.a: "让我们派遣使团。"
 flavor_gra.1300.b: "我们无需其援助亦能存续。"
 gra_demand_a_mercenary_company: "我们将要求[target_country.GetName]向我方提供[gold|e]，或一支由该国[characters|e]率领的[mercenary|e]连队"
 flavor_gra.1301.title: "$flavor_gra.1300.title$"
 flavor_gra.1301.desc: "[from_country.GetName]的[target_character.GetName]已派遣使节来到[ROOT.GetCountry.GetCapital.GetName]，就我们攻克[ShowLocationName('constantinople')]一事致以祝贺，并大力称赞了我们的武功。[ShowReligionGroupName('christian')]已遭受重创，他们如今请求我们提供军事援助，抵御[ShowRegionName('iberia_region')]试图扑灭[ShowReligionGroupName('muslim')]火焰的秃鹫。其中尤以[mercenary_general.GetName]最为热切，这个[mercenary_general.GetWomanMan]渴望统率此次远征，既为赢得个人荣耀，亦为效命于[target_character2.GetName]，将[ROOT.GetCountry.GetFlavorRank]之威名拓展至赫拉克勒斯之柱。"
 flavor_gra.1301.a: "我们怎能拒绝手下的征服欲望呢？"
 flavor_gra.1301.b: "我们的将军和士兵都腾不出手，不过我们可以分出一些金钱。"
 flavor_gra.1301.c: "我们为何要重新点燃几乎熄灭的火焰？"
 conquest_of_andalusi_integration_tt: "以[ShowCultureName('andalusi')]的[pops|e]征服[locations|e]，将根据该[culture|e]的存在程度获得[integration|e]进度"
 gra_cordoba_province_gains_core: "[target_location.GetProvinceDefinition.GetName]的[province|e]中的每一个[location|e]都成为[ROOT.GetCountry.GetName]的[core|e]"
 leader_dies: "#Y[target_character.GetName]未能幸存#!"
 leader_is_scarred: "#Y[target_character.GetName]幸存了下来，但留下了伤疤#!"
