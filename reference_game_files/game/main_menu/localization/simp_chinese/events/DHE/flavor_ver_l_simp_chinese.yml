l_simp_chinese:
 VER_benefits_from_winning_the_war: "在[target_war.GetName]中，我们将能够采用[ShowPeaceTreatyTypeName('scaligeri_victory')][peace_offer|e]"
 ver_remove_antagonism: "[THIS.GetCountry.GetName]将解除其他[countries|e]因[peace_treaty|e]要求而产生的[antagonism|e]"
 ver_add_integration_in_every_location: "[Concept( 'owned', '治下' )|e]所有位于[ShowScriptedGeographyName('scaligeri_conquests_geography')]的[location|e]将获得#G +100.0%#![integration|e]"
 SCALIGER_WAR_NAME: "斯卡拉战争"
 ver_demands_start: "我们将在[target_war.GetName]的和平协议中声索对"
 ver_demands_end: "的领土要求"
 ver_demands_FLO_pescia_demand: "$ver_demands_start$[ShowLocationName('pescia')]$ver_demands_end$"
 ver_demands_FLO_lucca_demand: "$ver_demands_start$[ShowProvinceDefinitionName('lucca_province')]$ver_demands_end$"
 ver_demands_VEN_mestre_demand: "$ver_demands_start$[ShowLocationName('mestre')]$ver_demands_end$"
 ver_demands_VEN_treviso_demand: "$ver_demands_start$[ShowProvinceDefinitionName('venice_province')]$ver_demands_end$"
 ver_demands_MLO_brescia_demand: "$ver_demands_start$[ShowProvinceDefinitionName('brescia_province')]$ver_demands_end$"
 ver_demands_MLO_parma_demand: "$ver_demands_start$[ShowProvinceDefinitionName('parma_province')]$ver_demands_end$"
 VER_benefits_for_coalition_members: "[target_war.GetName]中的进攻方将触发[events|e]以主张其对各边境领土的权利；通过其他方式夺取领土的协议将被禁用"
 VER_cannot_take_territory_besides_scripted_peace_deal: "必须通过特殊的和平条约夺取领土"
 scaligeri_war_historical_info: "斯卡拉战争始于1336年年中，其根源在于斯卡拉家族与威尼斯共和国之间长期积累的矛盾。冲突的直接导火索是维罗纳领主设置铁链封锁河道，强行征收通行税，此举严重威胁到威尼斯的商业利益。尽管双方曾尝试通过外交途径缓和局势，但威尼斯元老院最终采取了强硬对策，中止对斯卡拉家族控制下帕多瓦地区的食盐供应，迫使后者自行兴建盐场以维持需求。6月22日，随着威尼斯与佛罗伦萨签署军事同盟协议——后者承诺承担三分之二战争开支——斯卡拉战争正式爆发。"
 flavor_ver.1.title: "[target_war.GetNameWithNoTooltip]"
 flavor_ver.1.desc: "我们敬爱的[target_character.GetName]以血汗铸就的[target_dynasty.GetName]家族领地，如今已成为[ShowRegionName('italy_region')]北部诸多小国联合大同盟的众矢之的。这个同盟最初仅有[GetCountry('VEN').GetLongName]与[GetCountry('FLO').GetLongName]参与，而我们近期的求和努力竟遭仲裁者背弃——他们选择与敌人同流合污。无妨——这些背信弃义之徒终将受到严惩。"
 flavor_ver.1.historical_info: "$scaligeri_war_historical_info$"
 flavor_ver.1.a: "我们将铲除弱者。"
 flavor_ver.2.title: "[target_war.GetNameWithNoTooltip]"
 flavor_ver.2.desc: "好战的[target_dynasty.GetName]家族已成为[anti_scaligeri_leader.GetLongName]领导的大包围网的首要目标。我们正处于扭[target_war.GetName]局势的关键节点，但若想取得最终胜利，仍需争取新的盟友支持。眼下，[mlo_participant.GetAdjective][mlo_army.GetName]已在[target_ver.GetName]边境集结，[flo_participant.GetLongName]提供了战争资金，而我们的军队由[target_character.GetName]统帅——[target_ver.GetAdjectiveWithNoTooltip]之敌即将溃败，[ShowRegionName('italy_region')]的和平曙光已然在望。"
 flavor_ver.2.historical_info: "$scaligeri_war_historical_info$"
 flavor_ver.2.a: "斯卡拉家的恶魔必将被涤除！"
 flavor_ver.3.title: "我们对[target_province.GetNameWithNoTooltip]的宣称"
 flavor_ver.3.desc: "针对[target_country.GetName]境内[target_dynasty.GetName]家族势力的[target_war.GetName]行动进展顺利。我军近日已成功控制[target_province.GetName]，该省份目前处于[ROOT.GetCountry.GetName]的[ROOT.GetCountry.GetGovernment.GetRulerOrRegent.GetDynasty.GetName]家族势力影响之下。或许我们应当对该领土提出主权主张，并让[war_leader.GetName]阵营中的盟友清楚了解我们对[target_dynasty.GetNameWithNoTooltip]所属领地的合法权益诉求。"
 flavor_ver.3.entry: "$MLO_ADJ$在斯卡拉战争中的宣称"
 flavor_ver.3.a: "提出主张。"
 flavor_ver.3.b: "不如索要[ShowProvinceDefinitionNameWithNoTooltip('parma_province')]？"
 flavor_ver.4.title: "我们对[target_location.GetNameWithNoTooltip]的宣称"
 flavor_ver.4.desc: "在我们与盟友的共同努力下，[target_dynasty.GetName]家族在[ShowRegionName('italy_region')]北部地区的霸权正逐步瓦解。随着战局日渐明朗，曾在1336年被迫承担三分之二战争开支的[ROOT.GetCountry.GetLongName]如今正积极主张其在此次冲突中的利益。至于我方诉求，则明确指向斯卡拉家族统治下的[target_country.GetName]——这个长期拒绝承认[ShowLocationName('florence')]宗主权的国家。"
 flavor_ver.4.entry: "$FLO_ADJ$在斯卡拉战争中的宣称"
 flavor_ver.4.a: "对[ShowLocationNameWithNoTooltip('pescia')]提出声索。"
 flavor_ver.4.b: "整座[target_country.GetCapital.GetRank.GetNameWithNoTooltip]都属于我们！"
 flavor_ver.4.b.entry: "整座城市都属于我们！"
 flavor_ver.5.title: "我们对[target_province.GetNameWithNoTooltip]的宣称"
 flavor_ver.5.desc: "战争真的毫无回报吗？……恐怕并非如此。\n\n尽管付出了流血与牺牲，[target_war.GetName]正逐渐展现出对我们有利的一面。虽然这场战争的公开目标是推翻[target_dynasty.GetName]政权，但在此过程中，我们有望接管他们曾浴血奋战夺下的土地。其中一个潜在的扩张方向，是文化上更贴近[ROOT.GetCountry.GetFlavorRank]的[target_location.GetName]及周边[target_province.GetName]省的大片区域。"
 flavor_ver.5.entry: "$VEN_ADJ$在斯卡拉战争中的宣称"
 flavor_ver.5.a: "[target_location.GetNameWithNoTooltip]应当属于我们！"
 flavor_ver.5.a.entry: "梅斯特雷应当属于我们！"
 flavor_ver.5.b: "[target_province.GetNameWithNoTooltip]将成为#italic 大陆领地#!的基石。"
 flavor_ver.5.b.entry: "维罗纳属威尼托将成为#italic 大陆领地#!的基石。"
 flavor_ver.6.title: "[from_country.GetNameWithNoTooltip]的宣称"
 flavor_ver.6.desc: "一名来自[from_country.GetLongName]的传令官抵达我方，通报了他们对[war_enemy.GetName]与[target_dynasty.GetName]家族领土的主张。在商议[target_war.GetName]的和平条款时，我们最好将[target_peace_treaty.GetName]纳入考量，否则[from_country.GetAdjectiveWithNoTooltip]的使者将视此举为失信之举。"
 flavor_ver.6.a: "我们会在适当的时候满足他们的要求。"
 ver_peace_treaty_has_become_available: "启用在[target_war.GetName]中提出[target_peace_treaty.GetName]。"
 flavor_ver.7.title: "我们的胜利"
 flavor_ver.7.desc: "经过多年浴血奋战，$SCALIGER_WAR_NAME$终于落下帷幕。今日，[ROOT.GetCountry.GetAdjective]军队在[target_location.GetName]赢得胜利，敌军已被彻底击溃。这场战争不仅是为了争夺[ShowRegionName('italy_region')]北部的霸权——更是为了捍卫[target_character.GetName]的荣耀。这位先贤正是如今[ROOT.GetCountry.GetLongName]的奠基者，而我们誓死守护的，正是[target_character.GetHerHis]留下的伟大遗产。"
 flavor_ver.7.a: "[target_dynasty.GetNameWithNoTooltip]家族万岁！"
 flavor_ver.8.title: "同盟的胜利"
 flavor_ver.8.desc: "[target_dynasty.GetName]侵略者的命运终于尘埃落定——恶魔般的斯卡拉势力已被彻底击溃，[target_character.GetName]的领土如今分崩离析。北[ShowRegionName('italy_region')]从此不再受任何暴君挟制。这一刻，必将作为[ROOT.GetCountry.GetName]历史上最具转折意义的篇章而永载史册！"
 flavor_ver.8.a: "死有余辜！"
 flavor_ver.1000.title: "[target_character2.GetNameWithNoTooltip]的亲属"
 flavor_ver.1000.desc: "[target_country.GetName]被废黜的统治者、[target_character2.GetName]的亲属[target_character.GetName]，目前仍以代理总督的身份掌控着[target_country.GetCapital.GetRankAndName]的实权。虽然名义上效忠于[target_dynasty.GetName]家族，但[target_character.GetShortNameWithNoTooltip]在旧领地中依然享有声望，且无疑对斯卡拉家族侵害[target_character.GetDynasty.GetName]家族的行径心怀怨恨。此外，我们也清楚他[target_character.GetHerHis]对我们雇佣的佣兵队长——我们亲爱的[target_character2.GetShortNameWithNoTooltip]——颇有好感。一旦我们围攻[target_character.GetHerHis]所在的[target_country.GetCapital.GetRank.GetName]，[target_character.GetSheHe]必然会倒戈相向。"
 flavor_ver.1000.a: "妙不可言的邪恶……"
 ver_padua_incident_rules: "如果[ShowLocationName('padova')]于#W 1339年1月1日#!前沦陷，[target_country.GetName]将在[target_war.GetName]中转变立场，并宣布独立"
 flavor_ver.1001.title: "潜在的背叛？"
 flavor_ver.1001.desc: "我们在[target_location.GetName]的间谍报告称，就在我们眼皮底下，可能正在进行一场敌方谈判：[target_country.GetLongName]内部有人正与我们在[target_war.GetName]中的敌人秘密联络。至少从长远来看，恐怕我们不能再对[target_country.GetAdjective]的忠诚如此确信了，而目前，我们已派出密探追查幕后黑手——但他们能否及时查明真相，仍有待观察。"
 flavor_ver.1001.a: "我们必须铲除内鬼！"
 flavor_ver.1002.title: "背叛者已找到！"
 flavor_ver.1002.entry: "$flavor_ver.1002.title$"
 flavor_ver.1002.desc: "[target_character.GetName]被押到[target_character2.GetName]面前，罪名是与[target_dynasty.GetName]家族宿敌的勾结。数月以来，[target_character.GetShortName]一直与我们在[target_war.GetName]中的对手暗中通信。而这一切的根源，竟要追溯到十年前——[target_character.GetHerHis]被废黜时埋下的怨恨。"
 flavor_ver.1002.a: "砍了！"
 flavor_ver.1003.title: "城门大开！"
 flavor_ver.1003.desc: "在围城战即将落幕之际，我们在[target_location.GetName]的内应[target_character.GetName]指挥守军，击退了我军对其中一座城门的佯攻。与此同时，他下令为我们敞开了另一道城门。[target_location.GetRank.GetName]迅速被攻占，[target_character.GetName]被拥立为[target_country.GetName]的新任统治者，赢得了当地[target_estate.GetName]的热烈拥护。这一胜利成为[target_war.GetName]的关键转折点——[target_dynasty.GetName]家族刚刚失去了他们一块极具战略价值的领地。"
 flavor_ver.1003.a: "争取更多这样的胜利！"
 flavor_ver.1004.title: "我们的内应被处死"
 flavor_ver.1004.desc: "噩耗传来！我们在[target_country.GetName]的盟友、前任统治者[target_character.GetName]，被[target_dynasty.GetName]家族发现长期暗中与我们通信。[target_character.GetShortNameWithNoTooltip]遭到[target_country2.GetAdjective]士兵的暴力逮捕，并被押解至[target_character2.GetName]面前，最终被正式判处死刑。"
 flavor_ver.1004.a: "我们失去了一位伟大的盟友。"
 flavor_ver.1005.title: "[ShowLocationNameWithNoTooltip('padova')]的陷落"
 flavor_ver.1005.desc: "[target_country.GetName]的叛徒原来一直是[target_character.GetName]本人！这个大约十年前被[target_character2.GetName]罢黜的恶徒，虽曾身居代理总督之位，却始终对[target_dynasty.GetName]家族心怀怨恨。如今[target_character.GetHerHis]终于得偿所愿——将整座[target_location.GetRank.GetName]献给了我们的敌人，并夺取了[target_country.GetNameWithNoTooltip]的统治大权。"
 flavor_ver.1005.a: "就算没有[target_country.GetNameWithNoTooltip]，我们一样能胜利。"
