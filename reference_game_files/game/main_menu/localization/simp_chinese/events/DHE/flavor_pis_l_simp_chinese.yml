l_simp_chinese:
 flavor_pis.1.entry: "$flavor_pis.1.title$"
 flavor_pis.1.title: "[ROOT.GetCountry.GetNameWithNoTooltip]的衰落"
 flavor_pis.1.desc: "曾经辉煌的[ROOT.GetCountry.GetLongName]已不再是那个[ShowRegionName('italy_region')]巨人。它的势力范围从[ShowRegionName('iberia_region')]延伸至[ShowRegionName('crescent_region')]，但[GetCountry('GEN').GetAdjective]舰队数年来对[ShowLocationName('pisa')]的[ShowBuildingTypeName('porto_pisano')]的封锁导致了它的衰落。更糟的是，[GetCountry('ARA').GetAdjective]军队从我们手中夺走了[ShowAreaName('sardinia_area')]。\n\n[ROOT.GetCountry.GetFlavorRank]变得无比虚弱。我们强大的舰队如今成为过往辉煌的残影，在其他[ShowCultureGroupName('italian_group')]国家面前黯然失色。我们的贸易影响力逐渐被更加可靠的竞争对手取代，[ROOT.GetCountry.GetFlavorRank]陷入了政治衰退。\n\n我们不能坐以待毙，任由历史发展，而应该把重点放在重建上，尽可能多地聚集力量，向那些对我们当前困境负有责任的人复仇。"
 flavor_pis.1.a: "只要有[target_character.GetNameWithNoTooltip]统治，我们就不会衰退！"
 flavor_pis.1.a.entry: "我们不会衰退！"
 flavor_pis.2.title: "[target.GetNameWithNoTooltip]的陷落"
 flavor_pis.2.desc: "[ROOT.GetCountry.GetName]的军队再次取得胜利，占领了[target.GetName]的[target.GetRank.GetName]。不要忘记[ShowLocationName('pisa')]曾遭受的破坏，不要忘记封锁导致人民陷入饥荒，部队及其指挥官正准备将[target.GetRank.GetNameWithNoTooltip]夷为平地，在土壤中撒盐，并将财富带回我们的首都。"
 flavor_pis.2.a: "以眼还眼！"
 flavor_pis.2.b: "没必要破坏这里。"
 pis_allow_upgrade_of_porto_pisano: "[ShowLocationName('pisa')]的[ShowBuildingTypeName('porto_pisano')]可以升级"
 flavor_pis.3.entry: "$flavor_pis.3.title$"
 flavor_pis.3.title: "收复[ShowAreaNameWithNoTooltip('sardinia_area')]"
 flavor_pis.3.desc: "我们的军队终于收复了[ShowAreaName('sardinia_area')]！\n\n许多士兵、[ROOT.GetCountry.GetGovernment.GetCourtTitle]成员和[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]一直在庆祝这一成就，准备在那里重建他们的影响力。虽然他们分散在全国各地，但许多人已经开始搬到[target_location.GetName]，这里成为了地区首府。\n\n这使得许多人建议发展这座[target_location.GetRank.GetName]，确保那些希望将财富带回[ShowBuildingTypeName('porto_pisano')]的定居者取得成功。然而，有少数人认为我们不应将影响力集中于单一地点，整个岛屿都需要援助。"
 flavor_pis.3.a: "[target_location.GetNameWithNoTooltip]将成为[ShowAreaNameWithNoTooltip('sardinia_area')]的宝石。"
 flavor_pis.3.a.entry: "这里将成为[ShowAreaNameWithNoTooltip('sardinia_area')]的宝石。"
 flavor_pis.3.b: "让我们确保整个岛屿的繁荣。"
 pis_all_of_sardinia_gains_development_and_prosperity: "[ShowAreaName('sardinia_area')]所有属于我们的[location|e]将获得[ShowNamedValue('development_mild_bonus')|+=2%][development|e]和[ShowNamedValue('prosperity_mild_bonus')|+=2%][prosperity|e]"
 flavor_pis.4.entry: "$flavor_pis.4.title$"
 flavor_pis.4.title: "扩建[ShowWorkOfArtNameWithNoTooltip('leaning_tower_of_pisa')]"
 flavor_pis.4.desc: "[ShowWorkOfArtName('leaning_tower_of_pisa')]的建造已经完成，然而[ROOT.GetCountry.GetGovernment.GetCourtTitle]中有不少人希望对其内部进行扩建。\n\n[target_character.GetName]希望在钟楼中融入哥特式元素，使其与塔楼现有的罗马式风格相结合。这类工程不可或缺的是资金投入，[ROOT.GetCountry.GetFlavorRank]上下对此心知肚明，但此举将有助于我们在[ShowRegionName('italy_region')]进一步巩固声望。"
 flavor_pis.4.a: "让我们扩建这座塔。"
 flavor_pis.4.b: "它已经完工了，不必画蛇添足。"
 flavor_pis.5.entry: "$flavor_pis.5.title$"
 flavor_pis.5.title: "重心转移"
 flavor_pis.5.desc: "重建我们在地中海曾经辉煌的野心逐渐遥不可及，但这却为我们带来了恢复对[ShowRegionName('italy_region')]控制的新思路。有人建议我们不要依赖商人和海员，而是应该将财富用于军事行动，雇佣大量佣兵并命令他们征服邻近城市。\n\n那些经验丰富的人并不赞成这些想法，他们更青睐重建[ShowBuildingTypeName('porto_pisano')]的计划，但那些更渴望证明自己的人赞成扩张主义政策，希望我们能超越竞争的城邦。"
 flavor_pis.5.a: "前进，征服！"
 flavor_pis.5.b: "战争，它有什么好处呢？是贸易给了我们权力。"
 pis_gain_casus_belli_on_every_neighbor_country_in_italy: "如果我们尚未拥有[casus_belli|e]，我们将获得对所有相邻[country|e][capital|e][province|e]的[ShowCasusBelliName('cb_conquer_province')][casus_belli|e]"
 flavor_pis.6.title: "大桥赛事"
 flavor_pis.6.desc.a: "在[ShowLocationName('pisa')]最近举办的“大桥赛事”节庆中，一位前途无量的[target_character.GetWomanMan]崭露头角。在那天的角力比赛中，[target_character.GetName]展现出卓越的领导才能，带领士兵在梅佐大桥上成功将花车推至对岸。此举为[target_character.GetHerHim]赢得了民众的尊敬，不少人或许因此认定[target_character.GetSheHe]具备了真正领袖的潜质。"
 flavor_pis.6.desc.b: "[ShowLocationName('pisa')]近日举办了“大桥赛事”，当地民众纷纷沉浸在这场盛会的热烈氛围中。阿尔诺河沿岸的游行吸引了各行各业的市民踊跃参与，激发了[ROOT.GetCountry.GetName]人民之间的团结——尤其是那些最具影响力的人物，他们暂时放下分歧，共同享受这一年度传统。"
 flavor_pis.6.desc.c: "在[ShowContinentName('europe')]各地，许多人齐聚[ShowLocationName('pisa')]，前来参与“桥之游戏”节庆。阿尔诺河沿岸的游行盛况令他们印象深刻，一些具备军事经验的人也加入了拔河比赛，希望能为各自的一方带来胜利。虽然有些人只是在一旁观看庆典，但他们依然将[ROOT.GetCountry.GetName]每年举办的这一欢乐盛事带回自己的国家。"
 flavor_pis.6.a: "即便短暂，也让我们享受这和平的时光吧。"
 flavor_pis.6.b: "让节庆的故事将传遍每一个角落。"
 flavor_pis.6.c: "让我们提拔[target_character.GetNameWithNoTooltip]。"
 flavor_pis.6.c.entry: "让我们提拔此人。"
 flavor_pis.6.d: "我们不会让随便什么人为[ROOT.GetCountry.GetAdjectiveWithNoTooltip][ROOT.GetCountry.GetGovernment.GetCourtTitle]效力。"
 flavor_pis.6.d.entry: "我们不会让随便什么人来为国家效力。"
 flavor_pis.1000.entry: "$flavor_pis.1000.title$"
 flavor_pis.1000.title: "新领袖"
 flavor_pis.1000.desc: "危机席卷了整个[ROOT.GetCountry.GetName]。\n\n沉重的债务、持续的经济衰退以及蔓延的动荡局面，让许多人开始质疑[target_character.GetName]的权威——其领导的政府岌岌可危，严重依赖外部支持才能勉强维持运转。面对眼看就要崩塌的一切，城中的富豪与权贵们聚集在一起，商议着为[ROOT.GetCountry.GetFlavorRank]物色一位新的统治者。有人提议请[target_country.GetName]的[target_country.GetGovernment.GetRuler.GetDynasty.GetName]家族接手，希望他们能在经济上帮助我们渡过难关；另一些人则倾向于[target_country2.GetName]的[target_country2.GetGovernment.GetRuler.GetDynasty.GetName]家族；还有声音认为[target_country3.GetName]的[target_country3.GetGovernment.GetRuler.GetDynasty.GetName]家族才是更合适的选择——如果不请他们来做我们的新统治者，那我们才是真的愚蠢。"
 flavor_pis.1000.a: "给[target_country.GetNameWithNoTooltip]送一封信。"
 flavor_pis.1000.a.entry: "给他们送一封信。"
 pis_offer_rulership_to_country1: "我们将提议给予[target_country.GetName]统治权。如果他们接受，将发生以下效果："
 pis_a_member_of_target_country_dynasty_becomes_ruler: "一位[target_country.GetGovernment.GetRuler.GetDynasty.GetName][dynasty|e]成员会成为我们的[ruler|e]"
 flavor_pis.1000.b: "选[target_country2.GetNameWithNoTooltip]最好。"
 flavor_pis.1000.b.entry: "选另一国家最好。"
 pis_offer_rulership_to_country2: "我们将提议给予[target_country2.GetName]统治权。如果他们接受，将发生以下效果："
 pis_a_member_of_target_country2_dynasty_becomes_ruler: "一位[target_country2.GetGovernment.GetRuler.GetDynasty.GetName][dynasty|e]成员会成为我们的[ruler|e]"
 flavor_pis.1000.c: "[target_country3.GetNameWithNoTooltip]的统治者最适合。"
 flavor_pis.1000.c.entry: "这个备选方案的统治者最适合。"
 pis_offer_rulership_to_country3: "我们将提议给予[target_country3.GetName]统治权。如果他们接受，将发生以下效果："
 pis_a_member_of_target_country3_dynasty_becomes_ruler: "一位[target_country3.GetGovernment.GetRuler.GetDynasty.GetName][dynasty|e]成员会成为我们的[ruler|e]"
 flavor_pis.1000.d: "我们不会将[ROOT.GetCountry.GetFlavorRank]卖给竞争对手。"
 flavor_pis.1001.title: "$flavor_pis.1000.title$"
 flavor_pis.1001.desc: "[from_country.GetName]的政治危机已达到顶峰，他们的精英派信使向我们[ROOT.GetCountry.GetGovernment.GetCourtTitle]求助，希望[ROOT.GetCountry.GetGovernment.GetRuler.GetName]帮助他们，将[target_character.GetName]扶持为[from_country.GetFlavorRank]的新统治者，并向[target_character.GetName]提供财政援助。"
 flavor_pis.1001.a: "扩张[ROOT.GetCountry.GetGovernment.GetRuler.GetDynasty.GetNameWithNoTooltip]家族影响力的好方式。"
 flavor_pis.1001.a.entry: "扩张我们影响力的好方式。"
 flavor_pis.1001.b: "这种联系只会让我们倒台。"
 flavor_pis.1100.entry: "$flavor_pis.1100.title$"
 flavor_pis.1100.title: "《论至高的尊荣》"
 flavor_pis.1100.desc: "[ShowLocationName('pisa')]的学者们在整个[ShowRegionName('italy_region')]享有盛誉，然而[ROOT.GetCountry.GetName]却缺少一所获得正式认可的学术机构。[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]们提议，由[target_character.GetName]向[target_character2.GetName]发起请愿，使[ShowLocationNameWithNoTooltip('pisa')]正式被认可为一所通识学院，从而推动自治学术机构的蓬勃发展。"
 flavor_pis.1100.a: "派代表团前往[GetCountry('PAP').GetCapital.GetNameWithNoTooltip]。"
 flavor_pis.1100.a.entry: "派代表团前往$PAP$。"
 flavor_pis.1100.b: "我们没必要掺和[GetCountry('PAP').GetAdjectiveWithNoTooltip]的政治。"
 flavor_pis.1100.b.entry: "我们没必要掺和$PAP_ADJ$的政治。"
 flavor_pis.1101.title: "$flavor_pis.1100.title$"
 flavor_pis.1101.desc: "[from_country.GetName]的[target_character.GetName]派来了一支代表团。[target_character.GetHerHis|U]的代表们热情地谈起了[ShowLocationName('pisa')]的教育，以及他们[from_country.GetFlavorRank]里许多渴望成为学者的人。最后，他们提出了一项请求——授予[ROOT.GetCountry.GetName]的承认印章，授权在他们[from_country.GetFlavorRank]内建立一所正式学术机构。"
 flavor_pis.1101.a: "他们得到了我们的批准。"
 flavor_pis.1101.b: "[ShowRegionNameWithNoTooltip('italy_region')]有许多供人学习的地方。"
