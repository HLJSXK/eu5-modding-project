l_simp_chinese:
 flavor_tri.1.title: "#italic 《特里尔大主教鲍德温的抄本》#!"
 flavor_tri.1.entry: "$flavor_tri.1.title$"
 flavor_tri.1.desc: "我们有幸获得一部精美的编年史，描绘了我们王朝历史上一个决定性的时刻！它详述了我们王朝首位皇帝[GetCharacter('lux_henry_vii_luxembourg').GetName]在意大利的征战，凸显了我们家族的高贵地位及其对帝国皇位的合法主张。尽管艺术家不愿署名，但其对[GetCharacter('lux_henry_vii_luxembourg').GetNameWithNoTooltip]加冕礼与选帝侯团的描绘，巩固了我们在[GetInternationalOrganization('hre').GetName]内的地位。"
 flavor_tri.1.a: "它将装饰我们在[target_location.GetNameWithNoTooltip]的[ROOT.GetCountry.GetGovernment.GetCourtTitle]。"
 flavor_tri.1.a.entry: "它将装饰在我们首都的宫廷"
 flavor_tri.1.b: "把它赠与[GetInternationalOrganization('hre').GetLeaderTitle]。"
 flavor_tri.1.b.entry: "把它献与皇帝。"
