l_simp_chinese:
 flavor_tun.1.desc: "$ibn_khaldun_patronage$"
 flavor_tun.1.entry: "$flavor_gra.5.title$"
 flavor_tun.1.a: "很好。"
 flavor_tun.1.b: "我们不在乎这种无谓的开支！"
 flavor_tun.2.caliphal_backstory: "我国正是在[GetCountry('ALM').GetAdjective]哈里发国崩溃之际建立的。彼时，[ShowDynastyName('hafsid_dynasty')]王朝的缔造者，德高望重的阿布·扎卡里雅，自称#italic“信士的埃米尔”#!之号，担任$rank_empire_muslim_ruler_male$之职，#italic事实上#!宣告独立。此一宣称立即得到[ShowCountryNameIfActive('GRA')]的[ShowDynastyName('nasrid_dynasty')]以及其他[ShowCultureName('andalusi')]城镇领袖的承认。当[ShowCountryNameIfActive('TLE')]与[ShowCountryNameIfActive('MOR')]相继建国之时，他们也很快承认了我们的宣称。我们的权威甚至远及圣城[ShowLocationName('mecca')]，1259年，在阿拔斯王朝新近覆灭于蒙古人之手后，谢里夫也承认了我们的哈里发之位。"
 flavor_tun.2.title: "哈里发国的衰微"
 flavor_tun.2.entry: "$flavor_tun.2.title$"
 flavor_tun.2.desc: "$flavor_tun.2.caliphal_backstory$\n\nToday, little of that past splendor remains. Our internal issues have greatly weakened the authority of our [ROOT.GetCountry.GetGovernment.GetRulerTitle], who is a $rank_empire_muslim_ruler_male$ in nothing but name. We must return caliphal authority to the [ROOT.GetCountry.GetLongName]!"
 flavor_tun.2.a: "我们要让他们对我们心生敬畏！"
 flavor_tun.2.b: "放弃此称号。"
 tun_caliphate_decision_enabled: "解锁 [ShowDecisionName('hafsid_caliphate_decision')] [decision|e]"
 flavor_tun.3.title: "恢复哈里发权威"
 flavor_tun.3.desc: "$flavor_tun.2.caliphal_backstory$\n\nDespite how this authority faltered in the following century, we managed to bring the [ROOT.GetCountry.GetLongName] back from the brink of irrelevance. The [ROOT.GetCountry.GetFlavorRank] is now once again one of the principal states in the [ROOT.GetCountry.GetReligion.GetGroup.GetAdjective] world."
 flavor_tun.3.a: "我们必将善待#italic“乌玛”#!！"
 hafsid_caliphate_name_tt: "我国国名中将包含#Y哈里发国#!之称号"
 hafsid_caliphate_decision.title: "$flavor_tun.3.title$"
 hafsid_caliphate_decision.entry: "$flavor_tun.3.title$"
 hafsid_caliphate_decision.desc: "$flavor_tun.3.desc$"
 hafsid_caliphate_decision.a: "$flavor_tun.3.a$"
 flavor_tun.4.title: "[aging_monarch.GetNameWithNoTooltip]的继位"
 flavor_tun.4.entry: "[GetCharacter('tun_abu_yahya_abu_bakr_ii').GetNameWithNoTooltip] 的继位"
 flavor_tun.4.desc: "[aging_monarch.GetName] is increasingly concerned with the gloomiest, yet most vital decision an aging monarch has to make: appointing [aging_monarch.GetHerHis] successor. Such an appointment should be rather obvious, too, for [preferred_heir.GetName] has always been the favorite of our dear [ROOT.GetCountry.GetGovernment.GetRulerTitle]. The issue lies with [aging_monarch.GetHerHis] other children, [future_usurper.GetName], who aids the government in [ROOT.GetCountry.GetCapital.GetName], and [third_way.GetName] of [target_country2.GetName], a possible pretender to the throne.\n\nThis choice will have a profound impact on the stability of the [ROOT.GetCountry.GetLongName] long after the death of [aging_monarch.GetShortNameWithNoTooltip]."
 flavor_tun.4.a: "让 [target_country.GetNameWithNoTooltip] 的 [preferred_heir.GetNameWithNoTooltip] 接掌大位。"
 flavor_tun.4.a.entry: "让$GFS$的[GetCharacter('tun_abu_l_abbas_ahmad').GetNameWithNoTooltip]接掌大位。"
 flavor_tun.4.b: "[future_usurper.GetNameWithNoTooltip] 是个稳妥的选择。"
 flavor_tun.4.b.entry: "[GetCharacter('tun_abu_hafs_umar').GetNameWithNoTooltip] 是个稳妥的选择。"
 flavor_tun.4.c: "[third_way.GetNameWithNoTooltip] 将有助于统一诸国。"
 flavor_tun.4.c.entry: "[GetCharacter('tun_abu_zakariya_yahya').GetNameWithNoTooltip] 将有助于统一诸国。"
 TUN_THIS_will_be_appointed_heir_tt: "[THIS.GetCharacter.GetName]将被任命为[ROOT.GetCountry.GetName]的[heir|e]"
 TUN_unite_two_realms_tt: "由于[THIS.GetCharacter.GetName]是[THIS.GetCharacter.GetCourtCountry.GetName]境内一个[ShowSubjectTypeName('familial_governor')]的[ruler|e]，当[THIS.GetCharacter.GetSheHe]继承王位时，两国将合而为一"
 TUN_civil_war_from_preferred_heir_tt: "由于 [preferred_heir.GetName] 是属意的继承人，[preferred_heir.GetSheHe] 将在 [ShowEstateTypeName('tribes_estate')] 的支持下迅速引发一场 [war|e]，这将导致我方在 [ShowScriptedGeographyName('gafsa_sphere_of_influence_geography')] 境内的 [locations|e] 倒戈。"
 TUN_abu_hafs_will_try_to_start_a_civil_war_tt: "[usurper_scope.GetName] might try to usurp the throne from [THIS.GetCharacter.GetName]"
 TUN_we_will_succeed_when_target_ruler_dies_tt: "[ROOT.GetCountry.GetGovernment.GetRuler.GetName] will accede to the throne of [from_country.GetName], uniting the two countries under [from_country.GetAdjectiveWithNoTooltip] banner"
 flavor_tun.5.title: "[from_country.GetNameWithNoTooltip]的任命"
 flavor_tun.5.desc_positive: "喜讯传来！[from_country.GetLongName]的[aging_monarch.GetName]刚刚任命[preferred_heir.GetName]为[from_country.GetFlavorRank][aging_monarch.GetHerHis]继承人。这并不令人意外，因为[preferred_heir.GetShortNameWithNoTooltip]早已被公认为理所当然的继任者。有这样一位领袖执掌大权，[ShowScriptedGeographyName('ifriqiya_geography')]的未来看起来一片光明。"
 flavor_tun.5.desc_negative: "该死！ [from_country.GetName] 的 [aging_monarch.GetName] 做出了一项史无前例之举，刚刚任命 [appointed_heir.GetName] 作为 [aging_monarch.GetHerHim] 的继承人。众所周知，在 [ShowScriptedGeographyName('ifriqiya_geography')]，[preferred_heir.GetName] 才是最受拥戴、理所当然的继承人选，因此 [appointed_heir.GetNameWithNoTooltip] 能被立为继承人，其中必有蹊跷。"
 flavor_tun.5.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 flavor_tun.5.b: "[preferred_heir.GetNameWithNoTooltip] 绝不会善罢甘休！"
 flavor_tun.5.c: "我们只能接受这种情况。"
 flavor_tun.6.title: "意料之中的回应"
 flavor_tun.6.desc: "不出所料，[appointed_heir.GetName] 的任命令 [preferred_heir.GetName] 大为不满，其迅速采取行动，对此项任命提出异议。在 [ShowEstateTypeName('tribes_estate')] 的支持下，[target_country.GetName] 已宣布为争夺 [ROOT.GetCountry.GetName] 的王位而开战，[preferred_heir.GetShortNameWithNoTooltip] 的大军正朝 [ROOT.GetCountry.GetCapital.GetName] 进发。"
 flavor_tun.6.a: "[ROOT.GetCountry.Custom('common_string_negative')]"
 GFS_will_receive_following: "若 [target_country.GetName] 选择为此发动一场 [war|e] ："
 flavor_tun.7.title: "继承权被篡夺！"
 flavor_tun.7.desc: "尽管已将[target_character2.GetName]指定为[from_country.GetLongName]的继承人，但[target_character.GetName]那不肯屈服的手足却企图利用[target_character.GetHerHis]目前身处都城的便利，夺取[from_country.GetFlavorRank]之位。此举必将激怒[target_country.GetName]的[target_character2.GetShortNameWithNoTooltip]，[target_character.GetHerHis]定会举兵讨伐[target_character2.GetSisterBrother]。"
 flavor_tun.7.a: "先到先得。"
 flavor_tun.7.b: "简直岂有此理！这太不公平了！"
 flavor_tun.8.title: "$flavor_tun.7.title$"
 flavor_tun.8.desc: "The succession of [target_character2.GetName] in the [from_country.GetLongName] has been usurped by [target_character2.GetHerHis] [target_character.GetSisterBrother], [target_character.GetName], who swiftly moved to take control of the [from_country.GetFlavorRank] and subdued its [from_country.GetGovernment.GetCourtTitle].\n\nIt is humiliating for [target_character2.GetShortNameWithNoTooltip] have [target_character2.GetHerHis] name tarnished like this! We must punish [target_character.GetShortNameWithNoTooltip]."
 flavor_tun.8.a: "参战！"
 flavor_tun.8.b: "我们无力一战。"
 flavor_tun.10.title: "埃米尔主义"
 flavor_tun.10.entry: "$flavor_tun.10.title$"
 flavor_tun.10.desc: "[ShowScriptedGeographyName('ifriqiya_geography')] 乃是无法无天、道德沦丧之地。近一个世纪以来，[ROOT.GetCountry.GetLongName] 及其 [ShowDynastyName('hafsid_dynasty')] 各支族都无法将统治延伸至城市以外，导致乡村各省动荡不安、盗匪横行。然而，一线希望之光正照耀着 [ShowCultureName('andalusi')] 的显贵与 [ShowEstateTypeName('nobles_estate')] 的各大谢赫——那便是埃米尔主义思想的曙光，它憧憬着未来由一位地方埃米尔统治整个 [ShowAreaName('tunis_area')]，使其重新走向繁荣。"
 flavor_tun.10.a: "愿 [ROOT.GetCountry.GetReligion.GetGodName] 为我们指引光明。"
 flavor_tun.10.a.entry: "愿 $muslim_god_name$ 为我们指引光明。"
 tun_info_about_tunis_decentralization: "我们应尽快废除 [ShowGovernmentReformName('tun_strong_familial_governors')] 这一 [government_reform|e]"
 tun_additional_benefits_for_farfanes_tt: "[ShowEstatePrivilegeName('catalan_merchant_privileges')] will grant up to #Y +0.25#! [ShowModifierTypeName('monthly_towards_centralization')], depending on our [ShowUnitDefinitionName('a_farfanes')] count"
 flavor_tun.11.title: "[ShowScriptedGeographyNameWithNoTooltip('ifriqiya_geography')]，重归一统"
 flavor_tun.11.desc: "The decentralization of the [ROOT.GetCountry.GetLongName] has been addressed at its core. The era of the [ShowGovernmentReformName('tun_strong_familial_governors')] is over, and all of [ShowScriptedGeographyName('ifriqiya_geography')] stands reunited under the banners of the [ROOT.GetCountry.GetGovernment.GetRulerOrHeirIfRegent.GetDynasty.GetName]. No longer will the [ROOT.GetCountry.GetAdjectiveWithNoTooltip] countryside be brutalized by rampant crime; no longer will the [ROOT.GetCountry.GetAdjectiveWithNoTooltip] emirs be blackmailed by the [ShowEstateTypeName('nobles_estate')]; no longer will the [ROOT.GetCountry.GetAdjectiveWithNoTooltip] state be dependent on the support of foreign actors.\n\nIt is a time of reckoning for the old order, and a great opportunity for us to usher in a new era."
 flavor_tun.11.a: "这是新时代的黎明。"
 flavor_tun.11.b: "新身份的诞生。"
 IFRIQIYA_NAME: "'Ifrīqiya"
 IFRIQIYA_NAME_ADJ: "$IFRIQIYA_NAME$"
 ifriqiya_reunited_decision.title: "$flavor_tun.11.title$"
 ifriqiya_reunited_decision.entry: "$flavor_tun.11.title$"
 ifriqiya_reunited_decision.desc: "$flavor_tun.11.desc$"
 ifriqiya_reunited_decision.a: "$flavor_tun.11.a$"
 flavor_tun.12.title: "[ShowLocationNameWithNoTooltip('bejaia')]海盗活动的增长"
 flavor_tun.12.entry: "$flavor_tun.12.title$"
 flavor_tun.12.desc: "近年来，[target_location.GetName]见证了其最不寻常却又利润颇丰的产业——[ShowScriptedGeographyName('mediterranean_sea_geography')]海盗活动——的扩张。多年来，当地的酋长们一直大力支持[ShowBuildingTypeName('pirate_haven')]及其对[ShowReligionGroupAdjective('christian')]村庄发动的、几乎公开进行的袭击，尽管我们与其存在既有的商贸关系。此类袭击确实严重损害了我们与潜在贸易伙伴的关系，但我们从[ShowPolicyName('state_piracy_policy')]中获得的利润亦不容小觑。"
 flavor_tun.12.a: "他们是 [ROOT.GetCountry.GetReligion.GetGodName] 的敌人！"
 flavor_tun.12.a.entry: "他们是 $muslim_god_name$ 的敌人！"
 flavor_tun.12.b: "随便吧。"
 flavor_tun.12.c: "海盗活动对我们毫无益处。"
 flavor_tun.13.title: "经济扼制"
 flavor_tun.13.entry: "$flavor_tun.13.title$"
 flavor_tun.13.desc: "The [ShowReligionGroupAdjective('christian')] merchants in [ROOT.GetCountry.GetName] have already received wide-ranging [ShowEstatePrivilegeName('catalan_merchant_privileges')]. Despite those, despite the quarters that we so generously provide them, the ability to defer to their own, the freedom of religion we have granted them, the [target_country.GetAdjective] [target_country.GetGovernment.GetEstateName('burghers_estate')] still demand more — otherwise their home country may cease business with us altogether."
 flavor_tun.13.a: "这些雇佣兵太过重要了。"
 flavor_tun.13.b: "哼！我们不需要他们的服务。"
 tun_economic_stranglehold_tt: "The [ShowModifierTypeName('global_merchant_power')] in [ShowEstatePrivilegeName('catalan_merchant_privileges')] will be increased by #R -10.0%#!"
 flavor_tun.14.title: "亲族的要求"
 flavor_tun.14.desc: "[ShowDynastyName('hafsid_dynasty')] 家族的一位王子 [target_character.GetName] 已经权势渐盛，要求获得 [ShowSubjectTypeName('familial_governor')] 之位。除非我们让步，将 [target_location.GetName] 授予 [target_character.GetNameWithNoTooltip]，否则必将在 [ROOT.GetCountry.GetLongName] 内引发动荡。"
 flavor_tun.14.a: "就让 [target_character.GetHerHim] 如愿以偿吧！"
 flavor_tun.14.b: "现在还不是时候。"
 tun_target_character_expects_a_governorship_tt: "[target_character.GetName] 期望成为 [ShowSubjectTypeName('familial_governor')]，在 [target_character.GetSheHe] 通过 [ShowCharacterInteractionName('assign_familial_governor')] 获得该职位之前，[target_character.GetSheHe] 都有资格继续触发这一 [event|e]"
 flavor_tun.15.title: "继承争议"
 flavor_tun.15.desc: "老[old_ruler.GetName]的死使[ROOT.GetCountry.GetCapital.GetName]出现了权力真空。名义上，应由[new_ruler.GetName]接任[ROOT.GetCountry.GetName]的总督之位，但这一继承远非板上钉钉。一场受неизвестному势力支持的民众暴动正行进在都城的街道上，企图确保[target_character2.GetName]的继承。我们该支持正统继承人，还是任由[ShowEstateTypeName('burghers_estate')]为所欲为？"
 flavor_tun.15.a: "[new_ruler.GetNameWithNoTooltip] 才是正统继承人！"
 flavor_tun.15.b: "我们必须听从民众的呼声。"
 flavor_tun.16.title: "[target.GetNameWithNoTooltip] 的继承"
 flavor_tun.16.desc: "随着 [new_ruler.GetName] 的继承，[target.GetLongName] 与 [ROOT.GetCountry.GetName] 的诸邦再度统一于同一位 [ShowDynastyName('hafsid_dynasty')] 中央统治者之下。愿 [ShowScriptedGeographyName('ifriqiya_geography')] 能早日重归一统，不再深受 [ShowSocietyDirectionName('decentralization')] 之苦。"
 flavor_tun.16.a: "距离统一又近了一步。"
 flavor_tun.16.b: "[ROOT.GetCountry.Custom('common_string_positive')]"
 tun_target_was_annexed_tt: "[target.GetName]已被[annexed|e]入[ROOT.GetCountry.GetName]"
 flavor_tun.17.title: "[from_country.GetNameWithNoTooltip] 的王位争议"
 flavor_tun.17.desc: "[target_character2.GetShortNameWithNoTooltip]在[from_country.GetCapital.GetName]获得了[from_country.GetGovernment.GetEstateName('burghers_estate')]足够的民众支持，已成为国家名义上的统治者，实际上剥夺了[new_ruler.GetNameWithNoTooltip]的正当继承权，也剥夺了我们应有的领导权。"
 flavor_tun.17.a: "我们绝不姑息！"
 flavor_tun.17.b: "还有更要紧的事情让我们操心。"
 flavor_tun.18.title: "一位 [ShowCultureNameWithNoTooltip('andalusi')] 名流"
 flavor_tun.18.desc: "一位在[target_character.GetBirthLocation.GetArea.GetName]出生长大的当地[ShowCultureName('andalusi')][target_character.GetWomanMan]，最近晋升官阶，进入了[ROOT.GetCountry.GetCapital.GetName]的[ROOT.GetCountry.GetAdjective][ROOT.GetCountry.GetGovernment.GetCourtTitle]之列。看来[target_character.GetName]不久将成为我们[ROOT.GetCountry.GetFlavorRank]的[ShowEstatePrivilegeName('andalusi_elite')]成员之一。"
 flavor_tun.18.a: "棒极了！"
 flavor_tun.19.title: "新的继承人？"
 flavor_tun.19.desc: "近来[ROOT.GetCountry.GetCapital.GetName]的街头巷尾流言四起。[ROOT.GetCountry.GetCapital.GetRank.GetName]正在考虑[target_character2.GetName]的统治，思忖着谁才是继承[target_character2.GetHerHim]之位的合适人选。[ShowEstateTypeName('burghers_estate')]相中了一位声名显赫的人物——[target_character.GetName]，认为此人才是[ROOT.GetCountry.GetName]王位的正当继承者。据说[ShowEstateTypeNameWithNoTooltip('burghers_estate')]已被[target_character.GetHerHis]许下的种种特权与额外权利所打动。"
 flavor_tun.19.a: "好吧，任命 [target_character.GetNameWithNoTooltip]。"
 flavor_tun.19.b: "若他们真信此言，那真是愚不可及。"
 hafsid_caliphate_decision.desc.entry: "我们未能确立自己为[GetCountry('ALM').GetAdjective]哈里发国的继承者。此事绝不能容忍！我们身为[ShowReligionAdjective('sunni')]社群领袖的地位必须夺回！"
 ifriqiya_reunited_decision.desc.entry: "[ShowScriptedGeographyName('ifriqiya_geography')]长久以来分裂为诸多邦国，其中许多由[ShowDynastyName('hafsid_dynasty')]家族的旁支统治。我们绝不能再让这种分裂状态延续下去。"
 tun_have_more_gp_score_than_us: "没有任何 [ShowReligionAdjective('sunni')] 的 [country|e] 拥有比 [THIS.GetCountry.GetName] 更多的 [great_power_score|e]"
