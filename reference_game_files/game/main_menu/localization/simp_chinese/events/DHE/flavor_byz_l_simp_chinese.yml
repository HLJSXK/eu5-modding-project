l_simp_chinese:
 flavor_byz.1.title: "对威尼斯的洗劫与破坏"
 flavor_byz.1.entry: "$flavor_byz.1.title$"
 flavor_byz.1.desc: "在对十字军的惊世背叛的复仇渴望驱使下，[ROOT.GetCountry.GetAdjective]军队涌入[ShowLocationName('venice')]这座昔日伟大的城市，没有留下一个活口。帝国众将的使命始终明确：必须剥夺所有显贵家族的财产和荣誉，誓要夺还所有世界渴望之城被窃取的珍宝。\n\n[ROOT.GetCountry.GetAdjectiveWithNoTooltip]军队攻入这座水城之时，场面令人惊骇到超乎人类的想象。半生戎马的士兵长不出慈悲心肠，诸将军亦渴望见证此城覆灭——[ROOT.GetCountry.GetAdjectiveWithNoTooltip]的士兵在教堂、宫殿甚至威尼斯军械库展开了持续数天的破坏和掠夺。"
 flavor_byz.1.a: "任凭他们憎恨，只教他们恐惧。"
 flavor_byz.1.b: "停止劫掠！"
 variable_venice_acquired_peacefully_variable_tt: "[ShowLocationName('venice')]已被和平转移"
 STATIC_MODIFIER_NAME_chastening_of_venice: "威尼斯的报应"
 STATIC_MODIFIER_DESC_chastening_of_venice: "被拜占庭攻占的威尼斯遭受的掠夺和破坏给这座城市留下了难以磨灭的印记。"
 flavor_byz.2.title: "雅典光复！"
 flavor_byz.2.entry: "$flavor_byz.2.title$"
 flavor_byz.2.desc: "数个世纪以来，[ShowLocationName('athens')]都是[ROOT.GetCountry.GetAdjectiveWithNoTooltip]的文化与艺术中心，直至第四次十字军失陷于拉丁人之手。后来，这座城市成为了由数个西欧家族统治的独立公国的首都。然而，这段历史终于走向终结，自1204年以来，[ShowLocationNameWithNoTooltip('athens')]第一次重返[ROOT.GetCountry.GetLongName]疆域。"
 flavor_byz.2.desc_hellenic: "神圣的[ShowLocationName('athens')]，哲学与古老智慧的发源地，重归尊崇古老诸神之人的怀抱。对于[ShowReligionAdjective('hellenism_religion')]信仰的[ROOT.GetCountry.GetFlavorRank]而言，这既是军事层面的胜利，更是精神层面的凯旋——雅典娜之城再度属于我们。"
 flavor_byz.2.desc_other: "历经长久的异族统治，旧世界的文化核心——古城[ShowLocationName('athens')]重回[ROOT.GetCountry.GetAdjective]的掌控。自1204年以来，[ShowLocationNameWithNoTooltip('athens')]首次再度成为[ROOT.GetCountry.GetLongName]的一部分。"
 flavor_byz.2.a: "且将直到永远！"
 flavor_byz.2.b: "雅典娜的城市回归于我们！"
 flavor_byz.2.c: "这是[ROOT.GetCountry.GetFlavorRank]的伟大胜利。"
 flavor_byz.2.c.entry: "国家的伟大胜利。"
 flavor_byz.3.title: "$izmit.greek_language$光复！"
 flavor_byz.3.entry: "$flavor_byz.3.title$"
 flavor_byz.3.desc: "$izmit.greek_language$，突厥人称之为$izmit$，是小亚细亚海岸上的重要[ROOT.GetCountry.GetAdjective]城市，其在1337年被入侵的[ShowCultureName('turkish_culture')]势力征服前已有上千年历史。夺回该城，使我们能从理想位置再次进军小亚细亚。"
 flavor_byz.3.desc_hellenic: "$izmit$，曾是比提尼亚王国的都城，也是希腊化时代东方的雄城$izmit.greek_language$。早在成为[ROOT.GetCountry.GetFlavorRank]的重要基石之前，这里便是[ShowCultureName('greek_culture')]文明的中心。光复此城，让我们得以重新扼守安纳托利亚的门户。"
 flavor_byz.3.desc_other: "$izmit.greek_language$，突厥人称之为$izmit$，是小亚细亚海岸上的重要[ROOT.GetCountry.GetAdjective]城市，其在1337年被入侵的[ShowCultureName('turkish_culture')]势力征服前已有上千年历史。夺回该城，使我们能从理想位置再次进军小亚细亚。"
 flavor_byz.3.a: "正有此意！"
 flavor_byz.3.b: "古老的比提尼亚重归我们所有！"
 flavor_byz.3.c: "我们在安纳托利亚的立足点已然稳固。"
 flavor_byz.4.title: "安条克光复！"
 flavor_byz.4.entry: "$flavor_byz.4.title$"
 flavor_byz.4.desc: "在1084年落入[ShowCultureName('turkish_culture')]贝伊国之手的[ShowLocationName('antioch')]，一直被称为[ShowReligionGroupName('christian')]的摇篮。尽管繁荣不再，它仍是一大圣地。"
 flavor_byz.4.desc_hellenic: "[ShowLocationName('antioch')]由亚历山大大帝的继业者之一——“胜利者”塞琉古一世建立，并作为塞琉古帝国的都城。数个世纪以来，它都是希腊化世界最璀璨的城市之一，是[ShowCultureName('greek_culture')]文化与学术的核心。收复此城，对任何有志于继承古老遗产的统治者而言都是卓越功绩。"
 flavor_byz.4.desc_other: "自1084年沦陷于[ShowCultureName('turkish_culture')]诸贝伊国之手，伟大的圣地[ShowLocationName('antioch')]如今终于重归[ROOT.GetCountry.GetFlavorRank]掌控。虽然昔日荣光历经岁月而褪色，但[ShowLocationNameWithNoTooltip('antioch')]仍是意义重大的地标，也是通往东方的战略要隘。"
 flavor_byz.4.a: "神的旨意！"
 flavor_byz.4.b: "希腊化东方的明珠——[ShowLocationNameWithNoTooltip('antioch')]，属于我们了！"
 flavor_byz.4.c: "[ROOT.GetCountry.GetFlavorRank]的势力进一步向东延伸。"
 flavor_byz.4.c.entry: "国家的势力进一步向东延伸。"
 flavor_byz.5.title: "耶路撒冷光复！"
 flavor_byz.5.entry: "$flavor_byz.5.title$"
 flavor_byz.5.desc: "公元634年失陷于阿拉伯人之手的[ShowLocationName('jerusalem')]，曾是帝国[ShowReligionGroupAdjective('christian')]崇拜的中心。光复此地，必使全体[ShowReligionGroupAdjectiveWithNoTooltip('christian')]信徒士气大振。"
 flavor_byz.5.desc_hellenic: "[ShowLocationName('jerusalem')]长久以来对诸多信仰意义非凡，收复此地令我们的统治疆域深入旧帝国腹地。尽管它对[ShowReligionAdjective('hellenism_religion')]信徒并无特殊神圣意义，但掌控这座传奇地标本身便具备战略价值。"
 flavor_byz.5.desc_other: "自634年起便落入外族之手的[ShowLocationName('jerusalem')]城，如今已重归[ROOT.GetCountry.GetFlavorRank]统治。收复这座城池不仅巩固了我们在该地区的地位，更为我国疆域增添了一处极具声望的圣地。"
 flavor_byz.5.a: "神的旨意！"
 flavor_byz.5.b: "此城之贵在于地势，而非信仰。"
 flavor_byz.5.c: "又一处圣地重归[ROOT.GetCountry.GetFlavorRank]。"
 flavor_byz.5.c.entry: "又一处圣地重归国家。"
 flavor_byz.6.title: "罗马光复！"
 flavor_byz.6.entry: "$flavor_byz.6.title$"
 flavor_byz.6.desc: "尽管[ShowLocationName('rome')]并不总受帝国直接控制，但教宗利奥三世加冕[GetCharacter('fra_charlemagne').GetName]为神圣罗马皇帝之后，它最终还是正式断绝了与[ROOT.GetCountry.GetAdjective]的一切关系。但现在这座城已经回到我们手上——无论历经多少风霜，它都仍是享负盛名的荣耀之城。"
 flavor_byz.6.desc_hellenic: "早在教宗与自封的伪皇帝宣称并窃取这座城市之前，[ShowLocationName('rome')]便一直是我帝国在西部的首善之都——其历史渊源可追溯至文明奠基者的时代。如今摆脱了公教会的干涉，[ShowLocationNameWithNoTooltip('rome')]将重新成为彰显古老世界永恒辉煌的不朽丰碑。"
 flavor_byz.6.desc_other: "尽管古老的都城已不复往日的辉煌，[ShowLocationName('rome')]依然是已知世界中最负盛名的城市之一。其重归帝国掌控是一项重大成就，进一步巩固了我们对古帝国西部的法理宣称。"
 flavor_byz.6.a: "罗马，帝国伊始之地，重归我手。"
 flavor_byz.6.b: "古老的都城重回她的继业者之手！"
 flavor_byz.6.c: "无可比拟的帝国瑰宝。"
 flavor_byz.7.title: "罗马重奉正教！"
 flavor_byz.7.entry: "$flavor_byz.7.title$"
 flavor_byz.7.desc: "[ShowLocationName('rome')]人民已再次尊奉[ShowReligionAdjective('orthodox')]，残余的死硬教宗派走狗仅能隐姓埋名。尽管东西教会分裂早成定局，但即便日后局势继续恶化，东方的正教会亦能凭此确保在永恒的教权争端里处于上风。"
 flavor_byz.7.a: "接招吧，裂教者！"
 flavor_byz.8.title: "自安纳托利亚驱除突厥人！"
 flavor_byz.8.entry: "$flavor_byz.8.title$"
 flavor_byz.8.desc: "[GetCountry('TUR').GetName]的军队已被驱逐出他们曾经的权力中心——[ShowRegionName('anatolia_region')]。[ShowRegionNameWithNoTooltip('anatolia_region')]之安定，可确保我们繁荣无虞！"
 flavor_byz.8.a: "凤凰涅槃！"
 towns_and_cities_anatolia_get_pop_growth_tt: "治下所有位于[ShowRegionNameWithNoTooltip('anatolia_region')]的[towns_and_cities|e]将获得[ShowModifier('repopulation_of_anatolia_modifier')]增益[modifier|e]，持续#Y 10#!年"
 flavor_byz.9.title: "[ROOT.GetCountry.GetGovernment.GetRulerTitle]西行求援"
 flavor_byz.9.entry: "$flavor_byz.9.title$"
 flavor_byz.9.desc: "[GetCountry('TUR').GetName]贼寇侵占我们伟大的城市有一段日子了，而我们[target_province.GetName]的首都也已经在他们兵锋所指之内。尽管东西方教会存在裂痕，但[ROOT.GetCountry.GetGovernment.GetRuler.GetName]仍然提议组织一个外交使团前往西方与我们的[ShowReligionGroupAdjective('christian')]弟兄会面，从而为抵御[GetCountry('TUR').GetAdjectiveWithNoTooltip]人筹集足够的资金。\n\n尽管这段旅程可能带来丰硕的成果，但它同样可能在在世人眼中打上一个软弱且依赖他人的烙印。"
 flavor_byz.9.a: "做好必要的准备。"
 flavor_byz.9.tt: "[ROOT.GetCountry.GetGovernment.GetRulerTitle]将访问西欧各国宫廷以筹集资金。这很可能会被视作软弱并损害我们的国际地位"
 flavor_byz.9.b: "[ROOT.GetCountry.GetGovernment.GetRuler.GetShortNameWithNoTooltip]必须待在国内以凝聚我们的力量。"
 flavor_byz.9.b.entry: "统治者必须留下凝聚军势。"
 flavor_byz.10.title: "[donated_to_byzantium.GetNameWithNoTooltip]赞助我们的事业"
 flavor_byz.10.entry: "捐赠给拜占庭，赞助我们的事业。"
 flavor_byz.10.desc: "我们[ShowReligionGroupAdjective('christian')]兄弟国家统治者的慷慨绝不会被忽视。[ROOT.GetCountry.GetGovernment.GetRulerTitle]的出行争取到了客观的捐赠，从而足以支持我们同[GetCountry('TUR').GetName]的斗争。"
 flavor_byz.10.a: "国家的命运就将转危为安。"
 flavor_byz.11.title: "克里特画派"
 flavor_byz.11.entry: "$flavor_byz.11.title$"
 flavor_byz.11.desc: "在我们国家，很少有像克里特画派这样的艺术团体一样，在传播[GetCountry('BYZ').GetAdjectiveWithNoTooltip]艺术和圣像画的价值和美感方面产生如此重大的影响。在艺术家[target_artist.GetName]等人的领导下，这一画派不断吸纳优秀学徒，一定能使克里特岛成为文化和艺术的中心。"
 flavor_byz.11.a: "带他来宫廷。"
 flavor_byz.11.b: "他将在海外继续编织我们的传奇！"
 flavor_byz.11.c: "我们负担不起……"
 flavor_byz.12.title: "埃尔·格列柯"
 flavor_byz.12.entry: "$flavor_byz.12.title$"
 flavor_byz.12.desc: "很少有艺术家能像[target_artist.GetName]（亦称#italic 埃尔·格列柯#!）那样在不断变化的艺术领域留下如此深刻的印记。尽管他的作品成为早期巴洛克风格的对立面，但他通过支持想象力和直觉的首要地位而不是创作的主观性，成功地开辟了一个新的独特领域，从而在[ShowContinentName('europe')]艺术世界引起了广泛的反响。"
 flavor_byz.12.a: "他的画作应装点我们的墙壁。"
 flavor_byz.12.c: "我们负担不起……"
 get_el_greco_as_painter_tt: "[target_artist.GetNameWithNoTooltip]会成为#italic 画家#!"
 get_el_greco_as_sculptor_tt: "[target_artist.GetNameWithNoTooltip]会成为#italic 雕塑家#!"
 flavor_byz.13.title: "光荣的学术中心"
 flavor_byz.13.entry: "$flavor_byz.13.title$"
 flavor_byz.13.desc: "尽管我们的人民面临着种种困难，我们的艺术和文化依然充满活力和声望。没有哪个地方比[target_location.GetName]更能体现我们的艺术影响力和文化培养。作为[ShowInstitutionName('renaissance')]培养和传播的跳板，此地的居民热情接纳并促进了艺术与思想流派的发展，共同经历了哲学与[ROOT.GetCountry.GetAdjective]风格的美好黄金时代。"
 flavor_byz.13.a: "资助其扩建。"
 flavor_byz.13.b: "让财富洒遍[target_province.GetNameWithNoTooltip]！"
 flavor_byz.13.b.entry: "让财富遍及全省！"
 flavor_byz.13.c: "这笔钱最好用在别处。"
 flavor_byz.14.title: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]的提议"
 flavor_byz.14.entry: "$flavor_byz.14.title$"
 flavor_byz.14.desc: "我国的海军年久失修。这支曾令我们强权引以为豪的强大军种，如今已成为世界的笑柄。事实上，我们无耻的邻国觊觎我们的土地，前来争夺我们的海域，并频繁入侵我们的港口。在我们需要帮助的时候，来自[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]的代表提出了一个令人费解的建议。根据他们的来信，他们希望指挥我们的海军部队，并在此过程中提供资金支持……"
 flavor_byz.14.a: "我们不能依赖他们！"
 flavor_byz.14.b: "[ROOT.GetCountry.Custom('common_string_positive')]"
 flavor_byz.14.b.entry: "$common_string_brilliant$"
 byz_magnates_wont_offer_again_tt: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]将不再为海军事务提供帮助"
 flavor_byz.15.title: "[ROOT.GetCountry.GetGovernment.GetRulerOrRegent.GetNameWithNoTooltip]的海军改革"
 flavor_byz.15.entry: "$flavor_byz.15.title$"
 flavor_byz.15.desc: "众所周知，我们的海军已经不如从前。最近我们的人民面临的动荡已经耗尽了帝国国库，导致各个领域的削减和短缺。尽管如此，我们的顾问在[target_character2.GetName]的领导下，制定了一项计划，试图恢复我们昔日的海军辉煌！"
 flavor_byz.15.a: "我们可以支持此类改革。"
 flavor_byz.15.b: "让改革达到无比的广度！"
 flavor_byz.15.c: "这笔钱最好花在别处……"
 if_we_pass_naval_reform_disaster_panel_tt: "如果我们选择在[ShowDisasterName('fate_of_the_phoenix')][disaster|e]面板通过[ShowGenericActionName('reform_imperial_armies')][action|e]改革[navy|e]，这将带来增益"
 following_rewards_are_bolstered_because_of_disaster_action_tt: "由于我们在[ShowDisasterName('fate_of_the_phoenix')][disaster|e]面板通过[ShowGenericActionName('reform_imperial_armies')][action|e]改革了至少一次[navy|e]，以下奖励得到了加强"
 flavor_byz.16.title: "[target_character.GetNameWithNoTooltip]"
 flavor_byz.16.entry: "康斯坦丁诺斯·阿尔梅诺普洛斯"
 flavor_byz.16.desc: "如同一阵宁静的徐风，一部刚刚出版的法律著作已经在我们[ROOT.GetCountry.GetFlavorRank]的法学家和官僚之间广为流传。不久前得以问世的#italic 《法律六书》#!由年轻的[target_character.GetName]编写，他以大量的案例为基础、靠交叉引用等方式，将[ROOT.GetCountry.GetAdjective]大部分法理学说整理为一部对司法适用有巨大价值的大部头。\n\n我们是否应该邀请这位年轻的法学家加入我们的宫廷，作为对他辛勤工作的奖励？"
 flavor_byz.16.a: "向他发出邀请。"
 flavor_byz.16.b: "别，我们不需要更多的讼棍了。"
 flavor_byz.17.title: "[john_koukouzelis.GetNameWithNoTooltip]的天使之声"
 flavor_byz.17.entry: "约翰·库库泽利斯的天使之声"
 flavor_byz.17.desc: "伟大的[john_koukouzelis.GetName]的逝世给[ROOT.GetCountry.GetLongName]的各大教堂蒙上了一层悲伤的面纱，许多人哀悼他的声音，最博学的人哀悼他的作曲双手。\n\n但希望之光在我们的宫廷中闪耀，因为他目睹圣母的历史被口口相传。他虔诚的生活和许多归因于他的奇迹正推动当地神职人员要求将他封为圣人。"
 flavor_byz.17.a: "我们可以与牧首谈谈！"
 flavor_byz.17.b: "我们不关心这种事。"
 flavor_byz.18.title: "[GetCountry('BYZ').GetNameWithNoTooltip]陷落"
 flavor_byz.18.entry: "$BYZ$的陷落"
 flavor_byz.18.desc: "随着[GetCountry('BYZ').GetName]沦陷，[ShowCultureName('greek_culture')]世界受到震动。历时数月的[target_country.GetName]围攻之下，[target_location.GetName]的城墙终于倒塌了。[target_country.GetAdjectiveWithNoTooltip]军队冲进城市，洗劫了它，对全球的[ShowCultureNameWithNoTooltip('greek_culture')]人口造成了深远的影响。尽管凤凰已经消失，但这一消息使我们的大部分民众，尤其是[target_location2.GetName]的社区，受到了伤害。"
 flavor_byz.18.a: "紫凤凰自此不存。"
 BYZ_FALL_OF_BYZANTIUM_CONVERSION: "我们所有的[ShowCultureName('greek_culture')][pops|e]会失去[ShowNamedValue('pop_satisfaction_extreme_penalty')|+=2%][pop_satisfaction|e]"
 flavor_byz.19.title: "保卫[ShowAreaNameWithNoTooltip('morea_area')]"
 flavor_byz.19.entry: "保卫摩里亚地区"
 flavor_byz.19.desc: "在第四次十字军东征和[ShowLocationName('constantinople')]沦陷期间，[ShowAreaName('morea_area')]的土地被法兰克人占领，我们的帝国暂时分裂。尽管那段日子已经过去，他们在该地区的影响力仍旧挥之不去，因为至今仍有一些游荡的雇佣兵公然对抗我们的统治。"
 flavor_byz.19.a: "我们必须保护[ShowAreaNameWithNoTooltip('morea_area')]的人民不受外部袭扰。"
 flavor_byz.20.title: "改革罗马人的普遍审判官"
 flavor_byz.20.entry: "$flavor_byz.20.title$"
 flavor_byz.20.desc: "尽管我们的最高法院在前任统治者的领导下进行了改革，但最近爆出了一起丑闻。四名法官中的三名被指控腐败，无视国家利益以追求个人利益。[target_character.GetName]已经听说了这个消息，并计划清除最高法院中的任何形式的腐败。"
 flavor_byz.20.historical_info: "尽管“罗马人的普遍审判官”由安德罗尼科斯二世·巴列奥略在13世纪末创建，但其法官职位却早已被腐败分子所占据。到了1337年，在安德罗尼科斯三世·巴列奥略的调查中，四名法官中有三名被判有罪，随后该机构经历了一定程度的改革。"
 flavor_byz.20.a: "系统腐败必须被根除。"
 flavor_byz.20.b: "当前体制挺好的。"
 able_to_add_reform_later_tt: "我们之后将可以采用该[government_reform|e]"
 flavor_byz.21.title: "拜占庭边民诗歌"
 flavor_byz.21.entry: "$flavor_byz.21.title$"
 flavor_byz.21.desc: "在早期[GetCountry('BYZ').GetName]时代，许多被称为#italic “阿克里泰”#!的边疆战士为了保护[ShowRegionName('anatolia_region')]免受[ShowCultureGroupName('arabic_group')]人的入侵而战斗。这使[ShowCultureName('greek_culture')]文学中产生了许多伟大的诗篇和英雄，如#italic 狄吉尼斯·阿克里特#!。"
 flavor_byz.21.historical_info: "这些诗歌中的许多被认为是现代希腊文学的开端，其中一些甚至成为希腊民族主义的象征。其中一首诗，也许是最著名的，是狄吉尼斯·阿克里特的故事，他是一个具有希腊和阿拉伯血统的边境守卫，保护拜占庭帝国免受阿拉伯人的侵害，甚至杀死了龙等神话生物。"
 flavor_byz.21.a: "使这些诗歌为世人所知。"
 flavor_byz.22.title: "阿穆里斯之歌"
 flavor_byz.22.entry: "$flavor_byz.22.title$"
 flavor_byz.22.desc: "最伟大的拜占庭边民诗歌之一是讲述#italic 阿穆里斯·阿穆罗普洛斯#!的诗歌。他的冒险包含了几项赫拉克勒斯般的壮举，例如单枪匹马与一支萨拉森军队战斗“整整一天一夜”。战斗结束后，他虽被击落马下，却依然追击偷走他坐骑的敌人深入叙利亚，最终追上盗马者并斩断了其双臂。尽管这首诗最初写于11世纪，但其内容大部分已经遗失。也许现在我们可以尝试恢复其中的一些部分，即使它们不完全准确。"
 flavor_byz.22.historical_info: "$flavor_byz.21.historical_info$"
 flavor_byz.22.a: "值得为此付出努力。"
 flavor_byz.22.b: "我们不会玷污古代艺术作品。"
 flavor_byz.23.title: "化作大理石的皇帝"
 flavor_byz.23.entry: "$flavor_byz.23.title$"
 flavor_byz.23.desc: "尽管[ShowLocationName('constantinople')]已不再处于[ShowCultureGroupName('greek_group')]人的掌控之下，许多人依旧坚信，帝国的最后一位统治者并未在[target_character.GetHerHis]最终的时刻惨遭杀害。相反，在天使的护佑下，在落日的辉煌映照中，[target_character.GetSheHe]被引至[ShowBuildingTypeName('theodosian_walls')]之下，并在那里化身为大理石雕像。至今，这些传说的真实性仍旧扑朔迷离，但不争的事实是，有时虚构的故事拥有改变人们对现实世界看法的力量。"
 flavor_byz.23.a: "[target_character.GetNameWithNoTooltip]一定只是化作了一尊大理石。"
 flavor_byz.23.historical_info: "类似于“化作大理石的皇帝”这样的传说在许多其他文化中都有类似的案例，而对于希腊人来说，作为拜占庭帝国最著名的皇帝之一，他们都希望君士坦丁十一世·巴列奥略能有一个不那么悲惨的结局。据传，在1453年君士坦丁堡围城期间，他并没有在战斗中死亡，有一天会回来恢复他的帝国。"
 BYZ_MARBLED_EMPEROR_TOOLTIP: "个人的历史记录有时可以被篡改，即便是[target_character.GetName]的生平……"
 flavor_byz.24.title: "十字币"
 flavor_byz.24.entry: "$flavor_byz.24.title$"
 flavor_byz.24.desc: "随着我们的旧币#italic 超纯币#!在内部和外部的商业中逐渐过时，[target_character.GetName]提议开始铸造一种新币，#italic 十字币#!。\n\n这些货币改革以#italic 威尼斯杜卡特#!为模板，将使我们的[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]更容易与其他欧洲国家进行贸易，但[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]也需要适应这种新币。"
 flavor_byz.24.a: "铸造这种新硬币。"
 flavor_byz.24.b: "不能让[GetCountry('VEN').GetNameWithNoTooltip]人影响我们的经济。"
 flavor_byz.24.b.entry: "$VEN$不会影响我们的经济。"
 flavor_byz.24.historical_info: "1367年，约翰五世·巴列奥略皇帝引入了一种名为十字币（斯塔夫拉顿）的新货币，其名称源自希腊语中的“十字架”。这种银币取代了已经废止的黄金超纯币，并一直使用到拜占庭帝国的终结。"
 policy_will_not_be_implemented_but_available: "这次不会实施[target_policy.GetName]，但我们仍可以使用它"
 flavor_byz.25.title: "[target_artist.GetNameWithNoTooltip]"
 flavor_byz.25.entry: "希腊主义学者"
 flavor_byz.25.desc: "[target_artist.GetName]已经抵达我们的[ROOT.GetCountry.GetGovernment.GetCourtTitle]。他主张[ROOT.GetCountry.GetName]应该回归希腊时代。尽管他表现出色，[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]反对他的观点。"
 flavor_byz.25.a: "让他留在[ROOT.GetCountry.GetGovernment.GetCourtTitle]。"
 flavor_byz.25.a.entry: "让他留在宫廷。"
 flavor_byz.25.b: "他的异端学说必须停止！"
 flavor_byz.25.historical_info: "格弥斯托士·卜列东是最著名的拜占庭学者之一。他提倡在西欧复兴希腊学术，并撰写了许多手稿，其中大量文本专注于古希腊文明的复兴以及对拜占庭法律的摒弃。"
 while_remains_chance_to_revive_hellenism_tt: "#italic 只要[target_artist.GetNameWithNoTooltip]仍在我们的[ROOT.GetCountry.GetGovernment.GetCourtTitle]，他就会尝试复兴[ShowReligionName('hellenism_religion')]#!"
 flavor_byz.26.title: "[target_location.GetNameWithNoTooltip]的[ShowCultureNameWithNoTooltip('greek_culture')]人"
 flavor_byz.26.entry: "小亚细亚的人民"
 flavor_byz.26.desc: "随着我们的部队登陆[ShowAreaName('west_anatolia_area')]登陆并成功收复当地的港口，[target_location.GetName]的杰出地位再一次显现出来。作为历史上[ShowCultureName('turkish_culture')]人与[ROOT.GetCountry.GetAdjective]人民争夺的焦点，它再次落入我们的手中。[target_character.GetName]计划在不久的将来保持对这座城市的控制，并已开始巩固其在[ShowRegionName('anatolia_region')]的地位。"
 flavor_byz.26.a: "它应当成为我们在[ShowAreaNameWithNoTooltip('west_anatolia_area')]的主要港口。"
 BYZ_SMYRNA_PEOPLE_CONVERT_TO_GREEK: "该地点#G 20%#!的[pops|e]将同化为[ShowCultureName('greek_culture')]文化"
 BYZ_SMYRNA_GREEKS_GAIN_SATISFACTION: "所有[ShowCultureName('greek_culture')][pops|e]获得[ShowNamedValue('pop_satisfaction_severe_bonus')|+=2%][pop_satisfaction|e]"
 flavor_byz.27.title: "[target_character.GetDynasty.GetNameWithNoTooltip]文艺复兴的衰落"
 flavor_byz.27.entry: "巴列奥略文艺复兴"
 flavor_byz.27.desc: "在过去，许多多伟大的艺术家涌入我们的[ROOT.GetCountry.GetGovernment.GetCourtTitle]，这一盛况被誉为“[target_character.GetDynasty.GetName]文艺复兴”。然而，近年来，这一现象似乎出现了衰退，许多杰出人才选择加入其他宫廷，而非我们这里。为了扭转这一局面，[target_character.GetName]或许应该考虑投资。"
 flavor_byz.27.historical_info: "当巴列奥略王朝收复君士坦丁堡时，他们发起了一场城市更新运动，这标志着拜占庭艺术发展的最后一个时期的开始。艺术逐渐摒弃了许多传统的拜占庭元素，例如，艺术家开始在他们的作品上署名，这在以前是不常见的。同时，艺术风格也发生了转变，形成了独特的巴列奥略风格，这种风格随后对克里特艺术学派产生了深远的影响。"
 flavor_byz.27.a: "我们现在没钱资助任何人。"
 flavor_byz.27.b: "[ROOT.GetCountry.GetAdjectiveWithNoTooltip]国库将支付费用！"
 flavor_byz.27.b.entry: "我们的国库将承担支出！"
 flavor_byz.27.c: "允许[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]付账。"
 flavor_byz.27.c.entry: "允许$nobles_estate$付账。"
 flavor_byz.27.d: "[target_location.GetNameWithNoTooltip]将成为[ShowInstitutionNameWithNoTooltip('renaissance')]的摇篮。"
 flavor_byz.27.d.entry: "地点将成为[ShowInstitutionNameWithNoTooltip('renaissance')]的摇篮。"
 constantinople_to_spawn_renaissance_tt: "[ShowLocationName('constantinople')]将符合作为[ShowInstitutionName('renaissance')]发源地的条件"
 flavor_byz.28.title: "将[ROOT.GetCountry.GetGovernment.GetCourtTitle]迁往[ShowAreaNameWithNoTooltip('morea_area')]"
 flavor_byz.28.entry: "新斯巴达"
 flavor_byz.28.desc: "随着我们在[ShowRegionName('balkan_region')]势力的减弱，[target_character.GetName]构想出一个确保国家存续的方法。通过在[target_location.GetName]建立新的首都并加强[ShowAreaName('morea_area')]的防御，我们能够确保任何外来入侵者都无法轻易地侵犯我们，他们必须付出沉重的代价。"
 flavor_byz.28.a: "也许[target_character.GetNameWithNoTooltip]的话有些道理……"
 flavor_byz.28.a.entry: "也许角色的话有些道理……"
 flavor_byz.28.b: "放弃[target_location2.GetNameWithNoTooltip]对我们没好处。"
 flavor_byz.28.b.entry: "放弃地点对我们没好处。"
 flavor_byz.29.title: "普世博学馆"
 flavor_byz.29.entry: "$flavor_byz.29.title$"
 flavor_byz.29.desc: "鉴于[target_location.GetName]作为[target_character.GetDynasty.GetName]王朝的前卫城市，[target_character.GetName]一直有意在前驱者圣约安修道院设立一个学术机构。这样的建设将需要大量资源，同时国家或许需要委托外部力量来承担这些工程。"
 flavor_byz.29.a: "再贵也无法阻止[target_character.GetNameWithNoTooltip]。"
 flavor_byz.29.a.entry: "再贵也无法阻止角色。"
 flavor_byz.29.b: "太贵了。"
 flavor_byz.29.historical_info: "关于名为“普世博学馆”的机构，世人知之甚少，但可以确定的是，它于14世纪初在君士坦丁堡建立，位于前驱者圣约安修道院内。该机构的图书馆吸引了众多意大利学者，他们纷纷前来学习希腊语言和文化。"
 flavor_byz.30.title: "与[target_country.GetNameWithNoTooltip]缔结条约"
 flavor_byz.30.entry: "东正教会与路德宗结盟对抗天主教"
 flavor_byz.30.desc: "随着[target_country.GetReligion.GetName]在[ShowContinentName('europe')]兴起，[ShowReligionAdjective('catholic')]世界——我们的老仇家——终于像几个世纪前的我们一样经历了一场宗教分裂。引领这场改革运动的是[target_country.GetName]。或许，若我们能与他们维持良好的外交关系，我们最终将有机会对[target_country2.GetName]报当年的一箭之仇……"
 flavor_byz.30.a: "我们要与[target_country.GetNameWithNoTooltip]结盟。"
 flavor_byz.30.a.entry: "我们要与他们结盟。"
 flavor_byz.30.b: "[target_country2.GetReligion.GetNameWithNoTooltip]的事情跟我们无关。"
 flavor_byz.30.b.entry: "他们信仰的事情跟我们无关。"
 flavor_byz.31.title: "改革[ROOT.GetCountry.GetAdjectiveWithNoTooltip]军队"
 flavor_byz.31.entry: "改革拜占庭军队"
 flavor_byz.31.desc: "在过去，我军凭借军区制及其提供的大规模征召部队占据优势。然而，随着国家财富积累和中央集权加强，军队逐渐向职业化方向转型。对此，[target_character.GetName]和[target_character.GetHerHis]的顾问团队一直致力于起草一个新的军事改革方案，旨在降低对[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]征召兵源的依赖。"
 flavor_byz.31.a: "军队应当服务[target_character.GetNameWithNoTooltip]。"
 flavor_byz.31.a.entry: "军队应当服务国王。"
 flavor_byz.31.b: "还是不要压制[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]的作用。"
 flavor_byz.31.b.entry: "还是不要压制$nobles_estate$的作用。"
 BYZ_ALL_THEMATA_PROVINCES_GAIN_NOBLE_LOYALTY: "拥有[ShowBuildingTypeName('thema_headquarters')]的[locations|e]的所有[ShowPopTypeName('nobles')][pops|e]获得[ShowNamedValue('pop_satisfaction_ultimate_bonus')|+=2%][pop_satisfaction|e]。"
 flavor_byz.32.title: "[target_character2.GetNameWithNoTooltip]崛起"
 flavor_byz.32.entry: "大内官的崛起"
 flavor_byz.32.desc: "[ROOT.GetCountry.GetAdjective]当前的历史阶段可以被描述为一场短暂的中兴，却仍面临诸多隐忧——尽管我们最近刚刚从一场毁灭性的内战中脱身，但新的政治派系正在形成。其中一派正聚集在#italic 大内官#![target_character2.GetName]的麾下。这一切将引向何方，唯有时间能给出答案。"
 flavor_byz.32.a: "这场宫廷阴谋正在酝酿……"
 flavor_byz.33.title: "罗马帝国？"
 flavor_byz.33.entry: "$flavor_byz.33.title$"
 flavor_byz.33.desc: "尽管我们一直称自己为[ShowLocationName('rome')]的继承者，但我们需要不断付出努力来维系这一称号。也许是时候追寻一种新的身份认同，不再沉湎于过去的荣耀，而是引导我们走向未来。"
 flavor_byz.33.a: "我们不再是罗马人。我们作为[ShowCultureNameWithNoTooltip('greek_culture')]国家而统治。"
 flavor_byz.33.b: "我们永远会不会放弃传承。"
 BYZ_ALL_PRIMARY_AND_ACCEPTED_POP_BECOME_HAPPIER: "所有[primary_culture|e]和[accepted_culture|e]的[pop|e]会获得[ShowNamedValue('pop_satisfaction_ultimate_bonus')|+=2%][pop_satisfaction|e]"
 flavor_byz.34.title: "[target_location.GetNameWithNoTooltip]向城垣外扩张"
 flavor_byz.34.entry: "君士坦丁堡，衰败之城"
 flavor_byz.34.desc: "[target_location.GetName]历经了数百年的冲突与战火，虽然已显露衰颓之势，但随着[ROOT.GetCountry.GetAdjective]国库的重建完成，我们终于可以着手恢复这座[target_location.GetRank.GetName]的建设，使她迈入一个崭新的时代。"
 flavor_byz.34.a: "[target_location.GetNameWithNoTooltip]将东山再起。"
 flavor_byz.34.a.entry: "地点应当再次崛起。"
 flavor_byz.34.b: "我们不会把钱都花在这座[target_location.GetRank.GetNameWithNoTooltip]上。"
 flavor_byz.34.b.entry: "我们不会把钱都花在一座城市上。"
 BYZ_UNLOCK_CONSTANTINOPLE_MANAGER_CABINET_ACTION: "解锁[ShowCabinetActionName('aid_constantinople')]内阁行动"
 flavor_byz.35.title: "[target_character2.GetNameWithNoTooltip]"
 flavor_byz.35.entry: "乔瓦尼·朱斯蒂尼亚尼"
 flavor_byz.35.desc: "尽管[GetCountry('GEN').GetAdjective]人通过[ShowBuildingTypeName('galata')]殖民地增强了在[target_location.GetName]的影响力，但同时也吸引了一批志在捍卫[ROOT.GetCountry.GetName]疆土的有志之士。其中之一便是[GetCountry('GEN').GetAdjectiveWithNoTooltip]籍雇佣兵[target_character2.GetName]，他准备向[target_character.GetName]效力。"
 flavor_byz.35.a: "为了[ROOT.GetCountry.GetFlavorRank]的利益，雇佣他。"
 flavor_byz.35.a.entry: "为了国家的利益，雇佣他。"
 flavor_byz.35.b: "信任[GetCountry('GEN').GetAdjectiveWithNoTooltip]人？绝不！"
 flavor_byz.35.b.entry: "相信$GEN_ADJ$？决不！"
 flavor_byz.36.title: "[ShowRegionNameWithNoTooltip('anatolia_region')]重光！"
 flavor_byz.36.entry: "恢复对安纳托利亚的控制"
 flavor_byz.36.desc: "我们的军队终于收复了旧行省[ShowRegionName('anatolia_region')]。随着其城市现在在我们的控制之下，我们的敌人被驱逐，我们终于可以庆祝这一胜利。"
 flavor_byz.36.a: "光荣归于[ROOT.GetCountry.GetNameWithNoTooltip]。"
 flavor_byz.36.a.entry: "荣耀归于我们。"
 flavor_byz.37.title: "登陆[ShowRegionNameWithNoTooltip('italy_region')]"
 flavor_byz.37.entry: "登陆意大利"
 flavor_byz.37.desc: "[ShowRegionName('italy_region')]半岛曾经是[ROOT.GetCountry.GetAdjective]的疆土，但随着伦巴第人和诺曼人控制了该地区，我们在半岛失去了所有的立足之地。而今，我们在[target_location.GetName]重新建立了一个据点，也许我们可以加固它，使其成为未来战略行动的重要支点。"
 flavor_byz.37.a: "应当巩固[target_location.GetNameWithNoTooltip]！"
 flavor_byz.37.a.entry: "应当巩固地点！"
 flavor_byz.37.b: "浪费钱。"
 flavor_byz.38.title: "[ShowBuildingTypeNameWithNoTooltip('hexamilion_wall')]"
 flavor_byz.38.entry: "六里墙"
 flavor_byz.38.desc: "随着我们在[ShowRegionName('balkan_region')]的控制力减弱，[target_country.GetLongName]处于危险境地。然而，[target_character.GetName]制定了一个确保[target_country.GetFlavorRank]生存的计划。通过在[ShowLocationName('corinth')]建造[ShowBuildingTypeName('hexamilion_wall')]并加强[ShowAreaName('morea_area')]省的防御，我们可能还有一些希望。"
 flavor_byz.38.a: "[ShowAreaNameWithNoTooltip('morea_area')]的安全是我们的最优先事项。"
 flavor_byz.38.b: "[ShowBuildingTypeNameWithNoTooltip('hexamilion_wall')]太贵了。"
 flavor_byz.38.historical_info: "在君士坦丁十一世统治摩里亚期间，他将帝国的重心转向该地区的山脉，认为如果帝国要生存下去，就必须加固六里墙并发展该处的城市。然而，当奥斯曼人入侵他的领土时，他的计划失败了，乡村被摧毁。"
 flavor_byz.39.title: "迁都[target_location.GetNameWithNoTooltip]？"
 flavor_byz.39.entry: "新首都"
 flavor_byz.39.desc: "随着我们将[ROOT.GetCountry.GetGovernment.GetCourtTitle]迁移到[ShowAreaName('morea_area')]，[target_location.GetName]已经事实上成为[target_country.GetAdjective]的首都。也许是时候让[target_character.GetName]放弃[target_location2.GetName]，选择此处为新家了？"
 flavor_byz.39.a: "也许[ShowAreaNameWithNoTooltip('morea_area')]更容易防守一些……"
 flavor_byz.39.b: "放弃[target_location2.GetNameWithNoTooltip]是重大错误，我们要加强它。"
 flavor_byz.39.b.entry: "放弃地点是重大错误，我们要加强它。"
 flavor_byz.39.c: "我们既不会放弃[target_location2.GetNameWithNoTooltip]也不会加强该处的防御。"
 flavor_byz.39.c.entry: "我们既不会放弃地点也不会加强该处的防御。"
 flavor_byz.40.title: "《法律书》"
 flavor_byz.40.entry: "$flavor_byz.40.title$"
 flavor_byz.40.desc: "自从[target_character.GetName]去世以来，几个人开始搜寻他的遗物。其中之一，[target_character2.GetName]，发现了他的一份手稿，名为#italic 《法律书》#!。受[ShowReligionAdjective('zoroastrian')]教义和柏拉图思想的启发，它包含了各种主题，所有这些都指向古希腊道路的回归。"
 flavor_byz.40.a: "艺术品就是艺术品。"
 flavor_byz.40.b: "修订某些文本，使其更宏大。"
 flavor_byz.40.c: "烧了毁掉！"
 flavor_byz.41.title: "[target_artist.GetNameWithNoTooltip]"
 flavor_byz.41.entry: "《巴列奥略家族史》"
 flavor_byz.41.desc: "随着越来越多的历史学家对[target_country.GetName]的历史感兴趣，其中一些人，例如[target_artist.GetName]，开始考虑撰写关于[target_character.GetDynasty.GetName]家族的编年史，以确保后代了解[target_character.GetName]和[target_character.GetHerHis]家族的事迹。"
 flavor_byz.41.a: "他可自由记录历史。"
 flavor_byz.41.b: "我们可以资助他的作品。"
 flavor_byz.42.title.a: "马夫罗科达托斯家族崛起"
 flavor_byz.42.title.b: "大翻译官"
 flavor_byz.42.entry: "$flavor_byz.42.title.a$"
 flavor_byz.42.desc: "[target_artist.GetName]生于[target_location.GetName]，自幼学习西方医学和哲学。在多所大学学习后，他汲取了大量知识，并精通多种语言形式。也许这样一位受过良好教育的哲学家在我们的[ROOT.GetCountry.GetGovernment.GetCourtTitle]中会表现出色。"
 flavor_byz.42.historical_info: "亚历山德罗斯·马夫罗科达托斯生于米科诺斯，是土耳其统治下的一名希腊人医生。在西方、尤其是在博洛尼亚大学学习后，他撰写了几篇论文，如#italic 《用于循环血液或利用肺部的气动仪器》#!。之后，他在穆罕默德四世苏丹手下任职，参与了1699年卡洛维茨条约的谈判，并在奥斯曼宫廷中获得了相当大的权力，使他的家族得以统治摩尔达维亚。"
 flavor_byz.42.a: "邀请[target_artist.GetNameWithNoTooltip]到[target_location2.GetNameWithNoTooltip]任职。"
 flavor_byz.42.a.entry: "邀请艺术家到地点任职。"
 flavor_byz.42.b: "他可作为伟大的外交官派到[target_country.GetNameWithNoTooltip]。"
 flavor_byz.42.b.entry: "他可作为伟大的外交官派到他国。"
 flavor_byz.42.c: "他太贵了，养不起。"
 flavor_byz.43.title: "成立七岛画派"
 flavor_byz.43.entry: "$flavor_byz.43.title$"
 flavor_byz.43.desc: "随着克里特画派成立和西欧艺术在[ShowContinentName('europe')]取得主导地位，[ShowCultureName('greek_culture')]已经开始采用这种新艺术形式。[ShowLocationName('corfu')]主要见证了这些新艺术家的新一波浪潮。也许是时候在[ShowProvinceDefinitionName('ionian_islands_province')]成立新画派了。"
 flavor_byz.43.a: "成立新画派。"
 flavor_byz.43.b: "我们不需要更多的艺术家。"
 flavor_byz.43.c: "[target_character.GetNameWithNoTooltip]应当全神贯注。"
 flavor_byz.43.c.entry: "角色应当全神贯注。"
 flavor_byz.43.d: "旧的克里特画派应当受宠。"
 flavor_byz.44.title: "[target_artist.GetNameWithNoTooltip]"
 flavor_byz.44.entry: "希腊式风格"
 flavor_byz.44.desc: "[target_artist.GetName]生于[target_location.GetName]，是一名[ShowCultureName('greek_culture')]裔画家，在[ShowProvinceDefinitionName('ionian_islands_province')]崭露头角。他的艺术遵循#italic 意大利拜占庭式#!风格，混合了[GetCountry('BYZ').GetAdjective]及[GetCountry('VEN').GetAdjective]的艺术形式。"
 flavor_byz.44.a: "资助他，邀请他到我们的[ROOT.GetCountry.GetGovernment.GetCourtTitle]。"
 flavor_byz.44.a.entry: "资助他，邀请他到我们的宫廷。"
 flavor_byz.44.b: "我们不需要更多的艺术家。"
 flavor_byz.45.title: "改革普罗尼亚制"
 flavor_byz.45.entry: "$flavor_byz.45.title$"
 flavor_byz.45.desc: "尽管[ShowPolicyName('pronoia_system')]在过去对我们有很大帮助，但行政头衔已劣化为与封建头衔无异，各省的总督不再由[target_character.GetName]任命，而成了世袭职位。[target_character.GetNameWithNoTooltip]已经计划改革这个制度，恢复对[ROOT.GetCountry.GetAdjective]各省的控制。"
 flavor_byz.45.a: "废除旧制。"
 flavor_byz.45.b: "是有一些漏洞，但改革对我们无益。"
 flavor_byz.46.title: "[ROOT.GetCountry.GetGovernment.GetCourtTitle]成员提供军事援助"
 flavor_byz.46.desc: "[target_country.GetAdjective]的[ROOT.GetCountry.GetGovernment.GetCourtTitle]成员提出支持[target_character.GetName]以及[target_character.GetHisHer]的施政。这是我们更容易推进我国的变革。"
 flavor_byz.46.a: "他们的支持对我们的陆军事业很有帮助。"
 flavor_byz.46.b: "他们应该援助海军。"
 flavor_byz.47.title: "[ROOT.GetCountry.GetGovernment.GetCourtTitle]成员密谋反对军队"
 flavor_byz_47_desc_common: "尽管陆军一直在保护我们的边界，但[ROOT.GetCountry.GetGovernment.GetCourtTitle]成员认为那里的某些军官和将军对[ROOT.GetCountry.GetFlavorRank]构成了威胁，谈论着他们如何希望推翻[target_character.GetName]并摧毁[ROOT.GetCountry.GetGovernment.GetCourtTitle]的权力。为此，他们建议我们将重心转向"
 flavor_byz.47.desc.a: "$flavor_byz_47_desc_common$[ShowSocietyDirectionName('quantity')]。"
 flavor_byz.47.desc.b: "$flavor_byz_47_desc_common$[ShowSocietyDirectionName('quality')]。"
 flavor_byz.47.desc.c: "$flavor_byz_47_desc_common$[ShowSocietyDirectionName('land')]。"
 flavor_byz.47.desc.d: "$flavor_byz_47_desc_common$[ShowSocietyDirectionName('naval')]。"
 flavor_byz.47.a: "以数量为主的陆军可以控制更多土地。"
 flavor_byz.47.b: "不必征发更多人进入军队，训练现有的即可。"
 flavor_byz.47.c: "我国的陆军军官应当得到进一步加强。"
 flavor_byz.47.d: "要保护[ROOT.GetCountry.GetNameWithNoTooltip]，我们必须从保护领海着手。"
 byz_court_wants_to_force_societal_changes: "[ROOT.GetCountry.GetGovernment.GetCourtTitle]希望我们在我国社会强制推行变革"
 flavor_byz.48.title: "[ROOT.GetCountry.GetGovernment.GetCourtTitle]成员提供官僚支援"
 flavor_byz.48.desc: "在连连管理不善的情况下，我们的一批[ROOT.GetCountry.GetGovernment.GetCourtTitle]成员鼎力协助，帮助[target_character.GetName]对一些法律进行了草拟，从而加强了[ROOT.GetCountry.GetName]在这一方面的短板。"
 flavor_byz.48.a: "良好的官僚能反哺[ROOT.GetCountry.GetGovernment.GetAdjective][ROOT.GetCountry.GetGovernment.GetCourtTitle]自身。"
 flavor_byz.48.b: "我们的社会治理应当建立在财权之上。"
 flavor_byz.49.title: "[ROOT.GetCountry.GetGovernment.GetCourtTitle]成员密谋反对[ROOT.GetCountry.GetGovernment.GetAdjective|U]官僚"
 flavor_byz_49_desc_common: "尽管我们的政府近期运作顺畅，但一些[ROOT.GetCountry.GetGovernment.GetCourtTitle]成员察觉到在职官僚中存在对他们的不利倾向。目前，他们正向我们施压，要求我们在"
 flavor_byz.49.desc.a: "$flavor_byz_49_desc_common$[ShowSocietyDirectionName('aristocracy')]方向做出实质性变革。"
 flavor_byz.49.desc.b: "$flavor_byz_49_desc_common$[ShowSocietyDirectionName('plutocracy')]方向做出实质性变革。"
 flavor_byz.49.desc.c: "$flavor_byz_49_desc_common$[ShowSocietyDirectionName('outward')]方向做出实质性变革。"
 flavor_byz.49.desc.d: "$flavor_byz_49_desc_common$[ShowSocietyDirectionName('inward')]方向做出实质性变革。"
 flavor_byz.49.a: "让我们拥抱[ShowSocietyDirectionNameWithNoTooltip('aristocracy')]。"
 flavor_byz.49.b: "我国必须奉行财阀治国的理念。"
 flavor_byz.49.c: "我国应当将视野投向外部。"
 flavor_byz.49.d: "[ShowSocietyDirectionNameWithNoTooltip('inward')]方能维持国家稳定。"
 flavor_byz.50.title: "[ROOT.GetCountry.GetGovernment.GetCourtTitle]成员提供贸易支持"
 flavor_byz.50.desc: "我们的[ROOT.GetCountry.GetGovernment.GetCourtTitle]成员决定在经济事务上向我们提供援助。他们表示，愿意帮助[target_character.GetName]制定一切有助于我国[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')]阶层的政策。"
 flavor_byz.50.a: "促进[ShowSocietyDirectionNameWithNoTooltip('mercantilism')]，让财富留在国内。"
 flavor_byz.50.b: "我们的市场向所有人敞开。"
 flavor_byz.51.title: "[ROOT.GetCountry.GetGovernment.GetCourtTitle]成员刁难[ROOT.GetCountry.GetGovernment.GetAdjective|U][ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')]"
 flavor_byz_51_desc_common: "我国的[ROOT.GetCountry.GetGovernment.GetCourtTitle]成员本应协助我们筹划一套高效的制度，以支持[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]阶层的稳固发展，然而，他们却反其道而行之，选择削弱王权，迫使我们不得不引领国家在"
 flavor_byz.51.desc.a: "$flavor_byz_51_desc_common$[ShowSocietyDirectionName('free_trade')]方向上做出实质性让步。"
 flavor_byz.51.desc.b: "$flavor_byz_51_desc_common$[ShowSocietyDirectionName('mercantilism')]方向上做出实质性让步。"
 flavor_byz.51.desc.c: "$flavor_byz_51_desc_common$[ShowSocietyDirectionName('capital_economy')]方向上做出实质性让步。"
 flavor_byz.51.desc.d: "$flavor_byz_51_desc_common$[ShowSocietyDirectionName('traditional_economy')]方向上做出实质性让步。"
 flavor_byz.51.a: "重塑一个[ShowSocietyDirectionNameWithNoTooltip('free_trade')]的[ROOT.GetCountry.GetNameWithNoTooltip]并不是天方夜谭。"
 flavor_byz.51.b: "[ShowSocietyDirectionNameWithNoTooltip('mercantilism')]有利于保护[ROOT.GetCountry.GetAdjectiveWithNoTooltip]的港口。"
 flavor_byz.51.c: "向[ShowSocietyDirectionNameWithNoTooltip('capital_economy')]迈进一定能充实我们的国库。"
 flavor_byz.51.d: "让我们回归[ShowSocietyDirectionNameWithNoTooltip('traditional_economy')]的生产吧。"
 flavor_byz.52.title: "改革《民法大全》"
 flavor_byz.52.entry: "$flavor_byz.52.title$"
 flavor_byz.52.desc: "尽管我们的[ROOT.GetCountry.GetFlavorRank]享有至高无上的主权，却未能遏制[ROOT.GetCountry.GetGovernment.GetCourtTitle]成员对[ROOT.GetCountry.GetFlavorRank]政治的干预。他们频频插手[ROOT.GetCountry.GetGovernment.GetParliament.GetName]事务，其诉求常与[target_character.GetName]的意志相左。也许，通过修订现行法典，我们可以制约他们在[ROOT.GetCountry.GetName]的权力扩张。"
 flavor_byz.52.a: "重编法典，即便这会激怒各阶层。"
 flavor_byz.52.b: "法典已经为[ROOT.GetCountry.GetNameWithNoTooltip]服务了几个世纪。"
 flavor_byz.52.b.entry: "法典已经为我们服务了几个世纪。"
 BYZ_NO_MORE_COURT_EVENTS: "将不再触发定期推动[societal_values|e]（无论好坏）的#Y 拜占庭宫廷影响#!的[events|e]。"
 BYZ_COURT_EVENTS_WILL_CONTINUE: "将继续触发定期推动[societal_values|e]（无论好坏）的#Y 拜占庭宫廷影响#!的[events|e]。"
 flavor_byz.53.title: "加固[ShowBuildingTypeNameWithNoTooltip('theodosian_walls')]"
 flavor_byz.53.entry: "加固狄奥多西城墙"
 flavor_byz.53.desc: "自拉丁人于1204年洗劫[target_province.GetName]以来，[ShowBuildingTypeName('theodosian_walls')]失去了昔日的辉煌。以前，我们缺乏足够的资源来妥善维护城墙，但在当下的艰难时期，我们必须确保城墙准备好应对袭击。"
 flavor_byz.53.a: "这是帝国长治久安的保障。我们必须对其再次加固，"
 flavor_byz.53.b: "困守[target_province.GetNameWithNoTooltip]不是成功之道。"
 flavor_byz.53.b.entry: "困守省份不是成功之道。"
 strengthened_theodosian_walls_desc: "来自$flavor_byz.53.title$[event|e]"
 flavor_byz.54.title: "处理[ShowCultureGroupNameWithNoTooltip('italian_group')]商人"
 flavor_byz.54.entry: "应对意大利影响"
 flavor_byz.54.desc: "尽管[ShowCultureGroupName('italian_group')][ShowPopTypeName('burghers')]曾经帮助我们充实了[target_location.GetName]人口，但现在显而易见的是，他们正在对[target_market.GetName]市场强取豪夺。我们必须将他们从[target_location.GetNameWithNoTooltip]驱逐出去，否则他们将继续为非作歹。"
 flavor_byz.54.a: "[target_location.GetNameWithNoTooltip]只属于[target_character.GetNameWithNoTooltip]！"
 flavor_byz.54.b: "应该避免与[ShowCultureGroupNameWithNoTooltip('italian_group')]邦国再次交战……"
 BYZ_ALL_ITALIAN_MERCHANTS_BECOME_UNHAPPY: "治下所有[ShowCultureGroupName('italian_group')][pops|e]失去[ShowNamedValue('pop_satisfaction_extreme_penalty')|+=2%][pop_satisfaction|e]"
 byz_destroy_italian_quarters_tt: "[target_location.GetName][ShowBuildingTypeName('galata')]和[ShowBuildingTypeName('venetian_quarter')][buildings|e]会被摧毁"
 flavor_byz.55.title: "[ShowLocationNameWithNoTooltip('florence')]大公会议"
 flavor_byz.55.entry: "成为，（颤抖），天主教徒"
 flavor_byz.55.desc: "随着我国国力衰退，周遭威胁剧增，[target_character.GetName]正在考虑一条纵观[ROOT.GetCountry.GetAdjective]历史都从未设想过的道路——若要让[ROOT.GetCountry.GetFlavorRank]继续存续下去，我们必须获得[target_character2.GetName]和整个[ShowReligionAdjective('catholic')]世界的支持。或许[target_character.GetNameWithNoTooltip]应当亲自前往西欧，与[target_character2.GetNameWithNoTooltip]展开谈判。"
 flavor_byz.55.a: "即便触怒牧首，也要与[target_country.GetNameWithNoTooltip]达成协议……"
 flavor_byz.55.a.entry: "即便触怒牧首，也要与他们达成协议……"
 flavor_byz.55.b: "非常过分的提议。"
 BYZ_ALL_ORTHODOX_BECOME_UNHAPPY: "治下所有[ShowReligionAdjective('orthodox')][pops|e]失去[ShowNamedValue('pop_satisfaction_ultimate_penalty')|+=2%][pop_satisfaction|e]。"
 flavor_byz.57.title: "重建[ShowRegionNameWithNoTooltip('anatolia_region')]城市"
 flavor_byz.57.entry: "恢复安纳托利亚区域的城市群"
 flavor_byz.57.desc: "自从塞尔柱人入侵[ShowRegionName('anatolia_region')]并导致我国多个省份沦陷以来，许多古老的[ShowCultureName('greek_culture')]城市已沦为野蛮人的基地。然而，随着我们重新征服该地区，也许我们可以在那里恢复[ROOT.GetCountry.GetAdjective]的秩序。"
 flavor_byz.57.a: "进行恢复。"
 flavor_byz.57.b: "那不过是过去的陈迹。需要尊重当地人。"
 BYZ_RESTORE_GREEK_POPS_IN_ANATOLIAN_CITIES: "[ShowRegionName('anatolia_region')]#G 10%#!居住于[ShowLocationRankName('city')]或[ShowLocationRankName('town')]的非[ShowCultureGroupName('greek_group')][pop|e]会改变为[ROOT.GetCulture.GetName]文化。"
 BYZ_ACCEPT_LOCAL_POPULATION: "[ShowRegionName('anatolia_region')]所有非[ShowCultureGroupName('greek_group')]文化组的[towns_and_cities|e][pop|e]会获得[ShowNamedValue('pop_satisfaction_extreme_bonus')|+=2%][pop_satisfaction|e]"
 flavor_byz.58.title: "[ShowCultureNameWithNoTooltip('albanian')]移民"
 flavor_byz.58.desc: "一个来自[source_location.GetName]的[ShowCultureName('albanian')]部落在面临部落冲突和糟糕的前景时，选择离开[source_location.GetProvince.GetName]，希望找到一个更美好的未来。我们对他们目前的行踪知之甚少，但有传言称他们打算在[destination_location.GetProvince.GetName]的[destination_location.GetName]定居。让我们看看他们是否找到了无比渴望的和平。"
 flavor_byz.58.a: "呸！他们的部落仇恨只会变得更糟。"
 flavor_byz.59.title: "$flavor_byz.58.title$"
 flavor_byz.59.entry: "$flavor_byz.59.title$"
 flavor_byz.59.desc: "一个来自[source_location.GetName]的[ShowCultureName('albanian')]部落抵达了[destination_location.GetName]，希望与当地总督会面，并在此建立自己的定居点。[destination_location.GetProvince.GetName]已予以批准，不过也许可以授予新来者更多特权，吸引更多人前来。"
 flavor_byz.59.a: "我们应当鼓励进一步的移民。"
 flavor_byz.59.b: "呸！我们不应该为这些琐事烦恼。"
 BYZ_do_not_get_informed_about_migrations: "[ShowCultureName('albanian')][culture|e][pops|e]将继续迁移至我们的土地，但我们将不再收到通知"
 BYZ_more_reasons_to_migrate_here: "如果我们授予[ShowEstatePrivilegeName('tribes_land_rights')][estate_privilege|e]，[ShowCultureName('albanian')][pops|e]将更有可能通过[event|e]迁移到我们的土地"
 flavor_byz.60.title: "共治皇帝？"
 flavor_byz.60.entry: "$flavor_byz.60.title$"
 flavor_byz.60.desc: "[target_character.GetName]一直是[target_character2.GetName]的长期支持者和合作伙伴。在[ROOT.GetCountry.GetGovernment.GetRulerTitle]与[target_character2.GetHerHis]的祖父[GetCharacter('byz_andronikos_ii_palaiologos').GetName]的斗争中，[target_character.GetShortNameWithNoTooltip]一开始就支持[target_character2.GetHerHis]，并将自己视为忠诚的伙伴和称职的政治家。\n\n在[target_character2.GetHerHis]一生中，曾多次授予[target_character.GetNameWithNoTooltip]共治皇帝之职，但每次都被拒绝。如今[target_character2.GetShortNameWithNoTooltip]已经离世，但[ROOT.GetCountry.GetGovernment.GetCourtTitle]许多人仍坚信[target_character.GetSheHe]会成为一名伟大的共治皇帝。"
 flavor_byz.60.a: "这是[target_character.GetHerHis]的意愿。"
 flavor_byz.60.a.entry: "这是他的意愿。"
 flavor_byz.60.b: "迫使[target_character.GetHerHim]同意。"
 flavor_byz.60.b.entry: "迫使他同意。"
 BYZ_additional_events_become_available: "当[target_character.GetName]成为共治皇帝后，会有更多[events|e]可以触发"
 flavor_byz.61.title: "叛国还是密谋"
 flavor_byz.61.entry: "$flavor_byz.61.title$"
 flavor_byz.61.desc: "[ROOT.GetCountry.GetGovernment.GetCourtTitle]中的权威人士[target_character2.GetName]开始怀疑[target_character.GetName]叛国。[target_character2.GetShortNameWithNoTooltip]与[target_character.GetHerHis]的对手结盟，希望看到[target_character.GetHerHim]被罢免，剥夺所有头衔，并被流放到[ShowBuildingTypeName('orthodox_monastery')]，这样[target_character.GetSheHe]就永远不会再影响[ROOT.GetCountry.GetAdjective]的政治了。尽管如此，许多廷臣仍然高度重视[target_character.GetNameWithNoTooltip]，不希望对[target_character.GetHerHim]造成任何伤害。"
 flavor_byz.61.a: "应当信任[target_character2.GetNameWithNoTooltip]。"
 flavor_byz.61.a.entry: "应当信任角色。"
 flavor_byz.61.b: "[target_character.GetNameWithNoTooltip]决不会背叛[ROOT.GetCountry.GetFlavorRank]！"
 flavor_byz.61.b.entry: "角色永远不会背叛国家！"
 flavor_byz.62.title: "法兰克领主的使节"
 flavor_byz.62.entry: "$flavor_byz.62.title$"
 flavor_byz.62.desc: "我们1337年对[GetCountry('EPI').GetName]的军事行动取得了巨大成功。[GetCharacter('epi_nikephoros_ii_orsini').GetName]很快被驱逐，当地人对国家的强大感到无比震撼——这一切都要归功于[target_character.GetName]和[GetCharacter('byz_andronikos_iii_palaiologos').GetName]的出色领导。[target_country.GetAdjective]部队对这场闪电战和我们的仁慈对待印象深刻，他们回到家中，传播了[ROOT.GetCountry.GetAdjective]对[GetCountry('EPI').GetAdjectiveWithNoTooltip]部队的待遇和[target_character.GetNameWithNoTooltip]的外交口吻的消息。"
 flavor_byz.62.a: "承诺提供支持。"
 flavor_byz.62.b: "我们无意迁就他们的利益。"
 BYZ_conquered_locations_in_morea_will_be_more_integrated: "在接下来的#W 30#!年内，在[ShowAreaName('morea_area')]的新征服[locations|e]将获得#G +30.0%#![integration|e]"
 flavor_byz.63.title: "[target_character.GetNameWithNoTooltip]之死"
 flavor_byz.63.entry: "尼基福罗斯·格里戈拉斯之死"
 flavor_byz.63.desc_neutral: "冰冷的死亡夺走了我们杰出的历史学家[target_character.GetName]。[target_character.GetShortNameWithNoTooltip]留下了忠诚服务[ROOT.GetCountry.GetLongName]的传承，以及一部重要[target_woa.GetDefinition.GetName]——[target_woa.GetName]。"
 flavor_byz.63.desc_nikephoros_is_hated: "$flavor_byz.63.desc_neutral$不过最令人遗憾的是，[target_character.GetNameWithNoTooltip]在[target_character.GetHerHis]生命的最后几年里传播了静修主义的异端思想。"
 flavor_byz.63.a: "没了[target_character.GetHerHim]，[ROOT.GetCountry.GetLongNameWithNoTooltip]再也不一样了。"
 flavor_byz.63.a.entry: "没了他，我们再也不一样了。"
 woa_was_created_here: "[THIS.GetWorkOfArt.GetDefinition.GetName][THIS.GetWorkOfArt.GetName]由[THIS.GetWorkOfArt.GetCreator.GetName]创作于[THIS.GetWorkOfArt.GetLocation.GetName]"
 flavor_byz.64.title: "伯罗奔尼撒军事行动"
 flavor_byz.64.entry: "$flavor_byz.64.title$"
 flavor_byz.64.desc: "我们值得信赖的将军、政治家和共同皇帝[target_character.GetName]正计划在[ShowAreaName('morea_area')]发动一场军事行动，以征服当地的法兰克公国。[ShowFormableCountryName('LAT_f')]的残余势力长期以来一直是我们的肉中之刺，无时无刻不在等待机会袭击我们。[target_character.GetShortNameWithNoTooltip]的军事行动无疑能缓解我们的压力，但也会加强[target_character.GetDynasty.GetName]家族的势力，他们长期在伯罗奔尼撒担任专制公。"
 flavor_byz.64.a: "准备战争！"
 flavor_byz.64.b: "这不过是傻瓜对荣耀的追求。"
 byz_additional_noble_power: "在接下来的#W 30#!年内，在[ShowAreaName('morea_area')]的新征服[locations|e]将获得[ShowModifier('BYZ_morea_nobles')][modifier|e]，从其被征服持续#W 30#!年"
 flavor_byz.65.title: "[target_character.GetNameWithNoTooltip]"
 flavor_byz.65.entry: "哲学家季米特里奥斯·屈佐尼斯"
 flavor_byz.65.desc: "我们的[ROOT.GetCountry.GetGovernment.GetRulerTitle]与一位真正出色的[target_character.GetWomanMan]成为了朋友。[target_character.GetName]是一名哲学学生，对一切充满好奇和开放的心态。[target_character2.GetName]和[target_character.GetShortNameWithNoTooltip]在许多事情上意见一致，[ROOT.GetCountry.GetGovernment.GetCourtTitle]中许多人看到了年轻的[target_character.GetShortNameWithNoTooltip]的潜力。[target_character.GetHeShe|U]可以作为[ROOT.GetCountry.GetLongName]政府的得力助手。"
 flavor_byz.65.a: "一定要让[target_character.GetSheHe|U]担任我们的#italic 首席大臣#!！"
 flavor_byz.65.a.entry: "一定要让他担任我们的#italic 首席大臣#!！"
 flavor_byz.65.b: "我们应该让[target_character.GetHerHim]把[ShowLanguageNameWithNoTooltip('latin_language')]著作翻译为[ROOT.GetCountry.GetCourtLanguage.GetNameWithNoTooltip]！"
 flavor_byz.65.b.entry: "我们应该让他把[ShowLanguageNameWithNoTooltip('latin_language')]著作翻译为我们的宫廷语言！"
 byz_target_character_is_free_to_promote: "晋升[target_character.GetName]为[head_of_the_cabinet|e]不会花费任何[legitimacy_i|e][legitimacy|e]"
 flavor_byz.66.title: "圣德米特里复活节庆典"
 flavor_byz.66.entry: "$flavor_byz.66.title$"
 flavor_byz.66.desc: "[target_location.GetName]的[ShowPopTypeName('burghers')]们正着手筹办今年纪念圣迪弥特里的市集庆典。这一历史悠久的年度盛会历来引得本国与外国民众纷至沓来，也是彰显[ROOT.GetCountry.GetAdjective]虔诚信仰的盛大场面。我们可支持这一传承已久的传统，让今年的庆典被铭记几个世纪。"
 flavor_byz.66.historical_info: "至14世纪，纪念塞萨洛尼基主保圣人圣德米特里的节日已发展为重要的宗教与文化盛事。该节日源于对圣人于公元306年左右在罗马狱中殉道的缅怀，也纪念他以神迹守护城市、抵御围攻的传说。庆典以圣德米特里教堂为中心，为期六日，既有庄严的圣歌咏唱与宗教巡游，也有城墙外热闹非凡的“德米特里亚”市集，吸引着整个地区的商人与朝圣者。时至今日，这一传统仍在延续：人们于10月26日举行瞻礼，复兴后的圣德米特里节依旧展现着这座城市信仰、传统与社群生活交融共生的恒久风貌。"
 flavor_byz.66.a: "郑重捐赠。"
 flavor_byz.66.b: "精神上支持。"
 flavor_byz.1000.title: "[cannon_maker.GetShortNameWithNoTooltip]大炮"
 flavor_byz.1000.entry: "乌尔班大炮"
 flavor_byz.1000.desc: "[cannon_maker.GetName]，一位[cannon_maker.GetCulture.GetName]铸铁匠和工程师，出现在宫廷中。[cannon_maker.GetSheHe|U]大胆宣称，如果我们为[cannon_maker.GetHerHim]提供金属和资金，[cannon_maker.GetSheHe]可以为我们建造一门前所未见的大炮。然而，地位显赫的[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')]警告我们不要这样做，他们声称兑现[cannon_maker.GetSheHe]薪资会激怒行会。"
 flavor_byz.1000.a: "[cannon_maker.GetSheHe|U]需要什么就给什么。"
 flavor_byz.1000.a.entry: "他需要什么就给什么。"
 flavor_byz.1000.b: "无礼！"
 orban_goes_elsewhere.tt: "[cannon_maker.GetNameWithNoTooltip]可能会转而投奔你的敌人……"
 flavor_byz.1000.historical_info: "乌尔班因制造了摧毁君士坦丁堡城墙的大炮而闻名于世。他首先向东罗马皇帝君士坦丁十一世提供服务，但被拒绝了——于是他转而投靠了土耳其人……"
 great_bombard: "建造巨炮"
 flavor_byz.1001.title: "“巴比伦之灾厄”"
 flavor_byz.1001.entry: "$flavor_byz.1001.title$"
 flavor_byz.1001.desc: "[cannon_maker.GetName]，一位[cannon_maker.GetCulture.GetName]铸铁匠和工程师，正在寻找工作。[cannon_maker.GetSheHe|U]确实要求高昂的薪水，并且已经被[GetCountry('BYZ').GetName]的战时[GetCountry('BYZ').GetGovernment.GetRuler.GetNameWithNoTooltip]拒绝——然而[cannon_maker.GetNameWithNoTooltip]承诺为我们建造一门可以摧毁巴比伦城墙的大炮。"
 flavor_byz.1001.a: "我们肯定用得上它。"
 flavor_byz.1001.b: "我们还是擢用自己的枪炮工匠吧。"
 flavor_byz.1001.historical_info: "$flavor_byz.1000.historical_info$"
 flavor_byz.1100.title: "静修"
 flavor_byz.1100.entry: "$flavor_byz.1100.title$"
 flavor_byz.1100.desc: "神学问题一直牵动着我们人民的注意力。作为[ShowReligionAdjective('orthodox')]信仰的守护者和骄傲，我们在探寻神圣奥秘的过程中始终是真道义的捍卫者。\n\n现在我们得知，[target_character_1.GetName]在[target_location.GetName]修士的宗教实践中发现了令人不安的不当之处。据称，在[target_character_2.GetName]的灵性指导下，他们的虔诚敬拜集中于关于上帝本质与能量的诸多大胆问题，并鼓励内心静默和不断祈祷的实践。\n\n作为回应，[target_character_1.GetShortNameWithNoTooltip]已将他的反对意见付诸文字，谴责这些静修主义的教义为危险的创新，并警告此类学说可能在信徒中造成混乱，扰乱我们[ROOT.GetCountry.GetFlavorRank]脆弱的和平。我们的顾问告诫说，无论是神秘主义者还是批评者，处理不当的热忱都可能激起动荡，如果此事不能审慎解决，甚至可能引发公开叛乱。"
 flavor_byz.1100.a: "支持该运动。"
 flavor_byz.1100.b: "[target_character_1.GetShortNameWithNoTooltip]说得对，静修主义就是异端！"
 flavor_byz.1100.b.entry: "角色是对的，静修是异端！"
 flavor_byz.1100.c: "无视酝酿中的混乱。"
 byz_may_trigger_other_event_tt: "这些争论的影响很快会越过我国的边界"
 worsen_relations_with_all_orthodox_tt: "我们与所有[ShowReligionAdjectiveWithNoTooltip('orthodox')]国家的关系会极大受损"
 angry_barlaamite_clergy_tt: "由于他们支持[target_character_1.GetName]，[ROOT.GetCountry.GetFlavorRank]内大约[ROOT.GetVariable('num_barlaamite_pops_variable').GetValue|V0][ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')][pops|e]会失去[ShowNamedValue('pop_satisfaction_extreme_penalty')|+=2%][pop_satisfaction|e]"
 angry_palamite_clergy_tt: "由于他们支持[target_character_2.GetName]，[ROOT.GetCountry.GetFlavorRank]内大约[ROOT.GetVariable('num_clergy_palamite_pops_variable').GetValue|V0][ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')][pops|e]会失去[ShowNamedValue('pop_satisfaction_extreme_penalty')|+=2%][pop_satisfaction|e]"
 negatively_affect_succ_crisis_tt: "我们在此事上的犹豫不决将在[ShowDisasterName('byzantine_succession_crisis')][disaster|e]的初始[event|e]中产生负面影响"
 pay_for_your_indecisiveness_tt: "由于我们在$flavor_byz.1100.title$[event|e]中的犹豫和冷淡立场，[stability|e]损失大幅提高"
 flavor_byz.1101.title: "[target_character.GetNameWithNoTooltip]抵达[target_location.GetNameWithNoTooltip]"
 flavor_byz.1101.entry: "一位巴拉姆派学者抵达宫廷"
 flavor_byz.1101.desc: "神学性质的学术辩论往往会导致激烈的结果和迫害。似乎[target_character.GetName]对于#italic 静修#!的反驳也不例外，这导致了这位学者与[target_character3.GetName]之间的裂痕，最终导致后者被放逐并在我们的宫廷中寻求庇护。"
 flavor_byz.1101.a: "[target_country.GetLongName]发生了什么？"
 flavor_byz.1102.title: "名传后世的辩论"
 flavor_byz.1102.entry: "$flavor_byz.1102.title$"
 flavor_byz.1102.desc: "“这场灾祸是[ShowReligionAdjective('orthodox')]信仰终结的开始吗？”随着[target_character2.GetName]与[target_character.GetName]之间的争端加深，这样的焦虑低语如今在回廊中回响。\n\n前者是静修实践的热心支持者，而后者则竭尽全力地诋毁和否定。指控已让位于公开谴责，对理性的诉求换来了神圣权威的援引。起初的神学分歧如今有可能使[target_location.GetName]的信徒分裂为敌对的阵营。\n\n除非此事被迅速而明智地解决，否则愤怒可能会超出言辞的边界，引发骚乱，甚至可能演变成叛乱。"
 flavor_byz.1102.a: "我们对静修主义的支持坚定不移！"
 flavor_byz.1102.b: "[target_character.GetNameWithNoTooltip]会喜欢[target_character.GetHerHis]在[target_country.GetNameWithNoTooltip]的新家。"
 flavor_byz.1102.b.entry: "角色会喜欢他在他国的新家。"
 variable_hesychasm_activated_variable_tt: "静修教义已被接纳"
 church_condemns_ongoing_debates_tt: "[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]中的重要人士谴责我们为静修辩解的立场"
 flavor_byz_title_key: "和平之手"
 flavor_byz.1200.title: "$flavor_byz_title_key$"
 flavor_byz.1200.entry: "$flavor_byz.1200.title$"
 flavor_byz.1200.desc: "[GetCountry('TUR').GetName]的敌对倾向已被证明难以应对，并且分散了我们稳定[ROOT.GetCountry.GetFlavorRank]的真正目标。幸运的是，我们那吵闹且好斗的邻国的统治者[orhan_scope.GetName]对我们统治者的可爱女儿[theodora_scope.GetName]表现出了兴趣。\n\n我们可以将[theodora_scope.GetShortNameWithNoTooltip]许配给[orhan_scope.GetShortNameWithNoTooltip]，以确保建立一个持久的联盟，结束他们的侵略行为。"
 flavor_byz.1200.historical_info: "在1341年至1347年的拜占庭内战中，皇帝约翰六世·坎塔库泽诺斯将他的女儿狄奥多拉·坎塔库泽诺斯嫁给了土耳其贝伊奥尔汗·加齐，以巩固两国之间的联盟，并确保奥斯曼人不会改变立场，转而支持约翰的对手——摄政皇后萨伏依的安娜。"
 flavor_byz.1200.a: "发出讯息。"
 flavor_byz.1200.b: "我们不会以[theodora_scope.GetShortNameWithNoTooltip]换取和平。"
 flavor_byz.1200.b.entry: "我们不会以她换取和平。"
 flavor_byz.1201.title: "$flavor_byz_title_key$"
 flavor_byz.1201.desc: "[GetCountry('BYZ').GetName]的软弱统治者愿意让他美丽的女儿[theodora_scope.GetName]充入我们勇敢的统治者[orhan_scope.GetName]的后宫，以换取政治联盟。\n\n我们该如何处理这个提议？"
 flavor_byz.1201.historical_info: "$flavor_byz.1200.historical_info$"
 flavor_byz.1201.a: "接受新娘。"
 flavor_byz.1201.b: "拒绝。"
 flavor_byz.1202.title: "$flavor_byz_title_key$"
 flavor_byz.1202.desc: "[orhan_scope.GetName]接受了我们的提议，[theodora_scope.GetName]将嫁给他，确保两国间的和平。"
 flavor_byz.1202.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 flavor_byz.1203.title: "$flavor_byz_title_key$"
 flavor_byz.1203.entry: "$flavor_byz.1203.title$"
 flavor_byz.1203.desc: "[orhan_scope.GetName]拒绝了我们的提议，他肯定在备战，进一步升级两国间的敌对状态。"
 flavor_byz.1203.a: "[ROOT.GetCountry.Custom('common_string_negative')]"
 flavor_byz.1300_title_key: "重建[target_location.GetNameWithNoTooltip]"
 flavor_byz_1300_historical_info_shared: "拜占庭对君士坦丁堡的政策一直是开放城门以填充城市的街道。黑死病袭击君士坦丁堡后，城市遭受了巨大的损失，许多住宅空置。列位皇帝努力恢复城市，但这些努力还不够，因为城市人口在1453年沦陷前不断减少。"
 flavor_byz.1300.a: "我们必须不惜代价重建城市。"
 flavor_byz.1300.title: "$flavor_byz.1300_title_key$"
 flavor_byz.1300.entry: "重建君士坦丁堡"
 flavor_byz.1300.desc: "[ShowSituationName('black_death')]已经摧毁了我们的大部分土地，其中[target_location.GetName]受灾最严重。与以前相比，大多数房屋无人居住，几乎没有人在城市街道上行走。与以前不同的是，我们的乡村已经变得荒芜，大多数[target_country.GetAdjective]省份没有足够的人口来耕种田地。也许我们可以尝试邀请一些来自[ShowRegionName('italy_region')]的商人来帮助我们解决这个问题……"
 flavor_byz.1300.historical_info: "$flavor_byz_1300_historical_info_shared$"
 flavor_byz.1300.b: "不可相信那些商人。"
 allowed_italian_merchants_desc: "来自[events|e]"
 flavor_byz.1301.title: "$flavor_byz.1300_title_key$"
 flavor_byz.1301.desc: "[target_character.GetName]向我国的商人提供[target_location.GetName]的土地，希望能再度充实该城市街道的人口。"
 flavor_byz.1301.a: "我们接受这个提议。"
 flavor_byz.1301.historical_info: "$flavor_byz_1300_historical_info_shared$"
 flavor_byz.1301.b: "他们要留在[ROOT.GetCountry.GetCapital.GetNameWithNoTooltip]。"
 flavor_byz.1302.title: "$flavor_byz.1300.title$"
 flavor_byz.1302.desc: "[target_country2.GetLongName]答复了我们的要求。他们允许来自[target_location2.GetName]的[ShowPopTypeName('burghers')]在[target_location.GetName]定居。"
 flavor_byz.1302.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 flavor_byz.1303.title: "$flavor_byz.1300_title_key$"
 flavor_byz.1303.entry: "重建君士坦丁堡"
 flavor_byz.1303.desc: "[target_country2.GetName]拒绝了我们的要求。他们认为向外派出[ShowPopTypeName('burghers')]对他们没好处。"
 flavor_byz.1303.a: "[ROOT.GetCountry.Custom('common_string_negative')]"
 flavor_byz.1400_title_key: "重建瓦兰吉卫队"
 flavor_byz.1400.title: "$flavor_byz.1400_title_key$"
 flavor_byz.1400.entry: "$flavor_byz.1400.title$"
 flavor_byz.1400.desc: "历史上，来自[ShowRegionName('scandinavian_region')]的勇士曾扬帆南下，穿越[ShowRegionName('russian_region')]的河流，最终抵达[ShowAreaName('black_sea_area')]。这些人被称为“瓦兰吉人”，他们曾以无比的忠诚为[ROOT.GetCountry.GetName]的历代皇帝效力。或许我们可以通过邀请[varangian_character.GetName]和一群来自[target_country.GetName]的勇士，让他们担任[target_character.GetName]的贴身护卫，来重建这支[ShowUnitDefinitionName('a_varangians')]。"
 flavor_byz.1400.a: "让我们尝试重建一支新瓦兰吉卫队吧。"
 flavor_byz.1400.b: "我们不需要[varangian_character.GetNameWithNoTooltip]。"
 flavor_byz.1400.b.entry: "我们不需要新队长。"
 BYZ_IF_THEY_ACCEPT: "我们将请求[target_country.GetName]提供[pops|e]供我们使用。如果他们同意，将发生："
 BYZ_VARANGIAN_GUARD_RESTORED_TT: "#G +1#![ShowModifierTypeName('num_of_varangian_units')]。"
 flavor_byz.1401.title: "$flavor_byz.1400_title_key$"
 flavor_byz.1401.desc: "[target_country2.GetName]请求我们将[varangian_character.GetName]和这位将领手下的兵马派遣到他们的[target_country.GetGovernment.GetCourtTitle]。为此，他们愿意支付相应的金钱。"
 flavor_byz.1401.a: "真是个好提议啊，我们接受。"
 flavor_byz.1401.b: "[varangian_character.GetNameWithNoTooltip]是属于[ROOT.GetCountry.GetCapital.GetNameWithNoTooltip]的。"
 flavor_byz.1402.title: "$flavor_byz.1400_title_key$"
 flavor_byz.1402.entry: "$flavor_byz.1402.title$"
 flavor_byz.1402.desc: "[target_country.GetName]接受了我们的提议，[varangian_character.GetName]和麾下的人马已经扬帆南下。"
 flavor_byz.1402.a: "由此，瓦兰吉卫队将重振旗鼓。"
 flavor_byz.1403.title: "$flavor_byz.1400_title_key$"
 flavor_byz.1403.entry: "$flavor_byz.1403.title$"
 flavor_byz.1403.desc: "[target_country.GetName]拒绝了我们的提议。[varangian_character.GetName]和麾下的人马将留在[target_location2.GetName]。"
 flavor_byz.1403.a: "[ROOT.GetCountry.Custom('common_string_negative')]"
