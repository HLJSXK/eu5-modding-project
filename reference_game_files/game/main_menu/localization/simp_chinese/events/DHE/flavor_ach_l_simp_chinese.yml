l_simp_chinese:
 flavor_ach.1.title: "[target_country.GetAdjectiveWithNoTooltip][target_country.GetGovernment.GetRulerTitle]逃离"
 flavor_ach.1.entry: "伊庇鲁斯继承人出逃"
 flavor_ach.1.desc: "在[target_country2.GetAdjective]入侵[target_country.GetName]后，[target_character.GetFather.GetName]的合法继承人[target_character.GetShortName]被[GetCharacter('byz_andronikos_iii_palaiologos').GetName]罢黜，并被现任[target_country2.GetAdjectiveWithNoTooltip]总督[GetCharacter('epi_theodoros_synadenos').GetName]取代。还好，[target_character.GetShortNameWithNoTooltip]被国内的反[target_country2.GetAdjectiveWithNoTooltip]派系偷运出境，带到了[target_character2.GetName]面前。"
 flavor_ach.1.a: "[target_country.GetAdjectiveWithNoTooltip]属于[target_character.GetNameWithNoTooltip]！"
 flavor_ach.1.a.entry: "这片领地理当归他所有！"
 flavor_ach.1.b: "[target_country.GetNameWithNoTooltip]注定失败。"
 flavor_ach.1.b.entry: "他们已是穷途末路。"
 flavor_ach.2.title: "[target_country.GetAdjectiveWithNoTooltip]觊觎者得到支持"
 flavor_ach.2.desc: "[target_country.GetName]的最后一位拉丁君主，年轻的[target_character.GetName]，已被偷运出境来到[target_country3.GetName]，那里的[target_country3.GetGovernment.GetRulerTitle]已被拉拢加入[target_character.GetHerHis]的事业。毫无疑问，[target_country3.GetLongName]将推动其复辟。\n\n我们必须小心任何入侵，因为[target_character2.GetName]可能会在我们虚弱时发动攻击。"
 flavor_ach.2.a: "让他们放马过来！"
 flavor_ach.3.title: "拉丁影响衰弱"
 flavor_ach.3.desc: "虽然名义上处于拉丁人[target_character.GetDynasty.GetName]家族的统治之下，但该家族的影响力多年来持续衰弱。[ROOT.GetCountry.GetCulture.GetName][ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]常常对[ShowCultureName('greek_culture')]平民的困境视而不见。因此，各行各业的普通民众都转而支持[target_character2.GetName]，一位能将[ROOT.GetCountry.GetName]从法兰克枷锁下解放的希腊觊觎者。"
 flavor_ach.3.a: "打倒[target_character.GetDynasty.GetNameWithNoTooltip]！"
 flavor_ach.3.a.entry: "推翻这个王朝！"
 flavor_ach.3.b: "镇压这场运动！"
 flavor_ach.4.title: "拉丁女皇"
 flavor_ach.4.entry: "$flavor_ach.4.title$"
 flavor_ach.4.desc: "尽管[ShowFormableCountryName('LAT_f')]已于1261年灭亡，但数任名义皇帝的传承将其法统一直延续到如今的女皇[target_character.GetName]身上。虽然仅存虚名，但[target_character.GetDynasty.GetName]家族仍然在拉丁诸国备受尊重，并且仍然统治着[ROOT.GetCountry.GetLongName]——帝国最强大的残余之一。"
 flavor_ach.4.a: "[ShowFormableCountryNameWithNoTooltip('LAT_f')]将会光复！"
 flavor_ach.5.title: "[GetCountry('LAT').GetFlavorRank]的虚衔君主"
 flavor_ach.5.entry: "虚衔帝国"
 flavor_ach.5.desc: "[scope_ruler.GetName]虽仅领有[GetCountry('LAT').GetLongName]的“[GetCountry('LAT').GetAdjectiveWithNoTooltip][GetCountry('LAT').GetGovernment.GetRulerTitle]”的虚衔，却在[ShowScriptedGeographyName('greece_geography')]地区的残存[GetCountry('LAT').GetAdjectiveWithNoTooltip]精英群体中保有相当影响力。同时，[scope_ruler.GetHisHer]与[naples_country.GetName]有着深厚人脉联结，[scope_philip_latin_emperor.GetName]曾多方谋划运作，意图集结足以光复帝国的军力，然其离世后，这些计划尽数搁置。\n\n我方已与[scope_alb_king.GetName]达成协议，将[albania_country.GetName]的领主权售予[scope_alb_king.GetShortNameWithNoTooltip]，同时将[ROOT.GetCountry.GetName]的领地册封给[ach_heir.GetName]，而[scope_ruler.GetShortNameWithNoTooltip]仍以官方身份继续统治这片土地。\n\n眼下[ShowCultureName('catalan')]佣兵团盘踞[ath_country.GetName]，又有传闻称[byz_country.GetName][byz_country.GetGovernment.GetCourtTitle]内部动荡不安，[scope_ruler.GetNameWithNoTooltip]的近臣进言称，如[scope_philip_latin_emperor.GetShortNameWithNoTooltip]所设想的那般复辟[GetCountry('LAT').GetLongNameWithNoTooltip]的时机，或许即将到来。"
 flavor_ach.5.a: "我们应专注于拉拢地方精英。"
 flavor_ach.5.b: "在整个[ShowScriptedGeographyNameWithNoTooltip('greece_geography')]争取外交支持。"
 flavor_ach.5.c: "我国[ROOT.GetCountry.GetGovernment.GetCourtTitle]应着手为复辟大业奠定基础。"
 flavor_ach.5.c.entry: "宫廷应着手为复辟大业奠定基础。"
 flavor_ach.6.title: "与[naples_country.GetNameWithNoTooltip][naples_country.GetGovernment.GetCourtTitle]的联系"
 flavor_ach.6.entry: "与那不勒斯宫廷的联系"
 flavor_ach.6.desc: "[scope_ruler.GetName]虽已承担起治理[ROOT.GetCountry.GetName]的职责，[scope_ruler.GetHeShe]却仍在[naples_country.GetNameWithNoTooltip]的[naples_country.GetGovernment.GetCourtTitle]内保有相当影响力，同时与[nap_ruler.GetName]关系密切。为进一步巩固[scope_ruler.GetDynasty.GetName]王朝在[ShowScriptedGeographyName('greece_geography')]的统治，部分顾问进言，建议[scope_ruler.GetShortNameWithNoTooltip]借助自身影响力，在富裕的[naples_country.GetAdjectiveWithNoTooltip]精英阶层中争取支持。"
 flavor_ach.6.a: "[scope_ruler.GetShortNameWithNoTooltip]应向[naples_country.GetAdjectiveWithNoTooltip][naples_country.GetGovernment.GetCourtTitle]示好。"
 flavor_ach.6.a.entry: "统治者应向$NAP_ADJ$宫廷示好。"
 flavor_ach.6.b: "借助[scope_ruler.GetShortNameWithNoTooltip]的影响力争取资金支持。"
 flavor_ach.6.b.entry: "借助他的影响力争取资金支持。"
 flavor_ach.6.c: "[scope_ruler.GetShortNameWithNoTooltip]的声望更应用于巩固[ROOT.GetCountry.GetAdjectiveWithNoTooltip][ROOT.GetCountry.GetGovernment.GetCourtTitle]的权威。"
 flavor_ach.6.c.entry: "他的声望更应用于巩固我国宫廷的权威。"
 flavor_ach.7.title: "[nikephoros_ii_orsini.GetNameWithNoTooltip]与[epirus_country.GetLongNameWithNoTooltip]"
 flavor_ach.7.entry: "伊庇鲁斯的分离叛乱"
 flavor_ach.7.desc: "[nikephoros_ii_orsini.GetName]流亡后，已在[ROOT.GetCountry.GetName]的[ROOT.GetCountry.GetGovernment.GetCourtTitle]居留多时，对[scope_ruler.GetName]而言，他是对抗[byz_country.GetAdjective]精英的宝贵政治筹码。然[ROOT.GetCountry.GetGovernment.GetCourtTitle]近日收到消息，复辟[nikephoros_ii_orsini.GetLastNameWithNoTooltip]家族统治的时机已然到来：数位[epirus_country.GetAdjective][epirus_country.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]已集结足够支持，即将发动起义反抗[byz_country.GetAdjectiveWithNoTooltip]总督。\n\n[ROOT.GetCountry.GetGovernment.GetCourtTitle]内众多顾问视此为在[byz_country.GetNameWithNoTooltip]内部制造更深分裂的良机，力劝[scope_ruler.GetNameWithNoTooltip]抓住机会，准许[nikephoros_ii_orsini.GetLastNameWithNoTooltip]返回[epirus_country.GetNameWithNoTooltip]。"
 flavor_ach.7.a: "准许[nikephoros_ii_orsini.GetLastNameWithNoTooltip]在我方支持下返回[epirus_country.GetNameWithNoTooltip]。"
 flavor_ach.7.a.entry: "准许$Orsini$在我方支持下返回$EPI$。"
 flavor_ach.7.b: "主动为[nikephoros_ii_orsini.GetShortNameWithNoTooltip]主张[epirus_country.GetNameWithNoTooltip]的宣称权。"
 flavor_ach.7.b.entry: "主动为$name_nikephoros.greek_language$主张$EPI$的宣称权。"
 flavor_ach.7.c: "眼下此举风险过高。"
 nikephoros_ii_orsini_revolt: "奥尔西尼叛乱"
 flavor_ach.8.title: "[nikephoros_ii_orsini.GetNameWithNoTooltip]光复[epirus_country.GetNameWithNoTooltip]！"
 flavor_ach.8.entry: "$name_nikephoros.greek_language$ $Orsini$ Reclaims $EPI$!"
 flavor_ach.8.desc: "[ROOT.GetCountry.GetAdjective][ROOT.GetCountry.GetGovernment.GetCourtTitle]收到消息，[nikephoros_ii_orsini.GetLastNameWithNoTooltip]的支持者已成功光复他在[epirus_country.GetName]的领地，并借机使[epirus_country.GetNameWithNoTooltip]脱离[byz_country.GetName]！尽管这无疑是[scope_ruler.GetName]削弱[byz_country.GetAdjectiveWithNoTooltip][byz_country.GetGovernment.GetCourtTitle]的重大胜利，但[ROOT.GetCountry.GetGovernment.GetCourtTitle]内部分人士已力劝[scope_ruler.GetShortNameWithNoTooltip]，趁[nikephoros_ii_orsini.GetShortNameWithNoTooltip]巩固权力根基之前，夺取[epirus_country.GetNameWithNoTooltip]。"
 flavor_ach.8.a: "我们应该与[epirus_country.GetNameWithNoTooltip]缔结正式同盟。"
 flavor_ach.8.a.entry: "我们应该与$EPI$缔结正式同盟。"
 flavor_ach.8.b: "仅与[nikephoros_ii_orsini.GetLastNameWithNoTooltip]保持密切往来即可。"
 flavor_ach.8.b.entry: "仅与$Orsini$保持密切往来即可。"
 flavor_ach.8.c: "进攻的时机到了！"
 flavor_ach.9.title: "[epirus_country.GetNameWithNoTooltip]叛乱"
 flavor_ach.9.desc: "噩耗传来！[epirus_country.GetAdjective][epirus_country.GetGovernment.GetEstateName('nobles_estate')]在[ach_scope_ruler.GetName]的支持下发动叛乱，意图为[nikephoros_ii_orsini.GetName]夺取[epirus_country.GetName]。[epi_scope_ruler.GetName]已请求[ROOT.GetCountry.GetName]立即介入平叛。"
 flavor_ach.9.a: "协助[epirus_country.GetAdjectiveWithNoTooltip]总督！"
 flavor_ach.9.a.entry: "协助$EPI_ADJ$总督！"
 flavor_ach.9.b: "此事与我们无关。"
 flavor_ach_9_tt: "如果[nikephoros_ii_orsini.GetName]获胜，[epirus_country.GetName]将获得独立"
 flavor_ach.10.title: "伯罗奔尼撒再征服"
 flavor_ach.10.entry: "$flavor_ach.10.title$"
 flavor_ach.10.desc: "1204年第四次十字军东征胜利后，[ShowAreaName('morea_area')]成为[byz_country.GetName]崩溃后被十字军征服的众多地区之一。然而近几十年来，[byz_country.GetAdjectiveWithNoTooltip]精英阶层已收复该地区部分领土，不过大部分区域仍处于[ROOT.GetCountry.GetAdjective]的掌控之下。\n\n有传闻称[byz_country.GetAdjectiveWithNoTooltip][byz_country.GetGovernment.GetCourtTitle]正陷入动荡，[ROOT.GetCountry.GetGovernment.GetCourtTitle]内多位顾问认为，当下正是发动战役、光复失地、将[byz_country.GetAdjectiveWithNoTooltip]势力彻底逐出[ShowAreaNameWithNoTooltip('morea_area')]的绝佳时机。"
 flavor_ach.10.a: "击退[byz_country.GetLongNameWithNoTooltip]的时机已到！"
 flavor_ach.10.a.entry: "击退$BYZ$的时机已到！"
 flavor_ach.10.b: "静观其变，看看[byz_country.GetAdjectiveWithNoTooltip]动荡的传闻是否属实。"
 flavor_ach.10.b.entry: "静观其变，看看$BYZ_ADJ$动荡的传闻是否属实。"
 flavor_ach.11.title: "[byz_country.GetNameWithNoTooltip]境内骚乱的良机"
 flavor_ach.11.entry: "拜占庭境内骚乱的良机"
 flavor_ach.11.desc: "尽管[ROOT.GetCountry.GetAdjective]安插在[byz_country.GetName][byz_country.GetGovernment.GetCourtTitle]的间谍早已传回政治动荡的传闻，但近期报告显示，[byz_country.GetAdjectiveWithNoTooltip][byz_country.GetGovernment.GetEstateName('nobles_estate')]对执政的[byz_ruler.GetDynasty.GetName]家族已忍无可忍，正密谋发动政变。\n\n众人视此为[byz_country.GetNameWithNoTooltip]潜在内战的前兆，部分人士已力劝[scope_ruler.GetName]做好准备，借机从中渔利。"
 flavor_ach.11.a: "碾碎这只火凤凰的时机已到！"
 flavor_ach.11.b: "我们应避免卷入[byz_country.GetAdjectiveWithNoTooltip]的内部事务。"
 flavor_ach.11.b.entry: "我们应避免卷入$BYZ_ADJ$的内部事务。"
 flavor_ach.12.title: "安抚[ShowCultureNameWithNoTooltip('greek_culture')]精英阶层"
 flavor_ach.12.entry: "安抚亚该亚精英阶层"
 flavor_ach.12.desc: "尽管[GetCountry('LAT').GetAdjective]在[ShowScriptedGeographyName('greece_geography')]的统治，已导致昔日[ShowCultureName('greek_culture')]精英阶层日渐衰落，但在[ROOT.GetCountry.GetName]的部分地区，历史悠久的[ShowCultureNameWithNoTooltip('greek_culture')]家族成员通过与[ROOT.GetCountry.GetCulture.GetName][ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]妥协，仍牢牢掌控着权力。然而自[GetCountry('LAT').GetLongNameWithNoTooltip]覆灭以来，[ShowCultureNameWithNoTooltip('greek_culture')]民众对[ROOT.GetCountry.GetCulture.GetNameWithNoTooltip]的统治愈发抵触。\n\n为谋求更稳固的统治，[scope_ruler.GetNameWithNoTooltip]已邀请[ROOT.GetCountry.GetNameWithNoTooltip]境内残存的[ShowCultureNameWithNoTooltip('greek_culture')]家族成员前往[ROOT.GetCountry.GetGovernment.GetCourtTitle]，商议妥协方案。但部分[ROOT.GetCountry.GetCulture.GetNameWithNoTooltip][ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]反而要求进一步扩大他们对[ShowCultureNameWithNoTooltip('greek_culture')]民众的支配权，声称更强势的[ROOT.GetCountry.GetCulture.GetNameWithNoTooltip]精英阶层才能镇压[ShowCultureNameWithNoTooltip('greek_culture')]的动乱。"
 flavor_ach.12.a: "维持现状。"
 flavor_ach.12.b: "站在[ROOT.GetCountry.GetCulture.GetNameWithNoTooltip][ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]一边。"
 flavor_ach.12.b.entry: "站在拉丁$nobles_estate$一边。"
 flavor_ach.12.c: "尽力与[ShowCultureNameWithNoTooltip('greek_culture')]家族达成妥协。"
 flavor_ach.13.title: "[athens_country.GetNameWithNoTooltip]的威胁"
 flavor_ach.13.entry: "加泰罗尼亚人对雅典的统治"
 flavor_ach.13.desc: "尽管[ShowScriptedGeographyName('greece_geography')]的诸多[GetCountry('LAT').GetAdjective]领主都表示支持[scope_ruler.GetName]及其对[GetCountry('LAT').GetLongNameWithNoTooltip]的宣称权，但近年来[athens_country.GetLongName]在[ShowCultureName('catalan')]佣兵团的支持下，敌意愈发强烈。不过，数位心怀不满的[athens_country.GetAdjectiveWithNoTooltip][athens_country.GetGovernment.GetEstateName('nobles_estate')]已主动联系[ROOT.GetCountry.GetAdjective][ROOT.GetCountry.GetGovernment.GetCourtTitle]，希望获得[scope_ruler.GetHisHer]的支持以将[ShowCultureNameWithNoTooltip('catalan')]佣兵团逐出[athens_country.GetNameWithNoTooltip]，并愿为此向[ROOT.GetCountry.GetNameWithNoTooltip]宣誓效忠。"
 flavor_ach.13.a: "我们应转而与[athens_country.GetNameWithNoTooltip]境内的[ShowCultureNameWithNoTooltip('catalan')][athens_country.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]交好。"
 flavor_ach.13.a.entry: "我们应转而与$ATH$境内的[ShowCultureNameWithNoTooltip('catalan')]$nobles_estate$交好。"
 flavor_ach.13.b: "我们应应允他们的请求，将[ShowCultureNameWithNoTooltip('catalan')]佣兵团逐出[athens_country.GetNameWithNoTooltip]。"
 flavor_ach.13.b.entry: "我们应应允他们的请求，将[ShowCultureNameWithNoTooltip('catalan')]佣兵团逐出$ATH$。"
 flavor_ach.13.c: "借此机会直接征服这片[athens_country.GetFlavorRank]。"
 flavor_ach.13.c.entry: "借此机会直接征服这片领地。"
 ach_vassalize_athens_for_reward: "如果我们成功征服[athens_country.GetName]，可扶持一位对[ROOT.GetCountry.GetName]友好的新统治者"
 flavor_ach.14.title: "[ShowCultureNameWithNoTooltip('catalan')]佣兵团被逐出[athens_country.GetNameWithNoTooltip]"
 flavor_ach.14.entry: "法兰克人恢复对雅典的统治"
 flavor_ach.14.desc: "成功击败[ShowCultureName('catalan')]佣兵团并将其逐出[athens_country.GetName]后，众多[athens_country.GetAdjectiveWithNoTooltip]精英已向[scope_ruler.GetName]宣誓彻底效忠。随着[athens_country.GetFlavorRank]前统治者流亡海外，[ROOT.GetCountry.GetGovernment.GetCourtTitle]内众多人士提议，扶持[ShowCultureNameWithNoTooltip('french')]家族统治[athens_country.GetNameWithNoTooltip]，但也有部分人士建议，我们应借此机会与[ShowCultureNameWithNoTooltip('greek_culture')]民众建立联系，提拔当地[athens_country.GetGovernment.GetEstateName('nobles_estate')]成员代为执政。"
 flavor_ach.14.a: "扶持一名[ShowCultureNameWithNoTooltip('french')][ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]出任新任[athens_country.GetGovernment.GetRulerTitle]。"
 flavor_ach.14.a.entry: "扶持一名[ShowCultureNameWithNoTooltip('french')]$nobles_estate$出任新统治者。"
 flavor_ach.14.b: "任命[ShowCultureNameWithNoTooltip('french')][ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]，但勒令保障[athens_country.GetNameWithNoTooltip]境内[ShowCultureNameWithNoTooltip('greek_culture')]民众的特权。"
 flavor_ach.14.b.entry: "任命[ShowCultureNameWithNoTooltip('french')]$nobles_estate$，但勒令保障$ATH$境内[ShowCultureNameWithNoTooltip('greek_culture')]民众的特权。"
 flavor_ach.14.c: "任命某位[ShowCultureNameWithNoTooltip('greek_culture')][ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]执掌[athens_country.GetNameWithNoTooltip]政权。"
 flavor_ach.14.c.entry: "任命某位[ShowCultureNameWithNoTooltip('greek_culture')]$nobles_estate$执掌$ATH$政权。"
 flavor_ach.15.title: "[scope_ruler.GetNameWithNoTooltip]的登基"
 flavor_ach.15.entry: "拉丁帝国头衔继承"
 flavor_ach.15.desc: "随着[latin_empress_catherine_valois.GetName]离世，[scope_ruler.GetName]继承了[GetCountry('LAT').GetLongNameWithNoTooltip]的虚衔宣称权，并已在[ROOT.GetCountry.GetCapital.GetName]安排仪式纪念这一时刻。尽管[latin_empress_catherine_valois.GetShortNameWithNoTooltip]与[scope_philip_latin_emperor.GetName]已采取重大举措强化这一头衔的正统性，但[ShowScriptedGeographyName('greece_geography')]各地的众多[GetCountry('LAT').GetAdjectiveWithNoTooltip]政权领主仍拒绝承认[scope_ruler.GetDynasty.GetName]家族对[GetCountry('LAT').GetLongNameWithNoTooltip]的宣称权。\n\n[ROOT.GetCountry.GetGovernment.GetCourtTitle]内部分人士力劝[scope_ruler.GetNameWithNoTooltip]延续父母的遗志，请求[scope_ruler.GetHeShe]借此次仪式再度发力，推动帝国复辟大业。"
 flavor_ach.15.a: "让加冕仪式仅保留纯粹的典礼性质。"
 flavor_ach.15.b: "借此次仪式推动帝国复辟大业。"
 flavor_ach.15.c: "借加冕仪式向效忠的领主们争取政治支持。"
 flavor_ach.16.title: "[the_pope.GetNameWithNoTooltip]为复辟[GetCountry('LAT').GetLongNameWithNoTooltip]事业表示支持"
 flavor_ach.16.entry: "教宗为复辟拉丁帝国事业表示支持"
 flavor_ach.16.desc: "注意到我们在[ShowScriptedGeographyName('greece_geography')]的军事行动后，[the_pope.GetName]已从[scope_papal_states.GetName]派出使节，向我们提出援助方案。\n\n在认可我方[ShowGovernmentReformName('ach_heirs_of_the_latin_empire')]的宣称权后，[the_pope.GetShortNameWithNoTooltip]承诺，若我方同意协助[scope_papal_states.GetGovernment.GetRulerTitle]推动[ShowReligionAdjective('catholic')]与[ShowReligionAdjective('orthodox')]教会和解，[scope_papal_states.GetNameWithNoTooltip]将为我方提供财政与政治支持。\n\n[the_pope.GetNameWithNoTooltip]同时强调，若成功光复[constantinople_location.GetName]，绝不能重蹈第四次十字军东征给这座[constantinople_location.GetRank.GetName]带来的悲剧。"
 flavor_ach.16.a: "同意[scope_papal_states.GetAdjectiveWithNoTooltip]使节的要求，换取其支持。"
 flavor_ach.16.a.entry: "同意$PAP_ADJ$使节的要求，换取其支持。"
 flavor_ach.16.b: "光复[constantinople_location.GetNameWithNoTooltip]无需[the_pope.GetShortNameWithNoTooltip]的帮助。"
 flavor_ach.16.b.entry: "光复[ShowLocationNameWithNoTooltip('constantinople')]无需教宗的帮助。"
 lat_aggressive_conversion_policies_tt: "若我们成功建立[GetCountry('LAT').GetLongName]，[the_pope.GetName]可能会要求我方推行严苛的重新皈依政策，以此换取[the_pope.GetHisHer]的支持"
 flavor_ach.17.title: "[constantinople_location.GetNameWithNoTooltip]光复！"
 flavor_ach.17.entry: "君士坦丁堡光复！"
 flavor_ach.17.desc: "曾被视作不可能完成的壮举，如今终于实现：[constantinople_location.GetName]已成功光复！尽管这座[constantinople_location.GetRank.GetName]的大部分区域仍未恢复元气，[scope_ruler.GetName]已严令[ROOT.GetCountry.GetAdjective]士兵在光复[constantinople_location.GetNameWithNoTooltip]的过程中严守纪律，避免进一步引发民众动荡。\n\n随着[constantinople_location.GetNameWithNoTooltip]的大部分区域已被我方掌控，布拉赫奈皇宫也已人去楼空，[scope_ruler.GetNameWithNoTooltip]已要求[ROOT.GetCountry.GetAdjectiveWithNoTooltip]精英阶层迅速宣告[GetCountry('LAT').GetLongName]复辟，但[ROOT.GetCountry.GetGovernment.GetCourtTitle]内持谨慎态度的人士力劝我方先稳固立足之地。"
 flavor_ach.17.a: "是时候重建我们对[constantinople_location.GetNameWithNoTooltip]的统治了。"
 flavor_ach.17.a.entry: "是时候重建我们对[ShowLocationNameWithNoTooltip('constantinople')]的统治了。"
 flavor_ach.17.b: "正式复辟帝国前，我们应先巩固自身地位。"
 flavor_ach.17.c: "洗劫[constantinople_location.GetNameWithNoTooltip]，掠夺其残存的所有财富！"
 flavor_ach.17.c.entry: "洗劫[ShowLocationNameWithNoTooltip('constantinople')]，掠夺其残存的所有财富！"
