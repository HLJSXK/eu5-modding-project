l_simp_chinese:
 market_decline.1.title: "[withering_market.GetName]的衰落"
 market_decline.1.desc: "[withering_market.GetCenterLocation.GetName]的市场已不复昔日贸易枢纽之盛况。如今仅有少数几个地点仍依附于该市场，我国商人日益将货物转向服务更为完善的邻近市场。若不加以干预，该市场将逐渐萎缩，沦为通往他处道路上的一个关卡。\n\n我们的内阁正询问应如何处理此次衰落。"
 market_decline.1.a: "补贴商人，并支撑该市场。"
 market_decline.1.b: "解散该市场，让治下各地依附于其天然邻近的市场。"
 market_decline.1.b.tt: "[withering_market.GetName][market|e]被摧毁。其下属各地将重新依附于次优[market|e]。"
 market_decline.1.c: "接受衰落，由商人自行决定。"
