l_simp_chinese:
 market_decline.1.title: "凋零[withering_market.GetName]"
 market_decline.1.desc: "市场[withering_market.GetCenterLocation.GetName]它已不再是昔日的贸易中心。如今，仅剩寥寥几处商铺依附于此，我们的商户越来越多地将货物转运至周边服务更完善的市场。若任其衰落，这个市场终将沦为通往别处道路上的一个收费站。\n\n内阁询问我们希望如何应对人口下降。"
 market_decline.1.a: "补贴商家，扶持市场。"
 market_decline.1.b: "解散市场，让我们的店铺融入周围的自然环境。"
 market_decline.1.b.tt: "这[market|e]的[withering_market.GetName]已解散。其位置重新连接到其次佳位置。[market|e]。"
 market_decline.1.c: "接受下滑趋势，让商家自己做决定。"
