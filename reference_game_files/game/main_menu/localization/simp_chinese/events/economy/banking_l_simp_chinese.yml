l_simp_chinese:
 banking.1.title: "富格尔家族的崛起"
 banking.1.desc: "一个来自奥格斯堡商业贵族，名叫富格尔的家族在15和16世纪成为了欧洲银行业最重要的群体之一。他们掌控了欧洲大量经济，最终几乎垄断了铜市场。在历史上，他们与哈布斯堡家族关系密切，在他们资助下，哈布斯堡崛起为了世界强权。"
 banking.1.a: "这有助于奥格斯堡的发展！"
 banking.2.a: "这也许对我们……有利？"
 the_fuggers_appear_in_augsburg_tt: "[the_fuggers.GetName]现已在[ShowLocationName('augsburg')]开始营业"
 banking.3.title: "韦尔瑟家族"
 banking.3.desc: "Welser was a German merchant and banking family from Augsburg, that claimed descent from the Byzantine general Belisarius. They provided a lot of the banking services to the growth of the Habsburg Empire, making them extremely wealthy. By the Age of Discovery, they had trading posts in Antwerp, Madrid, Lisbon, Rome, Lyon and many other cities."
 banking.3.a: "This will put Augsburg on the map!"
 banking.4.a: "这也许对我们……有利？"
 the_welsers_appear_in_augsburg_tt: "[the_welsers.GetName]现已在[ShowLocationName('augsburg')]开始营业"
