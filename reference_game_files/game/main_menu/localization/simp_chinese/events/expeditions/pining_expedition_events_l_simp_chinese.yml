l_simp_chinese:
 pining_expedition_events.1.title: "[ROOT.GetCountry.GetGovernment.GetAdjective] Commission for the Northern Seas"
 pining_expedition_events.1.desc: "The [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] has commissioned a privateer of considerable reputation, lately returned from raids on the [ShowCultureName('hanseatic')] shipping lanes, to take a small squadron north and west into the unknown [ShowContinentName('atlantic_ocean_continent')]. The voyage will touch at [ShowLocationName('shetland')], sail for the cold lands of [ShowAreaName('iceland_area')] and [ShowAreaName('greenland_area')] that the sagas remember, and then strike out further still, into whatever lies beyond. There are old [ShowCultureName('icelandic')] charts that hint at a forested shore further west than any living mariner has seen. [target_leader.GetName] says [target_leader.GetSheHe] can do it, given proper provisioning. The [ROOT.GetCountry.Custom('GetHeadOfCabinetName')]'s clerks are still calculating what the wreck of the squadron would cost."
 pining_expedition_events.1.a: "Provision the squadron in full. The [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')] will not be remembered for niggardliness."
 pining_expedition_events.1.b: "A modest commission. Let [target_leader.GetNameWithNoTooltip] prove the route is real before the treasury opens wider."
 pining_expedition_events.1.historical_info: "Didrik Pining, a German-born privateer in the service of the Danish crown, was commissioned around 1473 by Christian I of Denmark to lead a voyage westward across the northern Atlantic. The expedition was not formally documented at the time, and what little is known of it comes from later references in Hanseatic correspondence and a remark by the Portuguese cosmographer Martin Behaim that Pining and his colleague Hans Pothorst had touched a coast far to the west of Greenland. The voyage was never followed up by Denmark, and the silence in the official record has fed centuries of historiographical debate about what, if anything, the captains actually found."
 pining_expedition_events.2.title: "[ShowCultureNameWithNoTooltip('icelandic')] Mariners and Old Sagas"
 pining_expedition_events.2.desc: "The squadron has put into the lee of the [ShowAreaName('iceland_area')] coast for fresh water and to confer with the harbor-masters at the small fishing settlements. The [ShowCultureName('icelandic')] locals are reserved at first, then talkative when the [ShowGoodsName('wine')] is brought out: they tell of grandfathers who remembered men returning from [ShowAreaName('greenland_area')] with stories of a wooded land further still to the west, of vessels lost in the ice, of one old man who claimed to have seen the bones of a strange beast set up in a chapel in [ShowLocationName('brattahlid')]. The pilot offers, for a fair price, to sell us the chart-fragments his family has preserved since the days when the western route was last sailed."
 pining_expedition_events.2.a: "Buy the sagas and the chart-fragments. Knowledge has rarely been cheap."
 pining_expedition_events.2.b: "Take what is freely given. Our pilots have their own readings to make."
 pining_expedition_events.2.historical_info: "Medieval Iceland preserved a substantial oral and written memory of the Norse voyages to Greenland and the lands further west, recorded in the sagas of Eirik the Red and the Vinland sagas of Leif Eiriksson. By the late fifteenth century these accounts had largely passed out of active mariners' use, but fragments of the old knowledge survived in the families of Icelandic fishermen and trading captains. Late medieval Danish, English, and Bristol voyages to the western Atlantic routinely passed through Iceland for resupply and almost certainly acquired Icelandic informants along the way."
 pining_expedition_events.3.title: "Abandoned Farmsteads on the [ShowAreaNameWithNoTooltip('greenland_area')] Coast"
 pining_expedition_events.3.desc: "The squadron has reached the western [ShowAreaName('greenland_area')] coast and put a party ashore at one of the small fjords described in the old [ShowCultureName('icelandic')] charts. The settlement that was supposed to be there is gone: the church stands roofless, the longhouses are tumbled in, the kirkyard is overgrown. In one of the houses we find a body, partly preserved by the cold, dressed in northern European clothes that the chronicler estimates to be a generation old. There is no one left to ask what happened. The men return to the ships subdued. The country we have come to map is a country that has already buried its previous inhabitants."
 pining_expedition_events.3.a: "Bury what bones we can find. Leave a stone with the [ROOT.GetCountry.Custom('GetRulerOrRegentTitle')]'s mark on it. Continue west."
 pining_expedition_events.3.b: "Sail on. The [ShowCultureNameWithNoTooltip('icelandic')] settlements are no longer our concern."
 pining_expedition_events.3.historical_info: "The Norse settlements in Greenland, the Eastern Settlement (Eystribyggð) and Western Settlement (Vestribyggð), founded by Erik the Red in the 980s, persisted for around four hundred years before being progressively abandoned. The exact causes are debated and probably multiple, including the Little Ice Age's cooling effect on Greenland agriculture, competition with the expanding Thule Inuit population, the collapse of the Norwegian-controlled walrus-ivory trade that had sustained the colonies' export economy, and possibly emigration back to Iceland and Norway. By the time Pining sailed in the 1470s, the Western Settlement had been gone for more than a century and the Eastern Settlement was probably either gone or in its final decline."
 pining_expedition_events.5.title: "The [norse_greenland.GetCulture.GetAdjectiveWithNoTooltip] People"
 pining_expedition_events.5.desc: "The squadron has reached [target_location.GetName], the [norse_greenland.Custom('GetRulerOrRegentTitle')]'s seat and effective capital of the [norse_greenland.GetCulture.GetAdjective] colony in [ShowAreaName('greenland_area')]. The settlement is much reduced from what the old sagas describe, but it is still there: a cathedral with its lead roof intact, a few dozen turf longhouses, sheep on the hillsides, fishing boats drawn up on the gravel beach. The [norse_greenland.Custom('GetRulerOrRegentTitle')] and the lawspeaker receive our captains with the gravity of men who have not seen a ship from [ShowSubContinentName('europe')] in some years. They are eager for news, eager for trade goods, and not unwilling to share what they know about the western waters."
 pining_expedition_events.5.a: "Leave a generous gift at the [norse_greenland.Custom('GetRulerOrRegentTitle')]'s seat. The [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')] does not forget its furthest subjects."
 pining_expedition_events.5.b: "Take on water and provisions, exchange courtesies, and continue west."
 pining_expedition_events.5.historical_info: "The Norse Greenland settlements were founded by Erik the Red around 985 and persisted for some four hundred years. The bishop's seat at Garðar, established in 1124, was the westernmost diocese of the medieval Catholic Church and remained occupied at least intermittently until the late fifteenth century, when the colony's gradual abandonment finally became total. The cause of the collapse is debated and likely multi-causal: the Little Ice Age, Inuit expansion southwards, the loss of the Norwegian walrus-ivory market, and emigration back to Iceland and Norway all contributed."
 pining_expedition_events.4.title: "A Forested Shore"
 pining_expedition_events.4.desc: "The squadron has sailed for three weeks west and north of [ShowAreaName('greenland_area')] through open water and broken ice, and has now closed with a coast that matches no chart we possess. The shore is dark with timber to the waterline. [target_leader.GetName] takes a small party in by ship's boat through breakers that the [ShowAreaNameWithNoTooltip('greenland_area')] mariners would have called impossible. They return at evening with branches of an unknown species, a finely worked arrowhead of grey [ShowGoodsName('stone')], and a description of footprints in sand that suggested neither European boots nor anything else they could name. The chronicler, when shown the arrowhead, asks [target_leader.GetNameWithNoTooltip] a question that [target_leader.GetSheHe] cannot answer."
 pining_expedition_events.4.a: "Plant the [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')]'s standard ashore. Let the world know [ROOT.GetNameWithNoTooltip] was here."
 pining_expedition_events.4.b: "Record the coast in a private chart. The [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')] will know. Others need not."
 pining_expedition_events.4.historical_info: "Whether Didrik Pining actually reached the coast of Labrador or Newfoundland on his 1473 voyage remains a contested point in the history of pre-Columbian Atlantic exploration. The most-cited evidence is a marginal note on Martin Behaim's globe of 1492 and a 1551 letter from the Danish geographer Jacob Cnoyen referring to Pining and Pothorst's 'northern voyage to seek a strait.' A small minority of scholars credit the voyage with reaching the North American mainland twenty years before Columbus's first crossing further south; the more common view is that the captains may have touched Greenland or Labrador but produced no usable claim or chart. Denmark, in any event, made nothing of it."
