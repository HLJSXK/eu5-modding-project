l_simp_chinese:
 cartographic_survey_events.1.title: "测绘委任"
 cartographic_survey_events.1.desc: "命令已经下达。一支由两三艘船组成的小型舰队，配备制图师、仪器管理员和一位精心挑选的船长，将沿我国海岸线全程航行，带回足以流传下个世纪的海图。我们对本国海岸的了解，大多来自当地领航员和商人的传闻。此次远航之后，将有海图以墨迹详实记录下 [ROOT.GetCountry.Custom('GetRulerOrRegentTitle')] 的所有港口、航海者要警惕的险境，以及走私者藏身的隐蔽港湾。唯一的问题是，此行该配备怎样的装备。"
 cartographic_survey_events.1.a: "Commission the finest brass instruments and the best chart-makers in the land."
 cartographic_survey_events.1.b: "The standard chart-makers will serve. There is no need for extravagance."
 cartographic_survey_events.1.historical_info: "系统性的沿海测绘始于十六世纪，当时海上贸易量的增长使精确海图成为国家关注之事。塞维利亚的#italic贸易署#!与葡萄牙的#italic几内亚及印度仓库署#!都设有官方制图师，专司海图的编制与更新，十七世纪荷兰各海军部亦相继效仿。"
 # GOOD events: material-specific
 cartographic_survey_events.10.title: "渔场绘制完成"
 cartographic_survey_events.10.desc: "测绘船已在 [target_location.GetName] 及周边海域与当地渔民共事三周，测量了广阔渔场的深度，标出了季节性鱼汛的路线，并记录了在天气转变前将渔船带回岸边的洋流。制图师们已绘制出一份工作图，记录了水深、海底构成以及惯常的渔汛季节。一位当地领航员感叹，他一生都在这片渔场上劳作，却从未见过如此清晰的呈现。"
 cartographic_survey_events.10.a: "Distribute the chart to the fishing villages. Let the trade benefit from the work."
 cartographic_survey_events.10.historical_info: "前现代的渔业依赖于渔民家族与行会内部口传的知识。向绘制渔场图——标出渔场位置、水深等高线并记录季节规律——的转变是一个缓慢的过程，直到十七、十八世纪随着国家资助的水文测量兴起才加速展开。"
 cartographic_survey_events.11.title: "沿海的林木"
 cartographic_survey_events.11.desc: "测绘人员已与林务官和造船大师一同骑马穿行于 [target_location.GetName] 的沿海森林，标出了最好的桅杆松与造船橡木林地，勾画出可将木材运至装载海滩的河流路线，并记录了木材最适宜锯伐的季节。从船厂召来视察这片最有前景的林地的造船工程师宣称，此地木材足以打造一等的龙骨与船架。"
 cartographic_survey_events.11.a: "Set the better stands aside as [ROOT.GetCountry.GetGovernment.GetAdjective] timber for the naval yards."
 cartographic_survey_events.11.historical_info: "在帆船时代，海军用材——尤其是用于战列舰船架的橡木和用于桅杆的高大松木——是一种战略性商品。英国、法国和荷兰王室都对沿海林木进行了测绘，并将较优良的林地划为王室财产，同时严格规定伐木、干燥与运输事宜。"
 cartographic_survey_events.12.title: "The Salt Pans Catalogued"
 cartographic_survey_events.12.desc: "The survey vessel has logged every [ShowGoodsName('salt')] pan, brine spring, and shoal flat along [target_location.GetName]'s stretch of coast. The boilers have been counted, the customary working seasons noted, the local salt-traders interviewed about price, demand, and the routes by which the [ShowGoodsNameWithNoTooltip('salt')] travels inland. The chart that emerges shows a coastal economy that the [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] has barely understood until now, and that the #italic gabelle#!, if extended to cover it, would yield handsomely from."
 cartographic_survey_events.12.a: "Forward the chart to the [ShowGoodsNameWithNoTooltip('salt')] commissioners. The trade can be regularized."
 cartographic_survey_events.12.historical_info: "利用日晒蒸发法生产海盐的做法自古以来便盛行于地中海沿岸，以及法兰西、葡萄牙与伊比利亚半岛的大西洋沿岸。布尔讷夫湾、雷岛以及塞图巴尔半岛的盐沼，乃是前现代欧洲最重要的盐业产区，供应着北大西洋鳕鱼渔业与整个大陆腌肉贸易所需的盐。"
 cartographic_survey_events.13.title: "发现的珍珠床"
 cartographic_survey_events.13.desc: "测绘队已在[target_location.GetName]寻访了世代在此水域采珠的潜水家族，并定位、绘制出当地的[ShowGoodsName('pearls')]养殖场。图上标注了水深、采捕的季节、相邻潜水群体之间的传统边界，以及渔获运往各城市宝石匠人手中的路线。宝石鉴定师受邀查验本季渔获的样品后，宣称这些珠子光泽异常出众。"
 cartographic_survey_events.13.a: "[ShowGoodsNameWithNoTooltip('pearls')] 这样品质的必须交由 [ROOT.GetCountry.GetGovernment.GetAdjective] 管制。"
 cartographic_survey_events.13.historical_info: "欧洲的珍珠渔业与波斯湾及斯里兰卡的大型珠场相比规模有限，但赫布里底群岛、维斯瓦河流域，以及布列塔尼与威尔士沿岸的水域，确实产出了具有商业价值的淡水珠与海水珠。自中世纪以来，苏格兰王室便对某些河系的采珠活动实行王室垄断，而威尼斯元老院则对亚得里亚海的采捕活动加以管制。"
 cartographic_survey_events.14.title: "葡萄园海岸的测绘"
 cartographic_survey_events.14.desc: "测绘人员已在 [target_location.GetName] 与酿酒人一同踏遍沿海丘陵地带，记录了最适宜种植葡萄的坡地、影响果实成熟或腐坏的盛行风向，以及可供酒桶装船外销的装载海滩。素来行事隐秘的 [ShowGoodsName('wine')] 商人，一旦明白更精良的图纸意味着更好的出口时机把握，也出人意料地热心相助。"
 cartographic_survey_events.14.a: "Distribute the chart to the wine-shippers. The trade rests on better information."
 cartographic_survey_events.14.historical_info: "海上葡萄酒贸易是加龙河谷、杜罗河流域、爱琴海诸岛以及达尔马提亚沿岸等地区的经济支柱。年份的把握、航运时机以及港口条件，决定了一年的压榨成果能否以良好状态运抵市场。因此，产酒海岸的地图测绘具有重大的商业意义，波尔多与波尔图的大酒商世家更是数百年来一直保有自家的私藏图纸收藏。"
 cartographic_survey_events.15.title: "染料海岸的勘测"
 cartographic_survey_events.15.desc: "The survey has charted the local dye-producing coast in [target_location.GetName]: the murex beds where the Tyrian purple is gathered, the kermes oaks above the cliffs, the indigo plantings on the inland flats, or whatever local plant or shell yields the color that the cloth-merchants pay for. The chart records the working seasons, the customary gathering grounds, and the routes by which the [ShowGoodsName('dyes')] reach the textile towns."
 cartographic_survey_events.15.a: "Distribute the chart to the cloth-merchants and the gathering villages."
 cartographic_survey_events.15.historical_info: "在合成染料出现之前，染料在中世纪与近代早期一直是一项具有战略意义的商品。产自骨螺的骨螺紫、来自栎树胭脂虫的胭脂红、取自木蓝植物的靛蓝，以及来自菘蓝叶片的菘蓝染料，各自有其独特的产地分布，而布匹贸易的兴衰则取决于从采集地到纺织城镇之间供应链的可靠程度。"
 cartographic_survey_events.16.title: "The [ShowGoodsNameWithNoTooltip('amber')] Coast Mapped"
 cartographic_survey_events.16.desc: "测绘队已勘测了[target_location.GetName]的海滩，查明了风暴过后[ShowGoodsName('amber')]会被冲上岸的地带，确定了值得开采的滩涂、海浪将树脂带上岸的季节，以及分配渔获的当地惯例。各城市中一向愿为最纯净的原石支付高价的[ShowGoodsNameWithNoTooltip('amber')]切割匠人，一旦得知哪片海滩产出哪种品级，出价必将更为丰厚。"
 cartographic_survey_events.16.a: "将最佳滩涂划归 [ROOT.GetCountry.GetGovernment.GetAdjective] 保留地。"
 cartographic_survey_events.16.historical_info: "波罗的海琥珀海岸，从桑比亚半岛延伸至波美拉尼亚东岸，自古以来便是欧洲工艺所用琥珀的主要产地。条顿骑士团以严格垄断采集而闻名，未经许可擅自采集者将受重罚。琥珀之路将波罗的海沿岸与波希米亚、意大利和君士坦丁堡的作坊连接了一千多年。"
 # GOOD events: generic encounters
 cartographic_survey_events.20.title: "一处避风良港"
 cartographic_survey_events.20.desc: "测量船绕过 [target_location.GetName] 的一处低矮海角，在一片受庇护的水域抛锚，当地渔民世代使用此处，但它却从未出现在任何现有海图上。水深在四英寻处保持稳定，底质为沙地，盛行风在外礁上被安然化解，当地领航员称任何吃水合理的船只都能在此处安然停泊，无论天气如何。只要测好水深并设好方位标线，此港便可供更大船只使用。"
 cartographic_survey_events.20.a: "Set the proper transit lines and record the harbor on the official chart."
 cartographic_survey_events.20.historical_info: "当地渔民常常知晓一些未列入任何官方海图的避风锚地，这些知识以实际领航经验的形式代代相传，而非见诸文字记录。国家水文测量部门特意走访这类领航员，将此前未标注的港湾补入官方航行指南，在前现代沿海测量工作中是常见的结果。"
 cartographic_survey_events.21.title: "穿越暗礁的水道"
 cartographic_survey_events.21.desc: "制图人员用了两周时间，用测深索反复探测 [target_location.GetName] 近海一处一向被视为不可通行的暗礁。他们发现了一条水道：最窄处宽三十英尺，低潮时水深四英寻，只要在身后海角上立好正确的方位标杆，任何天气下都可通行。一位当地领航员原来早已知晓这条水道达三十年之久，却从未告诉过任何人，他索要一笔小额费用作为标记之酬。"
 cartographic_survey_events.21.a: "Set the transit poles. The channel goes on the official chart."
 cartographic_survey_events.21.historical_info: "隐藏可通航水道的近海暗礁是前现代沿海航行中常见的现象。方位标杆法——即船只沿两处显著岸标前后对齐的方位线接近水道——是标记此类航道的标准技术，而对这类方位线的了解往往是当地领航行业严守的秘密。"
 cartographic_survey_events.22.title: "一处久用的隐湾"
 cartographic_survey_events.22.desc: "测量队在 [target_location.GetName] 距最近的官方港口数里格之外，发现了一处隐蔽的小海湾。湾底留有新近的锚痕，海滩上方的岩石上有酒桶滚动留下的旧痕迹，被问及此事的当地渔家孩童也难以完全掩饰神色。这处海湾多年来一直被用于非法贸易。如今其存在已录入官方记录，这处海湾便可转为合法用途，至少也可用于设立能带来税收的海关监管站。"
 cartographic_survey_events.22.a: "记录此海湾并设立一处小型海关站。"
 cartographic_survey_events.22.historical_info: "走私者的隐湾自古至工业化初期一直是欧洲海岸线上常见的景象。海岸警卫队的设立、缉私快艇的投入以及对可疑登陆地点的系统性测绘，逐渐将非法贸易挤向更小、更偏远的海湾，但直到铁路、电报和蒸汽动力巡逻船出现，才真正使大规模走私变得困难重重。"
 # BAD events
 cartographic_survey_events.30.title: "风暴打散测量队"
 cartographic_survey_events.30.desc: "A storm came up out of the southwest on the third day of the work, drove the survey vessel onto a lee shore for two cold nights of pounding surf, and scattered the boats sent to fetch the chart-makers off the working stations. By the time the wind dropped and the vessel was refloated, the season's working had been lost, the instruments soaked, and two of the boatswain's mates buried in the dunes above the beach. The chart for [target_location.GetName]'s stretch of coast remains as blank as it was before."
 cartographic_survey_events.30.a: "Move on to the next place. The season is too far gone to begin again here."
 cartographic_survey_events.30.historical_info: "突如其来的风暴，是小型船只沿岸测绘工作中长期存在的职业隐患。蒲福风级、标准化的风暴警报以及系统化的天气预测，直到十九世纪才问世。在那之前，一艘在强风中发现自己已处于下风岸的测绘船，能倚仗的只有测深索、锚具，以及船长的胆魄，除此之外便别无他物可挡灾祸。"
 cartographic_survey_events.31.title: "触礁于未标浅滩"
 cartographic_survey_events.31.desc: "测绘船在 [target_location.GetName] 触上了一处任何现有海图都未曾标出的浅滩，海底几乎在测深索刚显示四英寻之时便骤然逼近龙骨。船体在隔壁舱前方已被撞穿，船只已在海滩上侧倾搁浅，木匠正用铅皮补板和防水围堰进行抢修。绘图员们已在沙滩上架起仪器，日以继夜地工作，但这段海岸的测绘任务已经就此终结。"
 cartographic_survey_events.31.a: "Repair the vessel and move on. The shoal at least is now on our chart."
 cartographic_survey_events.31.historical_info: "触上未标浅滩，是前现代测绘工作中司空见惯的不幸，而失事船只往往比那些谨慎测深、平安驶过同一海岸的船只，提供了更为精确的水文资料。许多航行指南都以发现浅滩的失事船只为参照来标注浅滩位置，而一处此前未知的暗礁，也常常会被简略地记入海图，只留下寥寥数语：某船于某年触礁于此。"
 cartographic_survey_events.32.title: "一艘敌意船只"
 cartographic_survey_events.32.desc: "An unflagged vessel, lateen-rigged and clearly armed, came up out suddenly of the haze and sailed towards the survey vessel while it was anchored in [target_location.GetName]. Our crew, ashore on the beach with their instruments, were obliged to abandon the work, take to the boats, and return to the ship with their notebooks half-completed. The unknown vessel followed for half a day, peeled away on a bearing that suggests an unfriendly home port, and left the survey for this stretch of coast in tatters. The chart-makers will not be persuaded to return."
 cartographic_survey_events.32.a: "Move on. A coast surveyed under hostile watch is no chart at all."
 cartographic_survey_events.32.historical_info: "沿岸测绘工作在政治上颇为敏感，因为精确的敌国海岸海图，正是对其发动海上作战的先决条件。在有争议的水域作业的测绘船只，常常遭到当地势力武装船只的跟踪监视，有时被拘留，有时则仅仅是被驱赶劝阻。十七、十八世纪英国海军部对西班牙及爱琴海沿岸的水文测绘，屡屡因此类压力而中断，测绘船员也因此受训：一旦见有登船搜查的迹象，便将最要紧的记录抛入海中。"
 cartographic_survey_events.33.title: "浓雾阻断了工作"
 cartographic_survey_events.33.desc: "浓雾在第二天清晨骤然涌来，一连三周未曾消散。绘图员们无法对隐没在云雾之墙后的岸上地标进行交叉测向，只得终日掷骰消磨时光，抱怨天气寒冷。给养渐渐耗尽；[target_leader.GetName] 认为再等下去只是白白耗费物资，于是 [target_location.GetName] 海岸的测绘工作便半途搁置，海图只画了一半，测深数据也未经核实。当然，浓雾正是在船只启航次日便散去了。"
 cartographic_survey_events.33.a: "承认这一季的损失，继续前行。"
 cartographic_survey_events.33.historical_info: "沿岸浓雾，乃是前现代测绘工作长久以来的宿敌。标准的水文测绘方法，要求从近海作业点能够清晰望见固定的岸上地标，而持续不散的浓雾，会使整套程序无从进行。在纽芬兰、北海以及太平洋西北岸等多雾地区开展的测绘远征，往往耗在等待晴天上的时间，比真正用于测绘作业的时间还要多。"
