l_simp_chinese:
 pacific_crossing_events.morale_up_tt: "The crew's spirits rise"
 pacific_crossing_events.morale_down_tt: "The crew's spirits suffer"
 pacific_crossing_events.morale_crash_tt: "The crew's spirits collapse"
 pacific_crossing_events.ship_lost_tt: "A ship is lost"
 pacific_crossing_events.provisions_up_tt: "The fleet's provisions are replenished"
 pacific_crossing_events.provisions_down_tt: "The fleet's provisions are reduced"
 pacific_crossing_cargo_loaded_effect: "The cargo of silk, porcelain, and spices is loaded, to be sold when the fleet reaches home."
 pacific_crossing_events.1.title: "归途"
 pacific_crossing_events.1.desc: "The commission is not simply to reach [ShowContinentName('asia')] — ships have done that, borne west on the trade winds like a leaf on a stream. The commission is to come back. A colony on the far shore of this ocean is worthless if a fleet can sail to it but never return; the whole enterprise depends on finding a reliable passage home, one a ship can sail year after year with [ShowGoodsName('silver')] going out and [ShowGoodsName('silk')] coming back.\n\nThe outward wind is known and steady. What lies beyond, and whether the sea will ever give the fleet a road back, no chart in this harbor can say. The pilots are certain of only one thing: the way out will not be the way home."
 pacific_crossing_events.1.a: "Fit out a larger fleet — an extra ship for the long search ahead."
 pacific_crossing_events.1.a.tt: "An additional ship is outfitted and added to the fleet."
 pacific_crossing_events.1.b: "Provision for the outward passage and trust to fortune for the rest."
 pacific_crossing_events.1.c: "[target_leader.GetName] will chart every wind and current we cross."
 pacific_crossing_events.1.historical_info: "东归——即所谓 #italic tornaviaje #! ——是早期太平洋航行中悬而未决的一大难题。萨维德拉（Álvaro de Saavedra）从新西班牙启航，却两度被信风逼回，分别在1528年和1529年，最终客死于此次尝试之中；1542年维拉洛博斯（Ruy López de Villalobos）的远征队同样抵达了亚洲，却始终找不到返航之路。直到1565年，人们才发现了可靠的归航路线，在此之前，船队虽能抵达亚洲，却永远无法把货物带回。"
 pacific_crossing_events.2.title: "盗贼群岛"
 pacific_crossing_events.2.desc: "Weeks of nothing but water and sky end when the look-out cries land: a low green island ringed with white surf. Before the fleet can anchor, canoes are racing out to meet it — slender outriggers under triangular sails, skimming from wave to wave so fast the pilots stand and stare. The islanders swarm up the sides, laughing and unafraid, and carry off whatever is not lashed down. To them there is no theft in taking what lies unclaimed; to hungry men a month at sea, it is provocation.\n\nBut there is fresh water here, and fruit, and fish, ripe for the taking — one way or another."
 pacific_crossing_events.2.a: "Trade honestly — beads, cloth, and iron for their water and fruit."
 pacific_crossing_events.2.b: "强行取走船只所需之物，容不得片刻耽搁。"
 pacific_crossing_events.2.fight_win_tt: "岛民在船只的武力面前四散奔逃，船员得以随意取用淡水与果实"
 pacific_crossing_events.2.fight_lose_tt: "岛民的反抗远比预想中激烈，船员被迫空手退回船上"
 pacific_crossing_events.2.c: "淡水暂且不论——留意一下他们那迅捷的船身与船帆。"
 pacific_crossing_events.2.historical_info: "1521年3月6日，在连续三个多月未见陆地之后，麦哲伦（Ferdinand Magellan）船队的幸存者们抵达了关岛。查莫罗人乘着轻快的舷外浮架独木舟出海迎接，编年史作者安东尼奥·皮加费塔（Antonio Pigafetta）对此赞叹不已，称其航速远胜西班牙人所乘之船。岛民夺走了船上的一艘小艇后，麦哲伦便将这片群岛命名为#italic“盗贼群岛”（Islas de los Ladrones）#!，随后率众登岛补给给养，方才继续启航前往菲律宾。"
 pacific_crossing_events.3.title: "四十日空茫"
 pacific_crossing_events.3.desc: "No land, no birds, not even a strand of seaweed floating upon the water. The crew has been at sea for weeks and the pilot's confidence thins with each one. Men have bleeding gums and loosening teeth; one swears an old wound, healed for years, has split open again. The water casks are low and the biscuit is more weevil than bread. The wind is kind, steady and cool, but it carries them ever deeper into an ocean that shows no sign of ending.\n\nThe captain keeps his face calm and his voice level, counts the days on the chart, and says nothing he does not believe."
 pacific_crossing_events.3.a: "削减配给。该忍受的，我们都得忍受。"
 pacific_crossing_events.3.b: "航向无误。陆地就在前方——保持航向。"
 pacific_crossing_events.3.c: "约束船员，船长之言即是律法！"
 pacific_crossing_events.4.title: "西海对岸的陆地"
 pacific_crossing_events.4.desc: "A week out from the Islands of Thieves, the look-out sees green hills through the morning haze. As the fleet enters the great bay, it becomes clear this is no empty shore. A settlement of whitewashed walls and palm-thatched roofs climbs the hill above the water. Outrigger canoes put out toward the ships, crewed by men in colored cloth who show no alarm.\n\nThe largest of them, wearing gold at his throat, speaks [location.GetDominantCulture.GetLanguage.GetName], a tongue none of the pilots know, and gestures toward shore with the ease of a man who trades with strangers often. These islands have a world of their own — and through them already flow the [ShowGoodsName('silk')] and [ShowGoodsName('porcelain')] of far Cathay."
 pacific_crossing_events.4.desc.owned: "A week out from the Islands of Thieves, the look-out sees green hills through the morning haze — and then, unmistakable above the settlement climbing the hillside, our own colors flying. The fleet has not stumbled on some unknown shore but sailed into a harbor of our own: [pacific_colony.GetName], a possession of our Crown, its wharves and warehouses already at work.\n\nBoats put out to meet the ships with countrymen aboard, astonished to see a fleet come out of the empty ocean to the east. Here the crews can water and victual in safety, and load the [ShowGoodsName('silk')] and [ShowGoodsName('porcelain')] that Chinese merchants bring to our own quays."
 pacific_crossing_events.4.desc.hostile: "A week out from the Islands of Thieves, the look-out sees green hills through the morning haze — and then a flag that is not ours flying above a stockade at the water's edge. Another power has reached these islands first. As the fleet stands into the bay, [pacific_rival_shore.GetName] shows guns run out along its walls, and armed boats pull toward the ships to demand their business.\n\nThis is [pacific_rival.GetName]'s ground now, and the reception will be wary at best. The silk and porcelain of Cathay still flow through the archipelago — but through a rival's hands, and not freely to ours."
 pacific_crossing_events.4.a: "Open trade for the [ShowGoodsName('silk')] and [ShowGoodsName('porcelain')] passing through these islands."
 pacific_crossing_events.4.b: "袭击聚落——以武力夺取淡水与补给。"
 pacific_crossing_events.4.b.raid_win_tt: "村民逃入内陆，船员们将聚落的粮水尽数搜刮一空"
 pacific_crossing_events.4.b.raid_lose_tt: "村民为保卫家园而战，将劫掠者赶回船上，空手而归且遍体伤痕"
 pacific_crossing_events.4.d: "从我方仓库装载本季的货物。"
 pacific_crossing_events.4.e: "在我方港口让船员休整补给。"
 pacific_crossing_events.4.f: "在对方炮口之下，谨慎地与其商务代理交涉。"
 pacific_crossing_events.4.g: "强行占据锚地，以武力夺取所需之物。"
 pacific_crossing_events.4.h: "远离对方炮火范围，保持航向。"
 pacific_crossing_events.4.raid_win_tt: "据点被攻陷，储备被悉数掠走；船员们凯旋而归"
 pacific_crossing_events.4.raid_lose_tt: "袭击被击退，损失惨重，一艘残破的船只不得不被弃置"
 pacific_crossing_events.4.historical_info: "1542年，鲁伊·洛佩兹·德·维拉洛沃斯从新西班牙横渡而来，将此群岛命名为 #italic 菲律宾群岛 #! ，以纪念西班牙王位继承人，即后来的腓力二世。西班牙人的长久驻留直到1565年才真正开始，米格尔·洛佩兹·德·莱加斯皮在宿务建立了第一个定居点；1571年，他从拉贾·苏莱曼手中夺取马尼拉，并将其定为西属东印度的首府，也是大帆船贸易航线的西端终点。"
 pacific_crossing_events.5.title: "丁香之岛"
 pacific_crossing_events.5.desc: "The smell reaches the fleet before the island does — a sweetness on the wind, heavy and sharp and spiced. A single volcanic peak trailing cloud, green to the water's edge. The harbor is busy with Malay and Javanese proas, and the Sultan's palace stands plainly visible from the anchorage.\n\nEvery merchant in [ShowLocationName('lisbon')] and [ShowLocationName('sevilla')] pays a fortune for this scent, without ever knowing where its source is. No one in this fleet has ever stood this close to the source — the trees heavy with unripe [ShowGoodsName('cloves')] on the slopes above the bay, where a single shipload is worth more than the whole voyage has cost. The holds can be filled here. What remains is to carry them home."
 pacific_crossing_events.5.desc_known: "The smell reaches the fleet before the island does — a sweetness on the wind, heavy and sharp and spiced. A single volcanic peak trailing cloud, green to the water's edge. The harbor is busy with Malay and Javanese proas, and the Sultan's palace stands plainly visible from the anchorage.\n\nEvery merchant in [ShowLocationName('lisbon')] and [ShowLocationName('sevilla')] knows this scent secondhand, and pays a fortune for it. No one in this fleet has ever stood this close to the source — the trees heavy with unripe [ShowGoodsName('cloves')] on the slopes above the bay, where a single shipload is worth more than the whole voyage has cost. The holds can be filled here. What remains is to carry them home."
 pacific_crossing_events.5.desc.driven_back: "The Spice Islands rise over the bow once more — the same green peak, the same crowded anchorage — and with them the bitter knowledge that the fleet has been driven all the way back to where it began, the way home still unfound. The trades gave the ships no choice but to run back to these shores.\n\nThere is a grim routine to the anchorage now. The islands will give up water and food again; the sick can be landed, the crews rested, the holds topped up with whatever the ships can still carry. But every man aboard knows the reckoning that waits — the fleet must gather itself and stand out to sea to try the passage home again, and it will not have many more attempts left in it."
 pacific_crossing_events.5.a: "Fill the hold with [ShowGoodsName('cloves')] — load every last barrel."
 pacific_crossing_events.5.b: "为漫长的归途备足给养。"
 pacific_crossing_events.5.c: "让船员们上岸休整恢复。"
 pacific_crossing_events.5.d: "放弃搜寻——绕过好望角，走远路回家。"
 pacific_crossing_events.5.historical_info: "葡萄牙航海家于1512年抵达摩鹿加群岛，弗朗西斯科·塞朗在那里成为德那第苏丹的顾问。1521年，麦哲伦幸存的船只在其对手蒂多雷苏丹国装载了丁香。西班牙与葡萄牙对这些岛屿的争端最终在1529年的《萨拉戈萨条约》中得到解决：急需资金的查理五世皇帝以三十五万杜卡特的价格将西班牙对摩鹿加群岛的主权出售给葡萄牙。"
 pacific_crossing_events.6.title: "归途"
 pacific_crossing_events.6.desc: "The holds are full, and the easy half of the voyage is behind us. Now the fleet must do the one thing no chart aboard can show it how to do: find its way back across the ocean it has just crossed. The wind that bore the ships so gently westward stands square against their return, and every pilot at the table knows what that means.\n\nThe fleet's officers sit late over the charts, and for once the pilots cannot agree. Each has a course to urge and a reason to fear the others, and beyond the edge of the known sea none of them can promise where any of it leads — there is only conjecture, and the nerve to wager on it. The decision belongs to the captain alone, and every soul aboard will live or die by the course he sets."
 pacific_crossing_events.6.desc.driven_back: "The fleet's officers convene again, and the mood at the table has curdled. A course was chosen, and the ocean threw it back; the fleet struggled all the way here for nothing but the lesson of it. The courses that remain are only arguments still — no better proven than before, and now there are fewer ships and thinner crews to hazard upon them.\n\nThe pilots have stopped raising their voices. Every man bent over the chart knows this sea cannot be thrown against again and again without cost. A course has to be set out of these waters once more, and there will not be many more chances to choose."
 pacific_crossing_events.6.a: "The northern route — hug the Asian coast, then ride the winds east."
 pacific_crossing_events.6.a.tt: "Stand north along the coast of [ShowRegionName('japan_region')] and beyond, then let the westerlies of the high latitudes carry the fleet clear across to [ShowContinentName('america')] and home."
 pacific_crossing_events.6.b: "中央航路——顶着贸易风向东航行。"
 pacific_crossing_events.6.b.tt: "Drive due east into the teeth of the trades, by way of the old islands. The wind has thrown back every fleet that tried it — expect to be beaten all the way back to the Spice Islands."
 pacific_crossing_events.6.c: "极南航路——一道漫长却开阔的大弧线。"
 pacific_crossing_events.6.c.tt: "Strike far south and east through the island-strewn southern ocean. A passage may well lie that way — but it is immensely long, and the fleet's provisions may not last to the end of it."
 pacific_crossing_events.6.historical_info: "此前每一次尝试沿热带地区向东穿越亚洲海域的航行都以失败告终。1522年，龙萨洛·戈麦斯·德·埃斯皮诺萨的 #italic 特立尼达号 #! 试图返回新西班牙，却被逼退并被葡萄牙人俘获；阿尔瓦罗·德·萨维德拉也在1528年与1529年两次尝试均以失败告终。1565年，奥古斯丁会修士安德烈斯·德·乌达内塔终于成功——他向北远航，直至北纬约四十度，借助黑潮与西风带，横越北太平洋抵达加利福尼亚，再南下至阿卡普尔科。此后两个半世纪，马尼拉大帆船皆沿此航线往来。"
 pacific_crossing_events.7.title: "太平之洋"
 pacific_crossing_events.7.desc: "The wind dies. The sails hang slack, the sea lies flat and glassy to every horizon, and the ships sit motionless beneath a white and burning sky. It was for calm like this that the ocean was named 'the peaceful sea' — a gentleness that has starved crews before now.\n\nThe water in the casks grows warm and foul. Every windless day is a day's ration spent for no distance made, and the men know it. They watch the empty rigging and the horizon, and twice already have cried land at a bank of cloud that melted into nothing. Idle hands aboard a becalmed ship rarely stay idle for long."
 pacific_crossing_events.7.a: "耐心等待，节省每一滴水、每一粒粮。风终会归来。"
 pacific_crossing_events.7.b: "放下小艇——拖着船只前行，直到风起。"
 pacific_crossing_events.7.c: "涌浪往东南方向而去——随波漂流，朝风而去。"
 pacific_crossing_events.8.title: "大帆船归航"
 pacific_crossing_events.8.desc: "租用的大帆船终于归航了。数月航行于漫长的北方大弧线上，使她吃水极深地驶入锚地，满载货物——那是 [ShowContinentName('asia')] 的财富，穿越整片大洋，终于安然运抵。她甚至还未抛锚，码头上已聚满了商人与买家。航线畅通，事业有利可图；来年，还会有下一艘大帆船启航，年年如是。"
 pacific_crossing_events.8.a: "一笔财富，安然运抵。"
 pacific_crossing_events.8.historical_info: "从1565年到1815年，马尼拉大帆船几乎每年往来于阿卡普尔科与马尼拉之间，是历史上最长寿的航线之一。它将美洲白银运往西方，把中国的丝绸、瓷器与香料运往东方；单趟航程的货物，便足以令投资者一夜暴富。这一贸易将美洲的白银与中国的市场紧密相连，把太平洋变成了一条通往全球商业的大道。"
 pacific_crossing_events.9.title: "熟悉的海岸"
 pacific_crossing_events.9.desc: "The long climb north into cold gray water, then the endless arc east across empty ocean, ends when the look-out sees it at last: a high, forested coast, headlands marching away to the south under a bank of fog. This is no part of Asia, nor any island — it is the western shore of [ShowContinentName('america')] itself. The fleet has come out of the Pacific on the near side of the world, and has only to run south down a coast that its charts already know to reach a friendly port.\n\nThe way home has been found. All that remains is to sail the last of it."
 pacific_crossing_events.9.a: "沿着我们熟知的海岸向南航行，返回家乡。"
 pacific_crossing_events.9.b: "先靠岸取水休整——弟兄们都应得这份歇息。"
 pacific_crossing_events.9.historical_info: "安德烈斯·德·乌达内塔（Andrés de Urdaneta）于1565年的归航，在北太平洋上漂泊约四个月后，于加利福尼亚海岸门多西诺角附近首次踏上美洲大陆。此后，#italic San Pedro#! 南下，于1565年10月8日抵达阿卡普尔科，证实了这条航线的可行。这条北向弧线航路自此成为马尼拉大帆船归航的标准航线。"
 pacific_crossing_events.10.title: "海涌"
 pacific_crossing_events.10.desc: "The sky goes the color of a bruise and the wind comes on like a wall. Within an hour the fleet is fighting for its life — seas rearing higher than the mainyard, green water bursting over the waist, canvas splitting with cracks like gunfire. The ships labor and roll, and in the murk they lose sight of one another one by one. The pilots can do nothing but hold on and count the hours.\n\nThere is a choice, and no time to weigh it: shorten sail and ride out the storm where the ships currently lie, or run before it into the dark and trust the hulls to hold together."
 pacific_crossing_events.10.a: "顶风停船，收起所有帆篷，任它去吧。"
 pacific_crossing_events.10.b: "顺风疾行，只求船身能撑住。"
 pacific_crossing_events.10.weathered_tt: "船队伤痕累累，但终究全数挺过"
 pacific_crossing_events.10.foundered_tt: "一艘船被浪吞没，船上无人生还"
 pacific_crossing_events.11.title: "未干的木料"
 pacific_crossing_events.11.desc: "The ships were laid down in haste in the new yards of the American Pacific coast, from timber that never had time to season, by shipwrights who had never built for an ocean like this. Now the sea is collecting the debt. A plank starts from its seam amidships; the caulking works loose; below decks the men stand in rising water and the pumps clank day and night without gaining. The carpenter's face tells its own story.\n\nThis cannot continue, and the nearest dry land is half an ocean away."
 pacific_crossing_events.11.a: "将船只搁滩检修，妥善修补。"
 pacific_crossing_events.11.b: "轮班操作抽水泵，硬撑着继续前行。"
 pacific_crossing_events.11.c: "Abandon the failing hull and crowd her crew aboard the others."
 pacific_crossing_events.12.title: "海的馈赠"
 pacific_crossing_events.12.desc: "It begins with the dolphins — a great pod of them, driving something ahead of them toward the ships. Then the sea itself seems to catch fire: an enormous shoal of fish thrown up to the surface, acres of silver flashing and boiling around the hulls, hemmed in by the circling dolphins until the water can barely be seen for the press of them.\n\nThe crew needs no order. Boats go over the side, lines and nets follow, and men lean from the rails hauling fish by the armful onto decks that are soon heaped and slick with the catch. After weeks of biscuits and salt meat, it is a feast, a windfall, and a mercy all at once."
 pacific_crossing_events.12.a: "放下所有小艇和渔线——能捞多少就捞多少。"
 pacific_crossing_events.12.b: "速速捕捞一批，随即转身顺风而去。"
 pacific_crossing_events.13.title: "腐坏的补给"
 pacific_crossing_events.13.desc: "The steward comes to the captain with his hat in his hands. Down in the hold, whole tiers of barrels have been broached and found ruined — salt meat improperly cured, biscuits packed damp, water gone foul in casks that were never properly seasoned. Provisions loaded in haste and sealed wet in the ports of departure have rotted in the tropical heat, and what should have fed the crew for weeks is a reeking, maggot-ridden loss.\n\nThere is no market out here, and no second chance — only spoiled stores and hungry men."
 pacific_crossing_events.13.a: "把腐坏的补给扔下海，承受这份损失。"
 pacific_crossing_events.13.b: "不管怎样都要分配下去——有多少，弟兄们就吃多少。"
 pacific_crossing_events.17.title: "葬身大海"
 pacific_crossing_events.17.desc: "The reports, when they finally come, are fragments — a name, a date, a last known heading. The fleet that sailed to find the way home never found it. Whether the ships were swallowed by a storm, driven onto some nameless reef, or simply drifted until the water ran out and the men with it, no one will ever say for certain. The ocean has kept them.\n\nThe route home remains unfound. Somewhere out there, the wind still blows the wrong way."
 pacific_crossing_events.17.a: "他们不会是我们葬送在那片海洋中的最后一批人。"
 pacific_crossing_events.17.end_tt: "远征队已经覆灭，其航程就此终结"
 pacific_crossing_events.17.historical_info: "向东横渡的海洋夺走了许多试图挑战它的人。1526年横渡太平洋期间，远征指挥官加西亚·霍夫雷·德·洛艾萨与环球航行者胡安·塞巴斯蒂安·埃尔卡诺双双葬身海上；阿尔瓦罗·德·萨阿维德拉于1529年在返航途中死于大洋之中；而费迪南德·麦哲伦则于1521年在麦克坦岛遇害。随麦哲伦从西班牙出发的约270人中，最终只有十八人乘 #italic 维多利亚号 #! 归来。"
 pacific_crossing_events.18.title: "船员哗变"
 pacific_crossing_events.18.desc: "The men have had enough. Short rations, an ocean without end, and a course no one but the pilots can vouch for — it has ground the crew down past obedience. A knot of sailors gathers aft, sullen and armed, and puts the demand plainly: turn the fleet around, or they will turn it themselves. The officers stand few against many, and the muskets are not all on one side.\n\nWhatever is decided now, it will cost the fleet something it cannot easily replace."
 pacific_crossing_events.18.desc.last_ship: "The men have had enough. One ship is all that remains of the fleet, and on its crowded, stinking deck there is nowhere for an officer to hide. The ringleaders come aft in a body, and this time they do not ask — they tell the captain the truth of their situation with terrible simplicity: there is no other ship to flee to, no marines to call, and a great deal of ocean over the side. Turn for home now, they say, or be thrown to it.\n\nThe pilots have gone quiet. The captain stands alone at the rail with the sea at his back, and must answer."
 pacific_crossing_events.18.a: "让步——让带头闹事者夺一艘船掉头返航。"
 pacific_crossing_events.18.b: "以武力镇压。绞死为首者，继续航行。"
 pacific_crossing_events.18.c: "提醒他们家乡等待着什么，以及是谁在带领他们回去。"
 pacific_crossing_events.18.fight_win_tt: "The mutiny is broken and order restored"
 pacific_crossing_events.18.fight_lose_tt: "冲突演变成流血事件，混乱中损失了一艘船"
 pacific_crossing_events.18.overboard_tt: "哗变者制服了军官，将 [target_leader.GetName] 扔入海中。航程就此终结"
 pacific_crossing_events.19.title: "贼群之岛，再度重现"
 pacific_crossing_events.19.desc: "顶风向东航行，船队寸步难进，最终 [ShowLocationName('guahan')] 那低矮翠绿的岛屿再次出现在船首之前——正是横渡之后离开的同一片海岸。独木舟一如从前地滑水而出，既警惕又好奇，船员们注视着这些从空荡大洋归来、却一无所获的陌生人。无论第一次在此发生过什么，岛民们都还记得。"
 pacific_crossing_events.19.desc.friendly: "Beating east against the wind, the fleet makes no ground it can keep, and at last the low green islands of [ShowLocationName('guahan')] rise again over the bow. This time the proas come out without fear — the islanders remember fair dealing, and there are faces among them the crews half recognize. Trade goods are held up, gestures exchanged, and the promise of water and fresh food is plain enough.\n\nThe fleet needs both badly. Old goodwill, it seems, is worth more out here than any chart."
 pacific_crossing_events.19.desc.hostile: "Beating east against the wind, the fleet makes no ground it can keep, and at last the low green islands of [ShowLocationName('guahan')] rise again over the bow. But the proas that put out now come in numbers, and there is no laughter in them — the islanders have not forgotten the raid, and they have been waiting. Spears bristle along the shore, and the anchorage that gave water freely before will not give it easily now.\n\nThe fleet needs water and food regardless, and the men know they will have to take it through a people ready for them."
 pacific_crossing_events.19.a: "再次与那些善待我们的人交易。"
 pacific_crossing_events.19.b: "趁他们尚未聚集兵力，以武力夺取我们所需之物。"
 pacific_crossing_events.19.b.win_tt: "登陆部队在岛民集结之前夺得了食物与淡水"
 pacific_crossing_events.19.b.lose_tt: "岛民这次早有防备；突袭者伤亡惨重，被击退而归"
 pacific_crossing_events.19.c: "尽量不动干戈地补充些淡水，随后继续前行。"
 pacific_crossing_events.19.historical_info: "马里亚纳群岛成了横渡太平洋船只的常规补给站，与查莫罗人的关系在漫长的大帆船航线历史中，时而是谨慎的交易，时而是公开的暴力。善待岛民的船队可望获得补给；而未曾善待过他们的船队，往往发现同样的海岸对其紧闭，或不得不为每一桶淡水而战。"
 pacific_crossing_events.20.title: "凶悍的海岸"
 pacific_crossing_events.20.desc: "Another island lifts out of the endless southern sea — steep, green, and ringed with reef. This one is inhabited: smoke rises from the trees, and canoes are already pushing off the beach, crowded with figures who paint themselves and carry spears, and who raise a wall of sound across the water that is either welcome or warning. No one aboard can tell which.\n\nThe pilots have never charted this place and cannot name the people who hold it. But the water-casks are low and the men are hungry, and an inhabited island means food, if it can be had. Whether this shore feeds the fleet or turns on it will depend on how the next hour is played."
 pacific_crossing_events.20.a: "远远绕开这座岛屿——此地不宜生事。"
 pacific_crossing_events.20.b: "Stand in and trade — hold up iron and cloth, and hope."
 pacific_crossing_events.20.trade_ok_tt: "岛民放下长矛，欣然进行交易；船只满载食物与淡水归来"
 pacific_crossing_events.20.trade_ambush_tt: "会谈竟是陷阱——独木舟蜂拥围攻船只，船队付出血的代价才杀出重围"
 pacific_crossing_events.20.c: "以武力登陆，强取岛上所有。"
 pacific_crossing_events.20.raid_win_tt: "登陆行动将岛民逼退回丛林，并夺走了他们的存粮"
 pacific_crossing_events.20.raid_lose_tt: "岛民为保卫家园殊死抵抗，袭击者被打得溃不成军，仓皇退回船上"
 pacific_crossing_events.21.title: "败退"
 pacific_crossing_events.21.desc: "Week after week the fleet claws east, and week after week the sea sets back everything we have gained. The trade wind never slackens and never shifts; it stands square on the bows like a wall, and the current beneath runs the same way, carrying the ships west faster by night than they make east by day. The pilots take their sightings, compare them, and fall silent — the line on the chart has stopped moving forward, and begun to slide back.\n\nThere is no arguing with it — a treadmill, not a passage, and every day spent on it costs water and lives for nothing. The only course left is the bitter one: come about, run before the wind that has defeated them, and carry the fleet back to the Spice Islands to think again."
 pacific_crossing_events.21.a: "无法强渡这片海洋。"
 pacific_crossing_events.22.title: "水手的请愿"
 pacific_crossing_events.22.desc: "Every day, the provisions are failing at a faster rate than the number of miles we advance. The water is short and foul, the biscuits are gone to dust, and the sick list grows longer every morning. A delegation of the older hands comes aft — not in mutiny, not yet, but with the flat conviction of men who can count barrels. They have done the arithmetic of the voyage, and it does not come out in their favor. Turn back, they say, while there is still enough in the hold to reach a known shore. Press on, and they will bury the fleet in this ocean.\n\nThere is logic in what they say, however unwelcome it is to hear."
 pacific_crossing_events.22.a: "听从他们，命船队折返香料群岛。"
 pacific_crossing_events.22.b: "拒绝。我们已走得太远，绝不能就此回头。"
 pacific_crossing_events.23.a: "介入平息这场斗殴。"
 pacific_crossing_events.23.b: "把带头闹事者扔下船去，一了百了。"
 pacific_crossing_events.23.break_up_lose_tt: "混战演变成血腥场面后秩序才得以恢复"
 pacific_crossing_events.23.break_up_win_tt: "斗殴在真正见血之前被平息了"
 pacific_crossing_events.23.c: "听从他们，命船队折返香料群岛。"
 pacific_crossing_events.23.overboard_tt: "带头闹事者被抓住，未经任何仪式便被扔入大海。船员们在冷冷的沉默中目睹了一切"
 pacific_crossing_events.23.title: "甲板上的血"
 pacific_crossing_events.24.a: "命你的船靠近协助救火。"
 pacific_crossing_events.24.b: "保持距离，让他们自己解决。"
 pacific_crossing_events.24.caught_fire_tt: "火星跃过间隙，己方船只也随之起火"
 pacific_crossing_events.24.distance_tt: "那艘船燃烧至水线以下，舰队则在安全距离外袖手旁观"
 pacific_crossing_events.24.saved_tt: "多出的人手及时将火焰扑灭，阻止了火焰蔓延"
 pacific_crossing_events.24.title: "海上大火"
 pacific_crossing_events.25.a: "登船支援忠诚的船员。"
 pacific_crossing_events.25.b: "保持距离，让他们自行解决。"
 pacific_crossing_events.25.c: "听从他们的意见，命舰队折返香料群岛。"
 pacific_crossing_events.25.distance_tt: "叛乱者趁机将那艘船夺走，来不及采取任何行动"
 pacific_crossing_events.25.loyal_lose_tt: "叛乱者击退了登船的人手，夺取了那艘船"
 pacific_crossing_events.25.loyal_win_tt: "忠诚派获胜，船上秩序得以恢复"
 pacific_crossing_events.25.title: "船上叛乱"
 pacific_crossing_events.26.a: "听取他们的诉求，做出一些小让步。"
 pacific_crossing_events.26.b: "再次驳回他们，继续前行。"
 pacific_crossing_events.26.title: "再度请愿"
 pacific_crossing_events.27.a: "彻查此事，揪出元凶。"
 pacific_crossing_events.27.b: "加派守夜，不问缘由，继续前行。"
 pacific_crossing_events.27.culprit_found_tt: "元凶被查获，并当着全体船员的面受到惩戒，以儆效尤"
 pacific_crossing_events.27.culprit_free_tt: "调查一无所获，在停止追查之前，破坏者再次得手"
 pacific_crossing_events.27.no_investigation_tt: "守夜虽已加派，但货舱的损失已成事实"
 pacific_crossing_events.27.title: "夜间的破坏"
