l_simp_chinese:
 steppe_embassy_events.1.title: "Embassy to the Steppe Courts"
 steppe_embassy_events.1.desc: "The embassy departs. The Great $rank_kingdom_horde_ruler_suffix_male$'s court lies many months to the east, across deserts and grasslands that stretch without end."
 steppe_embassy_events.1.desc.glh: "$steppe_embassy_events.1.desc$ [dest_city.GetName]: jewel of the Volga steppe, seat of the [dest_country.GetName]'s $rank_kingdom_horde_ruler_suffix_male$. The road runs northeast through the [ShowAreaName('black_sea_area')] ports and into the open grasslands. How [target_leader.GetName] presents [target_leader.GetHimHerself] at the [dest_country.GetAdjectiveWithNoTooltip] [dest_country.GetGovernment.GetCourtTitle] will determine everything."
 steppe_embassy_events.1.desc.chg: "$steppe_embassy_events.1.desc$ [dest_city.GetName]: ancient city of the Silk Road, capital of [dest_country.GetName]. The road runs through [ShowRegionName('persia_region')] and across the mountains into the heart of [ShowContinentName('asia')]. How [target_leader.GetName] presents [target_leader.GetHimHerself] at the [dest_country.GetAdjectiveWithNoTooltip] [dest_country.GetGovernment.GetCourtTitle] will determine everything."
 steppe_embassy_events.1.a: "Ride as warriors, our strength is the only letter we need."
 steppe_embassy_events.1.b: "A lavish embassy: [ShowGoodsNameWithNoTooltip('silver')], [ShowGoodsNameWithNoTooltip('silk')], and ceremony, enough to impress even a Great [dest_country.Custom('GetRulerOrRegentTitle')]."
 steppe_embassy_events.1.c: "A modest trade delegation: practical, respectful, and with gifts enough to open doors."
 steppe_embassy_events.1.historical_info: "Direct diplomatic contact with the Mongol successor states was a recurring ambition of European and Middle Eastern rulers throughout the 14th century. Western embassies to the Ilkhanate, Golden Horde, and other courts ranged from lavish ceremonial missions to practical trading ventures, each shaped by what the sender hoped to gain."
 steppe_embassy_events.2.title: "At the Edge of the Steppe"
 steppe_embassy_events.2.desc: "The caravan halts at the boundary. Beyond, the land flattens into a sea of grass that stretches to the horizon. Outriders from the [dest_country.GetAdjectiveWithNoTooltip] [dest_country.GetGovernment.GetCourtTitle] have been tracking [target_leader.GetName]'s column for days, watching without approaching. Whatever impression is made here will precede the embassy to the [dest_country.GetGovernment.GetCourtTitle]."
 steppe_embassy_events.2.a: "Advance in formation, banners flying, lances raised. Let them carry word of what they saw."
 steppe_embassy_events.2.b: "Send gifts ahead with a herald and request a formal escort to the [dest_country.GetGovernment.GetCourtTitle]."
 steppe_embassy_events.2.c: "Announce ourselves formally and await their permission to cross."
 steppe_embassy_events.2.historical_info: "The borders of the Mongol successor states were permeable but watched. Merchants, diplomats, and missionaries all passed through, but arrival without proper introduction could be taken as an insult or a threat."
 steppe_embassy_events.3.title: "Riders on the Horizon"
 steppe_embassy_events.3.desc: "For three days, the same distant silhouettes have shadowed the column: a dozen riders who never approach, never retreat, only watch. The steppe belongs to those who know how to read it. Word will have reached the [dest_country.GetAdjectiveWithNoTooltip] [dest_country.GetGovernment.GetCourtTitle] long before [target_leader.GetName] does."
 steppe_embassy_events.3.a: "Hold the column tight. Let them see our discipline."
 steppe_embassy_events.3.b: "Send a rider forward with an invitation. Perhaps they will join us at the fire."
 steppe_embassy_events.3.historical_info: "Scouting the approach of foreign embassies was standard practice in steppe courts. Information about a visitor's size, equipment, and behavior shaped how they would be received."
 steppe_embassy_events.4.title: "Brigands on the Road"
 steppe_embassy_events.4.desc: "The road narrows through a defile, and armed men block the way — a score of them, ragged but well-armed. Their leader shouts a toll demand in a language [target_leader.GetName] does not speak. The interpreter translates: ten horses or silver to match. They have done this before."
 steppe_embassy_events.4.a: "Pay. A skirmish here could cost more than money."
 steppe_embassy_events.4.b: "Show them we did not come all this way to be robbed by bandits."
 steppe_embassy_events.4.historical_info: "The great steppe roads were never truly safe. Even official embassies risked encounters with brigands, rogue soldiers, and opportunists who operated in the gaps between the khans' authority."
 steppe_embassy_events.5.title: "A Merchant's Knowledge"
 steppe_embassy_events.5.desc: "At a [ShowBuildingTypeName('caravanserai')] on the road east, a weathered merchant approaches [target_leader.GetName] over tea. He has been to the [dest_country.GetAdjectiveWithNoTooltip] [dest_country.GetGovernment.GetCourtTitle] five times. He knows which gifts are insulting, which customs must be observed on entering the throne room, and what the [dest_country.Custom('GetRulerOrRegentTitle')] is looking for from foreign visitors this year. He is offering to share everything, for a price."
 steppe_embassy_events.5.a: "Pay for his advice. Knowledge of the [dest_country.GetAdjectiveWithNoTooltip] [dest_country.GetGovernment.GetCourtTitle] is worth more than gold."
 steppe_embassy_events.5.b: "We have read what we needed to read. Thank him and move on."
 steppe_embassy_events.5.historical_info: "The networks of Silk Road merchants were the best intelligence services of the medieval world. A veteran trader who had made the circuit of the great Asian courts multiple times possessed political knowledge unavailable in any European library."
 steppe_embassy_events.6.title: "Audience at [target_location.GetNameWithNoTooltip]"
 steppe_embassy_events.6.desc: "The tents of [target_location.GetName] stretch along the Volga for miles. At the center, the great yurt of [court_host.GetName] shines with [ShowGoodsName('goods_gold')] leaf and [ShowGoodsName('silk')] hangings, surrounded by the courts of a dozen subject princes and the permanent apparatus of a world empire. [target_leader.GetName] is received in the outer hall and shown to a position three rows back from the throne, which is precisely where the servants of a minor foreign power belong. [court_host.GetNameWithNoTooltip] looks on with the patient disinterest of a man who has received a hundred such embassies."
 steppe_embassy_events.6.a: "Challenge their riders to a display of arms in the open field."
 steppe_embassy_events.6.b: "Present the gifts with all the ceremony the occasion demands."
 steppe_embassy_events.6.c: "Propose the opening of a trade route through [court_country.GetNameWithNoTooltip]'s territory."
 steppe_embassy_events.6.d: "Draw on what we learned on the road: the customs, the protocols, the particular interests of this [court_country.GetGovernment.GetCourtTitle]."
 steppe_embassy_events.6.historical_info: "The Golden Horde maintained an elaborate court culture that blended Mongol tradition with Persian administrative sophistication and a remarkable openness to foreign traders and diplomats. The court at Sarai received embassies from Byzantium, Egypt, and multiple European kingdoms throughout the 14th century."
 steppe_embassy_events.7.title: "Audience at [target_location.GetNameWithNoTooltip]"
 steppe_embassy_events.7.desc: "[target_location.GetName] is not what [target_leader.GetName] expected. The madrasas and minarets tower above streets full of merchants from every corner of the known world. The court of [court_host.GetName] receives the embassy in a hall of blue tile and carved stucco, attended by astronomers, poets, and ambassadors from a dozen eastern powers. [court_host.GetNameWithNoTooltip] sits on a throne inlaid with jade, flanked by secretaries who record everything in [ShowLanguageName('persian_language')] and [ShowLanguageName('mongolian_language')] scripts simultaneously."
 steppe_embassy_events.7.a: "Engage the court scholars in philosophical discussion. [court_host.GetNameWithNoTooltip] has more than armies to offer."
 steppe_embassy_events.7.b: "Present the gifts with all the ceremony the occasion demands."
 steppe_embassy_events.7.c: "Propose a trading arrangement to open the routes through [court_country.GetNameWithNoTooltip]."
 steppe_embassy_events.7.d: "Apply what we learned from the merchant's guidance about this [court_country.GetGovernment.GetCourtTitle]'s particular customs."
 steppe_embassy_events.7.historical_info: "Samarkand under the Chagatai Khanate and later the Timurids became one of the greatest centers of Islamic learning and commerce in the world. The court was sophisticated and cosmopolitan, and foreign embassies were expected to demonstrate cultural as well as political credibility."
