l_simp_chinese:
 grand_embassy.2.title: "大使团抵达[ROOT.GetCountry.GetCapital.GetNameWithNoTooltip]"
 grand_embassy.2.desc: "A grand embassy has arrived from [from.GetName] led by [target_ruler.GetName] [target_ruler.GetHerselfHimself]. [target_ruler.GetSheHe|U] is touring [ShowSubContinentName('western_europe')] in order to secure better relations with its states — especially those who share common enemies. How should we greet [target_ruler.GetHerHim]?"
 grand_embassy.2.a: "Invite [target_ruler.GetHerHim] to stay."
 received_grand_embassy: "接待大使团"
 grand_embassy.2.b: "Politely turn [target_ruler.GetHerHim] away."
 rejected_grand_embassy: "拒绝大使团"
 grand_embassy.2.c: "把[target_ruler.GetHerHim]赶走！"
 grand_embassy.3.title: "大使团在[ROOT.GetCountry.GetCapital.GetNameWithNoTooltip]"
 grand_embassy.3.desc: "Overwhelmed by our warm welcome, [target_ruler.GetName] has informed us that [target_ruler.GetSheHe] wishes to extend [target_ruler.GetHerHis] visit in [ROOT.GetCountry.GetCapital.GetName]. In [target_ruler.GetHerHis] quest to modernize the [from.GetLongName], [target_ruler.GetSheHe] is most eager to get a chance to study the technological advancements of [ShowSubContinentName('western_europe')]."
 grand_embassy.3.a: "Invite [target_ruler.GetHerHim] to stay and study our governmental institutions."
 grand_embassy.3.a.tt: "[target_ruler.GetName]将学习我们的政府机构"
 invited_to_study_institutions: "邀请学习机构"
 grand_embassy.3.b: "Invite [target_ruler.GetHerHim] to stay and study our army."
 grand_embassy.3.b.tt: "[target_ruler.GetName]将学习我们的陆军组织"
 grand_embassy.3.c: "Invite [target_ruler.GetHerHim] to stay and study our navy."
 grand_embassy.3.c.tt: "[target_ruler.GetName]将学习我们的海军组织。"
 grand_embassy.3.d: "[target_ruler.GetSheHe|U] has overstayed [target_ruler.GetHerHis] welcome..."
 grand_embassy.4.title: "大方挽留"
 grand_embassy.4.desc: "在得知[target_ruler.GetName]希望在[ROOT.GetCountry.GetLongName]推行革新后，[embassy_country.GetName]方面慷慨地决定邀请我们在[embassy_country.GetCapital.GetName]多留几天，方便使团深入了解该国技术进展。"
 grand_embassy.4.a: "Let us stay and study [target_institution.GetNameWithNoTooltip]."
 grand_embassy.4.b: "Let us stay and study their army."
 grand_embassy.4.c: "Let us stay and study their navy."
 grand_embassy.4.d: "No, we have other countries to visit."
 grand_embassy.4.e: "The time has come to return home."
 grand_embassy.5.title: "逗留请求遭拒"
 grand_embassy.5.desc: "为了使[ROOT.GetCountry.GetName]迈向现代化，研习[ShowSubContinentName('western_europe')]先进科技的机会可谓弥足珍贵。遗憾的是，我们的使团逗留[embassy_country.GetCapital.GetName]的请求遭到拒绝。"
 grand_embassy.5.a: "Very well, we have other countries to visit."
 grand_embassy.5.b: "The time has come to return home."
 grand_embassy.6.title: "延长访问时间的回报"
 grand_embassy.6.desc: "[target_ruler.GetName]延长访问[embassy_country.GetCapital.GetName]时间以亲自学习他们的技术革新，这取得了丰厚的收获。"
 grand_embassy.6.a: "我们的政府架构会从中受益！"
 grand_embassy.6.b: "我们的陆军会从中受益！"
 grand_embassy.6.c: "我们的海军会从中受益！"
 grand_embassy.7.title: "大使团访问成果丰硕"
 grand_embassy.7.desc: "访问[embassy_country.GetCapital.GetName]使我国获益匪浅，不过是时候继续前行了。唯一的问题是：去哪？"
 grand_embassy.7.a: "We still have other countries to visit."
 grand_embassy.7.b: "The time has come to return home."
 grand_embassy.11.title: "The Embassy Has Been Turned Away"
 grand_embassy.11.desc: "Word has reached [ROOT.GetCountry.GetCapital.GetName] that the [embassy_country.GetGovernment.GetCourtTitle] at [embassy_country.GetCapital.GetName] has refused to receive [target_ruler.GetName] and the delegation. No reason has been given that the chronicler considers worth recording. The embassy's standing is reduced by the rebuff; the embassy itself, however, is not yet at an end."
 grand_embassy.11.a: "Try our luck at another court."
 grand_embassy.12.title: "The Embassy Has Been Insulted"
 grand_embassy.12.desc: "Word has reached [ROOT.GetCountry.GetCapital.GetName] that the [embassy_country.GetGovernment.GetCourtTitle] at [embassy_country.GetCapital.GetName] has not merely refused to receive [target_ruler.GetName] but has done so in terms that no chronicler will repeat in print. The casus belli is registered. Whether to press it now, or to continue the journey and address the matter later, is for the [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] to decide."
 grand_embassy.12.a: "There are other courts. Press on."
 grand_embassy.1.a: "按寻常方式筹备使团。"
 grand_embassy.1.a.tt: "寻常的筹备，寻常的保密（谨慎：55）"
 grand_embassy.1.b: "格外用心，确保真正的隐秘。"
 grand_embassy.1.b.tt: "格外用心换来真正的匿名（谨慎：75）"
 grand_embassy.1.c: "派出佯装的使团作为掩护。"
 grand_embassy.1.c.tt: "疑兵之计能扰乱追查（谨慎：95）"
 grand_embassy.1.desc: "使团启程之前，我们必须决定它的样貌。一位在宴席与守卫森严的馆舍间被款待的君主，看到的不过是主人愿意展示的东西；作坊、船坞与操练场，都不会向贵宾敞开。[figurehead.GetName] 将作为使团的公开门面出行，而 [target_ruler.GetName] 则隐没在随行人员之中，不为人所注意。为保持这一点，我们该做到何种地步？"
 grand_embassy.1.title: "筹备使团"
 grand_embassy.10.a: "记下他们的方法。"
 grand_embassy.10.b: "付费详尽了解他们的技艺。"
 grand_embassy.10.c: "支付全面调查的费用，并留下来精通此道。"
 grand_embassy.10.desc: "[embassy_country.GetCapital.GetName] 的一群文书热衷于统计一切事物：出生、收成、入港船只，乃至面包一周又一周的价格。他们的账簿堆满了整个书架，每一栏都标注日期并与前次对照，直到这些数字本身开始诉说出任何编年史家都无法讲述的故事。他们的年鉴声称能比任何编年史都更真实地展现一个国家，仅凭他们才能察觉的规律，便能预测饥荒与丰年。只要付费，他们便愿意向任何有耐心听完这套算术的人讲解其方法。"
 grand_embassy.10.title: "年鉴编纂者"
 grand_embassy.11.b: "付钱请那位廷臣详加讲解。"
 grand_embassy.11.c: "付清全部学费，并留下来精通此道。"
 grand_embassy.12.b: "出资谋求加入这个圈子。"
 grand_embassy.12.c: "出资全额加入，并留下来精通此道。"
 grand_embassy.13.a: "观看铸造过程。"
 grand_embassy.13.b: "付钱请铸造工头讲解这门技艺。"
 grand_embassy.13.c: "付清全部费用，并留下来精通这门技艺。"
 grand_embassy.13.desc: "[embassy_country.GetName] 的铸炮工坊以我方炮匠愿不惜重金求知的方法铸造火炮：合金的配比、模具的形状、冷却的时机，无一不精。炉口热浪蒸腾，工人们在熔融的金属间穿梭自如，那份从容并非仅凭技艺，更源于经年累月的熟稔。那位满身汗渍、显然以此为傲的铸造工头，愿意收费详加讲解，而且似乎最乐于见到真正懂行的观众。"
 grand_embassy.13.title: "铸造车间"
 grand_embassy.14.a: "观看操练。"
 grand_embassy.14.b: "付钱给教官，以求看得更仔细。"
 grand_embassy.14.c: "付清教官全部酬金，留下来彻底学会这套操练。"
 grand_embassy.14.desc: "在 [embassy_country.GetCapital.GetName] 城外的操练场上，各连队步调一致地转向、装填，速度之快远非我国任何一支征召兵所能企及，皮靴踏在夯实的地面上，节奏始终不曾错乱。军官们高声下令，队列几乎在话音未落之际便已应声而动，整个方阵如同一个整体在移动，而非百来个各自为战的士兵。一位教官因我们的关注而颇感荣幸，主动提出要将全套操练从头至尾演示一遍，从第一声号令直至最后一轮齐射。"
 grand_embassy.14.title: "操练场"
 grand_embassy.15.a: "奉上惯例的礼物。"
 grand_embassy.15.b: "奉上更为丰厚的礼物。"
 grand_embassy.15.desc: "负责安排我们觐见事宜的内侍悄悄透露，一份恰到好处的礼物能打通不少门路，某些名单上的某些名字，一旦银钱易手，往往就会“恰巧”被遗忘。他提起此事时轻描淡写，仿佛只是在谈论天气，同时留意我们是否领会其意。这在任何宫廷都不算稀奇之事，只是价码往往会随着开口而水涨船高。"
 grand_embassy.15.title: "耳边的一句话"
 grand_embassy.16.a: "雇用这位中间人。"
 grand_embassy.16.b: "雇用这位中间人，另付一笔钱换他守口如瓶。"
 grand_embassy.16.desc: "一位靠为外国来客疏通关节谋生的中间人主动献上服务，声称自此地到边境沿途的每一处哨所与关卡都有他的门路。他说话时字斟句酌，话说一半便止住，从不明言究竟是谁欠他人情，只说确有此事。只需付一笔费用，他便能设法让人少问些代表团去向何处、所为何事这类问题，即便被追问，答案也自会含糊得恰到好处。"
 grand_embassy.16.title: "谨慎的中间人"
 grand_embassy.17.a: "如今已无可挽回。"
 grand_embassy.17.b: "花钱平息这个流言。"
 grand_embassy.17.desc: "我方随行人员中有一人，在酒馆里喝得酩酊大醉，为讨一桌陌生人的欢心，把这个使团究竟由谁真正主事的事说漏了嘴，说得比该说的多得多。到了早晨他自己都不记得说过什么，但酒馆老板记得清清楚楚，邻桌喝酒的人也都听在耳里。流言已然在仆役们中间传开，人人添油加醋地转述，仿佛这是桩太诱人而舍不得藏着的秘密。"
 grand_embassy.17.title: "祸从口出"
 grand_embassy.18.a: "但愿他能守口如瓶。"
 grand_embassy.18.b: "找到他，付钱让他保持沉默。"
 grand_embassy.18.desc: "一位多年前曾在 [ROOT.GetCountry.GetName] 经商的商人，那时境况尚且顺遂，如今在街头与使团擦肩而过，脚步骤然一顿，直勾勾地盯着 [target_ruler.GetName] 的面容看了片刻，随即一言不发地匆匆离去。他脸上闪过的神情绝无可能认错：那不是无心的好奇，而是猝然而惊的相认。他清楚自己看到了谁，至于他是否会将这份认知烂在肚子里，则完全不在我们的掌控之中。"
 grand_embassy.18.title: "街头相认"
 grand_embassy.19.a: "尽量少作回答。"
 grand_embassy.19.b: "付他足够的钱，让他打消疑问。"
 grand_embassy.19.desc: "接待使团的旅店老板疑问太多，每一句都问得漫不经心，仿佛他早已料到答案关系重大：为何如此华贵的随从队伍打扮得如此朴素，为何银钱总是备得妥当却从不重复清点，为何一行人被问及来意时都不太敢直视他的双眼。他尚未起疑，只是好奇，把这些细小的反常在心里翻来覆去地琢磨，就像人们翻看一枚钱币，查看它是否被削了边。这份耐心恐怕不会持续太久。"
 grand_embassy.19.title: "好奇的旅店老板"
 grand_embassy.2.a_no_figurehead: "让 [target_ruler.GetShortNameWithNoTooltip] 留在随行人员之中。"
 grand_embassy.2.desc.inland: "使团已抵达 [embassy_country.GetCapital.GetName]。我们此行所求，是获准进入作坊与操练场，一睹 [embassy_country.GetName] 的工匠与教官们如何已经重塑了其贸易与军队。我们在 [embassy_country.GetGovernment.GetCourtTitle] 面前如何自处，将决定他们究竟愿意向我们展示多少。"
 grand_embassy.2.desc.port: "使团已抵达 [embassy_country.GetCapital.GetName]。我们此行所求，是获准进入船坞与兵工厂，一睹 [embassy_country.GetName] 如何建造那使其在海上保持领先的舰队。我们在 [embassy_country.GetGovernment.GetCourtTitle] 面前如何自处，将决定他们究竟愿意向我们展示多少。"
 grand_embassy.20.a: "覆水难收，无法追回。"
 grand_embassy.20.b: "不惜重金，将其寻回并付之一炬。"
 grand_embassy.20.desc: "一封本该寄回国内的信件，直白地写明了 [target_ruler.GetName] 的身份，并且详述了使团的真实目的，其详尽程度远超谨慎所能容许，如今却在信使与船只之间不知所踪。既无勒索信随后送来，也无任何指控，甚至连它去向何处的一丝线索都没有——这份沉寂本身，反倒比事情败露更令人不安。它究竟落到了何处，谁读过它，得知内情之人又打算如何行事，我们都无从知晓。"
 grand_embassy.20.title: "一封被截获的信"
 grand_embassy.21.a: "耐着性子坐完全场。"
 grand_embassy.21.b: "悄悄离开，去看些更有用的东西。"
 grand_embassy.21.desc: "[embassy_country.GetGovernment.GetCourtTitle] 为使团举办了一场盛宴，祝酒、献礼、演说轮番上演，足以耗尽整整一日，每一道菜肴都比上一道更为精致，仿佛各个厨房都在暗自较劲。每一道菜都必须称赞，每一次祝酒都需以礼相还，每一位滔滔不绝的贵人都得听他讲完，哪怕他实际上言之无物。婉拒便是失礼；出席则意味着整整一天都要耗在繁文缛节与满桌佳肴之中。"
 grand_embassy.21.title: "为我们举办的宴会"
 grand_embassy.22.a: "顺从指引，照常参观。"
 grand_embassy.22.b: "以贵宾身份坚持要求参观更多。"
 grand_embassy.22.desc: "[embassy_country.GetGovernment.GetCourtTitle]指派了一名官员，全程陪同使团的一举一动：和颜悦色，不知疲倦，铁了心只让我们看花园与画廊，无论我们如何委婉地请求参观别处。他对每个问题都早有说辞，对每次沉默都备好话头，总能把话题引回喷泉与壁画，只要谈话稍稍偏向有用的方向。任凭我们百般询问，那些作坊依旧不得其门而入。"
 grand_embassy.22.title: "指派的陪同"
 grand_embassy.23.a: "耐着性子，礼貌应付。"
 grand_embassy.23.b: "不顾体面，径直中断觐见。"
 grand_embassy.23.desc: "与一名小官的觐见拖了数个时辰：客套话来回，礼物受人称赞，却始终未提正事，那寥寥几句寒暄换着顺序反复重复，直到失去一切意义。他似乎丝毫不急，享受外来访客的关注，远胜于讨论任何实质内容。等到觐见终于结束，做正事的时机早已错过。"
 grand_embassy.23.title: "冗长的觐见"
 grand_embassy.24.a: "付钱让管家从轻记录。"
 grand_embassy.24.b: "付钱让管家彻底销去记录。"
 grand_embassy.24.desc: "负责记录府中日常事务的管家旁敲侧击地暗示——那是老手才有的谨慎方式——只要给予适当的酬谢，有几个名字大可不必记录在案。他没有直言相求，只让沉默替他开口，耐心等着我们把话接上。"
 grand_embassy.24.title: "通情达理的管家"
 grand_embassy.25.a: "悄悄散些银钱打点。"
 grand_embassy.25.b: "散尽大量钱财打点各方。"
 grand_embassy.25.desc: "一支来自小国宫廷的使团，几乎与我们同时抵达，因其张扬招摇、毫不掩饰，反倒更惹人议论，成了闲谈的好话题。若在恰当的仆从间散布些许银钱，便可让这情形持续下去，把闲言碎语都引向他们的行踪，而非我们的。"
 grand_embassy.25.title: "转移视线的流言"
 grand_embassy.26.a: "雇用这位向导。"
 grand_embassy.26.b: "雇用这位向导，并额外付钱以求万全。"
 grand_embassy.26.desc: "一位当地向导深谙哪些街巷门户可避人耳目，哪些时辰守卫会睁一只眼闭一只眼，他愿带领使团悄然往来，不为人知。他不问我们为何需要如此谨慎，只问此事值多少酬劳。"
 grand_embassy.26.title: "无声的护送"
 grand_embassy.3.desc.aware: "[ROOT.GetCountry.GetGovernment.GetCourtTitle] 已悄然查明这支使团中真正随行的是何人。若公然揭穿 [target_ruler.GetName] 的身份，只会令双方都难堪；然而能款待一位甘愿放下身段、乔装前来学习 [ROOT.GetCountry.GetName] 诸般奇迹的君主，本身也是莫大的荣耀。看来，谨慎从来都是双向的。"
 grand_embassy.3.desc.unaware: "一支来自 [from.GetName] 的使团抵达了 [ROOT.GetCountry.GetGovernment.GetCourtTitle]，据他们自称，不过是些不起眼的旅人，渴望见识 [ROOT.GetCountry.GetName] 是如何治国理政的。我们该让他们进入我们的作坊与各类机构，还是打发他们离去？"
 grand_embassy.3.e: "如此重要的宾客，理应毫无阻碍地一睹我们的奇观。"
 grand_embassy.3.f: "[target_ruler.GetShortNameWithNoTooltip]，我们认得你，此地不欢迎你。"
 grand_embassy.5.c: "在 [target_2.GetNameWithNoTooltip] 寻求更热忱的接待。"
 grand_embassy.5.d: "[target_3.GetNameWithNoTooltip] 或许会更为好客。"
 grand_embassy.5.e: "不如转而在 [target_4.GetNameWithNoTooltip] 碰碰运气。"
 grand_embassy.5.f: "仍有 [target_5.GetNameWithNoTooltip] 可以拜访。"
 grand_embassy.7.c: "改道前往 [target_2.GetNameWithNoTooltip] 。"
 grand_embassy.7.d: "将目标定在 [target_3.GetNameWithNoTooltip] 。"
 grand_embassy.7.e: "仍有 [target_4.GetNameWithNoTooltip] 尚待造访。"
 grand_embassy.7.f: "将使团转向 [target_5.GetNameWithNoTooltip]。"
 grand_embassy.8.a: "我们必须立刻回国。"
 grand_embassy.8.b: "尚待学习的东西，值得这个代价。"
 grand_embassy.8.desc: "消息传到使团：国内出了乱子。[target_ruler.GetName]仍在国外，[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]与[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]都想知道，为何他们的[ROOT.GetCountry.GetGovernment.GetRulerTitle]迟迟不见踪影。此刻缩短行程归国，便是空手而回；继续留在此地，则要再忍受一阵子的缺席之治。"
 grand_embassy.8.title: "国内的麻烦"
 grand_embassy.9.a: "记下这套方法。"
 grand_embassy.9.b: "付费详细研习这些登记簿。"
 grand_embassy.9.c: "付费查阅所有账簿，并留下来彻底掌握它们。"
 grand_embassy.9.desc: "在 [embassy_country.GetName] ，一位账目管理人向我们讲解维系国库运转的账簿与税册。他那沾满墨迹的手指毫不迟疑地划过每一栏，总数似乎从不说谎。每一笔款项都记录两次，一次记应收，一次记已付，以确保没有一枚硬币能悄然溜走，并在周末之前将账目与港口的货单核对一致。对于那些愿意付费占用管理人时间、并有耐心跟随其方法直至学成的人，还有更多可学之处。"
