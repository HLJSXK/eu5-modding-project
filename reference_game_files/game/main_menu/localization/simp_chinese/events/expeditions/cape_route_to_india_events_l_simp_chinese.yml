l_simp_chinese:
 # ── Event 1: Departure ──────────────────────────────────────────────────────
 cape_route_to_india_events.1.title: "舰队启航"
 cape_route_to_india_events.1.desc: "Our waters have not seen a fleet like this in a generation. Four ships, a hundred and seventy men, enough [ShowGoodsName('salt')], [ShowGoodsName('fish')], and hard biscuit for years — and orders from [ROOT.GetCountry.GetGovernment.GetRulerOrRegent.GetName] [ROOT.GetCountry.GetGovernment.GetRulerOrRegent.GetHerselfHimself] to find the sea road to $india$. Priests bless the hulls. The crowd presses to the water's edge. Some are weeping.\n\n[target_leader.GetName] stands at the prow as the ships clear the bar and meet the open [ShowContinentName('atlantic_ocean_continent')]. Behind [target_leader.GetHerHim], the harbor dwindles to a white smear on a green hill. Before [target_leader.GetHerHim], the ocean extends without boundary in every direction. [target_leader.GetSheHe|U] has done the calculations. [target_leader.GetSheHe|U] knows what the voyage requires. Whether that is enough remains, as always, in the hands of [ROOT.GetCountry.GetReligion.GetGodName]."
 cape_route_to_india_events.1.a: "若 [ROOT.GetCountry.GetReligion.GetGodName|U] 保佑，我们定能满载香料归来。"
 cape_route_to_india_events.1.b: "让我们先行祈祷，随后全速启航。"
 cape_route_to_india_events.1.historical_info: "葡萄牙寻找通往 $india$ 海路的远征，是近一个世纪以来沿非洲海岸逐步向南探索的集大成之举。巴尔托洛梅乌·迪亚士曾于1488年绕过好望角，证明此路可行。瓦斯科·达伽马在1497年至1499年的航行完成了这一使命，带回的胡椒与香料所获利润高达远征成本的六十倍。此次航行彻底改变了全球香料贸易格局，打破了威尼斯人与奥斯曼人对陆路贸易的垄断。"
 # ── Event 2: Cabo Verde ──────────────────────────────────────────────────────
 cape_route_to_india_events.2.title: "The [ShowProvinceDefinitionNameWithNoTooltip('cape_verde_province')] Islands"
 cape_route_to_india_events.2.desc: "Ten volcanic islands rising from a flat and featureless sea: that is the [ShowProvinceDefinitionName('cape_verde_province')] archipelago. The fleet knew to expect them, and still they come as a relief — solid ground after weeks of open ocean. The governor's residence at [ShowLocationName('santiago')] is a modest affair of whitewashed stone. The harbor smells of salt and dried fish and, faintly, of the orchil lichen scraped from the rocks for dye.\n\n[target_leader.GetName] weighs the choice. [ROOT.GetCountry.GetName] has held these islands for decades, but 'held' is a generous word — a small garrison, a few settlers, an annual supply ship. If this route is to mean anything to [ROOT.GetCountry.GetNameWithNoTooltip]'s future, the islands need to be more than a rest stop."
 cape_route_to_india_events.2.a: "Invest here — expand the settlement that anchors our southern route."
 cape_route_to_india_events.2.b: "补给淡水与物资，然后继续航行。"
 cape_route_to_india_events.2.c: "继续前行——如此早就逗留，我们承担不起。"
 cape_route_to_india_events.2.d: "返航回国。"
 cape_route_to_india_events.2.historical_info: "佛得角群岛由葡萄牙航海家于约1456年发现，并自1462年起永久定居。由于其地处大西洋、恰好承接东北信风的地理位置，这里成为通往南美洲及绕行非洲航线不可或缺的中转站。瓦斯科·达伽马的航行证实印度洋航路可行后，其战略地位进一步大幅提升。到十六世纪，这里已成为大西洋奴隶贸易的重要枢纽。"
 # ── Event 3: São Tomé ────────────────────────────────────────────────────────
 cape_route_to_india_events.3.title: "[ShowLocationNameWithNoTooltip('sao_tome')]岛"
 cape_route_to_india_events.3.desc_common: "海岸线尚未显现，酷热便已先行宣告其存在：舰队一越过赤道，一堵潮湿而令人窒息的热浪便骤然笼罩甲板，令水手们在从未转凉的空气中喘息不已。 [ShowLocationName('sao_tome')] 自晨雾中浮现，宛如一顶深绿色的王冠，两座山峰云雾缭绕，瀑布在密不透光的丛林间蜿蜒而下。"
 cape_route_to_india_events.3.desc: "$cape_route_to_india_events.3.desc_common$\n\nA small settlement clings to the western shore. The soil here, the settlers say, is extraordinarily rich. Anything planted grows. A man could make a fortune in sugar on this island, if he had the labor to work it."
 cape_route_to_india_events.3.desc.uninhabited: "$cape_route_to_india_events.3.desc_common$\n\nNo smoke rises from any shore. No boat waits in any cove. The island is empty of people entirely — the fleet's boats are the first to touch this beach. And yet the soil, where the jungle can be cut back, is black and deep and endlessly fertile. A man could make a fortune in sugar on an island like this, if he had the labor to work it — and if the fevers of the equator did not take him first."
 cape_route_to_india_events.3.desc.foreign: "$cape_route_to_india_events.3.desc_common$\n\nA settlement already clings to the western shore, beneath a flag that is not ours — wharves, a chapel, the first raw cane-fields of a rival crown that reached this fertile island ahead of [ROOT.GetCountry.GetName]. The soil is every bit as rich as the stories promised, but it is already spoken for. Whatever we want of [ShowLocationNameWithNoTooltip('sao_tome')] must now be taken, or bargained, from another's hand."
 cape_route_to_india_events.3.a: "Establish a trading post — this island's potential is worth the investment."
 cape_route_to_india_events.3.b: "Plant a #italic padrão#! on the high point and claim the island formally."
 cape_route_to_india_events.3.c: "补充淡水，继续南航。"
 cape_route_to_india_events.3.d: "返航回国。"
 cape_route_to_india_events.3.historical_info: "1470年前后葡萄牙航海家抵达时，圣多美岛尚无人居住。其赤道气候对欧洲移民而言极为致命——疾病死亡率居高不下——却极其适宜种植甘蔗。到1520年代，圣多美已成为世界最大的蔗糖产地，几乎全靠被奴役的非洲人劳作。此后该岛更成为大西洋奴隶贸易的重要转运枢纽，这一角色延续了两百余年。"
 # ── Event 4: Loango ──────────────────────────────────────────────────────────
 cape_route_to_india_events.4.title: "大河河口"
 cape_route_to_india_events.4.desc: "The ocean turns brown here. The fleet has been watching it happen for a day — the color bleeding into the sea from the south, tea-colored and thick with silt. Then they see the cause: a river wider than any in [ROOT.GetCountry.GetName], wider than any river any of these men has seen, emptying into the [ShowContinentName('atlantic_ocean_continent')] in a brown torrent that stains the sea for kilometers in every direction.\n\nFrom out of the mangrove fringe, dugout canoes emerge. They are enormous — hollowed from a single trunk, thirty feet long, paddled by a dozen men in perfect unison. The men standing in the bows are not armed. They are watching the fleet with the composed curiosity of people who have never been afraid of strangers."
 cape_route_to_india_events.4.a: "Seek an audience with the great king of this land."
 cape_route_to_india_events.4.b: "Trade for [ShowGoodsNameWithNoTooltip('ivory')], [ShowGoodsNameWithNoTooltip('copper')], and whatever else they will offer."
 cape_route_to_india_events.4.c: "Chart the river mouth and press south — we must not be delayed."
 cape_route_to_india_events.4.d: "返航回国。"
 cape_route_to_india_events.4.historical_info: "刚果王国是撒哈拉以南非洲最为发达的政治实体之一，其领土涵盖今日刚果、安哥拉与加蓬的大部分地区。马尼刚果（国王）通过等级分明的官僚体系进行统治，并维持着一套完善的行省治理制度。葡萄牙传教士于1480年代与该王国建立联系，开启了一段对双方而言都极具变革性——最终也极为惨烈——的关系。该王国于1490年代皈依基督教，马尼刚果取教名若昂一世。"
 # ── Event 5: Luanda ──────────────────────────────────────────────────────────
 cape_route_to_india_events.5.title: "The Bay of [ShowLocationNameWithNoTooltip('luanda')] 湾"
 cape_route_to_india_events.5.desc: "Every officer on the expedition recognizes it the moment they see it. None of the sailors have seen a harbor like this anywhere along the African coast: a long curved bay sheltered from the south-west by a natural sandspit, deep water close to shore, and behind it a low promontory with commanding views in every direction. The local fishermen call it Loanda — the flat place.\n\n[target_leader.GetName] walks the length of the sandspit in the afternoon light, the bay on one side and the open [ShowContinentName('atlantic_ocean_continent')] on the other. [target_leader.GetSheHe|U] is already thinking about walls. About fresh water. About the number of ships a garrison here could protect — or intercept. A town built here could command the entire southern Atlantic trade."
 cape_route_to_india_events.5.a: "在此建造一座大型 [ShowBuildingTypeNameWithNoTooltip('por_feitoria')] ——无与伦比。"
 cape_route_to_india_events.5.b: "建立一座小型商站与一处补给仓库。"
 cape_route_to_india_events.5.c: "Note its position carefully on the charts and continue south."
 cape_route_to_india_events.5.d: "返航回国。"
 cape_route_to_india_events.5.historical_info: "1575年，保罗·迪亚斯·德诺瓦伊斯正式将罗安达设立为葡萄牙殖民地，使其成为撒哈拉以南非洲最古老的欧洲人定居点之一。凭借天然良港，罗安达在此后四百多年间一直是葡属安哥拉的主要港口。自十六世纪起，罗安达成为南部非洲跨大西洋奴隶贸易的主要出发港，将数以百万计的被奴役者运往巴西与加勒比地区。"
 # ── Event 6: Walvis Bay ──────────────────────────────────────────────────────
 cape_route_to_india_events.6.title: "荒漠海岸"
 cape_route_to_india_events.6.desc: "The desert comes to the sea here, red dunes rising directly from the surf-line, their crests streaming sand into the air. There are no trees. There is no fresh water visible. The coast to the north — the men are already calling it the [ShowProvinceDefinitionName('skeleton_coast_province')], for the whale bones bleaching on the beach — shows no sign of human habitation for hundreds of miles in any direction.\n\nAnd yet the bay is calm. Sheltered from the worst of the swells, it offers the fleet a chance to repair a damaged mast and refill the water from a brackish spring in the dunes. On the headland above, the ship's navigator is measuring the angle of the sun with his instruments and making notes. The Cape, he says, is no more than a week's sailing to the south. Some of the men cross themselves."
 cape_route_to_india_events.6.a: "Rally the men — the Cape of Good Hope lies within reach. Forward!"
 cape_route_to_india_events.6.b: "These currents and winds tell a navigator much — let me read them."
 cape_route_to_india_events.6.c: "Let the men rest here. They will need strength for the storms ahead."
 cape_route_to_india_events.6.d: "返航回国——此地荒凉至极，不宜再往前推进。"
 cape_route_to_india_events.6.historical_info: "纳米比亚海岸被葡萄牙水手称为 #italic Costa dos Esqueletos#!（骷髅海岸），因当地遍布鲸骨与海豹骨，也因强劲的西南风常将船只吹上背风的海岸而屡屡失事。沃尔维斯湾由荷兰人命名为 #italic Walvischbaai#!（鲸鱼湾），是这段险恶海岸线上少有的可供庇护的锚地之一。巴尔托洛梅乌·迪亚士于1488年南航途中曾在此停靠。"
 # ── Event 7: Cape of Good Hope ───────────────────────────────────────────────
 cape_route_to_india_events.7.title: "风暴角"
 cape_route_to_india_events.7.desc: "Nothing in three months of sailing has prepared them for this. The storm arrives without warning, from the south-west, driving before it waves that stand forty feet high. The lead ship disappears into a trough and does not reappear for thirty seconds. Tackle is carried away. Men are knocked from the rigging. [target_leader.GetName] grips the stern rail with both hands and stares at the chaos around [target_leader.GetHerHim], and somewhere in the cacophony of wind and breaking water [target_leader.GetSheHe] understands something: they are through. The Cape — the great southern tip of the African continent, the end of the known world — lies astern.\n\nThe way to $india$ is open."
 cape_route_to_india_events.7.a: "将其命名为好望角，即刻扬帆东进！"
 cape_route_to_india_events.7.b: "在岬角背风处躲避，等风暴过去。"
 cape_route_to_india_events.7.d: "We have done enough — the Cape has been rounded. Turn for home."
 cape_route_to_india_events.7.historical_info: "#italic Bartolomeu Dias#! first rounded the Cape in 1488, naming it #italic Cabo das Tormentas#! (Cape of Storms). According to Portuguese sources, King João II renamed it #italic Cabo da Boa Esperança#! (Cape of Good Hope) to encourage future expeditions, though this account may be apocryphal. The Cape is not the southernmost point of Africa — that distinction belongs to Cape Agulhas, some two hundred kilometers to the east — but it marks the meeting point of the Atlantic and Indian Oceans and the door to the east."
 # ── Event 8: Mossel Bay ──────────────────────────────────────────────────────
 cape_route_to_india_events.8.title: "牧牛人湾"
 cape_route_to_india_events.8.desc: "The bay is calm and beautiful, sheltered from the south-west by a low headland. Milkwood trees provide welcome shade along the shore. And on the hillside above the beach — cattle. Fat, healthy cattle grazing in enormous herds, tended by tall people wearing ochre and glass beads who have been watching the fleet from a safe distance since it anchored.\n\nSome of the men are near tears at the sight of fresh meat. They have been living on salt fish and hard biscuit for weeks. Eventually one of the herders walks down to the waterline and stands there, watching, until the fleet's captain climbs into a longboat and rows to meet him. An exchange takes place that involves copper rings, dried fish, and a great deal of patient gesture. By nightfall, three cattle are in the hold. The sound of lowing is, to every man on the fleet, the most beautiful noise they have ever heard."
 cape_route_to_india_events.8.a: "Trade [ShowGoodsNameWithNoTooltip('copper')] and [ShowGoodsNameWithNoTooltip('cloth')] for cattle and plant a #italic padrão#! to mark our claim."
 cape_route_to_india_events.8.b: "Erect a stone #italic padrão#! and formally claim this land for [ROOT.GetCountry.GetNameWithNoTooltip]."
 cape_route_to_india_events.8.c: "让水手们在此休整，恢复体力，再继续北上。"
 cape_route_to_india_events.8.d: "返航回国。"
 cape_route_to_india_events.8.historical_info: "莫塞尔湾在葡萄牙水手口中被称为 #italic Bahia dos Vaqueiros #!（牧牛人湾），后又称 #italic Aguada de São Brás #!（圣布拉斯汲水地）。巴尔托洛梅乌·迪亚士于1488年在此竖立了一块石制 #italic padrão #! 石柱，瓦斯科·达伽马于1497年沿袭了这一传统。当地的科伊科伊人起初与两支远征队都愿意交易，但后来变得敌对——瓦斯科·达伽马的手下试图未经充分补偿就取用淡水，结果遭到石块投掷。"
 # ── Event 9: Sofala ──────────────────────────────────────────────────────────
 cape_route_to_india_events.9.title: "黄金港[ShowLocationNameWithNoTooltip('sofala')]"
 cape_route_to_india_events.9.desc: "The harbor at [ShowLocationName('sofala')] is crowded with dhows. These are not the small fishing craft the fleet has grown accustomed to along the southern coast; they are ocean-going vessels from [ShowRegionName('arabia_region')] and [ShowRegionName('persia_region')], laden deep in the water with [ShowGoodsName('ivory')], ebony, and [ShowGoodsName('cloth')]. On the waterfront, merchants are conducting business in [ShowLanguageName('arabic_language')] and in [location.GetDominantCulture.GetLanguage.GetName], a tongue none of the fleet's interpreters can place. Small pinches of gold dust change hands for bolts of Indian cotton.\n\nArab traders who have dominated this port for centuries watch the arrival of the [ROOT.GetCountry.GetAdjective] fleet from beneath the awnings of their warehouses. Their expressions are unreadable but their body language is unmistakable: the appearance of these strangers, with their iron cannon and their crosses painted on their sails, is not a welcome development. The fleet captain makes note of the largest warehouses, the positions of the dhow moorings, the depth of water at the entrance to the bay."
 cape_route_to_india_events.9.a: "Establish a major [ShowBuildingTypeNameWithNoTooltip('por_feitoria')] — this gold will make [ROOT.GetCountry.GetNameWithNoTooltip] rich."
 cape_route_to_india_events.9.b: "以货物换取金砂，探明内陆的情形。"
 cape_route_to_india_events.9.c: "搜集情报，继续前进——时间宝贵。"
 cape_route_to_india_events.9.d: "返航回国。"
 cape_route_to_india_events.9.historical_info: "索法拉是斯瓦希里贸易网络中最南端的重要港口，扼守着通往西面高原上产金的#italic穆塔帕#!王国（大津巴布韦）的门户。阿拉伯商人至少自十世纪起便在此经营。葡萄牙人于1505年攻占索法拉，摧毁了阿拉伯人的贸易网络，试图将黄金贸易改道纳入己方渠道——但成效参差，因为大部分贸易干脆转移到了他们势力所不及的内陆地区。"
 # ── Event 10: Mozambique Island ──────────────────────────────────────────────
 cape_route_to_india_events.10.title: "The Island of [ShowLocationNameWithNoTooltip('mozambique')]"
 cape_route_to_india_events.10.desc: "A small island, no more than three kilometers from end to end, separated from the mainland by a narrow channel just deep enough for ocean-going ships. The island is dominated by a stone trading post flying a green flag, and the harbor is packed with dhows from all corners of the [ShowContinentName('indian_ocean_continent')]. [ShowGoodsName('ivory')] and ebony flow down from the interior, enslaved men and women are marched in from the mainland, [ShowGoodsName('copper')] comes up from the south, and [ShowGoodsName('cloth')] and [ShowGoodsName('porcelain')] arrive from $india$ and $china$ — all of it changing hands in a trading network that has functioned for six centuries.\n\nThe [target_ruler_country.Custom('GetRulerOrRegentTitle')] is wealthy and suspicious. Arab merchants who arrived ahead of the fleet have warned [target_ruler.GetHimHer] that the strangers are [ROOT.GetCountry.GetReligion.GetAdjective] pirates who destroy what they cannot steal. [target_ruler.GetHeShe|U] receives the fleet's envoy with careful courtesy, surrounded by armed guards, and asks many questions about armaments. [target_ruler.GetHerHis|U] own position, in the heart of a harbor ringed by cannon-points, is not what the [ROOT.GetCountry.GetAdjective] would call comfortable."
 cape_route_to_india_events.10.a: "Bribe the [target_ruler_country.Custom('GetRulerOrRegentTitle')] with goods from our hold and buy the right to build here."
 cape_route_to_india_events.10.b: "通过外交手段与馈赠来协商贸易权利。"
 cape_route_to_india_events.10.c: "Outmaneuver the Arab merchants — offer the [target_ruler_country.Custom('GetRulerOrRegentTitle')] terms they cannot match."
 cape_route_to_india_events.10.d: "Acknowledge the [target_ruler_country.Custom('GetRulerOrRegentTitle')]'s position for now and continue north."
 cape_route_to_india_events.10.f: "竖立 #italic 圣若热界石碑 #!。"
 cape_route_to_india_events.10.e: "返航回国。"
 cape_route_to_india_events.10.historical_info: "莫桑比克岛成为葡萄牙在东非最重要的据点，于1507年正式建立。十六世纪建成的圣塞巴斯蒂昂堡至今仍是撒哈拉以南非洲现存最古老的欧洲堡垒之一。这座岛屿曾作为葡属东非的行政首府，并在长达两个多世纪的时间里充当通往 $india$ 航线上的中转站。它的沦陷实际上摧毁了阿拉伯人对斯瓦希里海岸北部贸易网络的控制。"
 # ── Event 11: Mombasa ────────────────────────────────────────────────────────
 cape_route_to_india_events.11.title: "The Trap at [ShowLocationNameWithNoTooltip('mombasa')] 的陷阱"
 cape_route_to_india_events.11.desc: "[ShowLocationName('mombasa')]'s entrance channel is narrow, no more than two cables wide, with high ground on either shore. As the fleet passes through, the men begin to sense something is wrong — men loitering along the waterfront with the excessive casualness of heavily armed men who have been told to appear unarmed, a dhow anchored in an odd position that would block the channel exit, and the [target_ruler_country.Custom('GetRulerOrRegentTitle')]'s envoy who boards the flagship with elaborate ceremony, gifts, and too many questions about the number of fighting men aboard.\n\nThat night, an interpreter employed by the fleet slips into the captain's cabin. Before returning ashore, the [target_ruler_country.Custom('GetRulerOrRegentTitle')]'s envoy spoke to his companions in a dialect the man understands. The words were unambiguous: the fleet is not to leave [ShowLocationNameWithNoTooltip('mombasa')]."
 cape_route_to_india_events.11.a: "Leave quietly before dawn — this man's hospitality is not worth the risk."
 cape_route_to_india_events.11.b: "留下并尝试贸易，尽管紧张气氛显而易见。"
 cape_route_to_india_events.11.c: "If they plan treachery, we shall act first — prepare the men."
 cape_route_to_india_events.11.d: "返航回国——我们不会让舰队在此冒险。"
 cape_route_to_india_events.11.historical_info: "1498年4月，瓦斯科·达伽马在蒙巴萨险些遭到伏击。据葡萄牙方面的记载，苏丹派来的当地领航员企图将舰队引向沙洲搁浅。达伽马在陷阱未及发作前便已撤离。此后数十年间，葡萄牙人多次卷土重来，炮击并洗劫蒙巴萨。1593年建成的耶稣堡最终巩固了葡萄牙人对该港口的控制——尽管该城在1698年经过长期围困后被阿曼人攻陷。"
 # ── Event 12: Malindi ────────────────────────────────────────────────────────
 cape_route_to_india_events.12.title: "友善的[target_ruler_country.Custom('GetRulerOrRegentTitle')|U]"
 cape_route_to_india_events.12.desc: "Everything about [ShowLocationName('malindi')] is different from what came before. [target_ruler.GetName], the [target_ruler_country.Custom('GetRulerOrRegentTitle')], comes down to the harbor [target_ruler.GetHerselfHimself], dressed in white and green silk, attended by musicians playing an instrument that produces music none of the [ROOT.GetCountry.GetAdjective] have ever heard. [target_ruler.GetSheHe|U] has word of the fleet from [target_ruler.GetHerHis] contacts to the south and has been expecting their arrival.\n\n[target_ruler.GetSheHe|U] has a gift that is worth more than ivory: in [target_ruler.GetHerHis] employ [target_ruler.GetSheHe] has a man who has sailed to Calicut twelve times. A man who knows every current, every reef, every wind shift between here and the Malabar coast. Who knows when the south-west monsoon will carry a ship across the [ShowContinentName('indian_ocean_continent')] in three weeks and when it will kill the same ship in twenty-four hours. The pilot's name, [target_ruler.GetName] explains, is hard to render in a European tongue. But [target_ruler.GetHerHis] knowledge is not, and the price of that knowledge is friendship."
 cape_route_to_india_events.12.a: "Accept [target_ruler.GetNameWithNoTooltip]'s friendship and [target_ruler.GetHerHis] gift of a pilot — we will honor it."
 cape_route_to_india_events.12.b: "Formalize this friendship: gifts, a presence here, and protection for the [target_ruler_country.Custom('GetRulerOrRegentTitle')]."
 cape_route_to_india_events.12.c: "Let us pray together before the final crossing — [ROOT.GetCountry.GetReligion.GetGodName|U] brought us to this moment."
 cape_route_to_india_events.12.e: "在伟大的渡海之前，竖立起#italic圣灵号石碑#!。"
 cape_route_to_india_events.12.d: "Return home — Calicut is too far, and the crossing too dangerous."
 cape_route_to_india_events.12.historical_info: "The Sultan of Malindi maintained a long rivalry with Mombasa and was therefore well-disposed toward the Portuguese, who arrived as potential counterweights to his enemies. The Indian Ocean pilot he provided to Vasco da Gama — referred to in Portuguese sources as #italic Malemo Canaca#! — has been the subject of scholarly debate for centuries. Some historians identify him with #italic Ahmad ibn Majid#!, the greatest Arab navigator of the fifteenth century and author of several works on Indian Ocean navigation. Others argue the identification is incorrect and the pilot was a Gujarati merchant. His identity remains uncertain."
 # ── Event 13: Kozhikode (Calicut) ────────────────────────────────────────────
 cape_route_to_india_events.13.title: "卡利卡特——通往香料之门"
 cape_route_to_india_events.13.desc: "[ShowLocationName('kozhikode')] is larger than [ROOT.GetCountry.GetCapital.GetName]. The harbor contains more ships than the fleet's officers can count — vessels from [ShowRegionName('arabia_region')], [ShowRegionName('persia_region')], [ShowAreaName('gujarat_area')], [ShowRegionName('bengal_region')], $china$, [ShowLocationName('malacca')], and [ShowAreaName('java_area')]. A whole connected world has been drawn together by the magnetic pull of [ShowGoodsName('pepper')], cinnamon, cardamom, and [ShowGoodsName('cloves')], and all of it flows through this port. The fleet drops anchor in a roadstead already crowded with dhows as Arab merchants on the waterfront stare.\n\nFor two months they have been telling the [target_ruler_country.Custom('GetRulerOrRegentTitle')] — Calicut's ruler, who governs from behind elaborate ceremonial walls — that these newcomers are pirates from the cold north, not merchants. The [target_ruler_country.Custom('GetRulerOrRegentTitle')|U] has agreed to receive the fleet's captain, but [target_ruler.GetHerHis] court is wary and [target_ruler.GetHerHis] merchants nervous. The air smells of black [ShowGoodsNameWithNoTooltip('pepper')] and the salt of a sea that has seen a thousand years of trade. Everything the voyage was for comes down to what is said in the next hour."
 cape_route_to_india_events.13.a: "Lay our finest goods before the [target_ruler_country.Custom('GetRulerOrRegentTitle')] and negotiate a trading post."
 cape_route_to_india_events.13.b: "Propose a treaty: fixed duties, guaranteed anchorage, mutual protection."
 cape_route_to_india_events.13.c: "Call the Arab merchants liars, and demand the [target_ruler_country.Custom('GetRulerOrRegentTitle')] choose."
 cape_route_to_india_events.13.d: "Our pilot knows this court. His counsel guides our opening words."
 cape_route_to_india_events.13.e: "Plant the #italic São Gabriel padrão#!, and let all see who reached this shore."
 cape_route_to_india_events.13.historical_info: "科泽科德（欧洲人称之为卡利卡特）是印度洋上最重要的香料贸易港口。其统治者称号为#italic萨穆蒂里#!（扎莫林，意为“海洋之主”），在垄断贸易的阿拉伯商人、相互敌对的印度诸邦，以及后来抵达的欧洲人之间小心维持着微妙的平衡。达伽马于1498年首次觐见的结果喜忧参半：他的礼物被认为不够体面，而阿拉伯商人也成功在宫廷中破坏了双方关系。他最终只带着一批寒酸的货物离去。直到后续的几次航行，凭借葡萄牙火炮的威慑，才最终换来了实质性的贸易安排。"
 # ── Event 14: Axim (Gold Coast) ─────────────────────────────────────────────
 cape_route_to_india_events.14.title: "黄金海岸"
 cape_route_to_india_events.14.desc: "The forest begins a day's walk from the shoreline, and the path between coast and forest is well worn. Caravans arrive at the beach two, three times a week: porters carrying leather pouches of gold dust, ground from river gravels in the interior where the [ShowCultureName('akan')] kings control the washing sites and trade their surplus through a network of Wangara merchants that stretches back four centuries.\n\nThe [ROOT.GetCountry.GetAdjective] have heard of this place. Every Arab captain who traded along these shores spoke of the Gold Coast's markets as the most productive stretch of the Guinea littoral. The people here have seen foreign ships before. They are not afraid. They are calculating what the newcomers are worth."
 cape_route_to_india_events.14.a: "Build the São Jorge da Mina fort. The [ShowCultureNameWithNoTooltip('akan')] will sell to whoever holds it."
 cape_route_to_india_events.14.b: "Negotiate for captives the [ShowCultureNameWithNoTooltip('akan')] take as tribute in their wars."
 cape_route_to_india_events.14.c: "Storm the settlement before the Wangara merchants can depart."
 cape_route_to_india_events.14.d: "Note the trade volume and press south. There is no time to linger."
 cape_route_to_india_events.14.e: "返航回国。单凭这些黄金，此行便已值得。"
 cape_route_to_india_events.14.historical_info: "1482年，葡萄牙人在黄金海岸建造了圣若热达米纳堡（埃尔米纳堡），所用石料采自附近的岬角，木材则预先在葡萄牙加工好后装船运来。要塞在数周之内便告落成，其中既有与当地酋长卡拉曼萨的谈判，也有出其不意的手段。该堡最初旨在控制与阿坎森林诸国的黄金贸易。数十年间，它逐渐成为大西洋奴隶贸易的核心枢纽，接收来自内陆战争的俘虏，再将他们运往西方，先是圣多美的甘蔗种植园，后来是巴西。历史学家沃尔特·罗德尼估计，在奴隶贸易取代黄金成为主要商品之前，黄金海岸的贸易每年能为葡萄牙带来数十万克鲁扎多黄金的收益。"
 # ── Event 15: Fernando Po ────────────────────────────────────────────────────
 cape_route_to_india_events.15.title: "费尔南多·波岛"
 cape_route_to_india_events.15.desc: "An island rises from the Gulf of Guinea: a volcanic peak trailing cloud from its summit, dense with jungle to the water's edge. The Bubi people who live here have seen no Europeans before. They watch from the tree line as the fleet drops anchor in a natural bay, and a boat is lowered.\n\nThe explorer who gave this island his name passed this way a generation ago and drew it roughly in the charts. The fleet's pilot has that chart. What it does not show is whether the island is worth stopping for."
 cape_route_to_india_events.15.a: "Establish a post here. The island sits astride the [ShowAreaNameWithNoTooltip('gulf_of_guinea_area')] trade."
 cape_route_to_india_events.15.b: "Plant a #italic padrão#!, record the island on our charts, and claim it for the Crown."
 cape_route_to_india_events.15.c: "Take on fresh water and continue south. The island offers nothing we need."
 cape_route_to_india_events.15.d: "返航回国。[ShowAreaNameWithNoTooltip('gulf_of_guinea_area')] 本身便已是充分的理由。"
 cape_route_to_india_events.15.historical_info: "约1472年，葡萄牙探险家费尔南多·波抵达费尔南多·波岛（今比奥科岛），成为首位目睹该岛的欧洲人。土著布比人已在此孤立生活数百年，他们早在很久以前便已从大陆迁徙至此。葡萄牙人将该岛用作中途补给点，但难以建立长久的定居点，部分原因是热带疾病肆虐，部分原因是布比人抵制与外界接触。此后数百年间，该岛屡易其主；1778年《埃尔帕多条约》签订后，葡萄牙将其转让给西班牙，以换取南美洲的领土让步，该岛最终成为现代赤道几内亚的一部分。"
 # ── Event 16: Mogadishu ──────────────────────────────────────────────────────
 cape_route_to_india_events.16.title: "海上苏丹之城"
 cape_route_to_india_events.16.desc: "[ShowLocationName('mogadishu')] is larger than we expected. The harbor is busy with dhows from [ShowRegionName('arabia_region')] and $india$, their holds full of [ShowGoodsName('cloth')], [ShowGoodsName('copper')], and [ShowGoodsName('porcelain')]. [ShowLocationNameWithNoTooltip('mogadishu')] is ruled by a sultan who governs the trade between the [ShowCultureName('somali_culture')] interior and the wider ocean world. Merchants on the waterfront regard our ships with a calculating eye. We are not the first strangers to arrive here with strange sails and strange goods, but we may be the first to have come from so far west."
 cape_route_to_india_events.16.a: "Trade with the [ShowCultureNameWithNoTooltip('somali_culture')] merchants. Every contact here is worth making."
 cape_route_to_india_events.16.b: "Observe, record, and move north. We came to find $india$, not to linger here."
 cape_route_to_india_events.16.c: "Turn back. The route ahead is unknown and our provisions will not last."
 cape_route_to_india_events.16.historical_info: "摩加迪沙是东非海岸最古老、最富庶的城市之一,其贸易历史可追溯至葡萄牙人到来前数百年。早在九世纪,阿拉伯地理学家便已将其记载为一座重要港口。达伽马航行之时,该城由一位苏丹统治,是斯瓦希里海岸贸易网络的一部分,连接着非洲内陆与阿拉伯、波斯及印度次大陆。葡萄牙人选择绕过或胁迫这些斯瓦希里城邦,以建立自身的贸易垄断,这使他们与一个既有且高效运作的商业体系直接发生了冲突。"
 # ── Event 17: Masqat (Oman) ──────────────────────────────────────────────────
 cape_route_to_india_events.17.title: "伊巴迪派的港口"
 cape_route_to_india_events.17.desc: "[ShowLocationName('masqat')] 由赭红色的悬崖拔地而起,这里海洋的气息也与别处不同——更干燥、更凛冽,尘土与 [ShowGoodsName('salt')] 的味道交织在一起。这座港湾是 [ShowProvinceDefinitionName('arabian_sea_province')] 沿岸最优良的港口之一,水深足以容纳大船,又能避开西南季风。[ShowCultureName('omani_culture')] 商人已在通往 $india$ 的航路上行驶了千年之久。码头上的人熟知航道、风向与时机。他们知道何时该扬帆,何时该等待。他们正打量着我们,揣测我们此行所图。"
 cape_route_to_india_events.17.a: "Seek an audience with the [ShowCultureNameWithNoTooltip('omani_culture')] authorities and announce our presence."
 cape_route_to_india_events.17.b: "Pay Arab navigators for their charts and knowledge of the crossing to $india$."
 cape_route_to_india_events.17.c: "Resupply quickly and leave. The [ShowCultureNameWithNoTooltip('omani_culture')] sailors are no friends of ours."
 cape_route_to_india_events.17.d: "折返吧。前往 $india$ 的航程超出我们的能力范围。"
 cape_route_to_india_events.17.historical_info: "Masqat (Muscat) was a principal port of the Ibadi Imamate of Oman, one of the major maritime powers of the western Indian Ocean. Omani sailors were among the most skilled navigators in the world, deeply familiar with the monsoon winds that governed crossing times between Arabia and the Indian subcontinent. The Portuguese arrival threatened the Omani role as intermediary in the spice trade, and relations between Portugal and Oman remained hostile for most of the sixteenth century, culminating in repeated wars for control of the Persian Gulf and East African ports. Oman eventually expelled the Portuguese from much of their East African network in the seventeenth century."
 # ── Event 18: Notification — Feitoria at foreign location ───────────────────
 cape_route_to_india_events.18.title: "The [por_feitoria_builder.GetAdjective|U] Have Built a [ShowBuildingTypeNameWithNoTooltip('por_feitoria')]"
 cape_route_to_india_events.18.desc: "Their ships arrived without warning, dropped anchor in the outer roads, and trained their guns on the harbor. The request was polite in form and absolute in substance. They wished to build a trading post. They would pay a small rent. They would respect local laws. What they did not say — what did not need saying — was what would happen if we refused. The timber was already cut and loaded in their holds. The post was raised in a matter of days. It flies the Portuguese cross now, where our own banner flew before."
 cape_route_to_india_events.18.a: "We have no choice. Their cannon speaks louder than our protests."
 cape_route_to_india_events.18.b: "Send a formal protest and demand they respect our sovereignty."
 cape_route_to_india_events.18.historical_info: "葡萄牙的商站体系是欧洲在亚洲和非洲进行商业帝国主义扩张的最早范例之一。通过在现有港口建立设防商站，葡萄牙得以插足既有的贸易网络，而无需承担全面领土征服的代价。凡是同意合作的当地统治者，均可获得葡萄牙商品的供给以及对抗其对手的海军保护；而拒绝合作者则将遭到炮击。这一体系将印度洋从一个相对开放的商业空间，转变为以葡萄牙海军霸权和印度公署（Casa da Índia）贸易垄断为核心的秩序。"
 cape_route_to_india_events.provisioned_tt: "The fleet is fully provisioned, and its crews will better withstand the long legs ahead"
 cape_route_to_india_events.supplies_up_tt: "The fleet's provisions are replenished"
 cape_route_to_india_events.supplies_down_tt: "The fleet's provisions run lower"
 cape_route_to_india_events.morale_up_tt: "Morale among the crews rises"
 cape_route_to_india_events.morale_down_tt: "Morale among the crews falls"
 cape_route_to_india_events.morale_crash_tt: "Morale collapses — the crews are pushed to the edge of mutiny"
 cape_route_to_india_events.ship_lost_tt: "A vessel is lost, and the expedition is reduced"
 cape_route_to_india_events.cargo_loaded_tt: "货舱里装满了 [ShowGoodsName('pepper')] ——航程的幸存者越富有，带回家的货物就越多"
 cape_route_to_india_events.cargo_spent_tt: "The holds are lighter — the cargo spent to buy this favor will not be sold at journey's end"
 cape_route_to_india_events.19.title: "海上之疫"
 cape_route_to_india_events.19.desc: "一如往常，病症总是从牙龈开始。牙龈先是变软，接着开始流血，牙齿也随之松动脱落。多年前已愈合的旧伤竟又裂开，仿佛新伤一般。船员们变得萎靡不振，继而气喘难续，最终连吊床都无法起身。船医束手无策——世上无人能治。那些支撑船队穿越茫茫海路的咸鱼桶与生满象鼻虫的饼干，此刻竟对此病毫无助益。每日清晨点名，能应声者一日比一日更少。尸体裹着自己的吊床被抛入海中，而通往下一处友好海岸的路途，依旧漫长而无情地延伸着。"
 cape_route_to_india_events.19.a: "Ration the last of the preserved fruit and make what speed we can for land."
 cape_route_to_india_events.19.b: "Nothing to be done. Bury the dead; pray the living outlast the crossing."
 cape_route_to_india_events.19.b.tt: "许多船员将无法幸存——此次航程的收益将大为减少"
 cape_route_to_india_events.19.historical_info: "坏血病由维生素C缺乏所致，是远洋航行时代水手的头号杀手。达伽马首次前往 $india$ 的航程中，一百四十八人中估计有九十三人丧生，绝大多数死于坏血病，因为在远离新鲜食物的漫长航段中无以为继。这一病因直到两个半世纪后才被真正弄清；水手和医师只知道新鲜食物——尤其是柑橘类水果——似乎能抵御这种病症，但这一知识总是被反复发现又被反复遗忘。"
 cape_route_to_india_events.20.title: "南方的暴风"
 cape_route_to_india_events.20.desc: "气压计早已发出警告，只是无人懂得解读：晴朗的天空下，西南方涌来一道又长又沉的涌浪。而后天空不再晴朗。狂风渐起，越刮越猛，把浪尖撕碎，将浪花平平地抛过海面。海浪堆起了船上任何人都无法形容的高度，那些泛着灰绿色、缀满泡沫的水墙将船只船尾朝前地掀向疾驰的云层，又将它们摔入浪谷，那里的风忽然停歇，静得诡异。昏暗中，其他船只鸣炮以保持队形，炮声几乎瞬间就被咆哮的风浪吞没。此刻已无航向可言，唯有海洋允许的方向。"
 cape_route_to_india_events.20.a: "Hand the sails and heave to. We ride it out and trust the ships."
 cape_route_to_india_events.20.b: "Run before it under a scrap of canvas and pray we are not pooped."
 cape_route_to_india_events.20.b.win_tt: "赌注得偿——舰队逃过了风暴最猛烈的部分"
 cape_route_to_india_events.20.b.lose_tt: "大海对舰队肆意施威"
 cape_route_to_india_events.20.historical_info: "非洲南部海域，温暖的厄加勒斯洋流与南大洋涌来的寒冷大西洋涌浪在此交汇，是世界上最危险的水域之一。时至今日，那里仍有足以吞没大型船只的异常巨浪记录在案。对于大发现时代的小型船只——排水量仅数百吨的克拉克帆船与卡拉维尔帆船而言——南大西洋的暴风堪称致命威胁，绕行好望角的航道也因此得名“风暴角”，可谓名副其实。"
 cape_route_to_india_events.21.title: "无风之海"
 cape_route_to_india_events.21.desc: "正午时分，风停了，此后再未回来。船帆松垮地挂在桅杆上，随着海涌的起伏无用地拍打着。到第二天，海面已如玻璃般平滑，一面巨大耀眼的镜子延伸至因炎热而颤动的地平线。甲板缝隙中的沥青已经融化。桶中的水变得温热、发绿、发臭。除了等待别无他法——等待，望着太阳，听着船木吱嘎作响，尽量不去计算那些寸步未行的人们正在消耗多少给养。水手们低声谈论着那些多年后被人发现的船只，它们漂浮不定，船员早已在能望见却始终未曾捕获的风前渴死。"
 cape_route_to_india_events.21.a: "等风来吧。此外别无他法。"
 cape_route_to_india_events.21.b: "Put the boats out and tow — anything is better than this stillness."
 cape_route_to_india_events.21.historical_info: "赤道无风带——即“多风带”，或称热带辐合带——是往返南半球的大西洋航行中臭名昭著的险境。帆船可能在此处滞留数日乃至数周，白白消耗给养和淡水，却毫无进展。正是为了避开这片无风与逆风地带，葡萄牙航海家们才发展出了#italic大西洋回旋航法#!——向西大幅绕行深入大西洋，几乎抵达巴西，以便在转向东方直驶好望角之前先捕捉南方的顺风。"
 cape_route_to_india_events.22.title: "船体中的蛀虫"
 cape_route_to_india_events.22.desc: "木匠是在例行探测污水井时发现的：钻杆抽出来时软塌塌的，当他探查水线以下的船板时，工具竟陷入了本该坚硬如铁的木料之中。是船蛆。温暖的热带海水中满是这种生物，自舰队越过赤道以来，它们便一直在蛀蚀船体——成千上万个苍白的蛀洞如蜂巢般布满木材内部，直到某块船板破裂、或抽水泵再也无法应付为止，才会被人察觉。若放任不管，如此遭蛀蚀的船只终有一天会在接缝处骤然裂开，连同全体船员一起沉没。木匠尚未开口，他的表情已经把一切都告诉了 [target_leader.GetName]。"
 cape_route_to_india_events.22.a: "Careen the ships on the nearest strand and burn the worm from the timbers."
 cape_route_to_india_events.22.a.tt: "刮船底耗费时日与银钱，却能保全舰队"
 cape_route_to_india_events.22.b: "拆下那艘最破船只上的物资与木料，弃之不用。"
 cape_route_to_india_events.22.c: "驶向友好港口，妥善整修。"
 cape_route_to_india_events.22.c.tt: "在安全港口妥善整修，重振了舰队的士气"
 cape_route_to_india_events.22.historical_info: "船蛆 #italic 船蛆属 #! ——其实根本不是蠕虫，而是一种海生蛤类——是温暖水域中木船的祸患，能在短短一季之内蛀毁一艘未加防护的船体。它的肆虐促使人们数百年间不断寻求对策：以铅皮包裹船底、涂抹沥青与油脂，或加装一层可牺牲的外层木板。这一问题在 $india$ 航线上尤为严重，以至于葡萄牙人最终在其印度洋据点专门修建了刮船底设施，以便在航程间隙刮除污损、修补船体。"
 cape_route_to_india_events.24.title: "哗变"
 cape_route_to_india_events.24.desc: "It has been coming for weeks — in the muttered conversations that stop when an officer approaches, in the sullen slowness with which orders are obeyed, in the looks. Now it comes into the open. A knot of men on the forecastle, one of them with a marlinspike in his fist, and behind them a crowd of others who have not yet decided which way they will jump. Their demands are the demands of frightened men who believe they have been led to their deaths: turn back, make for a Christian port, anything but sail on into an ocean that has already swallowed so many of their fellows. [target_leader.GetName] stands alone at the break of the quarterdeck. What [target_leader.GetSheHe] does in the next minute will decide whether there is a voyage left at all."
 cape_route_to_india_events.24.a: "Put the ringleaders ashore, and let the fainthearted go with them."
 cape_route_to_india_events.24.b: "以冷兵器迎击。船上没有民主可言。"
 cape_route_to_india_events.24.fight_win_tt: "军官们占了上风，秩序得以恢复"
 cape_route_to_india_events.24.fight_lose_tt: "厮杀血腥惨烈，舰队为此付出了代价"
 cape_route_to_india_events.24.c: "Speak to them of $india$, of the riches that await, of the glory of the endeavor."
 cape_route_to_india_events.24.rouse_tt: "[target_leader.GetNameWithNoTooltip] 的话语重新点燃了船员们的斗志"
 cape_route_to_india_events.25.title: "空寂的海岸"
 cape_route_to_india_events.25.desc: "一片低矮的绿色海岸从下风处的薄雾中浮现——没有炊烟，没有帆影，没有任何人迹，只有森林一直延伸到浪花翻涌的岸线，而在其后，则是淡水与陆地上或许蕴藏的猎物的承诺。海图上此处一片空白，无人认领，无人知晓，它可能蕴藏着任何东西：友善的泉水与轻易可得的猎物，也可能是热病，或是隐匿在林线之后窥伺的敌意部族。但水桶已经见底，船员们个个面容憔悴、双目凹陷，而海岸终究是海岸。"
 cape_route_to_india_events.25.a: "Send the boats ashore for water and whatever the land will yield."
 cape_route_to_india_events.25.b: "Too great a risk on an unknown coast. Note it on the chart and sail on."
 cape_route_to_india_events.26.title: "一片乐于通商的海岸"
 cape_route_to_india_events.26.desc: "这里的海岸有人居住，当地人并不怀有敌意。船队驶近之际，独木舟从岸边划出——起初小心翼翼，随后渐渐大胆起来，举起鱼和水果，指着海滩，那里已迅速聚起了一处简陋的集市。占据这段海岸的人对陌生来客并无恶意，而船队所载的 [ShowGoodsName('iron')] 与 [ShowGoodsName('cloth')] ，显然已勾起了他们通商的兴致。这正是漫长而空虚的航程中难得一遇的良机：既可装满水桶，购买新鲜食物，又能让船员们踏上一片没有恶意之人的土地。"
 cape_route_to_india_events.26.a: "Barter [ShowGoodsNameWithNoTooltip('iron')] and [ShowGoodsNameWithNoTooltip('cloth')] for all the fresh provisions they will sell."
 cape_route_to_india_events.26.b: "我们耽误不起时日。只补给淡水，继续前行。"
 cape_route_to_india_events.27.title: "全员殒没"
 cape_route_to_india_events.27.desc: "最后一艘船已经消失了。是葬身大海，是死于疾病，是水手们自己的绝望，还是毁于敌对的海岸——故乡的人们永远无从确知，只知道那支曾风光启航的船队再也不会归来。没有满载[ShowGoodsName('pepper')]的货舱，没有凯旋的归途，也没有通往$india$的航路图。在那浩瀚的海洋弧线上，介于非洲海岸与东方财富之间的某处，这场远征就此终结，大海将其吞没，仿佛一切从未发生过。里斯本的家人们将等待数月，继而数年，才终于明白真相。"
 cape_route_to_india_events.27.a: "愿 [ROOT.GetCountry.GetReligion.GetGodName] 接纳他们。我们短期内不会再作此尝试。"
 cape_route_to_india_events.27.historical_info: "通往$india$的海路，是以惊人的人命代价开辟的。即便是成功的航行，也常常损失半数船员和部分船只；未能成功的航次则彻底消失无踪，除了船队未能归航这一事实外，不留下任何记录。在此后的一个世纪里，尝试#italic印度航路#!的船只中，有相当一部分彻底覆没——或触礁于非洲海岸，或沉没于南大洋的风暴，或干脆杳无音讯。巨大的财富或许流入了里斯本，但其代价，是数量庞大到不应被遗忘的溺亡者与热病死难者。"
 cape_route_to_india_events.28.title: "登陆 [ShowProvinceDefinitionNameWithNoTooltip('cape_verde_province')]"
 cape_route_to_india_events.28.desc.empty: "十座黑色火山岩锥兀自矗立在无情的海面上，无一人居住于此。没有炊烟，没有船帆，没有旗帜——只有海鸟、海风，以及灰烬间几处带咸味的泉水。古老的海图为这些岛屿命了名，却从未有王国在此定居。它们正扼守着我们航路必经的水域， [target_leader.GetName] 深知它们的价值，正如 [target_leader.GetSheHe] 深知 [target_leader.GetHerHis] 的名字一般清楚：谁占据 [ShowProvinceDefinitionName('cape_verde_province')] ，谁就掌握了通往 [ShowContinentName('atlantic_ocean_continent')] 的门户。而此刻，无人占据此地。"
 cape_route_to_india_events.28.desc.foreign: "Another crown's banner snaps over the anchorage at [ShowLocationName('santiago')]. Someone reached these islands ahead of us and put down roots — a garrison, a battery, a harbormaster who rows out to ask our business in a tone that is courteous and unwelcoming in equal measure. The islands sit astride the very waters our route must cross; in a rival's hands they are a knife held to the throat of every voyage south. [target_leader.GetName] studies the fortifications from the rail, says nothing, and thinks a great deal."
 cape_route_to_india_events.28.a: "Claim the islands and raise a [ShowBuildingTypeNameWithNoTooltip('por_feitoria')] — it must fly our flag."
 cape_route_to_india_events.28.b: "Put ashore for water and forage what little the islands offer."
 cape_route_to_india_events.28.c: "这些岛屿不由我们支配。继续南行。"
 cape_route_to_india_events.28.d: "打道回府。"
 cape_route_to_india_events.28.historical_info: "佛得角群岛于1456年前后由葡萄牙航海者发现，自1462年起开始定居，此前岛上完全无人居住。其地处大西洋中部，正当东北信风之路，使其成为绕航非洲及前往美洲航程中不可或缺的中转站。谁掌控佛得角，谁便扼住了每一条南方航路的咽喉；随着葡萄牙的海洋野心日益扩张，其着手定居并设防这些岛屿，绝非偶然。"
 cape_route_to_india_events.29.title: "石柱"
 cape_route_to_india_events.29.desc.rafael: "The fleet has put in at the mouth of a broad, muddy river the pilots are already calling the [ShowLocationNameWithNoTooltip('quelimane')] — the River of Good Signs — for here, at last, the men have found what they crossed half the world to see: local craft rigged in the Arab fashion, traders who know the word for '$india$' and point east when they say it. The great crossing is near. In the hold lie the worked limestone pillars carried from home for exactly this purpose, each crowned with a cross and the royal arms. The carpenter asks whether to bring one ashore. To raise it is to plant a claim in stone and take on fresh water and wood while the masons work — but it will cost the fleet days it may not have."
 cape_route_to_india_events.29.desc.maria: "此处海岸外散布着低矮的小岛，草木青翠，水源充足，又能避开风浪——这正是疲惫船队视若珍宝的落脚之地。$india$ 已近在眼前；马拉巴尔海岸南行数日可达。船舱中还有一根石灰石柱，早在启航前便已凿制并刻上铭文，只待竖立，宣告我国王旗下的船只率先抵达此水域。立柱便是留下一道印记，比船上任何人都更长久——但这场仪式，连同随之而来的清舱与补水，将使船队在此耽留，任凭季节流转。"
 cape_route_to_india_events.29.desc: "此地海岸值得标记。船舱中载有一根从本国带来的凿制石灰石柱——柱顶饰有十字与王室纹章——意在立于海角之上，宣告我方船只率先经此而来。立柱是件庄重之事，也颇费时日；船队须停泊守候，待工匠将石柱竖立稳固。"
 cape_route_to_india_events.29.a: "竖起#italic石柱#!——让石与十字见证我们的航程。"
 cape_route_to_india_events.29.b: "没时间搞仪式了——补水、觅食，继续前进。"
 cape_route_to_india_events.29.historical_info: "#italic石柱#!是一种顶部饰有十字与葡萄牙王室纹章的石柱，预先在本国凿制成型，运抵新发现的海岸后竖立，以此宣示发现权与主权。据人文学者达米昂·德·戈伊斯记载，瓦斯科·达·伽马的船队在通往$india$的航程中共竖立了五根：在吉兆之河竖立的#italic圣拉斐尔柱#!，在莫桑比克竖立的#italic圣乔治柱#!，在马林迪竖立的#italic圣灵柱#!，在诸小岛竖立的#italic圣玛利亚柱#!，以及在卡利卡特竖立的#italic圣加百列柱#!。这些石柱取代了早期航行中易腐朽的木十字架，意在长久留存；其中数根历经数百年仍屹立不倒。"
 cape_route_to_india_events.30.title: "被放弃的航程"
 cape_route_to_india_events.30.desc: "The order is given, and there is no argument on this ship — only relief on some faces and disappointment on others. The bow comes about. Behind them, the unknown coast recedes; ahead, the long familiar road home. No charts of $india$, no holds of [ShowGoodsName('pepper')], no place in the historians' accounts of who first found the sea road east. But the ships are whole, and the crews are alive, and the harbor of home is a certainty rather than a hope.\n\n[target_leader.GetName] watches the horizon astern for a long moment before turning [target_leader.GetHerHis] attention to the tasks of the voyage still ahead of [target_leader.GetHerHim]."
 cape_route_to_india_events.30.a: "So be it. We return with what we have learned, if nothing else."
 cape_route_to_india_events.30.historical_info: "并非每一支沿非洲海岸南下的葡萄牙远征队都会坚持抵达最终目标。船长们通常会权衡未知航程的风险与已集结的船只人员，往往认定带着部分新海岸线的记录安全返航才是更明智之举。此类航行即便未能抵达 $india$，仍为海图增添了点滴之功；正是这一代又一代未竟航程所积累的知识，最终成就了瓦斯科·达·伽马的完整穿越。"
 cape_route_to_india_events.14.a.owned: "加强圣若热达米纳的防务——[ShowCultureNameWithNoTooltip('akan')] 人早已通过我们的手进行贸易。"
 cape_route_to_india_events.15.a.owned: "加强我们在此地的据点——这座岛屿早已是我们的 [ShowAreaNameWithNoTooltip('gulf_of_guinea_area')] 贸易支柱。"
 cape_route_to_india_events.15.c.tt: "船体已被刮净并涂以沥青密封，此次航行船蛆将不会侵扰船队"
 cape_route_to_india_events.3.a.owned: "继续在这座岛屿上投入——[ShowLocationNameWithNoTooltip('sao_tome')] 已听命于我们的旗帜。"
 cape_route_to_india_events.31.a: "遵守条约；朝中虽会对外国军队心生不满，也只能忍耐。"
 cape_route_to_india_events.31.b: "立字为据，双方王室的租金与权利均需明文规定。"
 cape_route_to_india_events.31.historical_info: "并非每一座商站都是在炮火威胁下建立的。马林迪苏丹与蒙巴萨长期为敌，他将达伽马的舰队视为可资利用的制衡力量，接纳其到来，并派遣领航员将其引至卡利卡特。此后数十年间，马林迪始终是葡萄牙人在斯瓦希里海岸的盟友，先是设立商站，后又筑起要塞。那些早早与葡萄牙人达成协议的统治者，得以获取葡萄牙商货，并借其海军之力抵御自身的敌人，其中不少人更借此机会清算旧日的宿怨。这类协定鲜少对等，但凡是自愿缔结的，往往比强加而成的更为长久。"
 cape_route_to_india_events.31.title: "葡萄牙人修建其 [ShowBuildingTypeNameWithNoTooltip('por_feitoria')]"
 cape_route_to_india_events.5.a.owned: "扩建我们在 [ShowLocationNameWithNoTooltip('luanda')] 的这座大商站——此海岸再无可与之匹敌者。"
 cape_route_to_india_events.5.b.owned: "扩建我们已在此设立的商站与补给仓库。"
