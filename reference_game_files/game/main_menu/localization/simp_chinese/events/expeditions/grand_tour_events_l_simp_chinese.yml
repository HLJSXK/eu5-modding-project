 grand_tour_events.25.a: "在 [ShowLocationNameWithNoTooltip('vienna')] 稍作停留。"
 grand_tour_events.25.b: "在 [ShowLocationNameWithNoTooltip('prague')] 让马匹休息。"
 grand_tour_events.25.c: "取道 [ShowLocationNameWithNoTooltip('munich')] 转向归途。"
 grand_tour_events.25.d: "在最后一段路程前，先停留在 [ShowLocationNameWithNoTooltip('paris')]。"
 grand_tour_events.25.desc: "游历终于转向归途。与其原路折返南方， [target_leader.GetName] 必须决定在最后一段路程之前于何处稍作停留：让马匹休息片刻，或许还能再受一位宫廷的接见，然后再启程回家。"
 grand_tour_events.25.desc.second: "只停一站，还称不上是归乡。在路途最终返回[ROOT.GetCountry.GetCapital.GetName]之前，[target_leader.GetName]再选一座城市稍作停留：最后一处宫廷，最后一份见闻，然后这趟游历才算真正结束。"
 grand_tour_events.25.e: "归途中途经 [ShowLocationNameWithNoTooltip('lyon')] 。"
 grand_tour_events.25.f: "先渡海前往 [ShowLocationNameWithNoTooltip('london')] ，再转向内陆。"
 grand_tour_events.25.g: "先在 [ShowLocationNameWithNoTooltip('strasbourg')] 稍作绕行。"
 grand_tour_events.25.h: "取道 [ShowLocationNameWithNoTooltip('marseille')] 安排行程。"
 grand_tour_events.25.i: "在最后一程之前，先前往 [ShowLocationNameWithNoTooltip('augsburg')]。"
 grand_tour_events.25.k: "在 [ShowLocationNameWithNoTooltip('cologne')] 歇息片刻。"
 grand_tour_events.25.l: "经 [ShowLocationNameWithNoTooltip('barcelona')] 转道回国。"
 grand_tour_events.25.n: "在 [ShowLocationNameWithNoTooltip('orleans')] 暂作停留。"
 grand_tour_events.25.o: "在返乡的最后一程前，先经过 [ShowLocationNameWithNoTooltip('krakow')] 一行。"
 grand_tour_events.25.p: "延误已够多了，直接回国吧。"
