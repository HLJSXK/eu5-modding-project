 grand_tour_events.26.connections: "$grand_tour_events.seek_audience$"
 grand_tour_events.26.experience: "拜访 [ShowGoodsNameWithNoTooltip('wool')] 商人与城中的行会会馆。"
 grand_tour_events.26.historical_info: "1765年，法国法官兼文人皮埃尔－让·格罗斯利（Pierre-Jean Grosley）在伦敦逗留近一年，为其后被译作 #italic 《伦敦游记》 #! 的著作收集素材。他所记录的观察中，有一则提到他曾目睹一位国务大臣在赌桌前连续熬夜二十四小时不曾中断，其间唯以夹在两片烤面包之间的冷牛肉果腹。格罗斯利写道：「这道新菜在我居留伦敦期间大为流行」，此后人们便以其发明者之名称呼它。这则轶事，无论是否经过渲染，最终成了他这部游记中最常被引用的一句。"
 grand_tour_events.26.knowledge: "前往律师公会聆听一场关于普通法的讲座。"
 grand_tour_events.26.party: "暂且放下行会会馆，在 [target_location.GetNameWithNoTooltip] 的酒馆里度过一夜。"
 grand_tour_events.26.title: "[target_location.GetNameWithNoTooltip]，泰晤士河畔之城"
 grand_tour_events.27.connections: "$grand_tour_events.seek_audience$"
 grand_tour_events.27.experience: "参观酒窖与卢瓦尔河船夫行会。"
 grand_tour_events.27.historical_info: "1644年4月，年轻的日记作者约翰·伊夫林在沿卢瓦尔河而下的旅途中，于奥尔良稍作停留，这次旅程后来成为最早有记载的“壮游”之一。他参观了这座古老的大学，其学生仍按传统分为四个“民族团”——法兰西、诺曼底、皮卡第和高地德意志，各设官员管理。他还使用了城中的两座公共图书馆，惊叹于学者只需留下一张署名字条，便可将书籍借回自己的住所，认为此等宽厚实属难得。他也参观了圣十字教区教堂，昔日庄严壮丽，如今却仍带着近年内战留下的斑斑创痕。"
 grand_tour_events.27.knowledge: "$grand_tour_events.attend_university_lectures$"
 grand_tour_events.27.party: "跳过法律讲座，去河边的酒馆消遣。"
 grand_tour_events.27.title: "[target_location.GetNameWithNoTooltip]，卢瓦尔河畔之城"
 grand_tour_events.28.a: "$grand_tour_events.opportunity_accept$"
 grand_tour_events.28.b: "$grand_tour_events.opportunity_commit$"
 grand_tour_events.28.c: "$grand_tour_events.opportunity_decline$"
 grand_tour_events.28.desc.scholar: "随行人员听闻，[target_location.GetName]有一位学者，声名远播，吸引了来自大陆各地的学生。若价钱合适、弟子得当，或许能说服他暂时收[target_leader.GetName]为徒。"
 grand_tour_events.28.desc.university: "随行人员得知，或可为 [target_leader.GetName] 安排进入 [target_location.GetName] 大学求学：聆听讲座、参与辩论，与那些名字将在此次旅程被人遗忘后仍被铭记的学者为伍。"
 grand_tour_events.28.title: "求学之机"
 grand_tour_events.29.a: "$grand_tour_events.reflect_and_continue$"
 grand_tour_events.29.desc: "数月的学业已近尾声，[target_leader.GetName] 须决定在 [target_location.GetName] 究竟学到了什么，$grand_tour_events.worth_the_delay$"
 grand_tour_events.29.title: "讲座终了"
 grand_tour_events.3.connections: "在 [court_host.GetNameWithNoTooltip] 的宫廷中学习庇护艺术的门道。"
 grand_tour_events.3.experience: "参观 [ShowGoodsNameWithNoTooltip('wool')] 作坊和维奇奥桥上的金匠铺。"
 grand_tour_events.3.knowledge: "设法结识修道院里的学者们。"
 grand_tour_events.3.party: "把手稿放到一边，去 [target_location.GetNameWithNoTooltip] 的赌桌上一试身手。"
 grand_tour_events.30.a: "$grand_tour_events.opportunity_accept$"
 grand_tour_events.30.b: "$grand_tour_events.opportunity_commit$"
 grand_tour_events.30.c: "$grand_tour_events.opportunity_decline$"
 grand_tour_events.30.desc: "我们的[ROOT.GetCountry.GetGovernment.GetHeirTitle]得知，[target_country.GetLongName]正处于战争之中，其军官团亦愿意在有适当引荐的情况下接纳来访者。[target_leader.GetName]不会担任实际指挥，也不必为士兵的安危负责，却可与久经沙场的军官并辔而行，亲眼目睹一场战役的进程，学到任何兵法书籍都难以传授的东西。"
 grand_tour_events.30.title: "从军之机"
 grand_tour_events.31.a: "$grand_tour_events.reflect_and_continue$"
 grand_tour_events.31.desc: "行军季节即将结束，[target_leader.GetName] 必须判断，从 [target_location.GetName] 的军官们身上究竟学到了什么，$grand_tour_events.worth_the_delay$"
 grand_tour_events.31.title: "游历终章"
 grand_tour_events.32.a: "$grand_tour_events.opportunity_accept$"
 grand_tour_events.32.b: "$grand_tour_events.opportunity_commit$"
 grand_tour_events.32.c: "$grand_tour_events.opportunity_decline$"
 grand_tour_events.32.desc: "Word reaches [target_leader.GetName] of an invitation to join the court of the [target_country.GetLongName] as a guest for a season: rooms at the palace, a standing invitation to every reception, and introductions to every courtier and visiting diplomat worth knowing."
 grand_tour_events.32.desc.no_owner: "[target_leader.GetName] 收到消息，受邀以宾客身份加入 [target_location.GetName] 望族门第度过一季：可结识每一位值得结交的名流，并随时受邀赴宴。"
 grand_tour_events.32.title: "结交良机"
 grand_tour_events.33.a: "反思所得之收获，继续这段旅程。"
 grand_tour_events.33.desc: "宫廷中的这一季即将结束，[target_leader.GetName] 必须判断，在 [target_location.GetName] 结识的这些人脉究竟带来了什么收获，$grand_tour_events.worth_the_delay$"
 grand_tour_events.33.title: "宫廷之季落幕"
 grand_tour_events.34.a: "$grand_tour_events.opportunity_accept$"
 grand_tour_events.34.b: "$grand_tour_events.opportunity_commit$"
 grand_tour_events.34.c: "$grand_tour_events.opportunity_decline$"
 grand_tour_events.34.desc: "我们的[ROOT.GetCountry.GetGovernment.GetHeirTitle]得知，[target_location.GetName]藏有一位声名远扬的剑术大师，愿在这一季收一位有潜质的弟子。[target_leader.GetName]不会因此卷入任何真正攸关生死的决斗，也不必了结任何真正的恩怨，却能学到步法、时机的把握，以及那种任何兵法手册都从未真正描绘出的独特胆识。"
 grand_tour_events.34.title: "剑术良机"
 grand_tour_events.35.a: "$grand_tour_events.reflect_and_continue$"
 grand_tour_events.35.desc: "授业的季节即将结束，[target_leader.GetName] 必须思考在 [target_location.GetName] 的比试中究竟学到了什么，$grand_tour_events.worth_the_delay$"
 grand_tour_events.35.title: "课业终结"
 grand_tour_events.36.a: "略备小宴，以志纪念。"
 grand_tour_events.36.b: "我们没有时间理会故土的宫廷。"
 grand_tour_events.36.desc: "一封来自 [ROOT.GetCountry.GetName] 的信终于追上了巡游的脚步。信中带来了 [ROOT.GetCountry.GetGovernment.GetRuler.GetName] 的温情话语，说宫廷上下都对 [target_leader.GetName] 赞誉有加，还提到 [target_leader.GetHerHim] 在 [target_leader.GetHerHis] 海外游历期间所写的种种见闻，早已成了家中餐桌上不止一次谈论的话题。"
 grand_tour_events.36.title: "家书一封"
 grand_tour_events.37.a: "让 [target_leader.GetHerHim] 被引荐给合适的人。"
 grand_tour_events.37.b: "接受 [gt_admirer.GetHerHis] 的华服赠礼，正合此行所需。"
 grand_tour_events.37.c: "接受[gt_admirer.GetHerHis]的邀请，寄宿于[gt_admirer.GetHerHis]府中。"
 grand_tour_events.37.desc: "[gt_admirer.GetName]，一位显然为[target_leader.GetHerHis]的身份与教养所倾倒的当地年轻贵族，主动寻上[target_leader.GetHerHim]，急切地想在[target_leader.GetHerHis]造访[target_location.GetName]期间略尽绵力。"
 grand_tour_events.37.title: "当地的追随者"
 grand_tour_events.38.a: "极力争取这次引荐，哪怕可能留下失礼的印象。"
 grand_tour_events.38.b: "全力争取，哪怕出丑也在所不惜。"
 grand_tour_events.38.c: "尽情享受今晚，到此为止。"
 grand_tour_events.38.desc: "在一场晚宴上，[target_leader.GetName] 被安排坐在 [gt_secretary.GetName] 身旁，这位不起眼的年轻人对自己的身份寡言少语，直到一句无意的话透露出他竟是枢机 [target_cardinal.GetName] 的秘书。他不经意地暗示，只要今晚给他留下合适的印象，他一句话便能让 [target_leader.GetNameWithNoTooltip] 得到枢机本人的接见。"
 grand_tour_events.38.title: "一次有用的引荐"
 grand_tour_events.39.a: "继续深入，若有差错恐遭人耻笑。"
 grand_tour_events.39.b: "将论点推向极致，哪怕遭人耻笑也在所不惜。"
 grand_tour_events.39.c: "今日表现尚可，就此打住。"
 grand_tour_events.39.desc: "在 [target_location.GetName] 的一场辩论中，[target_leader.GetName] 提出的论点突然如神来之笔般精妙绝伦，在场的学者们先是一片沉默，随即纷纷点头表示赞许。"
 grand_tour_events.39.title: "灵光一闪"
 grand_tour_events.4.connections: "$grand_tour_events.seek_audience$"
 grand_tour_events.4.experience: "漫步古代遗迹，丈量那些纪念建筑。"
 grand_tour_events.4.knowledge: "向梵蒂冈图书馆的手稿与人文学者请教。"
 grand_tour_events.4.party: "放下废墟，去 [target_location.GetNameWithNoTooltip] 的酒馆里消磨一晚。"
 grand_tour_events.40.a: "乘胜追击，哪怕摔个难看也在所不惜。"
 grand_tour_events.40.b: "强行交锋，哪怕受伤也在所不惜。"
 grand_tour_events.40.c: "适可而止，就此收场。"
 grand_tour_events.40.desc: "在 [target_location.GetName] 的剑术学校的一场比试中，[target_leader.GetName] 发现了一个从未有教官教过的破绽，一时间满室屏息，都想看看 [target_leader.GetSheHe] 会如何利用它。"
 grand_tour_events.40.injury_tt: "[target_leader.GetName] 重重摔了一跤，只得卧床静养，浑身淤青，颜面也扫地"
 grand_tour_events.40.title: "技艺展示"
 grand_tour_events.41.a: "延请医生诊治。"
 grand_tour_events.41.b: "派人去请最好的医生。"
 grand_tour_events.41.c: "任其自然发展。"
 grand_tour_events.41.desc: "[target_leader.GetName]患上了严重的痢疾，医生怀疑是当地的水质所致：他们向随行人员保证并无性命之忧，但病症颇为难受，需让[target_leader.GetHerHim]卧床调养数日，而且诊金可不便宜。"
 grand_tour_events.41.title: "一场病痛"
 grand_tour_events.42.a: "写信回家给 [target_parent.GetHerHim]，并附上一份小礼物。"
 grand_tour_events.42.b: "订制一幅肖像画寄给 [target_parent.GetHerHim]"
 grand_tour_events.42.c: "放弃游历，回家去见 [target_parent.GetHerHim]。"
 grand_tour_events.42.desc: "旅居的新鲜感已渐渐消退，[target_leader.GetName] 发觉 [target_leader.GetHerHis] 思绪总是飘回家中，尤其是牵挂着 [target_parent.GetName]。这令 [target_leader.GetHerHis] 心神难以集中。"
 grand_tour_events.42.title: "思乡之情"
 grand_tour_events.43.a: "以一份小礼物致歉，但恐难以平息不满。"
 grand_tour_events.43.b: "隆重致歉，以示诚意。"
 grand_tour_events.43.c: "此事不予理会。"
 grand_tour_events.43.desc: "事后才发现，[target_leader.GetName] 在昨晚的招待会上未按礼序向当地地方官致意，这一失礼在场众人皆看在眼里，唯独随从们浑然不觉。东道主恐怕不会轻易忘怀，除非以某种致歉之举加以弥补，但若处理不当，反倒可能弄巧成拙。"
 grand_tour_events.43.title: "代价高昂的失礼"
 grand_tour_events.44.a: "次日早晨向地方官举报这些巡逻队员。"
 grand_tour_events.44.b: "在巷中与巡逻队员决斗。"
 grand_tour_events.44.c: "逃到街上，高声呼救。"
 grand_tour_events.44.d: "交出钱袋，转身离去。"
 grand_tour_events.44.desc: "夜幕降临后归途中，[target_leader.GetName] 在一条小巷里遭到一群身着城市巡逻队制服之人的拦截，他们对陌生人钱袋的兴趣，远胜过对自己誓守之法的忠诚。"
 grand_tour_events.44.title: "腐败的巡逻队"
 grand_tour_events.45.a: "一段美好友谊的开端。"
 grand_tour_events.45.b: "祝他一切顺利，与我们自己的圈子保持在一起。"
 grand_tour_events.45.desc: "在一间热闹客栈的人群中，我们的 [ROOT.GetCountry.GetGovernment.GetHeirTitle] 与 [gt_friend.GetName] 攀谈起来，那是来自故国的另一位年轻贵族，出于同样的缘由行着大致相同的路线。二人一见如故，畅谈各自国家与旅途中的种种趣事，随后道路又将他们分开，各自奔赴不同的城市。"
 grand_tour_events.45.title: "旅途中的同伴"
 grand_tour_events.46.a: "悄悄用我们自己的钱袋替 [gt_friend.GetHerHis] 的债务还清。"
 grand_tour_events.46.b: "写信给我们的门路，让他们给[gt_friend.GetHerHim]提供信贷。"
 grand_tour_events.46.c: "祝[gt_friend.GetHerHim]好运，让[gt_friend.GetHerHim]自己想办法脱困，走出[gt_friend.GetHerHis]的路。"
 grand_tour_events.46.desc: "$grand_tour_events.friend_reunion_intro$[gt_friend.GetHerHis]的钱袋，[gt_friend.GetSheHe]坦言，因牌桌上的一连串厄运而空空如也，[gt_friend.GetSheHe]明显有些难为情地问道，在这笔债务变成丑闻之前，我们是否有办法帮上一把。"
 grand_tour_events.46.title: "患难之友"
 grand_tour_events.47.a: "坐下来讲解一番,以我们已知的学识为依据。"
 grand_tour_events.47.b: "另请一位教师,为 [gt_friend.GetHerHim] 细细讲解。"
 grand_tour_events.47.c: "告诉 [gt_friend.GetHerHim] 这不过是件简单的事，便让 [gt_friend.GetHerHim] 自己去琢磨。"
 grand_tour_events.47.desc: "$grand_tour_events.friend_reunion_intro$两人叙旧,谈起分别后各自的所学。[gt_friend.GetNameWithNoTooltip]坦言自己在一场讲座上听得云里雾里,而那内容我们早已在自己的研习中弄得清清楚楚,于是他请我们帮忙解惑。"
 grand_tour_events.47.title: "共同的发现"
 grand_tour_events.48.a: "致信我们的旧识,为 [gt_friend.GetHerHim] 作保。"
 grand_tour_events.48.b: "改为出资,让[gt_friend.GetHerHis]得以出席一场次一等的聚会。"
 grand_tour_events.48.c: "告诉 [gt_friend.GetHerHim] 让 [gt_friend.GetHerHis] 自己去想办法。"
 grand_tour_events.48.desc: "$grand_tour_events.friend_reunion_intro$ [gt_friend.GetNameWithNoTooltip] 听说 [target_location.GetNameWithNoTooltip] 有一处私人沙龙,是 [target_location.GetRank.GetName] 上流家族聚会之所,却在那里没有熟人可为 [gt_friend.GetHerHim] 引荐入内。而 [target_leader.GetName] ,凡此行途中结下的交情,却是另一番情形了。"
 grand_tour_events.48.title: "耳边的一句话"
 grand_tour_events.49.a: "亲自出面;我们知道如何应付这种人。"
 grand_tour_events.49.b: "干脆替他还清欠款,就此了事。"
 grand_tour_events.49.c: "让 [gt_friend.GetHerHim] 独自面对后果。"
 grand_tour_events.49.desc: "$grand_tour_events.friend_reunion_intro$重聚很快便闹得难看:[gt_friend.GetNameWithNoTooltip]与当地一名放债人结下了怨,此刻那人正带着两名雇来的打手站在客栈他们的桌旁,扬言若今晚不还清债务,砸的可不止是家具。"
 grand_tour_events.49.title: "暴力的威胁"
 grand_tour_events.5.connections: "在 [court_host.GetNameWithNoTooltip] 的宫廷中度过最后几周。"
 grand_tour_events.5.experience: "加入挖掘者的队伍，发掘埋没已久的赫库兰尼姆城。"
 grand_tour_events.5.knowledge: "在图书馆与废墟间度过最后几周。"
 grand_tour_events.5.party: "抛下课业，在 [target_location.GetNameWithNoTooltip] 的酒馆里度过最后一夜。"
 grand_tour_events.50.a: "不顾 [gt_friend.GetHerHis] 反对，出钱请大夫诊治。"
 grand_tour_events.50.b: "凭我们自己的行路经验，亲自照料 [gt_friend.GetHerHim]。"
 grand_tour_events.50.c: "前去探望 [gt_friend.GetHerHim] ，祝 [gt_friend.GetHerHim] 早日康复。"
 grand_tour_events.50.d: "还是不要靠近为妙。"
 grand_tour_events.50.desc: "消息传到 [target_leader.GetName] 耳中，说 [gt_friend.GetName] 也来到了 [target_location.GetName]，此刻正因旅途中染上的寒热病卧于当地客栈之中。店主嘀咕道，这年轻人付房钱时钱包看起来颇为单薄，而且为了省下诊费，他已两次将当地大夫拒之门外。"
 grand_tour_events.50.title: "小病一场"
 grand_tour_events.6.connections: "拜会 [court_host.GetNameWithNoTooltip] 及 [target_location.GetRank.GetNameWithNoTooltip] 的显贵世家。"
 grand_tour_events.6.experience: "参观 [ShowGoodsNameWithNoTooltip('marble')] 采石场，考察阿迪杰河沿岸的贸易。"
 grand_tour_events.6.knowledge: "研习罗马遗迹与竞技场的古代工程技艺。"
 grand_tour_events.6.party: "放弃参观竞技场，在城下的酒馆中度过一夜。"
 grand_tour_events.7.connections: "出席 [court_host.GetNameWithNoTooltip] 宫廷的一场演出。"
 grand_tour_events.7.experience: "参观公爵军械库和 [target_location.GetRank.GetNameWithNoTooltip] 的运河船闸。"
 grand_tour_events.7.knowledge: "阅读公爵图书馆中收藏的骑士传奇。"
 grand_tour_events.7.party: "把公爵的诗篇放在一边，享受更热闹的夜晚。"
 grand_tour_events.8.connections: "$grand_tour_events.seek_audience$"
 grand_tour_events.8.experience: "参观那些让[target_location.GetNameWithNoTooltip]的[ShowGoodsNameWithNoTooltip('silk')]丝线闻名于世的作坊。"
 grand_tour_events.8.historical_info: "1739年，正在意大利游历的法国法官夏尔·德·布罗斯，在博洛尼亚拜访了劳拉·巴西的家中，此时她已是欧洲第一位获得大学教席的女性，当地学者常在她家中聚会，探讨关于电学这门新科学的争论。德·布罗斯后来回忆说，他不得不重拾早已生疏的中学拉丁语，才能在众人面前就磁力与“带电物体的奇异吸引力”展开辩论。他将这个夜晚记录在#italic《意大利书简》#!之中，而巴西的沙龙也成为壮游者途经此城时最常造访的地方之一。"
 grand_tour_events.8.knowledge: "在大学听一场民法讲座。"
 grand_tour_events.8.party: "跳过讲堂，与学生们一同饮酒作乐。"
 grand_tour_events.8.title: "[target_location.GetNameWithNoTooltip]，学问之城"
 grand_tour_events.9.connections: "从 [court_host.GetNameWithNoTooltip] 的敞廊观看赛事。"
 grand_tour_events.9.experience: "研习壁画，以及 [target_location.GetRank.GetNameWithNoTooltip] 的著名银行账簿。"
 grand_tour_events.9.historical_info: "1764年秋，小说家托比亚斯·斯莫利特在从佛罗伦萨前往罗马的途中，在锡耶纳留宿一夜，并在其出版的#italic《法意游记》#!中抱怨自己“住的地方臭得像个茅厕”，且“晚餐吃得极为凄惨”。他也承认这座城市“规模宏大、建筑精良”，并指出锡耶纳人“以自身的礬雅和方言的纯正为傲”，甚至有外国游客特意留居此地，只为学习正宗的意大利语发音。斯莫利特的记述后来成为英国人关于托斯卡纳“壮游”待客之道最著名的抱怨之一。"
 grand_tour_events.9.knowledge: "在大学听一场教会法讲座。"
 grand_tour_events.9.party: "放下壁画，转赴田野广场的赌桌。"
 grand_tour_events.9.title: "[target_location.GetNameWithNoTooltip]，帕利奥赛马之城"
 grand_tour_events.attend_university_lectures: "前往大学听课。"
