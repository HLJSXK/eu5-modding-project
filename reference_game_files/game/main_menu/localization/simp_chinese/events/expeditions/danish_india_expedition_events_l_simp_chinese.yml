l_simp_chinese:
 danish_india_expedition_events.1.title: "The Indian Charter Fleet"
 danish_india_expedition_events.1.desc: "The charter has been issued, the company organized, the vessels chartered or built. A small fleet of two or three ocean-going hulls will depart from a [ROOT.GetCountry.GetAdjective] port, sail south around the African coast, round the Cape of Good Hope, recross the [ShowRegionName('indian_ocean_region')], and seek a trading concession on the Coromandel coast of southern $india$. The voyage is the first of its kind under [ROOT.GetCountry.GetAdjectiveWithNoTooltip] colors. It will be at least eighteen months before any news returns. The [ROOT.GetCountry.GetGovernment.GetCourtTitle] is divided as to whether this is a great undertaking or a great folly."
 danish_india_expedition_events.1.a: "Provision the fleet generously. We will not be remembered as the [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')] that sent its merchants to die."
 danish_india_expedition_events.1.b: "A modest commission. The charter company has its own capital."
 danish_india_expedition_events.1.historical_info: "The Danish East India Company (#italic Dansk Ostindisk Kompagni#!) was chartered by Christian IV in 1616, and its first expedition under Admiral Ove Gjedde sailed from Copenhagen in 1618. After a difficult two-year voyage that lost most of its complement to scurvy and disease, the expedition reached the Coromandel coast and negotiated with the Nayak of Tanjore for a trading concession at the village of Tharangambadi (later Anglicized to Tranquebar). The fortified factory of Dansborg was completed in 1620 and remained Danish until the colony was sold to the British in 1845, making Tranquebar one of the longest-held European settlements in India."
 danish_india_expedition_events.2.title: "The Cape of Storms"
 danish_india_expedition_events.2.desc: "The fleet has reached the great cape at the southern tip of [ShowContinentName('africa')], the Cape that the [ShowCultureName('portuguese')] aptly named the Cabo das Tormentas. The weather here, even in summer, is of a kind no [ShowRegionName('baltic_region')] captain has seen before: the wind hauls from the south-west with a force that rolls the ships onto their beam-ends, and the surf on the lee shore is the color of an old man's hair. The pilot suggests a few days in Table Bay for fresh water and meat from the [ShowCultureGroupName('khoisan_group')] pastoralists who graze cattle near the beach. The captains are divided as to whether the time is worth the loss of the southerly wind."
 danish_india_expedition_events.2.a: "Put in at Table Bay. Fresh water and beef will save more men than the days will cost."
 danish_india_expedition_events.2.b: "Round the Cape under press of sail. The men can drink rain when it comes."
 danish_india_expedition_events.2.historical_info: "The Cape of Good Hope, first rounded by Bartolomeu Dias in 1488, became the standard refreshment stop on the eastern run from Europe to the Indian Ocean. Permanent Dutch settlement at the Cape began with Jan van Riebeeck's Table Bay station in 1652, founded specifically to provision passing East Indiamen with water, fresh vegetables, and meat traded from the local Khoikhoi pastoralists. Before the Dutch settlement, passing fleets called informally at Table Bay and negotiated directly with the Khoikhoi for cattle, sheep, and the brackish water of the small streams running off Table Mountain."
 danish_india_expedition_events.3.title: "The [ShowRegionNameWithNoTooltip('swahili_coast_region')]"
 danish_india_expedition_events.3.desc: "The fleet has reached [target_location.GetName], principal port of the [ShowRegionName('swahili_coast_region')], where the [ShowRegionName('indian_ocean_region')] trade has been organized by Arabs and Africans for almost a thousand years before any [ROOT.GetCountry.GetAdjective] soul was born. The harbor is full: [ShowCultureName('omani_culture')] dhows, [ShowCultureName('gujarati')] patamars, and even a battered [ShowCultureName('portuguese')] hulk doing repairs at the careenage. The local pilots offer to guide us across the monsoon to the Coromandel coast for what seems an unreasonable fee. The local merchants offer cargoes of [ShowGoodsName('ivory')], mangrove poles, and [ShowGoodsName('goods_gold')] from the upper [ShowAreaName('zambezi_area')] at prices that would be unreasonable on any other coast. The [target_country.Custom('GetRulerOrRegentTitle')] offers us a cordial reception and protection for as long as we are in their waters."
 danish_india_expedition_events.3.a: "Hire the [ShowCultureNameWithNoTooltip('swahili_culture')] pilot and learn about the monsoon from those who own it."
 danish_india_expedition_events.3.b: "Trust our own navigators. The seasonal winds are documented enough."
 danish_india_expedition_events.3.historical_info: "The Swahili coast from Mogadishu to Sofala had been a self-organizing commercial network for nearly a millennium before European fleets began arriving in numbers. Mombasa, Malindi, Kilwa, and the smaller stone towns of the coast traded Indian Ocean cargoes in their own ships, used their own pilots, and answered to their own Sultans. The Portuguese disruption of this network in the early sixteenth century never fully replaced the indigenous trade, and seventeenth-century European fleets bound for India routinely paid Swahili pilots to guide them across the southwest monsoon, an arrangement that handed substantial commercial intelligence back to the Swahili merchant houses in the same breath."
 danish_india_expedition_events.4.title: "[european_power.GetAdjectiveWithNoTooltip] Roadstead in the [ShowAreaNameWithNoTooltip('cape_verde_area')]"
 danish_india_expedition_events.4.desc: "The fleet has anchored off a small [european_power.GetAdjective] factory on [target_location.GetName]. The factor is a man of indeterminate descent and considerable shrewdness, who runs a careful trade in dried meat, water from the volcanic springs above the town, and the crops that his hinterland grows in marginal quantities on the windward slopes. He offers our captains his hospitality, his prices, and his frank opinion that any fleet planning to cross the [ShowContinentName('atlantic_ocean_continent')] without provisioning here is a fleet planning to bury its crew at sea. The captains, on consideration, do not entirely disagree with him."
 danish_india_expedition_events.4.a: "Pay the factor's prices. A drowned man is dearer than a paid bill."
 danish_india_expedition_events.4.b: "Take only water. The men can eat ship's biscuit a while longer."
 danish_india_expedition_events.4.historical_info: "The Cape Verde islands, claimed by Portugal in the mid-fifteenth century, became the standard refreshment stop on the long Atlantic leg of the East Indies and Brazil runs. Ribeira Grande on Santiago, founded around 1462, was the first European city in the tropics and the operational center of the Portuguese Atlantic slave trade for over a century. By the time a Danish-Indian Charter fleet might call there, the city had passed through several hands and its function as a provisioning station persisted for foreign fleets willing to pay whichever European factor now ran the place."
 danish_india_expedition_events.5.title: "The [ShowAreaNameWithNoTooltip('gold_coast_area')] Under [european_power.GetAdjectiveWithNoTooltip] Colors"
 danish_india_expedition_events.5.desc: "The fleet has come abreast of the [ShowAreaName('gold_coast_area')], where a small [european_power.GetAdjective] factory dominates the local trade with the inland [ShowCultureName('akan')] polities for [ShowGoodsName('goods_gold')] dust, [ShowGoodsName('slaves_goods')], and [ShowGoodsName('ivory')]. A few rival European pinnaces are visible further along the beach, but the principal castle at this latitude flies [european_power.GetNameWithNoTooltip]'s flag. The local kabosseers send a messenger inviting our captains to a parley, with the implicit understanding that a small consignment of [ShowGoodsNameWithNoTooltip('goods_gold')] dust might change hands in exchange for the proper courtesies. The captains are tempted but mindful that the fleet is bound for the Indies, not the African trade."
 danish_india_expedition_events.5.a: "Take a small consignment of [ShowGoodsNameWithNoTooltip('goods_gold')] dust. The Indies are far, and a defrayed cost is a real cost."
 danish_india_expedition_events.5.b: "Pass the coast without dealings. We are not here to be the seventh European trader on this beach."
 danish_india_expedition_events.5.historical_info: "The Gold Coast (modern Ghana) had been the focal point of European trade with West Africa since the Portuguese established Elmina Castle in 1482. By the early seventeenth century the Coast was contested between half a dozen European powers, with factories under as many flags operating within sight of each other. The trade was organized through the African coastal polities of the Fante and Ga, who controlled access to the inland Akan goldfields and the slave-supply caravans from the interior."
 danish_india_expedition_events.6.title: "The [european_power.GetAdjectiveWithNoTooltip] Citadel at [target_location.GetNameWithNoTooltip]"
 danish_india_expedition_events.6.desc: "The fleet has come up the [ShowAreaName('mozambique_channel_area')] and approached [target_location.GetName], the small fortified island that anchors [european_power.GetName]'s authority on the lower [ShowRegionName('swahili_coast_region')]. A stone fortress dominates the harbor entrance; an Indiaman is offloading at the customs quay; a great hulk is taking on water for the run to the Indies. The captain-major, hailing our captains to pay courtesy at the citadel, is polite, watchful, and informative. He asks whose flag we sail under and where we are bound, and his clerk writes the answers down carefully. We will be remembered in [european_power.GetCapital.GetName] by the next homebound packet."
 danish_india_expedition_events.6.a: "Pay courtesy at the citadel. A friendly call costs less than a quarrel with [european_power.GetNameWithNoTooltip]."
 danish_india_expedition_events.6.b: "Anchor offshore. They can record us from where they sit."
 danish_india_expedition_events.6.historical_info: "Ilha de Moçambique, fortified by the Portuguese from 1507, was the administrative capital of Portuguese East Africa until 1898 and a mandatory stop for Indiamen running between Lisbon and Goa. The fortress of São Sebastião, completed in 1583, remains the largest standing structure of European colonial architecture south of the Sahara. By the late seventeenth century the citadel could change hands; its strategic position on the lower Swahili coast made it a natural prize for whichever European power could project naval force into the western Indian Ocean."
 danish_india_expedition_events.14.title: "[danish_fleet.GetAdjectiveWithNoTooltip] Fleet at the [ShowAreaNameWithNoTooltip('cape_verde_area')] Factory"
 danish_india_expedition_events.14.desc: "The factor at our [ShowAreaName('cape_verde_area')] station reports that a [danish_fleet.GetAdjective] fleet, two well-found vessels of unfamiliar pattern flying the colors of the [danish_fleet.GetAdjectiveWithNoTooltip] East India Company, called yesterday for water and provisions. They paid in good silver, took on enough to feed their crews across the [ShowContinentName('atlantic_ocean_continent')], and sailed south on the next morning's wind. The factor describes the [danish_fleet.GetAdjectiveWithNoTooltip] captain as quiet, observant, and clearly well-informed. He understands the fleet is bound for [ShowSubContinentName('south_asia')]. We will hear of them again."
 danish_india_expedition_events.14.a: "An interesting development. Note it in the next dispatch home."
 danish_india_expedition_events.15.title: "A [danish_fleet.GetAdjectiveWithNoTooltip] Vessel on the [ShowAreaNameWithNoTooltip('gold_coast_area')]"
 danish_india_expedition_events.15.desc: "Our factor on the [ShowAreaName('gold_coast_area')] reports that a [danish_fleet.GetAdjective] vessel called briefly, traded for a small consignment of [ShowGoodsName('goods_gold')] dust at the local king's market, and continued east. The captain made it understood that his fleet was bound for the East Indies and not for the [ShowContinentName('atlantic_ocean_continent')] trade. The factor adds, with a touch of unease, that [danish_fleet.GetNameWithNoTooltip] seemed unusually familiar with the lay of the coast for a power that has no factory of its own here."
 danish_india_expedition_events.15.a: "Watch them. A [danish_fleet.GetAdjectiveWithNoTooltip] presence on this coast is something to consider before it grows."
 danish_india_expedition_events.16.title: "[danish_fleet.GetAdjectiveWithNoTooltip] Fleet at the [ShowLocationNameWithNoTooltip('mozambique')] Citadel"
 danish_india_expedition_events.16.desc: "The captain-major of our citadel on [ShowLocationName('mozambique')] reports the arrival of a [danish_fleet.GetAdjective] charter fleet, evidently bound for the Coromandel coast on a trading commission. The [danish_fleet.GetAdjectiveWithNoTooltip] captain paid courtesy at the citadel, accepted refreshments, answered questions cordially, and asked some careful ones of his own about the run to [ShowSubContinentName('south_asia')]. He sailed within the week. The captain-major has dispatched a packet describing the encounter; we will know more when it arrives."
 danish_india_expedition_events.16.a: "Note the visit. A new flag in the [ShowRegionNameWithNoTooltip('indian_ocean_region')] is the kind of news that bears keeping."
 danish_india_expedition_events.7.title: "[target_location.GetNameWithNoTooltip] and the Monsoon"
 danish_india_expedition_events.7.desc: "The fleet has reached [target_location.GetName] on the [ShowAreaName('oman_sea_zones_area')], where the local dynasty has lately built a fleet of its own that contests [ShowRegionName('indian_ocean_region')] shipping from the Persian Gulf to the East African coast. The [ShowCultureName('omani_culture')] harbor-master is courteous, the prices are reasonable, and the [ShowCultureGroupName('arabian_group')] pilots who hire on for the monsoon crossing know the Coromandel coast as a [ShowRegionName('baltic_region')] seaman knows the approaches to [ShowLocationName('riga')]. They offer their services for the crossing for what seems an unreasonable fee. The captains, after their experience at [ShowLocationName('mombasa')], are inclined to accept."
 danish_india_expedition_events.7.a: "Hire the [ShowCultureNameWithNoTooltip('omani_culture')] pilot. The monsoon is more forgiving with the right hand on the chart."
 danish_india_expedition_events.7.b: "Trust our own pilots and the [ShowLocationNameWithNoTooltip('mombasa')] charts. The wind is what it is."
 danish_india_expedition_events.7.historical_info: "The Yaarubid Imamate of Oman, founded in 1624, drove the Portuguese out of Masqaṭ (Muscat) in 1650 and built an Indian Ocean trading and raiding empire that contested European primacy on the East African and Persian coasts for over a century. Omani pilots were considered the most reliable guides to the monsoon crossings between Africa, Arabia, India, and the East Indies, and their hire was a routine cost of business for European fleets willing to admit that their own navigators did not know the Indian Ocean as well as they would have preferred to."
