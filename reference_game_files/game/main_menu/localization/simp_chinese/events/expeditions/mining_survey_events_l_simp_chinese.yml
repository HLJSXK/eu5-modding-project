l_simp_chinese:
 mining_survey_events.1.title: "勘矿委员会"
 mining_survey_events.1.desc: "一队探矿人在庭院中整装待发，驮骡背上驮着镐头、钻具，还有一只涂了油的木箱，里面装着化验师的坩埚、天平与各种强酸。他们将在我们的高地乡野跋涉一整年，检测溪床中的沙金，敲凿石英矿脉，并向牧人询问哪些山谷的淘洗盘中能见到成色。这片山地过去也曾慷慨馈赠财富，往往是给予了那些我们早已遗忘的族群。没有理由认为，这里已经一无所有。"
 mining_survey_events.1.a: "Spare no expense. Send the best assayers and a generous purse for samples."
 mining_survey_events.1.b: "A modest commission will do. The headmen will provide guides and shelter."
 mining_survey_events.1.historical_info: "系统性的勘矿活动在中世纪与近代早期的欧洲各地均有实践，其中最著名的当属萨克森与波希米亚境内的厄尔士山脉——十二世纪银矿脉的发现，造就了弗赖贝格、雅希莫夫与施内贝格等一批繁荣的矿业城镇。格奥尔格·阿格里科拉所著 #italic 《矿冶全书》 #! （1556年）成为这一行业的标准教科书，详细记载了占卜杖的使用方法、以小坩埚化验矿石样本的流程，以及规范矿权申领的法律惯例。"
 mining_survey_events.10.title: "一道 [ShowGoodsNameWithNoTooltip('iron')] 矿脉"
 mining_survey_events.10.desc: "探矿人发现了一道深入山体的高品位 [ShowGoodsName('iron')] 矿脉，岩石在镐头凿开之处露出黑红相间的纹理。最近村庄的头人说，他的祖父曾提起山坡上某处的旧矿坑；这些新矿井或许只是重新打开了昔日遗失之地。若此矿藏能持续下去，下游的锻炉与铸造厂将足以繁荣一代人之久。"
 mining_survey_events.10.a: "宣布这一发现，让 [ROOT.GetCountry.GetFlavorRank] 知晓我们的收获。"
 mining_survey_events.10.b: "Develop it quietly. The rival foundries need not hear of it yet."
 mining_survey_events.10.historical_info: "前现代欧洲的铁矿开采多集中于小型露天矿场与沿矿脉露头开挖的浅井，矿石经块炼炉在矿场附近直接炼成熟铁。中世纪晚期引入的高炉，使得生铁得以大规模生产，瑞典、施蒂利亚与巴斯克地区等重要产铁地区，正是凭此建立起近代早期的繁荣。"
 mining_survey_events.11.title: "一道 [ShowGoodsNameWithNoTooltip('copper')] 矿脉"
 mining_survey_events.11.desc: "探矿人沿着一道泛绿的岩石痕迹爬上山坡，找到了源头：一道 [ShowGoodsName('copper')] 矿脉贯穿悬崖表面，暴露在风雨之中，正待开采。化验师在随身携带的铁砧上敲下一块样本，投入坩埚熔炼，随后报告说这金属纯净，产出颇丰。南方城镇的冶炼工匠已在召集之中。"
 mining_survey_events.11.a: "Develop the workings openly. The [ROOT.GetCountry.GetFlavorRank] should know we strike [ShowGoodsNameWithNoTooltip('copper')]."
 mining_survey_events.11.b: "Develop the workings quietly. The brass-founders will pay better if rumor stays low."
 mining_survey_events.11.historical_info: "在前工业化时期的欧洲，铜矿开采集中于少数几处著名矿区：瑞典的法伦、厄尔士山脉的山坡、萨克森的曼斯费尔德地区，以及蒂罗尔阿尔卑斯山区。这种金属对于铸造青铜火炮、船体包铜与黄铜制品皆不可或缺，一座产量丰厚的铜矿既能使拥有它的王室获利，也能使资助其开发的商号致富。富格尔银行世家的崛起，部分正是得益于他们对蒂罗尔铜矿的掌控。"
 mining_survey_events.12.title: "山间的一道 [ShowGoodsNameWithNoTooltip('tin')] 矿脉"
 mining_survey_events.12.desc: "勘探者们沿坡追踪河床中黑色的锡石卵石，最终在露头处找到了矿脉，含 [ShowGoodsName('tin')] 的矿石沿石英脉分布，厚实而洁净。矿工们已经在山脚下架设木质竖井，并搭建了捣矿机。青铜铸工、锡镴匠和餐具匠们都将有一代人可用的原料。"
 mining_survey_events.12.a: "Announce the discovery. A new [ShowGoodsNameWithNoTooltip('tin')] lode is a matter of state interest."
 mining_survey_events.12.b: "Keep the find quiet. The bronze trade rewards those who corner the supply."
 mining_survey_events.12.historical_info: "锡在前现代世界是一种战略金属，既是铸造青铜炮的必需品，也是家用锡镴器皿的原料，其产地集中于少数几个著名地区：康沃尔、厄尔士山脉以及波希米亚部分地区。自中世纪以来，康沃尔的锡矿区享有特殊的法律地位，拥有自己的法庭和议会，康沃尔的锡贸易为整个大西洋沿岸欧洲的黄铜与青铜生产提供了原料。"
 mining_survey_events.13.title: "石灰岩中的方铅矿"
 mining_survey_events.13.desc: "丘陵地带发现了一条方铅矿矿脉，其暗色晶体中闪烁着银光，预示着一种颇具价值的冶炼副产品。这条矿脉中的 [ShowGoodsName('lead')] 将用于教堂屋顶、管道内衬和铸造弹丸，而其中的 [ShowGoodsName('silver')] 成分则有助于筹措开发资金。矿场主管报告称作业面清爽整洁，新竖井中气流稳定畅通。"
 mining_survey_events.13.a: "公布这一发现。[ShowGoodsNameWithNoTooltip('lead')] 事关公众利益。"
 mining_survey_events.13.b: "Quietly contract the output to the powder mills and the printers."
 mining_survey_events.13.historical_info: "在前现代欧洲，铅与银几乎总是共生开采，方铅矿通过古代发明、并在中世纪不断完善的灰吹法可同时提炼出这两种金属。英格兰的门迪普丘陵、萨克森的哈尔茨山脉，以及西班牙的莫雷纳山脉都是重要的铅银矿区，其产出的铅被用于从教堂屋顶到印刷活字，再到城市供水铅管的方方面面。"
 mining_survey_events.14.title: "[ShowGoodsNameWithNoTooltip('silver')] 在岩石中"
 mining_survey_events.14.desc: "勘探者们发现了 [ShowGoodsName('silver')]，矿脉宽阔到足以挥镐开采，纯度之高甚至可直接从岩石中抛光而出。化验师的坩埚还因试炼而余温未散。竖井已加装木架支撑，第一批矿车正由吱呀作响的绞车吊运到地面。这一代人无需再为铸币缺少金银而发愁，[ShowContinentName('europe')] 各国宫廷不出一年便会知晓这一发现。"
 mining_survey_events.14.a: "Announce the strike to the [ROOT.GetCountry.GetFlavorRank]. A [ShowGoodsNameWithNoTooltip('silver')] mine is a triumph."
 mining_survey_events.14.b: "Keep the strike quiet. Foreign interest in our [ShowGoodsNameWithNoTooltip('silver')] could prove inconvenient."
 mining_survey_events.14.historical_info: "Silver mining transformed European economies in the late medieval and early modern periods. The discovery of major silver veins at Schwaz in the Tyrol and Joachimsthal in Bohemia in the late 1400s, followed by the Potosí strike in the Andes in 1545, flooded Europe with bullion and underwrote the great inflations of the sixteenth century. A productive silver mine was a strategic asset on the scale of a fleet or a fortress."
 mining_survey_events.15.title: "黄色的金属"
 mining_survey_events.15.desc: "勘探者们发现了 [ShowGoodsName('goods_gold')]。一条石英矿脉夹杂着粗大的金属丝线，在一次冬季山崩剥去覆土后裸露于崖壁之上。这金属在灯光下熠熠生辉，自岩层形成以来从未被触碰过。村中长老提出愿意将此矿场租给 [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')]，条件是他所称的公平分成。化验师建议接受，但需附加条件。"
 mining_survey_events.15.a: "宣布这一发现，让敌人也听到消息。"
 mining_survey_events.15.b: "Develop the workings quietly. [ShowGoodsNameWithNoTooltip('goods_gold')] attracts unwanted visitors."
 mining_survey_events.15.historical_info: "在前现代欧洲，天然金矿藏十分稀少，且很早便被开采殆尽。斯洛伐克的克雷姆尼察与瓦拉几亚的弗兰恰中世纪金矿曾是重要的本地来源，但大多数欧洲黄金来自莱茵河、塔霍河等河流的冲积采金，或是从铅银矿中提炼出的银中金分。任何数量的天然金矿被发现，都是一场头等的意外之财，王室也必定会设法将其收归己有。"
 mining_survey_events.16.title: "黑石燃烧正旺"
 mining_survey_events.16.desc: "此地丘陵间贯穿着一条厚厚的 [ShowGoodsName('coal')] 矿脉，在两处因溪流侵蚀切入地层而露出地表。这条矿脉可以追踪开采，[ShowGoodsNameWithNoTooltip('coal')] 燃烧起来十分干净。当地铁匠已经开始用炉用木材来交换它。锻炉、盐田和玻璃作坊都可以由这条矿脉供应燃料，而不必再进一步砍伐国内的森林。"
 mining_survey_events.16.a: "Develop the seam under [ROOT.GetCountry.GetGovernment.GetAdjective] grant. The [ROOT.GetCountry.GetFlavorRank] should know."
 mining_survey_events.16.b: "Lease the workings to the iron-masters in exchange for a steady fraction."
 mining_survey_events.16.historical_info: "煤矿开采自中世纪起便在欧洲小规模进行，主要集中在威尔士、纽卡斯尔煤田以及列日的部分地区，但其真正的扩张要到近代早期的燃料危机时期，当时森林被大量砍伐以扩大耕地。十七世纪，纽卡斯尔的海运煤已经以千吨规模运往伦敦，若没有它，铁器业恐怕难以承受木炭的匮乏。"
 mining_survey_events.17.title: "一块上佳的切割 [ShowGoodsNameWithNoTooltip('stone')]"
 mining_survey_events.17.desc: "丘陵间新开了一处采石场，[ShowGoodsName('stone')] 沿其层理面切割整齐，出露后硬化良好。石匠大师已被从大教堂工地请来检验样石，认定它既适合做方石、精细雕刻，也可用于承重砌层。往后一代人间，百里之内的每座大教堂与城墙都将依赖它。"
 mining_survey_events.17.a: "Take the workings into [ROOT.GetCountry.GetGovernment.GetAdjective] hands. [ShowGoodsNameWithNoTooltip('stone')] is a strategic resource."
 mining_survey_events.17.b: "Lease the quarry to the master masons' guild for a steady rent."
 mining_survey_events.17.historical_info: "在前工业化的欧洲，建筑石材是一种流通缓慢却颇具价值的商品，因为运输成本是决定其价格的主要因素。一处距大城市或建筑工地仅一日运程的高产采石场，堪称长期资产。兰斯、索尔兹伯里与科隆的中世纪大教堂工程都曾维持专属采石场数代之久，以供应其建造所需。"
 mining_survey_events.18.title: "[ShowGoodsNameWithNoTooltip('marble')] 在洼地中"
 mining_survey_events.18.desc: "一处隐蔽的洼地中发现了品质极佳的带纹 [ShowGoodsName('marble')]，石匠大师已切割出样石，抛光后呈现出深邃而近乎透亮的光泽。当地雕塑家已在争相请求优先购买这批出产。远至首都的作坊都将依赖这处采石场供应长达一代人的时间，祭坛雕饰与墓碑雕刻的匠人们都将为此庆幸不已。"
 mining_survey_events.18.a: "Make the discovery known. A great [ShowGoodsNameWithNoTooltip('marble')] quarry is a national treasure."
 mining_survey_events.18.b: "Reserve the [ShowGoodsNameWithNoTooltip('marble')] for [ROOT.GetCountry.GetGovernment.GetAdjective] workshops. Discretion serves us better than fame."
 mining_survey_events.18.historical_info: "中世纪与文艺复兴时期欧洲精美雕塑与建筑所用的大理石，多产自屈指可数的几处名矿：托斯卡纳的卡拉拉、希腊的帕罗斯与彭特利库斯，以及比利牛斯山的圣贝阿。发现一处新的优质雕像用大理石矿脉，在艺术家之间会成为一件大事，他们会定制样品，甚至亲自前往勘察这一大有可为的发现。"
 mining_survey_events.19.title: "熠熠生辉的石头"
 mining_survey_events.19.desc: "勘探者们在一处河床中发现了含[ShowGoodsName('gems')]的砾石，并循迹追溯到山坡上方更为丰富的矿囊，那里的母岩是布满晶体的伟晶岩。从首都请来的宝石匠代表将一堆原石按颜色与净度分类，报告称可切割部分品质卓越。这一代的宫廷珠宝匠将不愁没有宝石可用。"
 mining_survey_events.19.a: "Announce the find. A [ShowGoodsNameWithNoTooltip('gems')]-pit is a wonder worth boasting of."
 mining_survey_events.19.b: "Reserve the output for the [ROOT.GetCountry.GetGovernment.GetAdjective] household. [ShowGoodsNameWithNoTooltip('gems')] are a discreet sort of wealth."
 mining_survey_events.19.historical_info: "与印度、缅甸的宝石大矿相比，欧洲的宝石开采规模不大，但波希米亚高地、苏格兰凯恩戈姆山脉以及比利牛斯山部分地区，都开采着石榴石、绿柱石、紫水晶与黄玉等本地资源。莱茵兰的伊达尔-奥伯施泰因宝石作坊，成为切割本地矿石的中心，一处丰产的矿藏足以让当地工匠忙碌多年。"
 mining_survey_events.20.title: "山中的朱砂"
 mining_survey_events.20.desc: "A cinnabar deposit has been opened in the highlands, its bright red ore the unmistakable sign of [ShowGoodsName('mercury')] in the rock. The retort and the condenser are being set up at a safe distance from the workings. The alchemists, the assayers, and the gilders will all draw on this mine for a generation, and the silver-refiners of the New World may yet pay anything to ship our quicksilver to their mints."
 mining_survey_events.20.a: "公开开发此矿。[ShowGoodsNameWithNoTooltip('mercury')] 乃是战略性商品。"
 mining_survey_events.20.b: "Develop the mine quietly. A monopoly on quicksilver is a powerful thing."
 mining_survey_events.20.historical_info: "汞是唯一在室温下呈液态的金属，对于十六世纪主导美洲白银冶炼的汞齐法而言不可或缺。卡斯蒂利亚的阿尔马登矿与卡尼奥拉的伊德里亚矿，是欧洲两大主要产地，西班牙王室将阿尔马登矿严格垄断为王室专营，所产之汞由大帆船在海军护航下运往墨西哥与秘鲁。"
 mining_survey_events.21.title: "一处盐泉"
 mining_survey_events.21.desc: "高地上新开采出一处岩盐 [ShowGoodsName('salt')] 矿床，地层横穿谷底之处涌出盐泉。煮盐工已经开始劳作，当地农民也牵着牲畜前来盐泉饮水。腌肉贸易与餐桌用度都将因此改善，倘若我们决定征收盐税，仅凭这一发现所得，便足以支付 [ROOT.GetCountry.GetGovernment.GetAdjective] 家用一年之需。"
 mining_survey_events.21.a: "在 [ROOT.GetCountry.GetGovernment.GetAdjective] 特许下开发 [ShowGoodsNameWithNoTooltip('salt')] 矿场。"
 mining_survey_events.21.b: "Lease the operation to the salt-merchants for a steady fraction."
 mining_survey_events.21.historical_info: "盐在近代以前的欧洲是一种战略性商品，不仅是食物保存不可或缺之物，也是国家财政收入的重要来源，各种盐税与盐业专营制度由此而生，其中最著名的当属法国的盐税制度（gabelle）。波兰的维利奇卡盐矿、奥地利的哈尔施塔特盐矿以及加泰罗尼亚的卡多纳盐矿，均历经数百年开采，为拥有它们的家族与王室带来了巨额财富。"
 mining_survey_events.22.title: "[ShowGoodsNameWithNoTooltip('alum')] 页岩"
 mining_survey_events.22.desc: "勘探者们在丘陵地带发现了富含 [ShowGoodsName('alum')] 的页岩，岩石经天然风化生成一种盐类，染工们愿不惜代价购买。试验性的蒸馏炉已从初步样本中提炼出洁白纯净的 [ShowGoodsNameWithNoTooltip('alum')]，布商代表已在打听长期供货合约的事宜。纺织业早已期盼能有一处比教皇在托尔法的专营地更近的货源。"
 mining_survey_events.22.a: "Announce the find. [ShowGoodsNameWithNoTooltip('alum')] is a triumph of the [ROOT.GetCountry.GetFlavorRank]'s industry."
 mining_survey_events.22.b: "Develop the workings quietly. The papal [ShowGoodsNameWithNoTooltip('alum')] monopoly does not need to know."
 mining_survey_events.22.historical_info: "明矾是使染料固着于布料上不可或缺的媒染剂，在中世纪与近代早期都是重要的纺织业战略物资。1462年，教皇国托尔法地区发现了大规模明矾矿藏，梵蒂冈由此建立起长达一个多世纪的垄断经营，直到英格兰、瑞典与荷兰相继开发出其他矿源为止。任何一个能够自产明矾的国家，都能使本国的纺织业摆脱令人烦恼的对外依赖。"
 mining_survey_events.23.title: "[ShowGoodsNameWithNoTooltip('saltpeter')] 在山谷中"
 mining_survey_events.23.desc: "人们已从一处避风山谷的土壤中提炼出 [ShowGoodsName('saltpeter')]，白色的结晶在春雪消融后绽放于岩壁之上。从兵工厂调来的火药师查验了这些粗制硝石，宣称其品质足以精炼成上等火药。这一代人不必再为硝石匮乏而发愁，[ROOT.GetCountry.GetFlavorRank] 的炮兵部队终于能够配得上其雄心。"
 mining_survey_events.23.a: "Develop the workings under [ROOT.GetCountry.GetGovernment.GetAdjective] monopoly. [ShowGoodsNameWithNoTooltip('saltpeter')] is a matter of war."
 mining_survey_events.23.b: "Allow the powder-merchants to develop the workings in exchange for first call on the output."
 mining_survey_events.23.historical_info: "硝石是火药的主要成分，在近代以前的欧洲，人们从长期经粪肥滋养的避风土壤中提取硝石，或不惜重金从印度和黎凡特进口。国家对硝石生产的控制是一项战略要务：英格兰设立了硝石采集人制度，赋予其在马厩与鸽舍下方掘地的合法权力；而法国则将 #italic Régie des Poudres #! 作为王室专营机构，一直维持到十九世纪。"
 # BAD events
 mining_survey_events.30.title: "试验坑道坍塌"
 mining_survey_events.30.desc: "[ShowGoodsName('iron')] 矿场发生了灾难。试验竖井在夜间坍塌，矿脉上方松散页岩缓慢下陷，将支撑木架尽数摧毁。两名勘探队员被埋，另有一名化验师学徒被拖出时摔断了腿，并发誓再也不下矿井。矿场主管说 [ShowGoodsNameWithNoTooltip('iron')] 确实就在那里，但要开采到它，就必须穿过更坚硬的岩层新开一条平巷，费用将十分可观。"
 mining_survey_events.30.a: "Withdraw the team. Some prospects are not worth burying men to reach."
 mining_survey_events.30.historical_info: "顶板坍塌与竖井事故是近代以前采矿业长期存在的职业隐患。支撑坑道的木架在潮湿地下容易腐烂；矿脉上方的松散岩层常常毫无征兆地滑落；而当时通行的房柱式采矿法，随着矿石不断被采出，也会留下越来越多缺乏支撑的空洞。矿工礼拜堂、矿工丧葬互助会以及矿工遗孀基金，是欧洲每一个矿区不可或缺的常设机构。"
 mining_survey_events.31.title: "矿井中的有毒烟气"
 mining_survey_events.31.desc: "[ShowGoodsName('copper')] 矿场出产的矿石情况出人意料。第一座焙烧堆本是用来在熔炼前驱除硫化物的，却排出刺鼻的黄烟，将工人们赶下了山坡，还使下风半英里内的草木枯萎。当地农民已正式提出抗议。冶金师说他能建造合适的焙烧窑来控制烟气，但这需要一笔我们未曾预算的黄金和时间。"
 mining_survey_events.31.a: "Abandon the prospect. The locals are not wrong about the air."
 mining_survey_events.31.historical_info: "硫化矿石炼铜会释放大量二氧化硫，损害周边乡野的农作物、家畜与人的肺部。瑞典的法伦铜矿区因烟害而恶名远扬，据说使周围数英里的农田变得贫瘠不堪；下哈茨地区那座著名的炼铜山谷同样惨遭荼毒。自中世纪以来，因烟害而起诉矿业经营者的民事诉讼屡见不鲜。"
 mining_survey_events.32.title: "河床干涸"
 mining_survey_events.32.desc: "[ShowGoodsName('tin')]矿场起初大有前景：河床中的冲积锡石数量可观，一车又一车地从河床中淘出。但这处冲积矿的源头始终未被找到，如今河床中的重矿石已被淘尽。开凿在矿场上方山坡的探坑也只挖到了贫瘠的母岩。勘探队已经找不到明显可挖之处，而在毫无证据的情况下开凿更深的矿井，其成本实在难以justify——难以合理支出。"
 mining_survey_events.32.a: "放弃这处矿场。这处冲积矿不过是昙花一现。"
 mining_survey_events.32.historical_info: "冲积锡矿的淘洗，即在溪流与河床中开采含锡砾石，是康沃尔锡矿开采最初的方式，并一直延续到近代早期。一旦易得的砾石被淘尽，矿工们便须通过对周边山地系统性的勘探，沿冲积矿脉追溯其源头。许多前景看好的溪流，最终却只通向一条稀薄分散、不足以证明地下开采成本合理的矿脈——不值得开凿地下矿井。"
 mining_survey_events.33.title: "工人病倒"
 mining_survey_events.33.desc: "[ShowGoodsName('lead')] 矿场正在产出矿石，工人们却在诉苦连连。下班的矿工们牙龈泛灰、关节肿胀，浑身沉重乏力，营地医师称之为"
 mining_survey_events.33.a: "Close the workings. We did not come here to bury free men of the [ROOT.GetCountry.GetFlavorRank]."
 mining_survey_events.33.historical_info: "Lead poisoning, the #italic colic plumbica#! of the ancients, was a well-known occupational disease of lead miners, smelters, glaziers, and potters. Bernardino Ramazzini's #italic De morbis artificum diatriba#! (1700), the foundational text of occupational medicine, devoted a long chapter to the affliction. The standard remedies of bleeding, purging, and milk-drinking were ineffective, and the only real preventive was to limit exposure, which mine-owners had little economic incentive to do."
 mining_survey_events.34.title: "矿脉断绝"
 mining_survey_events.34.desc: "勘探者最初开凿 [ShowGoodsName('silver')] 矿脈时，其脉宽可观，头几车矿石化验含 [ShowGoodsNameWithNoTooltip('silver')] 逾三十马克每百磅。然而沿矿层倾角向下十码处，矿脈骤然收窄，矿石也变得贫瘠，如今作业面出产的矿石几乎不值运出地表的成本。地质学上称此为 #italic 脉体收缩 #!。矿工们的说法则要粗俗得多。沿断层继续追寻，或许还能找到更多 [ShowGoodsNameWithNoTooltip('silver')]，但要在毫无证据的情况下开凿探矿井，代价高昂。"
 mining_survey_events.34.a: "撤离。矿脈一旦收缩断绝，便如门户已闭。"
 mining_survey_events.34.historical_info: "Silver veins were notoriously variable along their length, swelling to feet-thick ore bodies in some sections and narrowing to barren stringers in others. The vagaries of vein geometry made silver mining a profession of educated gambling, and the rise and fall of medieval boom towns like Joachimsthal, Schwaz, and Iglau tracked the discovery and exhaustion of particular veins with grim regularity."
 mining_survey_events.35.title: "All That Glitters is not Gold"
 mining_survey_events.35.desc: "Disappointment at the [ShowGoodsName('goods_gold')] prospect. The bright metallic flecks running through the quartz are not [ShowGoodsNameWithNoTooltip('goods_gold')] but pyrite, the iron sulfide that has fooled prospectors since the dawn of metallurgy. The assayer's first test, by reduction in the crucible, has produced not a yellow bead of [ShowGoodsNameWithNoTooltip('goods_gold')] but a thin red sulfurous scum and a piece of pig-iron. The headman of the local village is conspicuously not surprised; he had heard the old grandfather stories about #italic Narrengold#! on this slope and had been waiting to see if our scholars knew the difference."
 mining_survey_events.35.a: "Pack up and leave. Fool's gold is the prospector's eternal companion."
 mining_survey_events.35.historical_info: "黄铁矿，一种在岩石中闪烁着黄铜色光泽的硫化铁矿物，在德国采矿区赢得了 #italic Narrengold #! （愚人金）的俗称，自人类寻找真金以来，它就一直在误导勘探者。区分二者的标准检验方法——锤击延展性（黄铁矿会碎裂，而金子会被压平）、比重（金的密度是水的十九倍，黄铁矿仅为五倍），以及火试金反应（金能耐受，黄铁矿则会分解为硫和氧化铁），是每一位称职鉴定师的必备常识。"
 mining_survey_events.36.title: "煤层中的沼气"
 mining_survey_events.36.desc: "这条 [ShowGoodsName('coal')] 矿脉厚实纯净，却也充满了沼气。深邃的 [ShowGoodsNameWithNoTooltip('coal')] 矿井中积聚的沼气被一名采煤工的矿灯点燃，爆炸当场炸死三人，另有六人被严重烧伤，从此再也无法工作。矿场监工说这条矿脉仍可开采，但必须持续通过通风井和火炉进行通风，而在任何 [ShowGoodsNameWithNoTooltip('coal')] 产出之前，这都需要一笔可观的资本投入。"
 mining_survey_events.36.a: "Close the working. We are not yet equipped to fight firedamp."
 mining_survey_events.36.historical_info: "沼气，即积聚于煤矿井下、一遇明火便会剧烈爆炸的甲烷，是前工业时代煤矿工人挥之不去的死神。标准的应对之法是通过成对的竖井进行系统通风，在上升风井底部设置火炉以引导气流通过巷道；而戴维安全灯——能在不引燃沼气的情况下提供照明——直到1815年才问世。在此之前，每一条深部煤层的开采，都笼罩在随时降临的灾难阴影之下。"
 mining_survey_events.37.title: "采石场被淹"
 mining_survey_events.37.desc: "这里的 [ShowGoodsName('stone')] 品质极佳，但采石场却总是积水不断。第一个坑，沿着岩层深挖十二英尺，一夜之间便被石匠们始料未及的泉水灌满，最底层的 [ShowGoodsNameWithNoTooltip('stone')] 如今已被三英尺深的冷水淹没。石匠总管说，如果能开凿一条通往下方谷地的排水巷道，采石场仍可继续作业，但那条巷道本身就要耗费一年的石工劳作，而预算中并未留出这笔开支。"
 mining_survey_events.37.a: "放弃这座采石场。被淹的坑，就是废弃的坑。"
 mining_survey_events.37.historical_info: "采石排水是前工业时代石材开采中长期困扰工匠的工程难题，许多原本产出丰厚的采石场，一旦作业面低于当地地下水位，便不得不被废弃。标准的解决办法包括横向开凿通往低地的排水巷道（即德国采矿传统中所谓的 #italic Stollen #! ），由水车驱动的链斗式抽水泵，以及自十七世纪起逐渐引入的蒸汽驱动抽水机。"
 mining_survey_events.38.title: "石块碎裂"
 mining_survey_events.38.desc: "这块 [ShowGoodsName('marble')] 在开采面上起初看起来完好无损。两天后，当第一块巨石终于从基岩中剥离，被放到木制滚轴上时，它却沿着一道肉眼不可见的裂纹整体断裂，在自身重量的压迫下碎成了六块毫无用处的石料。石匠总管走近那块被废弃的石头，用锤子轻敲几下，宣布了大家早已心知肚明的结论：这处矿坑里的 [ShowGoodsNameWithNoTooltip('marble')] 内部布满了暗藏的裂纹，是先前对开采面的任何勘察都无法察觉的。"
 mining_survey_events.38.a: "Close the quarry. Fractured [ShowGoodsNameWithNoTooltip('marble')] is fit only for road metal."
 mining_survey_events.38.historical_info: "用于雕像和精细建筑装饰的大理石必须没有内部瑕疵，而发现隐藏裂纹（意大利采石工人的行话称之为 #italic peli #! ）一直是这一行业挥之不去的梦魇。著名雕塑家会亲自前往采石场，在委托订购前检视毛坯石料，而重大雕像委托的成本中，也往往包含一笔可观的预留款项，以应对交付后才发现的瑕疵石料。"
 mining_survey_events.39.title: "假货，而非水晶"
 mining_survey_events.39.desc: "这片富含 [ShowGoodsName('gems')] 的砂砾出乎意料地丰饶。丰饶得可疑。从都城派人护送而来的皇家宝石鉴定师，在强光灯下检视这批收获，将每颗石头放在掌心掂量，又拿其中一颗在刚玉碎片上刻划，最终宣布了不可避免的结论：大多数所谓的发现不过是假货——经过巧妙切割和做旧处理、冒充天然水晶的铅玻璃。有人一直在向河床里掺假。今早，矿场监工在营地中却明显不见踪影。"
 mining_survey_events.39.a: "收拾行装吧。整个矿藏勘察不过是一场骗局。"
 mining_survey_events.39.historical_info: "掺矿，即在勘探地埋入真矿石或加工过的宝石以吸引投资，是采矿业边疆自古以来常见的职业性欺诈手段。私自在矿坑中掺假的工头、在选定河床上散布几件隐藏样品的当地向导，以及安排了这场精心策划的发现的不在场所有者，都是欧洲和美洲采矿历史上的常见人物。证实这场欺诈的不诚实的鉴定师完成了这个标准的安排。"
 mining_survey_events.40.title: "[ShowGoodsNameWithNoTooltip('mercury')] 之疯狂"
 mining_survey_events.40.desc: "[ShowGoodsName('mercury')]矿场正在产出金属，同时也在制造疯子。蒸馏炉旁的工人已开始不受控制地颤抖；负责搅拌冷凝[ShowGoodsNameWithNoTooltip('mercury')]的学徒掉了牙齿，右手两根手指也已失去知觉；而那位最了解其中风险的资深冶金师，如今也陷入了易怒失神的状态，营地医生称之为#italic疯帽匠病#!，并断言无法医治。[ShowGoodsNameWithNoTooltip('mercury')]就在那里，能够将其取得的人却不在了。"
 mining_survey_events.40.a: "关闭矿场。没有任何金属值得付出这样的代价。"
 mining_survey_events.40.historical_info: "汞中毒表现为颤抖、掉牙及渐进性精神衰退，是朱砂矿工、蒸馏炉工人及银汞齐工匠中广为人知的职业病。西班牙卡斯蒂利亚的阿尔马登矿是欧洲最大的水银产地，正因如此，其部分劳力由囚犯充任。英语中#italic疯得像帽匠一样#!这一说法，正保留着当年毡帽匠人因制作工艺中所用水银而中毒的记忆。"
 mining_survey_events.41.title: "卤水源枯竭"
 mining_survey_events.41.desc: "[ShowGoodsName('salt')] 矿藏起初进展顺利。卤水泉水势强劲，锅炉产出的白色 [ShowGoodsNameWithNoTooltip('salt')] 品质上乘，盐商们已在洽谈长期合同。然而在一个干旱的夏季与一个比往常更寒冷的冬季之后，泉水渐渐细如涓丝，最终枯竭。派去调查的地质学家报告称，这处地下水源不过是一处有限的卤水囊，并非可持续补给的水流，此处矿藏基本已告枯竭。"
 mining_survey_events.41.a: "撤离吧。泉水一旦干涸，[ShowGoodsNameWithNoTooltip('salt')] 泉矿场也就走到了尽头。"
 mining_survey_events.41.historical_info: "卤水泉与岩盐矿床的地质特性与经济前景截然不同。有些卤水源，如萨克森的哈雷或汝拉山区的萨兰莱班，能持续流淌数百年，支撑起颇具规模的城镇；而另一些则不过是化石般的封闭水囊，往往在集中开采一代人的时间内便告枯竭。至于岩盐，如维利奇卡和卡多纳等地所采之矿，则是更为可靠、但也更需资本投入的资源。"
 mining_survey_events.42.title: "页岩已成废土"
 mining_survey_events.42.desc: "这处页岩露头起初看似大有可为，岩石风化后所得的盐在化验中呈现出洁白纯净之色。然而在地表之下，页岩却毫无用处：厚重、暗黑，且完全不含地表样品所暗示的富[ShowGoodsName('alum')]黄铁矿脉。化学师先后尝试了酸浸法、焙烧法，又在废料堆上进行长期风化处理，却几乎一无所获。那些不惜重金从纺织城镇招募来的工人们如今闲坐一旁，只见工程师一次又一次地更换着方法。"
 mining_survey_events.42.a: "Close the works. We cannot manufacture [ShowGoodsNameWithNoTooltip('alum')] where the chemistry does not allow it."
 mining_survey_events.42.historical_info: "以黄铁矿页岩制取明矾，需要恰到好处的矿物化学条件：黄铁矿提供硫酸根离子，含铝页岩提供铝，再经长期风化使二者在溶液中结合。地表样品极易造成误判，因为露头处正是天然风化早已完成其作用之地；而地下岩层往往贫瘠无矿。北海沿岸的约克郡明矾作坊，就曾在最终未能产出效益的页岩上耗费数十年光阴与大量资本。"
 mining_survey_events.43.title: "土壤一无所出"
 mining_survey_events.43.desc: "这片谷地的土壤本应富含 [ShowGoodsName('saltpeter')] 。当地农民说，他们的祖辈每逢春天都会从岩壁上采集那层白色的霜华。如今勘探者们已在谷底十几处地点挖掘、浸滤并蒸发了土壤，却几乎一无所获。火药师看过这微薄的产量后指出，这些古老的 [ShowGoodsNameWithNoTooltip('saltpeter')] 矿层，恐怕早已被那些讲述祖辈故事的农民自己开采殆尽。如今这片谷地已再无 [ShowGoodsNameWithNoTooltip('saltpeter')] 可寻。"
 mining_survey_events.43.a: "Abandon the valley. We cannot make [ShowGoodsNameWithNoTooltip('saltpeter')] where the soil is dead."
 mining_survey_events.43.historical_info: "含硝土壤并非取之不尽。潮湿、施过肥的土地中硝石自然形成的过程需要数年时间，若开采过度便很容易枯竭。因此，德意志的#italic硝石匠#!（Salpetersieder）传统中，还包括系统性地建立人工#italic硝石田#!（Salpeterplantagen），将粪肥、石灰与草木灰堆积并悉心照料多年，以获得稳定的硝石产量。从寻找硝石到人工制造硝石的转变，是前工业时代火药生产理性化进程中的重要一步。"
