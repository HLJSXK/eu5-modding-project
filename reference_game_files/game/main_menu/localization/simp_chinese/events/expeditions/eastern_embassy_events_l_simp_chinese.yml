l_simp_chinese:
 # Eastern Alliance Embassy events
 received_eastern_alliance_embassy: "Received an Embassy from a Distant Court"
 eastern_embassy_events.1.title: "An Embassy to the Distant Courts"
 eastern_embassy_events.1.desc: "The embassy is to depart for a court beyond every familiar horizon. The land between is held by powers that may bar the road, the sea between is patrolled by fleets that may seize the cargo, and the prince at the end of it has no reason to recognize our claim to importance."
 eastern_embassy_events.1.desc.persia: "$eastern_embassy_events.1.desc$ [dest_country.GetName] holds the throne at [dest_city.GetName], a [desc_country.GetFlavorRank] whose own wars would benefit greatly from any second front we can promise. The road runs through [ShowLocationName('hormuz')], where the [ShowRegionName('indian_ocean_region')] trade meets the [dest_country.GetAdjectiveWithNoTooltip] land routes. How [target_leader.GetName] presents [target_leader.GetHimHerself] at the [dest_country.Custom('GetRulerOrRegentTitle')]'s [dest_country.GetGovernment.GetCourtTitle] will determine whether the embassy is received as an equal or as a curiosity."
 eastern_embassy_events.1.desc.ethiopia: "$eastern_embassy_events.1.desc$ [dest_country.GetName] holds the ancient seat at [dest_city.GetName], the [desc_country.GetReligion.GetAdjective] [desc_country.GetFlavorRank] of the highlands that the chronicles have spoken of for centuries without certainty. The road runs through [ShowLocationName('alexandria')], then across the [ShowAreaName('red_sea_area')] and into a land of churches cut from living rock. Few embassies from our part of the world have ever reached the [dest_country.Custom('GetRulerOrRegentTitle')]."
 eastern_embassy_events.1.a: "A spare embassy of envoys and clerics, austere but plain in its purpose."
 eastern_embassy_events.1.a.tt: "Marks the embassy as austere: at the destination court, the joint-pact option will grant [ShowModifier('eastern_alliance_persia')] or [ShowModifier('eastern_alliance_ethiopia')] depending on the host"
 eastern_embassy_events.1.b: "A lavish embassy with treasure, [ShowGoodsNameWithNoTooltip('silk')], and ceremony enough to honor an equal."
 eastern_embassy_events.1.b.tt: "Marks the embassy as lavish: at the destination court, the gift-presentation option will grant [ShowModifier('eastern_alliance_persia')] or [ShowModifier('eastern_alliance_ethiopia')], plus prestige and legitimacy bonuses"
 eastern_embassy_events.1.c: "A practical trade delegation with merchants and modest gifts."
 eastern_embassy_events.1.c.tt: "Marks the embassy as a trade delegation: at the destination court, the trade-route option will grant [ShowModifier('eastern_route_open')]"
 eastern_embassy_events.1.historical_info: "Direct embassies to the courts of Persia and Ethiopia were a recurring ambition of Christian Europe. Uzun Hasan of the Aq Qoyunlu sent envoys to Venice in the 1460s seeking joint action against the Ottomans, and Portuguese missions reached the Ethiopian court of Lebna Dengel in the early 16th century. The distances were enormous, the diplomatic protocols entirely unlike European norms, and the outcomes were almost always less than what either side had hoped."
 eastern_embassy_events.2.title: "At the Crossroads of the East"
 eastern_embassy_events.2.desc: "The embassy reaches the great crossroads where the trade of the world has been bargained over for a thousand years. The [ShowBuildingTypeName('caravanserai')] are full of merchants who have made the onward journey many times, clerics who know the customs of the court, and informers who will sell what they know for the right price. The road east will be easier with their knowledge."
 eastern_embassy_events.2.desc.hormuz: "$eastern_embassy_events.2.desc$. [crossroad_city.GetName] is the hinge of the eastern trade, the island fortress where the [ShowAreaName('persian_gulf_sea_zones_area')] opens to the [ShowRegionName('indian_ocean_region')]. Every merchant of consequence between [ShowLocationName('cairo')] and [ShowLocationName('goa')] has passed through its [ShowBuildingTypeName('caravanserai')]. The road to the [dest_country.Custom('GetRulerOrRegentTitle')]'s [dest_country.GetGovernment.GetCourtTitle] runs north from here, through landscapes that no Western embassy has crossed in living memory."
 eastern_embassy_events.2.desc.alexandria: "[crossroad_city.GetName] is the great port of the eastern Mediterranean, where pilgrims, merchants, and refugees of every [ShowReligionGroupAdjective('christian')] sect cross paths. [ShowCultureName('coptic_culture')] monks have made the journey south to the [dest_country.GetAdjective] highlands many times, and their accounts of the country are detailed enough to be of military use, for the right price."
 eastern_embassy_events.2.a: "Stay a while and listen. Knowledge of the [dest_country.GetAdjectiveWithNoTooltip] [dest_country.GetGovernment.GetCourtTitle] is worth more than haste."
 eastern_embassy_events.2.a.tt: "Unlocks a special audience option that grants [ShowModifier('eastern_alliance_persia')] or [ShowModifier('eastern_alliance_ethiopia')] together with [ShowModifier('eastern_route_open')]"
 eastern_embassy_events.2.b: "Press on. Our message will not gain by delay."
 eastern_embassy_events.2.c: "Seek out our coreligionists in the city to broker introductions."
 eastern_embassy_events.2.historical_info: "Hormuz and Alexandria were the two great information markets of the medieval and early modern world. A foreign embassy could acquire, for a sum, briefings on court etiquette, current factional disputes, the personal preferences of the ruler, and the names of the officials who would actually decide the embassy's reception. Embassies that arrived without this preparation routinely failed for reasons that had nothing to do with the substance of their proposals."
 eastern_embassy_events.3.title: "The Caravan Halts"
 eastern_embassy_events.3.desc: "The road narrows through broken country and armed riders block the way, a score of them, well-mounted and well-armed. Their leader demands a toll to pass: [ShowGoodsName('silver')], or a portion of the embassy's stores, or its choice of [ShowGoodsName('horses')]. The interpreter explains that this is the customary arrangement and that paying it is no dishonor."
 eastern_embassy_events.3.a: "Pay the toll and proceed without incident."
 eastern_embassy_events.3.b: "Push through under arms. We did not come this far to be robbed."
 eastern_embassy_events.3.historical_info: "Tribal collection of caravan tolls was the normal economic basis of life along every long-distance trade road. The local Šayḵ or chieftain who controlled a defile or a watering point was entitled, by custom older than any of the empires the road crossed, to a portion of every caravan's value. Refusal to pay was not theft prevention; it was a declaration that the caravan considered itself outside the local order, with all the risks that implied."
 eastern_embassy_events.4.title: "Audience at [court_city.GetNameWithNoTooltip]"
 eastern_embassy_events.4.desc: "The hall of [court_city.GetName] is unlike any throne room in the West. The [court_country.Custom('GetRulerOrRegentTitle')] of [court_country.GetName], [shah.GetName], sits on a dais elevated above the petitioners, flanked by viziers in robes of state, secretaries who record everything in [court_country.GetCourtLanguage.GetName] script, and ambassadors from a dozen courts that the West does not formally recognize. [target_leader.GetName] is admitted to the second rank of foreign guests, which is the position that the protocol officers have determined for a sovereign of our distance and standing."
 eastern_embassy_events.4.a: "Propose a joint pact against our common enemies."
 eastern_embassy_events.4.b: "Present the gifts with all the ceremony the occasion demands."
 eastern_embassy_events.4.c: "Open the southern trade route through [crossroad_city.GetNameWithNoTooltip], with our goods on every caravan."
 eastern_embassy_events.4.d: "Apply what we learned at [crossroad_city.GetNameWithNoTooltip] about the customs of this court."
 eastern_embassy_events.4.historical_info: "The Persian courts of the late medieval and early modern period, from the Aq Qoyunlu through the Safavids, maintained an elaborate ceremonial that combined Mongol traditions of universal sovereignty with Persian administrative refinement. Foreign embassies were received with formal courtesy but ranked according to a strict hierarchy of distance and prestige. Joint action against the Ottoman Empire was a recurring possibility that almost never matured into actual military coordination, though the threat of it constrained Ottoman strategy throughout the period."
 eastern_embassy_events.5.title: "Audience at [court_city.GetNameWithNoTooltip]"
 eastern_embassy_events.5.desc: "The [court_country.GetGovernment.GetCourtTitle] of [court_city.GetName] is held in a hall whose walls are painted with scenes from the Lives of the Saints, in a [court_country.GetCourtLanguage.GetName] script that none of the embassy's clerics can read. [negus.GetName], [court_country.Custom('GetRulerOrRegentTitle')] of [court_country.GetNameWithNoTooltip], receives the embassy seated on a throne carried in from the older palace, attended by #italic abuna#! and #italic däǧǧazmač#! in robes of crimson and gold. The bond of a shared faith is unmistakable, however different the rite. The embassy has been received as [ROOT.GetCountry.GetReligion.GetGroup.GetAdjectiveWithNoTooltip] to [court_country.GetReligion.GetGroup.GetAdjectiveWithNoTooltip]."
 eastern_embassy_events.5.a: "Propose a shared crusade against the [ShowReligionGroupAdjective('muslim')] powers between us."
 eastern_embassy_events.5.b: "Present the gifts and relics worthy of an anointed [ROOT.GetCountry.GetReligion.GetGroup.GetAdjectiveWithNoTooltip] king."
 eastern_embassy_events.5.c: "Negotiate access to the [ShowAreaNameWithNoTooltip('red_sea_area')] trade in spice, [ShowGoodsNameWithNoTooltip('goods_gold')], and [ShowGoodsNameWithNoTooltip('ivory')]."
 eastern_embassy_events.5.d: "Apply what we learned in [crossroad_city.GetNameWithNoTooltip] about the customs of this court."
 eastern_embassy_events.5.historical_info: "The Christian kingdom of Ethiopia preserved an unbroken church tradition since late antiquity, and from the 14th century onward European ambitions to make contact with it were sustained by the legend of Prester John, the Christian king whose alliance would crush the Muslim powers between Europe and India. Portuguese embassies finally reached the Ethiopian court in 1493 and again under Rodrigo de Lima in 1520. The relationship was real but the strategic expectations of the West were always disproportionate to what either side could deliver."
