l_simp_chinese:
 hajj_caravan_events.1.title: "The Road to Mecca"
 hajj_caravan_events.1.desc: "商队已然齐备，祈祷业已诵毕，通往 [ShowAreaName('hedjaz_area')] 的漫漫长路就此展开。人群夹道相送，足见我家仍恪守信仰之责。[ShowLocationName('mecca')] 远在数月之外，途经沙漠与汪洋，凡疏于准备者必受其苦。"
 hajj_caravan_events.1.a: "我们的 [ROOT.GetCountry.GetGovernment.GetRulerTitle] 此行既为主权者，亦为 [ROOT.GetCountry.GetReligion.GetGodName] 之仆从。"
 hajj_caravan_events.1.b: "Provision the caravan well and raise a sizeable escort to guard the road."
 hajj_caravan_events.1.c: "Ensure the caravan is fully stocked and secure, and bear the #italic maḥmal#! before us."
 hajj_caravan_events.1.historical_info: "阿拔斯王朝哈里发哈伦·拉希德在位期间（786—809年），曾九次从巴格达出发朝觐，甚至有一段路程徒步而行以示虔诚，其虔敬之举成为此后数百年间虔诚统治者竞相效仿的典范。"
 hajj_caravan_events.display_wealth: "公然携 #italic 麦哈迈勒 #! 而行，令众人得见我等 [ROOT.GetCountry.GetFlavorRank] 之富庶。"
 hajj_caravan_events.guards_up_tt: "The caravan's guard escort grows"
 hajj_caravan_events.guards_down_tt: "The caravan's guard escort is diminished"
 hajj_caravan_events.splendor_up_tt: "The caravan's splendor grows"
 hajj_caravan_events.splendor_down_tt: "The caravan's splendor is diminished"
 hajj_caravan_events.weakened_tt: "商队被迫不停歇地赶路，变得疲弱不堪，难以应对前路的考验"
 hajj_caravan_events.recovered_tt: "商队得到了休整与补水，疲态渐渐消散"
 hajj_caravan_events.2.title: "[ShowLocationNameWithNoTooltip('mecca')] 城门"
 hajj_caravan_events.2.desc: "[ShowLocationName('jeddah')]。这座古老的港口[jeddah_location.GetRank.GetName|l]弥漫着[ShowGoodsName('salt')]与[ShowGoodsName('incense')]的气味，还有比我们早一步由海路抵达的万千朝圣者的汗味。商人们以双倍的价钱叫卖补给，学者们则争论着仪式的正确顺序。[ShowLocationName('mecca')]如今已近在眼前，陆路不到三日便可到达，但商队已经疲惫，补给也已不多。我们可以直接赶路，也可以在此休整一日，先补充给养。"
 hajj_caravan_events.2.a: "在此休整，以清新之姿进入圣城。"
 hajj_caravan_events.2.b: "我们已走了这么远，此刻不能停下。继续前往 [ShowLocationNameWithNoTooltip('mecca')]。"
 hajj_caravan_events.2.c: "$hajj_caravan_events.display_wealth$"
 hajj_caravan_events.2.historical_info: "第三位拉希敦哈里发奥斯曼·伊本·阿凡在646年将吉达指定为海路朝圣者的官方入境口岸，此后这座城市一直承担着朝觐往来的这一角色。"
 hajj_caravan_events.3.title: "克尔白"
 hajj_caravan_events.3.desc: "大清真寺在我们眼前展开，克尔白立于其中央，黑布覆盖，古老得超乎记忆所及。四周身着白袍的信徒们耐心地绕行，成千上万，来自每一片能听到礼拜召唤的土地。在这里，苏丹与牧羊人穿着相同。旅程已经结束。如今的问题是，我们将成为怎样的朝圣者。此处所施予之物，将在穆斯林世界的市场、清真寺与宫廷之中回响一代之久。"
 hajj_caravan_events.3.a: "Distribute gold freely. Let no pilgrim here go hungry on our account."
 hajj_caravan_events.3.b: "捐赠清真寺与守护圣城的学者们。"
 hajj_caravan_events.3.c: "静默地完成仪式。这只是我们与 [ROOT.GetCountry.GetReligion.GetGodName] 之间的事。"
 hajj_caravan_events.3.d: "Our [ShowBureaucracyTypeNameWithNoTooltip('diwan_al_hajj_bureaucracy')] has already provisioned everything. Perform the rites in full."
 hajj_caravan_events.3.e: "Spare no expense. Let the caravan glitter with gold and silk to behold."
 hajj_caravan_events.3.historical_info: "历史上最著名的王室朝觐当属1324年马里的曼萨·穆萨一世。他率领六万之众的随行队伍出行，沿途随意散金，其朝觐之举导致北非与中东的金价长达十年一蹶不振。他造访埃及苏丹宫廷之事被阿拉伯史家广泛记载，既记述了他非凡的慷慨，也记录了由此引发的经济动荡。"
 hajj_caravan_events.4.title: "千塔之城"
 hajj_caravan_events.4.desc: "[ShowLocationName('cairo')]城池浩大而古老，我们一穿过北门，喧嚣、香料、鞣革与烤肉的气味便将商队吞没。屋顶之上耸立着爱资哈尔大清真寺，其学者堪称[ROOT.GetCountry.GetReligion.GetGroup.GetAdjective]世界中最杰出者。我们的统治者既可以留下来向他们求学，也可以只是补给物资，继续向[ShowLocationName('mecca')]进发。"
 hajj_caravan_events.4.a: "趁机会与爱资哈尔的学者们坐而论道。"
 hajj_caravan_events.4.b: "我们是为 [ShowLocationNameWithNoTooltip('mecca')] 而来，而非 [ShowLocationNameWithNoTooltip('cairo')]。补给后即刻启程。"
 hajj_caravan_events.4.c: "$hajj_caravan_events.display_wealth$"
 hajj_caravan_events.4.historical_info: "史学家兼学者伊本·赫勒敦于1382年定居开罗，在爱资哈尔任教，并担任该城马利基派首席法官。他的声望吸引了整个穆斯林世界的统治者与学者前来聆听他的讲学，或向他寻求教诲。"
 hajj_caravan_events.5.title: "旧都"
 hajj_caravan_events.5.desc: "[ShowLocationName('baghdad')] 曾是世上最伟大的城市，是一个疆域从 [ShowContinentName('atlantic_ocean_continent')] 延伸至 [ShowSubContinentName('central_asia')] 的哈里发国的都城，直至被蒙古人付之一炬。如今留存下来的已归于沉寂——市集缩小，学者也不复昔日的虔诚——但其圣徒陵墓依然吸引着东方各地的朝觐者前来，我们的统治者可在此地表达敬意，而后再南下前往 [ShowAreaName('hedjaz_area')]。"
 hajj_caravan_events.5.a: "参拜陵墓，寻访当地学者。"
 hajj_caravan_events.5.b: "略表敬意，随即启程。"
 hajj_caravan_events.5.c: "$hajj_caravan_events.display_wealth$"
 hajj_caravan_events.5.historical_info: "阿拔斯哈里发哈伦·拉希德之妻祖拜达·宾特·贾法尔亲历朝觐之路的艰辛后，出资修建了祖拜达之路——一条自巴格达附近直通麦加、设有水井、蓄水池与驿站的朝觐大道。"
 hajj_caravan_events.6.title: "大马士革驿站"
 hajj_caravan_events.6.desc: "果园渐渐让位于 [ShowLocationName('damascus')] 的城墙——这是至今犹存的最古老的城市之一，其大清真寺闻名于整个信仰世界。若在其圆顶下祈祷，与充塞庭院的教法学者们同坐交谈，恐将耗费我们无法承受的时日；商队本可轻易汲水、补给，天明便启程离去。"
 hajj_caravan_events.6.a: "在其清真寺与教法学者间稍作停留。"
 hajj_caravan_events.6.b: "给牲畜饮水，天明即启程离去。"
 hajj_caravan_events.6.c: "$hajj_caravan_events.display_wealth$"
 hajj_caravan_events.6.historical_info: "16世纪50年代，奥斯曼苏丹苏莱曼大帝在大马士革兴建了苏莱曼尼耶济贫院建筑群，其中包括一座清真寺、一间旅舍和一处施粥所，专为每年朝觐商队启程前往麦加之前聚集于此的成千上万朝圣者提供食宿与补给。"
 hajj_caravan_events.7.title: "Ḥājjī"
 hajj_caravan_events.7.desc: "商队踏上归途，仓储愈发轻薄，朝圣者们也已脱胎换骨。消息早已比骆驼先行传开，人群聚集，只为迎回那位曾立于卡巴天房之前、并活着讲述此事的君主。自此日起，我们的君主便可承袭称号哈吉——此名非授予，而是亲自赢得，从此归其所有。"
 hajj_caravan_events.7.a: "Let it be known, from [ShowLocationNameWithNoTooltip('mecca')] and back, by the grace of [ROOT.GetCountry.GetReligion.GetGodName]."
 hajj_caravan_events.7.historical_info: "Askia Muḥammad Ture of the Songhai Empire undertook the Ḥajj in 1496–97 with a retinue of hundreds and a fortune in gold to give away as alms along the way. In Cairo, the Abbasid claimant to the caliphate granted him the title Caliph of the Sudan, and he returned home as al-Ḥajj, his authority over West African Islam confirmed by the pilgrimage."
 hajj_caravan_events.8.title: "Death on the Road to Mecca"
 hajj_caravan_events.8.desc: "消息传至商队：我们的君主已在途中殒命，远离故土，更远离卡巴天房。商队失去了统领的君主，已无法照旧前行。队伍随之四散，一些朝圣者折返回家，另一些则孤身前行，只为完成他们此行所求的仪式。"
 hajj_caravan_events.8.a: "愿 [ROOT.GetCountry.GetReligion.GetGodName] 怜悯其灵魂。"
 hajj_caravan_events.hire_escorts: "为前路雇募更多护卫。"
 hajj_caravan_events.adorn: "Commission banners, silks, and finery to adorn the caravan, and wait while they are made ready."
 hajj_caravan_events.2.d: "$hajj_caravan_events.adorn$"
 hajj_caravan_events.4.e: "$hajj_caravan_events.adorn$"
 hajj_caravan_events.5.e: "$hajj_caravan_events.adorn$"
 hajj_caravan_events.6.e: "$hajj_caravan_events.adorn$"
 hajj_caravan_events.4.d: "$hajj_caravan_events.hire_escorts$"
 hajj_caravan_events.5.d: "$hajj_caravan_events.hire_escorts$"
 hajj_caravan_events.6.d: "$hajj_caravan_events.hire_escorts$"
 hajj_caravan_events.9.title: "路途上的袭掠者"
 hajj_caravan_events.9.desc: "他们从热浪蒸腾的地平线中现身，沙漠骑手举枪列阵，绕着队列疾驰。他们早已窥探我们穿越这片沙海，认定这支商队值得一劫。我们的护卫收紧了队形，但在旷野大漠中的一场厮杀，胜负从来难料。"
 hajj_caravan_events.9.a: "缴纳贡银吧，银钱总比性命便宜。"
 hajj_caravan_events.9.b: "让护卫们证明自己的价值。"
 hajj_caravan_events.9.c: "Remind them these are pilgrims bound for [ShowLocationNameWithNoTooltip('mecca')], under [ROOT.GetCountry.GetReligion.GetGodName]'s protection."
 hajj_caravan_events.10.title: "干涸的水井"
 hajj_caravan_events.10.desc: "The wells ahead stand empty — cracked mud at the bottom, drained to the dregs by some caravan that passed through days before us. The skins slung along the camels' flanks are already light, the animals lowing their thirst, and the sun climbs higher with no mercy in it. The guides fall to muttering about how far the next good water lies."
 hajj_caravan_events.10.a: "宁可迟缓，不可丧命。转向那口远井。"
 hajj_caravan_events.10.b: "下一处水源足矣，继续前行。"
 hajj_caravan_events.11.title: "西蒙风暴"
 hajj_caravan_events.11.desc: "天际染上铁锈般的颜色，狂风渐渐化作尖啸。一堵沙墙朝队列压来，转眼间便没了道路，没了天空，也看不见前方的骑手——只剩刺目的黑暗。"
 hajj_caravan_events.11.a: "放下行囊，蒙上面纱。我们就地等候。"
 hajj_caravan_events.11.b: "将队列以绳索相连，硬闯过去。"
 hajj_caravan_events.12.title: "商队中的热病"
 hajj_caravan_events.12.desc: "It begins with a few cases, but by morning it is in every tent: a fever that hollows out even the strongest in days. Packed together on the road, the pilgrims have now way to avoid it."
 hajj_caravan_events.12.a: "我们停下来。绝不丢下任何一位朝圣者。"
 hajj_caravan_events.12.b: "朝圣的时节不会为病人停留。"
 hajj_caravan_events.13.title: "The Emir's Price"
 hajj_caravan_events.13.desc: "前方的道路穿过一位地方领主的领地，他的骑兵横列道中，长矛垂地，丝毫不急。他的传令官笑盈盈地走出来：水要收税，通行要收税，脚下的沙子也要收税，商队休想再挪一步，除非先行缴纳。身后的朝圣者们在酷热中等候，看看他们的君主究竟有何作为。"
 hajj_caravan_events.13.a: "付钱了事。"
 hajj_caravan_events.13.b: "我们什么都不欠他。绕过他的水井走。"
 hajj_caravan_events.13.c: "Let the emir look upon our caravan, and reconsider whom he would tax."
 hajj_caravan_events.14.title: "绿洲小憩"
 hajj_caravan_events.14.desc: "前方沙地上棕榈树耸立，树下一泓清泉，泉水四周的人们出来迎接朝圣者，献上椰枣与清凉的水。庇护那些奔赴圣城之人本身便是一种虔诚之举，且甘愿相赠，分文不取。"
 hajj_caravan_events.14.a: "休整片刻，让商队饮足水后再启程。"
 hajj_caravan_events.14.b: "与绿洲的贫民分享我们的给养。"
 hajj_caravan_events.14.c: "谢过他们，继续赶路。"
 hajj_caravan_events.15.title: "路上的学者"
 hajj_caravan_events.15.desc: "一群游学的学者与商队同行，同样前往那座圣城，鞍囊中满载典籍。夜幕降临，篝火旁，他们畅谈律法与经义，直至深夜。"
 hajj_caravan_events.15.a: "坐在他们中间，静听高论。"
 hajj_caravan_events.15.b: "以辩驳应对辩驳。"
 hajj_caravan_events.16.title: "错过的时节"
 hajj_caravan_events.16.desc: "我们来得太迟了。时节已过，阿拉法特的驻留——那正午至日落之间的时辰，本该是全体朝觐者齐聚仁慈山下平原、虔诚祈祷、恳求宽恕之时——已然错过。先知有言，朝觐不过是那一个下午，仅此而已；若错过它，此后无论行何仪式，皆无法使朝觐圆满。商队除了散去归乡，别无他法，来年只得从头再来一遍。"
 hajj_caravan_events.16.a: "我们耽搁太久了，只得来年重新朝觐。"
 hajj_caravan_events.17.title: "风暴"
 hajj_caravan_events.17.desc: "The sky blackens and the sea heaves itself into grey hills of water. The ship pitches, the rigging shrieks, and one wave taken wrong could stave in a hull or drag a vessel under with every soul aboard."
 hajj_caravan_events.17.a: "稳住。造船匠的手艺信得过。"
 hajj_caravan_events.17.b: "顺风而行，全速逃离。"
 hajj_caravan_events.18.title: "无风停航"
 hajj_caravan_events.18.desc: "风渐渐止息。船帆无力地垂着，海面平静如打磨过的金属，船只在无情的烈日下一动不动。水日渐见底，脾气也随之愈发暴躁，日复一日地困于无风之境。"
 hajj_caravan_events.18.a: "等待。风终会再起。"
 hajj_caravan_events.18.b: "放下小艇。我们绝不坐以待毙。"
 hajj_caravan_events.19.title: "船舱中的热病"
 hajj_caravan_events.19.desc: "一种病症在船舱底层污浊闷热的空气中悄然蔓延，短短数日，病倒者已多过健康之人。船仍须有人操持，而每日清晨，能干活的人手却愈发稀少。"
 hajj_caravan_events.19.a: "驶向岸边。船员必须要有干净的淡水。"
 hajj_caravan_events.19.b: "保持航向，相信水手们能撑住。"
 hajj_caravan_events.20.title: "Corsairs"
 hajj_caravan_events.20.desc: "一艘低矮迅疾的桨帆船朝船队冲来，身后还跟着两艘，船桨在阳光下闪烁不停。没有旗帜，没有呼喊，唯有船舷边刀锋的寒光，以及越擂越急、传遍水面的鼓声。是海盗——他们已将朝圣者视为猎物。瞭望手高声示警，甲板下的信徒们则紧抱着行囊与祈祷。"
 hajj_caravan_events.20.a: "花钱买路，让他们离开。"
 hajj_caravan_events.20.b: "清空甲板。我们要正面冲杀过去。"
 hajj_caravan_events.21.title: "暗礁"
 hajj_caravan_events.21.desc: "一阵刺耳的震颤沿船身传来，甲板在脚下猛地一晃——是一处未标注在海图上的暗礁，珊瑚的尖牙正撕扯着水线以下的船板。海水已经汩汩涌入船舱，船员们拼命扑向抽水泵。船身破损、正在下沉，但尚未失去希望，而最近的陆地不过是天际线上一抹低矮的绿影。"
 hajj_caravan_events.21.a: "将船队靠岸，好好修补。"
 hajj_caravan_events.21.b: "留下一队人手抢救此船，其余船只继续前行。"
 hajj_caravan_events.22.title: "海上的商人"
 hajj_caravan_events.22.desc: "A merchant vessel hails us across the water, her decks stacked with bolts of silk and fine cloth from distant ports. Her captain will trade  at a merchant's price, but only after a merchant's unhurried haggling."
 hajj_caravan_events.22.a: "买下船上最精美的布匹。"
 hajj_caravan_events.22.b: "没时间讨价还价，挥手让他们离开。"
 hajj_caravan_events.20.b.chance_tt: "我方护卫可能无法击退海盗，从而损失护卫与荣耀，而非获得 [prestige|e]"
 hajj_caravan_events.9.b.chance_tt: "我们的护卫可能无法击退袭掠者，届时将损失护卫与声望，而非 [prestige|e]"
 hajj_caravan_events.9.c.chance_tt: "这番呼吁可能无法劝退袭掠者，届时将损失护卫与声望，而非获得 [prestige|e] 与 [legitimacy|e]"
 hajj_caravan_events.guards_down_15_tt: "商队的护卫力量削弱了（#R -15#! 护卫兵力）"
 hajj_caravan_events.guards_down_20_tt: "商队的护卫力量削弱了（#R -20#! 护卫兵力）"
 hajj_caravan_events.mahmal_gained_tt: "商队如今携有麦哈迈勒，可在途中向外邦主人炫示财富，然而它也可能因劫匪或风暴而失落"
 hajj_caravan_events.mahmal_lost_tt: "麦哈迈勒在风暴中失落"
 hajj_caravan_events.splendor_down_10_tt: "商队的盛况有所减损（#R -10#! 盛况）"
 hajj_caravan_events.splendor_down_15_tt: "商队的盛况有所减损（#R -15#! 盛况）"
 hajj_caravan_events.splendor_down_20_tt: "商队的盛况有所减损（#R -20#! 盛况）"
 hajj_caravan_events.splendor_down_25_tt: "商队的荣光受损（#R -25#! 荣光）"
 hajj_caravan_events.splendor_up_15_tt: "商队的盛况愈发壮丽（#G +15#! 盛况）"
 hajj_caravan_events.splendor_up_20_tt: "商队的盛况愈发壮丽（#G +20#! 盛况）"
 hajj_caravan_events.splendor_up_30_tt: "商队的盛况愈发壮丽（#G +30#! 盛况）"
