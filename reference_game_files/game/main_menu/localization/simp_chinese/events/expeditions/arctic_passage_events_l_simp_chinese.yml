l_simp_chinese:
 arctic_passage_events.1.title: "Into the Northern Dark"
 arctic_passage_events.1.desc: "The logic is simple: the southern sea routes are already well known and traveled. A northern passage, east or west, would belong to whoever found it first. The fleet has been provisioned for a voyage into waters no chart describes reliably. The pilots have studied everything written about the north and found very little of use.\n\nWhat is known: the sea does not freeze solid in summer. What is not known: how much is passable, and for how long."
 arctic_passage_events.1.a: "Outfit the fleet for the worst the north can offer — every barrel full, every rope replaced."
 arctic_passage_events.1.b: "A strong crew is preparation enough. We sail with the tide."
 arctic_passage_events.1.historical_info: "The search for a northern sea route to Asia occupied English, Dutch, and Scandinavian navigators throughout the sixteenth century. The Northwest Passage was not successfully navigated until Roald Amundsen's 1903–06 expedition; the Northeast Passage was first completed by Adolf Nordenskiöld in 1878–79. Both routes proved commercially impractical compared to the southern alternatives, but the voyages produced some of the most detailed early mapping of the Arctic and opened the fur and whale trade of the far north."
 arctic_passage_events.2.title: "The Ice Pack"
 arctic_passage_events.2.desc: "The fog lifts to reveal a wall of pack ice stretching from horizon to horizon, groaning as the floes grind against each other. The ice is not solid — there are leads of open water between the floes — but they shift and close without warning. Three ships in the fleet have already sustained hull damage from growlers running below the waterline.\n\nThe men keep their sight on [target_leader.GetName]. [target_leader.GetSheHe|U] has been watching the ice for two days. It is not, strictly speaking, impassable. But it is as close to impassable as anything any of them has seen."
 arctic_passage_events.2.a: "Force a way through the floes — every lead is a road if you move fast enough."
 arctic_passage_events.2.b: "[target_leader.GetNameWithNoTooltip] can read the ice. [target_leader.GetSheHe|U] will find a way through."
 arctic_passage_events.2.c: "Turn back. No passage is worth losing the fleet."
 arctic_passage_events.2.historical_info: "Pack ice — sea ice that has broken from its polar origin and drifted south — was the primary physical obstacle to all Arctic navigation. Unlike the ice sheets attached to land, pack ice shifts constantly with wind and current, opening and closing leads without warning. Sixteenth-century navigators had no reliable way to predict its movements; the most successful expeditions relied on experienced pilots who could read ice conditions from the water color, the sounds of the sea, and the behavior of wildlife."
 arctic_passage_events.3.title: "The Ice-Covered Shore"
 arctic_passage_events.3.desc: "[ShowAreaName('greenland_area')] rises from the sea as a white wall — not cliffs of rock but of ice, continuous from the water's edge to the high plateau far above. The coast there, running north at the edge of the ice sheet, is only navigable in summer. There are no settlements visible, no smoke, no sign of habitation except the occasional ruins of stone structures half-buried in drift.\n\nThe crew have never seen a coast like this. It is useless for agriculture, for timber, for almost anything except as a landmark. But it is a landmark, and they are on course."
 arctic_passage_events.3.a: "Take time to chart the coastline — no one has mapped this shore properly."
 arctic_passage_events.3.b: "Mark the bearing and continue north. There is nothing here worth stopping for."
 arctic_passage_events.3.historical_info: "Greenland was known to Norse settlers from the tenth century and was still nominally under Norwegian-Danish sovereignty in the fifteenth and sixteenth centuries. However, of the two main settlements in it, Western one had already collapsed by the mid-fourteenth century and contact with the Eastern one was lost less than a hundred years after that. English and Portuguese fishermen occasionally reported sighting the coast while pursuing cod in the northwest Atlantic, but systematic European exploration of Greenland's coast did not begin until the Frobisher expeditions of the 1570s."
 arctic_passage_events.4.title: "The Frozen Labyrinth"
 arctic_passage_events.4.desc: "The sea ahead is choked with ice, not pack ice that shifts and opens, but old ice of many years, broken down and refrozen into a maze of pressure ridges and floes so large that would take hours to cross. The channels between them are narrow and dead-end without warning. Three attempts in as many days have found no through-passage.\n\nThis is the place where the northern route ends, if it ends anywhere. The pilots can see open water to the west from the masthead, glinting beyond the ice field. Whether it is an hour away or a week, no one can say."
 arctic_passage_events.4.a: "Force through regardless. The open water is visible, we will reach it."
 arctic_passage_events.4.b: "[target_leader.GetNameWithNoTooltip] can see the leads from up here. [target_leader.GetSheHe|U] knows the way through."
 arctic_passage_events.4.c: "No ship built by human hands can pass through this. We go home."
 arctic_passage_events.4.historical_info: "The central obstacle of the Northwest Passage is the archipelago of islands north of the Canadian mainland, where converging sea ice from the Arctic basin creates permanent multi-year pack ice in many of the channels. Most sixteenth-century expeditions — Frobisher, Davis, Hudson — turned back somewhere in this region. The first successful navigation of the passage required a vessel specifically designed for ice conditions and took three winters to complete."
 arctic_passage_events.5.title: "A Sea to the West"
 arctic_passage_events.5.desc: "The ice breaks and the fleet sails into open water: a great inland sea, calm and cold, ringed by low shores of spruce and rock that stretch away in every direction. It is not the Pacific. The pilots know that. But it is open water west of the ice, and no European fleet has ever been here before, at least that we know of.\n\nThe exact shape of what they have found is unclear. Whether this great bay is a passage through to Asia, or a closed body of water with no exit, will require more sailing to determine. For now, they have done what no one said could be done."
 arctic_passage_events.5.a: "Chart what we can see, then press on. We must know how far this sea runs."
 arctic_passage_events.5.b: "The sea is found. That is proof enough, return now."
 arctic_passage_events.5.historical_info: "Hudson Bay was reached by Henry Hudson in 1610–11 during his search for the Northwest Passage. Hudson spent the winter frozen in James Bay and was set adrift by his mutinous crew in the spring; the survivors returned to England with charts of the bay but no passage beyond it. The bay was later found to have no western outlet, but the voyage established English claims to the region and opened the territory that would eventually become the Hudson's Bay Company's trading empire."
 arctic_passage_events.8.title: "The Bottom of the Bay"
 arctic_passage_events.8.desc: "The sea has grown narrower for three days and now it is clear there is no western outlet. The great bay is closed — not a passage to Asia, but an inland sea of extraordinary size, unknown to any European chart in our possession until this voyage. The pilots have mapped its eastern shore, its western shore, and now its southern extent.\n\nIt is not what anyone came for. But there is no shame in what has been found. A sea this size, this far into the continent, opens possibilities no one has begun to calculate. The crew knows they have done something. The record of this bay will outlast every man aboard."
 arctic_passage_events.8.a: "Chart every shore before we return. Let this bay carry our name."
 arctic_passage_events.8.b: "Begin the return. We have gone further than anyone."
 arctic_passage_events.8.historical_info: "James Bay, the southern extension of Hudson Bay, was where Henry Hudson's crew mutinied and set him adrift in 1611 after a brutal winter. The survivors returned to England with enough charts to establish the bay's shape, though it took further expeditions to confirm there was no western passage. The Hudson's Bay Company, chartered in 1670, would use the bay as the gateway to the vast fur-trading territory of Rupert's Land, one of the largest land grants in history."
