l_simp_chinese:
 relic_expedition_events.1.title: "The Relic Embassy"
 relic_expedition_events.1.desc: "The bishops have asked, and the [ROOT.GetCountry.Custom('GetRulerOrRegentTitle')] has agreed. An embassy will set out for the keepers of one of Christendom's great relics, to obtain by gift, by purchase, or by careful negotiation what no army could simply take. The men we send will need to travel as both diplomats and pilgrims, well-supplied, well-spoken, and well-watched. The question is only how much state to put behind their setting out."
 relic_expedition_events.1.a: "Outfit them properly. Gifts, an interpreter, a senior friar, and an ample purse."
 relic_expedition_events.1.b: "A single agent and a discreet purse will do. The fewer who know, the better."
 relic_expedition_events.1.historical_info: "The medieval and early modern relic trade was a substantial commerce. Catholic and Orthodox communities competed for the most prestigious objects; sales, exchanges, and outright thefts moved relics across Christendom for centuries. Louis IX of France famously purchased the Crown of Thorns from the Latin Emperor Baldwin II in 1238 and built the Sainte-Chapelle in Paris to house it, an undertaking that was as much an act of state as of piety."
 relic_expedition_events.20.title: "A Pilgrim with a Map"
 relic_expedition_events.20.desc: "An old man overtakes the embassy on the road, a battered scrip on his shoulder and a staff worn smooth at the grip. He has been to the holy site we are bound for; he has seen the relic; he can describe the chapel, the guards, the bishop, and the lay of the land for half a league around. He asks only for a place by the fire, a cup of wine, and the chance to talk. [target_leader.GetName] sits him down and listens for two hours."
 relic_expedition_events.20.a: "Bid him farewell with a coin and his blessing. The road has just become shorter."
 relic_expedition_events.20.historical_info: "Pilgrim networks across medieval Christendom carried a vast informal store of practical knowledge: roads, prices, dangerous passes, hospitable monasteries, the personalities of bishops and counts encountered along the way. A returning pilgrim was often a more useful informant than any official agent the crown could have sent, and embassies regularly recruited their guides from this pool."
 relic_expedition_events.21.title: "A [target_country.GetAdjectiveWithNoTooltip] Commandery"
 relic_expedition_events.21.desc: "The embassy reaches the [ShowBuildingTypeName('order_commandery')] of the [target_country.GetLongName] on the inland road in [target_location.GetName], fortified by a low stone curtain wall and flying the cross. The preceptor receives the leader with proper ceremony, sees the embassy housed in the guest hall, has the horses watered and the men fed, and provides a written letter of safe passage for the next leg through territory disputed between three lords. The brothers ask nothing in return but a mass said in the commandery's chapel."
 relic_expedition_events.21.a: "Hear the mass, leave a generous gift on the altar, and resume the road well-rested."
 relic_expedition_events.21.historical_info: "The military orders, principally the Knights Hospitaller and the Templars before their suppression in 1312, maintained a chain of fortified hostels and commanderies along the major pilgrim routes from Western Europe to the Holy Land. Traveling parties of any pious purpose could expect food, shelter, and protected passage from one commandery to the next, and the orders' letters of introduction carried considerable weight at every Catholic court."
 relic_expedition_events.22.title: "The Abbot's Blessing"
 relic_expedition_events.22.desc: "The road in [target_location.GetName] winds past a nearby [ShowBuildingTypeName('orthodox_monastery')] built into the side of a gorge, its bells ringing for vespers as the embassy comes by. The abbot, hearing of the party's mission, comes down to bless the leader and to insist that the embassy stay the night in the guest house. He speaks long into the evening about the relic we seek, about the dignity of its keepers, about the proper manner in which to approach them. The leader writes everything down."
 relic_expedition_events.22.a: "Accept the blessing, leave alms for the monastery's poor, and continue."
 relic_expedition_events.22.historical_info: "Orthodox monasticism preserved a continuous tradition of relic veneration and inter-Christian diplomacy through the medieval period. Catholic embassies on relic business were often dependent on Orthodox monastic hospitality for the inland legs of their journey, and an abbot's letter of introduction to the local patriarch or imperial court could materially smooth the negotiations that followed."
 relic_expedition_events.23.title: "A Forgotten Reliquary"
 relic_expedition_events.23.desc: "In a hill chapel that has not been properly visited in living memory, the embassy's friar finds a small reliquary on a side altar, dusty, unguarded, and apparently forgotten by the parish. Inside, wrapped in faded silk, is a fragment of bone with a Latin label: #italic SS. THEODORI MARTYRIS#!. The local priest, when consulted, professes a vague awareness that something of the sort was supposed to be there, and is happy to part with the reliquary in exchange for a respectable gift to the parish."
 relic_expedition_events.23.a: "Take the reliquary back to the saddlebags. A lesser relic is still a relic."
 relic_expedition_events.23.historical_info: "Medieval Christendom was thick with minor relics: bones of obscure saints, fragments of holy garments, vials of supposed sacred earth or water, set into wooden, ivory, or precious-metal reliquaries and distributed to chapels and shrines across the countryside. Many such reliquaries fell out of veneration when the parish that had received them dwindled or the saint's cult faded; recovering one was a routine side benefit of any extended ecclesiastical journey."
 relic_expedition_events.30.title: "Bandits on the Pass"
 relic_expedition_events.30.desc: "A band of robbers, knowing the embassy carries a heavy purse, has set an ambush in the rocks above a mountain pass. The escort, alerted in time by a goatherd who came running down the road, forms square and stands off the attack, but two of our men are wounded and one of the pack mules carrying gifts is driven over the edge of the cliff with its load. The bandits melt back into the high country. The embassy continues, lighter than it set out."
 relic_expedition_events.30.a: "Continue. There is nothing to be done but go on."
 relic_expedition_events.30.historical_info: "Mountain passes in the medieval and early modern periods were the chronic haunts of brigands, who supplemented poor highland farming with toll-extortion and outright robbery of any party not strong enough to fight them off. The great roads of the Balkans, the Anatolian plateau, and the Levantine interior all had passes that no traveler approached without an escort, and the loss of pack animals over a cliff or down a ravine was a recurring entry in pilgrim chronicles."
 relic_expedition_events.31.title: "A Plague-Stricken Town"
 relic_expedition_events.31.desc: "The embassy has reached [target_location.GetName] only to find it sealed off by its own desperate [target_country.GetAdjective] magistracy. Plague has struck; the gates are barred to all comers; the smoke of burning houses rises behind the walls. [target_leader.GetName] orders the embassy to detour through the surrounding fields, but two of our men, who had gone ahead to negotiate lodging, are caught inside the town when the gates are closed. Whether they live or die, we will not know for some weeks."
 relic_expedition_events.31.a: "Detour and continue. Pray for the men we left behind."
 relic_expedition_events.31.historical_info: "Plague, including but not limited to the bubonic catastrophes of the fourteenth century, was a constant feature of medieval and early modern travel. Towns and cities routinely sealed their gates against incoming traffic when an outbreak began, and pilgrim and embassy parties unlucky enough to find themselves at the gate at the wrong moment had to detour at considerable cost. The fate of forerunners trapped inside was a routine source of grief in surviving travel accounts."
 relic_expedition_events.32.title: "A Storm at Sea"
 relic_expedition_events.32.desc: "The embassy's chartered galley, sailing along an unfamiliar coast, is caught by a sudden squall out of the north and driven onto a lee shore. The hull holds, but the masts go and the cargo of gifts is washed about in the bilges until half of it is ruined. The captain has the ship beached for two weeks of repairs. [target_leader.GetName], fuming, writes letters home that will not be answered for months and walks the beach trying to remember the last time anything had gone right."
 relic_expedition_events.32.a: "Wait for the repairs. The relic, presumably, will still be there."
 relic_expedition_events.32.historical_info: "Mediterranean and Aegean shipping in the pre-modern period was profoundly weather-dependent. Sudden squalls out of the Adriatic, the meltemi winds of the high Aegean, and the freak storms of the Levantine coast routinely drove vessels onto unfamiliar shores and forced costly delays for repairs. Pilgrim and diplomatic accounts of the period treat such groundings as a routine misfortune of travel, not as cause for serious panic."
 relic_expedition_events.33.title: "The Interpreter Falls Ill"
 relic_expedition_events.33.desc: "The multilingual interpreter, our principal asset for the negotiations to come, has fallen ill with a sudden fever in a roadside inn. [target_leader.GetName], unwilling to leave him to die among strangers, halts the embassy for three days; the camp physician does what he can; the local priest is sent for; nothing avails. On the fourth morning the interpreter is buried in the village churchyard. The embassy continues but now with limited linguistic resource."
 relic_expedition_events.33.a: "Continue. The mission is too important to abandon for one death."
 relic_expedition_events.33.historical_info: "Skilled interpreters were among the most valuable members of any pre-modern embassy. Cross-Christian negotiations, despite a shared faith, required Latin-Greek mediation that not every cleric could provide; the loss of a competent interpreter mid-journey was the kind of blow that could derail an embassy's entire purpose. Survivors of such losses tended to fall back on shared written Latin and ecclesiastical sign-language to muddle through."
 relic_expedition_events.10.title: "The True Cross"
 relic_expedition_events.10.desc: "The embassy has reached [target_location.GetName] and been received with full ceremony by the city's [ShowReligionGroupAdjective('christian')] custodians. The relic they guard, a fragment of the True Cross set into a gold reliquary, is offered to us at a price that befits its sanctity. The patriarch speaks softly and at length about the catastrophe at Hattin, about the wood lost to Saladin, about the smaller fragment that survived because a Frankish priest hid it under his cloak. He is not, in the end, unwilling to part with it. The terms remain to be agreed."
 relic_expedition_events.10.a: "Pay the asking price in full. Let every [ShowReligionAdjectiveWithNoTooltip('catholic')] court hear of this acquisition."
 relic_expedition_events.10.b: "Acquire it quietly. The asking price is high; the bishop's secretary is open to other arrangements."
 relic_expedition_events.10.c: "Withdraw. The price is sacrilege; we will not bargain for the Cross."
 relic_expedition_events.10.historical_info: "The True Cross relic, said to be a portion of the cross of the Crucifixion recovered by Saint Helena in the fourth century, was the holiest object in the medieval Catholic world. The principal fragment was carried into battle at the Horns of Hattin in 1187 and captured by Saladin's forces. It was never recovered. Smaller fragments, some of doubtful authenticity, circulated through Catholic and Orthodox treasuries for centuries afterwards, and the great Catholic cathedrals competed openly to acquire them."
 relic_expedition_events.11.title: "The Crown of Thorns"
 relic_expedition_events.11.desc: "The embassy has been received at the [target_country.GetGovernment.GetAdjective] palace in [target_location.GetName] and brought into the great relic chapel. There, behind iron grills and under perpetual lamplight, rests the crown that the Roman soldiers pressed onto Christ's brow at the praetorium. The [target_country.GetAdjective] treasurer is willing to discuss its transfer to us, though the negotiations will require both gold and ceremony. There is precedent for such an arrangement: the [GetCountry('BYZ').GetLongName], when their treasury was empty, had sold that same relic before."
 relic_expedition_events.11.a: "Pay openly, with all the gravity of a transaction between sovereigns. A chapel shall be built for it."
 relic_expedition_events.11.b: "Negotiate quietly with the treasury. A relic obtained in silence costs less."
 relic_expedition_events.11.c: "Withdraw. The price is impertinent; we shall not haggle for Christ's crown."
 relic_expedition_events.11.historical_info: "The Crown of Thorns was kept in the imperial relic chapel of the Pharos in Constantinople from the seventh century onwards. After the Latin Empire was established by the Fourth Crusade in 1204, the new Latin emperors mortgaged the crown to a Venetian banker and were unable to redeem it. Louis IX of France paid off the loan in 1238 and brought the relic to Paris, where he built the Sainte-Chapelle, completed in 1248, specifically to house it. The transfer was treated as one of the principal events of the reign."
 relic_expedition_events.12.title: "The Holy Lance"
 relic_expedition_events.12.desc: "The embassy has reached [target_location.GetName] and been brought before the relic kept in the [target_location.GetRank.GetName]'s cathedral. The lance, said to be that of the centurion Longinus and to have pierced Christ's side at the crucifixion, was found by the First Crusaders during the siege of 1098. The chapter is willing to transfer it; the bishop is willing; the [target_country.Custom('GetRulerOrRegentTitle')] is willing, if the price is right. They explain at length how the lance served in the past to bolster the morale of the [ShowReligionGroupAdjective('christian')] defenders of the [target_location.GetRank.GetNameWithNoTooltip]."
 relic_expedition_events.12.a: "Pay handsomely. The lance shall march with our armies."
 relic_expedition_events.12.b: "Acquire the lance through quiet payments to the chapter and the bishop's clerks."
 relic_expedition_events.12.c: "Withdraw. [target_location.GetNameWithNoTooltip] needs the lance more than we do."
 relic_expedition_events.12.historical_info: "The Holy Lance, discovered in Antioch during the First Crusade by the Provencal priest Peter Bartholomew on 14 June 1098, was credited by the Crusaders with the victory over Kerbogha's relieving army the same month. The find was already controversial in its own time; rival lance-relics existed in Constantinople, Vienna, Krakow, and Rome, and the Antioch lance's authenticity was disputed. The Vienna lance, the so-called Spear of Destiny, became part of the imperial regalia of the Holy Roman Empire and remains in the Hofburg today."
 relic_expedition_announce_holy_lance_tt: "所有天主教统治者都将得知$relic_holy_lance_found$已被寻获"
 relic_expedition_announce_holy_shroud_tt: "所有天主教统治者都将得知 $relic_holy_shroud_found$ 已被寻获"
 relic_expedition_announce_true_cross_tt: "所有天主教统治者都将得知 $relic_true_cross_found$ 已被寻获"
 relic_expedition_events.10.desc_baptist_head: "根据在某修道院档案中发现的一份残缺编年史，一位学者认为，一件被奉为施洗者约翰头颅的圣髑匣，在一场古老的围城战中被埋入某座礼拜堂的地板之下，而那座礼拜堂随后又坍塌，将其掩埋其中。"
 relic_expedition_events.10.desc_holy_chalice: "此地流传的圣杯传说，与 [ShowLocationName('genoa')] 及 [ShowLocationName('valencia')] 那些著名的说法毫无关系。追随这一说法的学者相信，一只朴素的石杯埋藏在一座毁于旧日围城战的礼拜堂之下，其信众早在有人想到挖掘之前便已四散离去。"
 relic_expedition_events.10.desc_holy_lance: "一位研究第一次十字军东征的学者相信，他根据 [GetCharacter('koj_petrus_bartholomaeus').GetName] 本人的记述，找到了1098年 $relic_holy_lance_found$ 出土的那个地窖。他认为当年埋在它旁边的东西从未被完全找回。当时敌对的教士曾嘲笑这一想法荒诞不经，但没有一个人能推翻它。"
 relic_expedition_events.10.desc_holy_nail: "一位研究圣物的学者指出一座半已坍塌的礼拜堂，据当地传说，一名逃亡的神父曾在过路士兵之前，将一枚钉刑圣钉埋在了那里。"
 relic_expedition_events.10.desc_holy_shroud: "一位年迈的古物学家对一个无从考证来源的传闻半信半疑：据说一块印有圣像的裹尸布，被逃避袭掠的修士们砌进了一处墓室的墙中，而此事从未见于任何编年史。他已近乎失明，渴望在有生之年再有一次发现，并愿亲自带路前往。"
 relic_expedition_events.10.desc_holy_thorn: "一位学者通读了一个已然绝嗣的家族的私人信函，循迹追踪到荆棘冠上的一根圣荆棘，最终指向他们的墓室——自那场令全家覆灭的瘟疫以来便一直封闭至今。"
 relic_expedition_events.10.desc_saint_bones: "一位依据破损教区登记册进行考证的地方圣徒传记作者，锁定了旧墓园边缘一座无字之墓：那里葬着一位小圣人，其遗骨当年被人藏了起来，而非留给敌军。"
 relic_expedition_events.10.desc_titulus_crucis: "当地传说认为，那块十字架的铭牌其实从未西传。一位认真看待此传说的学者相信，它在十字军最后一次撤退时被砌入了此地的一座礼拜堂墙中，并愿协助寻找那面墙。"
 relic_expedition_events.10.desc_true_cross: "一位游历四方的学者，遍读一切关于哈丁之战的编年史，从三份几乎是偶然相符的记述中，锁定了一处地段——据传撤退的骑士们曾在那里埋下一块$relic_true_cross_found$的碎片，宁可如此也不愿让萨拉丁夺走。他愿献出自己的笔记、饱经风霜的地图，以及他本人。"
 relic_expedition_events.10.desc_true_cross_fragment: "三代修道院的账册前后对照，让一位学者找到了一处仓促废弃的隐修所。据说最后一位隐修士在仓皇逃命之前，把 $relic_true_cross_found$ 的一块残片埋在了礼拜堂的地板之下。"
 relic_expedition_events.10.desc_virgin_milk: "一位学者引用了一本无人问津的朝圣者日记，指出一处废弃圣祠中被砌死的壁龛。据称，看守者当年宁可将一瓶圣母之乳藏于此处，也不愿将其交给劫掠者。"
 relic_expedition_events.13.a: "按他所说的付钱，但仅此一次。"
 relic_expedition_events.13.b: "让随从去逼问他。恐惧比银币便宜。"
 relic_expedition_events.13.desc: "一名工匠被当场抓获，正把一块圣人的指骨——那天早上才用羊骨雕成、用茶水染色的——卖给一个易受骗的朝圣者。被逼问还骗过谁时，他反倒赌咒发誓说自己知道一件真货的下落，是在为作坊搜集旧木料和更旧的铁器时偶然碰见的。他愿意说出是哪个区，却不肯说出哪条街，除非先见到钱。伪造者说的话，值多少就值多少，绝不会更多。"
 relic_expedition_events.13.forger_cheated_tt: "他所说的那个区里除了流言什么都没有，这个伪造者用同一个谎言骗了两次钱"
 relic_expedition_events.13.forger_honest_tt: "这一次，钱买来了真东西，伪造者所说的竟是实情"
 relic_expedition_events.13.threats_fail_tt: "他只是嚷嚷出更多的托词，随从的威逼除了擦破几个指节外一无所获"
 relic_expedition_events.13.threats_work_tt: "恐惧撬开了银币撬不开的嘴，伪造者交出了些真东西"
 relic_expedition_events.13.title: "伪造者的作坊"
 relic_expedition_events.14.a: "硬闯过去。这条路想来走不了多远。"
 relic_expedition_events.14.b: "压好帐篷，就地扎营，任凭风暴自行消散。"
 relic_expedition_events.14.desc: "正午时分，一道赭黄色的尘壁在天边立起，不到一个时辰便已吞没了道路。骆驼纷纷屈膝跪地，任凭如何都不肯起身，沙粒钻进衣物的每一道褶皱和每一只水囊之中，向导也承认自己已经辨不清指路的石堆了。 [target_leader.GetName] 可以选择盲目前行，也可以耽误几天等风暴过去。"
 relic_expedition_events.14.title: "路上的沙暴"
 relic_expedition_events.15.a: "不惜代价救治病患，并将其隔离。"
 relic_expedition_events.15.b: "任其自然发展。热病早晚会自行退去。"
 relic_expedition_events.15.desc_land: "热病随着挑水人一同而来，几乎不给任何预警便夺走两三人的性命：清晨还只是头痛，正午便开始颤抖，到第二天早晨便已是一座浅坟。随行的两名医师早已应付不过来所有求诊之人，健康的人开始刻意与病患保持距离，分开安睡。 [target_leader.GetName] 必须决定王室将为遏制疫情投入多少。"
 relic_expedition_events.15.desc_sea: "热病随着港口最后一批取来的淡水登上了船，几乎不给任何预警便夺走两三人的性命：清晨还只是头痛，正午便开始颤抖，到第二天早晨便已被抛下船舷。随行的两名医师在拥挤的船舱中早已应付不过来所有求诊之人，健康的人开始尽可能远离病患，在甲板上分开安睡。[target_leader.GetName] 必须决定王室将为遏制疫情投入多少。"
 relic_expedition_events.15.title: "热病肆虐"
 relic_expedition_events.16.a: "缴纳通行费，趁他还没改主意之前赶紧离开。"
 relic_expedition_events.16.b: "杀出重围。我们不是走了这么远的路来任人打劫的。"
 relic_expedition_events.16.c: "以人数说话。面对如此阵仗，鲜有人敢造次。"
 relic_expedition_events.16.desc: "在道路两山脊之间的低谷处，武装人员横列成阵，人数之多、阵形之整齐，绝非寻常打家劫舍之徒可比。他们的首领策马走出队列，开口要价，换取安全通行，言语间分明已经盘算好了拒绝的代价。"
 relic_expedition_events.16.title: "沙漠盗匪索要贡金"
 relic_expedition_events.17.a: "再给这人斟一杯酒，细细追问每一个细节。"
 relic_expedition_events.17.b: "不过是千百个故事中的又一个罢了。我们天一亮便启程。"
 relic_expedition_events.17.desc: "一队朝圣者与我们共宿驿站过夜，篝火旁的闲谈照例又转到了圣物上。其中一人，是内陆一位羊毛商的儿子，讲起一个他从二十年前已故的叔父那儿零星记得的故事：几名僧侣从一座燃烧的房子里抬出一个包裹，在海边大道上度过一夜，还有一场本不该被人看见的葬礼。他说不出那房子的名字，却奇怪地对那条路信誓旦旦。"
 relic_expedition_events.17.tale_confirmed_tt: "一枚钱币松动了他的舌头，他吐露出一个本不该说出口的细节"
 relic_expedition_events.17.tale_fades_tt: "再斟一杯也无济于事，细节只会在一次次转述中愈发模糊"
 relic_expedition_events.17.title: "朝圣者的传闻"
 relic_expedition_events.18.a: "立刻从王室自己的钱库里补上缺额。"
 relic_expedition_events.18.b: "让他们的工钱再拖一拖。反正他们无处可去。"
 relic_expedition_events.18.desc: "这个月汇兑行情不佳，加之放贷人对借钱给外邦人骤然变得谨慎起来，探险队的钱箱比预想中要空得多。随行人员的工钱已经拖欠了半个月，赶骡人只肯收他们信得过的钱币，而不是我们的，而一支欠饷的队伍的名声，在这些城镇里传得比我们打听的任何消息都快。"
 relic_expedition_events.18.title: "盘缠告急"
 relic_expedition_events.19.a: "按该有的礼数奉上敬意，让该看见的人看见。"
 relic_expedition_events.19.b: "无视这番警告，继续行事。时间已经不多了。"
 relic_expedition_events.19.desc_christian: "当地的 [relic_hunt_current_loc.GetOwner.GetGovernment.GetEstateName('clergy_estate')] 已经注意到，有一支外邦队伍打探那些他们认为只该由教会过问、旁人无权置喙的圣物，探问得未免太过深入。副主教以十足的礼数接见了 [target_leader.GetName]，就贪婪之罪说了好一番话，临了毫不含糊地暗示：想要他继续保持善意，祭坛上须得有份供奉才行。"
 relic_expedition_events.19.desc_fallback: "探险队打探消息的风声，传到了本不该惊动的人耳中。天黑之后，一个无人引荐的男子走进了下榻的客栈，未经邀请便径自坐下，不紧不慢地细说起一支外邦队伍在这样的城镇里能给自己招来多大的麻烦。这番警告不慌不忙，态度十足客气，意思却再明白不过。"
 relic_expedition_events.19.desc_muslim: "当地的 #italic qāḍī #! 已经听闻，有外邦人在四处打探法兰克人财宝的事，还在追问王国覆灭之时，是哪些家族私吞了什么东西。他的秘书带着茶点和恭维之词登门拜访 [target_leader.GetName] ，话里藏着一层再清楚不过的意思：这类查访若得他家主人过问相助，定会顺利许多，若能再奉上一笔用于清真寺修缮的心意，那就更是妥当。"
 relic_expedition_events.19.title: "地方当局的注意"
 relic_expedition_events.2.a: "四处打听。只要用 [ShowGoodsNameWithNoTooltip('wine')] 付钱，朝圣者和士兵们都愿意开口。"
 relic_expedition_events.2.b: "我们终于找到了一件圣物的踪迹。"
 relic_expedition_events.2.c: "在此地招募更多随从。优秀的护卫可不便宜。"
 relic_expedition_events.2.d: "贿赂一位宫廷官员，换取当地档案中的一切。"
 relic_expedition_events.2.desc_acre_first: "使团抵达 [ShowLocationName('acre')]，此地曾是十字军王国的都城，直至1291年为马穆鲁克人所夺。大教堂虽仍勉强立着，屋顶却已不知去向，只余天空；自那场浩劫以来，整片街区从未重建。至今尚无人有理由去翻检那些瓦砾。"
 relic_expedition_events.2.desc_acre_repeat: "再度来到[ShowLocationNameWithNoTooltip('acre')]。[target_leader.GetName]已知晓哪些巷弄值得再走一遭。"
 relic_expedition_events.2.desc_antioch_first: "使团抵达 [ShowLocationName('antioch')]，此地曾是已然消亡的十字军公国的都城，也正是在1098年那个绝望的夏天，$relic_holy_lance_found$ 从一座教堂的地板下被掘出之处。大军南下前往 [ShowLocationNameWithNoTooltip('jerusalem')] 之后，这支圣枪去向何方，西方无人能够定论。这座城市失落的东西，可不止这一件。"
 relic_expedition_events.2.desc_antioch_repeat: "[target_leader.GetName] 又回到了 [ShowLocationNameWithNoTooltip('antioch')]，仍在追问那支失落的圣枪，得到的答案依旧众说纷纭。"
 relic_expedition_events.2.desc_damascus_first: "使团抵达[ShowLocationName('damascus')]，这座[ShowProvinceDefinitionName('shaam_province')]的[location_scope.GetOwner.GetAdjective]大都会，正是$relic_true_cross_found$在哈丁一役后最后一次得到可信记载的所在。至于这件圣物是否仍在此地，则另当别论。如此规模的城市，数百年间收纳了无数珍宝，归还的却寥寥无几。"
 relic_expedition_events.2.desc_damascus_repeat: "又回到了[ShowLocationNameWithNoTooltip('damascus')]。[target_leader.GetName]已经摸清了这座[location_scope.GetRank.GetNameWithNoTooltip]里谁人肯开口，又需付出怎样的代价。"
 relic_expedition_events.2.desc_fallback: "又是一处落脚地，又是一轮寒暄。[target_leader.GetName] 再次从头开始，等待着值得追寻的东西出现。"
 relic_expedition_events.2.desc_famagusta_first: "远征队抵达[ShowLocationName('famagusta')]，这是[ShowProvinceDefinitionName('cyprus_province')]的[location_scope.GetOwner.GetAdjective][location_scope.GetOwner.GetFlavorRank]治下的大港。1291年[ShowLocationNameWithNoTooltip('acre')]陷落后，大批拉丁人家族逃难至此，其中不少人从大陆带出的，远不止他们的头衔。"
 relic_expedition_events.2.desc_famagusta_repeat: "重返 [ShowLocationNameWithNoTooltip('famagusta')] 。如今圣尼古拉大教堂的人们已经认识 [target_leader.GetName] 了。"
 relic_expedition_events.2.desc_gaza_first: "远征队抵达 [ShowLocationName('gaza')] ，这座古城昔日曾有圣殿骑士团驻守，位于通往 [ShowRegionName('egypt_region')] 的沙漠大道南端。多年以前，该修会遭到取缔，其成员流散于整个基督教世界。他们在此留存的东西，并未全部随他们而去。"
 relic_expedition_events.2.desc_gaza_repeat: "重返[ShowLocationNameWithNoTooltip('gaza')]。[target_leader.GetName]已与住在昔日圣殿骑士团旧址的大多数人家交谈过。"
 relic_expedition_events.2.desc_hebron_first: "远征队抵达 [ShowLocationName('hebron')] 及麦比拉洞，据说亚伯拉罕、以撒和雅各都安葬于此，为 [ShowReligionGroupAdjective('israelite_group')] 、 [ShowReligionGroupAdjective('christian')] 与 [ShowReligionGroupAdjective('muslim')] 信徒共同尊崇的圣地。数百年来，三大信仰都曾为这座圣所添砖加瓦，也都曾从中取走过东西。某件被错放在了错误年代的小物件，或许至今仍无人察觉地留在此处。"
 relic_expedition_events.2.desc_hebron_repeat: "重返[ShowLocationNameWithNoTooltip('hebron')]。[target_leader.GetName]此前已在圣所周边走动过，深知何处不宜露面。"
 relic_expedition_events.2.desc_jaffa_first: "远征队抵达[ShowLocationName('jaffa')]，昔日朝圣者曾成船地在此登陆，据说使徒彼得也曾在这里让寡妇大比大死而复生。两个世纪以来，朝圣者的往来川流不息地经过这座港口。并非所有东西都随着他们再次离开。"
 relic_expedition_events.2.desc_jaffa_repeat: "重返 [ShowLocationNameWithNoTooltip('jaffa')]。码头区的人们已经习惯了 [target_leader.GetName] 的种种询问。"
 relic_expedition_events.2.desc_jerusalem_first: "使团已抵达[ShowLocationName('jerusalem')]，立于圣墓教堂之前。[location_scope.GetOwner.GetAdjective]驻军打量了一番队伍，便失了兴致。每季都有异邦人为着同一座坟茔、同一段传说而来。而在这些传说背后，或许藏着一条值得追寻的线索，只是要找到它，既费时又费钱，多半还要看信谁不信谁。"
 relic_expedition_events.2.desc_jerusalem_repeat: "又回到了 [ShowLocationNameWithNoTooltip('jerusalem')] 。圣墓教堂的教士们此时已认得 [target_leader.GetName] ，驻军甚至懒得抬眼相看。"
 relic_expedition_events.2.desc_karak_first: "远征队抵达 [ShowLocationName('karak')]，这座沙漠城堡曾是奥特朱丹领主雷纳德·德·沙蒂永的据点。据说雷纳德多年来劫掠朝圣商队，并将所得财物藏于此地，以备应对他深知萨拉丁终将发动的围城。城下小镇里，家家户户讲述这段往事的方式都不尽相同。"
 relic_expedition_events.2.desc_karak_repeat: "重返 [ShowLocationNameWithNoTooltip('karak')]。[target_leader.GetName] 已经听过一遍这座城堡的传说，从爱说闲话的人口中又听了第二遍。"
 relic_expedition_events.2.desc_nicosia_first: "远征队抵达[ShowLocationName('nicosia_cyp')]，此地乃[ShowProvinceDefinitionName('cyprus_province')]权力所在的中心。[location_scope.GetOwner.GetAdjective]的[location_scope.GetOwner.GetGovernment.GetCourtTitle]保存着一份详尽的档案，记载着流亡的大陆贵族当年带来的物品，还有一份更长的记录，记载着他们后来典当出去的东西。"
 relic_expedition_events.2.desc_nicosia_repeat: "重返[ShowLocationNameWithNoTooltip('nicosia_cyp')]。[location_scope.GetOwner.GetAdjective]的档案管理员们已不再追问[target_leader.GetName]为何屡屡前来。"
 relic_expedition_events.2.desc_rhodes_first: "远征队抵达[ShowLocationName('rodos')]，[location_scope.GetOwner.GetAdjective]的领地。此地的骑士团将[ShowLocationNameWithNoTooltip('acre')]的陷落视为自身历史的一部分，并保存着大陆上每一个被放弃的骑士辖区的名录。这片海域中再没有第二座城市，会向一支天主教搜寻队开放这样的档案。"
 relic_expedition_events.2.desc_rhodes_repeat: "重返[ShowLocationNameWithNoTooltip('rodos')]。[location_scope.GetOwner.GetAdjective]的档案管理员们把[target_leader.GetName]当作一个熟面孔般的麻烦人物来迎接。"
 relic_expedition_events.2.desc_sidon_first: "远征队抵达 [ShowLocationName('sidon')] ，又一座福音书记载基督曾造访之地，也是王国覆灭前的一处十字军领地。此后，昔日的法兰克人街区已两度易主重建。如今的住户对自家地窖中藏有何物，可谓一无所知。"
 relic_expedition_events.2.desc_sidon_repeat: "重返[ShowLocationNameWithNoTooltip('sidon')]。[target_leader.GetName]手头有一份值得再度走访的法兰克人宅邸名单。"
 relic_expedition_events.2.desc_tripoli_first: "使团抵达 [ShowLocationName('tripoli_syria')] ，此地曾是十字军治下的一个伯国，直至1289年陷落。港口的贸易依旧繁忙如昔，但旧堡垒中的礼拜堂已荒废失圣许久，久到此地无人还能记起，却也从未被人搬空。"
 relic_expedition_events.2.desc_tripoli_repeat: "又回到了 [ShowLocationNameWithNoTooltip('tripoli_syria')]。港口的商贩们如今已认得 [target_leader.GetName] 的面容。"
 relic_expedition_events.2.desc_tyre_first: "远征队抵达 [ShowLocationName('sur')]，这座 [location_scope.GetRank.GetName] 历史悠久，福音书中都曾记载基督途经此地，也是十字军在1291年前坚守的最后几处大陆据点之一。当地的大主教区曾留存了两个世纪的档案。如今幸存下来的部分散落在十几户私人宅邸中，而每家的说法都各不相同。"
 relic_expedition_events.2.desc_tyre_repeat: "重返[ShowLocationNameWithNoTooltip('sur')]。[target_leader.GetName]已经读过旧日大主教区留下的大部分文献。"
 relic_expedition_events.2.e: "寻访一位学者。训练有素的头脑更善于解读传闻。"
 relic_expedition_events.2.f: "沿着一条有希望的线索前往 [relic_hunt_new_lead.GetNameWithNoTooltip]。"
 relic_expedition_events.2.g: "放弃搜寻，打道回府。"
 relic_expedition_events.2.title: "抵达"
 relic_expedition_events.3.a: "继续追问。这里有人知道的比说出来的更多。"
 relic_expedition_events.3.b: "终于，我们找到了踪迹本身。"
 relic_expedition_events.3.c: "既然到了这里，不妨招募更多随从。"
 relic_expedition_events.3.d: "再贿赂一名官吏。这座城镇的档案保存得更完好。"
 relic_expedition_events.3.desc_acre: "空洞的墙壁被逐一敲响探查，坍塌的砌石被翻开——那是几代人都未曾触碰过的地方。[ShowLocationNameWithNoTooltip('acre')]是一座庞大的[relic_hunt_loc.GetRank.GetName]，如今人烟稀少，一支队伍所能勘察的范围终究有限。"
 relic_expedition_events.3.desc_antioch: "[target_leader.GetName] 沿着已消失的城墙轮廓追寻，将残存的遗迹与朝圣者关于圣枪出土地点的记述相互印证。这些记述彼此矛盾，也没有一个与实地相符。"
 relic_expedition_events.3.desc_damascus: "[target_leader.GetName] 一个市集一个市集地拉拢商人与放贷人。在这样一座大城市里，流言传播缓慢，但终究会传开，而且传来时早已明码标价。"
 relic_expedition_events.3.desc_fallback: "[target_leader.GetName] 依旧不懈，将每一条细小的线索翻来覆去查证一番，再决定是否放弃。"
 relic_expedition_events.3.desc_famagusta: "在 [ShowLocationNameWithNoTooltip('famagusta')] ，一箱一箱翻查那些流亡大陆世家的家什箱柜，一一记录哪些物件出自 [ShowLocationNameWithNoTooltip('acre')] ，又有哪些自那以后被悄然遗忘。"
 relic_expedition_events.3.desc_gaza: "[target_leader.GetName] 紧追着那被查禁修会在 [ShowLocationNameWithNoTooltip('gaza')] 的产业不放，追问邻人圣殿骑士团曾锁住哪些库房，事后钥匙又落入了谁的手中。"
 relic_expedition_events.3.desc_hebron: "圣祠被一处壁室一处壁室地仔细查验，动作缓慢，处处留心不冒犯守护此地的三大信仰中的任何一方。[target_leader.GetName] 记下每一处封闭的通道，却对其中任何一处都闭口不问。"
 relic_expedition_events.3.desc_jaffa: "[target_leader.GetName]在[ShowLocationNameWithNoTooltip('jaffa')]的港口逗留数日，为码头工人和船夫买酒，打探法兰克人离开前是哪些仓库负责朝圣者货物的存放。"
 relic_expedition_events.3.desc_jerusalem: "[target_leader.GetName] 趁着朝圣人群到来之前，天未破晓便再度前往圣墓。还有另一处地穴要借烛光察看，还有一段磨损的铭文要抄录下来，还有一位教士愿意在适当的报酬下开口。"
 relic_expedition_events.3.desc_karak: "手持灯笼，[target_leader.GetName] 走遍 [ShowLocationNameWithNoTooltip('karak')] 的地窖与蓄水池，将说书人口中雷纳德·德·夏蒂永的宝藏描述，与这些墙壁实际能证实的东西一一对照。"
 relic_expedition_events.3.desc_nicosia: "[target_leader.GetName] 在 [ShowLocationNameWithNoTooltip('nicosia_cyp')] 翻阅 [relic_hunt_loc.GetOwner.GetAdjective][relic_hunt_loc.GetOwner.GetGovernment.GetCourtTitle] 的档案，将库存清单与继承名册逐一核对，寻找一件从未有人过问的圣物。"
 relic_expedition_events.3.desc_rhodes: "[target_leader.GetName] 在 [ShowLocationNameWithNoTooltip('rodos')] 逼问 [relic_hunt_loc.GetOwner.GetAdjective] 档案员，要求出示那些他们尚未交出的卷册，并将其清单与年长修士所说从 [ShowLocationNameWithNoTooltip('acre')] 运出的物品一一比对。"
 relic_expedition_events.3.desc_sidon: "在旧日的法兰克人聚居区，一户户新迁入的人家门前，[target_leader.GetName] 敲门询问那些自最后的基督徒住户逃离后便无人开启的地窖与阁楼。"
 relic_expedition_events.3.desc_tripoli: "城堡礼拜堂被一块块石板拆开检查，凡是敲击声不对的墙面，灰泥都被撬开查看。光是这座礼拜堂，就要耗费数周功夫。"
 relic_expedition_events.3.desc_tyre: "[target_leader.GetName]翻查着[ShowLocationNameWithNoTooltip('sur')]大主教区档案中残存的文书，将水渍斑斑的账册与半字难辨的特许状并排放置，寻找那份与众不同的记录。"
 relic_expedition_events.3.e: "继续前行之前，先请教当地的学者。"
 relic_expedition_events.3.f: "新的线索指向了别处。前往 [relic_hunt_new_lead.GetNameWithNoTooltip] 追查下去。"
 relic_expedition_events.3.g: "取消搜寻，返程回国。"
 relic_expedition_events.3.title: "搜寻仍在继续"
 relic_expedition_events.4.b: "够了。召回使团。"
 relic_expedition_events.4.desc: "Every lead [target_leader.GetName] has chased has come to nothing. The interpreters have run out of taverns, the bribed officials have nothing further to sell, and the purse grows lighter every week the party sits idle in a foreign country. Word goes home to the crown: pay for more searching, or end it."
 relic_expedition_events.4.title: "线索已断"
 relic_expedition_events.5.a: "没有护卫，任务无法继续。"
 relic_expedition_events.5.title: "护卫已散"
 relic_expedition_events.6.a: "讨价还价。要价虽高,但仍有商量余地。"
 relic_expedition_events.6.b: "照价支付。有些东西值得这个价钱。"
 relic_expedition_events.6.c: "让我们随从的阵仗替我们说话。"
 relic_expedition_events.6.desc_baptist_head: "该地区的一座教堂供奉着据称是施洗者约翰的头骨。此说从未远传出堂区之外，而神职人员愿意商谈转让之事。"
 relic_expedition_events.6.desc_holy_chalice: "一名商人料到无人会信,便先自己说明,随即拿出一只朴素的石杯,坚称这就是最后的晚餐所用的真圣杯,不管别处那些更堂皇的说法如何宣称。他开出的价钱可不便宜。"
 relic_expedition_events.6.desc_holy_lance: "一名阵亡士兵的家人自曾祖父从军时起便保存着一枚枪头，坚称那正是 $relic_holy_lance_found$ ，1098年出土的那一件。他们宁愿要钱。"
 relic_expedition_events.6.desc_holy_nail: "一位铁匠的遗孀拿出一枚锈黑的铁钉。她丈夫家一直坚称，这正是钉刑所用的钉子之一。她愿意出售。"
 relic_expedition_events.6.desc_holy_shroud: "一名商人展开一块亚麻布，上面隐约印有一名受钉刑之人的形象。他说不清这些世纪以来它经历过什么，但无论如何都要价不菲。"
 relic_expedition_events.6.desc_holy_thorn: "一个小贵族家庭拥有一枚安放在朴素圣髑匣中的荆棘,据他们所说,是先祖从荆棘冠冕上取下传承而来。他们希望此次出售不为外人所知。"
 relic_expedition_events.6.desc_saint_bones: "一名堂区神父提出出让一小匣骸骨，匣上以褪色的拉丁文写着一位圣人的名字。他会把这笔款子说成是对教会的捐献。"
 relic_expedition_events.6.desc_titulus_crucis: "当地传说称,当年十字架的木料西运之时,其上的铭牌却留了下来,被人藏匿至今。此地有一户人家自称继承了正是这样一块铭牌,愿意出售。"
 relic_expedition_events.6.desc_true_cross: "镇上的一名商人，谨慎地留意四周有无旁人，说他手中持有$relic_true_cross_found$本身的一块残片，那失落于哈丁的圣木，经由他不愿透露姓名的人手辗转而来。不过，他会开出一个价钱。"
 relic_expedition_events.6.desc_true_cross_fragment: "一座贫穷而近乎被遗忘的修道院，用一只素朴的圣物匣保存着一片木屑，标签上只写着这是 $relic_true_cross_found$ 的一部分。若这笔交易能让修道院的屋顶得以修缮，院长便愿悄然将其转手。"
 relic_expedition_events.6.desc_virgin_milk: "一座小圣所保存着一只密封的白色粉状残迹瓶，历代都被尊奉为圣母玛利亚之乳。守护者愿意将其出售，连同银制圣物匣一并奉上。"
 relic_expedition_events.6.title: "愿意出手的卖主"
 relic_expedition_events.7.a: "付款,将圣物带回家。"
 relic_expedition_events.7.b: "此事总觉得不对劲。转身离去。"
 relic_expedition_events.7.desc: "条件已经谈妥,圣髑匣也已用布包好。剩下的,只是 [target_leader.GetName] 要决定该相信卖家的说辞几分。"
 relic_expedition_events.7.title: "成交"
 relic_expedition_events.8.a: "谨慎需要金钱。"
 relic_expedition_events.8.b: "不带帮手行事。收买的人越少，泄密的嘴就越少。"
 relic_expedition_events.8.c: "无需同党。我们的随从直接取走便是。"
 relic_expedition_events.8.d: "无需金子。 [target_leader.GetHerHis|U] 自身的魅力便足以赢得他们的协助。"
 relic_expedition_events.8.desc_baptist_head: "一位屡次被拒绝晋升的年轻教士，愿意领我们前往那处圣骸匣——高级教士们尊之为施洗者约翰的头骨。"
 relic_expedition_events.8.desc_holy_chalice: "一位主教座堂的司事对他服务多年的教士团毫无好感，愿协助我们取走那只朴素的石杯——私下里，他们称之为最后晚餐的真圣杯。"
 relic_expedition_events.8.desc_holy_lance: "一名被拖欠了一年军饷的驻军士兵无意中透露,军械库里存放着一柄古老的矛头,记忆所及从无人清点造册。老兵们仍称它为 $relic_holy_lance_found$ 。他能带我们混进去。"
 relic_expedition_events.8.desc_holy_nail: "一名深陷债务的司库文书承认,一枚被奉为受难圣钉之一的古老铁钉未经登记,存放在偏库之中。唯有他持有那把钥匙。"
 relic_expedition_events.8.desc_holy_shroud: "一名修道院的门房,近来与院长有过激烈争执,透露修道院藏有一块折叠的布,上面印有图像,除了资深修士外无人得见,平日锁藏于密处。他愿意留一扇门不上闩。"
 relic_expedition_events.8.desc_holy_thorn: "一名曾被解职、后又勉强复职的管家，确切知道那家族将荆棘冠上唯一一根圣刺的圣骸匣藏于何处。"
 relic_expedition_events.8.desc_saint_bones: "一个终生劳作却报酬微薄的掘墓人知道教区将圣徒骸骨匣藏于何处，也知道司事下午在哪个时辰会躺下休息。"
 relic_expedition_events.8.desc_titulus_crucis: "一个世代守护着一则半信半疑的古老传说的家族，提出了截然不同的请求：请助他们从一位不愿出售的亲族手中，夺回他们坚信是十字架真迹铭牌的圣物。"
 relic_expedition_events.8.desc_true_cross: "当地一位显贵家中的仆人,似乎为某事心怀不满却不肯明说,提到他的主人藏有一块用布包裹的深色木料,称之为 $relic_true_cross_found$ ,平日混在其他财宝之中不引人注意。只要付些钱,这仆人便愿助我们取走它。"
 relic_expedition_events.8.desc_true_cross_fragment: "一名对修道生活心怀不满的初学修士提议,愿为我们留开小教堂的一扇窗板,他所在的修道院正是在那里保存着 $relic_true_cross_found$ 的一小块碎片。"
 relic_expedition_events.8.desc_virgin_milk: "神殿本身的看守人，因数十年薪俸微薄而暗自愤懑，愿在他选定的某个夜晚将圣骸匣的门锁虚开。"
 relic_expedition_events.8.title: "甘愿相助的同谋"
 relic_expedition_events.9.a: "事成了。圣物已归我们所有，无人察觉。"
 relic_expedition_events.9.b: "有人惊醒了。呼喊声，脚步声。撤退！"
 relic_expedition_events.9.desc: "至此计划仍在顺利进行。本该值守之人已经睡着，或不在此处，或早已被收买而视而不见，同党许诺开启的那道门也确实无人把守。 [target_leader.GetName] 在黑暗中等待，唯恐听见那声足以昭示一切败露的呼喊。"
 relic_expedition_events.9.title: "窃取"
