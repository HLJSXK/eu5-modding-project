l_simp_chinese:
 treasure_fleet_events.1.title: "下西洋时代"
 treasure_fleet_events.1.entry: "$treasure_fleet_events.1.title$"
 treasure_fleet_events.1.desc: "仰赖国朝数十年海内升平，府库充盈，金帛山积。今当乘此国力鼎盛之际，遣宝船四出，携[ROOT.GetCountry.GetName]奇珍异宝，广宣[GetInternationalOrganization('middle_kingdom').GetName]威德于四海。以金帛厚礼，招徕诸国入我[ShowSubjectTypeName('tributary')]之藩属。"
 treasure_fleet_events.1.a: "正该如此！"
 chi_able_to_send_treasure_voyages: "[ROOT.GetCountry.GetName]将解锁[ShowGenericActionName('start_a_treasure_voyage')][action|e]。作为[GetInternationalOrganizationType('middle_kingdom').GetName][international_organization_leader_short|e]，该国可以通过花费[gold|e]以说服更多国家加入他们的[ShowSubjectTypeName('tributary')]网络"
 treasure_fleet_events.2.title: "下西洋的结束"
 treasure_fleet_events.2.desc: "今[ROOT.GetCountry.GetName]之众人，细察宝船巡行之举，徒费国帑数百万，劳师远征，所获不过奇珍异兽、虚名浮誉。史家秉笔，当删此劳民伤财之举，以警来者。"
 treasure_fleet_events.2.a: "那就只能这样了。"
 chi_unable_to_send_treasure_voyages: "[ROOT.GetCountry.GetName]将无法再使用[ShowGenericActionName('start_a_treasure_voyage')]"
 treasure_fleet_events.3.title: "宝船启航"
 treasure_fleet_events.3.desc: "经数旬筹备，$expedition_leader_name$统帅的远洋舰队已整装待发，即将在黎明时分自[start_location.GetName]启航，远征[target_area.GetName]。前路风云难测，然既承[ROOT.GetCountry.GetGovernment.GetRulerOrRegent.GetName]重托，$expedition_leader_name_herhis$自当竭诚效命。\n\n此去海天万里，恐经年累月，归期难料。惟愿天佑水师，早传凯旋捷报！"
 treasure_fleet_events.3.a: "一帆风顺！"
 chinese_treasure_expeditions_send_tooltip: "The $expedition_name_treasure_voyage$ is sent towards [ROOT.GetVariable('chinese_treasure_target_location').GetLocation.GetName] under the leadership of [character_expedition_leader_target.GetName].\nThe fleet holds #g [ROOT.GetVariable('chinese_treasure_voyage_cargo').GetValue|2]#! [gold|e] worth in cargo intended for gifts to [countries|e] that they will visit."
 treasure_fleet_events.4.title: "来自 $expedition_name_treasure_voyage$ 的消息"
 treasure_fleet_events.4.desc: "A junk has put in at one of the southern ports with news from the $expedition_name_treasure_voyage$. The fleet under $expedition_leader_name$ has reached the harbor of [port_location.GetName] in the country of [port_country.GetName], and the local court has been received in due form. Trade goods have been exchanged, the customary gifts presented to the ruler. The fleet's chronicler reports the wind and the season are favorable for the next leg of the journey. There is, the captain notes, no immediate reason for the imperial court to expect ill news."
 treasure_fleet_events.4.a: "愿风势始终顺畅。"
 treasure_fleet_events.5.title: "[expedition_initiator.GetAdjectiveWithNoTooltip]$expedition_name_treasure_voyage$来访"
 treasure_fleet_events.5.desc: "拂晓时分，[target_stop.GetRank.GetName]的[target_stop.GetName]居民们目睹了一幅既恐怖又令人震惊的景象。[coastal_sea_tile.GetName]的整个地平线被[GetInternationalOrganization('middle_kingdom').GetName]的船只覆盖，这支舰队正是由[expedition_initiator.GetLongName]派遣而来。舰队领袖$expedition_leader_name$迅速在我们的港口登陆，并获得了在[target_stop.GetNameWithNoTooltip]补给的许可。接下来发生的事情确实离奇，[expedition_initiator.GetAdjectiveWithNoTooltip]的水手们与当地的小吏接触，在慷慨地赠送了大量礼物之后，他们要求与[ROOT.GetCountry.GetGovernment.GetRulerTitle]会面。"
 treasure_fleet_events.5.a: "欢迎他们到访[ROOT.GetCountry.GetGovernment.GetCourtTitle]！"
 treasure_fleet_events.5.a.entry: "欢迎他们入朝觐见！"
 treasure_fleet_events.6.title: "觐见[ROOT.GetCountry.GetGovernment.GetRulerTitle]"
 treasure_fleet_events.6.desc: "$expedition_leader_name$及其使团终于觐见了我们英明的[ROOT.GetCountry.GetGovernment.GetRulerTitle]。他们庞大的舰队与丰厚的贡礼令举国震撼，因此当$expedition_leader_name_herhis$提出在[expedition_initiator.GetAdjective]治下建立[ShowSubjectTypeName('tributary')]关系时我们都感到十分意外。但经过慎重考虑，我们认为接受这样一个强大国家的保护，其收益远胜表面上的臣属之屈辱。"
 treasure_fleet_events.6.a: "臣服是友谊的高级形式。"
 treasure_fleet_events.6.b: "我们不会叩首纳贡！"
 chinese_expedition_resolution_tt: "未来数月，中国的$expedition_name_treasure_voyage$将停泊在我方港口[target_stop.GetName]。我们将获得[events|e]与其互动，从而影响他们对我们的评价。待停泊结束时，根据他们的评价，我们将得到不同结果：\n\n恭顺（#y 67#!~#y 100#!）：\n[ShowScriptedEffectForScope('chi_expedition_resolution_very_positive', ROOT.GetCountry.MakeScope.Self)]\n友善（#y 33#!~#y 66#!）：\n[ShowScriptedEffectForScope('chi_expedition_resolution_positive', ROOT.GetCountry.MakeScope.Self)]\n冷淡（#y -32#!~#y 32#!）：\n$NOTHING_HAPPENS_EFFECT$\n轻蔑（#y -66#!~#y -33#!）：\n[ShowScriptedEffectForScope('chi_expedition_resolution_negative', ROOT.GetCountry.MakeScope.Self)]\n傲慢（#y -100#!~#y -67#!）：\n[ShowScriptedEffectForScope('chi_expedition_resolution_very_negative', ROOT.GetCountry.MakeScope.Self)]"
 treasure_fleet_events.7.title: "回赠厚礼"
 treasure_fleet_events.7.desc: "随着[expedition_initiator.GetName]使团在[ROOT.GetCountry.GetName]的使命圆满完成，其宝船舰队目前正在补充物资，预计数月内即将再次启航。依照外交礼节，我国应当回赠[ROOT.GetCountry.GetFlavorRank]最珍贵的礼物，以此巩固双方建立的[ShowSubjectTypeName('tributary')]关系。"
 treasure_fleet_events.7.a: "回赠厚礼。"
 treasure_fleet_events.7.gift: "奉上我们的特产。"
 treasure_fleet_events.7.b: "我们负担不起……"
 treasure_fleet_events.8.title: "宝船舰队离港启程"
 treasure_fleet_events.8.desc: "[expedition_initiator.GetAdjective]的宝船舰队终于从[target_stop.GetName]扬帆起航。我邦以国宾之礼盛情款待，祈愿其航程顺遂，满载而归。"
 treasure_fleet_events.8.a: "一路顺风！"
 chi_fleet_will_depart: "[expedition_initiator.GetAdjective]使团将自[ROOT.GetCountry.GetName]离境"
 chinese_expedition_opinion: "宝船队的信任"
 based_on_expedition_opinion: "基于$chinese_expedition_opinion$（当前数值：[ROOT.GetVariable('chinese_expedition_opinion').GetValue]），以下会发生："
 treasure_fleet_events.9.title: "$expedition_name_treasure_voyage$归航"
 treasure_fleet_events.9.desc: "我国多年前派遣至[ROOT.GetVariable('chinese_treasure_target_location').GetLocation.GetName]的宝船舰队，如今已顺利抵达目的地，即将开始返程。使团不仅满载异域奇珍，更携各国使节随行。$expedition_leader_name$正率领这支满载荣耀的队伍，带着丰厚贡品与各国使节，向首都进发。"
 treasure_fleet_events.9.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 treasure_fleet_events.9.a.entry: "$common_string_brilliant$"
 treasure_fleet_events.10.title: "[ROOT.GetCountry.GetGovernment.GetRulerTitle]接见各国贡使"
 treasure_fleet_events.10.desc: "$expedition_leader_name$凯旋归朝，荣归[ROOT.GetCountry.GetCapital.GetName]，沿途百姓夹道相迎，欢呼雀跃。使团携诸国使节同至，皆愿向[ROOT.GetCountry.GetGovernment.GetRulerTitle]朝贡称臣。此番万邦来朝，实乃彰显我朝昌明盛世之气象。"
 treasure_fleet_events.10.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 treasure_fleet_events.10.a.entry: "$common_string_brilliant$"
 treasure_fleet_events.11.title: "下西洋告一段落"
 treasure_fleet_events.11.desc: "$expedition_name_treasure_voyage$终于告一段落。现在，是时候评估这次行动的投入是否物有所值，并权衡未来是否值得再次组织类似的远航——毕竟这类行动耗费巨大。"
 treasure_fleet_events.11.a: "我们还想航行至更远的地方。"
 chi_we_will_gift_cloves: "我们将赠予[expedition_initiator.GetName]一份[ShowGoodsName('cloves')]。"
 chi_we_will_gift_giraffe: "我们将赠予[expedition_initiator.GetName]一头长颈鹿。"
 chi_we_will_gift_persian_blue: "我们将赠予[expedition_initiator.GetName]一份本地[ShowGoodsName('dyes')]。"
 treasure_fleet_events.12.title: "异域野兽"
 treasure_fleet_events.12.desc: "我们的$expedition_name_treasure_voyage$带回了一头真正罕见而卓绝的生物，献给[ROOT.GetCountry.GetGovernment.GetRulerTitle]的[ROOT.GetCountry.GetGovernment.GetCourtTitle]。它体型高大，脖颈修长，满身暗斑，被海外称作“长颈鹿”。然而，我们的朝臣却将其视作[ShowCultureGroupName('chinese_group')]传说中的#italic 麒麟#!，象征着贤明君主即将开启的盛世。我们或可顺势采纳此说，提升声望，但也会提高外界对我们的期待。"
 treasure_fleet_events.12.a: "这是神兽#italic 麒麟#!！"
 treasure_fleet_events.12.b: "的确是一头奇妙的生物。"
 treasure_fleet_events.13.title: "奇彩之色"
 treasure_fleet_events.13.desc: "我们的远航从[ShowSubContinentName('middle_east')]带回了一种异域染料。这种深邃的蓝色，被认定是制作我们著名[ShowGoodsName('pottery')]的绝佳原料。我们带回了足够的[ShowGoodsName('dyes')]可用于生产。"
 treasure_fleet_events.13.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 treasure_fleet_events.13.a.entry: "$common_string_brilliant$"
 treasure_fleet_events.14.title: "难忘的滋味"
 treasure_fleet_events.14.desc: "[ShowRegionName('indonesia_region')]素以香料闻名，而我们的$expedition_name_treasure_voyage$造访了盛产上佳[ShowGoodsName('cloves')]的[ShowAreaName('moluccas_area')]。当地居民热情款待了我们，并进贡大量这种奇妙的香料。未来数月，[ROOT.GetCountry.GetGovernment.GetCourtTitle]与[ROOT.GetCountry.GetGovernment.GetRulerTitle]都将得以细细品味。"
 treasure_fleet_events.14.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 treasure_fleet_events.14.a.entry: "$common_string_brilliant$"
 treasure_fleet_events.15.title: "捕获逃犯"
 treasure_fleet_events.15.desc: "在$expedition_name_treasure_voyage$航行期间，$expedition_leader_name$与$expedition_leader_name_herhis$忠诚的水手们成功追捕了一名重要叛逃者[extradited_character.GetName]。[extradited_character.GetShortNameWithNoTooltip]早年逃离[ROOT.GetCountry.GetName]，躲避正义的制裁。然则，此次远航不仅找到了[extradited_character.GetHerHim]，还从[extradited_character.GetHerHis]的[asylum_country.GetName]庇护者手中将[extradited_character.GetHerHim]夺回，押送回$china$伏法。"
 treasure_fleet_events.15.a: "绞死这卑微罪犯！"
 treasure_fleet_events.15.b: "将[extradited_character.GetHerHim]斩首示众。"
 treasure_fleet_events.15.b.entry: "将他斩首。"
 treasure_fleet_events.15.c: "执行#italic 凌迟#!，慢慢片。"
 treasure_fleet_events.15.d: "赦免此人，也许[extradited_character.GetHerHis]的才能仍有可用之处。"
 treasure_fleet_events.15.d.entry: "赦免此人，也许他的才能仍有可用之处。"
 treasure_fleet_events.16.title: "处决[executed_character.GetNameWithNoTooltip]"
 treasure_fleet_events.16.desc: "[executed_character.GetName]原籍[executed_character.GetBirthLocation.GetArea.GetName]，在[ShowPolicyName('haijin_policy')]推行后，[executed_character.GetHerHis]的家族转而成为海盗。[executed_character.GetShortNameWithNoTooltip]逃亡后，于[loser_country.GetName]成为海盗首领，并率众与$expedition_leader_name$在该[loser_country.GetFlavorRank]的海岸交战。如今，是时候以[executed_character.GetNameWithNoTooltip]为例，彰显法纪了。"
 treasure_fleet_events.16.a: "正义得以伸张。"
 treasure_fleet_events.17.title: "不服王化的统治者"
 treasure_fleet_events.17.desc: "在$expedition_name_treasure_voyage$远航期间，$expedition_leader_name$率领的舰队俘获了一位重要囚犯——[loser_character.GetName]。[loser_character.GetName]本是[loser_country.GetLongName]的[loser_country.GetGovernment.GetRulerTitle]，但[loser_country.GetNameWithNoTooltip]对舰队的背叛与无礼导致[loser_character.GetHerHim]迅速战败，并沦为俘虏。"
 treasure_fleet_events.17.a: "处决[loser_character.GetHerHim]，以儆效尤。"
 treasure_fleet_events.17.a.entry: "杀一儆百。"
 treasure_fleet_events.17.b: "展示仁慈。"
 treasure_fleet_events.18.title: "[loser_country.GetNameWithNoTooltip]的命运"
 treasure_fleet_events.18.desc: "[loser_country.GetName]的愚蠢统治者公然违抗了[GetInternationalOrganization('middle_kingdom').GetName]的旨意，结果在与$expedition_leader_name$的冲突中惨败。现在我们扶持了一个临时[loser_country.GetGovernment.GetRulerTitle]治理[loser_country.GetLongNameWithNoTooltip]，之后该如何处置？"
 treasure_fleet_events.18.a: "派遣[target_character_for_viceroyalty.GetNameWithNoTooltip]作为总督统治该地。"
 treasure_fleet_events.18.a.entry: "派他出任总督。"
 treasure_fleet_events.18.b: "维持当地傀儡政权。"
 treasure_fleet_events.19.title: "来自[expedition_initiator.GetNameWithNoTooltip]的总督"
 treasure_fleet_events.19.desc: "我们收到[GetInternationalOrganization('middle_kingdom').GetName]的消息。他们已任命[target_character_for_viceroyalty.GetName]为我们的总督，把我们作为[ShowSubjectTypeName('tributary')]进行统治。这就是我们的命运，沦为战败之国，被敌人统治。"
 treasure_fleet_events.19.a: "终有一日，我们必将掀翻这等枷锁。"
 treasure_fleet_events.20.title: "来自远方的礼物"
 treasure_fleet_events.20.desc: "在远航期间，我们的水手获赠许多地方特产，并将它们带回$china$。这些东西价值有限，但足以彰显[GetInternationalOrganization('middle_kingdom').GetName]的气象，并将在未来多年提升我们的威望。"
 treasure_fleet_events.20.a: "不出我们所料。"
 treasure_fleet_events.21.title: "[target.GetNameWithNoTooltip]离世"
 treasure_fleet_events.21.desc: "噩耗传来，我们的$expedition_name_treasure_voyage$领袖$expedition_leader_name$，在旅途中不幸身亡。副手[new_leader.GetName]已接掌指挥，今后他必须独自带领远航船队继续前行。"
 treasure_fleet_events.21.a: "但愿这不是厄运的先兆。"
 chi_new_expedition_leader: "[new_leader.GetName]成为$expedition_name_treasure_voyage$的新领袖。"
 treasure_fleet_events.22.title: "经费不足"
 treasure_fleet_events.22.desc: "我们得到消息，$expedition_name_treasure_voyage$ 用于外交往来的礼物已所剩无几。若无合适的礼物可赠，船队在余下的航程中将不再于外国港口作礼节性访问。或许下次我们应为远航拨付更为充足的资金。"
 treasure_fleet_events.22.a: "实在有失体统。"
 chi_expedition_is_returning_to_china: "The $expedition_name_treasure_voyage$ has run out of gifts and will no longer call at foreign ports for the rest of the voyage."
 show_current_chinese_expedition_amount: "[COUNTRY.MakeScope.GetVariable('chinese_expedition_opinion').GetValue]"
 change_amount_of_treasure_voyage_tt: "$expedition_name_treasure_voyage$所载货物量增加$VALUE|+$"
 change_amount_of_treasure_voyage_tt_neg: "The amount of cargo carried by $expedition_name_treasure_voyage$ is decreased by $VALUE|-$。"
 change_opinion_of_expedition: "$chinese_expedition_opinion$提升$VALUE|0Y$。（当前：$show_current_chinese_expedition_amount$）"
 change_opinion_of_expedition_neg: "$chinese_expedition_opinion$降低$VALUE|0Y$。（当前：$show_current_chinese_expedition_amount$）"
 give_gold_to_expedition: "$VALUE|2Y$将被赠与$expedition_name_treasure_voyage$。"
 chi_gift_received_count: "我们已获得[ROOT.GetVariable('gifts_received').GetValue|2+=][gold|e]，转换为："
 treasure_fleet_events.23.title: "宝船队遭遇风暴"
 treasure_fleet_events.23.desc: "在航行途中，我们最伟大的宝船队在航行时遇到了一个最为棘手的敌人：正是以巨大风暴之形出现的自然之力。即便是我们经验最为丰富的水手，也在这场灾难中措手不及。许多船只在浩劫中沉没，连同我们大量的赠礼与货物一并丧失。"
 treasure_fleet_events.23.a: "我们无能为力。"
 treasure_fleet_events.23.a.entry: "$common_string_nothing_we_can_do_about_it$"
 treasure_fleet_events.24.title: "与海盗舰队交锋"
 treasure_fleet_events.24.desc: "在驶过[target_location.GetName]的[target_location.GetTopography.GetName]时，我们光荣的宝船队在$expedition_leader_name$的注视下遭遇了一支无赖海盗的卑鄙舰队。当然，我们英勇的士兵绝不会畏惧，立即与敌人展开了决定性的战斗，将这些暴徒彻底击败，并俘获了他们的首领。然而，这场战斗并非没有代价，我们损失了许多士兵和船只，使得船队在资源上受到了严重削弱。"
 treasure_fleet_events.24.a: "这将为我们赢得一些赞赏。"
 treasure_fleet_events.25.title: "远方的帆影"
 treasure_fleet_events.25.desc: "Lookouts hail a sail on the horizon: a merchant fleet, richly laden, plying the same waters as our own. $expedition_leader_name$ orders our captains to greet them in peace, and a brisk exchange follows: bolts of silk and fine porcelain traded for spices, gemstones, and rarities of the southern seas.\n\nThe holds of the $expedition_name_treasure_voyage$ ride heavier than before."
 treasure_fleet_events.25.a: "顺风得利，两全其美。"
 treasure_fleet_events.30.title: "宫廷盛宴"
 treasure_fleet_events.30.desc: "While the fleet lies at anchor off [target_stop.GetName], the local court hosts a great banquet in honor of the $expedition_name_treasure_voyage$. Musicians, dancers, and dishes of a hundred kinds are laid before $expedition_leader_name$ and the captains, who present the customary gifts and speak of the greatness of the [GetInternationalOrganization('middle_kingdom').GetName].\n\nWord of the fleet's splendid conduct abroad will surely reach home."
 treasure_fleet_events.30.a: "让他们见识我朝的辉煌。"
 treasure_fleet_events.31.title: "Curios for the Emperor"
 treasure_fleet_events.31.desc: "The markets of [target_stop.GetName] overflow with wonders unknown in our lands: caged birds of impossible color, strange beasts, aromatic woods, and jewels cut in foreign fashion. The merchants of the $expedition_name_treasure_voyage$ could fill a hold with curiosities fit to delight the [ROOT.GetCountry.GetGovernment.GetRulerTitle], though it would mean parting with a portion of the gold set aside for gifts.\n\nShall we open the coffers?"
 treasure_fleet_events.31.a: "购下市集中最上乘之物。"
 treasure_fleet_events.31.b: "黄金还是留作贡礼为好。"
 treasure_fleet_events.26.title: "统御之试"
 treasure_fleet_events.26.desc: "茫茫大海与未明的航图，令$expedition_name_treasure_voyage$的众官员争执不下。有人力劝$expedition_leader_name$持稳妥之道而行，亦有人主张更为迅捷却冒险的航路。众人目光皆汇聚于提督身上，此刻$expedition_leader_name_herhis$如何行使号令，必将为后世所铭记。"
 treasure_fleet_events.26.a: "持稳妥有序之道而行。"
 treasure_fleet_events.26.b: "冒险一试更迅捷的航路。"
 treasure_fleet_events.27.title: "深海奇观"
 treasure_fleet_events.27.desc: "一昼一夜之间，船队与一头庞然巨兽同行，其脊背破浪而行，宛如移动的岛屿。$expedition_name_treasure_voyage$ 的史官们奋笔疾书，记下此番景象，水手们皆视之为大吉之兆。待船队归航，此番奇观定会传遍每一处茶楼酒肆。"
 treasure_fleet_events.27.a: "令朝廷惊叹的奇珍。"
 treasure_fleet_events.28.title: "天现异象"
 treasure_fleet_events.28.desc: "船队的天文官们注意到一道奇异的光芒划过夜空，便伏案钻研星图，欲解其中玄机。无论其真实性质为何，水手们皆将此天象视为上苍的启示，一片肃穆笼罩了 $expedition_name_treasure_voyage$ 的甲板。"
 treasure_fleet_events.28.a: "留意上天的预示。"
 treasure_fleet_events.29.title: "无风停航"
 treasure_fleet_events.29.desc: "风渐渐止息，$expedition_name_treasure_voyage$ 的巨舰静静停在如镜的海面上。日复一日，船帆无力地垂着，$expedition_leader_name$ 与众军官除了等待、眺望天际盼来一丝风息，别无他法。此番航程恐将因此延宕。"
 treasure_fleet_events.29.a: "等待风起。"
 treasure_fleet_events.32.title: "码头大火"
 treasure_fleet_events.32.desc: "A fire breaks out among the crowded warehouses of [target_stop.GetName], where a portion of the fleet's goods lay in storage. The sailors of the $expedition_name_treasure_voyage$ join the bucket lines, but not before the flames claim crates of silk and porcelain set aside as gifts."
 treasure_fleet_events.32.a: "代价惨重的一夜。"
 treasure_fleet_events.33.title: "当地领航员"
 treasure_fleet_events.33.desc: "一位饱经风霜、熟知这片海域暗礁与洋流的 [target_stop.GetName] 水手，主动请缨为 $expedition_name_treasure_voyage$ 指引前路。$expedition_leader_name$ 正踌躇是否要将船队的航向托付于一位异邦之人。"
 treasure_fleet_events.33.a: "欢迎他的见识登船相助。"
 treasure_fleet_events.33.b: "我们自己的领航员已经足够。"
 treasure_fleet_events.34.title: "献给提督的礼物"
 treasure_fleet_events.34.desc: "船队正准备在[target_stop.GetName]启锚之际，当地朝廷向$expedition_leader_name$献上一份珍贵的临别厚礼，以表敬意，望[GetInternationalOrganization('middle_kingdom').GetName]能将其带回呈献给[ROOT.GetCountry.GetGovernment.GetRulerTitle]。"
 treasure_fleet_events.34.a: "为贡品增添了一份佳品。"
 treasure_fleet_events.35.title: "寻找翻译"
 treasure_fleet_events.35.desc: "远离故土的[ShowCultureGroupName('chinese_group')]宝藏远征代表团，在与我们高效交流时遇到了巨大的困难。但他们依旧计划继续远航，不久之后将会遇到更多他们从未接触过的文化与人群。为了顺利继续他们的航程，他们请求我们为其提供一名本地翻译。"
 treasure_fleet_events.35.a: "立刻找一个翻译！"
 treasure_fleet_events.35.b: "这是他们的问题，不是我们的。"
 treasure_fleet_events.36.title: "分享地图"
 treasure_fleet_events.36.desc: "$expedition_name_treasure_voyage$请求我们与他们分享当地水路的地图。我们没有义务这样做，但若是满足他们的请求，将被视为善意之举，$expedition_leader_name$以及驻扎在$expedition_location_name$的其他[ShowCultureGroupName('chinese_group')]精英们会深表感激。"
 treasure_fleet_events.36.a: "分享我们现有的地图。"
 treasure_fleet_events.36.b: "我们没有可分享的地图。"
 treasure_fleet_events.37.title: "宰客"
 treasure_fleet_events.37.desc: "由于$expedition_name_treasure_voyage$水手对当地不熟悉，本地的[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]在$expedition_location_name$港口附近设立了市场，向来访者出售本地货物。然而，部分贪婪的商人趁水手们急需物资的机会，将价格哄抬至极其高昂的地步。在某些地方，价格高到甚至引发了街头械斗，导致[fleet_loc.GetRank.GetName]出现骚乱。"
 treasure_fleet_events.37.a: "惩罚[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')]！"
 treasure_fleet_events.37.a.entry: "惩治$burghers_estate$！"
 treasure_fleet_events.37.b: "追究水手的责任。"
 treasure_fleet_events.38.title: "蒙羞"
 treasure_fleet_events.38.desc: "我们的[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]对我们给予$expedition_name_treasure_voyage$的关注极为不满。他们将[ShowCultureGroupName('chinese_group')]视为傲慢的入侵者，不配得到我们给予的款待和特权。因此，[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]要求我们收回部分特权，让他们明白这里并不是他们的土地。"
 treasure_fleet_events.38.a: "满足[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]的要求。"
 treasure_fleet_events.38.a.entry: "依从$nobles_estate$的请求。"
 treasure_fleet_events.38.b: "我们不能冒犯$china$人。"
 treasure_fleet_events.39.title: "宗教上的失礼"
 treasure_fleet_events.39.desc: "$china$宝船队的水手们由于不熟悉我们的[ROOT.GetCountry.GetReligion.GetAdjective]传统，犯下了亵渎我们信仰的行为。这一举动激起了[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]的强烈愤怒，他们要求宝船队领袖$expedition_leader_name$为此无礼行为出面道歉。"
 treasure_fleet_events.39.a: "要求$expedition_leader_name_tooltipless$道歉。"
 treasure_fleet_events.39.b: "对此失礼不予追究。"
 treasure_fleet_events.40.title: "引渡要求"
 treasure_fleet_events.40.desc: "$expedition_leader_name$认定我们的一位廷臣[target_escapee.GetName]，其实是从[expedition_initiator.GetName]逃亡出来的叛逃者。$expedition_name_treasure_voyage$的$china$远征精英要求我们交出[target_escapee.GetShortNameWithNoTooltip]，将他引渡回[GetInternationalOrganization('middle_kingdom').GetName]接受审判。"
 treasure_fleet_events.40.a: "满足他们的请求。"
 treasure_fleet_events.40.b: "荒谬的要求！"
 treasure_fleet_events.41.title: "联合操练"
 treasure_fleet_events.41.desc: "在他们的长期逗留期间，$expedition_name_chinese_expedition$的领袖$expedition_leader_name$提出让他们的军队与我们的军队进行联合操练。这样的操练对双方都有益，且能显示双方深厚的互信。但我们也必须谨慎，因为与外国士兵演习仍存在潜在风险。距离$expedition_location_name$最近的驻军是[target_unit.GetName]，将成为与中国人联合训练的部队。"
 treasure_fleet_events.41.a: "接受提议。"
 treasure_fleet_events.41.b: "我们无需顺着他们。"
 treasure_fleet_events.42.title: "$china$人的援助提议"
 treasure_fleet_events.42.desc: "当$china$$expedition_name_treasure_voyage$抵达$expedition_location_name$时，他们没有想到会看见[ROOT.GetCountry.GetLongName]正陷于一场血腥的战争之中。然而，[expedition_initiator.GetLongName]对我们的敌人并不看重，因此愿意协助我们对抗敌人。"
 treasure_fleet_events.42.a: "我们将接受一切援助。"
 treasure_fleet_events.42.b: "这是我们的战争，不是他们的。"
 treasure_fleet_events.43.title: "$china$宝船队援助[from.GetNameWithNoTooltip]"
 treasure_fleet_events.43.desc: "我们的间谍报告称，一支由$expedition_leader_name$率领的大规模$expedition_name_treasure_voyage$在[expedition_initiator.GetLongName]的发起下，抵达敌方港口$expedition_location_name$，并决定直接介入，支持我们的敌人[from.GetName]与我们作战！"
 treasure_fleet_events.43.a: "我们绝不会原谅$china$人！"
 treasure_fleet_events.44.title: "清真寺修建请求"
 treasure_fleet_events.44.desc: "$expedition_name_chinese_expedition$的领袖，一名叫$expedition_leader_name$的水手，同时也是[target_religion.GetName]的虔诚信徒。由于$expedition_leader_name_herhis$麾下的许多舰队成员也信奉同一宗教，他们请求允许修建一座清真寺，以支持当地的[target_religion.GetAdjectiveWithNoTooltip]社群。"
 treasure_fleet_events.44.a: "允许建造。"
 treasure_fleet_events.44.b: "警告他们不要越界。"
 treasure_fleet_events.45.title: "[ShowCultureGroupNameWithNoTooltip('chinese_group')]侨民在$expedition_location_name_tooltipless$"
 treasure_fleet_events.45.desc: "$expedition_location_name$居住着相当数量的[ShowCultureGroupName('chinese_group')]侨民，他们在数十年间逐渐形成了群体。最初作为商人到来，这些$china$商人与本地女子通婚并定居下来，适应了新的环境，并在我们的社会中扮演着关键角色。如今，随着[expedition_initiator.GetName]的$expedition_name_treasure_voyage$抵达，$expedition_leader_name$决定对该侨民群体给予支持。"
 treasure_fleet_events.45.a: "鼓励此举。"
 treasure_fleet_events.45.b: "阻止他们！"
 treasure_fleet_events.46.title: "定居他乡的士兵"
 treasure_fleet_events.46.desc: "来自$expedition_name_chinese_expedition$的一些士兵已经退役，被允许在$expedition_location_name$定居。他们娶了当地的妻子，而这些人脉关系可能在长期对我们有所裨益。"
 treasure_fleet_events.46.a: "[ROOT.GetCountry.Custom('common_string_ok')]"
 treasure_fleet_events.46.a.entry: "$common_string_alright$"
 treasure_fleet_events.47.title: "来自$expedition_name_treasure_voyage$的干预"
 treasure_fleet_events.47.desc: "当$expedition_name_chinese_expedition$抵达$expedition_location_name$时，他们发现我们的[ROOT.GetCountry.GetFlavorRank]正深陷血腥的内战。虽然这种局势通常会吓退大多数访客，但$expedition_leader_name$和$expedition_leader_name_herhis$的$expedition_name_treasure_voyage$却对[ROOT.GetCountry.GetAdjective]的事业产生了好感，并以[GetInternationalOrganization('middle_kingdom').GetName]的名义向我们提供军事援助。"
 treasure_fleet_events.47.a: "我们会接受一切援助。"
 treasure_fleet_events.47.b: "我们不需要他们的帮助。"
 treasure_fleet_events.48.title: "$treasure_fleet_events.47.title$"
 treasure_fleet_events.48.desc: "卑鄙的$expedition_name_chinese_expedition$竟然决定不在我们的[target_war.GetName]中保持中立。而尽管$expedition_leader_name$身为他们的领袖素有智慧，他们还是做出了错误的选择，选择支持[country_at_war_with.GetName]而不是援助[ROOT.GetCountry.GetName]。我们将在战场上粉碎他们。"
 treasure_fleet_events.48.a: "我们绝不会忘记这件事！"
 treasure_fleet_events.49.title: "$china$人的蔑视"
 treasure_fleet_events.49.desc: "[ROOT.GetCountry.GetName]与来访的$expedition_name_treasure_voyage$之间的关系跌至前所未有的低点。近些天，我们的驻军与外国水手间已发生多次冲突，尽管如此我们的访客仍然维持着表面上的关系，即便冷淡。然而，最近的事件让这些联系进一步恶化，$expedition_leader_name$刚刚公开谴责[ROOT.GetCountry.GetLongNameWithNoTooltip]及其价值观，而$expedition_name_chinese_expedition$正准备在紧张局势进一步升级之前离开$expedition_location_name$。"
 treasure_fleet_events.49.a: "我们必须修复关系。"
 treasure_fleet_events.49.b: "走得好！"
 chinese_interregnum: "[THIS.GetCountry.GetName]将进入脱离$china$人控制的时期。"
 treasure_fleet_events.50.title: "好战的请求"
 treasure_fleet_events.50.desc: "$expedition_name_treasure_voyage$领袖$expedition_leader_name$郑重要求我们对[target_country.GetName]进行军事干预。据我们所知，出于某种原因，[target_country.GetAdjectiveWithNoTooltip][target_country.GetFlavorRank]已经成为$china$的目标，而宝船队的领袖们正呼吁我们对这个挑衅的[target_country.GetGovernment.GetRulerTitle]施以天谴。"
 treasure_fleet_events.50.a: "我们将遵循他们的建议。"
 treasure_fleet_events.50.b: "他们不能指望我们会那样做。"
 treasure_fleet_events.51.title: "令人失望的贡品质量"
 treasure_fleet_events.51.desc: "尽管他们没有公开表示，但我们能看出$expedition_name_treasure_voyage$上层对我们的礼物并不满意。我们早在他们觐见[ROOT.GetCountry.GetGovernment.GetRulerTitle]时就有这种怀疑，而我们的间谍窃听到他们的对话后证实了这一点。"
 treasure_fleet_events.51.a: "补偿他们。"
 treasure_fleet_events.51.b: "除非他们当面质问，否则我们不会采取任何行动。"
 treasure_fleet_events.52.title: "[ROOT.GetCountry.GetGovernment.GetCourtTitle]丑闻"
 treasure_fleet_events.52.desc: "在觐见 [ROOT.GetCountry.GetGovernment.GetRulerTitle] 期间，[ROOT.GetCountry.GetGovernment.GetCourtTitle] 中的一员对我方 [ShowCultureGroupName('chinese_group')] 访客口出恶言，令其深感冒犯。若不采取行动，$expedition_name_treasure_voyage$ 恐将此事上报 [expedition_initiator.GetGovernment.GetRulerTitle]。"
 treasure_fleet_events.52.a: "郑重道歉。"
 treasure_fleet_events.52.b: "赠送赔礼。"
 treasure_fleet_events.52.c: "我们怎能惩罚自己人？"
 treasure_fleet_events.53.title: "优待"
 treasure_fleet_events.53.desc: "$expedition_name_treasure_voyage$的精英们对我们给予他们的款待和各种特权感到十分满意。除了例行的贡品交换，我们还允许并协助他们修缮船只。尽管他们没有直接表现出来，但我们清楚他们对这次款待十分满意。"
 treasure_fleet_events.53.a: "热情好客是重中之重！"
 treasure_fleet_events.53.b: "不要让他们产生误解。"
 treasure_fleet_events.54.title: "对我使团的侮辱"
 treasure_fleet_events.54.desc: "Word reaches the [ROOT.GetCountry.GetGovernment.GetCourtTitle] that at the court of [insulting_court.GetName], the envoys of the $expedition_name_treasure_voyage$ were met not with the deference owed the [GetInternationalOrganization('middle_kingdom').GetName], but with open scorn — and [insulting_court.GetGovernment.GetRulerTitle] let the insult stand.\n\n$expedition_leader_name$ awaits our word. Shall such contempt be answered, or is it beneath us to take notice?"
 treasure_fleet_events.54.a: "此等蔑视，绝不可容忍。"
 treasure_fleet_events.54.b: "此事不足挂齿，无需理会。"
 treasure_fleet_events.54.a.tt: "日后$expedition_name_treasure_voyage$造访的邻近[nations|e]，将有机会在我方支持下对[insulting_court.GetName]宣[war|e]"
 treasure_fleet_events.55.title: "身陷异邦纷争"
 treasure_fleet_events.55.desc: "Dispatches from the [ROOT.GetCountry.GetGovernment.GetCourtTitle] carry unexpected news. Far from home, $expedition_leader_name$ has thrown the arms and treasure of the $expedition_name_treasure_voyage$ behind the ruler of [country_at_war_with.GetName], a realm now torn by a war of succession.\n\nSome at [ROOT.GetCountry.GetGovernment.GetCourtTitle] marvel at how far the reach of the [GetInternationalOrganization('middle_kingdom').GetName] now extends. Others mutter that the quarrels of distant realms are no fit business of ours."
 treasure_fleet_events.55.a: "让世人见识我们的势力所及之远。"
 treasure_fleet_events.55.b: "远方战事，与我等无关。"
 treasure_fleet_events.56.title: "异邦亮出的刀剑"
 treasure_fleet_events.56.desc: "Word comes from the $expedition_name_treasure_voyage$ that $expedition_leader_name$ has lent imperial soldiers to a host court's war. [target_country.GetName], who found our men arrayed against them, now number the [GetInternationalOrganization('middle_kingdom').GetName] among their foes.\n\nThe [ROOT.GetCountry.GetGovernment.GetCourtTitle] is divided. To some it is proof that the reach of the throne now extends even to the far side of the world. To others it is a needless enemy earned in a war that was never ours."
 treasure_fleet_events.56.a: "让他们见识我们势力的可畏。"
 treasure_fleet_events.56.b: "远离本土树此强敌，于我等不利。"
 treasure_fleet_events.57.title: "遭蔑视的回绝"
 treasure_fleet_events.57.desc: "Grave news reaches the [ROOT.GetCountry.GetGovernment.GetCourtTitle]. At the court of [contemptuous_court.GetName], the envoys of the $expedition_name_treasure_voyage$ were met with such open contempt that $expedition_leader_name$ weighed anchor and quit their waters, the customary courtesies flung back in our faces.\n\nThe fleet's chronicler has entered [contemptuous_court.GetNameWithNoTooltip] in its ledger of those who have wronged the [GetInternationalOrganization('middle_kingdom').GetName]. Shall the affront be remembered, or forgiven?"
 treasure_fleet_events.57.a: "这份羞辱将被铭记于心。"
 treasure_fleet_events.57.b: "我们不该纠缠于这种怨恨。"
 treasure_fleet_events.57.a.tt: "日后 $expedition_name_treasure_voyage$ 造访的邻邦宫廷，或将被要求对 [contemptuous_court.GetName] 宣布 [war|e]"
 treasure_fleet_events.58.title: "雪耻之战"
 treasure_fleet_events.58.desc: "Word of triumph reaches the [ROOT.GetCountry.GetGovernment.GetCourtTitle]. Stirred by the presence of the $expedition_name_treasure_voyage$, the court of [avenging_court.GetName] has taken up arms against [target_country.GetName], the very realm that once held our envoys in contempt.\n\nHeaven's displeasure, it seems, needs no imperial army to make itself felt. The reach of the [GetInternationalOrganization('middle_kingdom').GetName] carries even into the wars of distant kings."
 treasure_fleet_events.58.a: "让所有轻慢我们的人引以为戒。"
 treasure_fleet_events.59.title: "海外的同族"
 treasure_fleet_events.59.desc: "Reports reach the [ROOT.GetCountry.GetGovernment.GetCourtTitle] of a flourishing community of our countrymen in far-off [diaspora_port.GetName]. Merchants and sailors who settled there generations ago have taken local wives and prospered, and now $expedition_leader_name$ has extended the hand of the $expedition_name_treasure_voyage$ to these distant kin.\n\nSome at [ROOT.GetCountry.GetGovernment.GetCourtTitle] swell with pride that the blood of the [GetInternationalOrganization('middle_kingdom').GetName] runs in every port of the southern seas. Others frown upon subjects who would make their home so far from the graves of their ancestors."
 treasure_fleet_events.59.a: "让我们海外的同族骄傲地传扬我们的名号。"
 treasure_fleet_events.59.b: "他们的归处应是故土，与祖先同在。"
 treasure_fleet_events.60.title: "使者的失礼"
 treasure_fleet_events.60.desc: "Word reaches the [ROOT.GetCountry.GetGovernment.GetCourtTitle] of an unhappy incident at the court of [offended_court.GetName]. $expedition_leader_name$, unversed in the rites of a foreign faith, has given grave offense, and the [offended_court.GetGovernment.GetRulerTitle] now demands that our envoy make amends.\n\nThe [ROOT.GetCountry.GetGovernment.GetCourtTitle] is of two minds. Some hold that the envoys of the [GetInternationalOrganization('middle_kingdom').GetName] owe no deference to foreign altars. Others fear that such carelessness sullies our name in every port yet to come."
 treasure_fleet_events.60.a: "我们的使者绝不向异邦神坛俯首。"
 treasure_fleet_events.60.b: "提督将做出补偿。"
 treasure_fleet_events.1.zheng_he_owned_tt: "郑和现在必须为我国效力"
 treasure_fleet_events.7.desc_no_tributary: "$treasure_fleet_events.7.desc_shared$，以谢其来访。"
 treasure_fleet_events.7.desc_shared: "在 [ROOT.GetCountry.GetName] 的使命完成之后，[expedition_initiator.GetName] 的宝船船队正在补充给养，预计将在数月内启程离开。按照惯例，理应以我 [ROOT.GetCountry.GetFlavorRank] 所能提供的最好之物作为答谢，赠予他们"
