 pilgrimage_expedition_events.9.a: "我们将为此哀悼。"
 pilgrimage_expedition_events.9.desc: "[target_leader.GetName] 已死于途中，朝圣之旅至此未能完成。噩耗将缓缓传回 [ROOT.GetCountry.GetName]，由那些一直陪伴在 [target_leader.GetHerHis] 身侧直至最后的随从带回家中。"
 pilgrimage_expedition_events.9.title: "朝圣之旅以悲哀告终"
