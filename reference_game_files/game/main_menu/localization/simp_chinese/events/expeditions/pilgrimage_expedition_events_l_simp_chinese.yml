 pilgrimage_expedition_events.3.e: "$pilgrimage_resupply_heavy$"
 pilgrimage_expedition_events.30.a: "支付所要求的赎金。"
 pilgrimage_expedition_events.30.b: "试图趁着夜色掩护悄然溜走。"
 pilgrimage_expedition_events.30.title: "被勒索赎金"
