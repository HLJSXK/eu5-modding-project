l_simp_chinese:
 mercs.1.title: "[SCOPE.sMercenary('patriotic_mercs').GetName]的普遍不满"
 mercs.1.desc: "不少[SCOPE.sMercenary('patriotic_mercs').GetName]成员对贫弱的祖国[SCOPE.sCountry('merc_home_country').GetName]产生了不合时宜的眷恋。眼看故土即将陷入战火，恐惧驱使着相当一部分人临阵脱逃。"
 mercs.1.a: "他们的内心太脆弱了。"
 mercs.1.b: "苏格兰人只爱黄金。"
 mercs.2.title: "他们敌人的敌人"
 mercs.2.desc: "[bloodthirsty_mercs.GetName]的士兵们正摩拳擦掌，迫不及待要与宿敌[bloodthirsty_mercs_enemy.GetAdjective]一决高下。看来[bloodthirsty_mercs_home.GetName]与[bloodthirsty_mercs_enemy.GetNameWithNoTooltip]之间的世仇，已然蔓延至雇佣兵刀锋相向的境地。"
 mercs.2.a: "一个愉快的巧合。"
 mercs.2.b: "每一位真正的[ROOT.GetCountry.GetAdjective]人都对此深有同感。"
 mercs.3.title: "劫掠抵薪"
 mercs.3.desc: "我们雇佣的多支佣兵团开始对他们的报酬感到不满。他们微薄的收入比起[rich_enemy_province.GetName]等等敌国城市的财富实在逊色——至少他们是这样认为的。[loot_mercs.GetName]的头领表明了立场，要求允许他和他的手下截留下一大笔掠夺来的战利品。"
 mercs.3.a: "让他们拿走一部分战利品吧。"
 mercs.3.b: "拒绝给他们战利品，但提高他们的薪水。"
 mercs.4.title: "老兵纷纷加入[veteran_mercs.GetName]"
 mercs.4.desc: "[ROOT.GetCountry.GetName|U]得到了佣兵队长的高度评价，这一方面是由于我们的国际威望，另一方面更是由于按时依约向雇佣兵支付报酬而培养的声誉。大批外国老兵正加入[veteran_mercs.GetName]，希望在我们的雇佣下找到稳定的工作。"
 mercs.4.a: "谁不想为[ROOT.GetCountry.GetNameWithNoTooltip]效劳呢？"
 mercs.5.title: "大象！"
 mercs.5.desc: "在汉尼拔与布匿战争的时代之后，战象首次在[ROOT.GetCountry.GetAdjective]的引领下重返欧洲。面对这些身披重甲、饰有战争徽记的庞然巨兽，我们的敌人无不畏缩退却。"
 mercs.5.a: "让他们在[elephant_mercs.GetNameWithNoTooltip]面前颤抖吧。"
 mercs.7.title: "对[popular_mercs.GetNameWithNoTooltip]的旺盛需求"
 mercs.7.desc: "随着我们这片区域的冲突日益激化，许多国家都需要雇佣兵团的协助。[popular_mercs.GetName]凭借其独特的专长，恰好适应当前局势，并与多个交战国签订了合约。\n\n当[popular_mercs.GetName]的士兵回到[popular_mercs_origin.GetName]的家乡时，他们不仅带回了合约薪酬，还有从战场上获取的战利品。这股财富的涌入极大地刺激了当地经济，也促使[popular_mercs.GetName]进一步扩大了招募规模。"
 mercs.7.a: "让财富奔涌起来吧。"
 mercs.10.title: "雇佣军狂热"
 mercs.10.desc: "就雇佣兵的标准而言，[pious_mercs.GetName]确实堪称[ROOT.GetCountry.GetReligion.GetName]的虔诚信徒。受我们正义事业的感召，他们已燃起昂扬斗志，誓要与亵渎神明的[pious_mercs_enemy.GetName]决一死战。"
 mercs.10.a: "我们的事业是正义的！"
