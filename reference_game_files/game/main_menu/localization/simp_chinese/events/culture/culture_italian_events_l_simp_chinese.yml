l_simp_chinese:
 italian_renaissance_culture.1.title: "挑战$FLO_ADJ$[ShowGoodsNameWithNoTooltip('wool')]垄断"
 italian_renaissance_culture.1.desc: "尽管[ShowLocationName('florence')]的贸易行会长期主导着[ShowRegionName('italy_region')]的[ShowGoodsName('wool')]贸易，但近来[ROOT.GetCountry.GetAdjective]的[ShowGoodsNameWithNoTooltip('wool')]生产扩张，让[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]愈发相信[ROOT.GetCountry.GetNameWithNoTooltip]或许能够挑战$FLO_ADJ$商人对市场的垄断。\n\n若[ROOT.GetCountry.GetGovernment.GetCourtTitle]能提供充足的资金支持，[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')]内部已有人提议建立新的贸易行会，以提振日益壮大的[ROOT.GetCountry.GetAdjectiveWithNoTooltip][ShowGoodsNameWithNoTooltip('wool')]产业。然而，[ROOT.GetCountry.GetGovernment.GetCourtTitle]中的其他人则倾向于让[ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')]在[ShowGoodsNameWithNoTooltip('wool')]生产上保持自主权。"
 italian_renaissance_culture.1.a: "将[ShowGoodsNameWithNoTooltip('wool')]行会的建立委托给[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')]。"
 italian_renaissance_culture.1.b: "维护[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('peasants_estate')]在[ShowGoodsNameWithNoTooltip('wool')]生产上的自治权。"
 ita_culture_rival_wool_guild_locations.tt: "治下[ShowRegionName('italy_region')]区域内所有原产[ShowGoodsNameWithNoTooltip('wool')]的地点会获得为期60年的[ShowModifier('italian_culture_rival_wool_trade')]修正，若未达到最高等级还将扩建#G +1.00#!。"
 italian_renaissance_culture.2.title: "农村人口减少"
 italian_renaissance_culture.2.desc: "自从[ShowSituationName('black_death')]席卷我国土地以来，[ROOT.GetCountry.GetName]的许多农村地区人口严重减少。虽然[target_location.GetName]也受到了[ShowSituationNameWithNoTooltip('black_death')]的沉重打击，但我们许多幸存的民众希望迁移到那里，以期重新获取因瘟疫而无法获得的关键资源。\n\n尽管[ROOT.GetCountry.GetGovernment.GetCourtTitle]中的一些人认为这是一个进一步城市化并重建[target_location.GetNameWithNoTooltip]的机会，但允许[ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')]抛弃[ROOT.GetCountry.GetNameWithNoTooltip]境内的核心农村区域进行迁徙，可能会导致严重的后果。"
 italian_renaissance_culture.2.a: "进一步鼓励向[target_location.GetNameWithNoTooltip]移民。"
 italian_renaissance_culture.2.b: "向乡村施加援助，以减缓人口流动。"
 italian_renaissance_culture.3.title: "重新发现古代[ShowCultureNameWithNoTooltip('greek_culture')]思想"
 italian_renaissance_culture.3.desc: "自[ShowAgeName('age_2_renaissance')]理念传播至[ShowRegionName('italy_region')]以来，[ShowCultureGroupName('italian_group')]学者对[ShowCultureName('greek_culture')]古籍的获取与翻译兴趣日增。为将[ROOT.GetCountry.GetNameWithNoTooltip]打造为[ShowRegionNameWithNoTooltip('italy_region')]最显赫邦国之一，[ROOT.GetCountry.GetGovernment.GetCourtTitle]众多顾问敦促[target_character.GetName]资助收回这些古代典籍。"
 italian_renaissance_culture.3.a: "鼓励重新发现这些艺术！"
 italian_renaissance_culture.3.b: "由国家提供全面赞助。"
 italian_renaissance_culture.3.c: "坚守我们的传统。"
 encourage_humanist_thought_for_rewards_tt: "鼓励向[ShowSocietyDirectionName('humanist')]方向推动，将进一步推动[ROOT.GetCountry.GetCapital.GetName]成为[ShowSocietyDirectionNameWithNoTooltip('humanist')]思想的重要中心"
 italian_renaissance_culture.4.title: "[target_location.GetNameWithNoTooltip]，人文主义中心"
 italian_renaissance_culture.4.desc: "自[ShowAgeName('age_2_renaissance')]的理想席卷[ShowRegionName('italy_region')]以来，从$BYZ_ADJ$文献中翻译出的古[ShowCultureName('greek_culture')]典籍得以重见天日。这些古代文本的重新发掘，引发了[ShowRegionNameWithNoTooltip('italy_region')]众多哲学家的思想剧变，催生出一条新的人文主义道路。在[ROOT.GetCountry.GetAdjective][ROOT.GetCountry.GetGovernment.GetCourtTitle]的大力支持下，[target_location.GetName]已成为整个[ShowRegionNameWithNoTooltip('italy_region')]首屈一指的[ShowSocietyDirectionName('humanist')]学术中心之一，众多学者汇聚于这座[target_location.GetRank.GetName]。随着[ShowAgeName('age_2_renaissance')]理念的持续传播，[target_location.GetNameWithNoTooltip]无疑将继续成为推动其发展的重要力量。"
 italian_renaissance_culture.4.a: "[target_location.GetNameWithNoTooltip]将成为[ShowRegionNameWithNoTooltip('italy_region')][ShowSocietyDirectionNameWithNoTooltip('humanist')]思想的灯塔。"
 italian_renaissance_culture.4.b: "限制[ShowSocietyDirectionNameWithNoTooltip('humanist')]思想的传播蔓延。"
 italian_renaissance_culture.5.title: "崭露头角的艺术家吸引[ROOT.GetCountry.GetGovernment.GetCourtTitle]目光"
 italian_renaissance_culture.5.desc: "随着[ShowAgeName('age_2_renaissance')]在[ShowRegionName('italy_region')]催生出一批杰出的新兴艺术家，[ROOT.GetCountry.GetGovernment.GetCourtTitle]中的一些人开始关注[target_artist.GetName]——一位在整个[ROOT.GetCountry.GetCapital.GetName]都引起轰动的人物。[target_character.GetName]身边的几位顾问已敦促[target_character.GetHimHer]资助[target_artist.GetNameWithNoTooltip]，他们认为，假以时日，这位艺术家很可能成长为[ShowRegionNameWithNoTooltip('italy_region')]最具才华的艺术巨匠之一。"
 italian_renaissance_culture.5.a: "为[ROOT.GetCountry.GetGovernment.GetCourtTitle]雇佣[target_artist.GetHimHer]！"
 italian_renaissance_culture.5.b: "我们不需要[target_artist.GetHisHer]的服务。"
 italian_renaissance_culture.6.title: "[ShowSocietyDirectionNameWithNoTooltip('humanist')]思想从[target_location.GetNameWithNoTooltip]向外传播"
 italian_renaissance_culture.6.desc: "来自[target_location.GetNameWithNoTooltip]、倡导[ShowSocietyDirectionName('humanist')]思想的著名学者已在[ROOT.GetCountry.GetCapital.GetName]定居，致力于向当地民众传播新近翻译的古[ShowCultureName('greek_culture')]文化典籍。尽管[ROOT.GetCountry.GetGovernment.GetCourtTitle]中部分人士对这些译作颇感兴趣，但另一些人则主张限制[ShowSocietyDirectionNameWithNoTooltip('humanist')]思想的传播，以防范潜在的社会动荡风险。"
 italian_renaissance_culture.6.a: "允许学者传播翻译文献。"
 italian_renaissance_culture.6.b: "限制翻译文献的传播。"
 italian_renaissance_culture.7.title: "对新兴艺术的资助"
 italian_renaissance_culture.7.desc: "[ShowSituationName('black_death')]消退后，许多[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]阶层的贸易环境变得成本高昂——货物长途运输更为困难，而生活必需品的需求却持续增长。然而，[ShowAgeName('age_2_renaissance')]思想的传播促使不少[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')]将资金转向支持新兴艺术，而非仅仅聚焦于商业贸易。\n\n由于艺术资助被证明对[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')]阶层是一项有价值的投资，一些人开始敦促[ROOT.GetCountry.GetGovernment.GetCourtTitle]进一步支持这些新兴艺术形式的发展。"
 italian_renaissance_culture.7.a: "资助这些新艺术的发展。"
 italian_renaissance_culture.7.b: "将收入拨入国库。"
 italian_renaissance_culture.8.title: "著名佣兵队长现身[ROOT.GetCountry.GetCapital.GetNameWithNoTooltip]"
 italian_renaissance_culture.8.desc: "[ROOT.GetCountry.GetGovernment.GetCourtTitle]收到消息，著名佣兵团指挥官[target_character_2.GetNameWithNoTooltip]已抵达[ROOT.GetCountry.GetCapital.GetName]。凭借多次军事胜利的辉煌战绩，[target_character_2.GetHeShe]的到来在[ROOT.GetCountry.GetGovernment.GetCourtTitle]内部引发了一场讨论：是否应趁其逗留[ROOT.GetCountry.GetCapital.GetNameWithNoTooltip]期间尝试争取[target_character_2.GetHisHer]的效力。一旦[ROOT.GetCountry.GetName]陷入冲突，[target_character_2.GetHisHer]的战斗能力或将起到决定性作用。"
 italian_renaissance_culture.8.a: "雇佣[target_character_2.GetNameWithNoTooltip]以确保[ROOT.GetCountry.GetNameWithNoTooltip]的安全。"
 italian_renaissance_culture.8.b: "我们不需要[target_character_2.GetHisHer]的战争专长。"
 italian_renaissance_culture.9.title: "[ROOT.GetCountry.GetNameWithNoTooltip]影响力日增吸引佣兵队长"
 italian_renaissance_culture.9.desc: "随着[ROOT.GetCountry.GetAdjective]对[ShowRegionName('italy_region')]地区影响力的日益扩大，多家佣兵团已主动向[ROOT.GetCountry.GetGovernment.GetCourtTitle]示好，寻求受雇机会。尽管[ROOT.GetCountry.GetGovernment.GetCourtTitle]部分成员倾向于雇佣他们——毕竟[ROOT.GetCountry.GetNameWithNoTooltip]扩张导致军队组建成本攀升——但另一些人则担忧这些佣兵首领纯粹是机会主义者，企图通过制造对其部队的过度依赖，从而变得不可替代。"
 italian_renaissance_culture.9.a: "设法讨好并雇佣这些佣兵队长。"
 italian_renaissance_culture.9.b: "我们不能冒险对这些佣兵团负债。"
 italian_renaissance_culture.10.title: "[condottieri_company.GetNameWithNoTooltip]要求增加报酬"
 italian_renaissance_culture.10.desc: "著名佣兵队长[condottieri_company.GetName]已正式向[ROOT.GetCountry.GetGovernment.GetCourtTitle]提出加薪诉求，声称其才能尚未得到[ROOT.GetCountry.GetAdjective]的充分回报。\n\n尽管[condottieri_company.GetNameWithNoTooltip]不大可能完全背弃与[ROOT.GetCountry.GetNameWithNoTooltip]达成的协议，但若拒绝其要求，或将影响该佣兵团的可靠性。"
 italian_renaissance_culture.10.a: "满足[condottieri_company.GetNameWithNoTooltip]的要求。"
 italian_renaissance_culture.10.b: "拒绝向[condottieri_company.GetNameWithNoTooltip]支付额外款项。"
 italian_renaissance_culture.11.title: "$FLO_ADJ$文化的传播"
 italian_renaissance_culture.11.desc: "尽管[ROOT.GetCountry.GetCapital.GetName]在[ROOT.GetCountry.GetCapital.GetRank.GetName]内颇具影响力，但众所周知，它与声名显赫的[ShowLocationName('florence')]相比仍稍逊一筹——后者已发展为[ShowRegionNameWithNoTooltip('italy_region')]地区占据主导地位的核心[ShowLocationRankName('city')]。\n\n为了提高[ROOT.GetCountry.GetCapital.GetNameWithNoTooltip]的声望，一些[ROOT.GetCountry.GetGovernment.GetCourtTitle]成员提议，我们应当借鉴[ShowLocationNameWithNoTooltip('florence')]新兴文化建筑风格中的部分元素。"
 italian_renaissance_culture.11.a: "采纳$FLO_ADJ$文化的元素。"
 italian_renaissance_culture.11.b: "维护[ROOT.GetCountry.GetCapital.GetNameWithNoTooltip]独特的文化。"
 italian_renaissance_culture.12.title: "振兴[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('peasants_estate')]阶层"
 italian_renaissance_culture.12.desc: "尽管[ShowSituationName('black_death')]波及了[ROOT.GetCountry.GetName]国内所有社会阶层，但[ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')]阶层遭受的打击最为沉重。多年之后，许多[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]转而投资[ShowAgeName('age_2_renaissance')]的艺术，推动了[ROOT.GetCountry.GetAdjectiveWithNoTooltip]精英文化的复兴；然而，绝大多数[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('peasants_estate')]仍因[ShowSituationNameWithNoTooltip('black_death')]的冲击而步履维艰。\n\n为帮助深受影响的[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('peasants_estate')]阶层恢复生机，[ROOT.GetCountry.GetGovernment.GetCourtTitle]中一些同情者提议削减对艺术的资助，将资金转而用于扶持他们的复苏。"
 italian_renaissance_culture.12.a: "我们对艺术的资助将继续不受阻碍。"
 italian_renaissance_culture.12.b: "转拨资金以援助衰弱的[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('peasants_estate')]阶层。"
 italian_renaissance_culture.13.title: "[target_artist.GetNameWithNoTooltip]翻译古[ShowCultureNameWithNoTooltip('greek_culture')]文献手稿"
 italian_renaissance_culture.13.desc: "[target_artist.GetName]完成的一部古[ShowCultureName('greek_culture')]文献手稿译本，在[ROOT.GetCountry.GetName]国内学术界引起了广泛关注，众多学者都渴望一睹其内容。与此同时，也有人将其视为提升[ROOT.GetCountry.GetAdjectiveWithNoTooltip]文化影响力的契机，敦促[target_character.GetName]支持将该译本推广至整个[ShowContinentName('europe')]。"
 italian_renaissance_culture.13.a: "赞扬[target_artist.GetNameWithNoTooltip]的翻译工作！"
 italian_renaissance_culture.13.b: "将[target_artist.GetHisHer]的译作广为传播！"
 italian_renaissance_culture.13.c: "仅限[ROOT.GetCountry.GetGovernment.GetCourtTitle]内部传阅。"
 italian_renaissance_culture.14.title: "[target_artist.GetNameWithNoTooltip]的技艺令[ROOT.GetCountry.GetGovernment.GetCourtTitle]印象深刻"
 italian_renaissance_culture.14.desc: "自得到[ROOT.GetCountry.GetGovernment.GetCourtTitle]资助后，[target_artist.GetName]便成为了[target_character.GetName]麾下的宝贵财富，其精湛技艺赢得了上流社会的一致赞誉。无论是[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]阶层的显赫人物，还是[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]阶层中的有影响力者，[target_artist.GetNameWithNoTooltip]的影响力无处不在，且已切实为巩固[target_character.GetNameWithNoTooltip]的声望带来了显著助益。"
 italian_renaissance_culture.14.a: "[target_artist.GetHisHer|U]的作品极大地丰富了[ROOT.GetCountry.GetGovernment.GetCourtTitle]！"
 italian_renaissance_culture.15.title: "声望日增的[ShowArtistTypeName('architect')]"
 italian_renaissance_culture.15.desc: "[target_artist.GetName]已在[ROOT.GetCountry.GetCapital.GetName]完成了多个建筑项目，由此在[ROOT.GetCountry.GetName]全国范围内声名鹊起，并吸引了[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]阶层中诸多名门望族的资助。[ROOT.GetCountry.GetGovernment.GetCourtTitle]中有人认为，我们应当聘请[target_artist.GetHimHer]，因为[target_artist.GetHerHis]运用古典建筑技艺，或许能成为推动[ROOT.GetCountry.GetCapital.GetNameWithNoTooltip]建筑复兴的关键人物。"
 italian_renaissance_culture.15.a: "让我们给予[target_artist.GetHimHer]国家资助。"
 italian_renaissance_culture.15.b: "我们对建筑项目毫无兴趣。"
 italian_renaissance_culture.16.title: "[target_artist.GetNameWithNoTooltip]请求[ROOT.GetCountry.GetGovernment.GetCourtTitle]额外资源"
 italian_renaissance_culture.16.desc: "在创作一件受古典艺术启发的作品过程中，[target_artist.GetName]向[ROOT.GetCountry.GetGovernment.GetCourtTitle]申请了额外资源。[target_artist.GetHimHer]坦言这项工作比预期更为艰巨，并承诺追加的投资将物超所值，为[ROOT.GetCountry.GetGovernment.GetCourtTitle]赢得显著的文化声望。"
 italian_renaissance_culture.16.a: "向[target_artist.GetHimHer]提供所需的额外资源。"
 italian_renaissance_culture.16.b: "我们负担不起。"
 italian_renaissance_culture.17.title: "对[target_rival.GetNameWithNoTooltip]不满的[target_rival_artist.GetArtistType.GetNameWithNoTooltip]"
 italian_renaissance_culture.17.desc: "虽然[target_rival_artist.GetName]受雇于我们的宿敌[target_rival.GetName]，但[target_rival_artist.GetHisHer]的作品在整个[ShowRegionName('italy_region')]地区赢得了一定的声誉。然而，最近有传言称，[target_rival_artist.GetHeShe]对[target_rival.GetNameWithNoTooltip]提供的资助感到不满。\n\n[ROOT.GetCountry.GetGovernment.GetCourtTitle]中的一些人看到了既削弱[target_rival.GetNameWithNoTooltip]影响力、又获得一位著名[target_rival_artist.GetArtistType.GetName]服务的机会，敦促我们与[target_rival_artist.GetNameWithNoTooltip]秘密达成协议，希望[target_rival_artist.GetHeShe]能加入我们的[ROOT.GetCountry.GetGovernment.GetCourtTitle]。"
 italian_renaissance_culture.17.a: "迅速行动，把[target_rival_artist.GetNameWithNoTooltip]挖过来！"
 italian_renaissance_culture.17.b: "我们不敢雇佣任何与[target_rival.GetNameWithNoTooltip]有联系的艺术家。"
 italian_renaissance_culture.18.title: "[target_artist.GetNameWithNoTooltip]与油画艺术"
 italian_renaissance_culture.18.desc: "尽管$FLA_ADJ$艺术家们开创了独特的油画技法，但相关技艺长期只在低地国家流传。不过，[target_artist.GetName]最近从低地国家回到[ROOT.GetCountry.GetCapital.GetName]，致力于在[ShowCultureGroupName('italian_group')]培育一种独具特色的油画传统。\n\n许多[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]对此表现出浓厚兴趣，积极支持[target_artist.GetHimHer]在[ShowRegionName('italy_region')]地区推广这一艺术形式，并敦促[target_character.GetName]为其提供资助。"
 italian_renaissance_culture.18.a: "[target_artist.GetHisHer|U]独特的艺术形式值得资助！"
 italian_renaissance_culture.18.b: "我们对[target_artist.GetHisHer]的绘画形式不感兴趣。"
 italian_renaissance_culture.19.title: "来自[ShowLocationNameWithNoTooltip('florence')]的[target_artist.GetNameWithNoTooltip]"
 italian_renaissance_culture.19.desc: "[target_artist.GetName]凭借在[ShowLocationName('florence')]创作的作品赢得了地区性赞誉，如今已抵达[ROOT.GetCountry.GetCapital.GetName]，并为多位[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]承接了委托。然而，[target_artist.GetHisHer]在[ROOT.GetCountry.GetCapital.GetNameWithNoTooltip]的出现也引起了[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]阶层的关注，众人对其作品展现出浓厚兴趣，纷纷请求[ROOT.GetCountry.GetGovernment.GetCourtTitle]向[target_artist.GetHimHer]发出委托，希望延长[target_artist.GetHisHer]在[ROOT.GetCountry.GetCapital.GetNameWithNoTooltip]的驻留时间。\n\n尽管如此，作为一位来自[ShowLocationNameWithNoTooltip('florence')]的知名[ShowArtistTypeName('philosopher')]，[target_artist.GetNameWithNoTooltip]所期望获得的资源，恐怕将超出[ROOT.GetCountry.GetGovernment.GetCourtTitle]通常所能提供的范畴。"
 italian_renaissance_culture.19.a: "虽然昂贵，但[target_artist.GetHisHer]的经验将受到欢迎。"
 italian_renaissance_culture.19.b: "[target_artist.GetShortNameWithNoTooltip]对[ROOT.GetCountry.GetGovernment.GetCourtTitle]来说过于昂贵了。"
 italian_renaissance_culture.20.title: "[target_country.GetLongNameWithNoTooltip]请求派遣[target_artist.GetNameWithNoTooltip]"
 italian_renaissance_culture.20.desc: "随着[target_artist.GetName]的声望已超越[ShowRegionName('italy_region')]之外，[target_country.GetLongName][target_country.GetGovernment.GetCourtTitle]已正式向[ROOT.GetCountry.GetName]提出请求，希望邀请[target_artist.GetNameWithNoTooltip]为其服务。[target_country.GetAdjectiveWithNoTooltip][target_country.GetGovernment.GetCourtTitle]对[target_artist.GetNameWithNoTooltip]作品的盛誉深感钦佩，并表示若[ROOT.GetCountry.GetNameWithNoTooltip]同意其迁居[target_country.GetNameWithNoTooltip]，愿为此支付一笔丰厚酬金。"
 italian_renaissance_culture.20.a: "接受[target_country.GetAdjectiveWithNoTooltip]的钱币，换取[target_artist.GetShortNameWithNoTooltip]。"
 italian_renaissance_culture.20.b: "我们将保留对[target_artist.GetShortNameWithNoTooltip]的独家资助。"
 italian_renaissance_culture.21.title: "资助[ShowAgeNameWithNoTooltip('age_2_renaissance')]艺术的代价"
 italian_renaissance_culture.21.desc: "尽管[ROOT.GetCountry.GetName]曾大力资助[ShowAgeName('age_2_renaissance')]的新兴艺术，但事实证明，这种投入已逐渐对[ROOT.GetCountry.GetAdjectiveWithNoTooltip]财政造成负担。如今国库正面临严重危机——尽管部分[ROOT.GetCountry.GetGovernment.GetCourtTitle]成员仍坚信持续资助终将带来回报，但若不及时采取应对措施，财政状况恐将进一步恶化。"
 italian_renaissance_culture.21.a: "减少国家对艺术的资助以保存国库。"
 italian_renaissance_culture.21.b: "我们必须继续资助艺术！"
 italian_renaissance_culture.22.title: "[target_location.GetNameWithNoTooltip]，[ShowAgeNameWithNoTooltip('age_2_renaissance')]艺术与文化中心"
 italian_renaissance_culture.22.desc: "尽管对于[ROOT.GetCountry.GetLongName]而言是一项重大的财政投入，[target_location.GetName]已发展成为[ShowRegionName('italy_region')]地区——乃至整个[ShowContinentName('europe')]——[ShowAgeName('age_2_renaissance')]艺术的重要中心之一。来自[ShowContinentNameWithNoTooltip('europe')]各地的知名艺术家与学者纷纷渴望造访这座[target_location.GetRank.GetName]，许多人传颂着[target_location.GetNameWithNoTooltip]如何被这个时代重塑的佳话。"
 italian_renaissance_culture.22.a: "[target_location.GetNameWithNoTooltip]将在未来几个世纪中作为艺术与文化的中心熠熠生辉！"
 italian_renaissance_culture.22.b: "利用[target_location.GetNameWithNoTooltip]新获得的声望来提升我们的威望。"
 italian_renaissance_culture.23.title: "[ShowWorkOfArtNameWithNoTooltip('boccaccio_on_the_fates_of_famous_men')]"
 italian_renaissance_culture.23.desc: "[target_artist.GetName]是[ShowAgeName('age_2_renaissance')]时期的一位领军人物，他刚刚完成了一部令人瞩目的新作。这部题为[ShowWorkOfArtName('boccaccio_on_the_fates_of_famous_men')]的作品汇集了从圣经时代、古典时期到近一个世纪以来的众多杰出人物。这是一部内容精良的合集——若[ROOT.GetCountry.GetGovernment.GetCourtTitle]愿意出让，[target_artist.GetLastNameWithNoTooltip]的这部著作极有可能售得高价。"
 italian_renaissance_culture.23.a: "一部精彩而珍贵的历史人物合集。"
 italian_renaissance_culture.23.b: "将[target_artist.GetHisHer]的作品高价出售给[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')]阶层。"
 italian_renaissance_culture.24.title: "[ShowWorkOfArtNameWithNoTooltip('boccaccio_the_decameron')]"
 italian_renaissance_culture.24.desc: "在亲历[ShowSituationName('black_death')]的恐怖后，[target_artist.GetName]深受触动，创作出[ShowWorkOfArtName('boccaccio_the_decameron')]。这部以[ShowLocationName('florence')]为背景、讲述十位$FLO_ADJ$市民为躲避瘟疫逃往乡间经历的作品，迅速引起了[ROOT.GetCountry.GetName][ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]阶层的浓厚兴趣。宫[ROOT.GetCountry.GetGovernment.GetCourtTitle]中亦有人提出，我们应当大力推广[target_artist.GetLastNameWithNoTooltip]的这部杰作。"
 italian_renaissance_culture.24.a: "一部引人入胜的故事集！我们应该传播[target_artist.GetHisHer]的作品。"
 italian_renaissance_culture.24.b: "将作品的所有权卖给[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]阶层。"
 italian_renaissance_culture.25.title: "[ShowWorkOfArtNameWithNoTooltip('boccaccio_concerning_famous_women')]"
 italian_renaissance_culture.25.desc: "与[target_artist.GetHisHer]的前作[ShowWorkOfArtName('boccaccio_on_the_fates_of_famous_men')]相似，[target_artist.GetName]出版了一部关于历史著名人物的著作，但这一次，他将焦点放在了杰出女性身上。[ROOT.GetCountry.GetGovernment.GetCourtTitle]中大多数人对[target_artist.GetLastNameWithNoTooltip]对这些人物表现出的兴趣感到惊讶，但正如[target_artist.GetHisHer]之前的许多作品一样，[ShowWorkOfArtName('boccaccio_concerning_famous_women')]无疑将在我们财政紧张之时，成为一笔宝贵的资产。"
 italian_renaissance_culture.25.a: "它将作为[ROOT.GetCountry.GetGovernment.GetCourtTitle]中的珍品留存。"
 italian_renaissance_culture.25.b: "举办[ROOT.GetCountry.GetGovernment.GetCourtTitle]拍卖会，出售这部[ShowWorkOfArtTypeNameWithNoTooltip('chronicle')]。"
 italian_renaissance_culture.26.title: "[target_character_2.GetNameWithNoTooltip]的崛起"
 italian_renaissance_culture.26.desc: "[target_character_2.GetName]在[ShowLocationName('florence')]展现了深远的影响力。[target_character_2.GetHisHer]不仅被公认为才华横溢的个人，更是[ShowAgeName('age_2_renaissance')]时期[ShowSocietyDirectionName('humanist')]思想的重要传播者。随着[target_character_2.GetNameWithNoTooltip]获得[ROOT.GetCountry.GetGovernment.GetCourtTitle]成员的赞誉与认可，有人向[target_character.GetName]提议，授予[target_character_2.GetNameWithNoTooltip]内阁中的[ROOT.GetCountry.GetGovernment.GetCabinetTitle]职位。"
 italian_renaissance_culture.26.a: "让[target_character_2.GetHimHer]在[ROOT.GetCountry.GetGovernment.GetCourtTitle]中担任一个职位。"
 italian_renaissance_culture.26.b: "[target_character_2.GetHeShe]会成为一位出色的[ROOT.GetCountry.GetGovernment.GetCabinetTitle][ROOT.GetCountry.GetGovernment.GetCabinetMemberTitle]。"
 italian_renaissance_culture.26.c: "不要授予[target_character_2.GetHimHer]任何特殊特权。"
 italian_renaissance_culture.27.title: "[target_artist.GetNameWithNoTooltip]"
 italian_renaissance_culture.27.desc: "尽管[target_artist.GetName]此前已在[ShowRegionName('italy_region')]本土赢得了一定声誉，但自从[target_artist.GetHeShe]迁居[ROOT.GetCountry.GetCapital.GetName]后，其声望更是遍及全[ROOT.GetCountry.GetCapital.GetRank.GetName]。许多上层人士十分认同[target_artist.GetHisHer]那种独特的世俗教育理念。虽然部分[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]对[target_artist.GetHisHer]的教学方式颇有微词，但另一些人则力劝[target_character.GetName]授予[target_artist.GetNameWithNoTooltip]永久居留权，允许[target_artist.GetHisHer]长驻[ROOT.GetCountry.GetName]。"
 italian_renaissance_culture.27.a: "雇佣[target_artist.GetHimHer]！"
 italian_renaissance_culture.27.b: "[target_artist.GetHisHer|U]想法过于激进。"
 italian_renaissance_culture.28.title: "建立欢乐之家"
 italian_renaissance_culture.28.desc: "自在[ROOT.GetCountry.GetName]获得完全居留权以来，[target_artist.GetName]已将其艺术理念传授给了[target_location.GetName]众多人士。凭借[target_artist.GetHisHer]在[target_location.GetNameWithNoTooltip]的声望与影响力，[target_artist.GetNameWithNoTooltip]现正向[ROOT.GetCountry.GetGovernment.GetCourtTitle]申请财政支持，以筹建一所名为#italic “欢乐之家”#!的新学院。\n\n尽管所需投入不菲，但在[target_location.GetNameWithNoTooltip]创办这所[ShowBuildingTypeNameWithNoTooltip('art_school')]将显著提升[ROOT.GetCountry.GetAdjectiveWithNoTooltip]在整个[ShowRegionName('italy_region')]地区的文化威望。"
 italian_renaissance_culture.28.a: "委托建立[ShowBuildingTypeNameWithNoTooltip('art_school')]！"
 italian_renaissance_culture.28.b: "主张将欢乐之家改建为一所新的[ShowBuildingTypeNameWithNoTooltip('university')]。"
 italian_renaissance_culture.28.c: "我们没有资金用于此项目。"
 italian_renaissance_culture.29.title: "[target_artist.GetNameWithNoTooltip]"
 italian_renaissance_culture.29.desc: "作为[target_artist_2.GetName]的杰出弟子，[target_artist.GetName]已赢得[ShowRegionName('italy_region')]顶尖学者之一的美誉，尤其精于翻译古[ShowCultureName('greek_culture')]化手稿。如今[target_artist.GetNameWithNoTooltip]抵达[ROOT.GetCountry.GetCapital.GetName]，并表示有意寻求[ROOT.GetCountry.GetAdjective][ROOT.GetCountry.GetGovernment.GetCourtTitle]的资助，以继续[target_artist.GetSheHe]针对新近发现的古[ShowCultureNameWithNoTooltip('greek_culture')]手稿的翻译工作。"
 italian_renaissance_culture.29.a: "雇佣[target_artist.GetHimHer]！"
 italian_renaissance_culture.29.b: "我们不想资助[target_artist.GetHisHer]的工作！"
 italian_renaissance_culture.30.title: "[target_artist.GetNameWithNoTooltip]"
 italian_renaissance_culture.30.desc: "尽管油画在[ShowRegionName('italy_region')]的传播仍处于起步阶段，但[target_artist.GetName]已被公认为其中技艺最为精湛的[ShowArtistTypeName('painter')]之一，[target_artist.GetHisHer]的许多画作已成为[ShowCultureGroupName('italian_group')]各文化团体与宫廷的珍贵收藏。\n\n无论是[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]还是[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]阶层，许多人都纷纷敦促[target_character.GetName]提供资助，以[target_artist.GetHisHer]独特的画作为[ROOT.GetCountry.GetGovernment.GetCourtTitle]增添艺术光彩。"
 italian_renaissance_culture.30.a: "[target_artist.GetHisHer|U]的画作将提升[ROOT.GetCountry.GetGovernment.GetCourtTitle]的威望。"
 italian_renaissance_culture.30.b: "我们负担不起对[target_artist.GetHimHer]的资助。"
