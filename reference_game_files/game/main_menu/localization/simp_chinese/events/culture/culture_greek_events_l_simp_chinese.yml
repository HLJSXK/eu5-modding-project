l_simp_chinese:
 culture_greek.1.title: "与[target_character.GetNameWithNoTooltip]的争端"
 culture_greek.1.desc: "尽管我们作为自豪的[ROOT.GetCountry.GetReligion.GetAdjective]国家的立场在许多邻国看来是显而易见的，但我们牧首区内部似乎存在一些状况。\n\n[target_character.GetName]注意到[target_character2.GetName]在履行宗教职责时有所懈怠。[target_character.GetSheHe|U]列举了对[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]的虐待、宗教仪式中的不当行为以及整体上对我国[ROOT.GetCountry.GetReligion.GetAdjectiveWithNoTooltip]宗教文化缺乏尊重。\n\n虽然很多人觉得这些说法有些夸大，但人民仍清楚地意识到[target_character2.GetNameWithNoTooltip]的疏忽，以及[target_character2.GetSheHe]如何自视凌驾于任何宗教机构之上。正是这一点导致我们的一些[ROOT.GetCountry.GetReligion.GetAdjective]公民视[target_character2.GetHerHim]为非法，不配拥有[ROOT.GetCountry.GetGovernment.GetRulerTitle]的头衔。"
 culture_greek.1.a: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')]根本不知道自己在说什么！"
 culture_greek.1.b: "也许我们应该进一步限制[target_character2.GetNameWithNoTooltip]。"
 culture_greek.1.c: "无人能质疑[target_character2.GetNameWithNoTooltip]的合法性！"
 culture_greek.1.d: "一场演讲定能平息他们的疑虑。"
 culture_greek.2.title: "牧首祝福[target_character2.GetNameWithNoTooltip]"
 culture_greek.2.desc: "[ROOT.GetCountry.GetName]的优雅与秩序，使[target_character.GetName]对[target_character2.GetName]的统治方式产生了兴趣。初到[target_capital.GetName]时，[target_character.GetSheHe]就对其在维护[ROOT.GetCountry.GetReligion.GetName]宗教支柱方面所倾注的细致关注印象深刻。修道院保养得极好，用[ROOT.GetCountry.GetGovernment.GetGovernmentType.GetName]能筹集到的所有财富来装饰；市民们欣赏着道路旁的大理石纪念小神龛，追忆逝去的至爱，或那些助他们度过危机的奇迹。\n\n在[ROOT.GetCountry.GetGovernment.GetCourtTitle]中，许多成员诵读《圣经》，并能在救世主本人的圣像前见到他们祈祷的身影。当[target_character.GetNameWithNoTooltip]走近[target_character2.GetNameWithNoTooltip]商讨政事的厅堂时，空气中弥漫着焚香的气味。"
 culture_greek.2.a: "牧首的祝福已获保证。"
 culture_greek.2.b: "仅凭祝福还不足够，我们需要在[target_capital.GetNameWithNoTooltip]投入更多努力。"
 culture_greek.3.title: "[target_country.GetNameWithNoTooltip]的宗教改革"
 culture_greek.3.desc: "随着宗教改革的浪潮席卷[ShowContinentName('europe')]，[target_character.GetName]等人已对建立与[target_country.GetName]这样的与教廷体制对抗的改革者的外交关系产生了兴趣。\n\n经过讨论，我们清楚意识到，我们确实有共同的敌人：他们也想摆脱[papal_capital.GetName]的腐败做法，夺回[target_country.GetGovernment.GetEstateName('crown_estate')]的自主权。然而，仍存在一些我们的[ROOT.GetCountry.GetGovernment.GetCourtTitle]无法容忍的分歧——[ShowReligionName('catholic')]在他们土地上留下的烙印。"
 culture_greek.3.a: "敌人的敌人是我的朋友。"
 culture_greek.3.b: "我们不需要异端的帮助。"
 culture_greek.3.c: "[target_character2.GetShortNameWithNoTooltip]让我们看起来像是傻瓜！"
 culture_greek.4.title: "“[ShowCultureNameWithNoTooltip('greek_culture')]”问题"
 culture_greek.4.desc: "绝对主义的兴起以及国家和民众概念的塑造，正在影响我们当前民众的思考方式。此类议题鲜少被公开探讨，因文化往往由宗教主导。然而，如今随着来自社会底层的杰出思想家不断涌现，我们教育机构中的许多人都在追问一个问题：究竟什么是[ShowCultureNameWithNoTooltip('greek_culture')]？\n\n有人指出，[ROOT.GetCountry.GetName]的语言中存在的双语现象加剧了社会分裂，使得官僚阶层与[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]在几乎所有方面都与[ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')]截然不同，不只是行为方式，甚至包括说的方言。\n\n这种情况逐渐使很多人变得激进，他们呼吁进行变革，以消除这种分隔，真正实现国家的统一。"
 culture_greek.4.a: "我们可以缓慢而稳固地团结人民。"
 culture_greek.4.b: "做出此类变革将动摇我们当前的权力结构。"
 culture_greek.4.c: "文化差异并不存在，只是同一文化的不同变体。"
 greek_culture_greek_peasants_will_gain_satisfaction: "所有非[rural_locations|e]的[ShowCultureGroupName('greek_group')][culture|e][ShowPopTypeName('peasants')]或[ShowPopTypeName('laborers')][pops|e]会获得[ShowNamedValue('pop_satisfaction_mild_bonus')|+=2%][pop_satisfaction|e]"
 culture_greek.5.title: "[target_character.GetNameWithNoTooltip]的崛起"
 culture_greek.5.desc: "屡获大捷，无论是在[victory_location1.GetName]还是[victory_location2.GetName]的胜利，都让民众开始将[target_character.GetHerHim]奉为天才统帅——这位统帅以刀剑击溃[ROOT.GetCountry.GetName]之敌，以上主与[target_character2.GetName]之名令敌人血流成河。\n\n在与[ROOT.GetCountry.GetGovernment.GetCourtTitle]多位要员交谈后，他们似乎也对[target_character.GetHerHim]敬重有加，并为[target_character.GetHerHis]讲述的[victory_location3.GetName]战役故事所吸引——这是当下人人热议的最新传奇。这份声望令[target_character2.GetName]倍感威胁，因为[target_character2.GetSheHe]察觉[ROOT.GetCountry.GetGovernment.GetCourtTitle]的影响力正逐渐向这位统帅倾斜。不过，或许这也能够用以巩固[target_character2.GetDynasty.GetName]对[ROOT.GetCountry.GetNameWithNoTooltip]的统治。"
 culture_greek.5.a: "让我们为这样的英雄欢呼吧。"
 culture_greek.5.b: "我们必须限制[target_character.GetShortNameWithNoTooltip]的影响力。"
 culture_greek.5.c: "让[target_character.GetHerHim]#italic 恰好#!与我们保持亲近，但远离政治。"
 greek_culture_strategos_will_never_be_able_to_influence_politics: "通过剥夺[target_character.GetName]对[courtiers|e]施加影响的能力，我们将确保[target_character.GetSheHe]在未来不会对我们发动政变"
 greek_culture_strategos_will_never_get_the_opportunity_to_coup: "[target_character.GetName]将永远无法影响[courtiers|e]，这意味着[target_character.GetSheHe]也永远无法对我们发动政变"
 culture_greek.6.title: "人民的将军"
 culture_greek.6.desc: "当声名卓著的将军[target_character.GetName]在亲卫护卫下行经[target_capital.GetName]街头时，民众纷纷聚集，只为一睹这位战略家的风采。\n\n[ROOT.GetCountry.GetGovernment.GetEstateName('commoners_estate')]、[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]与[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]阶层齐声高呼，万众同颂其名：“[target_character.GetShortNameWithNoTooltip]！”人群中也有低语悄然流传，称若由[target_character.GetSheHe]执政，必能革除弊政，真正倾听民声。这些议论已传至[ROOT.GetCountry.GetGovernment.GetCourtTitle]，足见此人已深得民心、威望深重。"
 culture_greek.6.a: "即使政见相悖，也应对这位将军致以敬意。"
 culture_greek.6.b: "须在众人萌生异心之前，弹压此番喧哗。"
 greek_culture_all_capital_pops_gain_pop_satisfaction: "[target_capital.GetName]所有[pops|e]会获得[ShowNamedValue('pop_satisfaction_mild_bonus')|+=2%][pop_satisfaction|e]"
 greek_culture_prevent_coup_for_two_year: "如果[target_character.GetName]在谋划政变，[target_character.GerHerHis]的努力将停滞#y 2#!年"
 culture_greek.7.title: "[target_character.GetNameWithNoTooltip]政变"
 culture_greek.7.desc: "经过数月密谋、拉拢支持者、削弱对手势力和集结军队，[target_character.GetName]现已具备推翻[target_character2.GetName]的实力。\n\n[target_character.GetSheHe]自认是[ROOT.GetCountry.GetName]的合法统治者，且更为仁慈贤明，如今[target_character.GetHerselfHimself]已兵临[ROOT.GetCountry.GetCapital.GetName]城外，要求[target_character2.GetShortName]让出[ROOT.GetCountry.GetNameWithNoTooltip]的统治权。"
 culture_greek.7.a: "我们需要新的领袖，以革除腐朽。"
 culture_greek.7.b: "[target_character2.GetShortNameWithNoTooltip]绝不轻易退位！"
 culture_greek.7.c: "[target_character.GetShortNameWithNoTooltip]懂什么正统合法性？"
 culture_greek.7.d: "将这个图谋篡位者流放。"
 greek_culture_weaker_due_to_righteous_trait: "[rebels|e]将大幅削弱。"
 culture_greek.8.title: "潜伏于[target_location.GetNameWithNoTooltip]的密探"
 culture_greek.8.desc: "[target_location.GetName]的守卫近日查获一伙密探，他们企图刺探[ROOT.GetCountry.GetName]的最高机密——诸如希腊火，以及我国研发的、敌方觊觎已久的各类先进技术。\n\n虽未供出幕后主使，但密探已招认潜伏此地数月，辗转于各客栈与教堂，四处搜寻可窃取我方机密的线索。与其让这些人在地牢里腐朽度日、坐等主子知晓下场，不如让他们发挥更大用处——比如为我们效力。"
 culture_greek.8.a: "这些密探在我们[ROOT.GetCountry.GetGovernment.GetCourtTitle]将更有用武之地。"
 culture_greek.8.b: "让他们烂在地牢里，并肃清一切潜入[target_location.GetNameWithNoTooltip]的间谍网络！"
 culture_greek.8.c: "或许他们能帮我们找出潜藏在[target_location.GetRank.GetNameWithNoTooltip]内的其他间谍网络。"
 every_country_with_spy_network_on_us_will_lose_25_network: "所有在我们[target_location.GetRank.GetNameWithNoTooltip]拥有至少#Y 15#![spy_network|e]的已知[country|e]将失去#R -25#![spy_network|e]"
 culture_greek.9.title: "《[target_location.GetNameWithNoTooltip]金玺诏书》"
 culture_greek.9.desc: "在[target_location.GetName]，[ShowCultureGroupName('italian_group')]人的势力已开始主导本地贸易。该[target_location.GetRank.GetName]的民众只愿与那些从[ShowRegionName('italy_region')]来的商人交易，致使我们大量财富流失，无法有效掌控。不过，这种局面亦有少许益处，主要是国家仍能出售物产换取财富，只是售价不尽理想。但此类交易也可能削弱[target_character.GetName]的权威，甚至导致我方愈发依赖这些[ShowCultureGroupNameWithNoTooltip('italian_group')]商人。"
 culture_greek.9.a: "只要能为我们带来财富，便许他们更多特权。"
 culture_greek.9.b: "若他们想榨干这座[target_location.GetRank.GetNameWithNoTooltip]的财富，就必须缴纳额外税费。"
 culture_greek.9.c: "不妨授予些许特权——但仅限无实质利益的虚名。"
 culture_greek.9.d: "若要立法保护他们，行事必须讲求效率。"
 all_italian_pops_become_happier: "所有[ShowCultureGroupName('italian_group')][ShowPopTypeName('burghers')][pops|e]会获得[ShowNamedValue('pop_satisfaction_mild_bonus')|+=2%][pop_satisfaction|e]"
 all_italian_pops_become_angrier: "所有[ShowCultureGroupName('italian_group')][ShowPopTypeName('burghers')][pops|e]会失去[ShowNamedValue('pop_satisfaction_mild_penalty')|+=2%][pop_satisfaction|e]"
 culture_greek.10.title: "[target_location.GetNameWithNoTooltip]的新一代"
 culture_greek.10.desc: "当前官僚体系根深蒂固，管理者中贪腐之风渐起。一批杰出的青年学子崭露头角，希望以更进步的方式取代守旧派的陈规陋习，根除腐败。这些新举措有望重塑僵化的官僚结构，使其造福国家与民众。\n\n此举固然能提升行政效率，但诸多身居要职者担心遭到罢免，于是极力打压新生代，甚至收买人员让他们“保持沉默”。"
 culture_greek.10.a: "这些青年才俊便是国家的未来。"
 culture_greek.10.b: "此事上，我们站在更老成的一方。"
 culture_greek.11.title: "宫廷里的“外语”"
 culture_greek.11.desc: "尽管罗马语言在东方[ROOT.GetCountry.GetGovernment.GetCourtTitle]的影响力日渐衰退，我们仍努力坚守自豪的[ShowCultureGroupName('greek_group')]人身份。即便如此，部分[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]仍熟稔拉丁语，能随口说出[ShowLanguageName('latin_language')]短语。\n\n“但为‘公益’。”[target_character.GetName]对廷臣们援引了这一句拉丁谚语，却惹得众人一头雾水。[target_character.GetSheHe]只得解释了这句短语的来源与含义。守旧派嘲讽[target_character.GetHerHim]使用这种怪异语言，另一些人则心生好奇，想要进一步了解[ShowLanguageNameWithNoTooltip('latin_language')]。于是，[ROOT.GetCountry.GetGovernment.GetCourtTitle]中出现了采用这种语言风格，并将其融入行政体系的议论。人们认为，这是某种对古罗马传统的回归，试图在[ROOT.GetCountry.GetNameWithNoTooltip]延续罗马之道。"
 culture_greek.11.a: "我们没有理由抛弃自身的[ShowCultureNameWithNoTooltip('greek_culture')]特质。"
 culture_greek.11.b: "应当鼓励使用[ShowLanguageName('latin_language')]。"
 culture_greek.11.c: "[ROOT.GetCountry.GetGovernment.GetCourtTitle]理应尊重一切语言。"
 culture_greek.12.title: "腐败的端倪"
 culture_greek.12.desc: "尽管[ROOT.GetCountry.GetName]的诸多要职皆由精干的能臣担任，但体系中仍有部分环节运转不力。\n\n近期对行政体系的核查曝出了耐人寻味的结果：有传言称，[target_character.GetName]将官职私授亲友，甚至授予能为[target_character.GetHerHim]敛财之人。消息传至[ROOT.GetCountry.GetGovernment.GetCourtTitle]，更重要的是传至[target_character2.GetName]耳中时，不少人却表现得轻描淡写，并称此事不过是[target_character.GetNameWithNoTooltip]与审计官员有私仇。\n\n或许我们需要更直接的干预，让那些把行政体系当作敛财门路的人明白，任何行为都要付出代价。"
 culture_greek.12.a: "水至清则无鱼。"
 culture_greek.12.b: "既然[target_character.GetShortNameWithNoTooltip]伸了手，那就得付出代价。"
 culture_greek.12.c: "一切贪腐都将绳之以法！"
 culture_greek.12.d: "或许……可以从中“斡旋”。"
 culture_greek.13.title: "失灵的首领辖区"
 culture_greek.13.desc: "[target_area.GetName]的首领辖区自设立以来便日渐衰败。驻守[target_location.GetName]的首领官治理不力，而这一失职在官僚体系内部长期被无视。结果当地民众拒不纳税，部分贵族兼并土地，剥削农民及其潜在财富。\n\n在这些报告呈至[target_character.GetName]的[ROOT.GetCountry.GetGovernment.GetCourtTitle]后，各派官员如同秃鹫扑食般争相弹劾，并提议由自己或亲信取而代之，声称能更好地镇守该地区。此类举动虽显激进，但更换管理者或许不失为良策。又或者，问题本就源于我们对地方治理的忽视，应当增派资源，协助弹压桀骜不驯的[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]，迫使骄纵的平民顺从。"
 culture_greek.13.a: "让我们另择人选接任。"
 culture_greek.13.b: "是我们的疏忽导致了[target_area.GetNameWithNoTooltip]的乱像，我们应予以支援。"
 culture_greek.13.c: "唯有时间能弥合创伤，没必要做出更换。"
 all_pops_in_kephale_area_lose_satisfaction: "[target_area.GetName]所有[pops|e]会失去[ShowNamedValue('pop_satisfaction_mild_penalty')|+=2%][pop_satisfaction|e]"
 gain_extra_control_in_the_area: "我们在[target_area.GetName]的所有[location|e]会获得[ShowNamedValue('control_mild_bonus')|+=2%][control|e]"
 lose_extra_control_in_the_area: "我们在[target_area.GetName]的所有[location|e]会失去[ShowNamedValue('control_mild_penalty')|+=2%][control|e]"
 culture_greek.14.title: "非生于紫室"
 culture_greek.14.desc: "尽管[target_character.GetName]已登上[ROOT.GetCountry.GetName]的皇位，但其威望仍显不足。由于[target_character.GetNameWithNoTooltip]并非紫室降生，许多人认为[target_character.GetHerselfHimself]声望的缺失令[ROOT.GetCountry.GetGovernment.GetCourtTitle]处于弱势。已有流言称，这个[target_character.GetWomanMan]缺乏帝王威仪，比起一名天命君主，[target_character.GetHerHim]更像一个谋权篡位的征服者。有人提出，以堪称奢靡的排场来烘托[target_character.GetNameWithNoTooltip]及其近臣的威望，并以此“重塑”行政体系。"
 culture_greek.14.a: "应投入资金强化[target_character.GetNameWithNoTooltip]的地位。"
 culture_greek.14.b: "仅凭威望何以维系一个国家？"
 culture_greek.14.c: "若他们想见识何为威仪，便让他们亲身体会。"
 culture_greek.15.title: "$STATIC_MODIFIER_NAME_D008_despot_modifier$的分歧"
 culture_greek.15.desc: "尽管[target_character.GetDynasty.GetName]家族在治理[ROOT.GetCountry.GetName]的大业上向来同心同德，却在治国方略上生出了裂痕。[target_character.GetName]与[target_character2.GetName]，就[ROOT.GetCountry.GetGovernment.GetCourtTitle]与王朝的权责绑定方式产生了严重分歧。[target_character.GetShortNameWithNoTooltip]主张宫廷应与王权深度绑定，以便我们能更轻易地管控所有臣民；[target_character2.GetShortNameWithNoTooltip]则持完全相反的观点，认为赋予臣民自治权方能成就更广阔的疆域，让我们得以在广袤的土地上维系各处的影响力。"
 culture_greek.15.a: "应当采纳[target_character.GetShortNameWithNoTooltip]的主张。"
 culture_greek.15.b: "[target_character2.GetShortNameWithNoTooltip]的愿景似乎更具吸引力……"
 culture_greek.15.c: "让他们认清谁才是[ROOT.GetCountry.GetNameWithNoTooltip]的统治者。"
 culture_greek.15.d: "也许他们二人都该向[ROOT.GetCountry.GetGovernment.GetRuler.GetShortNameWithNoTooltip]学习。"
 culture_greek.16.title: "[target_character.GetNameWithNoTooltip]入宫进言"
 culture_greek.16.desc: "[target_character.GetName]的赫赫功绩已传遍[ROOT.GetCountry.GetCapital.GetName]的大街小巷，乃至[ROOT.GetCountry.GetName]全境。众多廷臣皆想一睹这位在我国历史上留下传奇的人物，于是传信召[target_character.GetHerHim]到访[ROOT.GetCountry.GetGovernment.GetCourtTitle]，这为[target_character.GetHerHim]提供了一个与朝中权贵结交往来的机会。\n\n[target_character.GetHerHis]的一众政敌对此极为不满，更有人认为此举会助长[target_character.GetHerHim]的野心，甚至令[target_character.GetHerHim]萌生篡夺[target_character2.GetName]权位、染指[ROOT.GetCountry.GetNameWithNoTooltip]王座的念头。"
 culture_greek.16.a: "我们有何资格剥夺一位伟人在[ROOT.GetCountry.GetGovernment.GetCourtTitle]中发言的权利？"
 culture_greek.16.b: "染指[ROOT.GetCountry.GetGovernment.GetCourtTitle]的可能？我们绝不准许。"
 culture_greek.17.title: "[target_location.GetNameWithNoTooltip]贸易扩张"
 culture_greek.17.desc: "凭借精湛的航海技艺，我们得以在[ROOT.GetCountry.GetName]境内新建港口、开辟商路，[target_location.GetName]便是其中一座新兴[target_location.GetRank.GetName]。为巩固[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]阶层的实力，我们已向其授予贸易特权，大批市民因此涌入此地。\n\n而当地新建的基础设施，更是吸引了[ROOT.GetCountry.GetNameWithNoTooltip]全国各地越来越多的民众前来，市集、船舶与居所的需求也随之激增。相关诉求传来，[target_character.GetName]召集[ROOT.GetCountry.GetGovernment.GetCourtTitle]众臣商议解决方案。"
 culture_greek.17.a: "让我们大力推动[target_location.GetNameWithNoTooltip]的贸易发展。"
 culture_greek.17.b: "我们可以提供帮扶，但前提是他们愿意提供利益交换。"
 culture_greek.17.c: "不如由我们双方共同分摊。"
 culture_greek.18.title: "[target_location.GetNameWithNoTooltip]$a_akritai$玩忽职守"
 culture_greek.18.desc: "边境[target_location.GetRank.GetName][target_location.GetName]的守将玩忽职守，荒废日常操练，背弃了[ROOT.GetCountry.GetName]边疆守护者的职责，致使防区极易遭到敌军的劫掠与入侵。\n\n近期的巡查让我们掌握了更多内情：这支军队的指挥官全靠裙带关系上位，凭家世而非功绩承袭职位；麾下士卒拿着国家拨付的军饷肆意挥霍，终日饮酒作乐，吹嘘着与自身实力完全不符的功绩。我们绝不能坐视不管，任由[target_area.GetName]边境面临失守的风险，必须整肃这支$a_akritai$的军纪。或许[target_character.GetName]应当在此事上更为主动。"
 culture_greek.18.a: "我们已无多余经费投入此事。"
 culture_greek.18.b: "守护边疆是他们的天职，必须让他们记住这一点。"
 all_pop_in_location_lose_satisfaction: "[target_location.GetName]所有[pops|e]会失去[ShowNamedValue('pop_satisfaction_mild_penalty')|+=2%][pop_satisfaction|e]"
 culture_greek.19.title: "[target_location.GetNameWithNoTooltip]的$a_akritai$传奇"
 culture_greek.19.desc: "在大多数的$a_akritai$传奇故事中，为了宣扬[ROOT.GetCountry.GetName]的威名，他们的事迹多有夸大。但对于驻守[target_location.GetName]、戍卫[target_area.GetName]边疆的将士们来说，他们的真实事迹无需修饰便足以为人称道。他们恪尽职守，将敌军拒之门外，也让[target_character.GetName]的名号在这片土地上备受尊崇。\n\n有人质疑这些$a_akritai$故事的真实性，但[ROOT.GetCountry.GetGovernment.GetCourtTitle]之中，也有不少人希望进一步扶持他们，助力他们建立自己的传奇形象——即使这只是为了[ROOT.GetCountry.GetNameWithNoTooltip]的利益。或许[target_character.GetName]也可以尝试提供帮助，为[target_location.GetNameWithNoTooltip]的民众打造一段本土传奇。"
 culture_greek.19.a: "若此举能让$a_akritai$们的功绩广为流传，我们便应大力宣扬他们的故事。"
 culture_greek.19.b: "仅凭他们的忠勇服役，便足以在后人间传颂。"
 culture_greek.20.title: "[target_location.GetNameWithNoTooltip]$a_akritai$请求援助"
 culture_greek.20.desc: "[ROOT.GetCountry.GetName]幅员辽阔，[ROOT.GetCountry.GetFlavorRank]的部分地区难免出现治理疏漏。尽管多数情况并非刻意为之，却仍让当地民众心生不满。正是这份治理上的疏忽，让[target_area.GetName]的民众备感威胁——边境的防务远未达到他们的预期。他们已要求[target_location.GetName]的当地驻军加倍出力、提高警戒，但若要真正抵御劫掠与入侵，还需得到[ROOT.GetCountry.GetGovernment.GetCourtTitle]的支持。\n\n他们的信使已抵达[target_capital.GetName]，请求觐见[target_character.GetName]，恳请我方拨款扩建[target_location.GetNameWithNoTooltip]的城防工事，同时增派兵力——要么补充驻防部队，要么派遣教官指导士卒日常操练。"
 culture_greek.20.a: "我们将守护国家的每一寸疆土。"
 culture_greek.20.b: "我们无法匀出这些资源。"
 culture_greek.21.title: "[target_location.GetNameWithNoTooltip]地中海贸易的衰落"
 culture_greek.21.desc: "新大陆的发现催生了全新的贸易航线，多条新航线的开辟，让我们素来赖以获利的地中海贸易地位日渐式微。我国[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]阶层早已在地中海深耕多年，大多固执己见，不愿放弃现有的海运网络。他们认为，想要摆脱困境，无需背弃传统，只需[ROOT.GetCountry.GetGovernment.GetCourtTitle]提供拨款，并持续推广他们青睐的贸易中心即可。\n\n[target_location.GetName]便是其中一座请求援助的贸易[target_location.GetRank.GetName]，它正因全球贸易航线的转移而日渐萧条。当地恳请我方拨款，资助商人进口新商品，以此创造更多商机，进而重振[target_location.GetNameWithNoTooltip]往日的贸易地位。"
 culture_greek.21.a: "为他们拨付这笔款项。"
 culture_greek.21.b: "若想成为成功的商人，就该学会更好地经营现有产业。"
 culture_greek.21.c: "凭他们的精明程度还不足以解决困境吗？"
 burghers_in_location_lose_satisfaction: "所有[ShowPopTypeName('burghers')][pops|e]会失去[ShowNamedValue('pop_satisfaction_extreme_penalty')|+=2%][pop_satisfaction|e]"
 burghers_in_location_gains_satisfaction: "所有[ShowPopTypeName('burghers')][pops|e]会获得[ShowNamedValue('pop_satisfaction_extreme_bonus')|+=2%][pop_satisfaction|e]"
 culture_greek.22.title: "[target_location.GetNameWithNoTooltip]的诞神女节庆"
 culture_greek.22.desc: "对于每一位虔诚的[ShowReligionAdjective('orthodox')]信徒而言，耶稣基督的降生都是意义非凡的盛事。为此，许多信众都会以耶稣的母亲玛利亚——常被尊称为#italic 诞神女#!（天主之母）的名义举办节庆。\n\n[target_location.GetName]的民众在这场庆典中最为热忱。他们正筹备在本城及周边地区举办节庆，希望能获得一整天的休憩，也愿将这份喜悦分享给每一位愿意同庆的人。事实上，已有不少[ROOT.GetCountry.GetGovernment.GetCourtTitle]成员动身前往这座[target_location.GetRank.GetName]，想要亲眼见证这场盛景；而其中更具虔诚信仰的人，也希望能为当地民众丰富这个神圣的节日。"
 culture_greek.22.a: "实乃一场盛大的庆典。"
 culture_greek.22.b: "我们将与他们同庆。"
 culture_greek.22.c: "即便与他们信仰不同，至少我们应予以尊重。"
 culture_greek.22.d: "绝不容许[ShowReligionAdjectiveWithNoTooltip('orthodox')]传统在[target_location.GetNameWithNoTooltip]传播。"
 all_pops_in_location_gain_satisfaction: "所有[pops|e]会获得[ShowNamedValue('pop_satisfaction_extreme_bonus')|+=2%][pop_satisfaction|e]"
 all_orthodox_pops_in_location_lose_satisfaction: "所有[ShowReligionAdjective('orthodox')][pops|e]会失去[ShowNamedValue('pop_satisfaction_extreme_penalty')|+=2%][pop_satisfaction|e]"
 culture_greek.23.title: "[target_location.GetNameWithNoTooltip]的影响力"
 culture_greek.23.desc: "[target_location.GetName]在[ROOT.GetCountry.GetName]境内的影响力，已让所有人——尤其是居于[target_capital.GetName]的官员们——愈发清晰地感知到。他们十分好奇，这座位于[target_area.GetName]的[target_location.GetRank.GetName]何以声名鹊起，究其根源，主要是[ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')]的扶持，以及一众[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]的资助。底层官僚与富裕的[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]阶层，都从这座[target_location.GetRank.GetNameWithNoTooltip]带来的机遇中获利，当地的[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]也过着奢华优渥的生活。\n\n这一切固然让一部分人获利颇丰，却也导致该地区影响力不断膨胀，削弱了[target_capital.GetName]及其他地区的权势，打破了全国的权力平衡。"
 culture_greek.23.a: "为什么要对一座吸纳着人口与财富的城市加以惩戒？"
 culture_greek.23.b: "考虑到其他城市的顾虑，我们应该限制[target_location.GetNameWithNoTooltip]的发展。"
 all_pops_with_influential_polis_modifier_lose_satisfaction: "拥有[ShowModifier('greek_culture_influential_polis')][modifier|e]的[locations|e]的所有[pops|e]会失去[ShowNamedValue('pop_satisfaction_extreme_penalty')|+=2%][pop_satisfaction|e]"
 all_pops_in_location_lose_satisfaction: "所有[pops|e]会失去[ShowNamedValue('pop_satisfaction_extreme_penalty')|+=2%][pop_satisfaction|e]"
 culture_greek.24.title: "“罗马人”的宣称"
 culture_greek.24.desc: "罗马帝国的影响仍在[ROOT.GetCountry.GetName]的土地上萦绕。尽管我们无权染指$BYZ$的尊号，但民众仍将自己与那个古老的帝国紧密相连，主张[target_character.GetName]应当采取更激进的方略，声索罗马帝国的故土。[ROOT.GetCountry.GetGovernment.GetCourtTitle]中的部分民粹主义者认为，我们不应仅止于收复领土，更应效仿传奇帝王们的规制与名号。[target_capital.GetName]也应复刻相应的风貌，以契合的建筑与美学，为我们声索故土赋予必要的正统性与威望。"
 culture_greek.24.a: "这些“罗马人”早该丢掉他们的幻想了。"
 culture_greek.24.b: "此举或有裨益，也许我们可以推行。"
 culture_greek.25.title: "[ShowLocationNameWithNoTooltip('mystras')]学派"
 culture_greek.25.desc: "声名卓著的[ShowLocationName('mystras')]哲学学派，已将影响力扩散至[ShowRegionName('balkan_region')]、[ShowAreaName('west_anatolia_area')]与[ShowRegionName('italy_region')]地区。\n\n学者们的足迹遍布各地，无论富庶之地还是贫瘠之乡。[target_area.GetName]境内的[target_location.GetName]，便是其中一站。远赴四方游学的青年学者在此驻足，向当地民众分享他们的哲学、文化与修辞学理念。许多当地人，尤其是渴望拓宽眼界的知识分子，都对这些学说产生了浓厚兴趣。\n\n这些学说也引起了[ROOT.GetCountry.GetAdjective]当局的注意，[ROOT.GetCountry.GetGovernment.GetCourtTitle]内部对此看法两极分化。一部分人主张压制任何看似危险的思想与学说，尤其是那些可能动摇[ROOT.GetCountry.GetNameWithNoTooltip]身份认同的内容；而地位较低的另一部分人，则希望放任这些思想传播，因为它们能为我国民众提供宝贵的学习机会。"
 culture_greek.25.a: "他们的学说并无危害，任由他们传播知识即可。"
 culture_greek.25.b: "我们怎能冒风险让[target_location.GetNameWithNoTooltip]滋生激进思想？"
 event_will_only_fire_for_locations_within_mystras_scholarship_geography: "该[event|e]仅在受[ShowScriptedGeographyName('mystras_scholarship_geography')]的[locations|e]触发"
 culture_greek.26.title: "[ROOT.GetCountry.GetAdjectiveWithNoTooltip]本土语的修辞革新"
 culture_greek.26.desc: "罗马时代留下了浩如烟海的著作，它们全部以[ShowLanguageName('latin')]写就，而[ROOT.GetCountry.GetName]的许多民众都不愿学习这门语言。为此，我国饱学之士着手将这些著作译为我国的通用语，即普通民众日常使用的[ROOT.GetCountry.GetCommonLanguage.GetName]。\n\n精英阶层已注意到此事，他们深感威胁：底层民众竟能接触到[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]们耗费数年钻研、精通的典籍。因此，他们在[ROOT.GetCountry.GetGovernment.GetCourtTitle]中就此发声，力主在[ROOT.GetCountry.GetFlavorRank]范围内封禁这些译著，以维护精英阶层的固有地位与声望。"
 culture_greek.26.a: "平民同样拥有学习的权利。"
 culture_greek.26.b: "不惜一切维护[ROOT.GetCountry.GetAdjectiveWithNoTooltip]精英阶层的优越地位。"
 culture_greek.27.title: "[target_character.GetNameWithNoTooltip]请求举办凯旋式"
 culture_greek.27.desc: "[target_character.GetName]再度携辉煌的捷报归来。[target_character.GetHerHis]的队伍在[target_capital.GetName]的街头行进，民众夹道欢迎，高呼[target_character.GetHerHim]的名字，大批最忠诚的亲卫簇拥在[target_character.GetHerHis]身边，护其周全。\n\n抵达[ROOT.GetCountry.GetGovernment.GetCourtTitle]后，[target_character.GetSheHe]请求觐见，得到不情愿的批准。不管政敌或盟友，[target_character.GetSheHe]全然无视周遭朝臣，直直盯着[target_character2.GetName]，要求为[target_character.GetHerHis]举办一场古代礼仪的凯旋式。[target_character.GetSheHe]坚称，必须让所有人知晓自己的功绩，以此提振士气，让所有胆敢以武力对抗[ROOT.GetCountry.GetName]的敌人心生畏惧。"
 culture_greek.27.a: "凯旋仪式排场过大，我们拒绝这种要求。"
 culture_greek.27.b: "若能为[ROOT.GetCountry.GetNameWithNoTooltip]增添荣耀，我们也乐得举办。"
 greek_culture_strategos_will_not_use_triumph_for_popularity: "拒绝为[target_character.GetName]举行凯旋式，[target_character.GetSheHe]可能存在的政变企图将不会取得增长"
 greek_culture_progress_coup_attempt_if_strategos_is_disloyal: "为[target_character.GetName]举行凯旋式，[target_character.GetSheHe]可能存在的政变企图将获得增长"
 culture_greek.28.title: "学者外流"
 culture_greek.28.desc_common: "[ROOT.GetCountry.GetName]国内局势动荡，致使许多有学识之人远走他乡，去别处寻求更好的生活，远离我们麻烦不断的[ROOT.GetCountry.GetFlavorRank]。"
 culture_greek.28.desc.a: "$culture_greek.28.desc_common$\n\n他们渴望过上更稳定的生活，一种能够让他们自由追寻哲学、法律和宗教理想的生活；一种不会被战争、饥荒或死亡瞬间夺走的生活。正因如此，许多人满怀向往地谈论着[target_country.GetName]，那是一个名声在外且稳定的[target_country.GetFlavorRank]，能给予他们梦寐以求的安逸。许多人已开始迁往[target_destination.GetName]，这一情况令我国[ROOT.GetCountry.GetGovernment.GetCourtTitle]中更有见识的成员忧心忡忡。他们认为，这样的迁徙是对[ROOT.GetCountry.GetNameWithNoTooltip]声望的损害，因为它显示出我们无力保护那些虽然无法承受我们当前的危机，却依然对社会有价值的人。"
 culture_greek.28.desc.b: "$culture_greek.28.desc_common$\n\n虽然并没有适合出走的土地，但他们却大谈从书中读到的遥远国度的辉煌：讲[scholar_country.1.GetName]的平民生活富足安逸，与这里的生活形成鲜明反差；讲[scholar_country2.GetName]的统治者不欺压臣民，反而尊重他们作为人的权利；还讲在[scholar_country3.GetName]，让一切运转起来的不是传统，而是创新。\n\n这些言论起初看还没什么害处，但如今已传遍我们[ROOT.GetCountry.GetFlavorRank]的每个角落，社会骚乱由此发生，我国[ROOT.GetCountry.GetGovernment.GetCourtTitle]对此深感忧虑。"
 culture_greek.28.a: "[ROOT.GetCountry.Custom('common_string_nothing_we_can_do')]"
 culture_greek.28.b: "在更多人出逃之前，必须加以阻止。"
 culture_greek.28.c: "他们的言论正在加剧动荡。"
 culture_greek.28.d: "或许我们可以投入资金，避免骚乱进一步扩大。"
 greek_culture_migration_largely_prevented: "大部分[migration|e]将减少"
 culture_greek.29.title: "[ShowBuildingTypeNameWithNoTooltip('orthodox_monastery')]寻求帮助"
 culture_greek.29.desc: "[target_location.GetName]的民众几乎都是虔诚的[ROOT.GetCountry.GetReligion.GetName]信徒，每日向[ROOT.GetCountry.GetReligion.GetGodName]恭顺祈祷。然而，由于缺乏[ROOT.GetCountry.GetName]与政府的扶持，[target_location.GetRank.GetName]中的[ShowBuildingTypeName('orthodox_monastery')]急需新的装饰，以彰显其神圣地位。为此，院内修士遣使上书我国[ROOT.GetCountry.GetGovernment.GetCourtTitle]，恳请[target_character.GetName]拨款修缮这座神圣之所的内外陈设。施以这份恩惠，必将赢得人心，向[ROOT.GetCountry.GetFlavorRank]国民彰显我们对境内[ROOT.GetCountry.GetReligion.GetAdjective]信仰事业的赤诚守护。"
 culture_greek.29.a: "准予拨款，帮助他们修缮装饰。"
 culture_greek.29.b: "[target_character.GetNameWithNoTooltip]不应为随便一处圣地就耗费钱财。"
 culture_greek.29.c: "以一名[ShowReligionNameWithNoTooltip('orthodox')]信者之名，我们不惜耗费重金完成此事。"
 all_orthodox_pops_gain_satisfaction_in_location: "所有[ShowReligionAdjective('orthodox')][pops|e]会获得[ShowNamedValue('pop_satisfaction_extreme_bonus')|+=2%][pop_satisfaction|e]"
 culture_greek.30.title: "帝国遗产"
 culture_greek.30.desc: "东罗马帝国的荣光已然熄灭。尽管如此，我国许多民众仍以“罗马人”自居，[ROOT.GetCountry.GetGovernment.GetCourtTitle]亦部分承袭了旧帝国的传统。这也为我们赋予了一定的正统性，以罗马合法继承者的名义，收复这片古老疆域的部分故土。[ROOT.GetCountry.GetCapital.GetName]的有识之士无不关注着[target_province.GetName]边境，主张从[target_country.GetName]手中收复此地——后者根本不配自称罗马继承者。军方与[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]对此深表认同，共同鼓动民众起兵，夺回本就属于[ROOT.GetCountry.GetName]的疆土。"
 culture_greek.30.a: "罗马疆界，必将光复！"
 culture_greek.30.b: "无需诉诸战火。"
