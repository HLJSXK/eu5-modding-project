l_simp_chinese:
 crisis_of_faith.1.title: "教派分裂"
 crisis_of_faith.1.desc: "对国教的虔诚已然崩溃，信众不再听从其教义。分裂的传教士广纳信徒，而神职人员也分裂为改革派与强硬派。我们必须做出抉择：迁就改革派、寻求妥协，还是以铁血手段镇压这场分裂。"
 crisis_of_faith.1.a: "迁就改革派。"
 crisis_of_faith.1.b: "镇压分裂分子！"
 crisis_of_faith.1.tt: "受动荡影响最深的省份将奋起支持 [ShowDisasterName('crisis_of_faith')] 派系"
 crisis_of_faith.2.title: "异端蔓延"
 crisis_of_faith.2.desc: "有报告称，整个教区都转向了分裂教义。我们可以派遣忠诚的神职人员在蔓延加剧前铲除异端，也可以任其发展，寄望这股狂热自行消退。"
 crisis_of_faith.2.a: "铲除异端。"
 crisis_of_faith.2.b: "任其滋长。"
 crisis_of_faith.3.title: "信众集结"
 crisis_of_faith.3.desc: "In defiance of the schism, devout crowds gather to reaffirm the orthodox faith. Their zeal could rekindle devotion across the realm, though such passions can easily tip into unrest if left unchecked."
 crisis_of_faith.3.a: "顺应这股热忱。"
 crisis_of_faith.3.b: "维持秩序。"
 crisis_of_faith.4.title: "神职人员要求教义改革"
 crisis_of_faith.4.desc: "一批温和派神职人员组成代表团，请求我们修订教会教义，在裂痕扩大前弥合分歧。准许他们的改革将安抚神职人员、延缓分裂，但更改神圣教义绝非小事。若拒绝，则可坚守立场，但要以神职人员的善意为代价。"
 crisis_of_faith.4.a: "准许他们的改革。"
 crisis_of_faith.4.b: "拒绝更改教义。"
 crisis_of_faith.5.title: "宗教裁判的时机"
 crisis_of_faith.5.desc: "我们最狂热的教士恳请准许对分裂派发起宗教裁判。一场清洗将重振信仰、震慑异端，但由此引发的恐惧将波及全境。我们也可以选择克制，让百姓免受更多苦难。"
 crisis_of_faith.5.a: "发起宗教裁判。"
 crisis_of_faith.5.b: "保持克制。"
 crisis_of_faith.100.title: "异端已被镇压"
 crisis_of_faith.100.desc: "The schism has been mended. The schismatic preachers are scattered, their followers returned to the fold, and the clergy reunited beneath the orthodox banner. Our church stands renewed, its authority and our devotion restored."
 crisis_of_faith.100.a: "信仰长存。"
 crisis_of_faith.101.title: "分裂教义根深蒂固"
 crisis_of_faith.101.desc: "The schism has prevailed. The reformed doctrine takes root in our churches and our courts, and the old orthodoxy is cast aside. For a generation, our realm will live with a divided faith and a clergy that no longer answers wholly to our throne."
 crisis_of_faith.101.a: "分裂占了上风。"
 crisis_of_faith.10.title: "Preach Renewal"
 crisis_of_faith.10.desc: "我们派遣最虔诚的教士深入民间，宣讲复兴，召唤信徒归心。他们的布道在国中重燃虔诚之火，削弱了分裂派的追随者，然而这场大复兴带来的动荡也扰乱了原有的秩序。"
 crisis_of_faith.10.a: "派出传教士。"
 crisis_of_faith.11.title: "Convene a Synod"
 crisis_of_faith.11.desc: "我们召集教士召开大公会议，一劳永逸地解决教义之争。与会的高级教士们团结一致，捍卫正统教义，孤立了分裂派系，也为教会恢复了几分统一。"
 crisis_of_faith.11.a: "召开会议。"
 crisis_of_faith.1.a.tt: "一些受动荡影响最深的省份中的神职人员仍将加入 [ShowDisasterName('crisis_of_faith')] 派系"
 crisis_of_faith.10.a.tt: "所有当前支持 [ShowDisasterName('crisis_of_faith')] 派系的民众都将获得一定满意度"
 crisis_of_faith.101.b: "让异端领袖登上王座。"
 crisis_of_faith.101.desc.heresiarch: "分裂已然得势，如今也有了一张面孔。[crisis_of_faith_heresiarch_scope.GetName]宣讲改革教义，直至无人能再压制其声，尽管真正在战场上击溃我们权威的，是那些揭竿而起的教士。如今得胜的教士们拥立[crisis_of_faith_heresiarch_scope.GetHerHis]的登位，我们的教会中已无人愿意再拒绝他们。我们曾誓死捍卫的神圣之物，就这样悄然被弃置一旁。"
 crisis_of_faith.102.a: "教会已不再由我们治理。"
 crisis_of_faith.102.desc: "我们已不再以教会之名统治。无论分裂者宣讲何种教义，我们的教士都不会予以回应，因为他们已不再代表国家发声。我们曾放弃捍卫的教义，仍留存在信徒的口中，而那些为我们坚守旧正统的人，也记得是谁抛弃了他们。"
 crisis_of_faith.102.title: "信仰已被弃守"
 crisis_of_faith.11.a.tt: "所有当前支持 [ShowDisasterName('crisis_of_faith')] 派系的民众都将获得一定满意度"
 crisis_of_faith.12.a: "重新买回其忠诚。"
 crisis_of_faith.12.b: "我们无法监管每一座大厅。"
 crisis_of_faith.12.desc: "分裂派的事业找到了金主。[crisis_of_faith_heresiarch_scope.GetName] 已在我们领地的一座大厅中受到接待，而那位敞开大门的贵族如今正出资抄录我们所禁止的教义讲章。我们可以暗中出价换回其忠诚，也可以承认我们无法监管境内的每一座大厅。"
 crisis_of_faith.12.title: "分裂派的资助者"
 crisis_of_faith.13.a: "压制这场讲道。"
 crisis_of_faith.13.b: "让信众自行判断。"
 crisis_of_faith.13.desc: "[crisis_of_faith_heresiarch_scope.GetName] 已不再于地窖中传道。一群人聚集在集市广场上，公然听人宣讲分裂派教义，却无人上前阻止。压制这场讲道将表明我们的教会仍握有权威，然而在众目睽睽之下将传道者拖离讲坛，本身也是一桩丑闻。"
 crisis_of_faith.13.title: "公开传道"
 crisis_of_faith.6.a: "查明异端教首的身份。"
 crisis_of_faith.6.a.tt: "异端教首的身份已被查明，解锁了“公开谴责异端教首”行动"
 crisis_of_faith.6.desc: "我们的探子已经沿着抄写员和信使的路线，追查了那些禁忌布道的传播踪迹，而每一条线索最终都指向同一扇门。[crisis_of_faith_heresiarch_scope.GetName]正是分裂教义的作者，而在此之前，[crisis_of_faith_heresiarch_scope.GetSheHe]一直在我们自己的教会内部传播这一教义。"
 crisis_of_faith.6.title: "分裂背后的黑手"
 crisis_of_faith.7.a: "在信徒面前定罪异端教首。"
 crisis_of_faith.7.a.fail_tt: "王权尚不足以对异端教首采取行动"
 crisis_of_faith.7.desc.not_ready: "我们本欲在众信徒面前指名[crisis_of_faith_heresiarch_scope.GetName]，就此终结这场分裂，但王权尚未能掌控局势。庇护[crisis_of_faith_heresiarch_scope.GetHerHim]的教士势力，比欲加以问罪、想要定[crisis_of_faith_heresiarch_scope.GetHerHim]之罪的王权更为强大，一旦谴责失败，人们记住的将是一次遭到拒绝的谴责。"
 crisis_of_faith.7.desc.ready: "王权再度拥有了威信，此刻正是运用它的时机。我们将在众信徒面前公开[crisis_of_faith_heresiarch_scope.GetName]的姓名，详述[crisis_of_faith_heresiarch_scope.GetHerHis]的种种谬误，剥夺使这场分裂得以发生的[crisis_of_faith_heresiarch_scope.GetHerHim]的一切地位。没有了始作俑者，那所谓革新的教义便只是一则谣言。"
 crisis_of_faith.7.title: "公开谴责异端教首"
 crisis_of_faith.8.a: "任由他们保有其教义。"
 crisis_of_faith.8.desc: "这场分裂无法以强力平息，只能以让步换取平息。我们将允许改革者获得他们所要求的教义，以及随之而来的教会地位。这一派系将随之解散，其布道者也将返回如今已理应归属他们的教区。我们的信仰将因此一蹶不振，而这一让步将无可挽回。"
 crisis_of_faith.8.title: "向分裂派让步"
