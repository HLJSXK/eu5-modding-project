l_simp_chinese:
 twilight_of_the_tsardom.1.title: "$rank_empire_bulgarian$的黄昏"
 twilight_of_the_tsardom.1.desc: "曾经高举我们的旗帜横扫[ShowRegionName('balkan_region')]的力量现在逐年衰弱。我们的权威变得空洞，敌人自四面八方入侵。过去的战争和内乱的伤痕远未愈合，若不采取果断行动，[GetCountry('BUL').GetFlavorRank]可能很快就会沦为回忆。我们必须尽一切努力阻止发生在[GetCountry('BUL').GetAdjective]第一帝国身上的灾难性崩溃。"
 twilight_of_the_tsardom.1.a: "[GetCountry('BUL').GetFlavorRank]不会灭亡！"
 twilight_of_the_tsardom.1.a.tt: "未拥有[ShowLocationName('constantinople')]完成$twilight_of_the_tsardom$[disaster|e]会产生以下影响："
 twilight_of_the_tsardom.1.a.tt2: "拥有[ShowLocationName('constantinople')]完成$twilight_of_the_tsardom$[disaster|e]会产生以下影响："
 twilight_of_the_tsardom.1.a.tt3: "拥有[ShowLocationName('constantinople')]且是[great_power|e]完成$twilight_of_the_tsardom$[disaster|e]会产生以下影响："
 twilight_of_the_tsardom.1.historical_info: "1241年伊凡·阿森二世去世后，保加利亚陷入了长期的衰弱，统治无力、贵族内斗和蒙古人的劫掠困扰着保加利亚。历任统治者未能抵御外国侵略，领土大量损失。内部动荡在伊瓦伊洛起义时达到顶峰，并在数十年的内乱和外部干预中延续。尽管14世纪初出现了短暂的复苏，但1330年在韦尔巴日德的失败和新的外部压力使保加利亚在1337年愈发虚弱，并且一直无力恢复，最终灭亡于奥斯曼帝国之手。"
 twilight_of_the_tsardom.2.title: "这$rank_empire_bulgarian$持久"
 twilight_of_the_tsardom.2.desc: "尽管困难重重，$rank_empire_bulgarian$经历了多年的混乱、阴谋和衰落。尽管伤痕犹存，王国尚未完全恢复，但我们挺过了许多人认为我们会倒下的地方。暮色已逝，但新的黎明是否在等待着我们，仍有待观察。"
 twilight_of_the_tsardom.2.a: "我们将重建失去的一切。"
 twilight_of_the_tsardom_modifier_removal_tt: "[ShowModifier('bul_powerful_local_elites')]将从治下所有拥有该修正的地点移除"
 twilight_of_the_tsardom.3.title: "[GetCountry('BUL').GetNameWithNoTooltip]再度崛起"
 twilight_of_the_tsardom.3.desc: "从深重危机中挣脱后，[GetCountry('BUL').GetName]不仅完成了经济复苏，国力也显著增强。在国家最动荡的黑暗岁月里，几乎无人能够预料我们最终能攻克[ShowLocationName('constantinople')]。如今，$rank_empire_bulgarian$已成为[ShowRegionName('balkan_region')]半岛上一支不可忽视的强大力量，所有曾轻视我国实力的势力，都不得不正视我们的崛起。"
 twilight_of_the_tsardom.3.a: "让世界承认我们的力量！"
 twilight_of_the_tsardom.4.title: "新帝国的黎明"
 twilight_of_the_tsardom.4.desc: "曾一度濒临覆灭的[GetCountry('BUL').GetAdjective]$rank_empire_bulgarian$，如今已跻身世界顶尖强国之列。在求生的磨难中，我们凝聚起力量与希望，最终铸就了全新帝国的崛起。掌控[ShowLocationName('constantinople')]之后，这个国家注定将在历史上留下浓墨重彩的一笔。此刻，便是[GetCountry('BUL').GetAdjectiveWithNoTooltip]第三帝国立国之日——这一日，必将永载史册！"
 twilight_of_the_tsardom.4.a: "黄金时代自此开启！"
 twilight_of_the_tsardom.5.title: "地方精英质疑我们的权威"
 twilight_of_the_tsardom.5.desc: "[target_location.GetName]的地方精英已开始独立行动，无视我们的法令，仿佛自己是君主一样治理其土地。中央权威的削弱也许很快会激励其他人效仿。若不果断采取行动，可能会导致更大的分裂。"
 twilight_of_the_tsardom.5.a: "我们有更要紧的事务。"
 twilight_of_the_tsardom.5.b: "重申我们对[target_location.GetNameWithNoTooltip]的控制。"
 twilight_of_the_tsardom.6.title: "廷臣被指控叛国"
 twilight_of_the_tsardom.6.desc: "我们最信任的顾问之一[target_character.GetName]近期受到了严重怀疑。[target_character.GetSheHe|U]被指控收受外国势力的钱财，并泄露了关于$rank_empire_bulgarian$的敏感信息。尽管尚未发现明确的证据，但仅是这些指控就在[ROOT.GetCountry.GetGovernment.GetCourtTitle]内部引起了不安。如果我们无视此事，叛国者可能会在圈子里肆无忌惮地行事；然而，操之过急可能会让忠仆受到不公正的惩罚。"
 twilight_of_the_tsardom.6.a: "马上把[target_character.GetHerHim]免职！"
 twilight_of_the_tsardom.6.b: "这肯定只是谣言……"
 twilight_of_the_tsardom.7.title: "军队哗变"
 twilight_of_the_tsardom.7.desc: "领不到军饷的士兵忿忿不平，军官努力维持着秩序，我们军队的士气正在崩溃。随着领饷日的推迟，以及指挥链的日益脆弱，曾经是我们力量支柱的士兵如今成为了国家的威胁。"
 twilight_of_the_tsardom.7.a: "马上把欠饷发了。"
 twilight_of_the_tsardom.7.b: "我们负担不起。"
 twilight_of_the_tsardom.7.c: "在兵变蔓延前将其粉碎！"
 twilight_of_the_tsardom.8.title: "叛逆的附属国"
 twilight_of_the_tsardom.8.desc: "都城收到密报，[subject_target.GetName]的统治阶层愈发桀骜不驯，暗中串联密谋，不断试探我国底线。虽然该地尚未公然起兵叛乱，但据我方密探回报，该国[subject_target.GetGovernment.GetCourtTitle]中充斥着谋求独立的流言。"
 twilight_of_the_tsardom.8.a: "通过让步安抚他们。"
 twilight_of_the_tsardom.8.b: "我们目前做不了什么。"
 twilight_of_the_tsardom.9.title: "欠饷守军"
 twilight_of_the_tsardom.9.desc: "我们在[target_location.GetName]的守军越来越叛逆，他们指责地方长官忽视防御，并且拒绝向守军支付工资。这些士兵的任务是守卫保护整个[target_area.GetName]的关键堡垒，现在他们认为没有理由继续忠于不发饷的王室。"
 twilight_of_the_tsardom.9.a: "马上发饷！"
 twilight_of_the_tsardom.9.b: "强迫地方精英出资。"
 twilight_of_the_tsardom.9.c: "我们没钱。"
 twilight_of_the_tsardom.10.title: "阶层对立"
 twilight_of_the_tsardom.10.desc: "近些年来中央权威的削弱给了$rank_empire_bulgarian$各阶层信心，每个阶层都在争夺对虚弱[GetEstateName('crown_estate')]的更大影响力。激烈的竞争已激化为公开的敌对，我们越来越难以维持中立。也许我们只能以加深领地裂痕为代价确保其中一方的忠诚，否则可能面临双方的针对。"
 twilight_of_the_tsardom.10.a: "我们应该支持[first_estate.GetNameWithNoTooltip]。"
 twilight_of_the_tsardom.10.b: "让我们保护[second_estate.GetNameWithNoTooltip]的利益。"
 twilight_of_the_tsardom.10.c: "不选边站。"
 bul_restore_the_realms_unity: "恢复领地统一"
 bul_restore_the_realms_unity_desc: "曾经是[GetCountry('BUL').GetFlavorRank]不可分割的一部分的地区已经脱离了我们的控制，不再臣服于王权。若想度过这场黄昏，我们必须确保国家的统一。如果有必要的话，采取武力……"
 bul_reassert_our_authority: "重申我们的权威"
 bul_reassert_our_authority_desc: "随着[GetCountry('BUL').GetName]国力日渐衰落，各地贵族势力日益嚣张。他们藐视[GetCountry('BUL').GetFlavorRank]权威，在各自的领地上自行其是。我们必须收复失地，迫使贵族臣服，阻止国家进一步分裂。"
 bul_push_for_diplomatic_reintegration: "外交手段推进再整合"
 bul_push_for_diplomatic_reintegration_desc: "为规避内战爆发，我们划出部分土地交由领主名义代管。这一安排仅能维持短期稳定，长远来看，必须通过外交手段重新统一$rank_empire_bulgarian$，分裂的国家难以承受未来接踵而至的灾难。"
 twilight_of_the_tsardom.11.title: "被秃鹫包围"
 twilight_of_the_tsardom.11.desc: "当本国深陷内乱之际，周边邻国如秃鹫环伺濒死之兽般虎视眈眈。它们早已窥破我们的虚弱，紧盯局势变化，只待时机成熟便欲瓜分$rank_empire_bulgarian$的残余疆土。最新情报表明，[target_country.GetName]已公然索要[border_claim_province.GetName]主权，正蓄谋趁乱夺取这片土地。"
 twilight_of_the_tsardom.11.a: "然他们放马过来！"
 twilight_of_the_tsardom.11.b: "纳贡以换取他们放弃宣称。"
