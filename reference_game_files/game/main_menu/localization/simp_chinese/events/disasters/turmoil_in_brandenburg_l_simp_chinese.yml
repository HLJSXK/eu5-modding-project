 turmoil_in_brandenburg.1301.title: "[robber_baron_province.GetNameWithNoTooltip]的强盗贵族"
 turmoil_in_brandenburg.1301.entry: "目标省份的强盗贵族"
 turmoil_in_brandenburg.1301.desc: "强盗贵族的祸害已蔓延到[robber_baron_province.GetName]。他们的罪行和傲慢就如同在我们脸上吐了一口唾沫。是时候给他们一个教训，重建国家的中央权威了。"
 turmoil_in_brandenburg.1301.a: "我们会适时解决他们。"
 turmoil_in_brandenburg.1302.title: "冯·奎措家族"
 turmoil_in_brandenburg.1302.entry: "$turmoil_in_brandenburg.1302.title$"
 turmoil_in_brandenburg.1302.desc: "在所有强盗贵族中，冯·奎措家族的影响力几乎无人能比。他们在整个[ShowProvinceDefinitionName('mittelmark_province')]地区拥有大量田产庄园。即使这样，他们仍然为非作歹。我们会在他们制造彻底的混乱前，征服他们的地产，并在他们身上踏上一万只脚，让他们永世不得翻身。"
 turmoil_in_brandenburg.1302.a: "我们必须解决他们！"
 turmoil_in_brandenburg.1302.b: "我们最好谨慎行事。"
 turmoil_in_brandenburg.1302.historical_info: "冯·奎措家族是15世纪初勃兰登堡最具影响力的贵族家族。弗里德里希一世·冯·霍亨索伦于1411年至1415年间对边区进行集权时，著名的强盗贵族汉斯和迪特里希两兄弟成为了新选帝侯的目标，他征服了他们的城堡，终结了勃兰登堡的冯·奎措霸权时代。"
 STATIC_MODIFIER_NAME_PRU_quitzow_modifier: "冯·奎措的影响力"
 STATIC_MODIFIER_NAME_PRU_quitzow_repressed_modifier: "压制冯·奎措家族"
 bra_quitzow_revolt: "奎措叛乱"
 turmoil_in_brandenburg.1303.title: "终结强盗贵族统治"
 turmoil_in_brandenburg.1303.entry: "$turmoil_in_brandenburg.1303.title$"
 turmoil_in_brandenburg.1303.desc: "经过多年的努力，我们终于成功遏制住了猖狂的[ShowEstateTypeName('nobles_estate')]们。截至目前，国内的所有贸易路线摆脱了贵族出身的强盗的劫掠，普通人再也没什么好怕的了。如今，大多数平民不再向[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]支付保护费。"
 turmoil_in_brandenburg.1303.a: "[ROOT.GetCountry.GetFlavorRank]再次稳定。"
 STATIC_MODIFIER_NAME_PRU_end_of_robber_barons: "强盗贵族时代的终结"
 robber_barons_aftermath_tt: "强盗贵族已被剿灭"
 turmoil_in_brandenburg.1304.title: "惩罚强盗贵族"
 turmoil_in_brandenburg.1304.entry: "$turmoil_in_brandenburg.1304.title$"
 turmoil_in_brandenburg.1304.desc: "尽管我们成功平定了反叛的[ShowEstateTypeName('nobles_estate')]，但[ROOT.GetCountry.GetGovernment.GetCourtTitle]中许多人认为，仅仅击败他们毫无用处，[ROOT.GetCountry.GetGovernment.GetRulerTitle]应该让他们为背叛付出代价。虽然许多人支持这一措施，但也有些人认为没有必要进一步疏远贵族，特别是我们已经重新确立了控制权。"
 turmoil_in_brandenburg.1304.a: "他们将为背叛付出代价！"
 turmoil_in_brandenburg.1304.b: "稍微惩罚一下。"
 turmoil_in_brandenburg.1304.c: "没必要进一步惩罚。"
