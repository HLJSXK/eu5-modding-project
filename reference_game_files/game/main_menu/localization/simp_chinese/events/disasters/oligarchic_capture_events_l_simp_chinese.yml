l_simp_chinese:
 oligarchic_capture.1.title: "派系崛起"
 oligarchic_capture.1.desc: "多年的衰败已使我们的共和体制空洞不堪。一个占据支配地位的阶层察觉到当局的软弱，遂图谋独揽立法机构，排斥政敌，肆意曲解法律以遂私欲。我们必须决定如何应对这一挑战：是向该派系低头以维系脆弱的和平，还是与之对抗，冒公开叛乱之险。"
 oligarchic_capture.1.a: "屈从于该派系的要求。"
 oligarchic_capture.1.b: "不惜一切代价，与之抗争！"
 oligarchic_capture.1.tt: "最为不满的行省将揭竿而起，支持 [ShowDisasterName('oligarchic_capture')] 派系"
 oligarchic_capture.2.title: "寡头索取贡金"
 oligarchic_capture.2.desc: "该派系的首领向我们提出一项索取钱财的要求，虽美其名曰“公益捐输”，实则昭然若揭。若答应缴纳，他们的躁动便可暂时平息；若加以拒绝，他们便会借此煽动更多人支持其事业。"
 oligarchic_capture.2.a: "用钱打发他们。"
 oligarchic_capture.2.b: "我们绝不受此勒索。"
 oligarchic_capture.3.title: "市民集会要求改革"
 oligarchic_capture.3.desc: "民众聚集于广场，呼吁恢复清明政治，终结派系专权。他们的热情正是重拾共和精神的良机，然而放纵群情亦有失序之险。"
 oligarchic_capture.3.a: "声援其事业。"
 oligarchic_capture.3.b: "维持街头秩序。"
 oligarchic_capture.4.title: "元老院派系遭清洗"
 oligarchic_capture.4.desc: "寡头们意图驱逐一批他们视为不忠的元老。若任由清洗进行，短期内可安定局势，却使该派系再添一胜；若出手保护被指控者，则可捍卫我们的体制，但恐招致更多动荡。"
 oligarchic_capture.4.a: "任由清洗进行。"
 oligarchic_capture.4.b: "保护被指控者。"
 oligarchic_capture.5.title: "街头骚乱"
 oligarchic_capture.5.desc: "该派系的党羽与其对手之间的争斗蔓延到了市场与码头。我们可以放任情绪自行平息，也可以派遣卫队以强硬手段恢复秩序。"
 oligarchic_capture.5.a: "让情绪自行平息。"
 oligarchic_capture.5.b: "严厉镇压。"
 oligarchic_capture.100.title: "The Republic Restored"
 oligarchic_capture.100.desc: "该派系的控制已被打破。我们的法庭、议事会与议会再次向公民负责，而非听命于一小撮显贵。共和国经受住了这场风暴，其制度也在这场考验中愈发坚韧。"
 oligarchic_capture.100.a: "我们的制度经受住了考验。"
 oligarchic_capture.101.title: "寡头宪制根深蒂固"
 oligarchic_capture.101.desc: "该派系获胜了。一部为寡头服务而制定的新宪法，将他们的统治牢牢锁进了国家的根基之中。此后一代人的时间里，我们的共和国将徒有其名，官职将在少数权贵之间轮流交易。"
 oligarchic_capture.101.desc.ringleader: "该派系获胜了，其首领 [oligarchic_ringleader_scope.GetName] 从元老院的密室之中走出，径直登上了王座。此后一代人的时间里，我们的共和国将徒有其名，官职将在少数权贵之间轮流交易。"
 oligarchic_capture.101.a: "该派系获胜了。"
 oligarchic_capture.101.b: "[oligarchic_ringleader_scope.GetName] 登上了王座。"
 oligarchic_capture.6.title: "揭露幕后首领"
 oligarchic_capture.6.desc: "我们的密探数周来一直在追查该派系内部的金钱、恩惠与密令的流向。最终，一个真正掌控全局的名字浮出水面：[oligarchic_ringleader_scope.GetName]。"
 oligarchic_capture.6.a: "如今我们知道该对付谁了。"
 oligarchic_capture.7.title: "Confront the Ringleader"
 oligarchic_capture.7.desc.ready: "既然 [oligarchic_ringleader_scope.GetName] 已被揭穿，我们便可直接对其采取行动。王室自身的权威已恢复到足以迅速瓦解该派系的程度。"
 oligarchic_capture.7.desc.not_ready: "既然 [oligarchic_ringleader_scope.GetName] 已被揭穿，我们本可直接对其采取行动，但王室自身的权威尚未恢复到位。操之过急，恐怕只会让该派系更加团结。"
 oligarchic_capture.7.a: "对他们采取行动。"
 oligarchic_capture.7.a.fail_tt: "我们的 [crown_power|e] 尚未达到30%，因此此次行动失败，其反噬使我们的稳定度付出惨重代价"
 oligarchic_capture.8.title: "Negotiate Estate Concessions"
 oligarchic_capture.8.desc: "与其正面对抗该派系，我们不如私下开辟一条谈判渠道，以金钱与些许让步来平息其不满，延缓其壮大之势。"
 oligarchic_capture.8.a: "展开谈判。"
 oligarchic_capture.12.title: "首领向廷臣示好"
 oligarchic_capture.12.desc: "有消息传来，该派系的首领一直在暗中拉拢我们宫廷中的一名廷臣，以恩惠与承诺换取支持。我们可以对此视而不见，也可以出手巩固该廷臣对王室的忠诚。"
 oligarchic_capture.12.a: "由它去吧，不值得为此费心。"
 oligarchic_capture.12.b: "重申该廷臣对王室的忠诚。"
 oligarchic_capture.13.title: "首领试探王室领地"
 oligarchic_capture.13.desc: "该派系首领当众试探王室领地的权威还能延伸多远，在满朝文武面前寻找可乘之机。我们可以对此挑衅置之不理，也可以严正回应。"
 oligarchic_capture.13.a: "对挑衅不予理会。"
 oligarchic_capture.13.b: "严正回应。"
 oligarchic_capture.10.title: "Rally the Citizenry"
 oligarchic_capture.10.desc: "传令官将我们的号召传遍每一处坊区与市集：共和国属于其公民，而非属于一小撮权贵。广场上聚满了愿意重申旧秩序的民众，但这样的集会难免伴随着骚乱之险。"
 oligarchic_capture.10.a: "前往广场！"
 oligarchic_capture.11.title: "Purge the Oligarchs"
 oligarchic_capture.11.desc: "我们决意直接打击该派系的首脑。大批人员被捕，其关系网被瓦解，他们对我国各机构的掌控也随之松动。贵族对这般强硬手段颇为不满，举国为之震动，但寡头势力就此受挫。"
 oligarchic_capture.11.a: "打击他们的首领。"
 oligarchic_capture.7.a.success_tt: "我们的 [crown_power|e] 已达到30%或以上，因此此次行动成功"
