l_simp_chinese:
 ap_falls_desc_key: "尽管遭受了守军的顽强抵抗，经过一场激烈的攻城战后，[target_location.GetName]终于在我们伟大军队的威力面前屈服。在其城墙背后盘踞着着一个强大的宗教权威，这座[target_location.GetRank.GetNameWithNoTooltip]曾容纳[ShowReligionAdjective('orthodox')]信仰的尊贵人士讲经传道。而我们面临的问题是，应该废除这样的机构，还是将其纳入我们的保护之下？"
 ap_diplomatic_desc_key: "随着[target_location.GetName]纳入[scope:winner.GetName][scope:winner.GetFlavorRank]版图，"
 ap_falls_desc_key_2: "城内驻有强大的宗教权威，这座[target_location.GetRank.GetNameWithNoTooltip]曾是[ShowReligionAdjective('orthodox')]高阶圣职人员的居所。现在的抉择是，我们应该废除这个宗属机构，还是将其纳入我方庇护之下？"
 autocephalous_patriarchates.1.title: "自主教会圣座陷落！"
 autocephalous_patriarchates.1.desc: "$ap_falls_desc_key$"
 autocephalous_patriarchates.1.desc_diplomatic: "$ap_diplomatic_desc_key$[target_ap.GetName]的教座现已归入我方掌控。如何处置这一宗主教机构，由我们决断。"
 autocephalous_patriarchates.1.a: "解散牧首教座。"
 autocephalous_patriarchates.1.b: "保留牧首教座。"
 autocephalous_patriarchates.1.c: "现在，该由我们来与这个牧首打交道了。"
 every_member_of_scopeloser_ap_loses_opinion_of_scopewinner_tt: "[target_ap.GetName]的所有成员对我国失去[ShowBiasValue('destroyed_my_autocephalous_patriarchate')|+=0]好感"
 every_member_of_winner_ap_gains_opinion_of_scopewinner_tt: "[target_winner_ap.GetName]所有成员对我们的好感增加[ShowBiasValue('destroyed_another_autocephalous_patriarchate')|+=0]"
 autocephalous_patriarchates.2.title: "自主教会圣座陷落！"
 autocephalous_patriarchates.2.desc: "$ap_falls_desc_key$"
 autocephalous_patriarchates.2.desc_diplomatic: "$ap_diplomatic_desc_key$$ap_falls_desc_key_2$"
 autocephalous_patriarchates.2.a: "解散牧首教座。"
 autocephalous_patriarchates.2.b: "保留它。"
 autocephalous_patriarchates.3.title: "[target_location.GetNameWithNoTooltip]教座重建"
 autocephalous_patriarchates.3.desc: "随着[recipient.GetName]迁往[target_location.GetName]，[target.GetType.GetName]的荣光得以复归。从今往后，牧首区将以配得上这一崇高席位的威严与虔敬，统领教务。"
 autocephalous_patriarchates.3.a: "为了[ROOT.GetCountry.GetReligion.GetNameWithNoTooltip]更大的荣耀！"
