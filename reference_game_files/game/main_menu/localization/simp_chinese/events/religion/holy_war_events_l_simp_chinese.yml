l_simp_chinese:
 holy_war.1.title: "A Call to the Holy War"
 holy_war.1.desc: "Preachers have come to our court, their voices hoarse with fervor, calling on every true believer to take up arms against [preach_io.GetTarget.GetName]. The eyes of the faithful turn to us. Will we answer the call?"
 holy_war.1.a: "We take up the cause!"
 holy_war.1.b: "Not at this time."
 holy_war.2.title: "A Levy for the Holy War"
 holy_war.2.desc: "Envoys arrive from the [levy_leader.GetLongName], which leads the [levy_io.GetName], bearing a solemn plea. The holy war against [levy_io.GetTarget.GetName] devours coin as swiftly as it spills blood, and as brothers in the faith we are called upon to fill its war-chest. Will we open our coffers to the cause?"
 holy_war.2.a: "Pay a modest sum."
 holy_war.2.b: "Pay generously."
 holy_war.2.c: "Better to join the cause ourselves."
 holy_war.2.d: "We will not be taxed for another's war."
 holy_war.3.title: "Our People Converted"
 holy_war.3.desc: "In the lands the enemy has torn from us, their clergy move from village to village, forcing our people to abandon the faith of their fathers or suffer for it. Word of every conversion reaches our court, and this outrage will not be forgotten."
 holy_war.3.a: "他们必将为此付出代价。"
 holy_war.3.a.tt: "We take no action against the forced conversions"
 holy_war.4.title: "A Rebuke from the Faithful"
 holy_war.4.desc: "The leader of the holy war accuses us of shirking our sacred duty, and threatens grave consequences should we not prove our devotion. How do we respond?"
 holy_war.4.a: "We swear to redouble our efforts."
 holy_war.4.b: "We answer to no one."
 holy_war.6.title: "The Faithful are Pleased"
 holy_war.6.desc: "Word of our renewed zeal for the holy war has carried far, and the leaders of the faithful now speak our name with warmth. Where once there was doubt, there is favor."
 holy_war.6.a: "#italic Deus vult#!."
 holy_war.7.title: "Our Call is Answered"
 holy_war.7.desc: "[preach_target.GetName] have heeded our preaching and joined the holy war, pledging sword and treasure to the cause. Another sword is drawn for the faith, and the host swells."
 holy_war.7.a: "The faithful gather."
 holy_war.8.title: "Our Call is Refused"
 holy_war.8.desc: "[preach_target.GetName] have turned a deaf ear to our preaching, offering cold words and closed gates, and will not join the holy war. The faithful will remember the slight."
 holy_war.8.a: "就这样吧。"
 holy_war.8.a.tt: "They ignored our offer"
 holy_war.9.title: "The Offer of a Cardinal Seat"
 holy_war.9.desc: "[cardinal_offerer.GetName], as leader of the [crusade|e], offer to elevate one of our prelates to a cardinal's seat should we take up the cross, a seat to be built in our own capital. Such patronage would bind us to the holy cause. Do we accept?"
 holy_war.9.a: "We accept this honor and join the Crusade."
 holy_war.9.b: "We decline the offer."
 holy_war.10.title: "An Offer of Recognition"
 holy_war.10.desc: "[recognition_offerer.GetName], as leader of the [jihad|e], offer to recognize our standing among the faithful, a grant of religious authority and legitimacy, should we join the holy war against the unbelievers. Do we accept?"
 holy_war.10.a: "We accept and join the Jihād."
 holy_war.10.b: "We decline the offer."
 holy_war.13.title: "The Infidel Pays"
 holy_war.13.desc: "Our demand has borne fruit. [parias_payer.GetName] have paid the tribute rather than face the [crusade|e] unready. Their coin swells our coffers, and their reprieve is only that, a reprieve. The holy war is merely postponed."
 holy_war.13.a: "Their gold serves the holy cause."
 holy_war.13.a.tt: "They paid the tribute"
 holy_war.14.title: "The Infidel Defies Us"
 holy_war.14.desc: "[parias_payer.GetName] have spurned our demand for tribute and chosen defiance. Their insolence has only hardened the resolve of the faithful, and the [crusade|e]'s fervor burns the brighter for it."
 holy_war.14.a: "Then the sword shall answer."
 holy_war.14.a.tt: "They refused to pay the tribute"
 holy_war.17.title: "A Miraculous Recovery"
 holy_war.17.desc: "A common soldier, given up for dead by the camp physicians, has risen from his sickbed hale and whole, and many are already calling it the work of Heaven. Yet in the grip of his fever he was visited by strange and troubling dreams, visions he swears foretold what is to come, and the men murmur of them with unease. How do we treat the matter?"
 holy_war.17.a: "Proclaim his recovery a miracle and rally the host!"
 holy_war.17.a.tt: "Raises the holy war's religious zeal by #G 5#!"
 holy_war.17.b: "Hush the matter before fear takes hold."
 holy_war.18.title: "Fervor Wanes in the Camp"
 holy_war.18.desc: "The long wait wears cruelly on the host. Prayers that once rang out with fervor are now muttered by rote, tempers fray over the smallest trifles, and old feuds smolder anew around the campfires each night. The ardor that first drew the faithful to the cause has cooled to grey ash, and unless something rekindles their spirit soon, the whole enterprise may waste away before a single blow is struck. What is to be done?"
 holy_war.18.a: "Hold a great sermon and feast for the host."
 holy_war.18.a.tt: "Raises the holy war's religious zeal by #G 8#!"
 holy_war.18.b: "The faithful must find their own fire."
 holy_war.18.b.tt: "Lowers the holy war's religious zeal by #R 5#! and sets back its preparation by #R 5#!"
 holy_war.19.title: "A Firebrand Preacher"
 holy_war.19.desc: "A wild-eyed preacher has appeared at the edge of the camp, his robes travel-worn and his voice gone raw from days of ceaseless exhortation. His burning words draw a swelling throng of the poor and the pious, laborers and landless men alike, all of them clamoring to march for the faith this very hour. He is fervent beyond all reason and utterly unruly, and no lord among us holds any command over him. How shall we treat this firebrand?"
 holy_war.19.a: "Give him free rein to gather the faithful."
 holy_war.19.a.tt: "Raises the holy war's religious zeal by #G 5#!"
 holy_war.19.b: "Rein him in before he stirs disorder."
 holy_war.21.title: "A Quarrel Over the Spoils"
 holy_war.21.desc: "Barely has the town fallen before our soldiers and the men of an allied host have come to blows over the division of the plunder. Knives have been drawn in the narrow streets, tents overturned, and old grievances between the two camps boil over into open brawling. If the quarrel is not settled swiftly it may sour the whole campaign and turn brother against brother while the enemy still stands. How do we resolve it?"
 holy_war.21.a: "Let our men take what they have earned."
 holy_war.21.a.tt: "Lowers the holy war's religious zeal by #R 5#!"
 holy_war.21.b: "Restrain them for the good of the cause."
 holy_war.21.b.tt: "Raises the holy war's religious zeal by #G 5#!"
 holy_war.22.title: "Sickness in the Host"
 holy_war.22.desc: "A wasting fever has crept through the crowded siege lines, and each grey morning more men are carried senseless from their tents. The camp physicians bleed and purge and pray over them, yet nothing stems the sickness, and the stench of the dying hangs heavy over the whole encampment. With every passing day the host bleeds away strength it can ill afford so far from home, before walls still unbroken. How do we meet this scourge?"
 holy_war.22.a: "Press the campaign, whatever the cost."
 holy_war.22.b: "Rest the host until the sickness passes."
 holy_war.22.b.tt: "Lowers the holy war's religious zeal by #R 5#!"
 holy_war.23.title: "A Champion Falls"
 holy_war.23.desc: "At the siege of [sieged_location.GetName], [fallen_champion.GetName] has fallen in the thick of the fighting, cut down upon the ramparts after deeds of valor that will be sung for a generation to come. The host mourns a champion beloved of common soldier and proud lord alike, yet even in their grief the men's blood is set alight, and many now beg for the honor of avenging the fallen upon the enemy. How shall we mark this death?"
 holy_war.23.a: "Hail him a martyr of the faith!"
 holy_war.23.a.tt: "Raises the holy war's religious zeal by #G 10#!"
 holy_war.23.b: "Honor him with quiet dignity."
 holy_war.23.b.tt: "Raises the holy war's religious zeal by #G 3#!"
 holy_war.24.title: "False Believers in the Ranks"
 holy_war.24.desc: "Ugly whispers run through the camp that heretics and false believers have crept in among the faithful, their prayers a hollow mockery and their loyalty in grave doubt. The most pious among the host demand they be rooted out before they poison the whole army, while cooler heads counsel that a sword is a sword in a man's hand, whatever creed lies buried in his heart. How do we answer the accusation?"
 holy_war.24.a: "Purge the false believers from the host."
 holy_war.24.a.tt: "Raises the holy war's religious zeal by #G 8#!"
 holy_war.24.b: "Turn a blind eye. We need every sword."
 holy_war.24.b.tt: "Lowers the holy war's religious zeal by #R 5#!"
 holy_war.25.title: "A Pious Bequest"
 holy_war.25.desc: "A wealthy magnate of our realm, lately gone to his eternal reward, has left a great sum to the holy war in his last testament. His executors have delivered the wealth into our keeping, sealed chests of coin to spend as we see fit for the cause, and already the clergy, the captains, and the poor each press a claim upon it. Where shall this fortune go?"
 holy_war.25.a: "Take the wealth to fund our own war."
 holy_war.25.b: "Give it to the war-chest of the holy war."
 holy_war.25.b.tt: "Raises the holy war's religious zeal by #G 3#!"
 holy_war.25.c: "Distribute it as alms to the faithful."
 holy_war.25.c.tt: "Raises the holy war's religious zeal by #G 3#!"
 holy_war.26.title: "The Enemy's Silver"
 holy_war.26.desc: "Under cover of night an envoy of [bribe_briber.GetName] has stolen into our camp, his saddlebags heavy with silver. He offers a handsome purse should we quietly abandon the holy war and withdraw our banners from the cause, swearing that no one need ever learn of the arrangement and that the coin would be counted into our hands before the dawn breaks. How do we answer this temptation?"
 holy_war.26.a: "Take the silver, and desert the cause."
 holy_war.26.b: "We do not sell our honor. Refuse."
 holy_war.27.title: "A Deserter Won"
 holy_war.27.desc: "Our silver has done its quiet work. [desertion_member.GetName] have taken the bribe and abandoned their cause, striking their banners and slinking homeward behind excuses that no one truly believes. Our enemies are left the weaker for their leaving. Again gold has bought us what neither steel nor sermon could, and one troublesome enemy is quietly removed from the board. A lesson, perhaps, in the true price of loyalty."
 holy_war.27.a: "Greed succeeds where the sword falters."
 holy_war.27.a.tt: "They took the bribe and deserted"
 holy_war.28.title: "Our Silver Spurned"
 holy_war.28.desc: "[desertion_member.GetName] have spurned our secret offer outright and cast our envoy from their court, vowing to hold to the war undaunted and untempted by our coin. Worse still, word of the attempt may yet spread, and should it reach the ears of the public, our name will be blackened as a suborner and deceiver. Little to show for the venture but risk."
 holy_war.28.a: "就这样吧。"
 holy_war.28.a.tt: "They refused the bribe"
 holy_war.29.title: "A Papal Legate"
 holy_war.29.desc: "His Holiness has sent [papal_legate.GetName] — a warrior-prelate as schooled in the arts of war as in those of the cloth — to ride at the head of our host and lend our [crusade|e] the full blessing of Rome. Such a man could sharpen our armies and bind us ever closer to the Holy See, though he answers first to the Pope and only then to us. Do we take him into our service?"
 holy_war.29.a: "Welcome the legate to our banners."
 holy_war.29.a.tt: "Raises the [crusade|e]'s religious zeal by #G 5#!"
 holy_war.29.b: "Send him back to Rome with our thanks."
 holy_war.30.title: "Pardoners in the Camp"
 holy_war.30.desc: "A company of pardoners has descended upon the camp like vultures to fresh carrion, hawking indulgences and holy trinkets to any soldier who will part with their coin. Their takings mount as swiftly as the grumbling of the devout, who name the whole trade a scandal upon the cause. Yet coin is coin, and no holy war was ever won on prayers alone. What shall be done with them?"
 holy_war.30.a: "Let their takings swell the war-chest."
 holy_war.30.a.tt: "Lowers the [crusade|e]'s religious zeal by #R 3#!"
 holy_war.30.b: "Quietly divert the coin to our own coffers."
 holy_war.30.b.tt: "Lowers the [crusade|e]'s religious zeal by #R 5#!"
 holy_war.30.c: "Drive the hawkers from the camp."
 holy_war.30.c.tt: "Raises the [crusade|e]'s religious zeal by #G 5#!"
 holy_war.31.title: "A Saint's Relics"
 holy_war.31.desc: "The bones of a revered saint have come into our keeping, borne to our court by a company of grateful monks who guarded them across many perilous leagues. Such relics are a treasure beyond any price in gold, for where they come at last to rest the faithful will gather in their thousands to pray and to marvel at them. Where shall these holy remains be kept?"
 holy_war.31.a: "Enshrine them in our capital."
 holy_war.31.b: "Bear them before the army into battle."
 holy_war.31.b.tt: "Raises the [crusade|e]'s religious zeal by #G 8#!"
 holy_war.32.title: "The Crusader's Vow"
 holy_war.32.desc: "Before the whole assembled court, our ruler has knelt at the altar and sworn a mighty vow to take up the cross in person, to lead the faithful into the very heart of the holy war and share every hardship and peril of the campaign alongside the meanest foot soldier. It is a bold pledge, and a perilous one, and the whole realm now waits upon our word. Do we let this vow stand?"
 holy_war.32.a: "Let our ruler lead the host in person."
 holy_war.32.a.tt: "Raises the [crusade|e]'s religious zeal by #G 5#!"
 holy_war.32.b: "The realm is better served from the throne."
 holy_war.33.title: "Christendom Takes the Cross"
 holy_war.33.desc: "A great wave of holy fervor has swept across the realm, and men of every station clamor to sew the cross to their tunics and march for the faith. Proud knights and landed lords vie with one another for the glory of the vanguard, while in the villages the common folk take up whatever arms they can lay hands upon. Whose ardor do we make the most of?"
 holy_war.33.a: "Call the knights and nobles to the banners."
 holy_war.33.b: "Raise a great host from the common folk."
 holy_war.34.title: "A Sufi Shaykh"
 holy_war.34.desc: "A revered Sufi shaykh, [sufi_shaykh.GetName], his piety and learning famed across the whole of the Muslim world, has come to our camp with a band of devoted disciples at his heel. His sermons by the evening fires set the hearts of the ghazis ablaze, and men who marched wearily only yesterday now speak of martyrdom with shining eyes. How do we receive this holy man?"
 holy_war.34.a: "Take the shaykh into our court."
 holy_war.34.a.tt: "Raises the [jihad|e]'s religious zeal by #G 5#!"
 holy_war.34.b: "Keep the wandering mystic at arm's length."
 holy_war.34.b.tt: "Lowers the [jihad|e]'s religious zeal by #R 3#!"
 holy_war.35.title: "The Ghazis Demand Their Share"
 holy_war.35.desc: "The volunteer warriors who flocked to answer the call now press us hard for the booty they were promised, crowding before our tent with voices loud and patience short. They fought for the faith, they say, but also for their wives and children, and empty hands make for empty ranks come the next hard battle. How do we answer their demand?"
 holy_war.35.a: "Grant the ghazis their share of the spoils."
 holy_war.35.a.tt: "Raises the [jihad|e]'s religious zeal by #G 5#!"
 holy_war.35.b: "The plunder belongs to the war effort, not to greed."
 holy_war.35.b.tt: "Lowers the [jihad|e]'s religious zeal by #R 3#!"
 holy_war.36.title: "A Jurist's Fatwa"
 holy_war.36.desc: "An esteemed jurist, a man whose word carries weight from one end of the #italic umma#! to the other, has issued a #italic fatwa#! proclaiming the holy war a sacred duty binding upon every believer able to bear arms. Copied out by a hundred hands and carried from mosque to mosque, such a ruling could set the whole of Islam alight for our cause. Do we spread it far and wide?"
 holy_war.36.a: "Spread the ruling to every corner."
 holy_war.36.a.tt: "Raises the [jihad|e]'s religious zeal by #G 8#!"
 holy_war.36.b: "Receive it with quiet thanks."
 holy_war.36.b.tt: "Raises the [jihad|e]'s religious zeal by #G 3#!"
 holy_war.37.title: "Volunteers from Across the Umma"
 holy_war.37.desc: "Word of the holy war has traveled far beyond our own borders, and now bands of ghazi volunteers arrive at the muster from distant Muslim lands. Footsore, dust-caked, and eager, they ask only for a place in the line and a chance to strike at the enemy. They are many mouths to feed, it is true, yet many willing swords besides. Do we take them in?"
 holy_war.37.a: "Welcome the volunteers to the muster."
 holy_war.37.a.tt: "Raises the [jihad|e]'s religious zeal by #G 3#!"
 holy_war.37.b: "We cannot feed every wandering zealot."
 holy_war.38.title: "The Sacred Banner"
 holy_war.38.desc: "An ancient war-banner, said to have flown over the victories of the first believers in the earliest days of the faith, has been entrusted to our keeping. Faded and threadbare though the cloth has grown, its very sight stirs the faithful to a righteous fury, and men swear they will follow it into any peril without flinching. What shall we do with such a precious relic?"
 holy_war.38.a: "Raise it high over the host."
 holy_war.38.a.tt: "Raises the [jihad|e]'s religious zeal by #G 5#!"
 holy_war.38.b: "Guard it as the treasure it is."
 sacred_war_banner: "The Sacred Banner"
 sacred_war_banner_desc: "A war-banner of faded and threadbare cloth, said to have flown over the victories of the first believers, kept now as a hallowed treasure of the realm and borne forth on the holiest of days to stir the faithful to righteous fury."
 holy_war.2.d.tt: "Every member of the [levy_io.GetName] gains the #R Shirked the Holy War#! opinion of us"
 holy_war.20.a: "我们必须承受他们的裁决。"
 holy_war.20.desc: "赐予我们兑现誓言的时限已经耗尽,而我们却一事未成。圣战的领导者们并未忘记我们的承诺,也未忘记我们未能履行诺言之事,他们所警告的斥责如今已然降临我们身上。"
 holy_war.20.title: "信徒们感到不满"
 holy_war.39.a: "感谢主!"
 holy_war.39.desc: "[cardinal_candidate.GetName] 已接受我们授予枢机主教之位的提议，拿起十字，加入了 [cardinal_io.GetName] 。愿一位新的教会亲王在他们之中崛起。"
 holy_war.39.title: "枢机主教之位已被接受"
 holy_war.4.a.tt: "圣战的领导者给予我们 #G 2年 #! 时间来证明自己。若届时我们对圣战的参与有所增长,信徒们将感到欣慰;若无,我们仍将同样承受他们的斥责。"
 holy_war.40.desc: "[cardinal_candidate.GetName] 已拒绝我们授予枢机主教之位的提议，不会加入 [cardinal_io.GetName] 。这份荣耀将另择他人授予。"
 holy_war.40.title: "枢机主教之位遭到拒绝"
 holy_war.41.desc: "[recognition_candidate.GetName] 已接受我们授予认可的提议,加入了 [recognition_io.GetName] ,与信徒们一同拔剑对抗异教徒。"
 holy_war.41.title: "我们的认可已被接受"
 holy_war.42.desc: "[recognition_candidate.GetName] 已拒绝我们授予认可的提议,不会加入 [recognition_io.GetName]。信徒们将会记住谁选择了置身事外。"
 holy_war.42.title: "我们的认可遭到拒绝"
 holy_war.6.a.muslim: "#italic Allāhu akbar#!。"
 holy_war.9.a.no_seat_tt: "我们的国度已在每一处定居点设有枢机主教之位,因此我们将获得更高的威望作为奖励"
