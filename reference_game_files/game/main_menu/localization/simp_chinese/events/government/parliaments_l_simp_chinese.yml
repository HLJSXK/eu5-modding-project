l_simp_chinese:
 parliaments.1.title: "[target_city.GetRank.GetNameWithNoTooltip]要求[ROOT.GetCountry.GetGovernment.GetParliament.GetName]席位"
 parliaments.1.desc: "[target_city.GetName]已是一片繁荣富庶的景象，然而当地民众却因未能获选成为本届[ROOT.GetCountry.GetGovernment.GetParliament.GetName]的会址[target_city.GetRank.GetName]而群情激愤。[target_city.GetNameWithNoTooltip]当地的代表不仅向我们索要补偿，更要求我们作出保障其未来利益的承诺。他们甚至发出威胁：若诉求得不到满足，将考虑脱离我们国家。"
 parliaments.1.a: "授予议席！"
 parliaments.1.b: "否决！"
 parliaments.2.title: "腐败选区"
 parliaments.2.desc: "由于[target_location.GetName]在[ROOT.GetCountry.GetGovernment.GetParliament.GetName]中的重要地位，该地确实能在我们国家的政治运作中有相当的影响力。然而，[envious.GetName]的市民却感到在[ROOT.GetCountry.GetGovernment.GetParliament.GetName]中缺乏代表权。[envious.GetNameWithNoTooltip]民众要求在本地建立一座[ShowBuildingTypeName('urban_parliament_seat')]，并享有全部相关权利。尽管这一要求单列出来看似合理，但随之而来的将是撤销[target_location.GetNameWithNoTooltip]的议会席位——此举无疑会被[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]们视为严重侮辱。"
 parliaments.2.a: "不管选区是否公平，那都是[target_location.GetNameWithNoTooltip]应有的权利！"
 parliaments.2.b: "我们必须重新分配这个席位。"
 parliaments.3.desc_generic: "[target_location.GetName]不仅是[ROOT.GetCountry.GetGovernment.GetParliament.GetName]的重要议席成员，更是一批涉足海外贸易的颇具影响力的商业集团的中心所在。"
 parliaments.3.title: "[target_location.GetNameWithNoTooltip]的经济实力"
 parliaments.3.desc: "$parliaments.3.desc_generic$但是，这些商业集团大多认为，目前正在审议的议案一旦通过，将让他们无利可图。所以，他们已经向其在[ROOT.GetCountry.GetGovernment.GetParliament.GetName]的代表施加压力，要求削弱该议案的约束力。"
 parliaments.3.a: "[ROOT.GetCountry.Custom('common_string_negative')]"
 parliaments.3.b: "如果他们想要钱，那就给他们吧。"
 parliaments.4.title: "投票腐败"
 parliaments.4.desc: "[target_location.GetName]腐败选区的[ROOT.GetCountry.GetGovernment.GetParliament.GetName]成员们已经选择在[ROOT.GetCountry.GetGovernment.GetParliament.GetName]反对我们的提案。看来控制该地的地主认为该提案不符合其最大利益。"
 parliaments.4.a: "真是腐败！"
 parliaments.4.b: "那就只好收买地主了。"
 parliaments.5.title: "[target_location.GetNameWithNoTooltip]赢得辩论"
 parliaments.5.desc: "富有影响力的[target_location.GetName][ShowBuildingTypeName('university')]已经成功左右了[ROOT.GetCountry.GetName][ROOT.GetCountry.GetGovernment.GetParliament.GetName]成员的意见，现在他们转而支持增加[ShowBuildingTypeNameWithNoTooltip('university')]经费的提案了。"
 parliaments.5.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 parliaments.5.b: "他们应该专注于自己的研究。"
 parliaments.6.desc: "$parliaments.3.desc_generic$看来，这些商业集团大多认为，目前正在审议的议案一旦通过，将让他们收获丰厚的利益。所以，他们已经向其在[ROOT.GetCountry.GetGovernment.GetParliament.GetName]的代表施加压力，要求确保该议案能够顺利通过。"
 parliaments.6.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 parliaments.7.title: "[target_location.GetNameWithNoTooltip]军方支持议案"
 parliaments.7.desc: "从各方各面来说，军队都是[target_location.GetName]最具影响力的地方力量。如今，一批出身军方、在[ROOT.GetCountry.GetGovernment.GetParliament.GetName]效忠于军事集团的当地议员已被说服，在投票中支持现在的议案。"
 parliaments.7.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 parliaments.7.b: "他们的支持对我们来说就足够了。"
 parliaments.8.title: "[target_location.GetNameWithNoTooltip]的影响"
 parliaments.8.desc: "[ROOT.GetCountry.GetGovernment.GetParliament.GetName]当前关于如何最好地保护国内生产的辩论已经引起了[target_location.GetName]当地许多人的注意。[ROOT.GetCountry.GetGovernment.GetParliament.GetName]的这一重要派系已经在辩论中转向支持我们，期望将来能够从这项提案中获益。"
 parliaments.8.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 parliaments.8.b: "不论结果如何，我们应当投资于[target_location.GetNameWithNoTooltip]。"
 parliaments.9.title: "[target_location.GetNameWithNoTooltip]的力量"
 parliaments.9.desc: "作为我们的首都议席，[target_location.GetName]能从当前提议的改革中获得许多好处。好在足够多的人们已经意识到了这一点，这保证了该议席代表现在能够为我们的立场投票。"
 parliaments.9.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 parliaments.10.title: "[target_location.GetNameWithNoTooltip]在辩论中改变立场！"
 parliaments.10.desc: "看来[target_location.GetName]的[ROOT.GetCountry.GetGovernment.GetParliament.GetName]成员终于意识到了目前正在讨论的议案通过将会给他们带来多大的好处。因此他们对于我们议案的支持越来越普遍。"
 parliaments.10.desc_b: "[target_location.GetName]的代表显然已经察觉到，[ROOT.GetCountry.GetGovernment.GetParliament.GetName]当前审议的议案无利于自身利益。他们对我们反对立场的支持，对我们而言意义重大。"
 parliaments.10.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 parliaments.11.desc: "似乎，[target_location.GetName]的[ROOT.GetCountry.GetGovernment.GetParliament.GetName]成员尽管不久前还是我们的坚定拥护者，但已然彻底转变了他们在这场辩论中对议案的立场。究竟为何会出现这种情况，我们无从得知，但显然我们已无法再指望他们的选票了。"
 parliaments.11.a: "也许他们被贪婪迷了心智……"
 parliaments.12.title: "缺少农民的支持"
 parliaments.12.desc: "虽然我们允许[ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')]阶层向我们的[ROOT.GetCountry.GetGovernment.GetParliament.GetName]请愿，但这一权利并不意味着他们能像其他阶层那样对议事机关施加同等影响力。在最近的一次讨论中，我们清楚的看到，[ROOT.GetCountry.GetName]的下层民众并不享有与处于主导地位的上层阶级同等的特权，而后者恰好反对[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('peasants_estate')]阶层的提案。"
 parliaments.12.a: "[ROOT.GetCountry.Custom('common_string_negative')]"
 parliaments.12.b: "天理难容！"
 parliaments.13.title: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('peasants_estate')]主导了议会辩论"
 parliaments.13.desc: "这场由[ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')]阶层自发组织的坚定社会运动，以其强大的民意基础成功扭转了[ROOT.GetCountry.GetGovernment.GetParliament.GetName]对待当前关键议题的态度。尽管参与者都是普通民众，但他们的合理诉求最终被纳入国家事务的讨论议程，获得了与精英阶层平等对话的权利。"
 parliaments.13.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 parliaments.13.b: "人民的声音将被倾听。"
 parliaments.14.desc_common: "[target_location.GetName]的[ROOT.GetCountry.GetGovernment.GetParliament.GetName]成员在[ROOT.GetCountry.GetGovernment.GetParliament.GetName]中占据重要地位，因为他们代表着我国的经济中心之一。"
 parliaments.14.title: "[target_location.GetNameWithNoTooltip]的[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')]"
 parliaments.14.desc: "$parliaments.14.desc_common$这些权贵的财力虽在[ROOT.GetCountry.GetGovernment.GetParliament.GetName]中举足轻重，当前讨论的议题若通过将使他们受益，因此他们的资金正被用于收买支持而非设置障碍——这对我们而言实属幸事。"
 parliaments.14.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 parliaments.15.title: "[target_location.GetNameWithNoTooltip]的重担"
 parliaments.15.desc: "[target_location.GetName]许多人已经对于加强海上基础设施建设的提案感到无比失望。他们认为本地区已经为我国军事力量贡献了太多，因此更期待[ROOT.GetCountry.GetGovernment.GetParliament.GetName]能够批准更多自主支配资金，而非要求为海军追加拨款。"
 parliaments.15.a: "[ROOT.GetCountry.Custom('common_string_negative')]"
 parliaments.15.a.tt: "我们在[target_location.GetName]的[pops|e]会失去[ShowNamedValue('pop_satisfaction_weak_penalty')|+=2%][pop_satisfaction|e]"
 parliaments.16.title: "[target_location.GetNameWithNoTooltip]倒向海权立场"
 parliaments.16.desc: "在[target_location.GetName]海军势力占据着主导地位，这意味着[ROOT.GetCountry.GetGovernment.GetParliament.GetName]中有关增加陆军经费的提案在这里的待遇会非常冷淡。尽管该地的[ROOT.GetCountry.GetGovernment.GetParliament.GetName]成员最初对这项提案持认可态度，但现在除了投反对票外别无选择。"
 parliaments.16.a: "[ROOT.GetCountry.Custom('common_string_negative')]"
 parliaments.17.desc_common: "[target_location.GetName]民众的信仰与我国主流信仰相异，而代表该地的[ROOT.GetCountry.GetGovernment.GetParliament.GetName]成员被指控更倾向于维护[target_location.GetNameWithNoTooltip]当地的利益，而非我国的主流信仰。"
 parliaments.17.title: "[target_location.GetNameWithNoTooltip]倒向属灵立场"
 parliaments.17.desc_tolerance: "$parliaments.17.desc_common$然而这类指控往往只会招致[ROOT.GetCountry.GetGovernment.GetParliament.GetName]同僚的哄笑，因为在我们的价值观里，国家主流信仰与不同信仰者理应获得同等尊重——这种情况实属常见。"
 parliaments.17.desc_intolerance: "$parliaments.17.desc_common$这些强烈指控严重损害了[target_location.GetNameWithNoTooltip]的声誉，也令当前提案在[ROOT.GetCountry.GetGovernment.GetParliament.GetName]中的支持率大幅下降。"
 parliaments.17.a: "这是[ROOT.GetCountry.GetReligion.GetGodName]的意志。"
 parliaments.18.title: "[target_location.GetNameWithNoTooltip]的期望被满足"
 parliaments.18.desc: "[target_location.GetName]的[ROOT.GetCountry.GetGovernment.GetParliament.GetName]成员们对我们在议会上的提案表现出意外的接纳态度。我们可以看出，[target_location.GetNameWithNoTooltip]的大学深信他们能参与这个提案所需的统计和计量工作，学者们十分乐意把握获取关于我国的新鲜原始数据的机会。"
 parliaments.18.a: "[ROOT.GetCountry.Custom('common_string_ok')]"
 parliaments.19.title: "[target_character.GetNameWithNoTooltip]的无能"
 parliaments.19.desc: "当前[ROOT.GetCountry.GetGovernment.GetParliament.GetName]的辩论重点已转向我国[ROOT.GetCountry.GetGovernment.GetCabinetTitle]的改组问题，[target_character.GetName]的严重失误也因此暴露无遗。[target_character.GetHerHis]在其任职期间内的表现明显下滑，[target_character.GetHerHis]的执政能力呈现断崖式下跌，我们或许需要立即启动对[target_character.GetHerHim]的撤换程序。"
 parliaments.19.a: "[ROOT.GetCountry.Custom('common_string_negative')]"
 parliaments.20.title: "[ROOT.GetCountry.GetCapital.GetNameWithNoTooltip]的生活"
 parliaments.20.desc: "由于代表们有时来自于距离首都[ROOT.GetCountry.GetCapital.GetName]十分遥远的地区，许多[ROOT.GetCountry.GetGovernment.GetParliament.GetName]成员经常发现在他们拜访[ROOT.GetCountry.GetCapital.GetNameWithNoTooltip]期间的生活和他们习惯的家乡生活有很大不同。一些人认为首都的生活拥挤而且脏乱，而对于大多数人，似乎当他们回到家乡的时候感到如释重负一般。\n\n今年已经表明我们的[ROOT.GetCountry.GetGovernment.GetParliament.GetName]成员们在这种微妙的感触中比往年更加难以忍耐。炎热的几个月变得异常闷热，潮湿的几个月变得异常渗人，寒冷的几个月变得异常严寒。许多[ROOT.GetCountry.GetGovernment.GetParliament.GetName]代表们表示他们已经彻底受够了，并且前来寻求我们的帮助以改善他们的情况，使得他们能够更加舒适地待在首都。"
 parliaments.20.a: "我们必须做我们力所能及的事情。"
 parliaments.20.b: "他们必须学会像我们剩下的人一样忍受这种情况。"
 parliaments.21.title: "[ROOT.GetCountry.GetGovernment.GetParliament.GetName]成员丑闻"
 parliaments.21.desc: "当前辩论期间，[ROOT.GetCountry.GetCapital.GetName]传出一桩丑闻。据悉，多位[ROOT.GetCountry.GetGovernment.GetParliament.GetName]议员不仅缺席会议，反而在街头扰乱社会秩序、骚扰民众。同僚和民众都对此怒不可遏，这一恶劣事件的影响可能持续数年，使议会的声誉受损。"
 parliaments.21.a: "$common_string_let_it_slide$"
 parliaments.21.b: "逮捕这个[ROOT.GetCountry.GetGovernment.GetParliament.GetName]议员。"
 parliaments.22.title: "长期缺席"
 parliaments.22.desc: "鉴于[ROOT.GetCountry.GetGovernment.GetParliament.GetName]在我国政治上拥有巨大的影响力，很容易断定所有议员将会带着巨大的热情出席会议，并且积极地将他们被赋予的权力发挥到极致。然而现状与此相距甚远，每当[ROOT.GetCountry.GetGovernment.GetParliament.GetName]召开时这里总有一些人永远也不会出席。要么是由于他们一直沉浸在自己的乡村别墅里，要么是由于他们深陷于首都各种各样的娱乐活动中。近来，这一问题愈发严峻，我们甚至怀疑外国使节正在暗中讥讽我国。原本可以通过对缺席辩论者处以罚金来提升议会出席率，但[ROOT.GetCountry.GetGovernment.GetParliament.GetName]的诸位议员显然不会欣然配合。"
 parliaments.22.a: "惩罚那些最严重的肇事者。"
 parliaments.22.b: "[ROOT.GetCountry.Custom('common_string_nothing_we_can_do')]"
 parliaments.23.title: "要求代表权"
 parliaments.23.desc: "一些怀有敌意的出版物已经开始在[ROOT.GetCountry.GetName]的城市中传播。这些刊物的作者匿名却言辞犀利，声称我们的政府是“专制”的，在治理时未能公平考虑所有[ROOT.GetCountry.GetAdjectiveWithNoTooltip]人的处境，并进一步提出了种种荒谬指控。他们要求我们推出成文宪法，并建立能够广泛代表各个地区的议会。"
 parliaments.23.a: "取缔这些出版物。"
 parliaments.23.b: "做出含糊的改革承诺。"
 parliaments.24.title: "财政援助"
 parliaments.24.desc: "当前，我国政府财政拮据以及我们竭尽全力筹措各类资金的困境，已为公众所知。尽管这势必损害我国在[ROOT.GetCountry.GetName]本土及海外的声誉，却也随之带来些许转机——[target_location.GetName]的数名[ROOT.GetCountry.GetGovernment.GetParliament.GetName]成员主动前来提出援助。然而，他们的条件是：要求在政府中扩大其整体话语权，同时建立国家未来可依循的正式求援机制。"
 parliaments.24.a: "授予他们更多的代表权。"
 parliaments.24.b: "拒绝他们的资金。"
 parliaments.24.c: "承诺将会考虑他们的建议。"
 parliaments.25.desc: "$parliaments.14.desc_common$当地的代表在[ROOT.GetCountry.GetGovernment.GetParliament.GetName]中拥有强大的经济影响力，可悲的是，他们正在利用这种财力资源阻挠我们当下的议题进程。"
 parliaments.25.a: "[ROOT.GetCountry.Custom('common_string_negative')]"
 parliaments.27.title: "议会传统"
 parliaments.27.desc: "议员面临的最棘手的任务，往往不在于[ROOT.GetCountry.GetCapital.GetName]的辩论本身；恰恰相反，这些任务更多地涉及如何向家乡民众阐释新出台的法案以及妥协条款。在代议制相对不够完善的体系里，地方[ROOT.GetCountry.GetGovernment.GetParliament.GetName]成员通常比中央政府派遣的征税官更易于解释新出台的税法。\n\n总体而言，[ROOT.GetCountry.GetGovernment.GetParliament.GetName]成员们，尤其是来自[target_location.GetName]的议员，似乎已变得极为擅长拥护政策。因此，我们已然看到相应的结果——议会对中央政府的支持程度总体上将会持续提升。"
 parliaments.27.a: "他们最终会理解我们的！"
 parliaments.26.title: "顺从的[ROOT.GetCountry.GetGovernment.GetParliament.GetName]"
 parliaments.26.desc: "近来，我们的[ROOT.GetCountry.GetGovernment.GetParliament.GetName]成员表现得格外顺从。凭借他们一心为国的倾向，我们可以轻易使其支持我方立场，或从其属地榨取额外资源。"
 parliaments.26.a: "利用他们的忠诚最为重要。"
 parliaments.26.b: "我们需要硬通货！"
 parliaments.28.title: "权力冲突"
 parliaments.28.desc: "[ROOT.GetCountry.GetCapital.GetName]近日上演了罕见一幕——[ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')]与[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]等中下层民众自发组建临时[ROOT.GetCountry.GetGovernment.GetParliament.GetName]。这些长期积压不满情绪的群体正团结一致，就[target_debate.GetName]议题展开激烈辩论，要求实施直接挑战[target_character.GetName]政治权威的改革措施。决定不再忍受现状，纷纷发声，尽管遭到了[target_character.GetShortNameWithNoTooltip]的强烈反对，他们中的许多成员因对统治阶级的不满，决定不再忍受现状，纷纷发声。"
 parliaments.28.a: "我们的鞭子已形同虚设！"
 parliaments.29.title: "[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]掌握所有筹码"
 parliaments.29.desc: "[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]阶层已向[ROOT.GetCountry.GetGovernment.GetParliament.GetName]递交正式申诉，其不满确实难以辩驳——[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]阶层掌握了压倒性的权力份额，将那些创造了[ROOT.GetCountry.GetName]大部分财富的商人排除在外。若不加以约束，这种失衡将演变为公开的怨恨。我们必须做出抉择：忠于我们最古老的盟友，是否值得以疏远那些充实国库的人为代价。"
 parliaments.29.a: "[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]一直为我们尽职效力。"
 parliaments.29.b: "商人阶层理应得到公正的倾听。"
 parliaments.30.title: "[ROOT.GetCountry.GetGovernment.GetParliament.GetName]中的信仰之问"
 parliaments.30.desc: "讨论道路建设与税收政策固然重要，但我们的[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]提醒我们：并非所有[ROOT.GetCountry.GetName]国民都信奉真正的信仰。既然仍有众多灵魂游离于神圣光芒之外，[ROOT.GetCountry.GetGovernment.GetParliament.GetName]又怎能将精力集中于这些次要事务？他们的论点极具说服力，甚至令人隐隐不安。我们必须作出抉择：是让宗教热情主导本届议会的议程，还是对神职阶层的野心予以制约。"
 parliaments.30.a: "信仰需要我们全神贯注。"
 parliaments.30.b: "精神事务可以暂且搁置。"
 parliaments.31.title: "失地者的呼声"
 parliaments.31.desc: "[ROOT.GetCountry.GetGovernment.GetParliament.GetName]已经收到了一大摞请愿书，每一份都写满了[ROOT.GetCountry.GetName]最受压迫的臣民的不满。[ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')]阶层几乎毫无权力可言，然而他们的不满情绪已高涨到危险的程度。如果我们对这些呼声置之不理，可能会将暗流涌动的怨恨推向更加丑陋的局面。但如果我们选择倾听，又可能会助长那些试图将民粹当作政治武器的人的嚣张气焰。"
 parliaments.31.a: "他们的苦难理应得到承认。"
 parliaments.31.b: "秩序必须得到维护。"
 parliaments.32.title: "修道院市场"
 parliaments.32.desc: "[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]阶层怒不可遏。修道院的工坊与教会经营的贸易行处处压低他们的价格，同时还享有诚实商人必须缴税而他们免税的巨大优势。而[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]阶层自然认为这种安排毫无不公之处。双方都要求举行听证会，而我们无法同时满足双方的要求。这场纷争不会自行化解。"
 parliaments.32.a: "[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]阶层的诉求确有道理。"
 parliaments.32.b: "[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]们服务于更高的使命。"
 parliaments.32.c: "我们不偏袒任何一方。"
 parliaments.33.title: "钱都去哪儿了？"
 parliaments.33.desc: "[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]阶层与[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]阶层在[ROOT.GetCountry.GetGovernment.GetParliament.GetName]中齐声提出了一个我们极不情愿回答的问题：我们究竟是如何积累了如此之多的债务？我们的开支确实相当庞大，而我们的债主正变得越来越不耐烦。我们可以用强硬的反驳来度过这场风暴，也可以选择做出我们难以兑现的承诺。两种应对方式都令人不安。"
 parliaments.33.a: "我们的开支服务于[ROOT.GetCountry.GetName]的荣耀。"
 parliaments.33.b: "我们应当勒紧腰带。"
 parliaments.34.title: "派遣代议人的权利"
 parliaments.34.desc: "并非每一位议员都能随时亲临会场——战争、疾病以及[ROOT.GetCountry.GetName]各地各阶层代表路途遥远，都使缺席难以避免。[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]阶层因此请求允许缺席成员派遣拥有完全投票权的代理人。从他们的立场看，这无疑是合理的安排。然而王室的看法却截然不同：一个由代理人组成的[ROOT.GetCountry.GetGovernment.GetParliament.GetName]，终究无法像济济一堂的真人那样被施压或说服。我们必须明确：究竟希望[ROOT.GetCountry.GetGovernment.GetParliament.GetName]成为一个怎样的机构。"
 parliaments.34.a: "缺席的领主可以派遣代理人。"
 parliaments.34.b: "所有投票必须亲自到场。"
 parliaments.35.title: "罕见的共识"
 parliaments.35.desc: "[ROOT.GetCountry.GetGovernment.GetParliament.GetName]中出现了一幕难得的景象：[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]与[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]阶层竟找到了一项真正能够达成共识的事业，并向我们提出一致的诉求。如此团结的时刻实在罕见，不容我们错过。我们最好欣然接受——尽管人们总免不了猜测，这两方各自期望从中获得怎样的回报。"
 parliaments.35.a: "团结对[ROOT.GetCountry.GetName]总是好事。"
 parliaments.35.b: "他们的团结令我们不安。"
 parliaments.36.title: "这场战争的代价"
 parliaments.36.desc: "[ROOT.GetCountry.GetGovernment.GetParliament.GetName]已经精疲力竭。来自士兵家属、破产商人以及不堪重负的牧师的请愿书——他们被要求为太多逝者祈祷——堆积的速度甚至超过了捷报传来的频率。就连当初在我们宣战之初欢呼最响亮的人们，如今面对账单时也面如土色。我们可以再次用最终胜利的承诺来激励他们，也可以坦然承认这场战争所带来的沉重代价。无论选择哪条路，我们都无法再对议会大厅中弥漫的情绪视而不见了。"
 parliaments.36.a: "胜利将使一切牺牲都值得。"
 parliaments.36.b: "我们听到了人民的苦难。"
 parliaments.37.title: "[ROOT.GetCountry.GetGovernment.GetParliament.GetName]进入战时状态"
 parliaments.37.desc: "[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]们已明确表态。敌人不会等待，[ROOT.GetCountry.GetName]的军队亦不可迟疑。他们要求[ROOT.GetCountry.GetGovernment.GetParliament.GetName]即刻批准紧急征兵。无论人们是否认同这份紧迫感，战场从不等人。我们必须决定：将动员令扩大到何种范围，又该由谁家的子弟奔赴前线。"
 parliaments.37.a: "授权紧急征募。"
 parliaments.37.b: "我们不会强制征兵。"
 parliaments.38.title: "那些归来的人"
 parliaments.38.desc: "他们曾在我麾下奋勇作战，为边疆抛洒热血，如今解甲归乡，却大多被世人遗忘。上回战役的老兵们已向[ROOT.GetCountry.GetGovernment.GetParliament.GetName]请愿，期盼自己的奉献能得到某种形式的认可——无论是封赏土地、给予钱财，或仅仅是来自统治者的肯定。犒劳他们的代价并不高昂，而忽视他们的后果，却可能沉重得多。"
 parliaments.38.a: "赐予他们土地。"
 parliaments.38.b: "付给他们军人应得的报酬。"
 parliaments.38.c: "他们服过役。这已是足够的回报。"
 parliaments.39.title: "地图边缘的狼群"
 parliaments.39.desc: "我们的邻国已毫不掩饰其意图。[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]阶层向[ROOT.GetCountry.GetGovernment.GetParliament.GetName]提交的情报显示，我国边境沿线出现了一系列挑衅行为——那些被忽视的外交试探、军队调动，以及通常预示着某种远比戏剧性冲突更严峻的事态的前兆。我们尚有余裕之时，可以及时投入国防建设；又或者在刀剑相向前，寻求外交的补救办法。"
 parliaments.39.a: "加强我们的边境防御。"
 parliaments.39.b: "先派遣外交使节。"
 parliaments.40.title: "饥饿不待推诿"
 parliaments.40.desc: "这份请愿书以最直白朴素的言辞写成——那是人们用尽一切礼貌方式表达同一件事时才使用的语气。粮仓已经空空荡荡，孩子们饥肠辘辘。[ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')]阶层将这个问题呈递到[ROOT.GetCountry.GetGovernment.GetParliament.GetName]，不是因为他们相信华丽辞藻会有效果，而是他们已经无路可走。我们不能靠无休止的辩论让此问题不了了之。必须行动起来——而且要快。"
 parliaments.40.a: "立即购买谷物储备。"
 parliaments.40.b: "对外国谷物开放市场。"
 parliaments.40.c: "让市场自行调节。"
 parliaments.41.title: "货币日贱"
 parliaments.41.desc: "我们的[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]阶层向来容易小题大做，但这次他们所言非虚。物价涨幅已远超合理范畴，国库资金的实际价值逐日缩水。若不加以干预，这一趋势或将危及支撑[ROOT.GetCountry.GetName]偿债能力的商业阶层。我们必须采取果断措施——无论选择何种方案，总难免有人欢喜有人忧。"
 parliaments.41.a: "推行紧缩措施。"
 parliaments.41.b: "将责任归咎于应负之人。"
 parliaments.41.c: "优先偿还债务。"
 parliaments.42.title: "两座城市，同一个市场"
 parliaments.42.desc: "两座城市均已向[ROOT.GetCountry.GetGovernment.GetParliament.GetName]派出代表，双方都以令人赞叹的力度与相当洪亮的嗓门展开了辩论。坦率说，关于哪一方应获得[ROOT.GetCountry.GetName]主导贸易特许权的问题，并非一个能够自行化解的议题。我们可以选择赋予某一城市独占性的优势，也可以开放市场，让竞争机制去完成议会往往难以达成之事——让问题自然而然地得到解决。"
 parliaments.42.a: "一个授予特权，一个主导市场。"
 parliaments.42.b: "让它们自由竞争。"
 parliaments.43.title: "[ROOT.GetCountry.GetName]债务的重压"
 parliaments.43.desc: "审阅账目绝非令人愉悦之事。我们欠下的债务远超自己愿意承认的数额，而债主们绝非耐心宽容之人。[ROOT.GetCountry.GetGovernment.GetParliament.GetName]已为此召开紧急会议，尽管用“商讨”来形容大厅里三个截然不同、争执不休的提案，实在过于宽容。我们必须在其中做出选择，并承担随之而来的后果。"
 parliaments.43.a: "重组债务。"
 parliaments.43.b: "增税以弥补亏空。"
 parliaments.43.c: "变卖一切可卖的资产。"
 parliaments.44.title: "难得的好消息"
 parliaments.44.desc: "难得一次，[ROOT.GetCountry.GetGovernment.GetParliament.GetName]召开是为了商议一件令人愉悦的事。国家局势安稳，国库尚可支撑，民众近来也未酿成什么祸端。围绕着如何善用这份难得的好运，已有不少提议浮出水面，而这一次的讨论，甚至可以说相当彬彬有礼。我们切莫辜负这宝贵的时机。"
 parliaments.44.a: "为未来投资建设。"
 parliaments.44.b: "与臣民分享财富。"
 parliaments.44.c: "为不可避免的战争做好准备。"
 parliaments.45.title: "权力大厅中的异端"
 parliaments.45.desc: "席卷[ShowContinentName('europe')]的新宗教思潮已悄然渗入[ROOT.GetCountry.GetGovernment.GetParliament.GetName]殿堂，[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]对此深感不安。改革派的小册子四处流传，愤怒的声浪此起彼伏，上周的会议甚至险些演变成肢体冲突。在这场争端从神学辩论升级为更危险的冲突之前，我们必须明确立场。"
 parliaments.45.a: "议会应与真正的信仰站在一起。"
 parliaments.45.b: "议会应倾听所有的声音。"
 parliaments.46.title: "荣誉归于谁？"
 parliaments.46.desc: "[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]与[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]阶层都决心以本时代伟大赞助人的身份被后世铭记。不得不承认，他们关于谁对[ROOT.GetCountry.GetName]艺术的慷慨贡献更大的争论，起初还颇有些趣味——直到人们意识到，这场争执已经彻底阻碍了过去两届[ROOT.GetCountry.GetGovernment.GetParliament.GetName]的正常议程。必须决出一方为胜者。"
 parliaments.46.a: "[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]推动了我们的文化复兴。"
 parliaments.46.b: "[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]才是真正的赞助人。"
 parliaments.46.c: "双方都应得到认可。"
 parliaments.47.title: "危时危言"
 parliaments.47.desc: "自印刷机技术在[ROOT.GetCountry.GetName]落地生根以来，[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]们便对小册子怨声载道，而[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]阶层则不断分发传播。如今，双方阵营均已进入[ROOT.GetCountry.GetGovernment.GetParliament.GetName]，就何种言论应被允许自由传播展开了激烈交锋，立场截然不同。一方视其为启迪民智，另一方则斥为蛊惑人心。我们必须在这两个词汇中作出选择，表明自己的立场。"
 parliaments.47.a: "限制有害出版物。"
 parliaments.47.b: "新闻出版必须自由运行。"
 parliaments.48.title: "上帝的田地与农民的犁"
 parliaments.48.desc: "在我们的乡村中，一场争端已悄然酝酿了几代人，如今终于以其错综复杂的全部面貌摆在了[ROOT.GetCountry.GetGovernment.GetParliament.GetName]面前。修道院的土地与农民的田地相互接壤，而谁有权耕种哪块土地的问题，已从地方性的不满演变为一项关乎原则的争议。[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]诉诸神权，[ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')]则援引传统。双方的主张都并非全无道理——这正是问题棘手之处。"
 parliaments.48.a: "修道院的权力神圣不可侵犯。"
 parliaments.48.b: "将有争议的土地归还给农民。"
 parliaments.49.title: "来自新领土的声音"
 parliaments.49.desc: "来自新近纳入版图的地区的代表们，不远万里前来向[ROOT.GetCountry.GetGovernment.GetParliament.GetName]请愿，恳请赋予他们权利与代表资格。他们言辞谦恭，却带着一种不容忽视的沉静决心。是将他们纳入[ROOT.GetCountry.GetAdjectiveWithNoTooltip]治理体系，还是拒绝他们的诉求——这一抉择将决定我们的新子民在未来数十年间如何审视他们的统治者。"
 parliaments.49.a: "在我们的[ROOT.GetCountry.GetGovernment.GetParliament.GetName]中给予他们发言权。"
 parliaments.49.b: "他们是臣民，而非参政者。"
 parliaments.50.title: "国中之国"
 parliaments.50.desc: "我们地方议会的尊贵领主们已抵达[ROOT.GetCountry.GetGovernment.GetParliament.GetName]，提出了一项用华丽辞藻包装的旧主张。他们称之为“地方自治”。当然，其真实含义是希望摆脱首都的干预，自主管理本地事务——这实际上是以委婉的方式请求我们减少对本国治理的参与。若不深入思考这一诉求的最终走向，这听起来确实是个颇具吸引力的提议。"
 parliaments.50.a: "授予他们地方法庭。"
 parliaments.50.b: "王室理应统治[ROOT.GetCountry.GetName]全境。"
 parliaments.51.title: "边陲之乱"
 parliaments.51.desc: "一份令人不安的报告已呈交[ROOT.GetCountry.GetGovernment.GetParliament.GetName]。在[ROOT.GetCountry.GetName]某些地区，国家法律似乎已从必须遵守的准则沦为一纸空文。地方官员或玩忽职守，或能力不足，甚至因势单力薄而无力应对。[ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')]阶层的抗议声最为强烈——这通常是一个可靠的信号，表明问题的确存在。我们绝不能坐视情况继续恶化。"
 parliaments.51.a: "派遣行政官员恢复秩序。"
 parliaments.51.b: "派遣士兵稳定局面。"
 parliaments.52.title: "两个民族，同一个[ROOT.GetCountry.GetGovernment.GetParliament.GetName]"
 parliaments.52.desc: "新领土的并入，不仅将新的民族纳入[ROOT.GetCountry.GetAdjectiveWithNoTooltip]治理体系，也将多元的声音引入[ROOT.GetCountry.GetGovernment.GetParliament.GetName]殿堂。[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]阶层视同化为机遇，[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]阶层则视共存为商机。两种立场虽非全然无私，却各有其合理之处。我们必须深思：究竟要为[ROOT.GetCountry.GetName]塑造一个怎样的未来？"
 parliaments.52.a: "同一个[ROOT.GetCountry.GetNameWithNoTooltip]，同一种文化。"
 parliaments.52.b: "差异使我们更加强大。"
 parliaments.53.title: "[target_character.GetNameWithNoTooltip]问题"
 parliaments.53.desc: "[ROOT.GetCountry.GetGovernment.GetParliament.GetName]很少会仅仅因为政绩就感到满意。然而，[target_character.GetName]却交出了一份令人瞩目的答卷。报告中的数据清晰可测，改革成效真实可见，这一点任何议员都无法忽视。然而，问题恰恰出在这里。当一位官员表现得如此高效时，人们难免会产生疑问：这些成果究竟是如何达成的？哪些人的利益被悄悄牺牲？又有谁在暗中获益？  [ROOT.GetCountry.GetGovernment.GetParliament.GetName]已要求进行全面说明。现在我们必须决定，对[target_character.GetName]的调查，究竟应该深入到何种程度。"
 parliaments.53.a: "这份政绩有目共睹。"
 parliaments.53.b: "让议会细细地审查账目。"
 parliaments.54.title: "两位大臣，两套议程"
 parliaments.54.desc: "内阁已成战场，[ROOT.GetCountry.GetGovernment.GetParliament.GetName]上的迹象也显而易见。[target_character.GetName]与[rival_character.GetName]在整个会期中相互倾轧，都试图将某一失败的责任推给对方，却无人愿意承认自己的过失。除了他们自身及那些押注于此的局外人，这场内斗无人乐见。我们必须解决这一问题。"
 parliaments.54.a: "支持[target_character.GetName]。"
 parliaments.54.b: "支持[rival_character.GetName]。"
 parliaments.54.c: "将二人一并解职。"
 parliaments.55.title: "纯净议厅中的黑手套"
 parliaments.55.desc: "[ROOT.GetCountry.GetGovernment.GetParliament.GetName]内部有人指控[target_character.GetName]存在腐败行为，且指控细节之详尽令人难以完全置之不理。这一指控究竟是确有其事，还是仅仅被用作政治斗争的工具，完全取决于询问的对象；而提问者本身对答案的导向也具有相当大的影响力。现在我们必须做出抉择：是彻查此事，还是以郑重反对的姿态将其掩盖。"
 parliaments.55.a: "调查这一指控。"
 parliaments.55.b: "这不过是政治作秀。"
 parliaments.56.title: "一场冗长乏味的程序之争"
 parliaments.56.desc: "[ROOT.GetCountry.GetGovernment.GetParliament.GetName]已陷入僵局。一场关于投票程序的争议——究竟该通过口头表决还是唱名表决来解决问题、代理人是否有权弃权、发言顺序是否安排得当——已经耗费了整整三个会期，而这些时间本可用于实际的治理工作。所有这些问题的正确答案必然存在于某个地方。我们只希望，给出这一答案的人不必是我们。"
 parliaments.56.a: "从御座亲自颁布裁决。"
 parliaments.56.b: "让议会自行解决混乱。"
 parliaments.57.title: "空荡的议席，满腹的怨言"
 parliaments.57.desc: "我们最具权势的阶层之一已经忍无可忍。说得委婉些，他们对[ROOT.GetCountry.GetGovernment.GetParliament.GetName]当前的走向深感不满，并且已明确表态：如果局面没有改观，他们可能不再出席。这究竟是一种实质性的威胁，还是谈判中的施压手段，尚难定论。但可以肯定的是，一个明显有人缺席的议会，其决策的公信力必将大打折扣。"
 parliaments.57.a: "在他们离场之前作出让步。"
 parliaments.57.b: "让他们试试看。"
 parliaments.58.title: "[ROOT.GetCountry.GetGovernment.GetParliament.GetName]声索权力"
 parliaments.58.desc: "制宪会议不会仅仅满足于安坐于此，并为自身的存在而庆幸。我们的制宪会议已经做出决定：时机已经成熟，应当迈出更远的一步——将那些迄今只被隐约提及、却从未明文确立的权利，逐条列举出来，从而建立起难以逆转的先例。诚然，这样一份文件将有助于厘清[ROOT.GetCountry.GetName]的治理框架；但他们说得同样没错——这也会对王权形成永久的约束。我们必须慎重决定，究竟准备以书面形式让渡多少权力——因为一旦权力落于纸面，往往就再也难以收回。"
 parliaments.58.a: "批准宪章。"
 parliaments.58.b: "王权不受列举之限。"
