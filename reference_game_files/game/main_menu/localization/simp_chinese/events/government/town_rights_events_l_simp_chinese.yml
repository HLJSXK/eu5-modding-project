l_simp_chinese:
 town_rights_events.1.title: "[target_location.GetNameWithNoTooltip]特贸港"
 town_rights_events.1.desc: "我们对[target_location.GetName]发展的投入，使[target_location.GetRank.GetName]吸引了利润丰厚的商业机会。管理[target_province.GetName]的官员汇报，希望我们指导该如何利用这笔新获得的财富。"
 town_rights_events.1.a: "让整个省份受益！"
 town_rights_events.1.b: "提高港口发展。"
 town_rights_events.1.c: "在地点内分配财富！"
 every_location_in_province_dev_and_prosperity_tt: "[target_province.GetName]所有[location|e]会获得[ShowNamedValue('development_weak_bonus')|+][development|e]和[ShowNamedValue('prosperity_mild_bonus')|+=2%][prosperity|e]"
 town_rights_events.2.title: "[target_location.GetNameWithNoTooltip]的商业停滞"
 town_rights_events.2.desc: "尽管我们竭力开发[target_location.GetRank.GetName][target_location.GetName]，但令我们大为失望的是，海上商人似乎都避开在此开展业务。但愿这种停滞只是暂时的，而非预示着持续恶化的趋势。"
 town_rights_events.2.a: "这对[target_character.GetShortNameWithNoTooltip]来说不是问题！"
 town_rights_events.2.b: "唉，无利可图的生意是这样。"
 town_rights_events.2.c: "我们不关心。"
 administrative_expertise_of_ruler_mitigates_situation_tt: "[target_character.GetName]的行政[abilities|e]可以轻松缓和局势"
 town_rights_events.3.title: "[target_location.GetNameWithNoTooltip]谷仓充盈"
 town_rights_events.3.desc: "居住在[target_province.GetName]的农民和劳工报告称，[target_location.GetRank.GetName]的[target_location.GetName]在食品物资的生产和储存方面，无论是质量还是数量都有所提升。这种积极的发展应立即加以利用。"
 town_rights_events.3.a: "让[target_province.GetNameWithNoTooltip]整个省份受益！"
 town_rights_events.3.b: "在它变质前卖掉。"
 town_rights_events.3.c: "将它分发给[target_location.GetNameWithNoTooltip]的民众。"
 every_location_gains_mild_prosperity: "[target_province.GetName]所有[location|e]会获得[ShowNamedValue('prosperity_mild_bonus')|+=2%][prosperity|e]"
 every_pop_in_target_location_mild_satisfaction_tt: "我们在[target_location.GetName]的[pops|e]会获得[ShowNamedValue('pop_satisfaction_mild_bonus')|+=2%][pop_satisfaction|e]"
 income_gained_depends_on_crown_estate_power_tt: "获得的[gold|e]很大程度上取决于我们的[crown_power|e]"
 town_rights_events.4.title: "[target_location.GetNameWithNoTooltip]粮仓告急"
 town_rights_events.4.desc: "从[target_location.GetName]的[target_location.GetRank.GetName]传来坏消息。因粮食腐坏、管理不善，或是季节反常，在最需要粮食的时候，粮仓的储备却减少了。[target_province.GetName]的民众如今指望我们提供救济，以免饥荒蔓延至乡村各地。"
 town_rights_events.4.a: "我们将开仓赈济他们。"
 town_rights_events.4.b: "人民只能先忍受短缺。"
 town_rights_events.4.c: "在演变成饥荒之前，需要付出更大努力。"
 every_pop_in_target_location_mild_satisfaction_malus_tt: "[target_location.GetName]所有[pop|e]会失去[ShowNamedValue('pop_satisfaction_mild_penalty')|+=2%][pop_satisfaction|e]"
 relief_effort_tt: "救灾工作减轻了饥荒的严重程度"
 town_rights_events.5.title: "[target_location.GetNameWithNoTooltip]的新工具制造方法"
 town_rights_events.5.desc: "[target_location.GetName]的作坊已成为实验与技术精进的中心。许多工匠表示，改进的方法和更好的工具正在提高产量与工作质量。现在摆在我们面前的问题是，这些成果应当用于推动创新、促进地方繁荣，还是拓展更广阔的市场。"
 town_rights_events.5.a: "鼓励这些新技术。"
 town_rights_events.5.b: "让[target_location.GetNameWithNoTooltip]自身收获回报。"
 town_rights_events.5.c: "向市场倾销新式工具。"
 town_rights_events.6.title: "来自[target_location.GetNameWithNoTooltip]的劣质工具"
 town_rights_events.6.desc: "使用[target_location.GetName]工具授权生产的商品开始引发大量投诉。手柄开裂、刀刃迅速变钝、配件在受力时损坏。无论这种质量下降是源于赶工还是逐利，当地产品的信誉显然已经受损。当地的投诉已经开始损害[target_location.GetRank.GetName]的名声。"
 town_rights_events.6.a: "我们可以进行调解并保留工坊。"
 town_rights_events.6.b: "这种失职必须在当地进行处理。"
 town_rights_events.6.c: "这一耻辱有损[ROOT.GetCountry.GetFlavorRank]的声誉。"
 our_innovative_nature_finds_compromise_tt: "得益于开拓性的视野——无论是源于强烈的[ShowSocietyDirectionName('innovative')][societal_values|e]倾向，还是[target_character.GetName]相关的[trait|e]——我们这次能够找到可行的折中方案"
 town_rights_events.7.title: "[target_location.GetNameWithNoTooltip]精益求精的珠宝匠"
 town_rights_events.7.desc: "在[target_location.GetName]享有[ROOT.GetCountry.GetGovernment.GetAdjective|U]特权的珠宝匠们进一步精进了技艺。各种新方法让他们的饰品比以往更加璀璨夺目，赢得了众多本地人和往来商人的赞赏。这一成就标志着我们迈向崛起的重要一步。"
 town_rights_events.7.a: "让这些技术提升整个省份。"
 town_rights_events.7.b: "使[target_location.GetNameWithNoTooltip]以其工艺闻名。"
 town_rights_events.7.c: "盛大的展览将有助于提升[ROOT.GetCountry.GetFlavorRank]的威望。"
 nobles_appreciate_jewellery_displays: "#italic [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]对这些宏伟的展示赞叹不已#!"
 jewellery_display_reinforces_authority: "#italic 允许征收以巩固我们的统治#!"
 town_rights_events.8.title: "[target_location.GetNameWithNoTooltip]的大火"
 town_rights_events.8.desc: "灾难降临[target_location.GetName]。火焰从一户人家蔓延至另一户，珠宝匠所在的街区如今被浓烟和混乱笼罩，一片焦黑。除非火势得到控制，并迅速组织救援，否则损失可能会蔓延至[target_location.GetRank.GetName]之外。"
 town_rights_events.8.a: "[target_character.GetShortNameWithNoTooltip]将亲自处理受害者的赔偿事宜。"
 town_rights_events.8.b: "烈焰吞噬一切！"
 town_rights_events.8.c: "提供援助，防止最坏情况发生。"
 nature_of_target_character_assists_the_locals: "[target_character.GetName]的性格有助于安抚并协助当地居民"
 chance_the_fire_spreads_neighboring_locations_tt: "火灾的影响极有可能扩散到邻近的[locations|e]"
 relief_effort_prevents_spread_of_fire_tt: "救灾工作阻止了火势进一步蔓延。"
 town_rights_events.9.title: "[target_location.GetNameWithNoTooltip]的造船热潮"
 town_rights_events.9.desc: "得益于[target_location.GetName]的造船权和木材供应权，当地的船坞和木材场比以往更加繁忙。我们的工人日夜不停地劳作，焦油坑火光冲天，每位商人和水手都在谈论扩张。生意正蒸蒸日上！这股突如其来的活力或许不仅会改变[target_location.GetRank.GetName]的面貌，还将影响我们作为[ROOT.GetCountry.GetFlavorRank]的更广泛战略布局。"
 town_rights_events.9.a: "让这股势头推动我们的海军雄心。"
 town_rights_events.9.b: "加强[target_location.GetNameWithNoTooltip]的海上贸易。"
 town_rights_events.9.c: "这提醒我们，未来在于海洋。"
 town_rights_events.10.title: "[target_location.GetNameWithNoTooltip]的短缺与不满"
 town_rights_events.10.desc: "[target_location.GetName]的造船需求夺走了附近的林地，依赖林地生存的人对此十分担心。当地人怨声载道，对曾经蓬勃发展的本地产业的抗议和怨恨与日俱增。这种短暂的繁荣如今有可能在整个[target_location.GetRank.GetName]滋生混乱。"
 town_rights_events.10.a: "撤销特权，让人们冷静下来。"
 town_rights_events.10.b: "弥补损失，维持生产。"
 town_rights_events.10.c: "当地人必须承受这一负担。"
 cooldown_10_years: "该[town_rights|e]#v 10年#!内无法强制撤销"
 laborers_and_peasants_happy_tt: "[target_location.GetName]的$laborers$和$peasants$获得[ShowNamedValue('pop_satisfaction_weak_bonus')|+=2%][pop_satisfaction|e]"
 town_rights_events.11.title: "[target_location.GetNameWithNoTooltip]的风尚"
 town_rights_events.11.desc: "[target_location.GetName]的裁缝、染工和布商在服饰方面制定了新标准！许多居民穿着合身的套装，成了人们津津乐道的趣谈！每一季新品都成为整个[ROOT.GetCountry.GetFlavorRank]风格与时尚的典范。的确，他们的面料和剪裁如今在[target_province.GetName]之外也广受仿效，[target_location.GetRank.GetName]的名号在社交圈中愈发令人钦佩。毕竟，人们总会注视他人——那就让他们看得移不开眼！"
 town_rights_events.11.a: "[target_character.GetShortNameWithNoTooltip]真是光彩照人！"
 town_rights_events.11.b: "裁缝的名声为我们带来威望。"
 town_rights_events.11.c: "服饰改良将彰显我们[ROOT.GetCountry.GetGovernment.GetAdjective]的地位。"
 town_rights_events.12.title: "纺织垄断势力在[target_location.GetNameWithNoTooltip]进一步巩固"
 town_rights_events.12.desc: "在[target_location.GetName]获得的特权让少数强势势力主导了当地的纺织生产。小生产者抱怨遭到排挤，价格被操纵，被排除在贸易之外的人怨声渐起。财富依旧存在，但只集中在越来越少的人手中……"
 town_rights_events.12.a: "[target_character.GetShortNameWithNoTooltip]#italic 即是#!纺织业！"
 town_rights_events.12.b: "垄断自有其用处。"
 town_rights_events.12.c: "让地方势力窝里斗。"
 ruler_regent_finds_good_middle_ground_tt: "[target_character.GetName]凭借绝对的权威，在利益与怨愤之间找到了可行的折中之道"
 local_textile_barons_are_unhappy_tt: "#italic [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]涉足纺织业的可能会对这种不稳定状况感到不满#!"
 destabilization_spreads_across_the_country: "#italic 争端不断升级，加剧了整个[ROOT.GetCountry.GetFlavorRank]#!的不稳定"
 town_rights_events.13.title: "来自[target_location.GetNameWithNoTooltip]的优质武器"
 town_rights_events.13.desc: "在[target_location.GetName]凭借[ROOT.GetCountry.GetGovernment.GetAdjective|U]特权锻造的[ShowGoodsName('weaponry')]赢得了当地军官的赞誉。据说，这些武器的平衡性、耐用性和工艺都超越了普通水准，如今士兵们都极为热衷地寻求它们。这般卓越，只能归功于我们经久不衰的传统和对细节的关注。"
 town_rights_events.13.a: "将此设立为我们军队的标准。"
 town_rights_events.13.b: "用它来支持省份的招募工作。"
 town_rights_events.13.c: "让我们的军官也学习这种品质。"
 town_rights_events.14.title: "来自[target_location.GetNameWithNoTooltip]的[ShowGoodsNameWithNoTooltip('weaponry')]助长混乱"
 town_rights_events.14.desc: "[target_location.GetName]及其周边地区武器泛滥，带来了令人不悦的副作用。如今，更多[ShowGoodsName('weaponry')]落入了鲁莽暴徒手中，这助长了罪犯的气焰，加剧了当地的紧张局势。一项本用于巩固 [ROOT.GetCountry.GetFlavorRank] 的特权，现在却威胁到了它的稳定。说真的，真是一幅令人痛心和沮丧的景象。"
 town_rights_events.14.a: "[target_character.GetShortNameWithNoTooltip]将恢复秩序。"
 town_rights_events.14.b: "镇压乱象滋生的地方。"
 town_rights_events.14.c: "没有什么是无法用武力解决的。"
 kind_martial_nature_of_ruler_helps_tt: "[target_character.GetName]的军事素养与性格有助于遏制混乱"
 town_rights_events.15.title: "[target_location.GetNameWithNoTooltip]的学术灯塔"
 town_rights_events.15.desc: "学者与书商们共同将[target_location.GetName]变成了一个学术汇聚之地。书籍从[target_location.GetRank.GetName]的作坊中传播得更远、更快，思想的交流已经开始让该省受益，其影响远超单纯的贸易。无论我们选择如何引导这种启蒙，机会都已显而易见。"
 town_rights_events.15.a: "让知识加速我们的进步。"
 town_rights_events.15.b: "使这里成为真正的学术中心。"
 town_rights_events.15.c: "确保[target_character.GetShortNameWithNoTooltip]能从这些书籍中获益。"
 town_rights_events.16.title: "来自[target_location.GetNameWithNoTooltip]的争议书本"
 town_rights_events.16.desc: "并非所有书籍的传播都毫无代价。如今在[target_location.GetName]流传的某些书本，已在学者和普通读者中引发了争论。有人称赞其大胆，也有人谴责其危险且令人不安。为牟利而印刷的书籍，或许终将考验我们的权威！"
 town_rights_events.16.a: "我国不屑于理会这些琐碎的批评。"
 town_rights_events.16.b: "这类文字会令所有识字之人感到不安。"
 town_rights_events.16.c: "不惜代价压下它。"
 pops_in_target_province_mild_penalty_according_to_literacy_tt: "[target_province.GetName]的[pops|e]会根据其[literacy|e]失去[pop_satisfaction|e]"
 town_rights_events.17.title: "[target_location.GetNameWithNoTooltip]的精湛工艺"
 town_rights_events.17.desc: "[target_location.GetName]的工匠赢得了极佳的声誉，其影响远远超出了本省。他们的制品不仅因实用而受到称赞，更被视为值得欣赏的物品。如果我们选择加以培养，这份声誉将惠及整个[ROOT.GetCountry.GetFlavorRank]。"
 town_rights_events.17.a: "将他们的卓越技艺定为[ROOT.GetCountry.GetGovernment.GetAdjective]政策的一部分。"
 town_rights_events.17.b: "在本地保留这些标准。"
 town_rights_events.17.c: "他们的名声已足以让我们感到荣耀。"
 town_rights_events.18.title: "[target_location.GetNameWithNoTooltip]的大工匠老去"
 town_rights_events.18.desc: "[target_location.GetName]许多最受人尊敬的工匠逐渐放下了工具。没几名学徒继承了他们的能力，赢得声誉的人就更少了。除非吸引到人才或接受这种损失，否则这座[target_location.GetRank.GetName]很快将感受到大师们的缺席。"
 town_rights_events.18.a: "尽力吸引移民。"
 town_rights_events.18.b: "我们的国库暂时还能承受这份负担。"
 town_rights_events.18.c: "这里只能忍受衰落。"
 town_rights_events.19.title: "[target_location.GetNameWithNoTooltip]制定酿酒标准"
 town_rights_events.19.desc: "[target_location.GetName]的酿酒师已经就酒品的制作、储存和销售建立了严格的规范。酒馆盛赞浓度的提高，商人欢迎可靠性，[target_location.GetRank.GetName]的声誉也相应增长。一种朴素的工艺仍会是繁荣和秩序的有用工具。"
 town_rights_events.19.a: "让这些标准塑造[ROOT.GetCountry.GetFlavorRank]的酿酒。"
 town_rights_events.19.b: "促进[target_location.GetNameWithNoTooltip]的本地繁荣。"
 town_rights_events.19.c: "我们的[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')]会欣赏这份成功。"
 town_rights_events.20.title: "[target_location.GetNameWithNoTooltip]的粮食被转用于酿酒"
 town_rights_events.20.desc: "填得满酒杯，填不满粮仓。在[target_location.GetName]，现在有太多的谷物被转用于酿造，人们愈发担忧公共需求正被私人利益牺牲。这不仅仅是一个贸易问题，更是一个轻重缓急的问题。当地人抱怨仓库空虚，指控有人密谋牺牲普通农民的利益，为当地酿酒厂谋取利润。"
 town_rights_events.20.a: "在短缺恶化前予以弥补。"
 town_rights_events.20.b: "民众虽然抱怨，但贸易仍要继续。"
 town_rights_events.20.c: "这种管理失当损害了[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')]的名声，也损害[ROOT.GetCountry.GetFlavorRank]的颜面。"
 town_rights_events.21.title: "[target_location.GetNameWithNoTooltip]的[ShowGoodsNameWithNoTooltip('masonry')]新技术"
 town_rights_events.21.desc: "[target_location.GetName]的建筑者和石匠引进了更优质的[ShowGoodsName('masonry')]砌筑工艺。他们的努力有望建造出更坚固的工程，加快施工进度，并显著改变[target_province.GetName]周边省份的面貌。这些进步可能预示着，在[target_location.GetNameWithNoTooltip]的主导下，我们整个[ROOT.GetCountry.GetFlavorRank]将迎来建筑品质提升的新时代。"
 town_rights_events.21.a: "让这些方法在[ROOT.GetCountry.GetFlavorRank]中传播开来。"
 town_rights_events.21.b: "将[target_province.GetNameWithNoTooltip]变为建造的中心。"
 town_rights_events.21.c: "直接投资于[target_location.GetRank.GetName]。"
 town_rights_events.22.title: "采石对[target_location.GetNameWithNoTooltip]造成压力"
 town_rights_events.22.desc: "建造墙壁和市场的[ShowGoodsName('stone')]只有通过辛勤劳动才能获取。在[target_location.GetName]，采石任务正变得越来越繁重，被迫从事这份工作的工人筋疲力竭，忿忿不平。生产力仍然存在，但人力成本正变得不容忽视，有可能导致本地业务整个停滞不前。"
 town_rights_events.22.a: "通过救济和监督减轻他们的负担。"
 town_rights_events.22.b: "无视当地人的抱怨，继续工作。"
 town_rights_events.22.c: "整个省份都会感受到这份压力。"
 relief_effort_reduces_strain_on_the_workforce_tt: "提供的[gold|e]将带来慰藉，暂时降低劳动力的压力"
