l_simp_chinese:
 columbian_exchange.1.title: "哥伦布大交换"
 columbian_exchange.1.desc: "我们的侦察兵报告称，他们遇到了一群自称来自大洋彼岸的异族。这些人衣着奇特，持有前所未见的武器。\n\n他们提出以各类异域物品进行交易，换取我们的向导服务，而我们人民身上偶然佩戴的贵金属配饰对他们具有极大的吸引力。"
 columbian_exchange.1.descB: "我们的探险家向我们透露，在探索[ShowContinentName('america')]大陆的过程中，他们遇到了一些奇特的原住民。\n\n这些原住民既未被完全开化，也未达到我们所理解的文明程度，然而他们种植了许多奇异的作物，并饲养了一些我们不熟悉的动物。若能将这些庄稼和牲畜恰当地引入我们的国家，它们将很有可能为我们的人民带来经济上的利益。"
 columbian_exchange.1.historical_info: "哥伦布大交换是发生在15和16世纪的历史事件，当时旧大陆和新大陆首次接触。在这一时期，两个半球之间进行了人员、作物、动物和思想的交流，导致两个大陆发生了重大变化。\n\n在欧洲，玉米、马铃薯和番茄等新作物的到来帮助养活了不断增长的人口，烟草和可可也成为了受欢迎的商品。与此同时，向美洲输入的新疾病对土著居民造成了毁灭性的打击。"
 columbian_exchange.1.a: "这样的交流对所有人都有好处。"
