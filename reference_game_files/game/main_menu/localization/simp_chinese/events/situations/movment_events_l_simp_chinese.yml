l_simp_chinese:
 movements.10.title: "拉丁传承"
 movements.10.desc: "为庆祝重返伟大的罗马帝国，忠诚的[target_location.GetName]中，讲[ShowLanguageFamilyName('romance_language_family')]的公民们，在[ShowLanguageName('latin_language')]思想与古老[ShowCultureName('roman_culture')]文化的熏陶下重焕生机。\n\n这些新罗马人立志重振罗马帝国的荣光。他们以自身传承为傲，并热切期盼将自身文化与影响力播撒至世界各地。"
 movements.10.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 movements.10.b: "我们亦是[ShowCultureNameWithNoTooltip('roman_culture')]人！"
 movements.10.tt: "[ShowMovementDefinitionName('roman_culture_movement')]出现在[target_location.GetName]"
 movements.20.title: "“太一”之流溢"
 movements.20.desc: "一批追随[ShowMovementDefinitionName('hellenism_religion_movement')]思潮的学者与哲人开始传布新说：至高真理并不存于经文之中，而在理性之内——万有皆自“太一”发源，经由神圣智性的层层流溢，降临至我们所处的物质世界。\n\n这些思想家援引柏拉图、普罗提诺与普罗克洛斯的学说，同时审慎指出其与[ShowReligionGroupName('christian')]教义的相通之处。他们声称，太一与天主并无本质区别：永恒不灭、超乎一切言说，是万物存在的本源。\n\n然而[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]阶层对此渐生戒备，斥之为卑劣的[ShowReligionAdjective('hellenism_religion')]异教习俗。\n\n我们应当允许这场哲学复兴蓬勃发展，还是出手将其扑灭？"
 movements.20.a: "求索太一，即是追寻真理。"
 movements.20.b: "这种哲学会将灵魂引入歧途。"
 movements.20.tt: "[ShowMovementDefinitionName('hellenism_religion_movement')]从[ROOT.GetCountry.GetCapital.GetName]开始传播"
