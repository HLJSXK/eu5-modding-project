 #########
 hussite_wars.1.desc.generic: "在[jan_zelivsky_scope.GetName]的领导下，愤怒的群众涌入了[target_boh_capital_scope.GetName]的街头，要求市议会扩大教徒的权利并赦免数名[ShowReligionAdjective('hussite')]囚犯。"
 hussite_wars.1.desc: "$hussite_wars.1.desc.generic$不幸的是，市议长和其他几位议员拒绝了抗议者的诉求，并导致了暴力事件的发生。改革停滞和群众暴力形成了一种恶性的循环，也许是时候解决这个循环了……"
 hussite_wars.1.desc.other_heresy: "$hussite_wars.1.desc.generic$主要由[ROOT.GetCountry.GetReligion.GetAdjective]信徒组成的议会对其[ShowReligionAdjectiveWithNoTooltip('hussite')]弟兄深表同情，但[ShowReligionAdjective('catholic')]势力代理人正试图破坏与阻挠他们的事业。无论我们决定坚守自身信仰，还是支持[ShowReligionNameWithNoTooltip('hussite')]，有一点是确定的：[ShowReligionAdjectiveWithNoTooltip('catholic')]世界始终将视我们为必须铲除的异端威胁……"
 hussite_wars.1.a: "[GetUniqueInternationalOrganization('catholic_church').GetLeaderTitle]去死！"
 hussite_wars.1.b: "我们承担不起与[ShowReligionNameWithNoTooltip('catholic')]断绝关系的代价……"
 end_hussite_wars_situation_tt: "The [ShowSituationName('hussite_wars')] [situation|e] will not occur as long as we do not convert to [ShowReligionName('hussite')]"
 boh_every_neighboring_country_tt: "每个未结盟的相邻[country|e]和我们的[subjects|e]对我国的[opinion|e]将会降低[ShowBiasValue('violated_congress_of_visegrad_modifier')|+=0]"
 hussite_rebellion_tooltip: "所有信仰[ShowReligionName('hussite')]的[pop|e]将会集中力量支持[hussite_rebel_scope.GetName]"
 every_neighbor_of_bohemia_gets_hussite_wars.3_tt: "每个[target_country.GetName]的非盟友[ShowReligionAdjective('catholic')]邻国将发生事件“#Y 神圣的战斗号令#!”"
 hussite_wars.6_happens_for_catholic_champion_scope_tt: "[catholic_champion_scope.GetName]将发生事件“#Y [ShowReligionName('catholic')]之剑#!”"
 hussite_wars.3.title: "神圣的战斗号令"
 hussite_wars.3.desc: "In a bid to eradicate heresy, the [GetUniqueInternationalOrganization('hre').GetLeaderTitle] has taken up arms against the people of [target_country.GetName], with the blessing of [ShowReligionName('catholic')]. [war_leader_scope.GetGovernment.GetRulerOrRegent.GetSheHe|U] demands we do our [ShowReligionAdjective('catholic')] duty and take up arms against this vile heresy. Whatever we may decide, we must be wary not to make powerful enemies in a fruitless pursuit of pious glory."
 hussite_wars.3.a: "拿起武器！"
 hussite_wars.3.b: "我们不要急于投入行动。"
 hussite_wars.4.title.hussite_victory: "[ShowReligionAdjectiveWithNoTooltip('hussite')]赢得[ShowSituationNameWithNoTooltip('hussite_wars')]"
 hussite_wars.4.title.catholic_victory: "[ShowReligionAdjectiveWithNoTooltip('catholic')]赢得[ShowSituationNameWithNoTooltip('hussite_wars')]"
 hussite_wars.4.a.desc: "我们争取[ShowReligionAdjective('catholic')]会承认地位和公正待遇的斗争终于取得了成果，捍卫我们的人民和信仰的事业取得了成功，我们现在可以平等地坐在欧洲列强的会议桌前了。"
 hussite_wars.4.b.desc: "我们被迫承认了[GetInternationalOrganization('catholic_church').GetName]的至高无上权威。我们曾怀抱伟大的理想并深信它的正义，但我们没能抵御腐败与黑暗的压迫，唉，这注定是无法实现的……"
 hussite_wars.4.c.desc: "我们征讨异端的圣战已蒙受神佑，并以凯旋告终。[ShowReligionName('hussite')]的火焰已在[GetCountry('BOH').GetLongName]境内熄灭，[ShowReligionName('catholic')]的正义权威已重归信徒之地。让世人见证，教会的意志坚不可摧。"
 hussite_wars.4.d.desc: "尽管我们的事业属于正义，但[ShowReligionName('hussite')]的追随者仍在[target_capital.GetNameWithNoTooltip]取得了胜利。[GetCountry('BOH').GetLongName]在冲突后愈发强硬，其异端信仰已获各方承认。我们必须接受这苦涩的和局，另寻他途以恢复[ShowReligionName('catholic')]的统一。"
 hussite_wars.4.e.desc: "失败的阴影笼罩着我们[ShowReligionAdjectiveWithNoTooltip('hussite')]的事业。尽管我们与[GetCountry('BOH').GetLongName]的同胞并肩作战，但[ShowReligionName('catholic')]势力仍取得了胜利，旧日秩序得以恢复。然而，我们的信仰依旧存续，我们为之奋斗的理念不会就此沉寂。"
 hussite_wars.4.a: "我们的正信得到了胜利！"
 hussite_wars.4.b: "在教堂与战场上，一切都是公正的……"
 hussite_wars.4.c: "教会取得了胜利！"
 hussite_wars.4.d: "异端仍在存在……"
 hussite_wars.4.e: "即使被击垮，我们的信仰仍将长存。"
 hussite_wars.5.title: "独眼的[target_character.GetLastNameWithNoTooltip]"
 hussite_wars.5.entry: "独眼杰式卡"
 hussite_wars.5.desc: "作为战争中最杰出的领导人之一，[target_character.GetName]在我们最艰难的时刻勤勤恳恳地为人民效忠。行伍之间盛传着[target_character.GetHerHim]被敌军箭矢射瞎眼睛时的传奇事迹。据目击者称，[target_character.GetSheHe]当时非但没有撤退或倒下，反而忍痛拔箭继续作战。\n\n尽管身体残缺，[target_character.GetSheHe]还是成长为了一名优秀的指挥家，并希望获得晋升以带领更多军队获得胜利。如果我们想让敌人蒙受更可怕的打击，就必须认真考虑将[target_character.GetHerHim]册立为一名民族英雄，以作为我们反抗[GetInternationalOrganization('catholic_church').GetName]的标志。"
 hussite_wars.5.a: "苦难的时代中一名伟大的英雄。"
 hussite_wars.5.historical_info: "扬·杰式卡又称“特罗茨诺夫和圣杯的扬·杰式卡”。他是15世纪著名的军事领袖，被誉为胡斯派运动最杰出的人物之一。他使用创新的军事战术，包括使用战车进行机动防御，领导胡斯派取得了无数胜利。他的战略才华和魅力四射的领导才能是他们成功抵御天主教会发动的多次十字军侵略的关键。"
 hussite_wars.6.title: "[ShowReligionNameWithNoTooltip('catholic')]之剑"
 hussite_wars.6.desc: "In dire times, when our faith is threatened by external heretics, it falls upon our shoulders to carry the burden of a renewed crusade against those who wish to harm our pious people.\n\nAs such, the [GetUniqueInternationalOrganization('hre').GetLeaderTitle] — blessed by the authority of [ShowReligionName('catholic')] — has called upon us to join [target_ruler1.GetHerHim] in a crusade against the [GetCountry('BOH').GetLongName]."
 hussite_wars.6.a: "我们将铲除这些异端！"
 hussite_wars.6.b: "We are not the [GetUniqueInternationalOrganization('hre').GetLeaderTitle]'s servants!"
 hussite_wars.7.title: "[ShowReligionAdjectiveWithNoTooltip('hussite')]陷入苦战"
 hussite_wars.7.desc: "A battered messenger has made his way into our court. He brings word of the [GetUniqueInternationalOrganization('hre').GetLeaderTitle]'s crusade against [GetCountry('BOH').GetName], backed by the authority of [ShowReligionName('catholic')]. Tales of brutality, scorched earth, and relentless fighting have flooded the streets as soldiers and peasants clash alike.\n\nThe messenger sings the praise of the bond our two nations hold, that of brothers, as he requests we come to the aid of his bloodied people. [GetCountry('BOH').GetNameWithNoTooltip] calls for aid!"
 hussite_wars.7.a: "当那翼骑兵杀到，[GetCountry('POL').GetNameWithNoTooltip]将做出回答！"
 hussite_wars.7.b: "这样不理智……"
 teutons_hussite_wars_tt: "[GetCountry('TEU').GetLongName]将发生事件“#Y 神圣的战斗号令#!”"
 hussite_wars.8.title: "共同的敌人"
 hussite_wars.8.desc: "我们的同胞陷入了绝望。随着异端分子大军攻破我们的城门，许多食利阶层之间的宿怨已被搁置，我们团结起来，共同对抗敌人的贪婪和短视。我们坚定的决心和虔诚的信仰将确保我们克服这一险恶的障碍，战胜那些想要伤害我们的人民和我们的信仰的人，取得胜利，恢复我们昔日的辉煌和应有的尊重。"
 hussite_wars.8.a: "继续战斗，[GetCountry('BOH').GetNameWithNoTooltip]的儿女！"
 boh_clergy_donation_tt: "[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]积极捐款以振奋人民的战斗意志"
 hussite_wars.8.b: "我们将加紧对[ShowReligionNameWithNoTooltip('catholic')]学说的批判。"
 hussite_wars.8.c: "在这艰难时刻，我们寄希望于[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]……"
 hussite_wars.9.title: "重启对[ShowReligionNameWithNoTooltip('hussite')]的十字军"
 hussite_wars.9.desc: "那被称为[ShowReligionName('hussite')]的祸害是对我们神圣虔诚世界的公然侮辱，是威胁信仰统一与神圣秩序的致命毒瘤。他们异端的教义散播纷争，玷污了[ShowReligionName('catholic')]世代传承的圣洁教义。此等悖逆绝不可姑息。我们肩负神圣使命，必须即刻集结[ShowReligionNameWithNoTooltip('catholic')]大军，以坚定不移的决心出征，在这异端毒瘤进一步溃烂前将其彻底铲除。唯有根除其流毒，方能捍卫我们信仰的纯洁，在神圣庇护的土地上重建天赐的和谐。"
 hussite_wars.9.a: "开战！"
 hussite_wars.9.b: "我们可以暂且静待时机。"
 explain_situation_peace_treaty_tt: "During this [war|e], we can eradicate [ShowReligionName('hussite')] through the #italic Force Convert#! and [ShowPeaceTreatyTypeName('supress_hussite_faith')] [peace_treaties|e] and bring an end to the [ShowSituationName('hussite_wars')]"
 hussite_wars.10.title: "[ShowSituationNameWithNoTooltip('hussite_wars')]"
 hussite_wars.10.desc: "The rise of [ShowReligionName('hussite')] has pushed [target_country.GetName] to become a pariah of the [ShowReligionAdjective('catholic')] world, as it teeters on the brink. The execution of [GetCharacter('boh_jan_hus').GetName] has not quelled dissent, it has emboldened it. Heretical preachers now rally the [GetCountry('BOH').GetGovernment.GetEstateName('peasants_estate')] and the [GetCountry('BOH').GetGovernment.GetEstateName('nobles_estate')] alike, calling for a new Church free from the authority of [target_location1.GetName].\n\nThe [GetCountry('BOH').GetFlavorRank] spirals into unrest as [target_location2.GetName] burns with reformist zeal. For the members of the [GetUniqueInternationalOrganization('hre').GetName], this is no mere rebellion. It is a heresy with armies, a revolt with purpose. If [target_country.GetNameWithNoTooltip] prevails, the infection may spread beyond its borders, threatening the very unity of [ShowReligionGroupName('christian')]."
 hussite_wars.10.a: "拿起武器，信仰的卫士！"
 hussite_wars.10.historical_info: "胡斯战争（1419年—1434年）是发生于波希米亚的一系列宗教和内部冲突，起因是批评天主教会的捷克宗教改革家扬·胡斯被处决。他的追随者胡斯派要求改革，包括全体共融和建立独立于罗马的国家教会。激进的胡斯派与神圣罗马皇帝和教宗派遣的天主教会支持者和十字军作战。尽管人数处于劣势，但在战术革新和内部团结的帮助下，胡斯派一再击败敌人，迫使教会最终进行谈判并做出了有限让步。"
 hussite_wars.10.b: "我们将清除异端！"
 hussite_wars.10.c: "Their reckoning can wait..."
 #Rebels
 hussite_rebellion: "胡斯起义"
 hussite_wars.11.title: "[ShowSituationNameWithNoTooltip('hussite_wars')]"
 hussite_wars.11.desc: "From the pulpits of [target_boh_capital_scope.GetName] to the outermost village chapel, the word has spread: the [GetUniqueInternationalOrganization('hre').GetLeaderTitle] has declared us dangerous heretics, to be put down or forcefully converted. The flame of [ShowReligionName('hussite')] that we have kindled is now both beacon and target. While crusader armies muster beyond our borders, our people look to us for strength. We have chosen our faith over the authority of [ShowReligionName('catholic')] and now we must be prepared to defend it."
 hussite_wars.11.a: "We fight for our faith and our people!"
 hussite_wars_11_tt: "The [ShowSituationName('hussite_wars')] [situation|e] has commenced"
