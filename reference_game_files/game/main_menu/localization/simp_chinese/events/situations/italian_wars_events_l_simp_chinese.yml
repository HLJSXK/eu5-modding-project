l_simp_chinese:
 italian_wars.1.title: "$italian_group$战争"
 italian_wars.1.desc.a: "关门闭户的幕后外交和[ShowRegionName('italy_region')]周边大国的无休止阴谋，导致了一场前所未有的外交灾难。结果是，我们对半岛的控制力与影响力受到了质疑。在这个危急的时刻，我们决不能动摇。只有取得在[ShowRegionNameWithNoTooltip('italy_region')]的胜利，我们才能确保在强权中的地位！"
 italian_wars.1.desc.b: "战火来到了[ShowRegionName('italy_region')]。外国征服者挥舞着旗帜蜂拥而至，妄图掠夺我们半岛上的巨大财富。列强像饥饿的秃鹫一般盘旋在我们的家园上空，我们决不能让她在这样激烈的斗争中沦丧破亡。为了防止意大利成为列强侵略扩张的牺牲品，是时候让我们的人民拿起剑与盾捍卫自由了……"
 italian_wars.1.a: "骰子已经掷下。"
 italian_wars.1.b: "支持[GetUniqueInternationalOrganization('foreign_league_hre').GetLeaderCountry.GetNameWithNoTooltip]！"
 italian_wars_explanation_tooltip1: "在局势期间，位于[ShowRegionNameWithNoTooltip('italy_region')]的国家将能够通过组建#italic $italian_group$联盟#!来实现集体防卫\n"
 italian_wars_explanation_tooltip2: "域外国家能组建他们自己的#italic 域外联盟#!，以此扩大他们在此地区的影响力\n"
 italian_wars_explanation_tooltip3: "#italic 域外联盟#!领袖国的[rivals|e]或[enemies|e]可能以金钱、人力援助或直接干涉战争的方式协助#italic $italian_group$联盟#!\n"
 italian_wars_explanation_tooltip4: "意大利联盟和域外联盟领袖将可提出[ShowPeaceTreatyTypeName('dissolve_league_peace_deal')][peace_treaty|e]"
 iw_italian_league_merc_efficiency_tt: "作为#italic $italian_group$联盟#!的成员，我们的[ShowModifierTypeName('mercenary_maintenance_efficiency')]受到我们联盟控制的[ShowRegionNameWithNoTooltip('italy_region')]地点数量的修正。当处于最大值（#Y 301#!个地点）时，这将给予#G +33%#![ShowModifierTypeNameWithNoTooltip('mercenary_maintenance_efficiency')]。"
 italian_wars.1.historical_info: "$italian_group$战争是1494年至1559年间发生的一系列暴力冲突的总称，以争夺意大利统治权为目的，这些战争主要在法兰西和西班牙之间展开，并将欧洲大部分地区牵入其中。1494年，法兰西的夏尔八世入侵意大利并占领了那不勒斯，哈布斯堡的马克西米利安一世、卡斯蒂利亚的伊莎贝拉和阿拉贡的费尔南多二世（西班牙天主教双王）随即紧急向教宗求援并驱逐了法军。法军在1499年再次攻占米兰、热那亚和那不勒斯，但西班牙在1503年将法军赶出那不勒斯，控制住了南意大利，教宗儒略二世也组建联盟把法军赶出了北意大利。几年后，法王弗朗索瓦一世重申对米兰的统治权，并在1515年攻占米兰，但在1525年的帕维亚决战中兵败，被神罗皇帝查理五世（即西班牙国王卡洛斯一世）俘虏，以放弃所有对意大利的宣称权为代价获释。但一经释放，弗朗索瓦一世便同英国、教廷、威尼斯和佛罗伦萨结盟，导致德意志国土佣仆于1527年洗劫罗马，以及查理五世皇帝于1529年于博洛尼亚加冕。1559年签订的《卡托‑康布雷西和约》最终宣告意大利战争的结束，并开启了西班牙哈布斯堡王朝在意大利近150年的主导统治。"
 #Periodic flavor events (20-29)
 italian_wars.20.title: "佣兵队长的价码" #The Condottiere's Price
 italian_wars.20.desc.a: "[target_merc.GetName]的队长[target_character.GetName]已下令停止进军，并派遣信使传达[target_character.GetHerHis]要求重新谈判合同条款的意愿。此次征战的规模已远超初期的约定范围，倘若无法获得额外补偿，[target_character.GetShortNameWithNoTooltip]将不再向前推进哪怕一天。\n\n我们既可以答应其要求，将[target_merc.GetNameWithNoTooltip]继续保留在我们的军事序列；也可以选择拒绝，从而承担其在战局尚未明朗之际，[target_character.GetShortNameWithNoTooltip]将整支队伍投奔他处的风险。"
 italian_wars.20.desc.b: "[target_merc.GetName]的军校已经变得焦躁不安。他们派代表来到营地，要求重新谈判最初的合同条款。由于这支佣兵连队没有单一的队长来主持协商，这一提议其实是整个连队发出的声音。在战局依然扑朔迷离的当下，他们手中的筹码相当可观。\n\n我们必须在[target_merc.GetNameWithNoTooltip]彻底失去耐心之前，尽快决定该如何回应。"
 italian_wars.20.desc.c: "[target_merc.GetName]已传来信函，要求重新商议他们的合同条款。这场征战所持续的时间远远超出了他们最初的预期，如果没有额外补偿，他们对我们事业的忠诚与承诺将变得愈发难以确定。\n\n我们必须审慎权衡，究竟是满足他们的要求更为划算，还是承担失去他们效劳的风险代价更高。"
 italian_wars.20.a: "我们将满足他们的要求。"
 italian_wars.20.b: "我们拒绝。合同条款依旧有效。"
 italian_wars.20.c: "[ROOT.GetCountry.GetGovernment.GetRulerOrRegent.GetShortNameWithNoTooltip]将亲自处理这些谈判。"
 mercs_among_the_ranks_of_target_merc_are_reigned_in_tt: "该佣兵团将接受新条款，在新情况发生之前继续履行合同"
 mercs_extract_coin_and_supplies_from_the_land_tt: "该佣兵团将自行从周边地点抢夺金钱和补给，并为我们造成负面影响"
 target_province_loses_prosperity_extreme_penalty_tt: "所有位于[target_province.GetName]的[location|e]失去[ShowNamedValue('prosperity_extreme_penalty')|+=2%][prosperity|e]"
 italian_wars.21.title: "百战精兵" #Battle-Hardened Veterans
 italian_wars.21.desc: "历经$italian_group$冲突中无休止的战火洗礼之后，[target_army.GetName]中的老兵们携带着血战得来的勋章，回到了[target_location.GetName]附近的营地。他们的军官赞叹道，这些战士在战火中经历了脱胎换骨的蜕变，其战斗本能与纪律性已远非单纯训练所能企及。\n\n我们如何尊崇他们的经验，将在未来多年中深刻塑造我军的军魂与气质。"
 italian_wars.21.a: "让他们继续并肩作战。他们的情谊就是力量。"
 italian_wars.21.b: "他们的英勇塑造了我们民族的灵魂。"
 italian_wars.21.c: "[ROOT.GetCountry.GetGovernment.GetRulerOrRegent.GetShortNameWithNoTooltip]将亲自督导这些老兵的操练。"
 italian_wars.22.title: "逃兵问题" #The Deserters' Problem
 italian_wars.22.desc: "在[ShowRegionName('italy_region')]的漫长征战，已沉重地压在那些承担战争重负之人的肩上。我们的[ROOT.GetCountry.GetGovernment.GetCourtTitle]收到报告称，越来越多的士兵因疲惫不堪，以及对他们被要求为之效力的事业产生怀疑，而擅离职守。各阶层中的声音已开始公开附和他们的不满，我们王国内的氛围已转向某种危险地接近公然反抗的状态。\n\n我们必须在这种动荡进一步扎根之前，决定如何应对。我们可以公开谴责逃兵，惩罚那些动摇者，以此警示所有服役之人：职责不容退缩。或者，我们可以完全依靠意志力坚守防线，承受持续作战的代价，并要求身边之人一同坚持。"
 italian_wars.22.a: "懦夫与叛徒，一个不剩。"
 italian_wars.22.b: "绝不后退一步。我们坚守。"
 italian_wars.23.title: "倒戈的将军" #The Turncoat General
 italian_wars.23.desc: "[target_character2.GetName]的指挥官[target_army.GetName]已向外国势力释放出令人不安的友好信号。我们获悉，[target_character2.GetShortNameWithNoTooltip]或许正在接纳我们敌人的承诺，而[target_character2.GetHerHis]征战途中的所作所为，丝毫未能打消我们的疑虑。\n\n在这起背信弃义之举演变为公开叛变之前，[target_character1.GetName]必须果断采取行动。"
 italian_wars.23.a: "滚出军队，叛徒！"
 italian_wars.23.b: "[target_character2.GetHerHis|U]的忠诚是有价钱的。我们付得起。"
 italian_wars.23.c: "[ROOT.GetCountry.GetGovernment.GetRulerOrRegent.GetShortNameWithNoTooltip]会让[target_character2.GetShortNameWithNoTooltip]安分守己。"
 target_character2_wont_attempt_to_flee_for_10_years_tt: "[target_character2.GetShortNameWithNoTooltip]将在未来#Y 10年#!内不再尝试叛变"
 italian_wars.24.title: "盟友间的裂痕" #Relations Deteriorate
 italian_wars.24.desc: "在[target_io.GetNameWithNoTooltip]内部，我们[ROOT.GetCountry.GetGovernment.GetCourtTitle]与[target_country.GetName]之间的紧张关系已升至临界点。最初不过是些微小的分歧，如今却已恶化为公开的对立——[target_country.GetName]方面公然质疑我们对同盟共同事业的忠诚。\n\n一个四分五裂的联盟只会让伺机而动的外部势力坐收渔利，对任何人都毫无益处。我们既可以通过审慎的外交努力来弥合裂痕，也可以选择坚守立场，承担一切后果。但无论采取何种方式，我们都必须在裂痕蔓延至[target_io.GetNameWithNoTooltip]全体成员之前果断行动。"
 italian_wars.24.a: "我们将伸出橄榄枝。"
 italian_wars.24.b: "他们的不满与我们无关。"
 ruler_or_regent_skillful_diplomacy_saves_the_day: "[ROOT.GetCountry.GetGovernment.GetRulerOrRegent.GetShortName]娴熟的外交手腕缓解了局势"
 italian_wars.25.title: "袍泽之情" #Relations Flourish
 italian_wars.25.desc: "在席卷[target_io.GetName]的纷争中，我们的[ROOT.GetCountry.GetGovernment.GetCourtTitle]与[target_country.GetName]意外地达成了共识。共同的苦难与共同的敌人，完成了多年外交努力未能实现的目标，将两国人民凝聚在一起，这种结合已超越了单纯的同盟关系。\n\n这种在战争时期日益增长的默契实属罕见，不应被浪费。我们既可以选择将这份共识正式化，加强两国官方之间的联系，也可以暂时不声张，先去处理更为紧迫的事务。而这一选择，将决定[target_country.GetNameWithNoTooltip]在未来岁月中如何看待我们。"
 italian_wars.25.a: "我们将加强这些联系。"
 italian_wars.25.b: "我们还有更加紧迫的问题。"
 good_relations_will_help_keep_em_in_league_tt: "两[countries|e]之间的友好关系将增强对方继续留在联盟内的意愿"
 italian_wars.26.title: "未予回应的侮辱" #Diplomatic Incident
 italian_wars.26.desc: "在双方同盟的全体代表面前，[target_country.GetName]的[target_character.GetName]严重冒犯了我们。他的言论不仅质疑我们对[our_io.GetName]的统领地位，还挑战了我国在[ShowRegionNameWithNoTooltip('italy_region')]诸强国中的威望。这样的指控绝不能轻易置若罔闻。\n\n若对此不作回应，只会助长[target_character.GetShortNameWithNoTooltip]的嚣张气焰，并诱使其他地方效仿此类无礼之举。我们可以深究此事，要求对方作出解释——尽管这样做可能引发局势升级，而双方同盟对此或许都尚未做好准备。另一种选择则是暂且忍气吞声，静待时机。"
 italian_wars.26.a: "我们不会忍受这种侮辱。"
 italian_wars.26.b: "清算之日终将到来，但不是今天。"
 italian_wars.27.title: "战争的教训" #Military Advancements
 italian_wars.27.desc: "在[ShowRegionName('italy_region')]各地展开的无情征战中，带来的不仅是鲜血与废墟。我们的军官与学者带着来之不易的知识凯旋而归，这些知识在公开战斗的熔炉中锻造而成，并从对手的战法中得到启发。新的理念已在我们的[ROOT.GetCountry.GetGovernment.GetCourtTitle]中深深扎根，关键在于如何最充分地加以利用。\n\n我们既可以专注于深入研究战争所传授的经验教训，投资于完善自身的技艺与作战学说；也可以将这些知识立即付诸实践，运用到能为我们的军队与疆土带来实际成果的地方。"
 italian_wars.27.a: "让我们加深所学到的知识。"
 italian_wars.27.b: "我们的军队需要的是成果，而非理论。"
 italian_wars.28.title: "来自[target_location.GetNameWithNoTooltip]的工程师"
 italian_wars.28.desc: "一位声名显赫的工程师带着推荐信和新型攻城器械的详细设计图，来到了我们的[ROOT.GetCountry.GetGovernment.GetCourtTitle]。这位名为[new_character.GetName]的工程师来自[target_location.GetName]，是几位在$italian_group$中崭露头角的杰出人才之一——在那里，战争的进程已将军事工程推向了前所未有的高度。如果[new_character.GetHerHis|U]的知识能够得到充分利用，必将为我军攻破敌军城墙提供决定性的优势。\n\n[new_character.GetHerHis|U]的服务要价昂贵，而[new_character.GetSheHe]对此也毫不掩饰。尽管如此，在毕生的征战岁月中，这样的机遇依然屈指可数。"
 italian_wars.28.a: "支付[new_character.GetHerHis]酬劳。一位优秀的工程师值每一枚金币。"
 italian_wars.28.b: "我们现在负担不起。把[new_character.GetHerHim]打发走。"
 iw28_no_engineer_for_years_tt: "工程师被拒绝的传闻将在各个地区流传开来，因此在短期内将不会有类似的人才前来投奔我们"
 engineer_boosts_short_term_research_tt: "这位工程师的方法为我国学者开辟了新的研究方向，使研究工作取得了即时进展"
 engineer_boosts_literacy_efforts_tt: "工程师的技术著作与设计图纸激发了受教育阶层更广泛的求知欲"
 italian_wars.4.title: "联盟发出邀请"
 italian_wars.4.desc: "我们地区的紧张局势正在升级，战争的阴影即将笼罩意大利，这是我们人民必须面对的一个严峻威胁。为了应对外国侵略者带来的恐怖入侵，[actor.GetName]决定建立[target_io.GetName]。此后，他们向我们发出了邀请，这是一个极其重要的外交议题……"
 italian_wars.4.a: "我们接受！"
 italian_wars.4.b: "我们不能违背中立原则。"
 italian_wars.4.c: "我们效忠于[target_country.GetNameWithNoTooltip]！"
 italian_wars.9.title: "来自[actor.GetNameWithNoTooltip]的支援"
 italian_wars.9.desc: "一位来自[actor.GetName]的使者来到了我们宫廷，告诉我们他们愿意支援我们正在进行的防御战争。他们似乎十分关注地区势力的平衡，因此愿意对我们伸出援手。"
 italian_wars.9.a: "我们联合对抗共同之敌，至少现在是这样……"
 italian_wars.10.title: "天平的平衡"
 italian_wars.10.desc: "觊觎[target.GetName]土地的战争持续威胁着[ShowRegionName('italy_region')]的力量平衡。我们决不能允许另一个联盟侵犯我们的权益而在该地区建立自己的桥头堡。因此我们决定向[target.GetLongNameWithNoTooltip]提供援助，以支持他们从敌人手中保卫国土的事业。"
 italian_wars.10.a: "让我们的人手去补充他们的部队。"
 italian_wars.10.b: "他们将收到可观的赠礼。"
 italian_wars.11.title: "不归之路"
 italian_wars.11.desc: "[ShowRegionName('italy_region')]境内弥漫的紧张氛围已达到了一个临界点。那些原本勉强将敌方联盟分隔开来的最后停战协议，已在义愤之下被彻底撕毁。[target_character.GetName]与敌对联盟的领袖们已然摒弃了所有和平的伪装。一场全面而具有毁灭性的战争，就此正式拉开帷幕。"
 italian_wars.11.a: "绝无妥协，绝不投降。"
 all_leaders_of_leagues_annul_all_truces_tt: "每个同盟的[Concept( 'international_organization_leader', '领袖' )|e]均已废除其与[ShowRegionName('italy_region')]境内各国以及彼此之间的休战协定"
 as_long_as_90_tension_foreign_leaders_can_call_in_league_members_offensively_tt: "只要[situation_tension|e]保持在#Y 90#!或以上，域外联盟的领袖即可召集其[members|e]对[ShowRegionName('italy_region')]中的任何[country|e]发动进攻性战争"
 italian_wars.100.title: "$italian_group$战争的结束"
 italian_wars.100.desc: "数十年来，在我们强大的联盟旗帜下，我们不懈地为保卫家园而战，终于，这场无休止的冲突画上了句号。外来侵略者的阴霾已不再笼罩我们的国界，我们的人民正满怀希望地展望未来，并将开启一条通往永恒繁荣的道路！"
 italian_wars.100.a: "忠诚给我们力量！（拉丁格言）"
 italian_wars.100.b: "我们的主权不容置疑！"
 demand_vassalization_from_members_tt: "作为获胜同盟的领袖，我们将要求同盟其他成员成为我们的附庸"
 league_locations_owned_desc: "我方联盟拥有的地点"
 iw_send_aid_tt: "我们将通过象征性提供[manpower|e]或[gold|e]来援助选中的[country|e]"
 italian_wars.200.desc: "人们渴盼已久的和平终于因为$italian_group$战争的结束而实现了。随着所有妄图征服我们家园的域外联盟纷纷解体，和平和繁荣又重新回到了半岛。我们崛起成为[ShowRegionName('italy_region')]半岛真正的主人的道路已经一片坦途。"
 italian_wars.200.a: "[target_country.GetNameWithNoTooltip]的时代正方兴未艾！"
 italian_wars.200.desc_foreign: "尽管我军已深入[ShowRegionName('italy_region')]腹地，但$italian_group$本土同盟阵地岿然不动，成功击退了我们的进攻。我们在半岛上的野心终究未能得逞，必须坦然接受这场惨痛的失败。"
 italian_wars.200.b: "我们不会忘记这份屈辱。"
 italian_wars.300.title: "[target_io.GetNameWithNoTooltip]在[ShowRegionNameWithNoTooltip('italy_region')]的胜利"
 italian_wars.300.desc: "尽管遭受了[ShowRegionName('italy_region')]国家数十年如一日激烈而不驯的反抗，但我们目前已经牢牢控制了大部分地区。那些试图阻挠我们军队步伐的人现在都畏缩于高墙之后，胆战心惊地躲避着我们的部队。今天标志着这个地区进入了一个崭新的时代，我们对该地区的主权毋容置疑！"
 italian_wars.300.a: "[target_character.GetNameWithNoTooltip]万岁！"
 italian_wars.301.desc: "$italian_group$战争以苦涩的方式落下帷幕。一个域外势力已然确立起对[ShowRegionName('italy_region')]半岛的支配地位。尽管我们付出了种种努力，仍然未能阻止这一结局——如今，我们必须适应已在半岛上确立的新秩序。"
 italian_wars.301.a: "我们必须接受这场失败。"
 italian_wars.400.title: "[ShowCultureGroupNameWithNoTooltip('italian_group')]陷入僵局"
 italian_wars.400.desc: "尽管我国已尽了最大的努力来扭转[ShowSituationName('italian_wars')]的局势，但无论本土的国家联盟还是任何的域外强权，都无法真正实现这一地区的统一，甚至难以进一步扩展他们的影响力……"
 italian_wars.400.a: "战争，它有什么好处呢?"
 end_the_italian_wars_stalemate_tt: "[ShowSituationNameWithNoTooltip('italian_wars')]的局势以僵持告终……"
 non_princes_become_princes_tt: "身为[ShowSpecialStatusName('hre_foreign_league_member')]成员的非[GetUniqueInternationalOrganization('hre').GetMemberTitle][countries|e]将成为[GetUniqueInternationalOrganization('hre').GetName]的[members|e]"
