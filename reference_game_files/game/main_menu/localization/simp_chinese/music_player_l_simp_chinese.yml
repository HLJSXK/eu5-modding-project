 MUSIC_PLAYER_OPEN_SETTINGS: "打开音乐设置"
 Martin_Ostergren: "马丁·厄斯特格伦（风琴）"
 Martin_Rinckart: "马丁·林卡特（1586-1649年）"
 Martin_Rinckart_facts: "马丁·林卡特是一位路德宗神职人员兼赞美诗作者，生于并逝于北萨克森的艾伦堡，曾在当地担任副主教。"
 MusicPlayer_01_Overture_I_Genesis: "01 - 序曲一：创世"
 MusicPlayer_01_Overture_I_Genesis_flavour: "“世界苏醒，阳光渐渐揭开它的容颜。”"
 MusicPlayer_02_Overture_II_The_Odyssey: "02 - 序曲二：奥德赛"
 MusicPlayer_02_Overture_II_The_Odyssey_flavour: "“我们故事的序曲，在此引出其人物与主题。”"
 MusicPlayer_03_Royal_Court_Invitation: "03 - 宫廷邀约"
 MusicPlayer_03_Royal_Court_Invitation_flavour: "此曲中所闻的羽管键琴，是一种盛行于文艺复兴与巴洛克音乐时期的键盘乐器。演奏者按下琴键，带动一支羽管拨子拨动装于共鸣板上的琴弦，从而机械地发声。"
 MusicPlayer_04_In_Your_Honor: "04 - 献给你的荣耀"
 MusicPlayer_04_In_Your_Honor_flavour: "一首恢弘的乐曲，令人想起青翠的牧场，以及对上帝与自然的敬畏。"
 MusicPlayer_05_The_Rise_of_an_Empire: "05 - 帝国的崛起"
 MusicPlayer_05_The_Rise_of_an_Empire_flavour: "以《欧陆风云五》的主旋律开篇，这首乐曲有力地展现了整体体验的核心情感。"
 MusicPlayer_06_Pain_is_Salvation: "06 - 苦难即救赎"
 MusicPlayer_06_Pain_is_Salvation_flavour: "歌词融合了英语、古德语与拉丁语，讲述通往救赎之路上的苦难。"
 MusicPlayer_07_For_the_Lost_Ones: "07 - 献给逝者"
 MusicPlayer_07_For_the_Lost_Ones_flavour: "一首哀婉起伏的乐曲，呼应了《欧陆风云五》其他乐曲中的主题与动机。"
 MusicPlayer_08_No_Fear_No_Mercy: "08 - 无惧、无情"
 MusicPlayer_08_No_Fear_No_Mercy_flavour: "一首昂扬的乐曲，令人想起战斗前的宁静，以及将士们胸中忐忑跳动的心。"
 MusicPlayer_09_Libera_me_Domine: "09 - 主啊，求你救我"
 MusicPlayer_09_Libera_me_Domine_flavour: "此曲结合了天主教安魂弥撒中常见的《慈悲耶稣》与《求你救我》两段经文，祈求已故之人蒙耶稣垂怜得享安息，并在审判之日获得救赎。"
 MusicPlayer_10_Gloria_Patri: "10 - 荣耀归主颂"
 MusicPlayer_10_Gloria_Patri_flavour: "改编自巴赫《G大调第一号无伴奏大提琴组曲》（BWV 1007）第一乐章“前奏曲”的人声变奏。"
 MusicPlayer_11_Maiden_Voyage: "11 - 处女航"
 MusicPlayer_11_Maiden_Voyage_flavour: "一首舞曲节奏的乐曲，宛如驶向未知海域时翻涌的波浪。"
 MusicPlayer_12_Jester_Speaks_the_Truth: "12 - 弄臣道真言"
 MusicPlayer_12_Jester_Speaks_the_Truth_flavour: "一首受文艺复兴早期音乐启发的乐曲，围绕《欧陆风云五》音乐主旋律动机展开变奏。"
 MusicPlayer_13_Battle_of_Lutzen: "13 - 吕岑会战"
 MusicPlayer_13_Battle_of_Lutzen_flavour: "吕岑会战发生于1632年11月16日，由瑞典军队及萨克森和黑森-卡塞尔的援军对阵神圣罗马帝国皇帝的帝国军，是三十年战争中最重要的战役之一。瑞典国王古斯塔夫二世·阿道夫在此役中阵亡后，海尔布隆联盟随之成立。"
 MusicPlayer_14_Lux_aeterna: "14 - 永恒之光"
 MusicPlayer_14_Lux_aeterna_flavour: "“永恒之光”是天主教安魂弥撒中常被谱曲传唱的经文，讲述上帝的恩典与永恒之光照耀亡者。"
 MusicPlayer_15_A_Bargain_with_Beelzebub: "15 - 与别西卜的交易"
 MusicPlayer_15_A_Bargain_with_Beelzebub_flavour: "宗教与战争，以及因宗教而起的战争。虔诚与嗜血交织。这数个世纪，是被灰色阴影不断打断的、充满强烈反差的时代。"
 MusicPlayer_16_The_Path_to_Potsdam: "16 - 通往波茨坦之路"
 MusicPlayer_16_The_Path_to_Potsdam_flavour: "波茨坦在三十年战争期间失去了近半人口。"
 MusicPlayer_17_The_Coronation_of_a_Naked_Emperor: "17 - 赤身皇帝的加冕礼"
 MusicPlayer_17_The_Coronation_of_a_Naked_Emperor_flavour: "一首世俗巴洛克风格的乐曲，以弦乐与羽管键琴演奏。"
 MusicPlayer_18_Falalalan: "18 - 法拉拉兰"
 MusicPlayer_18_Falalalan_flavour: "历史总是蕴藏在音乐之中，有时甚至不止一种方式。"
 MusicPlayer_19_O_quam_gloriosum: "19 - 何等荣耀"
 MusicPlayer_19_O_quam_gloriosum_flavour: "此曲取材自托马斯·路易斯·德·维多利亚（1548-1611）为其《何等荣耀弥撒曲》所作的文本。"
 MusicPlayer_20_Thirty_Years: "20 - 三十年"
 MusicPlayer_20_Thirty_Years_flavour: "三十年战争（1618-1648）是欧洲历史上最惨烈的冲突之一，造成了450万至800万人死亡。它由16世纪的宗教改革引发，并因外部利益冲突与旧有宿怨而愈演愈烈。"
 MusicPlayer_21_Conquer_or_Fall: "21 - 征服或覆亡"
 MusicPlayer_21_Conquer_or_Fall_flavour: "一首包含圆号、弦乐与合唱的史诗乐章，以振奋人心的方式演绎了《欧陆风云五》音乐中的一大主旋律主题。"
 MusicPlayer_22_A_Message_to_The_King: "22 - 致国王的口信"
 MusicPlayer_22_A_Message_to_The_King_flavour: "一首充满急迫与热忱的乐曲，传达出刻不容缓的紧张情绪。"
 MusicPlayer_23_The_Flagellant: "23 - 苦修者"
 MusicPlayer_23_The_Flagellant_flavour: "鞭笞苦行是一种以鞭打自身来忏悔罪孽、分担耶稣受难之苦的行为，在许多基督教传统中皆有体现。鞭笞派运动兴起于14世纪的西方基督教世界，是对战争、饥荒与瘟疫的一种回应。"
 MusicPlayer_24_The_Black_Death: "24 - 黑死病"
 MusicPlayer_24_The_Black_Death_flavour: "黑死病使欧洲14世纪的人口锐减一半，是人类历史上最致命的瘟疫之一。"
 MusicPlayer_25_The_Noble_Art_of_Diplomacy: "25 - 高贵的外交艺术"
 MusicPlayer_25_The_Noble_Art_of_Diplomacy_flavour: "琉特琴家族乐器在世界诸多地区与历史时期中皆有悠久渊源，而欧洲琉特琴更是文艺复兴时期欧洲世俗音乐中的主导乐器。"
 MusicPlayer_26_Peace_of_Westphalia: "26 - 威斯特伐利亚和约"
 MusicPlayer_26_Peace_of_Westphalia_flavour: "威斯特伐利亚和约是1648年在奥斯纳布吕克和明斯特分别签署的两项和平条约的统称，它终结了三十年战争，为神圣罗马帝国带来了和平。"
 MusicPlayer_language_Galician_Portuguese: "加利西亚-葡萄牙语"
 MusicPlayer_language_Gnawa: "格纳瓦语"
 MusicPlayer_language_Middle_High_German: "中古高地德语"
 MusicPlayer_language_Old_Castilian: "古卡斯蒂利亚语"
 MusicPlayer_sol_ashanti_Aho: "阿散蒂 - Aho"
 MusicPlayer_sol_ashanti_Aho_flavour: "纳纳·奥塞·图姆·巴里马精通阿散蒂音乐与仪式所用的一切乐器，包括塞佩雷瓦琴、传统号角与打击乐器。他也是皇帝的继承人，阿散蒂王国的缔造者之一。此曲之名意为“战歌”。"
 MusicPlayer_sol_ashanti_Asanteman_Yenim_Ko: "阿散蒂 - Asanteman Yenim Ko"
 MusicPlayer_sol_ashanti_Asanteman_Yenim_Ko_flavour: "此曲歌词开篇大意为“阿散蒂人只知战斗，不知退却”，随后颂扬阿散蒂战士的英勇无敌。"
 MusicPlayer_sol_ashanti_Seperewa_Akasa: "阿散蒂 - Seperewa Akasa"
 MusicPlayer_sol_ashanti_Seperewa_Akasa_flavour: "这首歌的标题译为“塞佩雷瓦已经发言”。塞佩雷瓦是竖琴鲁特琴家族的一种乐器，拥有箱形共鸣器，10至14根琴弦通过直接缠绕在琴颈上而与之相连。它起源于西非，据说阿散蒂帝国的建立者奥塞·图图国王非常喜爱这种乐器，甚至命人打造了一件黄金复制品作为其王室礼器之一。"
 MusicPlayer_sol_aztec_Iyac: "阿兹特克 - 伊亚克"
 MusicPlayer_sol_aztec_Iyac_flavour: "$Pierre_Harmon_facts$。这首歌的标题译为“传统战士”。"
 MusicPlayer_sol_aztec_Mictlan: "阿兹特克 - 米克特兰"
 MusicPlayer_sol_aztec_Mictlan_flavour: "$Pierre_Harmon_facts$。这首歌的标题译为“冥界”。"
 MusicPlayer_sol_aztec_Teotl: "阿兹特克 - 特奥特尔"
 MusicPlayer_sol_aztec_Teotl_flavour: "$Pierre_Harmon_facts$。这首歌的标题译为“自然之神”。"
