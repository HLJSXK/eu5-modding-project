 MusicPlayer_sol_chinese_Ambush_Act_7_and_8_Jiuli_Mountain_and_The_Defeat_of_Xiang_Yu: "中国 - 十面埋伏 - 第七、八段 - “九里山大战”／“项王败阵”"
 MusicPlayer_sol_chinese_Ambush_Act_7_and_8_Jiuli_Mountain_and_The_Defeat_of_Xiang_Yu_flavour: "$MusicPlayer_sol_chinese_Ambush_from_Ten_Sides_The_Complete_Epos_flavour$"
 MusicPlayer_sol_chinese_Ambush_from_Ten_Sides_The_Complete_Epos: "中国 - 十面埋伏 - 全本"
 MusicPlayer_sol_chinese_Ambush_from_Ten_Sides_The_Complete_Epos_flavour: "中国古典音乐的杰作，通常由琵琶名家演奏。此曲以武曲风格写成，描绘了公元前202年垓下之战中项羽将军兵败于刘邦之手的情景。"
 MusicPlayer_sol_chinese_Chen_Sui: "中国 - 陈隋"
 MusicPlayer_sol_chinese_Chen_Sui_flavour: "$Yingying_Herrdahl_facts$"
 MusicPlayer_sol_chinese_Yingzhou_Gudiao_the_Birds: "中国 - 瀛洲古调 - 鸟"
