 Pierre_Harmon_facts: "皮埃尔·哈蒙是一位知名长笛演奏家，也是研究前哥伦布时期音乐的著名专家。他因在音乐学研究方面的宝贵贡献而闻名于世，尤以阿兹特克音乐研究见长，同时他还拥有规模最大的古乐器收藏之一，并倾其一生潜心钻研。"
 Pipa_facts: "中国琵琶是一种梨形的弦乐器，用指甲弹拨，历史上也曾使用拨片演奏。其起源可追溯至近两千年前，是中国最受欢迎的乐器之一。"
 Qanun_facts: "卡龙琴（qanun，又称kanun）是齐特琴家族的一种弦乐器，起源尚不确定，可能源自古代美索不达米亚。"
