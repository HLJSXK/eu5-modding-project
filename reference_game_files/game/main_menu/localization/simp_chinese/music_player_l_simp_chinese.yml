 MusicPlayer_sol_deccan_raga_keeravani: "德干 - 克拉瓦尼拉格"
 MusicPlayer_sol_deccan_raga_keeravani_flavour: "以经典的三段式卡纳蒂克风格演奏。曲名意为“虔诚之拉格”。"
 MusicPlayer_sol_deccan_raga_nattaikurunji: "德干 - 纳泰古伦吉拉格"
 MusicPlayer_sol_deccan_raga_nattaikurunji_flavour: "以经典的三段式卡纳蒂克风格演奏。曲名意为“浪漫之拉格”。"
 MusicPlayer_sol_deccan_raga_saraswathi: "德干 - 萨拉斯瓦蒂拉格"
 MusicPlayer_sol_deccan_raga_saraswathi_flavour: "以经典的卡纳蒂克三段式风格演奏。歌名译为「神秘之调」"
 MusicPlayer_sol_iroquois_Akwesasne: "易洛魁 - 阿克瓦萨斯尼"
 MusicPlayer_sol_iroquois_Akwesasne_flavour: "$Dan_Cecil_Hill_facts$ 歌名译为「鹧鸪鼓动之地」"
 MusicPlayer_sol_iroquois_Haundenosaunee: "易洛魁 - 豪迪诺索尼"
 MusicPlayer_sol_iroquois_Haundenosaunee_flavour: "$Dan_Cecil_Hill_facts$ 歌名译为「易洛魁」，这是豪迪诺索尼人的英语称呼。"
