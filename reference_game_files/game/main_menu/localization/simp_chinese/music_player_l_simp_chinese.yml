 Dan_Cecil_Hill: "丹·塞西尔·希尔（长笛）"
 Dan_Cecil_Hill_facts: "丹·塞西尔·希尔（卡尤加族，苍鹭氏族）是一位霍迪诺肖尼（易洛魁）艺术家兼音乐人，专精于传统原住民银器制作与长笛制作。他一生大部分时间都是艺术家、表演者和文化领袖，致力于保存并传播本族历史的方方面面，追溯至美国前殖民时代乃至更早。"
 Dietrich_Buxtehude: "迪特里希·布克斯特胡德（1637-1707年）"
 Dietrich_Buxtehude_facts: "1637年生于斯堪尼亚省赫尔辛堡，原名迪特里希·汉森·布克斯特胡德。布克斯特胡德被视为17世纪最重要的作曲家之一，对巴赫、亨德尔等后世作曲家影响深远。"
 Dohyo_Sol: "多尤·索尔（鲁特琴）"
 Emelie_Roos: "艾米莉·鲁斯（竖笛）"
 Emelie_Roos_and_Daniel_Burstedt: "埃米莉·鲁斯（竖笛），丹尼尔·布尔斯特德（英国管）"
 Emelie_Roos_and_Dohyo_Sol_and_Samuel_Runsteen: "艾米莉·鲁斯（竖笛）、多尤·索尔（鲁特琴）、塞缪尔·伦斯滕（古大提琴）"
 Emelie_Roos_and_Samuel_Runsteen: "艾米莉·鲁斯（竖笛）、塞缪尔·伦斯滕（古大提琴）"
 Feras_Charestan: "费拉斯·查雷斯坦（卡龙琴）"
 Feras_Charestan_and_Ilona_Danho: "$Feras_Charestan$，$Ilona_Danho$"
 Feras_Charestan_facts: "费拉斯·查雷斯坦来自叙利亚东北部的哈塞克市，曾在大马士革高等音乐学院学习卡龙琴。"
 Gabriel_Asaad: "加布里埃尔·阿萨德（1907-1997年）"
 Hakan_Glante: "霍坎·格兰特"
 Hakan_Glante_and_Bach: "Håkan Glänte, J.S. Bach"
 Ilona_Danho: "伊洛娜·丹霍（人声）"
 Jacob_Regnart: "雅各布·雷格纳特（1540年代-1599年）"
 Jacob_Regnart_facts: "雷格纳特是一位佛兰德文艺复兴时期的作曲家，生于杜埃，创作了大量宗教音乐与世俗音乐。他一生活跃于奥地利与波希米亚等地，曾于1580年代在因斯布鲁克担任费迪南大公的宫廷乐长等要职。"
 Joachim_Neander: "约阿希姆·内安德（1650-1680年）"
 Joachim_Neander_facts: "约阿希姆·内安德生于不来梅，是归正宗（加尔文派）教会的赞美诗作者、神学家兼教师。他被视为归正宗教会最杰出的赞美诗作者，共创作了约60首圣歌。"
 Lars_Paulsson: "拉尔斯·保尔森（单簧管）"
 Laurent_Sauron: "洛朗·索龙"
