 preachers_calling_desc: "一个致力于布道、教化异教徒及捍卫教义的修会。"
 almoners_calling: "施赈吏"
 almoners_calling_desc: "发誓守贫的托钵修士，乞讨面包并施舍于人，照料贫病之人。"
 confessors_calling: "告解者"
 confessors_calling_desc: "一个共同生活的托钵修会，聆听告解，以温和之手牧养灵魂。"
