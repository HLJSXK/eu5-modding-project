 # Iberian military orders
 order_of_calatrava_religious_order: "卡拉特拉瓦骑士团"
 order_of_calatrava_religious_order_desc: "由熙笃会修道院长菲特罗的雷蒙德于1158年成立，以接管被圣殿骑士团放弃的卡拉特拉瓦城堡。它是卡斯蒂利亚本土诞生的第一个军事修会。"
 order_of_santiago_religious_order: "圣地亚哥骑士团"
 order_of_santiago_religious_order_desc: "约于1170年建立，旨在保护前往圣地亚哥‑德孔波斯特拉的朝圣者，以及对摩尔人发动圣战。"
 order_of_alcantara_religious_order: "阿尔坎塔拉骑士团"
 order_of_alcantara_religious_order_desc: "1166年左右成立时最初名为圣胡利安·德尔佩雷罗骑士团，后来在1218年被授予阿尔坎塔拉后更名。"
 order_of_christ_religious_order: "基督骑士团"
 order_of_christ_religious_order_desc: "该骑士团于1319年由葡萄牙国王迪尼什特许成立，作为被取缔的圣殿骑士团的继承者，继承了他们在葡萄牙的地产，并将修道院设在托马尔。"
 order_of_avis_religious_order: "阿维什骑士团"
 order_of_avis_religious_order_desc: "采纳本笃会规的葡萄牙骑士团，以1211年左右授予它的城镇阿维什命名。"
 order_of_montesa_religious_order: "蒙特萨骑士团"
 order_of_montesa_religious_order_desc: "由阿拉贡国王海梅二世为接管解散的圣殿骑士团在阿拉贡王冠领的地产而创建，总部位于巴伦西亚的蒙特萨城堡。"
 benedictine_order_religious_order: "本笃会"
 benedictine_order_religious_order_desc: "这些黑衣修士遵循努西亚的圣本笃于六世纪撰写的《会规》——西方隐修制度的基石。他们的修道院长成为了教会的重要领主。"
 cistercian_order_religious_order: "熙笃会"
 cistercian_order_religious_order_desc: "1098年为了回归对《本笃会规》的严格恪守在熙笃成立的修会。其白衣修士及平信徒弟兄以开垦荒地并在田庄大规模劳作而闻名。"
 augustine_order_religious_order: "奥斯定会"
 augustine_order_religious_order_desc: "由神父组成的团体，依照圣奥斯定的规则共同生活，既不完全是修士，也不属于世俗神职人员。他们的驻地服务于大教堂，开办学校和医院，还牧养各个教区。"
 dominican_order_religious_order: "道明会"
 dominican_order_religious_order_desc: "道明会由多明我·德古斯曼创立，旨在以学识与言辞对抗异端。其修士占据大学的讲席，自基督教世界各大宣讲坛上辩论教义。"
 franciscan_order_religious_order: "方济会"
 franciscan_order_religious_order_desc: "亚西西的方济各所创立的方济会的修士，立誓效仿基督，恪守绝对的清贫。他们行走于城镇贫民之间，以行乞为生，以身作则布道传教。"
