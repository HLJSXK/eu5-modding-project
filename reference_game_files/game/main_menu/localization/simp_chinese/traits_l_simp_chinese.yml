 disfigured_die_desc: "[CHARACTER.GetSheHe|U]以可怕的面部毁容为人所知，那残缺的脸触目惊心。"
 castrated: "去势"
 desc_castrated: "该角色被阉割了，这意味着再无法生育。"
 castrated_die_desc: "在遭受残忍的阉割后，[CHARACTER.GetSheHe]发现自己既无法满足自己，也无法满足他人。"
 sickly: "多病"
 desc_sickly: "该角色身体欠佳，时常生病。"
 sickly_die_desc: "[CHARACTER.GetSheHe|U]悲惨的一生中始终与疾病作斗争。"
 sickly_born_with: "不幸生来就$TRAIT$，自幼体弱多病，常年咳嗽气喘不止。尚在襁褓之中，众人便为其忧心忡忡，唯恐其不幸夭折。"
 healthy: "健康"
