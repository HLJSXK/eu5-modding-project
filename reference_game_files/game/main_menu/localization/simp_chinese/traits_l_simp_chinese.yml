 drunkard_die_desc: "[CHARACTER.GetHerHis|U]醉酒昏聩以及奢侈的品味让这个国家比[CHARACTER.GetSheHe]新登基时更加贫弱。"
 sinner_die_desc: "[CHARACTER.GetHerHis|U]罪恶的一生只给我国带来了耻辱。"
