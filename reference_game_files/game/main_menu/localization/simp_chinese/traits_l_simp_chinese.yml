 #Personality Modifier Descriptions - Note: don't refer directly to the sex or title of the monarch.
 desc_conqueror: "这个统治者是一位征服者。在他的统治下，我们能够有效地将更多土地变成我们国土的一部分。"
 desc_tolerant: "这个统治者待人宽容。宗教中的少数派将会在我们的领土上茁壮成长。"
 desc_just: "这个统治者处事公正。由于他对国家内许多法律和风俗习惯有独到的见解，我们的臣民都相信自己处于正确而公正的领导下。"
 desc_righteous: "这个统治者为人正义。我们的人民将更少质疑我们的权威，因为他们知道正义的统治者永远以他们的利益为重。"
 desc_kind_hearted: "这个统治者心地善良。他对国内普罗大众的关爱让他深受爱戴。同时，我们的国家更能经受艰苦岁月的磨砺，尤其是战火的洗涤。"
 desc_free_thinker: "这个统治者思维发散。他不受严格的教条束缚，鼓励每一个人尝试新事物并自由地思考我们伟大的国家将走向何方。"
 desc_well_connected: "这个统治者人脉通达。我们的宫廷和内阁都受益于我们统治者那张网罗了当代巨擘的宽广人脉网。"
 desc_calm: "这个统治者处变不惊。他从不动怒、从不失态，因此能够以身作则，思考周密，让我们得以从任何危机中全身而退。"
 desc_careful: "这个统治者行事谨慎。通过谨慎地在各国之间斡旋，他能够尽量减少由我们的过失造成的不利自身的影响。"
 desc_secretive: "这个统治者守口如瓶。他本能地知道闭门磋商和信件加密的必要性，这让我们整个政府难以被敌国渗透。"
 desc_intricate_web_weaver: "这个统治者善于暗中网罗情报。他不断策划新的密谋，能够亲自参与大量外国情报工作。"
 desc_well_advised: "这个统治者能做到兼听兼信。他总是乐于聆听明智的谏言，这吸引了许多贤士来到我们的宫廷。"
 desc_benevolent: "这个统治者温和宽仁。乐于行善的名声是一笔巨大的财富，这能帮助我们安抚我们的臣民。"
 desc_zealot: "这个统治者狂热敬神。我们的统治者狂热地将一切投入到正统信仰之中，激励着更多人皈依国教。"
 desc_pious: "这个统治者虔诚无比。他虔敬的精神将确保我国能走上正道，而不会迷失自我，同时，这也将激发我们对自己信仰的信心。"
 desc_lawgiver: "这个统治者是一位立法者。法律是建立、统合国家的基础。我们的统治者致力于精简法律条文，以完成一套更加公正，更加符合中央集权思想的法令体系。"
 desc_midas_touched: "这个统治者能够点石成金。他的才能让每一个有利可图的机会都为国家创造财富。只要他一息尚存，我国的财源就不会枯竭。"
 desc_incorruptible: "这个统治者清正廉洁。从多个方面看来，现代国家的建设就是一场反腐斗争。政府官员总是千方百计地收受贿赂，提携亲友似乎总是人之常情。我们的统治者坚决抵制这股不正之风，为全国上下树立了一个好榜样。"
 desc_architectural_visionary: "这个统治者在建设方面富有远见。改善基础设施对这个时代的任何国家来说都万分重要，他就是可担此大任的能人。我们的统治者拥有宏大的设想，又善于理解他人意图，还掌握节俭的艺术，他是我国的无价之宝。"
 desc_scholar: "这个统治者是一位学者。我们统治者那要洞悉万物的渴望让其能先于众人有效地理解并推行全新的技术。"
 desc_entrepreneur: "这个统治者是个实业家。他能看透层层阻隔，把握种种机遇，看出新计划的潜力，能为我国经济发展提出各种有益的计划。"
 desc_industrious: "这个统治者勤于政事。他从不满足于片刻休息，通过日复一日的工作，我们的统治者不断对国境内每个省份施行尽可能细化的管理，以使各资源的产量和国库的收入达到最大化。"
 desc_expansionist: "这个统治者热衷于开疆拓土。我们的统治者亲自参与新土地的宣称拓殖和移民定居工作。他致力于确保殖民扩张在我国处于首要地位。"
 desc_charismatic_negotiator: "这个统治者是个魅力非凡的说客。通过亲自参与外交谈判，我们的统治者常常能够让别国设身处地的接受我们的观点。"
 desc_silver_tongue: "这个统治者能言善道。在我们与别国的交流中，我们的统治者能够示人以我们过去行为影响良好的一面。一旦我们的邻国了解到我们行为的真正原因，他们就能长期谅解我们的行动。"
 desc_tactical_genius: "这个统治者是一位战术天才。他在战场机动和虚实方面的强烈兴趣和刻苦钻研，将会使我们所有将领对这些事务产生更大的兴趣，积攒宝贵的经验。"
 desc_bold_fighter: "这个统治者争勇斗狠。他相信搏斗对战场局势有重大影响。我们的统治者是无畏的征服者，他激励众人带领部队向敌阵冲锋。这种勇气应当是可贵的。"
 desc_fierce_negotiator: "这个统治者是一位强硬的谈判者。在任何条约或谈判中，此人都不会轻易让步，而是会据理力争以最大程度维护我方利益。"
 desc_strict: "这个统治者治军严明。由于他对部队的行为规范有极大兴趣，他向上上下下每一个人灌输严格的纪律意识。"
 desc_inspiring_leader: "这个统治者能够鼓舞人心。他优秀的领导指引最怯懦的人找到勇气。"
 desc_martial_educator: "这个统治者是个军事教育家。当前部队中军官团队的训练和教育是我们的首要任务。"
 desc_babbling_buffoon: "这个统治者是个喋喋不休的小丑。尽管他在外交问题上与邻国交谈甚欢，却并不能证明他确有这方面的才干。任何人都很难准确了解我们的真实立场，很多时候，我们统治者太过无能，对我们的谈判有害无利。"
 desc_embezzler: "这个统治者是个腐败分子。他唯一感兴趣的事情就是把国库里的钱放进他私人的腰包。"
 desc_drunkard: "这个统治者放纵不羁。我们的统治者一直在寻找能使自己摆脱无趣尘世的慰藉，因此日夜在诸如酒精之类物品的刺激下声色犬马。有一位纸醉金迷的统治者是国之不幸。"
 desc_sinner: "这个统治者的罪恶路人皆知。他领导国家时所体现出的个人缺点使宗教界站在了我们的对立面。"
 desc_greedy: "这个统治者欲壑难填。国家财政收入在我们统治者强硬却短视的政策下不断增长。他根本不会停下追求收入的脚步。这将彻底摧毁各种资源的长期增长，那些鼠目寸光的行为最终将导致税收的下降。"
 desc_cruel: "这个统治者残暴无道。他专断残忍的传闻让我们的许多国民感到不安。这本身可能不足以激起叛乱，但这让任何危机都可能冲破公众的底线，因为人们总是不缺作乱的理由。"
 desc_naive: "这个统治者幼稚且容易头脑发热。他总是盲目而不假思索地处理事务，而且低估其所带来的恶果，这让我们的邻国更难以谅解他怠慢和冒犯的行为。"
 desc_craven: "这位统治者怯懦至极。他极度畏惧肉搏战，因此尽可能远离战场。我们将士们不得不意识到，他们只能孤军奋战。"
 desc_loose_lips: "这个统治者容易泄露信息，往往轻信他人，易受愚弄。我们的统治者对我们的反间谍活动十分不利，实属不幸。"
 desc_obsessive_perfectionist: "这个统治者有完美主义强迫症。他对细枝末节的兴趣大过他处理此事的才能。他在我们建设国内基础设施时不断地造成干扰和延误，这样恐怕弊大于利。"
 desc_malevolent: "这个统治者蛇蝎心肠。你的统治者的行为常被视为动机不良。因此，任何原本臣服于我们的国家都很容易被我们惹恼，我们的一切行动都使他们感到害怕。"
 #Leaders (Generals and Admirals)
 glory_seeker: "荣誉追逐者"
 desc_glory_seeker: "这位陆军将领追求荣誉。其带领的军队会获得更多的威望和陆军传统，因为他们总在最能改变战况的位置现身，出尽风头。"
 born_to_the_saddle: "生于马背之上"
 desc_born_to_the_saddle: "这位陆军将领生于马背之上。他带领的骑兵会更好地利用侧翼优势。"
 offensive_planner: "进攻策划师"
 desc_offensive_planner: "这位陆军将领是位进攻策划师。他指挥的军队将在战斗中获得加成。"
 defensive_planner: "防守策划师"
 desc_defensive_planner: "这位陆军将领精于谋划防守。他领导的军队更善于抵抗冲击。"
 battlefield_medic: "战地医生"
 desc_battlefield_medic: "这位陆军将领被称为战地医生。在他的领导下，更多的士兵能在战斗之后恢复并增援他们原属的部队。"
 ruthless: "冷酷无情"
 desc_ruthless: "这位陆军将领很残忍。他指挥的军队能造成更多的火力伤害。"
 inspirational_leader_general: "激动人心的教官"
 desc_inspirational_leader_general: "这位陆军将领是位鼓舞人心的将领。他指挥的军队在战败后恢复士气更快。"
 master_of_arms: "武器大师"
 desc_master_of_arms: "这位陆军将领是位武器大师。他指挥的步兵效率更高并能造成更多伤害。"
 goal_oriented: "专注的行军者"
 desc_goal_oriented: "这位陆军将领专注于目标。他指挥的军队向目标行军的速度更快。"
 hardy_warrior: "坚韧的战士"
 desc_hardy_warrior: "这位陆军将领是位坚韧的战士。他指挥的军队对严酷环境更具耐性且[attrition|e]较低。"
 siege_specialist: "围城专家"
 desc_siege_specialist: "这位陆军将领是攻城专家。他指挥的围城会更有效率，结束得也更快。"
 cannoneer: "炮手"
 desc_cannoneer: "这位陆军将领是位炮手，因对火药与大炮的狂热而闻名。他指挥的炮兵会更有效率。"
 aggressive_commander: "激进的提督"
 desc_aggressive_commander: "这位海军将领是个激进的提督。他指挥的舰队将在战斗中获得加成。"
 extortioner: "海上会计师"
 desc_extortioner: "这位海军将领是个敲诈者。他知道如何最好地利用力量优势以达到事半功倍的效果，他指挥的[ships|e]能产生更多的贸易竞争力。"
 ruthless_blockader: "残忍的封锁者"
 desc_ruthless_blockader: "这位海军将领是个残忍的封锁者。他指挥的舰队能更高效地实施[blockade|e]任务。"
 buccaneer: "海盗"
 desc_buccaneer: "这位海军将领是个海盗。他指挥的私掠船效率更高。"
 prize_hunter: "战利品猎手"
 desc_prize_hunter: "这位海军将领是个战利品猎手。他麾下的船长能夺取更多战利品并俘虏更多[ships|e]。"
 ironside: "铁人"
 desc_ironside: "这位海军将领是个铁人。他指挥的[ships|e]会承受更少的伤害。"
 naval_engineer: "海军工程师"
 desc_naval_engineer: "这位海军将领是位海军工程师。他指挥的[ships|e]能更快地修复航行和战斗中遭受的损伤。"
 naval_showman: "海军之花"
 desc_naval_showman: "这位海军将领爱出风头。他指挥的[ships|e]能在战斗中获得更多的威望和海军传统。"
 ram_raider: "强袭者"
 desc_ram_raider: "这位海军将领是位强袭者。他指挥的桨帆船作战效率更高并能在海战中造成更多伤害。"
 naval_gunner: "海军炮手"
 desc_naval_gunner: "这位海军将领被称作海军炮手。他麾下那些训练有素的炮手能使重型[ships|e]造成更多伤害。"
 accomplished_sailor: "熟练的水手"
 desc_accomplished_sailor: "这位海军将领是位熟练的水手。丰富的航海知识能提升他手下所有船长的能力，他指挥的[ships|e]能更快到达目的地。"
 level_headed: "沉稳者"
 desc_level_headed: "这位海军将领非常沉稳。凭借刻苦的训练和冷静的头脑，他指挥的船员在海战中受到攻击时会受到更少的士气损失。"
 military_theorist: "军事理论家"
 desc_military_theorist: "这位陆军将领是有史以来最伟大的理论家之一，并且有能力在实践中运用这些理论。"
 strategist: "战略家"
 desc_strategist: "这位陆军将领是一位无与伦比的战略家和军事天才。战场上的每一个动作都显示出残酷的效率，任何要塞都无法抵挡这位领袖的狡猾才智。"
 mamluk: "马穆鲁克"
 mamluks: "马穆鲁克"
 desc_mamluk: "这位陆军将领曾经是训练有素的专业$mamluks$，他们最初是被作为奴隶交易的，但他们的战争天赋使他们脱颖而出，以至于他们的主人将他们训练成了一支职业战士队伍。"
 eunuch: "阉人"
 desc_eunuch: "该角色天生不具备生育能力，或是在性征发育前被有意阉割。宦官通常服务于多妻制文化下的宫廷，承担特定的社会职能。这类职位往往专为无法繁衍后代的个体所设立。"
 eunuch_die_desc: "[CHARACTER.GetSheHe|U]称得上是其同僚中秉笔掌印的佼佼者，不管是[CHARACTER.GetHerHis]的盟友还是死敌都将把[CHARACTER.GetSheHe]的所作所为深深铭记。"
 eunuch_born_with: "不幸生来就是$TRAIT$，身体的残缺使其永远无法拥有自己的子嗣。"
 raised_by_eunuchs: "宦官抚养"
 desc_raised_by_eunuchs: "该角色自幼便生活在宦官的环绕之中，对宦官怀有深深的同情。"
 raised_by_eunuchs_die_desc: "[CHARACTER.GetSheHe|U]毕生如同傀儡一般，在权势显赫的太监集团操控下度过。"
 dragon_tiger: "龙虎将军"
 desc_dragon_tiger: "这位指挥官的赫赫威名在[ShowContinentNameWithNoTooltip('asia')]东端的辽阔土地上广为流传，因此被尊称为$dragon_tiger$。"
 dragon_tiger_die_desc: "[CHARACTER.GetSheHe|U]威如龙虎，战场上所向披靡，可曾有人能将[CHARACTER.GetHerHim]击败？"
 hussar_commander: "骑兵统领"
 desc_hussar_commander: "这位将军是一名真正的骑兵指挥官。在他的指挥下，冲锋在前的骑兵队伍将所向披靡。"
 hussar_commander_die_desc: "[CHARACTER.GetSheHe|U]曾是一名令人胆寒的骑兵领袖，立下了赫赫战功。没有[CHARACTER.GetHerHim]的领导，我们的骑兵可能很难再取得这样的荣耀了。"
 triumphant: "凯旋将军"
 desc_triumphant: "一位将军在凯旋后，由本国元老院擢升，并被授予军人所能获得的最高荣誉，赢得了所有人的尊敬与仰慕。"
 triumphant_die_desc: "[CHARACTER.GetSheHe|U]在凯旋后，由本国元老院擢升，并被授予军人所能获得的最高荣誉，赢得了所有人的尊敬与仰慕。"
 #Artists
 gold_loving: "爱财"
 humble: "谦卑"
 workaholic: "工作狂"
 lazy: "懒惰"
 prominent: "声名显赫"
 inconspicious: "不显眼"
 meticulous: "一丝不苟"
 careless: "粗心"
 adept: "行家"
 amateur: "业余"
 prescient: "灵光乍现"
 idler: "游手好闲"
 desc_gold_loving: "持有该特质的艺术家将索要更丰厚的报酬，因为他们对任何有价值的闪亮物品都情有独钟。有钱能使鬼推磨，信奉这一理念的艺术家们将尽可能多地索要赞助费。"
 desc_humble: "尽管在各个艺术领域的才干已经无需多言，但拥有这一特质的艺术家仅收取适当的费用。对于他们而言，谦逊是百般美德的基础，也是他们人格的基石。"
 desc_workaholic: "人们往往形容艺术的大师们“废寝忘食”，这是毫不夸张的。这种精神发源于他们对自己手艺的无限投入。在完成下一个作品之前，他们宁愿不吃不喝，也不眠不休。"
 desc_lazy: "既然能明天完成，何必非要今天就做完？拥有这一特质的艺术家脑子里常冒出这样的念头，让他们能放慢艺术创作进程，去享受生活中更美好的事物。"
 desc_prominent: "还有什么方式比聘请一位杰出的艺术家更能铭刻我们的事迹？拥有这种特质的艺术家所创作的作品将对我们的文化产生更大的影响，并在深深影响我们的属国和邻国。"
 desc_inconspicious: "拥有这一特质的艺术家不知为何很难创作出在文艺界产生轰动的作品。事实上，这些艺术家深深相信“少即是多”的道理，即便要舍去的是他们的威望和艺术名声。"
 desc_meticulous: "创造艺术并专精一技从来都不是一件易事。拥有这一特质的艺术家往往拥有无可挑剔的组织力，并在其领域挥洒自如。总而言之，他们总能创作出冠绝于世的艺术品，并给出绝对相称于这个质量的要价。"
 desc_careless: "画像上这位王亲的脸上怎么多了块红斑？是某种恶毒的政治隐喻，还是单纯是艺术家犯了个粗心的错误？不管怎样，拥有这一特质的艺术家在创作时常常手忙脚乱，导致创作出的艺术品往往质量不佳。"
 desc_adept: "技艺是区分大师和学徒的关键因素。拥有这一特质的艺术家往往能比其他人更快地磨炼和精进自己的技艺。"
 desc_amateur: "人总都有刚起步的时候。拥有这一特质的艺术家往往学得很慢，用更长的时间打磨自己的艺术技能。"
 desc_prescient: "灵感才是那些最好、最出名、最能定义我们历史的杰作的基石。拥有这一特质的艺术家总能更机敏地捕捉灵感，因此也更能频繁地开启创作。"
 desc_idler: "艺术创作并非轻而易举之事。这是一个需要将人类最重要的一些技能与灵感和自信融为一体的过程。然而，拥有这一特质的艺术家在这些方面有所欠缺，因此不太可能开始创作新的艺术作品。"
