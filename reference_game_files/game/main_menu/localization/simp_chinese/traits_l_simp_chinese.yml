 #Explorers
 curious_adventurer: "好奇的冒险家"
 desc_curious_adventurer: "这位探险家是个好奇的伙计，在踏上地区内所有岛屿之前绝不会停止探索；为了揭开新世界的秘密，海岸线已经被绘制出来。与其他探险家不同，此人并不关心个人利益。"
 curious_adventurer_die_desc: "天知道[CHARACTER.GetHerHis]的好奇心最终是否得到了满足。"
 navigator: "航海家"
 desc_navigator: "这位探险家有着多年的航行经验，知道如何在危险的海域操纵他们的[ship|e]。"
 navigator_die_desc: "[CHARACTER.GetSheHe|U]一定已航行在那片永远风平浪静的海。"
 treasure_hunter: "宝藏猎人"
 desc_treasure_hunter: "这个探险家只在乎钱，愿意不惜一切代价来寻找新世界最稀有的宝藏——即使这是以牺牲原住民为代价的。"
 treasure_hunter_die_desc: "遗憾的是，[CHARACTER.GetSheHe]没能将任何宝藏带到那个世界。"
 cartographer: "制图师"
 desc_cartographer: "这个探险家是个地图迷，钟爱探索未知的土地。虽然花费更多时间，但他们的记录会非常详细。此外，他们对工作的热爱使他们能够忍受较低的报酬。"
 cartographer_die_desc: "[CHARACTER.GetSheHe|U]现在前去丈量人们无法抵达的土地了。"
 scientist_on_sea: "海上科学家"
 desc_scientist_on_sea: "这位探险家首先是一位科学家。绘制地图对他们来说远不如研究新世界的动植物重要。"
 scientist_on_sea_die_desc: "[CHARACTER.GetHerHis|U]的名字将永远铭记在以[CHARACTER.GetSheHe]命名的动植物之中。"
 #Children
 child_prodigy: "天生奇才"
 child_prodigy_die_desc: "[CHARACTER.GetName]的去世让人深感痛心，命运的曙光还未闪耀于前途便已猝然湮灭。"
 desc_child_prodigy: "这个孩子的未来前途无量，其注定要在史书上留下自己的名字。"
 child_gifted: "天赋异禀"
 child_gifted_die_desc: "[CHARACTER.GetName]的去世是一个可悲的损失，一个光明的前途夭折了。"
 desc_child_gifted: "这个孩子展现出的技能和未来的潜力，让成年人都惊叹不已。"
 child_slow: "资质平平"
 child_slow_die_desc: "[CHARACTER.GetName]的去世令人怜悯，这孩子的一生并不如他人那般轻松。"
 desc_child_slow: "这个孩子不是同辈中最聪明的，因此不得不付出额外的努力才能跟上他人步伐。"
 child_idiot: "心智低下"
 child_idiot_die_desc: "[CHARACTER.GetName]的去世令人悲伤，却也让人松了口气，毕竟这可能是这孩子最好的未来。"
 desc_child_idiot: "这个孩子是个十足的白痴，几乎难以描绘出一个体面的未来。"
 child_intelligent: "聪慧明理"
 child_intelligent_die_desc: "[CHARACTER.GetName]的去世令人忧伤，同时感叹失去了一位有能力的人。"
 desc_child_intelligent: "这个孩子已被证明具有先天的才智，可以进一步成长。"
 child_gregarious: "活泼开朗"
 child_gregarious_die_desc: "在[CHARACTER.GetName]不幸且短暂的一生中交往过的很多人都会为[CHARACTER.GetHisHer]的过世难受。"
 desc_child_gregarious: "这个孩子喜欢不断地被别人围绕，并陶醉于与他们的互动。"
 child_rowdy: "精力旺盛"
 child_rowdy_die_desc: "[CHARACTER.GetName]终于休息了。见到[CHARACTER.GetHimHer]如此安静，真奇怪。"
 desc_child_rowdy: "这个孩子一点也静不下来，总是要彰显自己的存在，与平和规矩毫不相干。"
 child_ambitious: "野心勃勃"
 child_ambitious_die_desc: "不幸的是，[CHARACTER.GetHisHer|U]满怀雄心的梦想将无法实现了。"
 desc_child_ambitious: "这个孩子很清楚自己要什么，而且想要的绝非寻常之物。若有可能，他恨不得将整个世界都收入囊中。"
 child_gallant: "意气风发"
 child_gallant_die_desc: "所有人都为[CHARACTER.GetName]的去世而哭泣，似乎[CHARACTER.GetHeShe]太完美了，以至于不能在这个世界上久留。我们再也见不到像[CHARACTER.GetHimHer]这样的人了。"
 desc_child_gallant: "尽管还是个孩子，但其已经是骑士精神的缩影。勇敢、高雅、礼貌、细心，其长大后一定值得拥有许多诗歌和故事。"
 child_shrewd: "机智过人"
 child_shrewd_die_desc: "即使是[CHARACTER.GetName]的计谋和智略也无法让自己逃离死神。[CHARACTER.GetHeShe|U]终于遇到了一个可以胜过[CHARACTER.GetHimHer]的家伙了。"
 desc_child_shrewd: "无论这个孩子在哪里，在做什么，其思维总是像刀子一样锋利。在智力竞赛中没有人能将其打败。"
 unsuited_for_army_command: "不适合指挥陆军"
 unsuited_for_army_command_die_desc: "幸运的是[CHARACTER.GetName]那些不靠谱的策略不再是一个值得关注的问题了。许多人都在为[CHARACTER.GetHisHer]的离世而高兴，[CHARACTER.GetHimHer]手下的人也不再需要忍受[CHARACTER.GetHisHer]那些愚蠢决定了。"
 desc_unsuited_for_army_command: "当这样的人试图领导军队时，对战略和军事战术的糟糕理解任何时候都会导致灾难，所有身边的军官都只盼着这位无能的将领能像个徒有其表的稻草人一样站着，别再喋喋不休地发布愚蠢指令。"
 unsuited_for_naval_command: "不适合指挥海军"
 unsuited_for_naval_command_die_desc: "一旦出海，[CHARACTER.GetName]就无法在胃里留下一点东西，这显然是个灾难。全国的水手都松了一口气，因为[CHARACTER.GetHeShe]再也不会弄脏他们的甲板了。"
 desc_unsuited_for_naval_command: "要领导一支舰队，必须有清晰的航向感，更要扛得住海浪的颠簸。如果连这都做不到，那对掌舵来说便如同船锚一般无用，在甲板上纯粹就是个累赘。"
 unsuited_for_country_ruling: "不适合统治国家"
 unsuited_for_country_ruling_die_desc: "终于，[CHARACTER.GetName]还是死了，[CHARACTER.GetHisHer]那些有害的政策也成了过往。"
 desc_unsuited_for_country_ruling: "领导与治理国家并非人人皆能胜任。尽管一些政府曾见证过相当多的无能统治者，但此人尤其不适合——要么是缺乏意愿，要么是不具备成为任何一个体面国家领导者的能力。"
 #RELIGIOUS_FIGURES
 efficient_administrator: "高效的行政家"
 desc_efficient_administrator: "经文与圣书不仅承载着灵性的智慧，更蕴含了管理日常生活的指南。此等人士在这方面非常出色，乃至能够左右他人的行为，并且能够最有效地管理和指导官僚程序。"
 efficient_administrator_die_desc: "[CHARACTER.GetName]离世后，政府运转因[CHARACTER.GetHerHis]的离去而变得迟缓。失去了[CHARACTER.GetNameWithNoTooltip]的高效指引，公文与指令再也无法如以往那般顺畅流转。"
 proselytizer: "劝谕者"
 desc_proselytizer: "世间或许存在诸多信仰，但真正的正道唯有一条。引导迷途者皈依正信的热忱，不仅能巩固正信的群体，更能确保他们行走于光明之路。"
 proselytizer_die_desc: "[CHARACTER.GetName]已逝，无数因[CHARACTER.GetSheHe]昭示真道而蒙受救恩的灵魂，此刻正为[CHARACTER.GetHerHis]的离去哀泣。[CHARACTER.GetHerHis|U]乃是信仰路上永不熄灭的明灯，世人也必将长久追念[CHARACTER.GetHerHis]的指引。从此长夜漫漫，迷途惶惶。"
 reverend_teacher: "启发者"
 desc_reverend_teacher: "世界上称得上知识渊博之人寥寥无几，而这样的人总因其教诲而受到世人追随。伟大的导师深受尊崇与敬重，很快会聚集起一群忠实的门徒，"
 reverend_teacher_die_desc: "[CHARACTER.GetName]的渊博学识未能挽救[CHARACTER.GetHerHim]的生命。当[CHARACTER.GetSheHe]咽下最后一口气时，众多弟子为[CHARACTER.GetHerHim]的离世而哀悼，这个世界也因此少了几分智慧。"
 ascetic: "苦行者"
 desc_ascetic: "宗教生活的真谛在于全心奉献于信仰，而非沉溺世俗欢愉。此人谨守此道，摒弃一切享乐，践行苦修以最简朴的条件度日。"
 ascetic_die_desc: "[CHARACTER.GetName]的离世虽来得突然，，却也并非意外之外。[CHARACTER.GetHerHis|U]对一切物质，乃至食物的严苛戒绝，产生必然的后果。众多追随者虽景仰并效仿[CHARACTER.GetHerHis]的修行，但[CHARACTER.GetHerHis]的离去仍会令人感到惋惜。"
 mystic_seer: "洞见者"
 desc_mystic_seer: "理清命运的丝线，窥破未来的帷幕，绝非易事。许多尝试者若真能窥见一二，也往往会被所见之物逼疯。然而，对于真正的预知者而言，未来再无秘密可言。"
 mystic_seer_die_desc: "即使是[CHARACTER.GetName]那闻名于世的预言，也没能将自己自死亡中拯救。无人知晓[CHARACTER.GetSheHe]是否早已在预见中窥见自身的终局——即便得见，[CHARACTER.GetSheHe]终究未能挣脱命运的轨迹。"
 literalist: "经训家"
 desc_literalist: "圣典与古籍是信仰的基石。然而，此人将这种观念推向了极端，视经文为唯一不容置疑之权威。不仅如此，其坚信经文不可更改、字字绝对无误，连词句的先后顺序都自有其深意。"
 literalist_die_desc: "[CHARACTER.GetName]已经离世，随[CHARACTER.GetHerHim]一同离去的，还有[CHARACTER.GetHerHis]对经文的严格遵循。在[CHARACTER.GetHerHis]的葬礼上，信徒们吟诵了他[CHARACTER.GetHerHis]最为珍视的经文段落，让信仰的真言得以在死后依然伴随[CHARACTER.GetHerHim]。"
 unorthodox: "离经叛道"
 desc_unorthodox: "尽管对于信仰而言，我们可能在某些方面存在不同看法，但有些立场通常比其他立场更易被接受。此人所持的却是一些较不常见的观点，这容易招致宗教界的非议，乃至为世俗所边缘化。然而，也有许多人持有相同见解，或至少饶有兴趣愿意倾听。"
 unorthodox_die_desc: "[CHARACTER.GetName]已经去世，我们宗教界那些最保守的人看到[CHARACTER.GetHerHis]的“古怪言行”终于画上句号，不禁松了口气。然而，还有许多人则为[CHARACTER.GetHerHis]的离去而哭泣，哀伤不得不与[CHARACTER.GetHerHis]那更为开阔的思想视野告别。"
 hermit: "隐修者"
 desc_hermit: "显然，持续的社交活动并非对所有人都最有益，尤其对于那些想将一生奉献给宗教的人来说。此人便是其中一员，更愿隐居独处，而非混迹人群，以便更好地与神灵交流，且对他人事务毫无主动探究之心。"
 hermit_die_desc: "[CHARACTER.GetName]已经去世，不过由于[CHARACTER.GetHerHis]的与世隔绝，人们实际上过了几天才注意到。即便是[CHARACTER.GetHerHis]的追随者，彼此之间与[CHARACTER.GetHerHim]的接触也并不多。如今[CHARACTER.GetSheHe|U]已然离世，他们与[CHARACTER.GetHerHim]的联系也将彻底断绝。"
 alms_giver: "施恩者"
 desc_alms_giver: "那些与困苦者分享的人是有福的。此人将此教诲视为重中之重，向穷人施舍钱财，分发食物与硬币。一群效仿其行径的信徒也随之而来，如此，底层民众的需求便得到了照料。"
 alms_giver_die_desc: "[CHARACTER.GetName]的去世引起了巨大的哀痛，尤其以贫苦之人为甚。他们常年受到[CHARACTER.GetHerHis]善行接济，也将是最怀念[CHARACTER.GetHerHim]的人。"
 stargazer: "观星者"
 desc_stargazer: "自人类诞生之初，星辰便始终令人为之着迷，无数人试图从中探寻神性的存在。此人便是其中一员，总是将目光投向天空，渴望寻求知识与答案。毕竟，若你愿抬头仰望，也能从群星间学到不少东西。"
 stargazer_die_desc: "[CHARACTER.GetName]的生命已如流星般划过，许多人哀叹世界因之变得多么黑暗。苍穹的知识再也不会通过[CHARACTER.GetHerHis]的声音传递下去，那些曾追随[CHARACTER.GetHerHis]仰望星空的目光，如今只得低垂。"
 administrator: "行政者"
 administrator_die_desc: "[CHARACTER.GetName]的履职生涯已画上句号，我们的行政中枢痛失一位栋梁之才。失去[CHARACTER.GetHerHis]缜密的行事风格与周全的督查，我国政务运转必将大大迟滞。"
 desc_administrator: "该角色精通于统筹规划、后勤调度、组织管理……等等事项。在其精心打理下，国家行政事务运转高效顺畅。所有行政开支均有明细记录，冗余支出得到了有效控制。"
 tax_optimizer: "精干的税吏"
 tax_optimizer_die_desc: "尽管[CHARACTER.GetName]一生聚敛了无数财富，终究未能从死神手中赎回自己的生命。[CHARACTER.GetSheHe]为国经手征收的税款，到了另一个世界也分文难用。"
 desc_tax_optimizer: "该角色终日与钱币、算筹为伴，逐项核算登记全国赋税与财政收入。依托精密核算、收支比对与账目平衡，在土地承载力范围内把国家税赋收益做到最大化。"
 green_thumb: "点石成金"
 green_thumb_die_desc: "[CHARACTER.GetName]早已深深扎根于这片国土，我国的农事发展因[CHARACTER.GetHerHim]日渐兴旺。如今随着[CHARACTER.GetSheHe]的离去，遍地飘落的草木枯叶，便是大地在为[CHARACTER.GetHerHis]的离世默哀。"
 desc_green_thumb: "该角色对各类作物与生灵的培育有着近乎痴迷的热爱，长年累月投身于农事园艺之中。其官署内常备着精心育苗的盆栽，闲暇时则悉心打理私人园圃，甚至将统筹全国农耕视为一种消遣。在其照料下，国内的一草一木都得到了无微不至的关怀。"
 fiscal_hawk: "财政激进派"
 fiscal_hawk_die_desc: "再高明的财政手腕也无法挽回[CHARACTER.GetName]的生命。世事早已证明：人生不过是向时间暂借的光阴，这笔生命的债务终须偿还。"
 desc_fiscal_hawk: "该角色深谙以钱生钱的道理，依靠灵活的理财手段与商务磋商盘活国库，持续放大国家存量财富，源源不断创造新增收益。"
 patron_of_arts_die_desc: "[CHARACTER.GetName]与世长辞，本国的一座文化明灯就此熄灭。[CHARACTER.GetSheHe]生前搜罗的海量艺术品，将成为留存后世、缅怀其人的珍贵信物。"
 desc_patron_of_arts: "该角色对各类艺术形式都充满热忱，无论是绘画、雕塑、建筑还是诗词，无一不深爱，并始终推崇并积极扶持各行各业的艺术创作。"
 army_reformer: "陆军改革家"
 army_reformer_die_desc: "[CHARACTER.GetName]离世的消息震动全军，本国多项军队改制均离不开[CHARACTER.GetHerHis]的推动。将士们会铭记[CHARACTER.GetName]，但军队从此再也得不到[CHARACTER.GetHerHis]的政策指引与谋划。"
 desc_army_reformer: "该角色深知：固步自封、拒绝变革的军队终将走向衰败，故而始终坚持推动军备与战术的持续革新，使军队能够适应瞬息万变的战场环境。"
 charismatic_orator: "魅力非凡的演说家"
 charismatic_orator_die_desc: "再动听的言辞、反复打磨的演说，都没能说服死神放过[CHARACTER.GetName]的生命。[CHARACTER.GetSheHe|U]骤然离去，朝堂与市井街巷，都因少了[CHARACTER.GetHerHis]的声音变得冷清寂寥。"
 desc_charismatic_orator: "该角色不仅擅长在公众演讲中牢牢抓住听众的心神，更具备一种独特的说服力——能不着痕迹地扭转他人的想法，让听众在不知不觉中接受新的观点，甚至误以为这原本就是自己的主见。"
 honest: "诚实"
 honest_die_desc: "[CHARACTER.GetName]已然离世，本国失去了难能可贵的一块基石。[CHARACTER.GetHerHis]坦荡赤诚的品格，会被所有人长久怀念。"
 desc_honest: "该角色内心纯善，言行一致，值得信赖。在其管理下，行政部门团结协作，运作和谐，无需担忧背后算计、背叛或暗地谋划。"
 stubborn: "固执"
 stubborn_die_desc: "不少人原本以为[CHARACTER.GetName]的性格执拗，连死亡都难以近身，可再顽固的脾气，终究挡不住[CHARACTER.GetHerHis]生命的自然落幕。"
 desc_stubborn: "该角色抗拒一切改变，再细微的调整都会令其抵触。恪守固有行事准则，从不认为自身观念与处事方式存在疏漏，想要说服其改弦更张难上加难。"
 architect: "建筑师"
 architect_die_desc: "[CHARACTER.GetName]毕生心血构筑国家基石，最终以生命为其封顶。愿[CHARACTER.GetHerHis]亲手铸就的万千广厦，化作人间永恒的丰碑，见证[CHARACTER.GetHerHis]不朽的功业。"
 desc_architect: "该角色对建筑充满钻研热情，无论是简陋茅屋还是宏伟殿宇皆能引发其浓厚兴趣。如同匠人设计与督造楼宇一般，此人立足整体布局，统筹规划并推动实施本国各类建设项目。"
 theologian: "神学家"
 theologian_die_desc: "[CHARACTER.GetName]溘然长逝，但愿[CHARACTER.GetHerHis]毕生钻研的神学学识，能帮[CHARACTER.GetHerHim]从容面对身后世界的一切际遇。"
 desc_theologian: "该角色笃信宗教，身边常萦绕着关于信仰、神明与来世的探讨，日复一日钻研教义与宗教奥义。"
 bureaucrat: "官员"
 bureaucrat_die_desc: "TODO : Write a desc"
 desc_bureaucrat: "TODO : Write a desc"
 oracle: "神谕者"
 oracle_die_desc: "[CHARACTER.GetName]的逝世令举国同悲，我们如今失去了那条能直接沟通神性存在的纽带。"
 desc_oracle: "神性之奥秘深不可测，唯有蒙受神恩者方能窥见。该角色便是其中之一，此人能够直接与神相通，在凡世与神界之间传递意志与祈愿。"
 deceitful: "狡诈"
 deceitful_die_desc: "[CHARACTER.GetName]身故的消息传来，还有人半信半疑。只因[CHARACTER.GetHerHis]常年谎话连篇、诡计不断，不少人甚至觉得，这场死亡又是[CHARACTER.GetHerHis]编造的一场骗局。"
 desc_deceitful: "该角色所言大多不可轻信，与其相处者须时时提防其暗藏的心思，处处设防。凡其所到之处，猜忌与惶惑便如影随形，四下蔓延。"
 fickle: "多变"
 fickle_die_desc: "一生摇摆不定的[CHARACTER.GetName]，唯独在死亡这件事上终于做出一成不变的抉择。不少人甚至暗自祈祷，[CHARACTER.GetSheHe]别一改主意死而复生。"
 desc_fickle: "该角色要么缺乏主见，难以形成稳定立场；要么思绪万千、反复无常，无法指望其坚守原则、忠于既定目标。"
 schemer: "阴谋家"
 schemer_die_desc: "[CHARACTER.GetName]撒手人寰，坊间传言，这场死亡或许正是[CHARACTER.GetHerHis]常年算计旁人招致的意外恶果。"
 desc_schemer: "该角色城府极深，所思所想难以揣度，阴谋算计与权术诡计层出不穷。与其共处需时刻保持警惕，即便入睡也要睁一只眼，步步为营谨防暗箭伤人。"
 corrupt: "腐败"
 corrupt_die_desc: "随着[CHARACTER.GetName]一命归西，国家终于从[CHARACTER.GetHerHis]无止境的贪欲与贪婪搜刮之下解脱。"
 desc_corrupt: "但凡由该角色经手的资金，总会出现难以解释的损耗与短缺。这笔来历不明的“经手开销”的确值得深入核查。"
 influential: "颇具影响"
 influential_die_desc: "无论权势如何显赫、威望何等崇高，终究难逃死亡的归宿，[CHARACTER.GetName]也未能例外。如今，国家终于摆脱[CHARACTER.GetHerselfHimself]的势力束缚。"
 desc_influential: "人与人之间的影响力本就存在差异，而该角色手握重权，其言语近乎法令般不容置疑，个人诉求往往能裹挟国家的大政方针。"
 unmotivated: "怠工"
 unmotivated_die_desc: "好在死亡是毫不费力的轻松事，如若不然，[CHARACTER.GetName]永远也提不起劲头走完这最后一步。"
 desc_unmotivated: "人人都有提不起劲的时候，但这位角色却把“偷懒万岁”贯彻到了极致，整天毫无干劲。其负责的事务工期大幅延长，甚至常常半途而废。"
 abrasive: "无礼"
 abrasive_die_desc: "随着[CHARACTER.GetName]离世，众人终于不必再忍受[CHARACTER.GetHerHis]的恶语中伤，总算得以松一口气。"
 desc_abrasive: "与该角色交谈，仿佛不断被言语刺伤。嘲讽挖苦、尖酸刻薄已成常态，冷言冷语几乎构成了其语言的全部底色。"
 arrogant_die_desc: "随着[CHARACTER.GetName]的生命终结，[CHARACTER.GetHerHis]往日的傲慢骄矜最终尽数消散。无论[CHARACTER.GetSheHe]愿不愿意，死亡让[CHARACTER.GetSheHe]最终和所有人归于同等。"
 desc_arrogant: "该角色自认天赋优越、高人一等，仿佛承蒙神佑生来便身处更高阶层。这类人极难取悦，无论旁人如何做事，永远达不到那吹毛求疵的标准。"
