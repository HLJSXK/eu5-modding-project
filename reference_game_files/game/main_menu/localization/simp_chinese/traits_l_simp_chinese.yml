 healthy_die_desc: "[CHARACTER.GetSheHe|U]过着健康而充实的生活，身边围绕着所爱的人。"
 healthy_born_with: "生来就身体$TRAIT$，面色红润，心肺强健，注定健康茁壮，身强体健！"
 hunchback: "驼背"
 desc_hunchback: "该角色天生脊柱畸形，使其体态与外貌都不同于常人。"
 hunchback_die_desc: "[CHARACTER.GetSheHe|U]与那佝偻的脊梁度过了一生，留给世人的只有[CHARACTER.GetHerHis]蹒跚的步履和扭曲的身形。"
 hunchback_born_with: "生来就$TRAIT$，注定被扭曲的脊柱折磨一生。"
 smallpox_trait: "天花"
 desc_smallpox_trait: "该角色感染了天花。高烧、呕吐，全身布满流脓的疱疹——这是一场缓慢而痛苦的病痛。"
 smallpox_trait_die_desc: "天花最终夺去了[CHARACTER.GetHerHis]的性命，高热与疱疹终将[CHARACTER.GetHerHim]吞噬。"
 pockmarked_trait: "麻子"
 desc_pockmarked_trait: "天花在该角色身上留下了印记，面部布满深深的疤痕与麻点——这是他们与天花擦肩而过的永久印记。"
 pockmarked_trait_die_desc: "[CHARACTER.GetSheHe|U]带着那张遍布麻点的脸庞躺进了坟墓，这是天花在[CHARACTER.GetHerHis]身上留下的永恒印记。"
 bubonic_plague_trait: "腺鼠疫"
 desc_bubonic_plague_trait: "该角色感染了腺鼠疫。可怖的疫病肆虐其身——周身泛起黑肿、高热肆虐，死亡步步逼近。"
 bubonic_plague_trait_die_desc: "腺鼠疫夺去了[CHARACTER.GetHerHis]的性命，一如它夺走无数生灵的生命一般。"
 just_die_desc: "整个国家都会怀念[CHARACTER.GetHerHis]的公正与公平。"
