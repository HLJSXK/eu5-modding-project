 scholar_die_desc: "[CHARACTER.GetHerHis|U]学术研究为我国人民带来了创新和声望。"
 entrepreneur_die_desc: "[CHARACTER.GetSheHe|U]塑造了属于[CHARACTER.GetHerHis]这个时代的经济格局。"
