 tactical_genius_die_desc: "[CHARACTER.GetHerHis|U]那精妙的战术会让我们的敌人只剩头晕目眩的份。"
 bold_fighter_die_desc: "[CHARACTER.GetHerHis|U]向敌阵无畏冲锋的身影，深深铭刻在每一名老兵的记忆中。"
 fierce_negotiator_die_desc: "失去[CHARACTER.GetHerHis|U]卓越的谈判才能，对我们而言无疑是一大损失。"
 strict_die_desc: "[CHARACTER.GetHerHis|U]毫不松懈的监督让我们总是谨慎行事。"
