l_simp_chinese:
 # Scripted relation — display name and description
 inheritance_contract_relation: "继承契约"
 inheritance_contract_relation_desc: "一个国家出资获得继承权，在另一国家的统治者无嗣而终时继承该国。"
 # Offer UI keys (never visible -- offer_visible = always = no -- but required by the engine)
 offer_inheritance_contract: "提出继承契约"
 offer_inheritance_contract_CATEGORY: "CATEGORY_FRIENDLY_ACTIONS"
 offer_inheritance_contract_cta: "向[TARGET_COUNTRY.GetName]提出[inheritance_contract|e]"
 offer_inheritance_contract_desc: "给予[TARGET_COUNTRY.GetName]在我们的统治者无嗣而终时继承我们国家的权利。"
 offer_inheritance_contract_cta_to_unknown: "向一个[country|e]提出[inheritance_contract|e]"
 offer_inheritance_contract_desc_to_unknown: "给予一个[country|e]在我们的统治者无嗣而终时继承我们国家的权利。"
 offer_inheritance_contract_happened_title: "提出继承契约"
 offer_inheritance_contract_happened_desc: "[COUNTRY.GetName]向[TARGET_COUNTRY.GetName]提出[inheritance_contract|e]，给予其在他们的统治者无嗣而终时继承领土的权利。"
 offer_inheritance_contract_proposal_question: "向[TARGET_COUNTRY.GetName]提出[inheritance_contract|e]？\n$INFO$"
 offer_inheritance_contract_incoming_proposal_title: "[inheritance_contract|e]提议"
 offer_inheritance_contract_incoming_proposal_question: "[COUNTRY.GetName]向我们提出[inheritance_contract|e]，给予我们在他们的统治者无嗣而终时继承其国家的权利。我们要同意吗？"
 # Request UI keys (non-buy -- disabled since can_get_without_buying = no -- but required by the engine)
 request_inheritance_contract: "要求继承契约"
 request_inheritance_contract_CATEGORY: "CATEGORY_FRIENDLY_ACTIONS"
 request_inheritance_contract_cta: "向[TARGET_COUNTRY.GetName]要求[inheritance_contract|e]"
 request_inheritance_contract_desc: "要求[TARGET_COUNTRY.GetName]给予我们在其统治者无嗣而终时继承其国家的权利。"
 request_inheritance_contract_cta_to_unknown: "向一个[country|e]要求[inheritance_contract|e]"
 request_inheritance_contract_desc_to_unknown: "要求一个[country|e]给予我们在其统治者无嗣而终时继承其国家的权利。"
 request_inheritance_contract_happened_title: "达成继承契约"
 request_inheritance_contract_happened_desc: "[COUNTRY.GetName]被授予与[TARGET_COUNTRY.GetName]的[inheritance_contract|e]，获得在后者统治者无嗣而终时继承其国家的权利。"
 request_inheritance_contract_proposal_question: "向[TARGET_COUNTRY.GetName]要求[inheritance_contract|e]？\n$INFO$"
 request_inheritance_contract_incoming_proposal_title: "请求[inheritance_contract|e]"
 request_inheritance_contract_incoming_proposal_question: "[COUNTRY.GetName]希望与我们达成[inheritance_contract|e]，获得在我们的统治者无嗣而终时继承我们国家的权利。我们要同意吗？"
 # Buy request UI keys
 buy_request_inheritance_contract: "购买继承契约"
 buy_request_inheritance_contract_CATEGORY: "CATEGORY_FRIENDLY_ACTIONS"
 buy_request_inheritance_contract_cta: "从[TARGET_COUNTRY.GetName]购买[inheritance_contract|e]"
 buy_request_inheritance_contract_desc: "支付[gold|e]获得在[TARGET_COUNTRY.GetName]的统治者无嗣而终时继承该国的权利。"
 buy_request_inheritance_contract_cta_to_unknown: "从一个[country|e]购买[inheritance_contract|e]"
 buy_request_inheritance_contract_desc_to_unknown: "支付[gold|e]获得在其统治者无嗣而终时继承国家的权利。"
 buy_request_inheritance_contract_happened_title: "达成继承契约"
 buy_request_inheritance_contract_happened_desc: "[COUNTRY.GetName]购买了与[TARGET_COUNTRY.GetName]的[inheritance_contract|e]，获得在其统治者无嗣而终时继承国家的权利。"
 buy_request_inheritance_contract_proposal_question: "花费$COST$从[TARGET_COUNTRY.GetName]购买[inheritance_contract|e]？\n$INFO$"
 buy_request_inheritance_contract_incoming_proposal_title: "[inheritance_contract|e]提议"
 buy_request_inheritance_contract_incoming_proposal_question: "[COUNTRY.GetName]希望以$COST$购买一份[inheritance_contract|e]，获得在我们的统治者无嗣而终时继承我国的权利。我们要同意吗？"
 inheritance_contract_effect_text: "[COUNTRY.GetName]与[TARGET_COUNTRY.GetName]达成[inheritance_contract|e]"
 inheritance_contract_effect_text_past: "[COUNTRY.GetName]与[TARGET_COUNTRY.GetName]达成了[inheritance_contract|e]"
 giving_inheritance_contract_list_who_tt: "$WHO$给予$LIST$[inheritance_contract|e]"
 receiving_inheritance_contract_list_who_tt: "$WHO$拥有$LIST$的[inheritance_contract|e]"
 # Cancel UI keys
 cancel_inheritance_contract: "取消继承契约"
 cancel_inheritance_contract_cta: "取消我们与[SCOPE.sCountry('recipient').GetName]的[inheritance_contract|e]"
 cancel_inheritance_contract_desc: "我们将取消协议，放弃我们购得的继承权。"
 cancel_inheritance_contract_cta_to_unknown: "取消我们与一个[country|e]的[inheritance_contract|e]"
 cancel_inheritance_contract_desc_to_unknown: "我们将取消协议，放弃我们购得的继承权。"
 cancel_inheritance_contract_happened_title: "取消继承契约"
 cancel_inheritance_contract_happened_desc: "[SCOPE.sCountry('actor').GetName]取消了与[SCOPE.sCountry('recipient').GetName]的[inheritance_contract|e]"
 cancel_inheritance_contract_proposal_question: "取消与[TARGET_COUNTRY.GetName]的[inheritance_contract|e]？\n$INFO$"
 # Break UI keys
 break_inheritance_contract: "撕毁继承契约"
 break_inheritance_contract_CATEGORY: "CATEGORY_FRIENDLY_ACTIONS"
 break_inheritance_contract_cta: "撕毁我们与[SCOPE.sCountry('recipient').GetName]的[inheritance_contract|e]"
 break_inheritance_contract_desc: "我们会结束我们的[inheritance_contract|e]，放弃我们持有的继承权。"
 break_inheritance_contract_cta_to_unknown: "撕毁与一个[country|e]的[inheritance_contract|e]"
 break_inheritance_contract_desc_to_unknown: "我们会结束我们的[inheritance_contract|e]，放弃我们持有的继承权。"
 break_inheritance_contract_happened_title: "撕毁继承契约"
 break_inheritance_contract_happened_desc: "[SCOPE.sCountry('actor').GetName]撕毁与[SCOPE.sCountry('recipient').GetName]的[inheritance_contract|e]，放弃他们购买的继承权。"
 break_inheritance_contract_proposal_question: "撕毁我们与[TARGET_COUNTRY.GetName]的[inheritance_contract|e]？\n$INFO$"
 # Diplomatic status panel keys
 diplomatic_status_giving_inheritance_contract_name: "授予继承契约"
 diplomatic_status_giving_inheritance_contract_tooltip: "#T 授予继承契约#!\n该国授予以下[countries|e][inheritance_contract|e]下的继承权。"
 diplomatic_status_receiving_inheritance_contract_name: "继承契约"
 diplomatic_status_receiving_inheritance_contract_tooltip: "#T 继承契约#!\n该国持有与以下[countries|e]的[inheritance_contract|e]，获得了这些国家的统治者无嗣而终时继承其领土的权利。"
 # AI wants_to_give reason descs
 inheritance_contract_same_culture_group: "共同的文化传承强化了这份协议中的信任。"
 inheritance_contract_hre_members: "双方都是[holy_roman_empire|e]成员，[inheritance_contracts|e]是公认的法律传统。"
 # Event strings
 inheritance_contract.1.title: "获得继承契约"
 inheritance_contract.1.desc: "我们向[SCOPE.sCountry('contract_partner').GetName]支付资金，获得了在[SCOPE.sCountry('contract_partner').GetGovernment.GetRuler.GetName]无嗣而终的情况下继承其领土的权利。这是一项重大投资，但潜在收益巨大。"
 inheritance_contract.1.a: "值得的投资。"
 inheritance_contract.3.title: "援引继承契约"
 inheritance_contract.3.desc: "[SCOPE.sCountry('dead_ruler_country').GetName]的统治者已经过世且没有留下继承人。我们的[inheritance_contract|e]已生效，他们的领土现在落入我们王室手中。"
 inheritance_contract.3.a: "我们的耐心得到了回报。"
 inheritance_contract.4.title: "继承契约失效"
 inheritance_contract.4.desc: "我们的统治者已过世，而与[SCOPE.sCountry('dead_paying_country').GetName]的[inheritance_contract|e]也随之失效。我们付出投入获得的继承权丢失了。"
 inheritance_contract.4.a: "代价高昂的不幸。"
