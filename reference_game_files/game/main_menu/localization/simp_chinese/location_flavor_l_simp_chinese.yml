l_simp_chinese:
 stockholm_desc: "这座城镇由雅尔伯吉尔于1252年建立，选址于梅拉伦湖与波罗的海交汇的战略要冲。这一位置使其既能作为控制湖泊通道的堡垒，又可成为连接瑞典内陆与汉萨同盟及波罗的海贸易网络的枢纽。"
 paris_desc: "坐落于塞纳河沿岸的巴黎，从一座朴素定居点崛起为法兰西王冠上的明珠。凭借其大教堂、市场与学府，这里发展成为欧洲最重要的权力与文化中心之一。"
 london_desc: "伦敦在泰晤士河畔孕育成长，从罗马时期的隆迪尼翁演变为英格兰首屈一指的大城市。繁荣的贸易与王室宫廷使其成为王国政治与经济的心脏。"
 rome_desc: "这座台伯河畔的永恒之城曾统御着横跨三洲的庞大帝国。即便帝国已经陨落，罗马仍作为信仰与权威的灯塔延续其辉煌，并成为圣座治下的教廷中枢。"
 jerusalem_desc: "作为信仰与纷争的交汇点，这座圣城同时受到犹太教、基督教与伊斯兰教的尊崇。朝圣者与征服者持续塑造着其神圣而动荡的历史。"
 alexandria_desc: "作为地中海昔日举世瞩目的灯塔，亚历山大港始终是贸易与学术的交汇枢纽。她那巍峨壮丽的大灯塔与典藏浩瀚的图书馆曾昭示着多元文化与帝国在此融合的盛景。"
 constantinople_desc: "圣索菲亚大教堂是她璀璨夺目的冠冕，狄奥多西墙是她坚不可摧的铠甲。君士坦丁堡曾是东罗马帝国的心脏，千年间其财富与辉煌令世界为之渴望。"
 sitges_desc: "中世纪时期，一座城堡矗立在如今市政厅所在的山丘之上。最初，这座城堡归巴塞罗那主教区所有，然而到了12世纪，它被转交给了一个家族，并以该家族的姓氏命名。"
 valladolid_desc: "11世纪末，巴利亚多利德由佩德罗·安苏雷斯伯爵与埃洛·阿方索伯爵在皮苏埃加河桥畔建立，并发展为北梅塞塔高原中心的商业城镇。至14世纪，该城与布尔戈斯并列成为区域最重要城市，并在玛丽亚·德·莫利纳王后摄政期及其孙阿方索十一世统治时期成为主要行政中心。"
 penafiel_desc: "#italic 忠诚之山#!——佩纳菲耶尔于10世纪建在杜罗河谷中段一处战略制高点上，成为对抗科尔多瓦哈里发国边境袭扰战的热点。卡斯蒂利亚伯爵桑乔·加西亚在约1013年对其进行加固并授予《城市特许状》。凭借蓬勃发展的葡萄酒产业，该城逐渐繁荣，最终由权贵唐胡安·曼努埃尔的家族所掌控。"
 toro_desc: "10世纪，莱昂王国为巩固杜罗河谷边境建造了托罗，用于对抗科尔多瓦哈里发国。凭借战略位置及富饶的农田与葡萄园，这座要塞后来发展成为重要城镇。"
 thessaloniki_desc: "长期以来，塞萨洛尼基被视为拜占庭帝国仅次于君士坦丁堡的第二大城市，得天独厚的商业区位赋予了其财富与声望。繁忙的港口承载着意大利与罗马腹地间的贵重商品流通，成为连接东西方的重要桥梁。"
 malmo_desc: "作为扼守厄勒海峡的锁钥，马尔默控制着波罗的海与北海之间的通道。坚固的城墙与警惕的守军使其成为战略与野心交织的权力中心。"
 bilbao_desc: "1300年，毕尔巴鄂由比斯开领主迭戈·洛佩斯·德·阿罗正式建立，并迅速崛起为西班牙北部的重要枢纽。这座城墙环绕的城镇坐落于狭窄的山谷与内尔维翁河口之间，依托其地理优势，发展了强大的造船业，成为卡斯蒂利亚优质美利奴羊毛与本地高品质铁矿砂出口至英格兰和佛兰德港口的主要门户。"
 radom_desc: "该城由皮亚斯特王朝的末代国王卡齐米日三世 “大帝”所扩建，在整个中世纪晚期与文艺复兴时期，这座城市始终保持着重要政治中心的地位。1401年，《维尔纽斯‑拉多姆联盟条约》于此缔结；1505年，议会更在皇家城堡会议上通过了《#italic 非公认，无新法#!》法案。"
 krakow_desc: "起源于瓦维尔山上的村落，965年，“克拉科夫”这一名称首次出现在文献记载中，彼时它已成为著名的商业中心。自1038年起，它成为皮亚斯特王朝波兰君主的驻地，并逐渐发展成为波兰王国的行政、经济与文化中心。"
 megara_desc: "自远古时代建城延续至今，墨伽拉曾由尼索斯、拜扎斯等具有神话色彩国王所统治。该城以强大的海军实力和繁荣的贸易著称，成为希腊半岛的重要强权。古典时代的殖民者从这座城市出发，在地中海沿岸建立了拜占提翁、克森尼索斯和塞利努斯等重要定居点。然而，随着时间的推移，这座城市逐渐湮没于历史长河之中。"
 grojec_desc: "12世纪前，这里一直是当地城堡辖区与波兹南大主教区驻地，但随着时间推移，其重要性逐渐被邻近的切尔斯克取代。"
 gdansk_desc: "公元997年首次见诸史册的格但斯克，诞生于波罗的海沿岸的定居点。作为主要的造船与贸易港口，它确立了东欧最富裕、最具影响力城市的地位。"
 athens_desc: "作为古希腊的文化中心，雅典曾崛起为当时最强大的城邦之一，在与斯巴达、底比斯等古典城邦的激烈竞争中，逐步确立了对爱琴海的海洋霸权。历经马其顿帝国的征服之后，又相继臣服于罗马与拜占庭的统治，城市逐渐走向衰落。1204年后，成为一个十字军国家的首都。"
 wieliczka_desc: "维利奇卡由波兰国王普热梅斯瓦夫二世于1290年因盐矿开采而建立。作为主要矿业城镇，它被授予多项特权，盐矿迅速闻名遐迩。维利奇卡盐矿与博赫尼亚姊妹矿共同组成“#italic 克拉科夫盐矿同业会#!”，官方文献称此地为“#italic 维尔卡索尔#!”（意为#italic “伟大的盐#!）。"
 leksand_desc: "这座位于锡利扬湖南岸的村庄数千年前已有人居住。12世纪初，这里建起了一座教堂，而这座教堂的首位路德宗牧师颇有些名气——因为他正是游戏制作人约翰的先祖。"
 leipzig_desc: "建于1165年的莱比锡坐落于#italic 帝国大道#!与#italic 皇家大道#!的交汇口，逐渐发展为富裕的贸易枢纽。后来，依靠关键的帝国特权，莱比锡成为了皮毛贸易和蓬勃发展的图书产业的重要中心。"
 augsburg_desc: "奥格斯堡帝国自由市，在图拉真皇帝时期曾被称为#italic 奥古斯塔·维德利孔#!，是神圣罗马帝国最古老的城市之一。在中世纪早期末期，奥格斯堡的重要性日益凸显，见证了955年帝国成功抵御入侵的匈牙利人。1276年，随着奥格斯堡获得了鲁道夫·冯·哈布斯堡国王授予的帝国城市权，重要性进一步提高，为未来的繁荣开辟了道路。"
 warsaw_desc: "这座城市最初只是马佐维亚的一个小渔村，在西吉斯蒙德三世于1596年将首都从克拉科夫迁到这里后重要性日益凸显，之后它在十八世纪成长为了波兰最大的城市。也是在十八世纪，这里获得了全方面的发展，为波兰建筑和工艺做出了突出贡献。"
 tunis_desc: "相传，狄多女王于公元前814年在此创建了迦太基城。该城历经三次布匿战争的涂炭后，又由罗马人所重建。而现代意义上的突尼斯城则是阿拉伯人在698年于古城遗址附近新建的。至12世纪，穆瓦希德王朝将其确立为行省首府，随后哈夫斯王朝进一步巩固了其重要地位。"
 heidelberg_desc: "12世纪晚期，海德堡成为莱茵行宫伯爵的驻地，一座著名城堡在此建造。海德堡因拥有德意志第一所大学而闻名，并因此成为学术中心。之后，它成为宗教改革和宽容的中心，普法尔茨选帝侯最终成为了新教联盟的领袖。再后来，海德堡城堡和它标志性的外观吸引了许多诗人来到这座城市，让这里成为了浪漫主义的象征，为城市应当了#italic 浪漫主义之城#!的美称。"
 aviles_desc: "阿维莱斯的历史最早可追溯至10世纪，地处河口的区位优势让这里作为港口获得了重要的战略价值。在附近的高松城堡，阿斯图里亚斯国王阿方索三世下令制作了还愿的胜利十字架，以黄金包裹，珠宝装饰，成为了整个王国的象征。自11世纪开始，阿维莱斯成为了王家城镇，以其海上贸易以及食盐产业而闻名。"
 pingjin_desc: "太原，古称晋阳，因晋祠圣地而闻名遐迩。自公元前5世纪起，一直是山西乃至中国北方的战略重镇。公元979年，宋太宗征服北汉后，采取水淹和焚毁的手段摧毁了古城，随后改设“平晋县”（寓意“平定山西”）。此后，经过漫长的岁月，城池才得以重建，重现往日的繁华。"
 dunstable_desc: "由罗马城市发展而来的修道院小镇；以亨利一世的王宫（1109年）、埃莉诺十字碑（1290年）、亨利八世离婚案（1533年）和克伦威尔征兵地（1642年）闻名。"
 paderborn_desc: "查理曼大帝与教皇利奥三世首次会面的地方，于约公元800年建立主教区。在三十年战争期间被围攻16次。1646年遭瑞典军队蹂躏毁坏。"
 porto_desc: "这座城市被称为#italic 不可征服之城#!，也是葡萄牙国名的来源，并使杜罗河产的波特酒声名远扬至海外。"
 jiaxing_desc: "嘉兴地处吴越交界之地。“嘉”寓意美好祥瑞，“兴”表示昌盛兴旺。"
 torgau_desc: "1452年，选帝侯腓特烈二世在托尔高建造了首个熊坑，此后不断扩建，直至1624年。该熊坑最多可容纳39只熊。"
 changsha_desc: "自建城以来，长沙古城的中心格局两千年来未曾迁移。"
 ningxiang_desc: "宁乡，作为商周时期青铜器的核心出土地，闻名遐迩的最大青铜酒器——#italic 四羊方尊#!，正是在这里历经三千年的沉寂后重现世间。"
 wurzburg_desc: "维尔茨堡作为法兰克尼亚的要塞崛起，于741年成为主教区。中世纪早期，它凭借要塞与美因河贸易路线逐渐繁荣。"
 hanover_desc: "汉诺威从中世纪聚落发展为神圣罗马帝国的重要城市，由韦尔夫家族统治，作为贸易、权力与文化的中心繁荣发展。"
 osnabruck_desc: "奥斯纳布吕克作为中世纪神圣罗马帝国的贸易中心，以主教区地位及主持《威斯特伐利亚和约》谈判而闻名。"
 glasgow_desc: "格拉斯哥作为中世纪主教区而建，依托大教堂逐渐繁荣，获得自治市地位，并建立了一所塑造苏格兰学术传统的大学。"
 neva_desc: "涅瓦河三角洲曾是瓦良格人‑希腊人贸易路线的一部分，1703年在此建起圣彼得堡，此后它作为俄罗斯首都长达两百余年。"
 dubno_desc: "杜布诺的最早记录见于1100年，后来发展为一座以其集市和1492年城堡闻名的沃里尼亚贸易中心，之后又在果戈里的#italic 《塔拉斯·布尔巴》#!中名垂千古。"
 baden_desc: "这座城市由罗马人建立后最初叫做#italic 奥勒留温泉城#!，中世纪早期开始被称为“巴登‑巴登”，巴登边境伯爵的名称由此而来。"
 erbach_desc: "18世纪晚期，埃尔巴赫伯爵弗朗茨一世出于对古董的爱好，资助了当地的一家象牙雕刻行会，后来，埃尔巴赫发展为了一座重要的象牙雕刻中心。"
 manhattan_desc: "这座岛屿最初居住着莱纳佩人，后来荷兰殖民者以价值60荷兰盾的商品购买了这座原住民称之为曼纳哈塔（曼哈顿）的岛。他们将在这里建造一座堡垒，成为新阿姆斯特丹市的权力中心。"
 doncaster_desc: "唐克斯特曾是罗马的达努姆要塞，至1337年已成为约克郡位于北方大道上的集镇，商旅们来往于伦敦与北方运送货物。"
 kitchissippi_desc: "此地以基奇西比河得名，阿尼什纳比人曾在此狩猎贸易，直至英国殖民扩张木材贸易，后使其成为殖民行政中心。"
 saint_marceilin_desc: "圣马塞兰建于11世纪，1337至1340年间作为多芬议会所在地。其以柔软的白霉奶酪闻名，1461年曾进献给路易十一世。"
 caerphilly_desc: "威尔士山谷拥有欧洲最高品质的煤矿，在18世纪后半叶成为炼铁业中心。"
 grenoble_desc: "格勒诺布尔是一座地处法国阿尔卑斯山、规模不大却具有战略意义的城镇，是多菲内地区的首府。它被河流与山脉环抱，城墙环绕其间，巴士底要塞俯瞰全城。生活以教堂为中心，狭窄蜿蜒的街道挤满商人、工匠以及从周边山谷运送货物的农民。"
 kinsale_desc: "金塞尔是爱尔兰南岸一座小而活跃的港口小镇，其深水天然海港为其提供了庇护。渔业和沿海贸易养活了当地大部分人口，商人们用咸鱼、兽皮和羊毛换取来自伊比利亚半岛和法国的葡萄酒、盐和奢侈品。狭窄的街道聚集在码头周围，当地海员与偶尔到来的外国商人在此往来交流。尽管规模不大，但金塞尔的海港使其具有战略价值，成为爱尔兰与欧洲大陆之间的门户。"
 stockton_desc: "斯托克顿是位于蒂斯河北岸的一处盎格鲁 - 撒克逊人聚居地，在主教释放了该镇的农奴之前，这里人口稀少，此后才吸引工匠们迁入。它成了出口羊毛和进口葡萄酒的重要集市，不过直到工业革命时期，这里的人口才显著增加。"
 kunow_desc: "克拉科夫主教区的重要资产，从1281年起建立了一个堂区。它的名字可能来源于貂（波兰语称库纳），在该地区的森林中十分常见。"
 lublin_desc: "卢布林作为定居点建立于12与13世纪之交，并于1317年获得了瓦迪斯瓦夫“肘尺高”授予的特许状。在之后的数个世纪里，这座城市成为了重要的贸易中心，并于16世纪达到黄金时代，由于《卢布林联合》的签署以及广泛的贸易（尤其是与东方的贸易），变得越来越富裕。"
 kendal_desc: "肯德尔始建于公元1世纪，罗马人在肯特河岸修筑要塞。在诺曼人统治下，该镇逐渐发展壮大，1189年，理查德一世国王为筹集十字军东征的资金，将集市经营权授予该镇，此后小镇愈发繁荣。它成为中世纪羊毛贸易的中心，镇上的主要城堡归帕尔家族所有，其中最著名的成员便是亨利八世的王后凯瑟琳·帕尔。"
 cairo_desc: "公元969年，法蒂玛王朝的将军乔哈尔·萨基利在古罗马巴比伦堡垒旁建立了卡希拉——“胜利者之城”，它迅速取代亚历山大港成为了埃及的中心。在阿尤布王朝和马穆鲁克王朝统治下，开罗成长为伊斯兰世界人口最多的城市，其市场和清真寺吸引了来自三大洲的商人、学者和朝圣者。1258年蒙古人摧毁巴格达后，开罗作为伊斯兰文明无可争议的首都屹立不倒——这座宏伟非凡的城市，其宣礼塔高耸于一条自历史黎明之初便滋养着人类生命的河谷之上。"
 dadu_desc: "1267年，忽必烈汗在燕山以南的平原上，金朝中都的废墟之中建立了大都——“伟大的首都”——作为元朝国都。马可·波罗为其宏伟所震撼，形容这是一座拥有宽阔大道、宏伟宫殿和堆满全中国财富的仓库的城市。即使蒙古人的势力逐渐衰落，这座北方门户连通草原与中华腹地的重要位置，仍确保了它作为帝国中心的持久地位。"
 venice_desc: "威尼斯诞生于亚得里亚海潟湖的泥滩之上，在生存的压力下锤炼出雄心。逃避伦巴第人入侵的难民首先在其岛屿上寻求庇护，到9世纪时，这座城市已发展成为一个由选举产生的总督治理的海洋共和国。威尼斯商人从兵工厂和账房出发，掌控着从黑海到黎凡特的贸易路线，使威尼斯成为基督教世界最富有的城市和地中海贸易无可争议的主宰者。"
 moscow_desc: "1147年，尤里·多尔戈鲁基在莫斯科河畔建立了一座小型木制堡垒，而这正是莫斯科的起点。长期以来，莫斯科一直处在更古老的罗斯城市的阴影之下，然而在金帐汗国的统治下，莫斯科王公们生存与扩张的长处得以发挥——他们一边为金帐汗国征收贡赋，一边悄然兼并邻近公国。北方河流交汇处的战略位置，为其提供了商业立足点，使其得以稳步发展。到14世纪初，莫斯科大公已经掌握了罗斯地区其他任何统治者都无法比拟的强大权力。"
 tenochtitlan_desc: "根据传说，大约在1325年，墨西卡人的神明维齐洛波奇特利承诺赐予他们一座有老鹰栖息在一株仙人掌上的岛屿，于是墨西卡人在特斯科科湖的一座沼泽岛上建立了特诺奇蒂特兰。这座年轻的定居点所处的位置既能提供天然的防御，又拥有周围河谷的丰富资源，得以以惊人的速度发展。它的堤道、高架花园和战士传统总有一天会使它成为美洲最伟大的城市，一个强大帝国的中心。"
 delhi_desc: "德里坐落于亚穆纳河西岸，自古便是历代王朝的权力中心。1206年，奴隶王朝在此建立了德里苏丹国，在伊勒图特米什和阿拉丁·卡尔吉等统治者的治理下，这座城市成长为南亚首屈一指的伊斯兰首都。其宏伟的清真寺、集市与堡垒吸引着来自整个伊斯兰世界的学者和商人，巩固了德里作为治理次大陆大半地区的门户地位。"
 prague_desc: "布拉格坐落在伏尔塔瓦河的一处河湾之上，从一个斯拉夫人的渡口定居点发展为中世纪欧洲的伟大城市之一。普热米斯尔王朝在赫拉德恰尼的岩石岬角上建起了城堡和大教堂，一座繁荣的商人城镇在此扎根。作为波希米亚国王的权力中枢和东西欧之间的天然十字路口，布拉格吸引了德意志和犹太商人、工匠以及学者，到14世纪初已成为阿尔卑斯山以北人口最多、最繁荣的城市之一。"
 vienna_desc: "在罗马时代，罗马人在多瑙河畔设立了一座军团要塞以守卫帝国的北部边疆，并称之为#italic 温多博纳#!。民族大迁徙打破了罗马秩序之后，维也纳作为巴本堡藩侯的驻跸之地重新崛起——他们在同一片战略要地上建起了一座与其雄心相称的城市。1278年哈布斯堡家族取代了巴本堡家族后，维也纳成为了一个王朝帝国的支柱，其地处多瑙河谷十字路口的显要位置，使其成为神圣罗马帝国最具战略价值的城市之一。"
 baghdad_desc: "公元762年，阿拔斯王朝哈里发曼苏尔在底格里斯河西岸建立了巴格达，这座城市从建立之初就被设计为世界的中心。在其圆形规划中，哈里发的宫殿和大清真寺位于中心，周围向外辐射着市场和居民区。在阿拔斯王朝鼎盛时期，这里居住着超过一百万居民，其智慧宫吸引了来自已知世界各地的学者前来翻译、辩论与探索。1258年蒙古人的洗劫终结了这一黄金时代，但这座城市并未被毁灭，依然是两河流域腹地最伟大的都会。"
 florence_desc: "佛罗伦萨横跨阿尔诺河，位于托斯卡纳的中心，从一座罗马殖民地发展为重塑了欧洲商业的商人与银行家之城。伟大的银行家族——巴尔迪家族、佩鲁齐家族和斯特罗齐家族——将其信贷网络延伸至各个王国，他们所铸造的金弗罗林成为了国际贸易的标准货币。经历#italic 归尔甫派#!与#italic 吉伯林派#!之争的摧残，以及强大行会的治理后，佛罗伦萨将炽烈的市民自豪感与非凡的财富结合在一起，为其令举世羡慕的艺术和知识繁荣奠定了基础。"
 samarkand_desc: "撒马尔罕是中亚最古老的城市之一，横亘于丝绸之路上，满载丝绸、香料与思想的商队在此穿行于中国与地中海之间。在萨曼王朝和喀喇汗王朝统治下，它作为伊斯兰学术与工艺的主要中心而繁荣，其工匠以其精美的金属制品和纸张闻名于世。尽管在1220年被成吉思汗的军队摧毁，但地处重要贸易路线的关键位置确保了这座城市的复兴，其市集和工坊再次吸引了半个世界的商业往来。"
 novgorod_desc: "诺夫哥罗德大领主，这是诺夫哥罗德市民对其骄傲的称呼，它从沃尔霍夫河畔的一座维京人贸易站，发展成为北欧最强大的商人共和国。选举产生的#italic 卫彻议会#!以封建世界其他地方罕见的方式进行民主治理，汉萨同盟的贸易伙伴将诺夫哥罗德的毛皮、蜡和琥珀运往从伦敦到吕贝克的各个市场。13世纪30年代，在其他罗斯城市遭受蒙古人的毁灭性打击时，靠北的诺夫哥罗德得以幸免，从而成为整个罗斯地区最富有、最独立的城市。"
 lisbon_desc: "里斯本地处塔古斯河的大西洋入海口，其天然良港自腓尼基时代起就为水手和商人提供庇护。罗马人在此修筑防御工事并将之称为#italic 奥利西波#!，8世纪时，摩尔统治者将其转变为一座拥有清真寺和宫殿的繁荣城市。1147年阿方索一世在十字军骑士的帮助下攻克里斯本后，它成为新兴的葡萄牙王国的首都和关键的大西洋港口——其深水良港和向西的眺望，早已指向了远方那片未被探索的海洋。"
 sevilla_desc: "塞维利亚横跨瓜达尔基维尔河，位于安达卢西亚肥沃的平原上，是摩尔西班牙的明珠之一。在伍麦叶王朝和后来的穆瓦希德王朝统治下，它作为文化、科学和贸易中心蓬勃发展，其伟大的清真寺矗立于河畔，证明了伊斯兰文明在伊比利亚半岛的影响力。1248年，卡斯蒂利亚的费尔南多三世收复了塞维利亚，这座城市保留了其多元特征，并发展成为基督教西班牙最富有的城市，其河港将安达卢西亚的财富引向更广阔的世界。"
 hangzhou_desc: "1127年北方落入女真金朝之手后，杭州成为南宋的权力中心，被称为#italic 行在#!，即临时首都。13世纪末到访杭州的马可·波罗称之为世界上最伟大的城市，惊叹于其运河、丝绸市场以及各类货物易手的巨大广场。即使在1279年蒙古征服之后，作为大运河的起点和丝绸与瓷器贸易的掌控者，杭州依然延续着其身为中国最重要的商业城市之一的繁荣。"
 bruges_desc: "在中世纪商业的鼎盛时期，布鲁日是北欧的重要集市 ，威尼斯桨帆船、汉萨同盟的柯克船和伊比利亚的卡拉维尔帆船都在这里卸货。这座城市建立于连通北海的入海口之上，其布料厅与交易所被认为是世界上第一座证券交易所，使其成为北方的金融之都。从英格兰的羊毛到黎凡特的香料，已知世界的财富都流经其运河和会计室。"
 cologne_desc: "公元50年，罗马人建立了#italic 克劳狄娅·阿格里皮娜的殖民地#!，这就是后来的科隆。科隆逐渐发展成为中世纪德国最大的城市，以及神圣罗马帝国最有权势的教区之一。其宏伟的哥特式大教堂始建于1248年，以安放东方三博士的圣遗物，作为这座城市雄心与信仰的象征拔地而起。作为一座帝国自由市和汉萨同盟的创始成员，科隆掌控着至关重要的莱茵河贸易路线，并充当着连接北海与帝国内陆的门户。"
 bursa_desc: "布尔萨坐落于比提尼亚的奥林波斯山山麓，曾是一座繁荣的拜占庭城市。1326年，奥斯曼酋长奥尔汗经过近十年的围困将其攻占。这里成为了奥斯曼国的第一个真正首都，修建了清真寺、商队驿站和一个有顶集市——这些奠定了此后数世纪布尔萨的城市特色。作为来自东方的丝绸之路商队的西方终点，以及世界上一些最优质丝绸的生产地，布尔萨成长为一座拥有非凡财富的城市，以及令奥斯曼帝国绽放的种子。"
 kyoto_desc: "公元794年，桓武天皇将朝廷迁至此地，将其命名为#italic 平安京#!，意为“和平与安宁之都”，京都在此后数个世纪成为了日本文明的中心。其宽阔的大道网格，两侧排列着贵族宅邸与佛寺，孕育了世界上最精致的宫廷文化，产生了平安时代的诗歌、绘画与文学。尽管内战、火灾以及武士的崛起反复撼动其城垣，但这座城市依然作为天皇的居所和日本的文化灵魂而延续至今。"
 timbuktu_desc: "廷巴克图从撒哈拉沙漠边缘、尼日尔河河湾处的一个季节性图阿雷格营地，崛起为中世纪非洲的伟大城市之一。在马里帝国治下，它成为跨撒哈拉贸易的十字路口，从北方运盐的商队与从南方运来黄金和象牙的商队在此交汇。其清真寺与 #italic 伊斯兰学校#!吸引了大陆各地的伊斯兰学者，使其成为一座学术之城，图书馆藏有数以万计涉及神学、数学和天文学的手稿。"
 barcelona_desc: "巴塞罗那最初是罗马人于公元前1世纪建立的殖民地#italic 巴尔基诺#!，后来发展为巴塞罗那伯爵领的首府，到12世纪时成为阿拉贡王冠领的海上引擎。其商船队和领事馆从巴利阿里群岛延伸至西西里，从撒丁岛延伸至希腊的十字军港口，使其成为西地中海主导性海洋势力。在宏伟的主教座堂和古罗马城墙之下的坡地上，这座城市洋溢着海洋强权的商业气息——它向外眺望大海，追寻财富与命运。"
 cordoba_desc: "在黄金时代，科尔多瓦是西欧最伟大的城市，拥有五十万居民，铺设了街道和公共浴场，藏书量令基督教世界任何地方都相形见绌。929年，阿卜杜勒·拉赫曼三世自称哈里发，使科尔多瓦成为与巴格达的阿拔斯王朝和北方的加洛林王朝分庭抗礼的哈里发国的首都。阿威罗伊和迈蒙尼德等学者曾穿行于这里的街道；#italic 科尔多瓦大清真寺#!矗立于此，成为在伊比利亚土地上扎根的非凡文明的纪念碑。1236年，卡斯蒂利亚的费尔南多三世攻占该城，结束了这一时代，但这座城市保存的知识遗产却得以延续，并传播到了更广阔的世界。"
 damascus_desc: "作为世界上聚居历史最古老的城市之一，大马士革坐拥东黎巴嫩山脚下的一片肥沃绿洲，其市场得到了巴拉达河的流水滋养。在7世纪和8世纪作为伍麦叶哈里发国的首都时，它是当时世界上前所未有的大帝国的中心，大马士革大清真寺是伊斯兰建筑的巅峰成就之一。尽管阿拔斯王朝的权力中心转移至巴格达，大马士革作为黎凡特地区最重要的商业与文化城市之一依然延续了繁荣，其集市贸易着丝绸、精制刀剑以及举世闻名的芬芳玫瑰。"
 angkor_desc: "在东南亚大陆的密林深处，高棉的吴哥国王们建造了一座独一无二的首都。苏利耶跋摩二世于12世纪初开始建造庞大的吴哥窟寺庙群供奉毗湿奴神，并将其设计为宇宙在人间的映像——护城河代表宇宙之海，塔楼代表须弥山的山峰。在其鼎盛时期，大吴哥地区由复杂的水库和灌溉系统维系，使其成为前工业时代最庞大的城市综合体之一。"
 vijayanagar_desc: "1336年，哈里哈拉·拉亚和布卡·拉亚兄弟在通加巴德拉河南岸建立了毗奢耶那伽罗——“胜利之城”，旨在作为印度教文明对抗德里苏丹国扩张的堡垒。这座新兴的首都得到了通加巴德拉河以及由巨型花岗岩和岩石峡谷构成的险峻地貌的保护，掌控了德干中部肥沃的平原。从这一岩石要塞中，将崛起一个延续了两个多世纪的帝国，其市场吸引了来自整个印度洋世界的商人与货物。"
 naples_desc: "约公元前600年希腊人在壮丽的那不勒斯湾的海滨建立了殖民地涅阿波利斯，并先后经历了罗马、拜占庭、诺曼和霍恩施陶芬家族的统治，直到1266年安茹王朝将其立为那不勒斯王国的首都。在安茹王朝统治下，它成为中世纪欧洲最伟大的王室宫廷之一和意大利人口最多的城市，其港口将南意大利的财富输送到更广阔的世界。那不勒斯的宫廷吸引了学者、艺术家和神学家，其中包括在此教学并逝世的托马斯·阿奎那，使其成为学术生活与王朝权力的双重中心。"
 milano_desc: "米兰建立于波河平原的中心，最初是凯尔特人的聚居地，在罗马人占领后被称为#italic 墨狄俄拉农#!，一度成为西罗马帝国事实上的首都。蛮族迁徙削弱了它的辉煌，但这座城市作为自治城市重新崛起，并于1176年在莱尼亚诺战役中击退了腓特烈·巴巴罗萨及其帝国军队。在13世纪末夺取权力的维斯孔蒂家族统治下，米兰成为了领地的权力中心，逐步吞并了伦巴第周边的城市，成为意大利北部的主导力量。"
 genoa_desc: "热那亚藏身于利古里亚亚平宁山脉的弧形屏障之后，依托海洋铸就伟大。这里的商人和海军将领们雕琢出一个贸易站与殖民地从黑海延伸到大西洋的海上帝国，其舰队为争夺地中海商业霸权而与威尼斯舰队反复交锋。在多里亚、格里马尔迪和斯皮诺拉等大家族的不懈雄心驱动下，这个共和国赢得了它骄傲的绰号#italic La Superba#!（骄傲之城/卓越之城），并证明了一个几乎没有任何腹地的城市依然能够成为基督教世界最富有的强权之一。"
 bologna_desc: "博洛尼亚最初是伊特鲁里亚人的城市#italic 费尔西纳#!，后来成为罗马殖民地#italic 博诺尼亚#!，位于亚平宁山脉脚下，艾米利亚大道在此与向北通往波河平原的道路交汇。这座城市最为人称道的是这里的大学——成立于1088年，是世界上最古老的大学——吸引了来自欧洲各个角落的法律、医学和哲学专业的学生，来到它的讲堂和中世纪双塔的阴影下学习。博洛尼亚商人的财富、主教的权威以及城市的独立性，使其成为中世纪意大利政治中竞争最激烈的奖品之一。"
 palermo_desc: "巴勒莫发源于西西里岛北岸的双岬之间，由腓尼基商人建立，在迦太基及后来的拜占庭统治下成长为一座伟大的城市。9世纪阿拉伯人的征服将其转变为一座拥有清真寺、花园和集市的繁荣伊斯兰都会。1072年从阿拉伯人手中夺取此地的诺曼国王们，在这份多元遗产之上创造了非凡的成果，将阿拉伯、拜占庭和拉丁传统融合成璀璨的王室礼拜堂与宫殿，形成了一种基督教世界独一无二的文明。作为诺曼西西里王国及后来霍恩施陶芬帝国的首都，巴勒莫成为中世纪最有教养、最有权势的王室宫廷之一。"
 verona_desc: "维罗纳横跨阿尔卑斯山南部的阿迪杰河，自古便是通衢之地。其宏伟的罗马圆形剧场——世界上最大且保存最完好的剧场之一——依然矗立在曾经军团与商人同样穿行其间的街道之上。在13世纪末夺取权力的德拉·斯卡拉家族治下，维罗纳成为意大利北部最强大的政权之一，其领主统治着威尼托地区，并将势力扩展至亚得里亚海。在斯卡拉宫廷寻求庇护的人中就有但丁·阿利吉耶里——他被佛罗伦萨流放多年后，在坎格兰德·德拉·斯卡拉的赞助下完成了他的#italic 《神曲》#!。"
 siena_desc: "锡耶纳坐落于托斯卡纳腹地的三座山丘之上，是中世纪意大利的强国之一，其财富建立在银行业和羊毛贸易之上，锡耶纳的商人家族因此成为国王和教皇的债权人。这座城市与北方仅五十公里之遥的佛罗伦萨的激烈竞争，塑造了双方数代人的历史，而其宏伟的中央广场——坎波广场，则是这座意大利最自豪的自治城市之一上演市民生活与政治戏剧的舞台。杜乔·迪·博宁塞尼亚以及洛伦泽蒂兄弟的绘画，使锡耶纳成为欧洲哥特艺术最重要的中心之一。"
 pisa_desc: "比萨位于阿尔诺河河口，建立了中世纪地中海最伟大的海上帝国之一。其舰队于1063年突袭巴勒莫，在第勒尼安海各处击败撒拉森海盗，并建立了从撒丁到安条克的贸易殖民地。得益于这些商业带来的财富，比萨人在#italic 奇迹广场#!上建造了由主教座堂、洗礼堂和钟楼组成的非凡建筑群——这些纪念碑见证了一座在12世纪鼎盛时期财富与自信似乎永无止境的城市。尽管1284年在梅洛里亚海战中被热那亚彻底击败，比萨的海上霸权就此终结，但这座城市及其非凡的纪念建筑依然屹立。"
 padova_desc: "传说中，帕多瓦由特洛伊英雄安忒诺耳建立，并作为罗马意大利最富有的城市之一蓬勃发展，在中世纪发展成为威尼托地区心脏地带的繁荣城市。帕多瓦大学由脱离博洛尼亚的学者于1222年创立，迅速成为欧洲最重要的法律和医学中心之一，吸引了来自欧洲大陆各地的学生。14世纪初，伟大的画家乔托将竞技场礼拜堂的内部改造成了西方艺术的里程碑，而这座城市本身在卡拉拉家族的统治下蓬勃发展，成为学术和野心的宫廷。"
 ferrara_desc: "费拉拉建于波河三角洲沼泽的边缘地带，最初只是一个不起眼的渡口，在13世纪成为费拉拉领主的埃斯特家族治下发展成一座极具特色的城市。在该家族长期的资助下，这座城市成为骑士文化与精致宫廷生活的中心。领主们在于米兰、威尼斯和教宗国的竞争中精心周旋时，也款待诗人、举办马上比武和学术辩论。定义费拉拉城市风貌的宽阔笔直的街道与雄伟的埃斯特城堡，正是这座将秩序和优雅视为与城墙和士兵同等重要的城市的象征。"
 parma_desc: "帕尔马由罗马人于公元前183年在艾米利亚大道上建立，后成为伦巴第平原上的大城市之一。其位于米兰与博洛尼亚之间的区位优势以及周边肥沃的农田，赋予了这里持续的繁荣，但也让它成为备受争夺的战利品。作为一座自治城市，它是伦巴第同盟对抗腓特烈·巴巴罗萨最有力的成员之一；经历归尔甫派与吉伯林派多年的激烈斗争后，它接连落入了历任领主之手。罗马风格的帕尔马主教座堂和洗礼堂建于12世纪，表达了一种在其自治城市时代的政治动荡中延续下来的市民虔诚与财富。"
 mantova_desc: "曼托瓦三面被明乔河缓慢流淌形成的湖泊环绕，占据着意大利北部最具有天然防御能力的位置之一，自青铜时代起就有人类居住。这里是罗马最伟大的诗人维吉尔的诞生地，其命运长期以来一直由统治者的艺术与文学抱负塑造。到14世纪初，贡扎加家族开始在此崛起，在其长期资助下，曼托瓦将成长为意大利最文雅、最精致的宫廷之一。"
 lucca_desc: "卢卡坐落于古罗马时代的棋盘式街道格局中，四周是加法尼亚纳盛产丝绸的富饶乡村。它是中世纪意大利最富庶的城市之一。卢卡的商人遍布欧洲各地。他们的银行与丝绸贸易使得#italic “卢卡出品”#!这一品牌在巴黎、伦敦和布鲁日的市场上成为精纺布料的代名词。而在城内，这座城市积累了足够的财富，建造了托斯卡纳最精美的罗马式教堂群之一。尽管屡次受到比萨和佛罗伦萨的威胁，卢卡仍以非凡的韧性坚守独立。其坚固的城墙与炽烈的市民自豪感共同守护了这份自由，即便周边那些相互竞争的城市，早已落入封建领主的统治之下。"
 messina_desc: "墨西拿扼守着分隔西西里与意大利本土的狭窄海峡，由希腊殖民者建立，殖民者因港口的镰刀形状而将其命名为#italic 赞克莱#!，意为镰刀。这里的地理优势使其一开始就成为地中海最具战略意义的港口之一。诺曼人正是通过墨西拿于1061年开始了他们对西西里的征服；此后每一个时代的军队——安茹王朝、霍恩施陶芬王朝以及前往圣地的十字军——都经过这里的港口往返于东西方之间。尽管屡次遭受地震和政治动荡的冲击，这座城市非凡的天然港口总是确保它能够恢复，同等程度地吸引着商业与冲突。"
 brescia_desc: "布雷西亚坐落于阿尔卑斯山麓丘陵向伦巴第平原延伸的起点，是中世纪意大利的伟大手工业城市之一，其锻炉生产的武器和盔甲品质卓越，畅销全欧洲。作为自治城市，布雷西亚是伦巴第同盟中最活跃的成员之一，市民对帝国军队的抵抗成为意大利北部自治城市传统的基石。它夹在米兰与威尼斯的巨大野心之间，其位于阿尔卑斯山口门户的战略位置及工匠的高超技艺，使得两大强国都不愿轻易放弃争夺这里。"
 cremona_desc: "公元前218年，罗马人在波河南岸建立了一处边境殖民地，克雷莫纳由此发展成为伦巴第平原上的大城市之一。它位于河畔的地理位置使其成为东西方水陆贸易的天然枢纽。在皇帝与教宗的激烈对抗中，这座城市成为了吉伯林派的代名词——它为自己的立场付出了代价，但也因此获得了非凡的皇恩与财富。这里矗立着中世纪意大利最高的钟楼——宏伟的 #italic 托拉佐钟楼#!，以及林立的由竞争家族建造的塔楼，彰显着这座城市的竞争性市民自豪感——在这里，权力的展示与行使同样激烈。"
 pavia_desc: "罗马覆灭后的两个世纪里，帕维亚一直是意大利伦巴第王国的首都，是其战士国王的居所和铁王冠的守护之地。加洛林帝国的皇帝们将其作为在意大利的驻地；在伦巴第王国被法兰克帝国吞并很久之后，它仍作为皇家加冕城市保持着声望。帕维亚大学是意大利最古老的大学之一，早在9世纪就已繁荣发展；城市位于提契诺河畔、扼守波河河谷西侧门户的地理位置，确保了帕维亚始终是每一个试图主宰北意大利的强权所争夺的目标。"
 perugia_desc: "佩鲁贾坐落于俯瞰上台伯河谷的山丘上，是古代伊特鲁里亚十二城市之一，后来成为一座繁荣的罗马城市，并在中世纪崛起为意大利中部最强大、最动荡的独立自治城市之一。其宏伟的执政官宫以及1278年完工、由尼古拉·皮萨诺和乔瓦尼·皮萨诺雕刻的马焦雷喷泉，彰显了可与托斯卡纳任何地方媲美的市民自豪感与艺术雄心。1308年在此建立的大学，证实了佩鲁贾以同等的学术声望来匹配其军事与政治力量的决心。"
 ancona_desc: "安科纳最初是叙拉古流亡者在亚得里亚海沿岸建立的希腊殖民地，其名字来源于希腊语中的“肘部”一词，描述了那片弯曲的岬角，为港口挡住了北风。在中世纪，它成长为亚得里亚海中部最重要的港口，其商人远至拜占庭的君士坦丁堡和黎凡特的港口进行贸易。尽管教宗和皇帝屡次试图使其臣服，安科纳仍保持着强烈的自治城市独立精神——其港口和舰队是数个世纪以来被小心翼翼守护着的自由的根基。"
 aquila_desc: "作为中世纪意大利最年轻的大城市之一，拉奎拉大约在1254年由阿布鲁佐高地上近一百个村庄联合建立，据称每个村庄都为新城贡献了一座教堂、一座喷泉、一个街区和一口钟。这座坐落在亚平宁山脉高山之上、处于山地王国中心的城市，以惊人的速度成长为阿布鲁佐的首府，其地理位置和城墙为其抵御了敌对领主以及遥远的那不勒斯宫廷的野心。不寻常的建城经历——近一百个参与贡献的社区各自保留着一份市民身份——赋予了拉奎拉一种独特的复杂性和炽烈的地方自豪感，这在意大利南部任何其他城市中都无与伦比"
 ravenna_desc: "在一个短暂而非凡的世纪里，拉韦纳曾作为西罗马帝国的最后首都，当罗马于476年灭亡后，奥多亚克及随后的东哥特国王狄奥多里克都在此设立宫廷，维系着罗马治理的形式与传统。6世纪的拜占庭的再征服使这里成为君士坦丁堡的西方前哨，拉韦纳总督区的驻地；正是在希腊帝国统治的这一时代，这里的工匠创作出了那些令人惊叹的马赛克画，充满了教堂与陵墓。尽管早已被博洛尼亚和波河平原上日益崛起的城市超越，拉韦纳却在其非凡的艺术中留存了一份在拉丁西方任何其他地方都无法找到的关于帝国荣光的记忆。"
 salerno_desc: "萨莱诺坐落于阿马尔菲海岸山海之间的避风海湾中，被诺曼征服者罗贝尔·吉斯卡尔在1076年夺取后选为他的首都——在宫廷迁往巴勒莫之前，它曾是诺曼人在意大利南部的第一个权力中心。这座城市最为著名的是其#italic 萨莱诺医学院#!，这是欧洲最古老的医学院，从9世纪起繁荣发展，汇集了在此地交汇的希腊、阿拉伯和拉丁医学传统。在萨莱诺受训的医生遍布欧洲，该学校关于解剖学、外科学和草药学的著作塑造了整个中世纪世界的医学实践。"
 syracuse_desc: "公元前734年，科林斯殖民者在大港入口处的一座小岛上建立了叙拉古。这座城市后来成长为西地中海最强大的希腊城邦，在公元前415至413年对雅典远征军造成的灾难性挫败，彰显了其力量。正是在这里，阿基米德设计了他传奇的战争机器，使该城得以抵挡罗马军队的进攻，也正是这里，迦太基人、罗马人、拜占庭人、阿拉伯人和诺曼人这些前仆后继的征服者，都因这座港口过于宝贵的价值而将其占领。尽管长期被巴勒莫的光芒掩盖，锡拉库萨依然是西西里东南部最伟大的城市。其古老的港口和石砌街道至今仍见证着一个曾经塑造了整个古代地中海世界的璀璨文明。"
 trebizond_desc: "特拉比松坐落于本都山脉与黑海之间一处狭窄的滨海台地上，是中世纪世界地理环境最为出色的城市之一。1204年君士坦丁堡陷落于第四次十字军时，科穆宁王朝的成员逃至此地，建立了特拉比松帝国，这个独立的希腊基督教国家在拉丁帝国崩溃之后仍长期延续。这座城市扼守着黑海贸易路线的东端以及通往亚美尼亚和波斯的山口，吸引了热那亚商人，并成为丝绸之路上繁荣的西方终点，其市场上汇聚了来自中亚及其他地区的商品。"
 smyrna_desc: "作为爱琴海沿岸的古老城市之一，士麦那曾与许多地点争夺荷马诞生地的荣誉，后来成为《启示录》中提及的小亚细亚七教会之一。在拜占庭统治下，它成为连接富庶的安纳托利亚腹地与爱琴海商业的主要港口，威尼斯和热那亚商人沿码头建立了许多贸易殖民地。在13世纪末和14世纪初，这座城市在拜占庭、热那亚和艾登王朝土耳其人之间迅速易手，其优越的地理位置使其成为爱琴海地区任何强权都无法忽视的战利品。"
 konya_desc: "科尼亚坐落于安纳托利亚中部的高原上，是在12至13世纪的大部分时间里统治者安纳托利亚的突厥国家罗姆苏丹国的首都。在塞尔柱苏丹治下，这座城市作为伊斯兰艺术、建筑和学术的中心而繁荣，其瓷砖贴面的陵墓和伊斯兰学校将一座古老的高原城市转变为中世纪伊斯兰世界最伟大的文化中心之一。正是在这里，神秘主义诗人哲拉鲁丁·鲁米定居并去世；也正是在这里，他的追随者创立了毛拉维教团，这些旋转起舞的托钵僧以其音乐和仪式使这座城市的名声远播安纳托利亚高原之外。"
 sivas_desc: "锡瓦斯扼守着安纳托利亚与波斯之间主要路线交汇的高原，是中世纪近东最伟大的十字路口城市之一。在罗姆苏丹国治下，它发展成为一座具有非凡建筑雄心的重要省会城市；13世纪那些伟大的伊斯兰学校——其中包括著名的蓝色神学院和双宣礼塔神学院——堪称安纳托利亚塞尔柱石雕艺术最杰出的典范。在蒙古征服之后，这座城市成为伊尔汗国安纳托利亚诸省的重要行政中心，其市场和商队驿站承载着中亚与地中海之间流动的长途贸易。"
 kayseri_desc: "罗马人称之为#italic 凯撒里亚马扎卡#!的开塞利，是古代卡帕多西亚的主要城市，数个世纪以来一直充当着安纳托利亚高原与通往东方亚美尼亚和美索不达米亚的道路之间的门户。作为小亚细亚最早的基督教中心之一，它是大圣巴西略的故乡，这位圣人的神学著作与修道院规则塑造了东方教会，并至今仍在影响着基督教实践。在塞尔柱及其后继者的统治下，这座城市被添加了清真寺、伊斯兰学校和商队驿站；它作为安纳托利亚贸易十字路口的持久地位，使其在拜占庭、达尼什曼德王朝、塞尔柱和蒙古人之间几经易手，因为每一位主人都认识到了它的价值。"
 izmit_desc: "这座城市由比堤尼亚国王尼科墨得斯一世于公元前3世纪建立，并被罗马人称为#italic 尼科米底亚#!。戴克里先统治时期，曾选择它作为自己的居所和东部诸省的行政中心，使其担任罗马帝国的东部首都。公元303年，正是在尼科米底亚，戴克里先发起了对基督徒的大迫害：他拆毁了皇宫视野之内的主要教堂，开启了罗马帝国对基督教最后一次，也是最残酷的一次打击。在海峡对岸的君士坦丁堡建立之后，尼科米底亚逐渐被这座伟大的邻城掩盖，但在拜占庭时代，它仍然是一座重要的港口和教会中心。"
 ankara_desc: "安卡拉坐落于安纳托利亚高原中心的一处岩石山顶之上，早在罗马人将其作为加拉提亚行省的首府之前，便已是一座古老的城市。其战略位置——从君士坦丁堡、黑海、黎凡特和波斯而来的道路在此交汇——赋予了它持久的军事与商业重要性。市民们为纪念奥古斯都而兴建的神庙中保存的铭文，是现存最重要的罗马历史记录之一。在达尼什曼德王朝、罗姆塞尔柱人以及随后的蒙古人统治下，安卡拉始终是安纳托利亚高原的关键枢纽——一座拥有即意味着掌控了穿越高原的通道的城市。"
 amasya_desc: "阿马西亚坐落于耶希尔河穿切本都山脉形成的深邃峡谷之中，是古代本都王国的首都，也是地理学家斯特拉博的出生地——斯特拉博在其地理学巨著中满怀热爱地详细描绘了这座城市。这里引人注目的景观——河流上方的悬崖峭壁上凿刻的岩石陵墓——展现了一个鼎盛时期将统治小亚细亚大部地区的希腊化王国的宏伟气派。在拜占庭、达尼什曼德王朝、塞尔柱和蒙古人的统治下，这座城市一直保持着作为本都山麓主要中心的重要性，这里的深邃峡谷与山地环境使其成为安纳托利亚北部最具天然防御力的要冲之一。"
 rodos_desc: "在古代大部分时间里，罗得岛一直是东地中海最富有、最国际化的港口。古代世界七大奇迹之一的传奇巨像曾矗立于港口入口处；其海事法#italic 罗得岛法》#!曾管辖着已知海洋上的商业活动。经过罗马、拜占庭和阿拉伯数个世纪的影响之后，该岛于1309年落入医院骑士团手中，骑士团将其加固为东地中海最强大的基督教堡垒之一。在宏伟的城墙背后，骑士们将罗得岛转变为十字军权力的中心，他们的桨帆舰队巡弋于基督教世界与伊斯兰东方之间的海路上。"
 corinth_desc: "科林斯扼守着希腊大陆与伯罗奔尼撒半岛之间的狭窄陆上通道，以及横跨地峡的古老运输路线，是古希腊世界最富有、最具战略价值的城市之一。在鼎盛时期，它控制着爱琴海与亚得里亚海之间的贸易，并对两个港口间的陆路运输商品征收过境税，这里的青铜器和彩绘陶器出口至地中海的每一个角落。尽管在公元前146年被罗马将军卢基乌斯·穆米乌斯摧毁，但尤利乌斯·凯撒将其重建为罗马殖民地，并历经拜占庭人、拉丁人和法兰克人的统治作为一座重要城市延续下来，因为历代政权都认识到其地理位置的战略价值。"
 candia_desc: "当第四次十字军于1204年毁灭拜占庭帝国后，威尼斯获得了克里特岛，并将干地亚设为首府。在随后的一个世纪里，它转变为东地中海最具战略意义的威尼斯前哨之一。岛上肥沃的平原滋养了威尼斯的舰队和殖民地，而干地亚的港口则成为威尼斯与黎凡特之间航路上的关键补给点。尽管克里特人多次起义反抗他们的威尼斯领主，但这座城市本身却愈发坚固、富裕，这里的城墙和仓库彰显着一个意图永久占据克里特岛的殖民强权。"
 edirne_desc: "哈德良堡由罗马皇帝哈德良在马里查河畔建立，并以他的名字命名为#italic 哈德良波利斯#!。它守卫着君士坦丁堡与多瑙河边疆间的主要路线，是防御色雷斯的关键军事与行政中心。公元378年，西哥特骑兵正是在此击溃了瓦伦斯皇帝的军团，这是古代最具决定性的战役之一。这次失败开启了日耳曼民族在罗马帝国内部的迁徙定居，并导致了西罗马的最终崩溃。在拜占庭治下，哈德良堡仍然是色雷斯最重要的城市，以及传统上君士坦丁堡抵御西方威胁的第一道防线。"
 ioannina_desc: "约阿尼纳坐落于一个多岩的半岛上，毗邻于品都斯山脉的山间湖泊。它是伊庇鲁斯专制国的主要城市。这个希腊人的继业者国家于1204年第四次十字军摧毁拜占庭势力后在希腊西北部兴起。在伊庇鲁斯专制公的治下，它从一个不起眼的边陲城镇发展为希腊文化与抵抗运动的重要中心。天然的防御条件因坚固的城墙而增强，湖泊既提供生计又提供保护。伊庇鲁斯的山地地貌既带来安全，也带来隔绝。约阿尼纳作为一座关键的堡垒，支撑着前帝国动荡的西北部地区的希腊基督教文明。"
 tarnovo_desc: "特尔诺沃坐落于扬特拉河河湾的三座山丘上，1185年，当阿森和彼得兄弟领导反抗拜占庭统治的大起义时，它被选为了保加利亚第二帝国的首都。在阿森王朝治下，它发展成为巴尔干半岛最令人生畏的要塞城市之一，察雷韦茨山上耸立着皇宫和牧首座堂，是这个在13世纪鼎盛时期从多瑙河延伸至爱琴海的国家的象征。在帝国因蒙古压力而变得虚弱后，领土减少但自豪不减的保加利亚仍然以此为首都，其城墙与帝国记忆一直定义着这座城市的身份，直至14世纪。"
 dubrovnik_desc: "杜布罗夫尼克坐落于达尔马提亚海岸的石灰岩悬崖之下，从一个拜占庭人建立的避难所成长为地中海中世纪最繁荣、外交手腕最灵活的小国之一。作为拉古萨共和国，它以非凡的技巧周旋于威尼斯、匈牙利、塞尔维亚以及其后的新兴强权之间，在必要时纳贡，同时维持着从佛兰德斯延伸到黎凡特的领事与商站网络。这里的商人将商品与信贷带往已知世界的各个角落，而在其宏伟城墙之后崛起的优雅石城，宣告了一种选择商业与审慎外交而非战争的文明。"
 sredets_desc: "这座被罗马人称为#italic 塞尔迪卡#!的城市，是内陆达契亚行省的首府。当保加利亚人以这座后来改名为索非亚的城市为帝国的省份中心时，它早已见证了数百年的历史。正是在塞尔迪卡，君士坦丁大帝召开了343年的大公会议——早期基督教的一次重要宗教会议，据记载，他最初甚至曾考虑在此建立新的帝国首都，之后才选择了扼守博斯普鲁斯海峡的地点。在拜占庭和保加利亚帝国统治下，它一直是巴尔干主要路线交汇的关键地点，其位于维托沙山脚下的位置，确保了它在每一次征服中都能因巨大的价值而得以延续。"
 ohrid_desc: "奥赫里德坐落于以其名字命名的古老湖泊之滨，在9世纪末，传教士西里尔和美多德的门徒圣克莱门特在此建立了他的斯拉夫学院，用新的斯拉夫文字培养了数以千计的牧师和学者，这座城市由此崛起。在保加利亚皈依基督教之后，奥赫里德成为保加利亚牧首的驻地，后来又成为奥赫里德自治总主教区——东正教世界最重要的宗教中心之一。其山坡上密布的教堂和修道院，为这座城市赢得了“巴尔干的耶路撒冷”之名，其属灵权威在数个世纪里塑造了南斯拉夫各民族的基督教信仰。"
 nis_desc: "被罗马人称之为#italic 奈苏斯#!的尼什，正位于摩拉瓦河与尼沙瓦河河谷交汇之处，掌控着多瑙河边疆与君士坦丁堡之间的主要道路，使其成为古代巴尔干地区最具战略意义的城市之一。大约在公元272年，君士坦丁大帝就诞生于此。这位西巴尔干之子，日后重塑了罗马帝国乃至整个西方文明的进程。尽管这座城市曾屡遭劫难，包括被匈王阿提拉摧毁，但其十字路口的位置确保了它的复兴。在拜占庭、保加利亚和塞尔维亚的统治下，它始终是中巴尔干地区的关键枢纽。"
 durres_desc: "都拉斯是欧洲最古老的城市之一，约公元前627年由来自科林斯和科孚岛的希腊殖民者建立，名为厄庇丹诺斯。其亚得里亚海东岸优良的天然港口赋予了这座城市商业上的重要性。罗马人称之为#italic 迪拉基翁#!，并以这座城市为艾格纳提亚大道——那条穿越巴尔干直抵拜占庭的宏伟军事道路——的西端起点，从而确保了数个世纪以来，每一支从罗马向东进发的军队都曾穿过它的城门。作为连接意大利与巴尔干的门户，它成为该地区争夺最激烈的城市之一，在中世纪的数百年间，它的港口和城墙在拜占庭人、诺曼人、威尼斯人和安茹领主之间几经易手。"
 prizren_desc: "普里兹伦坐落于沙尔山脉下的一片肥沃河谷中，是一座历史悠久的城市。从13世纪起，中世纪塞尔维亚国家将其转变为其主要中心之一。在内马尼奇王朝治下，它成长为一座重要的行政与商业城市，其东正教教堂与修道院展现了塞尔维亚统治者的虔诚与雄心——他们将自身视为拜占庭文明的继承者。到14世纪初，它已成为塞尔维亚王国最重要的城市之一，其市场吸引了来自杜布罗夫尼克、威尼斯以及黎凡特各地的商人，前来交易从周边群山开采的贵金属。"
 belgrad_desc: "贝尔格莱德坐落于萨瓦河与多瑙河交汇处，中欧大道在此进入巴尔干。自古以来，这里就是军事要地——罗马人曾称之为#italic 辛吉杜努姆#!，并在此驻守一个军团以守卫多瑙河边境。中世纪时，这座城市在保加利亚人、拜占庭人和匈牙利人之间几经易手，位于河流通衢之上的山巅堡垒，使其成为巴尔干地区争夺最激烈的据点之一。到14世纪初，它已成为匈牙利王国与崛起的塞尔维亚国家之间斗争的关键目标，其城墙俯瞰着分隔拉丁基督教世界与东正教世界的河流。"
 mecca_desc: "麦加的天房早在先知降世之前便已矗立于阿拉伯半岛的心脏，这座石砌圣殿吸引着半岛各部族年年前来朝觐。公元570年，穆罕默德诞生于天房附近，并在此地接受天启，麦加遂成为那席卷三大洲的信仰的精神中心。哈里发政权兴衰更迭，这座城市一直由先知后裔，效忠于当时最强大的穆斯林君主的谢里夫家族统治。自1269年起，埃及的马穆鲁克王朝便担任麦加的保护者，每年派遣驼队穿越沙漠，将崭新的#italic 基斯瓦#!送至麦加，为天房换上新的黑色锦幔。"
 aleppo_desc: "阿勒颇是世界上最古老的城市之一，早在赫梯人和阿卡德人时代，它便已是北黎凡特地区的重要交通枢纽。公元10世纪，在哈姆丹王朝埃米尔赛夫·道拉治下，它成为一座辉煌的阿拉伯文化都会，诗人和武士云集，以华美的诗篇与钢铁的刀剑共同角逐拜占庭的边疆。赞吉王朝的努尔丁和萨拉丁之子、阿尤布王子扎希尔·加齐重建了其宏伟的城堡，使之成为伊斯兰世界最坚固的堡垒之一。1260年，城市遭到旭烈兀率领的蒙古大军洗劫，后由马穆鲁克王朝收复，并重新将其打造为叙利亚行省的第二大城市，其商队市场连接着伊拉克与地中海之间的丝绸与香料贸易。"
 adan_desc: "亚丁坐落于一座死火山的火山口内，自古便是红海与印度洋之间的港口，希腊航海家称其为#italic 阿拉伯福地#!，比喻其贸易之繁荣。11世纪，苏莱赫王朝的女王阿尔瓦从吉布拉的宫廷统治着亚丁；阿尤布王朝兴起后，该城转由也门的拉苏尔苏丹管辖，自1229年起，拉苏尔王朝将其打造为其领地的海上引擎。这里的港口吸引着前往印度的埃及商人，以及将胡椒、棉花和瓷器运往西方的印度船队，拉苏尔王朝设在码头区的海关是伊斯兰世界最富裕的机构之一。"
 hormuz_desc: "霍尔木兹王国在波斯湾大陆沿岸矗立了数个世纪，直至蒙古人劫掠的威胁迫使其统治者于1300年前后放弃旧城，迁往小岛贾伦。新霍尔木兹的商人们在岛上建起了石砌的房屋与巨大的仓库，依靠蓄水池供养缺水的岩层，凭借珍珠、马匹与印度香料的贸易聚敛财富。这座岛屿在其国王的统治下——他们名义上臣属于克尔曼的领主——成为海湾地区的大商埠，阿拉伯的单桅帆船、波斯的卡拉克帆船与印度的平底帆船每季都会云集于此，交换两大洋的商品。"
 tabriz_desc: "大不里士坐落于萨汉德山以北的肥沃山谷中，自萨珊王朝时代起便是一座繁荣的城镇，但直到波斯伊尔汗国将它选为都城，才真正崛起为首屈一指的城市。在于1295年皈依伊斯兰教的合赞汗，以及其后继者完者都汗治下，这座城市成为版图从乌浒河延伸至幼发拉底河的帝国的中心，其集市中堆满了沿帝国#italic 驿站#!道路运来的中国丝绸。博学家兼史学家大臣剌失德丁在城市郊区兴建了#italic 剌失德区#!，作为一座庞大的综合体，内设经学院、图书馆和缮写室，招揽了来自欧亚各地的学者。到伊尔汗不赛因去世时，大不里士已成为世界上人口最多、最具国际性的城市之一。"
 isfahan_desc: "由扎扬德河滋养的伊斯法罕，坐落于伊朗高原的心脏地带。自萨珊王朝时代起，它便一直是波斯最伟大的城市之一，当时它由贾伊和亚胡迪亚犹太区两个定居点组成。11世纪，在塞尔柱苏丹马利克沙及其维齐尔尼扎姆·穆勒克治下，它成为一个版图自安纳托利亚延伸至中亚的帝国的都城，其市中心耸立的雄伟的聚礼清真寺，成为伊斯兰建筑最辉煌的丰碑之一。1241年，蒙古人对其进行了毁灭性的劫掠，但在伊尔汗国统治下，城市花园、桥梁和工匠技艺逐渐恢复，织工和金属匠仍源源不断地向伊朗世界的市场供应着货物。"
 mosul_desc: "摩苏尔隔底格里斯河与古城尼尼微的废墟相望，自早期伊斯兰教几个世纪以来，便一直扼守着叙利亚与巴格达之间道路上的渡口。在哈姆丹王朝及后来的赞吉阿塔贝格统治时期，它成为一座强大的边境都城，伊马德丁·赞吉从此地发动了对抗十字军的攻势，于1144年夺回埃德萨，开启了穆斯林收复黎凡特地区的漫长征程。这座城市以其织工闻名，他们的名字被赋予了一种在欧洲被称为#italic 穆塞林#!（即平纹细布）的精美棉布，而这里的铁匠与银匠则为上杰济拉的市场供应货物。由于及时投降，摩苏尔躲过了蒙古人屠城，至今仍是底格里斯河上游的重要伊尔汗国中心。"
 samarra_desc: "公元836年，阿拔斯哈里发穆塔西姆在巴格达以北的底格里斯河畔建立庞大的萨迈拉作为新都，以便将其难以驾驭的突厥卫队安置在远离旧城平民的地方。近六十年间，这个世界上最庞大的帝国便从它宽阔的林荫大道、宏伟的宫殿和大清真寺独特的螺旋宣礼塔统治四方——这座清真寺是伊斯兰世界有史以来建造的最大清真寺。公元892年哈里发将都城迁回巴格达后，廷臣与士兵的离开让这座伟大的城市成了空城，但第十位和第十一位伊玛目的圣墓使它作为什叶派的朝圣中心得以延续，其宏伟的帝国遗址至今仍高耸于河畔平原之上。"
 bukhara_desc: "一千多年来，布哈拉一直是中亚最伟大的城市之一。这座粟特贸易中心在公元9至10世纪被萨曼王朝的埃米尔们改造为一座辉煌的伊斯兰伊朗文化都会。伊斯玛仪·萨曼由烧砖砌成的陵墓至今仍作为早期伊斯兰建筑的杰作矗立着，而喀喇汗王朝于1127年修建的卡利扬宣礼塔从那时起便一直主宰着城市的天际线。1220年，成吉思汗攻陷这座城市，据说他曾骑马进入聚礼清真寺，下令将《古兰经》踩在脚下，并对这座城市进行了毁灭性的屠城。然而，在察合台汗国的统治下，这座城市逐渐复苏，这里的宗教学校再次吸引来了学者，赋予这座古城旧日称号——#italic 布哈拉谢里夫#!（崇高的布哈拉）。"
 herat_desc: "赫拉特，阿契美尼德王朝曾经的阿里亚，扼守着哈里河的肥沃河谷，是波斯、呼罗珊与印度的道路交汇之地。在伽色尼王朝治下，它是一座闪耀着诗人和商人光彩的边城；12世纪，在邻近崛起的古尔王朝苏丹们以清真寺和经学院使之更加富丽，随后其帝国便向南横扫印度斯坦。1221年，拖雷的蒙古骑兵将这里洗劫一空；但在1245年卡尔特王朝君主崛起后，这座城市被稳步重建，成为伊尔汗国附庸王国的中心，其地处东西大道之上的位置确保了它的持续繁荣。"
 kashgar_desc: "喀什噶尔坐落于塔里木盆地西缘，是连接河中、费尔干纳和吐蕃的道路交汇口，自古便是丝绸之路上的绿洲重镇。在10至11世纪喀喇汗王朝的统治下，它成为突厥伊斯兰文明的重要中心，亦是大学者马哈茂德·喀什噶里的故乡。他编纂的#italic 《突厥语大词典》#!向阿拔斯世界的读者系统呈现了突厥诸民族的语言。蒙古征服后，该城归属察合台汗国，其游牧宫廷往来于天山与帕米尔之间的草原，而喀什噶尔的巴扎继续流转着玉石、马匹和丝绸贸易，为塔里木盆地诸绿洲带来了长久的财富。"
 lahore_desc: "印度沙希王朝的古都拉合尔，于1021年被伽色尼的马哈茂德征服，成为其庞大帝国的东都，并由此成为伊斯兰文明进入印度平原的门户。在伽色尼王朝治下，它发展为一座辉煌的边城，遍布清真寺与经学院，是波斯诗人马苏德·萨德·萨勒曼和学者阿里·胡杰维里的故乡。胡杰维里的苏菲圣墓#italic 达塔·达巴尔#!，至今仍吸引着朝圣者前来瞻仰。德里苏丹国奴隶王朝兴起后，这座城市成为穆斯林抵御蒙古骑兵的主要堡垒——蒙古骑兵曾多次横扫印度河流域。在巴尔班等苏丹统治下，其防御工事得到重建，以应对来自草原的威胁。"
 varanasi_desc: "瓦拉纳西，世界上最古老的持续有人居住的城市之一，被信徒称之为#italic 迦尸#!，即光之城，它矗立于恒河西岸，是印度教最神圣的圣地。朝圣者自有史记载之前便已来到这里，在河水中沐浴，以求摆脱生死轮回。通往恒河的石阶码头上，遍布寺庙、苦行者以及为在此辞世之人点燃的火葬堆。1194年，库特卜丁·艾巴克率领的古尔军队洗劫了这座城市，夷平了众多庙宇，但瓦拉纳西总能复兴，其织工、铜匠和梵文学者们维系着一种从未被任何征服者彻底抹去的文明。"
 madurai_desc: "一千多年来，马杜赖一直是南泰米尔潘地亚国王们的都城，这座以米纳克希女神的大寺庙为中心的城市，孕育了诗人、学者和武士贵族组成的文明。据说，古代的泰米尔文学院#italic 桑伽姆#!曾在此繁荣兴盛，吸引南方各宫廷的吟游诗人前来论辩和锤炼语言。1311年，德里苏丹阿拉丁·哈尔吉麾下大将马利克·卡富尔攻陷该城，掠走了积存的财富；1335年，图格鲁克总督贾拉勒丁·哈桑宣布建立独立的马杜赖苏丹国——一个根植于古老泰米尔腹地的脆弱穆斯林政权。"
 patna_desc: "在恒河南岸曾矗立着古老的#italic 华氏城#!，孔雀王朝阿育王的首都。在那里的宫殿中，第一个印度帝国统治着自阿富汗延伸至孟加拉湾的庞大领土。希腊使节麦加斯梯尼曾惊叹于其木栅城垣与宫廷之壮丽，而中国僧人法显在5世纪时的记录显示它在笈多王朝治下繁盛如昔。然而，到了德里苏丹国时期，这座伟大都城已衰落为名为巴特那的小镇，成为图格鲁克王朝比哈尔省的一处边陲前哨。昔年伟业，仅存于学者记忆与河岸间的废墟中。"
 chittagong_desc: "吉大港坐落于东孟加拉诸河汇入孟加拉湾的宽阔河口处，自古便是印度与东南亚之间的港口，其商业发达，商船甚至与遥远的中国展开贸易，是一座商人之城，阿拉伯地理学家称其为#italic 萨曼达尔#!。10世纪时，西藏僧侣达摩波罗亦曾记述其寺院。该城在孟加拉诸王、若开统治者与特里普拉山地酋长之间反复易手，屡次变更归属。在德里苏丹国征服孟加拉后，该城归入穆斯林治下，其港口仍是恒河三角洲稻米与棉花的主要东部出口港。"
 jinjiang_desc: "泉州，在阿拉伯人中被称为#italic 扎伊通#!（刺桐），马可·波罗将其誉为世界上最大的两座港口之一。在宋元两朝，它作为中国通往印度洋的主要出海口而声名大盛。港内挤满了驶往香料群岛、印度和波斯湾的商船，城中设有阿拉伯、波斯、泰米尔和亚美尼亚商人的聚居区，清真寺、印度教神庙和基督教教堂与佛寺及摩尼教寺庙并立。马可·波罗于13世纪90年代途经此地时写道，每有一艘满载香料的船抵达亚历山大港，便有一百艘来到刺桐，其巨额贸易关税收入使其成为元朝国库的财政支柱之一。"
 shangyuan_desc: "长江折向北汇入大海的弯曲处南岸，这座如今被称为集庆的城市，千年来曾多次成为首都。古代的孙吴、东晋以及诸南朝，皆以#italic 建业#!和#italic 建康#!之名在此建都，使其在数个世纪中成为南方中国的文化心脏。12世纪女真人征服北方时，宋廷曾短暂考虑在此定都；蒙古帝国席卷天下后，该城被重建为集庆府的治所，其位于长江下游的战略位置确保了它在南方诸城中持久的重要性。"
 wuxian_desc: "苏州地处长江三角洲腹地，古称#italic 姑苏#!，宋时称#italic 平江#!，始建于公元前6世纪，为吴国都城。城内河道纵横，水网交织，世人皆谓“上有天堂，下有苏杭”。此地素以丝绸织造、文人园林、精致饮食及戏曲艺术闻名。南宋时期，苏州成为江南最富庶的城市之一。虽在1276年蒙古征服时受创，但至14世纪初，园林、佛塔与运河沿岸市集再度繁荣，吸引着全国各地的商贾与文人汇聚于此。"
 guangzhou_desc: "广州地处珠江入海口，自汉代起这里的商人便已开始与南海诸国进行贸易，吸引了无数外国商船前来。到了唐代，阿拉伯和波斯的商船每季云集码头，数量之多，使城中专设了由穆斯林商贾长者管辖的外商聚居区。879年，叛乱的黄巢据说曾在一场血腥战役中屠杀了超过十万名外国侨民。蒙古征服为广州带来了新的繁荣，使其得享元代海上贸易的兴盛，港口将岭南货物输往世界各地，印度和阿拉伯商人再次汇聚于其旅店与货栈之中。"
 lhasa_desc: "拉萨由吐蕃赞普松赞干布于公元7世纪建立，他还建造了大昭寺，用以供奉由尼泊尔与唐朝两位王后带来的佛陀圣像。此后两个世纪，国力足以与唐朝匹敌，版图自帕米尔高原延伸至孟加拉湾的吐蕃帝国一直以拉萨为中心。9世纪帝国崩溃后，该城一度衰落，但大昭寺与小昭寺仍为藏传佛教的精神核心。1240年蒙古大军进入高原后，任命萨迦寺的住持掌管吐蕃事务，尽管行政中心设于萨迦，拉萨仍作为圣城延续其地位，吸引着朝圣者环绕八廓街转经，并在觉沃释迦牟尼像前俯首礼拜。"
 kamakura_desc: "1185年，武家领袖源赖朝从京都朝廷手中夺取了权力，以沿海城镇镰仓为其新政权的中心，建立了#italic 幕府#!，从此以天皇之名统治日本。在北条氏摄政的治理下，镰仓发展为一处三面环山、一面环海的武士文化重镇。1252年铸成的巨大青铜佛像至今仍于此地冥思，象征着武士阶层接纳的受禅宗影响的新佛教。1274年和1281年，蒙古人两次入侵日本，正是从镰仓发出了应战指令，而两次入侵分别被九州武士家族和被称为#italic 神风#!的风暴击退。"
 hakata_desc: "几个世纪以来，博多一直是日本通往亚洲大陆的主要窗口，中国唐、宋两朝的使节，朝鲜诸国的使团和南海商人的船只皆经此港抵达日本列岛。宋代时，博多建立了一处由石砌仓库和中国僧侣建造的佛寺组成的华人街，经由其码头流通的财富使该城成为九州最富庶的港口。正是在博多外的长滩上，1274年和1281年蒙古入侵的舰队登陆，也是在此地，镰仓幕府的守军建起了被称为#italic 元寇防垒#!的巨大石墙，其遗迹至今仍沿海岸线分布，纪念着日本历史上最惨烈的防卫战。"
 hanyang_desc: "汉阳坐落于群山环抱的盆地之中，汉江在此蜿蜒折向黄海。这一地区自史前时代便有人类定居，古代为百济与高句丽两国争夺之地。高丽王朝时期，此地作为开京的三座陪都之一的#italic 南京#!，地位日渐提升。这里被风水师赞誉为风水宝地，历代国王屡有迁都于此之议。至14世纪初，汉阳已发展为处于蒙元宽松宗主权之下的高丽王朝的重镇，其扼守汉江要冲，是朝鲜半岛与外部世界之间的天然门户。"
 pagan_desc: "在上缅甸的干旱平原上，伊洛瓦底江蜿蜒绕过荒芜山丘之处，蒲甘王国于11世纪由国王阿奴律陀建立。他统一了缅语各族，并接纳了由僧人善阿罗汉带来的上座部佛教。此后两个世纪，继任的国王们在都城周围的平原上建造了数千座佛塔与寺庙，形成了一片恢宏的宗教景观，在佛教世界中无可比拟。缅甸这座巨大粮仓的财富，供养了来自印度和斯里兰卡的学者与工匠。1287年，忽必烈的蒙古大军击碎了蒲甘王国；至14世纪初，实权落入敏象与彬牙的掸‑缅酋长们手中，古都则作为圣迹废墟幸存下来，朝圣者仍徘徊于万座倾圮的寺庙之间。"
 sukhothai_desc: "13世纪初，昭披耶河上游的泰族首领们摆脱了高棉吴哥王朝的统治，建立了素可泰王国，意为#italic 幸福之黎明#!。在兰甘亨国王（1279–1298年在位）治下，该王国繁荣发展，成为辉煌的上座部佛教政权，吸引了来自斯里兰卡的僧侣与工匠。1292年，国王立碑纪念其改革，这是现存最古老的泰文文献，据说泰文文字亦由他本人创造。尽管至14世纪初，素可泰的权势已受到昭披耶河下游新兴泰族诸侯国的挑战，但该城的金顶佛塔与庄严佛像已为泰文明树立了典范。"
 thang_long_desc: "1010年，越南国王李公蕴将都城从狭小的华闾城堡迁至红河河畔的一座新城，并根据他抵达时所见的祥瑞之兆，将其命名为#italic 升龙#!。在李朝和陈朝统治下，升龙成为大越的核心，一座寺庙、贡院和皇宫之城，越南文明在此汲取中国、占婆和高棉的影响，形成了独特的文化认同。忽必烈的蒙古大军曾三次越过北部边境，意图征服大越；而陈朝的将士们在名将陈兴道的率领下，三次将其击退，其中最著名的是1288年白藤江之战，越军在江中利用木桩设伏大败元军，至今仍在越南人的记忆中传颂。"
 trowulan_desc: "1293年，爪哇王子拉登·威查亚巧妙利用蒙古远征爪哇的军队对付新柯沙里王国的篡位者随后建立了新的满者伯夷王国，并在布兰塔斯河下游的多乌兰建都。该城坐落于东爪哇肥沃的稻田之中，布局以砖墙围合的院落、宽阔的水库和宏伟的城门为特色，城门上的陶板浮雕歌颂着新王朝的胜利。在1320年代崛起的首席大臣加查·玛达治下，满者伯夷开始将宗主权扩展至整个印尼群岛，多乌兰正站在其黄金时代的门槛上，即将成为一个伟大印尼帝国的心脏。"
 palembang_desc: "自7世纪至13世纪末，巨港一直是海洋帝国室利佛逝的都城，帝国的舰队掌控着马六甲海峡，帝国的僧侣使巨港成为东印度佛教研习的重镇之一。7世纪70年代，中国僧侣义净曾力劝同侪在前往印度之前先到巨港研习，城中的寺院聚集了数千名从事佛经翻译与注疏的僧人。1025年朱罗王朝的突袭击碎了室利佛逝对海峡的垄断地位，在随后的几个世纪里，该城逐渐衰落，沦为爪哇诸国的朝贡国，不过其在穆西河上的位置仍使其成为苏门答腊南部诸领主的一座重要港口。"
 pegu_desc: "勃固坐落在锡当河与勃固河汇入大海的广阔低地三角洲上。在1287年蒙古帝国击碎蒲甘王国之后，勃固乘势崛起，孟族国王瓦雷鲁在下缅甸建立了新的上座部佛教王国。在他的继任者治下，这座被孟族人称为#italic 汉塔瓦迪#!的城市发展成为上孟加拉湾最重要的港口，吸引了来自孟加拉、斯里兰卡和科罗曼德尔海岸的商人，前来交易柚木、红宝石和孟族工匠著名的漆器。其宏伟的瑞摩都佛塔据传供奉着佛陀的遗物，标志着该城从被粉碎的蒲甘废墟中重生，成为孟族文明新的精神中心。"
 chiang_mai_desc: "1296年，上湄平河谷的泰王孟莱建立了一座新都城，名为#italic 清迈#!，意为“新城”。至此，他完成了对北暹罗山地河谷兰纳地区（百万稻田之地）的统一。建城选址得到了素可泰与帕尧国王的协助，城墙与护城河围绕中央方形城区而筑，其神圣的布局融合了孟人、泰人与高棉人的传统。在孟莱及其继任者的治下，该城作为上座部佛教与工艺中心而繁荣发展，得到寺庙资助的铸铜工匠所铸造的兰纳佛像成为佛教世界的珍宝。"
 vijaya_desc: "四个世纪以来，占婆王国一直从毗阇耶城堡统治着越南中部的沿海地带。毗阇耶坐落在沙丘之后，毗邻南海。占婆人在其狭长疆域内建造的砖塔，彰显着一种印度化的印度教文明。他们与南海商人交易丝绸与芳香木材，但该王国不断遭到高棉吴哥王朝与大越两大势力的反复打击。占婆都城于1145年陷落于高棉之手，1283年和1326年又两次陷落于大越，每次虽能恢复独立，却一次比一次虚弱。占婆国王的砖塔依旧矗立，如同无声的见证者，注视着这个沿海南下的文明的漫长衰退的开始。"
 lubeck_desc: "吕贝克由荷尔斯泰因伯爵阿道夫二世于1143年建立，并由狮子亨利于1159年大火后重建。它崛起为北海与波罗的海间的门户，其位于特拉沃河上的港口吸引了来自萨克森、斯拉夫诸地与斯堪的纳维亚的商人。1226年，腓特烈二世授予它帝国自由市地位，从此，吕贝克商人在城市红砖塔楼之下，以自治行会的形式组织起来，编织起联结波罗的海诸商城的条约网络。至14世纪，其吕贝克法已被一百多个波罗的海和北海城镇采用，为北方商人共同体奠定了法律框架。"
 visby_desc: "维斯比坐落于哥得兰岛西海岸坚固的石墙之后，在12至13世纪发展成为波罗的海最富庶的城市之一，其港口是诺夫哥罗德的毛皮商、佛兰德的布商以及德意志汉萨同盟的铁器与鲱鱼航运商的汇聚之地。统治该岛数世纪的哥得兰农民共和国与城中拥有特权的德意志商人社区共同治理着这座城市，两种社群的并行统治赋予了该城独特的财富与复杂性。至1300年，已有二十多座石灰岩教堂拔地而起，彰显着使维斯比在一代人的时间里成为波罗的海最重要的贸易中转港的繁荣。"
 tallinn_desc: "在俯瞰雷瓦尔湾的堡垒山的陡峭石灰岩悬崖上，丹麦国王瓦尔德马尔二世于1219年建立了一座堡垒。根据传说，他在此地交战时，丹尼布洛旗从天而降，激励了他那摇摆不定的军队。城堡下方兴起的城镇由德国商人和工匠定居，他们为其引入了吕贝克法，使其成为一座汉萨港口，其码头承接了通往诺夫哥罗德的俄罗斯内河航线与波罗的海主要航运通道之间的贸易。在丹麦王室的松散统治下，下城的市民们通过鲱鱼和琥珀贸易繁荣起来，而主教和条顿骑士团的附庸们则在崖顶争夺影响力。该城兼具丹麦王室据点与德国商人共和国的双重特征，使其在波罗的海东部诸港中拥有无与伦比的活力。"
 riga_desc: "1201年，阿尔贝特·冯·布克斯赫韦登主教建立了里加，作为他针对道加瓦河外森林中的利沃尼亚人和拉特加利亚人异教徒发动十字军的驻地。在教宗的祝福下，他建立了利沃尼亚宝剑兄弟骑士团，在半个世纪的流血战役中，这个骑士团征服了异教徒部落。新城里加迅速发展，从最初的传教基地成长为波罗的海东部最重要的汉萨同盟港口。从其码头出发，德国科格船将俄罗斯毛皮、蜂蜡和琥珀运往吕贝克及更远的地方，而里加自己的商人则加入强大的德国行会，沿河在上游的俄罗斯诸公国建立了贸易站。里加市民、大主教和新兴的利沃尼亚骑士团间的长期斗争，已成为该城政治的一个显著特征。"
 bergen_desc: "卑尔根坐落于挪威西海岸的峡湾与群山之间，约于1070年由国王“和平者”奥拉夫建造，并崛起为中世纪挪威的主要城市与王室驻地。其布吕根港口是北方渔业生产的鳕鱼干的主要出口点。至13世纪末，来自汉萨城市的德国商人开始越来越多地定居于码头区，建立起#italic 汉萨商栈#!，日益主导挪威的对外贸易。王室加冕典礼、挪威萨迦的书写以及王室、教会与外国商人之间的争端，使该城成为挪威王国的政治与文化中心。在13世纪的鼎盛时期，挪威疆域自法罗群岛延伸至格陵兰。"
 hamburg_desc: "公元9世纪，查理曼和他的继任者在易北河畔建立了一座堡垒，意图使萨克森人改信并控制他们，这座堡垒即是汉堡。后来，它成为一个大主教区的教座驻地，作为将基督教信仰向北传播至斯堪的纳维亚的先锋。该城多次遭到维京人、斯拉夫人，甚至波兰国王博莱斯瓦夫一世的洗劫，但它总被不断重建。1189年，腓特烈·巴巴罗萨授予它帝国贸易与关税豁免特许状，为其商业未来奠定了基础。到13世纪，汉堡与吕贝克结盟，共同抵御波罗的海海盗，这一同盟成为新兴汉萨体系的基石。该城的酿酒师、制绳匠和船运商使其成为北德贸易的易北河终点港。"
 kyiv_desc: "自9世纪起，罗斯的瓦兰吉统治者在第聂伯河中游建立了一个由斯拉夫与诺斯人组成的联盟，并以基辅作为首都。在弗拉基米尔大帝及其子“智者”雅罗斯拉夫治下，基辅于11世纪成为东欧最富庶、最辉煌的城市之一，其圣索菲亚大教堂与金门宣示着一个商业上连接着君士坦丁堡与波罗的海地区的文明。在蒙古人到来前，罗斯的分裂与诸公国的内斗已逐渐削弱了这座城市。1240年，拔都汗的大军攻陷并彻底摧毁了它，以致于一代人之后，旅人看到这里的街道上杂草丛生，原野上散落着颅骨。在蒙古人的松散统治下，基辅缓慢复苏，至14世纪20年代落入了崛起的立陶宛大公国的势力范围，其古老的留里克王族血统在新政治秩序的现实面前已无能为力。"
 pskov_desc: "普斯科夫坐落在维利卡亚河与普斯科瓦河交汇处上方的岩石峭壁上，自罗斯早期几个世纪以来便是诺夫哥罗德的姊妹城，与其共享#italic 卫彻#!传统，自由公民在卫彻议会中辩论和决定国家事务。1136年，它开始脱离诺夫哥罗德独立。自13世纪起，在立陶宛流亡王子道曼塔斯等武士的领导下，普斯科夫的民兵一直保卫着罗斯土地的西部边境，抵御条顿骑士团的入侵。由于地处偏远，普斯科夫幸免于蒙古入侵最沉重的打击，因而繁荣发展为一个商人与武士的共和国。其宏伟的石砌城堡和商人教堂，彰显出一种在同时代俄罗斯城市中无与伦比的市民自信。"
 avignon_desc: "阿维尼翁坐落在罗讷河上方的巨大岩石上，地处普罗旺斯与朗格多克之间的天然渡口。在1309年命运发生彻底转变之前，这里曾是罗马属地与伯爵驻地。那一年，教宗克莱孟五世因无法安全返回罗马，于是寻求法国王室保护，将教廷迁至阿维尼翁。他的继任者们至今仍在修建那座俯瞰全城的宏伟教宗宫，使其成为拉丁基督教世界的新中心。教宗宫周围的街道上挤满了枢机主教官邸、欧洲各宫廷的使节馆、缮写室和钱币兑换处。随着这座城市承担起普世教会首都这一令人困惑的新角色，其人口已数次翻倍。"
 toledo_desc: "托莱多坐落在塔霍河上方的一块马蹄形岩壁上，在711年穆斯林征服之前，曾是西哥特王国的首都。在摩尔人领主治下，它仍然是安达卢斯的主要城市之一，其狭窄的街道上聚集着犹太会堂、教堂和清真寺，体现出一种异常宽容的宗教共处局面。莱昂‑卡斯蒂利亚的阿方索六世于1085年收复了该城，在此建都的卡斯蒂利亚王室继承了一座融汇拉丁语、阿拉伯语和希伯来语学术的城市。在大主教雷蒙德和13世纪国王“智者”阿方索十世的资助下，这里的翻译学院使托莱多成为希腊和阿拉伯哲学、科学与医学传入西方拉丁世界的门户，从根本上有力地重塑了欧洲的思想。"
 granada_desc: "1230年，当基督教军队在安达卢斯推进，强大的穆瓦希德王朝分崩离析之际，穆罕默德·伊本·艾哈迈尔在内华达山的格拉纳达建立了一个新的埃米尔国，成为穆斯林在伊比利亚的最后避难所。在他创立的奈斯尔王朝治下，格拉纳达王国虽成为卡斯蒂利亚的附庸，却仍维持了繁盛，成为安达卢斯文明的继承者。其山地边境与密集的农业#italic 平原#!共同使其成为任何征服者都难以攻克的战利品。在城上的萨维卡山，奈斯尔苏丹已开始兴建阿尔罕布拉宫，其庭院与殿堂正逐渐成为安达卢斯文明的建筑顶峰。"
 dublin_desc: "都柏林始建于9世纪，由维京掠夺者在一个名为#italic 都夫林#!（黑谭）的深水处建立了长船营地。它位于利菲河入海口，逐渐发展成为爱尔兰最重要的爱尔兰‑诺斯城市。其商人跨越爱尔兰海进行奴隶、兽皮和银器贸易，国王也与爱尔兰至高王反复发生冲突，直到1014年布里安·博鲁在克朗塔夫击败了他们的势力。1170年，由“强弓”伯爵率领、经亨利二世确认的盎格鲁‑诺曼征服，将该城置于英格兰王权之下。都柏林随后成为爱尔兰领地的首府，城墙得以扩展，大教堂得以兴建，其英国法律的管治则断断续续地向周边的佩尔区延伸。"
 antwerp_desc: "在斯海尔德河的巨大潮汐河口上，安特卫普自十世纪以来一直是神圣罗马帝国的一个设防边疆伯国，它位于斯滕的城堡守卫着渡河点，抵御维京劫掠者。布拉班特公爵在十二和十三世纪推动它发展，让它成为佛兰德斯城市布鲁日和根特的对手，1296年，一个汉萨同盟的#italic 商站#!在这座城镇建立，标志着它作为北欧贸易重要港口的崛起。尽管在十四世纪初仍处于布鲁日的阴影之下，这座城市更深的港口和通往公海更便利的通道已经吸引了意大利桨帆船和伊比利亚卡拉克帆船，这些都标志着这座斯海尔德河港口的稳步崛起。"
 lyon_desc: "里昂最初是罗马殖民地#italic 卢格杜努姆#!，位于罗讷河和索恩河的交汇处，曾是三个高卢行省的首府，也是向帝国供应银币的皇家铸币厂所在地。罗马衰落后，它成为一位声称拥有高卢首席地位的大主教的教区，整个中世纪期间，这座城市的两条河谷已经发展成西欧最重要的十字路口之一。尽管名义上直到1312年一直是神圣罗马帝国的城市，之后才被直接置于法国王室统治之下，里昂早已发展成为一座集市城市，来自意大利、低地国家和地中海的商人们在此用丝绸、香料和白银结算他们的账目。"
 york_desc: "约克由罗马人于公元71年建立，作为军团要#italic 塞埃博拉库姆#!，后来发展成为他们北方行省的首府，也是皇帝君士坦丁在306年被军队拥立的地方。在作为诺森布里亚的盎格鲁首府以及学者阿尔昆治下的基督教中心经历数百年之后，这座城市在866年被异教大军攻占，成为#italic 约维克#!——一个维京王国的首都，其商人远至撒马尔罕进行贸易。诺曼征服带来了大教堂和双城堡的建造，在整个中世纪，约克作为大主教的所在地与坎特伯雷争夺教会的首要地位，同时也是英格兰在规模、财富和古老程度上的第二大城。"
 canterbury_desc: "当罗马的奥古斯丁于597年登陆肯特，意图使盎格鲁‑撒克逊人皈依基督教时，他将坎特伯雷设为其传教的驻地和英格兰教会的第一个大主教区，此后这个权威地位一直保留至今。他创建的大教堂经历了多次重建，最具决定性的一次是在1170年大主教托马斯·贝克特在其墙内遇害后，这一王室亵渎的行为使坎特伯雷成为中世纪基督教世界的主要朝圣目的地之一。从伦敦到坎特伯雷的道路上挤满了前往贝克特神龛的朝圣者，这座城市的繁荣在很大程度上建立在向他们出售住宿、食物和纪念品上，而不仅仅依靠其古老的教会重要性。"
 edinburgh_desc: "爱丁堡坐落在城堡岩那座陡峭突起的火山岩丘上，自不列颠人称其为#italic 艾丁堡#!的时代起便是一座要塞。12世纪初，在大卫一世治下，它成为苏格兰主要的王家自治市，他在岩丘脚下建立了荷里路德修道院，并授予城镇特许状，吸引了佛兰芒和英格兰商人来到它的市场街。14世纪初的独立战争期间，城堡在苏格兰和英格兰驻军之间反复易手，而托马斯·伦道夫在1314年为罗伯特·布鲁斯夺回城堡的著名大胆突袭，已成为苏格兰战争中的传奇事迹之一。"
 kilwa_kisiwani_desc: "在东非海岸外的一座珊瑚岛上，基尔瓦基西瓦尼于十一世纪作为一个设拉子人建立的斯瓦希里定居点兴起，并在十三世纪和十四世纪初发展成为斯瓦希里海岸最富有的城邦。在1277年建立的马赫达利王朝统治下，基尔瓦的苏丹们通过南部的索法拉港控制了来自大津巴布韦的黄金贸易，由此获得的财富建造了宏伟的珊瑚宫殿#italic 胡苏尼库布瓦#!，拥有八角形浴池和阶梯式大庭院，这是撒哈拉以南非洲最大的前现代建筑。1331年到访的伊本·白图泰认为这是他所有旅行中见过的最美丽、建造最精良的城市之一。"
 mogadishu_desc: "在斯瓦希里海岸的北端，摩加迪沙大约在10世纪由阿拉伯和波斯定居者建立，他们与巴纳迪尔海岸的索马里人通婚，到12世纪，它已经成为一座繁荣的伊斯兰城市，有石砌房屋、清真寺和码头仓库。当地的织工生产著名的#italic 摩加迪沙布#!，这种布料在印度洋广泛交易，远销埃及和印度，商人们的商业活动扩展到整个西印度洋。伊本·白图泰在1331年到访时，发现这座城市由苏丹阿布·巴克尔·伊本·赛义德·奥马尔统治，他是一位柏柏尔后裔的统治者，在他的庇护下，大清真寺的周五礼拜吸引了来自整个伊斯兰世界的商人、法学家和苏菲派神秘主义者。"
 mombasa_desc: "蒙巴萨坐落在东非海岸外的一座珊瑚岛上，至少从十二世纪起就是一个斯瓦希里港口，当时地理学家伊德里西已经将其描述为一个重要的穆斯林城镇和西印度洋商人的避风港。在其设拉子后裔苏丹的统治下，这座城市已成长为斯瓦希里海岸主要的贸易地点之一，仅次于南部那条长长的城邦带中的基尔瓦，其码头接收来自北方的阿拉伯单桅帆船和驶向更远处香料群岛的印度船队。它红树林环绕的港湾和珊瑚石砌成的清真寺见证了一种斯瓦希里文明，它将非洲、阿拉伯和波斯的传统融合成一种独特的季风文化。"
 sofala_desc: "在斯瓦希里海岸的南端，赞比西河流域通往印度洋的地方，索法拉自10世纪起一直是非洲内陆黄金的重要出口港。大津巴布韦王国将黄金沿长途商路运来，在索法拉交换中国的丝绸、波斯的陶瓷和印度的棉布，这些货物由季风帆船每年从基尔瓦及更远的地方运来。阿拉伯地理学家马苏迪曾在10世纪到访过此地，在基尔瓦的马赫达利苏丹统治下，这座城市已成为北方斯瓦希里大政体的一个顺从前哨，其繁荣完全依赖黄金贸易和季风的周期。"
 gao_desc: "在尼日尔河东北大弯处，加奥至少从8世纪起就是桑海王国的都城，其伊斯兰化的统治者早在马里崛起之前就已与北非贸易。14世纪初，曼萨·穆萨的征服大军将其纳入马里帝国，加奥成为这位非洲大帝的主要纳贡城市之一，其帆船仍在尼日尔河上往返，为廷巴克图的市场运来撒哈拉的盐和南方森林的黄金。在马里的宗主权之下，桑海王室保存自身，未来帝国复兴的种子已在这座城市的清真寺和贸易区播下。"
 djenne_desc: "杰内位于尼日尔河三角洲内陆的顶端，自公元前数世纪以来便已是一个重要的定居点。其附近的早期遗址杰内-杰诺代表了撒哈拉以南非洲最早的城邦文明之一。到13世纪末，该城在国王孔博罗治下皈依了伊斯兰教，他建造的宏伟泥土清真寺便矗立在这座繁荣的内陆三角洲城镇中心。杰内与廷巴克图在跨撒哈拉贸易中齐名，其商人收集班布克和布雷的黄金以及内陆三角洲的棉花，用以交换沙漠的盐。该城以#italic 班科#!建筑闻名，其外露的木质横梁和土质塔楼，已成为萨赫勒苏丹地区的视觉标志。"
 great_zimbabwe_desc: "在赞比西河以南，萨韦河上方一处高耸的花岗岩高原上，绍纳语各民族在11至12世纪期间建造了一座非凡的无灰浆石砌城市。其蜿蜒的城墙和圆锥形塔楼，赋予了这个王国#italic 津巴泽马布韦#!（石屋）的名称。在14世纪的鼎盛时期，该城占地数百亩，可容纳一万八千居民。其统治者掌控着黄金贸易的通道，这些黄金顺流而下，抵达索法拉海港的斯瓦希里海岸，再从那里运往基卢瓦及更广阔的印度洋世界。皂石雕刻的鸟类、中国瓷器碎片以及来自波斯和印度的珠子充满了市场，见证着一个欧洲人尚无法想象的文明所拥有的全球影响力。"
 kano_desc: "在撒哈拉沙漠以南的热带草原上，根据豪萨人的传说，卡诺由传奇英雄巴亚吉达的后裔建立。巴亚吉达曾斩杀井中巨蛇，其子成为了豪萨七城邦的国王。至14世纪，卡诺已是这些城邦中最强大的一个。其多山的达拉岩丘被视为该政权的发源地，泥土城墙和染坑吸引着撒哈拉的盐商队和铜商队前来贸易，用以交换豪萨工匠精通的靛蓝染布和皮革制品。其国王仍遵循古老豪萨宗教的仪式进行统治，但沿着跨撒哈拉商路，伊斯兰传教士和商人已开始初次进入该王国。"
 axum_desc: "阿克苏姆是非洲最古老的城市之一，曾是阿克苏姆王国的首都。该王国自公元1世纪起繁荣，通过其红海港口阿杜利斯与罗马和印度进行贸易，并在4世纪埃扎纳国王统治下接受基督教为国教，成为撒哈拉以南非洲首个接受基督教的政权。阿克苏姆人在皇家陵墓上竖立的巨大花岗岩石碑，至今仍高耸于城市废墟之上，其中最高的一座重达五百吨，上面雕刻着一座多层宫殿的形貌。随着1270年耶库诺·阿姆拉克恢复所罗门王朝，至14世纪实权已南移，但阿克苏姆仍是埃塞俄比亚基督教会的属灵首都，埃塞俄比亚皇帝的加冕之地，也是据传统保存着约柜的锡安圣母玛利亚教堂的所在地。"
 mayapan_desc: "玛雅潘建在尤卡坦半岛北部干旱平原的一道巨大城墙内，作为更古老的玛雅都城奇琴伊察的继承者于13世纪末崛起。根据玛雅编年史记载，该城由科科姆家族建立，自称是旧城统治者的后裔。在新城的城墙之内，科科姆统治者领导着一个由尤卡坦各地领主组成的联盟，并要求附属国领袖居住于都城，置于王室的直接监视之下，以确保其忠诚。城中众多模仿奇琴伊察神庙的小型建筑，宣示着一个文明自知其为更古老、更宏大传统的继承者；然而，玛雅潘联盟的政治成就——将尤卡坦众小王凝聚于一个单一联邦之中——却是其自身真正的功绩。"
 chan_chan_desc: "在秘鲁北部的荒漠海岸，安第斯山脉骤然向太平洋俯冲而下，可能连年滴雨不降。12至14世纪间，奇穆诸王在这里建起了庞大的昌昌城——前哥伦布时期南美洲最大的城市。城墙之内，矗立着一系列宏伟的王家#italic 城堡#!，每一座都是为单独一位统治者建造的独立宫殿复合体，并在其死后封存。每座复合体的土坯墙壁上都装饰着波浪和海鸟的韵律浮雕图案，昭示着奇穆人的海洋渊源。奇穆诸王从这座都城统治着安第斯山脉历史上最长的沿海帝国——一条绵延上千公里的灌溉农业、渔业和金属加工社群带，皆向这座沙漠之城纳贡称臣。"
 cholollan_desc: "在墨西哥中部大高原上，波波卡特佩特尔火山山坡之下，矗立着乔卢拉城。其非凡的金字塔#italic 特拉奇瓦尔特佩特尔#!——人造之山——是前哥伦布时期世界上最庞大的人造单体建筑。该金字塔始建于公元前数世纪，后经托尔特克人及后继者不断扩建，基座广阔，其上至今仍矗立着乔卢拉人尊崇的大神羽蛇神克察尔科亚特尔的庙宇。该城先后易手于托尔特克人、奥尔梅卡‑希卡兰卡人以及如今的托尔特卡‑奇奇梅卡人，始终是中美洲高地上最重要的朝圣中心。盆地的新领主们至今仍来此，接受克察尔科亚特尔祭司对其权威的确认。"
 qusqu_desc: "库斯科位于安第斯山脉的一处高谷之中，地处当地人所谓的#italic 世界之脐#!。根据传说，这座小城由曼科·卡帕克建立——他与自己的姊妹妻从的的喀喀湖水中走出，将他的金杖插在选定的地点上，从而建城。在13世纪至14世纪初期，该城一直是区域酋长国的都城，与昌卡人、克丘亚人和阿亚尔马卡人等邻近族群争夺安第斯山脉南部的主导权。其统治者——日后的#italic 萨帕·印卡#!——仍在聚集盟友与武士，为家族的下一代在安第斯南部展开更宏大的抱负而积蓄力量。"
 roskilde_desc: "罗斯基勒坐落在西兰岛北部海岸的峡湾深处，于10世纪作为统一丹麦的耶灵王朝的权力中枢而崛起。此地第一座石砌教堂由蓝牙哈拉尔建造，他亦长眠于教堂之内。作为丹麦王室的皇家陵墓和强大主教教区的驻地，该城在12至13世纪发展成为丹麦王国最重要的城镇。其宏伟的红砖主教座堂是北欧最早的砖砌哥特式建筑之一。至14世纪初，厄勒海峡港口哥本哈根的兴起已开始吸引商人前往，但罗斯基勒仍然是丹麦的属灵中心，三百多年来，国王都在此加冕和安葬。"
 kobenhavn_desc: "在西兰岛东岸，隔狭窄的厄勒海峡遥望斯科讷，小渔村#italic 哈文#!由国王瓦尔德马一世赐予他的养兄弟阿布萨隆主教。阿布萨隆于1167年左右在斯洛特霍尔姆岛上建造了一座设防城堡，以镇压波罗的海的文德海盗。在他的继任者治下，主教的堡垒发展成为商业城镇#italic 克布曼兹哈文#!，即商人港，控制着厄勒海峡丰富的鲱鱼渔业——每年夏季大群鲱鱼聚集于此。这座城市的所有权在丹麦国王和罗斯基勒大主教之间曾激烈争夺，但其在厄勒海峡的扼要位置正不断将波罗的海的贸易吸引到它的码头。"
 lund_desc: "隆德由八字胡斯文于十世纪末在其斯科讷领地的中心建立，并于1103年因教宗帕斯加尔二世将其升为整个斯堪的纳维亚的大主教座而获得非凡的声望，将北方教会从汉堡‑不来梅教区分离出来。在大主教阿塞尔主持下开始修建的宏伟罗曼式大教堂于1145年祝圣，至今仍主导着这座城市，其地下室存放着著名的天文钟和巨人芬恩的雕像。尽管尼达罗斯于1152年升格为独立的大主教区，乌普萨拉于1164年紧随其后，隆德仍保持着对丹麦教会和斯科讷的首要地位，其大主教位列丹麦王国最高等级的人物之中。"
 oslo_desc: "按照传统，约1049年哈拉尔·哈德拉达国王在以其命名的大峡湾顶端建立了奥斯陆，1070年它被升为主教驻地，并在中世纪几百年间发展成为挪威王国的主要城镇之一。1299年，哈康五世·马格努松将其定为王室首都，把宫廷从卑尔根迁来以靠近斯堪的纳维亚大陆的政治中心。而阿克斯胡斯大城堡约于1300年开始修建，俯瞰着港口，象征着新的王室雄心。城市的木质街道挤在阿克斯胡斯岩和主教区之间，商人们用挪威内陆的木材和皮毛交换波罗的海港口的谷物和布料。"
 nidaros_desc: "在尼德河汇入特伦德拉格大峡湾的河岸上，尼达罗斯大约在997年由奥拉夫·特里格瓦松国王建立，后来成为他那位推行基督教化的继任者奥拉夫·哈拉尔德松国王的安葬之地。后者于1030年在斯蒂克莱斯塔德战役中阵亡，几乎随即被尊奉为殉道圣人。建在他神龛上的大教堂成为北方世界最神圣的朝圣目的地，吸引来自冰岛、格陵兰和不列颠群岛的信徒。1152年，这座城市被提升为大主教座所在，管辖的教省从挪威腹地一直延伸到西部海域的殖民地。即使在王室首都南迁至卑尔根、继而迁至奥斯陆之后，尼达罗斯仍然是挪威的精神中心，是国王加冕的地方，也是它的永恒之王圣奥拉夫守护领地的所在。"
 abo_desc: "奥布（芬兰人称之为#italic 图尔库#!）建立于1240年代第二次瑞典十字军东征之后，那次东征将芬兰人置于基督教统治之下。它在奥拉河口成长为瑞典在芬兰西南海岸的主要据点。1300年，它被升格为主教区，新落成的大教堂成为芬兰教会的精神中心，而城镇的码头开始吸引将芬兰内陆与斯德哥尔摩及更远处汉萨城市联系起来的波罗的海贸易。尽管与波罗的海南部的大汉萨港口相比仍显逊色，奥布作为瑞典王国芬兰领地的行政和教会首府，其主教的地位与瑞典教会最重要的高级教士并列。"
 kalmar_desc: "卡尔马位于瑞典东南海岸，在大陆与狭长的厄兰岛之间的海峡变窄之处。十二世纪时，卡尔马围绕其巨大的石头城堡发展起来，这是瑞典王国最早也最坚固的皇家堡垒之一。它的港口是瑞典主要的南部出海口，将铁、铜和黄油运往吕贝克及更远地区的汉萨商人手中。1276年，马格努斯·拉杜洛斯国王授予卡尔马皇家特权，确认了它作为王国最重要城市之一的地位。到十四世纪初，卡尔马在丹麦-瑞典边境上的战略位置和它坚固的城墙，使它既是一个重要的贸易港口，也是一个关键的军事要塞，是瑞典王冠对抗丹麦野心的南方堡垒。"
 falun_desc: "在达拉纳的大红山蒂斯卡肖贝里特的山坡上坐落着#italic 大科帕贝里#!铜矿，这是中世纪欧洲最大且产量最高的铜矿，至少自9世纪起便是瑞典工业的固定组成部分。1288年，国王马格努斯三世向经营矿场的#italic 大科帕贝里矿业公司#!授予了正式特权，使其成为世界上最古老的联合商业企业之一。矿工定居点法伦坐落在矿场下方的湖畔，围绕着那个大矿坑发展起来，矿坑冒出的烟和红色氧化尘埃将周围数英里内的房屋和土壤都染上了颜色，而从熔炉中流出的铜不仅供给瑞典领地，也供应整个北欧的市场。"
 uppsala_desc: "在距离那座朴素的大教堂城镇几公里之外，矗立着古老的老乌普萨拉，这是旧时的异教中心。不莱梅的亚当曾描述过那里有一座宏伟的金庙，庙中供奉着托尔、奥丁和弗雷三尊神像，每隔九年就会献上人与牲畜的祭牲，而英格林王朝诸王的陵墓至今仍耸立在平原之上。随着瑞典皈依基督教，这处祭祀场所被取代了，1164年教宗亚历山大三世将乌普萨拉提升为全瑞典大主教的驻地，使瑞典教会脱离了隆德的丹麦管辖。1287年，主教座向南迁移了几公里，迁至新城东阿罗斯，那里已经开始修建一座巨大的砖砌哥特式大教堂，建成后将是斯堪的纳维亚最大的教堂，瑞典的国王们将在这座教堂的圣坛前由领地最重要的高级教士加冕。"
 skara_desc: "斯卡拉坐落在韦纳恩湖和韦特恩湖之间的韦斯特约特兰平原上，由国王奥洛夫·肖特科农于1014年建立，作为瑞典第一个主教区的所在地，德国传教士图尔戈特被任命为第一任主教。从这个朴素的平原小镇，基督教信仰被带入仍然半异教的瑞典领地，而1150年由善主教本格特祝圣的大罗马式教堂标志着斯卡拉在此后数百年作为韦斯特约特兰的精神首府。尽管在影响力上早已被乌普萨拉和林雪平所掩盖，斯卡拉主教仍保留着瑞典领地最重要的高级教士之一的尊荣，他的大教堂分会和《#italic 斯卡拉编年史》#!保存着王国最早几个基督教世纪的记忆。"
 linkoping_desc: "林雪平坐落在东约特兰的内陆平原上，从斯德哥尔摩通往南方诸王国的道路在那里与斯通河交汇。它在12世纪初被升为主教区，长期以来一直是瑞典王国最重要的教会中心之一。它的大教堂始建于12世纪，使用当地浅灰色石灰石建造，后来不断扩建，成为瑞典最宏伟的哥特式建筑之一，而林雪平主教在王国的高级教士中位列仅次于乌普萨拉大主教。在附近的斯凯宁格，1248年召开了一次重要的宗教会议，由教宗使节萨比纳的威廉召集，会议规定瑞典教会的神职人员必须独身，并将其明确纳入更广大基督教世界的拉丁教会法体系。"
 soderkoping_desc: "在斯托河汇入波罗的海的避风河口处，南雪平在12世纪和13世纪发展成为瑞典领地最重要的港口之一，码头上挤满了来自吕贝克和维斯比的柯格船，将瑞典内陆的铁和铜装载起来运往南方市场。这座王室集市城镇拥有一个规模不小的德国市民社区，在源自吕贝克的特权下自治，曾举办过王室加冕、条约谈判，以及每年夏天吸引波罗的海各地商人前来的盛大集市。尽管水道的缓慢淤塞已经开始威胁到港口，但在14世纪初，南雪平仍然是瑞典东海岸主要的贸易地点之一。"
 lodose_desc: "在从维纳恩湖蜿蜒流向大海的约塔河上，洛德瑟充当了瑞典通往大西洋和北海贸易的唯一出口，这是一座木制的河港，挤在水面和陡峭的西岸山丘之间的一条狭长地带上。从它的码头，瑞典船只驶向挪威、英格兰和低地国家的城市，用铁和皮毛换取西方市场的布料和葡萄酒，而这里运营的王室铸币厂至少从十二世纪起就为瑞典国王铸造硬币。洛德瑟夹在丹麦、挪威和瑞典沿约塔河下游相互争夺的领土野心之间，它的归属一直是一个长期的外交问题，作为瑞典唯一的大西洋出口，它的战略价值在王国任何其他地方都无与伦比。"
 jonkoping_desc: "延雪平位于大湖韦特恩的南端，地处斯莫兰高地与东约特兰平原之间的天然渡口，1284年从国王马格努斯·拉杜拉斯那里获得了王室城镇的特权，这份特许状确认了它长期以来作为南北王国之间重要集会和贸易场所的地位。它控制着中部省份与丹麦控制的斯科纳边区之间的主要通道，这使它既成为繁荣的集市城镇，也成为边境要塞，俯瞰港口的王室城堡不断加固，以抵御丹麦人常年向北推进边境的野心。到14世纪初，延雪平已成为从斯莫兰进入瑞典腹地的政治和军事关键。"
 ribe_desc: "里伯建立于约公元700年，当时是位于日德兰半岛西岸沼泽地带的一座维京市场。一条潮汐小溪使远洋船只得以在此靠岸停泊，让里伯成为斯堪的纳维亚最古老的城镇。其商人与弗里斯兰和英格兰沿岸的贸易往来，在维京人抵达不列颠群岛之前已持续了一个多世纪。不来梅的亚当将其描述为丹麦的主要市场，传教士安斯加尔于9世纪初期在此建立了一座教堂，使里伯成为基督教在北方斯堪的纳维亚最早的立足点之一。始建于12世纪的宏伟罗马式大教堂，使用从莱茵兰运来的凝灰岩建造，高耸于城镇之上。该镇的商人仍与北海对岸的弗里斯兰和佛兰德港口进行贸易，将丹麦西海岸的盐和谷物运往南方，以换取布匹和葡萄酒。"
 viborg_desc: "维堡坐落在日德兰中部高原，周围是大片荒地和湖泊，自异教时代以来就一直是日德兰#italic 地方议会#!的所在地，半岛上的首领们在这里聚集讨论法律并宣布他们的国王。在整个中世纪，丹麦的新国王们都先在维堡获得欢呼，然后南下隆德由大主教进行宗教加冕，而城中的两座大教堂——主教座堂和更古老的王室教堂——证明了其城墙之内神圣权力与政治权力的非凡集中。尽管哥本哈根的崛起和丹麦权力向东转移削弱了维堡的日常重要性，但其#italic 地方议会#!的象征首要地位仍然是丹麦国王登基仪式不可或缺的一环。"
 odense_desc: "在菲英岛的中心，欧登塞以北欧神奥丁命名，这里伟大的祭祀场所早在基督教到来之前就已是献给他的圣地。这座城镇的转变始于1086年，当时圣王克努特在圣阿尔班教堂的祭坛前被反叛的贵族杀害，他们拒绝缴纳他的什一税和十字军征调，围绕这位殉道国王迅速兴起的崇拜在1101年获得了教宗的封圣，使欧登塞成为斯堪的纳维亚的一大朝圣目的地。为安放圣人遗物而建立的本笃会修道院由来自埃夫舍姆的英格兰修士创立，使这座城市成为学术中心，到14世纪初，欧登塞已是西兰岛以西丹麦诸岛中最重要的城镇。"
 aarhus_desc: "奥胡斯最初是日德兰半岛东海岸的一个维京时代定居点，位于奥胡斯河与卡特加特海峡交汇处。公元948年，它被列为四个丹麦主教区之一，这些主教区是在蓝牙王哈拉尔德基督教化之后，在德国传教士的影响下建立的。它的避风港湾使其在中世纪数百年间成为东日德兰的主要港口，将日德兰平原上的牲畜和谷物运往吕贝克和汉堡的市场。建于十三世纪的大教堂用砖砌成，耸立在一个由商人和渔民组成的小镇上空。虽然在政治重要性上长期被维堡压制，在商业分量上也不及里伯，但到十四世纪初，奥胡斯已牢固确立了自己作为日德兰卡特加特海岸首要港口的地位。"
 aalborg_desc: "在林姆峡湾南岸，那条从北海穿过北日德兰到达卡特加特海峡的伟大内陆水道在此处经过，奥尔堡控制着峡湾的主要渡口，以及在两片海域之间东西往来的贸易。奥尔堡胡斯的王室城堡，早在其更早的木制形态时，就至少从11世纪起守护着这个渡口，而峡湾的鲱鱼渔业也让镇上的商人们富裕到足以维持与吕贝克和文德港口之间相当规模的汉萨贸易。王室特权、朴素的砖砌教堂以及不断增长的市民人口，使奥尔堡在14世纪初成为北丹麦的主要城镇之一，其位于穿越日德兰水道上的位置赋予了它在该地区无与伦比的战略价值。"
 tonsberg_desc: "根据斯诺里·斯图鲁松萨迦的记载，滕斯贝格建于872年哈弗峡湾大战之前，那场战役使挪威在金发哈拉尔统治下统一。滕斯贝格自称是挪威最古老的城镇，其位于奥斯陆峡湾的避风港口在九世纪和十世纪间一直为维京船队和王室所用。港口上方高处的滕斯贝格胡斯城堡成为中世纪挪威主要的王室城堡之一，而建于十二世纪晚期的奥拉夫斯克鲁斯特普雷蒙特瑞修道院则使这座城市成为学术中心。挪威国王与王位觊觎者之间的条约、王室铸币、以及为内战和十字军东征集结军队，都使滕斯贝格成为挪威历史上不可缺少的地方，其地位仅次于卑尔根、尼达洛斯和奥斯陆。"
 stavanger_desc: "在挪威西南海岸一个受到庇护的海湾里，吕菲尔克的大峡湾在这里通向北海。1125年，十字军国王西居尔将斯塔万格升格为主教区，并带来了温彻斯特的英国主教雷纳尔德来建立这个新的教区。雷纳尔德亲手兴建的这座罗马式大教堂，风格直接来自英格兰的诺曼时代，至今仍在港口占据主导地位，是斯堪的纳维亚受英格兰影响最为明显的教堂之一。作为斯塔万格主教区的所在地，这座城市在挪威王国的主要教会中心之中占有一席之地，主教管辖着罗加兰和阿格德两个教区的大片土地，而港口本身依然只是挪威世界西端一个不起眼的渔港。"
 hamar_desc: "哈马尔坐落在挪威内陆的米约萨湖西岸。1152年，枢机尼古拉斯·布雷克斯皮尔——即后来的教宗阿德里安四世——在他重组挪威教会、建立尼达罗斯大主教区的重大使命期间，将哈马尔升格为主教区。不久之后，湖畔开始修建的大教堂在12世纪和13世纪不断扩建，成为挪威内陆最宏伟的罗曼式教堂之一。哈马尔主教管辖着一个由山谷和湖畔教区组成的教区，是王国最重要的高级教士之一。到14世纪初，这座不大的主教座堂城镇已成为挪威内陆各省的主要宗教中心，其主教区是湖滨地区和挪威东部山区的精神核心。"
 vyborg_desc: "维堡由瑞典元帅托克尔·克努特松于1293年在瑞典针对卡累利阿人的第三次十字军期间建立，位于卡累利阿海岸外的一座岩石小岛上。这座石堡是瑞典王国最东端的前哨站，也是抵御诺夫哥罗德的主要堡垒。三十年间，瑞典总督从城墙上指挥对抗卡累利阿和俄罗斯劫掠者的军事行动，直到1323年《讷特堡条约》最终划定了瑞典与诺夫哥罗德的边界，使维堡成为瑞典国王无可争议的东方堡垒。城堡周围发展起一座日益兴盛的商贸城镇，吸引卡累利阿毛皮、俄罗斯蜂蜡和芬兰商品来到码头，并成为波罗的海航运路线的东部终点。"
 burgos_desc: "布尔戈斯由迭戈·罗德里格斯·波尔塞洛斯伯爵于884年在阿尔兰松河与贝纳河交汇处建立。在9至10世纪期间，它崛起为卡斯蒂利亚伯国最重要的要塞；自1037年起，在费尔南多大帝治下，它成为卡斯蒂利亚‑莱昂联合王国的主要王城。这里是罗德里戈·迪亚斯·德·比瓦尔——即熙德·坎佩亚多尔的故乡，其遗骨安葬于附近的圣佩德罗·德·卡尔德尼亚修道院中。该城还是伟大朝圣之路#italic 法兰西之路#!的起点，引导来自基督教世界的朝圣者前往圣地亚哥‑德孔波斯特拉。阿方索八世于1187年创建的拉斯韦尔加斯皇家陵寝，安葬着卡斯蒂利亚诸王；1221年在费尔南多三世国王治下开始兴建的大哥特式教堂，则作为中世纪西班牙最伟大的建筑成就之一而崛起。"
 leon_desc: "莱昂由罗马人建立，名称源于以该地为营地的#italic 第七双子军团#!。公元10世纪，它崛起为基督教阿斯图里亚斯‑莱昂王国的都城，推动收复失地运动向南推进，跨过坎塔布里亚山麓，进入梅塞塔高原。王宫和圣伊西多罗大教堂——其11世纪的众王殿安葬着二十多位莱昂君主——使该城成为王国的精神与政治核心，其威望与领土一度超越卡斯蒂利亚。尽管1230年费尔南多三世将其与卡斯蒂利亚合并后，政治中心南移至托莱多和巴利亚多利德，莱昂仍保留着其古老王权的象征性尊严。其宏伟的哥特式大教堂始建于1205年，以北法的大教堂为蓝本，成为这种持久骄傲的鲜明写照。"
 salamanca_desc: "萨拉曼卡坐落在梅塞塔高原西部托尔梅斯河上方的岩石峭壁之上，是一座古老的凯尔特伊比利亚和罗马城镇。1085年，在阿方索六世治下，基督教王国在杜罗河和塔霍河间大规模迁移人口，许多人被迁至萨拉曼卡。决定性的转变发生在1218年，当时莱昂国王阿方索九世在此建立了一所#italic 综合学院#!，这所大学后来以惊人的速度发展成为基督教世界四大大学之一，与博洛尼亚、巴黎和牛津齐名。1255年，教宗亚历山大四世确认了其#italic 任教许可#!。这所大学的教会法与神学方面的学者已经能与欧洲更古老的学府相匹敌；至14世纪初，萨拉曼卡已成为卡斯蒂利亚王国的主要知识中心。"
 segovia_desc: "塞哥维亚坐落于瓜达拉马山麓，以那座壮观的罗马双层拱洞花岗岩高架水渠闻名于世。一千二百多年来，它源源不断地过滤泥沙，将弗里奥河的河水从山脉引入城中，是西班牙自古代留存至今最为恢宏的工程遗迹之一。1085年，阿方索六世征服托莱多之后，将此地辟为边陲城镇，迁徙居民于此定居。此后，塞哥维亚在中世纪逐步发展为王室钟爱的驻跸之地，并设有重要的皇家铸币厂。卡斯蒂利亚的历代国王常常驻留于城中的阿尔卡萨城堡，处理司法事务，主持国政。当地的美利奴羊每年往返于埃斯特雷马杜拉的冬季牧场与卡斯蒂利亚的夏季高地之间，正是这条迁徙之路，让塞哥维亚的羊毛在佛兰德市场上享有盛誉。"
 avila_desc: "阿维拉坐落在中央山脉西缘一块风吹日晒的花岗岩突出地上，由勃艮第的雷蒙德伯爵在1090年重新定居，随即被一道伊比利亚最完整、最令人敬畏的中世纪城墙所环绕，这道城墙由莱昂和布尔戈斯的石匠在不到十年的时间内建成。八十八座半圆形塔楼和九座城门矗立在岩石台地的边缘，俯瞰着这座已成长为重新定居的卡斯蒂利亚重要前沿据点的城市。城内的教堂，包括将后殿建在城墙东段的圣萨尔瓦多大教堂，使它成为宗教生活的中心，也是一座军事堡垒。到14世纪初，这座城市的城墙依然完好无损地矗立着，作为卡斯蒂利亚重新定居的象征，冷漠地注视着它们为之修建要防御的梅塞塔高原。"
 madrid_desc: "马德里建于9世纪末，最初是一个名为#italic 马伊里特#!的小型穆斯林前哨，得名于滋润周边荒野的丰富泉水。当莱昂‑卡斯蒂利亚的阿方索六世在1083年向托莱多大举推进时，马德里作为哈里发北部边境的一座设防乡村城镇被他不战而取。卡斯蒂利亚王室将它维持为一座不大的王室城镇，在阿方索八世治下于1202年授予它#italic 特许状#!，其猎场上的摩尔人也使它成为巡游的卡斯蒂利亚宫廷喜爱的驻留之地。1309年，费迪南德四世首次在马德里召集卡斯蒂利亚议会，这标志着该镇日益增长的行政重要性，尽管它仍然是附近帝国城市托莱多阴影下的一个不大的定居点。"
 santiago_compostela_desc: "相传在9世纪初，隐士佩拉约在加利西亚荒山野岭的一片橡树林上空，发现了一颗异星。在星光的指引下，他找到了一座罗马时期的墓葬。伊里亚·弗拉维亚的主教特奥德米尔确认，这就是约翰的兄弟使徒雅各的安息之地。据说，雅各在耶路撒冷殉道后，他的门徒将他的遗体带到了这里。阿斯图里亚斯国王阿方索二世在重新发现的墓穴上修建了第一座教堂。到了11和12世纪，圣地亚哥‑德孔波斯特拉逐渐发展成为继罗马和耶路撒冷之后，基督教世界的第三大朝圣圣地。来自欧洲各个角落的忏悔者将雅各的#italic 扇贝#!徽章佩戴在帽子上。宏伟的罗马式大教堂始建于1075年，由迭戈·佩拉埃斯主教发起，并由继任者迭戈·赫尔米雷斯主教持续推进。这座教堂坐落在中世纪欧洲最繁忙的道路#italic 法兰西之路#!的终点。孔波斯特拉大主教区是拉丁基督教世界中最有权势、也最受争议的教会领地之一。"
 zaragoza_desc: "萨拉戈萨由奥古斯都皇帝在埃布罗河畔建立，名为#italic 凯撒奥古斯塔#!，地处广阔的河谷平原中心，曾是埃布罗河上游河谷最重要的罗马城市。此后，它经历了西哥特人统治，并于714年归入穆斯林治下。在11世纪胡德王朝泰法统治时期，它成为安达卢斯泰法中最具文化修养的都城之一，其城郊的阿尔哈费里亚宫至今仍是伊斯兰晚期宫廷建筑的一颗明珠。1118年，该城被阿拉贡的“战士”阿方索一世在收复失地运动的一次重大胜利中攻克，并升格为新阿拉贡王国的首都。宏伟的穆德哈尔教堂、王家铸币厂以及阿拉贡议会的集会场所，使其成为阿拉贡王冠领的政治与礼仪中心。"
 valencia_desc: "巴伦西亚由罗马人在图里亚河宽阔的沿海平原上建立，名为#italic 埃德塔诺鲁姆的瓦伦蒂亚#!。该城先后历经西哥特和摩尔人之手，随后短暂成为罗德里戈·迪亚斯·德·比瓦尔——熙德的个人领地，他自1094年起统治该城，直至1099年去世。他麾下的基督教军队撤离后，该城复归穆斯林统治，在穆拉比特和穆瓦希德王朝统治下繁荣发展，成为安达卢斯最伟大的城市之一。其#italic 灌溉园地#!和柑橘园闻名遐迩，享誉地中海。1238年10月9日，阿拉贡国王“征服者”海梅一世凯旋入城，结束了东部收复失地运动中最漫长的一次围城，并建立了隶属于阿拉贡王冠领的巴伦西亚王国，保留了其灌溉农业、#italic 灌溉园地#!水法庭，以及大部分繁荣。"
 palma_desc: "这座城市由罗马人在巴利阿里群岛一处避风海湾建立，名为#italic 帕尔马里亚#!，先后历经汪达尔人和拜占庭人之手，直到902年被科尔多瓦哈里发国征服，转变为繁荣的穆斯林城市#italic 马尤尔卡城#!。1229年，阿拉贡国王“征服者”海梅一世率军发起大规模海上军事行动，一役征服了该岛。1276年，他的儿子海梅二世被授予新建立的马略卡王国——一个由巴利阿里群岛、鲁西永和蒙彼利埃组成的小型但富庶的王国。14世纪初，海梅三世治下的马略卡王国仍作为阿拉贡王冠领的独立附庸存在，其首府发展为西地中海最重要的商港之一，城中的拉塞乌主教座堂以金色砂岩建成，高耸于港口之上。"
 girona_desc: "赫罗纳坐落在东比利牛斯山四条河流的交汇处，曾是罗马时期奥古斯都大道上的#italic 格伦达#!，自古以来便是一座设防城市。自9世纪起，加洛林伯爵在此统治，作为西班牙边陲区对抗穆斯林安达卢斯的前沿阵地。至13世纪，该城已成为加泰罗尼亚公国的主要城镇之一，其主教区是阿拉贡王冠领最重要的教区之一，城中犹太区#italic 卡利#!则是一个学者与医生聚居的繁荣社区。1285年，西西里晚祷引发的阿拉贡十字军战争期间，法国国王腓力三世围攻赫罗纳。该城的成功防御，加上法国舰队在莱斯福尔米格斯海战中的覆灭，成为加泰罗尼亚市民记忆中最引以为傲的时刻之一。"
 pamplona_desc: "潘普洛纳由罗马将领庞培于公元前75年征战塞尔托里乌斯期间建立，名为#italic 庞培洛#!。自824年伊尼戈·阿里斯塔被拥立为首任纳瓦拉国王以来，潘普洛纳一直是这个巴斯克‑罗曼王国的都城。该城由三个互相竞争的设防城镇组成，形成了一种独特的城市形态，三个城镇分别为最初的巴斯克居民居住的纳瓦雷里亚区、法兰克商人居住的圣塞尔宁区以及后来法兰西移民居住的圣尼古拉斯区。这种格局使该城的政治以频繁的纷争著称，三个社区甚至偶尔在城墙之内相互交战。自1328年以来，纳瓦拉王冠一直由卡佩家族的埃夫勒支系持有，潘普洛纳作为这个比利牛斯王国的都城，维持着其在卡斯蒂利亚和阿拉贡两大崛起势力之间的独立。潘普洛纳主教与商贾共同塑造了这座城市的文化认同，使它兼具巴斯克、罗曼与法兰克三重特质。"
 malaga_desc: "马拉加由腓尼基人于公元前8世纪建立，名为#italic 马拉卡#!，其名源于至今仍支撑其经济的腌鱼业。近三千年来，它一直是伊比利亚半岛南部海岸的主要港口之一。在科尔多瓦哈里发国及后来的格拉纳达奈斯尔埃米尔治下，该城作为安达卢斯的海上门户而繁荣兴盛，其港口接收马格里布贸易的丝绸、奴隶和香料，其肥沃的#italic 阿克萨基亚#!腹地则出产闻名遐迩的甜酒和杏仁，远销地中海各地。港口山丘上的摩尔城堡由哈穆德埃米尔于11世纪建造，并持续扩建，成为该城枢纽。马拉加的热那亚商人聚居区、皮革鞣制区及丰富的水果种植园共同使这座城市成为奈斯尔王国的经济引擎。"
 almeria_desc: "阿尔梅里亚由阿卜杜勒‑拉赫曼三世于10世纪初建立，作为科尔多瓦哈里发国的重要海军兵工厂。在11世纪泰法诸王统治下，它崛起为安达卢斯最富庶的城市之一，其丝绸织工和青铜工匠将精美制品出口至黎凡特和马格里布，其造船厂下水的桨帆船曾短暂地与比萨和热那亚争夺西地中海的控制权。1147年，在第二次十字军期间，卡斯蒂利亚、阿拉贡、热那亚和比萨的联合舰队攻克该城，粉碎了其黄金时代。尽管十年后被穆瓦希德王朝夺回，该城再未完全恢复昔日的繁荣。至14世纪初，阿尔梅里亚已被并入奈斯尔王朝的格拉纳达王国，成为其第二大城市。其作坊中仍源源不断地生产丝绸，仿佛在呼应着往日繁荣的余响。"
 coimbra_desc: "科英布拉坐落在蒙德古河向北弯曲汇入大西洋处的一座陡峭山丘之上。它曾是罗马的#italic 埃米尼乌姆#!，后来沿用了附近一座更古老的废弃城镇的名称#italic 科宁布里加#!。1064年，莱昂国王费尔南多大帝将其从摩尔人手中收复，使其成为新建立的葡萄牙伯国的主要城市。在国王阿方索·恩里克斯及其继任者治下，科英布拉在1139年至1255年间担任新独立的葡萄牙王国的首都，早期葡萄牙编年史便是在此撰写，王国的骑士传奇也在此成形。尽管阿方索三世国王将宫廷迁至里斯本，科英布拉仍保留着强大的文化和教会角色。国王迪尼斯于1290年建立的#italic 综合学院#!，虽在里斯本与科英布拉之间几度迁址，亦使该城成为伊比利亚最重要的学术中心之一。"
 braga_desc: "布拉加由奥古斯都皇帝创立，名为#italic 布拉卡拉·奥古斯塔#!，并成为罗马加利西亚行省的首府。它是伊比利亚最古老的基督教城市之一，其主教区早在3世纪便已建立，承接使徒正统，为其对全伊比利亚首席主教的宣称提供了证明。西哥特、苏维汇和摩尔统治者皆相继确认了该城在教会的卓越地位。收复失地运动之后，布拉加大主教区于1070年得以恢复，并与托莱多展开了长达数世纪的对伊比利亚教会首席权的争夺。1070年始建的宏伟罗马式主教座堂，经过中世纪的不断扩建，不仅成为处理葡萄牙北部属灵事务的大主教教座，而且在政治时机允许时，也对加利西亚和阿斯图里亚斯的教会行使都主教权威。"
 evora_desc: "埃武拉由凯尔特卢西塔尼亚人于远古时期在阿连特茹南部广阔起伏的平原上的一座低矮山丘上建立。它后来成为罗马的#italic 埃博拉·利贝拉利塔斯·尤利亚#!，其狄安娜神庙至今仍矗立于旧城中心。1166年，传奇人物“无畏者”热拉尔多·塞姆·帕沃尔在一次大胆的夜袭中将其从摩尔人手中夺回。在12至13世纪期间，该城发展为基督教阿连特茹的主要城市，成为主教教座，以及阿维什骑士团和卡拉特拉瓦骑士团在葡萄牙的总部所在地。至14世纪初，埃武拉已成为葡萄牙王国最重要的城市之一，其始建于12世纪末的宏伟罗马式大教堂，俯瞰着一座深受阿维什王室青睐的城镇。"
 merida_desc: "梅里达由奥古斯都于公元前25年建立，作为坎塔布里亚战争退伍军人的殖民地，并成为罗马#italic 卢西塔尼亚#!行省的首府。它发展成为西罗马帝国最大、最辉煌的城市之一，其剧场、竞技场、高架水渠和横跨瓜迪亚纳河的大桥，在经历了十一个世纪的衰落之后，仍在地貌上留下了持久的印记。在西哥特人统治下，它仍是极为重要的主教教座；穆斯林征服后，它成为哈里发国西部边疆的主要城市之一。1230年，莱昂国王阿方索九世收复该城，并将其授予圣地亚哥骑士团，后者在此建立了总部。尽管罗马遗址如今高耸于一座简陋的边境城镇之上，该城仍是基督教向埃斯特雷马杜拉推进的重要据点，也是这个伟大的卡斯蒂利亚军事修会的驻地。"
 tarragona_desc: "塔拉戈纳由罗马人在第二次布匿战争后建立于加泰罗尼亚海岸的一处岬角上，作为行省的首府，被称为#italic 塔拉科#!。它逐渐发展为西罗马帝国最显赫的城市之一，是近西班牙行省的总督驻地，也是伊比利亚最早的基督教社群之一。714年，该城遭到穆斯林入侵者洗劫，几乎荒废了四个世纪，直到1118年才正式恢复。塔拉戈纳大主教区被重新确立为加泰罗尼亚教会的都主教教座，以及阿拉贡王冠领的最重要的教长，积极与阿拉贡、加泰罗尼亚和巴伦西亚的教会争夺管辖权。至14世纪初，宏伟的罗马式‑哥特式大教堂矗立于古罗马城墙之上，象征着这座城市正缓慢恢复其古老的尊严。"
 murcia_desc: "穆尔西亚由伍麦叶埃米尔阿卜杜勒‑拉赫曼二世于825年建立，名为#italic 穆尔西耶#!，位于塞古拉河的转弯处，广阔的灌溉#italic 农业区#!开始向沿海平原敞开的地方。在11世纪泰法诸王统治下，穆尔西亚崛起为安达卢斯东南部的主要城市，成为丝绸织造、陶瓷生产以及伊本·班纳学派传承的阿拉伯数学与天文学知识的繁荣中心。1243年，根据阿尔卡拉斯协议，穆尔西亚王国接受了卡斯蒂利亚的宗主权；1266年，阿拉贡国王海梅一世镇压了一场叛乱后，该城由“智者”阿方索十世最终并入卡斯蒂利亚王冠。在加泰罗尼亚和阿拉贡殖民者迁入后，至14世纪初，穆尔西亚已成为卡斯蒂利亚对抗南方奈斯尔格拉纳达王国的主要边境城市。"
 cadiz_desc: "加的斯由推罗的腓尼基人在约公元前1100年建立，名为#italic 加迪尔#!，意为“坚固之地”。它坐落在从伊比利亚半岛南部海岸延伸至大西洋的一条长长的沙洲上，是西欧最古老的持续有人居住的城市之一。三千年来，其港口接待过腓尼基人、迦太基人、罗马人、西哥特人和摩尔人的船队。罗马人称其为#italic 加德斯#!，在他们治理下，加的斯成为西罗马帝国最富庶的城市之一，是诗人、元老以及帝国时期著名舞女的故乡。然而，古典时代晚期的长期衰落，使摩尔人统治时它已沦为一座普通的渔镇。1262年，“智者”阿方索十世将其收复，并迁入居民建立为卡斯蒂利亚的边境港口。至14世纪初，加的斯已成为卡斯蒂利亚王国南部最主要的出海口之一，其面向大西洋的港口已开始将目光投向更广阔的海洋。"
 jaca_desc: "哈卡坐落在阿拉贡河上游的一处比利牛斯山谷中，法兰西通往圣地亚哥的朝圣之路在此经松波特山口下行。11世纪初，国王拉米罗一世将其立为新生的阿拉贡王国的第一座首都。1063年的哈卡宗教会议确认了其主教区地位；约1077年，国王桑乔·拉米雷斯授予其著名的#italic 《富埃罗特许状》#!，这是伊比利亚最早、最具影响力的市镇宪章之一，吸引了法兰克商人和工匠沿圣地亚哥之路定居，并被阿拉贡和纳瓦拉的诸多城镇奉为范本。其宏伟的罗马式圣佩德罗大教堂也始建于同一时期，是西班牙最古老的教堂之一。尽管随着收复失地运动的推进，阿拉贡宫廷很快南迁至韦斯卡，后又迁至萨拉戈萨，但至14世纪初，哈卡仍是阿拉贡与法兰西间的北方门户，以及朝圣之路上的重要staging post。"
 san_sebastian_desc: "圣塞瓦斯蒂安坐落在比斯开湾一处狭窄海湾旁，被乌尔古尔山树木繁茂的山坡所庇护。该城围绕一座供奉殉道者圣塞巴斯蒂安的修道院发展起来，约于1180年由纳瓦拉国王“智者”桑乔六世授予市镇特许状，为内陆的纳瓦拉王国提供了一个梦寐以求的出海口。1200年，阿方索八世时期，卡斯蒂利亚吞并吉普斯夸，该城归入卡斯蒂利亚王冠下，后者确认了其特权，并扶持其说加斯科涅语的市民从事渔业和运输贸易。该城水手为捕鲸而远航四方，其港口则将卡斯蒂利亚的铁和羊毛运往波尔多及更远之地，并满载葡萄酒而归。至14世纪初，圣塞瓦斯蒂安已成为巴斯克海岸最重要的港口之一，是一座依海而生的设防城镇。"
 perpignan_desc: "位于比利牛斯山与地中海之间的泰特河平原上的佩皮尼昂于10世纪首次出现在历史记载中。它作为鲁西永伯爵的主要城镇而崛起，于1172年随该伯国一同归入阿拉贡王冠。1276年，当阿拉贡国王海梅一世分割王国传给继承人时，佩皮尼昂成为新建立的马略卡王国的大陆首都，国王海梅二世在城镇上方的高地上建造了宏伟的马略卡王宫。凭借其织工和著名的鲁西永布料，以及加泰罗尼亚与法国之间的贸易往来，该城作为毛纺与皮革业中心而繁荣发展。至14世纪初，佩皮尼昂已成为马略卡国王的大陆驻地，这座繁荣的市镇生产的布料供应着西地中海的大片地区。"
 alicante_desc: "贝纳坎蒂尔陡峭岩壁之下的阿利坎特自古代便有人定居。希腊人称之为#italic 阿克拉琉克#!（白色岬角），罗马人称之为#italic 卢森图姆#!。后来，它成为穆斯林治下的#italic 拉坎特城#!，一座由山顶堡垒守护的地中海沿岸小港。1248年，未来的阿方索十世为卡斯蒂利亚夺取该城镇；但在1296年卡斯蒂利亚王位继承战争期间，又被阿拉贡国王海梅二世占领，并于1308年根据《托雷利亚斯征服领土分割协议》并入巴伦西亚王国。至14世纪初，阿利坎特已成为阿拉贡王冠领的一座南方港口，其城堡矗立于贝纳坎蒂尔岩顶，俯瞰着一座承运内陆出产的葡萄酒、杏仁和西班牙草的港口。"
 cartagena_desc: "卡塔赫纳由迦太基将军哈斯德鲁巴在约公元前227年建立，名为#italic 卡尔特·哈达什特#!，位于地中海最优良的天然港口之一上，罗马人将其更名为#italic 新迦太基#!。该城凭借其腹地的银矿繁荣富裕，并拥有一座大型海军军械库。公元前209年，在对抗迦太基的战争中，大西庇阿曾攻陷此城，名噪一时。其主教区是西班牙最古老的教区之一，但长达数世纪的衰落和穆斯林征服，使这座曾经的伟大港口沦为古时辉煌的残影。1245年，该城被卡斯蒂利亚王子阿方索收复，其教区得以恢复。至14世纪初，卡塔赫纳仍是卡斯蒂利亚王国边疆上一个规模不大但战略意义至关重要的港口，其壮丽的海湾仍庇护着沿南部海岸航行的舰队。"
 algeciras_desc: "阿尔赫西拉斯由柏柏尔指挥官塔里克·伊本·齐亚德于711年在穆斯林征服者首次踏上伊比利亚半岛的地点建立，其名#italic 杰济拉卡德拉#!（绿岛）源于海峡西岸庇护其港口的一座小岛。六个世纪以来，它一直是军队和商人从马格里布渡海而来的主要登陆点，是连接安达卢斯与北非的重要桥头堡。该城先后由伍麦叶王朝、阿尔赫西拉斯泰法国、穆拉比特王朝和穆瓦希德王朝统治；至14世纪初，它成为马林王朝在伊比利亚半岛的立足点，其设防的双重港口是非洲士兵与黄金涌入海峡沿岸争议地区的主要门户。"
 gibraltar_desc: "711年塔里克·伊本·齐亚德率军登陆，开始征服伊比利亚之地，登陆地的山丘被命名为#italic 贾巴勒塔里克#!（塔里克山）。数世纪来，此地不过是海峡上方的一处瞭望哨站。1160年，穆瓦希德哈里发阿卜杜勒·穆明在此修建防御工事，建起一座设防城镇和城堡，命名为#italic 胜利之城#!，以控制海峡最窄处。1309年，该地被卡斯蒂利亚短暂夺取，但很快又被伊斯兰世界收复。至14世纪初，直布罗陀已成为马林王朝激烈争夺的据点，其高耸的岩壁俯瞰着两海与两大陆之间的门户。"
 marbella_desc: "马尔韦亚位于塞拉尼亚山麓肥沃的沿海平原上，由罗马定居点发展成为穆斯林城镇#italic 马尔巴拉#!，其摩尔城堡守护着这片海岸。这里盛产葡萄、无花果及温和气候带来的物产。作为南部海岸一座规模中等但繁荣的港口，马尔韦亚运出腹地的水果和丝绸，并依靠温暖地中海的渔业维持生计。至14世纪初，马尔韦亚已成为奈斯尔格拉纳达王国的一部分，是守护伊比利亚最后一个穆斯林王国沿海侧翼的一系列设防城镇之一。"
 fez_desc: "非斯由伊德里斯王朝于公元800年前后在以其命名的河流两岸建立。非斯的迅速发展源于来自科尔多瓦的安达卢斯难民和来自凯鲁万的阿拉伯家族到此定居，而这两个聚居区也赋予其独特的城市性格。由法蒂玛·菲赫里于859年捐建的大清真寺与#italic 卡拉维因#!大学，使非斯成为伊斯兰世界最重要的学术中心之一，吸引着来自地中海各地的法学、神学与科学学者。马林王朝取代穆瓦希德王朝后，于1276年将非斯定为都城，并在旧城旁兴建了皇家区#italic 新非斯#!，内有宫殿、花园和清真寺。至14世纪初，非斯已达到其荣耀巅峰，成为马林王朝的政治与知识核心。"
 marrakesh_desc: "马拉喀什由穆拉比特指挥官阿布·伯克尔·伊本·奥马尔于1070年在高阿特拉斯山积雪的山峰脚下的豪兹平原边缘建立。它从一片沙漠营寨以惊人的速度崛起，成为一个疆域自塞内加尔河延伸至埃布罗河的帝国的都城。在穆拉比特王朝及其后的于1147年夺取该城的穆瓦希德王朝治下，马拉喀什以宫殿、花园及库图比亚清真寺高耸的宣礼塔为装饰，水源通过精巧的地下#italic 坎儿井#!从山中引入。在欧洲旅行者口中，它的名字被赋予整个摩洛哥王国。尽管马林王朝此后已将首都北迁至非斯，但至14世纪初，马拉喀什仍是南部的重要城市，是阿特拉斯山、苏斯地区与通往沙漠的商队道路之间的门户。"
 sijilmasa_desc: "锡吉勒马萨于757年建立在撒哈拉沙漠北部边缘塔菲拉勒特绿洲的椰枣林中，并崛起为跨撒哈拉商队贸易的北方终点站。柏柏尔骆驼商队将加纳和马里的黄金穿越沙漠运至此地，以交换地中海世界的盐、布匹和制成品。数个世纪以来，其铸币厂铸造的金第纳尔润滑了整个西方伊斯兰世界的商业，其商贾作为两大洲的中间人而积累起惊人的财富。该城在被穆拉比特王朝征服之前，曾由多个独立王朝统治。至14世纪初，锡吉勒马萨仍是马林王朝不可或缺的沙漠门户，尽管商队路线的缓慢转移已开始威胁其古老的繁荣。"
 rabat_desc: "拉巴特由穆瓦希德哈里发阿卜杜勒·穆明于12世纪中期建造，最初是一座守卫布赖格赖格河口的#italic 里巴特#!。在其孙雅各布·曼苏尔治下，这一营地被赋予了更宏大的雄心。1195年在阿拉尔科斯战役获胜后，曼苏尔将其命名为#italic 胜利营地#!，并决心将其建为一个庞大帝国的首都。他开始建造一座宏大的清真寺，其巨大的宣礼塔——哈桑塔——在他去世时仍未完工，此后便一直矗立于此，象征着被截断的梦想。随着穆瓦希德王朝的衰败，这座宏伟的城市几乎人去楼空。至14世纪初，拉巴特已成其巨大的烂尾城墙旁的一座小城镇，于河口处眺望大西洋，与对岸更古老的邻居塞拉隔河相望。"
 sale_desc: "塞拉坐落在布赖格赖格河与海洋交汇处的北岸，发展成为中世纪摩洛哥最重要的港口之一。其商贾将内陆的谷物、羊毛、皮革和蜂蜡运往伊比利亚和意大利的基督教城市及地中海市场进行贸易。1260年，该城遭到卡斯蒂利亚舰队的毁灭性洗劫，此后马林王朝苏丹重建并加强了城防，为其增添了一座华美的清真寺和一所享有盛誉的伊斯兰学校。至14世纪初，塞拉已是一座富裕且文明的贸易城市，港口中挤满了来往于两海之间的船只，其学者和法学家为其赢得了可与内陆大城市相媲美的学术声誉。"
 ceuta_desc: "休达——阿拉伯语称#italic 塞卜泰#!——踞守直布罗陀海峡的非洲海岸，两个海洋与两个大洲在此几乎相接。自古至今，它一直是西地中海最令人垂涎的港口之一，其避风港是马格里布与安达卢斯之间的天然渡口。作为一座大型转口贸易港，这里的作坊出产精美的黄铜器皿，而这里的抄写员缮写出优美的手稿。休达经手非洲与欧洲之间的黄金与货物，长期在其商人显贵巴努·阿扎菲家族的自治下维持一种谨慎的独立。至14世纪初，休达仍受到马林王朝与格拉纳达的奈斯尔王朝持续的争夺，它是一份熠熠生辉的战利品，其繁荣与地理位置共同使其成为扼守海峡的关键。"
 tangier_desc: "丹吉尔守卫着地中海通向大西洋的海峡西口，丹吉尔是摩洛哥最古老的城市之一，是腓尼基人的贸易站和罗马人口中的#italic 廷吉斯#!，毛里塔尼亚的廷吉塔纳行省由此得名。几个世纪以来，它的战略港口先后落入汪达尔人、拜占庭人、伍麦叶人、阿尔摩拉维德人和阿尔摩哈德人手中，每一方都珍视这座城市作为非洲与欧洲之间门户的地位。到14世纪初，丹吉尔是一个规模不大但持续重要的马林王朝港口，它位于大陆最角落的位置确保了任何争夺海峡的势力都无法忽视它。"
 taza_desc: "塔扎横跨在里夫山脉与中阿特拉斯山脉之间的狭窄走廊上，这个缺口是东西摩洛哥之间唯一容易通行的通道，长期以来一直是最重要的战略要塞城市。1130年代，穆瓦希德领袖阿卜杜勒·穆敏就是在这里建立了自己的权力，随后挥师征服了马拉喀什，城中的大清真寺也建于那个时期。马林王朝随后将塔扎作为最早征服的城镇之一，并使之成为守卫通往非斯道路的关键据点。到14世纪初，这座有城墙的城镇控制着马林领地至关重要的东部门户，是控制整个摩洛哥的一把持久的钥匙。"
 meknes_desc: "梅克内斯建于10世纪，由给这座城市命名的梅克纳萨柏柏尔人建立，后被阿尔摩拉维德人加固为中阿特拉斯以北肥沃平原上的据点。它在果园、橄榄林和麦田之间成长为一个繁荣的集市城镇。尽管它长期处于附近非斯的阴影下，马林王朝还是在这里修建了清真寺和一所精美的神学院，而它的农业财富和充足的水源使它成为领地的粮仓。到14世纪初，梅克内斯是一个花园和市场遍布的繁荣省城，它的战略位置和富饶的腹地预示着它更大的未来。"
 taroudant_desc: "坐落在大阿特拉斯与小阿特拉斯之间苏斯河谷肥沃地带的塔鲁丹特，长期以来一直是南部丰饶农业土地的主要城镇，河水灌溉着这片土地，它以谷物、橄榄、甘蔗和园圃的出产而闻名。1056年被阿尔摩拉维德人作为通往权力道路上最早的征服之一夺取，此后这座有城墙的城市成为整个苏斯地区的首府和集市，汇集了山谷的出产和从沙漠绿洲运来的货物。到14世纪初，塔鲁丹特仍然是南部繁荣的核心，一座被果园和集市环绕的有城墙城镇，坐落在山区、平原和沙漠的交汇处。"
 aghmat_desc: "坐落在大阿特拉斯山麓的阿格马特，早在马拉喀什存在之前就是豪兹地区的主要城镇，一个繁荣的集市，山区、平原和跨撒哈拉商队的货物在此交换。它曾是阿尔摩拉维德人的早期据点，后来他们在附近建立了新都，而被废黜的塞维利亚诗人国王穆塔米德在这里度过了他流亡的最后岁月，并于1095年去世，他的坟墓成为一个令人感伤的朝圣之地。随着马拉喀什的兴起而黯然失色，阿格马特到14世纪初已萎缩为一个不大的城镇，它的荣耀主要被记住在那位死于其城墙之内的被俘国王的诗句中。"
 tinmel_desc: "在大阿特拉斯一个偏远山谷的高处，山地要塞廷梅尔是穆瓦希德运动的发源地，12世纪初，宣讲神的统一性教义的马赫迪伊本·图马尔特在这里聚集了他的柏柏尔追随者，发动了那场推翻阿尔摩拉维德人、征服整个马格里布和安达卢斯的革命。他的陵墓和旁边建起的巨大防御清真寺使廷梅尔成为穆瓦希德哈里发的精神首都和王朝圣地，一座被群山守护的圣所。到14世纪初，穆瓦希德人早已覆灭，廷梅尔成了一个受人崇敬但偏僻的朝圣地，它的清真寺矗立在那里，作为一个诞生于这些山中的帝国的纪念。"
 volubilis_desc: "沃吕比利斯坐落在在后来的梅克内斯城附近山丘上的一片肥沃高原上，罗马人称为#italic 瓦利利#!，廷吉塔纳毛里塔尼亚行省的西部首府，一座拥有凯旋门、巴西利卡、榨油坊和精美马赛克的富裕省城，位于罗马世界的最边缘。尽管军团在古代晚期撤离，这座城镇在柏柏尔居民手中存续了下来，788年伊德里斯·伊本·阿卜杜拉就是在附近避难，并被拥戴为摩洛哥第一个穆斯林王朝的奠基人。到14世纪初，这座曾经伟大的罗马城市已是一片倾颓的废墟，旁边是一个不大的定居点，那些倒下的柱子提醒着人们曾在这片土地上兴起又衰亡的帝国。"
 anfa_desc: "安法坐落在大西洋海岸一个宽阔海湾上方的低矮高地上，是一个柏柏尔港口城镇，靠捕鱼、耕种身后肥沃的沙维雅平原以及西海岸的海上贸易为生。这座城镇长期以来因独立于内陆大王朝而令它们嫉恨，在邻居中间赢得了大胆航海者和私掠者巢穴的名声，他们劫掠沿岸的船只。到14世纪初，安法仍然是马林领地边缘一个不大但有活力的大西洋港口，它的水手们在洋面上追逐鱼类和战利品。"
 azemmour_desc: "阿泽穆尔坐落在乌姆赖比耶大河入海口上方的一处悬崖上，河水在那里汇入大西洋。这是一座古老的港口城镇，靠海靠河为生，最出名的是每年春天大批西鲱鱼成群结队游入河中。它的港口吞吐着身后富饶的杜卡拉平原出产的谷物和羊毛，与伊比利亚和地中海的商人做着贸易。到14世纪初，阿泽穆尔已是摩洛哥大西洋沿岸一座繁华的筑有城墙的港口，住着渔民和商人，它的命运随着赋予它生命的河流起起落落。"
 asfi_desc: "阿斯菲坐落在大西洋沿岸低矮悬崖下方的一个海湾里，是一座古老的渔港和商港。它汇集身后阿卜达平原出产的谷物、羊毛和农产品，运往西方各海域出口。它的港口吸引了来自热那亚、加泰罗尼亚和葡萄牙的商人，他们来此采购南摩洛哥的货物，而当地渔民则在近海丰饶的大西洋水域作业。到14世纪初，阿斯菲已成为马里尼德王朝南方主要的大西洋出海口之一，是一个不大却繁忙的港口，内地的物产在这里与基督教贸易城市的船只相遇。"
 asilah_desc: "阿西拉坐落在大西洋沿岸，海峡以南不远处，是摩洛哥最古老的港口之一。它曾是腓尼基人和迦太基人的贸易站，古人称之为#italic 齐利斯#!，罗马人则将它列为廷吉塔纳毛里塔尼亚的港口之一。几百年间，它的城墙和码头几易其手，而它在靠近海峡入口的大西洋海岸上的位置，使它始终是贸易和争夺之地。到十四世纪初，阿西拉是一座有防御工事的马林王朝港口，规模不大，港口承担着大西洋沿岸的海岸贸易，城墙则抵御着在这些争夺不断的海域游弋的舰队。"
 larache_desc: "拉腊什坐落在卢科斯河汇入大西洋的地方，在古代腓尼基殖民地#italic 利克苏斯#!的遗址附近发展起来，利克苏斯是大西洋沿岸最古老的贸易站之一，传说中它位于赫斯珀里得斯的花园之中。这座小镇靠在河和海里捕鱼、靠沼泽出产的盐、靠经过港口的谷物和货物贸易为生。到十四世纪初，拉腊什是马林王国一个规模不大但很有用的大西洋港口，它受庇护的河口在这段本来完全暴露于大洋力量的海岸上提供了一个避风处。"
 tetouan_desc: "得土安坐落在里夫山脉下方一片肥沃的山谷中，离地中海内陆不远。大约1286年，马林王朝的王子阿布·塔比特重新建立并加固了这座城市，把它作为军事基地，用来围攻附近的休达。它位于一条河流的入海口后方，背靠群山，面朝大海，既是天然的要塞，也是里夫山区与海岸之间贸易的集散地。到14世纪初，得土安已成为一座有城墙的马林王朝城镇，重要性日益增长，扼守着地中海的通道和摩洛哥北部的山路。"
