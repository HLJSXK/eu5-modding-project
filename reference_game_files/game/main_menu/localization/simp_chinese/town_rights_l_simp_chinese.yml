l_simp_chinese:
 revoke_town_rights: "撤销城镇特权"
 revoke_town_rights_desc: ""
 REVOKE_TOWN_RIGHTS_FROM: "撤销[TownRightsItem.GetFirstLocationName]的[town_rights|E]"
 #######################################
 #   Non-production Rights    ##########
 #######################################
 staple_port: "特贸港"
 staple_port_desc: "该[location|e]被授予了法定特许状，赋予当地[ShowEstateTypeName('burghers_estate')]阶层本地[trade|e]的优先管控权利。"
 granary_town: "粮储镇"
 granary_town_desc: "该[location|e]被授予了法定特许状与规制权限，有助于提升本地[food|e]的生产与储备规模。"
 market_charter: "Market Charter"
 market_charter_desc: "This [location|e] has been granted the right to hold regular markets, drawing merchants and traders and expanding the capacity of its local [ShowBuildingTypeName('marketplace')]."
 free_town_charter: "Free Town Charter"
 free_town_charter_desc: "This [location|e] has been granted rights of self-governance, reducing direct [ShowEstateTypeName('crown_estate')] authority in exchange for greater freedom to attract settlers and conduct trade."
 fortress_town: "Fortress Town"
 fortress_town_desc: "This [location|e] has been designated a military garrison, receiving investment in its fortifications and [manpower|e]. The permanent military presence crowds out civilian commerce."
 mining_charter: "Mining Charter"
 mining_charter_desc: "This [location|e] has been granted formal rights to conduct and expand mining operations, increasing the scale of extraction. The [ShowEstateTypeName('peasants_estate')] are subject to stricter obligations as a result."
 mining_charter_rgo_tt: "Has a mining [raw_material|e] or produces [ShowGoodsName('salt')] inland"
 studium_privileges: "Studium Privileges"
 studium_privileges_desc: "This [location|e] has been recognized as a center of learning, granting it the right to maintain schools and attract scholars. Such pursuits advance [literacy|e] and [institution|e] spread, though they rarely enrich the treasury directly."
 studium_privileges_rank_tt: "Location is a [ShowLocationRankName('city')] or [ShowLocationRankName('megalopolis')]"
 #######################################
 #   Production Rights    ##############
 #######################################
 royal_tooling_rights: "工艺装备专营"
 royal_tooling_rights_desc: "该[location|e]被授予了[ShowGoodsName('tools')]生产及销售的法定特许状，从而获得了巨大的同业竞争优势。"
 royal_jewelry_rights: "珠宝专营"
 royal_jewelry_rights_desc: "该[location|e]被授予了[ShowGoodsName('jewelry')]生产及销售的法定特许状，从而获得了巨大的同业竞争优势。"
 royal_weaponry_rights: "军械专营"
 royal_weaponry_rights_desc: "该[location|e]被授予了[ShowGoodsName('weaponry')]、[ShowGoodsName('firearms')]和[ShowGoodsName('cannons')]生产及销售的法定特许状，从而获得了巨大的同业竞争优势。"
 royal_book_rights: "刊物专营"
 royal_book_rights_desc: "该[location|e]被授予了[ShowGoodsName('paper')]、[ShowGoodsName('books')]和[ShowGoodsName('dyes')]生产及销售的法定特许状，从而获得了巨大的同业竞争优势。"
 royal_artisan_rights: "手工制品专营"
 royal_artisan_rights_desc: "该[location|e]被授予了[ShowGoodsName('leather')]、[ShowGoodsName('pottery')]和[ShowGoodsName('furniture')]生产及销售的法定特许状，从而获得了巨大的同业竞争优势。"
 royal_brewing_rights: "酿造品专营"
 royal_brewing_rights_desc: "该[location|e]被授予了[ShowGoodsName('liquor')]、[ShowGoodsName('beer')]和[ShowGoodsName('wine')]生产及销售的法定特许状，从而获得了巨大的同业竞争优势。"
 royal_textile_rights: "织造专营"
 royal_textile_rights_desc: "该[location|e]被授予了[ShowGoodsName('cloth')]和[ShowGoodsName('fine_cloth')]生产及销售的法定特许状，从而获得了巨大的同业竞争优势。"
 royal_naval_rights: "船用物资专营"
 royal_naval_rights_desc: "该[location|e]被授予了[ShowGoodsName('naval_supplies')]和[ShowGoodsName('tar')]生产及销售的法定特许状，从而获得了巨大的同业竞争优势。"
 not_forcefully_revoked_last_10_years_tt: "在过去10年间尚未强制撤销过一项城镇特权。"
 royal_masonry_rights: "建材专营"
 royal_masonry_rights_desc: "该[location|e]被授予了[ShowGoodsName('masonry')]和[ShowGoodsName('glass')]生产及销售的法定特许状，从而获得了巨大的同业竞争优势。"
 #######################################
 #   Historic Rights    ################
 #######################################
 magdeburg_rights_town_rights: "$magdeburg_rights$"
 magdeburg_rights_town_rights_desc: "$magdeburg_rights_desc$"
 unlock_mageburg_town_rights_tt: "解锁[ShowTownRightsName('magdeburg_rights_town_rights')]和[ShowTownRightsName('nuremberg_rights_town_rights')][town_rights]"
 lubeck_town_rights: "[ShowLocationNameWithNoTooltip('lubeck')]权利"
 lubeck_town_rights_desc: "依照[ShowLocationName('lubeck')]本城的律法与特权来规范我方城市的法律和特权，将使我方商人获得更大权力。此举虽能增强商人的贸易能力，但城内行会成员会对这类优待感到不满，并以各自方式阻挠我们。"
 town_rights_marketplace: "商贸市镇"
 nuremberg_rights_town_rights: "[ShowLocationNameWithNoTooltip('nuremberg')]特权"
 nuremberg_rights_town_rights_desc: "$magdeburg_rights_town_rights_desc$"
 upper_bergregal: "上位矿业权"
 upper_bergregal_desc: "将采矿运营权让渡给市镇当局，将扩充他们扩大采掘规模的可用资金，并增加勘探更多矿产，城镇对新移民的潜在吸引力也随之提升。遗憾的是，此举代价是对当地平民施加更严苛的限制，削弱他们从矿山中获益的能力。"
 upper_bergregal_raw_material_tt: "Produces [ShowGoodsName('silver')], [ShowGoodsName('goods_gold')], [ShowGoodsName('gems')], or inland [ShowGoodsName('salt')]"
 unlock_bergregal_rights_tt: "解锁[ShowTownRightsName ('upper_bergregal')]和[ShowTownRightsName('lower_bergregal')][town_rights]"
 lower_bergregal: "下位矿业权"
 lower_bergregal_desc: "$upper_bergregal_desc$"
 lower_bergregal_raw_material_tt: "Produces [ShowGoodsName('iron')], [ShowGoodsName('copper')], [ShowGoodsName('lead')], [ShowGoodsName('tin')], [ShowGoodsName('alum')], [ShowGoodsName('marble')], [ShowGoodsName('mercury')], [ShowGoodsName('coal')], [ShowGoodsName('stone')], or [ShowGoodsName('saltpeter')]"
 stapelrecht_town_rights: "[ShowSpecialStatusNameWithNoTooltip('free_city')]基本权利"
 stapelrecht_town_rights_desc: "[ShowSpecialStatusName('emperor')]授予我们的[ShowSpecialStatusName('free_city')]头衔赋予了我们在城市内行使某些特权的自由，本地商人从中受益，许多外国商人被迫穿越我们的土地进行贸易。"
 kulm_town_rights: "库尔姆城镇权"
 kulm_town_rights_desc: "$kulm_law_desc$"
 unlock_kulm_town_rights_tt: "解锁[ShowTownRightsName('kulm_town_rights')][town_rights]"
 novi_fori_town_rights: "新兴市镇权"
 novi_fori_town_rights_desc: "$novi_fori_desc$"
 unlock_novi_fori_rights_tt: "解锁[ShowTownRightsName('novi_fori_town_rights')][town_rights]"
 royal_free_cities_town_rights: "王室自由市特权"
 royal_free_cities_town_rights_desc: "通过宣布我们的城市中心为王室自由市，我们可以防止[ShowEstateTypeName('nobles_estate')]在城镇内积累权力。"
 bohemian_royal_cities_town_rights: "王室直辖市特权"
 bohemian_royal_cities_town_rights_desc: "赋予城市被宣布为统治者直辖领地的特权，将削弱[ShowEstateTypeName('nobles_estate')]，并有助于国家直接从这些城市获取更多利益。"
 swedish_city_rights: "贸易独占市镇权"
 swedish_city_rights_desc: "该地的商人将获得长期特权，使其贸易不受外国竞争干扰。"
 norwegian_city_rights: "市集市镇权"
 norwegian_city_rights_desc: "给予此地商人特权并予以优待，将强化我们自身的贸易路线，同时排挤外国商人。"
 borough_customals: "自治镇习惯法"
 borough_customals_desc: "被授予这些权利的地区将能够自主管理自身发展，并成为免受贵族压迫的自由港湾。"
 manorial_customals: "庄园惯例法"
 manorial_customals_desc: "赋予庄园土地持有者更多对该地的行政权力，将提高土地开发程度，并压制难以管束的农民。"
 foros_extensos_town_rights: "广域市镇权"
 foros_extensos_town_rights_desc: "自建立以来，$POR$始终是一片边境之地，居住着像杰拉尔多·森·帕沃尔这样声名显赫的人物。其统治者通过授予通常被称为$foros_extensos_town_rights$的广泛特权，以此激励这种勇敢与不屈的精神。"
 fuero_juzgo_town_rights: "司法法典"
 fuero_juzgo_town_rights_desc: "$fuero_juzgo_town_rights$基于#italic 古西哥特法典#!。因此，它规范了日常生活的诸多方面，使其特别适合新开拓的殖民地。"
 fuero_real_town_rights: "王室法典"
 fuero_real_town_rights_desc: "$fuero_real_town_rights$是卡斯蒂利亚国王阿方索十世制定的一部法典，旨在将王权扩展至$CAS$各市镇。"
 fuero_general_town_rights: "通用法典"
 fuero_general_town_rights_desc: "$NAV$的$fuero_general_town_rights$是一部该地习惯法与成文法的汇编，其内容与当地统治者达成了共识。"
 fuero_de_aragon_town_rights: "阿拉贡法典"
 fuero_de_aragon_town_rights_desc: "$fuero_de_aragon_town_rights$汇集了在$aragon_area$扩张期间遍布该地的各项市政权利。因此，这些权利受到$nobles_estate$和$peasants_estate$的坚决捍卫。"
 usatges_de_barcelona_town_rights: "巴塞罗那习惯法"
 usatges_de_barcelona_town_rights_desc: "$usatges_de_barcelona_town_rights$是治理$catalan$地区的习俗与传统，最初由$barcelona$伯爵颁布并授予。"
 furs_de_valencia_town_rights: "巴伦西亚法典"
 furs_de_valencia_town_rights_desc: "$furs_de_valencia_town_rights$由阿拉贡国王詹姆斯一世在征服后授予同名的王国。这些法令与$aragon_area$和$catalonia_area$旧有习俗的主要区别在于，其重点在于规范与$muslim_ADJ$群体的共处，而后者在某些地区占多数。"
 flemish_cloth_industries_right: "佛兰德毛纺"
 flemish_cloth_industries_right_desc: "中世纪晚期，低地国家崛起了实力雄厚的纺织产业。当地以进口自$ENG_ADJ$与$CAS_ADJ$的羊毛为原料，织造最高品级的呢绒面料，并出口至整个$europe$。"
 ville_franche_town_rights: "自由城镇权"
 ville_franche_town_rights_desc: "$villes_franches_desc$"
 unlock_ville_franche_town_rights_tt: "解锁[ShowTownRightsName('ville_franche_town_rights')][town_rights]"
 borgo_franco_town_rights: "自治城乡权"
 borgo_franco_town_rights_desc: "自治城乡在$italy_region$的广泛分布已成为现实，构成了该地区的支柱。这些#italic 自治城乡#!与乡村地区相比享有诸多特殊特权。"
 #######################################
 #   Scandinavian Rights    ############
 #######################################
 scandinavian_fishing_privileges: "渔业特许经营"
 scandinavian_fishing_privileges_desc: "该[location|e]被授予了周边渔场的专属捕捞权，以及干鱼、腌鱼的贸易专营权。此项特权被授予遍布挪威沿海的各处城镇，向整个北欧供应当地的[ShowGoodsName('fish')]制品。"
 scandinavian_bergslag_privileges: "矿业社区特许经营"
 scandinavian_bergslag_privileges_desc: "王室已认定该[location|e]为法定的矿业社区，授予该地对本地矿石开采的集体经营权、独立司法裁判权，以及免服兵役的特权。矿区内的[ShowEstateTypeName('peasants_estate')]，相较普通城镇民众拥有更高的法定地位。"
 scandinavian_tar_privileges: "松焦油特许经营"
 scandinavian_tar_privileges_desc: "该[location|e]已获得从王室所有的林地中采伐、提炼织造并出口[ShowGoodsName('tar')]和[ShowGoodsName('naval_supplies')]的专属经营权。这类林木产业是波罗的海造船供应链的核心支柱。"
 scandinavian_thing_rights: "庭会司法特许状"
 scandinavian_thing_rights_desc: "该[location|e]已获得庭会司法权，为当地居民赋予公认的地方治理与司法裁判议事平台。王室让渡了部分治理权，以换取地方秩序的稳定与民众的效忠。"
 #Byzantine / Greek / Roman
 imperial_breadbasket_rights: "帝国粮仓"
 imperial_breadbasket_rights_granary_tt: "拥有一座至少5级的[ShowBuildingTypeName('granary')]"
 imperial_breadbasket_rights_rank_tt: "Location is a [ShowLocationRankName('city')] or [ShowLocationRankName('megalopolis')]"
 imperial_breadbasket_rights_desc: "该[location|e]已被委以给整个国家提供补给的重任，其粮仓已扩建以满足我们宏大的计划。在帝国监管下，粮食源源不断地运入运出，充足地供给着民众与军队。"
 constantinopolitan_silk_monopoly_rights: "[ShowLocationNameWithNoTooltip('constantinople')]丝绸垄断"
 constantinopolitan_silk_monopoly_rights_tt: "Location is [ShowLocationName('constantinople')] with a fully expanded [raw_material|e]"
 constantinopolitan_silk_monopoly_rights_desc: "在[ShowLocationName('constantinople')]内，[ShowGoodsName('silk')]的生产保持着高标准，这一传统已延续数代。在帝国监管下，作坊蓬勃发展，但所有生产都遵循垄断的规则。"
 scholai_literacy_rights: "学术特权"
 scholai_literacy_rights_tt: "Dominant culture belongs to [ShowCultureGroupName('greek_group')] and local [literacy|e] does not exceed 125% of the country average"
 scholai_literacy_rights_desc: "该[location|e]被公认为学术中心，文学在此得到官方资助而得以发展。知识迅速传播，不过这类活动极少能充实国库。闲散的头脑是魔鬼的玩物。"
 municipia_privilegia: "自治市特权"
 municipia_privilegia_latin_tt: "Owner leans towards [ShowSocietyDirectionName('latinization')] or has [ShowLanguageName('latin_language')] as court or dominant language"
 municipia_privilegia_desc: "该[location|e]已被提升为自治市，其公民依我国法律享有相应权利。地方精英影响力扩大，使这片土地更紧密地融入[ShowSocietyDirectionName('latinization')]传统。"
 agrarian_community_town_right: "Charter of Religious Freedom"
 agrarian_community_town_right_desc: "This [location|e] has received special rights, recognizing the religious freedom of every individual person in exchange for providing large parts of its territory for the production of food and raw materials."
 agrarian_community_raw_material_tt: "Produces [ShowGoodsName('wheat')], [ShowGoodsName('maize')], [ShowGoodsName('rice')], [ShowGoodsName('millet')], [ShowGoodsName('legumes')], [ShowGoodsName('potato')], [ShowGoodsName('livestock')], [ShowGoodsName('olives')], [ShowGoodsName('fruit')], or [ShowGoodsName('beeswax')]"
 enlightened_leadership_reform_town_right: "Commoner Council Rights"
 enlightened_leadership_reform_town_right_desc: "This [location|e] has been granted the right to open their local council to commoners. This grants the peasantry a voice in local affairs and allows them to request greater rights for themselves."
