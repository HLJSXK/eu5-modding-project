 EXPEDITIONS_SUBTAB_COMPLETED_TT_FLAVOR_TEXT: "有些航程满载货物与海图归来，也有些航程归来时人数已大不如出发时，损失的远不止于此。"
 EXPEDITIONS_SUBTAB_COMPLETED_TT_TEXT: "我方已经完结的每一次 [expedition|e]，无论成败，连同其带来的结果。"
