 expedition_category_diplomatic: "外交"
 bermuda_test_expedition: "百慕大探险"
 bermuda_test_expedition_desc: "派遣探险队横渡大西洋，去发现百慕大群岛。"
 pilgrimage_expedition: "大朝圣"
 pilgrimage_expedition_desc: "我们的统治者将踏上前往[ShowReligionAdjective('catholic')]圣地——从[ShowRegionName('great_britain_region')]的海岸，到[ShowLocationName('jerusalem')]的圣墓——的朝圣之旅。"
 pilgrimage_expedition_historical_info: "从公元4世纪起，耶路撒冷便开始吸引基督教徒前来朝圣。彼时，君士坦丁大帝下令在耶稣基督受难、埋葬及复活的原址上修建了圣墓教堂。在十字军东征期间，这座城市几经易手：它于1099年被第一次十字军攻占，1187年被萨拉丁夺回，1229年通过腓特烈二世的谈判短暂收复，但最终落入了马穆鲁克的控制之下。然而，即便基督教失去了统治权，圣地的各个圣所依然通过外交协议对朝圣者保持开放。这使得耶路撒冷在整个中世纪，始终是天主教信仰最至高无上的朝圣地。"
 pilgrimage_expedition_outcome_overview: "$BULLET$我们的[ruler|e]每抵达一处[holy_site|e]便可获得奖励，从[legitimacy|e]、[prestige|e]到教士的感激。\n$BULLET$完成朝圣后，每到达一处圣地给予：\n$BULLET_WITH_TAB$#G +5#![legitimacy]\n$BULLET_WITH_TAB$[ShowEstateTypeName('clergy_estate')][estate_satisfaction|e]\n$BULLET_WITH_TAB$提高[GetCountry('PAP').GetName]的[opinion|e]"
 holy_site_pilgrimage: "前往圣地朝圣"
 holy_site_pilgrimage_desc: "我们的[ruler|e]动身前往一处选定的[holy_site|e]，去那里祈祷，让民众看到自己祈祷的模样，再带着这段旅程带来的声望和宗教影响力返程。需使用朝圣行动启程，而非探险界面。"
 holy_site_pilgrimage_outcome_overview: "$BULLET$抵达选择的[holy_site|e]会根据我们的[religion|e]给予奖励：\n$BULLET_WITH_TAB$#G +10#![religious_influence|e]、[purity|e]或[karma|e]，受圣地与我国首都的距离修正，最多#G +100#!\n$BULLET_WITH_TAB$[ShowReligionGroupAdjective('folk_peruvian_group')]宗教会根据[holy_site]的[god|e]的性质，改变#Y 20#!亚南廷\n$BULLET_WITH_TAB$符合条件的[ShowReligionGroupAdjective('muslim')]教派会向[ShowSocietyDirectionName('mysticism')]或[ShowSocietyDirectionName('jurisprudence')]改变#Y 10#!"
 pining_expedition: "皮宁远航"
 pining_expedition_desc: "从[ShowCultureName('danish')]的一处港口派出一支小型舰队，向西北驶入未知的大西洋，途经[ShowLocationName('shetland')]、[ShowAreaName('iceland_area')]、[ShowAreaName('greenland_area')]海岸上被废弃的诺斯人定居点，以及萨迦记载中更远处那片林木覆盖的海岸。如果船长们能带着亲眼见过那片西海岸的证据返航，王室就将掌握其他任何领地都不具备的北大西洋航线相关知识。"
 pining_expedition_historical_info: "迪德里克·皮宁是一位为丹麦王室效力的德裔私掠者。约1473年，丹麦的克里斯蒂安一世委托他率领一支船队穿越北大西洋向西航行。这次探险在当时并未被正式记录，其寥寥可考的细节主要来自后来提及此事的汉萨同盟书信，以及葡萄牙宇宙学家马丁·贝海姆的一段评述，称皮宁与他的同僚汉斯·波托斯特曾抵达格陵兰以西很远的一处海岸。这次航行之后，丹麦并未继续跟进，官方记录的沉默也引发了史学界关于这些船长究竟发现了什么（若真有发现的话）长达数百年的争论。"
 pining_expedition_outcome_overview: "$BULLET$一路上，每次初见陆地都会获得[prestige|e]。\n$BULLET$最终奖励取决于远航的距离：\n$BULLET_WITH_TAB$抵达[ShowAreaName('iceland_area')]：#G +5#!\n$BULLET_WITH_TAB$还抵达[ShowAreaName('greenland_area')]：#G +10#!\n$BULLET_WITH_TAB$继续前进至[ShowLocationName('gaspe')]：#G +20#!，还会为[GetCountry('DAN').GetName]永久解锁$western_ocean_voyage$探险"
 treasure_fleet: "宝船队"
 treasure_fleet_desc: "派出宝船队，前往选定的区域执行国事航行。船队沿着近海航道驶向目的地再返航，沿途停靠外国港口。这次航行将拓展宫廷的外交覆盖范围，向南洋的君主分发礼物和丝绸，收缴朝贡，最终带回珍稀货物、使节，以及那些听闻过中国帆影的君王的名录。"
 treasure_fleet_outcome_overview: "$BULLET$船队满载着国库支付的礼物启航。\n$BULLET$安全返回时，未使用的部分将成为[gold|e]，加上#G +10#![prestige|e]。\n$BULLET$每个外国宫廷会有不同反应：\n$BULLET_WITH_TAB$尽心招待我们的宫廷给予#G +5#![prestige]，可能作为朝贡国加入[GetUniqueInternationalOrganization('middle_kingdom').GetName]，并送出贡品和稀有礼物丰富我们的[market|e]。\n$BULLET_WITH_TAB$拒绝朝贡的宫廷与我们的[opinion|e]#R ‑50#!，获得[ShowModifier('chi_resisting_subjugation')]。"
 danish_india_expedition: "印度特许舰队"
 danish_india_expedition_desc: "派出丹麦东印度公司的特许船队向南沿非洲海岸航行，绕过好望角，穿越[ShowContinentName('indian_ocean_continent')]，抵达物产丰饶的$india$，以谋求贸易特许权。这段航程漫长，船队规模不大，但哪怕只在印度群岛建起一座设防商站，所能带来的回报也完全抵得上投入。"
 danish_india_expedition_historical_info: "#italic 丹麦东印度公司#!由克里斯蒂安四世于1616年授予特许状。其首支探险队在奥韦·盖德海军上将的率领下于1618年从哥本哈根启航。经过两年艰苦的航行，大部分船员因坏血病和疾病丧生，探险队最终抵达科罗曼德尔海岸，并与坦焦尔的纳亚克进行谈判，在塔兰甘巴迪村（后英语化为特兰奎巴）获得了贸易特许权。丹麦堡的设防商站于1620年完工，并一直属于丹麦，直到1845年该殖民地被出售给英国。这使得特兰奎巴成为印度历史上欧洲人控制时间最长的定居点之一。"
 danish_india_expedition_outcome_overview: "安全返回给予#G +10#![prestige|e]，沿途收集的每一批[ShowGoodsName('livestock')]、[ShowGoodsName('salt')]、[ShowGoodsName('goods_gold')]、[ShowGoodsName('ivory')]、[ShowGoodsName('coffee')]和[ShowGoodsName('pepper')]都会出售获取[gold|e]，并交付到我们首都的[market|e]。如果[ShowLocationName('karaikal')]的宫廷授予公司特许权，我们将在那里获得[ShowBuildingTypeName('trade_office')]。"
 el_dorado_expedition_outcome_overview: "$BULLET$搜索期间会持续增加[prestige|e]。\n$BULLET$结果取决于发现的线索数量：\n$BULLET_WITH_TAB$无：#R ‑10#![prestige]。\n$BULLET_WITH_TAB$至少一条：#G +10#![prestige]、[gold|e]和城市所在地的永久[ShowModifier('el_dorado_discovered')][location_modifier|e]。\n$BULLET_WITH_TAB$至少五条：#G +20#![prestige]和更多[gold]。\n$BULLET$沿途收集到的所有财富、异国商品和宝物都将运往我们的[market|e]，其中最精良的会成为[work_of_art|e]。"
 fountain_of_youth_expedition_outcome_overview: "$BULLET$搜索期间会持续增加[prestige|e]。\n$BULLET$结果取决于发现的线索数量：\n$BULLET_WITH_TAB$无：#R ‑5#![prestige]。\n$BULLET_WITH_TAB$至少一条：#G +10#![prestige]和永久[ShowModifier('fountain_of_youth_discovered')][location_modifier|e]。\n$BULLET_WITH_TAB$至少五条：#G +20#![prestige]。\n$BULLET$获得的水可以通过[ShowModifier('rejuvenating_waters_modifier')]延长我们的[ruler|e]和[heir|e]的寿命，一名土著治疗师可以作为新[character|e]加入我们的宫廷。"
 city_of_caesars_expedition_outcome_overview: "$BULLET$搜索期间会持续增加[prestige|e]。\n$BULLET$结果取决于发现的线索数量：\n$BULLET_WITH_TAB$无：#R ‑5#![prestige]。\n$BULLET_WITH_TAB$至少一条：#G +10#![prestige]、[gold|e]和城市所在地的永久[ShowModifier('city_of_caesars_discovered')][location_modifier|e]。\n$BULLET_WITH_TAB$至少四条：#G +20#![prestige]和更多[gold]。\n$BULLET$沿途收集到的所有财富都将运往我们的[market|e]，其中最精良的会成为[work_of_art|e]。"
 western_ocean_voyage: "向西航行"
 western_ocean_voyage_desc: "派出一支舰队向西驶入开阔的大西洋，寻找通往印度群岛的海上航线。没有任何海图能让我们预知[ShowAreaName('canary_islands_area')]之外的景象，我们能依靠的只有风、海水，以及祈祷这片海洋比学者们认定的更窄。"
 western_ocean_voyage_historical_info: "在第一次尝试向西航行之前的数十年里，欧洲学者就已经在辩论向西航行到达亚洲的可能性。当时的主要障碍并非地球的形状——受过教育的人都知道地球是球形的——而是其大小。大多数学者对地球大小的估算过于正确，认为海洋太大难以横渡。然而，最终证明他们错了的航行，并非通过推翻这一估算，而是因为在途中发现了意料之外的东西。"
 western_ocean_voyage_outcome_overview: "$BULLET$航行会绘制沿途所经远洋，揭露抵达的海岸。\n$BULLET$初见陆地获得：\n$BULLET_WITH_TAB$#G +10#![prestige|e]。\n$BULLET_WITH_TAB$#G +10#![legitimacy|e]。\n$BULLET_WITH_TAB$若发现美洲，再获得#G +20#![prestige]，并为未来殖民打开新大陆。"
 hajj_caravan: "朝觐"
 hajj_caravan_desc: "让我们的[ruler|e]启程前往麦加朝圣，完成伊斯兰教的五功之一。路途漫长，此行开销不菲，但从圣城归来的统治者，能获得任何军队都无法赋予的权威。"
 hajj_caravan_historical_info: "阿拔斯王朝的哈里发哈伦·拉希德在位期间（786–809年）曾九次从巴格达启程朝觐，甚至为了展现虔诚步行穿越部分路段。他的虔敬之举成为后世虔诚统治者竞相效仿的典范。"
 hajj_caravan_outcome_overview: "$BULLET$抵达[ShowLocationName('mecca')]将为队伍带来最高如下的荣光：\n$BULLET_WITH_TAB$#G +20#![prestige|e]。\n$BULLET_WITH_TAB$#G +20#![religious_influence|e]。\n$BULLET$返回家乡再给予：\n$BULLET_WITH_TAB$#G +10#![legitimacy|e]。\n$BULLET_WITH_TAB$5年[ShowModifier('hajj_pious_return')][modifier|e]。\n$BULLET_WITH_TAB$永久的[ShowModifier('hajji_pilgrim')]荣耀，仅限[ruler|e]的第一次朝觐。\n$BULLET$队伍必须在出发后同年抵达[ShowLocationNameWithNoTooltip('mecca')]，否则朝圣会彻底失败。"
 circumnavigation_expedition: "环球航行"
 circumnavigation_expedition_desc: "派出一支舰队向西出发完成环球航行：向南驶过拉普拉塔河，穿过大地尽头的海峡，越过一片尚无名称的大洋，抵达香料群岛，再绕过好望角返航。此前没有任何舰队完成过这件事，也没人能确定这件事真的能做成。"
 circumnavigation_expedition_historical_info: "1519年9月，斐迪南·麦哲伦与西班牙王室签订合同，从桑卢卡尔‑德巴拉梅达出发，寻找一条通往香料群岛的西行航线。此次远航由五艘船组成：#italic 特立尼达号#!、#italic 圣安东尼奥号#!、#italic 康塞普西翁号#!、#italic 维多利亚号#!和#italic 圣地亚哥号#!。麦哲伦是一名葡萄牙航海家，在为葡萄牙服务期间曾航行至印度和摩鹿加群岛，后在曼努埃尔一世拒绝为其涨薪后，转而效忠西班牙王室。这次航行将成为人类历史上首次环球航行，尽管麦哲伦本人未能活着看到它的完成。"
 circumnavigation_expedition_outcome_overview: "$BULLET$第一个完成环球航行的国家获得：\n$BULLET_WITH_TAB$#G +100#![prestige|e]\n$BULLET_WITH_TAB$#G +10#![legitimacy|e]\n$BULLET_WITH_TAB$[ShowModifier('first_circumnavigation')][modifier|e]\n$BULLET$任意完成者也会获得：\n$BULLET_WITH_TAB$#G +10#! [prestige]\n$BULLET_WITH_TAB$至少三艘船返乡进一步#G +10#!\n$BULLET_WITH_TAB$一名精神良好的船员#G +5#!\n$BULLET_WITH_TAB$在[ShowAreaName('moluccas_area')]收集的[ShowGoodsName('cloves')]以市场价出售获得[gold|e]"
 cape_route_to_india: "印度好望角航路"
 cape_route_to_india_desc: "派出一支舰队沿着非洲海岸向南航行，绕过巨大的南部海角，开辟出一条通往香料群岛的海路，绕开所有奥斯曼帝国的关卡和威尼斯中间商。这条航线十分凶险，两年的航程里全是开阔洋面、未知海岸和能吹散船队的风暴，但第一个打通这条航线的国家，将掌控全世界的香料贸易。"
 cape_route_to_india_historical_info: "葡萄牙人寻找通往$india$的海路的探险，是近一个世纪以来沿非洲海岸逐步向南探索的巅峰。1488年，巴尔托洛梅乌·迪亚士绕过好望角，证明了这条路线的可行性。瓦斯科·达伽马在1497年至1499年的航行完成了这一使命，返航时带回的胡椒和香料之多，足以支付六十次此次探险的费用。这次航行从根本上改变了全球香料贸易，打破了威尼斯和奥斯曼帝国对陆路贸易路线的垄断。"
 cape_route_to_india_outcome_overview: "$BULLET$沿非洲海岸的每一次停留可建造一座[ShowBuildingTypeName('por_feitoria')]；若港口无人占据，则可建造一座[ShowBuildingTypeName('por_trading_post')]并直接占领该[location|e]，每座建筑都会附带一项持久的贸易[modifier|e]。\n$BULLET$抵达[ShowLocationName('kozhikode')]可获得[ShowModifier('calicut_trade_rights')]及一批可以市场价格出售获取[gold|e]的[ShowGoodsName('pepper')]。\n$BULLET$完成航路后额外获得：\n$BULLET_WITH_TAB$#G +20#![prestige|e]。\n$BULLET_WITH_TAB$#G +10#![legitimacy|e]。\n$BULLET_WITH_TAB$永久[ShowModifier('cape_route_pioneer')][modifier]；若建成三座或五座商站，则改为获得[ShowModifier('portuguese_african_network')]或[ShowModifier('east_africa_trade_dominance')]。"
 grand_tour: "壮游之地"
 grand_tour_desc: "我们的继承人将启程前往[ShowRegionName('italy_region')]的各大名城——途经[ShowLocationName('florence')]、[ShowLocationName('rome')]、[ShowLocationName('venice')]和[ShowLocationName('naples')]——在[ShowInstitutionName('renaissance')]的熏陶下求学。归来的继承人将不再是当初出发的那个人。他学到的一切知识，以及师从何人，都将塑造他日后登上君位时所具备的品性。"
 grand_tour_historical_info: "大游学——即欧洲年轻贵族前往意大利长期游学——在十五和十六世纪逐渐兴起，到十七世纪已成为北欧贵族中的一种正式制度。佛罗伦萨、罗马、威尼斯和那不勒斯形成了经典的巡游路线，每座城市都能提供北方宫廷所缺乏的东西：人文主义学术、古典遗迹、文艺复兴赞助艺术以及欧洲最古老宫廷的礼仪。参与者在归来时往往脱胎换骨，具备国内导师无法培养的治国与外交才能。"
 grand_tour_outcome_overview: "$BULLET$每访问一座城市，都会提升我们[heir|e]的[ability|e]，并根据花费在学习的时间获得[research_progress|e]或花费在宫廷的时间获得[legitimacy|e]。\n$BULLET$若至少访问[ShowRegionName('italy_region')]的三座主要城市，则额外获得：\n$BULLET_WITH_TAB$根据所做出的选择，获得[ShowTraitName('free_thinker')]或[ShowTraitName('well_connected')]特质。\n$BULLET_WITH_TAB$永久[ShowModifier('returned_from_grand_tour')][modifier|e]。\n$BULLET_WITH_TAB$#G +10#![prestige|e]。\n$BULLET$较短的旅程则仅获得#G +5#! [prestige]，且不获得任何[trait|e]。"
 steppe_embassy: "前往大草原宫廷的使者"
 steppe_embassy_desc: "派我们的统治者前往伟大的[ShowCultureGroupName('mongolian_group')]诸继承国家执行外交使命。路途遥远，风俗迥异，而$rank_kingdom_horde_ruler_suffix_male$不会容忍糟糕的第一印象。带着礼物、带着实力或是带着学识前来都可以。如果空手而来，你也只会空手而归。"
 steppe_embassy_historical_info: "在整个14世纪，与蒙古继业国家建立直接外交接触，一直是欧洲和中东统治者反复出现的野心。西方派往伊尔汗国、金帐汗国及其他汗国的使团，从豪华的礼仪性访问到实际的贸易冒险，形式多样，每一种都取决于派遣方希望获取什么。"
 steppe_embassy_outcome_overview: "$BULLET$抵达宫廷可获得[ShowModifier('led_steppe_embassy')]。\n$BULLET$接下来采取的行动将决定奖励，每项#G +10#! [prestige|e]：\n$BULLET_WITH_TAB$武力展示可获得[ShowModifier('steppe_recognised_military')]。\n$BULLET_WITH_TAB$慷慨赠礼可获得[ShowModifier('steppe_contact_established')]。\n$BULLET_WITH_TAB$贸易提议可获得[ShowModifier('steppe_trade_agreement')]及一项持久的贸易协定，使我们的商人免除通行费与保护费。\n$BULLET$途中收集的情报可确保同时获得两项奖励。\n$BULLET$[ShowLocationName('samarkand')]宫廷提供[research_progress|e]，若[ruler|e]拥有[ShowTraitName('scholar')]特质则翻倍。"
 eastern_alliance_embassy: "东向求援使团"
 eastern_alliance_embassy_desc: "向[ShowReligionGroupAdjective('muslim')]世界之外的宫廷派出一支长途使团，前往[ShowRegionName('persia_region')]的$rank_kingdom_persian_ruler_male$，或是[ShowRegionName('ethiopia_region')]高地的$rank_kingdom_ethiopia_ruler_male$。使团的路线途经[ShowLocationName('hormuz')]或[ShowLocationName('alexandria')]，穿过能将商队整个吞没的沙漠，最终抵达的宫廷，哪怕只是名义上的结盟，也能让我们的敌人害怕陷入两线作战。"
 eastern_alliance_embassy_historical_info: "向波斯和埃塞俄比亚宫廷直接派遣使节，一直是基督教欧洲反复出现的野心。白羊王朝的乌宗·哈桑在1460年代曾派使节前往威尼斯，希望联手对抗奥斯曼人；葡萄牙使团则在16世纪初抵达了勒布纳·登格尔的埃塞俄比亚宫廷。这些路途极为遥远，外交礼仪完全不同于欧洲规范，而最终结果几乎总是难以实现双方的期望。"
 eastern_alliance_embassy_outcome_overview: "$BULLET$抵达宫廷可获得[ShowModifier('led_eastern_alliance_embassy')]，并使我们两国之间的[opinion|e]提升#G +30#!。\n$BULLET$接下来采取的行动将决定奖励，每项#G +10#![prestige|e]：\n$BULLET_WITH_TAB$军事诉求可获得[ShowModifier('eastern_alliance_persia')]，若在[ShowRegionName('ethiopia_region')]，则获得[ShowModifier('eastern_alliance_ethiopia')]及直接的[alliance|e]。\n$BULLET_WITH_TAB$贸易诉求可获得[ShowModifier('eastern_route_open')]。\n$BULLET$事先收集的情报可确保同时获得两项奖励。"
 grand_embassy: "大使团"
 grand_embassy_desc: "让统治者踏上巡回外交之旅，走访西欧各国宫廷——寻求与各大国改善关系，研究那些新近完成近代化的国家的制度、陆军与海军，最终带回来的收获，远不止一份盖着蜡封的条约。"
 grand_embassy_outcome_overview: "$BULLET$受到热情招待的使团将教授我们以下内容其一（由接待方选择），并且可以前往其他宫廷学习另一课：\n$BULLET_WITH_TAB$#G +5#!、#G +15#!或#G +25#![institutions|e]进展（适用于我们人口最多的城市）。\n$BULLET_WITH_TAB$#G +1#!、#G +3#!或#G +5#![army_tradition|e]或[navy_tradition|e]。\n$BULLET$拒绝我们的宫廷会自取其辱，而羞辱我们的宫廷则会为我们提供对其的[casus_belli|e]。"
 arctic_passage_nw: "寻找西北航道"
 arctic_passage_nw_desc: "派遣一支舰队向北和向西穿过美洲上方冰封的水域，寻找通往亚洲的海路。这条航道，如果存在的话，将穿过大陆北方的冰冻群岛，穿越浮冰、永冬的黑暗和没有海图记载的海域。没有探险队找到过它。但那并不意味着它不存在。"
 arctic_passage_nw_historical_info: "在整个十六世纪，英国、荷兰和斯堪的纳维亚的航海家们一直致力于寻找通往亚洲的北方海路。西北航道直到1903至1906年罗尔德·阿蒙森的探险才成功开通；东北航道则最早由阿道夫·诺登舍尔德在1878至1879年完成首航。与南方航线相比，这两条航路在商业上都不太实用，但这些航行绘制出了一些最详细的早期北极地图，并开启了远北地区的皮毛和捕鲸贸易。"
 arctic_passage_nw_outcome_overview: "$BULLET$航行会沿途绘制冰封群岛地图，每到达一处地标便获得[prestige|e]\n$BULLET$打通通往[ShowLocationName('hudson_bay1')]的西北航道获得：\n$BULLET_WITH_TAB$#G +20#![prestige]\n$BULLET_WITH_TAB$#G +10#![legitimacy|e]\n$BULLET_WITH_TAB$30年的[ShowModifier('northwest_passage_found')][modifier|e]\n$BULLET$提前折返仍可获得#G +5#![prestige]和为期5年的[ShowModifier('arctic_expedition_returned')][modifier]"
 pacific_crossing: "寻找复航之路"
 pacific_crossing_desc: "从我们位于美洲的太平洋海岸派出一支舰队，寻找#italic 马尼拉大帆船返航航线#!——一条能横跨地球上最大的大洋的可靠返程路线。信风很容易就能把船向西吹到亚洲；顶着信风返航的所有尝试都失败了，在返程航线被测绘出来之前，我们的殖民地和香料群岛的财富都遥不可及。第一个找到这条返程路线的国家，将把美洲和亚洲联结起来，打通横跨太平洋的大帆船贸易。"
 pacific_crossing_historical_info: "向东的#italic 复航之路#!是早期太平洋航行中一直未能解决的重大难题。1528年和1529年，从新西班牙出发的阿尔瓦罗·德·萨韦德拉两次被信风所阻，被迫折返，最终在尝试中丧生；1542年，鲁伊·洛佩斯·德·比利亚洛沃斯的探险队同样抵达了亚洲，却找不到返航路线。直到1565年，一条可靠的返航路线才被发现。在此之前，一支舰队可以抵达亚洲，却永远无法将货物运回。"
 pacific_crossing_outcome_overview: "$BULLET$绘制横跨[ShowContinentName('pacific_ocean_continent')]的返航路线可获得：\n$BULLET_WITH_TAB$#G +100#![prestige|e]。\n$BULLET_WITH_TAB$#G +15#![legitimacy|e]。\n$BULLET_WITH_TAB$永久[ShowModifier('manila_galleon_route')][modifier|e]。\n$BULLET_WITH_TAB$在[ShowAreaName('moluccas_area')]收集的[ShowGoodsName('cloves')]，按市场价格出售换取[gold|e]。\n$BULLET_WITH_TAB$永久解锁[ShowDecisionName('charter_manila_galleon')][decision|e]，此后每五年可再次执行，以获得可观的[gold]回报。\n$BULLET$未能找到返航路线的舰队则一无所获。"
 gold_fleet_tierra_firme: "大陆舰队"
 gold_fleet_tierra_firme_desc: "从我们条件最好的本土港口派出一支盖伦帆船船队，前往我们在新格拉纳达和地峡的领地，收缴白银、宝石和兽皮。这支大陆舰队是西班牙殖民帝国的命脉，它把印度群岛的财富运往塞维利亚的各个市场。"
 gold_fleet_tierra_firme_historical_info: "#italic 大陆舰队#!是执行西班牙#italic 印度群岛航行#!的两支护航舰队之一。大陆舰队服务于南美洲的总督辖区，通过波托韦洛和卡塔赫纳港口，收集上秘鲁波托西银矿及其他殖民地的财政收入。白银在装船之前，需从太平洋海岸经巴拿马地峡陆路运输。腓力二世于1566年正式确立了护航舰队制度，要求所有贸易须由武装舰队运输，并经由塞维利亚的#italic 贸易厅#!办理手续，该机构负责征收王室的#italic 皇家五分之一税#!——即从新大陆开采的所有贵金属的五分之一。"
 gold_fleet_tierra_firme_outcome_overview: "船队装载我国殖民地的[ShowGoodsName('silver')]和[ShowGoodsName('goods_gold')]，运回国内换取[gold|e]，抵达时获得#G +10#![prestige|e]。装载[ShowGoodsName('gems')]、[ShowGoodsName('pearls')]或骡队可进一步增加货物，但也会引来更多注意；在[ShowScriptedGeographyName('island_of_cuba_geography')]与$gold_fleet_nueva_espana$会合可获得#G +10#![prestige]并使航程更加安全。风暴与劫掠者可能夺走部分货物，在最坏的情况下可能全部损失。"
 gold_fleet_nueva_espana: "新西班牙舰队"
 gold_fleet_nueva_espana_desc: "从我们条件最好的本土港口派出新西班牙船队，前往我们在中美洲的领地，收缴白银和珍贵染料。船队经由莫纳海峡驶入加勒比海，之后在哈瓦那集结，准备穿越大西洋。"
 gold_fleet_nueva_espana_historical_info: "#italic 新西班牙舰队#!是执行西班牙#italic 印度群岛航行#!的两支护航舰队之一。它服务于新西班牙总督辖区，通过韦拉克鲁斯附近的圣胡安‑德乌卢阿港，收集来自萨卡特卡斯、瓜纳华托及其他墨西哥矿区的白银，以及瓦哈卡的胭脂虫染料、靛蓝、香草和可可等高价值商品。该#italic 舰队#!通常在春季从西班牙启航，秋季返回，并在哈瓦那与大陆舰队会合，共同横渡大西洋。穿越伊斯帕尼奥拉岛与波多黎各之间的莫纳海峡的路线，是进入东加勒比海的标准航线。"
 gold_fleet_nueva_espana_outcome_overview: "船队装载我国殖民地的[ShowGoodsName('silver')]和[ShowGoodsName('goods_gold')]，运回国内换取[gold|e]，抵达时获得#G +10#![prestige|e]。护送银车或装载[ShowGoodsName('lumber')]可进一步增加货物，但也会引来更多注意；在[ShowScriptedGeographyName('island_of_cuba_geography')]与$gold_fleet_tierra_firme$会合可获得#G +10#![prestige]并使航程更加安全。风暴与劫掠者可能夺走部分货物，在最坏的情况下可能全部损失。"
 cartographic_survey: "沿海勘测"
 cartographic_survey_desc: "派出一艘勘测船沿着我们的海岸线航行，测绘沿岸港口，测量浅滩水深，标记航行危险点。这项工作并不起眼，但最终绘出的海图能沿用一代人的时间，此后每一次远征的筹备，都会因为这些海图而成本更低、速度更快。"
 cartographic_survey_historical_info: "系统的海岸测绘在16世纪开始真正兴起，海上贸易量的不断增长使准确的海图成为国家利益攸关之事。塞维利亚的#italic 贸易厅#!和葡萄牙的#italic 几内亚与印度贸易署#!都设有官方制图师，负责制作和更新海图；荷兰海军部也在17世纪效仿了这一做法。"
 cartographic_survey_outcome_overview: "$BULLET$每勘测一座[port|e]，可获得持续10至20年的[location_modifier|e]，提高其数种商品（如[ShowGoodsName('fish')]、[ShowGoodsName('pearls')]或[ShowGoodsName('amber')]）之一的产出，或改善港口本身，并额外获得[prestige|e]。\n$BULLET$勘测三座或以上港口，还将额外获得：\n$BULLET_WITH_TAB$为期15年的[ShowModifier('accurate_charts')][modifier|e]。\n$BULLET_WITH_TAB$#G +10#![prestige]。\n$BULLET$勘测不足三座则仅获得#G +5#![prestige]。"
 mining_survey: "高地勘探"
 mining_survey_desc: "派出一队探矿者和化验师进入我们的高地地区，沿着河床行走，敲打露出地表的岩层，检测岩石里的贵金属含量。这些山丘此前就产出过财富，一名老矿工辛苦积累的经验，抵得上宫廷里一整年的凭空猜测。"
 mining_survey_historical_info: "系统勘探在中世纪和近代早期的欧洲十分普遍，其中最著名的是萨克森和波希米亚的厄尔士山脉。12世纪银矿脉的发现，催生了弗赖贝格、亚希莫夫和施内贝格等新兴城镇。格奥尔格·阿格里科拉的#italic 《论矿冶》#!（1556年）成为该领域的标准教科书，详细描述了寻矿杖的使用、在小坩埚中测试金矿石样品的方法以及规范采矿权申领的法律惯例。"
 mining_survey_outcome_overview: "$BULLET$每次勘探都会获得为期20年的[ShowModifier('thorough_survey')][modifier|e]，提高全国的原材料产出。\n$BULLET$每次发现矿脉还会获得富矿，如[ShowModifier('rich_silver_vein')]或[ShowModifier('rich_gold_strike')]，可选择公开开采以获得[prestige|e]，或秘密开采以获得[gold|e]。\n$BULLET$此外还可获得：\n$BULLET_WITH_TAB$发现两处及以上矿脉时，获得#G +10#![prestige]。\n$BULLET_WITH_TAB$每勘探一处高地，获得#G +5#!。"
 relic_expedition: "圣物使团"
 relic_expedition_desc: "派遣使团前往一个持有基督教重要圣物的[ShowReligionGroupAdjective('christian')]政权。使团要通过馈赠、购买或私下协商的方式，拿到一支军队无法直接强取的东西。如今世上仍有三件这类圣物可供争取：[ShowLocationName('jerusalem')]的真十字架、[ShowLocationName('paris')]的荆冠，以及[ShowLocationName('antioch')]的圣枪。第一个将其中一件带回本国的国家，将独占这份殊荣。"
 relic_expedition_historical_info: "中世纪和近代早期的圣物贸易规模相当可观。天主教与东正教社群竞相争夺最珍贵的圣物；数百年间，通过买卖、交换乃至公然盗窃，圣物流转于整个基督教世界。法国国王路易九世于1238年从拉丁帝国皇帝鲍德温二世手中购得荆棘冠冕，并在巴黎修建圣礼拜堂供奉——这一举措既是虔敬之举，亦是国策的体现。"
 relic_expedition_outcome_overview: "$BULLET$无论以哪件圣物为目标，只有第一个获取它的国家能分别获得[ShowModifier('relic_true_cross')]、[ShowModifier('relic_crown_of_thorns')]或[ShowModifier('relic_holy_lance')][modifier|e]。\n$BULLET$公开购买需花费[gold|e]，并获得#G +10#![prestige|e]。\n$BULLET$秘密获取则获得相同的[modifier]，但不获得[prestige]。"
 gold_fleet_tierra_firme_expedition_special: "船上货物：[EXPEDITION.GetVariable('gold_fleet_cargo')|0]杜卡特"
