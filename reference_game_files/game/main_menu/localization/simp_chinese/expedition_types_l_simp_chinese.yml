 cape_route_to_india_expedition: "通往印度的好望角航线"
 cape_route_to_india_expedition_desc: "派遣船队沿非洲海岸南下，绕过南方巨大的海角，开辟一条通往香料群岛的海上航道，绕过奥斯曼的关卡与威尼斯的中间商。这条航线极为凶险——两年的远洋航行，未知的海岸线，以及足以令船队四散的风暴，但率先开辟此路的国家，将掌控全世界的香料贸易。"
 cape_route_to_india_expedition_high_morale_prestige_tt: "船员士气高涨会增加获得的威望"
 cape_route_to_india_expedition_historical_info: "葡萄牙人寻找通往 $india$ 的海路的远征，是近一个世纪以来沿非洲海岸逐步向南探索的顶点。巴尔托洛梅乌·迪亚士于1488年绕过好望角，证明了这条航线的可行性。瓦斯科·达·伽马于1497至1499年间完成的航行最终达成了这一使命，带回了足以偿付此次远征成本六十倍之多的胡椒与香料。这次航行从根本上改变了全球香料贸易，打破了威尼斯与奥斯曼帝国对陆路贸易的垄断。"
 cape_route_to_india_expedition_low_morale_prestige_tt: "船员士气低落会减少获得的威望"
 cargo: "货物"
 cargo_desc: "航行途中装载的货物，将在船队归航时于市场出售。"
 cartographic_survey_cooldown: "沿海测绘"
 cartographic_survey_expedition: "沿海测绘"
 cartographic_survey_expedition_desc: "派遣一艘测绘船沿本国海岸线航行，测绘港湾、测量浅滩水深，并标出险区。这项工作毫不起眼，但绘制出的海图能沿用一代人之久，未来的每一次远征也将因此变得更省钱、更快捷。"
 cartographic_survey_expedition_historical_info: "系统性的沿海测绘始于十六世纪，当时海上贸易量的增长使精确海图成为国家关注之事。塞维利亚的#italic贸易署#!与葡萄牙的#italic几内亚及印度仓库署#!都设有官方制图师，专司海图的编制与更新，十七世纪荷兰各海军部亦相继效仿。"
 circumnavigation_expedition_high_morale_prestige_tt: "船员士气高昂会增加获得的威望"
 circumnavigation_expedition_low_morale_prestige_tt: "船员士气低落会减少获得的威望"
 clues: "线索"
 clues_desc: "远征队距离确切追踪到圣物踪迹还有多远。始于一则传闻，随着每条线索的追查而增减。一旦彻底耗尽，搜寻或将被迫中止。"
 completed_expedition_name_text_filter_desc: "按名称筛选已结束的 [expeditions|e]。"
 completed_expedition_name_text_filter_name: "按远征名称搜索"
 connections: "人脉"
 connections_desc: "在巡访途中各国宫廷所建立的关系。若继承人结束巡游时，人脉高于其他一切属性，则会获得 [ShowTraitName('well_connected')] 特质归来。"
 custom_search_filter_expedition_category_name: "远征类型"
 discretion: "隐秘度"
 discretion_desc: "代表团的真实目的与统治者的身份不为外界察觉的程度。高于90时，宫廷会将代表团视为寻常使节，无人生疑。低于或等于90时，东道主已察觉到真正随行其中之人的身份，或出于简单的怀疑，或凭借他们自己的间谍网络。"
 expedition_name_text_filter_desc: "按其名称筛选 [expeditions|e]。"
 expedition_name_text_filter_name: "按远征名称搜索"
 experience_desc: "巡游途中获得的实践历练——工坊、港口与账房中的亲身见闻。若继承人结束巡游时，阅历高于其他一切属性，则会获得 [ShowTraitName('worldly')] 特质归来。"
 grand_embassy_expedition: "大使团出访"
 grand_embassy_expedition_desc: "让统治者隐姓埋名，游历西欧各国宫廷，考察那些已然实现现代化的国家的制度、军队与海军。若代表团被宣称为王室之列，只能收获宴飨与虚礼客套；若能低调行事，便可深入真正的船坞与制图室之中。然而消息终究会传开，一旦统治者的身份过早暴露，大门便会随之紧闭。"
 grand_embassy_expedition_institution_spread_tt: "在所有尚未拥有该制度的领地中，将所选制度的进度提升 [GetVariable('grand_embassy_institution_progress_amount')|V0] 点，在首都则提升 [GetVariable('grand_embassy_institution_progress_capital_amount')|V0] 点"
 grand_embassy_expedition_stalled_status: "学习中"
 grand_tour_expedition_desc: "我们的继承人将踏上一段漫长的旅程，游历[ShowRegionName('italy_region')]的诸座名城——[ShowLocationName('florence')]、[ShowLocationName('rome')]、[ShowLocationName('venice')]与[ShowLocationName('naples')]——在[ShowInstitutionName('renaissance')]的发源之地求学。归来的继承人，已非当初离去时的模样。所学之事、所从之师，都将塑造未来登上王位之人的品性。"
 grand_tour_expedition_historical_info: "壮游，即将年轻的欧洲贵族送往意大利进行长期教育旅行的做法，在十五、十六世纪逐渐兴起，到十七世纪已在北欧贵族中成为一种正式的传统。佛罗伦萨、罗马、威尼斯与那不勒斯构成了经典的巡游路线，各自提供了北方宫廷所欠缺的东西：人文主义学识、古典文明遗风、文艺复兴时期的赞助艺术，以及欧洲最古老王室的礼仪。参与者被期望脱胎换骨归来，具备国内教师无法给予的治国与外交才能。"
 gt_diligence: "勤勉"
 gt_diligence_desc: "继承人在壮游中学习的天赋，取决于其出发时的 [ability|e] 数值。继承人越是勤勉，从旅途中所能领悟的也就越多。"
 guards: "护卫队"
 guards_desc: "商队的武装护卫。可通过雇佣护卫或沿途携带 #italic maḥmal #! 圣轿来提升，也会因劫掠与艰险而损耗。护卫充足的商队更有可能在袭击中幸存。"
 hajj_caravan_cooldown: "王室朝觐"
 hajj_caravan_expedition: "王室朝觐"
 hajj_caravan_expedition_desc: "派遣我们的统治者前往 [ShowLocationName('mecca')] 朝觐，完成伊斯兰教五功之一。此路漫长，耗资甚巨，但一位从圣城归来的统治者，将获得任何军队都无法赋予的权威。"
 hajj_caravan_expedition_historical_info: "阿拔斯王朝哈里发哈伦·拉希德在位期间（786-809年）九次从巴格达出发朝觐，甚至曾徒步走完部分路程以示虔诚，他的这份虔诚此后数百年间成为虔诚统治者竞相效仿的典范。"
 holy_site_pilgrimage_cooldown: "朝圣圣地"
 holy_site_pilgrimage_expedition: "朝圣圣地"
 holy_site_pilgrimage_expedition_desc: "我们的统治者启程前往一处选定的圣地,祈祷,并让世人看见其祈祷,归来时将带回此行所得的威望与宗教货币。此远征由朝圣行动发起,而非远征概览面板。"
 holy_site_pilgrimage_expedition_order_zeal_tt: "多年以后,朝圣者在此地表现出的虔诚将激起守护此地的教团的热忱"
 hunt_retinue: "随从"
 hunt_retinue_desc: "远征队的护卫、译员与随行学者。此项不会自行损耗，但一旦完全耗尽，远征队便会溃散，搜寻随之失败。"
 knowledge: "知识"
 knowledge_desc: "在壮游途中通过理论研习——图书馆、讲座与学者的陪伴——所获得的学识。若继承人结束壮游时知识胜过其他一切，归来后将获得 [ShowTraitName('free_thinker')]。"
 mining_survey_cooldown: "高地勘探测绘"
 mining_survey_expedition: "高地勘探测绘"
 mining_survey_expedition_desc: "派遣一队勘探员与化验师深入我国高地，踏勘河床、敲击露岩，检验岩石中是否含有贵金属。群山曾数度献出其财富，一位老矿工来之不易的经验，胜过朝廷一年的空谈猜测。"
 mining_survey_expedition_historical_info: "系统性的勘探活动在中世纪及近代早期的欧洲各地皆有实践，其中最著名的莫过于萨克森与波希米亚交界的厄尔士山脉，十二世纪银矿脉的发现使弗赖贝格、雅希莫夫与施内贝格等城镇因此兴盛。乔治·阿格里科拉所著的 #italic De re metallica #! （1556年）成为该行业的标准教科书，书中详细描述了探矿杖的使用、在小坩埚中化验矿样的方法，以及有关矿权划界的法律习惯。"
 modernization_desc: "代表团吸收西方方法所积累的进度。每学到一课便有所增益，统治者带回的越多，大使团结束后所获的回报也就越丰厚。"
 morale: "船员士气"
 morale_desc: "船员的精神状态。士气低落有哗变的风险。"
 num_ships_desc: "仍随舰队航行的船只。若一艘不剩，此次远征即宣告失败。"
 opportunities: "机遇"
 opportunities_desc: "代表团获准在这一宫廷学习的程度。每到一处便重新设定，取决于统治者选择以何种公开程度示人。"
 pacific_crossing_expedition: "寻找回航航线"
 pacific_crossing_expedition_desc: "从我方在美洲的太平洋沿岸派出一支舰队，寻找 #italic 回航航线 #! ——一条横渡这颗星球上最浩瀚海洋的可靠归途。信风足以轻易将船只送往亚洲；但逆风归航却屡试屡败，在归途航线绘制成图之前，我们的殖民地与香料群岛的财富仍遥不可及。第一个找到归途的国家，将把美洲与亚洲连结起来，开启横跨太平洋的大帆船贸易。"
 pacific_crossing_expedition_high_morale_prestige_tt: "船员士气高昂会增加获得的威望"
 pacific_crossing_expedition_historical_info: "东归航线——即 #italic 回航航线 #! ——是早期太平洋航行中悬而未决的一大难题。阿尔瓦罗·德·萨维德拉自新西班牙出航，于1528年与1529年两度被信风逼退，并最终命丧此途；鲁伊·洛佩兹·德·维拉洛沃斯于1542年率领的远征队同样抵达了亚洲，却始终找不到归路。直至1565年，才终于发现了一条可靠的回航航线，在此之前，舰队虽能抵达亚洲，却始终无法将货物运回。"
 pacific_crossing_expedition_low_morale_prestige_tt: "船员士气低落会减少获得的威望"
 piety_desc: "衡量朝圣进行得有多虔诚。旅途中会逐渐消退,并因途中的世俗抉择而被消耗。若彻底耗尽,朝圣将以耻辱告终;若保持高位,则会放大朝圣最终获得的奖励。"
 provisions: "补给"
 provisions_desc: "航行途中所需的食物与淡水。行进中持续消耗，一旦耗尽将危及全体船员。"
 relic_expedition_cooldown: "圣物之猎"
 retinue: "随行"
 retinue_desc: "朝圣统治者的护卫队。不会自行损耗,只会因路途中的不幸而减少。若彻底损失殆尽,统治者将陷入极度危险的境地,朝圣也随之失败。"
 splendor_desc: "商队装备与装饰的奢华程度。可通过挥金如土与炫耀财富来提升，也会因风暴与旅途艰险而降低。决定商队抵达 [ShowLocationNameWithNoTooltip('mecca')] 时所获得的奖赏。"
 treasure_fleet_cooldown: "宝船船队"
 treasure_fleet_expedition: "宝船船队"
 treasure_fleet_expedition_desc: "派遣皇家宝船船队前往选定地区,进行一场国事航行。船队沿沿海航线驶向目的地并返回,途中停靠各处外国港口。此行将拓展朝廷的外交影响,向南洋诸王赠送礼物与 [ShowGoodsName('silk')] 到统治者,收取朝贡,并带回珍稀货物、使节,以及那些已然听闻中华风帆之声的诸王之名。"
 western_ocean_voyage_cooldown: "西洋远航"
 western_ocean_voyage_expedition: "西洋远航"
 western_ocean_voyage_expedition_desc: "派遣一支船队向西横渡辽阔的大西洋，寻找通往印度的海路。没有任何海图能为我们描绘出 [ShowAreaName('canary_islands_area')] 之外的景象，唯有风、水，以及大洋比学者们所想的更为狭窄的希望。"
 western_ocean_voyage_expedition_historical_info: "在第一次此类航行尝试之前的数十年间，欧洲学者一直在争论向西航行抵达亚洲的可能性。主要的障碍并非地球的形状——受过教育的人都明白大地是球形的——而是它的大小。大多数学者正确地估计出海洋宽阔得难以横渡。而最终证明他们错误的远征，并非推翻了这一估算，而是在途中发现了意料之外的事物。"
