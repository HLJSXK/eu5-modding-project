l_simp_chinese:
 # Decision category
 DECISION_CATEGORY_INFRASTRUCTURE: "基础设施"
 # CConstruction name/tooltip strings used by CConstruction::GetNameWithNoTooltip
 # and CConstruction::GetTooltip when _IsCanal is set.
 CANAL_CONSTRUCTING: "在[LOCATION.GetNameWithNoTooltip]修建运河"
 CANAL_CONST_DETAILS_TIP: "一条可通航的运河将被开凿穿过[LOCATION.GetNameWithNoTooltip]，在其所连接的海洋之间开辟一条新通道。"
 # Advances
 suez_canal_advance: "苏伊士运河工程"
 suez_canal_advance_desc: "勘察并开始修建穿越苏伊士地峡的运河，在地中海和红海之间开辟一条直接通道。"
 panama_canal_advance: "巴拿马运河工程"
 panama_canal_advance_desc: "勘察并开始修建穿越巴拿马地峡的运河，将大西洋和太平洋连接起来。"
 # Owncountry actions for restricting / opening canal passage
 close_canal_to_enemies: "对非盟友关闭运河"
 close_canal_to_enemies_desc: "战争期间，只允许盟友和附属国通过我们的运河。敌人会被自动封锁；这也同时将中立国和宿敌排除在外。"
 open_canal_to_all: "对所有国家开放运河"
 open_canal_to_all_desc: "解除限制，向我们未处于战争状态的任何国家重新开放运河通行。"
 CANAL_LOCATION_DESC: "一条可通航的运河贯穿此地，为其所连接的两片海域之间开辟了一条通道。"
 CANAL_LOCATION_RESTRICTED: "目前该通道仅限运河所有者的盟友与附庸通行。"
