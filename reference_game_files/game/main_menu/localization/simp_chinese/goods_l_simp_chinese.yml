 rgo_salt: "盐场"
 old_world_goods: "旧大陆商品"
 new_world_goods: "新大陆商品"
 horses: "马匹"
 horses_desc: "自马匹在约6000年前的欧亚草原某处被驯化以来，它便成为人类执行各种任务的得力助手，其中最为关键的用途之一便是参与战争。从这个角度来看，中世纪可谓是骑士和马匹的黄金时代，这种牲畜与封建社会的发展紧密相连。"
 clay: "黏土"
 clay_desc: "黏土是一种独特的土壤类型，自史前时期以来，人们便开始利用它来制作陶器或瓷器。除了这一主要用途，黏土在建筑业中也扮演着重要角色，它被用来粘合建筑材料或制作砖块。此外，以陶土为基底的泥板是人类最早的书写媒介之一，为人类早期文明的发展做出了不可磨灭的贡献。"
 sand: "沙砾"
 sand_desc: "沙砾是地球上极为普遍的材料，其用途十分广泛。得益于其粗糙的质地和颗粒结构，沙子不仅用于研磨石材和金属，而且长期以来一直是众多建筑材料不可或缺的成分，同时也是制造玻璃的主要原料。"
 tar: "焦油"
 tar_desc: "作为造船行业不可或缺的原料之一，焦油最初是从经济作物中提炼出来的。它的外观呈现为粘稠的黑色半流体状态，这种特性源于其生产过程中精细的蒸馏工艺。因此，焦油广泛用于船体密封材料以及作为船帆的廉价防水材料。"
 coal: "煤炭"
 coal_desc: "煤作为一种燃料被人类应用已有很长的历史，但直到蒸汽机的发明和广泛传播之后，对煤的需求才飞速增长。随着工业革命传播到整个欧洲，煤的使用和进出口将成为一项重要生意，并成为当代经济的组成部分。"
 iron: "铁"
 iron_desc: "铁代表了包含铁在内的多种黑色金属。铁是冶金工业的最基本原料，并被广泛用于制造武器和其他军事装备。"
 copper: "铜"
 copper_desc: "自数千年前冶金学的发明和传播以来，铜一直是最重要的金属材料之一。它的用途非常多样化，因为它可以单质形态加工，也可用在青铜等铜合金的加工当中，这使得它对武器尤为重要。在大炮的早期生产中，青铜是必不可少的材料。"
 goods_gold: "黄金"
 goods_gold_desc: "自古以来，黄金便是最为贵重的金属，广泛用于贸易以及以铸币或各式金器的形式积累财富。无论在双金属或三金属货币体系中，黄金始终作为核心货币材料，其极高的需求促使它成为人类探索新世界的重要驱动力。"
 silver: "白银"
 silver_desc: "白银是最早被用作货币的金属之一，与黄金并驾齐驱。中欧在中世纪时期曾是白银的生产中心，直至16世纪哥伦布大交换之后，白银的全球生产基地转移到美洲，使新大陆成为新兴崛起的世界白银开采和铸造中心。"
 gems: "宝石"
 gems_desc: "自远古以来，诸如红宝石、蓝宝石、钻石、祖母绿和玉石等宝石就被用作首饰和服装点缀。就钻石而言，千百年来，世界上的唯一已知产地是戈尔孔达的钻石矿。虽然并不是所有的宝石都如此稀有，它们一直受到热烈追捧。"
 stone: "石料"
 stone_desc: "纵观历史，石材始终是人类建筑的重要材料之一。与黏土和木料相比，石材以其坚固耐用的特性，成为了众多建筑项目的首选。即便是像金字塔这样的古老建筑奇迹，至今依然巍然屹立，这充分证明了石材作为建筑材料的持久耐用性。"
 tin: "锡"
 tin_desc: "五千年前，自锡开始作为合金成分之一用于青铜铸造，它便在冶金领域得到了广泛的应用。随后，锡不仅被广泛应用于铁、铅、钢等金属的表面防锈处理，还被大量用于制造白锡合金，这种合金广泛应用于餐饮器具的生产。"
 lead: "铅"
 lead_desc: "在古代，铅金属主要被看作是从方铅矿中提炼银时的副产品，并广泛应用于家庭作坊和手工艺品制作。罗马人尤其擅长使用铅，他们的铅加工技术一直领先，直到工业革命时期才被超越。直到近代，铅才开始被大量用于制造枪支和弹药。"
 wool: "羊毛"
 wool_desc: "羊毛主要来自不宜种植作物的土地上放牧的绵羊，在棉花被广泛使用之前，它一直是服装的主要原料。"
 cotton: "棉花"
 cotton_desc: "棉花的起源可追溯至中亚地区，然而，直到棉花被引入美洲并大规模种植之后，它才开始在欧洲得到广泛的应用。棉织品因其物美价廉的特性，在18世纪末期已经成为服装工业中不可或缺的材料，它不仅能够作为羊毛的补充，甚至在某些情况下完全取代了羊毛。"
 silk: "丝绸"
 silk_desc: "在东方的纺织品中，最上乘的当属产自印度、中国以及东亚其他地区的丝绸。尽管丝绸不像香料那样具有标志性，但事实上，欧洲国家通过东印度公司从丝绸和其他高级棉纺织品中获得的利润早已远超香料贸易。\n随着需求的不断增长，精明的欧洲商人也开始尝试在本土生产丝绸，但其质量参差不齐。"
 dyes: "染料"
 dyes_desc: "只要人类生产纺织品，对染料的需求就永远不会消失。在中世纪晚期，像靛蓝这样的珍贵染料价格昂贵，它们主要产自遥远的印度等地，因此价格自然不菲。\n随着海上航线的开辟，染料变得更加容易获取，一是美洲具有了生产染料的能力，二是通往印度的贸易路线更加顺畅。尽管如此，直到19世纪初，染料仍然被视为珍品。因此，随着印度大片种植园最终被欧洲人控制，一场“染料淘金热”随之兴起。"
 incense: "熏香"
 incense_desc: "千百年来，在宗教仪式中，通过焚烧香料以制造香味和烟雾十分普遍。乳香、沉香、檀香和没药等熏香类商品的产地相当稀少，这些商品的贸易在丝绸之路等贸易网络的形成中起到了重要作用。事实上，丝绸之路也许完全可以被称为“熏香之路”。"
 sugar: "糖"
 sugar_desc: "糖不仅是一种甜味剂，也是食物保藏的手段之一。最早甘蔗是仅有的提取糖的来源，种植范围也仅限地中海群岛。但是随着美洲劳动密集型种植园体系的建立，尤其是加勒比海群岛地区，很快甘蔗的主产地就移至海外了。"
 tobacco: "烟草"
 tobacco_desc: "烟草在欧洲长期不为人所知，直到16世纪晚期才从美洲传入，很快就在富裕的上流社会中流行起来。由于其利润丰厚，烟草在北美的英国殖民地和葡属巴西大量种植。当时还没有人知道烟草为什么如此令人成瘾，但就是抽得停不下来。"
 tea: "茶叶"
 tea_desc: "作为一种珍贵的奢侈饮品，茶叶主要源自中国、印度以及东南亚地区，并被广泛应用于宗教仪式和社交场合之中。英国人则在欧洲推广了饮茶的文化。尽管茶不像咖啡那样被视为贵族的专属饮品，但其有限的产量和供应量同样为生产者带来了可观的经济收益。"
 cocoa: "可可"
 cocoa_desc: "自中世纪以来，阿兹特克、印加以及其他美洲原住民统治者们便常将可可作为提神醒脑的饮品。到了16世纪初期，可可被西班牙人从美洲殖民地引入欧洲，并迅速流行开来，成为富裕阶层所青睐的奢侈点心。"
 coffee: "咖啡"
 coffee_desc: "咖啡的起源可追溯至埃塞俄比亚东北部，最初在阿拉伯半岛南部得到种植。到了17世纪末期，这种饮品传入意大利，并逐渐扩散至欧洲其他地区。1600年，教宗克肋孟八世宣布咖啡为基督徒可饮用的饮品，从而促进了其在欧洲的广泛传播，与此同时，仍有一些人呼吁禁止这种“穆斯林饮品”。"
 fiber_crops: "纤维作物"
 fiber_crops_desc: "诸如大麻、亚麻、剑麻和黄麻等纤维作物，在全球范围内被广泛应用于生产各类产品，包括船帆、绳索、渔网以及衣物等。除了作为粗纺织品的原料外，这些作物中的许多还被用于编织精细纺织品的核心部分，并在各种仪式、家居装饰以及其他场合中发挥着重要作用。"
 ivory: "象牙"
 ivory_desc: "象牙，作为非洲除奴隶贸易外最重要的商品之一，被欧洲人广泛用于制作各类精致的物品，如餐具、家具以及艺术装饰品等。"
 fur: "毛皮"
 fur_desc: "毛皮是制造高档保暖衣物的基本材料之一。最初各种动物毛皮主要来自于罗斯，但到18世纪中晚期，上等毛皮已越来越多地取自北美洲的河狸皮。"
 lumber: "木材"
 lumber_desc: "木材在人类历史上一直是主要的建材之一。尽管其耐久性不及石料，但木材的易于加工特性使其成为全球各地建筑的首选材料。即便是那些需要具备高度防御性的结构，如城堡和防御工事，也存在采用木材而非石料构建的实例。"
 salt: "盐"
 salt_desc: "食盐对于人的生存是不可或缺的。此外，食盐还被用来在冬季贮存食物。食盐的来源包括中欧等地盐矿中产出的岩盐，也包括通过曝晒、蒸发卤水制成的湖盐、海盐。"
 porcelain: "瓷器"
 porcelain_desc: "瓷器与陶器统称为陶瓷。通过高温烧制工艺，瓷器表面得以玻璃化，赋予了其一定的强度和半透明的特性。早在三千多年前，中国就已经发展出了瓷器的雏形。到了两千年前，我们今天所理解的瓷器被创造出来，并从中国传播至世界各地，成为一种备受追捧的商品。"
 naval_supplies: "船具"
 naval_supplies_desc: "船具代表了所有船只上需要的物品，从基础的木头到焦油、绳索、亚麻布、船帆以及各种其他物品。最初，波罗的海一直是船具的主要供应地，而到18世纪早期，北美成为了另一个主要原产地。对于这些关系到国计民生的资源的需求也是殖民美洲的源动力之一。"
 firearms: "火器"
 firearms_desc: "火器这一概念的诞生及其实际应用，深刻地改变了战争的面貌。欧亚大陆的冲突现在无一不受到火药原料的采集、进口和应用的深刻影响。火器已经成为战场自然演进的产物，同时也是全球领土防御不可或缺的一部分。"
 cannons: "火炮"
 cannons_desc: "尽管攻城器械古已有之，但火药的发明才真正赋予了攻城火炮前所未有的破坏潜力。以更快的速度和更远的距离投射更大的炮弹，使得只有最坚固的防御工事才能免于在它们面前迅速倒塌，更不用提当这些炮弹向敌人的军队发射时能发挥的威力了。"
 glass: "玻璃"
 glass_desc: "千百年来，玻璃因其在艺术、建筑及日常器皿制作中的实用性而备受重视。随着玻璃制造技术的提升，玻璃最终成为光学领域的关键材料。玻璃透镜被用于制造眼镜、望远镜，以及各种在航海及自然科学等领域中有广泛应用的其他设备。"
 steel: "钢"
 steel_desc: "钢被广泛用于制造武器和枪支。它的各种品质被用于不同的武器，钝钢用于斧头，优质钢用于剑和刀。因此，钢也被用作锻造设备和工具的主要金属材料。"
 cloth: "布匹"
 cloth_desc: "布料代表着各种毛料及亚麻的纺织品和衣物。在晚些时期，从印度和美洲进口的棉花成为了织物的主要原材料。"
 wine: "葡萄酒"
 wine_desc: "早在远古时代，以葡萄酒为代表的酒类就已经在南欧出现了。它一直是日常饮食的重要组成部分之一，或许只有穆斯林才能拒绝它的诱惑。酒并不是一种奢侈品，它作为粗茶淡饭的佐餐良品广受欢迎。"
 liquor: "烈酒"
 liquor_desc: "烈酒是一种酒精饮料，由不同类型的种植作物蒸馏而成。蒸馏是为了增加酒精的度数。世界各地流行的蒸馏烈酒有杜松子酒、朗姆酒、威士忌、伏特加、龙舌兰和烧酒。"
 paper: "纸张"
 paper_desc: "纸张对于各种账目记录、行政管理和知识的传播都是必不可少的。造纸术最早起源于中国，并逐渐传播到世界各个角落。纸张远远优于羊皮纸等其他类型的书写材料，它的大规模生产也需要一套专门的技术和设备，这都使其成为一种难得的商品。"
 books: "书籍"
 books_desc: "自从数千年前文字的发明，书籍便成为人类知识传承的重要载体之一。它们多由皮革、羊皮纸以及其他植物纤维材料制成。到了中世纪，活字印刷技术的出现及其广泛传播，极大地促进了书籍的普及，使得知识更加易于大众获取。"
 jewelry: "珠宝"
 jewelry_desc: "珠宝是由灵巧的工匠以金银或宝石打造而成，表征了所有者权力和风雅的器物。他们的价值往往与尊贵的社会地位，乃至王权密切相关。"
 leather: "皮革"
 leather_desc: "皮革是人类文明最早的发明之一，用于制造衣物、鞋类和装饰品。它的成功很大程度上归功于其高舒适性与高耐用性，并最因为其维护简单、不沾食物气味，最终成为制作餐用家具的首选材料。"
 tools: "工具"
 tools_desc: "工具的制造是推动人类社会繁荣发展的关键因素。从最初简单原始的石制工具，到利用金属冶炼技术制造出的先进、精密工具，这些工具的演进使人们得以进一步制造设备和武器。"
 wild_game: "野味"
 wild_game_desc: "对于居住在稀少人口的偏远地区的居民来说，野生动物是重要的食物和营养来源。狩猎如麋鹿、麝鹿、野猪等野生动物是社会活动的重要组成部分，因为这些动物为居民提供了皮革、骨料和生存必须的营养。"
 fish: "鱼类"
 fish_desc: "鱼类在当时是欧洲人最重要的食物来源之一，因为肉类对大多数人来说还属于奢侈品。在大多数国家，渔民也是商船和军舰水手的基础人力池。"
 wheat: "小麦"
 wheat_desc: "小麦包括各种植物类食品，是人和动物最重要的日用必需品。粮食的缺乏总是会带来叛乱和暴动。其他的植物类食品包括原产于美洲的番茄、玉米及马铃薯等，它们的流传使得农业生产更加多样化。"
 maize: "玉米"
 maize_desc: "玉米是一种在几千年前在墨西哥得到驯化的栽种植物。随着15世纪欧洲人的到来，玉米从新世界传播到了旧世界。由于其耐储藏和膳食价值，玉米注定在世界范围内受到欢迎。"
 rice: "稻米"
 rice_desc: "作为谷物作物的一种，稻米自一万年前被驯化以来，就一直作为亚洲地区的主食。非洲在三千年前也独立驯化了大米并作为重要粮食来源。早在古典时代，大米就通过欧亚贸易被带到了欧洲，但并未取代其他谷物成为欧洲的主要作物。"
 millet: "杂谷"
 millet_desc: "杂谷是指自新石器时代以来在世界各地的不同时点得到驯化的多种耐旱谷物。相比其他谷物，它们对较差土壤条件和干燥条件的适应性较强，使其成为半干旱区域更重要的食物来源。"
 potato: "马铃薯"
 potato_desc: "马铃薯是一种富含淀粉的植物块茎，它被居住在的的喀喀湖周边的安第斯原住民所驯化。它的耐寒性与高碳水含量推动了安第斯文明的兴起。在哥伦布大交换后，它传遍了全球，到1750年时，它已经成为了欧洲的主粮，并成为19世纪人口大爆发的功臣。"
 legumes: "豆类"
 legumes_desc: "历史上，各种文明数千年来一直将豆类作为重要的营养来源。与玉米类似，欧洲人在最终到达新大陆时，也接触到了新类型的豆类。豆类不仅能填饱肚子，而且生产成本低廉，还便于船运。"
 livestock: "牲畜"
 livestock_desc: "自有史以来，豢养家畜一直是人类的重要生产活动。牲畜包括了人类畜养的各种动物，例如农业发达地区的牛与猪，以及世界各大草原和沙漠地区的各种牧群。"
 lacquerware: "漆器"
 lacquerware_desc: "早在一万年前的新石器时代，漆器就已经在中国和日本发展起来。他们从树脂和蜡中提取出生漆，并覆盖在木器或金属器皿的表层。这层漆面可以进一步进行绘制、雕刻或利用金银碎屑进行装饰，从而使其成为一种奢侈器具。"
 weaponry: "武器"
 weaponry_desc: "如刀剑、长枪和弓箭等各式各样的武器构成了每支军队核心的战斗力来源。锻造武器所需的技术是一门需要岁月锤炼的艺术。尽管如此，无论时代如何变化，武器永远是捍卫一个国家独立的重要工具。"
 amber: "琥珀"
 amber_desc: "琥珀是一种由树脂化石制成的贵重品，主要应用于制造珠宝或饰物。它最早出现在文明视线中可追溯到12世纪的一份文献，并主要分布在普鲁士海岸的矿床之中。"
 pearls: "珍珠"
 pearls_desc: "珍珠是在各种有壳软体动物的体内形成的，其最终形态呈坚硬有光泽的圆滑物体，当然也有异形珍珠。纵观人类历史，它们因美丽而被受追捧，并在世界各地像宝石一样被当做装饰品。"
 medicaments: "药物"
 medicaments_desc: "纵观世界历史，一些植物和动物产品因为具有或被认为具有药用特性而被用来治疗各种疾病。有些确实基于其实际药效，而另一些则更多是出于对其疗效的信仰。"
 alum: "明矾"
 alum_desc: "明矾是染色工艺中不可或缺的成分，在制革过程中也有重要作用。由于其广泛用于各种艺术和工艺领域，明矾主要应用于绘画和装饰过程。它最早主要来自乍得地区，并在整个伊斯兰世界的市场上进行交易。然而，到中世纪晚期，欧洲开始开发其他明矾来源。"
 olives: "橄榄"
 olives_desc: "橄榄是从橄榄树上采摘的，这种树木在地中海地区已经栽培了数千年。橄榄在美食界备受推崇，尤其是橄榄油，它在地中海饮食中广泛用于烹饪和调味各种食物。"
 slaves_goods: "奴隶"
 slaves_goods_desc: "自古典时代起，奴隶便已成为一种贸易商品。然而到了16世纪末期，随着欧洲人在美洲的种植园对廉价劳动力的需求激增，奴隶的贸易需求也急剧上升。"
 tropical_wood: "热带木材"
 saltpeter: "硝石"
 saltpeter_desc: "硝石自古以来就为人所知，其用途多种多样，如用作肥料或肉类加工用盐。然而，随着中世纪火药和火器的发明，硝石的重要性得到了显著提升，因为它是火药的关键成分之一，与木炭和硫磺并列。这种矿物在全球范围内被大规模开采，因此其名声并不佳。"
 fine_cloth: "精纺品"
 fine_cloth_desc: "精纺织物历来是精英和富裕阶层身份的标志。在中世纪和近代，锦缎、薄纱或织锦等纺织品在世界各地销售和复制，成为一项非常有利可图的生意。"
 elephants: "大象"
 elephants_desc: "自古以来，印度、东南亚、中东以及北非地区在战争中广泛使用大象。尽管随着近代火药武器的兴起，大象在军事冲突中的角色有所减弱，但它们在这些地区的应用一直延续至中世纪末期。"
 beer: "啤酒"
 beer_desc: "自新石器时代首次酿造啤酒以来，啤酒一直是美食的佐餐。到了中世纪，啤酒成为一种广泛的饮品，巴伐利亚甚至颁布了《啤酒纯净法》以规定啤酒成分与质量，这成为至今仍在使用的最古老的食品安全法规。"
 fruit: "水果"
 fruit_desc: "水果种类繁多，涵盖了柑橘、苦橙、甜橙、苹果等多种。对许多人而言，这些美味佳肴似乎遥不可及，唯有社会精英阶层才能品尝得到。实际上，世界上几乎每个角落都有其独特的水果种类，而全球贸易的蓬勃发展使得各种新奇水果得以进入寻常百姓家。"
 marble: "大理石"
 marble_desc: "自古以来，大理石因其纯净的外观和卓越的可塑性，一直被视为一种奢华的建筑材料。在文艺复兴和巴洛克时期，诸如米开朗基罗和贝尼尼等艺术家创作的众多艺术杰作，都是采用大理石雕刻而成。"
 mercury: "水银"
 mercury_desc: "$mercury$在制药领域发挥着不可或缺的作用，同时它在提炼低品位金银矿石的过程中也扮演着关键角色，确保了金银的纯度和价值。"
 masonry: "砖块"
 masonry_desc: "通过建筑技术将石料和砖瓦加工成各种特定的形状和尺寸，制造出用于建筑的标准化、固定尺寸的小型构件。这一建材不仅显著提升了建筑施工的效率，还增强了建筑物的耐久性。"
 beeswax: "蜂蜡"
 beeswax_desc: "自史前时代以来，蜜蜂便是人类的伙伴，它们的蜡用途广泛，可制成蜡烛、模具、抛光剂和书写版等等，蜂蜡在人类社会中始终无处不在。"
 saffron: "藏红花"
 saffron_desc: "藏红花自古以来便广为人知，尽管价格昂贵，但其用途多样，不仅用于烹饪，还作为传统药物和衣物染料的来源。"
 pepper: "胡椒"
 pepper_desc: "尽管许多植物都被称为胡椒，但它们都以其辛辣味而闻名，这使得胡椒成为调味料和传统药物的重要组成部分。"
 cloves: "丁香"
 cloves_desc: "丁香是生长于摩鹿加群岛的一种芳香花蕾。它成为欧亚贸易网络中最有价值和最昂贵的香料之一，促使欧洲人在中世纪晚期寻找新的香料来源。"
 chili: "辣椒"
 chili_desc: "一些原产于中美洲和南美洲的植物品种，以其辛辣味和能为菜肴增添风味而著称。自古以来在美洲种植，其众多品种具有广泛的风味和辣度，使其成为极受欢迎的香料。"
 pottery: "陶器"
 pottery_desc: "作为人类社会最古老的标志之一，这种将粘土转化为各种物品的技术是人类发展的关键因素。从史前时代的粗糙陶器花瓶到更复杂的形式，陶器在各类文化中无处不在。"
 furniture: "家具"
 furniture_desc: "家具不仅满足了人们遮风挡雨的需求，还提供了更多功能。从简单的床和桌子到精致的家具，从普通木材甚至石头到昂贵材料，家具适应了各种需求和品味。"
