l_simp_chinese:
 roman_culture_movement: "[ShowCultureNameWithNoTooltip('roman_culture')]文化运动"
 hellenism_religion_movement: "柏拉图学派复兴"
 hellenism_religion_movement_allow_tt: "[GetCountry('BYZ').GetName] must do this through the [ShowGenericActionName('reestablish_hellenism')] action or the Gemistos Plethon [events|e]."
 roman_culture_movement_allow_tt: "[GetCountry('BYZ').GetName] must be leaning towards [ShowSocietyDirectionName('latinization')] and own an [urban_location|e] with a [ShowLanguageFamilyName('romance_language_family')] [dominant_language|e] that has [average_satisfaction|e] over 50%"
 hellenism_religion_movement_desc: "在希腊与罗马的基督教族群之中，一股思潮正在涌动——人们热切渴望重拾古希腊先祖古老的传统与智慧。"
 hellenism_religion_movement_location_modifier: "$hellenism_religion_movement$修正"
 roman_culture_movement_desc: "拉丁传统在重生的罗马帝国内部的复兴。"
 roman_culture_movement_location_modifier: "$roman_culture_movement$修正"
 MOVEMENT_SPREAD: "运动传播"
 MOVEMENT_SPREAD_CULTURE: "$MOVEMENT$是一个在我国传播$CULTURE$文化的运动。目前，我国有$AMOUNT$人口已同化为该文化，占我国总人口的$PERCENTAGE|%2$。"
 MOVEMENT_SPREAD_RELIGION: "$MOVEMENT$是一个正在我国传播$RELIGION$信仰的运动。目前，我国已有$AMOUNT$人口改信该宗教，占我国总人口的$PERCENTAGE|%2$。"
 MOVEMENT_SUBJECT_RELIGION: "[religion|e]：$NAME$"
 MOVEMENT_SUBJECT_CULTURE: "[culture|e]：$NAME$"
 MOVEMENT_SPREADER_TT_TITLE: "$MOVEMENT$在[pops|e]中的传播方式存在差异："
 SPREAD_POPTYPE_ENTRY: "$POPTYPE$ [pop_type|e] gets $AMOUNT|%0$ faster"
 SPREAD_RELIGION_ENTRY: "$RELIGION$ [religion|e] gets $AMOUNT|%0$ faster"
