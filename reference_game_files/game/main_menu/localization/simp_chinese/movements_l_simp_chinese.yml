l_simp_chinese:
 lutheranism_movement: "路德宗"
 lutheranism_movement_desc: "新教徒主导的宗教改革风潮正席卷整个基督教世界。马丁·路德的学说掀起一场宗教剧变，动摇了天主教会的权威，并在心怀不满的民众间迅速传播。"
 lutheranism_movement_location_modifier: "$lutheranism_movement$修正"
 calvinism_movement: "加尔文宗"
 calvinism_movement_desc: "受约翰·加尔文的改革神学启发，这一股运动传播着体系更严谨、教义更规整的新教宗派思想，在欧洲市民与商人阶层中格外受欢迎。"
 calvinism_movement_location_modifier: "$calvinism_movement$修正"
 roman_culture_movement: "拉丁复兴"
 hellenism_religion_movement: "柏拉图学派复兴"
 hellenism_religion_movement_allow_tt: "[GetCountry('BYZ').GetName]必须通过[ShowGenericActionName('reestablish_hellenism')]行动或格弥斯托士·卜列东[events|e]操作。"
 roman_culture_movement_allow_tt: "[GetCountry('BYZ').GetName]必须倾向于[ShowSocietyDirectionName('latinization')]，并且拥有一处[dominant_language|e]为[ShowLanguageFamilyName('romance_language_family')]且[average_satisfaction|e]高于50%的[urban_location|e]"
 hellenism_religion_movement_desc: "在希腊与罗马的基督教族群之中，一股思潮正在涌动——人们热切渴望重拾古希腊先祖古老的传统与智慧。"
 hellenism_religion_movement_location_modifier: "$hellenism_religion_movement$修正"
 roman_culture_movement_desc: "拉丁传统在重生的罗马帝国内部的复兴。"
 roman_culture_movement_location_modifier: "$roman_culture_movement$修正"
 MOVEMENT_SPREAD: "运动传播"
 MOVEMENT_SPREAD_CULTURE: "$MOVEMENT$是一个在我国传播$CULTURE$文化的运动。目前，我国有$AMOUNT$人口已同化为该文化，占我国总人口的$PERCENTAGE|%2$。"
 MOVEMENT_SPREAD_RELIGION: "$MOVEMENT$是一个正在我国传播$RELIGION$信仰的运动。目前，我国已有$AMOUNT$人口改信该宗教，占我国总人口的$PERCENTAGE|%2$。"
