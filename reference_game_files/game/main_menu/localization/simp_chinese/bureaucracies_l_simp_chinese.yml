 # Generic 1600-1836 bureaucracies
 # ADM
 board_of_revenue_bureaucracy: "税务委员会"
 board_of_revenue_bureaucracy_desc: "一个负责征收、核查与管理国家财政收入的中央集权机构。从英国的财政委员会到法国的#italic 财政总署#!，历史证明，资金充裕的税务委员会能极大提升王室的收入；而若遭忽视、充斥挂名闲职与腐败，它本身就会成为其本欲守护的财政资源的漏洞。"
 privy_council_bureaucracy: "枢密院"
 privy_council_bureaucracy_desc: "由统治者信赖的顾问组成的内层会议，是王室施政的核心机制。无论是英国的枢密院，还是西班牙的#italic 王家委员会#!，都通过将国家重要官员纳入统一协调的机构，使君主得以高效治理国家。然而，若缺乏足够的支持，枢密院便会沦为派系斗争的场所，从而疏远那些王权赖以实施统治的各个阶层。"
 audit_bureau_bureaucracy: "审计署"
 audit_bureau_bureaucracy_desc: "专司审核公共账目、稽查官员与包税人腐败行为的专门机构，以法国的#italic 审计法院#!或荷兰的#italic 审计院#!为典范，这类机构为君主提供了追讨流失财政收入、问责行政官员的有力工具。然而，若经费不足，审计署将丧失独立性——既得利益集团趁机填补权力真空，税收机器反而被其本应监管的对象所掌控。"
 colonial_office_bureaucracy: "殖民部门"
 colonial_office_bureaucracy_desc: "一个负责制定海外领土政策、管理殖民官员任命并监督殖民帝国法律框架的政府部门。英国殖民部的经验表明，组织有序的母国监管能够加速遥远地区的拓殖进程。然而，若缺乏充足的资源支持，殖民部的宣传活动只会鼓动人们离开本土，却无法在殖民帝国范围内为他们开辟更好的出路。"
 # DIP
 admiralty_board_bureaucracy: "海军委员会"
 admiralty_board_bureaucracy_desc: "负责海军行政、后勤补给与战略指挥的专员委员会。英国海军部与西班牙#italic 战争委员会#!下属的海军事务处表明，专业化的海军行政与战舰本身同样具有决定性作用。运转良好的海军委员会能够培养出庞大且经验丰富的海员队伍；但若经费中断，征兵仍在继续而训练却无以为继，海军传统便会在舰队扩张的同时悄然流失。"
 foreign_ministry_bureaucracy: "外交部"
 foreign_ministry_bureaucracy_desc: "负责主持国家对外关系、维持常驻使节团并协调海外情报的常设机构。法国的#italic 外交事务部#!开创了专业外交服务体系，后被其他列强相继效仿。资源充足的外交部能通过成功谈判积累国家声望；而经费匮乏的外交部则频出窘态——使节无力维持府邸、公文积压无人答复、国家声誉随之受损。"
 trade_commission_bureaucracy: "贸易委员会"
 trade_commission_bureaucracy_desc: "负责颁发商人执照、裁断商业纠纷、制定关税及打击走私的监管机构。英国的贸易委员会或荷兰#italic 联合东印度公司#!的监督理事会表明，国家有组织地介入商业活动能够彻底改变国家繁荣程度。然而，若无有效执行能力，贸易委员会便形同虚设——特许垄断权被规避、关税收入流失，整体贸易经济反而较前更为恶化。"
 # MIL
 war_council_bureaucracy: "战争委员会"
 war_council_bureaucracy_desc: "负责统筹规划、协调与监督陆上军事力量的最高军事机构。针对同一难题——如何为规模过大、任何单一指挥官都无法独立掌控的军队提供战略指引——哈布斯堡王朝的#italic 宫廷战争理事会#!与英国的陆军部给出了不同的解决方案。获得充足拨款的战争委员会能够持续培养出胜任的军官；而一旦预算遭到削减，识别与提拔人才的那套制度性机制便会失效，陆军的传统优势也随之逐渐衰落。"
 ordnance_board_bureaucracy: "军械局"
 ordnance_board_bureaucracy_desc: "负责火炮、弹药及野战工程器械的制造、储存与供应的专业部门。英国的军械局与法国的#italic 王家炮兵军团#!表明，攻城战的专业化需要常设的官僚机构，而非临时承包商。资金充足的军械局能显著提升攻城能力；然而一旦资源枯竭，它便逐渐陷入内部腐化——铸造厂年久失修、弹药库检查流于形式，连本应由其维护的要塞也逐步走向崩坏。"
 commissariat_bureaucracy: "军需委员会"
 commissariat_bureaucracy_desc: "军事体系中的后勤部门，专责为野战部队提供粮草、服装及武器装备。路易十四时期由卢瓦建立的制度——后经完善发展为#italic 军需总监#!体系——表明，依托组织化仓储进行补给的军队，能够维持大规模、长周期的军事行动，这是依赖就地征粮的军队所无法实现的。资金充足的军需委员会可显著提升作战兵力的规模；而拨款不足的军需委员会则迫使军队通过压榨民间承包合同来填补缺口，致使维持成本急剧上升，远超过实际增加的兵力价值。"
 # Chinese bureaucracies
 central_secretariat_bureaucracy: "中书省"
 central_secretariat_bureaucracy_desc: "#italic $zhongshu_sheng$#!是元代最高民事行政机构，自京师统御帝国全域的治理事务。一个资金充裕的中书省通过果断而协调的统治，使王朝权威获得合法化背书；然而，若其行政运作遭到忽视，由此产生的行政紊乱将提升朝廷在每一项政治决策中所必须付出的成本。"
 imperial_censorate_bureaucracy: "都察院"
 imperial_censorate_bureaucracy_desc: "元代的#italic 御史台”#!——明以后改制为#italic 都察院#!——是为封建王朝的监察机构，专职肃清官员贪腐，确保法律自京师至行省得以贯彻。若经费充足，宪台官员所追回的税收，将不再因官吏渎职而流失；但若资源匮乏，监察触角便无法延伸，各阶层势力则会迅速填补这一监督真空。"
 six_boards_bureaucracy: "六部"
 six_boards_bureaucracy_desc: "#italic 六部#! 是明代六大行政中枢——吏、户、礼、兵、刑、工——共同掌管国家治理体系。它们代表了当时世界上最完善的官僚制度；在财力充足时，能大幅提升税收效率；但若被忽视，六部便会逐渐固化成为朋党官员的权力根基，转而优先谋求自身利益，将朝廷的需求置于次要位置。"
 six_boards_deactivate_disables_oversight_law_tt: "移除该[bureaucracy|e]将使[ShowLawName('six_ministries_overseer_law')]法律不再可用"
 grand_secretariat_bureaucracy: "内阁大学士"
 grand_secretariat_bureaucracy_desc: "#italic 内阁#!是皇帝的内朝顾问团体，明王朝实质上的最高决策机构。主要负责诏令起草、在皇帝与外朝官员之间进行沟通协调，并统筹$six_boards_bureaucracy$间的政策事务。一个资源充足的内阁能够通过果断、统一的施政，有效提升帝国的威望；然而，一旦财政匮乏，内阁便会失去皇帝的信任，其所肩负的维护王朝合法性的职责也将随之崩溃。"
