l_english:
 textiles: "Textiles"
 textiles_desc: "Weaving and cloth-making, from common wool to fine luxury cloth. Promoting textiles raises demand for cloth across the realm and speeds the establishment of weavers and workshops in the chosen area."
 crafts: "Crafts"
 crafts_desc: "Artisan and guild production of tools, worked steel, leather, and masonry. The backbone of a town's skilled trades."
 arms: "Arms"
 arms_desc: "The manufacture of weaponry and, in time, firearms and cannons. A promoted arms industry keeps armies supplied from domestic forges."
 luxury: "Luxury Goods"
 luxury_desc: "High-value crafts such as glass, jewelry, porcelain, and lacquerware. Prestige industries that enrich the burghers who master them."
 paper_goods: "Paper Goods"
 paper_goods_desc: "Paper mills and the printing of books. Fuels literacy and administration as much as commerce."
 furnishings: "Furnishings"
 furnishings_desc: "Furniture and pottery for households of every station."
 naval: "Naval Supplies"
 naval_desc: "Naval supplies and tar, the materials that build and maintain fleets."
 beverages: "Beverages"
 beverages_desc: "Wine, liquor, and beer. A thirsty market that rewards the regions that supply it."

 game_industry_type_struct: "$KEY_LOC$"
