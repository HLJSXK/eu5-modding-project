 game_concept_industry_promotion: "Industry Promotions"
 game_concept_industry_promotions: "Industry Promotions"
 game_concept_promote_industry: "Promote Industry"
 game_concept_industry_promotion_desc: "An Industry Promotion dedicates one [area|e] to a single branch of industry. Each industry covers a set of [goods|e]: promoting it raises the [output|e] of every [building|e] in that [area] producing those [goods], and raises the demand your [pops|e] have for them across your whole [country|e].\n\nPromoting industry requires the [advance_icon][ShowAdvanceName('industry_promotion_advance')] [advance|e]. How many industries you can promote at once is set by $MODIFIER_TYPE_NAME_possible_industry_promotions$, which grows with your [country] rank, your [government_reforms|e], and later [advances]. A promotion can be revoked at any time to free its slot."
 industry_promotion: "Industry Promotion"

