l_english:

 italian_wars.1.title: "The $italian_group$ Wars"
 italian_wars.1.desc.a: "Dark hands behind closed doors and the endless scheming of other major nations around [ShowRegionName('italy_region')] have led to an unprecedented diplomatic fallout. As a result, our grasp on the peninsula, and our influence upon it, are questioned. At this time of peril, we must not falter. Victory in [ShowRegionNameWithNoTooltip('italy_region')] will surely secure our place among the great powers!"
 italian_wars.1.desc.b: "War has come to [ShowRegionName('italy_region')]. The banners of foreign conquerors flock to usurp the great wealth held within our peninsula. Never before has our region fallen amid such a power struggle, as great powers circle our home like hungry vultures. It is time for our people to pick up the sword and the shield in favor of protecting our freedom, lest we fall victim to the expansionist tendencies of outsiders..."
 italian_wars.1.a: "The die has been cast."
 italian_wars.1.b: "Align with [GetUniqueInternationalOrganization('foreign_league_hre').GetLeaderCountry.GetNameWithNoTooltip]!"
 italian_wars_explanation_tooltip1: "During this time, states in [ShowRegionNameWithNoTooltip('italy_region')] will be able to defend themselves by joining an #italic $italian_group$ League#!.\n"
 italian_wars_explanation_tooltip2: "Foreign countries may create their own #italic Foreign Leagues#! in a bid to expand their influence in the region.\n"
 italian_wars_explanation_tooltip3: "[rivals|e] and [enemies|e] of #italic Foreign League#! leaders may intervene to assist #italic $italian_group$ Leagues#! through war or aid in the form of coin and men\n"
 italian_wars_explanation_tooltip4: "Leaders of each League gain access to the [ShowPeaceTreatyTypeName('dissolve_league_peace_deal')] [peace_treaty|e]"
 iw_italian_league_merc_efficiency_tt: "As a member of an #italic $italian_group$ League#!, our [ShowModifierTypeName('mercenary_maintenance_efficiency')] scales with how much of [ShowRegionNameWithNoTooltip('italy_region')] our League controls. At maximum reach (#Y 301#! locations), this grants up to #G +33%#! [ShowModifierTypeNameWithNoTooltip('mercenary_maintenance_efficiency')]."
 italian_wars.1.historical_info: "The $italian_group$ Wars (1494-1559) were a series of violent conflicts to determine the domination of Italy, mainly fought by France and Spain with a substantial part of Europe involved in this clash of powers. They began when Charles VIII of France invaded Italy in 1494, taking Naples, but Maximilian I of Habsburg, and Isabella of Castile and Ferdinand of Aragon, the Catholic Kings of Spain, rushed to the aid of the Pope to drive him out. The king of France then took Milan, Genoa, and Naples again in 1499, but Spain expelled them back from Naples in 1503, asserting their control over Southern Italy, and Pope Julius II formed an alliance to push the French out of northern Italy. A few years later, Francis I of France revived the French claim over Milan, which was taken in 1515, but in 1525 he lost a decisive battle in Pavia to Emperor Charles V, also King Charles I of Spain, and was captured. Francis I was released after formally renouncing all the French claims in Italy, but then he allied with England, the Pope, Venice, and Florence, with the resulted in the sack of Rome by the German landsknechts of Charles V in 1527, a peace with the Pope, and the imperial coronation of Charles V in Bologna in 1529. The wars finally ended in 1559 with the Peace of Cateau-Cambrésis, leaving the Spanish Habsburgs as the dominant power in Italy for 150 years."

 # Periodic flavor events (20-29)
 italian_wars.20.title: "The Condottiere's Price" # The Condottiere's Price
 italian_wars.20.desc.a: "[target_character.GetName], the captain of [target_merc.GetName], has halted the advance and sent word demanding a renegotiation of [target_character.GetHerHis] contract terms. The campaign has stretched far beyond what was agreed, and [target_character.GetShortNameWithNoTooltip] will not march another day without further compensation.\n\nWe may honor the demand and keep [target_merc.GetNameWithNoTooltip] in our service, or refuse and risk [target_character.GetShortNameWithNoTooltip] taking the company elsewhere before the campaign is decided."
 italian_wars.20.desc.b: "[target_merc.GetName] has grown restless, and their representatives have come to camp demanding a renegotiation of the original contract terms. With no single captain to negotiate with, the demand comes from the company as a whole, and their leverage is considerable while the campaign remains undecided.\n\nWe must decide how to respond before [target_merc.GetNameWithNoTooltip] loses patience entirely."
 italian_wars.20.desc.c: "[target_merc.GetName] has sent word demanding a renegotiation of their contract. The campaign has lasted far longer than they anticipated, and without further compensation, their commitment to our cause grows uncertain.\n\nWe must weigh the cost of meeting their demands against the risk of losing their service."
 italian_wars.20.a: "We will honor their demands."
 italian_wars.20.b: "We refuse. The contract stands."
 italian_wars.20.c: "[ROOT.GetCountry.GetGovernment.GetRulerOrRegent.GetShortNameWithNoTooltip] will handle these negotiations personally."
 mercs_among_the_ranks_of_target_merc_are_reigned_in_tt: "The company accepts the new terms and resumes their contract without further incident"
 mercs_extract_coin_and_supplies_from_the_land_tt: "The mercenaries extract coin and supplies from the surrounding land at our expense"
 target_province_loses_prosperity_extreme_penalty_tt: "Every [location|e] in [target_province.GetName] loses [ShowNamedValue('prosperity_extreme_penalty')|+=2%] [prosperity|e]"

 italian_wars.21.title: "Battle-Hardened Veterans" # Battle-Hardened Veterans
 italian_wars.21.desc: "The veterans of [target_army.GetName], seasoned through the relentless campaigns of the $italian_group$ conflict, have returned to camp near [target_location.GetName] bearing the marks of hard-won engagements. Their officers speak of men transformed by fire, whose instincts and discipline have been sharpened far beyond what training alone could provide.\n\nHow we choose to honor their experience will shape the character of our forces for years to come."
 italian_wars.21.a: "Keep them together. Their bond is their strength."
 italian_wars.21.b: "Their valor has shaped the soul of our nation."
 italian_wars.21.c: "[ROOT.GetCountry.GetGovernment.GetRulerOrRegent.GetShortNameWithNoTooltip] will oversee the drills of these veterans."

 italian_wars.22.title: "The Deserters' Problem" # The Deserters' Problem
 italian_wars.22.desc: "The prolonged struggle in [ShowRegionName('italy_region')] has worn heavily on those who carry its burden. Reports have reached our [ROOT.GetCountry.GetGovernment.GetCourtTitle] of soldiers abandoning their posts in growing numbers, driven by exhaustion and doubt in the cause they were asked to fight for. Voices among the estates have begun to echo their discontent openly, and the mood within our realm has shifted toward something dangerously close to defiance.\n\nWe must decide how to answer this unrest before it takes further root. We may denounce the deserters and make an example of those who falter, reminding all who serve that duty permits no retreat. Or we may hold the line through sheer force of will, accepting the cost of continued commitment and demanding the same of those around us."
 italian_wars.22.a: "Cowards and traitors, every last one."
 italian_wars.22.b: "Not one step back. We hold."

 italian_wars.23.title: "The Turncoat General" # The Turncoat General
 italian_wars.23.desc: "[target_character2.GetName], commander of [target_army.GetName], has made troubling overtures toward foreign powers. Word has reached us that [target_character2.GetShortNameWithNoTooltip] may be entertaining the promises of our enemies, and [target_character2.GetHerHis] conduct on the campaign trail has done little to dispel our suspicions.\n\n[target_character1.GetName] must act before this treachery becomes open defection."
 italian_wars.23.a: "Good riddance, traitor!"
 italian_wars.23.b: "[target_character2.GetHerHis|U] loyalty has a price. We will pay it."
 italian_wars.23.c: "[ROOT.GetCountry.GetGovernment.GetRulerOrRegent.GetShortNameWithNoTooltip] will put [target_character2.GetShortNameWithNoTooltip] in [target_character2.GetHerHis] place."
 target_character2_wont_attempt_to_flee_for_10_years_tt: "[target_character2.GetShortNameWithNoTooltip] will not attempt to flee for #Y 10#! years"

 italian_wars.24.title: "A Discord Among Allies" # Relations Deteriorate
 italian_wars.24.desc: "Within the [target_io.GetNameWithNoTooltip], tensions between our [ROOT.GetCountry.GetGovernment.GetCourtTitle] and [target_country.GetName] have come to a head. What began as a minor disagreement has festered into open discord, and [target_country.GetName] now openly questions our commitment to the League's shared cause.\n\nA fractured alliance serves no one but the foreign powers who watch our every move. We may seek to repair this breach through careful diplomacy, or stand firm and let the consequences fall where they may. Either way, we must act before this discord spreads further through the ranks of [target_io.GetNameWithNoTooltip]."
 italian_wars.24.a: "We will extend an olive branch."
 italian_wars.24.b: "Their grievances are no concern of ours."
 ruler_or_regent_skillful_diplomacy_saves_the_day: "The skillful and diplomatic nature of [ROOT.GetCountry.GetGovernment.GetRulerOrRegent.GetShortName] alleviates the situation"

 italian_wars.25.title: "A Kinship in Arms" # Relations Flourish
 italian_wars.25.desc: "Amid the strife that grips the [target_io.GetName], our [ROOT.GetCountry.GetGovernment.GetCourtTitle] and [target_country.GetName] have found unexpected common ground. Shared hardship and a common enemy have done what years of diplomacy alone could not, binding our two peoples together in a way that goes beyond mere alliance.\n\nThis growing rapport is a rare thing in times of war, and one that ought not be wasted. We may choose to formalize this understanding and strengthen the bonds between our courts, or keep our counsel and tend to more pressing matters. The choice will shape how [target_country.GetNameWithNoTooltip] regards us in the years to come."
 italian_wars.25.a: "We will strengthen these ties."
 italian_wars.25.b: "We have more pressing concerns."
 good_relations_will_help_keep_em_in_league_tt: "Good relations between our [countries|e] may help keep them in our League"

 italian_wars.26.title: "An Insult Unanswered" # Diplomatic Incident
 italian_wars.26.desc: "[target_character.GetName] of [target_country.GetName] has caused a considerable affront before the assembled representatives of both Leagues. Their words questioned our leadership of the [our_io.GetName] and our standing among the powers of [ShowRegionNameWithNoTooltip('italy_region')], and such an accusation cannot easily be set aside.\n\nTo leave this unanswered would only embolden [target_character.GetShortNameWithNoTooltip] and invite further impertinence from other quarters. We may press the matter and demand a reckoning, though doing so risks an escalation neither League may be prepared for. The alternative is to swallow the insult for now and bide our time."
 italian_wars.26.a: "We will not suffer this insult."
 italian_wars.26.b: "A reckoning will come, but not today."

 italian_wars.27.title: "Lessons of War" # Military Advancements
 italian_wars.27.desc: "The unrelenting campaigns across [ShowRegionName('italy_region')] have yielded more than blood and ruin. Our officers and scholars have returned with hard-won knowledge, forged in the crucible of open battle and drawn from the methods of our adversaries. New ideas have taken root in our [ROOT.GetCountry.GetGovernment.GetCourtTitle], and the question now is how best to make use of them.\n\nWe may commit to a sustained study of what the wars have taught us, investing in the refinement of our craft and doctrine. Alternatively, we may put this knowledge to immediate use on the ground, directing it where it can yield tangible results for our armies and our lands."
 italian_wars.27.a: "Let us deepen what we have learned."
 italian_wars.27.b: "Our armies need results, not theory."

 italian_wars.28.title: "The Engineer from [target_location.GetNameWithNoTooltip]" 
 italian_wars.28.desc: "An engineer of considerable reputation has made [new_character.GetHerHis] way to our [ROOT.GetCountry.GetGovernment.GetCourtTitle], bearing letters of introduction and detailed designs for new siege works. [new_character.GetName], hailing from [target_location.GetName], is one of several brilliant minds drawn to the $italian_group$ theater, where the wars have pushed military engineering to new limits. [new_character.GetHerHis|U] knowledge, if applied, could give our forces a decisive edge in breaching enemy walls.\n\n[new_character.GetHerHis|U] services do not come cheaply, and [new_character.GetSheHe] makes no secret of it. Still, few opportunities of this kind present themselves in a lifetime of campaigning."
 italian_wars.28.a: "Pay [new_character.GetHerHis] fee. A good engineer is worth every coin."
 italian_wars.28.b: "We cannot afford this right now. Send [new_character.GetHerHim] away."
 iw28_no_engineer_for_years_tt: "With the engineer dismissed, word will spread in these circles and thus it may be some time before another of [new_character.GetHerHis] caliber seeks us out"
 engineer_boosts_short_term_research_tt: "The engineer's methods open new avenues of investigation for our scholars, yielding immediate advances in our research"
 engineer_boosts_literacy_efforts_tt: "Exposure to the engineer's technical writings and diagrams encourages a broader appetite for learning across our educated classes"


 italian_wars.4.title: "Invitation to a League"
 italian_wars.4.desc: "Tensions are rising in our region, and the reality of war has become all too grim for our people. In a response to the onslaught of terror brought about by foreign invaders, [actor.GetName] has elected to found the [target_io.GetName]. They have since extended an invitation to us, a matter of utmost diplomatic importance..."
 italian_wars.4.a: "We accept!"
 italian_wars.4.b: "We cannot risk our neutrality."
 italian_wars.4.c: "We are loyal to [target_country.GetNameWithNoTooltip]!"

 italian_wars.9.title: "Aid from [actor.GetNameWithNoTooltip]"
 italian_wars.9.desc: "A messenger from [actor.GetName] has made his way to our court, bringing news of their aid towards our ongoing defensive war. They seem concerned about the balance of power and as such they seemed willing to aid us."
 italian_wars.9.a: "We align against a common foe, for now..."

 italian_wars.10.title: "Balancing the Scales"
 italian_wars.10.desc: "The ongoing war that plagues the lands of [target.GetName] threatens the balance of power in [ShowRegionName('italy_region')]. We cannot allow another League to set up a stronghold in the region, at our expense. As such, we have decided to send aid to the [target.GetLongNameWithNoTooltip], to bolster their cause of defending their lands from our foes."
 italian_wars.10.a: "Send them men for their armies."
 italian_wars.10.b: "They will receive valuable coin."

 italian_wars.11.title: "Point of No Return"
 italian_wars.11.desc: "The tension gripping [ShowRegionName('italy_region')] has reached its breaking point. The last truces holding the warring Leagues apart have been rendered null, cast aside in the heat of the moment. [target_character.GetName] and the rival League leaders have abandoned all pretense of peace. The stage is set for open and all-consuming war."
 italian_wars.11.a: "There can be no compromise, no surrender."
 all_leaders_of_leagues_annul_all_truces_tt: "Every League [international_organization_leader|e] has annulled their truces with countries in [ShowRegionName('italy_region')] as well as one another"
 as_long_as_90_tension_foreign_leaders_can_call_in_league_members_offensively_tt: "As long as [situation_tension|e] remains at #Y 90#! or above, Foreign League leaders may call upon their [members|e] to join offensive wars against any [country|e] in [ShowRegionName('italy_region')]"

 italian_wars.100.title: "The End of the $italian_group$ Wars"
 italian_wars.100.desc: "Decades of struggle and the unending strife to protect our region has come to an end under our mighty League. The shadow of foreign invaders no longer plagues our borders as our people look to the future, carving a prosperous route to the ages!"
 italian_wars.100.a: "Fortius quo fidelius!"
 italian_wars.100.b: "Our sovereignty is unquestionable!"
 demand_vassalization_from_members_tt: "As the victorious League leader, we will demand vassalization from our fellow members"
 league_locations_owned_desc: "Locations owned by our League"
 iw_send_aid_tt: "We will choose to assist the selected [country|e] through a token of [manpower|e] or [gold|e]"

 italian_wars.200.desc: "The long-awaited conclusion to the $italian_group$ Wars has come to an end. With the dissolution of all foreign leagues that sought to subjugate our lands, peace, and prosperity have returned to our peninsula. The way is paved for our own ascension as the true masters of [ShowRegionName('italy_region')]."
 italian_wars.200.a: "The era of [target_country.GetNameWithNoTooltip] has just begun!"
 italian_wars.200.desc_foreign: "Despite our armies marching deep into [ShowRegionName('italy_region')], the $italian_group$ Leagues have stood firm and repelled our forces. Our ambitions on the peninsula go unrealized, and we must accept this bitter defeat."
 italian_wars.200.b: "We will not forget this humiliation."

 italian_wars.300.title: "[target_io.GetNameWithNoTooltip]'s Victory in [ShowRegionNameWithNoTooltip('italy_region')]"
 italian_wars.300.desc: "Despite fierce and unyielding resistance for decades, [ShowRegionName('italy_region')] now lies firmly and largely under our grasp. Those who sought to interfere with our plans, now cower behind tall walls, fleeing the marching of our great armies. Today marks a new age of the region and our unquestionable claim upon it!"
 italian_wars.300.a: "Long live [target_character.GetNameWithNoTooltip]!"

 italian_wars.301.desc: "The $italian_group$ Wars have drawn to a bitter close. A foreign power has asserted its dominance over [ShowRegionName('italy_region')]. Despite our efforts, we could not prevent this outcome — we must now adapt to the new order that has taken hold of the peninsula."
 italian_wars.301.a: "We must accept this defeat."

 italian_wars.400.title: "[ShowCultureGroupNameWithNoTooltip('italian_group')] Stalemate"
 italian_wars.400.desc: "Despite our best efforts to move the needle during the unfolding situation of the [ShowSituationName('italian_wars')], it seems that the states within it, as well as any outsider foreign invaders, have failed to unify the region or even substantially enforce their influence..."
 italian_wars.400.a: "War, what is it good for?"
 end_the_italian_wars_stalemate_tt: "The [ShowSituationNameWithNoTooltip('italian_wars')] will end in a stalemate..."
 non_princes_become_princes_tt: "Non-[GetUniqueInternationalOrganization('hre').GetMemberTitle] [countries|e] in the [ShowSpecialStatusName('hre_foreign_league_member')] will become [members|e] of the [GetUniqueInternationalOrganization('hre').GetName]"
