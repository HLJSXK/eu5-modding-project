l_english:
 flavor_luc.1.entry: "$flavor_luc.1.title$"
 flavor_luc.1.title: "The [ShowGoodsNameWithNoTooltip('silk')] Production of [ShowLocationNameWithNoTooltip('lucca')]"
 flavor_luc.1.desc: "[ShowGoodsName('silk')] is regarded as one of the rarest resources in [ShowContinentName('europe')], and is thus seen by many [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] as the finest material for clothing. [ShowLocationName('lucca')] is already home to both silkworms and a fledgling [ShowGoodsNameWithNoTooltip('silk')] industry, though production has yet to meet its full potential. Both the [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] and [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] agree that investment in this good will allow us to expand our [ShowGoodsName('fine_cloth')] production, eclipsing any in [ShowRegionName('italy_region')] who may try and compete with us."
 flavor_luc.1.a: "We shall invest in these silkworms."
 flavor_luc.1.b: "If they want profit, they will have to chase it by themselves."

 flavor_luc.2.entry: "$flavor_luc.2.title$"
 flavor_luc.2.title: "[ShowGoodsNameWithNoTooltip('fine_cloth')] Trading of [ShowLocationNameWithNoTooltip('lucca')]"
 flavor_luc.2.desc: "[ShowLocationName('lucca')] boasts a prominent [ShowGoodsName('fine_cloth')] industry. There are many other cities in [ShowRegionName('italy_region')] who dwarf us in terms of production quantity, but they are unable to match the superb quality of our cloth, produced by the finest of burghers with years of experience in the craft. Even the wealthiest of people see [ROOT.GetCountry.GetAdjective]-style clothing as a luxury, a fact that has led to increased production to meet the demand."
 flavor_luc.2.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 flavor_luc.2.a.entry: "Great!"
 luc_fine_cloth_demand: "Fine Cloth Demand"

 flavor_luc.3.entry: "$flavor_luc.3.title$"
 flavor_luc.3.title: "Reaching [ShowLocationNameWithNoTooltip('london')]"
 flavor_luc.3.desc: "The more opportunistic members of our [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] have conceived of an expansion in the [target_market.GetName]. Specifically, many have already made plans to move to [ShowLocationName('london')], which is owned by [target_country.GetName], and is friendly towards us.\n\nThis proposal was brought before the [ROOT.GetCountry.GetGovernment.GetCourtTitle], with some members enthusiastic about expanding our trade network. Others, however, have pointed out that it might create distrust with [target_country.GetNameWithNoTooltip], that foreign merchants may not be seen favorably, and that pursuing cooperation with them would serve us better than competition."
 flavor_luc.3.a: "We will expand our trade network."
 flavor_luc.3.b: "Rather than compete, we should cooperate."

 flavor_luc.4.entry: "$flavor_luc.4.title$"
 flavor_luc.4.title: "Libertas!"
 flavor_luc.4.desc: "Throughout the history of [ROOT.GetCountry.GetName], our people have experienced many defeats and humiliations. Yet, despite everything, we remain unshakeable.\n\nTo lie down and accept defeat is not something that [ROOT.GetCountry.GetAdjectiveWithNoTooltip] citizens do. Instead, when a crisis appears or our armies are defeated in battle, we stand ready to defend [ShowLocationName('lucca')]."
 flavor_luc.4.a: "We will never show fear, no matter the odds!"
 flavor_luc.4.b: "The best defense is a great offense."

 flavor_luc.5.entry: "$flavor_luc.5.title$"
 flavor_luc.5.title: "The [ShowBuildingTypeNameWithNoTooltip('walls_of_lucca')]"
 flavor_luc.5.desc: "War and famine may not always reach [ShowLocationName('lucca')], but when they do, every citizen suffers. The watch on the walls are always on the lookout for enemies, knowing that should defeat come, their home will be in danger. Many in the [ROOT.GetCountry.GetGovernment.GetCourtTitle] have proposed expanding the walls, making them as grand as possible to gain the confidence of the people and ensure the safety of every citizen."
 flavor_luc.5.a: "We will expand the walls."
 flavor_luc.5.b: "We should ensure that military defeat never comes."

 flavor_luc.1000.entry: "$flavor_luc.1000.title$"
 flavor_luc.1000.title: "Purchase of [GetCountry('LUC').GetNameWithNoTooltip]"
 flavor_luc.1000.desc: "The war that [target_country.GetName] is currently fighting has given us an opportunity to change who we serve, should we wish to. Rather than accomplishing that through military means, many in the [ROOT.GetCountry.GetGovernment.GetCourtTitle] have suggested that we could be sold to [GetCountry('PIS').GetName], both for monetary gain and as a show of good faith."
 flavor_luc.1000.a: "Let us propose this to [target_country.GetNameWithNoTooltip]."
 flavor_luc.1000.a.entry: "Let us propose this to our overlords."
 flavor_luc.1000.b: "If we are to gain independence, it will have to be through war."

 flavor_luc.1001.title: "$flavor_luc.1000.title$"
 flavor_luc.1001.desc: "With the war against [enemy_country.GetName] raging, diplomats from [GetCountry('LUC').GetName] have arrived. They speak of the state of the war, and of how [GetCountry('PIS').GetName] have been preparing their troops for a military intervention against us. To forestall this, they have offered [GetCountry('LUC').GetNameWithNoTooltip] itself as payment for peace — and for their own financial advantage."
 flavor_luc.1001.a: "We should not risk another enemy in [ShowRegionNameWithNoTooltip('italy_region')]."
 flavor_luc.1001.b: "Our subjects are not up for sale."

 flavor_luc.1002.title: "$flavor_luc.1000.title$"
 flavor_luc.1002.desc: "[target_country.GetName] has approached us with a special offer. They wish to sell their subject [GetCountry('LUC').GetName] to us, and in return we will establish a truce with them and not intervene in their current conflict against [enemy_country.GetName]."
 flavor_luc.1002.a: "A worthwhile deal."
 flavor_luc.1002.b: "Why buy something we can get through military effort?"

 flavor_luc.1100.entry: "$flavor_luc.1100.title$"
 flavor_luc.1100.title: "A Beneficial Alliance"
 flavor_luc.1100.desc: "Our current position in [ShowRegionName('italy_region')] is stable, but external threats may arise if we are not careful enough. For that reason, many in the [ROOT.GetCountry.GetGovernment.GetCourtTitle] suggest that we seek an alliance with [GetCountry('GEN').GetName]. Both parties will benefit from this, ensuring that anyone who tries to conquer the region will have to fight a bigger, more unified opponent."
 flavor_luc.1100.a: "An alliance like that would be ideal."
 flavor_luc.1100.b: "We should try to secure our borders through expansion instead."

 flavor_luc.1101.title: "$flavor_luc.1100.title$"
 flavor_luc.1101.desc: "Current tensions across [ShowRegionName('italy_region')] have led many states to fend off enemies alone, but that does not mean we should remain separate. It is for that exact reason that diplomats from [from_country.GetName] have approached us about a potential alliance. Both [target_character.GetName] and [target_character2.GetName] will be able to ensure their sovereignty, perhaps even aiding one another in expelling threats from outside the region."
 flavor_luc.1101.a: "It is certainly something that would help both of us."
 flavor_luc.1101.b: "They are not worth helping. We could instead look to conquer them..."