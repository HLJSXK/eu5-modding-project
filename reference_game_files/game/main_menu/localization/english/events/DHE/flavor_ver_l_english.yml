l_english:
 VER_benefits_from_winning_the_war: "In the [target_war.GetName], the [ShowPeaceTreatyTypeName('scaligeri_victory')] [peace_offer|e] will be available to us"
 ver_remove_antagonism: "[THIS.GetCountry.GetName] will have their [antagonism|e] from [peace_treaty|e] demands removed from all [countries|e]"
 ver_add_integration_in_every_location: "Every [owned|e] [location|e] in [ShowScriptedGeographyName('scaligeri_conquests_geography')] will receive #G +100.0%#! [integration|e]"
 SCALIGER_WAR_NAME: "Scaliger War"

 ver_demands_start: "We will request"
 ver_demands_end: "as part of the peace deal in the [target_war.GetName]" 
 ver_demands_FLO_pescia_demand: "$ver_demands_start$ [ShowLocationName('pescia')] $ver_demands_end$"
 ver_demands_FLO_lucca_demand: "$ver_demands_start$ [ShowProvinceDefinitionName('lucca_province')] $ver_demands_end$"
 ver_demands_VEN_mestre_demand: "$ver_demands_start$ [ShowLocationName('mestre')] $ver_demands_end$"
 ver_demands_VEN_treviso_demand: "$ver_demands_start$ [ShowProvinceDefinitionName('venice_province')] $ver_demands_end$"
 ver_demands_MLO_brescia_demand: "$ver_demands_start$ [ShowProvinceDefinitionName('brescia_province')] $ver_demands_end$"
 ver_demands_MLO_parma_demand: "$ver_demands_start$ [ShowProvinceDefinitionName('parma_province')] $ver_demands_end$"

 ver_effect_depends_on_scope: "The effects of this [peace_treaty|e] will depend on option chosen in an [event|e]"
 VER_benefits_for_coalition_members: "The attackers in the [target_war.GetName] will receive [events|e] to stake their claims on various border territories; taking territories through other means is disabled"
 VER_cannot_take_territory_besides_scripted_peace_deal: "Territory must be taken via special peace treaties, made available as the Scaliger War continues via [events|e]"

 scaligeri_war_historical_info: "The Scaliger War started in the middle of 1336 as a result of Scaliger-Venetian frictions. The genesis of the conflict was the Veronese installation of chains to levy tolls, which directly threatened the commerce of the Serene Republic. Though negotiations were conducted to resolve the issue amicably, the Venetian senate hardened their position, halting salt exports and leading the Scaliger Padua to create their own saltworks. The conflict finally started on the 22nd of June, when Florence and Venice signed an agreement in which the former would cover two-thirds of the cost of the war."


 flavor_ver.1.title: "[target_war.GetNameWithNoTooltip]"
 flavor_ver.1.desc: "The domains of the [target_dynasty.GetName], built with the blood and sweat of our dear [target_character.GetName], have in recent years become the target of a grand coalition of puny states from northern [ShowRegionName('italy_region')]. Originally composed of only the [GetCountry('VEN').GetLongName] and the [GetCountry('FLO').GetLongName], our recent bid for peace has been betrayed by our arbitrators, who have chosen to side with our foes. No matter — they, too, will be severely punished for their transgressions."
 flavor_ver.1.historical_info: "$scaligeri_war_historical_info$"
 flavor_ver.1.a: "We will cull the weak."

 flavor_ver.2.title: "[target_war.GetNameWithNoTooltip]"
 flavor_ver.2.desc: "The belligerent [target_dynasty.GetName] house has become the target of a grand coalition led by the [anti_scaligeri_leader.GetLongName]. We find ourselves on the verge of turning the tide in this [target_war.GetName], but we need the help of our new allies to succeed. With the [mlo_participant.GetAdjective] [mlo_army.GetName] mobilizing on the border with [target_ver.GetName], the [flo_participant.GetLongName] sponsoring the war, and our army led by [target_character.GetName], the [target_ver.GetAdjectiveWithNoTooltip] foe will soon be vanquished, and [ShowRegionName('italy_region')] will return to peace once more."
 flavor_ver.2.historical_info: "$scaligeri_war_historical_info$"
 flavor_ver.2.a: "The Scaligeri devil will be purged!"

 ver_owner_is_an_defender: "The [owner|e] of [THIS.GetLocation.GetName] is a country that is a [defender|e] in [target_war.GetName]"
 ver_controller_is_an_attacker: "The [controller|e] of [THIS.GetLocation.GetName] is a country that is an [attacker|e] in [target_war.GetName]"

 flavor_ver.3.title: "Our Claims to [target_province.GetNameWithNoTooltip]"
 flavor_ver.3.desc: "The [target_war.GetName] against the [target_dynasty.GetName] in [target_country.GetName] is progressing smoothly. Our forces have recently managed to take control of [target_province.GetName], a province well in the sphere of influence of the [ROOT.GetCountry.GetGovernment.GetRulerOrRegent.GetDynasty.GetName] of [ROOT.GetCountry.GetName]. Perhaps we should stake our claim to that territory to let our allies in [war_leader.GetName] know what we desire of the [target_dynasty.GetNameWithNoTooltip] domains."
 flavor_ver.3.entry: "$MLO_ADJ$ Claims in Scaliger War"
 flavor_ver.3.a: "Stake a claim."
 flavor_ver.3.b: "What about [ShowProvinceDefinitionNameWithNoTooltip('parma_province')] instead?"
 
 flavor_ver.4.title: "Our Claims to [target_location.GetNameWithNoTooltip]"
 flavor_ver.4.desc: "We are witnessing the fall of the [target_dynasty.GetName] hegemony in northern [ShowRegionName('italy_region')] through the efforts of us and our allies. With the success of the war, the [ROOT.GetCountry.GetLongName], which was obliged to pay two-thirds of the costs back in 1336, shall stake their interests in this war. And as for our interests? We shall look no further than the Scaliger [target_country.GetName] — a state that has long defied the overlordship of [ShowLocationName('florence')]."
 flavor_ver.4.entry: "$FLO_ADJ$ Claims in Scaliger War"
 flavor_ver.4.a: "Lay claim to [ShowLocationNameWithNoTooltip('pescia')]."
 flavor_ver.4.b: "The entire [target_country.GetCapital.GetRank.GetNameWithNoTooltip] belongs to us!"
 flavor_ver.4.b.entry: "The entire city belongs to us!"
 
 flavor_ver.5.title: "Our Claims to [target_province.GetNameWithNoTooltip]"
 flavor_ver.5.desc: "War does not pay... or does it?\n\nDespite the blood and toil, the [target_war.GetName] is slowly beginning to finally show some promise in terms of tangibly benefitting us. The official purpose of this war may be to dismantle the [target_dynasty.GetName] state, but in doing so, we stand to gain territories that they claimed through their own bloody wars. A potential avenue of expansion could be [target_location.GetName] and greater [target_province.GetName] province, territories that culturally fit into the [ROOT.GetCountry.GetFlavorRank]."
 flavor_ver.5.entry: "$VEN_ADJ$ Claims in Scaliger War"
 flavor_ver.5.a: "[target_location.GetNameWithNoTooltip] shall be ours!"
 flavor_ver.5.a.entry: "Mestre shall be ours!"
 flavor_ver.5.b: "[target_province.GetNameWithNoTooltip] will be the base of the #italic Terraferma#!."
 flavor_ver.5.b.entry: "Veronese Veneto will be the base of the #italic Terraferma#!."
 
 flavor_ver.6.title: "Claims of [from_country.GetNameWithNoTooltip]"
 flavor_ver.6.desc: "A herald has arrived from the [from_country.GetLongName] informing us of their demands against the [target_dynasty.GetName] of [war_enemy.GetName]. We had better consider the [target_peace_treaty.GetName] while working on the peace terms of the [target_war.GetName], or else the [from_country.GetAdjectiveWithNoTooltip] envoys will consider it a broken promise."
 flavor_ver.6.a: "We will humor their requests in due time."

 ver_peace_treaty_has_become_available: "[target_peace_treaty.GetName] has become available in [target_war.GetName]"

 flavor_ver.7.title: "Our Triumph"
 flavor_ver.7.desc: "At last, after years of bloody conflict, the $SCALIGER_WAR_NAME$ has come to an end. Today, the [ROOT.GetCountry.GetAdjective] forces triumph in [target_location.GetName], for our foes have been defeated. This war was not just a war for superiority over North [ShowRegionName('italy_region')] — it was also a fight for the honor of [target_character.GetName], the founder of what is now known as the [ROOT.GetCountry.GetLongName]. It is [target_character.GetHerHis] legacy that we have defended."
 flavor_ver.7.a: "Glory to the [target_dynasty.GetNameWithNoTooltip]!"
 
 flavor_ver.8.title: "Victory of the League"
 flavor_ver.8.desc: "The fate of the [target_dynasty.GetName] aggressors is finally sealed — the Scaligeri devil has been defeated, and the domains of [target_character.GetName] are now in shambles. No longer will northern [ShowRegionName('italy_region')] be dominated by a single tyrant. This is sure to be remembered as one of the most pivotal moments in the history of [ROOT.GetCountry.GetName]!"
 flavor_ver.8.a: "Good riddance!" 

 flavor_ver.1000.title: "A Relative of [target_character2.GetNameWithNoTooltip]"
 flavor_ver.1000.desc: "The ousted ruler of [target_country.GetName] and relative of [target_character2.GetName], [target_character.GetName], remains in a position of power in the [target_country.GetCapital.GetRankAndName] as a vicar. Though nominally loyal to the [target_dynasty.GetName], [target_character.GetShortNameWithNoTooltip] remains popular in [target_character.GetHisHer] old domain, certainly bitter about the Scaliger transgressions against the [target_character.GetDynasty.GetName]. We also know of [target_character.GetHerHis] soft spot for our dear [target_character2.GetShortNameWithNoTooltip], a condottiero in our employ. If we were to lay siege to [target_character.GetHerHis] [target_country.GetCapital.GetRank.GetName], [target_character.GetSheHe] would surely defect."
 flavor_ver.1000.a: "Delightfully devilish..."

 ver_padua_incident_rules: "If [ShowLocationName('padova')] is occupied before #W 1339.1.1#!, [target_country.GetName] will change sides in the [target_war.GetName] and become independent"

 flavor_ver.1001.title: "Potential Betrayal?"
 flavor_ver.1001.desc: "Our spies in [target_location.GetName] report of possible enemy negotiations taking place right under our noses: Someone in the [target_country.GetLongName] is exchanging letters with our foes in the [target_war.GetName]. It seems we can no longer be so sure about [target_country.GetAdjective] loyalty in the long term. In the meantime, we have dispatched our agents to find the perpetrator — but whether they will be able to find them in time remains to be seen."
 flavor_ver.1001.desc_pad: "Our spies in our capital report of possible enemy negotiations taking place right under our noses: Someone is exchanging letters with our foes in the [target_war.GetName]. If nothing is done, [target_location.GetName] might be threatened by an attack from within! In the meantime, we have dispatched our agents to find the perpetrator — but whether they will be able to find them in time remains to be seen."
 flavor_ver.1001.a: "We must root out the rot!" 

 flavor_ver.1002.title: "Conspirator Found!"
 flavor_ver.1002.entry: "$flavor_ver.1002.title$"
 flavor_ver.1002.desc: "[target_character.GetName] has been dragged before the [target_character2.GetName] and charged with conspiring with the foes of the [target_dynasty.GetName]. For months, [target_character.GetShortNameWithNoTooltip] has been exchanging letters with our enemies in the [target_war.GetName]. The reason for all of this? Resentment stemming from [target_character.GetHerHis] deposition a decade ago."
 flavor_ver.1002.a: "Death!"

 flavor_ver.1003.title: "Gates Opened!"
 flavor_ver.1003.desc: "In the final moments of the siege, [target_character.GetName], our ally in [target_location.GetName], commanded the garrison to fight off a diversion at one of the gates while opening the [target_location.GetRank.GetName] to us at the other. The location was taken and [target_character.GetNameWithNoTooltip] was pronounced the ruler of [target_country.GetName], to much fanfare from the local [target_estate.GetName]. This marks a significant shift in the [target_war.GetName], for the [target_dynasty.GetName] has just lost one of its precious domains."
 flavor_ver.1003.a: "On to more victories like this!"

 flavor_ver.1004.title: "Death Throes of Our Ally"
 flavor_ver.1004.desc: "Terrible news has reached us! Our ally [target_character.GetName] in [target_country.GetName], its former ruler, has been discovered by the [target_dynasty.GetName] to have been secretly colluding with us. [target_character.GetShortNameWithNoTooltip] was violently seized by the [target_country2.GetAdjective] soldiers and taken before [target_character2.GetName], where [target_character.GetSheHe] was duly sentenced to death."
 flavor_ver.1004.a: "We have lost a great ally."

 flavor_ver.1005.title: "Fall of [ShowLocationNameWithNoTooltip('padova')]"
 flavor_ver.1005.desc: "The conspirator in [target_country.GetName] turned out to have been [target_character.GetName] all along! This bastard who [target_character2.GetName] deposed a decade or so ago has, despite [target_character.GetHerHis] vicariate, long harbored a grudge against the [target_dynasty.GetName]. Now [target_character.GetSheHe] has finally managed to exact [target_character.GetHerHis] vengeance, having given up the [target_location.GetRank.GetName] to our foes and taken control of [target_country.GetNameWithNoTooltip]."
 flavor_ver.1005.a: "With [target_country.GetNameWithNoTooltip] or not, we will prevail."
 ver_will_join_target_war: "[THIS.GetCountry.GetName] will join [target_war.GetName] on the side of the attackers"