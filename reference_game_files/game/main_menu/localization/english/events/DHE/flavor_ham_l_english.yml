l_english:
 flavor_ham.1.title: "The Berenberg Bank"
 flavor_ham.1.entry: "$flavor_ham.1.title$"
 flavor_ham.1.desc: "Many merchants and financiers have made their way to our [ROOT.GetCountry.GetFlavorRank] attracted by the wealth that flows through our lands. Among them are the [GetDynasty('berenberg_dynasty').GetName], skilled in the art of commerce and finance, who wish to establish a private banking house in [berenberg_bank_hq.GetName]. Such an institution could prove invaluable in managing trade credits and facilitating the exchange of goods across the North Sea."
 flavor_ham.1.historical_info: "Founded in 1590 by Hans and Paul Berenberg, Flemish merchants who had fled the Spanish reconquest of Antwerp, the #italic Berenberg Bank#! is one of the oldest merchant banks in the world still operating today. Based in Hamburg, it thrived as a private family enterprise financing trade across northern Europe, remained in private hands and growing through careful management of merchant credit and investment."
 flavor_ham.1.a: "We welcome all skilled merchants."
 flavor_ham.1.b: "Let us see what they can achieve!"

 flavor_ham.2.title: "$flavor_ham.1.title$"
 flavor_ham.2.desc: "We have established our banking house in the great [berenberg_bank_hq.GetRank.GetName] of [berenberg_bank_hq.GetName]. With our connections to merchants across northern Europe and beyond, we stand ready to make ourselves indispensable to the commerce of this region."
 flavor_ham.2.a: "Our wealth grows with every transaction."

 flavor_ham.3.title: "The Hamburger Bank"
 flavor_ham.3.entry: "$flavor_ham.3.title$"
 flavor_ham.3.desc: "The ever-growing volume of trade passing through [hamburger_bank_hq.GetName] has revealed the need for a stable, reliable public exchange bank that can guarantee the value of currencies and facilitate large commercial transactions. Modeled on the success of similar institutions, a public bank in [hamburger_bank_hq.GetNameWithNoTooltip] would provide a secure foundation for our financial prosperity."
 flavor_ham.3.historical_info: "The #italic Hamburger Bank#! was established in 1619 in the free city of Hamburg, closely modeled after the Bank of Amsterdam founded a decade earlier. It served as a public exchange bank, accepting deposits and handling international payments in a reliable bank currency. It was one of the most important financial institutions in northern Europe for over two centuries, until it was absorbed by the Reichsbank in 1875."
 flavor_ham.3.a: "The bank will serve our interests."
 flavor_ham.3.b: "Let us swim in money!"

 flavor_ham.4.title: "$flavor_ham.3.title$"
 flavor_ham.4.desc: "We have been appointed to manage the finances of our patrons and their trading partners. The prosperity of the northern seas is ours to steward, and we shall not waste the opportunity."
 flavor_ham.4.a: "$flavor_ham.3.b$"
