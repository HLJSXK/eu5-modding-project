l_english:
 unlocked_advance_marble_tradition_tt: "Has had the $flavor_sie.1.title$ [dynamic_historical_event|e]"
 flavor_sie.1.title: "Banca Monte dei Paschi"
 flavor_sie.1.entry: "$flavor_sie.1.title$"
 flavor_sie.1.desc: "Mounts of Piety, or #italic Monte di Pietà#! are becoming increasingly common in our country and around us. They are charitable institutions, using funds from donors to allow less fortunate people access to low-interest loans. Funding one of such organizations in [monte_paschi_bank_hq.GetName] will serve to increase the wealth and general prosperity of our [ROOT.GetCountry.GetFlavorRank], and serve as our national bank."
 flavor_sie.1.a: "The money will flow."
 flavor_sie.1.b: "A pious organization indeed!"
 flavor_sie.1.historical_info: "#italic La Banca Monte dei Paschi di Siena#! was born in the Republic of Siena in 1472, and it has the status of being the oldest bank in the world in continuous operation. Starting as a Mount of Piety, it got its modern form with the Grand Duchy of Tuscany, and after the unification of Italy it expanded its presence for the whole of the peninsula."

 flavor_sie.2.title: "$flavor_sie.1.title$"
 flavor_sie.2.desc: "Mounts of Piety are charitable organizations intended to help the less favored. However, that our origins are those does not mean that we cannot expect to profit from such and other operations, and enrich ourselves in the process."
 flavor_sie.2.a: "Money shall be ours!"

 flavor_sie.3.entry: "$flavor_sie.3.title$"
 flavor_sie.3.title: "The Golden Age of [ShowLocationNameWithNoTooltip('siena')]"
 flavor_sie.3.desc: "The expansion of [ROOT.GetCountry.GetAdjective] borders, along with many years of peace and prosperity, have led to a golden age in the [target_location.GetRank.GetName] of [target_location.GetName]. The streets bustle with work and celebration alike, ensuring a constant stream of wealth and abundance. None can imagine such prosperity ending — indeed, many wonder if this golden age will bless the people of [target_location.GetRank.GetNameWithNoTooltip] forever."
 flavor_sie.3.a: "This golden age will last forever!"
 sie_gain_modifier_until_the_black_death: "[ShowLocationName('siena')] will gain the [ShowModifier('sie_golden_age_of_siena')] [location_modifier|e] until the start of the [ShowSituationNameWithNoTooltip('black_death')] [situation|e]"

 flavor_sie.4.entry: "$flavor_sie.4.title$"
 flavor_sie.4.title: "Recovering From the [ShowSituationNameWithNoTooltip('black_death')]"
 flavor_sie.4.desc: "The Plague that swept through [ShowRegionName('italy_region')] and the rest of [ShowContinentName('europe')] has left [target_location.GetName] scarred. Its once vibrant streets now echo with the grim reminder that death has no favorites; how sinners and saints are judged equally when confronted with the Pale Rider. But rather than allow this ruin to continue, perhaps we could aid the people of [target_location.GetNameWithNoTooltip]."
 flavor_sie.4.a: "We will use our treasury to try and rebuild the [target_location.GetRank.GetNameWithNoTooltip]."
 flavor_sie.4.a.entry: "We will use our treasury to try and rebuild the location."
 sie_all_pops_lose_satisfaction: "All [pops|e] in [target_location.GetName] will lose [ShowNamedValue('pop_satisfaction_extreme_penalty')|+=2%] [pop_satisfaction|e]"
 flavor_sie.4.b: "The cycle of life and death is eternal and inescapable."

 flavor_sie.5.entry: "$flavor_sie.5.title$"
 flavor_sie.5.title: "Creating the Port of [ShowLocationNameWithNoTooltip('grosseto')]"
 flavor_sie.5.desc: "Our maritime presence along the coasts of [ShowRegionName('italy_region')] is in its infancy. Despite this, many of our [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] have been calling for [ROOT.GetCountry.GetName] to greatly expand its navy. One of the first locations they have chosen for this project is the recently-acquired [target_location.GetRank.GetName] of [target_location.GetName].\n\nMany new residents have made their homes in [target_location.GetNameWithNoTooltip] in the hopes that we notice the extent of its influence in our [ROOT.GetCountry.GetFlavorRank], and that we make the effort to properly establish a port there."
 flavor_sie.5.a: "We shall protect our maritime trade."
 flavor_sie.5.b: "We should try and focus on our land borders instead."

 flavor_sie.6.entry: "$flavor_sie.6.title$"
 flavor_sie.6.title: "Maritime Influence in [ShowLocationNameWithNoTooltip('pitigliano')]"
 flavor_sie.6.desc: "Our [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] have long lacked the resources to be truly competitive maritime traders in [ShowRegionName('italy_region')]. They are conspicuously lacking a network of ports to call their own in [target_location.GetMarket.GetName], but that does not mean we have no options.\n\nThe [target_location.GetRank.GetName] of [target_location.GetName] has attracted the attention of many of our [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')], who argue before the [ROOT.GetCountry.GetGovernment.GetCourtTitle] that investment should be made in expanding its port and turning it into a trading hub accessible to every merchant."
 flavor_sie.6.a: "Let us expand this port."
 flavor_sie.6.b: "We will not pour our entire treasury into fulfilling the requests of the [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')]."
 flavor_sie.6.b.entry: "We will not pour our entire treasury into fulfilling the requests of the wealthy."

 flavor_sie.7.entry: "$flavor_sie.7.title$"
 flavor_sie.7.title: "The Port of [ShowLocationNameWithNoTooltip('piombino')]"
 flavor_sie.7.desc: "Merchants, [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')], and [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')] have all been migrating to [target_location.GetName], a [target_location.GetRank.GetName] which has greatly attracted the attention of the [ROOT.GetCountry.GetGovernment.GetCourtTitle].\n\nAs expanding its port would strengthen our naval trade routes, many [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')] have approached [target_character.GetName] with the suggestion that we use funds from the national treasury to turn the [target_location.GetRank.GetNameWithNoTooltip] into one of the most prominent locations in all of [ShowRegionName('italy_region')]."
 flavor_sie.7.a: "To strengthen our trade, we will create this port."
 flavor_sie.7.b: "There is no need for more ports like that."
 
 flavor_sie.8.entry: "$flavor_sie.8.title$"
 flavor_sie.8.title: "The Return of an Exile"
 flavor_sie.8.desc: "There are many among the [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] who have influence over [ROOT.GetCountry.GetAdjective] politics, but none managed to match the power of the [GetDynasty('petrucci').GetName] family — at least, not until their exile over rumors of an attempted coup.\n\nDespite this, one of the [GetDynasty('petrucci').GetNameWithNoTooltip]'s members has returned to the birthplace of [target_character.GetHerHis] ancestors, the storied [target_capital.GetRank.GetName] of [target_capital.GetName]. Many among the common people welcome this [target_character.GetWomanMan], praising [target_character.GetHerHis] name and hoping [target_character.GetSheHe] will deliver them from the corruption of the current [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]. Others, however, fear a repeat of old ambitions, and have demanded that the [ROOT.GetCountry.GetGovernment.GetCourtTitle] expel the [target_character.GetWomanMan] before the [GetDynasty('petrucci').GetNameWithNoTooltip] attempt another coup."
 flavor_sie.8.a: "We do not fear the influence of a single individual."
 flavor_sie.8.b: "There are many excellent ways to keep someone in their place..."
 flavor_sie.8.c: "This family was exiled for a reason."
 sie_triumphant_return_means_possibility_of_coup: "With the return of [target_character.GetName] to [ROOT.GetCountry.GetName], [target_character.GetSheHe] will certainly try to seize power if [target_character.GetSheHe] becomes our [ruler|e]"

 flavor_sie.9.entry: "$flavor_sie.9.title$"
 flavor_sie.9.title: "Rise to Power"
 flavor_sie.9.desc: "Years ago, the [ROOT.GetCountry.GetLongName] was divided, with various families occupying different offices. This left our leadership fractured over almost every matter. Since the rise of [target_character.GetName], however, many of these positions have been filled with loyalists — either [target_character.GetHerHis] lackeys, or family members who fully support this shift in the balance of power.\n\nIn a meeting with the [ROOT.GetCountry.GetGovernment.GetCourtTitle], none dared speak against [target_character.GetHerHim], fearing that the influence [target_character.GetSheHe] held was enough to silence any political opponent.\n\nThis control over the [ROOT.GetCountry.GetFlavorRank] has now led to the ascendancy of the [target_character.GetDynasty.GetName] in [ROOT.GetCountry.GetNameWithNoTooltip]."
 flavor_sie.9.a: "One family to rule them all."

 flavor_sie.10.entry: "$flavor_sie.10.title$"
 flavor_sie.10.title: "Art Style of [ShowLocationNameWithNoTooltip('siena')]"
 flavor_sie.10.desc: "The [ShowInstitutionName('renaissance')] has greatly changed artistic styles throughout [ShowRegionName('italy_region')]. One of the most noteworthy developments is the [ROOT.GetCountry.GetAdjective] Style, which focuses on the mystic and religious aspects of expression. It directly rivals the more humanistic, expressionistic traditions from [ShowLocationName('florence')]. Many members of the [ROOT.GetCountry.GetGovernment.GetCourtTitle] see this as an opportunity to spread our culture across [ShowContinentName('europe')] and display our prestige to everyone."
 flavor_sie.10.a: "We will make [ShowLocationNameWithNoTooltip('siena')] the most prestigious of places!"
 flavor_sie.10.b: "We do not have the money for such ambitions."

 flavor_sie.11.entry: "$flavor_sie.11.title$"
 flavor_sie.11.title: "Expanding the School of [ShowLocationNameWithNoTooltip('siena')]"
 flavor_sie.11.desc: "The zenith of the [ShowInstitutionName('renaissance')] has completely reshaped the cultural identity of [ShowRegionName('italy_region')], leading many cities to adopt their own iconic artistic styles. Fortunately for the [ROOT.GetCountry.GetAdjective] tradition, a wave of new artists has emerged, enthusiastic about working in our style.\n\nOne of these is [target_character.GetName], a [target_character.GetWomanMan] who wishes to establish a more religiously-influenced aesthetic in [ShowLocationName('siena')]."
 flavor_sie.11.a: "We will accept new artists like [target_character.GetHerHim]."
 flavor_sie.11.a.entry: "We will accept new artists."
 flavor_sie.11.b: "Rather than embrace our current style, maybe we should look to others for inspiration."

 flavor_sie.12.entry: "$flavor_sie.12.title$"
 flavor_sie.12.title: "The Saint of [ShowLocationNameWithNoTooltip('siena')]"
 flavor_sie.12.desc: "Devoted only to [target_character.GetReligion.GetGodName], [target_character.GetName] is regarded by many citizens in [ShowLocationName('siena')] as the most pious person in [ShowRegionName('italy_region')], second only to the Pope.\n\nThe [ROOT.GetCountry.GetGovernment.GetCourtTitle] has taken notice of [target_character.GetHerHis] fervor and focus on theological authorship. The [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] see this as an opportunity to show the rest of the [ROOT.GetCountry.GetReligion.GetAdjective] world our devotion, while the [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')] see [target_character.GetHerHim] as a walking saint who will bring them prosperity."
 flavor_sie.12.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 flavor_sie.12.a.entry: "Great!"