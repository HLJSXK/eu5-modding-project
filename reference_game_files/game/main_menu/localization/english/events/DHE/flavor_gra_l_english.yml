l_english:
 flavor_gra.1.title: "Moorish Refugees"
 flavor_gra.1.desc: "In the name of Allāh, the Most Gracious, the Most Merciful. Granada has fallen to the infidels! The last jewel of al-'Andalus, a beacon of learning is now in Castilian hands. As the Islamic world reels from this loss, Moorish refugees flock to the Muslim cities and courts of North Africa and the Middle East, bringing with them knowledge, works by exceptional scholars like Abu al-Walid ibn Rushd, Abu al-Qasim al-Zahrawi and Abu Bakr ibn Tufail. Inviting these refugees to [ROOT.GetCountry.GetName] might provide an enormous boost to our own efforts in the fields of science and culture."
 flavor_gra.1.a: "By all means, invite them to [ROOT.GetCountry.GetNameWithNoTooltip]!"
 flavor_gra.1.a.entry: "By all means, invite them to us!"
 flavor_gra.1.b: "No, we do not need them."
 flavor_gra.2.title: "The Emirate of Sicily"
 flavor_gra.2.entry: "$flavor_gra.2.title$"
 flavor_gra.2.desc: "In ages past, the Emirate of Sicily was a stalwart bastion of our faith; holding strong until the crusaders conquered the island in 1087.\n\nNow that we are in possession of this coveted land, we will not be losing control of it again!"
 flavor_gra.2.a: "Absolute authority requires absolute rule."
 STATIC_MODIFIER_NAME_sicily_in_safe_hands: "Administrative Investments"
 STATIC_MODIFIER_NAME_DESC_sicily_in_safe_hands: "Sicily serves us better in our direct control - as such, we are able to invest more resources in coaxing the island to prosperity."

 flavor_gra.3.title: "Aid from [GetCountry('TUR').GetNameWithNoTooltip]"
 flavor_gra.3.entry: "Plea for Ottoman support"
 flavor_gra.3.desc: "As we are now in a war against [GetCountry('CAS').GetName] that may prove hopeless, we must send desperate pleas to the faithful across the sea for help. The [GetCountry('TUR').GetGovernment.GetRuler.GetDynasty.GetName] might come to our aid, if we can only endure the indignity of asking them!"
 flavor_gra.3.a: "They are our only hope!"
 flavor_gra.3.tt: "[GetCountry('TUR').GetNameWithNoTooltip|U] might defend us against [GetCountry('CAS').GetNameWithNoTooltip]"
 flavor_gra.3.b: "We must stand alone."
 flavor_gra.3.historical_info: "The Nasrid rulers of Granada sent envoys to both the Ottomans and the $mamluks$ to seek aid against Castile. The Ottomans had been increasing their presence in the Western Mediterranean, and Granada enthusiastically made plans for 200,000 Turkish troops to land in València to support them."

 flavor_gra.4.title: "A Disheartening Response"
 flavor_gra.4.entry: "$flavor_gra.4.title$"
 flavor_gra.4.desc: "We have received news from [GetCountry('TUR').GetName] that they will #italic not#! be coming to our aid. As much as they would wish to, they claim to have other pressing concerns, but in their letter, they eloquently praised the old glories of al-'Andalus - whatever that may be worth now."
 flavor_gra.4.a: "We must fight on!"
 flavor_gra.4.historical_info: "The rulers of Granada had hoped desperately for Ottoman and $mamluk$ support. However, the Ottomans and the $mamluks$ soon became embroiled in war against each other, and were unable to provide much direct aid. The Turks sent a fleet under Kemal Reis who raided Castilian possessions in the Western Mediterranean, and that fleet would later help ferry many refugees across the sea."
 ibn_khaldun_patronage: "A man of extraordinary intellect and reputation has arrived at our [ROOT.GetCountry.GetGovernment.GetCourtTitle]. [target_character.GetName], the famed historian and philosopher, seeks patronage to continue [target_character.GetHerHis] studies and writings. Known for [target_character.GetHerHis] insights on governance, economics, and the rise and fall of empires, [target_character.GetHerHis] presence could elevate the prestige of our [ROOT.GetCountry.GetGovernment.GetCourtTitle] and provide us with invaluable counsel. Shall we grant [target_character.GetHerHim] the position he desires?"
 flavor_gra.5.title: "[target_character.GetNameWithNoTooltip] Asks for Patronage"
 flavor_gra.5.entry: "Ibn Khaldun Asks for Patronage"
 flavor_gra.5.desc: "$ibn_khaldun_patronage$"
 flavor_gra.5.a: "Very well."
 flavor_gra.5.b: "We care not for such frivolous expenses!"

 flavor_gra.6.title: "Pearl of the Strait"
 flavor_gra.6.entry: "$flavor_gra.6.title$"
 flavor_gra.6.desc: "A dispatch arrives from the #italic wālī#! of [target_location.GetName]. The walls hold, the harbor is busy, and the remittance our treasury received this month was the largest single payment of the year from anywhere in our [ROOT.GetCountry.GetFlavorRank]. From the Alcazaba and the Gibralfaro castle above it, the watch can see clear across the strait on any fair morning, which is most of what the [ROOT.GetCountry.GetGovernment.GetCourtTitle] needs to know.\n\n[ROOT.GetCountry.GetCapital.GetName] gives us our throne. [target_location.GetNameWithNoTooltip] gives us almost everything else. Its quays handle the bulk of our customs revenue. [GetCountry('GEN').GetAdjective] factors winter there as a matter of course, and the sweet fortified wine pressed in its hinterland is sold as far as [GetCountry('FLA').GetName]. There is no other city in our possession whose loss we could afford.\n\nWhich is precisely why others have an interest in it. [GetCountry('CAS').GetName] has watched the harbor for two generations. So have a number of our own cousins: more than one man who later wore our crown raised his first banner from those walls, and so did some of the rebels he later put down."
 flavor_gra.6.a: "We shall guard Mālaqa as we guard the crown itself."
 flavor_gra.6.historical_info: "Mālaqa was the second city of the Emirate of Granada and one of the most important Mediterranean ports of the medieval Islamic world. After the Nasrid absorption of the last Hammudid-era taifa in 1239, the city was placed under a #italic wālī#! appointed directly by the sultan. The first was Ismaʿīl, brother of Muhammad I, and the post remained a near-permanent appanage of close royal kin.\n\nIts defenses centered on the Alcazaba, a hilltop palace-fortress overlooking the harbor, and the higher Gibralfaro castle joined to it by a coracha covered wall. From those heights the watch could spot vessels rounding the Strait of Gibraltar days before they reached port. Below, the #italic funduqs#! hosted Genoese, Catalan, and Maghrebi merchants, and customs revenue at Mālaqa was the single largest source of income for the Nasrid treasury.\n\nIts exports reached as far as Flanders and Egypt. Andalusi silk, lustreware ceramics, the dried figs and raisins of the Axarquía, and the sweet fortified wine that would give the city its lasting reputation in European markets all departed from its quays. Shipbuilding yards on the Guadalmedina supplied the Nasrid galleys that patrolled the strait alongside their Marinid allies.\n\nGovernorship of Mālaqa carried both prestige and danger. The post was a stepping stone toward the throne and a recurring base of revolt whenever the dynasty fractured. Muhammad VI, the so-called Red Sultan, raised his banners from the city in 1359, and Mālaqa's final fall in 1487 to the Catholic Monarchs ended Andalusi rule on the peninsula a half-decade before Granada itself."
 
 flavor_gra.9.entry: "$flavor_gra.9.title$"
 flavor_gra.9.title: "The Sephardic Jews"
 flavor_gra.9.desc: "[ShowRegionName('iberia_region')] has been a prominent center for the followers of [ShowReligionName('judaism')] for a long time, hosting their communities within its prosperous cities. Many of them have decided to turn the [target_location.GetRank.GetName] of [target_location.GetName] into a haven, where they are allowed to live their lives without being persecuted or discriminated against.\n\nThe [ROOT.GetCountry.GetGovernment.GetCourtTitle] has noticed this development. Some are in support of this new haven of theirs, believing in equality for all creations of [ROOT.GetCountry.GetReligion.GetGodName], while others, who are more extreme when it comes to their faith, see this as a stain on all that is holy in the [ROOT.GetCountry.GetFlavorRank], and wish to remove it!"
 flavor_gra.9.a: "We shall protect the rights of the [ShowReligionAdjectiveWithNoTooltip('judaism')] people."
 flavor_gra.9.b: "[ROOT.GetCountry.GetReligion.GetGodName] would never allow these unbelievers to live in peace!"
 gra_jewish_people_in_target_location_become_unhappy: "Every [ShowReligionAdjective('judaism')] [pop|e] in [target_location.GetName] will lose [ShowNamedValue('pop_satisfaction_extreme_penalty')|+=2%]"
 
 flavor_gra.10.entry: "Assassination of our Ruler"
 flavor_gra.10.title: "Assassination of [target_character.GetNameWithNoTooltip]"
 flavor_gra.10.desc: "Tragedy has struck [ROOT.GetCountry.GetName]!\n\nAfter praying in [target_location.GetName], it seems that a madman intent on murder attacked [target_character.GetName], causing [target_character.GetHerHim] grave injury. Not even the finest physicians could manage to mend the numerous wounds [target_character.GetSheHe] suffered, and a few hours later [target_character.GetSheHe] was proclaimed dead.\n\nWhile this has saddened the [ROOT.GetCountry.GetGovernment.GetCourtTitle], there are some who are adamant that it was a staged incident. They claim that some who were opposed to [target_character.GetHerHis] rule purposefully let [target_character.GetHerHis] guards be distracted while the murderer got the opportunity they were waiting for. But, alas, no one knows the truth, and it is best to close the coffin."
 flavor_gra.10.a: "What will happen to [ROOT.GetCountry.GetNameWithNoTooltip] now?"
 leader_is_scarred: "#Y [target_character.GetName] survives, but scarred#!"
 leader_dies: "#Y [target_character.GetName] does not survive#!"
 
 flavor_gra.11.entry: "$flavor_gra.11.title$"
 flavor_gra.11.title: "[ShowGoodsNameWithNoTooltip('silk')] of [ShowLocationNameWithNoTooltip('granada')]"
 flavor_gra.11.desc: "The [ShowGoodsName('silk')] that [ROOT.GetCountry.GetName] produces is perhaps the most renowned in all of [ShowContinentName('europe')]. Merchants from [ShowLocationName('genoa')], [ShowLocationName('venice')], and even [ShowLocationName('prague')] wish to purchase this luxury good in order to satisfy the demand of their affluent and privileged [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')], and for us it is a very profitable agreement.\n\nRather than seeking only monetary gain from exporting [ShowGoodsNameWithNoTooltip('silk')], our wealthy [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] wish for us to try and popularize it, making it something that the entire world wishes to purchase and increasing our prestige through monopolizing its trade."
 flavor_gra.11.a: "The [ShowGoodsNameWithNoTooltip('silk')] of [ShowLocationNameWithNoTooltip('granada')] will be known everywhere!"
 unlock_expand_iberian_silk_decision: "We will unlock the $gra_expand_seda_de_granada.title$ [decision|e], which will require us to conquer [ShowLocationName('murcia')] to enact"

 flavor_gra.12.entry: "$flavor_gra.12.title$"
 flavor_gra.12.title: "A Commercial Exploit"
 flavor_gra.12.desc: "Our [ShowGoodsName('silk')] is the most renowned in all of [ShowContinentName('europe')]. [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] from across [ROOT.GetCountry.GetName] seek to sell this good not only to make a profit, but also show the world its unmatched quality. While they are not able to accomplish that alone, they have requested we create trade routes to ensure the exchange continues. This would also help us maintain our reputation and prestige when it comes to the [ShowGoodsNameWithNoTooltip('silk')] trade."
 flavor_gra.12.a: "Let us seek to expand our trade diplomatically."

 flavor_gra.13.entry: "$flavor_gra.13.title$"
 flavor_gra.13.title: "$ghuzat_mujahidin_bureaucracy$"
 flavor_gra.13.desc: "For the sake of [ROOT.GetCountry.GetName]'s survival, many volunteers have joined our military.\n\nThese soldiers, mainly of [ShowCultureGroupName('amazigh_group')] origin, are under the control of [target_character2.GetName] — a competent yet fickle figure. For our independence in the [ShowSituationName('battle_for_the_strait')], we must control as many variables as possible, and these volunteers are vital as kingmakers. Rather than have them under the control of a foreign factor, we should try and inculcate [target_character.GetDynasty.GetName] leadership in their ranks and remove the risk of betrayal."
 flavor_gra.13.a: "Let these men serve, all of them."
 flavor_gra.13.b: "We shall dispose of those who are not completely loyal to us."
 gra_mercenary_company_will_be_weaker_and_more_expensive: "The [mercenary|e] Company will have #Y half#! the men and will be more expensive"

 flavor_gra.14.entry: "$flavor_gra.14.title$"
 flavor_gra.14.title: "Qaṣr ar-Riyāḍ as-Sa'īd"
 flavor_gra.14.desc: "The [ShowBuildingTypeName('alhambra')] in [ShowLocationName('granada')] has been the main source of our prestige as a [ROOT.GetCountry.GetRank.GetName] in [ShowRegionName('iberia_region')]. Yet this is not enough for someone as insatiable as [target_character.GetName]. Wishing to show the glory of the [target_character.GetDynasty.GetName] to the entire [ShowReligionGroupAdjective('muslim')] world, [target_character.GetSheHe] intends to hire the finest architects in order to construct a palace within the heart of the [ShowBuildingTypeNameWithNoTooltip('alhambra')], filled with lion statues and #italic muqarnaṣ#! vaults."
 flavor_gra.14.a: "We will sponsor this project."
 flavor_gra.14.b: "Let the world behold the glory of the [target_character.GetDynasty.GetNameWithNoTooltip]!"
 flavor_gra.14.b.entry: "Let the world behold the glory of our dynasty!"
 gra_construct_alhambra_increment_tt: "Adds #G +1#! to the maximum level of [ShowBuildingTypeName('alhambra')]"
 flavor_gra.14.c: "We shall not try to satisfy those who are insatiable."

 flavor_gra.15.entry: "$flavor_gra.15.title$"
 flavor_gra.15.title: "An Opportunity in the Struggle"
 flavor_gra.15.desc: "Our diplomats and spies have reported that there is discord within [target_country.GetName]. A strife so great that has led [target_character2.GetName] to focus on internal politics, giving us a chance to catch our breath under this yoke that they have enforced upon us. [target_character.GetName] even thinks that this could be used to gain an advantage in the [ShowSituationName('battle_for_the_strait')], as we no longer have to focus on the front with [target_country.GetNameWithNoTooltip]."
 flavor_gra.15.a: "Let us pray their times of trouble continue."
 gra_gain_granadan_sovereignty_for_the_rest_of_the_disaster: "For as long as [GetCountry('CAS').GetName] or [GetCountry('MOR').GetName] are in a [disaster|e], we will gain #G 0.1#! Monthly [granadan_sovereignty|e]"

 flavor_gra.16.entry: "$flavor_gra.16.title$"
 flavor_gra.16.title: "Discord in [ShowProvinceDefinitionNameWithNoTooltip('malaga_province')]"
 flavor_gra.16.desc: "Despite us maintaining our sovereignty in [ShowRegionName('iberia_region')], the rulers of [GetCountry('MOR').GetName] have entrenched themselves in the holdings of [ShowProvinceDefinitionName('malaga_province')], which rightfully belongs to our [ROOT.GetCountry.GetRank.GetName].\n\n[target_character2.GetName] believes that such holdings should be maintained for all the help that [GetCountry('MOR').GetNameWithNoTooltip] has provided us in the past. The estates in [ROOT.GetCountry.GetName], however, see this as a threat to our independence, and wish for us to reclaim what was once ours."
 flavor_gra.16.a: "Let us go forth and conquer."
 flavor_gra.16.b: "We will not upset our neighbors like that."

 flavor_gra.18.entry: "$flavor_gra.18.title$"
 flavor_gra.18.title: "Defying [GetCountry('CAS').GetNameWithNoTooltip]"
 flavor_gra.18.desc: "We take great pride in being the remnants of $ADU$, but we have been forced to pay tribute to [GetCountry('CAS').GetName], which humiliates our [ROOT.GetCountry.GetGovernment.GetCourtTitle]. These tributes have been hindering our economy while strengthening our nemesis in the struggle for [ShowRegionName('iberia_region')]. Rather than continuing to accept this situation, many military men see this as a key moment to throw off the yoke and free ourselves from these foreign burdens."
 flavor_gra.18.a: "Even if this effort fails, we shall break these chains one day."
 flavor_gra.18.b: "Obedience for now. We will have another opportunity later."

 flavor_gra.19.title: "Tightening the Yoke"
 flavor_gra.19.desc: "The relationship we have created with [from_country.GetName] has broken. Rather than peacefully enjoying their prosperity, [target_character.GetName] spotted the weakness in our borders and decided to stop paying tribute. This has not gone unnoticed in the [ROOT.GetCountry.GetGovernment.GetCourtTitle], which now insists that we remind them of their duty. If they continue to deny us our rightful tribute, this could be an opportunity to annex [from_country.GetNameWithNoTooltip] once and for all."
 flavor_gra.19.a: "[from_country.GetCapital.GetNameWithNoTooltip] shall fall!"
 flavor_gra.19.a.entry: "They will pay for this!"

 flavor_gra.20.entry: "$flavor_gra.20.title$"
 flavor_gra.20.title: "Prosperity in the Markets of [ShowLocationNameWithNoTooltip('granada')]"
 flavor_gra.20.desc: "Our [ShowGoodsName('silk')] production, and the enthusiasm with which our [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] trade it throughout [ShowContinentName('europe')], has led to the creation of new marketplaces in [ShowLocationName('granada')]. This development has motivated many of our [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')] to expand this trade, using whatever influence and gold they have to encourage the project.\n\nAn impressive [ShowBuildingTypeName('marketplace')] is to be built, known as the [ShowBuildingTypeName('al_qaysariyya_market')], meant to serve as the greatest trading hub in all of [ShowRegionName('iberia_region')], bringing in foreign merchants and encouraging our own to trade with the farthest corners of the world."
 flavor_gra.20.a: "Let us construct the [ShowBuildingTypeNameWithNoTooltip('al_qaysariyya_market')]."
 flavor_gra.20.b: "We will have to disappoint our [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')] this time."

 flavor_gra.1000.entry: "$flavor_gra.1000.title$"
 flavor_gra.1000.title: "A Prominent Figure"
 flavor_gra.1000.desc: "In the recent years of bloody conflict with our neighbors, one member of the [ShowDynastyName('nasrid_dynasty')] dynasty has made [target_character.GetHerselfHimself] recognized throughout [ROOT.GetCountry.GetName]. Known as [target_character.GetName], [target_character.GetSheHe] has proven [target_character.GetHerselfHimself] as an exceptional military leader, able to inspire men by the thousands. This is how [target_character2.GetName] came to notice this [target_character.GetWomanMan], and to hope to bring [target_character.GetHerHim] closer to the [ROOT.GetCountry.GetGovernment.GetCourtTitle]. However, [target_character.GetSheHe] has shown an insatiable ambition, causing many close to [target_character2.GetNameWithNoTooltip] to worry."
 flavor_gra.1000.a: "Great people belong to this great country."
 gra_yusuf_will_most_likely_rebel: "Inviting [target_character.GetName] to serve [ROOT.GetCountry.GetName] will most likely lead to [target_character.GetHerHim] attempting to overthrow [target_character2.GetName]"
 flavor_gra.1000.b: "It is better to not take risks like that."
 gra_banishing_yusuf_prevents_the_rebellion: "Banishing [target_character.GetName] will ensure [target_character.GetSheHe] does not start a rebellion"
 flavor_gra.1000.c: "Our connections tell us that this plan will backfire."

 flavor_gra.1001.title: "Rebellion of [target_character.GetNameWithNoTooltip]"
 flavor_gra.1001.desc: "By using [target_character.GetHerHis] popularity to amass a large following, [target_character.GetName] now rivals the strength and influence of [target_character2.GetName]. [target_character.GetHerHim] supporters have now issued an ultimatum to our current leadership: abdicate in favor of [target_character.GetNameWithNoTooltip], or [ROOT.GetCountry.GetName] will be engulfed in a devestating war."
 flavor_gra.1001.a: "We will never give up the rulership to a pretender!"
 flavor_gra.1001.b: "No unnecessary blood will be spilled tonight. [target_character2.GetNameWithNoTooltip] shall abdicate."
 flavor_gra.1001.b.entry: "No unnecessary blood will be spilled tonight. We shall give up the throne."

 flavor_gra.1100.entry: "$flavor_gra.1100.title$"
 flavor_gra.1100.title: "A Rising Star"
 flavor_gra.1100.desc: "Rumors have spread amongst our soldiers at the battlefront of a strong young [target_character.GetWomanMan] that has been steadily rising through the ranks, and has already been made general. Known as [target_character.GetName], they say [target_character.GetSheHe] has eyes like a hawk, able to watch the entire battlefield and make intelligent strategic decisions even in the thick of battle. They also say [target_character.GetSheHe] is unrivaled with the sword, defeating every opponent [target_character.GetSheHe] has faced. But only time will tell if these claims are true..."
 flavor_gra.1100.a: "We will watch this career with great interest."
 flavor_gra.1100.b: "Such people are only known to cause trouble."

 flavor_gra.1101.title: "One Amongst Many"
 flavor_gra.1101.desc: "It seems to us, [ROOT.GetCountry.GetGovernment.GetRulerOrRegent.GetOralAddress], that the outrageous claims that our soldiers have been making have been at least partially true — the [target_character.GetWomanMan] has been able to pull off miraculous feats, able to push back a flanking cavalry charge with naight but [target_character.GetHerHis] regiment. The retainers in our [ROOT.GetCountry.GetGovernment.GetCourtTitle] seem to think [target_character.GetSheHe] should be given a great title, and it seems wise to reward such courageous acts. [target_character.GetSheHe|U] may be just one amongst many, but they could also be the second coming of Ḵālid ibn al-Walīd."
 flavor_gra.1101.a: "We need more people like this."

 flavor_gra.1102.title: "Surrounded by Loyalists"
 flavor_gra.1102.desc: "Ever since we gave [target_character.GetName] [target_character.GetHerHis] noble title, [target_character.GetHerHis] closest companions have begun acting more like [target_character.GetHerHis] retainers, tending to [target_character.GetHerHis] every need and speaking as [target_character.GetHerHis] representatives when [target_character.GetSheHe] is not present. The estate [target_character.GetSheHe] was granted in [ROOT.GetCountry.GetCapital.GetName] has seen increased traffic recently, with the masses clamoring for a chance to see [target_character.GetHerHis] face. Some have overdramatized [target_character.GetHerHis] feats to the point of religious fervor, and it almost seems like they worship [target_character.GetHerHim]."
 flavor_gra.1102.a: "Conspicuous..."

 flavor_gra.1103.title: "A Pretender Rises"
 flavor_gra.1103.desc: "We have finally uncovered the reason for why the retinue of [target_character.GetName] take such excessive actions. They have spread the rumor that this general is the scion of a cadet branch of the legendary [ShowDynastyName('umayyad_dynasty')] dynasty, which once brought [ShowRegionName('iberia_region')] into a golden age. While we can neither refute nor confirm these claims, some of the [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] have seen an opportunity to climb the ranks by attaching themselves to this false claimant. [target_character.GetHerHis|U] following has now grown to the point of a full-sized division, and could threaten our authority over the army."
 flavor_gra.1103.a: "Let us hope this leads nowhere."

 flavor_gra.1104.title: "A Day of Reckoning"
 flavor_gra.1104.desc: "Blast! The man has turned against the throne! Citing [target_character.GetHerHis] claim of [ShowDynastyName('umayyad_dynasty')] descent, [target_character.GetSheHe] has gathered [target_character.GetHerHis] loyal retinue and ordered them to march upon our largest cities, where they are to incite widespread unrest and spread word about a [target_character.GetHerHis] claim to our throne. There is no point in denying that the [ShowDynastyNameWithNoTooltip('umayyad_dynasty')] rule of [ShowLocationName('cordoba')] brought great prosperity to our ancestors, but the claim this [target_character.GetWomanMan] has as an [ShowDynastyNameWithNoTooltip('umayyad_dynasty')] descendant is dubious at best. In spite of this, the people do not care, having heard of [target_character.GetHerHis] legendary feats on the battlefield. Numerous people from all walks of life are willing to support [target_character.GetHerHis] cause, and are already shouting for [ROOT.GetCountry.GetGovernment.GetRulerOrRegent.GetName] to step down."
 flavor_gra.1104.a: "Crush this pretender!"
 flavor_gra.1104.b: "We do not stand a chance."

 flavor_gra.1200.entry: "$flavor_gra.1200.title$"
 flavor_gra.1200.title: "Help From [ShowRegionNameWithNoTooltip('maghreb_region')]"
 flavor_gra.1200.desc: "With the [ShowSituationName('battle_for_the_strait')] raging on, our survival depends on foreign intervention more than anything. With both [GetCountry('CAS').GetName] and [GetCountry('MOR').GetName] competing to subdue us, it is only natural that we try and get help from an outside party. The countries of [ShowRegionName('maghreb_region')] are kindred spirits with their own opinions on this matter, particularly [strongest_maghreb_country.GetName], which stands above them all. Perhaps by asking [target_character2.GetName] for help we can try to gain a military advantage in this struggle."
 flavor_gra.1200.a: "We are in dire need of help."
 flavor_gra.1200.b: "Why should we depend on external intervention for our protection?"

 flavor_gra.1201.title: "$flavor_gra.1200.title$"
 flavor_gra.1201.desc: "[from_country.GetName] has approached us about the current situation in [ShowRegionName('iberia_region')]. Seeing themselves backed against a wall, they ask that we aid them with whatever means possible against the rising threats against their sovereignty. Be it gold or men, either would suffice in the defense of their homeland."
 flavor_gra.1201.a: "We shall give them gold."
 flavor_gra.1201.b: "They will receive men from us."
 flavor_gra.1201.c: "Both gold and men will do."
 flavor_gra.1201.d: "Why shall we involve ourselves in this conflict?"

 flavor_gra.1300.entry: "$flavor_gra.1300.title$"
 flavor_gra.1300.title: "Help From the East"
 flavor_gra.1300.desc: "With the fall of [ShowLocationName('constantinople')] at the hands of the [target_country.GetName], the [ShowReligionGroupAdjective('muslim')] world has struck a major blow to the [ShowReligionGroupAdjective('christian')] kingdoms of [ShowContinentName('europe')]. Triumphantly, [target_character2.GetName] has shown interest in expanding [target_character2.GetHerHis] reach over the known world. Perhaps we can use this opportunity to send a delegation to [target_country.GetCapital.GetName] in the hopes of obtaining some experienced generals and soldiers from them."
 flavor_gra.1300.a: "Let us send a delegation."
 flavor_gra.1300.b: "We do not need their help to survive."
 gra_demand_a_mercenary_company: "We will ask [target_country.GetName] to either give us [gold|e] or a [mercenary|e] company led by one of their [characters|e]"

 flavor_gra.1301.title: "$flavor_gra.1300.title$"
 flavor_gra.1301.desc: "[target_character.GetName] of [from_country.GetName] has sent a delegation to [ROOT.GetCountry.GetCapital.GetName], congratulating us on the conquest of [ShowLocationName('constantinople')] and bearing the kindest words about our military achievement. As we have dealt a great blow to [ShowReligionGroupName('christian')], they now ask that we send them military aid to protect themselves from the vultures in [ShowRegionName('iberia_region')] who wish to extinguish the flame of [ShowReligionGroupName('muslim')]. One [mercenary_general.GetWomanMan] in particular, [mercenary_general.GetName], is eager to lead this expedition, wishing to gain personal glory as well as to serve [target_character2.GetName] and expand the reach of the [ROOT.GetCountry.GetFlavorRank] to the pillars of Heracles."
 flavor_gra.1301.a: "Who are we to deny our men from conquering?"
 flavor_gra.1301.b: "We will not spare any general or soldier, but we can spare some gold."
