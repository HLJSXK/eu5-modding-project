l_english:
 flavor_pis.1.entry: "$flavor_pis.1.title$"
 flavor_pis.1.title: "The Decline of [ROOT.GetCountry.GetNameWithNoTooltip]"
 flavor_pis.1.desc: "The once-glorious [ROOT.GetCountry.GetLongName] is no longer the giant it once was in [ShowRegionName('italy_region')]. Its influence stretched from [ShowRegionName('iberia_region')] to the [ShowRegionName('crescent_region')], but the [GetCountry('GEN').GetAdjective] fleet blockaded our precious [ShowBuildingTypeName('porto_pisano')] in [ShowLocationName('pisa')] for several years, leading to its decline. To make matters worse, the [GetCountry('ARA').GetAdjective] armies snatched [ShowAreaName('sardinia_area')] away from us.\n\nThis has left the [ROOT.GetCountry.GetFlavorRank] in a weakened state. Our mighty fleet is now a shadow of its former glory, with other [ShowCultureGroupName('italian_group')] states eclipsing us on that front. Our trade influence is slowly being supplanted by more reliable rivals, and the [ROOT.GetCountry.GetFlavorRank] is mired in political decadence.\n\nRather than sitting idle and letting history take its course, we should focus on rebuilding, gathering as much strength as possible in order to take revenge on those responsible for our current predicament."
 flavor_pis.1.a: "As long as [target_character.GetNameWithNoTooltip] rules, we will not falter!"
 flavor_pis.1.a.entry: "We will not falter!"

 flavor_pis.2.title: "Fall of [target.GetNameWithNoTooltip]"
 flavor_pis.2.desc: "The armies of [ROOT.GetCountry.GetName] have once again emerged victorious, capturing the [target.GetRank.GetName] of [target.GetName]. Not forgetting the destruction of the soil in [ShowLocationName('pisa')], and the blockade that starved the people there, the troops as well as their commander are preparing to raze the [target.GetRank.GetNameWithNoTooltip] to the ground, salt its soil, and bring the wealth back to our capital."
 flavor_pis.2.a: "An eye for an eye!"
 flavor_pis.2.b: "There is no need to destroy the place."
 pis_allow_upgrade_of_porto_pisano: "The [ShowBuildingTypeName('porto_pisano')] in [ShowLocationName('pisa')] can be upgraded by an extra level"

 flavor_pis.3.entry: "$flavor_pis.3.title$"
 flavor_pis.3.title: "Reclamation of [ShowAreaNameWithNoTooltip('sardinia_area')]"
 flavor_pis.3.desc: "Our forces have finally reclaimed [ShowAreaName('sardinia_area')]!\n\nNumerous soldiers, members of the [ROOT.GetCountry.GetGovernment.GetCourtTitle], and [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] have been celebrating this achievement, ready to re-establish their influence there. Thought they are scattered all over the country, many have started moving into [target_location.GetName], establishing it as the area's capital.\n\nThis has led to many proposals for building up the [target_location.GetRank.GetName], ensuring the success of any settlers who may wish to bring back wealth to [ShowBuildingTypeName('porto_pisano')]. However, there are a few who believe that our influence should not be concentrated in one place, and that the entire island is in need of aid."
 flavor_pis.3.a: "[target_location.GetNameWithNoTooltip] will be the gem of [ShowAreaNameWithNoTooltip('sardinia_area')]."
 flavor_pis.3.a.entry: "This place will be the gem of [ShowAreaNameWithNoTooltip('sardinia_area')]."
 flavor_pis.3.b: "Let us ensure the prosperity of the entire island."
 pis_all_of_sardinia_gains_development_and_prosperity: "Every [location|e] in [ShowAreaName('sardinia_area')] that is owned by us will gain [ShowNamedValue('development_mild_bonus')|+=2%] [development|e] and [ShowNamedValue('prosperity_mild_bonus')|+=2%] [prosperity|e]"

 flavor_pis.4.entry: "$flavor_pis.4.title$"
 flavor_pis.4.title: "Expanding the [ShowWorkOfArtNameWithNoTooltip('leaning_tower_of_pisa')]"
 flavor_pis.4.desc: "The [ShowWorkOfArtName('leaning_tower_of_pisa')] is complete, but there are many in the [ROOT.GetCountry.GetGovernment.GetCourtTitle] who wish to see an expansion of its interior.\n\n[target_character.GetName] wants to use Gothic elements for the belfry, blending them with the Romanesque style the tower already has. Such a task cannot be done for free, as the [ROOT.GetCountry.GetFlavorRank] knows very well, but it is something that would help us strengthen our prestige in [ShowRegionName('italy_region')]."
 flavor_pis.4.a: "Let us expand the tower."
 flavor_pis.4.b: "It is already complete; anything else is extra."

 flavor_pis.5.entry: "$flavor_pis.5.title$"
 flavor_pis.5.title: "A Shift in Focus"
 flavor_pis.5.desc: "Although the ambition of reclaiming our former glory in the Mediterranean is slowly waning, it has brought us new ideas on how to restore our hold over [ShowRegionName('italy_region')]. Rather than depending on merchants and seafarers, it is suggested that we start utilizing our wealth for military campaigns, hiring numerous condottieri and commanding them to conquer neighboring cities.\n\nSuch ideas are not popular within the more experienced, who prefer the plan to rebuild the [ShowBuildingTypeName('porto_pisano')], but those more eager to prove themselves are in favor of an expansionist policy until we have eclipsed the rival city-states."
 flavor_pis.5.a: "Let us go forth and conquer!"
 flavor_pis.5.b: "War, what good is it for? Trade is what will give us power."
 pis_gain_casus_belli_on_every_neighbor_country_in_italy: "If we do not have a [casus_belli|e] already, we will gain the [ShowCasusBelliName('cb_conquer_province')] [casus_belli|e] on every neighbor [country|e] [capital|e] [province|e]"

 flavor_pis.6.title: "Gioco del Ponte"
 flavor_pis.6.desc.a: "The recent Gioco del Ponte festival at [ShowLocationName('pisa')] has led to the rise of a promising [target_character.GetWomanMan]. In the tug-of-war that happened that day, [target_character.GetName] showed great leadership, commanding the soldiers to push the cart on the Ponte di Mezzo bridge. That has earned [target_character.GetHerHim] respect amongst the people, perhaps thinking that [target_character.GetSheHe] has the makings of a true leader."
 flavor_pis.6.desc.b: "[ShowLocationName('pisa')] recently hosted the Gioco del Ponte, and the local populace reveled in the occasion. The parade along the Arno River drew many citizens from all walks of life to take part, fostering unity among the people of [ROOT.GetCountry.GetName] — specifically, the most influential ones, who set aside their differences to enjoy this annual tradition."
 flavor_pis.6.desc.c: "Many people across [ShowContinentName('europe')] have gathered in [ShowLocationName('pisa')] for the Gioco del Ponte festival. They were quite impressed by the spectacle of the parade along the Arno River, and those with military expertise have joined the tug-of-war, wishing to bring victory to their side. Although some merely observed the festivities, they brought word back to their countries about this joyful experience that [ROOT.GetCountry.GetName] hosts every year."
 flavor_pis.6.a: "Even if temporary, let us enjoy this stability."
 flavor_pis.6.b: "The stories of the festival will reach every corner."
 flavor_pis.6.c: "Let us promote [target_character.GetNameWithNoTooltip]."
 flavor_pis.6.c.entry: "Let us promote this character."
 flavor_pis.6.d: "We will not let any random person serve the [ROOT.GetCountry.GetAdjectiveWithNoTooltip] [ROOT.GetCountry.GetGovernment.GetCourtTitle]."
 flavor_pis.6.d.entry: "We will not let any random person serve the country."

 flavor_pis.1000.entry: "$flavor_pis.1000.title$"
 flavor_pis.1000.title: "New Leadership"
 flavor_pis.1000.desc: "Crisis has taken hold of [ROOT.GetCountry.GetName].\n\nRampant debt, economic decline, and instability have led many to question the authority of [target_character.GetName], who leads a fragile government in dire need of foreign support. Rather than watch it all crumble apart, the wealthy and influential have gathered to find a new candidate to rule the [ROOT.GetCountry.GetFlavorRank]. Some have proposed the [target_country.GetGovernment.GetRuler.GetDynasty.GetName] of [target_country.GetName], hoping they will be able to support us economically. Others favor the [target_country2.GetGovernment.GetRuler.GetDynasty.GetName] of [target_country2.GetName], and still others argue that the [target_country3.GetGovernment.GetRuler.GetDynasty.GetName] of [target_country3.GetName] is the superior choice — and that we would be fools not to invite them to be our new rulers."
 flavor_pis.1000.a: "Let us send a letter to [target_country.GetNameWithNoTooltip]."
 flavor_pis.1000.a.entry: "Let us send a letter to them."
 pis_offer_rulership_to_country1: "We will offer rulership to [target_country.GetName]. If they accept, the following will happen:"
 pis_a_member_of_target_country_dynasty_becomes_ruler: "A member of the [target_country.GetGovernment.GetRuler.GetDynasty.GetName] [dynasty|e] will become our [ruler|e]"
 flavor_pis.1000.b: "It is best if we choose [target_country2.GetNameWithNoTooltip]."
 flavor_pis.1000.b.entry: "It is best if we choose another country."
 pis_offer_rulership_to_country2: "We will offer rulership to [target_country2.GetName]. If they accept, the following will happen:"
 pis_a_member_of_target_country2_dynasty_becomes_ruler: "A member of the [target_country2.GetGovernment.GetRuler.GetDynasty.GetName] [dynasty|e] will become our [ruler|e]"
 flavor_pis.1000.c: "The rulers of [target_country3.GetNameWithNoTooltip] are the best fit."
 flavor_pis.1000.c.entry: "The rulers of this alternative are the best fit."
 pis_offer_rulership_to_country3: "We will offer rulership to [target_country3.GetName]. If they accept, the following will happen:"
 pis_a_member_of_target_country3_dynasty_becomes_ruler: "A member of the [target_country3.GetGovernment.GetRuler.GetDynasty.GetName] [dynasty|e] will become our [ruler|e]"
 flavor_pis.1000.d: "We will not sell our [ROOT.GetCountry.GetFlavorRank] to our rivals."

 flavor_pis.1001.title: "$flavor_pis.1000.title$"
 flavor_pis.1001.desc: "The political crisis in [from_country.GetName] is reaching its zenith, as messengers representing their elite have approached our [ROOT.GetCountry.GetGovernment.GetCourtTitle] with pleas for aid. They ask that [ROOT.GetCountry.GetGovernment.GetRuler.GetName] help them by establishing [target_character.GetName] as the new ruler of the [from_country.GetFlavorRank], and that [target_character.GetName] be provided with financial assistance."
 flavor_pis.1001.a: "A great way to expand the influence of [ROOT.GetCountry.GetGovernment.GetRuler.GetDynasty.GetNameWithNoTooltip]."
 flavor_pis.1001.a.entry: "A great way to expand our influence."
 flavor_pis.1001.b: "Such connections would only bring us down."

 flavor_pis.1100.entry: "$flavor_pis.1100.title$"
 flavor_pis.1100.title: "In Supremae Dignitatis"
 flavor_pis.1100.desc: "The scholars of [ShowLocationName('pisa')] are renowned throughout [ShowRegionName('italy_region')], yet [ROOT.GetCountry.GetName] lacks a formally recognized institution of learning. The [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] have proposed that [target_character.GetName] petitions [target_character2.GetName] to have [ShowLocationNameWithNoTooltip('pisa')] formally recognized as a Studium Generale, allowing autonomous academic institutions to flourish."
 flavor_pis.1100.a: "Let us send a delegation to [GetCountry('PAP').GetCapital.GetNameWithNoTooltip]."
 flavor_pis.1100.a.entry: "Let us send a delegation to $PAP$."
 flavor_pis.1100.b: "We do not need to engage in any [GetCountry('PAP').GetAdjectiveWithNoTooltip] politics."
 flavor_pis.1100.b.entry: "We do not need to engage in any $PAP_ADJ$ politics."

 flavor_pis.1101.title: "$flavor_pis.1100.title$"
 flavor_pis.1101.desc: "[target_character.GetName] of [from_country.GetName] has sent us a delegation. [target_character.GetHerHis|U] delegates speak glowingly of education in [ShowLocationName('pisa')], and of the many people in the [from_country.GetFlavorRank] who wish to be scholars. To this end, they come bearing a request — the granting of a seal of recognition from [ROOT.GetCountry.GetName], authorizing the establishment of a formal institution of learning within their [from_country.GetFlavorRank]."
 flavor_pis.1101.a: "They have our approval."
 flavor_pis.1101.b: "[ShowRegionNameWithNoTooltip('italy_region')] has plenty of places for people to study at."