l_english:
 flavor_gen_tun.1.title: "Ripe for the Taking"
 flavor_gen_tun.1.entry: "$flavor_gen_tun.1.title$"
 flavor_gen_tun.1.desc: "The ancient and beautiful [target_location.GetRank.GetName] of [target_location.GetName] rises above the [ShowLocationName('cape_tajura')]. Despite its significance to the [ShowScriptedGeographyName('mediterranean_sea_geography')] economy, it remains in the hands of [target_country.GetLongName], a state much too weak to resist our invasion on its own. We could land in [ShowProvinceDefinitionName('tripolitania_province')], plunder the coast, and auction off our conquests to a neighboring state afterwards — or perhaps even keep it for ourselves."
 flavor_gen_tun.1.a: "An excellent idea!"
 flavor_gen_tun.1.b: "Such opportunities are for warmongers."

 flavor_gen_tun.2.title: "Sale of $tripoli$"
 flavor_gen_tun.2.entry: "$flavor_gen_tun.1.title$"
 flavor_gen_tun.2.desc: "Having conquered and sacked [target_location.GetName], our [ROOT.GetCountry.GetFlavorRank] now possesses a sizeable colony in the area of [target_location.GetArea.GetName] — a land quite culturally and religiously different from our metropolis in [ROOT.GetCountry.GetCapital.GetName]. Perhaps we should transfer its ownership to one of the neighboring tribes."
 flavor_gen_tun.2.a: "Sell it to the neighboring Banū Ṯābit."
 flavor_gen_tun.2.b: "Perhaps the Banū Makkī would be interested in buying their territories back."
 flavor_gen_tun.2.c: "We are sure that the [tunis_location.GetOwner.GetLongNameWithNoTooltip] would be interested."
 flavor_gen_tun.2.d: "[target_location.GetNameWithNoTooltip] belongs to us!"
 flavor_gen_tun.2.d.entry: "$tripoli$ belongs to us!"

 sale_of_tripoli_tt: "We will sell our colonies in [target_location.GetName] for [SCOPE.GetLocalVariable('proposed_price_of_sale').GetValue|+] [gold_i|e] [gold|e], transferring all connected [locations|e] — in total, #Y [SCOPE.GetLocalVariable('num_of_locations_to_be_sold').GetValue]#! [locations|e]"

 flavor_gen_tun.3.title: "$flavor_gen_tun.2.title$"
 flavor_gen_tun.3.desc: "An envoy from [from_country.GetName] has arrived in [ROOT.GetCountry.GetCapital.GetName], offering to sell us their territories in [target_location.GetName] at a considerable price. The value of the [target_location.GetRank.GetName] must not be understated, however — it would be a good acquisition for the [ROOT.GetCountry.GetFlavorRank]."
 flavor_gen_tun.3.desc_banu_makki: "The audacity displayed by the [from_country.GetLongName] deserves punishment directly from [ROOT.GetCountry.GetReligion.GetGodName]! Having conquered our beautiful [target_location.GetRankAndName], they are now giving us the 'opportunity' to pay for its return. The most galling part of this is that we may actually take them up on this offer..."
 flavor_gen_tun.3.a: "Very well, we will agree."
 flavor_gen_tun.3.b: "Why should we pay for something we can conquer?"
 flavor_gen_tun.3.c: "With all due respect, we do not care."