l_english:

 flavor_nav.1.title: "Joint Rule of [target_character.GetNameWithNoTooltip] and [target_character_2.GetNameWithNoTooltip]"
 flavor_nav.1.entry: "Joint Rule of Joan II and Philip of Évreux"
 flavor_nav.1.desc: "Following their ascension to the throne of [ROOT.GetCountry.GetName] in 1329, [target_character.GetName] and [target_character_2.GetName] have ruled the [ROOT.GetCountry.GetFlavorRank] closely; however, [target_character_2.GetNameWithNoTooltip]'s possessions in [ShowRegionName('france_region')] are clearly preferred by the joint rulers, who frequently leave [ROOT.GetCountry.GetNameWithNoTooltip] to take up residence in their [ShowCultureGroupNameWithNoTooltip('french_group')] holdings.\n\nAlthough the [ROOT.GetCountry.GetGovernment.GetCourtTitle] has found many capable regents to govern the [ROOT.GetCountry.GetFlavorRank] in the rulers' absence, there have been growing qualms over the past few years, with many [ROOT.GetCountry.GetAdjectiveWithNoTooltip] lords wishing to petition the two rulers to take up more permanent residence in [ROOT.GetCountry.GetCapital.GetName] lest the [ROOT.GetCountry.GetFlavorRank] appear weak in the eyes of covetous foreign powers."
 flavor_nav.1.a: "Our possessions in [ShowRegionNameWithNoTooltip('france_region')] are our most important."
 flavor_nav.1.b: "Both realms shall be managed equally."
 flavor_nav.1.c: "The lands of [ROOT.GetCountry.GetNameWithNoTooltip] must be our primary concern."

 flavor_nav.2.title: "Ascension of [target_character.GetNameWithNoTooltip]"
 flavor_nav.2.entry: "Ascension of Charles of Navarre"
 flavor_nav.2.desc: "The death of [GetCharacter('nav_jeanne_ii_capet').GetName] has seen the ambitious [target_character.GetName] ascend the throne. Upon arriving in [ROOT.GetCountry.GetCapital.GetName] for the [ROOT.GetCountry.GetGovernment.GetAdjective|U] ceremony and coronation, [target_character.GetSheHe] is already distinguishing [target_character.GetHerselfHimself] as an atypical ruler, as [target_character.GetNameWithNoTooltip] has expressed interest in swearing the oath in [ShowDialectName('aragonese_dialect')]. This has caused some frustration amongst the [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')], who would prefer the oath be conducted in traditional [ShowLanguageNameWithNoTooltip('latin_language')]."
 flavor_nav.2.a: "Take the oath in Romance."
 flavor_nav.2.b: "A foolish notion: the oath must be in [ShowLanguageNameWithNoTooltip('latin_language')]."
 flavor_nav.2.c: "Have the oath administered instead in [ShowLanguageNameWithNoTooltip('basque_language')]."

 flavor_nav.3.title: "The Holdings of [target_character.GetNameWithNoTooltip]"
 flavor_nav.3.entry: "The French Holdings of Charles of Navarre"
 flavor_nav.3.desc: "Having inherited both the lands of [GetCharacter('nav_philip_iii_evreux').GetName] and [GetCharacter('nav_jeanne_ii_capet').GetName], [target_character.GetName] now rules an expansive territory, encompassing [ROOT.GetCountry.GetName] and several holdings within [ShowRegionName('france_region')]. Though [GetCharacter('nav_jeanne_ii_capet').GetNameWithNoTooltip] and [GetCharacter('nav_philip_iii_evreux').GetNameWithNoTooltip] ruled [ROOT.GetCountry.GetNameWithNoTooltip] jointly, they only visited the [ROOT.GetCountry.GetFlavorRank] briefly, preferring to maintain residence in [ShowRegionNameWithNoTooltip('france_region')].\n\nWith [target_character.GetNameWithNoTooltip] ascension, many allies in the [ROOT.GetCountry.GetGovernment.GetCourtTitle] have urged [target_character.GetHerHim] to take up a more permanent residence in [ROOT.GetCountry.GetNameWithNoTooltip], although others feel the [ROOT.GetCountry.GetGovernment.GetRulerTitle] may have greater ambitions towards the contested throne of [ShowRegionNameWithNoTooltip('france_region')]."
 flavor_nav.3.a: "Maintain the affairs of the [ROOT.GetCountry.GetGovernment.GetCourtTitle] in our holdings in [ShowRegionNameWithNoTooltip('france_region')]."
 flavor_nav.3.b: "Have the primary [ROOT.GetCountry.GetGovernment.GetCourtTitle] in [ROOT.GetCountry.GetNameWithNoTooltip]."
 flavor_nav.3.c: "Focus our rule from [evr_country.GetNameWithNoTooltip]."
 flavor_nav.3.c.entry: "Focus our rule from Evreux."
 nav_will_be_able_to_rally_other_appanages_tt: "Reaching #G 150#! relations with a Appanage subject of [GetCountry('FRA').GetName] will make them more inclined to support us in a war against [GetCountry('FRA').GetNameWithNoTooltip] through the [ShowDecisionName('navarre_charles_ii_claim_to_france_appanage_route')] [decision|e]"

 flavor_nav.4.title: "The [ShowDynastyNameWithNoTooltip('capet_dynasty')] Claim"
 flavor_nav.4.entry: "The Capetian Claim"
 flavor_nav.4.desc: "Though many had suspected [target_character.GetName] to be an ambitious [ROOT.GetCountry.GetGovernment.GetRulerTitle], many did not expect to hear [target_character.GetHerHis] desire to claim the throne of [fra_country.GetName] directly. While [target_character.GetNameWithNoTooltip] claim is strong through [GetCharacter('nav_jeanne_ii_capet').GetShortName]'s [ShowDynastyName('capet_dynasty')] blood, one of the conditions of [GetCharacter('nav_jeanne_ii_capet').GetHerHis] inheritance of [ROOT.GetCountry.GetName] was to forfeit the claim to [fra_country.GetNameWithNoTooltip].\n\nWhile many lords of [fra_country.GetNameWithNoTooltip] are also unlikely to fully acknowledge [target_character.GetNameWithNoTooltip]'s claim due to the ancient [ShowHeirSelectionName('salic_law')], some feel [target_character.GetNameWithNoTooltip] should utilize [target_character.GetHerHis] political influence within [fra_country.GetNameWithNoTooltip] to persuade the more powerful lords."
 flavor_nav.4.a: "The throne of [fra_country.GetNameWithNoTooltip] is rightfully [target_character.GetNameWithNoTooltip]'s!"
 flavor_nav.4.a.entry: "The throne of France is rightfully belongs to Charles!"
 flavor_nav.4.b: "Leverage these claims for legitimacy with our [ShowCultureGroupNameWithNoTooltip('french_group')] subjects."
 flavor_nav.4.c: "[GetCharacter('nav_jeanne_ii_capet').GetNameWithNoTooltip] already relinquished [GetCharacter('nav_jeanne_ii_capet').GetHerHis] claim: Let us instead focus on ruling [ROOT.GetCountry.GetNameWithNoTooltip]."
 unlocks_enforce_the_capetian_claim_to_france_tt: "Unlocks the $navarre_charles_ii_claim_to_france.title$ [decision|e]"
 nav_appanage_support_for_french_throne_tt: "If [ROOT.GetCountry.GetNameWithNoTooltip] is an Appanage, reaching #G +150#! relations with other Appanage subjects of [GetCountry('FRA').GetNameWithNoTooltip] will incline them to to support us in a war against [GetCountry('FRA').GetNameWithNoTooltip] through the [ShowDecisionName('navarre_charles_ii_claim_to_france_appanage_route')] [decision|e]"

 flavor_nav.5.title: "Alliance with [target_character_2.GetNameWithNoTooltip]"
 flavor_nav.5.entry: "Alliance with Etienne Marcel"
 flavor_nav.5.desc: "Initially, many of [target_character.GetName]'s efforts to garner support were stalled, with multiple [fra_country.GetAdjectiveWithNoTooltip] lords expressing their loyalty to [fra_ruler.GetName] and rejecting [target_character.GetNameWithNoTooltip]'s claim. But while [target_character.GetNameWithNoTooltip] has managed to sway some lesser [fra_country.GetAdjectiveWithNoTooltip] lords, many of [target_character.GetShortNameWithNoTooltip]'s advisors did not expect to hear that the prominent [target_character_2.GetName] was willing to throw [target_character_2.GetHerHis] support behind [target_character.GetNameWithNoTooltip]. Although a member of the [fra_country.GetAdjectiveWithNoTooltip] [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')], [target_character_2.GetNameWithNoTooltip] has long been a thorn in the side of [fra_ruler.GetNameWithNoTooltip], stalling many of [fra_ruler.GetHerHis] efforts in the Estates-General. Although [target_character_2.GetNameWithNoTooltip] would prove an invaluable asset, some fear [target_character_2.GetHerHis] ambitions may diverge from those of [target_character.GetNameWithNoTooltip], and therefore [target_character_2.GetSheHe] may prove a liability.\n\nFurthermore, [target_character_2.GetNameWithNoTooltip] has brought news that the lords of [nrm_country.GetName] have grown discontent with [fra_ruler.GetNameWithNoTooltip], and would likely be willing to offer their support to [target_character.GetShortNameWithNoTooltip]."
 flavor_nav.5.a: "[target_character_2.GetNameWithNoTooltip] will prove a invaluable collaborator."
 flavor_nav.5.a.entry: "Etienne Marcel will prove a invaluable collaborator."
 flavor_nav.5.b: "Have [target_character_2.GetHerHim] siphon income from [fra_country.GetNameWithNoTooltip] into our coffers."
 flavor_nav.5.b.entry: "Have him siphon income from France into our coffers."
 flavor_nav.5.c: "Reject [target_character_2.GetHerHis] assistance entirely. We shall take [fra_country.GetNameWithNoTooltip] without [target_character_2.GetHerHis] scheming."
 flavor_nav.5.c.entry: "Reject his assistance entirely. We shall take France without his scheming."
 nav_decision_seizure_of_duchy_of_normandy_tt: "Unlocks the $nav_coercing_of_normandy.title$ [decision|e]"

 flavor_nav.6.title: "A Fiery End"
 flavor_nav.6.entry: "The Burning Death of Charles of Navarre"
 flavor_nav.6.desc: "Although [target_character.GetName]'s health has declined in recent years, the [ROOT.GetCountry.GetGovernment.GetCourtTitle] was still stunned by the news that [target_character.GetSheHe] had died in a fire in [target_character.GetHerHis] chambers the previous night. Rumors swirling in the [ROOT.GetCountry.GetGovernment.GetCourtTitle] whispered that while being treated for [target_character.GetHerHis] illness, a candle fell into [target_character.GetNameWithNoTooltip]'s bed and set it ablaze.\n\n[scope_our_heir.GetName] now ascends the throne with fewer ambitions than [our_ruler.GetHerHis] predecessor, and many wonder how the scribes of [ROOT.GetCountry.GetName] will remember [target_character.GetNameWithNoTooltip]'s rule."
 flavor_nav.6.a: "[target_character.GetHerHis|U] reign will be remembered as an ambitious, but terrible one."
 flavor_nav.6.b: "[target_character.GetSheHe|U] shall be remembered as the Conqueror of [GetCountry('FRA').GetNameWithNoTooltip]!"
 flavor_nav.6.c: "[target_character.GetSheHe|U] shall be remembered for [target_character.GetHerHis] shift towards [ROOT.GetCountry.GetNameWithNoTooltip], despite [target_character.GetHerHis] [ShowCultureGroupNameWithNoTooltip('french_group')] origins."
 flavor_nav.6.d: "We should instead look towards the future."

 flavor_nav.7.title: "The Disputed Borderlands"
 flavor_nav.7.entry: "Division of the Border Regions"
 flavor_nav.7.desc: "Although relations between [ROOT.GetCountry.GetName] and [cas_country.GetName] have been hostile in the past, the rulers of [cas_country.GetNameWithNoTooltip] have never sought a full conquest of the [ROOT.GetCountry.GetFlavorRank]. However, in the borderlands of [ShowProvinceDefinitionName('biscay_province')], [ShowProvinceDefinitionName('gipuzkoa_province')], and [ShowProvinceDefinitionName('alava_province')], tensions have been mounting between the more powerful local families for some time over the region's poorly defined borders.\n\nWhile representatives for [cas_country.GetNameWithNoTooltip] and [our_ruler.GetName] have worked towards resolving the border disputes, the outbreak of the [ShowDisasterNameWithNoTooltip('castilian_civil_war')] in [cas_country.GetNameWithNoTooltip] has greatly stalled further negotiations, resulting in even more strife between the prominent regional dynasties.\n\nWith [cas_country.GetNameWithNoTooltip] now mired in internal conflict, representatives from these local families have petitioned [our_ruler.GetNameWithNoTooltip] to launch an invasion to claim the disputed lands."
 flavor_nav.7.a: "These territorial disputes, if not resolved, will likely continue to anger the [ROOT.GetCountry.GetAdjectiveWithNoTooltip] families."
 flavor_nav.7.b: "Suspend any further diplomatic talks: we must ensure our claim to the region stands!"

 flavor_nav.8.title: "Power Vacuum Spills Into [ROOT.GetCountry.GetNameWithNoTooltip]"
 flavor_nav.8.entry: "Power Vacuum Spills Into Navarre"
 flavor_nav.8.desc: "While the [ShowDisasterNameWithNoTooltip('castilian_civil_war')] has ended, the aftermath throughout [ShowRegionName('iberia_region')] is still being felt. With much of the borderlands now less garrisoned, much of the bad blood between families of the region has evolved into open warfare.\n\nDue to the low strength of [cas_country.GetName], the intensity of the conflict in the region would prove a daunting task for the [ROOT.GetCountry.GetGovernment.GetCourtTitle] of [ROOT.GetCountry.GetName] to resolve alone."
 flavor_nav.8.a: "Dangerous Times are ahead for [ROOT.GetCountry.GetNameWithNoTooltip]."
 nav_end_blood_feud_decision_enabled_tt: "Unlocks the $nav_end_the_blood_feuds.title$ [decision|e]"
 nav_sow_division_in_the_borderlands_enabled_tt: "Unlocks the $nav_sow_division_in_the_borderlands.title$ [decision|e]"

 flavor_nav.9.title: "Dissolution of [ShowProvinceDefinitionNameWithNoTooltip('biscay_province')]"
 flavor_nav.9.entry: "Dissolution of Biscay"
 flavor_nav.9.desc: "Though control of [ShowProvinceDefinitionName('biscay_province')] has long been contested by [cas_country.GetName] and [ROOT.GetCountry.GetName], the region has been home to many prominent families, of which the Haro dynasty have served as the most influential and faithful vassals. However, [cas_country.GetNameWithNoTooltip] have taken to directly dissolving titles in the region, and subsequently annexing areas within [ShowProvinceDefinitionNameWithNoTooltip('biscay_province')] that were in dispute.\n\nThese actions by [cas_country.GetNameWithNoTooltip] have greatly enraged the Haro family, who have urged the [ROOT.GetCountry.GetGovernment.GetCourtTitle] to fund the rebels in [ShowProvinceDefinitionNameWithNoTooltip('biscay_province')] as to crack down on those who sided with [cas_country.GetAdjectiveWithNoTooltip]'s annexation of the region."
 flavor_nav.9.a: "We cannot acquiesce to the Haro family's requests without incurring [cas_country.GetAdjectiveWithNoTooltip] wrath."
 flavor_nav.9.a.entry: "We cannot acquiesce to the Haro family's requests without incurring Castilian wrath."
 flavor_nav.9.b: "Support the Haro family as they sow local anarchy."

 flavor_nav.10.title: "Clash of the Leguizamon and Zamudiano in [target_location.GetNameWithNoTooltip]"
 flavor_nav.10.entry: "Clash of the Leguizamon and Zamudiano"
 flavor_nav.10.desc: "Although the Leguizamon and Zamudiano families have held strong influence in [ROOT.GetCountry.GetName], they have also long since been bitter rivals. With the power vacuum caused by the [ShowDisasterNameWithNoTooltip('castilian_civil_war')], the two families have been involved in constant skirmishes across northern [ShowRegionName('iberia_region')]. However, the recent clash in [target_location.GetName] has proven to be a disaster for the [target_location.GetRank.GetName], with much of the populace affected.\n\nWith this feud now reaching dangerous levels, many have petitioned [our_ruler.GetNameWithNoTooltip] to use what authority [our_ruler.GetSheHe] can to weaken these quarrelling families."
 flavor_nav.10.a: "Leverage [our_ruler.GetShortNameWithNoTooltip]'s authority to prevent further bloodshed."
 flavor_nav.10.a.entry: "Leverage the authority of the crown to prevent further bloodshed."
 flavor_nav.10.b: "We have no choice but to let them continue."

 flavor_nav.11.title: "[ROOT.GetCountry.GetAdjectiveWithNoTooltip] Backed Families Achieve Superiority in the [ShowScriptedGeographyNameWithNoTooltip('nav_contested_basque_borderlands')]"
 flavor_nav.11.entry: "Navarrese Backed Families Achieve Superiority in the Borderlands"
 flavor_nav.11.desc: "Although the conflicts between the Pro [ROOT.GetCountry.GetAdjective] and [GetCountry('CAS').GetAdjective] families in the [ShowScriptedGeographyName('nav_contested_basque_borderlands')] has left a devastating effect on the region, [ROOT.GetCountry.GetAdjectiveWithNoTooltip] families have managed to do the near impossible, and restore much of [ROOT.GetCountry.GetNameWithNoTooltip]'s influence over the [ShowScriptedGeographyNameWithNoTooltip('nav_contested_basque_borderlands')]. While [GetCountry('CAS').GetNameWithNoTooltip] may still maneuver to reassert its control over the region, it will undoubtedly prove a costly affair for the [GetCountry('CAS').GetAdjectiveWithNoTooltip] [GetCountry('CAS').GetGovernment.GetCourtTitle]."
 flavor_nav.11.a: "Let this pave the way for a stronger [ROOT.GetCountry.GetNameWithNoTooltip]."
 navarre_gains_castile_basque_lands_tt: "All locations owned by [GetCountry('CAS').GetName] in the [ShowScriptedGeographyName('nav_contested_basque_borderlands')] will have a high chance to change ownership to [ROOT.GetCountry.GetName], unless [GetCountry('CAS').GetNameWithNoTooltip] decide to take drastic measure to retain control over the territories"

 flavor_nav.12.title: "Strengthening of the Hermandades"
 flavor_nav.12.entry: "$flavor_nav.12.title$"
 flavor_nav.12.desc: "Although the Hermandades of [ROOT.GetCountry.GetName] have proven capable allies in the past, the decades of blood feuds between various families of [ROOT.GetCountry.GetAdjectiveWithNoTooltip] has reached a boiling point.\n\nMany members of the [ROOT.GetCountry.GetGovernment.GetCourtTitle] have contributed funds to sponsor the [ROOT.GetCountry.GetGovernment.GetAdjective|U] branch of the Hermandades. Although an expensive affair, once empowered, the Hermandades will help enforce [our_ruler.GetName]'s authority over the feuding families and help rein them in for good."
 flavor_nav.12.a: "The Hermandades will finally put a stop to these familial squabbles."

 flavor_nav.13.title: "[target_character.GetNameWithNoTooltip] and the Tutelage of [scope_our_heir.GetNameWithNoTooltip]"
 flavor_nav.13.entry: "Juan de Beaumont and the Tutelage of the Heir"
 flavor_nav.13.desc: "Although they have held influence within [ROOT.GetCountry.GetName] for some time, the offer by the Beaumonteses to personally tutor [scope_our_heir.GetName] has come as a surprise. While [target_character.GetName] has a reputation for being an honorable man, some advisors fear [target_character.GetHerHis] offer of tutelage may be a maneuver to curry favor with [scope_our_heir.GetNameWithNoTooltip], who will one day rule [ROOT.GetCountry.GetAdjectiveWithNoTooltip]."
 flavor_nav.13.a: "[target_character.GetHeShe|U] would make for an excellent tutor."
 flavor_nav.13.a.entry: "He would make for an excellent tutor."
 flavor_nav.13.b: "We cannot risk [target_character.GetHerHim] having influence over our [scope_our_heir.GetNameWithNoTooltip]."
 flavor_nav.13.b.entry: "We cannot risk him having influence over our heir."

 flavor_nav.14.title: "[scope_our_consort.GetNameWithNoTooltip] and [target_character.GetNameWithNoTooltip]"
 flavor_nav.14.entry: "Influence of the Consort and Pedro de Peralta"
 flavor_nav.14.desc: "One of the prominent houses in the [ROOT.GetCountry.GetGovernment.GetCourtTitle], the Agramonteses, have been amassing considerable influence under [target_character.GetName], while also establishing a close partnership with [scope_our_consort.GetName]. While their contributions have borne fruit for [ROOT.GetCountry.GetName], some fear there may be darker goals hidden in their scheming."
 flavor_nav.14.a: "The Agramonteses have served us well."
 flavor_nav.14.b: "[target_character.GetHerHis|U] influence with [scope_our_consort.GetNameWithNoTooltip] is concerning: move to seperate them."
 flavor_nav.14.b.entry: "His influence with the Consort is concerning: move to seperate them."

 flavor_nav.15.title: "The Looming Usurpation of [the_legal_heir.GetNameWithNoTooltip]"
 flavor_nav.15.entry: "The Looming Usurpation of the Heir"
 flavor_nav.15.desc: "Though [our_ruler.GetName] has maintained a steady rule, [our_ruler.GetSheHe] has recently become bedridden and ill. Fearing the end of the [ROOT.GetCountry.GetGovernment.GetRulerTitle]'s life is near, Agramontese supporters loyal to [the_consort_usurper.GetName] have quietly crowned [the_consort_usurper.GetHerHim] the new ruler of [ROOT.GetCountry.GetName].\n\nWhile [the_legal_heir.GetNameWithNoTooltip] is away from [ROOT.GetCountry.GetGovernment.GetCourtTitle], some among the Beaumonteses have secretly sent letters to [the_legal_heir.GetHerHis] retinue, hoping to inform [the_legal_heir.GetHerHim] of the Agramontese betrayal. Should the letters arrive in a timely manner, there may be time to rally enough support to crush the Agramontese plot before it can come to fruition."
 flavor_nav.15.a: "[the_consort_usurper.GetNameWithNoTooltip] is more fit to lead [ROOT.GetCountry.GetNameWithNoTooltip]."
 flavor_nav.15.a.entry: "The court is more fit to lead Navarre."
 flavor_nav.15.b: "Side with [the_legal_heir.GetNameWithNoTooltip], the legal ruler of [ROOT.GetCountry.GetNameWithNoTooltip]!"
 flavor_nav.15.b.entry: "Side with the our heir, the legal ruler of Navarre!"
 flavor_nav.15.historical_info: "The co-rulers Blanche I and John II decreed that their son Charles, the Prince of Viana, should inherit the throne of Navarre upon Blanche’s death. However, instead of the throne passing to Charles, John II chose to retain governance of the lands of Navarre, effectively becoming King and overthrowing his own son. With the backing of the Beaumonteses and Agramonteses, the two would later clash in the Navarrese Civil War, which ultimately saw John II emerge victorious and retain the throne of Navarre."

 flavor_nav.16.title: "The [target_country.GetAdjectiveWithNoTooltip] Claim"
 flavor_nav.16.desc: "Having garnered considerable support throughout [ShowRegionName('france_region')], [target_character.GetName] has openly declared for the throne of [ShowRegionNameWithNoTooltip('france_region')], and has sent messengers across [ShowRegionNameWithNoTooltip('france_region')] offering one last chance to join [target_character.GetHerHim] in [target_character.GetHerHis] bid to seize it. Although [target_character.GetShortNameWithNoTooltip] have curried much favor with our [ROOT.GetCountry.GetGovernment.GetCourtTitle], some on the council fear [target_character.GetSheHe] will greatly destabilize [ShowRegionNameWithNoTooltip('france_region')], should [target_character.GetSheHe] succeed."
 flavor_nav.16.a: "We will declare for [target_character.GetNameWithNoTooltip]."
 flavor_nav.16.b: "Stay out of this conflict."
 flavor_nav.16.c: "[target_character.GetSheHe|U] must be stopped."
 nav_appanage_ally_join_war_tt: "[ROOT.GetCountry.GetName] will join [target_character.GetName]'s war for control of [ShowRegionName('france_region')]"

 flavor_nav.17.title: "Plight of the [ShowScriptedGeographyNameWithNoTooltip('nav_contested_basque_borderlands')]"
 flavor_nav.17.desc: "Many of our territories along the [ShowScriptedGeographyName('nav_contested_basque_borderlands')] with [GetCountry('NAV').GetName] have been overrun by pro-[GetCountry('NAV').GetAdjectiveWithNoTooltip] factions, with many [ShowCultureName('basque')] families loyal to [ROOT.GetCountry.GetName] having been left devastated. While some members of the [ROOT.GetCountry.GetGovernment.GetCourtTitle] feel the region is not yet lost, it will be difficult to regain authority with many of its people now beholden to the powerful [GetCountry('NAV').GetAdjectiveWithNoTooltip] families."
 flavor_nav.17.a: "Let the borderlands secede to [GetCountry('NAV').GetNameWithNoTooltip]."
 flavor_nav.17.b: "We will remember this rebellion by the [ShowCultureNameWithNoTooltip('basque')] peoples."
 flavor_nav.17.c: "Move to quickly quash the rebellion, no matter the cost!"

 flavor_nav.20.title: "San Francisco de Olite"
 flavor_nav.20.entry: "$flavor_nav.20.title$"
 flavor_nav.20.desc: "As a devoted person, [ROOT.GetCountry.GetGovernment.GetRuler.GetName] cannot accept the slow advancement of the works of the Convent of San Francisco in [ShowLocationName('olite')].\n\nThe convent was started more than a century ago and cannot be considered finished yet.\n\nDespite the impact that hurrying the works could do on our treasury, the place and our prestige could be greatly benefited."
 flavor_nav.20.a: "Praise God!"
 flavor_nav.20.b: "It has waited, it can still wait."
 flavor_nav.20.historical_info: "According to legend, Saint Francis of Assisi founded the Olite convent during his pilgrimage to Santiago de Compostela (around 1213-1214).\n\nFounded by King Theobald II, later Navarrese monarchs, especially Jeanne II and Charles II, supported the order financially and spiritually, fostering its growth and devotion.\n\nOver time, the convent underwent changes, becoming an 'Apostolic College' for training and sending missionaries to Spain and America, or serving as a hospital during the Convention War in 1795."
 flavor_nav.21.title: "The Call of the Church"
 flavor_nav.21.entry: "$flavor_nav.21.title$"
 flavor_nav.21.desc: "[target_character.GetName], the first and oldest daughter of our [ROOT.GetCountry.GetGovernment.GetRuler.GetName], is waiting for the entourage that will accompany her to her new life in [ShowLocationName('paris')].\n\nWhen she was born, the stars seemed to smile at her, being the heiress to all that her parents owned, but no more. Her marriage with [GetCountry('ARA').GetGovernment.GetRuler.GetName] was canceled and she became an obstacle for her younger sister [target_sister.GetShortName].\n\nNow she will join the [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] in [ShowLocationNameWithNoTooltip('paris')] and serve our Lord and Saviour.\n\nHowever, some wonder if she could not be still of use to the realm, and be a possible asset in other diplomatic negotiations."
 flavor_nav.21.a: "She will become a nun."
 flavor_nav.21.b: "She can still be of use."
 flavor_nav.21.historical_info: "Despite the fact that Jeanne was betrothed to Peter IV of Aragon, the marriage never happened. Historians propose that she may have suffered a condition or illness that made her unappealing as a spouse. Maria, her younger sister, took her place and married Peter instead.\n\nBecause this marriage happened, Jeanne was forced to renounce her succession rights, and entered the Franciscan Abbey of Longchamp near Paris as a member of the Poor Clares."
 flavor_nav.30.title: "Irrigation Projects in Tudela"
 flavor_nav.30.entry: "$flavor_nav.30.title$"
 flavor_nav.30.desc: "Even when our [ROOT.GetCountry.GetGovernment.GetRulerTitle] spends a lot of [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] time in [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] possessions in [ShowRegionName('france_region')], [ROOT.GetCountry.GetGovernment.GetRuler.GetSheHe] always has time to develop new projects in the [ROOT.GetCountry.GetLongName].\n\nThe southern parts of the [ROOT.GetCountry.GetFlavorRank], around [ShowLocationName('tudela')], are known for their fertility, but also their dryness, and digging some canals to improve the irrigation of the fields can make the crops grow stronger."
 flavor_nav.30.a: "The terrain will be far more productive."
 flavor_nav.30.b: "We cannot indulge ourselves with these expenses."
 flavor_nav.30.historical_info: "During their reign, both Jeanne II and Philippe III undertook several economic development projects across the Kingdom of Navarre, including the expansion of the irrigation systems around Tudela, the most important city in the south of the Kingdom."
 flavor_nav.40.title: "A Copy of the Fueros of Navarra"
 flavor_nav.40.entry: "$flavor_nav.40.title$"
 flavor_nav.40.desc: "As the involvement of the [ROOT.GetCountry.GetGovernment.GetRulerTitle] with the daily duties of the realm becomes more common, a copy of the #italic Fueros of Navarre#! has been ordered for [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis].\n\nThe proposed copy will be beautifully decorated, with a nice leather cover of the best quality and written by the most skillful copists in the realm. As it is traditional, the text will be written in [spanish_language.GetName], with its interesting [basque_language.GetName] terms here and there.\n\nUnfortunately, our [ROOT.GetCountry.GetGovernment.GetRulerTitle] speaks in [french_language.GetName] and cannot speak the Navarrese Romance."
 flavor_nav.40.a: "A translation to [french_language.GetNameWithNoTooltip] will be added."
 flavor_nav.40.a.entry: "A translation to [ShowLanguageNameWithNoTooltip('french_language')] will be added."
 flavor_nav.40.b: "Perhaps it is time our rulers learn the language of the land."
 flavor_nav.40.c: "Basque should be the official language if it is the most spoken."
 flavor_nav.40.historical_info: "While it is likely that most of the population in the Kingdom of Navarra had Basque (#italic Lingua Navarrorum#!) as their mother language, the official documentation of the realm was mostly written in Navarro-Aragonese (#italic Ydiomate Navarre Terrae#!, #italic Ydiomate Navarre#! or #italic Lengoage de Navarra#!) as Occitan fell in decay.\n\nAdditionally, French variants were also common since the first French dynasties entered the realm, starting with the House of Champagne in 1234."
 flavor_nav.50.title: "The Siege of Algeciras"
 flavor_nav.50.entry: "$flavor_nav.50.title$"
 flavor_nav.50.desc: "News of war in the [target_country.GetAdjective] border has reached the realm. [GetCountry('CAS').GetName] has resumed the Crusade against [target_country.GetNameWithNoTooltip] and [target_character.GetName] has quickly returned to [ROOT.GetCountry.GetName] to take part in the fights.\n\nDespite the apparent lack of benefit for our [ROOT.GetCountry.GetFlavorRank], we have always felt it was our duty to help our neighbors expel the [ShowReligionGroupAdjective('muslim')] from [ShowRegionName('iberia_region')]."
 flavor_nav.50.a: "[target_character.GetShortNameWithNoTooltip] will command our fighters."
 flavor_nav.50.a.entry: "The character will command our fighters."
 flavor_nav.50.b: "We must send men to the Crusade, but we should not send [target_character.GetShortNameWithNoTooltip]."
 flavor_nav.50.b.entry: "We must send men to the Crusade, but we should not send him."
 flavor_nav.50.c: "This is not [ROOT.GetCountry.GetNameWithNoTooltip]'s business."
 flavor_nav.50.c.entry: "This is not our business."
 flavor_nav.50.historical_info: "In 1343, King Philippe of Navarre prepared to join the crusade against Granada, emphasizing his duty as ruler of an Iberian kingdom. His presence at the siege of Algeciras, supported by provisions from the Bay of Biscay, was crucial despite a small military force. Unfortunately, Philippe fell ill, leading to his death in September 1343. His body was returned to Pamplona for burial, while his heart found its resting place in Paris. Jeanne, his widow, received condolences from Pope Clement VI. Algeciras eventually fell, and Jeanne continued to reign until she died in 1349, leaving the crown to their son, Charles II."
 flavor_nav.60.title: "The Will of a Queen"
 flavor_nav.60.entry: "$flavor_nav.60.title$"
 flavor_nav.60.desc: "The [target_character.GetName] is dead and her will has been read. In it, [target_character.GetSheHeFormal] asks her successor to add a chapel to the church of Santa Maria la Real in [ShowLocationName('olite')].\n\nSome courtiers have proposed devoting the chapel to the Conception of Holy Mary, and our ruler, [ROOT.GetCountry.GetGovernment.GetRuler.GetName], is quite convinced of the idea as [ROOT.GetCountry.GetGovernment.GetRuler.GetSheHe] knows how pious [target_character.GetShortNameWithNoTooltip] was."
 flavor_nav.60.a: "The will of a mother must be obeyed."
 flavor_nav.60.b: "We have better uses for that money in mind."
 flavor_nav.60.historical_info: "When Queen Jeanne II died of Black Death in 1349, her last will was read and among her requests, she asked her son Charles II to finance a chapel in the gothic church of Santa Maria La Real de Olite.\n\nThis church was used by the House of Evreux in their religious acts and it is influenced in its style by the Parisian Cathedral of Notre Dame."

 # Decisions
 navarre_charles_ii_claim_to_france.title: "Rightful Claim to [GetCountry('FRA').GetNameWithNoTooltip]"
 navarre_charles_ii_claim_to_france.desc: "Although [GetCharacter('nav_jeanne_ii_capet').GetName] abandoned [GetCharacter('nav_jeanne_ii_capet').GetHerHis] claim to [GetCountry('FRA').GetNameWithNoTooltip], [GetCharacter('nav_charles_ii_evreux').GetName] still maintains a direct blood lineage to the old [GetCharacter('fra_louis_x_capet').GetName]. Even should the [ShowHeirSelectionName('salic_law')] wrongly decree [GetCharacter('nav_charles_ii_evreux').GetNameWithNoTooltip] ineligible, [GetCharacter('nav_charles_ii_evreux').GetNameWithNoTooltip]'s claim is still stronger than that of the current rulers of [GetCountry('FRA').GetNameWithNoTooltip]!"
 navarre_charles_ii_claim_to_france.a: "Now is the time to press our rightful claim to [GetCountry('FRA').GetNameWithNoTooltip]!"

 navarre_charles_ii_claim_to_france_appanage_route.title: "$navarre_charles_ii_claim_to_france.title$"
 navarre_charles_ii_claim_to_france_appanage_route.desc: "$navarre_charles_ii_claim_to_france.desc$"
 navarre_charles_ii_claim_to_france_appanage_route.a: "The time has come to launch a civil war to claim the throne!" 
 nav_appanage_willingness_to_join_tt: "Reaching #G +150#! relations with other Appanage subjects of [GetCountry('FRA').GetNameWithNoTooltip] will make them incline to support us in a war against [GetCountry('FRA').GetNameWithNoTooltip] to seize the throne"

 nav_coercing_of_normandy.title: "Coercion of [GetCountry('NRM').GetNameWithNoTooltip]"
 nav_coercing_of_normandy.desc: "Having been at the front of the [ShowSituationNameWithNoTooltip('hundred_years_war')], many of the lords of [GetCountry('NRM').GetName] have grown dissatisfied with the current ruler of [GetCountry('FRA').GetName]. Through the inheritance of [GetCharacter('nav_philip_iii_evreux').GetName]'s lands, [GetCharacter('nav_charles_ii_evreux').GetName] has maintained close connections with people in the [GetCountry('NRM').GetFlavorRank], some of whom may be open to accepting [GetCharacter('nav_philip_iii_evreux').GetShortNameWithNoTooltip] as their new liege lord."
 nav_coercing_of_normandy.a: "Seize control of [GetCountry('NRM').GetNameWithNoTooltip]!" 

 nav_end_the_blood_feuds.title: "End the Blood Feuds"
 nav_end_the_blood_feuds.desc: "Since the end of the [ShowDisasterName('castilian_civil_war')], much of [GetCountry('NAV').GetName] has been the subject of long-held blood feuds between the families who became emboldened by weakened regional [GetCountry('CAS').GetAdjectiveWithNoTooltip] influence. Now with [GetCountry('NAV').GetAdjectiveWithNoTooltip] influence strengthened, we can leverage it and put an end to these feuds for good."
 nav_end_the_blood_feuds.a: "Authority has been restored!"  

 nav_sow_division_in_the_borderlands.title: "Sow Division in the Borderlands"
 nav_sow_division_in_the_borderlands.desc: "With [GetCountry('CAS').GetAdjective] influence in the [ShowScriptedGeographyName('nav_contested_basque_borderlands')] a fraction of what it used to be, the ongoing feuds between the families in the region loyal to [GetCountry('NAV').GetName] may prove useful, should we choose to endorse their open warfare against the other families still loyal to [GetCountry('CAS').GetNameWithNoTooltip]. Although it may prove a costly effort, the [ShowScriptedGeographyNameWithNoTooltip('nav_contested_basque_borderlands')] may reunite with [GetCountry('NAV').GetNameWithNoTooltip] once more."
 nav_sow_division_in_the_borderlands.a: "Grant permission to raze rival family holdings."  
 nav_sow_division_in_the_borderlands.b: "Burn the borderlands outskirts." 
 nav_sow_division_in_the_borderlands.c: "Sow distrust within the [GetCountry('CAS').GetAdjectiveWithNoTooltip] held lands." 
 nav_sow_division_in_the_borderlands_a_tt: "Every [location|e] [owned|e] by [GetCountry('CAS').GetName] in [ShowScriptedGeographyName('nav_contested_basque_borderlands')] will gain [ShowModifier('nav_feud_crossfire')] for 3 years and will lose heavy [prosperity|e] and [pop_satisfaction|e]"
 nav_sow_division_in_the_borderlands_b_tt: "Every [location|e] [owned|e] by [GetCountry('CAS').GetName] in [ShowScriptedGeographyName('nav_contested_basque_borderlands')] will gain [ShowModifier('nav_destructive_feuds')] for 3 years and lose mild [prosperity|e], [pop_satisfaction|e], and [development|e]"
 nav_sow_division_in_the_borderlands_c_tt: "Every [location|e] [owned|e] by [GetCountry('CAS').GetName] in [ShowScriptedGeographyName('nav_contested_basque_borderlands')] will gain [ShowModifier('nav_widespread_distrust_caused_by_feuds')] for 3 years and lose mild [prosperity|e], [pop_satisfaction|e], and [control|e]"
