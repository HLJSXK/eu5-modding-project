l_english:
 flavor_tun.1.desc: "$ibn_khaldun_patronage$"
 flavor_tun.1.entry: "$flavor_gra.5.title$"
 flavor_tun.1.a: "Very well."
 flavor_tun.1.b: "We care not for such frivolous expenses!"

 tun_have_more_gp_score_than_us: "No [ShowReligionAdjective('sunni')] [country|e] has more [great_power_score|e] than [THIS.GetCountry.GetName]"

 flavor_tun.2.caliphal_backstory: "It was during the collapse of the [GetCountry('ALM').GetAdjective] Caliphate that our state was formed. At that time, the founder of the [ShowDynastyName('hafsid_dynasty')] dynasty, the venerable 'Abū Zakariyyā, claimed the title of #italic 'Amīr al-Mu'minīn#!, taking on the role of $rank_empire_muslim_ruler_male$ and #italic de facto#! proclaiming independence. This claim would be immediately recognized by the [ShowDynastyName('nasrid_dynasty')] of [ShowCountryNameIfActive('GRA')], as well as the leaders of other [ShowCultureName('andalusi')] towns. When the states of [ShowCountryNameIfActive('TLE')] and [ShowCountryNameIfActive('MOR')] were established, they too quickly recognized our claim. Our authority is respected as far away as Holy City of [ShowLocationName('mecca')], where the Šarīf had recognized our caliphal claim in 1259 following the recent fall of the Abbasids to the Mongols."

 flavor_tun.2.title: "Faltering of the Caliphate"
 flavor_tun.2.entry: "$flavor_tun.2.title$"
 flavor_tun.2.desc: "$flavor_tun.2.caliphal_backstory$\n\nToday, little of that past splendor remains. Our internal issues have greatly weakened the authority of our [ROOT.GetCountry.GetGovernment.GetRulerTitle], who is a $rank_empire_muslim_ruler_male$ in nothing but name. We must return caliphal authority to the [ROOT.GetCountry.GetLongName]!"
 flavor_tun.2.a: "We will make them respect us!"
 flavor_tun.2.b: "Abandon the title."
 tun_caliphate_decision_enabled: "Enables the [ShowDecisionName('hafsid_caliphate_decision')] [decision|e]"

 flavor_tun.3.title: "Restore Caliphal Authority"
 flavor_tun.3.desc: "$flavor_tun.2.caliphal_backstory$\n\nDespite how this authority faltered in the following century, we managed to bring the [ROOT.GetCountry.GetLongName] back from the brink of irrelevance. The [ROOT.GetCountry.GetFlavorRank] is now once again one of the principal states in the [ROOT.GetCountry.GetReligion.GetGroup.GetAdjective] world."
 flavor_tun.3.a: "We will take good care of the #italic 'Umma#!!"
 hafsid_caliphate_name_tt: "Our name will include the title #Y Caliphate#!"
 
 hafsid_caliphate_decision.title: "$flavor_tun.3.title$"
 hafsid_caliphate_decision.entry: "$flavor_tun.3.title$"
 hafsid_caliphate_decision.desc: "$flavor_tun.3.desc$"
 hafsid_caliphate_decision.desc.entry: "We failed to secure ourselves as the successors to the [GetCountry('ALM').GetAdjective] Caliphate. This cannot stand! Our spot as the heads of the [ShowReligionAdjective('sunni')] community must be reclaimed!"
 hafsid_caliphate_decision.a: "$flavor_tun.3.a$"

 flavor_tun.4.title: "Succession of [aging_monarch.GetNameWithNoTooltip]"
 flavor_tun.4.entry: "Succession of [GetCharacter('tun_abu_yahya_abu_bakr_ii').GetNameWithNoTooltip]"
 flavor_tun.4.desc: "[aging_monarch.GetName] is increasingly concerned with the gloomiest, yet most vital decision an aging monarch has to make: appointing [aging_monarch.GetHerHis] successor. Such an appointment should be rather obvious, too, for [preferred_heir.GetName] has always been the favorite of our dear [ROOT.GetCountry.GetGovernment.GetRulerTitle]. The issue lies with [aging_monarch.GetHerHis] other children, [future_usurper.GetName], who aids the government in [ROOT.GetCountry.GetCapital.GetName], and [third_way.GetName] of [target_country2.GetName], a possible pretender to the throne.\n\nThis choice will have a profound impact on the stability of the [ROOT.GetCountry.GetLongName] long after the death of [aging_monarch.GetShortNameWithNoTooltip]."
 flavor_tun.4.a: "Let [preferred_heir.GetNameWithNoTooltip] of [target_country.GetNameWithNoTooltip] take over."
 flavor_tun.4.a.entry: "Let [GetCharacter('tun_abu_l_abbas_ahmad').GetNameWithNoTooltip] of $GFS$ take over."
 flavor_tun.4.b: "[future_usurper.GetNameWithNoTooltip] is a safe choice." 
 flavor_tun.4.b.entry: "[GetCharacter('tun_abu_hafs_umar').GetNameWithNoTooltip] is a safe choice." 
 flavor_tun.4.c: "[third_way.GetNameWithNoTooltip] would help unite the realms." 
 flavor_tun.4.c.entry: "[GetCharacter('tun_abu_zakariya_yahya').GetNameWithNoTooltip] would help unite the realms." 
 TUN_THIS_will_be_appointed_heir_tt: "[THIS.GetCharacter.GetName] will be appointed as the [heir|e] to [ROOT.GetCountry.GetName]"
 TUN_unite_two_realms_tt: "As [THIS.GetCharacter.GetName] is the [ruler|e] of a [ShowSubjectTypeName('familial_governor')] in [THIS.GetCharacter.GetCourtCountry.GetName], when [THIS.GetCharacter.GetSheHe] acceeds to the throne, the two states will unite"
 TUN_civil_war_from_preferred_heir_tt: "As [preferred_heir.GetName] is the preferred heir, [preferred_heir.GetSheHe] will promptly cause a [war|e] with the backing of the [ShowEstateTypeName('tribes_estate')], which will cause our [locations|e] contained in [ShowScriptedGeographyName('gafsa_sphere_of_influence_geography')] to defect"
 TUN_abu_hafs_will_try_to_start_a_civil_war_tt: "[future_usurper.GetName] might try to usurp the throne from [THIS.GetCharacter.GetName]"
 TUN_we_will_succeed_when_target_ruler_dies_tt: "[ROOT.GetCountry.GetGovernment.GetRuler.GetName] will accede to the throne of [from_country.GetName], uniting the two countries under [from_country.GetAdjectiveWithNoTooltip] banner should no usurpation happen"

 flavor_tun.5.title: "An Appointment in [from_country.GetNameWithNoTooltip]"
 flavor_tun.5.desc_positive: "Great news! [aging_monarch.GetName] of the [from_country.GetLongName] has just appointed [preferred_heir.GetName] as the heir to [aging_monarch.GetHerHis] [from_country.GetFlavorRank]. This is unsurprising, as [preferred_heir.GetShortNameWithNoTooltip] has been recognized as the expected successor for a long time. With such a leader at its helm, the future seems bright for [ShowScriptedGeographyName('ifriqiya_geography')]."
 flavor_tun.5.desc_negative: "Damnation! In an unprecedented move, [aging_monarch.GetName] of [from_country.GetName] has just appointed [appointed_heir.GetName] to succeed [aging_monarch.GetHerHim]. It is known in [ShowScriptedGeographyName('ifriqiya_geography')] that [preferred_heir.GetName] is the most popular candidate and a natural successor, so something illicit must have happened in order for [appointed_heir.GetNameWithNoTooltip] to have been named the heir."
 flavor_tun.5.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 flavor_tun.5.b: "[preferred_heir.GetNameWithNoTooltip] will not stand for this!"
 flavor_tun.5.c: "We will have to live with it."

 flavor_tun.6.title: "An Expected Response"
 flavor_tun.6.desc: "As anticipated, the appointment of [appointed_heir.GetName] has not gone over well with [preferred_heir.GetName], who quickly moved to contest the appointment. With the backing of the [ShowEstateTypeName('tribes_estate')], [target_country.GetName] has declared a war for the throne of [ROOT.GetCountry.GetName], and the armies of [preferred_heir.GetShortNameWithNoTooltip] are on the way to [ROOT.GetCountry.GetCapital.GetName]."
 flavor_tun.6.a: "[ROOT.GetCountry.Custom('common_string_negative')]"
 GFS_will_receive_following: "If [target_country.GetName] chooses to fight a [war|e] over this:"

 flavor_tun.7.title: "Succession Usurped!"
 flavor_tun.7.desc: "Despite having named [target_character2.GetName] as the successor to the [from_country.GetLongName], their defiant sibling [target_character.GetName] has chosen to exploit [target_character.GetHerHis] current position in the capital in an attempt to seize control of the [from_country.GetFlavorRank]. This will indubitably anger [target_character2.GetShortNameWithNoTooltip] of [target_country.GetName], who is sure to take up arms against [target_character.GetHerHis] [target_character2.GetSisterBrother]."
 flavor_tun.7.a: "First come, first served."
 flavor_tun.7.b: "This is outrageous! It is unfair!"

 flavor_tun.8.title: "$flavor_tun.7.title$"
 flavor_tun.8.desc: "The succession of [target_character2.GetName] in the [from_country.GetLongName] has been usurped by [target_character2.GetHerHis] [target_character.GetSisterBrother], [target_character.GetName], who swiftly moved to take control of the [from_country.GetFlavorRank] and subdued its [from_country.GetGovernment.GetCourtTitle].\n\nIt is humiliating for [target_character2.GetShortNameWithNoTooltip] have [target_character2.GetHerHis] name tarnished like this! We must punish [target_character.GetShortNameWithNoTooltip]."
 flavor_tun.8.a: "To war!"
 flavor_tun.8.b: "We cannot afford to fight."

 flavor_tun.10.title: "Emirism"
 flavor_tun.10.entry: "$flavor_tun.10.title$"
 flavor_tun.10.desc: "[ShowScriptedGeographyName('ifriqiya_geography')] is a den of lawlessness and depravity. For the better part of a century, the [ROOT.GetCountry.GetLongName] and its [ShowDynastyName('hafsid_dynasty')] subsidiaries have been unable to exert control beyond the cities, leading to widespread unrest and crime in the rural provinces. Yet, a beacon of hope spreads its light across the [ShowCultureName('andalusi')] notables and the leading sheikhs of the [ShowEstateTypeName('nobles_estate')] — that of the ideology of emirism, which espouses a future where one regional emir will rule over all of [ShowAreaName('tunis_area')], leading it to thrive once again."
 flavor_tun.10.a: "May [ROOT.GetCountry.GetReligion.GetGodName] show us the light."
 flavor_tun.10.a.entry: "May $muslim_god_name$ show us the light."
 tun_info_about_tunis_decentralization: "We should aim to remove the [ShowGovernmentReformName('tun_strong_familial_governors')] [government_reform|e] as soon as possible"
 tun_additional_benefits_for_farfanes_tt: "[ShowGovernmentReformName('catalan_merchant_privileges')] grants benefits to our [ShowModifierTypeName], depending on our [ShowUnitDefinitionName('a_farfanes')] count"

 flavor_tun.11.title: "[ShowScriptedGeographyNameWithNoTooltip('ifriqiya_geography')], Reunited"
 flavor_tun.11.desc: "The decentralization of the [ROOT.GetCountry.GetLongName] has been addressed at its core. The era of the [ShowGovernmentReformName('tun_strong_familial_governors')] is over, and all of [ShowScriptedGeographyName('ifriqiya_geography')] stands reunited under the banners of the [ROOT.GetCountry.GetGovernment.GetRulerOrHeirIfRegent.GetDynasty.GetName]. No longer will the [ROOT.GetCountry.GetAdjectiveWithNoTooltip] countryside be brutalized by rampant crime; no longer will the [ROOT.GetCountry.GetAdjectiveWithNoTooltip] emirs be blackmailed by the [ShowEstateTypeName('nobles_estate')]; no longer will the [ROOT.GetCountry.GetAdjectiveWithNoTooltip] state be dependent on the support of foreign actors.\n\nIt is a time of reckoning for the old order, and a great opportunity for us to usher in a new era."
 flavor_tun.11.a: "This is the dawn of a new era."
 flavor_tun.11.b: "A birth of a new identity."
 IFRIQIYA_NAME: "'Ifrīqiya"
 IFRIQIYA_NAME_ADJ: "$IFRIQIYA_NAME$"

 ifriqiya_reunited_decision.title: "$flavor_tun.11.title$"
 ifriqiya_reunited_decision.entry: "$flavor_tun.11.title$"
 ifriqiya_reunited_decision.desc: "$flavor_tun.11.desc$"
 ifriqiya_reunited_decision.desc.entry: "For far too long has [ShowScriptedGeographyName('ifriqiya_geography')] been divided across many states, many of them ruled by branches of the [ShowDynastyName('hafsid_dynasty')] family. We cannot let this decentralization linger any longer."
 ifriqiya_reunited_decision.a: "$flavor_tun.11.a$"

 flavor_tun.12.title: "Growth of Piracy in [ShowLocationNameWithNoTooltip('bejaia')]"
 flavor_tun.12.entry: "$flavor_tun.12.title$"
 flavor_tun.12.desc: "In recent years, [target_location.GetName] has seen the expansion of its most unusual, yet highly productive industry — piracy in the [ShowScriptedGeographyName('mediterranean_sea_geography')]. For many decades now, local sheikhs have widely supported the [ShowBuildingTypeName('pirate_haven')] and its not-so-clandestine raids on [ShowReligionGroupAdjective('christian')] villages, despite the existing commercial relations. Such raids do actively harm our relations with potential trade partners, but the profits we derive from the [ShowPolicyName('state_piracy_policy')] cannot be understated."
 flavor_tun.12.a: "They are enemies of [ROOT.GetCountry.GetReligion.GetGodName]!"
 flavor_tun.12.a.entry: "They are enemies of $muslim_god_name$!"
 flavor_tun.12.b: "Whatever."
 flavor_tun.12.c: "Piracy will do us no good."

 flavor_tun.13.title: "Economic Stranglehold"
 flavor_tun.13.entry: "$flavor_tun.13.title$"
 flavor_tun.13.desc: "The [ShowReligionGroupAdjective('christian')] merchants in [ROOT.GetCountry.GetName] have already received wide-ranging [ShowGovernmentReformName('catalan_merchant_privileges')]. Despite those, despite the quarters that we so generously provide them, the ability to defer to their own, the freedom of religion we have granted them, the [target_country.GetAdjective] [target_country.GetGovernment.GetEstateName('burghers_estate')] still demand more — otherwise their home country may cease business with us altogether."
 flavor_tun.13.a: "The mercenaries are too important."
 flavor_tun.13.b: "Bah! We do not need their services."
 tun_economic_stranglehold_tt: "The [ShowModifierTypeName('global_merchant_power')] in [ShowGovernmentReformName('catalan_merchant_privileges')] will be decreased by #R -10.0%#!"

 flavor_tun.14.title: "Demand of a Relative"
 flavor_tun.14.desc: "One of the princes of the [ShowDynastyName('hafsid_dynasty')] family, [target_character.GetName], has grown influential enough to demand a [ShowSubjectTypeName('familial_governor')] position. Unless we acquiesce and grant [target_location.GetName] to [target_character.GetNameWithNoTooltip], we are sure to stir up trouble in the [ROOT.GetCountry.GetLongName]."
 flavor_tun.14.a: "Let [target_character.GetHerHim] have it!"
 flavor_tun.14.b: "Now is not the time."
 tun_target_character_expects_a_governorship_tt: "[target_character.GetName] expects to become a [ShowSubjectTypeName('familial_governor')], and until [target_character.GetSheHe] is granted said position via [ShowCharacterInteractionName('assign_familial_governor')], [target_character.GetSheHe] will be eligible to keep firing this [event|e]"

 flavor_tun.15.title: "Disputed Succession"
 flavor_tun.15.desc: "The death of the old [old_ruler.GetName] has left a power vacuum in [ROOT.GetCountry.GetCapital.GetName]. Nominally, [new_ruler.GetName] is supposed to take over the role of governor in [ROOT.GetCountry.GetName], yet the succession is all but guaranteed. A popular revolt, backed by an unknown actor, is currently marching through the streets of the capital, trying to guarantee the succession of [target_character2.GetName]. Will we support the rightful heir, or will we let the [ShowEstateTypeName('burghers_estate')] have their way?"
 flavor_tun.15.a: "[new_ruler.GetNameWithNoTooltip] is the rightful heir!"
 flavor_tun.15.b: "We must listen to the revolt."

 flavor_tun.16.title: "Succession of [target.GetNameWithNoTooltip]"
 flavor_tun.16.desc: "With the succession of [new_ruler.GetName], the states of the [target.GetLongName] and [ROOT.GetCountry.GetName] are once again united under a single central [ShowDynastyName('hafsid_dynasty')] ruler. Let us hope that [ShowScriptedGeographyName('ifriqiya_geography')] will soon be reunited, and will suffer from severe [ShowSocietyDirectionName('decentralization')] no longer."
 flavor_tun.16.a: "One step closer to unity."
 flavor_tun.16.b: "[ROOT.GetCountry.Custom('common_string_positive')]"
 tun_target_was_annexed_tt: "[target.GetName] was [annexed|e] into [ROOT.GetCountry.GetName]"
 
 flavor_tun.17.title: "Disputed Succession in [from_country.GetNameWithNoTooltip]"
 flavor_tun.17.desc: "Having garnered enough popular support from the [from_country.GetGovernment.GetEstateName('burghers_estate')] in [from_country.GetCapital.GetName], [target_character2.GetShortNameWithNoTooltip] has become the nominal ruler of the state, essentially denying [new_ruler.GetNameWithNoTooltip] of their rightful inheritance and us of their leadership."
 flavor_tun.17.a: "We will not stand for this!"
 flavor_tun.17.b: "Other matters concern us more."

 flavor_tun.18.title: "An [ShowCultureNameWithNoTooltip('andalusi')] Notable"
 flavor_tun.18.desc: "A local [ShowCultureName('andalusi')] [target_character.GetWomanMan], born and raised in [target_character.GetBirthLocation.GetArea.GetName], has recently advanced through the ranks and entered the [ROOT.GetCountry.GetAdjective] [ROOT.GetCountry.GetGovernment.GetCourtTitle] at [ROOT.GetCountry.GetCapital.GetName]. It would seem that [target_character.GetName] will soon become one of the [ShowEstatePrivilegeName('andalusi_elite')] members of our [ROOT.GetCountry.GetFlavorRank]."
 flavor_tun.18.a: "Splendid!"

 flavor_tun.19.title: "A New Successor?"
 flavor_tun.19.desc: "The streets of [ROOT.GetCountry.GetCapital.GetName] have echoed with murmurs and gossip as of late. The [ROOT.GetCountry.GetCapital.GetRank.GetName] is considering the rule of [target_character2.GetName], and who might be their perfect candidate to succeed [target_character2.GetHerHim]. The [ShowEstateTypeName('burghers_estate')] have chosen an illustrious character, [target_character.GetName], who they believe would be the proper successor to the throne of [ROOT.GetCountry.GetName]. Word is that the [ShowEstateTypeNameWithNoTooltip('burghers_estate')] have been swayed by [target_character.GetHerHis] generous promises of privileges and extra rights."
 flavor_tun.19.a: "Go on, appoint [target_character.GetNameWithNoTooltip]."
 flavor_tun.19.b: "Fools, if they believe this."
 