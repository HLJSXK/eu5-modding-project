l_english:
 flavor_mll.1.title: "Strained Relations with [target_country.GetNameWithNoTooltip]"
 flavor_mll.1.entry: "Strained Relations with Aragon"
 flavor_mll.1.desc: "Although the [ROOT.GetCountry.GetLongName] and the [target_country.GetLongName] have maintained a close history since the death of [GetCharacter('ara_jacme_i_arago').GetName], with [ROOT.GetCountry.GetNameWithNoTooltip] acknowledging [target_country.GetAdjectiveWithNoTooltip] suzerainty, the recent ascension of [our_ruler.GetName] has led strained relations with [target_country.GetCapital.GetName]. Seeing [our_ruler.GetHerHis] status as [ROOT.GetCountry.GetGovernment.GetRulerTitle] as equal to that of [ara_ruler.GetName], [our_ruler.GetNameWithNoTooltip] has decreed that no [ROOT.GetCountry.GetGovernment.GetRulerTitle] can be the subject of any [target_country.GetGovernment.GetRulerTitle].\n\nWhile [target_country.GetNameWithNoTooltip] have taken no hostile action towards [ROOT.GetCountry.GetNameWithNoTooltip], many in the [ROOT.GetCountry.GetGovernment.GetCourtTitle] have expressed fears that [our_ruler.GetNameWithNoTooltip]'s brashness may serve as pretext for the [target_country.GetGovernment.GetCourtTitle] of [target_country.GetNameWithNoTooltip] to seize [ROOT.GetCountry.GetNameWithNoTooltip] in the future."
 flavor_mll.1.a: "We must tread carefully in the years to come."
 repair_or_damage_relations_with_aragon_tt: "Should [ROOT.GetCountry.GetName] manage to reach #G +190#! relations with [target_country.GetName] in the coming years, relations with the [target_country.GetAdjectiveWithNoTooltip] [target_country.GetGovernment.GetCourtTitle] may become mended. Alternatively, we can make preparations to break free from [target_country.GetNameWithNoTooltip] for good"

 flavor_mll.2.title: "Recovery from the [target_country_1.GetAdjectiveWithNoTooltip] Conflict"
 flavor_mll.2.entry: "Recovery from Past Conflicts with Genoa"
 flavor_mll.2.desc: "The recent conflicts between [target_country.GetName] and [target_country_1.GetName] have had a crippling effect on the [ROOT.GetCountry.GetLongName], with many [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] ships being levied by [target_country.GetName] for their campaigns into [ShowAreaName('sardinia_area')]. Although the conflict has ended, [ROOT.GetCountry.GetAdjectiveWithNoTooltip] trade routes have been heavily disrupted, and many among the [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')] are petitioning the [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] to aid in the recovery. Others in the [ROOT.GetCountry.GetGovernment.GetCourtTitle] feel, however, that a new tax must be levied, as the loss of so many ships has led to [ROOT.GetCountry.GetNameWithNoTooltip] becoming more vulnerable to raids from the [ShowRegionName('maghreb_region')]."
 flavor_mll.2.a: "A new tax must be levied to replenish the coffers of the [ROOT.GetCountry.GetFlavorRank]."
 flavor_mll.2.b: "Divert assets from the [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')] to aid the [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')] recovery."
 
 flavor_mll.3.title: "Palatine Laws of [our_ruler.GetNameWithNoTooltip]"
 flavor_mll.3.entry: "Palatine Laws of James III"
 flavor_mll.3.desc: "Hoping to further reinforce [our_ruler.GetHisHer] standing as an independent ruler against [target_country.GetName], [our_ruler.GetName] has laid the foundation for a new [ShowLawNameWithNoTooltip('legal_code_law')], the [ShowPolicyName('mll_leges_palatinae')]. Under the [ShowPolicyNameWithNoTooltip('mll_leges_palatinae')], the independent standing of [ROOT.GetCountry.GetNameWithNoTooltip] is reinforced, and the governing power of the [ROOT.GetCountry.GetGovernment.GetAdjective] [ROOT.GetCountry.GetGovernment.GetCourtTitle] is strengthened."
 flavor_mll.3.a: "We shall enact this new [ShowLawNameWithNoTooltip('legal_code_law')] to strengthen our standing!"
 flavor_mll.3.b: "Maintain the framework for the new [ShowLawNameWithNoTooltip('legal_code_law')], but delay promulgation for now."
 flavor_mll.3.c: "We do not need changes to our existing [ShowLawNameWithNoTooltip('legal_code_law')]."

 flavor_mll.4.title: "Illuminated Manuscript of the [ShowPolicyNameWithNoTooltip('mll_leges_palatinae')]"
 flavor_mll.4.entry: "Illuminated Manuscript of the Leges Palatinae"
 flavor_mll.4.desc: "Upon completing the framework for the new [ShowLawName('legal_code_law')], [our_ruler.GetName] commissioned several [ShowCultureGroupName('italian_group')] artists to create an illuminated manuscript to further bolster [our_ruler.GetHisHer] prestige. With the work now completed, some at the [ROOT.GetCountry.GetGovernment.GetCourtTitle] have suggested that the [ShowWorkOfArtNameWithNoTooltip('illuminated_manuscrpt_of_the_legas_palatinae')] serve as diplomatic leverage instead, since the high quality of the [ShowWorkOfArtTypeNameWithNoTooltip('treatise')] makes it a generous offering."
 flavor_mll.4.a: "Keep it as a [ROOT.GetCountry.GetGovernment.GetCourtTitle] artifact for now."
 flavor_mll.4.b: "This would make a fine gift for [fra_ruler.GetShortNameWithNoTooltip] of [target_country_1.GetNameWithNoTooltip]."
 flavor_mll.4.b.entry: "This would make a fine gift for the ruler of France."
 flavor_mll.4.c: "Send the manuscript to [target_country.GetCapital.GetNameWithNoTooltip] as a symbol of [ROOT.GetCountry.GetAdjectiveWithNoTooltip] prestige."
 flavor_mll.4.c.entry: "Send the manuscript to Aragon as a symbol of Mallorcan prestige."

 flavor_mll.5.title: "Connections to [target_location.GetNameWithNoTooltip]"
 flavor_mll.5.entry: "Connections to Montpellier"
 flavor_mll.5.desc: "Following the death of [GetCharacter('ara_jacme_i_arago').GetName], the division of [GetCharacter('ara_jacme_i_arago').GetHisHer] lands saw [ROOT.GetCountry.GetName] gain several continental holdings within [ShowContinentName('europe')]. Among these holdings, the [target_location.GetRank.GetName] of [target_location.GetName] has proven to be a valuable hub for the rulers of [ROOT.GetCountry.GetNameWithNoTooltip], along with its connections to the [target_country_1.GetAdjective] [target_country_1.GetGovernment.GetCourtTitle].\n\nWith the relationship between [target_country.GetName] and [ROOT.GetCountry.GetNameWithNoTooltip] rather tense, some members of the [ROOT.GetCountry.GetGovernment.GetCourtTitle] have urged [our_ruler.GetName] to call upon the [ShowCultureName('languedocien')] [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] of [target_location.GetNameWithNoTooltip] for their support, although others have suggested we leverage the importance of [target_location.GetNameWithNoTooltip] to gain favor with the [target_country_1.GetGovernment.GetCourtTitle] of [target_country_1.GetNameWithNoTooltip]."
 flavor_mll.5.a: "Leverage our connections to [target_location.GetNameWithNoTooltip] [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] to garner support."
 flavor_mll.5.a.entry: "Leverage our connection to the Montpellier nobles to garner support."
 flavor_mll.5.b: "Focus instead on affairs within [ROOT.GetCountry.GetNameWithNoTooltip]."
 flavor_mll.5.c: "Arrange an exchange with [target_country_1.GetNameWithNoTooltip] for [target_location.GetNameWithNoTooltip]."
 flavor_mll.5.c.entry: "Arrange an exchange with France for Montpellier."
 mll_unlock_sale_of_montpellier_decision_tt: "Unlocks the $mll_exchange_of_montpellier.title$ [decision|e], offering the chance to earn diplomatic leverage with [target_country_1.GetName]"

 flavor_mll.6.title: "Defense of [ShowAreaNameWithNoTooltip('balearics_area')]"
 flavor_mll.6.entry: "Defense of [ShowAreaNameWithNoTooltip('balearics_area')]"
 flavor_mll.6.desc: "Although in the past, [target_country.GetAdjective] patrols have managed to block [ShowCultureGroupName('maghrebi_group')] raids on [ShowAreaName('balearics_area')], in recent years the raids have become a greater hindrance on the [ROOT.GetCountry.GetLongName].\n\nWith relations with [target_country.GetNameWithNoTooltip] rather strained, some members of the [ROOT.GetCountry.GetGovernment.GetCourtTitle] have drafted plans for the construction of coastal fortifications with the dual purpose to fending off [ShowCultureGroupNameWithNoTooltip('maghrebi_group')] raiders while also making a potential [target_country.GetAdjectiveWithNoTooltip] invasion harder for [target_country.GetNameWithNoTooltip] initiate."
 flavor_mll.6.a: "Provide the neccessary funds to make [ShowAreaNameWithNoTooltip('balearics_area')] impenetrable."
 flavor_mll.6.b: "We cannot afford this expensive endeavor."
 mll_area_gains_naval_defensives_tt: "All [ShowAreaName('balearics_area')] [locations|e] will gain [ShowModifier('mll_expansion_of_coastal_fortifications')] for 60 years"

 flavor_mll.7.title: "Garnering Support Abroad"
 flavor_mll.7.entry: "$flavor_mll.7.title$"
 flavor_mll.7.desc: "With relations between [ROOT.GetCountry.GetName] and the [target_country.GetLongName] murkier than ever, many advisors within the [ROOT.GetCountry.GetGovernment.GetCourtTitle] have urged [our_ruler.GetName] to reach out to some of the past rivals of [target_country.GetNameWithNoTooltip] in hopes of currying support to earn true freedom from [target_country.GetCapital.GetName]."
 flavor_mll.7.a: "Seek the support of the [target_country_2.GetAdjectiveWithNoTooltip]."
 flavor_mll.7.a.entry: "Seek the support of the Castilians."
 flavor_mll.7.b: "Seek the support of the [target_country_3.GetLongNameWithNoTooltip]."
 flavor_mll.7.b.entry: "Seek the support of the Kingdom of Naples"
 flavor_mll.7.c: "Look to our old rivals in [target_country_4.GetNameWithNoTooltip]."
 flavor_mll.7.c.entry: "Look to our old rivals in Genoa."
 flavor_mll.7.d: "We must instead rely on our [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]."
 mll_conditions_for_castile_support_tt: "Should [ROOT.GetCountry.GetName] manage to reach #G +150#! relations with [target_country_2.GetName] in the coming years, they will gain #G +50#! Acceptance with any Independence movement we may form"
 mll_conditions_for_naples_support_tt: "Should [ROOT.GetCountry.GetName] manage to reach #G +120#! relations with [target_country_3.GetName] in the coming years, they will gain #G +50#! Acceptance with any Independence movement we may form"
 mll_conditions_for_genoa_support_tt: "Should [ROOT.GetCountry.GetName] manage to reach #G +100#! relations with [target_country_4.GetName] in the coming years, they will gain #G +50#! Acceptance with any Independence movement we may form"
 MLL_PLEDGED_SUPPORT: "Pledged Support"

 flavor_mll.8.title: "Rejection of Fealty"
 flavor_mll.8.entry: "Rejection of Aragonese Fealty"
 flavor_mll.8.desc: "All diplomatic avenues between [ROOT.GetCountry.GetName] and [target_country.GetName] have ended in failure, with [target_country.GetAdjectiveWithNoTooltip] diplomats no longer interested in finding a compromise with [our_ruler.GetName]. The [target_country.GetLongNameWithNoTooltip] will likely fabricate a plot to justify the direct seizure of [ROOT.GetCountry.GetNameWithNoTooltip]."
 flavor_mll.8.a: "We have reached our boiling point!"
 mll_ara_will_likely_pursue_subjugation_tt: "The [target_country.GetGovernment.GetCourtTitle] of [target_country.GetName] will likely attempt to pursue direct seizure of [ROOT.GetCountry.GetName] in an attempt to bring it under the [target_country.GetAdjectiveWithNoTooltip] crown"

 flavor_mll.9.title: "Mending of Relations"
 flavor_mll.9.entry: "Mending of Relations with Aragon"
 flavor_mll.9.desc: "What was once a relationship destined for disaster has largely been mended through careful negotiations between [target_country.GetAdjective] and [ROOT.GetCountry.GetAdjective] diplomats. While [target_country.GetNameWithNoTooltip] have shied from recognizing our claims of independent rule, financial obligations previously owed to [target_country.GetNameWithNoTooltip] have been largely rescinded. While some in the [ROOT.GetCountry.GetGovernment.GetCourtTitle] see this as a victory for [our_ruler.GetNameWithNoTooltip], some close allies to the [ROOT.GetCountry.GetGovernment.GetRulerTitle] have requested [our_ruler.GetHeShe] pursue true avenues of independence from [target_country.GetNameWithNoTooltip]."
 flavor_mll.9.a: "A crisis averted for now."
 mll_ara_will_not_pursue_hostile_action_tt: "[target_country.GetName] will no longer pursue aggressive means to seize [ROOT.GetCountry.GetName]. However, [ROOT.GetCountry.GetNameWithNoTooltip] may still freely pursue means to gain its own independence"

 flavor_mll.10.title: "Elevation of Viceroyalty"
 flavor_mll.10.entry: "Viceroyalty of [ROOT.GetCountry.GetNameWithNoTooltip]"
 flavor_mll.10.desc: "With the relations between [target_country.GetName] and [ROOT.GetCountry.GetName] largely restored to past levels, the [target_country.GetLongNameWithNoTooltip] has taken a renewed interest in the [ShowAreaName('balearics_area')]. With much of the economy of the region still crippled from past [ShowCultureGroupName('maghrebi_group')] raids as well as the earlier conflicts with [target_country_1.GetName], the [target_country.GetAdjectiveWithNoTooltip] [ROOT.GetCountry.GetGovernment.GetCourtTitle] have proposed granting the [ROOT.GetCountry.GetLongNameWithNoTooltip] the status of a viceroyalty, earning it greater support from the [target_country.GetAdjectiveWithNoTooltip] [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')]."
 flavor_mll.10.a: "Use the new position of viceroyalty to strengthen [ROOT.GetCountry.GetNameWithNoTooltip]."
 flavor_mll.10.b: "Strive to protect [target_country.GetAdjectiveWithNoTooltip] and [ROOT.GetCountry.GetAdjectiveWithNoTooltip] interests in the [ShowScriptedGeographyNameWithNoTooltip('mediterranean_sea_geography')]."
 flavor_mll.10.b.entry: "Strive to protect Aragonese and Mallorcan interests in the Mediterranean Sea."
 flavor_mll.10.c: "Reject the offer from [target_country.GetNameWithNoTooltip] to become a viceroyalty."
 flavor_mll.10.c.entry: "Reject the offer from Aragon to become a viceroyalty."

 flavor_mll.11.title: "The Scourge of [source_of_piracy.GetNameWithNoTooltip] Piracy"
 flavor_mll.11.entry: "The Scourge of [ShowCultureGroupNameWithNoTooltip('maghrebi_group')] Piracy"
 flavor_mll.11.desc: "Although the [ROOT.GetCountry.GetLongName] has suffered numerous raids by the pirates of the [ShowRegionName('maghreb_region')], in recent years, those originating from [source_of_piracy.GetName] have proven to be the most costly for the [ROOT.GetCountry.GetGovernment.GetCourtTitle]. Amidst growing anger from the [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')], many have petitioned [our_ruler.GetName] to invade [source_of_piracy.GetNameWithNoTooltip] and eliminate the pirate threat for good."
 flavor_mll.11.a: "The pirates of [source_of_piracy.GetNameWithNoTooltip] must be dealt with."
 flavor_mll.11.a.entry: "The pirates must be dealt with."
 flavor_mll.11.b: "Only by seizing [source_of_piracy.GetAdjectiveWithNoTooltip] holdings directly will they be promptly suppressed."
 flavor_mll.11.b.entry: "Only by seizing their holdings directly will they be promptly suppressed."

 flavor_mll.12.title: "Walls of Alcúdia"
 flavor_mll.12.entry: "$flavor_mll.12.title$"
 flavor_mll.12.desc: "Situated on the outskirts of [target_location.GetName], Alcúdia has been at the forefront of raids originating from the [ShowRegionName('maghreb_region')] for the last century. Due to the area's vulnerability, [GetCharacter('mll_jacme_ii_mallorca').GetName] previously commissioned the assembling of new walls to protect the settlement from future raids. While the walls have yet to be fully completed, the existing structure has already proven to be quite effective, with some in the [ROOT.GetCountry.GetGovernment.GetCourtTitle] feeling that the [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] should undertake a new project, using a similar design to strengthen the main [target_location.GetRank.GetName] of [target_location.GetNameWithNoTooltip] itself."
 flavor_mll.12.a: "Fund the expansion of new fortifications to encompass all of [target_location.GetNameWithNoTooltip]."
 flavor_mll.12.a.entry: "Fund the expansion of new fortifications to encompass all of Manacor."
 flavor_mll.12.b: "Contribute funds to complete the walls of Alcúdia."
 flavor_mll.12.c: "Scrap any further construction projects in Alcúdia."

 flavor_mll.13.title: "Freedom from [target_country.GetNameWithNoTooltip]"
 flavor_mll.13.entry: "Independence Reasserted"
 flavor_mll.13.desc: "Through the struggles of [our_ruler.GetName] and the [ROOT.GetCountry.GetGovernment.GetAdjective] [ROOT.GetCountry.GetGovernment.GetCourtTitle], [ROOT.GetCountry.GetNameWithNoTooltip] has finally earned true independence from the [target_country.GetLongName]. With [target_country.GetNameWithNoTooltip] forced to acknowledge [ROOT.GetCountry.GetAdjectiveWithNoTooltip] separation, the [ROOT.GetCountry.GetGovernment.GetAdjective] [ROOT.GetCountry.GetGovernment.GetCourtTitle] can look towards the [ShowScriptedGeographyName('mediterranean_sea_geography')] without being beholden to the whims of [target_country.GetCapital.GetName]."
 flavor_mll.13.a: "[ROOT.GetCountry.GetNameWithNoTooltip] will now chart its own future."

 flavor_mll.14.title: "[ShowBuildingTypeNameWithNoTooltip('university')] of [target_location.GetNameWithNoTooltip] Endorses [our_ruler.GetNameWithNoTooltip]'s Rule"
 flavor_mll.14.entry: "Montpellier Scholars Endorse our Rule"
 flavor_mll.14.desc: "Although [target_location.GetName] has remained a continental possession of the [ROOT.GetCountry.GetAdjectiveWithNoTooltip] [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')], the scholars of the [ShowBuildingTypeName('university')] of [target_location.GetNameWithNoTooltip] have proven to be staunch supporters of [our_ruler.GetNameWithNoTooltip]. From the enactment of the new [ShowPolicyName('mll_leges_palatinae')] [ShowLawNameWithNoTooltip('legal_code_law')] to strengthening the [ROOT.GetCountry.GetGovernment.GetAdjective] [ROOT.GetCountry.GetGovernment.GetCourtTitle], the scholars of [target_location.GetNameWithNoTooltip] have contributed potent political leverage to [our_ruler.GetName]'s rule."
 flavor_mll.14.a: "We welcome their support!"
 flavor_mll.14.b: "Use their praise to further strengthen [our_ruler.GetShortNameWithNoTooltip] political standing."
 flavor_mll.14.b.entry: "Use their praise to further strengthen our ruler political standing."

 flavor_mll.15.title: "Rebuilding of [ROOT.GetCountry.GetAdjectiveWithNoTooltip] Trade Influence"
 flavor_mll.15.entry: "Rebuilding of Mallorcan Trade Influence"
 flavor_mll.15.desc: "With the [ROOT.GetCountry.GetLongName] no longer beholden to the whims of [target_country.GetName], many of our merchants have been eager to conduct independent business in hopes of restoring the trade influence [ROOT.GetCountry.GetName] once held over the [ShowScriptedGeographyName('mediterranean_sea_geography')]. While the decline of [ROOT.GetCountry.GetAdjectiveWithNoTooltip] influence was largely impacted by the past conflicts between [target_country_1.GetName] and [target_country.GetNameWithNoTooltip], the newfound independence of the [ROOT.GetCountry.GetAdjectiveWithNoTooltip] [ROOT.GetCountry.GetFlavorRank] will likely cause traders throughout the [ShowScriptedGeographyNameWithNoTooltip('mediterranean_sea_geography')] to reconsider our presence in the region.\n\nTo encourage the re-establishment of our presence there, some in the [ROOT.GetCountry.GetGovernment.GetCourtTitle] have suggested offering additional privileges to the [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')], along with waiving some previous restrictions imposed during [target_country.GetAdjectiveWithNoTooltip] rule. However, some fear that strengthening the [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')] may lead to [ROOT.GetCountry.GetNameWithNoTooltip] becoming closer to a [ShowGovernmentTypeName('republic')] like those of [ShowRegionName('italy_region')]."
 flavor_mll.15.a: "Offer extensive privileges to [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')] for their assistance."
 flavor_mll.15.b: "The [ROOT.GetCountry.GetGovernment.GetCourtTitle] shall take on this endeavor alone."
 flavor_mll.15.c: "We should be more focused on our internal affairs."

 # Decisions
 mll_a_hub_of_mediterranean_trade.title: "A Hub of [ShowScriptedGeographyNameWithNoTooltip('mediterranean_sea_geography')] Trade"
 mll_a_hub_of_mediterranean_trade.desc: "While many of the old [GetCountry('MLL').GetAdjective] trade routes were casualties of past [GetCountry('ARA').GetAdjective] and [GetCountry('GEN').GetAdjective] conflicts, the newfound independence of the [GetCountry('MLL').GetLongNameWithNoTooltip] creates an opportunity for these once-profitable trade routes to be restored. Furthermore, the prime location of the [ShowAreaNameWithNoTooltip('balearics_area')] offers us a chance to be a leading contender in [ShowScriptedGeographyNameWithNoTooltip('mediterranean_sea_geography')] trade."
 mll_a_hub_of_mediterranean_trade.a: "[GetCountry('MLL').GetNameWithNoTooltip] is now poised to dominate the [ShowScriptedGeographyNameWithNoTooltip('mediterranean_sea_geography')]."

 mll_exchange_of_montpellier.title: "Exchange of [ShowLocationNameWithNoTooltip('montpellier')]"
 mll_exchange_of_montpellier.desc: "Bequeathed to [GetCharacter('mll_jacme_ii_mallorca').GetName] in the will of [GetCharacter('ara_jacme_i_arago').GetName], [ShowLocationNameWithNoTooltip('montpellier')] has ever since been a crucial mainland holding for the [GetCountry('MLL').GetLongName]. However, with the growing hostilities between [GetCountry('ARA').GetName] and [GetCountry('MLL').GetNameWithNoTooltip], [ShowLocationNameWithNoTooltip('montpellier')] may provide strong leverage with the [GetCountry('FRA').GetLongName]."
 mll_exchange_of_montpellier.a: "Offer to sell [ShowLocationNameWithNoTooltip('montpellier')] to [GetCountry('FRA').GetNameWithNoTooltip]."
 mll_exchange_of_montpellier.b: "Propose an exchange of [ShowLocationNameWithNoTooltip('montpellier')] in return for [GetCountry('FRA').GetAdjectiveWithNoTooltip] guarantees."
 mll_exchange_of_montpellier.c: "[ShowLocationNameWithNoTooltip('montpellier')] must remain [GetCountry('MLL').GetAdjectiveWithNoTooltip]!"
 mll_french_support_for_montpellier_tt: "[GetCountry('FRA').GetName] will gain #G +100#! Acceptance with any Independence movement we may form for 50 years."
