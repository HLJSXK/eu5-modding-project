l_english:
 banu_al_wad: "Bānu 'Abd āl-Wād"
 FATE_OF_TLEMCEN: "Fate of [ShowLocationNameWithNoTooltip('tlemcen')]"

 flavor_tle.1.title: "[target_war.GetNameWithNoTooltip]"
 flavor_tle.1.desc: "[ShowRegionName('maghreb_region')] stands at a precipice — with the [target_siege.GetName] well underway and the [tle_scope.GetAdjective] relief force arriving soon, it is plausible that the future of [ShowSubContinentName('north_africa')] may be decided in a matter of days. Will the [target_location.GetRank.GetName] hold against [mor_ruler.GetName] and [mor_ruler.GetHerHis] [mor_scope.GetAdjective] troops, or will [target_location.GetName] fall, sealing the fate of [tle_ruler.GetName] and [tle_ruler.GetHerHis] [tle_scope.GetFlavorRank]?"
 flavor_tle.1.a: "To arms!"

 tle_morrocan_tlemcen_war: "If [target_location.GetName] becomes occupied by the [mor_scope.GetLongName] in the [target_war.GetName], [mor_scope.GetName] will be able to forcefully make [tle_scope.GetName] into a [ShowSubjectTypeName('fiefdom')]"
 tle_additional_warning: "The [target_siege.GetName] must be lifted as soon as possible!"

 flavor_tle.2.title: "The Fall of [target.GetNameWithNoTooltip]"
 flavor_tle.2.desc: "[target.GetName], the pearl of [target.GetArea.GetName], has finally succumbed to our siege and surrendered to our mighty armies. As the gates opened, our forces rushed into the [target.GetRank.GetName], trying to secure the main citadel in hopes of securing spoils and prisoners. Within the citadel were many members of the [target_country.GetGovernment.GetAdjective] family, whom our soldiers quickly captured and led out to the [from_country.GetAdjective] generals. Could this potentially be the end of [target_war.GetName]?"
 flavor_tle.2.a: "Make sure the [target_dynasty.GetNameWithNoTooltip] are no obstacle."
 flavor_tle.2.b: "Onwards, to [ShowLocationNameWithNoTooltip('oran')]!"
 TLE_once_truce_ends_zayyanid_pretenders_tt: "Once the [truce|e] with [target_country.GetName] ends, they will have access to the [ShowDecisionName('zayyanid_pretenders_decision')] [decision|e], allowing them to declare a special [ShowCasusBelliName('cb_independence_war')] [war|e]"

 flavor_tle.3.title: "$flavor_tle.2.title$"
 flavor_tle.3.desc: "The capital of our beloved [ROOT.GetCountry.GetFlavorRank], [target.GetName], has fallen to our heinous enemies from the [from_country.GetLongName]. To add to this tragedy, many of our beloved [target_dynasty.GetName] family members were killed during the assault.\n\nThis calamity has sent a shockwave of despair throughout the [ROOT.GetCountry.GetLongName], and has made continuing the war practically impossible. Though the killings alone are not enough to paralyze the country, the loss of trust in the leadership certainly is. Having been abandoned by our tribal allies, our morale is at an all-time low, and with no established resistance movement, this marks the end of the [target_war.GetName]."
 flavor_tle.3.a: "[ROOT.GetCountry.Custom('common_string_negative')]"

 TLE_as_per_the_warning: "We did not heed the warnings, and have allowed our beloved [target.GetName] to become occupied. The [target_dynasty.GetName] family has been massacred, and we are now a [ShowSubjectTypeName('fiefdom')] of [from_country.GetName]."
 
 zayyanid_pretenders_decision.title: "Enthrone a [ShowDynastyNameWithNoTooltip('zayyanid_dynasty')] Prince"
 zayyanid_pretenders_decision.desc: "The rule of [ROOT.GetCountry.GetDiplomacy.GetOverlord.GetName] is tyrannical at worst and inconvenient to the [ROOT.GetCountry.GetLongName] at best. Let us invite a [ShowDynastyName('zayyanid_dynasty')] prince to rule us again, and unite all the [ShowEstateTypeName('tribes_estate')] against a common foe."
 zayyanid_pretenders_decision.desc.entry: "The rule of our overlord is truly tyrannical. It shakes the superiority of the $banu_al_wad$ tribes to the very core. Let us invite a [ShowDynastyName('zayyanid_dynasty')] prince to rule us again, and unite all the [ShowEstateTypeName('tribes_estate')] against a common foe."
 zayyanid_pretenders_decision.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 zayyanid_pretenders_decision.a.entry: "$common_string_great$"
 zayyanid_prince_takes_over: "A prince of the [ShowDynastyName('zayyanid_dynasty')] [dynasty|e] takes power"

 flavor_tle.4.title: "$flavor_tle.7.title$"
 flavor_tle.4.desc: "The situation in [from_country.GetName] is becoming more and more unsustainable every day. Many of the [target_dynasty.GetName] pretenders have come out of hiding and are actively seeking support amongst the [ShowCultureName('zenati')] tribes in the area. Should we fail to appease the local estates, [target_location.GetName] could become a hotbed of popular rebellion, ending our hegemony over the [ShowRegionName('maghreb_region')]. Will [target_country.GetName] be able to weather such a storm?"
 flavor_tle.4.a: "We must heed these warnings."
 tle_rules_for_zayyanid_pretenders: "If [target_country.GetName] fails to keep the [from_country.GetLongName] [subject_loyalty|e] above #Y 30#! during any of the following #Y 20#! years, [from_country.GetName] will be able to declare [ShowCasusBelliName('cb_independence_war')] [war|e] with the [ShowDecisionName('zayyanid_pretenders_decision')] [decision|e]"
 tle_rules_part_two: "If that happens, [from_country.GetName] will receive significant bonuses to their military strength and [target_country.GetName] will receive the following:"

 flavor_tle.5.title: "[ShowDynastyNameWithNoTooltip('zayyanid_dynasty')] Return to [ROOT.GetCountry.GetCapital.GetNameWithNoTooltip]!"
 flavor_tle.5.desc: "[target_character.GetName], a pretender to the [from_country.GetAdjective] throne, has just entered [ROOT.GetCountry.GetCapital.GetName] to an ovation from the [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] and representatives of the [ROOT.GetCountry.GetGovernment.GetEstateName('tribes_estate')]. This act is an open declaration of war from [from_country.GetName] against the [target_country.GetLongName], the state that has ruled [ROOT.GetCountry.GetCapital.GetName] for far too long. [target_character.GetShortNameWithNoTooltip] enjoys widespread support in [from_country.GetNameWithNoTooltip], but most importantly has secured the [ShowModifier('tle_zayyanid_tribe_support')]: the backing of the largest and most powerful [ShowCultureName('zenati')] tribe in the [ROOT.GetCountry.GetFlavorRank], and the home tribe of the [target_dynasty.GetName].\n\nWe will show those [target_country.GetAdjectiveWithNoTooltip] bastards who shall be victorious in the [target_war.GetName]!"
 flavor_tle.5.a: "Glory be to [ROOT.GetCountry.GetReligion.GetGodName]!"

 zayyanid_pretender_effect: "We will declare a [ShowCasusBelliName('cb_independence_war')] against our [overlord|e] and will receive additional benefits from the following event:"
 
 flavor_tle.6.title: "Rebellion in the [from_country.GetLongNameWithNoTooltip]!"
 flavor_tle.6.desc: "Our ardent efforts — privileges bestowed, diplomatic missions, luxurious gifts, posts granted — have all been for naught, as the tribes of [from_country.GetName] still choose to support the tyrannical [target_character.GetName] from the [target_dynasty.GetName] over more benevolent [target_country.GetAdjective] rule.\n\nSo it shall be, then! Let them face the wrath of our armies! We will inflict the divine punishment of [ROOT.GetCountry.GetReligion.GetGodName] upon them and seize victory in the [target_war.GetName]!"
 flavor_tle.6.a: "Our hegemony in [ShowRegionNameWithNoTooltip('maghreb_region')] will not be toppled!"
 
 flavor_tle.7.title: "[target_dynasty.GetNameWithNoTooltip] Pretenders"
 flavor_tle.7.entry: "[ShowDynastyNameWithNoTooltip('zayyanid_dynasty')] Pretenders"
 flavor_tle.7.desc: "Over the past few years, many surviving members of the [target_dynasty.GetName] dynasty have come out of hiding to try and make a bid for [target_location.GetName] and the [from_country.GetAdjective] throne. They do enjoy lukewarm support amongst the population and the [target_country.GetGovernment.GetEstateName('tribes_estate')], and popular sentiment is slowly turning in their favor. Should our overlords in the [target_country.GetLongName] continue to aggravate the crisis in [target_location.GetProvince.GetName], we could very well see a [target_dynasty.GetNameWithNoTooltip] return to power."
 flavor_tle.7.a: "This might be beneficial to us."
 
 flavor_tle.11.title: "Loyalty Secured"
 flavor_tle.11.desc: "Decades have passed since the [target_country.GetAdjective] subjugation of [from_country.GetName], and rumors of a [ShowDynastyName('zayyanid_dynasty')] return have largely died down. It seems we have managed to finally subdue the [ShowCultureName('zenati')] [from_country.GetGovernment.GetEstateName('tribes_estate')] and the chief $banu_al_wad$ among them. Once their territories are integrated, we will usher in a new era of prosperity for [ShowRegionName('maghreb_region')]."
 flavor_tle.11.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 tle_secured: "[from_country.GetName] will no longer be able to revolt via [ShowDecisionName('zayyanid_pretenders_decision')]"

 flavor_tle.13.title: "Growth of [ShowLocationNameWithNoTooltip('oran')]"
 flavor_tle.13.entry: "$flavor_tle.13.title$"
 flavor_tle.13.desc: "If [target_location2.GetName] is our gate to trade in the [ShowScriptedGeographyName('sahara_desert_geography')], then [target_location.GetName] is our window to commerce with [ShowContinentName('europe')]. No other port serves as important a role as the one in [target_location.GetNameWithNoTooltip], as it is the principal haven connecting us with our maritime partners in the [ShowScriptedGeographyName('mediterranean_sea_geography')]. Perhaps the [target_location.GetRank.GetName] deserves additional privileges to empower the local [target_estate.GetName]."
 flavor_tle.13.a: "A splendid idea!"
 flavor_tle.13.b: "[target_location.GetNameWithNoTooltip] does not deserve special treatment."