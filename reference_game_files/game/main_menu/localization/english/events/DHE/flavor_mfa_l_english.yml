l_english:
 flavor_mfa.1.title: "$BYZ_ADJ$ Traditions"
 flavor_mfa.1.entry: "$BYZ_ADJ$ Traditions"
 flavor_mfa.1.desc: "The [ROOT.GetCountry.GetLongName] is at a crossroads. Mere decades ago, the [ROOT.GetCountry.GetFlavorRank] saw the accession of [target_character2.GetName], member of the proud House of [target_character.GetDynasty.GetName]. Despite being [ShowModifier('byz_born_in_the_purple_modifier')], [target_character2.GetSheHe] converted to [ShowReligionName('catholic')] and embraced [ShowCultureName('piedmontese')] culture, abandoning [target_character2.GetHerHis] [target_country.GetAdjective] roots.\n\nToday, [ROOT.GetCountry.GetNameWithNoTooltip] is ruled by [target_character2.GetHerHis] descendant, [target_character.GetName], who might long for the life [target_character.GetSheHe] could have had in the [target_country.GetLongNameWithNoTooltip], had [target_character.GetSheHe] not been born in [target_character.GetLocation.GetName]."
 flavor_mfa.1.a: "[target_character2.GetNameWithNoTooltip] was wise to adapt."
 flavor_mfa.1.a.entry: "Our ruler was wise to adapt."
 flavor_mfa.1.b: "We shall not abandon our roots!"

 mfa_extra_information_about_reform: "[modifiers|e] of [target_government_reform.GetName] scale from negative to positive based on [ShowCultureName('greek_culture')] [culture|e] percentage and [ShowReligionAdjective('orthodox')] [religion|e] percentage. As [ROOT.GetCountry.GetName] converts, the penalties will slowly turn into positives. The modifiers scale from #N -1#! to #G +1#!"
 mfa_opportunity_for_thessaloniki: "If [target_government_reform.GetName] is embraced and we achieve #W 75.0%#! [ShowCultureName('greek_culture')] [culture|e] percentage and [ShowReligionAdjective('orthodox')] [religion|e] percentage, we will be able to request a fief from [target_country.GetName] in [ShowLocationName('thessaloniki')] and its environs"

 flavor_mfa.2.title: "[target_character.GetNameWithNoTooltip]"
 flavor_mfa.2.entry: "Facino Cane"
 flavor_mfa.2.desc: "Our [ROOT.GetCountry.GetFlavorRank] has come to harbor a character much renowned — [target_character.GetName], a famed condottiero originating out of [target_character.GetBirthLocation.GetName]. Having spent years in the service of other countries, [target_character.GetNameWithNoTooltip] has distinguished [target_character.GetHerselfHimself] as an able commander. Based on [target_character.GetHerHis] track record, we believe that [target_character.GetSheHe] could be a good fit for us and [target_character.GetHerHis] company — a powerful asset in our wars against other powers in the area."
 flavor_mfa.2.a: "We need to hire [target_character.GetHerHim]."
 flavor_mfa.2.a.entry: "We need to hire him."
 flavor_mfa.2.b: "Offer [target_character.GetHerHim] some territories in exchange for [target_character.GetHerHis] employment."
 flavor_mfa.2.b.entry: "Offer him some territories in exchange for his employment."
 flavor_mfa.2.c: "Bah! Let the nomad seek employment elsewhere."
 
 mfa_facino_condotierro: "Facino's Band"

 flavor_mfa.3.title: "Ambitions Worthy of an Emperor"
 flavor_mfa.3.entry: "$flavor_mfa.3.title$"
 flavor_mfa.3.desc: "[target_character.GetName] may not have been [ShowModifier('byz_born_in_the_purple_modifier')] or be the scion of an Emperor, but the imperial blood of the [target_character.GetDynasty.GetName] runs through [target_character.GetHerHis] veins. [target_character.GetSheHe|U] is not content to be sidelined as one of the many petty rulers of [ShowAreaName('piemonte_area')]. [target_character.GetShortNameWithNoTooltip] is worthy of ruling something much greater than a mere [ShowCountryRankName('rank_county')]."
 flavor_mfa.3.a: "[ShowAreaNameWithNoTooltip('piemonte_area')] needs a new hegemon."
 flavor_mfa.3.b: "[target_character.GetHerHis|U] ambitions will only serve to turn others against us."
 flavor_mfa.3.b.entry: "His ambitions will only serve to turn others against us."

 mfa_if_we_conquer_enough_in_20_years: "If [ROOT.GetCountry.GetName] achieves at least #W [DisplayPopulationNumber('(CFixedPoint)500')]#! [population_i|e] [population|e] within #W 20#! years, they will receive [SCOPE.ScriptValue('prestige_mild_bonus')|+=] [prestige_i|e] [prestige|e], [ShowModifier('mfa_elevation_modifier')] [modifier|e] for #W 40#! years, and they may also be elevated to a [ShowCountryRankName('rank_duchy')], if they are not already\nIf [ROOT.GetCountry.GetName] fail to achieve this, they will receive [SCOPE.ScriptValue('prestige_extreme_penalty')|+=] [prestige_i|e] [prestige|e], [SCOPE.ScriptValue('stability_weak_penalty')|+=] [stability_i|e] [stability|e] and all of their neighbors will receive [ShowCasusBelliName('cb_cut_down_in_size')] [casus_belli|e] on them"

 flavor_mfa.4.title: "The Laughingstock of [ShowRegionNameWithNoTooltip('italy_region')]"
 flavor_mfa.4.desc: "Decades ago, [target_character.GetName] vowed to become the hegemon of [ShowAreaName('piemonte_area')]. Today, the only thing that remains of that vision is vicious mockery towards members of the [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]. The [target_character.GetDynasty.GetName] of [ROOT.GetCountry.GetLongName] not only failed, but also managed to make many new enemies in the process. Will the neighbors of the [ROOT.GetCountry.GetFlavorRank] spare any sympathy for this sorry state?"
 flavor_mfa.4.a: "We did what we could."

 flavor_mfa.5.title: "A Ripe Fruit"
 flavor_mfa.5.desc: "Over the last few years, the [from_country.GetLongName] has been hard at work trying to make enemies out of their neighbors. Today, their ambitions have earned them nothing but laughter and the ire of others. We, and many others, wish contempt upon their sorry state."
 flavor_mfa.5.a: "Oh, the misery."

 flavor_mfa.6.title: "The Dukes of [ShowAreaNameWithNoTooltip('piemonte_area')]"
 flavor_mfa.6.desc: "Years ago, [target_character.GetName] vowed that [target_character.GetHerHis] house, the [ROOT.GetCountry.GetAdjective] [target_character.GetDynasty.GetName] dynasty, would one day be accorded the splendor it so richly deserves. Today, [target_character.GetHerHis] efforts have finally been recognized, for this pearl of [ShowAreaName('piemonte_area')] has been raised to the rank of a [ShowCountryRankName('rank_duchy')]."
 flavor_mfa.6.a: "Perhaps the [ROOT.GetCountry.GetAdjectiveWithNoTooltip] rulers are worthy of being born in the purple, as well?"
 flavor_mfa.6.b: "Glorious will [ROOT.GetCountry.GetNameWithNoTooltip] be!"

 mfa_purple_color: "Our color will change to a shade of #W Deep Purple#!"

 flavor_mfa.7.title: "Our Claim to [ShowScriptedGeographyNameWithNoTooltip('claims_of_thessalonica_geography')]"
 flavor_mfa.7.entry: "$flavor_mfa.7.title$"
 flavor_mfa.7.desc: "[target_character.GetName], descending from a line of [target_character.GetDynasty.GetName] originating with [target_character2.GetName], holds a natural, albeit distant, claim to the [target_country.GetLongName] through [target_character.GetHerHis] dynasty. Lesser known is [target_character.GetHerHis] other claim, to the [ShowScriptedGeographyName('claims_of_thessalonica_geography')], which can be traced back to [target_character3.GetName] and the [target_character3.GetDynasty.GetName]. Having closely cooperated with the [target_character.GetDynasty.GetNameWithNoTooltip] of [target_country.GetCapital.GetName], [target_character.GetName] believes we might receive [target_location.GetName] and its environs in return for our favors."
 flavor_mfa.7.a: "Stake the claim."
 flavor_mfa.7.b: "We shall not abuse their kindness."

 MFA_request_thessalonica: "We will request the lands in [ShowProvinceDefinitionName('chalkidiki_province')], [ShowProvinceDefinitionName('lower_macedonia_province')], and [ShowProvinceDefinitionName('central_macedonia_province')] as a [ShowSubjectTypeName('fiefdom')] from the [target_country.GetLongName]"
 
 flavor_mfa.8.title: "A Request from [from_country.GetNameWithNoTooltip]"
 flavor_mfa.8.desc: "Our [target_character.GetDynasty.GetName] kin in the [from_country.GetLongName] have forged a truly [target_country.GetAdjective] state in [ShowRegionName('italy_region')]. Their population is [ROOT.GetCountry.GetReligion.GetAdjective] and [ROOT.GetCountry.GetCulture.GetName]; they don purple robes and speak our tongue. Given our shared history and mutual cooperation, their ruler, [target_character.GetName], is requesting a fiefdom in [target_location.GetName] and its environs based on [target_character.GetHerHis] ancient claim to [ShowScriptedGeographyName('claims_of_thessalonica_geography')]."
 flavor_mfa.8.a: "[target_character.GetSheHe|U] should know better than to cite a [ShowLanguageNameWithNoTooltip('latin_language')] construct."
 flavor_mfa.8.b: "We will honor their claim."

 mfa_make_thessaloniki_subject: "Our [locations|e] in [ShowProvinceDefinitionName('chalkidiki_province')], [ShowProvinceDefinitionName('lower_macedonia_province')], and [ShowProvinceDefinitionName('central_macedonia_province')] will be released as a [ShowSubjectTypeName('fiefdom')] under [from_country.GetName]"

 flavor_mfa.1000.title: "$flavor_mfa.7.title$"
 flavor_mfa.1000.entry: "$flavor_mfa.7.title$"
 flavor_mfa.1000.desc: "Though [target_character.GetName] is of the glorious [target_character.GetDynasty.GetName] lineage, [target_character.GetSheHe] also has another considerable claim, which can be traced back to [target_character3.GetName]. That claim is to the [ShowScriptedGeographyName('claims_of_thessalonica_geography')]. Though the claim is not exactly strong, we can count on other nations' support, for there are many [ShowCultureGroupName('italian_group')] states hoping to bite off pieces of the [target_country.GetLongName] while it is suffering from [ShowDisasterName('byzantine_succession_crisis')]."
 flavor_mfa.1000.a: "Let us organize a campaign."
 flavor_mfa.1000.b: "We would be fools to wage war based on such frivolous claims."

 recipient_agrees_to_join_war: "[recipient.GetName] will promise to join [actor.GetName] in their war against the [GetCountry('BYZ').GetLongName] within a few years"

 MFA_gather_allies: "[ROOT.GetCountry.GetName] will attempt to gather allies by using the [ShowCountryInteractionName('mfa_join_against_byz')] [country_interaction|e]\nIn #W 3 Years#!, an [event|e] will fire to declare a [war|e] with the help of gathered supporters"

 flavor_mfa.1001.title: "Appeasing the [from_country.GetAdjectiveWithNoTooltip] Pretenders"
 flavor_mfa.1001.desc: "The dastardly [from_country.GetAdjective] [target_character.GetDynasty.GetName] are using their descent from the [target_character3.GetDynasty.GetName] house to claim the [ShowScriptedGeographyName('claims_of_thessalonica_geography')]. Our spies report that they are trying to assemble an [ShowCultureGroupName('italian_group')] league to try and wrestle those lands away during our moment of weakness in [ShowDisasterName('byzantine_succession_crisis')]."
 flavor_mfa.1001.a: "We will not surrender an inch of territory to those traitors!"
 flavor_mfa.1001.b: "Offer them a token grant."
 flavor_mfa.1001.c: "They can have it all, for all we care!"

 mfa_offer_few_provinces: "We will offer [from_country.GetName] the [provinces|e] of [ShowProvinceDefinitionName('chalkidiki_province')], [ShowProvinceDefinitionName('lower_macedonia_province')], and [ShowProvinceDefinitionName('central_macedonia_province')] to appease them"
 mfa_offer_entire_geography: "We will offer [from_country.GetName] all of our lands within the territory of [ShowScriptedGeographyName('claims_of_thessalonica_geography')]"
 
 flavor_mfa.1002.title: "An Opportune Moment"
 flavor_mfa.1002.desc: "Much time has passed since we started gathering allies for our campaign against the [target_country.GetLongName]. Our foes, much weakened by their internal strife, remain an ideal target for a war of conquest. With many allies pledging themselves to our cause, perhaps it is time to prove which line of the [target_dynasty.GetName] is superior."
 flavor_mfa.1002.a: "Unleash the dogs of war!"
 flavor_mfa.1002.b: "Now is not the time."
 flavor_mfa.1002.c: "We had better abandon this plan."

 flavor_mfa.1003.title: "Honoring our Agreement"
 flavor_mfa.1003.desc: "War with the [target_country.GetLongName] has finally broken out, and we are being called upon to fulfill our promise to [from_country.GetName]. Will we aid this civil war of the [target_character.GetDynasty.GetName], or will we leave the [from_country.GetLongNameWithNoTooltip] to fare for themselves in the [target_war.GetName]?"
 flavor_mfa.1003.a: "We will not abandon our allies."
 flavor_mfa.1003.b: "Watching from the sidelines is the right way forward."

 flavor_mfa.1005.title: "Proposal from [target_country.GetNameWithNoTooltip]"
 flavor_mfa.1005.desc: "The cowardly [target_country.GetLongName] has seen reason at last, and offered us territories in the [ShowScriptedGeographyName('claims_of_thessalonica_geography')]. We should consider this offer carefully, for the entire expedition is in itself a risk."
 flavor_mfa.1005.a: "We will take what we can get."
 flavor_mfa.1005.b: "They are fools if they think that can stop us!"

 mfa_make_thessaloniki_subject_out_of_provinces: "[target_country.GetAdjective] [locations|e] in [ShowProvinceDefinitionName('chalkidiki_province')], [ShowProvinceDefinitionName('lower_macedonia_province')], and [ShowProvinceDefinitionName('central_macedonia_province')] will be released as a [ShowSubjectTypeName('fiefdom')] under [from_country.GetName]"
 mfa_make_thessaloniki_subject_out_of_geography: "[target_country.GetAdjective] [locations|e] in [ShowScriptedGeographyName('claims_of_thessalonica_geography')] will be released as a [ShowSubjectTypeName('fiefdom')] under [from_country.GetName]"
 
 flavor_mfa.1006.title: "Response From the [from_country.GetLongNameWithNoTooltip]"
 flavor_mfa.1006.desc.affirmative: "The [target_character.GetDynasty.GetName] civil war has been averted! It seems the dastardly [from_country.GetAdjective] line has seen reason and decided to cease its aggression in favor of the land transfer we proposed."
 flavor_mfa.1006.desc.negative: "The dastardly, traitorous [from_country.GetAdjective] [target_character.GetDynasty.GetName] are not to be trusted! Our humble offer of peaceful resolution has been denied. Truly, those [ShowLanguageName('latin_language')] devils are in the service of Lucifer himself!"
 flavor_mfa.1006.affirmative: "Peace prevails on this day."
 flavor_mfa.1006.negative: "Betrayal from kin hurts the most."