l_english:

 grand_embassy.1.title: "Preparing the Delegation"
 grand_embassy.1.desc: "Before the delegation departs, we must decide its shape. A ruler paraded through banquets and guarded lodgings sees only what a host wants shown; the workshops, the dry docks, and the drill grounds stay closed to honored guests. [figurehead.GetName] will travel as the delegation's public face, while [target_ruler.GetName] moves among the retinue, unremarked. How far should we go to keep it that way?"
 grand_embassy.1.a: "Prepare the delegation as any other."
 grand_embassy.1.a.tt: "Ordinary preparations, ordinary secrecy (Discretion: 55)"
 grand_embassy.1.b: "Go out of our way to keep the secrecy."
 grand_embassy.1.b.tt: "Extra care buys real anonymity (Discretion: 75)"
 grand_embassy.1.c: "Send decoy delegations."
 grand_embassy.1.c.tt: "Decoys scatter the trail (Discretion: 95)"

 grand_embassy.2.title: "Presenting the Delegation at [embassy_country.GetCapital.GetNameWithNoTooltip]"
 grand_embassy.2.desc.port: "The delegation has reached [embassy_country.GetCapital.GetName]. What we came for is access: to the dry docks and the arsenals where [embassy_country.GetName] builds the fleets that keep it ahead at sea. How we present ourselves at the [embassy_country.GetGovernment.GetCourtTitle] will decide how much of that they actually show us."
 grand_embassy.2.desc.inland: "The delegation has reached [embassy_country.GetCapital.GetName]. What we came for is access: to the workshops and drill grounds where the artisans and drillmasters of [embassy_country.GetName] have already remade its trade and its army. How we present ourselves at the [embassy_country.GetGovernment.GetCourtTitle] will decide how much of that they actually show us."
 grand_embassy.2.a: "Let [figurehead.GetShortNameWithNoTooltip] speak; [target_ruler.GetShortNameWithNoTooltip] stays with the retinue."
 grand_embassy.2.a_no_figurehead: "Keep [target_ruler.GetShortNameWithNoTooltip] among the retinue."
 grand_embassy.2.b: "Present [target_ruler.GetShortNameWithNoTooltip] openly, as [target_ruler.GetHerHim] truly is."
 grand_embassy.2.c: "Avoid the [embassy_country.GetGovernment.GetCourtTitle]. We did not come here to be seen."

 grand_embassy.3.title: "A Delegation at Court"
 grand_embassy.3.desc.unaware: "A delegation from [from.GetName] has arrived at the [ROOT.GetCountry.GetGovernment.GetCourtTitle], unremarkable travelers by their own account, eager to see how [ROOT.GetCountry.GetName] does things. Do we let them into our workshops and our institutions, or send them on their way?"
 grand_embassy.3.desc.aware: "The [ROOT.GetCountry.GetGovernment.GetCourtTitle] has quietly worked out who truly travels with this delegation. Unmasking [target_ruler.GetName] outright would embarrass everyone involved, yet hosting a ruler willing to learn from the marvels of [ROOT.GetCountry.GetName], even in disguise, is no small honor. Discretion, it seems, cuts both ways."
 grand_embassy.3.a: "Allow them access."
 grand_embassy.3.b: "Our wonders are for all to see."
 grand_embassy.3.c: "We will not have foreigners learning our secrets."
 grand_embassy.3.d: "Allow them access, discreetly."
 grand_embassy.3.e: "Guests as important as these can see our marvels unimpeded."
 grand_embassy.3.f: "[target_ruler.GetShortNameWithNoTooltip], we know you, and you are not welcome here."

 grand_embassy.4.title: "An Extended Welcome"
 grand_embassy.4.desc: "Now that the truth of who travels with the delegation is known, the [embassy_country.GetGovernment.GetCourtTitle] of [embassy_country.GetName] has extended an invitation: stay a while longer, and see more of what there is to see."
 grand_embassy.4.a: "Accept the invitation with thanks."
 grand_embassy.4.b: "Beg for an even longer stay."

 grand_embassy.6.title: "An Invitation That Cannot Be Refused"
 grand_embassy.6.desc: "Word has reached [embassy_country.GetCapital.GetName] of who truly travels among the delegation. The [embassy_country.GetGovernment.GetCourtTitle] has lost patience for the pretense and now summons [target_ruler.GetName] to appear, not as a guest who may decline, but as the ruler [target_ruler.GetSheHe] is. There is no more room to maneuver: face the court, or turn back now."
 grand_embassy.6.a: "Face the court."
 grand_embassy.6.b: "Abandon the embassy."

 grand_embassy.7.title: "The Lessons Are Spent"
 grand_embassy.7.desc: "The delegation has spent every avenue open to it in [embassy_country.GetName] and must now either press on to another court or turn home to put what has been learned to use."
 grand_embassy.7.a: "Return home."
 grand_embassy.7.b: "Press on to [target_1.GetNameWithNoTooltip]."
 grand_embassy.7.c: "Make for [target_2.GetNameWithNoTooltip] instead."
 grand_embassy.7.d: "Set our sights on [target_3.GetNameWithNoTooltip]."
 grand_embassy.7.e: "There is still [target_4.GetNameWithNoTooltip] to visit."
 grand_embassy.7.f: "Turn the delegation toward [target_5.GetNameWithNoTooltip]."

 grand_embassy.5.title: "The Embassy Has Been Turned Away"
 grand_embassy.5.desc: "Word has reached [ROOT.GetCountry.GetCapital.GetName] that the [embassy_country.GetGovernment.GetCourtTitle] at [embassy_country.GetCapital.GetName] has refused to receive [target_ruler.GetName] and the delegation. No reason has been given that the chronicler considers worth recording. The rebuff reduces the embassy's standing; the embassy itself, however, is not yet at an end."
 grand_embassy.5.a: "Return home."
 grand_embassy.5.b: "Salvage what we can at [target_1.GetNameWithNoTooltip]."
 grand_embassy.5.c: "Seek a warmer welcome at [target_2.GetNameWithNoTooltip]."
 grand_embassy.5.d: "[target_3.GetNameWithNoTooltip] may prove more hospitable."
 grand_embassy.5.e: "Try our fortunes at [target_4.GetNameWithNoTooltip] instead."
 grand_embassy.5.f: "There is still [target_5.GetNameWithNoTooltip] to call upon."

 grand_embassy.discretion_down_4_tt: "A flicker of recognition (#R -4#! Discretion)"
 grand_embassy.discretion_down_5_tt: "Fewer places left to hide (#R -5#! Discretion)"
 grand_embassy.discretion_down_10_tt: "The court grows suspicious (#R -10#! Discretion)"
 grand_embassy.discretion_down_20_tt: "Too much favor draws too many eyes (#R -20#! Discretion)"
 grand_embassy.discretion_down_30_tt: "The disguise is blown (#R -30#! Discretion)"
 grand_embassy.discretion_up_10_tt: "We stayed out of sight (#G +10#! Discretion)"
 grand_embassy.discretion_set_0_tt: "The pretense is over (Discretion: 0)"
 grand_embassy.modernization_up_0to10_tt: "The lesson lands better unseen (#G +0 to +10#! Modernization)"
 grand_embassy.opportunities_set_1_tt: "Little is shown to a stranger (Opportunities: 1)"
 grand_embassy.opportunities_set_2_tt: "Some doors open regardless (Opportunities: 2)"
 grand_embassy.opportunities_set_3_tt: "Every door stands open to us (Opportunities: 3)"
 grand_embassy.opportunities_set_4_tt: "Nothing at all is held back (Opportunities: 4)"
 grand_embassy.opportunities_up_1_tt: "The invitation opens a further door (#G +1#! Opportunities)"
 grand_embassy.opportunities_up_2_tt: "Persistence, however undignified, opens two more (#G +2#! Opportunities)"
 grand_embassy.opportunities_down_1_tt: "The day is spent (#R -1#! Opportunities)"

 received_grand_embassy: "Received Grand Embassy"
 rejected_grand_embassy: "Rejected Grand Embassy"
 humiliated_grand_embassy: "Humiliated Grand Embassy"

 grand_embassy.8.title: "Trouble at Home"
 grand_embassy.8.desc: "Word has reached the delegation that trouble has broken out at home. With [target_ruler.GetName] still abroad, the [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] and the [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] want to know why their [ROOT.GetCountry.GetGovernment.GetRulerTitle] is nowhere to be found. Cutting the journey short now means coming home with nothing to show for it. Staying the course means ruling by absence a while longer."
 grand_embassy.8.a: "We must return home at once."
 grand_embassy.8.b: "The lessons still to be learned are worth the cost."

 grand_embassy.modernization_up_5_tt: "The lesson lands well (#G +5#! Modernization)"
 grand_embassy.modernization_up_15_tt: "The lesson is mastered in full (#G +15#! Modernization)"
 grand_embassy.discretion_up_20_tt: "Coin buys a great deal of forgetting (#G +20#! Discretion)"

 grand_embassy.9.title: "The Counting House"
 grand_embassy.9.desc: "In [embassy_country.GetName], a keeper of accounts walks us through the ledgers and tax rolls that keep the treasury running. Ink-stained fingers move down each column without hesitation, and the totals never seem to lie. The keeper enters every sum twice, once as owed and once as paid, so that no coin slips through unseen, and cross-checks the tallies against the harbor manifests before the week is out. There is more to learn, for those willing to pay for the keeper's time and patient enough to follow the method to its end."
 grand_embassy.9.a: "Take note of the method."
 grand_embassy.9.b: "Pay to study the registers in full."
 grand_embassy.9.c: "Pay to see every ledger, and stay to master them."

 grand_embassy.10.title: "The Almanac Makers"
 grand_embassy.10.desc: "A society of clerks in [embassy_country.GetCapital.GetName] has taken to counting everything: births, harvests, ships in port, even the price of bread from one week to the next. Their ledgers fill entire shelves, each column dated and set against the last, until the numbers themselves start to tell a story no chronicler ever could. Their almanacs claim to show a realm more truly than any chronicle, predicting famine and plenty alike from patterns only they seem to notice. For a fee, they will explain their methods to anyone patient enough to sit through the arithmetic."
 grand_embassy.10.a: "Note their methods."
 grand_embassy.10.b: "Pay for a full accounting of their craft."
 grand_embassy.10.c: "Pay for the full survey, and stay to master it."

 grand_embassy.11.title: "Fashion at Court"
 grand_embassy.11.desc: "The cut of a coat, the set of a wig, the correct depth of a bow: courtiers of [embassy_country.GetName] study such things as closely as any treaty, and a misjudged hemline can cost a reputation years to repair. Every fold and feather carries a meaning the uninitiated cannot read, and a delegation dressed wrong is a delegation not truly seen. A courtier offers, discreetly, to explain what is worn and why, and to whom one must bow first, and by how much."
 grand_embassy.11.a: "Observe and remember."
 grand_embassy.11.b: "Pay the courtier for a fuller lesson."
 grand_embassy.11.c: "Pay for the full lesson, and stay to master it."

 grand_embassy.12.title: "The Salon of Ideas"
 grand_embassy.12.desc: "In a townhouse near the palace, merchants, scholars, and idle nobles gather most evenings to argue over coffee about matters that would once have gone unspoken: taxation, faith, and the proper limits of a crown's authority. The talk runs late and grows louder as the candles burn down, and no one seems to mind who is listening so long as they, too, have something worth saying. An invitation to join them, even as a stranger, is not impossible to arrange, provided the coffee is good and the opinions are bold."
 grand_embassy.12.a: "Sit quietly and listen."
 grand_embassy.12.b: "Pay our way into the circle."
 grand_embassy.12.c: "Pay our way in fully, and stay to master it."

 grand_embassy.13.title: "The Foundry Floor"
 grand_embassy.13.desc: "The foundries of [embassy_country.GetName] cast cannon by methods our own gunsmiths would pay dearly to know: the mix of the alloy, the shape of the mold, the timing of the cooling. Heat shimmers off the furnace mouths, and the workers move around the molten metal with a practiced calm that speaks of long habit rather than mere skill. The foundry master, sweat-streaked and plainly proud of the work, is willing to explain more, for a price, and seems to enjoy nothing more than an audience who actually understands what they are looking at."
 grand_embassy.13.a: "Watch the casting."
 grand_embassy.13.b: "Pay the foundry master to explain the craft."
 grand_embassy.13.c: "Pay the master fully, and stay to master the craft."

 grand_embassy.14.title: "The Drilling Ground"
 grand_embassy.14.desc: "On the drilling ground outside [embassy_country.GetCapital.GetName], companies wheel and reload in step, faster than any levy of our own could manage, boots striking the packed earth in a rhythm that never seems to falter. Officers bark commands that the ranks answer before the words have even finished leaving their mouths, and the whole formation turns as one body rather than a hundred separate men. A drill sergeant, flattered by our attention, offers to walk through the paces in full, from the first call to the last volley."
 grand_embassy.14.a: "Watch the drill."
 grand_embassy.14.b: "Pay the sergeant for a closer look."
 grand_embassy.14.c: "Pay the sergeant fully, and stay to master the drill."

 grand_embassy.15.title: "A Word in the Right Ear"
 grand_embassy.15.desc: "The chamberlain who arranges our audiences lets it be known, quietly, that a gift in the right hand can smooth a great many doors, and that certain names on certain lists have a way of slipping the memory once the coin has changed hands. He mentions it almost as an aside, the way one might mention the weather, and waits to see if we take his meaning. It is a small thing, and common enough at any court, though the price tends to rise with the asking."
 grand_embassy.15.a: "Offer the customary gift."
 grand_embassy.15.b: "Offer a far more generous gift."

 grand_embassy.16.title: "The Discreet Broker"
 grand_embassy.16.desc: "A broker who makes his living smoothing the way for foreign visitors offers his services, claiming connections in every guardhouse and customs post between here and the border. He speaks in careful half-sentences, never quite naming who owes him favors, only that they do. For a fee, he can see to it that fewer questions are asked about where the delegation goes, and why, and that the answers, if pressed, come out satisfactorily vague."
 grand_embassy.16.a: "Hire the broker."
 grand_embassy.16.b: "Hire the broker, and pay for his silence besides."

 grand_embassy.17.title: "A Loose Tongue"
 grand_embassy.17.desc: "One of our own retinue, deep in drink at a tavern and eager to impress a table of strangers, has said rather more than he should about who truly leads this delegation. He does not even remember saying it by morning, but the tavern keeper does, and so does everyone who was drinking at the next table. The rumor is already spreading through the servants' halls, passed along with the kind of relish reserved for secrets too good to keep."
 grand_embassy.17.a: "There is nothing to be done now."
 grand_embassy.17.b: "Pay to have the rumor smothered."

 grand_embassy.18.title: "Recognized in the Street"
 grand_embassy.18.desc: "A merchant who once traded in [ROOT.GetCountry.GetName], years ago and under happier circumstances, passes the delegation in the street and stops mid-stride, staring a moment too long at the face of [target_ruler.GetName] before hurrying on without a word. There is no mistaking the look that crosses his features: not idle curiosity, but sudden, startled recognition. He knows exactly who he saw, and whether he keeps that knowledge to himself is entirely beyond our control."
 grand_embassy.18.a: "Hope he keeps his own counsel."
 grand_embassy.18.b: "Have him found and paid for his silence."

 grand_embassy.19.title: "The Curious Innkeeper"
 grand_embassy.19.desc: "The innkeeper housing the delegation has too many questions, each one asked with the studied casualness of a man who already suspects the answers matter: why so fine a retinue travels so plainly, why the coin is always ready and never counted twice, why no one in the party quite meets his eye when asked after their business. He is not yet suspicious, only curious, turning the small oddities over in his mind the way a man might turn over a coin to check it is not clipped. That may not last much longer."
 grand_embassy.19.a: "Answer as little as possible."
 grand_embassy.19.b: "Pay him well enough to stop asking."

 grand_embassy.20.title: "A Letter Intercepted"
 grand_embassy.20.desc: "A letter meant for home, naming [target_ruler.GetName] plainly and describing the delegation's true purpose in more detail than caution would ever allow, has gone missing between the courier and the ship. No ransom note has followed, no accusation, no sign at all of where it went, which is in its own way more unsettling than if it had. Where it has ended up, who has read it, and what they intend to do with what they now know, we cannot say."
 grand_embassy.20.a: "There is no way to call it back."
 grand_embassy.20.b: "Spend freely to have it found and burned."

 grand_embassy.21.title: "A Banquet in Our Honor"
 grand_embassy.21.desc: "The [embassy_country.GetGovernment.GetCourtTitle] has arranged a banquet in honor of the delegation, with toasts, tributes, and speeches enough to fill an entire day, each course arriving more elaborate than the last as if the kitchens compete among themselves. Every dish must be praised, every toast answered in kind, and every long-winded dignitary heard out to the end regardless of how little he actually has to say. To decline would be an insult; to attend is to lose the day entirely to ceremony and full plates."
 grand_embassy.21.a: "Sit through it."
 grand_embassy.21.b: "Slip away to see something more useful instead."

 grand_embassy.22.title: "A Chaperone Assigned"
 grand_embassy.22.desc: "The [embassy_country.GetGovernment.GetCourtTitle] has assigned an official to guide the delegation's every step: pleasant, tireless, and utterly determined that we see nothing but gardens and galleries, however politely the request for anything more is phrased. He has an answer ready for every question and a diversion ready for every silence, steering the conversation back to fountains and frescoes whenever it strays too near anything useful. The workshops remain firmly out of reach, however many ways we ask."
 grand_embassy.22.a: "Follow where we are led."
 grand_embassy.22.b: "Insist, as visitors of rank, on seeing more."

 grand_embassy.23.title: "The Long Audience"
 grand_embassy.23.desc: "An audience with a minor official drags on for hours: compliments exchanged, gifts admired, nothing of substance said, the same handful of pleasantries repeated in a slightly different order until they lose all meaning. He seems in no hurry at all, savoring the attention of foreign visitors far more than the substance of anything they might discuss. By the time it finally ends, the day for anything more useful has long since passed."
 grand_embassy.23.a: "Endure it politely."
 grand_embassy.23.b: "Cut the audience short, authority be damned."

 grand_embassy.24.title: "A Sympathetic Steward"
 grand_embassy.24.desc: "The steward who keeps the household's daily record hints, in the careful way of a man who has done this before, that a few names could simply go unrecorded, for the right consideration. He does not ask outright; he lets the silence do the asking, and waits with practiced patience for us to fill it."
 grand_embassy.24.a: "Pay the steward for a lighter record."
 grand_embassy.24.b: "Pay the steward to lose the record entirely."

 grand_embassy.25.title: "A Decoy Rumor"
 grand_embassy.25.desc: "A rival delegation from a smaller court, arriving at almost the same time as ours, draws far more gossip, being loud, unsubtle, and altogether easier to talk about. A little coin spread among the right servants could keep it that way, steering every idle tongue toward their comings and goings instead of ours."
 grand_embassy.25.a: "Spread a little coin around."
 grand_embassy.25.b: "Spread a great deal of coin around."

 grand_embassy.26.title: "The Silent Escort"
 grand_embassy.26.desc: "A local guide, familiar with which streets and doors avoid prying eyes and which hours the watch looks the other way, offers to lead the delegation's comings and goings unseen. He asks no questions about why such care is needed, only how much it is worth to us."
 grand_embassy.26.a: "Hire the guide."
 grand_embassy.26.b: "Hire the guide, and pay for extra caution besides."

