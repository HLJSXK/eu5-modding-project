 cape_route_to_india_events.cargo_spent_tt: "The holds are lighter — the cargo spent to buy this favor will not be sold at journey's end (#R -20#! Cargo)"
 cape_route_to_india_events.pilot_gained_tt: "An experienced pilot now guides the fleet, and will offer wiser counsel when we treat with the ruler of Calicut"

 cape_route_to_india_events.19.title: "The Sickness of the Sea"
 cape_route_to_india_events.19.desc: "It begins, as it always does, with the gums. They soften, and then they bleed, and then the teeth loosen in their sockets. Old wounds that healed years ago split open again as though freshly cut. The men grow listless, then breathless, then they cannot rise from their hammocks at all. The surgeon has no remedy — no one does. The barrels of salt fish and weevil-riddled biscuits that have sustained the fleet across the empty leagues carry nothing that answers this. Each dawn the roll is called, and each dawn there are fewer voices to answer it. The bodies go over the side wrapped in their own hammocks, and the leagues to the next friendly shore stretch on without mercy."
 cape_route_to_india_events.19.a: "Ration the last fruit and make all speed for land."
 cape_route_to_india_events.19.b: "Nothing to be done. Bury the dead and pray for the rest."
 cape_route_to_india_events.19.b.tt: "Many of the crew will not survive — the voyage's returns will be diminished"
 cape_route_to_india_events.19.historical_info: "Scurvy, caused by a deficiency of vitamin C, was the single greatest killer of sailors in the age of long-distance voyaging. On Vasco da Gama's first passage to $india$, an estimated ninety-three of one hundred and forty-eight men died, the great majority of scurvy on the long open stretches away from fresh food. The cause would not be reliably understood for another two and a half centuries; sailors and physicians grasped only that fresh provisions — citrus fruit above all — somehow held the sickness at bay, a knowledge repeatedly learned and forgotten."

 cape_route_to_india_events.20.title: "The Southern Gale"
 cape_route_to_india_events.20.desc: "The barometer had given warning, if anyone had known to read it: a long heavy swell rolling up from the south-west out of a clear sky. Then the sky was no longer clear. The wind came on hard and then harder, tearing the tops off the waves and flinging the spume flat across the water. The seas build to a height no man aboard has words for, gray-green walls streaked with foam that lift the ships stern-first toward the racing clouds and drop them into troughs where the wind falls suddenly, eerily still. Somewhere in the murk the other ships are firing guns to keep station, the reports lost almost instantly in the roar. There is no course to steer now but the one the sea allows."
 cape_route_to_india_events.20.a: "Hand the sails and heave to. We trust the ships."
 cape_route_to_india_events.20.b: "Run before it under scant canvas and pray we're not pooped."
 cape_route_to_india_events.20.b.win_tt: "The gamble pays — the fleet outruns the worst of the storm"
 cape_route_to_india_events.20.b.lose_tt: "The sea has its way with the fleet"
 cape_route_to_india_events.20.historical_info: "The waters off southern Africa, where the warm Agulhas Current meets the cold Atlantic swells driven up from the Southern Ocean, are among the most dangerous in the world. Freak waves capable of overwhelming a large vessel are documented there to this day. For the small ships of the discovery era — carracks and caravels of a few hundred tons — a South Atlantic gale was a mortal threat, and the passage around the Cape earned its early name, the Cape of Storms, honestly."

 cape_route_to_india_events.21.title: "The Windless Sea"
 cape_route_to_india_events.21.desc: "The wind dies at noon and does not return. The sails hang slack against the masts, slatting uselessly with the roll of the ground swell. By the second day the sea has gone to glass, a vast blinding mirror stretching to a horizon that shimmers with heat. The tar melts in the deck seams. The water in the casks turns warm and green and foul. There is nothing to do but wait — wait, and watch the sun, and listen to the timbers creak, and try not to count how much of the provisions are being eaten by men who are going nowhere. Sailors speak in low voices of ships found years later, drifting, their crews long dead of thirst within sight of a wind they never caught."
 cape_route_to_india_events.21.a: "Wait for the wind. There is nothing else that can be done."
 cape_route_to_india_events.21.b: "Put the boats out and tow; anything beats this stillness."
 cape_route_to_india_events.21.historical_info: "The equatorial calms — the doldrums, or Intertropical Convergence Zone — were a notorious hazard of the Atlantic crossing to and from the southern hemisphere. A sailing ship could lie becalmed there for days or weeks, consuming provisions and water while making no progress at all. It was precisely to avoid this belt of calms and contrary winds that Portuguese navigators developed the #italic volta do mar#! — the great outward swing westward into the Atlantic, almost to Brazil, to catch favorable winds south before turning back east toward the Cape."

 cape_route_to_india_events.22.title: "The Worm in the Hull"
 cape_route_to_india_events.22.desc: "The carpenter finds it during a routine sounding of the well: the auger comes back soft, and when he probes the planking below the waterline his tool sinks into wood that should be iron-hard. Shipworm. The warm tropical water is thick with the creatures, and they have been boring into the hulls since the fleet crossed the equator — thousands of pale burrows honeycombing the timber from the inside, invisible until a plank gives way or the pumps can no longer keep pace. Left untended, a ship so infested will simply open at the seams one day and go down with all hands. The carpenter's face tells [target_leader.GetName] everything before he speaks a word."
 cape_route_to_india_events.22.a: "Careen the ships and burn the worm from the timbers."
 cape_route_to_india_events.22.a.tt: "Careening costs time and coin, but saves the fleet"
 cape_route_to_india_events.22.b: "Strip the worst hull for stores and timber, and abandon it."
 cape_route_to_india_events.22.c: "Make for a friendly harbor and refit her properly."
 cape_route_to_india_events.22.c.tt: "A proper refit in a safe harbor restores the fleet's spirits"
 cape_route_to_india_events.22.historical_info: "The shipworm #italic Teredo navalis#! — not a worm at all, but a species of saltwater clam — was the scourge of wooden ships in warm waters, capable of destroying an unprotected hull within a single season. Its depredations drove centuries of countermeasures: hulls were sheathed in lead, coated with pitch and tallow, or double-planked with a sacrificial outer layer. The problem was so severe on the $india$ run that the Portuguese eventually built dedicated careening facilities at their Indian Ocean bases to scrape and repair hulls between voyages."

 cape_route_to_india_events.24.title: "Mutiny"
 cape_route_to_india_events.24.desc: "It has been coming for weeks — in the muttered conversations that stop when an officer approaches, in the sullen slowness with which orders are obeyed, in the looks. Now it comes into the open. A knot of men on the forecastle, one of them with a marlinspike in his fist, and behind them a crowd of others who have not yet decided which way they will jump. Their demands are the demands of frightened men who believe they have been led to their deaths: turn back, make for a [ROOT.GetCountry.GetReligion.GetAdjective] port, anything but sail on into an ocean that has already swallowed so many of their fellows. [target_leader.GetName] stands alone at the break of the quarterdeck. What [target_leader.GetSheHe] does in the next minute will decide whether there is a voyage left at all."
 cape_route_to_india_events.24.a: "Put the ringleaders ashore, and let the fainthearted go."
 cape_route_to_india_events.24.b: "Meet them with cold steel. A ship is no democracy."
 cape_route_to_india_events.24.fight_win_tt: "The officers prevail, and order is restored"
 cape_route_to_india_events.24.fight_lose_tt: "The fighting is bloody, and the fleet pays for it"
 cape_route_to_india_events.24.c: "Speak to them of $india$, of riches and glory to come."
 cape_route_to_india_events.24.rouse_tt: "[target_leader.GetNameWithNoTooltip]'s words rekindle the crew's resolve"

 cape_route_to_india_events.25.title: "An Empty Shore"
 cape_route_to_india_events.25.desc: "A low green coast lifts out of the haze to leeward — no smoke, no sail, no sign of any human hand, only forest running down to a line of surf and, beyond it, the promise of fresh water and whatever game the land might hold. The charts show nothing here. It is unclaimed, unknown, and it might hold anything: friendly springs and easy hunting, or fever, or a hostile people watching unseen from the tree line. But the water casks are low and the men are hollow-eyed, and a coast is a coast."
 cape_route_to_india_events.25.a: "Send the boats ashore for water and whatever land yields."
 cape_route_to_india_events.25.b: "Too great a risk on this coast. Note it and sail on."

 cape_route_to_india_events.26.title: "A Shore Willing to Trade"
 cape_route_to_india_events.26.desc: "The coast here is inhabited, and its people are not hostile. Canoes put out from the shore as the fleet stands in — cautious at first, then bolder, holding up fish and fruit and gesturing toward the beach where a market of sorts is quickly assembling. Whoever holds this stretch of coast has no quarrel with the strangers, and the sight of the fleet's [ShowGoodsName('iron')] and [ShowGoodsName('cloth')] has clearly kindled an interest in trade. It is exactly the kind of chance the long empty legs so rarely offer: a place to fill the casks, buy fresh food, and let the men set foot on solid ground among people who mean them no harm."
 cape_route_to_india_events.26.a: "Barter [ShowGoodsNameWithNoTooltip('iron')] and [ShowGoodsNameWithNoTooltip('cloth')] for all the fresh provisions."
 cape_route_to_india_events.26.b: "We cannot spare the days. Take on water only and press on."

 cape_route_to_india_events.27.title: "Lost with All Hands"
 cape_route_to_india_events.27.desc: "The last ship is gone. Whether to the sea, to sickness, to the men's own despair, or to a hostile shore, no one at home will ever know for certain — only that the fleet that sailed with such ceremony will not return. No holds full of [ShowGoodsName('pepper')]. No triumphant homecoming. No charts of the road to $india$. Somewhere along that immense arc of ocean, between the coast of Africa and the wealth of the East, the expedition simply ended, and the sea closed over it as though it had never been. In Lisbon the families will wait for months, and then for years, before they understand."
 cape_route_to_india_events.27.a: "May [ROOT.GetCountry.GetReligion.GetGodName] receive them. We will not soon try this again."
 cape_route_to_india_events.27.historical_info: "The sea route to $india$ was opened at a staggering human cost. Even successful voyages routinely lost half their crews and a portion of their ships; unsuccessful ones vanished entirely, leaving no record but the failure of a fleet to return. Of the ships that attempted the #italic Carreira da Índia#! over the following century, a significant fraction were lost outright — wrecked on the African coast, foundered in Southern Ocean gales, or simply never heard from again. Great wealth may have flowed to Lisbon, but it was paid for in drowned and fever-struck men on a scale that should not be forgotten."

 cape_route_to_india_events.28.title: "Landfall at [ShowProvinceDefinitionNameWithNoTooltip('cape_verde_province')]"
 cape_route_to_india_events.28.desc.empty: "Ten cones of black volcanic rock rise from an indifferent sea, and not a soul lives on any of them. No smoke, no sail, no flag — only seabirds and wind and a few brackish springs among the ash. The old charts named these islands, but no crown has ever settled them. They sit astride the very waters our route must cross, and [target_leader.GetName] knows their worth as clearly as [target_leader.GetSheHe] knows [target_leader.GetHerHis] own name: whoever holds [ShowProvinceDefinitionName('cape_verde_province')] holds the door to the [ShowContinentName('atlantic_ocean_continent')]. And at this hour, no one holds it at all."
 cape_route_to_india_events.28.desc.foreign: "[rival_owner.GetAdjective] banners snap over the anchorage at [ShowLocationName('santiago')]. [rival_owner.GetName] reached these islands ahead of us and put down roots — a garrison, a battery, a harbormaster who rows out to ask our business in a tone that is courteous and unwelcoming in equal measure. The islands sit astride the very waters our route must cross; in [rival_owner.GetAdjectiveWithNoTooltip] hands they are a knife held to the throat of every voyage south. [target_leader.GetName] studies the fortifications from the rail, says nothing, and thinks a great deal."
 cape_route_to_india_events.28.a: "Claim the islands; raise a [ShowBuildingTypeNameWithNoTooltip('por_feitoria')] flying our flag."
 cape_route_to_india_events.28.b: "Put ashore for water and forage what the islands offer."
 cape_route_to_india_events.28.c: "These islands are not ours to use. Press on south."
 cape_route_to_india_events.28.d: "Return home."
 cape_route_to_india_events.28.historical_info: "The islands of Cabo Verde were sighted by Portuguese navigators around 1456 and settled from 1462, before which they were entirely uninhabited. Their position in the mid-Atlantic, catching the northeast trade winds, made them an indispensable staging post for voyages around Africa and to the Americas. A power that controlled Cabo Verde had a a chokepoint on every southern route; it is no accident that Portugal moved to settle and fortify the islands as its oceanic ambitions grew."

 cape_route_to_india_events.29.title: "A Pillar of Stone"
 cape_route_to_india_events.29.desc.rafael: "The fleet has put in at the mouth of a broad, muddy river the pilots are already calling the [ShowLocationNameWithNoTooltip('quelimane')] — the River of Good Signs — for here, at last, the men have found what they crossed half the world to see: local craft rigged in the [ShowCultureGroupName('arabian_group')] fashion, traders who know the word for '$india$' and point east when they say it. The great crossing is near. In the hold lie the worked limestone pillars carried from home for exactly this purpose, each crowned with a cross and the royal arms. The carpenter asks whether to bring one ashore. To raise it is to plant a claim in stone and take on fresh water and wood while the masons work — but it will cost the fleet days it may not have."
 cape_route_to_india_events.29.desc.maria: "Low islets lie off the coast here, green and well-watered, sheltered from the swell — the kind of ground a weary fleet prizes above gold. $india$ is close now; the Malabar shore is a few days' sail south. In the hold waits another of the limestone pillars, dressed and lettered before the voyage began, ready to proclaim that ships of our crown reached this water first. To set it is to leave a mark that will outlast every man aboard — but the ceremony, and the careening and watering that go with it, will hold the fleet in place while the season turns."
 cape_route_to_india_events.29.desc: "The coast here is worth marking. In the hold lies one of the dressed limestone pillars carried from home — crowned with a cross and the royal arms — meant to stand on a headland and proclaim that our ships came this way first. To raise it is a solemn thing, and a slow one; the fleet must lie at anchor while the masons set the stone."
 cape_route_to_india_events.29.a: "Raise the #italic padrão#! — let stone and cross mark our passage."
 cape_route_to_india_events.29.b: "No time for ceremony — take on water, forage, and press on."
 cape_route_to_india_events.29.historical_info: "The #italic padrão#! was a stone pillar surmounted by a cross and the arms of Portugal, carried aboard prefabricated and erected at newly reached coasts to assert discovery and sovereignty. According to the humanist Damião de Góis, Vasco da Gama's fleet set five on the voyage to $india$: #italic São Rafael#! on the River of Good Signs, #italic São Jorge#! at Mozambique, the #italic Espírito Santo#! at Malindi, #italic Santa Maria#! at the islets, and #italic São Gabriel#! at Calicut. The pillars replaced the perishable wooden crosses of earlier voyages and were meant to endure; several survived for centuries."

 cape_route_to_india_events.30.title: "The Voyage Abandoned"
 cape_route_to_india_events.30.desc: "The order is given, and there is no argument on this ship — only relief on some faces and disappointment on others. The bow comes about. Behind them, the unknown coast recedes; ahead, the long familiar road home. No charts of $india$, no holds of [ShowGoodsName('pepper')], no place in the historians' accounts of who first found the sea road east. But the ships are whole, and the crews are alive, and the harbor of home is a certainty rather than a hope.\n\n[target_leader.GetName] watches the horizon astern for a long moment before turning [target_leader.GetHerHis] attention to the tasks of the voyage still ahead of [target_leader.GetHerHim]."
 cape_route_to_india_events.30.a: "So be it. We return with what little we've learned."
 cape_route_to_india_events.30.historical_info: "Not every Portuguese expedition down the African coast pressed on to its ultimate goal. Captains routinely weighed the risks of an unknown crossing against the ships and men already gathered, and a safe return with a partial account of new coastline was often judged the wiser course. Such voyages added incrementally to the charts even when they fell short of $india$, and the accumulated knowledge from a generation of partial voyages was what ultimately made Vasco da Gama's complete crossing possible."

 cape_route_to_india_events.31.title: "The Portuguese Build Their [ShowBuildingTypeNameWithNoTooltip('por_feitoria')]"
 cape_route_to_india_events.31.desc: "Their captain came ashore with gifts rather than gunners, and the terms were settled over three days of talk: a plot of ground beside the water for their [ShowBuildingTypeName('por_feitoria')], a rent paid into our treasury, our own courts to judge any quarrel between their men and ours, and their fleet to stand between this harbor and our rivals. The timber came out of their holds already cut to measure, and the post was raised in a matter of days.\n\nIt flies the arms of [por_feitoria_builder.GetName] beside our own, and the anchorage below is busier than it has been in a generation. Our grandchildren may yet curse the bargain, but the account today is plain enough: we have powder, cloth, and a friend with cannon, and they have a warehouse and a wharf."
 cape_route_to_india_events.31.a: "Honor the terms; our court will grumble at foreign arms."
 cape_route_to_india_events.31.b: "Put it in writing, rents and rights fixed for both crowns."
 cape_route_to_india_events.31.historical_info: "Not every feitoria was raised under the threat of bombardment. The Sultan of Malindi, locked in a long rivalry with Mombasa, received Vasco da Gama's fleet as a useful counterweight and provided the pilot who carried it across to Calicut. Malindi remained a Portuguese ally on the Swahili coast for decades and hosted first a Portuguese factory and later a fort. Rulers who came to terms early gained access to Portuguese goods and to naval protection against their own enemies, and several used the arrangement to settle old scores of their own. Such bargains were seldom equal, but where they were struck willingly they tended to hold far longer than those imposed by force."
