l_english:

 # ── Event 1: Departure ──────────────────────────────────────────────────────
 cape_route_to_india_events.1.title: "The Fleet Sets Sail"
 cape_route_to_india_events.1.desc: "Our waters have not seen a fleet like this in a generation. Four ships, a hundred and seventy men, enough [ShowGoodsName('salt')], [ShowGoodsName('fish')], and hard biscuit for years — and orders from [ROOT.GetCountry.GetGovernment.GetRulerOrRegent.GetName] [ROOT.GetCountry.GetGovernment.GetRulerOrRegent.GetHerselfHimself] to find the sea road to $india$. Priests bless the hulls. The crowd presses to the water's edge. Some are weeping.\n\n[target_leader.GetName] stands at the prow as the ships clear the bar and meet the open [ShowContinentName('atlantic_ocean_continent')]. Behind [target_leader.GetHerHim], the harbor dwindles to a white smear on a green hill. Before [target_leader.GetHerHim], the ocean extends without boundary in every direction. [target_leader.GetSheHe|U] has done the calculations. [target_leader.GetSheHe|U] knows what the voyage requires. Whether that is enough remains, as always, in the hands of [ROOT.GetCountry.GetReligion.GetGodName]."
 cape_route_to_india_events.1.a: "[ROOT.GetCountry.GetReligion.GetGodName|U] willing, we shall return with holds full of spices."
 cape_route_to_india_events.1.b: "Let us pray — and then sail with all speed."
 cape_route_to_india_events.1.historical_info: "The Portuguese expedition to find a sea route to $india$ was the culmination of nearly a century of incremental southward exploration along the African coast. Bartolomeu Dias had rounded the Cape of Good Hope in 1488, proving the route was possible. Vasco da Gama's 1497-99 voyage completed the mission, returning with enough pepper and spices to pay for sixty times the cost of the expedition. The voyage fundamentally changed the global spice trade, breaking the Venetian and Ottoman monopoly on overland routes."

 # ── Event 2: Cabo Verde ──────────────────────────────────────────────────────
 cape_route_to_india_events.2.title: "The [ShowProvinceDefinitionNameWithNoTooltip('cape_verde_province')] Islands"
 cape_route_to_india_events.2.desc: "Ten volcanic islands rising from a flat and featureless sea: that is the [ShowProvinceDefinitionName('cape_verde_province')] archipelago. The fleet knew to expect them, and still they come as a relief — solid ground after weeks of open ocean. The governor's residence at [ShowLocationName('santiago')] is a modest affair of whitewashed stone. The harbor smells of salt and dried fish and, faintly, of the orchil lichen scraped from the rocks for dye.\n\n[target_leader.GetName] weighs the choice. [ROOT.GetCountry.GetName] has held these islands for decades, but 'held' is a generous word — a small garrison, a few settlers, an annual supply ship. If this route is to mean anything to [ROOT.GetCountry.GetNameWithNoTooltip]'s future, the islands need to be more than a rest stop."
 cape_route_to_india_events.2.a: "Invest here, expand the outpost guarding our southern route."
 cape_route_to_india_events.2.b: "Resupply, take on fresh water, and sail on."
 cape_route_to_india_events.2.c: "Press on — we cannot afford to linger this early."
 cape_route_to_india_events.2.d: "Return home."
 cape_route_to_india_events.2.historical_info: "The Cape Verde Islands were discovered by Portuguese navigators around 1456 and permanently settled from 1462. Because of their position in the Atlantic — catching the northeast trade winds — they became an essential staging post for voyages to South America and around Africa. Their strategic importance grew substantially after Vasco da Gama's voyage proved the Indian Ocean route. By the sixteenth century they were a significant hub of the Atlantic slave trade."

 # ── Event 3: São Tomé ────────────────────────────────────────────────────────
 cape_route_to_india_events.3.title: "The Island of [ShowLocationNameWithNoTooltip('sao_tome')]"
 cape_route_to_india_events.3.desc_common: "The heat announces itself before the coastline does: a wet, suffocating wall that settles on the deck the instant the fleet crosses the equator, leaving the men gasping in air that never once turns cool. [ShowLocationName('sao_tome')] rises out of the morning mist like a dark green crown, two peaks trailing cloud, waterfalls threading down through forest so dense that no light reaches the floor."
 cape_route_to_india_events.3.desc: "$cape_route_to_india_events.3.desc_common$\n\nA small settlement clings to the western shore. The soil here, the settlers say, is extraordinarily rich. Anything planted grows. A man could make a fortune in sugar on this island, if he had the labor to work it."
 cape_route_to_india_events.3.desc.uninhabited: "$cape_route_to_india_events.3.desc_common$\n\nNo smoke rises from any shore. No boat waits in any cove. The island is empty of people entirely — the fleet's boats are the first to touch this beach. And yet the soil, where the jungle can be cut back, is black and deep and endlessly fertile. A man could make a fortune in sugar on an island like this, if he had the labor to work it — and if the fevers of the equator did not take him first."
 cape_route_to_india_events.3.desc.foreign: "$cape_route_to_india_events.3.desc_common$\n\nA settlement already clings to the western shore, beneath a flag that is not ours — wharves, a chapel, the first raw cane-fields of [rival_owner.GetAdjective] settlers who reached this fertile island ahead of [ROOT.GetCountry.GetName]. The soil is every bit as rich as the stories promised, but it is already spoken for. Whatever we want of [ShowLocationNameWithNoTooltip('sao_tome')] must now be taken, or bargained, from [rival_owner.GetNameWithNoTooltip]'s hand."
 cape_route_to_india_events.3.a: "Establish a trading post; this island's promise is worth it."
 cape_route_to_india_events.3.a.owned: "Invest further in the island — [ShowLocationNameWithNoTooltip('sao_tome')] already answers to our flag."
 cape_route_to_india_events.3.b: "Plant a #italic padrão#! and claim the island for the Crown."
 cape_route_to_india_events.3.c: "Take on fresh water and sail south."
 cape_route_to_india_events.3.d: "Return home."
 cape_route_to_india_events.3.historical_info: "São Tomé was uninhabited when Portuguese navigators arrived around 1470. Its equatorial climate proved devastating to European settlers — disease mortality was high — but extraordinarily productive for sugar cultivation. By the 1520s, São Tomé was the world's largest producer of sugar cane, worked almost entirely by enslaved Africans. The island later became a major transshipment point for the Atlantic slave trade, a role it would hold for over two centuries."

 # ── Event 4: Loango ──────────────────────────────────────────────────────────
 cape_route_to_india_events.4.title: "The Mouth of the Great River"
 cape_route_to_india_events.4.desc: "The ocean turns brown here. The fleet has been watching it happen for a day — the color bleeding into the sea from the south, tea-colored and thick with silt. Then they see the cause: a river wider than any in [ROOT.GetCountry.GetName], wider than any river any of these men has seen, emptying into the [ShowContinentName('atlantic_ocean_continent')] in a brown torrent that stains the sea for kilometers in every direction.\n\nFrom out of the mangrove fringe, dugout canoes emerge. They are enormous — hollowed from a single trunk, thirty feet long, paddled by a dozen men in perfect unison. The men standing in the bows are not armed. They are watching the fleet with the composed curiosity of people who have never been afraid of strangers."
 cape_route_to_india_events.4.a: "Seek an audience with the [target_owner.Custom('GetRulerOrRegentTitle')] of this land."
 cape_route_to_india_events.4.b: "Trade for [ShowGoodsNameWithNoTooltip('ivory')], [ShowGoodsNameWithNoTooltip('copper')], and whatever they offer."
 cape_route_to_india_events.4.c: "Chart the river mouth and press south; we cannot delay."
 cape_route_to_india_events.4.d: "Return home."
 cape_route_to_india_events.4.historical_info: "The Kingdom of Kongo was one of the most sophisticated political entities in sub-Saharan Africa, controlling territory across much of modern-day Congo, Angola, and Gabon. The ManiKongo (king) ruled through a hierarchical bureaucracy and maintained a sophisticated system of provincial governance. Portuguese missionaries made contact with the kingdom in the 1480s, beginning a relationship that would prove transformative — and, ultimately, catastrophic — for both parties. The kingdom converted to Christianity in the 1490s, with the ManiKongo taking the name João I."

 # ── Event 5: Luanda ──────────────────────────────────────────────────────────
 cape_route_to_india_events.5.title: "The Bay of [ShowLocationNameWithNoTooltip('luanda')]"
 cape_route_to_india_events.5.desc: "Every officer on the expedition recognizes it the moment they see it. None of the sailors have seen a harbor like this anywhere along the African coast: a long curved bay sheltered from the south-west by a natural sandspit, deep water close to shore, and behind it a low promontory with commanding views in every direction. The local fishermen call it Loanda — the flat place.\n\n[target_leader.GetName] walks the length of the sandspit in the afternoon light, the bay on one side and the open [ShowContinentName('atlantic_ocean_continent')] on the other. [target_leader.GetSheHe|U] is already thinking about walls. About fresh water. About the number of ships a garrison here could protect — or intercept. A town built here could command the entire southern Atlantic trade."
 cape_route_to_india_events.5.desc.owned: "The fleet stands into a bay it need not be told the worth of: [ShowLocationName('luanda')] already flies [ROOT.GetCountry.GetName]'s colors, its long sandspit sheltering ships that answer to our own crown.\n\n[target_leader.GetName] walks the length of the spit in the afternoon light, the bay on one side and the open [ShowContinentName('atlantic_ocean_continent')] on the other — thinking not of whether to seize this ground, but of how much more it might yet yield. Strengthened further, a town here could command the whole of the southern Atlantic trade."
 cape_route_to_india_events.5.a: "Build a major [ShowBuildingTypeNameWithNoTooltip('por_feitoria')] here — none compares."
 cape_route_to_india_events.5.a.owned: "Expand our great post at [ShowLocationNameWithNoTooltip('luanda')] — none on this coast compares."
 cape_route_to_india_events.5.b: "Establish a modest trading post and a supply depot."
 cape_route_to_india_events.5.b.owned: "Enlarge the trading post and supply depot we already hold here."
 cape_route_to_india_events.5.c: "Note its position on the charts and continue south."
 cape_route_to_india_events.5.d: "Return home."
 cape_route_to_india_events.5.historical_info: "Luanda was formally settled as a Portuguese colony in 1575 under Paulo Dias de Novais, making it one of the oldest European settlements in sub-Saharan Africa. Its natural harbor made it the primary port for Portuguese Angola for over four centuries. From the sixteenth century onward, Luanda became the main point of embarkation for the transatlantic slave trade in southern Africa, shipping millions of enslaved people to Brazil and the Caribbean."

 # ── Event 6: Walvis Bay ──────────────────────────────────────────────────────
 cape_route_to_india_events.6.title: "The Desert Coast"
 cape_route_to_india_events.6.desc: "The desert comes to the sea here, red dunes rising directly from the surf-line, their crests streaming sand into the air. There are no trees. There is no fresh water visible. The coast to the north — the men are already calling it the [ShowLocationName('skeleton_coast')], for the whale bones bleaching on the beach — shows no sign of human habitation for hundreds of miles in any direction.\n\nAnd yet the bay is calm. Sheltered from the worst of the swells, it offers the fleet a chance to repair a damaged mast and refill the water from a brackish spring in the dunes. On the headland above, the ship's navigator is measuring the angle of the sun with his instruments and making notes. The Cape, he says, is no more than a week's sailing to the south. Some of the men cross themselves."
 cape_route_to_india_events.6.a: "Rally the men: the Cape lies within reach at last. Forward!"
 cape_route_to_india_events.6.b: "These currents and winds speak; let me read them."
 cape_route_to_india_events.6.c: "Let the men rest; they'll need strength for storms ahead."
 cape_route_to_india_events.6.d: "Return home — this coast is too desolate to push further."
 cape_route_to_india_events.6.historical_info: "The Namibian coast was known to Portuguese sailors as the #italic Costa dos Esqueletos#! (Skeleton Coast) for its abundance of whale and seal bones, and for the wrecks of ships driven onto its lee shore by the powerful south-westerly winds. Walvis Bay, named by the Dutch #italic Walvischbaai#! (Whale Bay), was one of the few sheltered anchorages along this otherwise hostile stretch. Bartolomeu Dias stopped here in 1488 on his southward voyage."

 # ── Event 7: Cape of Good Hope ───────────────────────────────────────────────
 cape_route_to_india_events.7.title: "The Cape of Storms"
 cape_route_to_india_events.7.desc: "Nothing in three months of sailing has prepared them for this. The storm arrives without warning, from the south-west, driving before it waves that stand forty feet high. The lead ship disappears into a trough and does not reappear for thirty seconds. Tackle is carried away. Men are knocked from the rigging. [target_leader.GetName] grips the stern rail with both hands and stares at the chaos around [target_leader.GetHerHim], and somewhere in the cacophony of wind and breaking water [target_leader.GetSheHe] understands something: they are through. The Cape — the great southern tip of the African continent, the end of the known world — lies astern.\n\nThe way to $india$ is open."
 cape_route_to_india_events.7.a: "Name it the Cape of Good Hope and sail east without delay!"
 cape_route_to_india_events.7.b: "Shelter in the lee of the headland until the storm passes."
 cape_route_to_india_events.7.d: "We have done enough; the Cape is rounded. Turn for home."
 cape_route_to_india_events.7.historical_info: "Bartolomeu Dias first rounded the Cape in 1488, naming it #italic Cabo das Tormentas#! (Cape of Storms). According to Portuguese sources, King João II renamed it #italic Cabo da Boa Esperança#! (Cape of Good Hope) to encourage future expeditions, though this account may be apocryphal. The Cape is not the southernmost point of Africa — that distinction belongs to Cape Agulhas, some two hundred kilometers to the east — but it marks the meeting point of the Atlantic and Indian Oceans and the door to the east."

 # ── Event 8: Mossel Bay ──────────────────────────────────────────────────────
 cape_route_to_india_events.8.title: "The Bay of the Cowherds"
 cape_route_to_india_events.8.desc: "The bay is calm and beautiful, sheltered from the south-west by a low headland. Milkwood trees provide welcome shade along the shore. And on the hillside above the beach — cattle. Fat, healthy cattle grazing in enormous herds, tended by tall people wearing ochre and glass beads who have been watching the fleet from a safe distance since it anchored.\n\nSome of the men are near tears at the sight of fresh meat. They have been living on salt fish and hard biscuit for weeks. Eventually one of the herders walks down to the waterline and stands there, watching, until the fleet's captain climbs into a longboat and rows to meet him. An exchange takes place that involves [ShowGoodsName('copper')] rings, dried fish, and a great deal of patient gesture. By nightfall, three cattle are in the hold. The sound of lowing is, to every man on the fleet, the most beautiful noise they have ever heard."
 cape_route_to_india_events.8.a: "Trade [ShowGoodsNameWithNoTooltip('copper')], [ShowGoodsNameWithNoTooltip('cloth')] for cattle; plant a #italic padrão#!."
 cape_route_to_india_events.8.a.morale_tt: "Morale among the crews rises greatly (#G +15#! Crew Morale)"
 cape_route_to_india_events.8.b: "Raise a #italic padrão#! and claim this land for [ROOT.GetCountry.GetNameWithNoTooltip]."
 cape_route_to_india_events.8.b.morale_tt: "Morale among the crews rises slightly (#G +8#! Crew Morale)"
 cape_route_to_india_events.8.c: "Let the men rest and recover here before we push north."
 cape_route_to_india_events.8.c.morale_tt: "Morale among the crews rises noticeably (#G +10#! Crew Morale)"
 cape_route_to_india_events.8.d: "Return home."
 cape_route_to_india_events.8.historical_info: "Mossel Bay was known to Portuguese sailors as #italic Bahia dos Vaqueiros#! (Bay of the Cowherds) or later #italic Aguada de São Brás#! (Watering Place of Saint Blaise). Bartolomeu Dias erected a stone #italic padrão#! here in 1488, a tradition carried on by Vasco da Gama in 1497. The indigenous Khoikhoi initially traded willingly with both expeditions, but later became hostile — Vasco da Gama's men were pelted with stones when they tried to take fresh water without adequate payment."

 # ── Event 9: Sofala ──────────────────────────────────────────────────────────
 cape_route_to_india_events.9.title: "The Gold Port of [ShowLocationNameWithNoTooltip('sofala')]"
 cape_route_to_india_events.9.desc: "The harbor at [ShowLocationName('sofala')] is crowded with dhows. These are not the small fishing craft the fleet has grown accustomed to along the southern coast; they are ocean-going vessels from [ShowRegionName('arabia_region')] and [ShowRegionName('persia_region')], laden deep in the water with [ShowGoodsName('ivory')], ebony, and [ShowGoodsName('cloth')]. On the waterfront, merchants are conducting business in [ShowLanguageName('arabic_language')] and in [location.GetDominantCulture.GetLanguage.GetName], a tongue none of the fleet's interpreters can place. Small pinches of gold dust change hands for bolts of Indian cotton.\n\nArab traders who have dominated this port for centuries watch the arrival of the [ROOT.GetCountry.GetAdjective] fleet from beneath the awnings of their warehouses. Their expressions are unreadable but their body language is unmistakable: the appearance of these strangers, with their iron cannon and their crosses painted on their sails, is not a welcome development. The fleet captain makes note of the largest warehouses, the positions of the dhow moorings, the depth of water at the entrance to the bay."
 cape_route_to_india_events.9.a: "Build a major [ShowBuildingTypeNameWithNoTooltip('por_feitoria')]; this gold will enrich [ROOT.GetCountry.GetNameWithNoTooltip]."
 cape_route_to_india_events.9.a.owned: "Pour investment into our post at [ShowLocationNameWithNoTooltip('sofala')] — this gold will make [ROOT.GetCountry.GetNameWithNoTooltip] rich."
 cape_route_to_india_events.9.b: "Trade for gold dust and learn what lies in the interior."
 cape_route_to_india_events.9.c: "Gather intelligence and press on — time is precious."
 cape_route_to_india_events.9.d: "Return home."
 cape_route_to_india_events.9.historical_info: "Sofala was the southernmost significant port in the Swahili trading network, controlling access to the gold-producing kingdom of #italic Mutapa#! (Great Zimbabwe) on the plateau to the west. Arab traders had operated here since at least the tenth century. The Portuguese seized Sofala in 1505, destroying the Arab trading network and attempting to redirect the gold trade through their own channels — with mixed success, as much of the trade simply moved inland beyond their reach."

 # ── Event 10: Mozambique Island ──────────────────────────────────────────────
 cape_route_to_india_events.10.title: "The Island of [ShowLocationNameWithNoTooltip('mozambique')]"
 cape_route_to_india_events.10.desc: "A small island, no more than three kilometers from end to end, separated from the mainland by a narrow channel just deep enough for ocean-going ships. The island is dominated by a stone trading post flying a green flag, and the harbor is packed with dhows from all corners of the [ShowContinentName('indian_ocean_continent')]. [ShowGoodsName('ivory')] and ebony flow down from the interior, enslaved men and women are marched in from the mainland, [ShowGoodsName('copper')] comes up from the south, and [ShowGoodsName('cloth')] and [ShowGoodsName('porcelain')] arrive from $india$ and $china$ — all of it changing hands in a trading network that has functioned for six centuries.\n\nThe [target_ruler_country.Custom('GetRulerOrRegentTitle')] is wealthy and suspicious. [ShowCultureGroupName('arabian_group')] merchants who arrived ahead of the fleet have warned [target_ruler.GetHimHer] that the strangers are [ROOT.GetCountry.GetReligion.GetAdjective] pirates who destroy what they cannot steal. [target_ruler.GetHeShe|U] receives the fleet's envoy with careful courtesy, surrounded by armed guards, and asks many questions about armaments. [target_ruler.GetHerHis|U] own position, in the heart of a harbor ringed by cannon-points, is not what the [ROOT.GetCountry.GetAdjective] would call comfortable."
 cape_route_to_india_events.10.a: "Bribe the [target_ruler_country.Custom('GetRulerOrRegentTitle')] with goods and buy the right to build."
 cape_route_to_india_events.10.b: "Negotiate trading rights through diplomacy and gifts."
 cape_route_to_india_events.10.c: "Outbid the [ShowCultureGroupNameWithNoTooltip('arabian_group')] merchants and sway the [target_ruler_country.Custom('GetRulerOrRegentTitle')]."
 cape_route_to_india_events.10.d: "Acknowledge the [target_ruler_country.Custom('GetRulerOrRegentTitle')]'s claim for now and press north."
 cape_route_to_india_events.10.f: "Raise the #italic São Jorge padrão#!."
 cape_route_to_india_events.10.e: "Return home."
 cape_route_to_india_events.10.historical_info: "Mozambique Island became Portugal's most important base in East Africa, formally established in 1507. Fort São Sebastião, built in the sixteenth century, remains one of the oldest standing European fortifications in sub-Saharan Africa. The island served as the administrative capital of Portuguese East Africa and as a waystation for the $india$ run for over two centuries. Its capture effectively destroyed Arab control of the northern Swahili coast trade network."

 # ── Event 11: Mombasa ────────────────────────────────────────────────────────
 cape_route_to_india_events.11.title: "The Trap at [ShowLocationNameWithNoTooltip('mombasa')]"
 cape_route_to_india_events.11.desc: "[ShowLocationName('mombasa')]'s entrance channel is narrow, no more than two cables wide, with high ground on either shore. As the fleet passes through, the men begin to sense something is wrong — men loitering along the waterfront with the excessive casualness of heavily armed men who have been told to appear unarmed, a dhow anchored in an odd position that would block the channel exit, and the [target_ruler_country.Custom('GetRulerOrRegentTitle')]'s envoy who boards the flagship with elaborate ceremony, gifts, and too many questions about the number of fighting men aboard.\n\nThat night, an interpreter employed by the fleet slips into the captain's cabin. Before returning ashore, the [target_ruler_country.Custom('GetRulerOrRegentTitle')]'s envoy spoke to his companions in [location.GetDominantCulture.GetLanguage.GetName], a dialect the man understands. The words were unambiguous: the fleet is not to leave [ShowLocationNameWithNoTooltip('mombasa')]."
 cape_route_to_india_events.11.a: "Leave before dawn; this welcome is not worth the risk."
 cape_route_to_india_events.11.b: "Stay and attempt to trade despite the obvious tension."
 cape_route_to_india_events.11.c: "If they plan treachery, we shall act first; prepare the men."
 cape_route_to_india_events.11.d: "Return home — we will not risk the fleet here."
 cape_route_to_india_events.11.historical_info: "Vasco da Gama was nearly ambushed at Mombasa in April 1498. According to Portuguese accounts, local pilots provided by the sultan attempted to run the fleet onto a sandbar. Da Gama withdrew before the trap could be sprung. In subsequent decades, the Portuguese returned multiple times to bombard and sack Mombasa. Fort Jesus, built in 1593, finally secured Portuguese control of the harbor — though the city was captured by the Omanis in 1698 after a prolonged siege."

 # ── Event 12: Malindi ────────────────────────────────────────────────────────
 cape_route_to_india_events.12.title: "The Friendly [target_ruler_country.Custom('GetRulerOrRegentTitle')|U]"
 cape_route_to_india_events.12.desc: "Everything about [ShowLocationName('malindi')] is different from what came before. [target_ruler.GetName], the [target_ruler_country.Custom('GetRulerOrRegentTitle')], comes down to the harbor [target_ruler.GetHerselfHimself], dressed in white and green silk, attended by musicians playing an instrument that produces music none of the [ROOT.GetCountry.GetAdjective] have ever heard. [target_ruler.GetSheHe|U] has word of the fleet from [target_ruler.GetHerHis] contacts to the south and has been expecting their arrival.\n\n[target_ruler.GetSheHe|U] has a gift that is worth more than ivory: in [target_ruler.GetHerHis] employ [target_ruler.GetSheHe] has a man who has sailed to Calicut twelve times. A man who knows every current, every reef, every wind shift between here and the Malabar coast. Who knows when the south-west monsoon will carry a ship across the [ShowContinentName('indian_ocean_continent')] in three weeks and when it will kill the same ship in twenty-four hours. The pilot's name, [target_ruler.GetNameWithNoTooltip] explains, is hard to render in a European tongue. But [target_ruler.GetHerHis] knowledge is not, and the price of that knowledge is friendship."
 cape_route_to_india_events.12.a: "Take [target_ruler.GetNameWithNoTooltip]'s pilot and [target_ruler.GetHerHis] friendship gladly."
 cape_route_to_india_events.12.b: "Offer gifts, a presence, and protection to the [target_ruler_country.Custom('GetRulerOrRegentTitle')]."
 cape_route_to_india_events.12.c: "Let us pray before the crossing; [ROOT.GetCountry.GetReligion.GetGodName|U] brought us here."
 cape_route_to_india_events.12.e: "Raise the #italic Espírito Santo padrão#! before the great crossing."
 cape_route_to_india_events.12.d: "Return home; Calicut is too far, the crossing too dangerous."
 cape_route_to_india_events.12.historical_info: "The Sultan of Malindi maintained a long rivalry with Mombasa and was therefore well-disposed toward the Portuguese, who arrived as potential counterweights to his enemies. The Indian Ocean pilot he provided to Vasco da Gama — referred to in Portuguese sources as Malemo Canaca — has been the subject of scholarly debate for centuries. Some historians identify him with Ahmad ibn Majid, the greatest Arab navigator of the fifteenth century and author of several works on Indian Ocean navigation. Others argue the identification is incorrect and the pilot was a Gujarati merchant. His identity remains uncertain."

 # ── Event 13: Kozhikode (Calicut) ────────────────────────────────────────────
 cape_route_to_india_events.13.title: "Calicut — The Gateway to Spice"
 cape_route_to_india_events.13.desc: "[ShowLocationName('kozhikode')] is larger than [ROOT.GetCountry.GetCapital.GetName]. The harbor contains more ships than the fleet's officers can count — vessels from [ShowRegionName('arabia_region')], [ShowRegionName('persia_region')], [ShowAreaName('gujarat_area')], [ShowRegionName('bengal_region')], $china$, [ShowLocationName('malacca')], and [ShowAreaName('java_area')]. A whole connected world has been drawn together by the magnetic pull of [ShowGoodsName('pepper')], cinnamon, cardamom, and [ShowGoodsName('cloves')], and all of it flows through this port. The fleet drops anchor in a roadstead already crowded with dhows as [ShowCultureGroupName('arabian_group')] merchants on the waterfront stare.\n\nFor two months they have been telling the [target_ruler_country.Custom('GetRulerOrRegentTitle')] — Calicut's ruler, who governs from behind elaborate ceremonial walls — that these newcomers are pirates from the cold north, not merchants. The [target_ruler_country.Custom('GetRulerOrRegentTitle')|U] has agreed to receive the fleet's captain, but [target_ruler.GetHerHis] [target_ruler_country.GetGovernment.GetCourtTitle|l] is wary and [target_ruler.GetHerHis] merchants nervous. The air smells of black [ShowGoodsNameWithNoTooltip('pepper')] and the salt of a sea that has seen a thousand years of trade. Everything the voyage was for comes down to what is said in the next hour."
 cape_route_to_india_events.13.a: "Lay our goods before the [target_ruler_country.Custom('GetRulerOrRegentTitle')] and seek a trading post."
 cape_route_to_india_events.13.b: "Propose a treaty: fixed duties, safe anchorage, protection."
 cape_route_to_india_events.13.c: "Call the [ShowCultureGroupNameWithNoTooltip('arabian_group')] merchants liars; make the [target_ruler_country.Custom('GetRulerOrRegentTitle')] choose."
 cape_route_to_india_events.13.d: "Our pilot knows this [target_ruler_country.GetGovernment.GetCourtTitle|l]; his counsel guides our words."
 cape_route_to_india_events.13.e: "Plant the #italic São Gabriel padrão#! for all to see."
 cape_route_to_india_events.13.historical_info: "Kozhikode (known to Europeans as Calicut) was the most important spice-trading port in the Indian Ocean. The #italic Sāmūtiri#! (Zamorin, or Lord of the Sea) was its ruler, maintaining a careful balance between Arab merchants who dominated the trade, rival Indian polities, and later European arrivals. Vasco da Gama's first reception in 1498 was mixed: his gifts were considered inadequate, and Arab merchants successfully poisoned relations at court. He left with a small and unsatisfactory cargo. It was only on subsequent voyages, backed by the threat of Portuguese cannon, that meaningful trading arrangements were extracted."

 # ── Event 14: Axim (Gold Coast) ─────────────────────────────────────────────
 cape_route_to_india_events.14.title: "The Gold Coast"
 cape_route_to_india_events.14.desc: "The forest begins a day's walk from the shoreline, and the path between coast and forest is well worn. Caravans arrive at the beach two, three times a week: porters carrying leather pouches of gold dust, ground from river gravels in the interior where the [ShowCultureName('akan')] kings control the washing sites and trade their surplus through a network of Wangara merchants that stretches back four centuries.\n\nThe [ROOT.GetCountry.GetAdjective] have heard of this place. Every [ShowCultureGroupName('arabian_group')] captain who traded along these shores spoke of the Gold Coast's markets as the most productive stretch of the Guinea littoral. The people here have seen foreign ships before. They are not afraid. They are calculating what the newcomers are worth."
 cape_route_to_india_events.14.a: "Raise São Jorge da Mina; [ShowCultureNameWithNoTooltip('akan')] will sell to its holder."
 cape_route_to_india_events.14.a.owned: "Strengthen São Jorge da Mina — the [ShowCultureNameWithNoTooltip('akan')] already sell through our hands."
 cape_route_to_india_events.14.b: "Negotiate for captives the [ShowCultureNameWithNoTooltip('akan')] take as war tribute."
 cape_route_to_india_events.14.c: "Storm the settlement before the Wangara merchants depart."
 cape_route_to_india_events.14.d: "Note the trade volume and press south. No time to linger."
 cape_route_to_india_events.14.e: "Return home. The gold alone justifies the voyage."
 cape_route_to_india_events.14.historical_info: "The Portuguese built São Jorge da Mina (Elmina Castle) in 1482 on the Gold Coast, using stone quarried from a nearby headland and timber pre-cut in Portugal and loaded aboard ships for the purpose. The fort was raised in a matter of weeks, partly by negotiation with a local chief named Caramansa and partly by surprise. It was originally intended to control the gold trade with the Akan forest kingdoms. Within decades it became the primary node of the Atlantic slave trade, receiving captives from interior wars and shipping them westward to the sugar plantations of São Tomé and later Brazil. The historian Walter Rodney estimated that the Gold Coast trade had been worth several hundred thousand gold cruzados per year to Portugal before the slave trade displaced gold as the primary commodity."

 # ── Event 15: Fernando Po ────────────────────────────────────────────────────
 cape_route_to_india_events.15.title: "The Island of Fernão do Pó"
 cape_route_to_india_events.15.desc: "An island rises from the Gulf of Guinea: a volcanic peak trailing cloud from its summit, dense with jungle to the water's edge. The [ShowCultureName('bubi_culture')] people who live here have seen no Europeans before. They watch from the tree line as the fleet drops anchor in a natural bay, and a boat is lowered.\n\nThe explorer who gave this island his name passed this way a generation ago and drew it roughly in the charts. The fleet's pilot has that chart. What it does not show is whether the island is worth stopping for."
 cape_route_to_india_events.15.desc.owned: "The island rises from the sea as before — a volcanic peak trailing cloud, jungle crowding to the water's edge — but the anchorage below already flies our flag, and the boats that put out to meet the fleet are our own.\n\n[target_leader.GetName] has no need to wonder whether the island is worth the stopping. The question now is only how much more might be made of the foothold [ROOT.GetCountry.GetNameWithNoTooltip] already holds here, astride the [ShowAreaNameWithNoTooltip('gulf_of_guinea_area')] trade."
 cape_route_to_india_events.15.a: "Establish a post; the isle commands the [ShowAreaNameWithNoTooltip('gulf_of_guinea_area')] trade."
 cape_route_to_india_events.15.a.owned: "Reinforce our post here — the island already anchors our [ShowAreaNameWithNoTooltip('gulf_of_guinea_area')] trade."
 cape_route_to_india_events.15.b: "Plant a #italic padrão#!, chart the island, and claim it."
 cape_route_to_india_events.15.c: "Careen the hulls, fill the casks, and forage the island."
 cape_route_to_india_events.15.c.tt: "The hulls are scraped and sealed with pitch, and shipworm will not trouble the fleet on this voyage"
 cape_route_to_india_events.15.d: "Return home. The [ShowAreaNameWithNoTooltip('gulf_of_guinea_area')] is reason enough."
 cape_route_to_india_events.15.historical_info: "Fernando Po (modern Bioko) was reached by the Portuguese explorer Fernão do Pó around 1472, the first European to sight the island. The indigenous Bubi people had lived there in isolation for centuries, having crossed from the mainland long before. The Portuguese used the island as a waypoint but struggled to establish a lasting settlement, partly due to tropical disease and partly because the Bubi resisted contact. The island changed hands repeatedly in later centuries; by the Treaty of El Pardo in 1778, Portugal transferred it to Spain in exchange for territorial concessions in South America, and it eventually became part of modern Equatorial Guinea."

 # ── Event 16: Mogadishu ──────────────────────────────────────────────────────
 cape_route_to_india_events.16.title: "The City of the Sultan of the Sea"
 cape_route_to_india_events.16.desc: "[ShowLocationName('mogadishu')] is larger than we expected. The harbor is busy with dhows from [ShowRegionName('arabia_region')] and $india$, their holds full of [ShowGoodsName('cloth')], [ShowGoodsName('copper')], and [ShowGoodsName('porcelain')]. [ShowLocationNameWithNoTooltip('mogadishu')] is ruled by [target_owner.GetName]'s [target_owner.Custom('GetRulerOrRegentTitle')], who governs the trade between the [ShowCultureName('somali_culture')] interior and the wider ocean world. Merchants on the waterfront regard our ships with a calculating eye. We are not the first strangers to arrive here with strange sails and strange goods, but we may be the first to have come from so far west."
 cape_route_to_india_events.16.a: "Trade with the [ShowCultureNameWithNoTooltip('somali_culture')] merchants. Every contact counts."
 cape_route_to_india_events.16.b: "Observe, record, and move north. We seek $india$, not this."
 cape_route_to_india_events.16.c: "Turn back. The route is unknown; provisions won't last."
 cape_route_to_india_events.16.historical_info: "Mogadishu was one of the oldest and wealthiest cities on the East African coast, with a continuous trading history stretching back centuries before the Portuguese arrived. Arab geographers documented it as a major port as early as the ninth century. By the time of da Gama's voyage, it was governed by a sultanate and formed part of the Swahili Coast trading network that connected the African interior with Arabia, Persia, and the Indian subcontinent. The Portuguese decision to bypass or coerce these Swahili city-states in favor of establishing their own trading monopoly brought them into direct conflict with an existing and highly functional commercial system."

 # ── Event 17: Masqat (Oman) ──────────────────────────────────────────────────
 cape_route_to_india_events.17.title: "The Ibadi Port"
 cape_route_to_india_events.17.desc: "[ShowLocationName('masqat')] rises from red cliffs and the smell of the sea here is different — drier, sharper, tasting of dust and [ShowGoodsName('salt')] together. The harbor is one of the finest on the [ShowProvinceDefinitionName('arabian_sea_province')], deep enough for large vessels and sheltered from the south-west monsoon. [ShowCultureName('omani_culture')] merchants have been sailing to $india$ for a thousand years. The men on the waterfront know the routes, the winds, and the timing. They know when to sail and when to wait. They are looking at us, and wondering what we want."
 cape_route_to_india_events.17.a: "Seek out the [ShowCultureNameWithNoTooltip('omani_culture')] authorities and announce ourselves."
 cape_route_to_india_events.17.b: "Pay [ShowCultureGroupNameWithNoTooltip('arabian_group')] navigators for their charts to $india$."
 cape_route_to_india_events.17.c: "Resupply and leave. The [ShowCultureNameWithNoTooltip('omani_culture')] sailors are no friends."
 cape_route_to_india_events.17.d: "Turn back. The crossing to $india$ is beyond our means."
 cape_route_to_india_events.17.historical_info: "Masqaṭ (Muscat) was a principal port of the Ibadi Imamate of Oman, one of the major maritime powers of the western Indian Ocean. Omani sailors were among the most skilled navigators in the world, deeply familiar with the monsoon winds that governed crossing times between Arabia and the Indian subcontinent. The Portuguese arrival threatened the Omani role as intermediary in the spice trade, and relations between Portugal and Oman remained hostile for most of the sixteenth century, culminating in repeated wars for control of the Persian Gulf and East African ports. Oman eventually expelled the Portuguese from much of their East African network in the seventeenth century."

 # ── Event 18: Notification — Feitoria at foreign location ───────────────────
 cape_route_to_india_events.18.title: "The Portuguese Have Built a [ShowBuildingTypeNameWithNoTooltip('por_feitoria')]"
 cape_route_to_india_events.18.desc: "Their ships arrived without warning, dropped anchor in the outer roads, and trained their guns on the harbor. The request was polite in form and absolute in substance. They wished to build a trading post. They would pay a small rent. They would respect local laws. What they did not say — what did not need saying — was what would happen if we refused. The timber was already cut and loaded in their holds. The post was raised in a matter of days. It flies the [por_feitoria_builder.GetAdjective] cross now, where our own banner flew before."
 cape_route_to_india_events.18.a: "We have no choice; their cannon outweighs our protests."
 cape_route_to_india_events.18.b: "Send a protest and demand respect for our sovereignty."
 cape_route_to_india_events.18.historical_info: "The Portuguese feitoria system was one of the first examples of European commercial imperialism in Asia and Africa. By establishing fortified trading posts in existing harbors, Portugal was able to insert itself into existing trade networks without the cost of full territorial conquest. Local rulers who consented were given access to Portuguese goods and naval protection against rivals; those who refused faced bombardment. The system transformed the Indian Ocean from a relatively open commercial space into one structured around Portuguese naval dominance and the Casa da Índia's trading monopoly."

