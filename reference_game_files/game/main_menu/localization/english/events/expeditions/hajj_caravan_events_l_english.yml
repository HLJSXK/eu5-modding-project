l_english:

 hajj_caravan_events.1.title: "The Road to [ShowLocationNameWithNoTooltip('mecca')]"
 hajj_caravan_events.1.desc: "The caravan is assembled, the prayers are said, and the long road to the [ShowAreaName('hedjaz_area')] begins. Crowds line the streets to see us off, proof that this house still keeps the faith's obligations. [ShowLocationName('mecca')] lies months away, across deserts and open water that punish the unprepared."
 hajj_caravan_events.1.a: "Our [ROOT.GetCountry.GetGovernment.GetRulerTitle] goes as both sovereign and servant of [ROOT.GetCountry.GetReligion.GetGodName]."
 hajj_caravan_events.1.b: "Provision the caravan and raise an escort for the road."
 hajj_caravan_events.1.c: "Stock and secure the caravan, and bear the #italic maḥmal#! before us."
 hajj_caravan_events.1.historical_info: "The Abbasid Caliph Hārūn ar-Rašīd made the pilgrimage from Baghdad nine times during his reign (786–809), even traveling part of the route on foot as an act of piety, and his devotion became a model that pious rulers strove to emulate for centuries after."

 hajj_caravan_events.display_wealth: "Bear the #italic maḥmal#! openly, that all may behold our [ROOT.GetCountry.GetFlavorRank]'s wealth."

 hajj_caravan_events.guards_up_tt: "The caravan's guard escort grows (#G +25#! Guard Escort)"
 hajj_caravan_events.guards_down_15_tt: "The caravan's guard escort is diminished (#R -15#! Guard Escort)"
 hajj_caravan_events.guards_down_20_tt: "The caravan's guard escort is diminished (#R -20#! Guard Escort)"
 hajj_caravan_events.splendor_up_15_tt: "The caravan's splendor grows (#G +15#! Splendor)"
 hajj_caravan_events.splendor_up_20_tt: "The caravan's splendor grows (#G +20#! Splendor)"
 hajj_caravan_events.splendor_up_30_tt: "The caravan's splendor grows (#G +30#! Splendor)"
 hajj_caravan_events.splendor_down_10_tt: "The caravan's splendor is diminished (#R -10#! Splendor)"
 hajj_caravan_events.splendor_down_15_tt: "The caravan's splendor is diminished (#R -15#! Splendor)"
 hajj_caravan_events.splendor_down_20_tt: "The caravan's splendor is diminished (#R -20#! Splendor)"
 hajj_caravan_events.splendor_down_25_tt: "The caravan's splendor is diminished (#R -25#! Splendor)"
 hajj_caravan_events.weakened_tt: "Driven on without rest, the caravan is left weakened for the trials still ahead"
 hajj_caravan_events.recovered_tt: "Rested and watered, the caravan shakes off its weariness"
 hajj_caravan_events.mahmal_lost_tt: "The maḥmal is lost to the storm"
 hajj_caravan_events.mahmal_gained_tt: "The caravan now bears the maḥmal, allowing displays of wealth to foreign hosts along the way, though it can be lost to raiders or storms"

 hajj_caravan_events.2.title: "The Gate of [ShowLocationNameWithNoTooltip('mecca')]"
 hajj_caravan_events.2.desc: "[ShowLocationName('jeddah')]. The ancient port [jeddah_location.GetRank.GetName|l] smells of [ShowGoodsName('salt')], [ShowGoodsName('incense')], and the sweat of ten thousand pilgrims who arrived ahead of us by sea. Merchants hawk provisions at doubled prices, and scholars argue over the correct order of the rites. [ShowLocationName('mecca')] is close now, less than three days overland, but the caravan is tired and the provisions are low. We could push straight on, or spend a day here resting and resupplying first."
 hajj_caravan_events.2.a: "Rest here, and enter the holy city fresh."
 hajj_caravan_events.2.b: "We have come too far to stop now. Press on to [ShowLocationNameWithNoTooltip('mecca')]."
 hajj_caravan_events.2.c: "$hajj_caravan_events.display_wealth$"
 hajj_caravan_events.2.historical_info: "Caliph 'Uṯmān ibn 'Affān, the third of the Rāšidūn Caliphs, designated Jeddah as the official port of entry for pilgrims arriving by sea in 646, a role the city has held for Ḥajj traffic ever since."

 hajj_caravan_events.3.title: "The Ka'ba"
 hajj_caravan_events.3.desc: "The Grand Mosque opens before us and the Ka'ba stands at its heart, black-draped and ancient, older than memory. Around it the white-robed faithful move in patient circles, thousands of them, from every land where the call to prayer is heard. Here, sultan and shepherd dress alike. The journey is over. Now the question is what kind of pilgrim we will be. What is offered here will echo in the markets, the mosques, and the courts of the Muslim world for a generation."
 hajj_caravan_events.3.a: "Distribute gold freely. Let no pilgrim here go hungry."
 hajj_caravan_events.3.b: "Endow the mosques and the scholars who keep the holy city."
 hajj_caravan_events.3.c: "Perform the rites quietly. This is between us and [ROOT.GetCountry.GetReligion.GetGodName]."
 hajj_caravan_events.3.d: "Our [ShowBureaucracyTypeNameWithNoTooltip('diwan_al_hajj_bureaucracy')] has already provisioned everything."
 hajj_caravan_events.3.e: "Spare no expense. Deck the caravan in gold and silk."
 hajj_caravan_events.3.historical_info: "The most celebrated royal Ḥajj in history was that of Mansa Mūsā I of Mali in 1324. Traveling with a retinue of sixty thousand people and carrying enough gold to give away freely at every stop, his pilgrimage caused a decade-long collapse in gold prices across North Africa and the Middle East. His visit to the Egyptian sultan's court was widely documented by Arab chroniclers, who recorded both his extraordinary generosity and the economic disruption it caused."

 hajj_caravan_events.4.title: "The City of a Thousand Minarets"
 hajj_caravan_events.4.desc: "[ShowLocationName('cairo')] is vast and old, and it swallows the caravan the moment we pass the northern gate — noise, spice, tanning leather, roasting meat. Above the rooftops rises the great mosque of Al-Azhar, whose scholars are counted among the finest in the [ROOT.GetCountry.GetReligion.GetGroup.GetAdjective] world. Our ruler could linger to study under them, or simply resupply and push on toward [ShowLocationName('mecca')]."
 hajj_caravan_events.4.a: "Sit with the scholars of Al-Azhar while we can."
 hajj_caravan_events.4.b: "We came for [ShowLocationNameWithNoTooltip('mecca')], not [ShowLocationNameWithNoTooltip('cairo')]. Resupply and go."
 hajj_caravan_events.4.c: "$hajj_caravan_events.display_wealth$"
 hajj_caravan_events.4.historical_info: "The historian and scholar Ibn Ḵaldūn settled in Cairo in 1382, where he taught at Al-Azhar and served as the city's chief Mālikī judge. His reputation drew visiting rulers and scholars from across the Muslim world, eager to sit in on his lectures or seek his counsel."

 hajj_caravan_events.5.title: "The Old Capital"
 hajj_caravan_events.5.desc: "[ShowLocationName('baghdad')] was once the greatest city in the world, capital of a caliphate that stretched from the [ShowContinentName('atlantic_ocean_continent')] to [ShowSubContinentName('central_asia')] before the Mongols burned it to the ground. What remains is quieter — smaller markets, less fervent scholars — but the shrines of its holy dead still draw pilgrims from across the east, and our ruler could pay their respects here before turning south for the [ShowAreaName('hedjaz_area')]."
 hajj_caravan_events.5.a: "Visit the shrines and seek out their scholars."
 hajj_caravan_events.5.b: "Pay our respects, then onward."
 hajj_caravan_events.5.c: "$hajj_caravan_events.display_wealth$"
 hajj_caravan_events.5.historical_info: "Zubayda bint Ja'far, wife of the Abbasid Caliph Hārūn ar-Rašīd, funded the construction of the Darb Zubayda, a pilgrim road with wells, cisterns, and waystations running from near Baghdad all the way to Mecca, after witnessing the hardships of the route herself."

 hajj_caravan_events.6.title: "The Damascene Halt"
 hajj_caravan_events.6.desc: "Orchards give way to the walls of [ShowLocationName('damascus')], one of the oldest cities still standing, its Great Mosque famous across the whole of the faith. Praying beneath its dome and sitting with the jurists who fill its courtyards would cost us days we may not have; the caravan could just as easily water, resupply, and be gone by morning."
 hajj_caravan_events.6.a: "Tarry a while among its mosques and jurists."
 hajj_caravan_events.6.b: "Water the beasts and be gone by dawn."
 hajj_caravan_events.6.c: "$hajj_caravan_events.display_wealth$"
 hajj_caravan_events.6.historical_info: "In the 1550s, the Ottoman Sultan Suleiman the Magnificent had the Takiyya as-Sulaymāniyya complex built in Damascus, a mosque, hostel, and soup kitchen raised specifically to house and provision the thousands of pilgrims who gathered there each year before the Ḥajj caravan departed for Mecca."

 hajj_caravan_events.7.title: "Ḥājjī"
 hajj_caravan_events.7.desc: "The caravan returns home, its stores lighter and its pilgrims changed. Word has already outpaced the camels, and crowds gather to welcome back a ruler who stood before the Ka'ba and lived to tell of it. From this day our ruler carries the title Ḥājjī — earned, not granted, and theirs to keep."
 hajj_caravan_events.7.a: "Let it be known: [ShowLocationNameWithNoTooltip('mecca')] and back, by grace of [ROOT.GetCountry.GetReligion.GetGodName]."
 hajj_caravan_events.7.historical_info: "Askia Muḥammad Ture of the Songhai Empire undertook the Ḥajj in 1496-97 with a retinue of hundreds and a fortune in gold to give away as alms along the way. In Cairo, the Abbasid claimant to the caliphate granted him the title Caliph of the Sudan, and he returned home as al-Ḥajj, his authority over West African Islam confirmed by the pilgrimage."

 hajj_caravan_events.8.title: "Death on the Road to [ShowLocationNameWithNoTooltip('mecca')]"
 hajj_caravan_events.8.desc: "Word reaches the caravan that our ruler has died along the way, far from home and further still from the Ka'ba. Without a sovereign at its head, the caravan cannot continue as it was. It breaks apart, some pilgrims turning back, others pressing on alone to finish the rites they came for."
 hajj_caravan_events.8.a: "May [ROOT.GetCountry.GetReligion.GetGodName] have mercy on their soul."

 hajj_caravan_events.hire_escorts: "Hire more guards for the road ahead."
 hajj_caravan_events.adorn: "Adorn the caravan in banners and silk, then wait."
 hajj_caravan_events.2.d: "$hajj_caravan_events.adorn$"
 hajj_caravan_events.4.e: "$hajj_caravan_events.adorn$"
 hajj_caravan_events.5.e: "$hajj_caravan_events.adorn$"
 hajj_caravan_events.6.e: "$hajj_caravan_events.adorn$"
 hajj_caravan_events.4.d: "$hajj_caravan_events.hire_escorts$"
 hajj_caravan_events.5.d: "$hajj_caravan_events.hire_escorts$"
 hajj_caravan_events.6.d: "$hajj_caravan_events.hire_escorts$"

 hajj_caravan_events.9.title: "Raiders on the Road"
 hajj_caravan_events.9.desc: "Out of the heat-shimmer they come, desert riders with lances raised, wheeling around the column. They have watched us cross their sands and judged the caravan worth the taking. Our guards close ranks, but a fight in the open desert is never a sure thing."
 hajj_caravan_events.9.a: "Pay the tribute. Silver is cheaper than blood."
 hajj_caravan_events.9.b: "Let the guard earn their keep."
 hajj_caravan_events.9.b.chance_tt: "Our guards may fail to repel the raiders, costing guards and splendor instead of [prestige|e]"
 hajj_caravan_events.9.c: "These are pilgrims bound for [ShowLocationNameWithNoTooltip('mecca')], under [ROOT.GetCountry.GetReligion.GetGodName]."
 hajj_caravan_events.9.c.chance_tt: "The appeal may fail to turn the raiders away, costing guards and splendor instead of [prestige|e] and [legitimacy|e]"

 hajj_caravan_events.10.title: "The Dry Wells"
 hajj_caravan_events.10.desc: "The wells ahead stand empty — cracked mud at the bottom, drained to the dregs by some caravan that passed through days before us. The skins slung along the camels' flanks are already light, the animals lowing from thirst, and the sun climbs higher with no mercy in it. The guides fall to muttering about how far the next good water lies."
 hajj_caravan_events.10.a: "Better slow than dead. Turn for the far well."
 hajj_caravan_events.10.b: "The next water will serve. Keep moving."

 hajj_caravan_events.11.title: "The Simoom"
 hajj_caravan_events.11.desc: "The horizon turns the color of rust and the wind climbs to a scream. A wall of sand rolls down on the column, and within moments there is no road, no sky, no rider ahead — only the stinging dark."
 hajj_caravan_events.11.a: "Down packs, veils up. We wait it out."
 hajj_caravan_events.11.b: "Rope the column together and push into it."

 hajj_caravan_events.12.title: "Fever in the Caravan"
 hajj_caravan_events.12.desc: "It begins with a few cases, but by morning it is in every tent: a fever that hollows out even the strongest in days. Packed together on the road, the pilgrims have no way to avoid it."
 hajj_caravan_events.12.a: "We halt. No pilgrim dies abandoned."
 hajj_caravan_events.12.b: "The season will not wait upon the sick."

 hajj_caravan_events.13.title: "The [toll_owner.GetGovernment.GetRulerTitle]'s Price"
 hajj_caravan_events.13.desc: "The road ahead crosses the lands of a local lord, and his riders sit their horses across it, spears grounded and in no particular hurry. His herald comes out smiling: there is a toll for the water, a toll for the passage, a toll for the very sand beneath our feet, and the caravan stirs no further until it is paid. Behind us the pilgrims wait in the heat, watching to see what their sovereign is made of."
 hajj_caravan_events.13.a: "Pay the man and have done with it."
 hajj_caravan_events.13.b: "We owe him nothing. Ride around his wells."
 hajj_caravan_events.13.c: "Let the [toll_owner.GetGovernment.GetRulerTitle] see our caravan and reconsider the toll."

 hajj_caravan_events.14.title: "The Green Halt"
 hajj_caravan_events.14.desc: "Palms rise from the sand ahead, and beneath them a spring, and around it people who come out to meet the pilgrims with dates and cool water. To shelter those bound for the holy city is itself an act of devotion, and freely offered."
 hajj_caravan_events.14.a: "Rest and water the caravan fully before we move on."
 hajj_caravan_events.14.b: "Share our provisions with the oasis poor."
 hajj_caravan_events.14.c: "Thank them, and hold to the road."

 hajj_caravan_events.15.title: "Scholars on the Road"
 hajj_caravan_events.15.desc: "A band of traveling scholars falls in with the caravan, bound for the same holy city, their saddlebags heavy with books. Around the evening fires they hold forth on law and scripture late into the night."
 hajj_caravan_events.15.a: "Sit among them and listen."
 hajj_caravan_events.15.b: "Meet them argument for argument."

 hajj_caravan_events.16.title: "The Season Passed"
 hajj_caravan_events.16.desc: "We arrive too late. The year has turned, and with it the standing at 'Arafāt has passed us by — the hours between noon and sunset when every pilgrim of the season should have stood together on that plain beneath the Mount of Mercy, praying and asking forgiveness. A saying of the Prophet holds that the Ḥajj is nothing more or less than that single afternoon; miss it, and no rite performed afterward can complete the pilgrimage. The caravan can do nothing but disperse and return home, the journey to be made again from the beginning next year."
 hajj_caravan_events.16.a: "We tarried too long. It must be undertaken again."

 hajj_caravan_events.17.title: "The Tempest"
 hajj_caravan_events.17.desc: "The sky blackens and the sea heaves itself into gray hills of water. The ship pitches, the rigging shrieks, and one wave taken wrong could stave in a hull or drag a vessel under with every soul aboard."
 hajj_caravan_events.17.a: "Hold fast. The shipwrights built her well."
 hajj_caravan_events.17.b: "Give her the wind and run."

 hajj_caravan_events.18.title: "Becalmed"
 hajj_caravan_events.18.desc: "The wind dies to nothing. The sails hang slack, the sea lies flat as beaten metal, and the ship sits motionless beneath a merciless sun. Water grows short, and tempers shorter, with every windless day."
 hajj_caravan_events.18.a: "Wait. The wind always returns."
 hajj_caravan_events.18.b: "Out with the boats. We will not sit and rot."

 hajj_caravan_events.19.title: "Fever Below Decks"
 hajj_caravan_events.19.desc: "A sickness creeps through the close, foul air below decks, and within days the ailing outnumber the sound. The ship must still be worked, and there are fewer hands to work her each dawn."
 hajj_caravan_events.19.a: "Make for shore. The crew must have clean water."
 hajj_caravan_events.19.b: "Hold our course and trust the hands to hold."

 hajj_caravan_events.20.title: "Corsairs"
 hajj_caravan_events.20.desc: "A low, fast galley cuts toward the fleet with two more in its wake, oars flashing in the sun. No flags, no hail, only the glint of blades along their rails and the quickening beat of a drum carrying across the water. Corsairs — and they have marked the pilgrims for a prize. The lookouts cry the alarm while below decks the faithful clutch their bundles and their prayers."
 hajj_caravan_events.20.a: "Buy our passage and be gone."
 hajj_caravan_events.20.b: "Clear the decks. We cut through them."
 hajj_caravan_events.20.b.chance_tt: "Our guards may fail to fend off the corsairs, costing guards and splendor instead of [prestige|e]"

 hajj_caravan_events.21.title: "The Reef"
 hajj_caravan_events.21.desc: "A grinding shudder runs the length of the hull and the deck lurches underfoot — an uncharted reef, its coral teeth raking the timbers below the waterline. Seawater is already gurgling into the hold, and the crew throw themselves at the pumps. She is holed and settling, though not yet lost, and the nearest land is only a low green smudge on the horizon."
 hajj_caravan_events.21.a: "Beach the fleet and mend her properly."
 hajj_caravan_events.21.b: "Leave a crew to save her. The rest sail on."

 hajj_caravan_events.22.title: "A Merchant at Sea"
 hajj_caravan_events.22.desc: "A merchant vessel hails us across the water, her decks stacked with bolts of silk and fine cloth from distant ports. Her captain will trade at a merchant's price, but only after a merchant's unhurried haggling."
 hajj_caravan_events.22.a: "Buy the finest cloth aboard."
 hajj_caravan_events.22.b: "No time to haggle. Wave them on."
