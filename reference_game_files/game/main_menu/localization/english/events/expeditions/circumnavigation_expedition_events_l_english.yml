l_english:

 circumnavigation_expedition_events.1.title: "The Great Undertaking"
 circumnavigation_expedition_events.1.desc: "Five ships. Two hundred and seventy men. A year's provisions and a route that no pilot has ever sailed. [target_leader.GetName] speaks calmly of islands thick with cloves and a westward passage to the Spice Islands. The harbormaster does not believe [target_leader.GetHimHer]. The pilots are uncertain. But the ships are provisioned, the wind is favorable, and the commission bears the royal seal.\n\nAhead lies everything that is not yet on any chart."
 circumnavigation_expedition_events.1.magellan: "Set course for the Canaries. God willing, we shall find the Western Sea."
 circumnavigation_expedition_events.1.a: "Steer for the Canaries. What lies beyond, we shall discover."
 circumnavigation_expedition_events.1.historical_info: "In September 1519, Ferdinand Magellan departed from Sanlúcar de Barrameda under contract with the Spanish Crown to find a western route to the Spice Islands. The expedition comprised five ships: the #italic Trinidad#!, #italic San Antonio#!, #italic Concepción#!, #italic Victoria#!, and #italic Santiago#!. Magellan was a Portuguese navigator who had sailed to India and the Moluccas in Portuguese service before transferring his allegiance to the Spanish Crown after King Manuel I refused to increase his stipend. The voyage would become the first circumnavigation of the Earth, though Magellan himself would not live to see its completion."

 circumnavigation_expedition_events.2.title: "The Last Familiar Shore"
 circumnavigation_expedition_events.2.desc: "[current_location.GetProvince.GetName] rises from the sea in flat brown tiers — fortresses of rock against a sky that is still the same sky as in [departure_port.GetName]. The pilots take final soundings. The men drink fresh water from iron casks and repair rigging frayed by the Atlantic swell. Beyond the last headland, the charts end.\n\nSome of the men pray. A few write letters they have no way of sending. [target_leader.GetName] walks the deck as if measuring something that cannot be measured. What is loaded now must last across an ocean and beyond."
 circumnavigation_expedition_events.2.a: "Take on full provisions. We may not pass this way again."
 circumnavigation_expedition_events.2.b: "Leave now, while the men's courage still holds fast."
 circumnavigation_expedition_events.2.c: "The route is too uncertain. Return to port."
 circumnavigation_expedition_events.2.historical_info: "The Canary Islands — then under Castilian rule — served as the standard provisioning stop for Iberian Atlantic expeditions throughout the Age of Exploration. Magellan's fleet stopped at Tenerife to take on fresh provisions before beginning the long Atlantic crossing to the coast of South America. The islands had been colonized by Castile in the early 15th century and served as both a supply depot and a jumping-off point for voyages into unknown waters. How thoroughly a fleet victualed here could decide whether its crews survived the empty leagues to come."

 circumnavigation_expedition_events.3.title: "The New World's Edge"
 circumnavigation_expedition_events.3.desc: "After weeks of open [ShowContinentName('atlantic_ocean_continent')], a low green line hardens on the western horizon — the coast of a New World. Parrots scream in the forest and the water runs sweet from a hundred rivers. Canoes put out from the shore, their paddlers curious and unafraid, offering wood, water, and strange fruit. Here is everything a tired fleet could want — but the season is turning, and the passage south is still unfound.\n\n[target_leader.GetName] weighs the comfort of the shore against the miles still to run."
 circumnavigation_expedition_events.3.a: "Put ashore for wood, water, and fruit; trade with locals."
 circumnavigation_expedition_events.3.b: "The coast can wait. Press south while the season holds."
 circumnavigation_expedition_events.3.historical_info: "Magellan's fleet reached the Brazilian coast late in 1519, making landfall in the vicinity of Cabo de Santo Agostinho before working south. Brazil fell within the Portuguese half of the world under the Treaty of Tordesillas, so a fleet in Spanish service could not linger openly on that shore; nonetheless the coastal Tupi traded eagerly, and the abundance of the land was a welcome relief after the Atlantic crossing."

 circumnavigation_expedition_events.4.title: "The Great Bay"
 circumnavigation_expedition_events.4.desc: "The fleet stands into a bay so vast and sheltered it seems a gift — ringed by green mountains, its waters silver with fish. The people of the shore come out in throngs, trading fowl, fruit, and fish for fishhooks and knives, offering more than the holds can carry. After the long journey across the Atlantic it is a paradise, and the men would gladly never leave.\n\nBut paradise is a poor master of a voyage. [target_leader.GetName] must decide how long the fleet may linger."
 circumnavigation_expedition_events.4.a: "Rest the crews and revictual fully; plenty won't return."
 circumnavigation_expedition_events.4.b: "Trade for what provisions we can and be gone within a week."
 circumnavigation_expedition_events.4.c: "We are not here to feast. Sail on without trading."
 circumnavigation_expedition_events.4.historical_info: "The great bay that would later cradle Rio de Janeiro gave Magellan's fleet its richest resupply of the whole voyage. Its sheltered waters teemed with fish, and the coastal Tupi traded provisions in astonishing quantity for trinkets and iron tools. A thorough revictualing here steeled the crews for the cold latitudes and the search for the strait; a fleet that hurried on paid for its haste in the south."

 circumnavigation_expedition_events.5.title: "The Silver Mouth"
 circumnavigation_expedition_events.5.desc: "The pilots knew there had to be a passage. No continent could go on forever. But the great estuary is so wide that the far bank cannot be seen from the mast, and the water, though brackish, runs brown with silt for forty leagues out to sea. Boats are sent up the river mouth for two weeks.\n\nThey return with news of catfish, shallow water, and no passage to any ocean. Somewhere further south, the real passage waits — if it exists at all."
 circumnavigation_expedition_events.5.a: "Survey the estuary properly; it may be worth the knowing."
 circumnavigation_expedition_events.5.b: "We have no time for rivers that go nowhere. Press south."
 circumnavigation_expedition_events.5.press_tt: "The fleet presses south without delay, seeking the passage that must lie somewhere below"
 circumnavigation_expedition_events.5.c: "These latitudes are beyond reason. Return home."
 circumnavigation_expedition_events.5.historical_info: "The Río de la Plata — the 'River of Silver' — was explored by the Spanish navigator Juan Díaz de Solís in 1516, who was killed by indigenous people shortly after making landfall. Magellan's expedition investigated the estuary in January 1520, incorrectly believing it might be the westward passage. The error cost them several weeks but produced the first detailed Spanish survey of the Río de la Plata region. The river was named for the silver traded there by the Charrua and Guarani peoples, though the rumored mountains of silver further inland proved elusive."

 circumnavigation_expedition_events.6.title: "The Passage at the End of the World"
 circumnavigation_expedition_events.6.desc: "The passage is cold, narrow, and murderous. Walls of black rock rise sheer on both sides, and the channel twists back on itself until the pilots can no longer say which way is west. The wind is the true enemy: it funnels down off the snowfields and changes direction without warning, screaming through the rigging in sudden white squalls that drive the ships back the way they came and pin them for days against the rock.\n\n[target_leader.GetName] stands at the prow of the flagship in silence as the walls close in. The pilots say the passage is navigable. The men are not certain the pilots are sane. Somewhere ahead, if the charts can be believed at all, is an ocean so vast it has no name yet."
 circumnavigation_expedition_events.6.a: "Drive the ships through. Wind alone will not stop us now."
 circumnavigation_expedition_events.6.b: "Winter here. The passage will be kinder with rested crews."
 circumnavigation_expedition_events.6.c: "No route is worth this. Bring the fleet about."
 circumnavigation_expedition_events.6.historical_info: "The Strait of Magellan — navigated in November 1520 — is a 570-kilometer passage through the southernmost tip of South America, flanked by the island of Tierra del Fuego, the 'Land of Fire', named for the watch-fires of its inhabitants. The transit took 38 days. During the approach, Magellan suppressed a mutiny at Port Saint Julian, executing one captain and marooning another. A third ship, the #italic San Antonio#!, deserted and returned to Spain. The remaining three — #italic Trinidad#!, #italic Concepción#!, and #italic Victoria#! — crossed into what Magellan named the #italic Mar Pacífico#! on 28 November 1520, so called because of its apparent calm after the terrors of the strait."

 circumnavigation_expedition_events.7.title: "The Sea They Named Pacific"
 circumnavigation_expedition_events.7.desc: "The last black headland of the strait falls astern, and before the fleet opens an ocean without limit. [target_leader.GetName] names it the #italic Mar Pacífico#! for its calm — a calm that will become a curse. Week gives way to week and no island rises. The water in the casks turns yellow and foul; the biscuit is powder and weevils; the men gnaw ox-hide softened over the side and pay half a ducat for a rat.\n\nThe pilots cannot say how wide this sea is, for no one has ever crossed it. However [target_leader.GetName] chooses to face it, some who set out will not live to see the far shore."
 circumnavigation_expedition_events.7.a: "Ration what we have and hold a steady, prudent course."
 circumnavigation_expedition_events.7.endured_tt: "The crew endures the crossing; the fleet reaches the far shore still in fighting condition"
 circumnavigation_expedition_events.7.scurvy_tt: "Scurvy and starvation take a heavy toll; the fleet crawls on with its crews gutted"
 circumnavigation_expedition_events.7.b: "Crowd on all sail. Fewer die the sooner we raise land."
 circumnavigation_expedition_events.7.fast_tt: "The swift passage spares the worst of the dying, and land is raised in good time"
 circumnavigation_expedition_events.7.lost_tt: "The sea proves wider than any man believed. The last provisions fail, and the expedition is lost with all hands"
 circumnavigation_expedition_events.7.c: "Steer north for the rumored isles, and pray for fresh water."
 circumnavigation_expedition_events.7.islands_tt: "A scatter of islands yields water and fresh food; the crossing is survived nearly whole"
 circumnavigation_expedition_events.7.empty_sea_tt: "The northern reach proves as empty as the rest; the search costs precious time and more lives"
 circumnavigation_expedition_events.7.historical_info: "Magellan's crossing of the Pacific lasted some ninety-nine days without a single resupply — the fleet blundered through the emptiest stretch of the largest ocean on Earth and raised almost no land. About nineteen men died of scurvy; survivors ate sawdust, leather chafing-gear soaked in seawater, and rats sold among the crew for a premium. The first landfall was Guam in the Marianas in March 1521, which the Spanish called the #italic Islas de los Ladrones#! — the 'Isles of Thieves' — after the Chamorro islanders made off with one of the ship's boats, provoking a punitive raid. Sailing the Pacific eastward home would defeat mariners until Andrés de Urdaneta found the northern return route, the #italic tornaviaje#!, in 1565, opening the centuries-long Manila galleon trade."

 circumnavigation_expedition_events.8.title: "The First Land in Two Months"
 circumnavigation_expedition_events.8.desc: "For sixty days and more the fleet has seen nothing but water. Then a cry from the masthead: land! Hope runs through the ships like fire — until the boats draw near. The 'land' is a low ring of coral and palm, beaten by surf, with no bottom to hold an anchor and no sign of fresh water. Birds wheel overhead; the trees hold nothing a starving man can eat.\n\nThe island offers only the cruelty of hope. [target_leader.GetName] must decide whether to linger and search, or move on."
 circumnavigation_expedition_events.8.a: "Lower the boats; search the reef for water or food."
 circumnavigation_expedition_events.8.barren_tt: "The reef yields nothing but the mockery of dry land, and the days are lost"
 circumnavigation_expedition_events.8.relief_tt: "A little rainwater and a few seabirds are gathered — a small mercy against the hunger"
 circumnavigation_expedition_events.8.b: "There is nothing here and no bottom to hold us. Sail on."
 circumnavigation_expedition_events.8.historical_info: "On 24 January 1521 the fleet sighted its first Pacific land: a small, uninhabited atoll it named San Pablo, most likely Puka-Puka in the Tuamotus. Pigafetta records that the two islands found during the crossing had 'no place to anchor, as there is no bottom', and held 'only birds and trees'. Unable to land, the starving crews could take nothing from them, and Magellan named the pair the #italic Islas Infortunadas#! — the Unfortunate Islands."

 circumnavigation_expedition_events.9.title: "The Sharks' Island"
 circumnavigation_expedition_events.9.desc: "A second island rises from the sea, and it is as barren as the first — coral and scrub, ringed with surf, offering no anchorage. The only life in its waters is sharks, gliding gray beneath the hulls in numbers that make the sailors cross themselves. There is no landing here, no water, no food — only the same empty ocean, and the men's hope wearing thinner by the day.\n\n[target_leader.GetName] must decide how the fleet bears its despair."
 circumnavigation_expedition_events.9.a: "Lower the boats once more and try the surf for the shore."
 circumnavigation_expedition_events.9.a.tt: "The boats come back empty, but the crews saw the attempt made, and morale falls only a little (#R -3#! Crew Morale)"
 circumnavigation_expedition_events.9.b: "Name it the Isle of Sharks, and sail on in silence."
 circumnavigation_expedition_events.9.historical_info: "The second of the Unfortunate Islands, sighted on 21 February 1521, was named #italic Tiburones#! — Sharks — for the many sharks Pigafetta recorded in its waters. Likely Caroline or Flint Island, it too offered no bottom for an anchor and no relief. The weeks between the two islands were the worst of the crossing: scurvy killed steadily, and the crews ate leather, sawdust, and rats to survive. They did not fish for the sharks; they could not even reach the shore."

 circumnavigation_expedition_events.10.title: "The Isles of Thieves"
 circumnavigation_expedition_events.10.desc: "At the very edge of endurance, the lookouts spot green mountains — real land at last, with water, fruit, and fish. Outrigger canoes swarm out to meet the fleet, their sailors swift and fearless, coming aboard and carrying off everything not lashed down. To them, a thing unguarded is a thing freely taken; to the famished crews it is robbery.\n\nThese islands can save the expedition, if [target_leader.GetName] can wring provisions from them."
 circumnavigation_expedition_events.10.a: "Trade fairly for all the food and water we can carry."
 circumnavigation_expedition_events.10.b: "Land armed men to recover the boat and take what we need."
 circumnavigation_expedition_events.10.c: "Seize what we can from the canoes and stand out to sea now."
 circumnavigation_expedition_events.10.historical_info: "The fleet reached Guam in the Marianas on 6 March 1521, the first landfall since the strait. Magellan named the islands the #italic Islas de los Ladrones#! — the Isles of Thieves — after the Chamorro, who had no notion of private property, made off with a ship's skiff. In reprisal he landed some forty armed men, burned houses, and killed several islanders to recover the boat. However it was managed, the stop gave the dying crews their first fresh food and water in more than three months, and it was salvation."

 circumnavigation_expedition_events.11.title: "Blood and Faith at Cebu"
 circumnavigation_expedition_events.11.desc: "The islands have saved the expedition. After the ordeal of the crossing, [target_leader.GetName]'s crews take on water, fruit, and fresh meat, and at Cebu the rajah receives them with feasting. A compact is sworn in blood: his people will embrace [ROOT.GetCountry.GetReligion.GetName], and in return the strangers' guns will serve his crown. Hundreds convert in a single day beneath the tropical sun.\n\nThen comes the price of alliance. Across a narrow channel, on the island of Mactan, a defiant chief refuses both [ROOT.GetCountry.GetReligion.GetGodName] and the new overlord — and our ally looks to us to humble him. To make a friend among these islands is to inherit his enemies."
 circumnavigation_expedition_events.11.a: "Take up our ally's quarrel. Let Mactan know our strength."
 circumnavigation_expedition_events.11.mactan_triumph_tt: "The show of force overawes the islands, and our ally's enemies are humbled"
 circumnavigation_expedition_events.11.mactan_disaster_tt: "The assault miscarries in the shallows; good men fall, and the fleet is the weaker for it"
 circumnavigation_expedition_events.11.b: "Take what the islands give, and sail on; not our fight."
 circumnavigation_expedition_events.11.c: "Plant the royal standard. Let the crown record this find."
 circumnavigation_expedition_events.11.historical_info: "Magellan reached the Philippine archipelago in March 1521, naming it the Archipelago of San Lazaro. The Philippines offered the first sustained contact with the peoples of the western Pacific and the provisions that saved the starving fleet. Magellan forged a blood compact with Rajah Humabon of Cebu, converting him and several thousand subjects to Christianity. The alliance proved fatal: on 27 April 1521 Magellan was killed at the Battle of Mactan, leading an ill-judged assault across the reefs against the chieftain Lapulapu on his new ally's behalf. Command eventually passed to Juan Sebastián Elcano, and the survivors — too few now to man three ships — burned the #italic Concepción#! at Bohol."

 circumnavigation_expedition_events.12.title: "The Islands of Spice"
 circumnavigation_expedition_events.12.desc: "The Moluccas. The point on every map that no Iberian ship had ever reached from the west. The smell reaches the ships before the islands are visible — cloves, rich and dark, their scent carried on the same wind that has driven them across two oceans.\n\n[target_leader.GetName] stands on the deck as the pilots call depth readings, and says nothing for a long time. The holds are almost empty. The crew is a shadow of what it was. But they are here, and the Sultan's boats are already pulling out to meet them."
 circumnavigation_expedition_events.12.a: "Fill the holds with [ShowGoodsNameWithNoTooltip('cloves')]; we crossed the world for this."
 circumnavigation_expedition_events.12.cloves_loaded_tt: "The surviving holds are packed with [ShowGoodsName('cloves')], to be sold at [ROOT.GetCountry.GetCapital.GetMarket.GetName] on the fleet's return. A crew that comes through the Pacific intact brings home a far richer cargo"
 circumnavigation_expedition_events.12.b: "Swear a treaty with the Sultan. Alliance outweighs cargo."
 circumnavigation_expedition_events.12.treaty_cargo_tt: "A treaty is sworn with the Sultan and a share of [ShowGoodsName('cloves')] loaded — a lighter cargo, but a friendship in the Spice Islands that will outlast it"
 circumnavigation_expedition_events.12.historical_info: "The Moluccas — the original 'Spice Islands' — were the source of the cloves, nutmeg, and mace that made the eastern trade so valuable. Elcano's ships reached Tidore in November 1521, whose Sultan was the rival of Ternate, then in the Portuguese sphere. The #italic Victoria#! and #italic Trinidad#! loaded cloves; the #italic Trinidad#! afterwards tried to sail back east across the Pacific, failed against the winds, and was taken by the Portuguese. Only the #italic Victoria#!, under Elcano, continued west. When she finally reached Sanlúcar de Barrameda in September 1522 with eighteen survivors and a hold of cloves, that single cargo of spices paid for the entire three-year expedition and returned a profit."

 circumnavigation_expedition_events.13.title: "Rounding the Cape"
 circumnavigation_expedition_events.13.desc: "The cape is everything the old sailors' tales warned it would be — a wall of grey water and wind that treats the ships as if they are leaves. The crew, what remains of it, does not complain. They have already crossed a passage that should have been impossible, an ocean that had no name, and an archipelago that nearly swallowed the fleet. The Cape of Good Hope is just another obstacle.\n\nWhen the flagship clears the headland and the winds ease, [target_leader.GetName] looks east, then west. They have now been in every ocean the world possesses."
 circumnavigation_expedition_events.13.a: "Give thanks. Whatever else happens, we will be remembered."
 circumnavigation_expedition_events.13.b: "No ceremonies. Press north. We are not home yet."
 circumnavigation_expedition_events.13.historical_info: "The #italic Victoria#! rounded the Cape of Good Hope in May 1522 under Elcano's command, completing the last major geographic obstacle before the return to Spain. The Portuguese controlled the Cape route and its resupply ports; Elcano avoided them due to the legal ambiguity of the expedition's status, as Spain and Portugal disputed sovereignty over the Moluccas under the Treaty of Tordesillas. The ship was in poor condition, taking on water, and the crew of 18 — reduced from the original 270 — was near exhaustion. They reached Sanlúcar de Barrameda on 6 September 1522, completing the first circumnavigation of the Earth in just under three years."

 circumnavigation_expedition_events.14.title: "Friendly Shores"
 circumnavigation_expedition_events.14.desc: "The islands ahead fly [ROOT.GetCountry.GetName]'s own colors. After years beyond every chart, the fleet has landed on friendly soil at last — a harbor where the ship may be caulked, the casks filled, and the skeleton crew fed without fear or falsehood. The governor's people come down to the quay to gape at the gaunt, ragged men who claim to have sailed around the world.\n\nHome waters are close now. [target_leader.GetName] need only decide how long to rest."
 circumnavigation_expedition_events.14.a: "Put her to rights: caulk seams, fill casks, feed the men."
 circumnavigation_expedition_events.14.b: "A brief stop only. The men rest properly once home."
 circumnavigation_expedition_events.14.historical_info: "In Magellan's day the Cabo Verde islands were Portuguese, and a Spanish fleet dared not resupply there openly. A crown that held these Atlantic islands itself, however, would find them an invaluable last waystation before the run home — a sheltered place to careen, water, and provision a ship worn to exhaustion by the longest voyage ever attempted."

 circumnavigation_expedition_events.15.title: "The Reckoning"
 circumnavigation_expedition_events.15.desc: "The last ship is leaking at every seam and the crew is starving, yet the only harbor within reach flies the colors of a rival crown. [target_leader.GetName] orders the ship in under a false story — that they are homeward from the Americas, not from the forbidden east. But when the men ask ashore what day it is, the answer is wrong by one: somewhere in circling the world, the fleet has lost a day from its reckoning, and the discrepancy could betray everything.\n\nProvisions are within reach, if the deception holds."
 circumnavigation_expedition_events.15.a: "Hold to the story. Buy quickly, before the questions start."
 circumnavigation_expedition_events.15.ruse_ok_tt: "The story holds; provisions are bought and the ship slips away before the questions harden"
 circumnavigation_expedition_events.15.ruse_failed_tt: "The lie unravels over the missing day, and part of the shore party is seized before the ship can run"
 circumnavigation_expedition_events.15.b: "Do not chance a rival's harbor. Press home hungry as we are."
 circumnavigation_expedition_events.15.historical_info: "In July 1522 the #italic Victoria#! put in at Portuguese Santiago, in the Cabo Verde islands, claiming to be returning from the Americas so as to hide her passage through the Portuguese-claimed east. The ruse held until a discrepancy of a single day in the ship's log — the first practical proof of what circling the globe does to the calendar — aroused suspicion, and the Portuguese seized thirteen of the crew. The rest cut their cable and fled, reaching Spain with only eighteen men aboard."

 circumnavigation_expedition_events.16.title: "A Barren Anchorage"
 circumnavigation_expedition_events.16.desc: "The islands are uninhabited — dry, wind-scoured heaps of rock and scrub — but they are land, with sheltered water and springs among the stones. Better still, goats run wild across the slopes, left by some earlier ship, and the sailors' mouths water at the thought of fresh meat after so long on rot and weevils.\n\nThe anchorage costs nothing but time, and time is the one thing a homeward ship can spare. [target_leader.GetName] gives the order."
 circumnavigation_expedition_events.16.a: "Send hunters ashore for goats and fill casks at the springs."
 circumnavigation_expedition_events.16.b: "Water the ship and press on. Home is near enough now."
 circumnavigation_expedition_events.16.historical_info: "Passing ships often stocked the uninhabited Atlantic islands with goats and pigs, which bred into wild herds and turned bare rocks into unintended larders for later mariners. An uncolonized but watered island on the homeward track offered a worn expedition fresh meat and clean water at no cost but a few days' delay — a small mercy, but a real one, within reach of home."

 circumnavigation_expedition_events.17.title: "No Ship Returns"
 circumnavigation_expedition_events.17.desc: "Season follows season at [capital_location.GetName] with no word from the fleet, until hope itself is spent. The expedition will not come home. Somewhere past the edge of the known world — swallowed by a sea too wide to cross, or ground down to too few ships and too few hands to sail on — the vessels and their crews are gone. Of the fleet that set out to circle the world, nothing returns but silence and the names of the dead.\n\nThe dream outlives the men who chased it. Another reign, another crew, may yet finish what this one began."
 circumnavigation_expedition_events.17.a: "They will not be forgotten."
 circumnavigation_expedition_events.17.end_tt: "The expedition is lost, and its voyage ends here"
 circumnavigation_expedition_events.17.historical_info: "Of the seven ships that set out under García Jofre de Loaísa in 1525 to retrace Magellan's route, only one battered vessel and a handful of survivors ever reached the Moluccas, and none completed the return by the eastern passage. Total loss was a real hazard of the age: circumnavigation demanded years at sea beyond any hope of resupply, and a fleet swallowed by the Pacific might never be accounted for at all."

 circumnavigation_expedition_events.18.title: "Mutiny"
 circumnavigation_expedition_events.18.desc: "It begins the way these things always begin: a muttered word on the night watch, a knot of men who fall silent when an officer passes, a captain who will no longer meet [target_leader.GetName]'s eye. The provisions are short, the men are cold and afraid, and they signed on for a voyage to the Indies, not for the end of the world. Now the discontent has hardened into something with a shape — one of the captains has refused an order outright, and his crew stands at his back, demanding the fleet turn about for home.\n\n[target_leader.GetNameWithNoTooltip] has perhaps a day before the rot spreads to the other ships. What is decided must be decided now."
 circumnavigation_expedition_events.18.a: "Let the malcontents turn back. We sail on without them."
 circumnavigation_expedition_events.18.b: "Put the mutiny down by force. Ringleaders will answer."
 circumnavigation_expedition_events.18.fight_win_tt: "The mutiny is broken and its leaders made an example of. Order is restored, though the reckoning has cost the fleet time"
 circumnavigation_expedition_events.18.fight_lose_tt: "The suppression turns to open fighting and goes badly: a ship is lost in the chaos before order is restored, and the fleet has lost time as well"
 circumnavigation_expedition_events.18.c: "Remind them of what waits beyond the horizon."
 circumnavigation_expedition_events.18.rouse_tt: "[target_leader.GetName] walks the decks and speaks to the crews as no ordinary commander could. The mutiny dissolves of its own accord, and the men's spirits are lifted higher than before"

 circumnavigation_expedition_events.19.title: "A Coast of Our Own"
 circumnavigation_expedition_events.19.desc: "After weeks of open [ShowContinentName('atlantic_ocean_continent')], a low green line hardens on the western horizon — and the banners above the little harbor town are our own. A colony of [ROOT.GetCountry.GetName], planted on this far shore, throws open its storehouses to the crown's ships. Fresh water, fruit, salt meat, and timber for repairs are all to be had, and freely, among countrymen.\n\n[target_leader.GetName] may take on everything the fleet can carry before turning south for the unknown."
 circumnavigation_expedition_events.19.a: "Rest and revictual fully. Friendly soil like this is rare."
 circumnavigation_expedition_events.19.b: "A brief, grateful stop, then south. The season won't wait."
 circumnavigation_expedition_events.19.historical_info: "The northeastern shoulder of Brazil — Pernambuco, Paraíba, Rio Grande — was among the earliest and richest zones of Iberian settlement in the New World, its coast fringed with brazilwood and, before long, sugar. A crown that held these harbors could water and revictual a fleet on its own soil before the long haul into the southern latitudes — a luxury Magellan, threading waters claimed by a rival, never enjoyed."

 circumnavigation_expedition_events.20.title: "A Rival's Coast"
 circumnavigation_expedition_events.20.desc: "After weeks of open [ShowContinentName('atlantic_ocean_continent')], a low green line hardens on the western horizon — but the banners above the harbor belong to [rival_crown.GetName]. Their colony holds this shore, and a fleet in our service has no lawful right to its wharves. Still, the storehouses are full, the factors willing enough to trade for good coin, and the men are hungry for anything that is not weevilly biscuits.\n\n[target_leader.GetName] must decide whether to put in beneath a rival's guns or hold course for the south."
 circumnavigation_expedition_events.20.a: "Trade cautiously with [rival_crown.GetNameWithNoTooltip]'s colony for provisions."
 circumnavigation_expedition_events.20.b: "Give the rival's harbor a wide berth. Press south."
 circumnavigation_expedition_events.20.historical_info: "Under the Treaty of Tordesillas, the Brazilian coast fell within the Portuguese half of the world, and a fleet in Castilian service could claim no right to its harbors. In practice, a hungry crew and a willing colonial factor could still strike a quiet bargain for provisions, but to put in at a rival crown's port was always to risk seizure, extortion, or the confiscation of any ship that could not prove its right to be there."

 circumnavigation_expedition_events.21.title: "Scurvy Aboard"
 circumnavigation_expedition_events.21.desc: "The sickness that haunts every long voyage has come at last. Gums blacken and bleed, old scars split open of their own accord, teeth loosen in the jaw, and men who were hale a month ago can no longer rise from the deck. The surgeon has no remedy but rest and fresh food, and there is precious little of either.\n\n[target_leader.GetName] must weigh how hard a dying crew can be driven."
 circumnavigation_expedition_events.21.a: "Ration fresh stores and lie easy until the worst passes."
 circumnavigation_expedition_events.21.b: "No time to spare. Press on; the strong will endure."
 circumnavigation_expedition_events.21.b.tt: "The crossing grinds on with the sick left to their fate. Many will not see the far shore, and the survivors will be too few to bring home all the fleet"

 circumnavigation_expedition_events.22.title: "A Tempest"
 circumnavigation_expedition_events.22.desc: "The sky turns the color of a bruise and the sea rises into gray mountains. The wind claws at the rigging, and the ships labor in troughs deep enough to swallow a steeple. Green water breaks clean over the decks, and the pilots can no longer see one ship from another.\n\n[target_leader.GetName] must choose whether to fight the storm head-on or run before it and pray the fleet holds together."
 circumnavigation_expedition_events.22.a: "Heave to, shorten sail, and ride it out."
 circumnavigation_expedition_events.22.b: "Run before the wind and make what speed we can."
 circumnavigation_expedition_events.22.b.win_tt: "The fleet runs through the worst of it and comes out scattered, shaken, but whole"
 circumnavigation_expedition_events.22.b.lose_tt: "The gamble fails, the fleet is flung apart in the dark, and a ship may not answer the next dawn"

 circumnavigation_expedition_events.23.title: "The Worm in the Hull"
 circumnavigation_expedition_events.23.desc: "In these warm waters the teredo worm bores into the planking faster than any carpenter can plug it, until the timbers are riddled like a honeycomb. The pumps are manned around the clock, and still the bilges rise. A hull this far gone cannot be trusted across an ocean without a proper careening — beaching the ship, burning the growth from her bottom, and paying her seams anew.\n\n[target_leader.GetName] must decide how to keep the fleet afloat."
 circumnavigation_expedition_events.23.a: "Careen and repair on some lonely beach as best we can."
 circumnavigation_expedition_events.23.a.tt: "The fleet careens on an empty shore and does what it can; the work is slow and costly, but the hulls will hold a while longer"
 circumnavigation_expedition_events.23.b: "Abandon the worst hull and crowd her crew aboard the rest."
 circumnavigation_expedition_events.23.c: "Make for the friendly harbor close at hand and refit her."
 circumnavigation_expedition_events.23.c.tt: "The fleet puts in at a friendly harbor within reach and refits in safety — a far surer repair than any lonely beach could offer, and a welcome rest for the crews"

 circumnavigation_expedition_events.24.title: "Becalmed"
 circumnavigation_expedition_events.24.desc: "The wind dies to nothing. The sails hang slack against the masts, the sea lies flat and glassy beneath a white and pitiless sky, and the ships sit motionless day upon day while the water in the casks turns foul and the food runs down. The men grow sullen and then afraid, muttering that the fleet has sailed off the edge of the world's winds and will never feel them again.\n\n[target_leader.GetName] can only wait — or set the boats to the oars."
 circumnavigation_expedition_events.24.a: "Wait for the wind to return, however long it takes."
 circumnavigation_expedition_events.24.b: "Out boats, and tow the ships by main strength."

 circumnavigation_expedition_events.25.title: "Too Few Hands"
 circumnavigation_expedition_events.25.desc: "So many have died or lie helpless below that there are no longer enough able men to work all the ships. There is nothing for it: one vessel is stripped of everything useful, her handful of fit survivors crowded aboard the others, and her empty hull abandoned to the sea. The fleet sails on the smaller for it — but at least what remains can be properly manned."
 circumnavigation_expedition_events.25.a: "There was no other choice. Divide her crew among the rest."

 circumnavigation_expedition_events.26.title: "A Ship Founders"
 circumnavigation_expedition_events.26.desc: "When the storm at last blows itself out and the fleet gathers again, one ship is missing. Whether she was driven onto a lee shore, opened her seams and went down in the dark, or was simply carried beyond the horizon and lost, no one can say. She does not rejoin. The sea has taken her, and every soul aboard."
 circumnavigation_expedition_events.26.a: "Say prayers for the dead, and sail on."

 circumnavigation_expedition_events.27.title: "An Empty Shore"
 circumnavigation_expedition_events.27.desc: "The holds are running low, but a low green coast lies off the beam — untenanted, so far as the lookouts can tell, with no smoke of cooking fires and no canoes putting out. Fresh water tumbles from the rocks in a dozen streams, wildfowl crowd the shallows, and the woods promise fruit, timber, and game to any party willing to go ashore and take it.\n\nGathering enough to matter will cost the fleet days it can ill afford, but empty bellies cost more. [target_leader.GetName] gives the order."
 circumnavigation_expedition_events.27.a: "Put ashore. Fill the casks and gather wood, fruit, and game."
 circumnavigation_expedition_events.27.b: "There is no time to forage. Press on, hungry as we are."

 circumnavigation_expedition_events.28.title: "Trade with the Shore"
 circumnavigation_expedition_events.28.desc.christian: "The holds are running low, but there is a Christian [trade_shore.GetRank.GetName] on the coast nearby — church bells carrying faintly across the water, a cross raised above the harbor. Their people put out in boats to look the strangers over, wary but willing, and where there is a common faith there is a common tongue for bargaining. Grain, salt meat, fruit, and fresh water are all to be had for coin and trade goods.\n\nA few days spent at anchor here would fill the holds again. [target_leader.GetName] weighs the delay against the dwindling stores."
 circumnavigation_expedition_events.28.desc.muslim: "The holds are running low, but there is a Muslim [trade_shore.GetRank.GetName] on the coast nearby — the call to prayer drifting out over the water, dhows drawn up along the strand. Their traders come out to meet the fleet, shrewd and unafraid, for these are people who have bought and sold across every sea in the world. Rice, dates, salt fish, and sweet water are all to be had for good coin and the right goods.\n\nA few days spent at anchor here would fill the holds again. [target_leader.GetName] weighs the delay against the dwindling stores."
 circumnavigation_expedition_events.28.desc.pagan: "The holds are running low, but there is a [trade_shore.GetRank.GetName] on the coast nearby, its people following gods the fleet's chaplains have never heard named. They come out cautiously in canoes, offering roots, fruit, fish, and gourds of fresh water, curious about the iron and cloth and trinkets the strangers hold up in return. Neither side has the other's language, but hunger and barter need none.\n\nA few days spent trading here would fill the holds again. [target_leader.GetName] weighs the delay against the dwindling stores."
 circumnavigation_expedition_events.28.a: "Put in and trade for all the provisions the fleet can carry."
 circumnavigation_expedition_events.28.b: "We have no time to barter. Press on, hungry as we are."

