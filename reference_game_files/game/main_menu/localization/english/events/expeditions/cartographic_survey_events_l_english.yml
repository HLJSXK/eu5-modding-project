l_english:

 cartographic_survey_events.1.title: "The Survey Commission"
 cartographic_survey_events.1.desc: "The order has been given. A small fleet of two or three vessels, with chart-makers, instrument-keepers, and a chosen captain, will sail the length of our coastline and return with maps fit for the next century. Most of what we know of our own shores comes from local pilots and merchant rumor. After this expedition, there will be charts setting down in ink all the [ROOT.GetCountry.Custom('GetRulerOrRegentTitle')]'s harbors, the navigator's hazards, and the smuggler's coves. The question is only what equipment to commission for the trip."
 cartographic_survey_events.1.a: "Commission the finest brass instruments and chart-makers."
 cartographic_survey_events.1.b: "The standard chart-makers will do. No need for extravagance."
 cartographic_survey_events.1.historical_info: "Systematic coastal surveying began in earnest in the sixteenth century, when the rising volume of maritime trade made accurate charts a matter of state interest. The #italic Casa de Contratación#! in Seville and the Portuguese #italic Armazém da Guiné e Índia#! both maintained official cartographers whose business was the production and updating of sea charts, and the Dutch admiralties followed suit in the seventeenth century."

 # GOOD events: material-specific
 cartographic_survey_events.10.title: "The Fishing Banks Charted"
 cartographic_survey_events.10.desc: "The survey vessel has spent three weeks working with the local fishermen in and around [target_location.GetName], taking soundings over the great fishing banks, marking the lines of the seasonal runs, and noting the currents that carry the boats home before the change of weather. The chart-makers have produced a working sheet that records the depths, the bottom composition, and the customary fishing seasons. A local pilot remarks that he has spent his life on these grounds and never seen them rendered so clearly."
 cartographic_survey_events.10.a: "Distribute the chart to the fishing villages, for trade."
 cartographic_survey_events.10.historical_info: "Pre-modern fisheries depended on oral knowledge passed within fishing families and guilds. The transition to charted fishing grounds, with marked banks, depth contours, and recorded seasonal patterns, was a slow process that accelerated in the seventeenth and eighteenth centuries with the rise of state-sponsored hydrography."

 cartographic_survey_events.11.title: "Timber Stands on the Coast"
 cartographic_survey_events.11.desc: "The surveyors have ridden the coastal forests in [target_location.GetName] with the foresters and the master shipwrights, marking the best stands of mast pine and shipbuilding oak, plotting the streams down which the logs can be driven to the loading beaches, and noting the seasons when the timber takes the saw best. The naval architect, called up from the dockyard to inspect the most promising tract, pronounces it suitable for keel-timbers and frames of the first class."
 cartographic_survey_events.11.a: "Reserve the best stands as [ROOT.GetCountry.GetGovernment.GetAdjective] naval timber."
 cartographic_survey_events.11.historical_info: "Naval timber, especially the oak needed for ship-of-the-line frames and the tall pine needed for masts, was a strategic commodity in the age of sail. The English, French, and Dutch crowns all maintained surveys of coastal timber and reserved the better tracts as crown property, with strict regulations governing felling, drying, and transport."

 cartographic_survey_events.12.title: "The Salt Pans Cataloged"
 cartographic_survey_events.12.desc: "The survey vessel has logged every [ShowGoodsName('salt')] pan, brine spring, and shoal flat along [target_location.GetName]'s stretch of coast. The boilers have been counted, the customary working seasons noted, the local [ShowGoodsNameWithNoTooltip('salt')]-traders interviewed about price, demand, and the routes by which the [ShowGoodsNameWithNoTooltip('salt')] travels inland. The chart that emerges shows a coastal economy that the [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] has barely understood until now, and one that a [ShowGoodsNameWithNoTooltip('salt')] tax, if extended to cover it, would yield handsomely from."
 cartographic_survey_events.12.a: "Send the chart to the [ShowGoodsNameWithNoTooltip('salt')] officials to regularize trade."
 cartographic_survey_events.12.historical_info: "Coastal salt production by solar evaporation was practiced from antiquity around the Mediterranean and on the Atlantic coasts of France, Portugal, and Iberia. The Bay of Bourgneuf, the Île de Ré, and the salt-marshes of the Setúbal Peninsula were the great industrial salt districts of pre-modern Europe, supplying the cod fisheries of the North Atlantic and the cured-meat trade of the entire continent."

 cartographic_survey_events.13.title: "The Pearl Beds Found"
 cartographic_survey_events.13.desc: "The survey has located and mapped the local [ShowGoodsName('pearls')] beds in [target_location.GetName], working with the diving families who have harvested these waters for generations. The chart records the depths, the seasons of the gather, the customary boundaries between rival diving communities, and the routes by which the take reaches the cutters of the cities. The lapidary, brought up to inspect a sample of the season's catch, pronounces the stones of unusual luster."
 cartographic_survey_events.13.a: "[ShowGoodsNameWithNoTooltip('pearls')] of this quality must be under [ROOT.GetCountry.GetGovernment.GetAdjective] regulation."
 cartographic_survey_events.13.historical_info: "European pearl fisheries were modest compared with the great Persian Gulf and Sri Lankan beds, but the waters of the Hebrides, the Vistula, and the coasts of Brittany and Wales did yield freshwater and saltwater pearls of commercial quality. The Scottish crown maintained a royal monopoly on pearl harvest from certain river systems from the medieval period onwards, and the Venetian Senate regulated the Adriatic gather."

 cartographic_survey_events.14.title: "The Vineyard Coast Charted"
 cartographic_survey_events.14.desc: "The surveyors have ridden the coastal hill country in [target_location.GetName] with the vintners, noting the best slopes for the grape, the prevailing winds that ripen or rot the fruit, and the loading beaches where the casks can be put aboard for export. The [ShowGoodsName('wine')]-merchants, normally a secretive sort, have proved unexpectedly helpful once they understood that better charts mean better timing for the export run."
 cartographic_survey_events.14.a: "Send the chart to the [ShowGoodsNameWithNoTooltip('wine')]-shippers for better timing."
 cartographic_survey_events.14.historical_info: "Maritime wine trade was the economic backbone of regions like the Garonne valley, the Douro, the Aegean islands, and the Dalmatian coast. Vintage timing, shipping windows, and harbor quality determined whether a year's pressing reached its market in good condition. The cartography of the wine-bearing coasts was therefore a matter of substantial commercial interest, and the great wine-shippers of Bordeaux and Porto maintained their own private chart collections for centuries."

 cartographic_survey_events.15.title: "The Dye Coast Surveyed"
 cartographic_survey_events.15.desc: "The survey has charted the local dye-producing coast in [target_location.GetName]: the murex beds where the Tyrian purple is gathered, the kermes oaks above the cliffs, the indigo plantings on the inland flats, or whatever local plant or shell yields the color that the [ShowGoodsName('cloth')]-merchants pay for. The chart records the working seasons, the customary gathering grounds, and the routes by which the [ShowGoodsName('dyes')] reach the textile towns."
 cartographic_survey_events.15.a: "Send the chart to the [ShowGoodsNameWithNoTooltip('cloth')]-merchants and the villages."
 cartographic_survey_events.15.historical_info: "Pre-synthetic dyes were a strategic commodity throughout the medieval and early modern periods. Tyrian purple from murex shells, kermes red from oak-scale insects, indigo from the indigofera plant, and woad from the leaves of Isatis tinctoria each had their own geography of production, and the cloth trade depended on the reliability of the supply chains from gathering ground to textile town."

 cartographic_survey_events.16.title: "The [ShowGoodsNameWithNoTooltip('amber')] Coast Mapped"
 cartographic_survey_events.16.desc: "The survey has mapped the beaches in [target_location.GetName] where the [ShowGoodsName('amber')] washes up after storms, identifying the foreshores worth working, the seasons when the surf carries the resin ashore, and the local customs by which the gather is divided. The [ShowGoodsNameWithNoTooltip('amber')]-cutters of the cities, who have always paid a premium for stones of the best clarity, will pay better still when they know which beaches yield which grade."
 cartographic_survey_events.16.a: "Take the best foreshores under [ROOT.GetCountry.GetGovernment.GetAdjective] reservation."
 cartographic_survey_events.16.historical_info: "The Baltic amber coast, from the Sambia peninsula to the eastern Pomeranian shore, was the dominant source of amber for European craft from antiquity onwards. The Teutonic Order famously enforced a strict monopoly on the gather, with severe penalties for unauthorized collection. The amber roads connected the Baltic shore to the workshops of Bohemia, Italy, and Constantinople for over a thousand years."

 # GOOD events: generic encounters
 cartographic_survey_events.20.title: "A Sheltered Harbor"
 cartographic_survey_events.20.desc: "The survey vessel has rounded a low headland in [target_location.GetName] and dropped anchor in a body of protected water that the local fishermen have used for generations but which appears on no existing chart. The depth holds steady at four fathoms over a sand bottom, the prevailing winds break harmlessly on the outer reef, and the local pilot reports that vessels of any reasonable draught can lie here in any weather. With proper soundings and transit lines, the harbor becomes usable by larger craft."
 cartographic_survey_events.20.a: "Set the transit lines and chart the harbor properly."
 cartographic_survey_events.20.historical_info: "Local fishermen frequently knew of sheltered anchorages that did not appear on any official chart, the knowledge passed down through generations as practical pilotage rather than written record. State hydrographic surveys made a point of interviewing such pilots, and the addition of a previously unmarked harbor to the official sailing directions was a routine outcome of pre-modern coastal survey work."

 cartographic_survey_events.21.title: "A Channel Through the Reef"
 cartographic_survey_events.21.desc: "The chart-makers have spent two weeks running the lead-line over an offshore reef in [target_location.GetName] that had always been counted impassable. They have found a channel: thirty feet wide at the narrowest, four fathoms deep at low water, and runnable in any weather with the right transit poles set on the headland behind. A local pilot, who turns out to have known of the channel for thirty years and never told anyone, charges a small fee for the marking."
 cartographic_survey_events.21.a: "Mark the transit poles. The channel goes on the chart."
 cartographic_survey_events.21.historical_info: "Offshore reefs that hid navigable channels were a recurring feature of pre-modern coastal navigation. The transit-pole method, where a vessel approaches the channel on the bearing of two prominent shore landmarks aligned one behind the other, was the standard technique for marking such a passage, and the local knowledge of such transits was often a closely guarded secret of the local pilotage trade."

 cartographic_survey_events.22.title: "A Cove Long Used"
 cartographic_survey_events.22.desc: "The survey has located a sheltered cove in [target_location.GetName] some leagues from the nearest official port. The bottom holds a recent anchor scar, the rocks above the beach show old marks where casks have been rolled, and the local fisher children, when questioned, are unable to keep entirely straight faces. The cove has been used for the unofficial trades for years. With its existence now in the official record, the cove can be turned to legitimate use, or at least to revenue-bearing customs supervision."
 cartographic_survey_events.22.a: "Record the cove and post a small customs station."
 cartographic_survey_events.22.historical_info: "Smugglers' coves were a fixture of the European coastline from antiquity to the early industrial period. The introduction of the coastguard, the customs cutter, and the systematic chart of suspect landing places gradually drove the unofficial trades into smaller and more remote bays, but it took the railway, the telegraph, and the steam-powered patrol vessel to make smuggling at any volume genuinely difficult."

 # BAD events
 cartographic_survey_events.30.title: "Storm Scatters the Survey"
 cartographic_survey_events.30.desc: "A storm came up on the third day of the work, drove the survey vessel onto a lee shore for two cold nights of pounding surf, and scattered the boats sent to fetch the chart-makers off the working stations. By the time the wind dropped and the vessel was refloated, the season's working had been lost, the instruments soaked, and two of the boatswain's mates buried in the dunes above the beach. The chart for [target_location.GetName]'s stretch of coast remains as blank as it was before."
 cartographic_survey_events.30.a: "Move on. The season is too far gone to begin again."
 cartographic_survey_events.30.historical_info: "Sudden storms were the chronic occupational hazard of small-craft coastal survey work. The Beaufort scale, the standardized storm warning, and the systematic forecasting of weather did not arrive until the nineteenth century, and until then a survey vessel that found itself on a lee shore in a rising wind had only the leadline, the anchor, and the sailing master's nerve between it and disaster."

 cartographic_survey_events.31.title: "Run Aground on an Uncharted Shoal"
 cartographic_survey_events.31.desc: "The survey vessel has struck a shoal in [target_location.GetName] that no existing chart had marked, the bottom rising sharp under the keel at almost the same moment the leadline showed four fathoms. The hull has been holed forward of the bulkhead, and the carpenter is at work with lead patches and a coffer-dam while the ship lies careened on the beach. The chart-makers have set up their instruments on the sand and worked through the days, but the survey for this stretch of coast is at an end."
 cartographic_survey_events.31.a: "Repair the vessel. The shoal at least is on our chart."
 cartographic_survey_events.31.historical_info: "Grounding on an uncharted shoal was a routine misfortune of pre-modern survey work, and the wrecking ships often produced more accurate hydrographic information than the cautious sounders who had passed safely along the same coast. Many sailing directions noted shoals by reference to the wrecks that had discovered them, and the location of a previously unknown reef would frequently be added to the chart with the laconic notation that a named vessel had struck there in a stated year."

 cartographic_survey_events.32.title: "A Hostile Vessel"
 cartographic_survey_events.32.desc: "An unflagged vessel, lateen-rigged and clearly armed, came up suddenly out of the haze and sailed towards the survey vessel while it was anchored in [target_location.GetName]. Our crew, ashore on the beach with their instruments, were obliged to abandon the work, take to the boats, and return to the ship with their notebooks half-completed. The unknown vessel followed for half a day, peeled away on a bearing that suggests an unfriendly home port, and left the survey for this stretch of coast in tatters. The chart-makers will not be persuaded to return."
 cartographic_survey_events.32.a: "Move on. A coast watched by hostile eyes yields no chart."
 cartographic_survey_events.32.historical_info: "Coastal survey work was politically sensitive, since accurate charts of a foreign coast were prerequisites for naval operations against it. Survey vessels working in disputed waters were routinely shadowed by armed vessels of the local power, sometimes detained, sometimes merely discouraged. The English Admiralty's hydrographic surveys of the Spanish and the Aegean coasts in the seventeenth and eighteenth centuries were repeatedly interrupted by such pressure, and the survey crews were trained to set the worst of their notes overboard at the first sign of boarding."

 cartographic_survey_events.33.title: "Fog Stalls the Work"
 cartographic_survey_events.33.desc: "The fog rolled in on the second morning and did not lift for three weeks. The chart-makers, unable to take cross-bearings on shore landmarks invisible behind the wall of cloud, spent the time playing dice and complaining of the cold. The provisions ran low; [target_leader.GetName] decided that further waiting was a waste of stores, and the survey for [target_location.GetName]'s coast was abandoned with the chart half-drawn and the soundings unverified. The fog lifted, of course, the day after the vessel sailed."
 cartographic_survey_events.33.a: "Accept the loss of the season and move on."
 cartographic_survey_events.33.historical_info: "Coastal fog was the chronic enemy of pre-modern survey work. The standard hydrographic method required clear lines of sight to fixed shore landmarks from offshore working stations, and a sustained fog made the entire procedure impossible. Survey expeditions in foggy regions, such as Newfoundland, the North Sea, and the Pacific Northwest, frequently spent more time waiting for clear weather than they spent on actual surveying work."
