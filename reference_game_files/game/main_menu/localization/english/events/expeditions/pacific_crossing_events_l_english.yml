 pacific_crossing_cargo_loaded_effect: "The cargo of [ShowGoodsName('silk')], [ShowGoodsName('porcelain')], and spices is loaded, to be sold when the fleet reaches home."

 pacific_crossing_events.1.title: "A Route Home"
 pacific_crossing_events.1.desc: "The commission is not simply to reach [ShowContinentName('asia')] — ships have done that, borne west on the trade winds like a leaf on a stream. The commission is to come back. A colony on the far shore of this ocean is worthless if a fleet can sail to it but never return; the whole enterprise depends on finding a reliable passage home, one a ship can sail year after year with [ShowGoodsName('silver')] going out and [ShowGoodsName('silk')] coming back.\n\nThe outward wind is known and steady. What lies beyond, and whether the sea will ever give the fleet a road back, no chart in this harbor can say. The pilots are certain of only one thing: the way out will not be the way home."
 pacific_crossing_events.1.a: "Fit out a larger fleet, an extra ship for the search ahead."
 pacific_crossing_events.1.a.tt: "An additional ship is outfitted and added to the fleet (#G +1#! Ships)"
 pacific_crossing_events.1.b: "Provision for the passage; trust fortune for the rest."
 pacific_crossing_events.1.c: "[target_leader.GetNameWithNoTooltip] will chart every wind and current we cross."
 pacific_crossing_events.1.historical_info: "The eastward return — the #italic tornaviaje#! — was the great unsolved problem of the early Pacific. Álvaro de Saavedra, sailing from New Spain, was twice driven back by the trade winds in 1528 and 1529 and died in the attempt; Ruy López de Villalobos's expedition of 1542 likewise reached Asia but could find no way home. Not until 1565 was a reliable return route discovered, and until then a fleet could reach Asia but never bring its cargo back."

 pacific_crossing_events.2.title: "The Islands of Thieves"
 pacific_crossing_events.2.desc: "Weeks of nothing but water and sky end when the look-out cries land: a low green island ringed with white surf. Before the fleet can anchor, canoes are racing out to meet it — slender outriggers under triangular sails, skimming from wave to wave so fast the pilots stand and stare. The islanders swarm up the sides, laughing and unafraid, and carry off whatever is not lashed down. To them there is no theft in taking what lies unclaimed; to hungry men a month at sea, it is provocation.\n\nBut there is fresh water here, and fruit, and fish, ripe for the taking — one way or another."
 pacific_crossing_events.2.a: "Trade beads, [ShowGoodsNameWithNoTooltip('cloth')], and [ShowGoodsNameWithNoTooltip('iron')] for water and fruit."
 pacific_crossing_events.2.b: "Take what the ships need by force. No time to spare."
 pacific_crossing_events.2.fight_win_tt: "The islanders scatter before the ships' weapons, and the crew takes on water and fruit at will"
 pacific_crossing_events.2.fight_lose_tt: "The islanders fight back harder than expected, and the crew is driven back to the boats empty-handed"
 pacific_crossing_events.2.c: "Never mind the water — note their swift hulls and sails."
 pacific_crossing_events.2.historical_info: "On 6 March 1521, after more than three months without landfall, the survivors of Ferdinand Magellan's fleet reached Guam. The Chamorro came out in swift outrigger proas, which the chronicler Antonio Pigafetta admired as faster than anything the Spanish sailed. After the islanders took one of the ship's boats, Magellan named the archipelago the #italic Islas de los Ladrones#! — the Islands of Thieves — and landed in force for provisions before sailing on to the Philippines."

 pacific_crossing_events.3.title: "Forty Days of Nothing"
 pacific_crossing_events.3.desc: "No land, no birds, not even a strand of seaweed floating upon the water. The crew has been at sea for weeks and the pilot's confidence thins with each one. Men have bleeding gums and loosening teeth; one swears an old wound, healed for years, has split open again. The water casks are low and the biscuit is more weevil than bread. The wind is kind, steady and cool, but it carries them ever deeper into an ocean that shows no sign of ending.\n\nThe captain keeps his face calm and his voice level, counts the days on the chart, and says nothing he does not believe."
 pacific_crossing_events.3.a: "Cut the rations. We endure what we must."
 pacific_crossing_events.3.b: "The course is sound. Land lies ahead — hold the course."
 pacific_crossing_events.3.c: "Discipline the men, the captain's word is law!"
 pacific_crossing_events.4.title: "Land Across the Western Sea"
 pacific_crossing_events.4.desc: "Long after leaving the Islands of Thieves, the look-out sees green hills through the morning haze. As the fleet enters the great bay, it becomes clear this is no empty shore. A settlement of whitewashed walls and palm-thatched roofs climbs the hill above the water. Outrigger canoes put out toward the ships, crewed by men in colored cloth who show no alarm.\n\nThe largest of them, wearing gold at his throat, speaks [location.GetDominantCulture.GetLanguage.GetName], a tongue none of the pilots know, and gestures toward shore with the ease of a man who trades with strangers often. These islands have a world of their own — and through them already flow the [ShowGoodsName('silk')] and [ShowGoodsName('porcelain')] of far Cathay."
 pacific_crossing_events.4.desc.owned: "Long after leaving the Islands of Thieves, the look-out sees green hills through the morning haze — and then, unmistakable above the settlement climbing the hillside, our own colors flying. The fleet has not stumbled on some unknown shore but sailed into a harbor of our own: [pacific_colony.GetName], a possession of our Crown, its wharves and warehouses already at work.\n\nBoats put out to meet the ships with countrymen aboard, astonished to see a fleet come out of the empty ocean to the east. Here the crews can water and victual in safety, and load the [ShowGoodsName('silk')] and [ShowGoodsName('porcelain')] that Chinese merchants bring to our own quays."
 pacific_crossing_events.4.desc.hostile: "Long after leaving the Islands of Thieves, the look-out sees green hills through the morning haze — and then a flag that is not ours flying above a stockade at the water's edge. Another power has reached these islands first. As the fleet stands into the bay, [pacific_rival_shore.GetName] shows guns run out along its walls, and armed boats pull toward the ships to demand their business.\n\nThis is [pacific_rival.GetName]'s ground now, and the reception will be wary at best. The silk and porcelain of Cathay still flow through the archipelago — but through a rival's hands, and not freely to ours."
 pacific_crossing_events.4.a: "Open trade for the [ShowGoodsNameFlat('silk')] and [ShowGoodsNameFlat('porcelain')] passing through."
 pacific_crossing_events.4.b: "Raid the settlement — take water and provisions by force."
 pacific_crossing_events.4.b.raid_win_tt: "The villagers flee inland, and the crews strip the settlement of food and water"
 pacific_crossing_events.4.b.raid_lose_tt: "The villagers fight for their homes and drive the raiders back to the boats, empty-handed and bloodied"
 pacific_crossing_events.4.d: "Load the season's goods from our own warehouses."
 pacific_crossing_events.4.e: "Rest and refit the crews at our own port."
 pacific_crossing_events.4.f: "Deal warily with the rival's factors, under their guns."
 pacific_crossing_events.4.g: "Force the anchorage and take what we need by arms."
 pacific_crossing_events.4.h: "Give their guns a wide berth and hold our course."
 pacific_crossing_events.4.raid_win_tt: "The outpost is stormed and its stores carried off; the crews are triumphant"
 pacific_crossing_events.4.raid_lose_tt: "The assault is beaten back with loss, and a crippled ship must be abandoned"
 pacific_crossing_events.4.historical_info: "Ruy López de Villalobos, crossing from New Spain in 1542, named the archipelago #italic Las Islas Filipinas#! after the heir to the Spanish throne, the future Philip II. A lasting Spanish presence began only in 1565, when Miguel López de Legazpi founded the first settlement at Cebu; in 1571 he took Manila from Rajah Sulayman and made it the capital of the Spanish East Indies and the western end of the galleon trade."

 pacific_crossing_events.5.title: "The Island of Cloves"
 pacific_crossing_events.5.desc: "The smell reaches the fleet before the island does — a sweetness on the wind, heavy and sharp and spiced. A single volcanic peak trailing cloud, green to the water's edge. The harbor is busy with Malay and Javanese proas, and [target_owner.GetName]'s [target_owner.Custom('GetRulerOrRegentTitle')] has a palace standing plainly visible from the anchorage.\n\nEvery merchant in [ShowLocationName('lisbon')] and [ShowLocationName('sevilla')] pays a fortune for this scent, without ever knowing where its source is. No one in this fleet has ever stood this close to the source — the trees heavy with unripe [ShowGoodsName('cloves')] on the slopes above the bay, where a single shipload is worth more than the whole voyage has cost. The holds can be filled here. What remains is to carry them home."
 pacific_crossing_events.5.desc_known: "The smell reaches the fleet before the island does — a sweetness on the wind, heavy and sharp and spiced. A single volcanic peak trailing cloud, green to the water's edge. The harbor is busy with Malay and Javanese proas, and [target_owner.GetName]'s [target_owner.Custom('GetRulerOrRegentTitle')] has a palace standing plainly visible from the anchorage.\n\nEvery merchant in [ShowLocationName('lisbon')] and [ShowLocationName('sevilla')] knows this scent secondhand, and pays a fortune for it. No one in this fleet has ever stood this close to the source — the trees heavy with unripe [ShowGoodsName('cloves')] on the slopes above the bay, where a single shipload is worth more than the whole voyage has cost. The holds can be filled here. What remains is to carry them home."
 pacific_crossing_events.5.desc.driven_back: "The Spice Islands rise over the bow once more — the same green peak, the same crowded anchorage — and with them the bitter knowledge that the fleet has been driven all the way back to where it began, the way home still unfound. The trades gave the ships no choice but to run back to these shores.\n\nThere is a grim routine to the anchorage now. The islands will give up water and food again; the sick can be landed, the crews rested, the holds topped up with whatever the ships can still carry. But every man aboard knows the reckoning that waits — the fleet must gather itself and stand out to sea to try the passage home again, and it will not have many more attempts left in it."
 pacific_crossing_events.5.a: "Fill the hold with [ShowGoodsNameWithNoTooltip('cloves')] — load every last barrel."
 pacific_crossing_events.5.b: "Victual the ships for the long voyage home."
 pacific_crossing_events.5.c: "Let the crews rest and recover ashore."
 pacific_crossing_events.5.d: "Abandon the search — sail home the long way, round the Cape."
 pacific_crossing_events.5.historical_info: "Portuguese navigators reached the Moluccas in 1512, where Francisco Serrão became an adviser to the Sultan of Ternate. Magellan's surviving ships loaded cloves at the rival sultanate of Tidore in 1521. The Spanish–Portuguese contest for the islands was settled by the Treaty of Zaragoza in 1529, in which the Emperor Charles V, pressed for money, sold Spain's claim to the Moluccas to Portugal for 350,000 ducats."

 pacific_crossing_events.6.title: "The Way Home"
 pacific_crossing_events.6.desc: "The holds are full, and the easy half of the voyage is behind us. Now the fleet must do the one thing no chart aboard can show it how to do: find its way back across the ocean it has just crossed. The wind that bore the ships so gently westward stands square against their return, and every pilot at the table knows what that means.\n\nThe fleet's officers sit late over the charts, and for once the pilots cannot agree. Each has a course to urge and a reason to fear the others, and beyond the edge of the known sea none of them can promise where any of it leads — there is only conjecture, and the nerve to wager on it. The decision belongs to the captain alone, and every soul aboard will live or die by the course he sets."
 pacific_crossing_events.6.desc.driven_back: "The fleet's officers convene again, and the mood at the table has curdled. A course was chosen, and the ocean threw it back; the fleet struggled all the way here for nothing but the lesson of it. The courses that remain are only arguments still — no better proven than before, and now there are fewer ships and thinner crews to hazard upon them.\n\nThe pilots have stopped raising their voices. Every man bent over the chart knows this sea cannot be thrown against again and again without cost. A course has to be set out of these waters once more, and there will not be many more chances to choose."
 pacific_crossing_events.6.a: "The northern route: hug the Asian coast, then ride east."
 pacific_crossing_events.6.a.tt: "Stand north along the coast of [ShowRegionName('japan_region')] and beyond, then let the westerlies of the high latitudes carry the fleet clear across to [ShowContinentName('america')] and home"
 pacific_crossing_events.6.b: "The middle passage — beat east against the trade winds."
 pacific_crossing_events.6.b.tt: "Drive due east into the teeth of the trades, by way of the old islands. The wind has thrown back every fleet that tried it — expect to be beaten all the way back to the Spice Islands"
 pacific_crossing_events.6.c: "The far southern route — a vast arc, long but open."
 pacific_crossing_events.6.c.tt: "Strike far south and east through the island-strewn southern ocean. A passage may well lie that way — but it is immensely long, and the fleet's provisions may not last to the end of it"
 pacific_crossing_events.6.historical_info: "Every attempt to sail east from Asia along the tropics had failed. Gonzalo Gómez de Espinosa's #italic Trinidad#!, trying to return to New Spain in 1522, was driven back and captured by the Portuguese; Álvaro de Saavedra failed twice, in 1528 and 1529. In 1565 the Augustinian friar Andrés de Urdaneta succeeded by sailing far north — to about forty degrees of latitude — to catch the Kuroshio current and the westerlies, then riding them across the North Pacific to California and down to Acapulco. His route served the Manila galleons for the next two and a half centuries."

 pacific_crossing_events.7.title: "Mar Pacífico"
 pacific_crossing_events.7.desc: "The wind dies. The sails hang slack, the sea lies flat and glassy to every horizon, and the ships sit motionless beneath a white and burning sky. It was for calm like this that the ocean was named 'the peaceful sea' — a gentleness that has starved crews before now.\n\nThe water in the casks grows warm and foul. Every windless day is a day's ration spent for no distance made, and the men know it. They watch the empty rigging and the horizon, and twice already have cried land at a bank of cloud that melted into nothing. Idle hands aboard a becalmed ship rarely stay idle for long."
 pacific_crossing_events.7.a: "Wait, and conserve every drop and crumb. The wind returns."
 pacific_crossing_events.7.b: "Out with the boats — tow the ships until wind returns."
 pacific_crossing_events.7.c: "The swell runs south-east — drift with it toward the wind."
 pacific_crossing_events.8.title: "The Galleon Returns"
 pacific_crossing_events.8.desc: "The chartered galleon has come home. Months at sea on the long northern arc have left her low in the water as she stands into the roadstead, heavy with cargo — the wealth of [ShowContinentName('asia')] carried the whole width of the ocean and safely landed. The quays fill with agents and buyers before she has even dropped anchor. The route holds and the enterprise pays; there will be another galleon next year, and the year after that."
 pacific_crossing_events.8.a: "A fortune, safely landed."
 pacific_crossing_events.8.historical_info: "The Manila galleon sailed the Acapulco–Manila run in most years from 1565 until 1815, among the longest-lived shipping lines in history. It carried American silver west and Chinese silk, porcelain, and spice east; a single galleon's cargo could make its investors a fortune. The trade bound the silver of the Americas to the markets of China and turned the Pacific into a highway of global commerce."

 pacific_crossing_events.9.title: "A Known Shore"
 pacific_crossing_events.9.desc: "The long climb north into cold gray water, then the endless arc east across empty ocean, ends when the look-out sees it at last: a high, forested coast, headlands marching away to the south under a bank of fog. This is no part of [ShowContinentName('asia')], nor any island — it is the western shore of [ShowContinentName('america')] itself. The fleet has come out of the [ShowContinentName('pacific_ocean_continent')] on the near side of the world, and has only to run south down a coast that its charts already know to reach a friendly port.\n\nThe way home has been found. All that remains is to sail the last of it."
 pacific_crossing_events.9.a: "Run south for home along a coast we know."
 pacific_crossing_events.9.b: "Put in first for water and rest — the men have earned it."
 pacific_crossing_events.9.historical_info: "Andrés de Urdaneta's return voyage of 1565 made its American landfall on the coast of California, near Cape Mendocino, after some four months on the open North Pacific. From there the #italic San Pedro#! ran south to reach Acapulco on 8 October 1565, proving the route. The northern arc became the standard homeward passage of the Manila galleons."

 pacific_crossing_events.10.title: "The Sea Rises"
 pacific_crossing_events.10.desc: "The sky goes the color of a bruise and the wind comes on like a wall. Within an hour the fleet is fighting for its life — seas rearing higher than the mainyard, green water bursting over the waist, canvas splitting with cracks like gunfire. The ships labor and roll, and in the murk they lose sight of one another one by one. The pilots can do nothing but hold on and count the hours.\n\nThere is a choice, and no time to weigh it: shorten sail and ride out the storm where the ships currently lie, or run before it into the dark and trust the hulls to hold together."
 pacific_crossing_events.10.a: "Heave to and ride it out under bare poles."
 pacific_crossing_events.10.b: "Run before the wind and pray the timbers hold."
 pacific_crossing_events.10.weathered_tt: "The fleet comes through battered but whole"
 pacific_crossing_events.10.foundered_tt: "A ship is driven under and lost with all aboard"
 pacific_crossing_events.11.title: "Green Timbers"
 pacific_crossing_events.11.desc: "The ships were laid down in haste in the new yards of the American Pacific coast, from timber that never had time to season, by shipwrights who had never built for an ocean like this. Now the sea is collecting the debt. A plank starts from its seam amidships; the caulking works loose; below decks the men stand in rising water and the pumps clank day and night without gaining. The carpenter's face tells its own story.\n\nThis cannot continue, and the nearest dry land is half an ocean away."
 pacific_crossing_events.11.a: "Careen the worst of it and make proper repairs."
 pacific_crossing_events.11.b: "Man the pumps in shifts and press on regardless."
 pacific_crossing_events.11.c: "Abandon the failing hull; crowd her crew aboard the rest."

 pacific_crossing_events.12.title: "A Gift from the Sea"
 pacific_crossing_events.12.desc: "It begins with the dolphins — a great pod of them, driving something ahead of them toward the ships. Then the sea itself seems to catch fire: an enormous shoal of fish thrown up to the surface, acres of silver flashing and boiling around the hulls, hemmed in by the circling dolphins until the water can barely be seen for the press of them.\n\nThe crew needs no order. Boats go over the side, lines and nets follow, and men lean from the rails hauling fish by the armful onto decks that are soon heaped and slick with the catch. After weeks of biscuits and salt meat, it is a feast, a windfall, and a mercy all at once."
 pacific_crossing_events.12.a: "Drop every boat and line — take all we can haul."
 pacific_crossing_events.12.b: "Take a quick catch, then back to the wind."

 pacific_crossing_events.13.title: "Rotten Stores"
 pacific_crossing_events.13.desc: "The steward comes to the captain with his hat in his hands. Down in the hold, whole tiers of barrels have been broached and found ruined — salt meat improperly cured, biscuits packed damp, water gone foul in casks that were never properly seasoned. Provisions loaded in haste and sealed wet in the ports of departure have rotted in the tropical heat, and what should have fed the crew for weeks is a reeking, maggot-ridden loss.\n\nThere is no market out here, and no second chance — only spoiled stores and hungry men."
 pacific_crossing_events.13.a: "Throw the spoiled stores overboard and take the loss."
 pacific_crossing_events.13.b: "Ration it out regardless — the men eat what there is."

 pacific_crossing_events.17.title: "Lost to the Sea"
 pacific_crossing_events.17.desc: "The reports, when they finally come, are fragments — a name, a date, a last known heading. The fleet that sailed to find the way home never found it. Whether the ships were swallowed by a storm, driven onto some nameless reef, or simply drifted until the water ran out and the men with it, no one will ever say for certain. The ocean has kept them.\n\nThe route home remains unfound. Somewhere out there, the wind still blows the wrong way."
 pacific_crossing_events.17.a: "They will not be the last we lose to that ocean."
 pacific_crossing_events.17.end_tt: "The expedition is lost, and its voyage ends here"
 pacific_crossing_events.17.historical_info: "The eastward ocean claimed many who tried it. The expedition commander García Jofre de Loaísa and the circumnavigator Juan Sebastián Elcano both died at sea during the Pacific crossing of 1526; Álvaro de Saavedra died in mid-ocean in 1529 attempting the return; and Ferdinand Magellan was killed at Mactan in 1521. Of the roughly 270 men who left Spain with Magellan, only eighteen returned aboard the #italic Victoria#!."

 pacific_crossing_events.18.title: "The Crew Turns"
 pacific_crossing_events.18.desc: "The men have had enough. Short rations, an ocean without end, and a course no one but the pilots can vouch for — it has ground the crew down past obedience. A knot of sailors gathers aft, sullen and armed, and puts the demand plainly: turn the fleet around, or they will turn it themselves. The officers stand few against many, and the muskets are not all on one side.\n\nWhatever is decided now, it will cost the fleet something it cannot easily replace."
 pacific_crossing_events.18.desc.last_ship: "The men have had enough. One ship is all that remains of the fleet, and on its crowded, stinking deck there is nowhere for an officer to hide. The ringleaders come aft in a body, and this time they do not ask — they tell the captain the truth of their situation with terrible simplicity: there is no other ship to flee to, no marines to call, and a great deal of ocean over the side. Turn for home now, they say, or be thrown to it.\n\nThe pilots have gone quiet. The captain stands alone at the rail with the sea at his back, and must answer."
 pacific_crossing_events.18.a: "Give in — let the ringleaders take a ship and turn back."
 pacific_crossing_events.18.b: "Put it down by force. Hang the ringleaders and sail on."
 pacific_crossing_events.18.c: "Remind them what waits at home, and who leads them there."
 pacific_crossing_events.18.fight_win_tt: "The mutiny is broken and order restored (#G +5#! Crew Morale)"
 pacific_crossing_events.18.fight_lose_tt: "The fighting turns bloody, and a ship is lost in the chaos"
 pacific_crossing_events.18.overboard_tt: "The mutineers overpower the officers and throw [target_leader.GetName] into the sea. The voyage ends here"

 pacific_crossing_events.19.title: "The Islands of Thieves, Again"
 pacific_crossing_events.19.desc: "Beating east against the wind, the fleet makes no ground it can keep, and at last the low green islands of [ShowLocationName('guahan')] rise again over the bow — the same shores it left behind after the crossing. The proas come skimming out as before, wary and curious, their crews watching the strangers who have returned from the empty ocean with nothing to show for it. Whatever passed here the first time, the islanders remember it."
 pacific_crossing_events.19.desc.friendly: "Beating east against the wind, the fleet makes no ground it can keep, and at last the low green islands of [ShowLocationName('guahan')] rise again over the bow. This time the proas come out without fear — the islanders remember fair dealing, and there are faces among them the crews half recognize. Trade goods are held up, gestures exchanged, and the promise of water and fresh food is plain enough.\n\nThe fleet needs both badly. Old goodwill, it seems, is worth more out here than any chart."
 pacific_crossing_events.19.desc.hostile: "Beating east against the wind, the fleet makes no ground it can keep, and at last the low green islands of [ShowLocationName('guahan')] rise again over the bow. But the proas that put out now come in numbers, and there is no laughter in them — the islanders have not forgotten the raid, and they have been waiting. Spears bristle along the shore, and the anchorage that gave water freely before will not give it easily now.\n\nThe fleet needs water and food regardless, and the men know they will have to take it through a people ready for them."
 pacific_crossing_events.19.a: "Trade again with people who remember us kindly."
 pacific_crossing_events.19.b: "Take what we need by force before they gather in strength."
 pacific_crossing_events.19.b.win_tt: "The landing seizes food and water before the islanders can muster"
 pacific_crossing_events.19.b.lose_tt: "The islanders are ready this time; the raiders are thrown back with loss"
 pacific_crossing_events.19.c: "Take on what water we can without a fight, and stand on."
 pacific_crossing_events.19.historical_info: "The Marianas became a regular watering-stop for ships crossing the Pacific, and relations with the Chamorro swung between wary trade and open violence across the centuries of the galleon route. A fleet that had treated the islanders well could hope for provisions; one that had not often found the same shores closed against it, or had to fight for every cask of water."

 pacific_crossing_events.20.title: "A Fierce Shore"
 pacific_crossing_events.20.desc: "Another island lifts out of the endless southern sea — steep, green, and ringed with reef. This one is inhabited: smoke rises from the trees, and canoes are already pushing off the beach, crowded with figures who paint themselves and carry spears, and who raise a wall of sound across the water that is either welcome or warning. No one aboard can tell which.\n\nThe pilots have never charted this place and cannot name the people who hold it. But the water-casks are low and the men are hungry, and an inhabited island means food, if it can be had. Whether this shore feeds the fleet or turns on it will depend on how the next hour is played."
 pacific_crossing_events.20.a: "Give the island a wide berth — no fights out here."
 pacific_crossing_events.20.b: "Stand in and trade — hold up [ShowGoodsNameWithNoTooltip('iron')] and [ShowGoodsNameWithNoTooltip('cloth')], and hope."
 pacific_crossing_events.20.trade_ok_tt: "The islanders lower their spears and barter freely; the boats come back laden with food and water"
 pacific_crossing_events.20.trade_ambush_tt: "The parley is a trap — the canoes swarm the boats, and the fleet fights clear at bloody cost"
 pacific_crossing_events.20.c: "Land in force and take what the island has by arms."
 pacific_crossing_events.20.raid_win_tt: "The landing drives the islanders back into the trees and carries off their stores"
 pacific_crossing_events.20.raid_lose_tt: "The islanders fight ferociously for their homes, and the raiders are cut up and driven back to the boats"

 pacific_crossing_events.21.title: "Beaten Back"
 pacific_crossing_events.21.desc: "Week after week the fleet claws east, and week after week the sea sets back everything we have gained. The trade wind never slackens and never shifts; it stands square on the bows like a wall, and the current beneath runs the same way, carrying the ships west faster by night than they make east by day. The pilots take their sightings, compare them, and fall silent — the line on the chart has stopped moving forward, and begun to slide back.\n\nThere is no arguing with it — a treadmill, not a passage, and every day spent on it costs water and lives for nothing. The only course left is the bitter one: come about, run before the wind that has defeated them, and carry the fleet back to the Spice Islands to think again."
 pacific_crossing_events.21.a: "There is no forcing this sea."

 pacific_crossing_events.22.title: "The Crew's Petition"
 pacific_crossing_events.22.desc: "Every day, the provisions are failing at a faster rate than the number of miles we advance. The water is short and foul, the biscuits are gone to dust, and the sick list grows longer every morning. A delegation of the older hands comes aft — not in mutiny, not yet, but with the flat conviction of men who can count barrels. They have done the arithmetic of the voyage, and it does not come out in their favor. Turn back, they say, while there is still enough in the hold to reach a known shore. Press on, and they will bury the fleet in this ocean.\n\nThere is logic in what they say, however unwelcome it is to hear."
 pacific_crossing_events.22.a: "Heed them and turn the fleet back for the Spice Islands."
 pacific_crossing_events.22.b: "Refuse. We have come too far to turn back now."

 pacific_crossing_events.23.title: "Blood on the Deck"
 pacific_crossing_events.23.desc: "The argument that began the day the petition was refused has never truly died down, and today it turns to blows. A boatswain loyal to the voyage trades insults with a knot of men still nursing the refusal to turn back; insults become shoves, and shoves become a brawl spreading fast across the deck, with more than one blade already drawn.\n\n[target_leader.GetName] reaches the scene to find the watch already come to blows over a quarrel that was never truly about the boatswain at all."
 pacific_crossing_events.23.a: "Step in and break up the fight."
 pacific_crossing_events.23.b: "Throw the ringleader overboard and be done with it."
 pacific_crossing_events.23.c: "Heed them and turn the fleet back for the Spice Islands."
 pacific_crossing_events.23.break_up_win_tt: "The fight is broken up before real blood is spilled"
 pacific_crossing_events.23.break_up_lose_tt: "The brawl turns bloody before order is restored"
 pacific_crossing_events.23.overboard_tt: "The ringleader is seized and pitched into the sea without ceremony. The crew watches in cold silence"

 pacific_crossing_events.24.title: "Fire at Sea"
 pacific_crossing_events.24.desc: "A cry goes up from astern: one of the fleet's other ships is ablaze. What began as another brawl over the course home has knocked over a lantern in the confusion, and flame is already running up the rigging faster than buckets can be filled. Sparks carry on the wind toward the rest of the fleet.\n\n[target_leader.GetName] must decide quickly whether to close the distance and help fight the blaze, or hold clear and let the burning ship take its chances."
 pacific_crossing_events.24.a: "Bring your ship alongside to help fight the fire."
 pacific_crossing_events.24.b: "Keep your distance and let them fight it alone."
 pacific_crossing_events.24.saved_tt: "The extra hands beat the flames back before they can spread"
 pacific_crossing_events.24.caught_fire_tt: "Sparks leap the gap, and your own ship catches fire in turn"
 pacific_crossing_events.24.distance_tt: "The other ship burns to the waterline while the fleet looks on from a safe distance"

 pacific_crossing_events.25.title: "Mutiny Aboard"
 pacific_crossing_events.25.desc: "Word reaches [target_leader.GetName] by signal from one of the other ships: the crew there has risen against their officers, the same argument over turning back having curdled into open mutiny. Loyal hands are barricaded below while the mutineers argue over what to do next. There is little time to decide whether to intervene.\n\nA boat lowered now might yet turn the balance aboard the other ship, or simply hand the mutineers a second prize."
 pacific_crossing_events.25.a: "Board the ship and support the loyal crew."
 pacific_crossing_events.25.b: "Keep your distance and let them settle it."
 pacific_crossing_events.25.c: "Heed them and turn the fleet back for the Spice Islands."
 pacific_crossing_events.25.loyal_win_tt: "The loyalists prevail, and order is restored aboard"
 pacific_crossing_events.25.loyal_lose_tt: "The mutineers overpower the boarding party and seize the ship"
 pacific_crossing_events.25.distance_tt: "The mutineers make off with the ship before anything can be done"

 pacific_crossing_events.26.title: "A Petition, Again"
 pacific_crossing_events.26.desc: "The delegation is back, more subdued this time but no less determined. They do not threaten, nor do they raise their voices; they simply lay out the same arithmetic as before, a little grimmer for the days that have passed since it was last refused. A few small concessions might buy some peace belowdecks, if [target_leader.GetName] is willing to make them.\n\nOr the answer can be the same as last time, and the petition can be sent back below with nothing to show for it."
 pacific_crossing_events.26.a: "Hear them out and grant some small concessions."
 pacific_crossing_events.26.b: "Dismiss them again and press on."

 pacific_crossing_events.27.title: "Sabotage in the Night"
 pacific_crossing_events.27.desc: "Someone has been at the stores in the night: a cask of water staved in, a coil of rigging cut half through. Small things, but done with clear intent. Whoever wants this voyage turned back has decided that words are no longer enough. [target_leader.GetName] can order a proper search for the culprit, or simply double the watches and press on without one.\n\nEither way, the message has been received."
 pacific_crossing_events.27.a: "Investigate and find whoever is responsible."
 pacific_crossing_events.27.b: "Double the watches and press on without answers."
 pacific_crossing_events.27.culprit_found_tt: "The culprit is found and made an example of before the whole crew"
 pacific_crossing_events.27.culprit_free_tt: "The search turns up nothing, and the saboteur strikes again before it is called off"
 pacific_crossing_events.27.no_investigation_tt: "The watches are doubled, but the damage to the stores is already done"