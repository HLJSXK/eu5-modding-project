 relic_expedition_events.12.title: "Rival Treasure Hunters"
 relic_expedition_events.12.desc: "A tavern keeper glad to be paid twice brings word to [target_leader.GetName]: agents of a rival power have been sitting in the same rooms, buying drink for the same dockhands, and asking after the very rumor that brought us out here. They came ashore a week ahead of us and have not been careful with their money since. Silence and cooperation both have a price in this town, and whoever meets it first keeps the trail."
 relic_expedition_events.12.a: "Offer more than they can. The crown will better any sum."
 relic_expedition_events.12.b: "Let them chase this one. Others will come by spring."
 relic_expedition_events.12.c: "Wait for them at the narrows, and end the matter there."

 relic_expedition_events.13.title: "A Forger's Workshop"
 relic_expedition_events.13.desc: "An artisan is caught selling a saint's fingerbone to a credulous pilgrim, carved out of mutton that same morning and stained with tea. Pressed on who else he has cheated, he swears instead that he knows of something genuine, come across while he was gathering old wood and older iron for the workshop. He will name the district but not the street until he sees coin. A forger's word is worth precisely what a forger's word is worth."
 relic_expedition_events.13.a: "Pay him for what he claims, but only the once."
 relic_expedition_events.13.b: "Have the retinue press him. Fear is cheaper than silver."
 relic_expedition_events.13.forger_honest_tt: "For once, the coin buys something true, and the forger's story holds"
 relic_expedition_events.13.forger_cheated_tt: "The district he named holds nothing but gossip; the forger has been paid twice for the same lie"
 relic_expedition_events.13.threats_work_tt: "Fear loosens what silver could not, and the forger gives up something real"
 relic_expedition_events.13.threats_fail_tt: "He squeals only louder excuses; the retinue's threats bought nothing but bruised knuckles"

 relic_expedition_events.14.title: "Sandstorm on the Road"
 relic_expedition_events.14.desc: "A wall of ochre dust stands up on the horizon around midday and has swallowed the road within the hour. The camels fold their legs and refuse to rise, grit works into every fold of cloth and every water skin, and the guide admits he can no longer make out the cairns that mark the way. [target_leader.GetName] can press on blind or lose days waiting the storm out."
 relic_expedition_events.14.a: "Push on through it. The road cannot have gone far."
 relic_expedition_events.14.b: "Weight the tents, make camp, and let it blow itself out."

 relic_expedition_events.15.title: "Fever Strikes"
 relic_expedition_events.15.desc_land: "The fever came in with the water carriers and takes men in twos and threes with almost no warning: an aching head at dawn, shaking by noon, a shallow grave by the second morning. The company's two physicians are already past helping everyone who asks for them, and the healthy have begun sleeping well apart from the sick. [target_leader.GetName] must decide what the crown will spend on containing it."
 relic_expedition_events.15.desc_sea: "The fever came aboard with the last water taken on at port, and takes men in twos and threes with almost no warning: an aching head at dawn, shaking by noon, a body slipped over the rail by the second morning. The company's two physicians are already past helping everyone who asks for them in the cramped hold, and the healthy have begun sleeping as far from the sick as the deck allows. [target_leader.GetName] must decide what the crown will spend on containing it."
 relic_expedition_events.15.a: "Spare no expense treating the sick and keeping them apart."
 relic_expedition_events.15.b: "Let it run its course. Fevers burn out soon enough."

 relic_expedition_events.16.title: "Desert Bandits Demand Tribute"
 relic_expedition_events.16.desc: "Armed men are drawn up across the road where it drops between two ridges, too many of them and too well ordered to be common opportunists. Their leader walks his horse out ahead of the line, names a sum for safe passage, and makes it plain that he has already weighed what the alternative would cost him."
 relic_expedition_events.16.a: "Pay the toll, and go before he reconsiders his price."
 relic_expedition_events.16.b: "Fight through them. We did not come this far to be robbed."
 relic_expedition_events.16.c: "Let our numbers do the talking. Few argue with this many."

 relic_expedition_events.17.title: "A Pilgrim's Rumor"
 relic_expedition_events.17.desc: "A caravan of pilgrims shares the waystation for the night, and the talk at the fire turns to relics, as it always does. One of them, a wool merchant's son from far inland, repeats a story he half remembers from an uncle twenty years dead: monks carrying a bundle out of a burning house, a night on the coast road, and a burial nobody was meant to see. He cannot name the house. He is oddly certain about the road."
 relic_expedition_events.17.a: "Buy the man another cup, and press him for every detail."
 relic_expedition_events.17.b: "One more tale among a thousand. We move on at first light."
 relic_expedition_events.17.tale_confirmed_tt: "A coin loosens his tongue, and a detail slips free that he probably should not have shared"
 relic_expedition_events.17.tale_fades_tt: "Another cup does not help; the details only blur further with every retelling"

 relic_expedition_events.18.title: "The Money Runs Short"
 relic_expedition_events.18.desc: "A poor month of exchange, and moneylenders who have grown suddenly careful about lending to foreigners, leave the expedition's coffers a good deal thinner than reckoned. The retinue's wages are already a fortnight behind, the muleteers want paying in coin they trust rather than ours, and word of an unpaid company travels through these towns faster than any of our questions do."
 relic_expedition_events.18.a: "Cover the shortfall from the crown's own purse, quickly."
 relic_expedition_events.18.b: "Let their pay lapse a little longer. They have nowhere else."

 relic_expedition_events.19.title: "The Local Authorities Take Notice"
 relic_expedition_events.19.desc_muslim: "The local #italic qāḍī#! has heard that foreigners are asking pointed questions about Frankish treasure, and about which households kept what for themselves when the kingdoms fell. His secretary calls on [target_leader.GetName] with tea, compliments, and a message plain enough beneath the courtesy: such inquiries proceed far more smoothly with his master's knowledge, and with a suitable contribution toward the upkeep of the mosque."
 relic_expedition_events.19.desc_christian: "The local [relic_hunt_current_loc.GetOwner.GetGovernment.GetEstateName('clergy_estate')] have noticed a foreign company inquiring rather too closely after relics they hold to be the business of the Church and of nobody else. The archdeacon receives [target_leader.GetName] with every courtesy, speaks at some length on the sin of avarice, and leaves no doubt at all that his continued goodwill will want a gift laid on the altar."
 relic_expedition_events.19.desc_fallback: "Talk of the expedition's questions has reached ears better left undisturbed. A man nobody troubles to introduce arrives at the lodging house after dark, sits down without being invited, and explains at length how much trouble a foreign party can find for itself in a town like this one. The warning is unhurried, entirely polite, and perfectly clear."
 relic_expedition_events.19.a: "Pay the necessary respects, seen by the right people."
 relic_expedition_events.19.b: "Ignore the warning and keep working. Time is short enough."

 relic_expedition_events.20.title: "The True Cross Recovered"
 relic_expedition_events.20.desc: "Word reaches the courts of Christendom that the [relic_finder.GetLongName] has recovered $relic_true_cross_found$, unaccounted for since the disaster at Hattin, and now keeps it in their own treasury. Every cathedral chapter will want its own account of how it was found, and few of them will agree on its legitimacy."
 relic_expedition_events.20.a: "Word travels fast in Christendom."

 relic_expedition_events.21.title: "The Holy Lance Resurfaces"
 relic_expedition_events.21.desc: "News spreads among the faithful that the [relic_finder.GetLongName] has recovered $relic_holy_lance_found$, unaccounted for since the First Crusade moved on from [ShowLocationName('antioch')]. More than one pilgrim itinerary will be redrawn on the strength of it."
 relic_expedition_events.21.a: "Another relic finds its way home."

 relic_expedition_events.22.title: "The Holy Shroud Found"
 relic_expedition_events.22.desc: "Reports circulate through Catholic Europe that the [relic_finder.GetLongName] has come into possession of $relic_holy_shroud_found$, a cloth long spoken of and never yet accounted for. Skeptics will doubt it, as they always have. The faithful will make the journey regardless."
 relic_expedition_events.22.a: "Let the pilgrims judge for themselves."
