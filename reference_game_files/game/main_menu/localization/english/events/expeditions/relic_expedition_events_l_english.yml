l_english:

 relic_expedition_events.1.title: "The Relic Hunt"
 relic_expedition_events.1.desc: "The bishops have asked, and the [ROOT.GetCountry.Custom('GetRulerOrRegentTitle')] has agreed. A merchant home from the Levant tells it this way: a Damascene trader had it from his own father that when the Crusader kingdoms fell, a good deal of what the Franks kept in their churches was carried off and buried rather than burned. Buried things can be dug up. They can also be bought, if a man finds the right household in the right week and does not haggle where he can be overheard.\n\nWhich relic, and where, nobody will say. Stories like this are cheap in every port on that coast. This one has been repeated to the right ears."
 relic_expedition_events.1.a: "Outfit them well: gifts, an interpreter, a friar, a purse."
 relic_expedition_events.1.b: "A single agent, a discreet purse. Fewer eyes, less risk."
 relic_expedition_events.1.historical_info: "The True Cross was carried onto the field at Hattin in July 1187 and taken by Saladin's army. Richard the Lionheart, the Byzantine emperor, and the Queen of Georgia all attempted to ransom it, and all failed; the last credible report places it in Damascus, after which it leaves the record entirely. The Holy Lance, found at Antioch in 1098, disappeared just as quietly once the First Crusade moved on. Neither loss was ever accounted for, which is precisely why searchers kept looking."

 relic_expedition_events.2.title: "Arrival"
 relic_expedition_events.2.desc_jerusalem_first: "The expedition has come to [ShowLocationName('jerusalem')] and stands before the Church of the Holy Sepulchre. The [location_scope.GetOwner.GetAdjective] garrison looks the party over and loses interest. Foreigners arrive here every season for the same tomb and the same stories. Somewhere behind those stories is a trail worth following, and finding it will be slow and expensive, and mostly a matter of choosing whom to believe."
 relic_expedition_events.2.desc_jerusalem_repeat: "Back in [ShowLocationNameWithNoTooltip('jerusalem')]. The canons of the Holy Sepulchre know [target_leader.GetName] by now, and the garrison no longer bothers to look up."
 relic_expedition_events.2.desc_acre_first: "The expedition reaches [ShowLocationName('acre')], capital of the Crusader kingdom until the Mamluks took it in 1291. The cathedral still stands after a fashion, with sky where its roof was, and whole quarters have never been rebuilt since the sack. Nobody has yet had a reason to sift the rubble."
 relic_expedition_events.2.desc_acre_repeat: "[ShowLocationNameWithNoTooltip('acre')] again. [target_leader.GetName] knows which alleys repay a second walk."
 relic_expedition_events.2.desc_antioch_first: "The expedition reaches [ShowLocationName('antioch')], seat of the vanished Crusader principality and the city where $relic_holy_lance_found$ was dug out of a church floor in the desperate summer of 1098. Where the lance went after the army marched south to [ShowLocationNameWithNoTooltip('jerusalem')], no one in the West has ever settled. It is not the only thing this city has lost track of."
 relic_expedition_events.2.desc_antioch_repeat: "[target_leader.GetName] is back in [ShowLocationNameWithNoTooltip('antioch')], still asking after the lost lance, still getting three answers to every question."
 relic_expedition_events.2.desc_damascus_first: "The expedition reaches [ShowLocationName('damascus')], the great [location_scope.GetOwner.GetAdjective] capital of [ShowProvinceDefinitionName('shaam_province')] and the last place $relic_true_cross_found$ was credibly reported after Hattin. Whether that particular relic is still here is another matter. A city of this size has taken in a great many treasures over the centuries and given very few back."
 relic_expedition_events.2.desc_damascus_repeat: "Back in [ShowLocationNameWithNoTooltip('damascus')]. [target_leader.GetName] has learned who talks in this [location_scope.GetRank.GetNameWithNoTooltip], and what it costs."
 relic_expedition_events.2.desc_tripoli_first: "The expedition reaches [ShowLocationName('tripoli_syria')], a Crusader county until its fall in 1289. Trade in the harbor is as brisk as ever, but the chapel of the old citadel has stood unconsecrated longer than anyone here can remember, and nobody has emptied it either."
 relic_expedition_events.2.desc_tripoli_repeat: "Back in [ShowLocationNameWithNoTooltip('tripoli_syria')]. The harbor merchants know [target_leader.GetName] by sight now."
 relic_expedition_events.2.desc_tyre_first: "The expedition reaches [ShowLocationName('sur')], a [location_scope.GetRank.GetName] old enough that the Gospels record Christ passing through its territory, and one of the last mainland strongholds the Crusaders held before 1291. Its archbishopric kept records for two centuries. What survives of them is scattered across a dozen private houses, and no two owners agree on what they hold."
 relic_expedition_events.2.desc_tyre_repeat: "Back in [ShowLocationNameWithNoTooltip('sur')]. [target_leader.GetName] has read most of what the old archbishopric left behind."
 relic_expedition_events.2.desc_jaffa_first: "The expedition reaches [ShowLocationName('jaffa')], where pilgrims once landed by the shipload, and where the Apostle Peter is said to have raised the widow Tabitha from the dead. Two centuries of pilgrim traffic passed through this harbor in both directions. Not all of it left again."
 relic_expedition_events.2.desc_jaffa_repeat: "Back in [ShowLocationNameWithNoTooltip('jaffa')]. The dockside quarter has grown used to [target_leader.GetName]'s questions."
 relic_expedition_events.2.desc_hebron_first: "The expedition reaches [ShowLocationName('hebron')] and the Cave of the Patriarchs, where Abraham, Isaac, and Jacob are all said to lie buried, holy to [ShowReligionGroupAdjective('israelite_group')], [ShowReligionGroupAdjective('christian')], and [ShowReligionGroupAdjective('muslim')] believers alike. Three faiths have added to this shrine and taken from it for centuries. Something small, put away in the wrong century, could sit here unremarked for good."
 relic_expedition_events.2.desc_hebron_repeat: "Back in [ShowLocationNameWithNoTooltip('hebron')]. [target_leader.GetName] has walked the precincts of the shrine before, and knows where not to be seen walking."
 relic_expedition_events.2.desc_sidon_first: "The expedition reaches [ShowLocationName('sidon')], another town the Gospels record Christ visiting, and a Crusader lordship until the kingdom fell. The old Frankish quarter has been resettled twice since then. The present tenants have no idea what is in their own cellars."
 relic_expedition_events.2.desc_sidon_repeat: "Back in [ShowLocationNameWithNoTooltip('sidon')]. [target_leader.GetName] has a list of Frankish houses worth a second visit."
 relic_expedition_events.2.desc_karak_first: "The expedition reaches [ShowLocationName('karak')], the desert castle Reynald de Châtillon held as lord of Oultrejourdain. Reynald robbed pilgrim caravans for years and is said to have stored the proceeds here against the siege he knew Saladin would bring. Every family in the town below tells that story differently."
 relic_expedition_events.2.desc_karak_repeat: "Back at [ShowLocationNameWithNoTooltip('karak')]. [target_leader.GetName] has heard the castle's legends once already, and twice from the talkative."
 relic_expedition_events.2.desc_gaza_first: "The expedition reaches [ShowLocationName('gaza')], an ancient city with a Templar garrison in its day, on the desert road south toward [ShowRegionName('egypt_region')]. The order was suppressed and its brothers scattered across Christendom generations ago. What they kept here did not all leave with them."
 relic_expedition_events.2.desc_gaza_repeat: "Back in [ShowLocationNameWithNoTooltip('gaza')]. [target_leader.GetName] has spoken with most of the families who live where the Templars used to."
 relic_expedition_events.2.desc_famagusta_first: "The expedition reaches [ShowLocationName('famagusta')], the great port of the [location_scope.GetOwner.GetAdjective] [location_scope.GetOwner.GetFlavorRank] of [ShowProvinceDefinitionName('cyprus_province')]. Latin families fled here in numbers after [ShowLocationNameWithNoTooltip('acre')] fell in 1291, and a good many of them brought more out of the mainland than their titles."
 relic_expedition_events.2.desc_famagusta_repeat: "Back in [ShowLocationNameWithNoTooltip('famagusta')]. They know [target_leader.GetName] at the Cathedral of Saint Nicholas now."
 relic_expedition_events.2.desc_nicosia_first: "The expedition reaches [ShowLocationName('nicosia_cyp')], the seat of power on [ShowProvinceDefinitionName('cyprus_province')]. The [location_scope.GetOwner.GetAdjective] [location_scope.GetOwner.GetGovernment.GetCourtTitle] keeps a long archive of what the exiled mainland nobility carried over with them, and a longer one of what they later pawned."
 relic_expedition_events.2.desc_nicosia_repeat: "Back in [ShowLocationNameWithNoTooltip('nicosia_cyp')]. The [location_scope.GetOwner.GetAdjective] archivists have stopped asking why [target_leader.GetName] keeps returning."
 relic_expedition_events.2.desc_rhodes_first: "The expedition reaches [ShowLocationName('rodos')], [location_scope.GetOwner.GetAdjective] territory. The order here remembers the fall of [ShowLocationNameWithNoTooltip('acre')] as its own history and kept lists of every commandery abandoned on the mainland. No other city in these waters will open such records to a Catholic search party."
 relic_expedition_events.2.desc_rhodes_repeat: "Back on [ShowLocationNameWithNoTooltip('rodos')]. The [location_scope.GetOwner.GetAdjective] archivists greet [target_leader.GetName] as a familiar nuisance."
 relic_expedition_events.2.desc_fallback: "Another stop, another round of introductions. [target_leader.GetName] begins again and waits for something worth chasing."
 relic_expedition_events.2.a: "Ask around. Pilgrims and soldiers talk, if paid in [ShowGoodsNameWithNoTooltip('wine')]."
 relic_expedition_events.2.b: "We have finally picked up the trail of a relic."
 relic_expedition_events.2.c: "Hire more retinue here. Good guards do not come cheap."
 relic_expedition_events.2.d: "Bribe a court official for whatever is in the local archive."
 relic_expedition_events.2.e: "Seek out a scholar. A trained mind reads rumors better."
 relic_expedition_events.2.f: "Follow a promising clue toward [relic_hunt_new_lead.GetNameWithNoTooltip]."
 relic_expedition_events.2.g: "Call off the search and turn back."

 relic_expedition_events.3.title: "The Search Continues"
 relic_expedition_events.3.desc_jerusalem: "[target_leader.GetName] goes back to the Holy Sepulchre before dawn, ahead of the pilgrim crowds. There is another crypt to see by candlelight, another worn inscription to copy down, another canon willing to talk for the right consideration."
 relic_expedition_events.3.desc_acre: "Hollow walls sounded out, collapsed masonry turned over where nobody has disturbed it in generations. [ShowLocationNameWithNoTooltip('acre')] is a large [relic_hunt_loc.GetRank.GetName] with very few people left in it, and one party can cover only so much of it."
 relic_expedition_events.3.desc_antioch: "[target_leader.GetName] traces the line of the vanished walls, setting what still stands against pilgrim accounts of where the Lance came up. The accounts do not agree with each other, and none of them agree with the ground."
 relic_expedition_events.3.desc_damascus: "Souk by souk, [target_leader.GetName] cultivates merchants and moneylenders. Rumors move slowly through a city this large, but they do move, and they arrive with a price already attached."
 relic_expedition_events.3.desc_tripoli: "The citadel chapel comes apart flagstone by flagstone, plaster prised off wherever the wall sounds wrong. The chapel alone is weeks of work."
 relic_expedition_events.3.desc_tyre: "[target_leader.GetName] works through what survives of [ShowLocationNameWithNoTooltip('sur')]'s archbishopric records, laying water-stained ledgers beside half-legible charters and hunting for the entry that does not match the others."
 relic_expedition_events.3.desc_jaffa: "[target_leader.GetName] spends the days at [ShowLocationNameWithNoTooltip('jaffa')]'s harbor, buying drink for dockhands and boatmen and asking which warehouses handled pilgrim cargo before the Franks left."
 relic_expedition_events.3.desc_hebron: "The shrine is examined alcove by alcove, slowly, and with great care to give no offense to any of the three faiths that keep it. [target_leader.GetName] notes every sealed passage and asks about none of them aloud."
 relic_expedition_events.3.desc_sidon: "House by resettled house through the old Frankish quarter, [target_leader.GetName] knocks and asks after cellars and lofts that nobody has opened since the last Christian tenants fled."
 relic_expedition_events.3.desc_karak: "Lantern in hand, [target_leader.GetName] walks [ShowLocationNameWithNoTooltip('karak')]'s vaults and cisterns, measuring Reynald de Châtillon's hoard as the storytellers describe it against what the walls will actually admit to."
 relic_expedition_events.3.desc_gaza: "[target_leader.GetName] keeps after the suppressed order's holdings in [ShowLocationNameWithNoTooltip('gaza')], pressing the neighbors on which storerooms the Templars kept locked, and who took the keys afterward."
 relic_expedition_events.3.desc_famagusta: "Trunk by trunk through the exiled mainland families' household chests in [ShowLocationNameWithNoTooltip('famagusta')], cataloging what came out of [ShowLocationNameWithNoTooltip('acre')] and what has been quietly forgotten since."
 relic_expedition_events.3.desc_nicosia: "[target_leader.GetName] reads through the [relic_hunt_loc.GetOwner.GetAdjective] [relic_hunt_loc.GetOwner.GetGovernment.GetCourtTitle]'s archive in [ShowLocationNameWithNoTooltip('nicosia_cyp')], cross-checking inventories against inheritance rolls for a relic nobody has thought to ask about."
 relic_expedition_events.3.desc_rhodes: "[target_leader.GetName] presses the [relic_hunt_loc.GetOwner.GetAdjective] archivists on [ShowLocationNameWithNoTooltip('rodos')] for the volumes they have not offered, and sets their lists against what the older brothers say was carried out of [ShowLocationNameWithNoTooltip('acre')]."
 relic_expedition_events.3.desc_fallback: "[target_leader.GetName] keeps at it, turning each small lead over in turn before letting it go."
 relic_expedition_events.3.a: "Keep asking. Someone here knows more than they say."
 relic_expedition_events.3.b: "At last, the trail itself. We have found it."
 relic_expedition_events.3.c: "Hire more retinue while we are here."
 relic_expedition_events.3.d: "Bribe another official. This town keeps better records."
 relic_expedition_events.3.e: "Consult a local scholar before moving on."
 relic_expedition_events.3.f: "A fresh clue points elsewhere. Follow it toward [relic_hunt_new_lead.GetNameWithNoTooltip]."
 relic_expedition_events.3.g: "Call off the search and turn back."

 relic_expedition_events.4.title: "The Trail Has Gone Cold"
 relic_expedition_events.4.desc: "Every lead [target_leader.GetName] has chased has come to nothing. The interpreters have run out of taverns, the bribed officials have nothing further to sell, and the purse grows lighter every week the party sits idle in a foreign country. Word goes home to the crown: pay for more searching, or end it."
 relic_expedition_events.4.a: "Send the necessary funds."
 relic_expedition_events.4.b: "Enough. Recall the expedition."

 relic_expedition_events.5.title: "The Escort Is Lost"
 relic_expedition_events.5.desc: "[target_leader.GetName]'s escort is gone, lost in twos and threes to bandits, to fever, and to the quiet desertion of men paid too little for a search with no end in sight. Nobody presses a lord or an abbot for a relic they have no wish to surrender without armed men standing behind the request.\n\nThe hunt ends here."
 relic_expedition_events.5.a: "The mission cannot continue without them."

 relic_expedition_events.6.title: "A Willing Seller"
 relic_expedition_events.6.desc_true_cross: "A merchant in the town, careful about who is within earshot, says he holds a fragment of $relic_true_cross_found$ itself, the wood lost at Hattin, come down through hands he declines to name. He will name a price, though."
 relic_expedition_events.6.desc_holy_lance: "The family of a dead soldier has kept a spearhead since their great-grandfather's service and insists it is $relic_holy_lance_found$, the one uncovered in 1098. They would rather have the money."
 relic_expedition_events.6.desc_holy_shroud: "A merchant unfolds a linen sheet marked with the faint image of a crucified man. He cannot account for where it has been these many centuries, and he wants a very great sum for it regardless."
 relic_expedition_events.6.desc_holy_nail: "A blacksmith's widow brings out an iron nail gone black with age. Her husband's family always swore it was one of the nails of the Crucifixion. She would sell."
 relic_expedition_events.6.desc_true_cross_fragment: "A poor and half-forgotten monastery keeps a splinter of wood in a plain reliquary, labeled only as a piece of $relic_true_cross_found$. The abbot will part with it quietly if the sale keeps the roof up."
 relic_expedition_events.6.desc_saint_bones: "A parish priest offers a small casket of bones with a saint's name on it in faded Latin. He would call the payment a donation to the church."
 relic_expedition_events.6.desc_baptist_head: "A church in the district venerates what it says is the head of John the Baptist. The claim has never traveled far beyond the parish, and the clergy are open to discussing a transfer."
 relic_expedition_events.6.desc_virgin_milk: "A small shrine keeps a sealed vial of white, chalky residue, honored for generations as milk of the Virgin Mary. The keeper will sell it, silver reliquary and all."
 relic_expedition_events.6.desc_holy_thorn: "A minor noble family owns a single thorn in a modest reliquary, given to an ancestor out of the Crown of Thorns, so they tell it. They would prefer any sale go unremarked."
 relic_expedition_events.6.desc_holy_chalice: "A merchant expects not to be believed and says so, then offers a plain stone cup he maintains is the true chalice of the Last Supper, whatever the grander claimants elsewhere insist. His price is not modest."
 relic_expedition_events.6.desc_titulus_crucis: "Local legend holds that when the wood of the Cross went west, the inscription board from above it stayed behind and was hidden. A family here claims to have inherited exactly such a board, and would sell it."
 relic_expedition_events.6.a: "Haggle. The asking price is steep, but there is room."
 relic_expedition_events.6.b: "Pay what is asked. Some things are worth the price."
 relic_expedition_events.6.c: "Let the size of our retinue do the talking instead."

 relic_expedition_events.7.title: "Sealing the Deal"
 relic_expedition_events.7.desc: "Terms are agreed and the reliquary wrapped in cloth. All that remains is for [target_leader.GetName] to decide how much of the seller's story to believe."
 relic_expedition_events.7.a: "Pay, and take the relic home."
 relic_expedition_events.7.b: "Something about this does not sit right. Walk away."

 relic_expedition_events.8.title: "A Willing Accomplice"
 relic_expedition_events.8.desc_true_cross: "A servant in a local notable's household, sour about something he will not explain, mentions that his master keeps a wrapped fragment of dark wood he calls $relic_true_cross_found$, unremarked among the rest of his treasures. For a price, the servant will help us take it."
 relic_expedition_events.8.desc_holy_lance: "A garrison soldier owed a year of back pay lets slip that the armory holds an old spearhead nobody has inventoried in living memory. The older men still call it $relic_holy_lance_found$. He can get us in."
 relic_expedition_events.8.desc_holy_shroud: "A monastery porter, lately in a bitter dispute with his abbot, says the community keeps a folded cloth marked with an image, locked away from all but the senior brothers. He will leave a door unbarred."
 relic_expedition_events.8.desc_holy_nail: "A treasury clerk deep in debt admits that an old iron nail revered as one of the Crucifixion nails sits uncataloged in a side vault. He holds the only key to it."
 relic_expedition_events.8.desc_true_cross_fragment: "A novice unhappy in his vocation offers to leave a shutter open onto the chapel where his house keeps its splinter of $relic_true_cross_found$."
 relic_expedition_events.8.desc_saint_bones: "A gravedigger paid too little for a lifetime of work knows where the parish keeps its casket of a saint's bones, and what hour the sacristan lies down in the afternoon."
 relic_expedition_events.8.desc_baptist_head: "A junior canon passed over for promotion once too often offers to walk us to the reliquary the senior clergy venerate as the head of John the Baptist."
 relic_expedition_events.8.desc_virgin_milk: "The shrine's own caretaker, quietly furious after decades of poor wages, will leave the reliquary case unlocked on a night of his choosing."
 relic_expedition_events.8.desc_holy_thorn: "A steward dismissed once and reinstated on sufferance knows exactly where the family keeps its reliquary with the single thorn from the Crown."
 relic_expedition_events.8.desc_holy_chalice: "A cathedral sacristan has nothing good to say about the chapter he has served for years, and offers to help us lift the plain stone cup they call, in private, the true chalice of the Last Supper."
 relic_expedition_events.8.desc_titulus_crucis: "A family that has kept an old and half-believed legend alive proposes something else entirely: help them take back what they insist is the true inscription board of the Cross from a kinsman who will not sell it to them."
 relic_expedition_events.8.a: "Discretion costs money."
 relic_expedition_events.8.d: "No need for gold. [target_leader.GetHerHis|U] own charm will secure their help."
 relic_expedition_events.8.b: "Go in without one. Fewer paid means fewer talking."
 relic_expedition_events.8.c: "No accomplices needed. Our retinue can simply take it."

 relic_expedition_events.9.title: "The Theft"
 relic_expedition_events.9.desc: "So far the plan holds. Whoever should be keeping watch is asleep, or elsewhere, or paid to look the other way, and the door the accomplice promised stands unbarred. [target_leader.GetName] waits in the dark for the shout that would mean otherwise."
 relic_expedition_events.9.a: "It is done. The relic is ours, and no one the wiser."
 relic_expedition_events.9.b: "Someone wakes. Shouts, running feet. Retreat!"

 relic_expedition_events.10.title: "The Scholar's Directions"
 relic_expedition_events.10.desc_true_cross: "A traveling scholar who has read every chronicle of Hattin has narrowed down, from three accounts that agree almost by accident, the stretch of ground where retreating knights are said to have buried a fragment of $relic_true_cross_found$ rather than lose it to Saladin. He offers his notes, his weathered maps, and himself."
 relic_expedition_events.10.desc_holy_lance: "A scholar of the First Crusade believes he has located, from [GetCharacter('koj_petrus_bartholomaeus').GetName]'s own account, the cellar where $relic_holy_lance_found$ came up in 1098. He argues that whatever lay beside it was never fully recovered. Rival clerics called the notion fanciful at the time, but none of them disproved it."
 relic_expedition_events.10.desc_holy_shroud: "An elderly antiquarian is half-convinced by a rumor he cannot properly source: an image-bearing shroud walled into a crypt by monks fleeing a raid that appears in no chronicle. He is nearly blind and wants one last discovery, and he will lead us to the place himself."
 relic_expedition_events.10.desc_holy_nail: "A scholar of relics points to a half-collapsed chapel where local tradition has a fleeing priest burying a Crucifixion nail ahead of soldiers passing through."
 relic_expedition_events.10.desc_true_cross_fragment: "Three generations of monastery ledgers, read end to end, have brought a scholar to a hermitage abandoned in haste, where the last hermit is said to have put a fragment of $relic_true_cross_found$ under the chapel floor before running for his life."
 relic_expedition_events.10.desc_saint_bones: "A local hagiographer working from crumbling parish registers has settled on an unmarked grave at the edge of an old cemetery: a minor saint whose bones were hidden rather than left to a hostile army."
 relic_expedition_events.10.desc_baptist_head: "From a fragmentary chronicle found in a monastery archive, a scholar argues that a reliquary venerated as the head of John the Baptist went under the floor of a chapel during an old siege, and that the chapel came down on top of it."
 relic_expedition_events.10.desc_virgin_milk: "A scholar citing a pilgrim's diary nobody else has bothered to read points to a walled-up niche in an abandoned shrine, where the custodians are said to have hidden a vial of the Virgin's milk instead of handing it over to looters."
 relic_expedition_events.10.desc_holy_thorn: "A scholar has read his way through a dead family's private correspondence and traced a thorn from the Crown itself to their crypt, sealed since the plague that emptied the household."
 relic_expedition_events.10.desc_holy_chalice: "There is a strand of Grail legend here with nothing to do with the famous claims at [ShowLocationName('genoa')] and [ShowLocationName('valencia')]. The scholar who follows it believes a plain stone cup lies under a chapel destroyed in an old siege, its congregation scattered long before anyone thought to dig."
 relic_expedition_events.10.desc_titulus_crucis: "Local tradition holds that the inscription board of the Cross never went west at all. A scholar who takes that tradition seriously thinks it was walled up in a chapel here during the final Crusader retreat, and offers to help find the wall."
 relic_expedition_events.10.a: "Hire local laborers. More hands, better odds of success."
 relic_expedition_events.10.b: "Dig with the expedition's own men. Fewer questions asked."
 relic_expedition_events.10.c: "No need to pay outsiders. Our own retinue can dig instead."

 relic_expedition_events.11.title: "The Excavation"
 relic_expedition_events.11.desc: "The ground is stubborn and the digging slow. [target_leader.GetName] can do nothing now but wait and learn whether the scholar can read a map."
 relic_expedition_events.11.a: "The spades strike something. Just where the scholar said."
 relic_expedition_events.11.b: "Nothing but earth and rubble. The site was emptied."

 relic_expedition_events.clues_up_1_tt: "The trail grows warmer (#G +1#! Clues)"
 relic_expedition_events.clues_down_1_tt: "The trail grows colder (#R -1#! Clues)"
