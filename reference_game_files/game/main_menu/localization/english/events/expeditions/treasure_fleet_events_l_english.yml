l_english:

 treasure_fleet_events.1.title: "Age of Treasure Voyages"
 treasure_fleet_events.1.entry: "$treasure_fleet_events.1.title$"
 treasure_fleet_events.1.desc: "The last prosperous decades have aided us with plenty of disposable gold and resources to spend on our diplomatic efforts. We could, and most certainly should, make use of those funds to further bolster the already strong position of the [GetInternationalOrganization('middle_kingdom').GetName] in the eyes of the world. To do so, we shall send forward various maritime expeditions full of the richest gifts that [ROOT.GetCountry.GetName] can afford, so as to convince more nations to become part of our [ShowSubjectTypeName('tributary')] network."
 treasure_fleet_events.1.a: "So, we shall!"
 treasure_fleet_events.1.zheng_he_owned_tt: "Zhèng Hé must currently be in our service"
 chi_able_to_send_treasure_voyages: "[ROOT.GetCountry.GetName] will be able to use the [ShowGenericActionName('start_a_treasure_voyage')] [action|e] to expend their [gold|e] in order to get more nations to join their [ShowSubjectTypeName('tributary')] network. This will only be possible as long as they are the [international_organization_leader_short|e] of the [GetInternationalOrganizationType('middle_kingdom').GetName]."

 treasure_fleet_events.2.title: "The End of an Age"
 treasure_fleet_events.2.desc: "Today, the state of [ROOT.GetCountry.GetName] looks back on the achievements of the Treasure Voyages and it sees nothing more than vain squandering of funds done for nothing but a little bit of prestige. It would be best if historians simply omitted the existence of those exploits."
 treasure_fleet_events.2.a: "It is what it is."
 chi_unable_to_send_treasure_voyages: "[ROOT.GetCountry.GetName] will no longer be able to use [ShowGenericActionName('start_a_treasure_voyage')]."

 treasure_fleet_events.3.title: "Start of an Expedition"
 treasure_fleet_events.3.desc: "After weeks of preparation, our grand navy is finally ready to set sail for the [target_area.GetName]. It is unknown what kind of adventures or misadventures $expedition_leader_name$ and $expedition_leader_name_herhis$ crew will encounter on the way, but, considering that [ROOT.GetCountry.GetGovernment.GetRulerOrRegent.GetName] has entrusted them with such a responsibility, we are sure that they will not disappoint.\n\nAs per the plan, the fleet will set sail at daybreak from the port of [start_location.GetName] and it might take years until they return to our shores. We bid them farewell!"
 treasure_fleet_events.3.a: "Good luck!"

 chinese_treasure_expeditions_send_tooltip: "The $expedition_name_treasure_voyage$ is sent towards [ROOT.GetVariable('chinese_treasure_target_location').GetLocation.GetName] under the leadership of [character_expedition_leader_target.GetName].\nThe fleet holds #g [ROOT.GetVariable('chinese_treasure_voyage_cargo').GetValue|2]#! [gold|e] worth in cargo intended for gifts to [countries|e] that they will visit"

 treasure_fleet_events.4.title: "Word from the $expedition_name_treasure_voyage$"
 treasure_fleet_events.4.desc: "A junk has put in at one of the southern ports with news from the $expedition_name_treasure_voyage$. The fleet under $expedition_leader_name$ has reached the harbor of [port_location.GetName] in the country of [port_country.GetName], and the [port_country.GetGovernment.GetCourtTitle] has received them in due form. Our envoys have exchanged trade goods and presented the customary gifts to the [port_country.Custom('GetRulerOrRegentTitle')]. The fleet's chronicler reports the wind and the season are favorable for the next leg of the journey. There is, the captain notes, no immediate reason for the [ROOT.GetCountry.GetGovernment.GetCourtTitle] to expect ill news."
 treasure_fleet_events.4.a: "May the wind continue favorable."

 treasure_fleet_events.5.title: "Arrival of the [expedition_initiator.GetAdjectiveWithNoTooltip] $expedition_name_treasure_voyage$"
 treasure_fleet_events.5.desc: "At daybreak, the [target_stop.GetRank.GetName] dwellers of [target_stop.GetName] were greeted with a most terrifying yet astounding sight. The entire horizon over the [coastal_sea_tile.GetName] was covered in ships of none other than the [GetInternationalOrganization('middle_kingdom').GetName], the [expedition_initiator.GetLongName]. The leader of the fleet, $expedition_leader_name$, promptly disembarked at our port and obtained permission to restock over at [target_stop.GetNameWithNoTooltip]. What followed next is truly bizarre, as the [expedition_initiator.GetAdjectiveWithNoTooltip] sailors got in contact with the local bailiffs, showering them in gifts and asking for an audience with the [ROOT.GetCountry.GetGovernment.GetRulerTitle]."
 treasure_fleet_events.5.a: "Welcome them to the [ROOT.GetCountry.GetGovernment.GetCourtTitle]!"
 treasure_fleet_events.5.a.entry: "Welcome them to the court!"
 
 treasure_fleet_events.6.title: "Audience of the [ROOT.GetCountry.GetGovernment.GetRulerTitle]"
 treasure_fleet_events.6.desc: "$expedition_leader_name$ and $expedition_leader_name_herhis$ retinue have finally managed to get in contact with our benevolent [ROOT.GetCountry.GetGovernment.GetRulerTitle]. Their massive fleet and a shower of gifts have made a great impression on us all and so we were most appalled when they offered us what amounts to a [ShowSubjectTypeName('tributary')] relationship under the [expedition_initiator.GetAdjective] rule. Perhaps, being subject to such a powerful state would offer us more good than it seems."
 treasure_fleet_events.6.a: "Friendship has a price."
 treasure_fleet_events.6.b: "We will have none of that!"

 

 chinese_expedition_resolution_tt: "For the following months, the Chinese $expedition_name_treasure_voyage$ will stay in our port of [target_stop.GetName]. We will receive [events|e] allowing us to interact with them and that will modify their opinion of us. Depending on the opinion at the end of the stay, we will get different results:\n\nObedient (#y 67#! - #y 100#!):\n[ShowScriptedEffectForScope('chi_expedition_resolution_very_positive', ROOT.GetCountry.MakeScope.Self)]\nFavorable (#y 33#! - #y 66#!):\n[ShowScriptedEffectForScope('chi_expedition_resolution_positive', ROOT.GetCountry.MakeScope.Self)]\nLukewarm (#y -32#! - #y 32#!):\n$NOTHING_HAPPENS_EFFECT$\nDisrespectful (#y -66#! - #y -33#!):\n[ShowScriptedEffectForScope('chi_expedition_resolution_negative', ROOT.GetCountry.MakeScope.Self)]\nArrogant (#y -100#! - #y -67#!):\n[ShowScriptedEffectForScope('chi_expedition_resolution_very_negative', ROOT.GetCountry.MakeScope.Self)]"

 treasure_fleet_events.7.title: "Appropriate Gifts"
 treasure_fleet_events.7.desc_shared: "With their mission in [ROOT.GetCountry.GetName] complete, the treasure fleet of [expedition_initiator.GetName] is currently restocking their supplies, anticipating to leave within a matter of several months. It would be customary to provide them with the best that our [ROOT.GetCountry.GetFlavorRank] can offer as a token of appreciation"
 treasure_fleet_events.7.desc: "$treasure_fleet_events.7.desc_shared$ and as a confirmation of our [ShowSubjectTypeName('tributary')] relationship."
 treasure_fleet_events.7.desc_no_tributary: "$treasure_fleet_events.7.desc_shared$ for their visit."
 treasure_fleet_events.7.a: "Show them our generosity."
 treasure_fleet_events.7.gift: "Give them our specialty."
 treasure_fleet_events.7.b: "We cannot afford it..."

 treasure_fleet_events.8.title: "Expedition Departs"
 treasure_fleet_events.8.desc: "At long last, the [expedition_initiator.GetAdjective] treasure fleet has finally departed [target_stop.GetName]. We have shown them great hospitality and we hope their journey will be full of good graces."
 treasure_fleet_events.8.a: "Farewell!"
 chi_fleet_will_depart: "The [expedition_initiator.GetAdjective] expedition will depart from [ROOT.GetCountry.GetName]"

 chinese_expedition_opinion: "Treasure Expedition Trust"
 based_on_expedition_opinion: "Based on the $chinese_expedition_opinion$ (Currently [ROOT.GetVariable('chinese_expedition_opinion').GetValue]), the following will happen:"

 treasure_fleet_events.9.title: "Return of the $expedition_name_treasure_voyage$"
 treasure_fleet_events.9.desc: "Our fleet that we sent out years ago to [ROOT.GetVariable('chinese_treasure_target_location').GetLocation.GetName] has finally returned bearing many envoys and gifts that they have received during their long trip. $expedition_leader_name$ is now heading with the riches and the foreign representatives towards our capital."
 treasure_fleet_events.9.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 treasure_fleet_events.9.a.entry: "$common_string_brilliant$"

 treasure_fleet_events.10.title: "Audience with the [ROOT.GetCountry.GetGovernment.GetRulerTitle]"
 treasure_fleet_events.10.desc: "$expedition_leader_name$ has finally returned to [ROOT.GetCountry.GetCapital.GetName] to much fanfare and cheer. As part of their delegation they bring many envoys from the countries they have visited who are ready to swear fealty to the [ROOT.GetCountry.GetGovernment.GetRulerTitle]. We are much pleased with their decision to come here."
 treasure_fleet_events.10.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 treasure_fleet_events.10.a.entry: "$common_string_brilliant$"

 treasure_fleet_events.11.title: "End of Expedition"
 treasure_fleet_events.11.desc: "The $expedition_name_treasure_voyage$ has finally come to an end. Let us review whether our investment was worth it in the end and consider whether to send another one in the future as they are a costly matter."
 treasure_fleet_events.11.a: "We need more missions like those."

 chi_we_will_gift_cloves: "We will give [expedition_initiator.GetName] a gift of [ShowGoodsName('cloves')]"
 chi_we_will_gift_giraffe: "We will give [expedition_initiator.GetName] a giraffe"
 chi_we_will_gift_persian_blue: "We will give [expedition_initiator.GetName] a gift of our local [ShowGoodsName('dyes')]"

 treasure_fleet_events.12.title: "An Exotic Beast"
 treasure_fleet_events.12.desc: "Our $expedition_name_treasure_voyage$ has brought a truly exceptional and outstanding creature back to the [ROOT.GetCountry.GetGovernment.GetCourtTitle] of the [ROOT.GetCountry.GetGovernment.GetRulerTitle]! It is a massive beast with tall neck and covered in darker spots, and it has been labeled as a giraffe overseas. Our courtiers, however, have identified the creature with the legendary [ShowCultureGroupName('chinese_group')] #italic qílín#!, which signifies an oncoming golden era under the rule of an illustrious ruler. We could buy into the theory, bolstering our prestige, but setting higher expectations for our actions."
 treasure_fleet_events.12.a: "It is the mythical #italic qílín#!!"
 treasure_fleet_events.12.b: "A wonderful creature, for sure."

 treasure_fleet_events.13.title: "Color of Wonders"
 treasure_fleet_events.13.desc: "Our grand expedition has brought back an exotic dye from the [ShowSubContinentName('middle_east')]. An intensive blue, it has been identified as a perfect resource that could be used for the production of our renowned [ShowGoodsName('pottery')]. Enough of those [ShowGoodsName('dyes')] have been brought back for us to utilize them in our production."
 treasure_fleet_events.13.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 treasure_fleet_events.13.a.entry: "$common_string_brilliant$"

 treasure_fleet_events.14.title: "A Taste to Remember"
 treasure_fleet_events.14.desc: "While [ShowRegionName('indonesia_region')] is certainly known for its spices, our $expedition_name_treasure_voyage$ has visited an area where the exceptional [ShowGoodsName('cloves')] are grown in large amounts - the [ShowAreaName('moluccas_area')]. The locals there have welcomed our expedition graciously and have provided us many of those wonderful spices as tribute. The [ROOT.GetCountry.GetGovernment.GetCourtTitle] and the [ROOT.GetCountry.GetGovernment.GetRulerTitle] will savor it for the months to come."
 treasure_fleet_events.14.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 treasure_fleet_events.14.a.entry: "$common_string_brilliant$"

 treasure_fleet_events.15.title: "Coward Found"
 treasure_fleet_events.15.desc: "During the $expedition_name_treasure_voyage$, $expedition_leader_name$ and $expedition_leader_name_herhis$ loyal sailors have managed to track down a high-profile dissident named [extradited_character.GetName]. [extradited_character.GetShortNameWithNoTooltip] escaped [ROOT.GetCountry.GetName] a long time ago, fleeing from due justice. Our expedition however not only did manage to find [extradited_character.GetHerHim], but also to wrestle [extradited_character.GetHerHim] from [extradited_character.GetHerHis] asylum keepers in [asylum_country.GetName] and they brought [extradited_character.GetHerHim] back to $china$ for justice to be served."
 treasure_fleet_events.15.a: "Strangle this petty criminal!"
 treasure_fleet_events.15.b: "Have [extradited_character.GetHerHim] beheaded."
 treasure_fleet_events.15.b.entry: "Have him beheaded."
 treasure_fleet_events.15.c: "Issue the #italic língchí#!, slow slicing."
 treasure_fleet_events.15.d: "Pardon the dissident, [extradited_character.GetHerHis] skills might be useful."
 treasure_fleet_events.15.d.entry: "Pardon the dissident, his skills might be useful."

 treasure_fleet_events.16.title: "Execution of [executed_character.GetNameWithNoTooltip]"
 treasure_fleet_events.16.desc: "[executed_character.GetName] is a runaway from [executed_character.GetBirthLocation.GetArea.GetName] whose family turned to piracy after implementation of the [ShowPolicyName('haijin_policy')]. After [executed_character.GetHerHis] flight, [executed_character.GetShortNameWithNoTooltip] became a pirate chief in [loser_country.GetName] and subsequently waged battles against $expedition_leader_name$ off the coast of the [loser_country.GetFlavorRank]. Now, time has come to make an example out of [executed_character.GetNameWithNoTooltip]."
 treasure_fleet_events.16.a: "Justice is served."

 treasure_fleet_events.17.title: "A Defiant Ruler"
 treasure_fleet_events.17.desc: "During our $expedition_name_treasure_voyage$, $expedition_leader_name$ and $expedition_leader_name_herhis$ grand fleet managed to acquire a high-profile prisoner - [loser_character.GetName], formerly the [loser_country.GetGovernment.GetRulerTitle] of the [loser_country.GetLongName]. However, the treason and disrespect of [loser_country.GetNameWithNoTooltip] has led [loser_character.GetHerHim] to a swift defeat, where [loser_character.GetSheHe] was taken prisoner."
 treasure_fleet_events.17.a: "Make an example out of [loser_character.GetHerHim]."
 treasure_fleet_events.17.a.entry: "Make an example out of him."
 treasure_fleet_events.17.b: "Show a benevolent attitude."

 treasure_fleet_events.18.title: "Fate of [loser_country.GetNameWithNoTooltip]"
 treasure_fleet_events.18.desc: "The foolish ruler of [loser_country.GetName] once stood defiant to the wishes of the [GetInternationalOrganization('middle_kingdom').GetName] represented by $expedition_leader_name$ and $expedition_leader_name_herhis$ expedition. After a fierce conflict, the [loser_country.GetLongNameWithNoTooltip] was defeated and a temporary [loser_country.GetGovernment.GetRulerTitle] was put in place while we decide on what to do with them."
 treasure_fleet_events.18.a: "Send [target_character_for_viceroyalty.GetNameWithNoTooltip] to rule as our viceroy."
 treasure_fleet_events.18.a.entry: "Send him to rule as our viceroy."
 treasure_fleet_events.18.b: "The local figurehead can stay."

 treasure_fleet_events.19.title: "Viceroy from [expedition_initiator.GetNameWithNoTooltip]"
 treasure_fleet_events.19.desc: "We have received news from [GetInternationalOrganization('middle_kingdom').GetName]. They have arranged for our state to be governed by their viceroy, [target_character_for_viceroyalty.GetName], who will proceed to rule us under a [ShowSubjectTypeName('tributary')] relationship for the foreseeable future. Such is the fate of ours, to be dominated by our enemy war victors."
 treasure_fleet_events.19.a: "We will throw off this yoke in due time."

 treasure_fleet_events.20.title: "Gifts from Afar"
 treasure_fleet_events.20.desc: "Over the course of the expedition, our sailors have been gifted many local wares and goods that have now been brought to $china$. Those hold little monetary use for us, but they do put the [GetInternationalOrganization('middle_kingdom').GetName] in a favorable light and are sure to enhance our prestige for years to come."
 treasure_fleet_events.20.a: "We expected no less."

 treasure_fleet_events.21.title: "Death of [target.GetNameWithNoTooltip]"
 treasure_fleet_events.21.desc: "Word has reached us that our $expedition_name_treasure_voyage$ leader, $expedition_leader_name$, has perished while on $expedition_leader_name_herhis$ journey. The second in command, [new_leader.GetName], has assumed command and will have to lead the journey on his own."
 treasure_fleet_events.21.a: "Let this not be an omen of what is to come."
 chi_new_expedition_leader: "[new_leader.GetName] is now the leader of our $expedition_name_treasure_voyage$"

 treasure_fleet_events.22.title: "Low on Funds"
 treasure_fleet_events.22.desc: "We have received information that the $expedition_name_treasure_voyage$ has run short of gifts to conduct diplomacy with. Without appropriate gifts to offer, the fleet will forgo further courtesy calls at foreign ports for the remainder of the voyage. Perhaps next time we should grant more appropriate funds to our expeditions."
 treasure_fleet_events.22.a: "This is embarrassing."
 chi_expedition_is_returning_to_china: "The $expedition_name_treasure_voyage$ has run out of gifts and will no longer call at foreign ports for the rest of the voyage"

 show_current_chinese_expedition_amount: "[COUNTRY.MakeScope.GetVariable('chinese_expedition_opinion').GetValue]"
 change_amount_of_treasure_voyage_tt: "The amount of cargo carried by the $expedition_name_treasure_voyage$ is increased by $VALUE|+$"
 change_amount_of_treasure_voyage_tt_neg: "The amount of cargo carried by the $expedition_name_treasure_voyage$ is decreased by $VALUE|-$"
 change_opinion_of_expedition: "The $chinese_expedition_opinion$ towards us is increased by $VALUE|0Y$. (Currently $show_current_chinese_expedition_amount$)"
 change_opinion_of_expedition_neg: "The $chinese_expedition_opinion$ towards us is decreased by $VALUE|0Y$. (Currently $show_current_chinese_expedition_amount$)"
 give_gold_to_expedition: "$VALUE|2Y$ will be gifted to the $expedition_name_treasure_voyage$."
 chi_gift_received_count: "We have received [ROOT.GetVariable('gifts_received').GetValue|2+=] in [gold|e] which is converted into:"

 treasure_fleet_events.23.title: "Treasure Fleet Caught in a Storm"
 treasure_fleet_events.23.desc: "During their voyage, our most grand treasure fleet has encountered a most troubling foe during their sail: none other than the powerful forces of nature in the form of a massive storm that has taken our most experienced sailors by surprise. Numerous ships were lost during this calamity, losing many of our gifts and goods in the process."
 treasure_fleet_events.23.a: "[ROOT.GetCountry.Custom('common_string_nothing_we_can_do')]"
 treasure_fleet_events.23.a.entry: "$common_string_nothing_we_can_do_about_it$"
 
 treasure_fleet_events.24.title: "Clash with a Pirate Fleet"
 treasure_fleet_events.24.desc: "While sailing through the [target_location.GetTopography.GetName] of [target_location.GetName], our glorious $expedition_name_treasure_voyage$ under the watchful eye of $expedition_leader_name$ has encountered a vile fleet of rowdy pirates. Our brave soldiers would not, of course, cower in fear, and promptly engaged the enemy in a decisive battle where the enemy ruffians were utterly defeated and their leaders captured. However, such an engagement was not without losses in manpower and ships, depriving our grand fleet of many resources."
 treasure_fleet_events.24.a: "This will earn us some appreciation."

 treasure_fleet_events.25.title: "A Distant Sail"
 treasure_fleet_events.25.desc: "Lookouts hail a sail on the horizon: a merchant fleet, richly laden, plying the same waters as our own. $expedition_leader_name$ orders our captains to greet them in peace, and a brisk exchange follows: bolts of [ShowGoodsName('silk')] and fine [ShowGoodsName('porcelain')] traded for spices, gemstones, and rarities of the southern seas.\n\nThe holds of the $expedition_name_treasure_voyage$ ride heavier than before."
 treasure_fleet_events.25.a: "A fair wind and a fair bargain."

 treasure_fleet_events.30.title: "A Banquet at Court"
 treasure_fleet_events.30.desc: "While the fleet lies at anchor off [target_stop.GetName], the local court hosts a great banquet in honor of the $expedition_name_treasure_voyage$. Musicians, dancers, and dishes of a hundred kinds are laid before $expedition_leader_name$ and the captains, who present the customary gifts and speak of the greatness of the [GetInternationalOrganization('middle_kingdom').GetName].\n\nWord of the fleet's splendid conduct abroad will surely reach home."
 treasure_fleet_events.30.a: "Let them witness our splendor."

 treasure_fleet_events.31.title: "Curios for the [ROOT.GetCountry.GetGovernment.GetRulerTitle]"
 treasure_fleet_events.31.desc: "The markets of [target_stop.GetName] overflow with wonders unknown in our lands: caged birds of impossible color, strange beasts, aromatic woods, and jewels cut in foreign fashion. The merchants of the $expedition_name_treasure_voyage$ could fill a hold with curiosities fit to delight the [ROOT.GetCountry.GetGovernment.GetRulerTitle], though it would mean parting with a portion of the gold set aside for gifts.\n\nShall we open the coffers?"
 treasure_fleet_events.31.a: "Buy the finest the market offers."
 treasure_fleet_events.31.b: "Our gold is better kept for tribute."

 treasure_fleet_events.26.title: "A Test of Command"
 treasure_fleet_events.26.desc: "Open water and an uncertain chart set the officers of the $expedition_name_treasure_voyage$ to quarreling. Some urge $expedition_leader_name$ to hold a prudent course; others press for a swifter, riskier passage. All eyes turn to the admiral, and how $expedition_leader_name_herhis$ command is exercised now will long be remembered."
 treasure_fleet_events.26.a: "Hold a prudent and orderly course."
 treasure_fleet_events.26.b: "Dare the swifter passage."

 treasure_fleet_events.27.title: "A Wonder of the Deep"
 treasure_fleet_events.27.desc: "For a day and a night, the fleet sails in company with a creature of enormous size, its back breaking the waves like a moving island. The chroniclers of the $expedition_name_treasure_voyage$ fill their scrolls with the sight, and the sailors take it for a most auspicious sign. Tales of the wonder will be told in every teahouse when the fleet comes home."
 treasure_fleet_events.27.a: "A marvel to astound the court."

 treasure_fleet_events.28.title: "An Omen in the Heavens"
 treasure_fleet_events.28.desc: "The fleet's astronomers mark a strange light crossing the night sky and pore over their charts to divine its meaning. Whatever its true nature, the sailors read the heavens as a message from on high, and a solemn hush settles over the decks of the $expedition_name_treasure_voyage$."
 treasure_fleet_events.28.a: "Heed what the heavens portend."

 treasure_fleet_events.29.title: "Becalmed"
 treasure_fleet_events.29.desc: "The wind dies away to nothing, and the great ships of the $expedition_name_treasure_voyage$ sit motionless upon a glassy sea. Day after day the sails hang slack, and $expedition_leader_name$ and the officers can do little but wait and watch the horizon for any breath of wind. The voyage will be the longer for it."
 treasure_fleet_events.29.a: "Wait for the wind to return."

 treasure_fleet_events.32.title: "Fire on the Docks"
 treasure_fleet_events.32.desc: "A fire breaks out among the crowded warehouses of [target_stop.GetName], where a portion of the fleet's goods lay in storage. The sailors of the $expedition_name_treasure_voyage$ join the bucket lines, but not before the flames claim crates of [ShowGoodsName('silk')] and [ShowGoodsName('porcelain')] set aside as gifts."
 treasure_fleet_events.32.a: "A costly night's work."

 treasure_fleet_events.33.title: "A Local Pilot"
 treasure_fleet_events.33.desc: "A weathered mariner of [target_stop.GetName], versed in the reefs and currents of these waters, offers to guide the $expedition_name_treasure_voyage$ on the passage ahead. $expedition_leader_name$ weighs whether to trust the fleet's course to a foreign hand."
 treasure_fleet_events.33.a: "Welcome his knowledge aboard."
 treasure_fleet_events.33.b: "Our own navigators suffice."

 treasure_fleet_events.34.title: "A Gift for the Admiral"
 treasure_fleet_events.34.desc: "As the fleet prepares to weigh anchor at [target_stop.GetName], the local court presents $expedition_leader_name$ with a parting gift of rare worth, a token of esteem for the [GetInternationalOrganization('middle_kingdom').GetName] to carry home to the [ROOT.GetCountry.GetGovernment.GetRulerTitle]."
 treasure_fleet_events.34.a: "A worthy addition to the tribute."

 treasure_fleet_events.35.title: "Seeking an Interpreter"
 treasure_fleet_events.35.desc: "So far from home, the $expedition_name_chinese_expedition$'s representatives are finding it quite difficult to efficiently converse with us and still, they aim to sail further, soon to meet with people of many cultures that they have never interacted with before. In order to continue their voyage, they have requested us to provide a local interpreter who could serve as a translator for them."
 treasure_fleet_events.35.a: "Find an interpreter right now!"
 treasure_fleet_events.35.b: "It is their problem, not ours."

 treasure_fleet_events.36.title: "Sharing Maps"
 treasure_fleet_events.36.desc: "The $expedition_name_treasure_voyage$ has requested us to share our maps of the local waterways with them. We are under no obligation to do so, but fulfilling their request would be seen as a gesture of goodwill and would be greatly appreciated by $expedition_leader_name$ and other [ShowCultureGroupName('chinese_group')] elites currently stationed in $expedition_location_name$."
 treasure_fleet_events.36.a: "Share what we have."
 treasure_fleet_events.36.b: "We have no such maps to share."

 treasure_fleet_events.37.title: "Exploitative Costs"
 treasure_fleet_events.37.desc: "Owing to the unfamiliarity of the $expedition_name_treasure_voyage$'s sailors, the local [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] have set up markets in the vicinity of the haven of $expedition_location_name$. Those markets offer the visitors local goods at a price, and therein lies the problem, for the more avaricious of our merchants have decided to use the sailors' desperation to raise the prices to exorbitant amounts. The prices have gone up so high in some places that an armed fight has broken out on the street, causing unrest in the [fleet_loc.GetRank.GetName]."
 treasure_fleet_events.37.a: "Punish the [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')]!"
 treasure_fleet_events.37.a.entry: "Punish the $burghers_estate$!"
 treasure_fleet_events.37.b: "Hold the sailors accountable."

 treasure_fleet_events.38.title: "Perceived Humiliation"
 treasure_fleet_events.38.desc: "Our [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] are severely upset with the attention we have given to the $expedition_name_treasure_voyage$. They view the [ShowCultureGroupName('chinese_group')] as arrogant invaders who deserve none of the hospitality or privileges that we have given them during their stay. The [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] demand, therefore, that we revoke some of the privileges and show them that they are not on their land."
 treasure_fleet_events.38.a: "Follow the requests of the [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]."
 treasure_fleet_events.38.a.entry: "Follow the requests of the $nobles_estate$."
 treasure_fleet_events.38.b: "We cannot risk upsetting the [ShowCultureGroupNameWithNoTooltip('chinese_group')]."

 treasure_fleet_events.39.title: "A Religious Faux Pas"
 treasure_fleet_events.39.desc: "The $expedition_name_chinese_expedition$ sailors, so unaccustomed with our [ROOT.GetCountry.GetReligion.GetAdjective] ways, have committed a sacrilegious act against our faith. This has sparked outrage amongst the [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')], who are calling for the leader of the expedition, $expedition_leader_name$, to step up and apologize for such discourtesy."
 treasure_fleet_events.39.a: "Demand an apology from $expedition_leader_name_tooltipless$."
 treasure_fleet_events.39.b: "Let this faux pas slide."

 treasure_fleet_events.40.title: "Demand of Extradition"
 treasure_fleet_events.40.desc: "The $expedition_name_treasure_voyage$ has identified one of our courtiers, [target_escapee.GetName], as a renegade escapee from [expedition_initiator.GetName]. The [ShowCultureGroupName('chinese_group')] voyage elites, headed by $expedition_leader_name$, demand that the [target_escapee.GetShortNameWithNoTooltip] is handed over to them and extradited back to the [GetInternationalOrganization('middle_kingdom').GetName], where [target_escapee.GetSheHe] can be tried."
 treasure_fleet_events.40.a: "Fulfill their request."
 treasure_fleet_events.40.b: "Preposterous demand!"

 treasure_fleet_events.41.title: "Joint Army Drills"
 treasure_fleet_events.41.desc: "During their extended stay, $expedition_leader_name$, the leader of the $expedition_name_chinese_expedition$, has offered for their forces and ours to partake in joint military exercises. Such drills could benefit both sides and would signify deep trust between the two parties. That being said, there might be some inherent risk in exercising with foreign soldiers and we must still tread carefully. The closest stationed army to $expedition_location_name$, [target_unit.GetName], would be the forces to jointly train with the [ShowCultureGroupNameWithNoTooltip('chinese_group')]."
 treasure_fleet_events.41.a: "Accept this proposal."
 treasure_fleet_events.41.b: "We can always refuse."

 treasure_fleet_events.42.title: "Offer of [ShowCultureGroupNameWithNoTooltip('chinese_group')] Help"
 treasure_fleet_events.42.desc: "When the [ShowCultureGroupNameWithNoTooltip('chinese_group')] $expedition_name_treasure_voyage$ arrived in $expedition_location_name$, they were not expecting to see the [ROOT.GetCountry.GetLongName] in the midst of a bloody war, and yet here they are. That being said, the [expedition_initiator.GetLongName] does not hold our war enemies in high regard and would, therefore, be willing to aid us in our conflict."
 treasure_fleet_events.42.a: "We will accept any help we can get."
 treasure_fleet_events.42.b: "It is our fight, not theirs."

 treasure_fleet_events.43.title: "[ShowCultureGroupNameWithNoTooltip('chinese_group')] Treasure Voyagers Aid [from.GetNameWithNoTooltip]"
 treasure_fleet_events.43.desc: "Our spies inform us of a sizeable $expedition_name_treasure_voyage$ led by $expedition_leader_name$ initiated by the [expedition_initiator.GetLongName]. Having arrived in the enemy port of $expedition_location_name$, they have decided to get their hands dirty and to support our foe [from.GetName] in their war against us!"
 treasure_fleet_events.43.a: "We will never forgive the [ShowCultureGroupNameWithNoTooltip('chinese_group')]!"

 treasure_fleet_events.44.title: "Request for Mosque Construction"
 treasure_fleet_events.44.desc: "The leader of the $expedition_name_chinese_expedition$, a certain sailor named $expedition_leader_name$, is also a devout follower of [target_religion.GetName]. With many of $expedition_leader_name_herhis$ fleet following the same faith, they requested permission to construct a Mosque to support the local [target_religion.GetAdjectiveWithNoTooltip] community."
 treasure_fleet_events.44.a: "Permit the construction."
 treasure_fleet_events.44.b: "Warn them against such trespasses."

 treasure_fleet_events.45.title: "[ShowCultureGroupNameWithNoTooltip('chinese_group')] Diaspora in $expedition_location_name_tooltipless$"
 treasure_fleet_events.45.desc: "Home to $expedition_location_name$ is a considerable [ShowCultureGroupName('chinese_group')] diaspora that has grown here over the course of many decades. Originally having arrived here as traders, the [ShowCultureGroupNameWithNoTooltip('chinese_group')] merchants took wives from local women and settled here, adapting to the new environment and fulfilling a crucial role in our society. Now, with the arrival of the $expedition_name_treasure_voyage$ of [expedition_initiator.GetName], $expedition_leader_name$ has decided to give support to that diaspora."
 treasure_fleet_events.45.a: "Encourage this."
 treasure_fleet_events.45.b: "Stop them!"

 treasure_fleet_events.46.title: "Soldiers Settle Down"
 treasure_fleet_events.46.desc: "A handful of soldiers from the $expedition_name_chinese_expedition$ have been discharged and allowed to settle down in $expedition_location_name$. They have taken on native wives and their connections might prove useful to us in the long term."
 treasure_fleet_events.46.a: "[ROOT.GetCountry.Custom('common_string_ok')]"
 treasure_fleet_events.46.a.entry: "$common_string_alright$"

 treasure_fleet_events.47.title: "Intervention from $expedition_name_treasure_voyage$"
 treasure_fleet_events.47.desc: "As the $expedition_name_chinese_expedition$ arrived at $expedition_location_name$, they found our [ROOT.GetCountry.GetFlavorRank] embroiled in a bloody civil war. Though such circumstances would usually ward off many visitors, $expedition_leader_name$ and $expedition_leader_name_herhis$ $expedition_name_treasure_voyage$ took a liking to the [ROOT.GetCountry.GetAdjective] cause, and are offering us military support in the name of the [GetInternationalOrganization('middle_kingdom').GetName]."
 treasure_fleet_events.47.a: "We will accept all the help we can get."
 treasure_fleet_events.47.b: "We do not need their help."

 treasure_fleet_events.48.title: "$treasure_fleet_events.47.title$"
 treasure_fleet_events.48.desc: "The vile $expedition_name_chinese_expedition$ has decided to pick a side in our [target_war.GetName]. And despite the wisdom of $expedition_leader_name$, their leader, they have made the wrong choice, opting to support [country_at_war_with.GetName] rather than helping [ROOT.GetCountry.GetName]. We will crush them on the battlefield."
 treasure_fleet_events.48.a: "We will not forget this!"

 treasure_fleet_events.49.title: "[ShowCultureGroupNameWithNoTooltip('chinese_group')] Contempt"
 treasure_fleet_events.49.desc: "The opinion between [ROOT.GetCountry.GetName] and our visitors, the $expedition_name_treasure_voyage$, has fallen to unprecedented levels. In recent days, there have been numerous clashes between our garrison and the foreign sailors, but nominally our visitors have still maintained relations, even if lukewarm. However, recent events have further deteriorated those ties and $expedition_leader_name$ has just denounced [ROOT.GetCountry.GetLongNameWithNoTooltip] and its values and the $expedition_name_chinese_expedition$ is preparing to leave $expedition_location_name$ before tensions escalate further."
 treasure_fleet_events.49.a: "We must repair our relations."
 treasure_fleet_events.49.b: "Good Riddance!"

 chinese_interregnum: "[THIS.GetCountry.GetName] will be placed under a [ShowCultureGroupName('chinese_group')] interregnum."

 treasure_fleet_events.50.title: "A Belligerent Request"
 treasure_fleet_events.50.desc: "The leader of the $expedition_name_treasure_voyage$ $expedition_leader_name_herselfhimself$, $expedition_leader_name$, has submitted a serious appeal to us, requesting a military intervention against [target_country.GetName]. From what we know, for one reason or another, the [target_country.GetAdjectiveWithNoTooltip] [target_country.GetFlavorRank] has become a target for the [ShowCultureGroupName('chinese_group')], and the expedition leaders are calling for us to execute Heaven's punishment on the defiant [target_country.GetGovernment.GetRulerTitle]."
 treasure_fleet_events.50.a: "We will follow their recommendation."
 treasure_fleet_events.50.b: "They cannot expect us to do that."

 treasure_fleet_events.51.title: "Underwhelming Tribute Quality"
 treasure_fleet_events.51.desc: "Though they have not stated this publicly, we can tell that the elites of the $expedition_name_treasure_voyage$ are not content with the quality of our gifts. We suspected this back during their audience with the [ROOT.GetCountry.GetGovernment.GetRulerTitle], but the reports of our spies who have overheard their conversations have confirmed it."
 treasure_fleet_events.51.a: "Compensate them."
 treasure_fleet_events.51.b: "We will not do anything unless they confront us about it."

 treasure_fleet_events.52.title: "Scandal at the [ROOT.GetCountry.GetGovernment.GetCourtTitle]"
 treasure_fleet_events.52.desc: "During an audience with the [ROOT.GetCountry.GetGovernment.GetRulerTitle], a member of the [ROOT.GetCountry.GetGovernment.GetCourtTitle] has uttered most despicable words about our [ShowCultureGroupName('chinese_group')] visitors, causing them great offense. Unless something is done, the $expedition_name_treasure_voyage$ might report this incident to the [expedition_initiator.GetGovernment.GetRulerTitle]."
 treasure_fleet_events.52.a: "Make a solemn apology."
 treasure_fleet_events.52.b: "Bestow them with gifts of apology."
 treasure_fleet_events.52.c: "Who are we to punish our own?"

 treasure_fleet_events.53.title: "Fine Treatment"
 treasure_fleet_events.53.desc: "The elites leading the $expedition_name_treasure_voyage$ are quite pleased with our hospitality and various privileges that we have bestowed upon them. Besides the obvious tribute exchange, we have permitted and aided them in repairing their ships. They may not be showing it directly, but we know that they are quite satisfied with the treatment."
 treasure_fleet_events.53.a: "Hospitality is the key!"
 treasure_fleet_events.53.b: "Do not let them get the wrong idea."

 treasure_fleet_events.54.title: "An Affront to Our Envoys"
 treasure_fleet_events.54.desc: "Word reaches the [ROOT.GetCountry.GetGovernment.GetCourtTitle] that at the court of [insulting_court.GetName], the envoys of the $expedition_name_treasure_voyage$ were met not with the deference owed the [GetInternationalOrganization('middle_kingdom').GetName], but with open scorn — and [insulting_court.GetGovernment.GetRulerTitle] let the insult stand.\n\n$expedition_leader_name$ awaits our word. Shall such contempt be answered, or is it beneath us to take notice?"
 treasure_fleet_events.54.a: "Such contempt shall not stand."
 treasure_fleet_events.54.b: "It is beneath us to take notice."
 treasure_fleet_events.54.a.tt: "Neighboring [nations|e] later visited by the $expedition_name_treasure_voyage$ will be given a chance to declare [war|e] on [insulting_court.GetName] with our support"

 treasure_fleet_events.55.title: "Entangled Abroad"
 treasure_fleet_events.55.desc: "Dispatches from the [ROOT.GetCountry.GetGovernment.GetCourtTitle] carry unexpected news. Far from home, $expedition_leader_name$ has thrown the arms and treasure of the $expedition_name_treasure_voyage$ behind the ruler of [country_at_war_with.GetName], a realm now torn by a war of succession.\n\nSome at [ROOT.GetCountry.GetGovernment.GetCourtTitle] marvel at how far the reach of the [GetInternationalOrganization('middle_kingdom').GetName] now extends. Others mutter that the quarrels of distant realms are no fit business of ours."
 treasure_fleet_events.55.a: "Let the world see how far our reach extends."
 treasure_fleet_events.55.b: "Distant wars are not our concern."

 treasure_fleet_events.56.title: "A Sword Unsheathed Abroad"
 treasure_fleet_events.56.desc: "Word comes from the $expedition_name_treasure_voyage$ that $expedition_leader_name$ has lent imperial soldiers to a host court's war. [target_country.GetName], who found our men arrayed against them, now number the [GetInternationalOrganization('middle_kingdom').GetName] among their foes.\n\nThe [ROOT.GetCountry.GetGovernment.GetCourtTitle] is divided. To some it is proof that the reach of the throne now extends even to the far side of the world. To others it is a needless enemy earned in a war that was never ours."
 treasure_fleet_events.56.a: "Let them learn to fear our reach."
 treasure_fleet_events.56.b: "Such enmity serves us poorly so far from home."

 treasure_fleet_events.57.title: "Rebuffed in Contempt"
 treasure_fleet_events.57.desc: "Grave news reaches the [ROOT.GetCountry.GetGovernment.GetCourtTitle]. At the court of [contemptuous_court.GetName], the envoys of the $expedition_name_treasure_voyage$ were met with such open contempt that $expedition_leader_name$ weighed anchor and quit their waters, the customary courtesies flung back in our faces.\n\nThe fleet's chronicler has entered [contemptuous_court.GetNameWithNoTooltip] in its ledger of those who have wronged the [GetInternationalOrganization('middle_kingdom').GetName]. Shall the affront be remembered, or forgiven?"
 treasure_fleet_events.57.a: "The affront will be remembered."
 treasure_fleet_events.57.b: "It is beneath us to bear such a grudge."
 treasure_fleet_events.57.a.tt: "A neighboring court later visited by the $expedition_name_treasure_voyage$ may be called upon to declare [war|e] on [contemptuous_court.GetName]"

 treasure_fleet_events.58.title: "The Insult Avenged"
 treasure_fleet_events.58.desc: "Word of triumph reaches the [ROOT.GetCountry.GetGovernment.GetCourtTitle]. Stirred by the presence of the $expedition_name_treasure_voyage$, the court of [avenging_court.GetName] has taken up arms against [target_country.GetName], the very realm that once held our envoys in contempt.\n\nHeaven's displeasure, it seems, needs no imperial army to make itself felt. The reach of the [GetInternationalOrganization('middle_kingdom').GetName] carries even into the wars of distant kings."
 treasure_fleet_events.58.a: "Let all who scorn us take heed."

 treasure_fleet_events.59.title: "Kin Across the Seas"
 treasure_fleet_events.59.desc: "Reports reach the [ROOT.GetCountry.GetGovernment.GetCourtTitle] of a flourishing community of our countrymen in far-off [diaspora_port.GetName]. Merchants and sailors who settled there generations ago have taken local wives and prospered, and now $expedition_leader_name$ has extended the hand of the $expedition_name_treasure_voyage$ to these distant kin.\n\nSome at [ROOT.GetCountry.GetGovernment.GetCourtTitle] swell with pride that the blood of the [GetInternationalOrganization('middle_kingdom').GetName] runs in every port of the southern seas. Others frown upon subjects who would make their home so far from the graves of their ancestors."
 treasure_fleet_events.59.a: "Let our kin abroad carry our name with pride."
 treasure_fleet_events.59.b: "Their place is at home, among their ancestors."

 treasure_fleet_events.60.title: "An Envoy's Misstep"
 treasure_fleet_events.60.desc: "Word reaches the [ROOT.GetCountry.GetGovernment.GetCourtTitle] of an unhappy incident at the court of [offended_court.GetName]. $expedition_leader_name$, unversed in the rites of a foreign faith, has given grave offense, and the [offended_court.GetGovernment.GetRulerTitle] now demands that our envoy make amends.\n\nThe [ROOT.GetCountry.GetGovernment.GetCourtTitle] is of two minds. Some hold that the envoys of the [GetInternationalOrganization('middle_kingdom').GetName] owe no deference to foreign altars. Others fear that such carelessness sullies our name in every port yet to come."
 treasure_fleet_events.60.a: "Our envoys answer to no foreign altar."
 treasure_fleet_events.60.b: "The admiral shall make amends."
