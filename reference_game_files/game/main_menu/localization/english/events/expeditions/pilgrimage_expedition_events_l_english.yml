l_english:
 pilgrimage_expedition_events.1.title: "[current_location.GetNameWithNoTooltip], the Holy City"
 pilgrimage_expedition_events.1.desc: "After months of weary travel, [target_ruler.GetName] stands at last before the walls of [current_location.GetName], city of the Crucifixion, city of the Resurrection, the holiest ground in all of Christendom. The dust of a thousand pilgrims hangs in the air, mingling with incense drifting from a hundred chapels.\n\nAt the center of it all stands the Church of the Holy Sepulchre, built over the very rock of Golgotha. [target_ruler.GetSheHe|U] has journeyed far for this moment. The long road, the blistered feet, the sleepless nights, all of it falls away as the great doors swing open and the smell of holy oil and old stone rushes out to meet [target_ruler.GetHimHer]."
 pilgrimage_expedition_events.1.a: "Prostrate ourselves before the Holy Sepulchre."
 pilgrimage_expedition_events.1.b: "Commission a chapel in the name of [ROOT.GetCountry.GetNameWithNoTooltip]."
 pilgrimage_expedition_events.1.historical_info: "Jerusalem has drawn Christian pilgrims since the 4th century, when the Emperor Constantine commissioned the Church of the Holy Sepulchre on the site of Christ's burial and resurrection. The city changed hands repeatedly during the Crusades, captured by the First Crusade in 1099, lost to Saladin in 1187, and briefly recovered by treaty under Frederick II in 1229 before falling permanently to Mamluk control. Despite the loss of Christian rule, the holy sites remained accessible to pilgrims through diplomatic arrangement, making Jerusalem the supreme destination of Catholic devotion throughout the medieval world."

 pilgrimage_expedition_events.2.title: "The Eternal City"
 pilgrimage_expedition_events.2.desc: "[current_location.GetName] rises slowly out of the plain, its domes and towers catching the afternoon light as [target_ruler.GetName]'s retinue crosses the last bridge over the Tiber. The [current_location.GetRank.GetName] is vast and ancient, its streets crowded with pilgrims from every corner of Christendom, each drawn by the same invisible current.\n\nAt the summit of the Vatican hill, Saint Peter's rises against the sky. Here is the throne of the Vicar of Christ, the living authority of the Church on earth. [target_ruler.GetNameWithNoTooltip] is in awe of being at the center of [ShowReligionAdjective('catholic')] spirituality."
 pilgrimage_expedition_events.2.a: "Humbly recognize the divine authority."
 pilgrimage_expedition_events.2.b: "Make a donation worthy of our [ROOT.GetCountry.GetGovernment.GetRulerTitle]."
 pilgrimage_expedition_events.2.c: "We have paid our respects. Our people need us home."
 pilgrimage_expedition_events.2.d: "$pilgrimage_resupply_light$"
 pilgrimage_expedition_events.2.e: "$pilgrimage_resupply_heavy$"
 pilgrimage_expedition_events.2.historical_info: "Rome became the seat of Christian authority from the earliest centuries of the Church, owing to the martyrdom of the Apostle Peter, whose tomb lies beneath the great basilica that bears his name. The papacy developed into a temporal as well as spiritual power, drawing rulers and pilgrims from across Europe who sought absolution, legitimacy, and the blessing of the successor of Peter. The Jubilee Years, beginning in 1300 under Pope Boniface VIII, drew hundreds of thousands of pilgrims and cemented Rome's place as the foremost destination of Catholic pilgrimage."

 pilgrimage_expedition_events.3.title: "The Camino's End"
 pilgrimage_expedition_events.3.desc: "The last miles of the #italic Camino de Santiago#! are the most crowded. From every road and every valley, streams of pilgrims converge on the great cathedral at [current_location.GetName], their staffs worn smooth, their cloaks caked with the dust of five hundred leagues. Some weep. Some have walked barefoot for a hundred miles.\n\n[target_ruler.GetName] rides at the head of [target_ruler.GetHerHis] retinue, but dismounts as the cathedral towers come into view. It seems right to walk the last stretch. A great roar of the pilgrims' hymn rises on the wind, #italic Ultreia! Ultreia!#!, and the stones of the road seem to ring with it."
 pilgrimage_expedition_events.3.a: "Give thanks at the tomb of Saint James."
 pilgrimage_expedition_events.3.b: "Proclaim it a sign of God's favor upon our reign."
 pilgrimage_expedition_events.3.c: "A profound day. But there is still our [ROOT.GetCountry.GetFlavorRank] to govern."
 pilgrimage_expedition_events.3.d: "$pilgrimage_resupply_light$"
 pilgrimage_expedition_events.3.e: "$pilgrimage_resupply_heavy$"
 pilgrimage_expedition_events.3.historical_info: "The cult of Saint James the Apostle at Santiago de Compostela emerged in the 9th century, when relics identified as those of James were discovered in Galicia and enshrined by King Alfonso II of Asturias. The resulting pilgrimage route, the #italic Camino de Santiago#!, became one of the three great pilgrimages of medieval Christendom alongside Rome and Jerusalem. By the 12th century the road was lined with hospitals, monasteries, and churches, and pilgrims from every European nation walked it. Reaching Santiago entitled the pilgrim to a Compostela certificate and a plenary indulgence."

 pilgrimage_expedition_events.4.title: "The Shrine of the Three Kings"
 pilgrimage_expedition_events.4.desc: "[current_location.GetName] is a [current_location.GetRank.GetName] of cranes and scaffolding. The great cathedral has been under construction for nearly two centuries, its unfinished towers climbing higher each year toward a completion that will not come for generations still unborn. Yet even incomplete, the building is vast beyond measure, the largest in the world, men say.\n\nWithin the south transept, behind an altar ablaze with gold leaf and candlelight, stands the Shrine of the Three Kings: a golden reliquary containing the bones of the Magi who followed the star to Bethlehem. [target_ruler.GetName] has heard of it since childhood. Nothing quite prepares [target_ruler.GetHimHer] for this."
 pilgrimage_expedition_events.4.a: "Kneel and venerate the Shrine of the Three Kings."
 pilgrimage_expedition_events.4.b: "Make a generous donation to the cathedral's construction."
 pilgrimage_expedition_events.4.c: "We shall pray, and then be on our way."
 pilgrimage_expedition_events.4.d: "$pilgrimage_resupply_light$"
 pilgrimage_expedition_events.4.e: "$pilgrimage_resupply_heavy$"
 pilgrimage_expedition_events.4.historical_info: "The Shrine of the Three Kings in Cologne is the largest reliquary in the Western world and the reported resting place of the bones of the Biblical Magi. The relics were acquired by Holy Roman Emperor Frederick Barbarossa following the conquest of Milan in 1164 and donated to Cologne's Archbishop Rainald of Dassel. Their arrival transformed Cologne into one of the most important pilgrimage destinations in northern Europe and prompted the construction of the great Gothic cathedral begun in 1248, a project that would not be completed until 1880. The Magi's connection to kingship and the Epiphany made their cult particularly resonant for secular rulers seeking divine endorsement."

 pilgrimage_expedition_events.5.title: "Our Lady of [current_location.GetNameWithNoTooltip]"
 pilgrimage_expedition_events.5.desc: "They say the windows of [current_location.GetName] cannot be described, only seen. [target_ruler.GetName] stands in the nave and understands why. The cathedral is filled with blue light, light that has passed through a thousand panes of colored glass and been transformed into something no longer quite earthly. It falls on the stone floor in shifting pools, on the faces of the kneeling pilgrims, on the ancient relic in its golden case behind the high altar.\n\nThe #italic Sancta Camisa#!, the veil of the Virgin Mary, said to have been worn at the Annunciation, has drawn the faithful here since Charlemagne. [target_ruler.GetNameWithNoTooltip] stands very still and is unexpectedly moved."
 pilgrimage_expedition_events.5.a: "Venerate the #italic Sancta Camisa#! and pray to Our Lady."
 pilgrimage_expedition_events.5.b: "The beauty of this place deserves contemplation."
 pilgrimage_expedition_events.5.c: "A beautiful cathedral. Our people need us home."
 pilgrimage_expedition_events.5.d: "$pilgrimage_resupply_light$"
 pilgrimage_expedition_events.5.e: "$pilgrimage_resupply_heavy$"
 pilgrimage_expedition_events.5.historical_info: "The Cathedral of Notre-Dame de Chartres is one of the finest examples of French Gothic architecture and has been a pilgrimage site since the early Middle Ages. Its principal relic, the #italic Sancta Camisa#!, a length of cloth believed to be the tunic worn by the Virgin Mary at the Annunciation, was donated to the cathedral by Charlemagne and survived a disastrous fire in 1194 that destroyed the earlier Romanesque structure. The cathedral was rebuilt around the relic with extraordinary speed, and its west rose window and lancet windows, dating from around 1220, are among the most celebrated medieval stained glass in the world. The #italic Sancta Camisa#! made Chartres one of the premier Marian pilgrimage sites in Europe."

 pilgrimage_expedition_events.6.title: "The Martyr's Shrine"
 pilgrimage_expedition_events.6.desc: "[current_location.GetName] sits in a shallow valley in the green [ShowCultureName('english')] countryside, and its cathedral towers can be seen for miles before the traveler arrives. The [current_location.GetRank.GetName] is thick with pilgrims; hostels overflow into barns and courtyards, and the roads are packed with people speaking a dozen languages, all making their way to the same place.\n\nThe Shrine of Saint Thomas Becket is in the Trinity Chapel behind the high altar. It was once the most lavishly adorned shrine in [ShowScriptedGeographyName('england_geography')]: jewels, gold, votive offerings of every kind. [target_ruler.GetName] pauses before it. Here a man was struck down for defying a king. Here that same defiance became sanctity. There is something instructive in that, one way or another."
 pilgrimage_expedition_events.6.a: "Light a candle and pray at Becket's shrine."
 pilgrimage_expedition_events.6.b: "Commission a Mass for the souls of the faithful."
 pilgrimage_expedition_events.6.c: "The saint has had enough rulers paying homage. We go home."
 pilgrimage_expedition_events.6.d: "$pilgrimage_resupply_light$"
 pilgrimage_expedition_events.6.e: "$pilgrimage_resupply_heavy$"
 pilgrimage_expedition_events.6.historical_info: "Thomas Becket, Archbishop of Canterbury, was murdered in his own cathedral by knights acting on the implied wishes of King Henry II of England on 29 December 1170. His death shocked Christendom and he was canonized barely three years later, in 1173. Henry II was forced to do public penance at Becket's tomb and Becket's shrine quickly became the most visited pilgrimage site in England, immortalized in Geoffrey Chaucer's #italic The Canterbury Tales#!. The shrine was adorned with an extraordinary collection of jewels and gold donated over two centuries, including the Regale of France, a great ruby given by King Louis VII. Henry VIII ordered the shrine destroyed and its treasures confiscated in 1538."

 pilgrimage_expedition_events.7.title: "Saint Patrick's See"
 pilgrimage_expedition_events.7.desc: "[current_location.GetName] sits on a low hill in the north of [ShowRegionName('ireland_region')], its twin cathedrals visible from the surrounding farmland. It is not a grand city — not [ShowLocationName('rome')], not [ShowLocationName('jerusalem')] — but it wears its antiquity with quiet authority. This is the oldest [ShowReligionGroupAdjective('christian')] community in [ShowRegionNameWithNoTooltip('ireland_region')], the see established by Saint Patrick himself when he came to convert the island.\n\n[target_ruler.GetName] arrives in the early morning, when mist still clings to the hills. A canon of the cathedral meets [target_ruler.GetHimHer] at the gate and leads [target_ruler.GetHimHer] to the site where Patrick is said to have prayed. The humility of the place is unexpected and somehow appropriate."
 pilgrimage_expedition_events.7.a: "Attend Mass at Saint Patrick's Cathedral."
 pilgrimage_expedition_events.7.b: "Leave an offering at Saint Patrick's shrine."
 pilgrimage_expedition_events.7.c: "A visit made with reverence. It is time to return."
 pilgrimage_expedition_events.7.d: "$pilgrimage_resupply_light$"
 pilgrimage_expedition_events.7.e: "$pilgrimage_resupply_heavy$"
 pilgrimage_expedition_events.7.historical_info: "Armagh is traditionally regarded as the ecclesiastical capital of Ireland, a status it claims from its association with Saint Patrick, who is said to have established his principal church there around 445 AD. The see of Armagh became the primatial seat of the Irish Church, a position contested between the Catholic and Protestant cathedrals that still stand on the two hills of the city. As the Reformation approached, Armagh's importance lay as much in its symbolic weight — the church of the apostle who converted Ireland — as in its political power, making it a destination for rulers seeking to demonstrate piety or solidarity with the Irish Church."

 pilgrimage_expedition_events.8.title: "A Shrine Along the Way"
 pilgrimage_expedition_events.8.desc: "[target_ruler.GetName] arrives at [current_location.GetName], another waystation on the long road of devotion. Whatever relic or memory of sanctity first drew pilgrims here, it has drawn them still, generation after generation, long after most who pass this way have forgotten the particulars.\n\n[target_ruler.GetSheHe|U] pauses among the other travelers, weary and dust-covered like [target_ruler.GetHerHis] own retinue, and gives thanks for safe passage this far."
 pilgrimage_expedition_events.8.a: "Give thanks for safe passage."
 pilgrimage_expedition_events.8.b: "Leave an offering for the pilgrims who follow."
 pilgrimage_expedition_events.8.c: "This holy place lies behind us. Time to turn toward home."
 pilgrimage_expedition_events.8.d: "$pilgrimage_resupply_light$"
 pilgrimage_expedition_events.8.e: "$pilgrimage_resupply_heavy$"

 pilgrimage_expedition_events.9.title: "The Pilgrimage Ends in Sorrow"
 pilgrimage_expedition_events.9.desc: "[target_leader.GetName] has died upon the road, and the pilgrimage now goes unfinished. Word of the loss will reach [ROOT.GetCountry.GetName] slowly, carried home by the retainers who remained at [target_leader.GetHerHis] side to the last."
 pilgrimage_expedition_events.9.a: "We shall mourn our loss."

 pilgrimage_expedition_events.17.title: "The Pilgrimage Abandoned"
 pilgrimage_expedition_events.17.desc: "[target_leader.GetName] turns homeward with the vow unkept, the pilgrimage abandoned somewhere short of its end. Word of the broken vow reaches [ROOT.GetCountry.GetName] before [target_leader.GetHimHer] does, and the [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] will remember it long after the [ROOT.GetCountry.GetGovernment.GetCourtTitle] has moved on."
 pilgrimage_expedition_events.17.a: "We return in shame, our vow to God unfulfilled."

 pilgrimage_expedition_events.10.title: "The Poor Man of Assisi"
 pilgrimage_expedition_events.10.desc: "[target_ruler.GetName] climbs the last slope into [current_location.GetName], and the great basilica rises before [target_ruler.GetHimHer] in two tiers of pale stone, built into the hillside itself and raised with startling speed after the death of the man it honors — a beggar who owned nothing and who now commands one of the most magnificent churches in Italy.\n\nInside the lower church, in a crypt cut from the living rock, lies Francis of Assisi himself. [target_ruler.GetSheHe|U] kneels before the tomb of a man who renounced silk and gold for a rope belt and bare feet, and who is said to have preached to birds and tamed a wolf. The contradiction between the saint's poverty and the splendor raised in his memory is not lost on [target_ruler.GetHimHer]."
 pilgrimage_expedition_events.10.a: "Kneel humbly, as Francis himself would have."
 pilgrimage_expedition_events.10.b: "Give alms to the poor outside, in the saint's own spirit."
 pilgrimage_expedition_events.10.c: "We have paid our respects. It is time to go back."
 pilgrimage_expedition_events.10.d: "$pilgrimage_resupply_light$"
 pilgrimage_expedition_events.10.e: "$pilgrimage_resupply_heavy$"
 pilgrimage_expedition_events.10.historical_info: "Francis of Assisi (1181/2-1226) renounced his family's wealth to live in poverty, founding the Franciscan Order on principles of humility, itinerant preaching, and service to the poor and sick. He was canonized by Pope Gregory IX in 1228, only two years after his death, one of the fastest canonizations in medieval history. Construction of the Basilica di San Francesco began that same year and was largely complete by 1253, its lower and upper churches later adorned with frescoes attributed to Cimabue and Giotto. Despite the saint's own rejection of material wealth, Assisi became one of the great pilgrimage destinations of Catholic Europe, drawing rulers and common pilgrims alike."

 pilgrimage_expedition_events.11.title: "The Sailors' Saint"
 pilgrimage_expedition_events.11.desc: "[current_location.GetName] smells of the sea long before [target_ruler.GetName] reaches its walls, a port [current_location.GetRank.GetName] built around a single great treasure. Beneath the basilica's Romanesque arches lies the tomb of Nicholas of Myra, brought here by local sailors more than a hundred years past, taken from the crumbling churches of a Christian East no longer able to protect them.\n\nOnce a year, the tomb is opened and a clear liquid is drawn from around the saint's bones, the #italic manna#! that the faithful, [ShowReligionAdjective('catholic')] and [ShowReligionAdjective('orthodox')] alike, believe carries the power to heal. [target_ruler.GetName] is shown a vial of it, and is struck by the thought that no other shrine on this pilgrimage is venerated so completely by both branches of Christendom at once."
 pilgrimage_expedition_events.11.a: "Venerate the tomb and receive a vial of the manna."
 pilgrimage_expedition_events.11.b: "Commission a Mass for sailors who brought the saint home."
 pilgrimage_expedition_events.11.c: "The saint has blessed us. Now we return home."
 pilgrimage_expedition_events.11.d: "$pilgrimage_resupply_light$"
 pilgrimage_expedition_events.11.e: "$pilgrimage_resupply_heavy$"
 pilgrimage_expedition_events.11.historical_info: "In 1087, sixty-two sailors from Bari sailed to Myra in Lycia, then threatened by Seljuk conquest, and removed the bones of Saint Nicholas before they could be lost or destroyed. The relics reached Bari on 9 May 1087, still celebrated as the Feast of the Translation, and the Basilica di San Nicola was raised to house them, its crypt consecrated in the presence of Pope Urban II in 1089. Since the relics' arrival, a clear liquid the faithful call #italic manna#! has continued to form around the bones and is drawn off annually by the Archbishop of Bari. As patron of sailors, merchants, and children, and one of the few saints venerated with equal devotion in both the Catholic and Orthodox worlds, Nicholas made Bari a pilgrimage site unlike any other in Italy."

 pilgrimage_expedition_events.12.title: "The Angels' Consecration"
 pilgrimage_expedition_events.12.desc: "The Benedictine abbey at [current_location.GetName] sits at the edge of a dark forest in the [ShowCultureGroupName('swiss_group')] highlands, its black-robed monks descended from a single hermit murdered by robbers on this spot generations ago. [target_ruler.GetName] has heard the story since childhood: how the chapel here was not consecrated by any bishop, but by Christ himself, descending with a choir of angels and saints on the eve of its dedication.\n\nIn the Lady Chapel stands the object of that first, disputed consecration: a small statue of the Virgin, darkened by centuries of candle smoke to a deep black. Pilgrims from across the German-speaking lands kneel before her in an unbroken line stretching back further than [target_ruler.GetNameWithNoTooltip] can easily imagine."
 pilgrimage_expedition_events.12.a: "Kneel before the Black Madonna in silent devotion."
 pilgrimage_expedition_events.12.b: "Endow the abbey's renowned library and scriptorium."
 pilgrimage_expedition_events.12.c: "We have seen enough of these dark woods. Onward."
 pilgrimage_expedition_events.12.d: "$pilgrimage_resupply_light$"
 pilgrimage_expedition_events.12.e: "$pilgrimage_resupply_heavy$"
 pilgrimage_expedition_events.12.historical_info: "Einsiedeln traces its origins to the hermit Meinrad, who settled in this forest and was murdered by robbers in 861. A formal monastery was founded on the site in 934 under the monk Eberhard, and according to enduring legend, its chapel was miraculously consecrated by Christ himself on the night of 14 September 948, a claim later upheld by Pope Leo VIII. The abbey's Black Madonna has been an object of pilgrimage devotion for centuries, making Einsiedeln one of the most visited Marian shrines in the German-speaking world."

 pilgrimage_expedition_events.13.title: "The Bright Hill"
 pilgrimage_expedition_events.13.desc: "#italic Jasna Góra#!, the Bright Hill, rises above the plain long before [target_ruler.GetName] reaches the monastery gates, its white walls catching the light in a way the Pauline monks who built it surely intended. Within, behind a wall of votive silver and burning candles, hangs the dark-faced icon of the Virgin that has made this modest [ShowCultureGroupName('polish_group')] [current_location.GetRank.GetName] a destination for pilgrims from across the north.\n\n[target_ruler.GetName] looks closely at the Madonna's face and sees them: two parallel scars across her right cheek, old wounds that no restoration has ever fully erased. A raider's sword struck her once, long ago, and the monks who repainted her afterward found the cuts bleeding through the fresh paint, again and again, until they gave up trying to hide what had been done."
 pilgrimage_expedition_events.13.a: "Venerate the icon and its enduring wounds."
 pilgrimage_expedition_events.13.b: "Pledge gold for fortifications, so it stands unplundered."
 pilgrimage_expedition_events.13.c: "We have seen the Bright Hill. Let us go home."
 pilgrimage_expedition_events.13.d: "$pilgrimage_resupply_light$"
 pilgrimage_expedition_events.13.e: "$pilgrimage_resupply_heavy$"
 pilgrimage_expedition_events.13.historical_info: "The Pauline monastery of Jasna Góra was founded in 1382 by Duke Ladislaus of Opole, who brought with him an icon of the Virgin and Child in the Byzantine style, already venerated as miraculous. On Easter of 1430, a band of Hussite raiders from Bohemia, Moravia, and Silesia stormed the monastery, breaking the icon into pieces and slashing the Virgin's face twice with a saber. Restorers at the royal court of Władysław Jagiełło in Kraków repaired the panel, but the scars reappeared through every fresh layer of paint, and were eventually left as a permanent, deliberate feature of the image. Our Lady of Częstochowa became the preeminent Marian shrine of Poland, her scarred face copied onto icons across the region for centuries after."

 pilgrimage_expedition_events.14.title: "Saint Stephen's See"
 pilgrimage_expedition_events.14.desc: "[current_location.GetName] sits where the Danube bends, its cathedral hill overlooking the river that once marked the edge of Christian Europe. Here, in a chapel long since rebuilt and rebuilt again, Stephen of Hungary was born, baptized, and, on a winter's day at the turn of the millennium, crowned as the first Christian king of his people.\n\n[target_ruler.GetName] is received by the Archbishop of [current_location.GetNameWithNoTooltip], Primate of Hungary, successor to the see Stephen himself founded. The Archbishop speaks of the young king who chose baptism over the old gods, who built this church before he built his palace, and who was canonized within decades of his death, precisely because he had understood that a Christian crown must rest on a Christian church."
 pilgrimage_expedition_events.14.a: "Pay homage to Saint Stephen's legacy in silent prayer."
 pilgrimage_expedition_events.14.b: "Confer at length with the Archbishop-Primate of Hungary."
 pilgrimage_expedition_events.14.c: "A fitting visit for a Christian ruler. Time to depart."
 pilgrimage_expedition_events.14.d: "$pilgrimage_resupply_light$"
 pilgrimage_expedition_events.14.e: "$pilgrimage_resupply_heavy$"
 pilgrimage_expedition_events.14.historical_info: "Stephen I of Hungary was born around 975 in Esztergom, and was crowned there as Christmas approached in the year 1000, an event that marked the formal birth of the Christian Kingdom of Hungary. Stephen founded the Archbishopric of Esztergom in 1001, the oldest in the country, and its archbishops have held the rank of Primate of Hungary ever since. Esztergom served as the political and religious capital of the kingdom until the mid-13th century, and Stephen's own canonization in 1083 cemented the city's place as the spiritual heart of Hungarian Christianity."

 pilgrimage_expedition_events.15.title: "The Nazareth of Croatia"
 pilgrimage_expedition_events.15.desc: "On the hill above [current_location.GetName], overlooking the bay, stands a modest Franciscan church built around an empty space where, pilgrims here insist, something extraordinary once stood. For three years, they say, the very house of the Holy Family stood on this ground, carried whole from Nazareth by angels when the Holy Land grew too dangerous to protect it, before continuing on its miraculous journey to Loreto in Italy.\n\n[target_ruler.GetName] is shown the painting the Pope sent to console the [current_location.GetRank.GetName] for the house's departure: the Virgin nursing the Christ Child, said to be the work of Saint Luke himself. It has drawn pilgrims to this hillside for generations since, a shrine to something that is no longer there, and yet somehow still is."
 pilgrimage_expedition_events.15.a: "Venerate the painting of Our Lady of Trsat."
 pilgrimage_expedition_events.15.b: "Commission a Mass for safe passage, in a [current_location.GetRank.GetNameWithNoTooltip] that lives by the sea."
 pilgrimage_expedition_events.15.c: "The house has gone on to Loreto. So must we, homeward."
 pilgrimage_expedition_events.15.d: "$pilgrimage_resupply_light$"
 pilgrimage_expedition_events.15.e: "$pilgrimage_resupply_heavy$"
 pilgrimage_expedition_events.15.historical_info: "According to tradition, the Holy House of Nazareth, home of the Virgin Mary, was carried by angels to the hill of Trsat above Rijeka on 10 May 1291, remaining there for three years before continuing to Loreto in Italy on 10 December 1294. Nikola I Frankopan raised the first church on the site to mark where the house had stood. In 1367, Pope Urban V sent the shrine a painting of the Virgin and Child, traditionally attributed to Saint Luke, as consolation for the house's departure, and Franciscan friars have guarded the shrine since the following century. The legend earned the town its enduring epithet: the Nazareth of Croatia."

 pilgrimage_expedition_events.16.title: "The Martyr King"
 pilgrimage_expedition_events.16.desc: "The cathedral at [current_location.GetName] rises stark and gray against the northern sky, built over the sandbank where a king's grave was opened a little more than a year after his death and found, to the astonishment of all present, that his body had not decayed. His hair and nails, the story goes, had continued to grow in the dark earth, and a sweet fragrance rose from the coffin where the stink of death should have been.\n\n[target_ruler.GetName] stands before the shrine of Olav Haraldsson, once a Viking warlord who fell in battle trying to force Christianity onto a kingdom that did not want it, and who was declared a saint within a year of his death by acclamation alone, no distant Pope required. It is, [target_ruler.GetNameWithNoTooltip] reflects, a strange kind of sainthood: won not by gentle piety, but by the sword, and by dying for a cause that only looked righteous in hindsight."
 pilgrimage_expedition_events.16.a: "Venerate the incorrupt king at his shrine."
 pilgrimage_expedition_events.16.b: "Olav's lesson: faith by the sword is faith all the same."
 pilgrimage_expedition_events.16.c: "A cold and holy place. Let us go home."
 pilgrimage_expedition_events.16.d: "$pilgrimage_resupply_light$"
 pilgrimage_expedition_events.16.e: "$pilgrimage_resupply_heavy$"
 pilgrimage_expedition_events.16.historical_info: "Olav Haraldsson, King of Norway, died at the Battle of Stiklestad on 29 July 1030, fighting to reclaim his throne and complete the Christianization of his kingdom by force of arms. When his grave was opened a year and five days later, on 3 August 1031, Bishop Grimkell found the body seemingly undecayed, and declared Olav a saint on the strength of that discovery alone, a local canonization later confirmed by Pope Alexander III in 1164. Nidaros Cathedral was raised over his shrine and became the preeminent pilgrimage destination of the North, drawing the faithful from across Scandinavia and beyond along a network of roads still walked today as the Saint Olav Ways."

 pilgrimage_expedition_events.18.title: "The Mountain Pass"
 pilgrimage_expedition_events.18.desc: "The road climbs into bare, wind-scoured country, the way narrowing to a track along the shoulder of the mountain. [target_ruler.GetName] halts where the path splits: a longer route that skirts the worst of the climb, and a direct one that local shepherds say the ill-prepared do not always survive.\n\n[target_ruler.GetSheHe|U] weighs the mountain against the calendar. Every day spent finding an easier way is a day the company is not closer to journey's end."
 pilgrimage_expedition_events.18.a: "Hire local guides who know every safe foothold."
 pilgrimage_expedition_events.18.b: "Press on without them and trust to faith and footing."
 pilgrimage_expedition_events.18.c: "Turn back and take the longer road around the range."
 pilgrimage_expedition_events.18.d: "Send the stragglers back down the mountain alone."

 pilgrimage_expedition_events.19.title: "Storm at Sea"
 pilgrimage_expedition_events.19.desc: "The sky over the ship darkens without warning, and within the hour the crew are fighting swells that break clean over the rail. [target_ruler.GetName] is thrown against the mast before finding a handhold, and the deck beneath [target_ruler.GetHimHer] pitches like something alive.\n\nBelow decks, the pilgrims cling to whatever is bolted down and pray in a dozen dialects at once. There is little else to be done until the sea decides it has finished with them."
 pilgrimage_expedition_events.19.a: "Weather it out below deck and hope the ship holds."
 pilgrimage_expedition_events.19.b: "Gather the company on deck and pray through the storm."
 pilgrimage_expedition_events.19.c: "Lighten the ship by putting some retinue in the boats."
 pilgrimage_expedition_events.19.afloat_tt: "The crew manages to keep the ship afloat"
 pilgrimage_expedition_events.19.off_course_tt: "The storm throws the ship badly off course"
 pilgrimage_expedition_events.19.faith_protects_tt: "Our faith protects us through the storm"
 pilgrimage_expedition_events.19.piety_lacking_tt: "Our piety proves insufficient against the storm"

 pilgrimage_expedition_events.20.title: "Fording the River"
 pilgrimage_expedition_events.20.desc: "The road ends abruptly at a river running high and brown with recent rain, the ford that should be there submerged beneath a current strong enough to take a horse off its feet. A ferryman watches from the far bank, in no hurry to cross until he sees the color of good coin.\n\n[target_ruler.GetName] eyes the water and the ferryman in turn. Neither looks especially trustworthy today."
 pilgrimage_expedition_events.20.a: "Pay the ferryman for safe passage."
 pilgrimage_expedition_events.20.b: "Ford the river directly and save the toll."
 pilgrimage_expedition_events.20.c: "Send part of the retinue to find their own crossing."

 pilgrimage_expedition_events.21.title: "Fever in the Marshes"
 pilgrimage_expedition_events.21.desc: "The road sinks into low, standing water for miles on end, and the air thickens with the smell of rot and biting insects. Within days, coughs turn to fevers among the retinue, and more than one traveler has to be carried rather than walk.\n\n[target_ruler.GetName] watches the company grow thinner and quieter with every mile through this country, and wonders how many of them signed on for a pilgrimage rather than a plague."
 pilgrimage_expedition_events.21.a: "Push on quickly and leave the marshes behind."
 pilgrimage_expedition_events.21.b: "Halt and let the sick recover before continuing."

 pilgrimage_expedition_events.22.title: "Winter Closes the Road"
 pilgrimage_expedition_events.22.desc: "Snow closes over the pass ahead in drifts higher than a man, and the local villagers say plainly that no one crosses this road until spring. [target_ruler.GetName] had not planned for a season lost to weather, but the mountain does not consult travel plans.\n\nThere is a town nearby with room enough for the company, if [target_ruler.GetHerHis] purse can bear the lodging. Or there are guides, for a price, who claim to know a way through even now."
 pilgrimage_expedition_events.22.a: "Wait out the winter in the nearby town."
 pilgrimage_expedition_events.22.b: "Pay for guides and wagons to push through."

 pilgrimage_expedition_events.23.title: "A Lord's Hospitality"
 pilgrimage_expedition_events.23.desc: "Word of the pilgrimage's approach has traveled faster than the company itself, and the local lord rides out personally to greet [target_ruler.GetName] with an invitation to rest at his own table before continuing on. The hospitality on offer is generous, plainly meant to be seen and remembered.\n\n[target_ruler.GetSheHe|U] recognizes the offer for what it is: piety and prestige both, if accepted with the right grace."
 pilgrimage_expedition_events.23.a: "Accept the hospitality graciously."
 pilgrimage_expedition_events.23.a.host_opinion_tt: "[scope:host_lord.GetName] gains +20 [opinion|E] of us"
 pilgrimage_expedition_events.23.b: "Decline the delay and pray privately instead."

 pilgrimage_expedition_events.24.title: "The Toll of a Hostile Lord"
 pilgrimage_expedition_events.24.desc: "The road ahead runs through the lands of a lord who counts [ROOT.GetCountry.GetName] among his enemies, and his men are waiting at the border with a toll gate and a demand. [target_ruler.GetName] had hoped to pass through quietly. That hope dies at the sight of the pikes across the road.\n\nThe toll collector names a price that is less an offer than an insult, and waits to see what [target_ruler.GetHerHis] pride is worth."
 pilgrimage_expedition_events.24.a: "Pay the toll demanded."
 pilgrimage_expedition_events.24.b: "Force passage through with what retinue we have."
 pilgrimage_expedition_events.24.c: "Turn aside and find a longer way around his lands."

 pilgrimage_expedition_events.25.title: "Of Another Faith"
 pilgrimage_expedition_events.25.desc: "The road passes a shrine sacred to [current_location.GetDominantReligion.GetAdjective] believers, unfamiliar in its icons and its rites. [target_ruler.GetName] watches the local worshippers go about their devotions, curious and a little wary of the newcomers passing through.\n\nThere is an old habit among pilgrims of arguing faith with whoever will listen. [target_ruler.GetSheHe|U] weighs whether today is the day to indulge it."
 pilgrimage_expedition_events.25.a: "Argue the merits of the true faith with the locals."
 pilgrimage_expedition_events.25.b: "Let sleeping dogs lie and pass on quietly."

 pilgrimage_expedition_events.26.title: "Bandits on the Road"
 pilgrimage_expedition_events.26.desc: "The wilderness swallows the road for a stretch with no lord's writ to keep it safe, and figures emerge from the treeline before the company can react: armed, ragged, and clearly no strangers to robbing travelers. [target_ruler.GetName] counts them quickly. There are enough to be a problem, and too few to be an army.\n\nTheir leader steps forward and names a price for safe passage, in a tone that makes clear what happens if it is refused."
 pilgrimage_expedition_events.26.a: "Pay them off and be done with it."
 pilgrimage_expedition_events.26.b: "Stand and fight for the honor of the pilgrimage."
 pilgrimage_expedition_events.26.c: "Buy safe passage by leaving some retinue to the bandits."

 pilgrimage_expedition_events.27.title: "Pilgrims Join the Train"
 pilgrimage_expedition_events.27.desc: "Word travels ahead of a royal pilgrimage on the road, and by the time [target_ruler.GetName] reaches the next crossroads, a ragged column of ordinary pilgrims has gathered there, hoping to travel the rest of the way under the protection of a ruler's retinue.\n\nThere are families among them, and old men on foot who will not make it much farther alone. [target_ruler.GetSheHe|U] cannot feed the whole company forever, but turning them away here would mean turning them away to fend for themselves."
 pilgrimage_expedition_events.27.a: "Welcome them into the company."
 pilgrimage_expedition_events.27.b: "Turn them away to keep the pace."

 pilgrimage_expedition_events.29.title: "Corsairs off the Coast"
 pilgrimage_expedition_events.29.desc: "A low, dark hull cuts across the horizon, oars flashing in the sun, closing on the pilgrim ship faster than any honest trader has business moving. [target_ruler.GetName] recognizes a corsair's silhouette long before the lookout calls it, and there is no port, no shore, no help within reach.\n\n[target_ruler.GetSheHe|U] gathers what fighting men the retinue can muster on deck, and weighs whether they are enough, or whether the ship's stores are worth more than the fight."
 pilgrimage_expedition_events.29.a: "Take up arms and fight them off."
 pilgrimage_expedition_events.29.b: "Surrender the ship's stores and hope they are satisfied."
 pilgrimage_expedition_events.29.c: "Buy the ship's safety with some of our retinue."

 pilgrimage_expedition_events.30.title: "Held for Ransom"
 pilgrimage_expedition_events.30.desc: "With the retinue thinned by the road, [target_ruler.GetName] makes an easy target, and someone along the way has noticed. Armed men close around the company before a proper guard can be mustered, their leader naming a price for the ruler's freedom as casually as a merchant naming the cost of bread.\n\n[target_ruler.GetSheHe|U] has few men left to call on, and fewer good options."
 pilgrimage_expedition_events.30.a: "Pay the ransom demanded."
 pilgrimage_expedition_events.30.b: "Attempt to slip away under cover of darkness."

 pilgrimage_expedition_events.28.title: "Empty Larders"
 pilgrimage_expedition_events.28.desc: "The company's stores have given out somewhere past the last town worth the name, and the retinue's bellies have grown as empty as the sacks that once held their bread. [target_ruler.GetName] has led no army before, and it shows: hunger does not care about the holiness of the road ahead.\n\nThe land here is at least kind enough to offer something: fields, orchards, and a village market within reach, if [target_ruler.GetHerHis] company is willing to spend the time, the coin, or the pride it would take to make use of them."
 pilgrimage_expedition_events.28.a: "Send the retinue out to forage the countryside."
 pilgrimage_expedition_events.28.b: "Buy whatever food can be found, at whatever price is asked."
 pilgrimage_expedition_events.28.c: "There is nothing for it. We turn back."

 pilgrimage_resupply_light: "Pay the locals for fresh mounts, food, and hired hands."
 pilgrimage_resupply_heavy: "Spare no expense to fully resupply and reinforce the retinue."

