l_english:

 mining_survey_events.1.title: "The Prospecting Commission"
 mining_survey_events.1.desc: "A team of prospectors stands ready in the courtyard, their pack mules loaded with picks, drills, and an oiled wooden chest holding the assayer's crucibles, scales, and acids. They will walk our highland country for a year, testing streambeds for placer gold, hammering at quartz veins, and questioning shepherds about which valleys give up color in the pan. The hills have given up their wealth before, often to peoples we have entirely forgotten. There is no reason to think they have nothing left."
 mining_survey_events.1.a: "Spare no expense. Send skilled assayers, gold for samples."
 mining_survey_events.1.b: "A modest fee will do. Headmen provide guides and shelter."
 mining_survey_events.1.historical_info: "Systematic prospecting was practiced across medieval and early modern Europe, most famously in the Erzgebirge mountains of Saxony and Bohemia, where the discovery of silver veins in the twelfth century created the boom towns of Freiberg, Jáchymov, and Schneeberg. Georgius Agricola's #italic De re metallica#! (1556) became the standard textbook of the craft, describing in detail the use of divining rods, the assay of ore samples in small crucibles, and the legal customs governing the staking of claims."

 mining_survey_events.10.title: "A Seam of [ShowGoodsNameWithNoTooltip('iron')]"
 mining_survey_events.10.desc: "The prospectors have struck a seam of high-grade [ShowGoodsName('iron')] ore that runs deep into the mountain, the rock streaked black and red where the picks have laid it bare. The headman of the nearest village says his grandfather spoke of old workings somewhere on the slope above; the new shafts may simply be reopening what was lost. The forges and the foundries downstream will eat well for a generation if the find holds."
 mining_survey_events.10.a: "Announce the find. Let the [ROOT.GetCountry.GetFlavorRank] know what we have."
 mining_survey_events.10.b: "Develop it quietly. Rival foundries need not hear of it yet."
 mining_survey_events.10.historical_info: "Iron mining in pre-modern Europe centered on small surface workings and shallow shafts following the visible outcrop of ore, with bloomery furnaces converting the ore to wrought iron close to the mine. The blast furnace, introduced in the late medieval period, allowed the production of cast iron in much larger quantities, and the great iron-producing regions of Sweden, Styria, and the Basque country built their early modern prosperity on it."

 mining_survey_events.11.title: "A Lode of [ShowGoodsNameWithNoTooltip('copper')]"
 mining_survey_events.11.desc: "The prospectors have followed a streak of green-stained rock up the side of a hill and found the source: a [ShowGoodsName('copper')] lode running through the cliff face, exposed to the weather and waiting to be opened. The assayer breaks a sample on his portable anvil, drops it into the crucible, and reports that the metal is clean and yields well. The smelters are already being summoned from the towns to the south."
 mining_survey_events.11.a: "Develop openly. Let the [ROOT.GetCountry.GetFlavorRank] know of our [ShowGoodsNameWithNoTooltip('copper')]."
 mining_survey_events.11.b: "Develop quietly. Brass-founders pay more if rumor stays low."
 mining_survey_events.11.historical_info: "Copper mining was concentrated in a few celebrated districts in pre-industrial Europe: Falun in Sweden, the slopes of the Erzgebirge, the Mansfeld region in Saxony, and the Tyrolean Alps. The metal was essential for bronze artillery, ship sheathing, and brass goods, and a productive copper mine could enrich both the crown that owned it and the merchant houses that financed its development. The Fugger banking dynasty rose to prominence in part through their control of Tyrolean copper."

 mining_survey_events.12.title: "A [ShowGoodsNameWithNoTooltip('tin')] Lode in the Hills"
 mining_survey_events.12.desc: "The prospectors traced the dark cassiterite pebbles in a streambed up the slope and found the lode where it broke the surface, the [ShowGoodsName('tin')]-bearing rock running thick and clean along a quartz vein. The miners are already setting up timbered shafts and a stamping mill at the foot of the hill. The bronze-founders, the pewterers, and the plate-makers will all have material to work for a generation."
 mining_survey_events.12.a: "Announce the find. A new [ShowGoodsNameWithNoTooltip('tin')] lode concerns the state."
 mining_survey_events.12.b: "Keep it quiet. Corner the bronze trade before rivals do."
 mining_survey_events.12.historical_info: "Tin was a strategic metal in the pre-modern world, essential for bronze cannon and household pewter alike, and supplies were concentrated in a few celebrated regions: Cornwall, the Erzgebirge, and parts of Bohemia. The Stannaries of Cornwall enjoyed a special legal status from the medieval period onwards, with their own courts and parliament, and the Cornish tin trade fed brass and bronze production across Atlantic Europe."

 mining_survey_events.13.title: "Galena in the Limestone"
 mining_survey_events.13.desc: "A seam of galena has been opened in the hill country, its dark crystals shot through with silver glints that promise a useful smelter by-product. The [ShowGoodsName('lead')] from the seam will roof churches, line pipes, and cast into shot, while the [ShowGoodsName('silver')] fraction will help pay for the development. The pit boss reports a clean working face and a steady draught through the new shaft."
 mining_survey_events.13.a: "Make the find known. [ShowGoodsNameWithNoTooltip('lead')] is a matter of public interest."
 mining_survey_events.13.b: "Quietly contract the output to powder mills and printers."
 mining_survey_events.13.historical_info: "Lead and silver were almost always mined together in pre-modern Europe, the galena ore yielding both metals through the cupellation process invented in antiquity and refined throughout the medieval period. The Mendip hills of England, the Harz mountains in Saxony, and the Sierra Morena in Spain were all important lead-silver districts, and the lead they produced shaped everything from cathedral roofs to printer's type to the lead pipes of urban water supply."

 mining_survey_events.14.title: "[ShowGoodsNameWithNoTooltip('silver')] in the Rock"
 mining_survey_events.14.desc: "The prospectors have struck [ShowGoodsName('silver')], a vein wide enough to swing a pick at and pure enough to take a polish straight from the rock. The assayer's crucibles are still hot from the test runs. The shaft is timbered and the first cartloads of ore are already being hauled to the surface by a creaking windlass. The mint will not lack for bullion this generation, and the courts of [ShowContinentName('europe')] will note the find within the year."
 mining_survey_events.14.a: "Announce it to the [ROOT.GetCountry.GetFlavorRank]. A [ShowGoodsNameWithNoTooltip('silver')] mine is a triumph."
 mining_survey_events.14.b: "Keep it quiet. Foreign eyes on our [ShowGoodsNameWithNoTooltip('silver')] bring trouble."
 mining_survey_events.14.historical_info: "Silver mining transformed European economies in the late medieval and early modern periods. The discovery of major silver veins at Schwaz in the Tyrol and Jáchymov in Bohemia in the late 1400s, followed by the Potosí strike in the Andes in 1545, flooded Europe with bullion and underwrote the great inflations of the sixteenth century. A productive silver mine was a strategic asset on the scale of a fleet or a fortress."

 mining_survey_events.15.title: "The Yellow Metal"
 mining_survey_events.15.desc: "The prospectors have struck [ShowGoodsName('goods_gold')]. A quartz vein, shot through with the metal in coarse threads, lies exposed on the cliff face where a winter rockfall took away the cover of soil. The metal is bright in the lamplight and untouched since the rock was laid down. The headman of the village is offering to lease the workings to the [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] for what he calls a fair share. The assayer recommends acceptance, with conditions."
 mining_survey_events.15.a: "Announce the find. Let our enemies hear of it."
 mining_survey_events.15.b: "Develop quietly. [ShowGoodsNameWithNoTooltip('goods_gold')] draws unwanted visitors."
 mining_survey_events.15.historical_info: "Native gold deposits in pre-modern Europe were rare and exhausted early. The medieval gold mines of Kremnica in Slovakia and Vrancea in Wallachia were significant local sources, but most European gold came from alluvial workings in rivers like the Rhine and the Tagus, or from refining the silver fraction of lead-silver ores. The discovery of native gold in any quantity was a windfall of the first order, and one that the crown invariably moved to claim."

 mining_survey_events.16.title: "Black Stone Burns Hot"
 mining_survey_events.16.desc: "A thick [ShowGoodsName('coal')] seam runs through the hills here, broken to the surface in two places where stream erosion has cut down to the strata. The seam is followable and the [ShowGoodsNameWithNoTooltip('coal')] burns clean. The local smiths are already trading their forge wood for it. The forges, the salt-pans, and the glasshouses can all be fed from this seam without further deforesting the country."
 mining_survey_events.16.a: "Develop under [ROOT.GetCountry.GetGovernment.GetAdjective] grant. Tell the [ROOT.GetCountry.GetFlavorRank]."
 mining_survey_events.16.b: "Lease workings to the iron-masters for a steady fraction."
 mining_survey_events.16.historical_info: "Coal-mining was practiced on a small scale in Europe from the medieval period onwards, principally in Wales, the Newcastle coalfield, and parts of Liège, but its real expansion came with the early modern fuel crisis as forests were cleared to expand arable land. Sea-coal from Newcastle was being shipped to London by the thousand-ton in the seventeenth century, and the iron industry would not have survived the loss of charcoal without it."

 mining_survey_events.17.title: "A Good Cutting [ShowGoodsNameWithNoTooltip('stone')]"
 mining_survey_events.17.desc: "A new quarry has been opened in the hills, the [ShowGoodsName('stone')] cutting cleanly along its bedding planes and curing hard after exposure. The master mason has been brought up from the cathedral works to inspect a sample block and pronounces it suitable for ashlar, fine carving, and load-bearing courses alike. Every cathedral and curtain wall for a hundred miles will draw on it for a generation."
 mining_survey_events.17.a: "Take workings under [ROOT.GetCountry.GetGovernment.GetAdjective] control. [ShowGoodsNameWithNoTooltip('stone')] is strategic."
 mining_survey_events.17.b: "Lease the quarry to the masons' guild for a steady rent."
 mining_survey_events.17.historical_info: "Building stone was a slow-moving but valuable commodity in pre-industrial Europe, since transport cost was the dominant factor in its price. A productive quarry within a day's haul of a major city or building site was a long-term asset, and the great medieval cathedral works at Reims, Salisbury, and Cologne maintained dedicated quarries for generations to supply their construction needs."

 mining_survey_events.18.title: "[ShowGoodsNameWithNoTooltip('marble')] in the Hollow"
 mining_survey_events.18.desc: "Veined [ShowGoodsName('marble')] of the finest grade has been found in a sheltered hollow, and the master mason has cut a sample block that polishes to a deep, translucent gleam. The local sculptors are already petitioning for first refusal on the output. Workshops as far away as the capital will draw on this quarry for a generation, and the carvers of altarpieces and tomb monuments will count themselves blessed."
 mining_survey_events.18.a: "Announce it. A great [ShowGoodsNameWithNoTooltip('marble')] quarry is a national treasure."
 mining_survey_events.18.b: "Reserve the [ShowGoodsNameWithNoTooltip('marble')] for [ROOT.GetCountry.GetGovernment.GetAdjective] use, quietly."
 mining_survey_events.18.historical_info: "Marble for fine sculpture and architecture in medieval and Renaissance Europe came from a handful of celebrated quarries: Carrara in Tuscany, Paros and Pentelicus in Greece, and Saint-Beat in the Pyrenees. The discovery of a new productive seam of statuary-grade marble was a matter of note among artists, who would commission samples and travel personally to inspect a promising find."

 mining_survey_events.19.title: "Stones That Catch the Light"
 mining_survey_events.19.desc: "The prospectors have found [ShowGoodsName('gems')]-bearing gravels in a streambed and traced them to a richer pocket in the hillside above, where the matrix is pegmatite shot through with crystals. The lapidaries' representative, brought up from the capital, sorts a heap of rough stones into piles by color and clarity, and reports that the cuttable fraction is exceptional. The court jewelers will not lack for stones this generation."
 mining_survey_events.19.a: "Announce the find. A [ShowGoodsNameWithNoTooltip('gems')]-pit is a wonder worth boasting."
 mining_survey_events.19.b: "Keep the [ShowGoodsNameWithNoTooltip('gems')] for [ROOT.GetCountry.GetGovernment.GetAdjective] coffers, quietly kept."
 mining_survey_events.19.historical_info: "European gem mining was a minor affair compared with the great Indian and Burmese fields, but local sources of garnet, beryl, amethyst, and topaz were worked in the Bohemian highlands, the Scottish Cairngorms, and parts of the Pyrenees. The lapidary workshops of Idar-Oberstein in the Rhineland became a center for the cutting of locally mined stones, and a productive find could keep their craftsmen busy for years."

 mining_survey_events.20.title: "Cinnabar in the Hills"
 mining_survey_events.20.desc: "A cinnabar deposit has been opened in the highlands, its bright red ore the unmistakable sign of [ShowGoodsName('mercury')] in the rock. The retort and the condenser are already being set up at a safe distance from the workings, since the fumes given off in the roasting are known to loosen teeth and addle the wits. Alchemists, assayers, and gilders will all draw on this mine for a generation to come, and a metal so scarce and so useful may command whatever price we care to name."
 mining_survey_events.20.a: "Develop the mine openly. [ShowGoodsNameWithNoTooltip('mercury')] is a strategic commodity."
 mining_survey_events.20.b: "Develop quietly. A monopoly on [ShowGoodsNameWithNoTooltip('mercury')] is a powerful thing."
 mining_survey_events.20.historical_info: "Mercury, the only metal liquid at room temperature, was essential for the amalgamation process that came to dominate American silver refining in the sixteenth century. The Almadén mine in Castile and Idrija in Carniola were the two great European sources, and the crown of Spain held the Almadén workings as a strict royal monopoly, the mercury being shipped to Mexico and Peru in galleons under naval escort."

 mining_survey_events.21.title: "A Brine Spring"
 mining_survey_events.21.desc: "A new rock-[ShowGoodsName('salt')] deposit has been opened in the highlands, with brine springs flowing where the strata cross the valley floor. The salt-boilers are already at work, and the local farmers are sending their cattle to drink at the brine seeps. The cured meat trade and the table will both improve, and the gabelle, if we choose to impose one, would pay for a year of [ROOT.GetCountry.GetGovernment.GetAdjective] household expenses from this find alone."
 mining_survey_events.21.a: "Develop the [ShowGoodsNameWithNoTooltip('salt')] works under [ROOT.GetCountry.GetGovernment.GetAdjective] grant."
 mining_survey_events.21.b: "Lease the operation to salt-merchants for a steady fraction."
 mining_survey_events.21.historical_info: "Salt was a strategic commodity in pre-modern Europe, indispensable for food preservation and a major source of state revenue through the various salt-taxes and monopolies, the most famous being the French gabelle. The great salt mines of Wieliczka in Poland, Hallstatt in Austria, and Cardona in Catalonia were operated for centuries and made the fortunes of the families and crowns that owned them."

 mining_survey_events.22.title: "[ShowGoodsNameWithNoTooltip('alum')] Shales Found"
 mining_survey_events.22.desc: "The prospectors have found [ShowGoodsName('alum')]-bearing shales in the hill country, the rock weathering naturally to a salt that the dyers will pay any price for. A pilot retort has produced clean white [ShowGoodsNameWithNoTooltip('alum')] from the first samples, and the cloth-merchants' representatives are already inquiring about long-term contracts. The textile trade has waited a long time for a source closer to home than the papal monopoly at Tolfa."
 mining_survey_events.22.a: "Announce the find. [ShowGoodsNameWithNoTooltip('alum')] is a triumph of [ROOT.GetCountry.GetFlavorRank]'s craft."
 mining_survey_events.22.b: "Develop quietly. The papal [ShowGoodsNameWithNoTooltip('alum')] monopoly need not know."
 mining_survey_events.22.historical_info: "Alum, the essential mordant for fixing dyes to cloth, was a strategic textile commodity throughout the medieval and early modern periods. The discovery of the great alum deposits at Tolfa in the Papal States in 1462 created a Vatican monopoly that lasted for over a century, until alternative sources were developed in England, Sweden, and the Netherlands. Any nation that could supply its own alum freed its cloth industry from a galling foreign dependency."

 mining_survey_events.23.title: "[ShowGoodsNameWithNoTooltip('saltpeter')] in the Valley"
 mining_survey_events.23.desc: "[ShowGoodsName('saltpeter')] has been extracted from the soil of a sheltered valley, the white crystals bloomed on the rock face after the spring melt. The powder-master, brought up from the arsenal, samples the crude nitre and pronounces it suitable for refining into gunpowder of the first quality. The powder mills will not lack for nitre this generation, and the [ROOT.GetCountry.GetFlavorRank]'s artillery train can finally be matched to its ambition."
 mining_survey_events.23.a: "Develop under [ROOT.GetCountry.GetGovernment.GetAdjective] monopoly. [ShowGoodsNameWithNoTooltip('saltpeter')] means war."
 mining_survey_events.23.b: "Let powder-merchants develop it for first call on output."
 mining_survey_events.23.historical_info: "Saltpeter, the principal ingredient of gunpowder, was extracted in pre-modern Europe from sheltered soils that had been long fertilized by manure and dung, or imported at great expense from India and the Levant. State control of saltpeter production was a strategic concern: England operated a system of saltpeter-men with legal authority to dig under stables and dovecotes, and France maintained the #italic Régie des Poudres#! as a royal monopoly into the nineteenth century."

 # BAD events
 mining_survey_events.30.title: "Cave-In at the Test Pit"
 mining_survey_events.30.desc: "Disaster at the [ShowGoodsName('iron')] prospect. The test shaft has collapsed during the night, the timbering torn out by a slow subsidence in the loose shale above the ore band. Two of the prospecting team are buried; another, the assayer's apprentice, was pulled out with a broken leg and a refusal to ever go down a shaft again. The pit boss says the [ShowGoodsNameWithNoTooltip('iron')] is there, but reaching it will mean cutting a new adit through harder ground, and the cost will be considerable."
 mining_survey_events.30.a: "Withdraw the team. Some ground is not worth burying men for."
 mining_survey_events.30.historical_info: "Roof collapses and shaft failures were the chronic occupational hazard of pre-modern mining. Timber sets supporting the workings rotted in damp ground; loose strata above the ore band slipped without warning; and the standard method of pillar-and-room extraction left increasingly unsupported voids as the ore was won. Miners' chapels, miners' funerary guilds, and miners' widows' funds were a permanent fixture of every European mining district."

 mining_survey_events.31.title: "Toxic Smoke from the Workings"
 mining_survey_events.31.desc: "The [ShowGoodsName('copper')] prospect is yielding ore of unexpected character. The first roasting heap, set up to drive off the sulfides before smelting, is producing acrid yellow smoke that has driven the workers off the slope and is wilting the grass for half a mile downwind. The local farmers have presented a formal complaint. The metallurgist says he can build proper roasting kilns to contain the fumes, but it will cost gold and time we did not budget for."
 mining_survey_events.31.a: "Abandon the prospect. Locals are not wrong about the air."
 mining_survey_events.31.historical_info: "Copper smelting from sulfide ores released large quantities of sulfur dioxide, which damaged crops, livestock, and lungs across the surrounding countryside. The Falun copper district in Sweden was notorious for its smoke, said to render the surrounding farmland barren for miles, and the great copper-smelting valley of the lower Harz was similarly ruinous. Civil suits against mining operations for smoke damage were common from the medieval period onwards."

 mining_survey_events.32.title: "The Streambed Goes Dry"
 mining_survey_events.32.desc: "The [ShowGoodsName('tin')] prospect was promising at first: alluvial cassiterite in workable quantity, panned out of the streambed by the wagonload. But the source of the placer has not been found, and the streambeds are now scoured of the heavy ore. The hill-pits dug above the workings have hit only barren matrix. The team has run out of obvious places to dig, and the cost of cutting deeper shafts on no evidence is hard to justify."
 mining_survey_events.32.a: "Abandon the prospect. The placer was a flash in the pan."
 mining_survey_events.32.historical_info: "Alluvial tin-streaming, the working of tin-bearing gravel in stream and river beds, was the original mode of Cornish tin extraction and persisted into the early modern period. Once the easy gravels were worked out, miners had to follow the placer back to its source through systematic prospecting of the surrounding hills. Many promising streams led to nothing more than a thin disseminated lode that did not justify the cost of underground working."

 mining_survey_events.33.title: "The Workers Sicken"
 mining_survey_events.33.desc: "The [ShowGoodsName('lead')] prospect is producing ore. The workers are producing complaints. The men coming off shift have gray-tinged gums, swollen joints, and a heavy slowness that the camp physician calls the colic of the lead-workers. Two have died; four more are too sick to descend the shaft. The pit boss says the workings can continue if we hire replacements and accept the losses, but the local headman is asking pointed questions about who will be next."
 mining_survey_events.33.a: "Close it. We did not come to bury free men of the [ROOT.GetCountry.GetFlavorRank]."
 mining_survey_events.33.historical_info: "Lead poisoning, the #italic colica plumbica#! of the ancients, was a well-known occupational disease of lead miners, smelters, glaziers, and potters. Bernardino Ramazzini's #italic De morbis artificum diatriba#! (1700), the foundational text of occupational medicine, devoted a long chapter to the affliction. The standard remedies of bleeding, purging, and milk-drinking were ineffective, and the only real preventive was to limit exposure, which mine-owners had little economic incentive to do."

 mining_survey_events.34.title: "The Vein Pinches Out"
 mining_survey_events.34.desc: "The [ShowGoodsName('silver')] vein was wide where the prospectors first opened it, and the first cartloads assayed at over thirty marks of [ShowGoodsNameWithNoTooltip('silver')] to the hundredweight. Then, ten yards down the dip of the seam, the vein narrowed sharply, the ore went lean, and the working face is now barely worth the cost of hauling rock to the surface. The geological term is a #italic pinch-out#!. The miners' term is rather less polite. There may be more [ShowGoodsNameWithNoTooltip('silver')] further along the fault, but finding it will mean costly exploratory shafts on no evidence."
 mining_survey_events.34.a: "Withdraw. A pinched vein is a closed door."
 mining_survey_events.34.historical_info: "Silver veins were notoriously variable along their length, swelling to feet-thick ore bodies in some sections and narrowing to barren stringers in others. The vagaries of vein geometry made silver mining a profession of educated gambling, and the rise and fall of medieval boom towns like Jáchymov, Schwaz, and Iglau tracked the discovery and exhaustion of particular veins with grim regularity."

 mining_survey_events.35.title: "All That Glitters Is Not Gold"
 mining_survey_events.35.desc: "Disappointment at the [ShowGoodsName('goods_gold')] prospect. The bright metallic flecks running through the quartz are not [ShowGoodsNameWithNoTooltip('goods_gold')] but pyrite, the iron sulfide that has fooled prospectors since the dawn of metallurgy. The assayer's first test, by reduction in the crucible, has produced not a yellow bead of [ShowGoodsNameWithNoTooltip('goods_gold')] but a thin red sulfurous scum and a piece of pig-iron. The headman of the local village is conspicuously not surprised; he had heard the old grandfather stories about #italic Narrengold#! on this slope and had been waiting to see if our scholars knew the difference."
 mining_survey_events.35.a: "Pack up and leave. Fool's gold, prospector's oldest trick."
 mining_survey_events.35.historical_info: "Pyrite, the iron sulfide that gleams a brassy yellow in the rock and earned the popular name #italic Narrengold#! (fool's gold) in German mining country, has misled prospectors for as long as humans have looked for the real metal. The distinguishing tests, malleability under the hammer (pyrite shatters; gold flattens), specific gravity (gold is nineteen times the density of water; pyrite only five), and behavior in fire-assay (gold survives; pyrite roasts away as sulfur and iron oxide), were standard practice for any competent assayer."

 mining_survey_events.36.title: "Firedamp in the Seam"
 mining_survey_events.36.desc: "The [ShowGoodsName('coal')] seam runs thick and clean. It also runs full of firedamp. The marsh-gas that pools in any deep [ShowGoodsNameWithNoTooltip('coal')] working has caught fire from the lamp of one of the hewers, and the resulting explosion has killed three men outright and burned six more so badly that they will not work again. The pit boss says the seam can be worked, but only with constant ventilation by an air-shaft and a furnace, which will require considerable capital before any [ShowGoodsNameWithNoTooltip('coal')] comes out."
 mining_survey_events.36.a: "Close working. We are not yet equipped to fight firedamp."
 mining_survey_events.36.historical_info: "Firedamp, the methane that accumulates in coal workings and ignites explosively from any flame, was the chronic killer of pre-industrial coal miners. The standard countermeasure was systematic ventilation by paired shafts with a furnace at the foot of the upcast, drawing air through the workings; the Davy safety lamp, which permitted illumination without ignition, was not invented until 1815. Until then, every deep coal seam was worked under sentence of intermittent disaster."

 mining_survey_events.37.title: "The Quarry Floods"
 mining_survey_events.37.desc: "The [ShowGoodsName('stone')] is excellent, but the quarry will not stay dry. The first pit, cut twelve feet into the bedding plane, is filling overnight with water from a spring that the quarrymen had not anticipated, and the bottom course of [ShowGoodsNameWithNoTooltip('stone')] is now under three feet of cold water. The master mason says the quarry can be worked if a drainage gallery is cut to the valley below, but the gallery is a year of stoneworking in its own right, and the budget did not allow for it."
 mining_survey_events.37.a: "Abandon the quarry. A flooded pit is a closed pit."
 mining_survey_events.37.historical_info: "Quarry drainage was a chronic engineering problem in pre-industrial stone-working, and many otherwise productive pits were abandoned when the working face dropped below the local water table. The standard solutions were drainage galleries cut horizontally to lower ground (the so-called #italic Stollen#! of the German mining tradition), water-wheels driving bucket-chain pumps, and, in the seventeenth century onwards, the gradual introduction of steam-driven pumping engines."

 mining_survey_events.38.title: "The Block Shatters"
 mining_survey_events.38.desc: "The [ShowGoodsName('marble')] initially looked sound at the working face. Two days later, when the first great block was finally separated from the bedrock and lowered onto the timber rollers, it cracked through along an invisible flaw, splitting into six worthless pieces under the weight of its own descent. The master mason walks the rejected block, taps it with his hammer, and pronounces what the team already knows: the [ShowGoodsNameWithNoTooltip('marble')] in this hollow is shot through with internal fracture lines that no inspection of the working face had revealed."
 mining_survey_events.38.a: "Close it. Fractured [ShowGoodsNameWithNoTooltip('marble')] is only for road metal."
 mining_survey_events.38.historical_info: "Marble blocks for statuary and fine architectural work had to be free of internal flaws, and the discovery of hidden fracture lines (#italic peli#! in the Italian quarrymen's slang) was the constant terror of the trade. Master sculptors visited the quarries in person to inspect the rough blocks before commission, and the cost of a major statuary commission included a generous allowance for blocks discovered to be flawed after delivery."

 mining_survey_events.39.title: "Paste, Not Crystal"
 mining_survey_events.39.desc: "The [ShowGoodsName('gems')]-bearing gravels were unusually rich. Suspiciously rich. The royal lapidary, brought up from the capital under guard, examines the haul under a strong lamp, weighs each stone in his palm, scratches one against a fragment of corundum, and pronounces the inevitable: most of the finds are paste, leaded glass cunningly cut and weathered to resemble unworked crystal. Someone has been salting the streambed. The pit boss is conspicuously absent from the camp this morning."
 mining_survey_events.39.a: "Pack up. The whole prospect was a confidence trick."
 mining_survey_events.39.historical_info: "Salting, the practice of planting genuine ore or worked gem material at a prospect to attract investment, was an ancient occupational fraud of the mining frontier. The pit boss who salted his own workings, the local guide who scattered a few hidden specimens along a chosen streambed, and the absentee promoter who arranged for the carefully placed find were perennial figures in the histories of European and American mining alike. The crooked assayer who confirmed the fraud completed the standard arrangement."

 mining_survey_events.40.title: "The [ShowGoodsNameWithNoTooltip('mercury')] Madness"
 mining_survey_events.40.desc: "The [ShowGoodsName('mercury')] workings are producing metal. They are also producing madmen. The workers at the retort have begun to tremble uncontrollably; the apprentice tasked with stirring the condensed [ShowGoodsNameWithNoTooltip('mercury')] has lost teeth and the use of two fingers on his right hand; and the master metallurgist, who knew the risks better than anyone, has descended into an irritable distraction that the camp physician calls the #italic hatter's madness#! and pronounces incurable. The [ShowGoodsNameWithNoTooltip('mercury')] is there. The men to win it are not."
 mining_survey_events.40.a: "Close the workings. No metal is worth this."
 mining_survey_events.40.historical_info: "Mercury poisoning, manifesting as tremors, tooth loss, and progressive psychiatric deterioration, was the well-recognized occupational disease of cinnabar miners, retort-workers, and silver amalgamators. The Almadén mine in Castile, the great European source of mercury, was worked partly by convict labor for precisely this reason. The English phrase #italic mad as a hatter#! preserved the memory of the trade once felt-hat makers were poisoned by the mercury used in their craft."

 mining_survey_events.41.title: "The Brine Source Fails"
 mining_survey_events.41.desc: "The [ShowGoodsName('salt')] prospect started well. The brine spring was strong, the boilers were producing white [ShowGoodsNameWithNoTooltip('salt')] of the first quality, and the salt-merchants were already negotiating long-term contracts. Then, after a dry summer and a colder than usual winter, the spring weakened to a trickle and finally stopped. The geologist sent to investigate reports that the underground source was a finite pocket of trapped brine, not a renewing flow, and that the prospect is essentially exhausted."
 mining_survey_events.41.a: "Withdraw. A dry spring is the end of a [ShowGoodsNameWithNoTooltip('salt')]-spring works."
 mining_survey_events.41.historical_info: "Brine springs and rock-salt deposits had very different geological characters and economic prospects. Some brine sources, like those of Halle in Saxony or Salins-les-Bains in the Jura, flowed for centuries and supported substantial towns; others were essentially fossil pockets that exhausted within a generation of intensive working. Rock salt, mined in places like Wieliczka and Cardona, was a more reliable but more capital-intensive resource."

 mining_survey_events.42.title: "The Shales Are Sterile"
 mining_survey_events.42.desc: "The shale outcrop looked promising at the surface, the rock weathering to a salt that took up clean and white in the assay. But under cover the shales are sterile: thick, dark, and entirely lacking in the [ShowGoodsName('alum')]-bearing pyritic veins that the surface samples seemed to promise. The chemist tries acid leaching, then roasting, then long weathering on the dump heap, and produces almost nothing. The workers, brought up at considerable expense from the textile towns, are sitting idle while the engineer tries one approach after another."
 mining_survey_events.42.a: "Close the works. The chemistry will not yield [ShowGoodsNameWithNoTooltip('alum')] here."
 mining_survey_events.42.historical_info: "Alum manufacture from pyritic shales required precisely the right mineral chemistry: iron pyrite to provide the sulfate ion, aluminous shale to provide the aluminum, and a long weathering process to bring the two together in solution. Surface samples could easily mislead, since the outcrop was where natural weathering had already done the work; the underground rock was often barren. The Yorkshire alum works on the North Sea coast spent decades and considerable capital on shales that ultimately did not yield."

 mining_survey_events.43.title: "The Soil Yields Nothing"
 mining_survey_events.43.desc: "The valley soil was supposed to be [ShowGoodsName('saltpeter')]-rich. The local farmers said their grandfathers had collected the white bloom from the rock face every spring. The prospectors have now dug, leached, and evaporated soil from a dozen places along the valley floor and produced almost nothing of value. The powder-master, when shown the meager yield, suggests that the old [ShowGoodsNameWithNoTooltip('saltpeter')] beds may have been worked out by the very farmers whose grandfathers told the stories. The valley is now barren of [ShowGoodsNameWithNoTooltip('saltpeter')]."
 mining_survey_events.43.a: "Abandon the valley. The soil is dead; no [ShowGoodsNameWithNoTooltip('saltpeter')] here."
 mining_survey_events.43.historical_info: "Saltpeter-bearing soils were not infinite. The natural process of nitre formation in damp, manured ground took years and was easily exhausted by intensive extraction. The German #italic Salpetersieder#! tradition therefore included the systematic establishment of artificial #italic Salpeterplantagen#!, where manure, lime, and ash were piled and tended for years to produce a steady saltpeter yield. The transition from finding to making saltpeter was a major step in the rationalization of pre-industrial gunpowder production."
