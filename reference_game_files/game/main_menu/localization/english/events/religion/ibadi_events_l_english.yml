l_english:
 shurat: "Šurāh"
 
 ibadi_events.1.title: "$legacy_of_rustamids$"
 ibadi_events.1.desc: "$legacy_of_rustamids_desc$\n\nIn spirit of the Imamate of old, [target_character.GetName] has just been proclaimed the first [ShowPolicyName('ibadi_zuhur_imam_policy')] to rule in [ShowRegionName('maghreb_region')]. No longer will the faithful be forced to live under the [ShowPolicyNameWithNoTooltip('ibadi_kitman_imam_policy')]."
 ibadi_events.1.a: "A new era dawns."
 ibadi_events.1.b: "Truly, [ROOT.GetCountry.GetReligion.GetGodName] smiles upon us."

 may_adopt_a_different_color: "We may adopt a #Y Deep Blue Color#! as our country color"
 rustamids_adopt_different_color: "We adopt a #Y Deep Blue Color#! as our country color"

 ibadi_events.2.title: "A Weak 'Imām"
 ibadi_events.2.desc: "The [target_estate.GetName] are growing increasingly dissatisfied with the rule of the [target_character.GetName], an [ShowPolicyName('ibadi_daif_imam_policy')]. After all, a weak 'Imām's rule is only tolerated during times of crisis, and the [ShowReligionAdjective('ibadi')] faithful of [ROOT.GetCountry.GetName] are no longer under threat."
 ibadi_events.2.a: "We must find a better candidate to lead us."

 ibadi_weak_imam_penalty_tt: "[ShowPolicyName('ibadi_daif_imam_policy')] will give us scaling penalties until we change our [ruler|e] with [ShowGenericActionName('return_to_zuhur_imamate')]"
 has_penalty_for_weak_imam: "No longer fulfills the requirements and #Y $ibadi_events.2.title$#! [event|e] has fired"