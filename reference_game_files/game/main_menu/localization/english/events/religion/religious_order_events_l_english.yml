l_english:
 religious_orders.1.title: "A Pious Bequest"
 religious_orders.1.desc: "A wealthy patron has died, and the will leaves a small fortune to the [target_order.GetName]. The brothers already speak of new roofs for their chapter houses and bread for the poor at their gates. By custom such gifts are theirs to keep, though coin on this scale rarely escapes the notice of [target_character.GetName]."
 religious_orders.1.a: "Let the brothers keep it."
 religious_orders.1.b: "Claim it for the treasury."

 religious_orders.2.title: "The [target_order.GetNameWithNoTooltip] Seeks a Foothold"
 religious_orders.2.desc: "The [target_order.GetName] has outgrown its few houses, and the brothers press us for room to grow. They have set their sights on [target_location.GetName], where they would raise a new chapter house and draw novices from the countryside around it. The land is ours to give or to withhold, and they await our word."
 religious_orders.2.a: "Grant the land."
 religious_orders.2.b: "Endow the local [GetEstateNameWithNoTooltip('clergy_estate')] instead."
 religious_orders.2.c: "Refuse them outright."

 locals_embrace_the_order_desc: "The people take to the brothers at once, and within a season the new house feels as though it had always stood among them"
 order_works_to_bolster_local_wealth_desc: "The brothers set to draining fields and mending roads, and the district grows richer for their labor"
 order_projects_central_authority_desc: "With the order settled at [target_location.GetName], the writ of [target_character.GetName] now carries a little further than before"
 order_appreciates_new_holding_desc: "The brothers receive the grant with thanks, and the favor of [target_character.GetName] is spoken of warmly in the order's houses"

 religious_orders.3.title: "The [target_order.GetNameWithNoTooltip] Stirs the Faithful"
 religious_orders.3.desc: "The [target_order.GetName] has stirred the country to a pitch of devotion, and the brothers take pride in the fervor they have kindled. Some would send that zeal into the towns where our faith has yet to take root, to win the souls that the parish priests never could. Others only mutter that such moods seldom stay gentle toward the moneyed men of the guilds."
 religious_orders.3.a: "Bless the fervor."
 religious_orders.3.b: "Press the [GetEstateNameWithNoTooltip('burghers_estate')] for a contribution."
 religious_orders.3.c: "Send the brothers to preach where the faith is weakest."

 religious_orders.4.title: "Scandal in the Cloister"
 religious_orders.4.desc: "Word has reached us that certain brothers of the [target_order.GetName] have been living far from their vows, and the whispers are already spreading beyond the cloister walls. The chapter looks to us before the scandal does real harm."
 religious_orders.4.a: "Purge the guilty."
 religious_orders.4.b: "Let it be settled quietly."

 scandal_kept_quiet_desc: "The matter is smoothed over, though a faint stain lingers on the order's name"
 scandal_breaks_open_desc: "The silence does not hold, and the brothers blame [target_character.GetName] for the scandal that spills out"

 religious_orders.5.title: "A Patron Withdraws"
 religious_orders.5.desc: "A great house of the [GetEstateName('nobles_estate')] has long endowed the [target_order.GetName], and now that purse has closed. The brothers feel the want at once, and have come before [target_character.GetName] in hope that [target_character.GetSheHe] will not let their work fall idle."
 religious_orders.5.a: "Cover the shortfall from the treasury."
 religious_orders.5.b: "Let them make do with less."
 religious_orders.5.c: "Demand the [GetEstateNameWithNoTooltip('nobles_estate')] find a new patron."

 new_patron_steps_forward_desc: "A rival house takes up the patronage, and the order's coffers fill once more"
 no_patron_steps_forward_desc: "No new patron comes forward, and the brothers take our meddling ill"

 treasury_gift_entrenches_order_desc: "The order puts the gift to good use, and its grip on our lands grows the firmer for it"
 treasury_gift_earns_gratitude_desc: "The brothers take the coin as a mark of favor, and their goodwill toward [target_character.GetName] deepens"

 religious_orders.6.title: "The Empty Novitiate"
 religious_orders.6.desc_martial: "Few young men come to take up the sword and the cross with the [target_order.GetName]. Its commanderies stand half-manned, and the veteran brothers ask aloud who will hold the frontier once they are gone."
 religious_orders.6.desc_monastic: "Fewer novices each year knock at the gates of the [target_order.GetName]. The choir stalls sit empty at Matins, and the aging brothers worry over who will keep the hours once they are gone."
 religious_orders.6.a: "Open the gates to any who will serve."
 religious_orders.6.b: "Hold to the strict vows."
 religious_orders.6.c: "Fund a recruiting drive."

 order_abandons_a_house_desc: "With no novices to fill it, the order quietly gives up one of its houses"
 order_withers_for_want_of_novices_desc: "The order clings to its standards, but its strength and its fervor both ebb for want of new blood"

 religious_orders.101.title: "The Order's Champion"
 religious_orders.101.desc: "Among the brothers of the [target_order.GetName] rides a knight the border villages already name in their songs. His superiors, mindful of where their bread is buttered, have offered the sword of [target_character.GetName] to our banners for as long as our wars may need it."
 religious_orders.101.a: "Give him a command worthy of the songs."
 religious_orders.101.b: "His place is on the frontier."

 religious_orders.102.title: "Swords over the Border"
 religious_orders.102.desc: "Brothers of the [target_order.GetName] have ridden into [target_country.GetName] without leave and come home driving stolen cattle before them. We are not at war. The envoys of our neighbor are already on the road, and they are not coming to pray."
 religious_orders.102.a: "Make restitution and rebuke the order."
 religious_orders.102.b: "What is taken from the infidel is well taken."

 religious_orders.103.title: "Stone upon Stone"
 religious_orders.103.desc: "A letter has come from the wardens of the [target_order.GetName], written as soldiers write: the walls of their house at [target_location.GetName] are older than the border they watch, and mortar is cheaper than mourning. They ask for little, and they ask for it bluntly."
 religious_orders.103.a: "Pay for sturdy stone."
 religious_orders.103.b: "Walls can wait; let them ride wider patrols."

 religious_orders.104.title: "The Beacons Stayed Dark"
 religious_orders.104.desc_captives: "By the time the alarm at [target_location.GetName] was raised, the raiders were already riding off, and they did not ride off empty. Villagers were roped together and driven away to be sold in markets we will never see. The watchfires of the [target_order.GetName] burned all night and warned no one, and the wardens took a vow to prevent exactly this."
 religious_orders.104.desc_herds: "The pastures around [target_location.GetName] were swept clean in a single night, and not a hoof nor a horn remains in the district. The granaries will feel the loss long before the year turns. The wardens of the [target_order.GetName] keep asking one another how the beacons stayed dark."
 religious_orders.104.desc_plate: "Raiders slipped past the watchfires of the [target_order.GetName] by night, and by morning the church at [target_location.GetName] stood stripped to bare stone, its silver and its relics carried off in sacks across a saddle. The brothers cannot meet our eyes."
 religious_orders.104.a: "Bear the loss."
 religious_orders.104.b: "Send the brothers after the raiders."

 wardens_spoils_recovered_desc: "The brothers ride without rest and catch the raiders at a ford. They come back with everything but an apology, and the tale is already growing in the telling"
 wardens_trail_cold_desc: "The brothers ride out and find nothing but hoofprints and cold ashes. The loss stands, and so does the shame"

 religious_orders.105.title: "Ink and Vellum"
 religious_orders.105.desc: "The brothers of the [target_order.GetName] keep the neatest ledgers in our lands, and they know it. Their superiors have offered us clerks whose [ROOT.GetCountry.GetLiturgicalLanguage.GetName] is exact and whose arithmetic is merciless, asking only a quiet room and a modest stipend in return."
 religious_orders.105.a: "Set them to the tax rolls."
 religious_orders.105.b: "Set them to the letters of state."

 religious_orders.106.title: "The Broken Seal"
 religious_orders.106.desc: "A letter under our privy seal was recited in a chapter house of the [target_order.GetName] three days before its recipient broke the wax. The brothers who serve in our chancery forget nothing. It now appears they do not keep it to themselves either."
 religious_orders.106.a: "Bar them from the chancery."
 religious_orders.106.b: "Feed them a false ledger."
 religious_orders.106.c: "Suffer it in silence."

 confidants_ruse_swallowed_desc: "The false figures travel exactly as we hoped, and we mark every hand they pass through"
 confidants_ruse_discovered_desc: "A sharp-eyed brother spots the invented figures within the week, and the order does not forgive being played for a fool"

 religious_orders.107.title: "Home from the Sea"
 religious_orders.107.desc_crews: "Her decks crowded with sailors pulled off a wreck on the outer shoals, a galley of the [target_order.GetName] has limped into harbor low in the water. The survivors swear the brothers rowed through weather no paid captain would have faced, and swear it loudly in every tavern on the quay."
 religious_orders.107.desc_charts: "A galley of the [target_order.GetName] has come home from a long escort, and her master walks ashore with rutters corrected in his own hand: soundings and anchorages our own pilots never knew, marked plainly for any man who can read."
 religious_orders.107.desc_relic: "Half the coast has turned out to watch a galley of the [target_order.GetName] make port under every pennant she owns. The brothers carry a relic ashore, bought in a distant harbor, and the quayside presses close for a glimpse of it."
 religious_orders.107.a: "Receive them with honors."
 religious_orders.107.b: "The order keeps its own."

 religious_orders.108.title: "Lost with All Hands"
 religious_orders.108.desc: "The finest galley of the [target_order.GetName] broke apart on the bar in a winter gale, in sight of the harbor and beyond all help. The brothers aboard her drowned beside the pilots they had spent years training. Along the coast the order's bells are ringing, and there are no bodies to bury."
 religious_orders.108.a: "Refit their squadron at our cost."
 religious_orders.108.b: "The sea gives and the sea takes."

 religious_orders.109.title: "The Hours Kept"
 religious_orders.109.desc: "For longer than most living men can remember, the brothers of the [target_order.GetName] have kept the hours without a single night's lapse. Matins in the frost and Vespers in the fever seasons, prayer laid upon prayer like courses of a wall. Folk have begun to say aloud that the [ROOT.GetCountry.GetFlavorRank] stands because the brothers kneel."
 religious_orders.109.a: "Proclaim a day of thanksgiving."
 religious_orders.109.b: "Send for the abbot's blessing."

 religious_orders.110.title: "A Voice from the Cell"
 religious_orders.110.desc: "An anchorite of the [target_order.GetName], walled into his cell these twenty years, has begun to cry through the window slit that fire and pestilence hang over us like a drawn sword. Pilgrims carry his words from parish to parish faster than any herald could ride, and every retelling grows a little worse."
 religious_orders.110.a: "Bid the abbot silence him."
 religious_orders.110.b: "Let him cry his warning."

 doom_talk_fades_desc: "For a season the country holds its breath. Then the harvest comes in fair and the sky declines to fall, and the prophecy dies quietly of embarrassment"
 dread_takes_hold_desc: "The dread takes root. Fields stand half-worked while penitents walk the roads, and the order's chapels have never been so full"

 religious_orders.111.title: "A Codex out of the Dark"
 religious_orders.111.desc: "Brothers of the [target_order.GetName] at [target_location.GetName], rebinding a worm-eaten psalter, found an older text hidden beneath the boards: a codex copied centuries ago and mourned as lost by every scholar who ever looked for it. The librarian has not slept since, and his letter to us suggests he does not intend to."
 religious_orders.111.a: "Have copies made for our own men."
 religious_orders.111.b: "Let it rest in their library."

 religious_orders.112.title: "Fire in the Scriptorium"
 religious_orders.112.desc_chronicles: "A candle stub and a draught, and the scriptorium of the [target_order.GetName] at [target_location.GetName] was gone by Matins. The chronicles the brothers kept of our deeds, year upon year since before living memory, went up with the shelves that held them. Whatever we have done, there is now far less proof that we did it."
 religious_orders.112.desc_psalters: "The scriptorium of the [target_order.GetName] at [target_location.GetName] burned to the doorframes before dawn, and the great choir books burned with it. The psalters and antiphonaries were the pride of the house, illuminated over generations. The offices will be sung from memory now, and memory falters."
 religious_orders.112.desc_charters: "Fire took the scriptorium of the [target_order.GetName] at [target_location.GetName] in the night, and with it the charters and title-deeds of half the district. Every boundary the brothers ever fixed on vellum is now a matter of opinion, and opinions in such matters are rarely humble."
 religious_orders.112.a: "Rebuild it, shelf and desk."
 religious_orders.112.b: "Ashes teach humility."

 religious_orders.113.title: "Fields from the Waste"
 religious_orders.113.desc: "The brothers of the [target_order.GetName] have spent three winters draining the fen below their grange at [target_location.GetName], and this spring the water finally gave way. Where herons nested there is now black earth, more of it than anyone expected, and the question of whose plow will turn it has arrived with the first dry week."
 religious_orders.113.a: "Let the granges spread."
 religious_orders.113.b: "Settle our own folk on the new furrows."

 religious_orders.114.title: "Murrain in the Byres"
 religious_orders.114.desc: "A murrain has broken out in the byres of the [target_order.GetName] near [target_location.GetName]. The beasts stand trembling with their heads down while the cattle-doctors argue with one another, and the brothers ask us plainly whether to reach for the knife or for the litany."
 religious_orders.114.a: "Slaughter and burn."
 religious_orders.114.b: "Trust to prayer and clean straw."

 murrain_passes_over_desc: "The sickness gutters out within the month. The brothers, who never doubted it would, are gracious enough not to say so too loudly"
 murrain_spreads_desc: "The murrain leaps from the order's byres into every herd in the district, and the litany does nothing to slow its walking pace"

 religious_orders.115.title: "Thunder in the Market Square"
 religious_orders.115.desc: "A friar of the [target_order.GetName] has taken to preaching in the market of [target_location.GetName] at the very hour the moneylenders open their tables. He names no names, and he does not need to. The poor pack the square to hear him, and the lenders have lately taken to arriving late and leaving early."
 religious_orders.115.a: "Let him thunder."
 religious_orders.115.b: "Counsel a gentler sermon."

 religious_orders.116.title: "The Pulpit Turns"
 religious_orders.116.desc: "The same gift that fills a square can just as easily empty a reputation. A friar of the [target_order.GetName] has turned his preaching upon us at [target_location.GetName]: our taxes and our sins, numbered one by one from the pulpit while the crowd keeps count aloud."
 religious_orders.116.a: "Answer him with clemency."
 religious_orders.116.b: "Haul him from the pulpit."

 friar_recants_desc: "In custody the fire goes out of him, and he recants before witnesses. The order is left holding the embarrassment"
 martyr_of_the_square_desc: "He goes to his cell singing, and the square does not forget it. The brothers already speak of him as a martyr, and the town speaks with the brothers"

 religious_orders.117.title: "The Foundling Wheel"
 religious_orders.117.desc: "The brothers of the [target_order.GetName] have set a turning wheel into the wall of their house at [target_location.GetName], where an infant may be left without a name and taken in without a question. The wheel turns more often than the town cares to admit, and the order's cradles are full."
 religious_orders.117.a: "Praise their charity."
 religious_orders.117.b: "Let the parishes take the children."

 religious_orders.118.title: "The Crowded Hospice"
 religious_orders.118.desc: "Fever has come in with the road traffic, and the hospice of the [target_order.GetName] at [target_location.GetName] has thrown its doors open as its rule commands. The sick lie two to a cot and along the cloister walk between them. The town physicians call the place a lamp lit for moths."
 religious_orders.118.a: "Bar the hospice doors."
 religious_orders.118.b: "Charity does not flinch."

 hospice_spared_desc: "The fever burns itself out at the hospice walls as if by appointment. The brothers bury their few dead and observe that the rule proved itself"
 hospice_fever_spreads_desc: "What gathered in the hospice does not stay in the hospice. The fever walks out with the cured and the mourners alike, and the district sickens street by street"

 religious_orders.119.title: "Absolution for the Marches"
 religious_orders.119.desc: "The war is over, and its bill is not yet paid. The confessors of the [target_order.GetName] have asked leave to walk the worst-used districts, hearing what men will not tell their neighbors and absolving what they cannot forget."
 religious_orders.119.a: "Send them among the people."
 religious_orders.119.b: "Their first business is with the mighty."

 religious_orders.120.title: "Absolution, Bought and Sold"
 religious_orders.120.desc_noble: "One of the brothers of the [target_order.GetName] has made a quiet trade of shriving a great house of the [GetEstateName('nobles_estate')] of sins it has not yet finished committing, and a steady march of gifts has kept pace with the absolutions. The chapter blushes. The house in question does not."
 religious_orders.120.desc_merchant: "A brother of the [target_order.GetName] has been selling clean consciences to the counting-houses, absolution priced by the ledger like any other stock in trade. To the [GetEstateName('burghers_estate')], a fair price honestly paid is no sin at all, which is rather the heart of the problem."
 religious_orders.120.desc_prelate: "Among the confessors of the [target_order.GetName] is one whose penances grow noticeably lighter as the sinners grow grander, and every one of his penitents is a fellow churchman absolved of sins the parishes know by heart. The [GetEstateName('clergy_estate')] would prefer we did not look too closely."
 religious_orders.120.a: "Demand the order yield him up."
 religious_orders.120.b: "What is confessed belongs to God."

 religious_orders.201.title: "After the Cabalgada"
 religious_orders.201.desc: "The brothers return from their raid with plunder and captives in tow, and the commandery is of two minds on how to mark the occasion."
 religious_orders.201.a: "Parade the spoils and let the order's zeal for the frontier burn brighter."
 religious_orders.201.b: "Fold the gains quietly into the border's defenses."

 religious_orders.202.title: "A Foothold Among the Infidel"
 religious_orders.202.desc: "Our soldiers have wrested [ro_conquest_location.GetName] from unbelieving hands, and the brothers of [ro_conquest_order.GetName] look upon it with purpose. Where the faith does not yet hold, they would plant a commandery, a house of prayer and the sword upon the new frontier, and ask our leave to raise it."
 religious_orders.202.a: "Let them build their commandery."
 religious_orders.202.b: "The frontier is no place for them yet."
