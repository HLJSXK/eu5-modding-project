l_english:
 italian_renaissance_culture.1.title: "Challenging $FLO_ADJ$ [ShowGoodsNameWithNoTooltip('wool')]"
 italian_renaissance_culture.1.desc: "While the trading guilds of [ShowLocationName('florence')] have long held dominance over the [ShowGoodsName('wool')] trade in [ShowRegionName('italy_region')], recent expansion of [ROOT.GetCountry.GetAdjective] [ShowGoodsNameWithNoTooltip('wool')] production has led to growing confidence amongst the [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] that [ROOT.GetCountry.GetNameWithNoTooltip] may be able to contest the stranglehold $FLO_ADJ$ merchants possess over the markets.\n\nIf the [ROOT.GetCountry.GetGovernment.GetCourtTitle] provides adequate financial backing, some within the [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')] have offered to establish new trading guilds to bolster the growing [ROOT.GetCountry.GetAdjectiveWithNoTooltip] [ShowGoodsNameWithNoTooltip('wool')] industry. However, others in the [ROOT.GetCountry.GetGovernment.GetCourtTitle] favor allowing the [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')] to maintain autonomy over [ShowGoodsNameWithNoTooltip('wool')] production."
 italian_renaissance_culture.1.a: "Entrust establishment of the [ShowGoodsNameWithNoTooltip('wool')] guilds to the [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')]."
 italian_renaissance_culture.1.b: "Uphold [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('peasants_estate')] autonomy over [ShowGoodsNameWithNoTooltip('wool')] production."
 ita_culture_rival_wool_guild_locations.tt: "All [ShowGoodsNameWithNoTooltip('wool')] [locations|e] we own in [ShowRegionName('italy_region')] will receive [ShowModifier('italian_culture_rival_wool_trade')] for 60 years and will be expanded by #G +1.00#! if not already max level"

 italian_renaissance_culture.2.title: "Depopulation of the Countryside"
 italian_renaissance_culture.2.desc: "Ever since the [ShowSituationName('black_death')] swept over our lands, many rural areas in [ROOT.GetCountry.GetName] have been severely depopulated. While [target_location.GetName] was also heavily impacted by the [ShowSituationNameWithNoTooltip('black_death')], many surviving members of our population wish to migrate there in hopes of regaining access to critical resources now unavailable due to the plague.\n\nThough some in the [ROOT.GetCountry.GetGovernment.GetCourtTitle] see this as a chance to further urbanize and rebuild [target_location.GetNameWithNoTooltip], allowing the [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')] to abandon many of these core rural areas throughout [ROOT.GetCountry.GetNameWithNoTooltip] may lead to serious ramifications."
 italian_renaissance_culture.2.a: "Further encourage movement to [target_location.GetNameWithNoTooltip]."
 italian_renaissance_culture.2.b: "Disperse aid to the countryside to slow migrations."

 italian_renaissance_culture.3.title: "Rediscovery of Ancient [ShowCultureNameWithNoTooltip('greek_culture')] Thought"
 italian_renaissance_culture.3.desc: "Ever since the spread of [ShowAgeName('age_2_renaissance')] ideals across [ShowRegionName('italy_region')], there has been a growing interest in the acquisition and translation of ancient [ShowCultureName('greek_culture')] literature among [ShowCultureGroupName('italian_group')] scholars. Seeking to establish [ROOT.GetCountry.GetNameWithNoTooltip] as one of the most prominent states in [ShowRegionNameWithNoTooltip('italy_region')], many advisors in the [ROOT.GetCountry.GetGovernment.GetCourtTitle] have urged [target_character.GetName] to support the reclamation of these ancient works."
 italian_renaissance_culture.3.a: "Encourage the rediscovery of these arts!"
 italian_renaissance_culture.3.b: "Offer the full patronage of the state."
 italian_renaissance_culture.3.c: "Stick to our traditions."
 encourage_humanist_thought_for_rewards_tt: "Encouraging a shift towards [ShowSocietyDirectionName('humanist')] further opens the opportunity for [ROOT.GetCountry.GetCapital.GetName] to become a major center of [ShowSocietyDirectionNameWithNoTooltip('humanist')] thought"

 italian_renaissance_culture.4.title: "[target_location.GetNameWithNoTooltip], A Center of Humanism"
 italian_renaissance_culture.4.desc: "Ever since the ideals of the [ShowAgeName('age_2_renaissance')] swept across [ShowRegionName('italy_region')], there has been a rediscovery of ancient [ShowCultureName('greek_culture')] literature, translated from various manuscripts taken from $BYZ_ADJ$ records. The rediscovery of these ancient texts has led to a dramatic shift among many philosophers across [ShowRegionNameWithNoTooltip('italy_region')], inspiring a new approach to Humanism. With these efforts largely supported by the [ROOT.GetCountry.GetAdjective] [ROOT.GetCountry.GetGovernment.GetCourtTitle], [target_location.GetName] has been transformed into one of the premier centers of [ShowSocietyDirectionName('humanist')] scholarship throughout [ShowRegionNameWithNoTooltip('italy_region')], with many scholars taking up residence within the [target_location.GetRank.GetName]. As the ideals of the [ShowAgeName('age_2_renaissance')] continue to spread, [target_location.GetNameWithNoTooltip] will undoubtedly remain a vital force behind them."
 italian_renaissance_culture.4.a: "[target_location.GetNameWithNoTooltip] shall become a beacon of [ShowSocietyDirectionNameWithNoTooltip('humanist')] thought in [ShowRegionNameWithNoTooltip('italy_region')]."
 italian_renaissance_culture.4.b: "Limit the rising spread of [ShowSocietyDirectionNameWithNoTooltip('humanist')] thought."

 italian_renaissance_culture.5.title: "Rising Artist Attracts the [ROOT.GetCountry.GetGovernment.GetCourtTitle]"
 italian_renaissance_culture.5.desc: "With the [ShowAgeName('age_2_renaissance')] giving rise to many prominent new artists across [ShowRegionName('italy_region')], some within the [ROOT.GetCountry.GetGovernment.GetCourtTitle] have taken notice of [target_artist.GetName], who has garnered serious attention throughout [ROOT.GetCountry.GetCapital.GetName]. Some close advisors to [target_character.GetName] have urged [target_character.GetHimHer] to patronize [target_artist.GetNameWithNoTooltip], as in time [target_artist.GetHeShe] may grow to be one of the most talented artists across [ShowRegionNameWithNoTooltip('italy_region')]."
 italian_renaissance_culture.5.a: "Hire [target_artist.GetHimHer] for the [ROOT.GetCountry.GetGovernment.GetCourtTitle]!"
 italian_renaissance_culture.5.b: "We do not require [target_artist.GetHisHer] services."

 italian_renaissance_culture.6.title: "Spread of [ShowSocietyDirectionNameWithNoTooltip('humanist')] Ideas from [target_location.GetNameWithNoTooltip]"
 italian_renaissance_culture.6.desc: "Prominent scholars from [target_location.GetNameWithNoTooltip] espousing [ShowSocietyDirectionName('humanist')] ideas have taken up residence in [ROOT.GetCountry.GetCapital.GetName], seeking to spread newly translated ancient [ShowCultureName('greek_culture')] literature to the local populace. While some in the [ROOT.GetCountry.GetGovernment.GetCourtTitle] have taken interest in the translated texts, others have urged the [ShowSocietyDirectionNameWithNoTooltip('humanist')] ideas be contained to prevent risks of potential instability."
 italian_renaissance_culture.6.a: "Allow the scholars to spread the translated literature."
 italian_renaissance_culture.6.b: "Limit the spread of the translated literature."

 italian_renaissance_culture.7.title: "Patronage in the New Arts"
 italian_renaissance_culture.7.desc: "Following the [ShowSituationName('black_death')], the trading climate for many  [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] has proven to be costly, with goods being more difficult to transport over longer distances, as well as an increased demand for essentials. However, the spread of the [ShowAgeName('age_2_renaissance')] has led to many within the [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')] patronizing the new arts instead of focusing strictly on trade.\n\nWith artistic patronage proving to be a valuable investment for the [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')], some have urged the [ROOT.GetCountry.GetGovernment.GetCourtTitle] to further support the growth of these new arts."
 italian_renaissance_culture.7.a: "Patronize the growth of these new arts."
 italian_renaissance_culture.7.b: "Allocate the income to the state's coffers instead"

 italian_renaissance_culture.8.title: "Prominent Condottiero in [ROOT.GetCountry.GetCapital.GetNameWithNoTooltip]"
 italian_renaissance_culture.8.desc: "Word has reached the [ROOT.GetCountry.GetGovernment.GetCourtTitle] that the prominent Condottiero [target_character_2.GetNameWithNoTooltip] has arrived in [ROOT.GetCountry.GetCapital.GetName]. Having earned several military victories, [target_character_2.GetNameWithNoTooltip]'s arrival has prompted discussion within the [ROOT.GetCountry.GetGovernment.GetCourtTitle] about seeking [target_character_2.GetHisHer] employment while [target_character_2.GetHeShe] is in [ROOT.GetCountry.GetCapital.GetNameWithNoTooltip], as [target_character_2.GetHisHer] skills in battle may prove instrumental should conflict come to [ROOT.GetCountry.GetName]."
 italian_renaissance_culture.8.a: "Hire [target_character_2.GetNameWithNoTooltip] to ensure the security of [ROOT.GetCountry.GetNameWithNoTooltip]."
 italian_renaissance_culture.8.b: "We do not require [target_character_2.GetHisHer] expertise in warfare."

 italian_renaissance_culture.9.title: "Growing Influence of [ROOT.GetCountry.GetNameWithNoTooltip] Attracts Condottieri"
 italian_renaissance_culture.9.desc: "With the expansion of [ROOT.GetCountry.GetAdjective] influence over [ShowRegionName('italy_region')], many condottieri mercenary companies have reached out to the [ROOT.GetCountry.GetGovernment.GetCourtTitle] in hopes of securing employment. While some members of the [ROOT.GetCountry.GetGovernment.GetCourtTitle] favor hiring them, as the expansion of [ROOT.GetCountry.GetNameWithNoTooltip] has made raising an army more costly, others fear these condottieri are acting out of pure opportunism, looking to make themselves indispensable by fostering overreliance on their soldiers."
 italian_renaissance_culture.9.a: "Seek to curry favor and employ these condottieri mercenaries."
 italian_renaissance_culture.9.b: "We cannot risk owing a debt to these companies."

 italian_renaissance_culture.10.title: "[condottieri_company.GetNameWithNoTooltip] Demand More Payment"
 italian_renaissance_culture.10.desc: "The prominent Condottieri [condottieri_company.GetName] have sent a formal demand to the [ROOT.GetCountry.GetAdjective] [ROOT.GetCountry.GetGovernment.GetCourtTitle] for an expansion of their pay, believing that the state has not rewarded them sufficiently for their talents.\n\nWhile it is unlikely the [condottieri_company.GetNameWithNoTooltip] would outright betray their agreement with [ROOT.GetCountry.GetNameWithNoTooltip], refusing to comply with their demands may render the company less reliable."
 italian_renaissance_culture.10.a: "Appease the demands of [condottieri_company.GetNameWithNoTooltip]."
 italian_renaissance_culture.10.b: "Refuse to grant additional payments to [condottieri_company.GetNameWithNoTooltip]."

 italian_renaissance_culture.11.title: "Spread of $FLO_ADJ$ Culture"
 italian_renaissance_culture.11.desc: "While [ROOT.GetCountry.GetCapital.GetName] is an influential [ROOT.GetCountry.GetCapital.GetRank.GetName], it is no secret that it pales in comparison to the famous [ShowLocationName('florence')], which has grown to be a dominant [ShowLocationRankName('city')] in [ShowRegionNameWithNoTooltip('italy_region')].\n\nSeeking to bolster the prestige of [ROOT.GetCountry.GetCapital.GetNameWithNoTooltip], some members of the [ROOT.GetCountry.GetGovernment.GetCourtTitle] have suggested we adopt aspects of the new cultural architecture in [ShowLocationNameWithNoTooltip('florence')]."
 italian_renaissance_culture.11.a: "Adopt aspects of $FLO_ADJ$ culture."
 italian_renaissance_culture.11.b: "Safeguard the distinct culture of [ROOT.GetCountry.GetCapital.GetNameWithNoTooltip]."

 italian_renaissance_culture.12.title: "Revitalizing the [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('peasants_estate')]"
 italian_renaissance_culture.12.desc: "While all social classes within [ROOT.GetCountry.GetName] were impacted by the [ShowSituationName('black_death')], none were left more devastated than the [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')]. While the years since have seen many within the [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] taking to investing in [ShowAgeName('age_2_renaissance')] art, leading to a cultural rebirth of the [ROOT.GetCountry.GetAdjectiveWithNoTooltip] elite, many of the [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('peasants_estate')] have largely been left reeling from the effects of the [ShowSituationNameWithNoTooltip('black_death')].\n\nIn order to help revitalize the heavily affected [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('peasants_estate')], some sympathetic voices within the [ROOT.GetCountry.GetGovernment.GetCourtTitle] have suggested slashing our patronage of the arts in favor of allocating funds to help them recover."
 italian_renaissance_culture.12.a: "Our Patronage of the Arts will continue unimpeded."
 italian_renaissance_culture.12.b: "Divert funds to aid the weakened [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('peasants_estate')]."

 italian_renaissance_culture.13.title: "[target_artist.GetNameWithNoTooltip] Translates Ancient [ShowCultureNameWithNoTooltip('greek_culture')] Manuscript"
 italian_renaissance_culture.13.desc: "[target_artist.GetName]'s completed translation of an ancient [ShowCultureName('greek_culture')] manuscript has attracted the attention of scholars throughout [ROOT.GetCountry.GetName], with many eager to get their hands on the translated work. However, seeing this as an opportunity to bolster [ROOT.GetCountry.GetAdjectiveWithNoTooltip] prestige, some have urged [target_character.GetName] to support the dissemination of the translated manuscript across [ShowContinentName('europe')]."
 italian_renaissance_culture.13.a: "Praise [target_artist.GetNameWithNoTooltip] for [target_artist.GetHisHer] work on the translation!"
 italian_renaissance_culture.13.b: "Spread [target_artist.GetHisHer] work far and wide!"
 italian_renaissance_culture.13.c: "Keep it restricted to those in the [ROOT.GetCountry.GetGovernment.GetCourtTitle]."

 italian_renaissance_culture.14.title: "[target_artist.GetNameWithNoTooltip]'s Skills Impress the [ROOT.GetCountry.GetGovernment.GetCourtTitle]"
 italian_renaissance_culture.14.desc: "Ever since earning the patronage of the [ROOT.GetCountry.GetGovernment.GetCourtTitle], [target_artist.GetName] has proven to be a valuable asset to [target_character.GetName], with [target_artist.GetHisHer] skills earning praise from the upper echelons. From high-ranking members of the [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] to influential [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')], [target_artist.GetNameWithNoTooltip]'s presence has been felt, and has proven to be a great boon to [target_character.GetNameWithNoTooltip]'s influence."
 italian_renaissance_culture.14.a: "[target_artist.GetHisHer|U] works have greatly enriched the [ROOT.GetCountry.GetGovernment.GetCourtTitle]!"

 italian_renaissance_culture.15.title: "[ShowArtistTypeName('architect')] of Growing Renown"
 italian_renaissance_culture.15.desc: "Having already completed several architectural projects in [ROOT.GetCountry.GetCapital.GetName], [target_artist.GetName] has increased [target_artist.GetHisHer] renown throughout [ROOT.GetCountry.GetName], and has already attracted patronage from many prominent families among the [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]. Some within the [ROOT.GetCountry.GetGovernment.GetCourtTitle] feel we should employ [target_artist.GetHimHer], as [target_artist.GetHeShe] may prove to be an instrumental catalyst in planning an architectural rebirth of [ROOT.GetCountry.GetCapital.GetNameWithNoTooltip] through [target_artist.GetHerHis] use of Classical architectural techniques."
 italian_renaissance_culture.15.a: "Let us offer [target_artist.GetHimHer] the patronage of the state."
 italian_renaissance_culture.15.b: "We have no interest in pursuing architectural projects."

 italian_renaissance_culture.16.title: "[target_artist.GetNameWithNoTooltip] Requests Additional [ROOT.GetCountry.GetGovernment.GetCourtTitle] Resources"
 italian_renaissance_culture.16.desc: "Midway through creating a work inspired by the classical arts, [target_artist.GetName] has requested the [ROOT.GetCountry.GetGovernment.GetCourtTitle] supply [target_artist.GetHimHer] with extra resources. Having expressed that the endeavor has been a greater undertaking than expected, [target_artist.GetHeShe] promises the extra funding for [target_artist.GetHisHer] project will be more than worth the cost, and will bring cultural renown to the [ROOT.GetCountry.GetGovernment.GetCourtTitle]."
 italian_renaissance_culture.16.a: "Offer [target_artist.GetHimHer] the additional resources [target_artist.GetHeShe] needs."
 italian_renaissance_culture.16.b: "We cannot afford this."

 italian_renaissance_culture.17.title: "Disgruntled [target_rival_artist.GetArtistType.GetNameWithNoTooltip] in [target_rival.GetNameWithNoTooltip]"
 italian_renaissance_culture.17.desc: "Though [target_rival_artist.GetName] is employed by our rival, [target_rival.GetName], [target_rival_artist.GetHeShe] has garnered some renown throughout [ShowRegionName('italy_region')] for [target_rival_artist.GetHisHer] works. Recently, however, gossip has spread that [target_rival_artist.GetHeShe] is dissatisfied with the patronage [target_rival.GetNameWithNoTooltip] provides.\n\nSeeing an opportunity to both weaken [target_rival.GetNameWithNoTooltip]'s influence and secure the services of a renowned [target_rival_artist.GetArtistType.GetName], some in the [ROOT.GetCountry.GetGovernment.GetCourtTitle] have urged us to arrange a covert agreement with [target_rival_artist.GetNameWithNoTooltip] in the hopes that [target_rival_artist.GetHeShe] will join our [ROOT.GetCountry.GetGovernment.GetCourtTitle]."
 italian_renaissance_culture.17.a: "Move quickly to employ [target_rival_artist.GetNameWithNoTooltip]!"
 italian_renaissance_culture.17.b: "We dare not hire any artists with ties to [target_rival.GetNameWithNoTooltip]."

 italian_renaissance_culture.18.title: "[target_artist.GetNameWithNoTooltip] and the Art of Oil Painting"
 italian_renaissance_culture.18.desc: "Though the $FLA_ADJ$ artists have produced unique oil paintings, knowledge of this technique has long been confined to the Low Countries. However, [target_artist.GetName] has recently returned from the Low Countries to [ROOT.GetCountry.GetCapital.GetName] hoping to cultivate a distinct [ShowCultureGroupName('italian_group')] tradition of oil painting.\n\nInterested in helping [target_artist.GetHimHer] develop this tradition in [ShowRegionName('italy_region')], many within the [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] have urged [target_character.GetName] to grant [target_artist.GetHimHer] patronage."
 italian_renaissance_culture.18.a: "[target_artist.GetHisHer|U] distinct form of art is worth patronage!"
 italian_renaissance_culture.18.b: "We are not interested in [target_artist.GetHisHer] form of painting."

 italian_renaissance_culture.19.title: "[target_artist.GetNameWithNoTooltip] of [ShowLocationNameWithNoTooltip('florence')]"
 italian_renaissance_culture.19.desc: "Having earned regional acclaim for [target_artist.GetHisHer] works in [ShowLocationName('florence')], [target_artist.GetName] has arrived in [ROOT.GetCountry.GetCapital.GetName], undertaking some commissions for members of the [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]. However, [target_artist.GetHisHer] presence in [ROOT.GetCountry.GetCapital.GetNameWithNoTooltip] has caught the attention of the [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')], who have expressed great interest in [target_artist.GetHisHer] works, and have requested that the [ROOT.GetCountry.GetGovernment.GetCourtTitle] commission [target_artist.GetHimHer] in hopes of extending [target_artist.GetHisHer] stay in [ROOT.GetCountry.GetCapital.GetNameWithNoTooltip].\n\nThat said, being a prominent [ShowArtistTypeName('philosopher')] from [ShowLocationNameWithNoTooltip('florence')], [target_artist.GetNameWithNoTooltip] will expect resources beyond what the [ROOT.GetCountry.GetGovernment.GetCourtTitle] typically provides."
 italian_renaissance_culture.19.a: "Expensive, though [target_artist.GetHisHer] experience will be welcomed."
 italian_renaissance_culture.19.b: "[target_artist.GetShortNameWithNoTooltip] is too expensive for the [ROOT.GetCountry.GetGovernment.GetCourtTitle]."

 italian_renaissance_culture.20.title: "The [target_country.GetLongNameWithNoTooltip] Requests [target_artist.GetNameWithNoTooltip]"
 italian_renaissance_culture.20.desc: "As [target_artist.GetName]'s renown reaches beyond [ShowRegionName('italy_region')], the [target_country.GetGovernment.GetCourtTitle] of the [target_country.GetLongName] has reached out to [ROOT.GetCountry.GetName] in hopes of securing [target_artist.GetNameWithNoTooltip]'s services. Impressed by the tales of [target_artist.GetNameWithNoTooltip]'s works, the [target_country.GetAdjectiveWithNoTooltip] [target_country.GetGovernment.GetCourtTitle] is willing to pay a substantial sum, should [ROOT.GetCountry.GetNameWithNoTooltip] be willing to allow [target_artist.GetNameWithNoTooltip] to take up residence in [target_country.GetNameWithNoTooltip]."
 italian_renaissance_culture.20.a: "Accept the [target_country.GetAdjectiveWithNoTooltip] coin in return for [target_artist.GetShortNameWithNoTooltip]."
 italian_renaissance_culture.20.b: "We shall retain the sole patronage of [target_artist.GetShortNameWithNoTooltip]."

 italian_renaissance_culture.21.title: "Patronage of [ShowAgeNameWithNoTooltip('age_2_renaissance')] Art Too Expensive"
 italian_renaissance_culture.21.desc: "While [ROOT.GetCountry.GetName] have offered extensive patronage to the new arts of the [ShowAgeName('age_2_renaissance')], this patronage has proven detrimental to the state over time. The [ROOT.GetCountry.GetAdjectiveWithNoTooltip] treasury now risks a financial crisis unless we take action, although some in the [ROOT.GetCountry.GetGovernment.GetCourtTitle] still believe that continued patronage will pay off in the long run."
 italian_renaissance_culture.21.a: "Reduce the state's patronage of the arts to preserve the treasury."
 italian_renaissance_culture.21.b: "We must continue our patronage of the arts!"

 italian_renaissance_culture.22.title: "[target_location.GetNameWithNoTooltip], A Center of [ShowAgeNameWithNoTooltip('age_2_renaissance')] Art and Culture"
 italian_renaissance_culture.22.desc: "While it has proven to be a significant financial undertaking for the [ROOT.GetCountry.GetLongName], [target_location.GetName] has grown to become one of the key centers of [ShowAgeName('age_2_renaissance')] art in [ShowRegionName('italy_region')], if not all of [ShowContinentName('europe')]. Prominent artists and scholars all across [ShowContinentNameWithNoTooltip('europe')] are eager to visit the [target_location.GetRank.GetName], with many spreading tales of how [target_location.GetNameWithNoTooltip] has been transformed by this era."
 italian_renaissance_culture.22.a: "[target_location.GetNameWithNoTooltip] shall shine as a center of art and culture in the centuries to come!"
 italian_renaissance_culture.22.b: "Leverage [target_location.GetNameWithNoTooltip]'s newfound prominence to bolster our prestige"

 italian_renaissance_culture.23.title: "[ShowWorkOfArtNameWithNoTooltip('boccaccio_on_the_fates_of_famous_men')]"
 italian_renaissance_culture.23.desc: "[target_artist.GetName], one of the leading figures of the [ShowAgeName('age_2_renaissance')], has completed yet another impressive work. Titled [ShowWorkOfArtName('boccaccio_on_the_fates_of_famous_men')], it covers many prominent people from the Biblical and Classical eras, as well as key figures of the past century. A rather exquisite collection — should the [ROOT.GetCountry.GetGovernment.GetCourtTitle] wish to part with it, [target_artist.GetLastNameWithNoTooltip]'s work would likely command a substantial sum."
 italian_renaissance_culture.23.a: "A wondrous collection of historical figures."
 italian_renaissance_culture.23.b: "Offer [target_artist.GetHisHer] work to the [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')] for a high price."

 italian_renaissance_culture.24.title: "[ShowWorkOfArtNameWithNoTooltip('boccaccio_the_decameron')]"
 italian_renaissance_culture.24.desc: "Having witnessed the horrors of the [ShowSituationName('black_death')], [target_artist.GetName] was inspired to complete  [ShowWorkOfArtName('boccaccio_the_decameron')], attracting sizable interest from the [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] of [ROOT.GetCountry.GetName]. Set in [ShowLocationName('florence')], the story follows ten $FLO_ADJ$ individuals who flee to the countryside to escape the plague. Some among the [ROOT.GetCountry.GetGovernment.GetCourtTitle] believe we should make an effort to spread [target_artist.GetLastNameWithNoTooltip]'s work far and wide."
 italian_renaissance_culture.24.a: "An enticing collection of stories! We should disseminate [target_artist.GetHisHer] work."
 italian_renaissance_culture.24.b: "Offer ownership of the piece to the [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]."

 italian_renaissance_culture.25.title: "[ShowWorkOfArtNameWithNoTooltip('boccaccio_concerning_famous_women')]"
 italian_renaissance_culture.25.desc: "Akin to [target_artist.GetHisHer] previous work [ShowWorkOfArtName('boccaccio_on_the_fates_of_famous_men')], [target_artist.GetName] has published yet another volume about famous figures from history, although this time focused on prominent women. Much of the [ROOT.GetCountry.GetGovernment.GetCourtTitle] is surprised by the interest [target_artist.GetLastNameWithNoTooltip] has shown to these figures, but like many of [target_artist.GetHisHer] previous works, [ShowWorkOfArtName('boccaccio_concerning_famous_women')] would undoubtedly prove a valuable piece should our finances run short."
 italian_renaissance_culture.25.a: "It shall remain a prized work within the [ROOT.GetCountry.GetGovernment.GetCourtTitle]."
 italian_renaissance_culture.25.b: "Host a [ROOT.GetCountry.GetGovernment.GetCourtTitle] auction to sell off the [ShowWorkOfArtTypeNameWithNoTooltip('chronicle')]."

 italian_renaissance_culture.26.title: "Rise of [target_character_2.GetNameWithNoTooltip]"
 italian_renaissance_culture.26.desc: "Having played an influential role in [ShowLocationName('florence')] for some time now, [target_character_2.GetName] has proven to be both a competent individual and a spreader of [ShowAgeName('age_2_renaissance')] [ShowSocietyDirectionName('humanist')] thought. As [target_character_2.GetNameWithNoTooltip] has earned praise and acclaim from members of the [ROOT.GetCountry.GetGovernment.GetCourtTitle], some have suggested that [target_character.GetName] grant [target_character_2.GetNameWithNoTooltip] a special position in the [ROOT.GetCountry.GetGovernment.GetCabinetTitle]."
 italian_renaissance_culture.26.a: "Give [target_character_2.GetHimHer] a role in the [ROOT.GetCountry.GetGovernment.GetCourtTitle]."
 italian_renaissance_culture.26.b: "[target_character_2.GetHeShe] would make a fine [ROOT.GetCountry.GetGovernment.GetCabinetMemberTitle] of the [ROOT.GetCountry.GetGovernment.GetCabinetTitle]."
 italian_renaissance_culture.26.c: "Do not bestow any special privileges on [target_character_2.GetHimHer]."

 italian_renaissance_culture.27.title: "[target_artist.GetNameWithNoTooltip]"
 italian_renaissance_culture.27.desc: "Although [target_artist.GetHeShe] has earned recognition across [ShowRegionName('italy_region')] over the past few years, [target_artist.GetName]'s recent residence in [ROOT.GetCountry.GetCapital.GetName] has earned acclaim across the [ROOT.GetCountry.GetCapital.GetRank.GetName], with many among the wealthier population embracing [target_artist.GetHisHer] particular brand of secular education. While some of the [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] have expressed annoyance with [target_artist.GetHisHer] teaching practices, others have urged [target_character.GetName] to offer [target_artist.GetNameWithNoTooltip] full residence in [ROOT.GetCountry.GetName]."
 italian_renaissance_culture.27.a: "Hire [target_artist.GetHimHer]!"
 italian_renaissance_culture.27.b: "[target_artist.GetHisHer|U] ideas are too radical."

 italian_renaissance_culture.28.title: "Founding of Casa Gioiosa"
 italian_renaissance_culture.28.desc: "Ever since being granted full residence in [ROOT.GetCountry.GetName], [target_artist.GetName] has brought [target_artist.GetHisHer] teachings to many within [target_location.GetName]. Due to [target_artist.GetHisHer] renown and influence in [target_location.GetNameWithNoTooltip], [target_artist.GetNameWithNoTooltip] now seeks financial aid from the [ROOT.GetCountry.GetGovernment.GetCourtTitle] to establish a new school, the #italic Casa Gioiosa#!.\n\nAlthough it would be an expensive endeavor, a new [ShowBuildingTypeNameWithNoTooltip('art_school')] in [target_location.GetNameWithNoTooltip] would increase [ROOT.GetCountry.GetAdjectiveWithNoTooltip] prestige across all of [ShowRegionName('italy_region')]."
 italian_renaissance_culture.28.a: "Commission the founding of the [ShowBuildingTypeNameWithNoTooltip('art_school')]!"
 italian_renaissance_culture.28.b: "Advocate to instead have Casa Gioiosa founded as a new [ShowBuildingTypeNameWithNoTooltip('university')]."
 italian_renaissance_culture.28.c: "We do not have the funds for the project."

 italian_renaissance_culture.29.title: "[target_artist.GetNameWithNoTooltip]"
 italian_renaissance_culture.29.desc: "A prominent student of [target_artist_2.GetName], [target_artist.GetName] has earned a reputation for being one of the leading scholars in [ShowRegionName('italy_region')], and is particularly skilled at translating ancient [ShowCultureName('greek_culture')] manuscripts. Now that [target_artist.GetNameWithNoTooltip] has arrived in [ROOT.GetCountry.GetCapital.GetName], [target_artist.GetSheHe] has expressed interest in securing the patronage of the [ROOT.GetCountry.GetAdjective] [ROOT.GetCountry.GetGovernment.GetCourtTitle] to continue this work on recently uncovered [ShowCultureNameWithNoTooltip('greek_culture')] manuscripts."
 italian_renaissance_culture.29.a: "Hire [target_artist.GetHimHer]!"
 italian_renaissance_culture.29.b: "We do not want to patronize [target_artist.GetHisHer] work!"

 italian_renaissance_culture.30.title: "[target_artist.GetNameWithNoTooltip]"
 italian_renaissance_culture.30.desc: "While the spread of oil painting across [ShowRegionName('italy_region')] is still largely in its infancy, the [ShowArtistTypeName('painter')] [target_artist.GetName] has proven to be one of its most adept practitioners, with many of [target_artist.GetHisHer] paintings already the prized possessions of various [ShowCultureGroupName('italian_group')] courts.\n\nMany of the [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] and [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] have urged [target_character.GetName] to offer patronage to adorn the [ROOT.GetCountry.GetGovernment.GetCourtTitle] with [target_artist.GetHisHer] unique paintings."
 italian_renaissance_culture.30.a: "[target_artist.GetHisHer|U] paintings would bolster the prestige of the [ROOT.GetCountry.GetGovernment.GetCourtTitle]."
 italian_renaissance_culture.30.b: "We cannot afford to patronize [target_artist.GetHimHer]."