l_english:
 iberian_culture.1.title: "Songs of the Reconquista"
 iberian_culture.1.desc: "Our clashes with the infidel have inspired minstrels and common folk alike to compose songs celebrating the bravery of our soldiers, who fight for the triumph of the [ShowReligionGroupAdjective('christian')|U] cause. As these tunes spread throughout the [ROOT.GetCountry.GetFlavorRank], they could be a useful tool for us — to inspire our soldiers in battle and, perhaps, to convince more men to join our ranks."
 iberian_culture.1.a: "Let them be heard on the battlefield!"
 iberian_culture.1.b: "They shall inspire our recruitment!"
 
 iberian_culture.2.title: "Hero of the Reconquista"
 iberian_culture.2.desc: "Among the many brave souls who have fought in the war against [GetCountry('GRA').GetName] stands [new_general.GetName], who has distinguished [new_general.GetHerselfHimself] through courage and skill in battle. [new_general.GetHerHis|U] reputation now precedes [new_general.GetHerHim] throughout the [ROOT.GetCountry.GetFlavorRank], and many argue that such talent should be rewarded with a command worthy of [new_general.GetHerHis] accomplishments."
 iberian_culture.2.a: "[new_general.GetSheHe|U] shall command our armies."
 iberian_culture.2.b: "We shall utilize [new_general.GetHerHis] skills elsewhere."
 
 iberian_culture.3.title: "Settlement of the South"
 iberian_culture.3.desc: "As [ShowAreaName('granada_area')] has finally been liberated from the [ShowReligionGroupAdjective('muslim')] rule, many families have begun looking toward these lands in search for opportunity. Recently, we have heard reports of people from [origin_province.GetName], who are drawn by promises of abandoned lands and chances to build new lives in [target_province.GetName]."
 iberian_culture.3.a: "Allow their migration."
 iberian_culture.3.b: "Try to limit the number of settlers." 
 
 iberian_culture.4.title: "Miracle of the Virgin Mary"
 iberian_culture.4.desc: "News has spread of a miracle said to have occured in [target_location.GetName]. According to local accounts, the blessed Virgin Mary has appeared upon a hillside overlooking the settlement. Although some are skeptical of the miracle, it has nonetheless attracted pilgrims from near and far. The streets are now crowded with travelers from whom the locals eagerly profit. Many offerings have poured into the local coffers, and how these newfound riches should be used is hotly debated."
 iberian_culture.4.a: "Reinvest the money locally."
 iberian_culture.4.b: "Give the offerings to the [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]."
 iberian_culture.4.c: "Distribute alms to the poor."
 iberian_culture.4.d: "The [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] shall oversee these donations."
 
 iberian_culture.5.title: "Return from the Northern Seas"
 iberian_culture.5.desc: "The [ShowCultureName('basque')] whalers have returned from another expedition to the distant northern seas. Having braved treacherous storms and waters unknown to most sailors, they have brought home both valuable cargo and a wealth of practical knowledge. Members of the [ROOT.GetCountry.GetGovernment.GetCourtTitle] now debate how these lessons should be applied."
 iberian_culture.5.a: "Every voyage should learn from the last."
 iberian_culture.5.b: "The ocean offers endless opportunities."
 
 iberian_culture.6.title: "Skilled Mudéjar Artist"
 iberian_culture.6.desc: "It has been brought to our attention that [target_character.GetName], a skilled [ShowReligionGroupAdjective('muslim')] artist, has been gaining acclaim throughout the [ROOT.GetCountry.GetFlavorRank]. Members of the [ROOT.GetCountry.GetGovernment.GetCourtTitle] suggest inviting [target_character.GetHimHer] into our service, though many among the [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] object to granting such prestige to a Mudéjar."
 iberian_culture.6.a: "Talent is not defined by faith."
 iberian_culture.6.b: "Such honors belong to [ShowReligionGroupAdjective('christian')|U] subjects."
 
 iberian_culture.7.title: "Dispute at the Market"
 iberian_culture.7.desc: "Tensions have erupted in [target_location.GetName], where [ShowReligionAdjective('sunni')] and [ShowReligionAdjective('catholic')] merchants accuse one another of receiving unfair treatment from local officials and guilds. The [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] has been requested to step in and mediate this dispute."
 iberian_culture.7.a: "Justice must prevail."
 iberian_culture.7.a.tt1: "All [ShowReligionAdjective('sunni')] [pops|e] in [target_location.GetName] gain [ShowNamedValue('pop_satisfaction_mild_bonus')|+=2%] [pop_satisfaction|e]"
 iberian_culture.7.a.tt2: "All [ShowReligionAdjective('catholic')] [pops|e] in [target_location.GetName] lose [ShowNamedValue('pop_satisfaction_mild_penalty')|+=2%] [pop_satisfaction|e]"
 iberian_culture.7.b: "We must protect our own."
 iberian_culture.7.b.tt1: "All [ShowReligionAdjective('sunni')] [pops|e] in [target_location.GetName] lose [ShowNamedValue('pop_satisfaction_mild_penalty')|+=2%] [pop_satisfaction|e]"
 iberian_culture.7.b.tt2: "All [ShowReligionAdjective('catholic')] [pops|e] in [target_location.GetName] gain [ShowNamedValue('pop_satisfaction_mild_bonus')|+=2%] [pop_satisfaction|e]"
 iberian_culture.7.c: "They should resolve this on their own."
 
 iberian_culture.8.title: "Dispute Over Mudéjar Traditions"
 iberian_culture.8.desc: "In [target_location.GetName], local [ShowReligionAdjective('sunni')] people have once again gathered to celebrate one of their traditional festivals, a custom that has existed for generations. Although many see the festivities as a harmless part of everyday life, representatives of the [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] pressure us to forbid these celebrations, as such public displays undermine the [ShowReligionAdjective('catholic')] character of the [ROOT.GetCountry.GetFlavorRank]."
 iberian_culture.8.a: "Let the festival continue."
 iberian_culture.8.a.tt: "All [ShowReligionAdjective('sunni')] [pops|e] in [target_location.GetName] gain [ShowNamedValue('pop_satisfaction_mild_bonus')|+=2%] [pop_satisfaction|e]"
 iberian_culture.8.b: "Put an end to the celebration."
 iberian_culture.8.b.tt: "All [ShowReligionAdjective('sunni')] [pops|e] in [target_location.GetName] lose [ShowNamedValue('pop_satisfaction_severe_penalty')|+=2%] [pop_satisfaction|e]"
 
 iberian_culture.9.title: "Prosperous Mudéjar Quarter"
 iberian_culture.9.desc: "The Mudéjar quarter of [target_location.GetName] has been flourishing, attracting many craftsmen and merchants whose industry has brought new prosperity to the settlement. Though its growing wealth benefits the local economy, some local elites have begun to worry that the community's increasing influence may one day rival their own."
 iberian_culture.9.a: "Prosperity benefits them all."
 iberian_culture.9.b: "Seize a portion of their wealth to limit their influence."
 iberian_culture.9.b.tt: "All [ShowReligionAdjective('sunni')] [pops|e] in [target_location.GetName] lose [ShowNamedValue('pop_satisfaction_severe_penalty')|+=2%] [pop_satisfaction|e]"
 
 iberian_culture.10.title: "Renowned Mudéjar Physicians"
 iberian_culture.10.desc: "Mudéjar physicians have been lately gaining widespread acclaim across the [ROOT.GetCountry.GetFlavorRank], and many of the [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] have found themselves increasingly reliant on their expertise. Some of our advisors now suggest that they should be formally appointed as physicians to the [ROOT.GetCountry.GetGovernment.GetCourtTitle]; however, influential members of the [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] strongly oppose this suggestion."
 iberian_culture.10.a: "Skill matters more than creed."
 iberian_culture.10.b: "Appoint a [ShowReligionGroupAdjectiveWithNoTooltip('christian')|U] physician instead."
 
 iberian_culture.11.title: "Conversos Under Suspicion"
 iberian_culture.11.desc: "News has reached the [ROOT.GetCountry.GetGovernment.GetCourtTitle] that [target_character.GetName], a skilled merchant whose family has previously converted from [ShowReligionName('judaism')], has been accused of continuing to secretly practice the rites of the former faith. While the report states that there have been observances of forbidden prayers and secret gatherings, others argue that these accusations are born of envy and debt disputes."
 iberian_culture.11.a: "Our religious courts must investigate these heresies."
 iberian_culture.11.b: "These are slanderous accusations!"
 
 iberian_culture.12.title: "[ShowCultureNameWithNoTooltip('sephardi')] Merchants Accused"
 iberian_culture.12.desc: "Several prominent [ShowCultureName('sephardi')] merchants from [target_location.GetName] have been accused of amassing wealth through illicit practices, such as exploiting loopholes in taxation, engaging in usurious lending, or manipulating prices for their own benefit. Though these accusations come from their trade rivals and we cannot know for a fact that they are true, we must act before the conflict escalates any further."
 iberian_culture.12.a: "Confiscate their wealth."
 iberian_culture.12.a.tt: "All [ShowCultureName('sephardi')] [ShowPopTypeName('burghers')] [pops|e] in [target_location.GetName] lose [ShowNamedValue('pop_satisfaction_severe_penalty')|+=2%] [pop_satisfaction|e]"
 iberian_culture.12.b: "We cannot act based on no evidence."
 iberian_culture.12.b.tt: "All non-[ShowCultureName('sephardi')] [ShowPopTypeName('burghers')] [pops|e] in [target_location.GetName] lose [ShowNamedValue('pop_satisfaction_severe_penalty')|+=2%] [pop_satisfaction|e]"
 
 iberian_culture.13.title: "Combating Heat and Plague"
 iberian_culture.13.desc: "In the southern regions of our [ROOT.GetCountry.GetFlavorRank], people have developed a tradition of whitewashing their homes with slaked lime to help keep their homes cool in intense sunlight. It is also believed to help prevent the spread of diseases. People of [target_location.GetName] have recently been struggling with a lack of slaked lime, and have turned to the [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')], requesting aid in protecting their homes."
 iberian_culture.13.a: "Ensure they get enough slaked lime."
 iberian_culture.13.a.tt: "All [pops|e] in [target_location.GetName] gain [ShowNamedValue('pop_satisfaction_mild_bonus')|+=2%] [pop_satisfaction|e]"
 iberian_culture.13.b: "We can spare no coin."
 iberian_culture.13.b.tt: "All [pops|e] in [target_location.GetName] lose [ShowNamedValue('pop_satisfaction_severe_penalty')|+=2%] [pop_satisfaction|e]"
 
 iberian_culture.14.title: "Dispute Over Cañadas Reales"
 iberian_culture.14.desc: "As the seasons shift, millions of sheep are driven along the Cañadas Reales, the historic royal shepherding highways that span our countryside. However, inhabitants of [target_location.GetName] refuse to let the herders pass through their settlement, fearing that the animals will trample their fields."
 iberian_culture.14.a: "Uphold the herders' ancient right of way."
 iberian_culture.14.a.tt: "All [ShowPopTypeName('peasants')] [pops|e] in [target_location.GetName] lose [ShowNamedValue('pop_satisfaction_severe_penalty')|+=2%] [pop_satisfaction|e]"
 iberian_culture.14.b: "Settle the dispute in favor of the locals."
 
 iberian_culture.15.title: "Clash in the Water Tribunal"
 iberian_culture.15.desc: "The traditional Water Tribunal has recently been dealing with a dispute between [target_location_1.GetName] and [target_location_2.GetName]. Under the scorching summer sun, the region lacks enough water to fully sustain the fields in both settlements, and so their inhabitants have been arguing over the distribution rights."
 iberian_culture.15.a: "[target_location_1.GetNameWithNoTooltip] must be prioritized."
 iberian_culture.15.b: "The fields in [target_location_2.GetNameWithNoTooltip] are more important."
 iberian_culture.15.c: "The water shall be distributed evenly."
 
 iberian_culture.16.title: "Protection of the Fueros"
 iberian_culture.16.desc: "Our tax collector that was sent to [target_location.GetName] has been physically barred from entering the town by local magistrates. The regional elites invoke their ancient #italic fueros#!, legal privileges granting them complete immunity from [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] taxes unless explicitly approved by their own assembly."
 iberian_culture.16.a: "Respect the charters."
 iberian_culture.16.b: "The needs of the state are absolute!"
 
 iberian_culture.17.title: "Bandits of the Sierra"
 iberian_culture.17.desc: "News have reached the [ROOT.GetCountry.GetGovernment.GetCourtTitle] that heavily armed outlaws have taken control of rugged mountain passes surrounding [target_location.GetName]. They keep plundering caravans and shipments, which severely chokes commerce throughout the region. If left unchecked, more people might be encouraged to join banditry."
 iberian_culture.17.a: "We have no men to spare."
 iberian_culture.17.b: "Organize an expedition to sweep them."
 
 iberian_culture.18.title: "The Mudéjar Art"
 iberian_culture.18.desc: "For centuries, people in [ShowRegionName('iberia_region')] have admired the [ShowReligionGroupAdjective('muslim')] architectural style prevalent during the days of al-'Andalus. Many architects started incorporating various techniques of Mudéjar art into Romanesque and Gothic buildings, be it geometric ornamentation or ornamental plasterwork. Recently, [target_artist.GetName], who serves the [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')], has requested a permit from the throne to incorporate this style into royal commissions."
 iberian_culture.18.a: "Approve their work."
 iberian_culture.18.b: "[ShowReligionGroupAdjectiveWithNoTooltip('muslim')] art should not be associated with the throne."
 
 iberian_culture.19.title: "The Hispanic Gothic"
 iberian_culture.19.desc: "Builders from across the [ROOT.GetCountry.GetFlavorRank] have begun to develop an architecture style unlike any other in Christendom. Inspired by the soaring cathedrals of Western nations and the sturdy building traditions of our own lands, they have created monuments that proclaim both the glory of God and the greatness of [ROOT.GetCountry.GetName]. This style that has come to be known as the Hispanic Gothic could leave its mark on the landscape for centuries, should we decide to patronize it."
 iberian_culture.19.a: "Let stone proclaim our glory!"
 iberian_culture.19.b: "Our resources are better spent elsewhere."
 
 iberian_culture.20.title: "The Protorrenacimiento"
 iberian_culture.20.desc: "New artistic ideas known as the [ShowInstitutionNameWithNoTooltip('renaissance')] have begun to reach our [ROOT.GetCountry.GetFlavorRank] from [ShowRegionName('italy_region')], and in response, many of our architects and painters have woven these influences together with our home traditions. Many now commission works influenced by this emerging style, and perhaps if encouraged, this new artistic movement could usher in an age of prosperity and innovation."
 iberian_culture.20.a: "Embrace this new tradition."
 iberian_culture.20.b: "Preserve our old traditions."
 
 iberian_culture.21.title: "Conversion of the New Christians"
 iberian_culture.21.desc: "A considerable number of the [ShowReligionAdjective('judaism')] population of [target_location.GetName] have decided to voluntarily accept baptism into the [ShowReligionName('catholic')] faith. While many celebrate these converts as proof of the Church's success, others remain skeptical of their sincerity, referring to them as New Christians to distinguish them from those whose families have long professed the faith."
 iberian_culture.21.a: "Welcome them into the faith."
 iberian_culture.21.b: "Force more of them to convert."
 iberian_culture.21.b.tt: "All [ShowReligionAdjective('judaism')] [pops|e] in [target_location.GetName] lose [ShowNamedValue('pop_satisfaction_mild_penalty')|+=2%] [pop_satisfaction|e]"
 
 iberian_culture.22.title: "The Running of the Bulls"
 iberian_culture.22.desc: "The people of [ShowLocationName('cuellar')], a settlement which is believed to have the oldest bull-running festival in [ShowRegionName('iberia_region')], are struggling to finance their annual celebration. They have turned to the [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] for the funds, promising that should we subsidize them, the festival will be dedicated to [target_ruler.GetName] instead of the Virgin of the Rosary, their Patron saint who the festival usually celebrates."
 iberian_culture.22.a: "We must help them!"
 iberian_culture.22.b: "We cannot support this barbaric festivity!"
 iberian_culture.22.b.tt: "All [pops|e] in [ShowLocationName('cuellar')] lose [ShowNamedValue('pop_satisfaction_severe_penalty')|+=2%] [pop_satisfaction|e]"
 
 iberian_culture.23.title: "The Cult of Alumbrados"
 iberian_culture.23.desc: "Disturbing reports have begun to reach the [ROOT.GetCountry.GetGovernment.GetCourtTitle] and the ecclesiastical hierarchy of a strange mystical brotherhood, which is quietly gaining members throughout the [ROOT.GetCountry.GetFlavorRank]. Calling themselves the Illuminated, they claim that the truly faithful may receive divine enlightenment directly from the Holy Spirit, rendering priests, sacraments, pilgrimages, and even the Holy Mass unnecessary. Representatives of the [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] are worried that their teachings resemble Protestant heresies, and call for launching an investigation."
 iberian_culture.23.a: "Crack down on the Illuminated."
 iberian_culture.23.b: "Not every rumor conceals a heretic."
 iberian_culture.23.b.tt: "If left unchecked, the influence of the Cult might spread further"
 
 iberian_culture.24.title: "The Mask Falls"
 iberian_culture.24.desc: "Our reluctance to investigate the rumors surrounding the Illuminated has proven to be a mistake. The Cult's influence has greatly grown in [target_province.GetName], and they have openly confessed adherence to the [ShowReligionAdjective('lutheran')] heresies. [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] now accuses the [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] of ignoring warnings and requests for investigation, arguing that decisive action would have prevented this outbreak of heresy."
 iberian_culture.24.a: "We cannot persecute every dissenter."
 iberian_culture.24.a.tt: "15% of all [ShowReligionAdjective('catholic')] [pops|e] in [target_province.GetName] will convert to [ShowReligionName('lutheran')]"
 iberian_culture.24.a.tt2: "All [ShowReligionAdjective('catholic')] [pops|e] in [target_province.GetName] lose [ShowNamedValue('pop_satisfaction_severe_penalty')|+=2%] [pop_satisfaction|e]"
 iberian_culture.24.b: "They were right, and we must act in prudence."
 iberian_culture.24.b.tt: "5% of all [ShowReligionAdjective('catholic')] [pops|e] in [target_province.GetName] will convert to [ShowReligionName('lutheran')]"
 iberian_culture.24.b.tt2: "All [pops|e] in [target_province.GetName] lose [ShowNamedValue('pop_satisfaction_mild_penalty')|+=2%] [pop_satisfaction|e]"
 
 iberian_culture.25.title: "Preserving the [ShowBuildingTypeNameWithNoTooltip('irrigation_systems')]"
 iberian_culture.25.desc: "The [ShowReligionGroupAdjective('muslim')] rule over [ShowAreaName('granada_area')] saw the consuctuction of intricate [ShowBuildingTypeName('irrigation_systems')] that carry precious water from the Sierra Nevada to the fields and orchards of fertile valleys. Fighting over the region has done a sigificant damage to these systems upon which the locals have long depended for their livelihoods."
 iberian_culture.25.a: "Sponsor their reconstruction."
 iberian_culture.25.b: "We cannot afford this investment."
 
 iberian_culture.26.title: "The Road to Santiago"
 iberian_culture.26.desc: "Each year, thousands of pilgrims set out on the long journey to [ShowLocationName('santiago_compostela')]. Their passage has brought prosperity to countless settlements, but the journey remains difficult as many roads and bridges along the way have fallen into disrepair. Locals of [target_location.GetName] have petitioned the [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] to improve the roads leading to Compostela, arguing that this would both encourage devotion and strengthen commerce throughout the [ROOT.GetCountry.GetFlavorRank]."
 iberian_culture.26.a: "Spare no expense for the pilgrims."
 iberian_culture.26.b: "We have greater priorities at the moment."
 
 iberian_culture.27.title: "Fading Tradition"
 iberian_culture.27.desc: "For generations, troubadours of [ShowAreaName('galicia_area')] have sung their traditional #italic cantigas#! in [ShowDialectName('galician_dialect')], a prestigious literary language whose influence expanded far beyond the borders of [ShowAreaNameWithNoTooltip('galicia_area')]. However, since that tongue is not the [ROOT.GetCountry.GetGovernment.GetCourtTitle] language of [ROOT.GetCountry.GetName], this tradition has been slowly fading away."
 iberian_culture.27.a: "Patronize the preservation of this tradition."
 iberian_culture.27.b: "Strengthen the use of our language."
 
 iberian_culture.28.title: "Fishing Brotherhoods"
 iberian_culture.28.desc: "The fishermen of [target_location.GetName] have organized themselves into a guild they call the Fishing Brotherhood. Its purpose is reported to be fishing regulation, preservation of maritime knowledge, and protection of interests of those who brave the waters. It is also a pillar of the local community that ensures resilience in times of hardship by providing aid to its members and their families."
 iberian_culture.28.a: "Strengthen their guild."
 iberian_culture.28.b: "We need their expertise for the navy."
 
 iberian_culture.29.title: "Prosperity of Valencian [ShowGoodsNameWithNoTooltip('silk')]"
 iberian_culture.29.desc: "The weavers of [ShowLocationName('valencia')] have become famous for their fine [ShowGoodsName('silk')] fabrics, which are admired across [ShowContinentName('europe')]. The wealth generated by this flourishing industry has filled the coffers of merchants and the [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] alike, though the [ROOT.GetCountry.GetGovernment.GetCourtTitle] is divided about how this wealth should be used."
 iberian_culture.29.a: "Invest it in local industry."
 iberian_culture.29.b: "These riches must serve the [ROOT.GetCountry.GetFlavorRank]."
 
 iberian_culture.30.title: "The Vines of Rioja"
 iberian_culture.30.desc: "Along the fertile valleys of the Ebro, the vineyards of Rioja have flourished for generations. These lands produce wines of exceptional quality, and this has attracted the attention of our [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')], who now see an opportunity to create a major industry by expanding vineyards across the [ROOT.GetCountry.GetFlavorRank], but [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')] protest that this could disrupt local customs that have guided winemaking for centuries."
 iberian_culture.30.a: "Let us spread our vineyards."
 iberian_culture.30.b: "Protect our winemaking traditions."