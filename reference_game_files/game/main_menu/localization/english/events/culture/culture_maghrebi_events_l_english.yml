l_english:
  # Estate related
 maghrebi_culture_masters_of_sahara_country_bonus: "The following bonus can be gained from the\n$maghreb_masters_of_the_sahara.title$ [decision|e]:"
 maghrebi_culture_masters_of_sahara_desert_location_bonus: "The following bonus can be gained from the\n$maghreb_masters_of_the_sahara.title$ [decision|e] and will affect [ShowVegetationName('desert')] [locations|e]:"
 maghrebi_culture_masters_of_sahara_arid_location_bonus: "The following bonus can be gained from the\n$maghreb_masters_of_the_sahara.title$ [decision|e] and will affect [ShowClimateName('arid')] [locations|e]:"
 # Estate end

 maghrebi_culture.1.title: "[ShowReligionAdjectiveWithNoTooltip('judaism')] Community of [target_location.GetNameWithNoTooltip]"
 maghrebi_culture.1.desc: "Although much of the [ShowCultureName('mustaarabi')] populace of the [ShowRegionName('maghreb_region')] was driven away during the rule of the Almohads, [target_location.GetName] has emerged as a center in which many [ShowCultureNameWithNoTooltip('mustaarabi')] have taken refuge once again. While the [ROOT.GetCountry.GetAdjective] [ROOT.GetCountry.GetGovernment.GetCourtTitle] has taken a more tolerant policy towards [ShowReligionAdjective('judaism')], some of the more radical [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] have expressed interest in readopting discarded Almohad doctrine."
 maghrebi_culture.1.a: "[target_location.GetNameWithNoTooltip] will remain a haven for the [ShowCultureNameWithNoTooltip('mustaarabi')]."
 maghrebi_culture.1.b: "Appeal to the radical [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')], and force them to adopt [ROOT.GetCountry.GetReligion.GetNameWithNoTooltip]."

 maghrebi_culture.2.title: "The [ShowReligionAdjectiveWithNoTooltip('ibadi')] Lands of the [ShowRegionNameWithNoTooltip('maghreb_region')]"
 maghrebi_culture.2.desc: "While it has been quite some time since a powerful [ShowReligionAdjectiveWithNoTooltip('ibadi')] state has held influence across the [ShowRegionName('maghreb_region')], [our_ruler.GetName] has taken great steps to consolidate the remaining states that still hold true to [ShowReligionAdjective('ibadi')] beliefs. Though the lands of [ROOT.GetCountry.GetName] are not as wealthy as some of the more developed states within the [ShowRegionNameWithNoTooltip('maghreb_region')], [our_ruler.GetShortNameWithNoTooltip] success may yet lead to the culmination of a new [ShowReligionAdjectiveWithNoTooltip('ibadi')] state."
 maghrebi_culture.2.a: "We shall pave the way for a strong [ShowReligionAdjectiveWithNoTooltip('ibadi')] state in the [ShowRegionNameWithNoTooltip('maghreb_region')]!"
 maghrebi_culture.2.b: "We should instead focus on forging our own path."

 maghrebi_culture.3.title: "Resurgence of [ShowReligionAdjectiveWithNoTooltip('ibadi')] Rule Across the [ShowRegionNameWithNoTooltip('maghreb_region')]"
 maghrebi_culture.3.desc: "[our_ruler.GetName] has managed to do the impossible and carve out a new [ShowReligionAdjective('ibadi')] realm within the [ShowRegionName('maghreb_region')]. With [ROOT.GetCountry.GetName] now one of the main powers in the [ShowRegionNameWithNoTooltip('maghreb_region')], some members of the [ROOT.GetCountry.GetGovernment.GetCourtTitle] have urged [our_ruler.GetNameWithNoTooltip] to take a new policy towards the other sects of [ShowReligionGroupName('muslim')]. While a new [ShowReligionAdjectiveWithNoTooltip('ibadi')] state has attracted new followers, many people in the [ShowRegionNameWithNoTooltip('maghreb_region')] still follow [ShowReligionAdjective('sunni')]."
 maghrebi_culture.3.a: "We shall adopt a policy of tolerance for all branches of [ShowReligionGroupNameWithNoTooltip('muslim')]."
 maghrebi_culture.3.b: "The followers of other sects must adopt [ShowReligionNameWithNoTooltip('ibadi')]."

 maghrebi_culture.4.title: "The Fledgling [ShowReligionAdjectiveWithNoTooltip('ibadi')] States of the [ShowRegionNameWithNoTooltip('maghreb_region')]"
 maghrebi_culture.4.desc: "Although a prominent [ShowReligionAdjective('ibadi')] Sultanate once held great influence in the [ShowRegionName('maghreb_region')], the centuries after the Rustamids collapse has led to many [ShowReligionAdjectiveWithNoTooltip('ibadi')] devout followers relocating to [ShowAreaName('desert_area')]. With the domains of [ROOT.GetCountry.GetName] now extending towards these regions, some in the [ROOT.GetCountry.GetGovernment.GetCourtTitle] have suggested that [our_ruler.GetName] launch campaigns into [target_country.GetName], one of the weaker of the remnant states."
 maghrebi_culture.4.a: "Exploit the weakness of [target_country.GetNameWithNoTooltip]!"
 maghrebi_culture.4.b: "They are far too fractured and remote to pose a threat."

 maghrebi_culture.5.title: "Subjugation of the [ShowCultureGroupNameWithNoTooltip('maghrebi_group')] [ShowReligionAdjectiveWithNoTooltip('ibadi')] Populace"
 maghrebi_culture.5.desc: "Though [ShowAreaName('desert_area')] has been home to a sizable [ShowReligionAdjectiveWithNoTooltip('ibadi')] populace for some time, most of its populace have come under the rule of [ROOT.GetCountry.GetName]. With [ROOT.GetCountry.GetNameWithNoTooltip] now home to a not-insignificant number of [ShowReligionNameWithNoTooltip('ibadi')] followers, many in the [ROOT.GetCountry.GetGovernment.GetCourtTitle] have urged [our_ruler.GetName] to adopt a policy of tolerance towards the [ShowReligionAdjectiveWithNoTooltip('ibadi')] faithful lest the state may suffer religious instability."
 maghrebi_culture.5.a: "They must turn towards [ROOT.GetCountry.GetReligion.GetNameWithNoTooltip]."
 maghrebi_culture.5.b: "Aim to peacefully integrate the [ShowReligionAdjectiveWithNoTooltip('ibadi')] populace instead."

 maghrebi_culture.6.title: "Growing Influence of [ROOT.GetCountry.GetNameWithNoTooltip]"
 maghrebi_culture.6.desc: "Although [target_country_1.GetName] and [target_country.GetName] have had great influence over the [ShowRegionName('maghreb_region')] in the decades following the fall of the Almohads, [target_country.GetNameWithNoTooltip] have managed to carve out a powerful realm within the [ShowRegionNameWithNoTooltip('maghreb_region')] under the leadership of [our_ruler.GetName]. Although the elites of [target_country_1.GetNameWithNoTooltip] and [target_country.GetNameWithNoTooltip] are wary of [ROOT.GetCountry.GetAdjectiveWithNoTooltip] influence, many [ShowCultureGroupNameWithNoTooltip('maghrebi_group')] peoples have been more welcoming to our rule."
 maghrebi_culture.6.a: "We shall bring the [ShowRegionNameWithNoTooltip('maghreb_region')] under [ROOT.GetCountry.GetAdjectiveWithNoTooltip] rule!"

 maghrebi_culture.7.title: "Palm Irrigation of [target_location.GetNameWithNoTooltip]"
 maghrebi_culture.7.desc: "While many lands of the [ShowRegionName('maghreb_region')] offer fertile ground, it is also home to harsh terrain, given its proximity to [ShowAreaName('desert_area')].\n\n[target_location.GetName] has requested resources to establish a new [ShowBuildingTypeName('maghreb_palm_irrigation')] within the [target_location.GetRank.GetName], hoping to ease the most punishing conditions of the settlement."
 maghrebi_culture.7.a: "Offer resources to the local [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')] to establish the irrigation network."
 maghrebi_culture.7.b: "We cannot spare the resources."

 maghrebi_culture.8.title: "Sophisticated Architecture of [target_location.GetNameWithNoTooltip]"
 maghrebi_culture.8.desc: "Though the people of [target_location.GetName] have long had a reputation for adapting their architecture to the harsh terrain of the [ShowVegetationName('desert')], architects from our [ROOT.GetCountry.GetGovernment.GetCourtTitle] have returned impressed by what they have observed in the region. Though the terrain of [ROOT.GetCountry.GetCapital.GetName] is not the same as that of [target_location.GetNameWithNoTooltip], our architects feel that, with the backing of [our_ruler.GetName], similar improvements can be made in the [ROOT.GetCountry.GetCapital.GetNameWithNoTooltip]."
 maghrebi_culture.8.a: "Adopt aspects of the architecture of [target_location.GetNameWithNoTooltip]."
 maghrebi_culture.8.b: "We should instead be providing additional resources to [target_location.GetNameWithNoTooltip]."

 maghrebi_culture.9.title: "Traditions of the [ShowCultureGroupNameWithNoTooltip('amazigh_group')] People"
 maghrebi_culture.9.desc: "Since the migration of many [ShowCultureName('bedouin_culture')] tribes to the [ShowRegionName('maghreb_region')] in the 11th century, with the backing of the Fatimids, many native [ShowCultureGroupName('amazigh_group')] group were forced to acknowledge this growing [ShowCultureGroupName('arabic_group')] elite class. Although under [ROOT.GetCountry.GetName] many [ShowCultureGroupNameWithNoTooltip('amazigh_group')] peoples have maintained their autonomy, certain members of the [ROOT.GetCountry.GetGovernment.GetCourtTitle] have suggested we welcome some of these [ShowCultureGroupNameWithNoTooltip('arabic_group')] [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] into [ROOT.GetCountry.GetNameWithNoTooltip] to legitimize our rule. However, such an invitation will likely anger many in the [ROOT.GetCountry.GetGovernment.GetEstateName('tribes_estate')]."
 maghrebi_culture.9.a: "We should strive to work with the [ShowCultureGroupNameWithNoTooltip('arabic_group')] elite."
 maghrebi_culture.9.b: "We should instead seek to preserve [ShowCultureGroupNameWithNoTooltip('amazigh_group')] traditions."

 maghrebi_culture.10.title: "Growing Importance of [target_location.GetNameWithNoTooltip] to Saharan Trade"
 maghrebi_culture.10.desc: "Situated along one of the many trade routes within the [ShowAreaName('desert_area')], [target_location.GetName] has long been an important stop for [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] traders. In recent years, however, under the protection of [ROOT.GetCountry.GetName], the [target_location.GetRank.GetName] has grown in importance, with many traders choosing it as a stop due to [ROOT.GetCountry.GetAdjective] lands being safe to travel through. Although the increased importance has earned [target_location.GetNameWithNoTooltip] greater recognition across the Sahara, it has also left the [target_location.GetRank.GetNameWithNoTooltip] greatly strained.\n\nSeeking to ensure the [target_location.GetRank.GetNameWithNoTooltip] can remain an influential hub for trade, many in the [ROOT.GetCountry.GetGovernment.GetCourtTitle] have requested [our_ruler.GetName] provide the [target_location.GetRank.GetNameWithNoTooltip] appropriate resources to accommodate this growing influx of traders."
 maghrebi_culture.10.a: "[target_location.GetNameWithNoTooltip] must retain its importance to Saharan trade!"
 maghrebi_culture.10.b: "The [ROOT.GetCountry.GetGovernment.GetCourtTitle] cannot spare resources to [target_location.GetNameWithNoTooltip]."

 maghrebi_culture.11.title: "Flourishing Agriculture in [target_location.GetNameWithNoTooltip]"
 maghrebi_culture.11.desc: "Although it is located in one of the harsher regions of the [ShowRegionName('maghreb_region')], the people of [target_location.GetName] have managed to stabilize their situation with the recent expansion of a [ShowBuildingTypeName('maghreb_palm_irrigation')], which has proven to be a major boon for the [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')] of [target_location.GetNameWithNoTooltip]."
 maghrebi_culture.11.a: "$common_string_good$"

 maghrebi_culture.12.title: "Under [ShowDynastyNameWithNoTooltip('hafsid_dynasty')] Rule"
 maghrebi_culture.12.desc: "Since the fall of the Almohads, the [ShowCultureName('tunisian')] [ShowDynastyNameWithNoTooltip('hafsid_dynasty')] have maintained considerable influence over the eastern [ShowRegionName('maghreb_region')]. Although [ROOT.GetCountry.GetName] have maintained some independence from [target_country.GetName], the [ShowDynastyNameWithNoTooltip('hafsid_dynasty')] rulers have proven to be capable suzerains in protecting [ROOT.GetCountry.GetAdjectiveWithNoTooltip] territory. However, as Almohad rule becomes more of a distant memory, some in the [ROOT.GetCountry.GetGovernment.GetCourtTitle] have questioned the legitimacy of the [ShowDynastyNameWithNoTooltip('hafsid_dynasty')] rulers, suggesting it is time [ROOT.GetCountry.GetNameWithNoTooltip] break free from [ShowCultureNameWithNoTooltip('tunisian')] yoke."
 maghrebi_culture.12.a: "The [ShowDynastyNameWithNoTooltip('hafsid_dynasty')] have provided extensive protection to [ROOT.GetCountry.GetNameWithNoTooltip]."
 maghrebi_culture.12.b: "It is time we break the shackles of [ShowDynastyNameWithNoTooltip('hafsid_dynasty')] control."

 maghrebi_culture.13.title: "[ShowCultureNameWithNoTooltip('tunisian')] [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] Meddling in Internal Affairs"
 maghrebi_culture.13.desc: "Although the [ROOT.GetCountry.GetLongName] has acknowledged [ShowCultureName('tunisian')] suzerainty for some time now, the [ROOT.GetCountry.GetGovernment.GetCourtTitle] of [ROOT.GetCountry.GetNameWithNoTooltip] has largely maintained its autonomy. However, recent excursions by [target_character.GetName] into traditional [ROOT.GetCountry.GetCulture.GetName] territory has fomented instability throughout [ROOT.GetCountry.GetNameWithNoTooltip]. Many members of the [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] have requested that [target_character.GetNameWithNoTooltip] be exiled from [ROOT.GetCountry.GetNameWithNoTooltip] at once, although such an expulsion will likely anger [target_country.GetName]."
 maghrebi_culture.13.a: "Exile [target_character.GetNameWithNoTooltip] from [ROOT.GetCountry.GetNameWithNoTooltip]!"
 maghrebi_culture.13.b: "Allow [target_character.GetHerHim] to remain in the [ROOT.GetCountry.GetGovernment.GetCourtTitle]."

 maghrebi_culture.14.title: "Rogue [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] Raid [target_location.GetNameWithNoTooltip]"
 maghrebi_culture.14.desc: "The [ROOT.GetCountry.GetGovernment.GetCourtTitle] is in turmoil following reports caravan raids by soldiers loyal to the [ROOT.GetCountry.GetGovernment.GetEstateName('tribes_estate')] in [target_location.GetName]. Situated along one of the essential Saharan trade routes, [target_location.GetNameWithNoTooltip] is an important stop for many traders. Seeking recompense for the damages caused by the rogue soldiers, many of the affected [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] have requested the [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] pay for the damages."
 maghrebi_culture.14.a: "Force the [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] to pay for the damage caused by the raids."
 maghrebi_culture.14.b: "Reprimand the [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')], but have the state cover the damage."
 maghrebi_culture.14.c: "Side with the [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] and permit the raids to continue."

 maghrebi_culture.15.title: "Rising Support Amongst the [target_culture.GetNameWithNoTooltip] [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')]"
 maghrebi_culture.15.desc: "With the growing expansion of [ROOT.GetCountry.GetAdjective] authority over the [ShowRegionName('maghreb_region')], several of the native groups have sworn fealty to [ROOT.GetCountry.GetNameWithNoTooltip]. Among them, the [target_culture.GetName] [ROOT.GetCountry.GetGovernment.GetEstateName('tribes_estate')] have proven to be the most receptive towards [ROOT.GetCountry.GetAdjectiveWithNoTooltip] rule, with many [target_culture.GetNameWithNoTooltip] leaders offering the full support of their tribes. Surprised by this outpouring of support from the [target_culture.GetNameWithNoTooltip], some members of the [ROOT.GetCountry.GetGovernment.GetCourtTitle] have suggested that [our_ruler.GetName] offer the full backing of the state and promote [target_culture.GetNameWithNoTooltip] interests throughout the [ShowRegionNameWithNoTooltip('maghreb_region')], while others have suggested that we leverage their fervent support instead."
 maghrebi_culture.15.a: "We welcome their support!"
 maghrebi_culture.15.b: "Leverage their support to bolster our influence across the [ShowRegionNameWithNoTooltip('maghreb_region')]."

 maghrebi_culture.16.title: "Prominent [target_culture.GetNameWithNoTooltip] General"
 maghrebi_culture.16.desc: "The growing relationship between the [target_culture.GetName] peoples and the [ROOT.GetCountry.GetCulture.GetName] elite has proven to be beneficial as [ROOT.GetCountry.GetAdjective] rule within the [ShowRegionName('maghreb_region')] has stabilized. Seeking to further demonstrate their loyalty to the [ROOT.GetCountry.GetAdjectiveWithNoTooltip] [ROOT.GetCountry.GetGovernment.GetCourtTitle], the [target_culture.GetNameWithNoTooltip] [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] have offered one of their gifted leaders to serve [ROOT.GetCountry.GetNameWithNoTooltip]. However, some among the [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] have urged [our_ruler.GetName] to reject the offer fearing yielding autonomy to the [target_culture.GetNameWithNoTooltip] [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] may ultimately be detrimental to our rule in the [ShowRegionNameWithNoTooltip('maghreb_region')]."
 maghrebi_culture.16.a: "Welcome [target_character.GetShortNameWithNoTooltip] to the [ROOT.GetCountry.GetGovernment.GetCourtTitle]!"
 maghrebi_culture.16.b: "Refuse to employ [target_character.GetHimHer] as a general."

 maghrebi_culture.17.title: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] Offer Promising General"
 maghrebi_culture.17.desc: "Although the [ROOT.GetCountry.GetGovernment.GetEstateName('tribes_estate')] of [ROOT.GetCountry.GetName] have proven to be a strain on the [ROOT.GetCountry.GetGovernment.GetCourtTitle], in recent years the once-unruly [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] have begun acknowledging [ROOT.GetCountry.GetAdjectiveWithNoTooltip] authority throughout the [ShowRegionName('maghreb_region')]. Seeking to demonstrate these newfound loyalties to the [ROOT.GetCountry.GetGovernment.GetCourtTitle], the [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] have offered [target_character.GetName] to serve [ROOT.GetCountry.GetNameWithNoTooltip], who is said to have great talents. Some in the [ROOT.GetCountry.GetGovernment.GetCourtTitle] fear this may be a ploy by the [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] to curry influence from [our_ruler.GetName], however."
 maghrebi_culture.17.a: "Accept the offer from the [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')]."
 maghrebi_culture.17.b: "We cannot risk granting further influence to the [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')]."

 maghrebi_culture.18.title: "Growing Prominence of the [our_ruler.GetDynasty.GetNameWithNoTooltip]"
 maghrebi_culture.18.desc: "In the wake of the fall of the Almohads, the [ShowDynastyName('marinid_dynasty')] and [ShowDynastyName('hafsid_dynasty')] both amassed considerable power in the [ShowRegionName('maghreb_region')]. However, the recent military campaigns by the [our_ruler.GetDynasty.GetName] have paved the way for a new power to rise within the [ShowRegionNameWithNoTooltip('maghreb_region')]. Although [our_ruler.GetDynasty.GetNameWithNoTooltip] rule in the [ShowRegionNameWithNoTooltip('maghreb_region')] has earned support amongst the native [ShowCultureGroupNameWithNoTooltip('amazigh_group')] populace, some in the [ROOT.GetCountry.GetGovernment.GetCourtTitle] have suggested we look abroad if we are to outmatch the other major players in the [ShowRegionNameWithNoTooltip('maghreb_region')]."
 maghrebi_culture.18.a: "We should seek allies to strengthen our position."
 maghrebi_culture.18.b: "Focus instead on our internal politics."

 maghrebi_culture.19.title: "Shared Unity With the [target_culture.GetNameWithNoTooltip] Peoples"
 maghrebi_culture.19.desc: "Although the migration of [ShowCultureName('bedouin_culture')] to the [ShowRegionName('maghreb_region')] in the 11th century reansformed the region's political makeup, the [ROOT.GetCountry.GetCulture.GetName] and [target_culture.GetName] peoples under the rule of the [ROOT.GetCountry.GetAdjectiveWithNoTooltip] have a sense of renewed unity. [ROOT.GetCountry.GetAdjectiveWithNoTooltip] rule over their native [ShowRegionNameWithNoTooltip('maghreb_region')] has largely ended previous tribal hostilities between these people, with them emerging to instead have a new shared unity."
 maghrebi_culture.19.a: "A strong unity will leave us unconquerable!"
 maghrebi_culture.19.b: "We should use our strong unity with [target_culture.GetNameWithNoTooltip] to bolster our influence within the [ShowRegionNameWithNoTooltip('maghreb_region')]."
 maghrebi_culture.19.c: "The cultural bond between [ROOT.GetCountry.GetCulture.GetNameWithNoTooltip] and [target_culture.GetNameWithNoTooltip] is unbreakable."

 maghrebi_culture.20.title: "[ROOT.GetCountry.GetAdjectiveWithNoTooltip] Rule Over the [ShowRegionNameWithNoTooltip('maghreb_region')]"
 maghrebi_culture.20.desc: "Although many among the [ROOT.GetCountry.GetCulture.GetName] elite have gradually adopted aspects of [ShowCultureGroupName('arabic_group')] customs and traditions, it has at times led to conflict with the more traditionalist peoples of the [ShowRegionName('maghreb_region')]. For the [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')], the [target_culture.GetName] peoples have become a focal point of dissatisfaction at [ROOT.GetCountry.GetGovernment.GetCourtTitle], with many of the [target_culture.GetNameWithNoTooltip] elites refusing to conduct business with the [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')].\n\nSeeking to use their influence across [ROOT.GetCountry.GetName], the [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] have petitioned [our_ruler.GetName] to strive for a more aggressive assimilation policy towards the [target_culture.GetNameWithNoTooltip]. However, some members of the [ROOT.GetCountry.GetGovernment.GetCourtTitle] have urged [our_ruler.GetShortNameWithNoTooltip] to reject their requests, fearing the resulting instability."
 maghrebi_culture.20.a: "Strive to assimilate them into [ROOT.GetCountry.GetCulture.GetNameWithNoTooltip] society."
 maghrebi_culture.20.b: "We should instead seek to integrate the [target_culture.GetNameWithNoTooltip] peoples."

 maghrebi_culture.21.title: "Plight of the [ShowRegionNameWithNoTooltip('maghreb_region')]"
 maghrebi_culture.21.desc: "The fall of the last [ShowReligionGroupAdjective('muslim')] state within [ShowRegionName('iberia_region')] has brought with it a renewed sense of panic across the [ShowRegionName('maghreb_region')], with many fearing the [ShowReligionGroupAdjectiveWithNoTooltip('christian')] states of [ShowRegionNameWithNoTooltip('iberia_region')] will soon turn their gaze towards the [ShowRegionNameWithNoTooltip('maghreb_region')]. Already many [ShowCultureName('andalusi')] have turned towards [ROOT.GetCountry.GetNameWithNoTooltip] in hopes of escaping the wrath of the [ShowCultureGroupName('iberian_group')]."
 maghrebi_culture.21.a: "We shall not yield to the [ShowCultureGroupNameWithNoTooltip('iberian_group')] invaders!"
 maghrebi_culture.21.b: "We should remain wary for any potential invasions."

 maghrebi_culture.22.title: "Presence in the [ShowScriptedGeographyNameWithNoTooltip('mediterranean_sea_geography')]"
 maghrebi_culture.22.desc: "Although the people of [ROOT.GetCountry.GetName] have remained more accustomed to the Saharan trade, the campaigns of [our_ruler.GetName] have helped [ROOT.GetCountry.GetNameWithNoTooltip] to establish a sizable coastal presence, gaining access to the [ShowScriptedGeographyName('mediterranean_sea_geography')]. Seeing new opportunity for commerce, many [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] have urged the [ROOT.GetCountry.GetGovernment.GetCourtTitle] to fund the expansion of a new fleet, although some fear this could disrupt the traditional Saharan trade that has long benefited [ROOT.GetCountry.GetNameWithNoTooltip]."
 maghrebi_culture.22.a: "We must move quickly to establish a maritime presence."
 maghrebi_culture.22.b: "We cannot neglect our Saharan trade routes."

 maghrebi_culture.23.title: "Reckoning of the Arabized Elite"
 maghrebi_culture.23.desc: "The [target_culture.GetName] have held considerable power in the [ShowRegionName('maghreb_region')] for a long time. They have also been a point of contention with many [ShowCultureGroupName('amazigh_group')] people, as they advocate for aggressive assimilation policies and urge them to adopt [ShowCultureGroupName('arabic_group')] customs. With the rise of [ROOT.GetCountry.GetName], a [ROOT.GetCountry.GetFlavorRank] where the [ROOT.GetCountry.GetCulture.GetName] maintain power as the ruling elite, some of the [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] have asked [our_ruler.GetName] to curb the power of the [target_culture.GetNameWithNoTooltip]. Others in the [ROOT.GetCountry.GetGovernment.GetCourtTitle], however, see the [target_culture.GetNameWithNoTooltip] elite as invaluable allies in strengthening our growing rule over the [ShowRegionNameWithNoTooltip('maghreb_region')]."
 maghrebi_culture.23.a: "Strive for a compromise between the [ROOT.GetCountry.GetCulture.GetNameWithNoTooltip] and [target_culture.GetNameWithNoTooltip] elites."
 maghrebi_culture.23.b: "[target_culture.GetNameWithNoTooltip] influence over the [ShowRegionNameWithNoTooltip('maghreb_region')] has come to an end."

 maghrebi_culture.24.title: "New [ROOT.GetCountry.GetCulture.GetNameWithNoTooltip] Kilims"
 maghrebi_culture.24.desc: "[ROOT.GetCountry.GetCulture.GetName] tapestries have long been a commodity across the [ShowRegionName('maghreb_region')] as well as a key good for many [ROOT.GetCountry.GetAdjective] traders. In recent years, however, acquiring a more reliable source of [ShowGoodsNameWithNoTooltip('dyes')] has led to a new generation of [ROOT.GetCountry.GetCulture.GetNameWithNoTooltip] Kilims, along with a growing interest both in the [ShowRegionName('maghreb_region')] and abroad for the tapestries."
 maghrebi_culture.24.a: "Reap the benefits of the new tapestries."
 maghrebi_culture.24.b: "We must continue to invest in the new tapestries!"

 maghrebi_culture.25.title: "Consolidation of [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] Lands"
 maghrebi_culture.25.desc: "Although the strength of the [ROOT.GetCountry.GetGovernment.GetEstateName('tribes_estate')] has been instrumental in ensuring [ROOT.GetCountry.GetName] could fend off hreats in the past, the expanding bureaucracy of the [ROOT.GetCountry.GetFlavorRank] has led to numerous discussions in the [ROOT.GetCountry.GetGovernment.GetCourtTitle] about their effectiveness. While the [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] have helped protect [ROOT.GetCountry.GetNameWithNoTooltip] in the past, they have also been a source of trouble when disagreeing with [ROOT.GetCountry.GetGovernment.GetCourtTitle] policies.\n\nThis has now led to conversations in the [ROOT.GetCountry.GetGovernment.GetCourtTitle] that the state has grown strong enough, and no longer needs to rely on the [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] for protection. Moreover, the [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] now must be reined in for good in order to strengthen the growing [ROOT.GetCountry.GetAdjectiveWithNoTooltip] state."
 maghrebi_culture.25.a: "The [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] be reminded of their place in this world."
 maghrebi_culture.25.b: "Maintain [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] autonomy to avoid internal strife."

 maghrebi_culture.26.title: "Dominance Over the [ShowRegionNameWithNoTooltip('maghreb_region')]"
 maghrebi_culture.26.desc: "Though the collapse of the Almohads saw the [ShowRegionName('maghreb_region')] enter a period of instability, as well as weakening influence over [ShowRegionName('iberia_region')], [ROOT.GetCountry.GetName] under [our_ruler.GetName] has emerged as the de facto power in the region. While other portions of the [ShowRegionNameWithNoTooltip('maghreb_region')] still remain outside [ROOT.GetCountry.GetAdjectiveWithNoTooltip] influence, the [ShowCultureGroupName('iberian_group')] Kingdoms are more likely to acknowledge [ROOT.GetCountry.GetNameWithNoTooltip] as a regional rival that cannot be underestimated should they desire to conquer the [ShowRegionNameWithNoTooltip('maghreb_region')]."
 maghrebi_culture.26.a: "We shall stand as the protectors of the Maghreb!"

 maghrebi_culture.27.title: "The [our_ruler.GetDynasty.GetNameWithNoTooltip] Golden Age of the [ShowRegionNameWithNoTooltip('maghreb_region')]"
 maghrebi_culture.27.desc: "With much of the [ShowRegionName('maghreb_region')] now under [ROOT.GetCountry.GetAdjective] rule, the [our_ruler.GetDynasty.GetName] have taken steps towards re-innovating much of the important cultural architecture in the [ShowRegionNameWithNoTooltip('maghreb_region')], as well as sponsoring the construction of various new centers of learning. Though the region was once on the cusp of being dominated by outside powers, under [our_ruler.GetDynasty.GetNameWithNoTooltip] rule, it has instead sharpened itself into a major power revered across the entire [ShowScriptedGeographyName('mediterranean_sea_geography')]."
 maghrebi_culture.27.a: "May the [our_ruler.GetDynasty.GetNameWithNoTooltip] rule continue to bring prosperity"


 maghrebi_culture.28.title: "Influence Over the Corsairs"
 maghrebi_culture.28.desc: "While the privateers of the [ShowRegionName('maghreb_region')] have earned a reputation across [ShowContinentName('europe')] for being a major raiding force on the [ShowScriptedGeographyName('mediterranean_sea_geography')], their sponsorship until now has varied from state from state.\n\nHowever, with the growing expansion of [ROOT.GetCountry.GetAdjective] influence over the coast, many privateers have turned towards [ROOT.GetCountry.GetNameWithNoTooltip] in hopes of garnering our support to increase the intensity of raids across the [ShowScriptedGeographyNameWithNoTooltip('mediterranean_sea_geography')]. Some members of the [ROOT.GetCountry.GetGovernment.GetCourtTitle], however, feel that this also creates an opportunity to weaken the privateers in hopes of rebuilding relations with the European powers who have earned their ire over the centuries."
 maghrebi_culture.28.a: "Offer the full backing of the state."
 maghrebi_culture.28.b: "Allow the Corsairs to continue their operations."
 maghrebi_culture.28.c: "Clamp down on the Corsair raids"

 # Decisions
 maghreb_ibadi_nation_establish_majlis_ammi_said.title: "Centralize the Majlis 'Ammi Sa'īd"
 maghreb_ibadi_nation_establish_majlis_ammi_said.desc: "Since the fall of the Rustamids, many [ShowReligionAdjective('ibadi')] people in the [ShowRegionName('maghreb_region')] were forced to flee into the Mzab Valley. While many of these [ShowReligionAdjectiveWithNoTooltip('ibadi')] states chose to participate in the Majlis 'Ammi Sa'īd with the [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] at the helm, others have decided to retain their independence.\n\nWith many of the more populated [ShowReligionAdjectiveWithNoTooltip('ibadi')] lands now under [ROOT.GetCountry.GetName], [our_ruler.GetName] has sought to centralize the Majlis 'Ammi Sa'īd in [ROOT.GetCountry.GetCapital.GetName] in hopes of further creating a strong and influential [ShowReligionAdjectiveWithNoTooltip('ibadi')] state in the [ShowRegionNameWithNoTooltip('maghreb_region')]."
 maghreb_ibadi_nation_establish_majlis_ammi_said.desc.entry: "A council scattered across proudly independent [ShowReligionAdjective('ibadi')] states can advise, but it cannot rule. Now that the most populous of those lands answer to us, the Majlis 'Ammi Sa'īd can be gathered under a single roof and a single authority. What began as a refuge in the Mzab Valley would then become a realm in its own right across the [ShowRegionName('maghreb_region')]."
 maghreb_ibadi_nation_establish_majlis_ammi_said.a: "The loyalty of the [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] will help strengthen our rule!"
 maghreb_ibadi_nation_establish_majlis_ammi_said.a.entry: "The loyalty of the $crown_estate$ will help strengthen our rule!"
 
 maghreb_masters_of_the_sahara.title: "Masters of the Sahara"
 maghreb_masters_of_the_sahara.desc: "For generations the peoples of the [ShowRegionName('maghreb_region')] have participated in the Saharan trade, crossing the harsh deserts in order to transport valuable trade commodities. While it may prove a daunting task, should we manage to establish considerable influence over the [ShowAreaName('desert_area')] while also expanding the infrastructure of core caravan stops, our peoples may yet tame these unforgiving sands."
 maghreb_masters_of_the_sahara.a: "We have achieved the impossible!"
 empower_the_desert_power_privilege_tt: "The [ShowEstatePrivilegeName('desert_power')] will become greatly enhanced, gaining additional benefits that counter the penalties suffered by [ShowVegetationName('desert')] and [ShowClimateName('arid')] [locations|e]"
 empower_the_desert_power_privilege_tt_default_bonus: "The [ShowEstatePrivilegeName('desert_power')] will also gain #G +0.0020#! [ShowModifierTypeName('global_monthly_development')] and #G +2.50%#! [ShowModifierTypeName('global_max_control')]"
