 maghrebi_cultural_change_events.1004.title: "The Gall of the [ShowCultureNameWithNoTooltip('andalusi')] Settlers"
 maghrebi_cultural_change_events.1004.desc: "Recent years have seen a large influx of the [ShowCultureName('andalusi')] from [ShowRegionName('iberia_region')] due to the rampant persecutions our [ShowReligionGroupAdjective('muslim')] brethren face there. Despite the gift of a new home that [ROOT.GetCountry.GetReligion.GetGodName] has granted them, those audacious newcomers have the gall to openly complain about the living standards in [ShowRegionName('maghreb_region')] while extolling those who remained in the lands of the dastardly [ShowReligionGroupAdjective('christian')] states!\n\nA known member of the [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] from the [target_pop2.GetName] has compared this attitude to 'almost lapsing from the faith.'"
 maghrebi_cultural_change_events.1004.a: "If [ShowRegionNameWithNoTooltip('iberia_region')] is so good, why do they not return?"
 maghrebi_cultural_change_events.1004.b: "Try to calm down both sides."

