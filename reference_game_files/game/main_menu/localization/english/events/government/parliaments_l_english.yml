l_english:
 parliaments.1.title: "[target_city.GetRank.GetNameWithNoTooltip] Demands Seat in [ROOT.GetCountry.GetGovernment.GetParliament.GetName]"
 parliaments.1.desc: "The [target_city.GetRank.GetName] of [target_city.GetName] has grown rich and prosperous and the people there are disappointed that they have not been chosen as the seat of the current [ROOT.GetCountry.GetGovernment.GetParliament.GetName]. The representatives of [target_city.GetNameWithNoTooltip] demand compensation and a guarantee from us, securing their interests for the future. They are threatening to leave if their demands are not granted."
 parliaments.1.a: "Grant them!"
 parliaments.1.b: "Refuse them!"

 parliaments.2.title: "Rotten Boroughs"
 parliaments.2.desc: "Due to its important position in the [ROOT.GetCountry.GetGovernment.GetParliament.GetName], [target_location.GetName] can boast that it has quite some influence on the politics of our country. The citizens of [envious.GetName], however, feel underrepresented in the [ROOT.GetCountry.GetGovernment.GetParliament.GetName]. The people of [envious.GetNameWithNoTooltip] desire their own [ShowBuildingTypeName('urban_parliament_seat')], with all of the rights attached to it. While their demand in isolation seems reasonable, it also comes with the revocation of the seat of [target_location.GetNameWithNoTooltip], which our [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] would surely take as a grave insult."
 parliaments.2.a: "Unfair or not, that seat is the right of [target_location.GetNameWithNoTooltip]!"
 parliaments.2.b: "We must reassign the seat."

 parliaments.3.desc_generic: "Apart from being an important member of the [ROOT.GetCountry.GetGovernment.GetParliament.GetName], [target_location.GetName] is also the center of a number of influential businesses with a stake in overseas trade."
 parliaments.3.title: "The Economic Power of [target_location.GetNameWithNoTooltip]"
 parliaments.3.desc: "$parliaments.3.desc_generic$ It appears that many of these businesses have decided that they would not benefit from the currently debated proposal's implementation and have exerted pressure on their members of the [ROOT.GetCountry.GetGovernment.GetParliament.GetName] to weaken the proposal."
 parliaments.3.a: "[ROOT.GetCountry.Custom('common_string_negative')]"
 parliaments.3.b: "If it is money they want, then they can have it."

 parliaments.4.title: "Corruption of Vote"
 parliaments.4.desc: "The [ROOT.GetCountry.GetGovernment.GetParliament.GetName] members of the rotten boroughs in [target_location.GetName] have chosen to oppose our proposal in the [ROOT.GetCountry.GetGovernment.GetParliament.GetName]. It seems that the landowner who controls the area has been persuaded that the proposal is not in his best interest."
 parliaments.4.a: "Rotten luck!"
 parliaments.4.b: "We must bribe the landowner then."

 parliaments.5.title: "[target_location.GetNameWithNoTooltip] Wins Debate"
 parliaments.5.desc: "The influential [ShowBuildingTypeName('university')] of [target_location.GetName] has managed to sway the Members of the [ROOT.GetCountry.GetGovernment.GetParliament.GetName] of [ROOT.GetCountry.GetName] to come out in favor of increasing [ShowBuildingTypeNameWithNoTooltip('university')] funding."
 parliaments.5.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 parliaments.5.b: "They should focus solely on their research."

 parliaments.6.desc: "$parliaments.3.desc_generic$ It appears that many of these businesses have decided that they would benefit from the currently debated proposition's implementation and have exerted pressure on their members of the [ROOT.GetCountry.GetGovernment.GetParliament.GetName] to make it pass."
 parliaments.6.a: "[ROOT.GetCountry.Custom('common_string_positive')]"

 parliaments.7.title: "Military Support in [target_location.GetNameWithNoTooltip]"
 parliaments.7.desc: "The army is in many ways the most influential internal force in [target_location.GetName] and the members of the [ROOT.GetCountry.GetGovernment.GetParliament.GetName] who come from and are loyal to this influential organization have been persuaded to vote in favor of the current proposition."
 parliaments.7.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 parliaments.7.b: "Their support alone is enough for us."

 parliaments.8.title: "The Influence of [target_location.GetNameWithNoTooltip]"
 parliaments.8.desc: "The current debate in the [ROOT.GetCountry.GetGovernment.GetParliament.GetName] on how to best protect domestic production has attracted the attention of many in [target_location.GetName]. This important position in the [ROOT.GetCountry.GetGovernment.GetParliament.GetName] has come to support us in the debate, in the hope that it will benefit from the suggested policy."
 parliaments.8.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 parliaments.8.b: "We should invest in [target_location.GetNameWithNoTooltip] regardless of the result."

 parliaments.9.title: "The Power of [target_location.GetNameWithNoTooltip]"
 parliaments.9.desc: "As the seat of our capital, [target_location.GetName] stands to benefit greatly from the currently proposed reforms. Luckily, enough people have realized this to ensure that their representative is now voting in our favor."
 parliaments.9.a: "[ROOT.GetCountry.Custom('common_string_positive')]"

 parliaments.10.title: "[target_location.GetNameWithNoTooltip] Changes Stance in Debate!"
 parliaments.10.desc: "It seems that the [ROOT.GetCountry.GetGovernment.GetParliament.GetName] members of [target_location.GetName] have finally realized how beneficial the currently debated proposal would be to them if it passed. Their support for our cause is most welcome."
 parliaments.10.desc_b: "It seems that the [ROOT.GetCountry.GetGovernment.GetParliament.GetName] members of [target_location.GetName] have realized how detrimental the currently debated proposal would be to them if it passed. Their support to our opposition is of great value."
 parliaments.10.a: "[ROOT.GetCountry.Custom('common_string_positive')]"

 parliaments.11.desc: "It seems that the [ROOT.GetCountry.GetGovernment.GetParliament.GetName] members of [target_location.GetName], though staunch supporters of our cause just a little while ago, have come to change their stance on the currently debated issue entirely. We cannot know for sure how this happened, but it is clear that we can no longer rely on their vote."
 parliaments.11.a: "Perhaps their greed got the better of them..."

 parliaments.12.title: "No Support for the Peasantry"
 parliaments.12.desc: "While we do permit the [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')] to petition our [ROOT.GetCountry.GetGovernment.GetParliament.GetName], this right does not translate into the same power other estates have over this institution. During a recent discussion, it has become clear that the common people of [ROOT.GetCountry.GetName] do not enjoy the same privileges as the dominant upper class, which happens to oppose the proposal of the [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('peasants_estate')]."
 parliaments.12.a: "[ROOT.GetCountry.Custom('common_string_negative')]"
 parliaments.12.b: "What a terrible injustice!"

 parliaments.13.title: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('peasants_estate')] Dominate Debate"
 parliaments.13.desc: "A determined campaign by members of the [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')] has swayed the [ROOT.GetCountry.GetGovernment.GetParliament.GetName] in favor of the currently debated issue. Despite their lower social status, their voice is accepted as equal in discussions of the state."
 parliaments.13.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 parliaments.13.b: "The people's demands will be heard."

 parliaments.14.desc_common: "The [ROOT.GetCountry.GetGovernment.GetParliament.GetName] members of [target_location.GetName] hold an influential position within the [ROOT.GetCountry.GetGovernment.GetParliament.GetName], as they represent one of our economic centers."
 parliaments.14.title: "The [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')] of [target_location.GetNameWithNoTooltip]"
 parliaments.14.desc: "$parliaments.14.desc_common$ Their wealth holds much sway in the [ROOT.GetCountry.GetGovernment.GetParliament.GetName], but fortunately for us, the proposition being discussed will benefit them if it passes, so their money is being spent buying support instead of obstructing it."
 parliaments.14.a: "[ROOT.GetCountry.Custom('common_string_positive')]"

 parliaments.15.title: "The Burden of [target_location.GetNameWithNoTooltip]"
 parliaments.15.desc: "Many in [target_location.GetName] have been quite disappointed by the proposal to increase our focus on maritime infrastructure. They feel that their region already contributes much to the armed forces of our country and had rather expected the [ROOT.GetCountry.GetGovernment.GetParliament.GetName] to authorize more funds for their discretion, instead of asking for more money for the navy."
 parliaments.15.a: "[ROOT.GetCountry.Custom('common_string_negative')]"
 parliaments.15.a.tt: "Our [pops|e] in [target_location.GetName] will lose [ShowNamedValue('pop_satisfaction_weak_penalty')|+=2%] [pop_satisfaction|e]"

 parliaments.16.title: "Maritime Dominance in [target_location.GetNameWithNoTooltip]"
 parliaments.16.desc: "The dominance of the navy in [target_location.GetName] has meant that the proposed increased spending on the army in the [ROOT.GetCountry.GetGovernment.GetParliament.GetName] has been rather coldly received there. Despite having been initially amenable to the proposition, the members of the [ROOT.GetCountry.GetGovernment.GetParliament.GetName] from this area now see no choice but to vote against it."
 parliaments.16.a: "[ROOT.GetCountry.Custom('common_string_negative')]"

 parliaments.17.desc_common: "The people of [target_location.GetName] tend to follow a different faith from our own, and the members of the [ROOT.GetCountry.GetGovernment.GetParliament.GetName] which are responsible for [target_location.GetNameWithNoTooltip] have been accused of representing their interests over those of our own faith."
 parliaments.17.title: "The Faith of [target_location.GetNameWithNoTooltip]"
 parliaments.17.desc_tolerance: "$parliaments.17.desc_common$ However, these accusations usually spark nothing but laughter from the rest of the [ROOT.GetCountry.GetGovernment.GetParliament.GetName], as it is not uncommon for us to value those who follow a different faith from that of our state."
 parliaments.17.desc_intolerance: "$parliaments.17.desc_common$ These drastic accusations have damaged the reputation of [target_location.GetNameWithNoTooltip] and hurt support for the current proposal in the [ROOT.GetCountry.GetGovernment.GetParliament.GetName]."
 parliaments.17.a: "It was the will of [ROOT.GetCountry.GetReligion.GetGodName]."

 parliaments.18.title: "The Expectations of [target_location.GetNameWithNoTooltip]"
 parliaments.18.desc: "The [ROOT.GetCountry.GetGovernment.GetParliament.GetName] members of [target_location.GetName] are surprisingly receptive of our proposal in the parliamentary debate. It appears that the university in [target_location.GetNameWithNoTooltip] is convinced that it will be involved in the counting and measuring that the current proposal entails and scholars are delighted by the opportunity to take part in the gathering of new, raw data regarding our country."
 parliaments.18.a: "[ROOT.GetCountry.Custom('common_string_ok')]"

 parliaments.19.title: "The Incompetence of [target_character.GetNameWithNoTooltip]"
 parliaments.19.desc: "With our current [ROOT.GetCountry.GetGovernment.GetParliament.GetName] debate focusing on the composition of our [ROOT.GetCountry.GetGovernment.GetCabinetTitle], a serious error committed by [target_character.GetName] has come to light. Over the course of [target_character.GetHerHis] appointment, [target_character.GetHerHis] skill seems to have degraded rapidly and we might need to consider replacing [target_character.GetHerHim] entirely."
 parliaments.19.a: "[ROOT.GetCountry.Custom('common_string_negative')]"

 parliaments.20.title: "Life in [ROOT.GetCountry.GetCapital.GetNameWithNoTooltip]"
 parliaments.20.desc: "As representatives of areas that are sometimes quite distant from [ROOT.GetCountry.GetCapital.GetName], many [ROOT.GetCountry.GetGovernment.GetParliament.GetName] members often find that life in [ROOT.GetCountry.GetCapital.GetNameWithNoTooltip] during their visits is very different from what they are used to. Some find it both cramped and filthy, and many seem quite relieved when they get to return home.\n\nThis year has proven even harder than usual for the delicate sensibilities of our [ROOT.GetCountry.GetGovernment.GetParliament.GetName] members to endure. The hot months have been unusually hot, the wet months unusually wet, and the cold months unusually cold. A number of [ROOT.GetCountry.GetGovernment.GetParliament.GetName] members have now decided that they have had enough and have approached us asking for help to make their stays more pleasant."
 parliaments.20.a: "We must do what we can."
 parliaments.20.b: "They will have to endure like the rest of us."

 parliaments.21.title: "[ROOT.GetCountry.GetGovernment.GetParliament.GetName] Members in Scandal"
 parliaments.21.desc: "A minor scandal has occurred in [ROOT.GetCountry.GetCapital.GetName] during the current debate. It seems that, rather than attending the sessions personally, some members of the [ROOT.GetCountry.GetGovernment.GetParliament.GetName] were out disturbing the peace and harassing their fellow countrymen. The outrage is great, both among their peers and in the streets, and this incident is likely to haunt future parliaments for years."
 parliaments.21.a: "$common_string_let_it_slide$"
 parliaments.21.b: "Arrest the [ROOT.GetCountry.GetGovernment.GetParliament.GetName] members."

 parliaments.22.title: "Absenteeism"
 parliaments.22.desc: "Given its great influence over the politics of our country, it would be easy to assume that all [ROOT.GetCountry.GetGovernment.GetParliament.GetName] members attended parliamentary sessions with great enthusiasm, eager to do the most they can with the power that they have been entrusted with. This is, however, far from the case. In any given [ROOT.GetCountry.GetGovernment.GetParliament.GetName], there will be some that never show up, either because they are still enjoying their estates in the countryside or because they decided to partake in the many joys of the capital. The problem has grown more and more lately, and we fear that foreign dignitaries are laughing at us behind our backs. We could fine those who are absent during the debates to increase attendance, but of course these members of the [ROOT.GetCountry.GetGovernment.GetParliament.GetName] would not take very kindly to that."
 parliaments.22.a: "Fine the worst offenders."
 parliaments.22.b: "[ROOT.GetCountry.Custom('common_string_nothing_we_can_do')]"

 parliaments.23.title: "Demands for Representation"
 parliaments.23.desc: "A number of hostile publications have begun to circulate in the cities of [ROOT.GetCountry.GetName]. Anonymous, yet very critical, authors claim that our government is autocratic and does not rule with fair consideration for the situations of all [ROOT.GetCountry.GetAdjectiveWithNoTooltip] people, along with other such ludicrous accusations. They demand both a written constitution and a parliament where the various parts of our country can be represented."
 parliaments.23.a: "Ban the Publications."
 parliaments.23.b: "Make vague promises of Reform."

 parliaments.24.title: "Financial Aid"
 parliaments.24.desc: "It seems that our government's currently poor finances and our desperate attempts to locate any kinds of funds have become public knowledge. While this surely will hurt our reputation both in [ROOT.GetCountry.GetName] and abroad, it has come with some benefits, as several members of the [ROOT.GetCountry.GetGovernment.GetParliament.GetName], representing [target_location.GetName], have approached us offering their help. Their price, however, is greater representation in the government in general as well as formalized channels through which the state can ask for their help in the future."
 parliaments.24.a: "Grant them Greater Representation."
 parliaments.24.b: "Refuse their money."
 parliaments.24.c: "Promise to take their views into consideration."

 parliaments.25.desc: "$parliaments.14.desc_common$ Their wealth holds much sway in the [ROOT.GetCountry.GetGovernment.GetParliament.GetName] and, unfortunately, they use it to lobby against our current efforts."
 parliaments.25.a: "[ROOT.GetCountry.Custom('common_string_negative')]"

 parliaments.27.title: "Parliamentary Traditions"
 parliaments.27.desc: "One of the more difficult things about being a parliamentarian has less to do with the debates in [ROOT.GetCountry.GetCapital.GetName], but more with how to sell the debates and compromises to the people back home. Still, a local [ROOT.GetCountry.GetGovernment.GetParliament.GetName] member will often have an easier time explaining a new tax than would a collector sent by the central government in less representative systems.\n\nIt seems that the [ROOT.GetCountry.GetGovernment.GetParliament.GetName] members in general, and the ones from [target_location.GetName] in particular, have become so adept at defending policies that we have seen a resulting rise in the support of the central government as a whole."
 parliaments.27.a: "They finally understand us!"

 parliaments.26.title: "An Agreeable [ROOT.GetCountry.GetGovernment.GetParliament.GetName]"
 parliaments.26.desc: "The members of our [ROOT.GetCountry.GetGovernment.GetParliament.GetName] have been especially agreeable in recent times. With their loyalist leanings, we could easily sway them in our favor or extract some extra resources from their regions."
 parliaments.26.a: "Leveraging their loyalties is most important."
 parliaments.26.b: "We need hard currency!"

 parliaments.28.title: "Clashing Authority"
 parliaments.28.desc: "A rare and unexpected sight has emerged in [ROOT.GetCountry.GetCapital.GetName], as [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')], [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')], and other members of the middle and lower strata have convened their own makeshift [ROOT.GetCountry.GetGovernment.GetParliament.GetName]. United in their discontent, they are pushing forward the [target_debate.GetName] debate, demanding changes that directly challenge the will of [target_character.GetName]. Many of their members, fueled by frustrations with the ruling class, have decided that they can no longer endure the status quo and are making their voices heard, despite the strong opposition of [target_character.GetShortNameWithNoTooltip]."
 parliaments.28.a: "Our whips have grown ineffective!"

 parliaments.29.title: "The [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] Hold All the Cards"
 parliaments.29.desc: "The [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] have brought a formal complaint before the [ROOT.GetCountry.GetGovernment.GetParliament.GetName], and it is difficult to argue with their grievance. The [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] hold a commanding share of power, crowding out the merchants who generate so much of [ROOT.GetCountry.GetName]'s wealth. If left unchecked, this imbalance will fester into open resentment. We must decide whether loyalty to our oldest allies is worth the price of alienating the very people who fill our treasury."
 parliaments.29.a: "The [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] have served us well."
 parliaments.29.b: "The merchants deserve a fair hearing."

 parliaments.30.title: "A Question of Faith in the [ROOT.GetCountry.GetGovernment.GetParliament.GetName]"
 parliaments.30.desc: "It is all very well to debate roads and taxes, yet our [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] reminds us that not all of [ROOT.GetCountry.GetName] worships the true faith. With so many souls still wandering beyond its light, how can the [ROOT.GetCountry.GetGovernment.GetParliament.GetName] concern itself with lesser matters? Their argument is persuasive, perhaps uncomfortably so. We must decide whether to let spiritual zeal drive this session or keep the clergy's ambitions in check."
 parliaments.30.a: "The faith demands our full attention."
 parliaments.30.b: "Spiritual matters can wait."

 parliaments.31.title: "The Voice of the Dispossessed"
 parliaments.31.desc: "A thick stack of petitions has arrived at the [ROOT.GetCountry.GetGovernment.GetParliament.GetName], each one filled with the grievances of [ROOT.GetCountry.GetName]'s most downtrodden subjects. The [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')] have precious little power, yet their discontent has grown dangerously loud. If we dismiss these cries, we risk turning simmering resentment into something far uglier. If we listen, we risk emboldening those who would use the peasants as a political weapon."
 parliaments.31.a: "Their suffering deserves acknowledgment."
 parliaments.31.b: "Order must be maintained."

 parliaments.32.title: "Monastery Markets"
 parliaments.32.desc: "The [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] are furious. Monastery workshops and church-run trading houses undercut their prices at every turn, all while enjoying the considerable advantage of being free from the taxes that honest merchants must pay. The [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')], naturally, see no injustice in this arrangement whatsoever. Both factions are demanding a hearing, and we cannot give both of them what they want. This squabble will not resolve itself."
 parliaments.32.a: "The [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] have a point."
 parliaments.32.b: "The [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] serve a higher purpose."
 parliaments.32.c: "We will have no favorites."

 parliaments.33.title: "Where Has All the Money Gone?"
 parliaments.33.desc: "The [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] and [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] have joined voices in the [ROOT.GetCountry.GetGovernment.GetParliament.GetName] to ask a question we would very much prefer not to answer. How have we managed to accumulate so many debts? Our spending has indeed been considerable, and our creditors are growing impatient. We may weather this storm with a firm rebuttal, or we may choose to make promises we will struggle to keep. Neither answer is comfortable."
 parliaments.33.a: "Our expenditures serve [ROOT.GetCountry.GetName]'s glory."
 parliaments.33.b: "We shall tighten our belt."

 parliaments.34.title: "The Right to Send a Proxy"
 parliaments.34.desc: "Not every member of the [ROOT.GetCountry.GetGovernment.GetParliament.GetName] can always be present in person — wars, illness, and the considerable distances between [ROOT.GetCountry.GetName]'s estates ensure that. The [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] have asked that their absent members be permitted to send proxies with full voting rights. It is a sensible arrangement from their perspective. The crown sees it rather differently. A parliament of proxies is a parliament that cannot quite be pressed or persuaded the way a room full of actual people can be. We must decide what kind of institution we want the [ROOT.GetCountry.GetGovernment.GetParliament.GetName] to be."
 parliaments.34.a: "Absent lords may send proxies."
 parliaments.34.b: "All votes must be cast in person."

 parliaments.35.title: "A Rare Accord"
 parliaments.35.desc: "Something unusual has happened in the [ROOT.GetCountry.GetGovernment.GetParliament.GetName]. The [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] and the [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] have found a cause they can actually agree on, and they have brought it to us with one voice. Such moments of unity are too rare to squander. We would do well to embrace it, though one must always wonder what each of them expects to gain in return."
 parliaments.35.a: "Unity serves [ROOT.GetCountry.GetName] well."
 parliaments.35.b: "Their unity unsettles us."

 parliaments.36.title: "The Cost of This War"
 parliaments.36.desc: "The [ROOT.GetCountry.GetGovernment.GetParliament.GetName] is exhausted. Petitions from soldiers' families, from bankrupted merchants, from priests asked to bless too many graves have piled up faster than victories. Even those who cheered loudest when we first declared war now look ashen-faced when the bills arrive. We can inspire them once more with the promise of eventual triumph, or we can acknowledge the toll this war has taken. Either way, we cannot ignore the mood in those chambers much longer."
 parliaments.36.a: "Victory will make every sacrifice worthwhile."
 parliaments.36.b: "We hear our people's suffering."

 parliaments.37.title: "The [ROOT.GetCountry.GetGovernment.GetParliament.GetName] Goes to War"
 parliaments.37.desc: "The [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] have made their position clear. The enemy will not wait, and neither can [ROOT.GetCountry.GetName]'s armies. They demand the [ROOT.GetCountry.GetGovernment.GetParliament.GetName] authorize emergency levies immediately. Whether one agrees with their urgency or not, the battlefield is rarely a patient arena. We must decide how far to extend this call to arms, and whose sons will be made to answer it."
 parliaments.37.a: "Authorize the emergency levies."
 parliaments.37.b: "We will not conscript by force."

 parliaments.38.title: "Those Who Came Home"
 parliaments.38.desc: "They fought under our colors, bled for our borders, and now they are home, largely forgotten. Veterans from our last campaign have petitioned the [ROOT.GetCountry.GetGovernment.GetParliament.GetName] for some recognition of their service, whether in land, coin, or simply acknowledgment from their rulers. The cost of honoring them is modest. The cost of ignoring them could prove rather higher."
 parliaments.38.a: "Grant them land."
 parliaments.38.b: "Pay them a soldier's due."
 parliaments.38.c: "They served. That is reward enough."

 parliaments.39.title: "Wolves at the Edge of the Map"
 parliaments.39.desc: "Our neighbors have not been subtle about their intentions. The [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] have brought intelligence to the [ROOT.GetCountry.GetGovernment.GetParliament.GetName] of provocations along our frontiers — missed diplomatic gestures, troop movements, the usual theatre that precedes something far less theatrical. We may fund our defenses now, while we still have the luxury of time, or we may seek a diplomatic remedy before swords leave their scabbards."
 parliaments.39.a: "Fortify our borders."
 parliaments.39.b: "Send diplomats first."

 parliaments.40.title: "Hunger Has No Patience for Parliament"
 parliaments.40.desc: "The petitions are written in plain language — the kind one uses when one has run out of polite ways to say the same thing. Granaries are empty. Children are hungry. The [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')] have brought this before the [ROOT.GetCountry.GetGovernment.GetParliament.GetName] not because they believe in fine speeches, but because they have nowhere else to turn. We cannot debate this into oblivion. Something must be done, and quickly."
 parliaments.40.a: "Buy grain reserves immediately."
 parliaments.40.b: "Open our markets to foreign grain."
 parliaments.40.c: "Let the markets correct themselves."

 parliaments.41.title: "The Coin Buys Less Every Month"
 parliaments.41.desc: "Our [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] are alarmed, and for once they are not exaggerating. Prices are rising at a rate that outpaces any reasonable explanation, and the value of what flows through our treasury shrinks by the day. Unchecked, this could ruin the very commercial classes that keep [ROOT.GetCountry.GetName] solvent. We need decisive action, though the form that action takes will please some and infuriate others."
 parliaments.41.a: "Introduce austerity measures."
 parliaments.41.b: "Place the blame where it belongs."
 parliaments.41.c: "Repay our debts before all else."

 parliaments.42.title: "Two Cities, One Market"
 parliaments.42.desc: "Both cities have sent representatives to the [ROOT.GetCountry.GetGovernment.GetParliament.GetName] and both are arguing with admirable force and considerable noise. The question of who shall hold the dominant trading charter in [ROOT.GetCountry.GetName] is, frankly, not a question that resolves itself. We may grant one city an exclusive advantage, or we may open the market and let competition do what parliaments so rarely accomplish and solve the problem on its own."
 parliaments.42.a: "One charter, one dominant market."
 parliaments.42.b: "Let them compete freely."

 parliaments.43.title: "The Weight of [ROOT.GetCountry.GetName]'s Debts"
 parliaments.43.desc: "The ledger is not a pleasant document to review. We owe more than we care to admit, and our creditors are not the patient sort. The [ROOT.GetCountry.GetGovernment.GetParliament.GetName] has convened an emergency session to address it, though 'address' is a generous word for the three wildly incompatible proposals currently being shouted across the chamber floor. We must pick one and live with the consequences."
 parliaments.43.a: "Restructure the debt."
 parliaments.43.b: "Raise taxes to cover it."
 parliaments.43.c: "Sell whatever must be sold."

 parliaments.44.title: "For Once, Good News"
 parliaments.44.desc: "For once, the [ROOT.GetCountry.GetGovernment.GetParliament.GetName] has convened with something pleasant to discuss. The kingdom is stable, the treasury is not weeping, and our people have not recently attempted anything catastrophic. Several proposals have emerged for how best to put this rare good fortune to use, and for a change, the debates are almost civil. Let us not waste the moment."
 parliaments.44.a: "Build for the future."
 parliaments.44.b: "Share the wealth with our subjects."
 parliaments.44.c: "Prepare for the war that will inevitably come."

 parliaments.45.title: "Heresy in the Halls of Power"
 parliaments.45.desc: "The new religious ideas sweeping [ShowContinentName('europe')] have reached the benches of our own [ROOT.GetCountry.GetGovernment.GetParliament.GetName], and the [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] are not taking it calmly. Reformist pamphlets have been circulating, voices have been raised in anger, and a fistfight was only narrowly avoided during last week's session. We must take a position before this turns from a theological dispute into something rather more dangerous."
 parliaments.45.a: "Parliament shall stand with the true faith."
 parliaments.45.b: "Parliament shall hear all voices."

 parliaments.46.title: "Who Shall Take Credit?"
 parliaments.46.desc: "Both the [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] and the [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] are determined to be remembered as the great patrons of this era. Their quarrel over whose generosity has done more for the arts of [ROOT.GetCountry.GetName] is, we must admit, somewhat entertaining, until one remembers that it has entirely blocked the regular business of the [ROOT.GetCountry.GetGovernment.GetParliament.GetName] for the past two sessions. Someone must be declared the winner."
 parliaments.46.a: "The [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] have driven our cultural renaissance."
 parliaments.46.b: "The [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] have been the true patrons."
 parliaments.46.c: "Both deserve recognition equally."

 parliaments.47.title: "Dangerous Words in Dangerous Times"
 parliaments.47.desc: "Since the printing press took up residence in [ROOT.GetCountry.GetName], the [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] have been complaining about pamphlets. The [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] have been distributing them. Both camps have arrived in the [ROOT.GetCountry.GetGovernment.GetParliament.GetName] with very strong opinions about whose version of events deserves to circulate freely. One side calls it enlightenment. The other calls it sedition. We shall have to pick which word we prefer."
 parliaments.47.a: "Restrict harmful publications."
 parliaments.47.b: "The press must run freely."

 parliaments.48.title: "God's Acres and the Peasant's Plow"
 parliaments.48.desc: "There is a dispute that has simmered in our countryside for generations, and it has finally arrived in the [ROOT.GetCountry.GetGovernment.GetParliament.GetName] in all its ungainly complexity. Monastery lands press against peasant fields, and the question of who may farm what has grown from a local grievance into a matter of principle. The [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] invoke divine right. The [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')] invoke tradition. Neither argument is entirely wrong, which is what makes this so difficult."
 parliaments.48.a: "The monasteries' rights are sacrosanct."
 parliaments.48.b: "Return the disputed lands to the peasants."

 parliaments.49.title: "A Voice from the New Territories"
 parliaments.49.desc: "Representatives from our recently acquired territories have made the journey to petition the [ROOT.GetCountry.GetGovernment.GetParliament.GetName] for rights and representation. They speak without arrogance but with a quiet determination that commands at least some attention. Whether to include them in the machinery of [ROOT.GetCountry.GetAdjectiveWithNoTooltip] governance or dismiss their request is a question that will shape how our new subjects view their rulers for decades to come."
 parliaments.49.a: "Grant them a voice in our [ROOT.GetCountry.GetGovernment.GetParliament.GetName]."
 parliaments.49.b: "They are subjects, not participants."

 parliaments.50.title: "A Kingdom Within the Kingdom"
 parliaments.50.desc: "The great lords of our provincial estates have arrived in the [ROOT.GetCountry.GetGovernment.GetParliament.GetName] with an old demand wrapped in new language. They call it 'local governance.' What they mean, of course, is that they wish to be left to run their own affairs without interference from the capital, which is a polite way of asking us to govern less of our own country. It is a tempting proposition, if one does not think too hard about what it eventually leads to."
 parliaments.50.a: "Grant them their local courts."
 parliaments.50.b: "The crown governs all of [ROOT.GetCountry.GetName]."

 parliaments.51.title: "Disorder at the Edges"
 parliaments.51.desc: "A report has been placed before the [ROOT.GetCountry.GetGovernment.GetParliament.GetName] that makes for uncomfortable reading. In certain corners of [ROOT.GetCountry.GetName], the law of the land seems to have become more of a suggestion than a rule. Local officials are either absent, incompetent, or simply outnumbered. The [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')] have been loudest in their complaints, which is usually a reliable sign that the problem is real. We cannot allow this to fester."
 parliaments.51.a: "Send administrators to restore order."
 parliaments.51.b: "Send soldiers instead."

 parliaments.52.title: "Two Peoples, One [ROOT.GetCountry.GetGovernment.GetParliament.GetName]"
 parliaments.52.desc: "The incorporation of new territories has brought new peoples under [ROOT.GetCountry.GetAdjectiveWithNoTooltip] rule and into the [ROOT.GetCountry.GetGovernment.GetParliament.GetName] chamber. The [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] see opportunity in assimilation; the [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] see trade partnerships in coexistence. Neither position is selfless, but at least they are both coherent. We must choose which vision of [ROOT.GetCountry.GetName] we wish to build."
 parliaments.52.a: "One [ROOT.GetCountry.GetNameWithNoTooltip], one culture."
 parliaments.52.b: "Difference makes us stronger."

 parliaments.53.title: "The [target_character.GetNameWithNoTooltip] Question"
 parliaments.53.desc: "Results are not usually enough to satisfy the [ROOT.GetCountry.GetGovernment.GetParliament.GetName]. [target_character.GetName] has delivered them. The reports are measurable, the improvements are real, and parliament has noticed. That, it turns out, is the problem. When a minister becomes this effective, questions arise about how the work was done. Whose expectations were quietly set aside? Whose interests were quietly served? The [ROOT.GetCountry.GetGovernment.GetParliament.GetName] has demanded a full accounting, and we must decide how much scrutiny [target_character.GetName] is actually going to receive."
 parliaments.53.a: "Their record speaks for itself."
 parliaments.53.b: "Let parliament examine the accounts."

 parliaments.54.title: "Two Ministers, Two Agendas"
 parliaments.54.desc: "The cabinet has become a battlefield, and the [ROOT.GetCountry.GetGovernment.GetParliament.GetName] can tell. [target_character.GetName] and [rival_character.GetName] have spent this entire session trying to undermine each other, each hoping the other will be blamed for a failure that neither of them will admit to causing. Their rivalry entertains no one except themselves and whoever is placing bets. We need it resolved."
 parliaments.54.a: "Back [target_character.GetName]."
 parliaments.54.b: "Back [rival_character.GetName]."
 parliaments.54.c: "Dismiss them both."

 parliaments.55.title: "Dirty Hands in Clean Chambers"
 parliaments.55.desc: "Someone in the [ROOT.GetCountry.GetGovernment.GetParliament.GetName] has accused [target_character.GetName] of corruption, and the accusation carries just enough detail to be impossible to entirely ignore. Whether the charge is genuine or merely a political weapon depends very much on who one asks, and the person asking has considerable influence over how the answer comes out. We must decide whether to pursue the matter or bury it with our dignified disapproval."
 parliaments.55.a: "Investigate the accusations."
 parliaments.55.b: "This is nothing but political theater."

 parliaments.56.title: "A Procedural Disagreement of Monumental Tedium"
 parliaments.56.desc: "The [ROOT.GetCountry.GetGovernment.GetParliament.GetName] has ground to a halt. A dispute over voting procedure — whether to settle matters by voice or by roll call, whether proxies may abstain, whether the order of speakers was correctly determined — has consumed three full sessions that could have been spent on actual governance. Somewhere, there is a right answer to all of this. We simply wish it did not have to be us who provides it."
 parliaments.56.a: "Issue a ruling from the throne."
 parliaments.56.b: "Let parliament resolve its own mess."

 parliaments.57.title: "Empty Benches, Full Grievances"
 parliaments.57.desc: "One of our most powerful estates has reached the end of its patience. Their satisfaction with the current direction of the [ROOT.GetCountry.GetGovernment.GetParliament.GetName] is, to put it charitably, extremely low, and they have let it be known that continued attendance cannot be guaranteed unless something changes. Whether this is a genuine threat or a negotiating tactic is difficult to say. What is certain is that a parliament with a conspicuous absence makes rather unconvincing decisions."
 parliaments.57.a: "Make concessions before they walk out."
 parliaments.57.b: "Let them try."

 parliaments.58.title: "The [ROOT.GetCountry.GetGovernment.GetParliament.GetName] Presses Its Claim"
 parliaments.58.desc: "A constitutional assembly does not simply sit still and be grateful for its existence. Ours has decided that now is the moment to press further — to enumerate rights that have so far been implied rather than written, to establish precedents that would be difficult to undo. They are not wrong that such a document would clarify [ROOT.GetCountry.GetName]'s governance. They are also not wrong that it would permanently constrain the authority of the crown. We must decide how much power we are prepared to give away in writing, because written power tends to stay given."
 parliaments.58.a: "Grant the charter."
 parliaments.58.b: "The crown's authority is not subject to enumeration."

