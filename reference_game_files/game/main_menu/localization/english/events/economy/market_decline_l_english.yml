l_english:
 market_decline.1.title: "The Withering of [withering_market.GetName]"
 market_decline.1.desc: "The market at [withering_market.GetCenterLocation.GetName] is no longer the trading hub it once was. With only a handful of locations still attached to it, our merchants increasingly route their goods through better-served neighbouring markets. Left as it is, the market will dwindle into a tollbooth on a road to somewhere else.\n\nOur cabinet asks how we wish to handle the decline."
 market_decline.1.a: "Subsidize the merchants and prop the market up."
 market_decline.1.b: "Dissolve the marketplace and let our locations join their natural neighbours."
 market_decline.1.b.tt: "The [market|e] of [withering_market.GetName] is dissolved. Its locations re-attach to their next-best [market|e]."
 market_decline.1.c: "Accept the decline and let the merchants make their own decisions."
