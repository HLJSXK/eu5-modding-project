l_english:
 thalassocracy_events.1.title: "The Fruits of our Labor"
 thalassocracy_events.1.desc_success: "The rapid expansion of our navy was an astounding success! The many newly constructed and modernized ships, manned by skilled sailors, will surely strike fear into our rivals and foes. No longer shall wicked pirates or fleets under hostile banners hinder our domination of the waves. With our shipping lines secured, it will become much easier for us to govern distant shores and project our power across the seas."
 thalassocracy_events.1.desc_failure: "After years of difficult debates securing funding for our navy, we will now have to abandon our dreams of ruling through the seas. Without a strong navy to back our claims of Thalassocracy, we can not defend our waters against our rivals and privateers alike."
 thalassocracy_events.1.a: "Our maritime empire shall prosper!"
 unlock_thalassocracy_reform_tt: "Unlocks the [ShowGovernmentReformName('thalassocracy_reform')] [government_reform|e]"
 thalassocracy_events.1.b: "We will have to live with our own failure."
