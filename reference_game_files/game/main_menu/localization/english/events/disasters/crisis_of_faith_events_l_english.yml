l_english:

  crisis_of_faith.1.title: "The Schism Breaks"
  crisis_of_faith.1.desc: "Devotion to our state church has crumbled, and the faithful no longer heed its teachings. Schismatic preachers gather followings, while the clergy splits between reformers and hardliners. We must choose our path: accommodate the reformers and seek compromise, or suppress the schism with fire and steel."
  crisis_of_faith.1.a: "Accommodate the reformers."
  crisis_of_faith.1.b: "Suppress the schismatics!"
  crisis_of_faith.1.tt: "The most troubled provinces will rise in support of the [ShowDisasterName('crisis_of_faith')] faction"
  crisis_of_faith.1.a.tt: "Clergy in a few of the most troubled provinces will still join the [ShowDisasterName('crisis_of_faith')] faction"

  crisis_of_faith.2.title: "Heresy Spreads"
  crisis_of_faith.2.desc: "Reports arrive of whole congregations turning to the schismatic doctrine. We can dispatch loyal clergy to root out the heretics before the contagion spreads further, or let it run its course and hope the fervor burns itself out."
  crisis_of_faith.2.a: "Root out the heretics."
  crisis_of_faith.2.b: "Let it fester."

  crisis_of_faith.3.title: "The Faithful Rally"
  crisis_of_faith.3.desc: "In defiance of the schism, devout crowds gather to reaffirm the established faith. Their zeal could rekindle devotion across the realm, though such passions can easily tip into unrest if left unchecked."
  crisis_of_faith.3.a: "Embrace the fervor."
  crisis_of_faith.3.b: "Maintain order."

  crisis_of_faith.4.title: "Clergy Demands Doctrinal Reform"
  crisis_of_faith.4.desc: "A delegation of moderate clergy petitions us to amend church doctrine and heal the rift before it widens. Granting their reforms would soothe the clergy and slow the schism, but bending sacred doctrine is no small thing. Refusing would hold the line at the cost of clerical goodwill."
  crisis_of_faith.4.a: "Grant their reforms."
  crisis_of_faith.4.b: "Refuse to bend doctrine."

  crisis_of_faith.5.title: "An Inquisition Opportunity"
  crisis_of_faith.5.desc: "Our most zealous clergy beg leave to launch an inquisition against the schismatics. A purge would restore devotion and cow the heretics, but the resulting fear would ripple through the realm. We may also choose restraint, sparing the populace further suffering."
  crisis_of_faith.5.a: "Launch the inquisition."
  crisis_of_faith.5.b: "Show restraint."

  crisis_of_faith.12.title: "A Patron for the Schism"
  crisis_of_faith.12.desc: "The schismatic cause has found a purse. [crisis_of_faith_heresiarch_scope.GetName] has been received in a great hall of our realm, and the noble who opened its doors now pays for the copying of sermons we have forbidden. We can make a quiet counter offer for that loyalty, or accept that we cannot police every hall in the land."
  crisis_of_faith.12.a: "Buy that loyalty back."
  crisis_of_faith.12.b: "We cannot police every hall."

  crisis_of_faith.13.title: "Preaching in the Open"
  crisis_of_faith.13.desc: "[crisis_of_faith_heresiarch_scope.GetName] no longer preaches in cellars. A crowd gathered in the market square to hear the schismatic doctrine spoken aloud, and no one moved to stop it. Silencing the sermon would show that our church still holds authority, though dragging a preacher from a pulpit before a crowd is its own kind of scandal."
  crisis_of_faith.13.a: "Silence the sermon."
  crisis_of_faith.13.b: "Let the faithful judge for themselves."

  crisis_of_faith.100.title: "Heresy Crushed"
  crisis_of_faith.100.desc: "The schism has been mended. The schismatic preachers are scattered, their followers returned to the fold, and the clergy reunited beneath a single doctrine. Our church stands renewed, its authority and our devotion restored."
  crisis_of_faith.100.a: "The faith endures."

  crisis_of_faith.101.title: "Schismatic Doctrine Entrenched"
  crisis_of_faith.101.desc: "The schism has prevailed. The reformed doctrine takes root in our churches and our courts, and the old doctrine is cast aside. For a generation, our realm will live with a divided faith and a clergy that no longer answers wholly to our throne."
  crisis_of_faith.101.desc.heresiarch: "The schism has prevailed, and it has a face. [crisis_of_faith_heresiarch_scope.GetName] preached the reformed doctrine until it could no longer be silenced, though it was the clergy in revolt who broke our authority in the field. Now the victorious clergy proclaim [crisis_of_faith_heresiarch_scope.GetHerHis] elevation, and there is no one left in our church willing to refuse them. What we defended as sacred is quietly set aside."
  crisis_of_faith.101.a: "The schism prevails."
  crisis_of_faith.101.b: "Let the heresiarch take the throne."

  crisis_of_faith.102.title: "The Faith Abandoned"
  crisis_of_faith.102.desc: "We no longer rule as a church. Whatever the schismatics preached, they will not be answered by our clergy, for our clergy no longer speak for the state. The doctrine we abandoned defending remains in the mouths of the faithful, and those who kept the old orthodoxy for us remember who left them to it."
  crisis_of_faith.102.a: "The church is no longer ours to govern."

  crisis_of_faith.10.title: "Preach Renewal"
  crisis_of_faith.10.desc: "We send our most devoted clergy out among the people, preaching renewal and calling the faithful home. Their sermons rekindle devotion across the realm and sap the schismatics of their following, though the upheaval of a great revival unsettles the order of things."
  crisis_of_faith.10.a: "Send out the preachers."
  crisis_of_faith.10.a.tt: "Every pop currently supporting the [ShowDisasterName('crisis_of_faith')] faction will gain some satisfaction"

  crisis_of_faith.11.title: "Convene a Synod"
  crisis_of_faith.11.desc: "We summon the clergy to a great council to settle the disputed doctrine once and for all. The assembled prelates close ranks around the orthodox teaching, isolating the schismatic faction and restoring some measure of unity to the church."
  crisis_of_faith.11.a: "Summon the council."
  crisis_of_faith.11.a.tt: "Every pop currently supporting the [ShowDisasterName('crisis_of_faith')] faction will gain some satisfaction"

  crisis_of_faith.6.title: "The Hand Behind the Schism"
  crisis_of_faith.6.desc: "Our agents have followed the forbidden sermons back through the copyists and the couriers who carried them, and every trail ends at the same door. [crisis_of_faith_heresiarch_scope.GetName] is the author of the schismatic doctrine, and until now [crisis_of_faith_heresiarch_scope.GetSheHe] has preached it from within our own church."
  crisis_of_faith.6.a: "Name the heresiarch."
  crisis_of_faith.6.a.tt: "The heresiarch has been identified, unlocking the Denounce the Heresiarch action"

  crisis_of_faith.7.title: "Denounce the Heresiarch"
  crisis_of_faith.7.desc.ready: "The crown speaks with authority again, and the moment has come to use it. We will name [crisis_of_faith_heresiarch_scope.GetName] before the assembled faithful, set out [crisis_of_faith_heresiarch_scope.GetHerHis] errors in full, and strip [crisis_of_faith_heresiarch_scope.GetHerHim] of the standing that made the schism possible. Without its author, the reformed doctrine is only a rumor."
  crisis_of_faith.7.desc.not_ready: "We would name [crisis_of_faith_heresiarch_scope.GetName] before the assembled faithful and have done with the schism, but the crown does not command the room. The clergy who shelter [crisis_of_faith_heresiarch_scope.GetHerHim] are stronger than the throne that would condemn [crisis_of_faith_heresiarch_scope.GetHerHim], and a denunciation that fails will be remembered as a denunciation that was refused."
  crisis_of_faith.7.a: "Condemn the heresiarch before the faithful."
  crisis_of_faith.7.a.fail_tt: "The crown lacks the authority to move against the heresiarch"

  crisis_of_faith.8.title: "Concede to the Schismatics"
  crisis_of_faith.8.desc: "The schism cannot be broken, so it must be bought. We will grant the reformers the doctrine they demand and the standing within our church that comes with it. The faction will disperse, its preachers returning to congregations that are now theirs by right. Our devotion will not recover from this, and the concession cannot be taken back."
  crisis_of_faith.8.a: "Let them have their doctrine."
