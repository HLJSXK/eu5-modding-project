l_english:
 twilight_of_the_tsardom.1.title: "Twilight of the $rank_empire_bulgarian$"
 twilight_of_the_tsardom.1.desc: "The strength that once carried our banners across the [ShowRegionName('balkan_region')] now wanes with each passing year. Our authority grows hollow and our enemies encroach upon us from all sides. The scars of past wars and internal strife are far from healed, and if decisive action is not taken, the [GetCountry('BUL').GetFlavorRank] may soon fade into little more than a memory. We must do everything we can to prevent the disastrous collapse that befell the First [GetCountry('BUL').GetAdjective] Empire."
 twilight_of_the_tsardom.1.a: "The [GetCountry('BUL').GetFlavorRank] shall not fall!"
 twilight_of_the_tsardom.1.a.tt: "Completing the $twilight_of_the_tsardom$ [disaster|e] without owning [ShowLocationName('constantinople')] will result in the following:"
 twilight_of_the_tsardom.1.a.tt2: "Completing the $twilight_of_the_tsardom$ [disaster|e] while we also own [ShowLocationName('constantinople')] will result in the following:"
 twilight_of_the_tsardom.1.a.tt3: "Completing the $twilight_of_the_tsardom$ [disaster|e] while we also own [ShowLocationName('constantinople')] and are a [great_power|e] will result in the following:"
 twilight_of_the_tsardom.1.historical_info: "After the death of Ivan Asen II in 1241, Bulgaria fell into a prolonged period of weak rule, noble infighting, and Mongol raids. Successive rulers failed to resist foreign encroachment, which resulted in major territorial losses. Internal instability peaked with the uprising of Ivaylo and continued through decades of civil strife and foreign interference. Although a brief recovery occurred in the early 14th century, the defeat at Velbazhd in 1330 and renewed external pressures left Bulgaria weakened and increasingly vulnerable by 1337. The weakened nation would never recover from the struggle, and would ultimately fall at the hands of the Ottomans."
 
 twilight_of_the_tsardom.2.title: "The $rank_empire_bulgarian$ Endures"
 twilight_of_the_tsardom.2.desc: "Against all odds, the $rank_empire_bulgarian$ has endured years of chaos, intrigue, and decline. Though the scars remain and the realm has not yet fully recovered, we have endured where many believed we would fall. The twilight has passed, but whether a new dawn awaits us remains to be seen."
 twilight_of_the_tsardom.2.a: "We shall rebuild what was lost."
 twilight_of_the_tsardom_modifier_removal_tt: "The [ShowModifier('bul_powerful_local_elites')] will be removed from every owned location which has it"
 
 twilight_of_the_tsardom.3.title: "[GetCountry('BUL').GetNameWithNoTooltip] Ascendant"
 twilight_of_the_tsardom.3.desc: "From the depths of the crisis, [GetCountry('BUL').GetName] has risen both restored and emboldened. The capture of [ShowLocationName('constantinople')] is a feat few could have imagined during the darkest days of turmoil. The $rank_empire_bulgarian$ now stands as a dominant force in the [ShowRegionName('balkan_region')], and all who once doubted our strength must now reckon with our resurgence."
 twilight_of_the_tsardom.3.a: "Let the world recognize our strength!"
 
 twilight_of_the_tsardom.4.title: "The Dawn of a New Empire"
 twilight_of_the_tsardom.4.desc: "The [GetCountry('BUL').GetAdjective] $rank_empire_bulgarian$, once threatened by collapse, now stands among the greatest realms of the world. In the struggle for survival, we found strength and hope that has culminated in the rise of a new imperial power. With [ShowLocationName('constantinople')] in our hands, we are destined to leave a mark upon history. May this day be remembered as the founding of the Third [GetCountry('BUL').GetAdjectiveWithNoTooltip] Empire!"
 twilight_of_the_tsardom.4.a: "A golden age begins now!"
 
 twilight_of_the_tsardom.5.title: "Local Elites Question Our Authority"
 twilight_of_the_tsardom.5.desc: "The regional elites of [target_location.GetName] have begun to act independently, disregarding our decrees and ruling their land as though they were sovereign. Encouraged by the weakened central authority, others may soon follow their example. If we do not take a decisive action, this may invite even greater fragmentation."
 twilight_of_the_tsardom.5.a: "We have greater concerns."
 twilight_of_the_tsardom.5.b: "Reassert our control over [target_location.GetNameWithNoTooltip]."
 
 twilight_of_the_tsardom.6.title: "Courtier Accused of Treason"
 twilight_of_the_tsardom.6.desc: "One of our trusted advisors, [target_character.GetName], has come under grave suspicion. [target_character.GetSheHe|U] has been accused of accepting coin from a foreign power in exchange for sensitive information about our $rank_empire_bulgarian$. Though no clear evidence has yet been uncovered, the accusations alone have stirred unease within the [ROOT.GetCountry.GetGovernment.GetCourtTitle]. Should we ignore this matter, a traitor could act unchecked within our circles; yet acting too hastily may see a loyal servant unjustly punished."
 twilight_of_the_tsardom.6.a: "Dismiss [target_character.GetHerHim] at once!"
 twilight_of_the_tsardom.6.b: "This is surely just a rumor..."
 
 twilight_of_the_tsardom.7.title: "Mutineers in the Army"
 twilight_of_the_tsardom.7.desc: "The morale of our armies falters as unpaid soldiers grumble and officers struggle to maintain order. As the wages are delayed and the chain of command weakens with each passing day, we risk that the soldiers who once formed a pillar of our strength shall become a threat against it."
 twilight_of_the_tsardom.7.a: "Pay them what they are owed."
 twilight_of_the_tsardom.7.b: "We cannot afford this."
 twilight_of_the_tsardom.7.c: "Crush the mutiny before it spreads!"
 
 twilight_of_the_tsardom.8.title: "A Rebellious Subject"
 twilight_of_the_tsardom.8.desc: "Rumors have reached the capital that the elites of [subject_target.GetName] are growing increasingly defiant, and are believed to be conspiring in secret and testing the limits of their allegiance. Though no open rebellion has been declared yet, our trusted sources report that their [subject_target.GetGovernment.GetCourtTitle] is filled with whispers of independence."
 twilight_of_the_tsardom.8.a: "Placate them with concessions."
 twilight_of_the_tsardom.8.b: "There is little we can do right now."
 
 twilight_of_the_tsardom.9.title: "Unpaid Garrison"
 twilight_of_the_tsardom.9.desc: "The defenders of our garrison in [target_location.GetName] are growing rebellious as they accuse local governors of neglecting the defenses and refusing to pay the garrison a proper wage. These soldiers tasked with defending a key fortress that protects the entirety of [target_area.GetName] now see little reason to remain loyal to a crown that cannot provide for them."
 twilight_of_the_tsardom.9.a: "Pay their wages immediately!"
 twilight_of_the_tsardom.9.b: "Force the local elites to pay them."
 twilight_of_the_tsardom.9.c: "We can spare no coin."
 
 twilight_of_the_tsardom.10.title: "Feuding Estates"
 twilight_of_the_tsardom.10.desc: "The weakening of central authority in recent years has emboldened the estates of the $rank_empire_bulgarian$, each vying for greater influence over the weakened [GetEstateName('crown_estate')]. Simmering rivalries have erupted into open hostility and our neutrality is increasingly more difficult to maintain. As we risk turning both factions against us, perhaps we may yet secure the loyalty of one of them at the cost of deepening division within the realm."
 twilight_of_the_tsardom.10.a: "We shall side with the [first_estate.GetNameWithNoTooltip]."
 twilight_of_the_tsardom.10.b: "Let us protect the interests of the [second_estate.GetNameWithNoTooltip]."
 twilight_of_the_tsardom.10.c: "Do not take a side in this conflict."
 
 bul_restore_the_realms_unity: "Restore the Realm's Unity"
 bul_restore_the_realms_unity_desc: "Areas that were once an integral part of the [GetCountry('BUL').GetFlavorRank] have slipped away from our control, and are no longer subject to the authority of the throne. If we are to survive this twilight, we must ensure their reunification with the homeland. By force, if need be..."
 bul_reassert_our_authority: "Reassert Our Authority"
 bul_reassert_our_authority_desc: "The internal weakness of [GetCountry('BUL').GetName] has emboldened many elites across the [GetCountry('BUL').GetFlavorRank], who now defy our authority and rule their lands as if they answered to no one. We must prevent further fragmentation of the realm by reasserting control over their territories and forcing them to bend the knee once again."
 bul_push_for_diplomatic_reintegration: "Push For Diplomatic Reintegration"
 bul_push_for_diplomatic_reintegration_desc: "To prevent civil wars from erupting, we have conceded parts of our lands to lords who rule them in our name. While this solution might work in the short term, it is in our best interest to work on the diplomatic reunification of the $rank_empire_bulgarian$, as a realm divided will not survive what is to come."
 
 twilight_of_the_tsardom.11.title: "Surrounded by Vultures"
 twilight_of_the_tsardom.11.desc: "While we remain consumed by internal strife, our opportunistic neighbors circle us like vultures circle a dying beast. Sensing weakness, they watch our every move and wait patiently for the moment to strike and tear away what remains of our $rank_empire_bulgarian$. Lately, it has come to our attention that [target_country.GetName] has laid claim to [border_claim_province.GetName], with the intent of seizing it if the opportunity arises."
 twilight_of_the_tsardom.11.a: "Let them try their luck!"
 twilight_of_the_tsardom.11.b: "Bribe them to revoke the claim."
 
