l_english:

  oligarchic_capture.1.title: "The Faction Rises"
  oligarchic_capture.1.desc: "Years of decay have hollowed out our republican institutions. A dominant estate, sensing weakness, has moved to capture the legislative machinery for itself, locking out rivals and bending the law to its will. We must decide how to meet this challenge: bow to the faction and preserve a fragile peace, or resist them and risk open revolt."
  oligarchic_capture.1.a: "Bow to the faction's demands."
  oligarchic_capture.1.b: "Resist them, whatever the cost!"
  oligarchic_capture.1.tt: "The most discontented provinces will rise in support of the [ShowDisasterName('oligarchic_capture')] faction"

  oligarchic_capture.2.title: "Oligarchs Demand Tribute"
  oligarchic_capture.2.desc: "The faction's leaders present us with a thinly veiled demand for coin, framed as a contribution to the public good. Pay, and their agitation will cool for a time. Refuse, and they will use our defiance to rally yet more support to their cause."
  oligarchic_capture.2.a: "Pay them off."
  oligarchic_capture.2.b: "We will not be extorted."

  oligarchic_capture.3.title: "Citizens Rally for Reform"
  oligarchic_capture.3.desc: "Crowds gather in the public squares, calling for the restoration of honest government and an end to factional rule. Their fervor is a chance to reclaim the republican spirit, though indulging the mob risks disorder."
  oligarchic_capture.3.a: "Champion their cause."
  oligarchic_capture.3.b: "Keep order in the streets."

  oligarchic_capture.4.title: "A Senate Faction Purged"
  oligarchic_capture.4.desc: "The oligarchs move to expel a bloc of senators they deem disloyal. Allowing the purge would steady the realm in the short term, but it hands the faction yet another victory. Protecting the accused would defend our institutions at the cost of further turmoil."
  oligarchic_capture.4.a: "Let the purge proceed."
  oligarchic_capture.4.b: "Protect the accused."

  oligarchic_capture.5.title: "Unrest in the Streets"
  oligarchic_capture.5.desc: "Brawls between the faction's partisans and their opponents spill into the markets and wharves. We can let tempers cool on their own, or send our guards to restore order with a firm hand."
  oligarchic_capture.5.a: "Let tempers cool."
  oligarchic_capture.5.b: "Crack down hard."

  oligarchic_capture.100.title: "The Republic Restored"
  oligarchic_capture.100.desc: "The faction's grip has been broken. Our courts, councils, and assemblies answer once more to the citizenry rather than to a clique of grandees. The republic has weathered the storm, and its institutions emerge tempered by the trial."
  oligarchic_capture.100.a: "Our institutions endure."

  oligarchic_capture.101.title: "Oligarchic Constitution Entrenched"
  oligarchic_capture.101.desc: "The faction has won. A new constitution, written to serve the oligarchs, locks their dominance into the very foundations of the state. For a generation, our republic will be one in name only, its offices traded among a narrow circle of the powerful."
  oligarchic_capture.101.desc.ringleader: "The faction has won, and its ringleader, [oligarchic_ringleader_scope.GetName], steps out from behind the senate's back rooms to claim the crown outright. For a generation, our republic will be one in name only, its offices traded among a narrow circle of the powerful."
  oligarchic_capture.101.a: "The faction has won."
  oligarchic_capture.101.b: "[oligarchic_ringleader_scope.GetName] takes the crown."

  oligarchic_capture.6.title: "Unmasking the Ringleader"
  oligarchic_capture.6.desc: "Our agents have spent weeks tracing coin, favors, and whispered instructions through the faction's ranks. At last a single name emerges as the one truly directing its course: [oligarchic_ringleader_scope.GetName]."
  oligarchic_capture.6.a: "Now we know who to deal with."

  oligarchic_capture.7.title: "Confront the Ringleader"
  oligarchic_capture.7.desc.ready: "With [oligarchic_ringleader_scope.GetName] exposed, we can move against them directly. The crown's own authority has recovered enough that the faction should be swiftly broken."
  oligarchic_capture.7.desc.not_ready: "With [oligarchic_ringleader_scope.GetName] exposed, we could move against them directly, but the crown's own authority has not yet recovered enough. Striking too soon may only rally the faction further."
  oligarchic_capture.7.a: "Move against them."
  oligarchic_capture.7.a.success_tt: "Our [crown_power|e] has reached 30% or more, so the attempt succeeds"
  oligarchic_capture.7.a.fail_tt: "Our [crown_power|e] has not yet reached 30%, so the attempt fails and the backlash costs us dearly in stability"

  oligarchic_capture.8.title: "Negotiate Estate Concessions"
  oligarchic_capture.8.desc: "Rather than confront the faction outright, we open a quiet channel of negotiation, offering gold and minor concessions to ease its grievances and slow its growth."
  oligarchic_capture.8.a: "Open negotiations."

  oligarchic_capture.12.title: "The Ringleader Courts a Courtier"
  oligarchic_capture.12.desc: "Word reaches us that the faction's ringleader has been quietly courting a member of our own court, offering favors and promises in exchange for support. We can turn a blind eye, or move to shore up the courtier's loyalty."
  oligarchic_capture.12.a: "Let it be; it is not worth the trouble."
  oligarchic_capture.12.b: "Reaffirm the courtier's loyalty to the crown."

  oligarchic_capture.13.title: "The Ringleader Tests the Crown Estate"
  oligarchic_capture.13.desc: "The faction's ringleader publicly tests how far the crown estate's authority still reaches, probing for weakness before an audience of the court. We can let the challenge pass unanswered, or respond firmly."
  oligarchic_capture.13.a: "Let the challenge pass."
  oligarchic_capture.13.b: "Respond firmly."

  oligarchic_capture.10.title: "Rally the Citizenry"
  oligarchic_capture.10.desc: "Heralds carry our call through every ward and marketplace: the republic belongs to its citizens, not to a clique of grandees. The squares fill with those ready to reaffirm the old order, though such gatherings are never without risk of disorder."
  oligarchic_capture.10.a: "To the squares!"

  oligarchic_capture.11.title: "Purge the Oligarchs"
  oligarchic_capture.11.desc: "We resolve to strike directly at the faction's leadership. Arrests are made, their networks disrupted, and their grip on our institutions loosened. The nobility bristles at the heavy hand, and the realm shudders, but the oligarchs are set back."
  oligarchic_capture.11.a: "Strike at their leaders."
