l_english:

 flavor_iberian_union.1.title: "The Iberian Wedding"
 flavor_iberian_union.1.desc: "The marriage uniting the crowns of [iu_member_a.GetName] and [iu_member_b.GetName] is an opportunity to forge a lasting bond between our realms. While the union was born out of political need, the [ROOT.GetCountry.GetGovernment.GetAdjective] couple seem quite happy in their marriage, and they work together to stabilize the union and build a lasting political construct that can be considered a major power in [ShowContinentName('europe')]."
 flavor_iberian_union.1.historical_info: "The most famous of the Iberian dynastic unions was forged in 1469 by the marriage of Isabella I of Castile and Ferdinand II of Aragon, the Catholic Monarchs. Their union joined the two greatest crowns of the peninsula while preserving the separate institutions of each, and their grandson Charles would inherit both as a single realm. A century later, in 1580, Philip II of Spain pressed his claim to the vacant Portuguese throne, uniting Castile, Aragon, and Portugal under the Spanish Habsburgs until the Portuguese Restoration of 1640."
 flavor_iberian_union.1.a: "Let us ensure a lasting legacy for the union."

 flavor_iberian_union.2.title: "The Iberian Union"
 flavor_iberian_union.2.desc: "The crowns of [ShowRegionName('iberia_region')] have passed to a single sovereign. What began as a marriage between two houses has become a personal union, the thrones of our realms now resting upon one brow. Each kingdom keeps its own laws, its own courts, and its own pride, but in matters of legitimacy and dynasty they speak with one voice. The Iberian Union is born, and with it the promise of a power to rival any in Christendom."
 flavor_iberian_union.2.historical_info: "When the heir of two crowns inherited both, the result was not a single kingdom but a composite monarchy: separate realms sharing a sovereign. This was the constitutional reality of the Spanish Monarchy, in which Castile, Aragon, and later Portugal each retained their own #italic Cortes#!, laws, and administration under a common king. Such unions endured only so long as a shared dynasty endured, and the failure of an heir could divide what marriage had joined."
 flavor_iberian_union.2.a: "Let our realms prosper as one."

 flavor_iberian_union.3.title: "The Iberian Wedding"
 flavor_iberian_union.3.desc: "The matter of succession looms heavily over [ROOT.GetCountry.GetName] while [initiator_candidate.GetName] remains unmarried. Our [ROOT.GetCountry.GetGovernment.GetCourtTitle] is pushing the [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] to seek a marriage in order to secure the succession, and it has been proposed that we should unite our fortunes with one of the other [ShowReligionGroupAdjective('christian')] crowns of [ShowRegionName('iberia_region')]. Without a strong successor, our [ROOT.GetCountry.GetFlavorRank] could face turmoil, rival claimants, or even foreign interference."
 flavor_iberian_union.3.historical_info: "The event called the Iberian Wedding reflects the succession of Henry IV of Castile. After his death, two claimants vied for the throne: Isabella of Castile, supported by her husband Ferdinand of Aragon, and her niece Joana, backed by Portugal. The conflict ended with Isabella and Ferdinand's victory, securing Isabella's rule and marking the beginning of the famous Catholic Monarchs' reign. This union of Castile and Aragon would later lead to the creation of a unified Spain."
 flavor_iberian_union.3.a: "Send the marriage offer to [iu_partner_a.GetNameWithNoTooltip]."
 flavor_iberian_union.3.b: "Turn to [iu_partner_b.GetNameWithNoTooltip] instead."
 flavor_iberian_union.3.c: "We shall figure out another way."

 flavor_iberian_union.4.title: "The Iberian Wedding"
 flavor_iberian_union.4.desc: "An envoy from [iu_initiator.GetName] has reached our [ROOT.GetCountry.GetGovernment.GetCourtTitle]. They propose a dynastic marriage between [initiator_candidate.GetName] and [iu_chosen_candidate.GetName] of our own house, to unite our realms. Their offer carries the promise of mutual prosperity and stability, yet some of our advisors view it with skepticism. While such a union could secure an alliance against common foes and potentially lead to the unification of crowns, others warn it may threaten our independence in the long term."
 flavor_iberian_union.4.a: "We have nothing to lose."
 flavor_iberian_union.4.b: "It would be wiser to reject the offer."

 flavor_iberian_union.5.title: "Royal Marriage Accepted"
 flavor_iberian_union.5.desc: "The bells ring out across our [ROOT.GetCountry.GetFlavorRank] and that of [iu_chosen.GetName] alike as [initiator_candidate.GetName] and [iu_chosen_candidate.GetName] are wed into a single [ROOT.GetCountry.GetGovernment.GetAdjective] house. People line the streets, and both courts toast a bond that ambassadors and bishops have labored to arrange. What was once a matter of cold statecraft is sealed now in vows and celebration.\n\nThe match secures far more than a season of festivities. Our dynasties are joined, our houses bound by blood, and should this marriage be blessed with a child to inherit both crowns, the day may come when our two realms are ruled as one. For now our succession stands the firmer for it, and our standing among the courts of Christendom rises with the splendor of the occasion."
 flavor_iberian_union.5.a: "A joyous occasion!"

 flavor_iberian_union.6.title: "Royal Marriage Declined"
 flavor_iberian_union.6.desc: "Our marriage proposal has been rejected by [iu_chosen.GetName]. Although this decision will most certainly stain our relationship for years to come, it most importantly still leaves the question of our succession unsolved."
 flavor_iberian_union.6.a: "We shall find another solution."

 flavor_iberian_union.7.title: "Passed Over"
 flavor_iberian_union.7.desc: "[iu_initiator.GetName] have chosen to bind their house to [iu_chosen.GetName] rather than to ours, even when we were an equally valid option. The slight stings, yet it is not without opportunity: an insult like that is justification enough to take by force what should have been ours by marriage."
 flavor_iberian_union.7.a: "Their slight will not go unanswered."

 iu_marriage_may_form_union_tt: "This may lead to the formation of a [union|e]"
 iu_spurned_will_be_displeased_tt: "[iu_spurned.GetName] may not take kindly to being passed over for this match"
