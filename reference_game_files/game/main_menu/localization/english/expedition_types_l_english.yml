 expedition_category_exploration: "Exploration"
 expedition_category_commercial: "Commercial"
 expedition_category_military: "Military"
 expedition_category_religious: "Religious"
 expedition_category_diplomatic: "Diplomatic"

 EXPEDITION_VARIABLE_MONTHLY_CHANGE_TITLE: "Monthly change of [MonthlySavedVariable.GetMonthlyChangeValue(Expedition.GetBaseClass)|+=2] due to:"
 EXPEDITION_VARIABLES_TT_TITLE: "Expedition Variables"

 pilgrimage_expedition: "The Great Pilgrimage"
 pilgrimage_expedition_desc: "Our ruler will set out on a holy pilgrimage to the sacred places of the [ShowReligionAdjective('catholic')] faith."
 pilgrimage_expedition_historical_info: "Jerusalem has drawn Christian pilgrims since the 4th century, when the Emperor Constantine commissioned the Church of the Holy Sepulchre on the site of Christ's burial and resurrection. The city changed hands repeatedly during the Crusades, captured by the First Crusade in 1099, lost to Saladin in 1187, and briefly recovered by treaty under Frederick II in 1229 before falling permanently to Mamluk control. Despite the loss of Christian rule, the holy sites remained accessible to pilgrims through diplomatic arrangement, making Jerusalem the supreme destination of Catholic devotion throughout the medieval world."
 pilgrimage_expedition_outcome_overview: "$BULLET$Each [holy_site|e] our [ruler|e] reaches offers its own reward on arrival, whether further [legitimacy|e], [prestige|e], or the gratitude of the [ShowEstateTypeName('clergy_estate')].\n$BULLET$Completing the pilgrimage then grants, scaled by how devoutly it was conducted:\n$BULLET_WITH_TAB$Up to #G +20#! [legitimacy].\n$BULLET_WITH_TAB$[ShowEstateTypeName('clergy_estate')] [estate_satisfaction|e].\n$BULLET_WITH_TAB$Improved [opinion|e] from [GetCountry('PAP').GetName]."

 piety: "Piety"
 piety_desc: "How devoutly the pilgrimage is being conducted. Fades gradually while traveling and is spent by worldly choices along the way. If it runs out entirely, the pilgrimage collapses into disgrace; kept high, it magnifies the pilgrimage's eventual rewards."
 retinue: "Retinue"
 retinue_desc: "The pilgrim ruler's escort. Does not wear down on its own, only through misfortune on the road. If it is ever fully lost, the ruler is left dangerously exposed and the pilgrimage fails."
 pilgrimage_expedition_cooldown: "The Great Pilgrimage"
 pilgrimage_expedition_ruler_owner_tt: "[pilgrimage_ruler.GetName] resides in [pilgrimage_ruler.GetCourtCountry.GetName]"

 holy_site_pilgrimage_expedition: "Pilgrimage to a Holy Site"
 holy_site_pilgrimage_expedition_desc: "Our ruler sets out for a single chosen holy site, to pray, to be seen praying, and to return with the prestige and religious currency that comes from the journey. Launched from the pilgrimage action, not the expedition outliner."
 holy_site_pilgrimage_expedition_outcome_overview: "$BULLET$Arriving at the chosen [holy_site|e] grants a reward depending on our [religion|e]:\n$BULLET_WITH_TAB$#G +10#! [religious_influence|e], [purity|e], or [karma|e], scaling with the distance from our capital to as much as #G +100#!.\n$BULLET_WITH_TAB$[ShowReligionGroupAdjective('folk_peruvian_group')] religions instead shift [yanantin|e] by #Y 20#! toward the nature of the [holy_site]'s [god|e].\n$BULLET_WITH_TAB$Eligible [ShowReligionGroupAdjective('muslim')] schools shift #Y 10#! further toward [ShowSocietyDirectionName('mysticism')] or [ShowSocietyDirectionName('jurisprudence')]."
 holy_site_pilgrimage_expedition_order_zeal_tt: "For years to come, the pilgrims' devotion at this holding will stir the zeal of the order that keeps it"
 holy_site_pilgrimage_cooldown: "Pilgrimage to a Holy Site"

 treasure_fleet_expedition: "The Treasure Fleet"
 treasure_fleet_expedition_desc: "Dispatch the imperial treasure fleet on a voyage of state to a chosen region. The fleet sails the coastal sea lanes toward its destination and back, calling at foreign ports along the way. The voyage extends the court's diplomatic reach, distributes gifts and [ShowGoodsName('silk')] to the rulers of the southern seas, collects tribute, and returns with rare goods, ambassadors, and the names of kings who have learned the sound of a Chinese sail."
 treasure_fleet_expedition_outcome_overview: "$BULLET$The fleet sails with a cargo of gifts paid from our treasury.\n$BULLET$On a safe return, whatever is left unspent becomes [gold|e], plus #G +10#! [prestige|e].\n$BULLET$Each foreign court also responds differently:\n$BULLET_WITH_TAB$A court that receives us well grants a further #G +5#! [prestige], may join the [GetUniqueInternationalOrganization('middle_kingdom').GetName] as our tributary, and sends tribute and rare gifts that enrich our [market|e].\n$BULLET_WITH_TAB$A court that refuses tributary status instead costs #R -50#! [opinion|e] between us and gets [ShowModifier('chi_resisting_subjugation')]."
 treasure_fleet_cooldown: "The Treasure Fleet"

 western_ocean_voyage_expedition: "Voyage into the Western Ocean"
 western_ocean_voyage_expedition_desc: "Dispatch a fleet westward across the open Atlantic in search of a sea route to the Indies. No chart prepares us for what lies beyond the [ShowAreaName('canary_islands_area')], only wind, water, and the hope that the ocean is narrower than the scholars believe."
 western_ocean_voyage_expedition_historical_info: "The idea of reaching Asia by sailing west had been debated by European scholars for decades before the first such voyage was attempted. The chief obstacle was not the shape of the earth, which educated people understood to be spherical, but its size. Most scholars correctly estimated the ocean to be far too wide to cross. The expeditions that proved them wrong did so not by disproving the estimate, but by finding something unexpected in the way."
 western_ocean_voyage_expedition_outcome_overview: "$BULLET$The voyage charts the open ocean as it sails, revealing the coasts it reaches.\n$BULLET$Making landfall then grants:\n$BULLET_WITH_TAB$#G +10#! [prestige|e].\n$BULLET_WITH_TAB$#G +10#! [legitimacy|e].\n$BULLET_WITH_TAB$A further #G +20#! [prestige] for discovering the Americas, opening the New World to future colonization."
 western_ocean_voyage_cooldown: "Voyage into the Western Ocean"

 hajj_caravan_expedition: "The Royal Ḥajj"
 hajj_caravan_expedition_desc: "Dispatch our ruler on the pilgrimage to [ShowLocationName('mecca')], fulfilling one of the Five Pillars of Islam. The road is long and the journey costly, but a ruler who returns from the holy city carries an authority that no army can confer."
 hajj_caravan_expedition_historical_info: "The Abbasid Caliph Hārūn ar-Rašīd made the pilgrimage from Baghdad nine times during his reign (786–809), even traveling part of the route on foot as an act of piety, and his devotion became a model that pious rulers strove to emulate for centuries after."
 hajj_caravan_expedition_religious_influence_bullet: "$BULLET_WITH_TAB$#G +20#! [religious_influence|e].\n"
 hajj_caravan_expedition_outcome_overview: "$BULLET$Reaching [ShowLocationNameWithNoTooltip('mecca')] rewards the caravan's splendor there, up to:\n$BULLET_WITH_TAB$#G +20#! [prestige|e].\n[SelectLocalization(RELIGION.HasReligiousInfluence, 'hajj_caravan_expedition_religious_influence_bullet', '')]$BULLET$Returning home then grants:\n$BULLET_WITH_TAB$#G +10#! [legitimacy|e].\n$BULLET_WITH_TAB$The 5-year [ShowModifier('hajj_pious_return')] [modifier|e].\n$BULLET_WITH_TAB$The permanent [ShowModifier('hajji_pilgrim')] honor, for a [ruler|e]'s first Ḥajj.\n$BULLET$The caravan must reach [ShowLocationNameWithNoTooltip('mecca')] within the same year it departed, or the pilgrimage is lost entirely."

 guards: "Guard Escort"
 guards_desc: "The caravan's armed escort. Raised by hiring guards or bearing the #italic maḥmal#! along the road, and worn down by raids and hardship. A well-guarded caravan is more likely to survive an attack."
 splendor: "Splendor"
 splendor_desc: "How lavishly the caravan is provisioned and adorned. Raised by lavish spending and displays of wealth, and reduced by storms and hardship along the road. Determines the caravan's reward on reaching [ShowLocationNameWithNoTooltip('mecca')]."
 hajj_caravan_cooldown: "The Royal Ḥajj"

 circumnavigation_expedition: "Circumnavigation of the Globe"
 circumnavigation_expedition_desc: "Dispatch a fleet westward to circumnavigate the entire world: south past [ShowRegionName('la_plata_region')], through the passage at the bottom of the earth, across an ocean with no name, to the Spice Islands and home again around [ShowLocationName('good_hope_cape')]. No fleet has done this. It is not certain it can be done."
 circumnavigation_expedition_historical_info: "In September 1519, Ferdinand Magellan departed from Sanlúcar de Barrameda under contract with the Spanish Crown to find a western route to the Spice Islands. The expedition comprised five ships: the #italic Trinidad#!, #italic San Antonio#!, #italic Concepción#!, #italic Victoria#!, and #italic Santiago#!. Magellan was a Portuguese navigator who had sailed to India and the Moluccas in Portuguese service before transferring his allegiance to the Spanish Crown after King Manuel I refused to increase his stipend. The voyage would become the first circumnavigation of the Earth, though Magellan himself would not live to see its completion."
 circumnavigation_expedition_outcome_overview: "$BULLET$Being the first country in the world to circle the globe grants:\n$BULLET_WITH_TAB$#G +100#! [prestige|e].\n$BULLET_WITH_TAB$#G +10#! [legitimacy|e].\n$BULLET_WITH_TAB$The [ShowModifier('first_circumnavigation')] [modifier|e].\n$BULLET$Any completion also grants:\n$BULLET_WITH_TAB$#G +10#! [prestige].\n$BULLET_WITH_TAB$A further #G +10#! for bringing home at least three ships.\n$BULLET_WITH_TAB$#G +5#! for a crew in good spirits.\n$BULLET_WITH_TAB$The [ShowGoodsName('cloves')] gathered in the [ShowAreaName('moluccas_area')], sold at market price for [gold|e]."
 circumnavigation_expedition_low_morale_prestige_tt: "Low crew morale reduces the Prestige gained"
 circumnavigation_expedition_high_morale_prestige_tt: "High crew morale increases the Prestige gained"

 morale: "Crew Morale"
 morale_desc: "The spirit of the crew. Low morale risks mutiny."
 provisions: "Provisions"
 provisions_desc: "Food and water for the journey. Drains steadily while traveling, and running out endangers the company."
 num_ships: "Ships"
 num_ships_desc: "Vessels still with the fleet. If none remain, the expedition is lost."
 cargo: "Cargo"
 cargo_desc: "Valuables loaded during the voyage, sold at market on the fleet's return."

 cape_route_to_india_expedition: "The Cape Route to India"
 cape_route_to_india_expedition_desc: "Dispatch a fleet south along the African coast and around the great southern Cape, forging a sea road to the Spice Islands that bypasses every Ottoman toll and Venetian middleman. The route is brutal, two years of open ocean, unknown coasts, and storms that scatter ships, but the first nation to open it will command the spice trade of the world."
 cape_route_to_india_expedition_historical_info: "The Portuguese expedition to find a sea route to $india$ was the culmination of nearly a century of incremental southward exploration along the African coast. Bartolomeu Dias had rounded the Cape of Good Hope in 1488, proving the route was possible. Vasco da Gama's 1497-99 voyage completed the mission, returning with enough pepper and spices to pay for sixty times the cost of the expedition. The voyage fundamentally changed the global spice trade, breaking the Venetian and Ottoman monopoly on overland routes."
 cape_route_to_india_expedition_outcome_overview: "$BULLET$Each stop along the African coast can found a [ShowBuildingTypeName('por_feitoria')] or, on an unclaimed harbor, a [ShowBuildingTypeName('por_trading_post')] and outright possession of the [location|e], each with its own lasting trade [modifier|e].\n$BULLET$Reaching [ShowLocationName('kozhikode')] grants [ShowModifier('calicut_trade_rights')] and a hold of [ShowGoodsName('pepper')] sold at market price for [gold|e].\n$BULLET$Completing the route then grants:\n$BULLET_WITH_TAB$#G +20#! [prestige|e].\n$BULLET_WITH_TAB$#G +10#! [legitimacy|e].\n$BULLET_WITH_TAB$The permanent [ShowModifier('cape_route_pioneer')] [modifier], or [ShowModifier('portuguese_african_network')] or [ShowModifier('east_africa_trade_dominance')] instead, with three or five feitorias established."
 cape_route_to_india_expedition_low_morale_prestige_tt: "Low crew morale reduces the Prestige gained"
 cape_route_to_india_expedition_high_morale_prestige_tt: "High crew morale increases the Prestige gained"

 grand_tour_expedition: "The Grand Tour"
 grand_tour_expedition_desc: "Our heir will leave on an extended journey through the great cities of [ShowRegionName('italy_region')] — [ShowLocationName('florence')], [ShowLocationName('rome')], [ShowLocationName('venice')], and [ShowLocationName('naples')] — to study at the foot of the [ShowInstitutionName('renaissance')]. The heir who returns is not the same person who departed. Everything learned, and from whom, will shape the character carried to the throne."
 grand_tour_expedition_historical_info: "The Grand Tour, the practice of sending young European aristocrats on an extended educational journey through Italy, emerged gradually in the fifteenth and sixteenth centuries and became a formal institution among the northern European nobility by the seventeenth. Florence, Rome, Venice, and Naples formed the canonical circuit, each offering something the courts of the north lacked: humanist scholarship, classical antiquity, the art of Renaissance patronage, and the ceremony of the oldest royal courts in Europe. Participants were expected to return transformed, fit for statecraft and diplomacy in a way that domestic tutors could not achieve."
 grand_tour_expedition_outcome_overview: "$BULLET$Every city visited builds up knowledge, connections, or experience depending on the choice made, and grants [research_progress|e] for time spent studying or [legitimacy|e] for time spent at court.\n$BULLET$Reaching at least three of the great cities of [ShowRegionNameWithNoTooltip('italy_region')] then grants:\n$BULLET_WITH_TAB$Either [ShowTraitName('free_thinker')], [ShowTraitName('well_connected')], or [ShowTraitName('worldly')], depending on whichever ended up highest.\n$BULLET_WITH_TAB$The permanent [ShowModifier('returned_from_grand_tour')] [modifier|e].\n$BULLET_WITH_TAB$#G +10#! [prestige|e].\n$BULLET$A shorter tour earns only #G +5#! [prestige] and no [trait|e]."
 grand_tour_expedition_heir_completed_tt: "Heir has not already completed the Grand Tour"
 grand_tour_expedition_stalled_status: "In Residence"

 gt_diligence: "Diligence"
 gt_diligence_desc: "The heir's aptitude for learning from the tour, set from their [ability|e] scores at departure. A more diligent heir gets more out of what the journey has to teach."
 knowledge: "Knowledge"
 knowledge_desc: "Learning gained from theoretical study along the tour — libraries, lectures, and the company of scholars. A heir who ends the tour with more knowledge than anything else returns a [ShowTraitName('free_thinker')]."
 connections: "Connections"
 connections_desc: "Relationships built at the courts visited along the tour. A heir who ends the tour with more connections than anything else returns [ShowTraitName('well_connected')]."
 experience: "Experience"
 experience_desc: "Practical, hands-on exposure gained along the tour — workshops, harbors, and counting-houses. A heir who ends the tour with more experience than anything else returns [ShowTraitName('worldly')]."
 grand_tour_cooldown: "The Grand Tour"

 grand_embassy_expedition: "The Grand Embassy"
 grand_embassy_expedition_desc: "Send the ruler through the courts of Western Europe under a borrowed name, to study the institutions, the army, and the navy of the states that have already modernized. A delegation announced as royalty gets banquets and empty courtesy; one that keeps its head down gets into the actual shipyards and drafting rooms. Word gets around, though, and a ruler recognized too soon finds the doors already shut."
 grand_embassy_expedition_outcome_overview: "$BULLET$How discreetly the delegation travels decides how long its true purpose stays hidden from each host, and how the court reacts once it is found out.\n$BULLET$Every court visited grants a number of Opportunities to learn from it, and chance encounters along the way can grow the ruler's own abilities, deepen Modernization, or wear away at Discretion.\n$BULLET$Once the embassy concludes, its accumulated Modernization boosts [institutions|e] progress across every location we own, our capital more than the rest, [army_tradition|e], and, if a port was ever visited, [navy_tradition|e].\n$BULLET$A court that turns the delegation away costs [prestige|e]; one that grants access, or is begged for more of it, rewards [prestige|e] and further Opportunities."
 grand_embassy_expedition_institution_spread_tt: "Advances the chosen institution by [GetVariable('grand_embassy_institution_progress_amount')|V0] progress in every owned location that lacks it, and by [GetVariable('grand_embassy_institution_progress_capital_amount')|V0] in the capital"
 grand_embassy_expedition_stalled_status: "Learning"
 discretion: "Discretion"
 discretion_desc: "How well the delegation's true purpose, and the ruler's identity, are being kept from wider notice. Above 90, the court takes the delegation for ordinary envoys and nobody suspects a thing. At 90 or below, the host has worked out who truly travels among them, whether through simple suspicion or a spy network of their own."
 modernization: "Modernization"
 modernization_desc: "The delegation's accumulated progress absorbing Western methods. Each lesson learned adds to it, and the more of it the ruler brings home, the greater the reward once the embassy concludes."
 opportunities: "Opportunities"
 opportunities_desc: "How much access the delegation was given to learn from this particular court. Set anew at every stop, depending on how openly the ruler chose to be presented there."

 pacific_crossing_expedition: "Search for the Tornaviaje"
 pacific_crossing_expedition_desc: "Dispatch a fleet from our Pacific coast in the Americas to find the #italic tornaviaje#! — a reliable return route across the greatest ocean on earth. The trade winds carry a ship west to Asia readily enough; sailing home against them has defeated every attempt, and until a passage back is charted, our colonies and the riches of the Spice Islands remain out of reach. The first nation to find the way home will bind the Americas to Asia and open the galleon trade across the Pacific."
 pacific_crossing_expedition_historical_info: "The eastward return — the #italic tornaviaje#! — was the great unsolved problem of the early Pacific. Álvaro de Saavedra, sailing from New Spain, was twice driven back by the trade winds in 1528 and 1529 and died in the attempt; Ruy López de Villalobos's expedition of 1542 likewise reached Asia but could find no way home. Not until 1565 was a reliable return route discovered, and until then a fleet could reach Asia but never bring its cargo back."
 pacific_crossing_expedition_outcome_overview: "$BULLET$Charting the return route across the [ShowContinentName('pacific_ocean_continent')] grants:\n$BULLET_WITH_TAB$#G +100#! [prestige|e].\n$BULLET_WITH_TAB$#G +15#! [legitimacy|e].\n$BULLET_WITH_TAB$A lasting trade route [modifier|e].\n$BULLET_WITH_TAB$The [ShowGoodsName('cloves')] gathered in the [ShowAreaName('moluccas_area')], sold at market price for [gold|e].\n$BULLET_WITH_TAB$Permanent access to the [ShowDecisionName('charter_manila_galleon')] [decision|e], which can be taken again every five years for a substantial [gold] return.\n$BULLET$A fleet that never finds the way home earns nothing at all."
 pacific_crossing_expedition_low_morale_prestige_tt: "Low crew morale reduces the Prestige gained"
 pacific_crossing_expedition_high_morale_prestige_tt: "High crew morale increases the Prestige gained"

 cartographic_survey_expedition: "Coastal Survey"
 cartographic_survey_expedition_desc: "Dispatch a survey vessel along our own coastline to chart its harbors, sound its shallows, and mark its hazards. The work is unglamorous, but the resulting charts will hold for a generation, and every future expedition will be cheaper and faster to outfit because of them."
 cartographic_survey_expedition_historical_info: "Systematic coastal surveying began in earnest in the sixteenth century, when the rising volume of maritime trade made accurate charts a matter of state interest. The #italic Casa de Contratación#! in Seville and the Portuguese #italic Armazém da Guiné e Índia#! both maintained official cartographers whose business was the production and updating of sea charts, and the Dutch admiralties followed suit in the seventeenth century."
 cartographic_survey_expedition_outcome_overview: "$BULLET$Each [port|e] surveyed can leave behind a lasting [location_modifier|e] for 10 to 20 years, raising its output of one of several goods, such as [ShowGoodsName('fish')], [ShowGoodsName('pearls')], or [ShowGoodsName('amber')], or improving the harbor itself, and earns [prestige|e] besides.\n$BULLET$Surveying three or more ports then also grants:\n$BULLET_WITH_TAB$The 15-year [ShowModifier('accurate_charts')] [modifier|e].\n$BULLET_WITH_TAB$#G +10#! [prestige].\n$BULLET$Surveying fewer earns only #G +5#! [prestige]."
 cartographic_survey_cooldown: "Coastal Survey"

 mining_survey_expedition: "Highland Prospecting Survey"
 mining_survey_expedition_desc: "Send a team of prospectors and assayers into our highland country to walk the streambeds, hammer the outcrops, and test the rocks for precious metals. The hills have given up their wealth before, and the hard-won knowledge of an old miner is worth a year of court speculation."
 mining_survey_expedition_historical_info: "Systematic prospecting was practiced across medieval and early modern Europe, most famously in the Erzgebirge mountains of Saxony and Bohemia, where the discovery of silver veins in the twelfth century created the boom towns of Freiberg, Jáchymov, and Schneeberg. Georgius Agricola's #italic De re metallica#! (1556) became the standard textbook of the craft, describing in detail the use of divining rods, the assay of ore samples in small crucibles, and the legal customs governing the staking of claims."
 mining_survey_expedition_outcome_overview: "$BULLET$Every survey leaves behind the 20-year [ShowModifier('thorough_survey')] [modifier|e], raising raw material output across the country.\n$BULLET$Each strike made also leaves a rich deposit behind, such as the [ShowModifier('rich_silver_vein')] or [ShowModifier('rich_gold_strike')], and can be worked openly for [prestige|e] or quietly for [gold|e].\n$BULLET$This also grants:\n$BULLET_WITH_TAB$#G +10#! [prestige] for two or more strikes.\n$BULLET_WITH_TAB$#G +5#! for any highland surveyed."
 mining_survey_cooldown: "Highland Prospecting Survey"

 relic_expedition: "The Relic Hunt"
 relic_expedition_desc: "Send an expedition to [ShowLocationName('jerusalem')], and from there onward across the Holy Land and the wider [ShowRegionName('crescent_region')], chasing rumors of a relic that may be recovered by whoever is patient and lucky enough to find it."
 relic_expedition_historical_info: "The medieval and early modern relic trade was a substantial commerce. Catholic and Orthodox communities competed for the most prestigious objects, and sales, exchanges, and outright thefts moved relics across Christendom for centuries. The Crusader states' own relics were especially exposed to this trade: the True Cross captured at Hattin in 1187 was never recovered, and the Holy Lance discovered at Antioch in 1098 disappears from the historical record shortly after the First Crusade. Both losses fed centuries of rumor about where such objects might still be found."
 relic_expedition_outcome_overview: "$BULLET$The relic actually found depends on chance and on how the search unfolds: it may be the long-lost True Cross or Holy Lance themselves, or a more modest relic such as a nail, a bone, or a fragment.\n$BULLET$Whatever is found becomes a physical [work_of_art|e] carried home to our capital."
 clues: "Clues"
 clues_desc: "How close the expedition is to picking up a relic's trail for certain. Starts from a single rumor, and grows or shrinks with every lead chased down. If it ever runs out entirely, the search might be called off."
 hunt_retinue: "Retinue"
 hunt_retinue_desc: "The expedition's guards, interpreter, and scholarly attaché. Does not wear down on its own, but if it is ever fully depleted, the expedition is dispersed and the hunt fails."
 relic_expedition_cooldown: "The Relic Hunt"
 relic_expedition_found_relic_true_cross_tt: "We have recovered $relic_true_cross_found$"
 relic_expedition_found_relic_holy_lance_tt: "We have recovered $relic_holy_lance_found$"
 relic_expedition_found_relic_holy_shroud_tt: "We have recovered $relic_holy_shroud_found$"
 relic_expedition_found_relic_holy_nail_tt: "We have recovered $relic_holy_nail_found_1$"
 relic_expedition_found_relic_true_cross_fragment_tt: "We have recovered $relic_true_cross_fragment_found_1$"
 relic_expedition_found_relic_saint_bones_tt: "We have recovered $relic_regional_saint_bones_found_1$"
 relic_expedition_found_relic_baptist_head_tt: "We have recovered $relic_baptist_head_found_1$"
 relic_expedition_found_relic_virgin_milk_tt: "We have recovered $relic_virgin_milk_found_1$"
 relic_expedition_found_relic_holy_thorn_tt: "We have recovered $relic_holy_thorn_found_1$"
 relic_expedition_found_relic_holy_chalice_tt: "We have recovered $relic_holy_chalice_found_1$"
 relic_expedition_found_relic_titulus_crucis_tt: "We have recovered $relic_titulus_crucis_found_1$"


