 TRADE_ORDER_MODE_PROFIT: "Profit Focus"
 TRADE_ORDER_MODE_FOOD: "Food Focus"
 TRADE_ORDER_MODE_NEEDS: "Shortage Focus"
 TRADE_ORDER_MODE_PROFIT_WITH_ICON: "@gold! $TRADE_ORDER_MODE_PROFIT$"
 TRADE_ORDER_MODE_FOOD_WITH_ICON: "@food! $TRADE_ORDER_MODE_FOOD$"
 TRADE_ORDER_MODE_NEEDS_WITH_ICON: "@shortage! $TRADE_ORDER_MODE_NEEDS$"
 TRADE_ORDER_MODE_PROFIT_TT: "The order will spend its [merchant_capacity|e] on the most profitable [trades|e] it can find among the selected goods and markets."
 TRADE_ORDER_MODE_FOOD_TT: "The order will spend its [merchant_capacity|e] on the [trades|e] that move the most [food|e] to markets that are losing food and have less than [GetDefine('NAI','TRADE_ORDER_FOOD_MAINTAIN_STOCKPILE_FRACTION')|V0%] [food_stockpile|e]."
 TRADE_ORDER_MODE_NEEDS_TT: "The order will spend its [merchant_capacity|e] to cover the [goods|e] shortages of its target markets, entry by entry in order. Only goods whose [stockpile|e] is below [GetDefine('NAI','TRADE_ORDER_NEEDS_STOCKPILE_EXCLUSION_FRACTION')|V0%] are supplied."
 TRADE_ORDER_MODE_PROFIT_INFO: "This order prioritizes #italic profit#!: it spends its [merchant_capacity|e] on the most profitable [trades|e] among the selected goods and markets."
 TRADE_ORDER_MODE_FOOD_INFO: "This order prioritizes #italic food#!: it spends its [merchant_capacity|e] on the [trades|e] that move the most [food|e] to markets in need.\n\nA market is only helped while it would lose food without this order and its [food_stockpile|e] is below [GetDefine('NAI','TRADE_ORDER_FOOD_MAINTAIN_STOCKPILE_FRACTION')|V0%]. Below [GetDefine('NAI','TRADE_ORDER_FOOD_GROWTH_STOCKPILE_FRACTION')|V0%] the order also refills the stockpile by [GetDefine('NAI','TRADE_ORDER_FOOD_MONTHLY_STOCKPILE_GAIN')|V0%] of its maximum per month. Above [GetDefine('NAI','TRADE_ORDER_FOOD_MAINTAIN_STOCKPILE_FRACTION')|V0%] the market is considered supplied and receives nothing.\n\nExports pause while the order's own market is below [GetDefine('NAI','TRADE_ORDER_FOOD_EXPORT_SELF_STOP_FRACTION')|V0%] [food_stockpile] and are canceled below [GetDefine('NAI','TRADE_ORDER_FOOD_EXPORT_SELF_CANCEL_FRACTION')|V0%]."
 TRADE_ORDER_MODE_NEEDS_INFO: "This order prioritizes #italic needs#!: it spends its [merchant_capacity|e] to cover each good in the list, in order, with earlier goods first.\n\nA good is only supplied while the target market consumes more of it than it produces locally and its [stockpile|e] is below [GetDefine('NAI','TRADE_ORDER_NEEDS_STOCKPILE_EXCLUSION_FRACTION')|V0%]. The order moves just enough to bring the balance back to zero, counting help already arriving from others, and ignores shortages caused only by exports.\n\nWhile a good's [stockpile|e] is below [GetDefine('NAI','TRADE_ORDER_NEEDS_GROWTH_STOCKPILE_FRACTION')|V0%] the order also refills it by [GetDefine('NAI','TRADE_ORDER_NEEDS_MONTHLY_STOCKPILE_GAIN')|V1%] of its maximum per month; between that and [GetDefine('NAI','TRADE_ORDER_NEEDS_STOCKPILE_EXCLUSION_FRACTION')|V0%] it only covers the balance."
 TRADE_ORDER_NEW_TOOLTIP_SUMMARY: "New [trade_order|e] allocating [TradeOrderLateralView.GetEffectiveTC|2]@trade_capacity!. The AI will create [trades|e] for it once you apply."
