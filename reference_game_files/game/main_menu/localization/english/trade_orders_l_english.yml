 TRADE_ORDER_MIN_PROFIT_TT: "The order will not be allowed to do [trades] below this threshold, ensuring a certain profitability.\n\nIf negative, or unchecked, the [trade_order] will be allowed to run [trades] at a net loss, effectively subsidizing the [trade].\n\nThe closer a good's best [trade] profit sits to this threshold, the slower and smaller the trade capacity the order commits to that good — it may leave capacity unused rather than crash the good's price; the further above the threshold, the faster and further it scales up."
 TRADE_ORDER_MIN_PROFIT_ENABLE_TT: "Enforce a minimum profit per unit of [merchant_capacity]. The [trade_order_short] will not do [trades] below this threshold."
 TRADE_ORDER_MIN_PROFIT_DISABLE_TT: "Stop enforcing a minimum profit. The [trade_order_short] will be able to run [trades] at a loss."
