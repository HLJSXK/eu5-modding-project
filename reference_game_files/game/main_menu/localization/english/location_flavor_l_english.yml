l_english:
 stockholm_desc: "This town was founded in 1252 by Birger Jarl, on a strategically chosen site where Lake Mälaren meets the Baltic Sea. This allowed Stockholm to serve as both a fortress controlling access to the lake and a trading hub connecting inland Sweden to Hanseatic and Baltic trade networks. By the early 14th century, the iron and copper carried down from the Bergslagen mines, together with the influx of German burghers governing under Lübeck Law, had made Stockholm the foremost town of the Swedish realm."
 paris_desc: "On the banks of the Seine, Paris rose from a modest settlement into the crown jewel of France. With its cathedrals, markets, and schools, it became one of Europe's foremost centers of power and culture."
 london_desc: "Anchored on the Thames, London grew from Roman Londinium into England's foremost city. Its thriving trade and royal courts made it the kingdom's political and economic heart."
 rome_desc: "The Eternal City on the Tiber ruled an empire that spanned continents. Even after the fall of its empire, Rome endured as a beacon of faith and authority, home to the Papacy."
 jerusalem_desc: "As the meeting point of faith and struggle, Jerusalem is revered by Jews, Christians, and Muslims alike. Pilgrims and conquerors continuously shape its sacred yet turbulent history."
 alexandria_desc: "The ancient beacon of the Mediterranean, Alexandria thrives as a crossroads of trade and scholarship. Its lighthouse and library once heralded a city where cultures and empires converged."
 constantinople_desc: "Crowned by the Hagia Sophia and encircled by mighty walls, Constantinople once stood as the heart of the Eastern Roman Empire. For a thousand years, its wealth and grandeur made it the envy of the world."
 sitges_desc: "In the Middle Ages, a castle was built on the hill where City Hall now stands. The first owner was the Bishopric of Barcelona, but in the 12th century, it came under the ownership of the family for which it is named."
 valladolid_desc: "Founded in the last decades of the 11th century by Counts Pedro Ansúrez and Eylo Alfonso, Valladolid developed as a commercial town in the very center of the Northern Meseta. By the 14th century, it had become the most important city of the region, along with Burgos, and the main administrative center during the regencies of Queen María de Molina and the reign of her grandson, King Alfonso XI."
 penafiel_desc: "#italic Penna Fidelis#!, 'Faithful Hill', was founded in the 10th century atop a hill that commands the middle section of the Duero river valley, making it a key flashpoint in the border raid warfare against the Caliphate of Córdoba. Count Sancho García of Castile fortified it and granted it a #italic fuero#! sometime around 1013. After this, it grew into a rich town due to its flourishing wine industry, and eventually came under the control of the powerful lineage of Don Juan Manuel."
 toro_desc: "Toro was founded in the 10th century as part of the efforts made by the Kings of León to fortify the border of the kingdom along the Duero river valley in their fight against the Caliphate of Córdoba. It developed later as an important town due to its strategic position, rich farming fields, and vineyards."
 thessaloniki_desc: "Long regarded as the second city of the Byzantine Empire after Constantinople, Thessaloniki owes her wealth and prestige to her strategic commercial position. Her bustling ports channel valuable goods between the rest of Italy and the Roman heartland, serving as a vital bridge between East and West."
 malmo_desc: "A key stronghold on the Øresund, Malmö commands the passage between the Baltic and the North Sea. Its fortified walls and vigilant defenders make it a center of power and a city shaped by strategy and ambition."
 bilbao_desc: "Officially founded in 1300 by Diego López de Haro, Lord of Biscay, the town soon became an important hub in Northern Spain. Nestled in a narrow valley at the start of the Nervión river estuary, the walled settlement developed a prominent shipbuilding industry and became the main point of export of precious Castilian Merino wool and local high-quality iron ore to English and Flemish ports."
 radom_desc: "A city expanded by the last Piast king, Casimir III the Great, it remained an important political center throughout the late Middle Ages and Renaissance. The city also hosted the signing of the Pact of Vilnius and Radom in 1401, and the approval of the #italic Nihil Novi#! Act in 1505 during a parliamentary session in the royal castle."
 krakow_desc: "Starting as a hamlet on Wawel Hill, it was first mentioned by name in 965, described as a notable commercial center of the time. It became the seat of Polish monarchs from the Piast dynasty in 1038, and subsequently served as the center of administration, economy, and culture for the Kingdom of Poland."
 megara_desc: "Founded and inhabited since ancient times, Megara has been ruled by legendary kings such as Nisos and Býzas. The city became a significant power on the Greek peninsula, renowned for its naval strength and thriving trade. Its colonists went on to establish important settlements across the Mediterranean, including Byzantion, Chersónēsos, and Selinoûs. Over time, however, Megara gradually fell into obscurity, retaining only mere traces of its former prominence."
 grojec_desc: "Until the 12th century, it was the seat of the local castellany and archdiocese of Poznań, but it gradually lost its importance in favor of neighboring Czersk."
 gdansk_desc: "Its name, first recorded in the year 997, came from a settlement which existed on the coast of the Baltic Sea. It became a major shipbuilding and trading port, cementing its position as one of the wealthiest and most influential cities in Eastern Europe."
 athens_desc: "Considered the cultural center of Ancient Greece, Athens grew to be one of the mightiest city-states of its time. Constantly competing with Sparta, Thebes, and other prominent states of antiquity, it slowly grew to be the dominating maritime power in the Aegean Sea. With its subjugation under the Macedonian Empire, and later by the Romans and Byzantines, the city faced a major decline, and after 1204 became the capital of a Crusader state."
 wieliczka_desc: "The town of Wieliczka was founded in 1290 by King Przemysł II of Poland, owing to the local extraction of salt deposits. A major mining town, it was granted many privileges, and the local salt mines soon became a major source of royal wealth. The Wieliczka Salt Mine and its sister mine in Bochnia eventually became part of the #italic Żupy Krakowskie#! mining company. In formal documents, the town is known as #italic Wielka Sól#!, meaning #italic Great Salt#!."
 leksand_desc: "This village on the southern coast of Lake Siljan has been populated for several millennia. The Church was built in the early 12th century, and it is now most famous for their first Lutheran minister being an ancestor of Johan."
 leipzig_desc: "Founded in 1165 on the crossroads of the #italic Via Imperii#! and the #italic Via Regia#!, Leipzig grew into a wealthy trade hub. Later gifted with important Imperial privileges, Leipzig was a prominent center for both the fur trade and the developing publishing industry."
 augsburg_desc: "Known as #italic Augusta Vindelicorum#! during the reign of the Roman Emperor Trajan, the Free Imperial City of Augsburg was one of the oldest cities in the Holy Roman Empire. At the end of the Early Middle Ages, Augsburg grew in importance as the site of a successful defense against the invading Hungarians in 955. In 1276, this importance expanded even further as Augsburg received its Imperial City rights from King Rudolf von Habsburg, which opened the path to a prosperous future."
 warsaw_desc: "Originally a small fishing town in Mazovia, the city gained prominence after the capital was moved there from Krakow by Sigismund III in 1596. It became the largest Polish city during the 18th century, undergoing extensive development that contributed greatly to Polish architecture and artisanship."
 tunis_desc: "Founded as Carthage by the legendary Queen Dido, it became the capital of the Punic nation of the same name, destroyed and later rebuilt by the Romans after three bloody wars. The modern city of Tunis was founded by the Arabs in 698 on the outskirts of these ancient ruins. The Almohad conquest in the 12th century saw its elevation to regional capital, a status that was consolidated by the Hafsid dynasty."
 heidelberg_desc: "In the late 12th century, Heidelberg became the seat of the Count Palatine of the Rhine, and a renowned castle was constructed there. Heidelberg is known for being home to the first German university, and therefore it has a long tradition of educational excellence. Afterwards, it became a center of reformation and tolerance, with the Palatinate eventually becoming the leader of the Protestant Union. The castle and its iconic look attracted many poets to the city in later centuries, earning it the nickname #italic the City of Romanticism#!."
 aviles_desc: "Dating back to the 10th century, Avilés developed along an estuary that gave it strategic importance as a port. In the nearby Castle of Gauzón, King Alfonso III of Asturias ordered the craft of the votive Victory Cross, which was covered with gold and precious stones and is now the symbol of the entire kingdom. From the 11th century onward, Avilés became a royal town, recognized for its maritime trade and the storage and distribution of salt."
 pingjin_desc: "Tàiyuán, home to the holy site of Jìn Temple, has been one of the most important cities in Shānxī and northern China since the 5th century BC. In 979, Emperor Tàizōng of Sòng ordered the ancient city of Jìnyáng to be flooded and destroyed upon the conquest of Northern Hàn, and then renamed it the County of Píngjìn (lit. 'Pacification of Shānxī'), a disaster from which the city took a long time to recover."
 dunstable_desc: "Originally a Roman town, Dunstable later developed around its Augustinian priory, becoming an important religious and administrative center. It gained renown as Henry I’s royal residence starting from 1109, and in 1290 an Eleanor Cross was erected there to mark the funeral procession of Eleanor of Castile. In 1533, the town hosted the formal end of Henry VIII’s marriage to his first wife, Catherine of Aragon, and in 1624 became a crucial recruiting point for Cromwell’s forces during the English Civil War."
 paderborn_desc: "Founded as a bishopric around 800 AD, the town rose to prominence as the site of the first meeting between Charlemagne and Pope Leo III. Its strategic and religious significance made it a frequent target during the Thirty Years' War, when it was besieged sixteen times. The town suffered further devastation in 1646 when it was ravaged by Swedish troops."
 porto_desc: "Called the #italic Cidade Invicta#!, or 'Unvanquished City', it gave Portugal its name and made the port wine of the Douro celebrated far beyond its shores."
 jiaxing_desc: "Jiāxīng is a border area between the Wú and Yuè regions. 'Jiā' means beauty and auspiciousness, while 'Xīng' stands for prosperity and thriving."
 torgau_desc: "In 1452, Elector Frederick II established the first bear pit in Torgau, which was steadily enlarged until 1624. It provided space for up to 39 bears."
 changsha_desc: "The city center of Chángshā has remained unchanged since it was founded two thousand years ago."
 ningxiang_desc: "The largest bronze #italic zūn#! (wine vessel) of the Shāng Dynasty (three thousand years ago) was unearthed here."
 wurzburg_desc: "Würzburg rose as a Franconian stronghold, becoming a bishopric in 741. It flourished around its fortress and Main River trade routes in the early Middle Ages."
 hanover_desc: "Hanover rose from a medieval settlement to become a key Holy Roman Empire city, ruled by the Welfs and thriving as a center of trade, power, and culture."
 osnabruck_desc: "Osnabrück, a Medieval trading hub in the Holy Roman Empire, gained renown as a bishopric and for hosting the Peace of Westphalia negotiations."
 glasgow_desc: "Glesca (Glasgow), founded as a Medieval bishopric, flourished around its great cathedral, eventually gaining burgh status, and hosting a university that would shape Scottish scholarship across the following centuries."
 neva_desc: "The Neva delta, once part of the Varangian-Greek trade route, became home to Saint Petersburg in 1703. This city remained Russia's capital for over 200 years."
 dubno_desc: "Dubno, first noted in 1100, grew into a Volhynian trade hub renowned for its fairs and its castle built in 1492. The town was later immortalized in Gogol's #italic Taras Bulba#!."
 baden_desc: "Initially known as #italic Civitas Aurelia Aquensis#! after being founded by the Romans, this city started carrying the name 'Baden-Baden' in the early Middle Ages, lending its name to the Margraves of Baden."
 erbach_desc: "In the late 18th century, Erbach developed into a major center for ivory carving after Count Francis I of Erbach, driven by his passion for antiquities, financed a local ivory carving guild."
 manhattan_desc: "Originally inhabited by the Lenape people, the island that they called Manhatta was bought by Dutch settlers for 60 guilders' worth of trade goods. Here, the Dutch would build a fort, the seat of power for the city of New Amsterdam."
 doncaster_desc: "Once the Roman fort of Danum, by 1337 Doncaster had become a Yorkshire market town on the Great North Road, where rovers and traders carried goods between London and the north."
 kitchissippi_desc: "Named after the Kichi Sibi river, here the Anishinaabe peoples hunted and traded until British settlement expanded the lumber trade, and later made it the seat of colonial administration."
 saint_marceilin_desc: "Founded in the 11th century, Saint-Marcellin was the seat of the Dauphiné Council between 1337 and 1340. It became famous for its soft cheese with a bloomy rind, first served to Louis XI in 1461."
 caerphilly_desc: "Home to the highest-quality coal in Europe, the Welsh Valleys became a center for iron-making in the latter half of the 18th century."
 grenoble_desc: "Grenoble is a modest but strategic town nestled in the French Alps, serving as the capital of the Dauphiné. Surrounded by rivers and mountains, it is protected by walls and dominated by the fortress of the Bastille. Life centers around the cathedral and the narrow, winding streets filled with merchants, artisans, and peasants bringing goods from the surrounding valleys."
 kinsale_desc: "Kinsale is a small but lively port town on Ireland's southern coast, sheltered by its deep natural harbor. Fishing and coastal trade sustained much of its population, with merchants exchanging salted fish, hides, and wool for wine, salt, and luxury goods from Iberia and France. Narrow streets clustered around the quays, where local seafarers mingled with occasional foreign traders. Though modest in size, Kinsale's harbor made it strategically valuable, a gateway between Ireland and continental Europe."
 stockton_desc: "Stockton is an Anglo-Saxon Settlement on the north bank of the River Tees, and was sparsely populated until the Bishop freed the borough serfs, which made it an attractive place for craftsmen to move to. It became an important market for exporting wool and importing wine, though it would not be home to a significant population until the Industrial Revolution."
 kunow_desc: "An important part of the estates of the Bishopric of Kraków, with a parish existing since 1281. Its name probably comes from the marten, or #italic kuna#! in Polish, which were abundant in the local forests."
 lublin_desc: "Lublin was founded as a settlement at the turn of the 12th and 13th centuries, and received its charter from Władysław 'the Elbow-high' in 1317. In the following centuries, the city became an important trading center, and in the 16th century, it experienced its golden age, growing richer thanks to the Union of Lublin and extensive trade, especially with the East."
 kendal_desc: "Kendal was founded with a Roman fort on the bank of the River Kent in the 1st century AD. The town grew under Norman rule, gaining market rights in 1189 from King Richard I in exchange for money towards his crusading, which brought greater prosperity to the town. It became a medieval center for the wool trade and the main castle was owned by the Parr family, of which Catherine Parr, Queen Consort to Henry VIII, is the most famous member."
 cairo_desc: "Founded in 969 by the Fatimid general Jawhar aṣ-Ṣiqillī beside the ancient Roman fortress of Babylon, Al-Qāhira, 'The Victorious', quickly supplanted Alexandria as the heart of Egypt. Under the Ayyubids and Mamluks it grew into the most populous city in the Islamic world, its markets and mosques drawing merchants, scholars, and pilgrims from across three continents. When the Mongols shattered Baghdad in 1258, Cairo stood as the uncontested capital of Islamic civilization, a city of extraordinary grandeur whose minarets rose above a river valley that had sustained human life since the dawn of history."
 dadu_desc: "On the plains south of the Tàiháng Mountains, Kublai Khan raised Dàdū, 'Great Capital', as the seat of his Yuán dynasty in 1267, upon the ruins of the Jīn dynasty's Zhōngdū. Marco Polo marveled at its grandeur, describing a city of broad avenues, vast palaces, and storehouses heaving with the wealth of all China. Even as Mongol power waned, the city's position at the northern gateway between the steppes and the Chinese heartland ensured its endurance as an imperial center."
 venice_desc: "Rising from the mudflats of the Adriatic lagoon, Venice was shaped by necessity into ambition. Refugees fleeing Lombard invasions first sheltered on its islands, and by the 9th century the city had grown into a maritime republic governed by its elected Doge. From its Arsenal and counting houses, Venetian merchants commanded trade routes stretching from the Black Sea to the Levant, making Venice the wealthiest city in Christendom and the undisputed master of Mediterranean commerce."
 moscow_desc: "Founded as a minor wooden fort by Yuri Dolgorukiy in 1147 on the banks of the Moskva River, Moscow long stood in the shadow of older Rus' cities. But under the Mongol yoke, the Muscovite princes proved adept at survival and expansion, collecting tribute for the Golden Horde while quietly absorbing neighboring principalities. Moscow's position at the crossroads of northern river routes gave it the commercial foothold from which it steadily grew, and by the early 14th century its grand prince wielded greater power than any other ruler in Rus'."
 tenochtitlan_desc: "Around 1325, following the legend that their god Huitzilopochtli had promised them an island where an eagle perched upon a cactus, the Mexica people founded Tenōchtitlan on a marshy isle in Lake Texcoco. Built in a place that offered both natural defense and access to the rich resources of the valley's surrounding shores, the young settlement grew with remarkable speed. Its causeways, raised gardens, and warrior traditions would one day make it the greatest city in the Americas and the heart of a formidable empire."
 delhi_desc: "Situated on the western bank of the Yamuna, Delhi has served as a seat of power for successive dynasties since ancient times. The Slave Dynasty established the Delhi Sultanate here in 1206, and under rulers such as Iltutmish and Alauddin Khalji the city grew into the preeminent Islamic capital of South Asia. Its great mosques, markets, and fortresses drew scholars and merchants from across the Islamic world, cementing Delhi's place as the gateway through which much of the subcontinent was governed."
 prague_desc: "Perched above a bend in the Vltava River, Prague grew from a Slavic ford-settlement into one of the great cities of medieval Europe. The Přemyslid dynasty erected its castle and cathedral on the rocky promontory of Hradčany, and a thriving merchant town took root beneath it. As the seat of the Bohemian kings and a natural crossroads between eastern and western Europe, Prague drew German and Jewish merchants, craftsmen, and scholars, becoming by the early 14th century one of the most populous and prosperous cities north of the Alps."
 vienna_desc: "The Romans called it #italic Vindobona#!, planting a legionary fortress on the Danube to guard the empire's northern frontier. After the Migration Period swept away Roman order, it reemerged as the seat of the Babenberg margraves, who raised a city worthy of their ambitions on the same strategic ground. When the Habsburgs supplanted the Babenbergs in 1278, Vienna became the anchor of a dynastic empire, its position at the crossroads of the Danube valley making it one of the most strategically coveted cities in the Holy Roman Empire."
 baghdad_desc: "Founded in 762 by the Abbasid caliph al-Manṣūr on the western bank of the Tigris, Baghdad was designed from the outset to be the center of the world. Its circular plan, the legendary Round City, placed the caliph's palace and great mosque at its heart, surrounded by markets and residences radiating outward. At the height of Abbasid power it was home to over a million souls, its House of Wisdom drawing scholars from across the known world to translate, debate, and discover. The Mongol sack of 1258 shattered this golden age, but the city endured, still the greatest metropolis of the Tigris-Euphrates heartland."
 florence_desc: "Straddling the Arno in the heart of Tuscany, Florence grew from a Roman colony into a city of merchants and bankers who reshaped European commerce. The great banking houses — the Bardi, the Peruzzi, and the Strozzi — extended their credit across kingdoms, and the gold florin they minted became the standard currency of international trade. Wracked by the rivalry of #italic Guelfi#! and #italic Ghibellini#! and governed by its powerful guilds, Florence combined fierce civic pride with extraordinary wealth, laying the ground for the artistic and intellectual flowering that would soon make it the envy of the world."
 samarkand_desc: "One of the oldest cities in Central Asia, Samarkand sat astride the Silk Road, where caravans bearing silk, spices, and ideas passed between China and the Mediterranean. Under the Samanids and Karakhanids it flourished as a major Islamic center of scholarship and craftsmanship, its artisans renowned across the known world for fine metalwork and papermaking. Though devastated by Genghis Khan's armies in 1220, the city's position on the great trade routes ensured its revival, its bazaars and workshops once more drawing the commerce of half the world."
 novgorod_desc: "Lord Novgorod the Great, as its citizens proudly called it, grew from a Viking trading post on the Volkhov River into the most powerful merchant republic of northern Europe. Its elected assembly, the #italic veche#!, governed with a democratic voice rarely heard elsewhere in the feudal world, and its Hanseatic trading partners carried Novgorodian furs, wax, and amber to markets from London to Lübeck. While other Rus' cities fell to the Mongol devastation of the 1230s, Novgorod's northern position spared it, leaving it the wealthiest and most independent city in all of Rus'."
 lisbon_desc: "Occupying a natural harbor where the Tagus meets the Atlantic, Lisbon has sheltered sailors and merchants since Phoenician times. The Romans fortified it as #italic Olisipo#!, and in the 8th century its Moorish rulers transformed it into a prosperous city of mosques and palaces. After Afonso I captured it in 1147 with the help of crusading knights, Lisbon became the capital of the nascent Kingdom of Portugal and a vital Atlantic port, its deep harbor and westward gaze already pointing toward the unexplored ocean beyond."
 sevilla_desc: "Straddling the Guadalquivir on the fertile plains of Andalusia, Seville was one of the jewels of Moorish Spain. Under the Umayyads and later the Almohads it flourished as a center of culture, science, and trade, its great mosque rising beside the river as a testament to Islamic civilization's reach in Iberia. Reconquered by Ferdinand III of Castile in 1248, the city retained its cosmopolitan character and grew into the wealthiest city of Christian Spain, its river port channeling the riches of Andalusia toward the wider world."
 hangzhou_desc: "Known in its heyday as #italic Kinsai#!, meaning 'temporary capital', Hángzhōu served as the seat of the Southern Sòng dynasty after the north fell to the Jurchen Jīn in 1127. Marco Polo, who visited in the late 13th century, called it the greatest city in the world, marveling at its canals, silk markets, and the great squares where goods of every description changed hands. Even after the Mongol conquest of 1279, its position at the head of the Grand Canal and its mastery of silk and porcelain trades ensured its survival as one of China's foremost commercial cities."
 bruges_desc: "At the height of medieval commerce, Bruges served as the great marketplace of northern Europe, where Venetian galleys, Hanseatic cogs, and Iberian caravels all discharged their cargoes. Founded on a tidal inlet linking it to the North Sea, the city's cloth halls and exchange, considered the world's first bourse, made it the financial capital of the north. From English wool to Levantine spices, the wealth of the known world flowed through its canals and counting houses."
 cologne_desc: "Founded as #italic Colonia Claudia Ara Agrippinensium#! by the Romans in AD 50, Cologne grew into the largest city in medieval Germany and one of the most powerful archbishoprics in the Holy Roman Empire. The magnificent Gothic cathedral, begun in 1248 to house the relics of the Three Kings, rose as a symbol of the city's ambition and faith. As a Free Imperial City and a founding member of the Hanseatic League, Cologne commanded the vital Rhine trade route and served as the gateway between the North Sea and the heart of the empire."
 bursa_desc: "Nestled below the slopes of Bithynian Mount Olympus, Bursa was a prosperous Byzantine city when the Ottoman chieftain Orhan captured it in 1326 after a decade-long siege. Orhan made it the first true capital of the Ottoman state, raising mosques, caravanserais, and a covered bazaar that would define the city's character for centuries. As the western terminus of Silk Road caravans from the East and a producer of some of the finest silk cloth in the world, Bursa grew into a city of extraordinary wealth and the seed from which the Ottoman empire would flower."
 kyoto_desc: "When Emperor Kanmu moved the imperial court here in 794, naming it #italic Heian-kyō#!, meaning 'Capital of Peace and Tranquility', Kyōto became the heart of Japanese civilization for centuries. Its grid of broad avenues, lined with aristocratic estates and Buddhist temples, housed the most refined court culture in the world, producing the poetry, painting, and literature of the Heian period. Though civil war, fire, and the rise of the samurai repeatedly shook its walls, the city endured as the seat of the emperor and the cultural soul of Japan."
 timbuktu_desc: "Rising from the edge of the Sahara at a bend of the Niger River, Timbuktu grew from a seasonal Tuareg camp into one of the great cities of medieval Africa. Under the Mali Empire it became a crossroads of trans-Saharan trade, where caravans carrying salt from the north met gold and ivory traveling from the south. Its mosques and #italic madrasas#! drew Islamic scholars from across the continent, making it a city of learning whose libraries held tens of thousands of manuscripts on theology, mathematics, and astronomy."
 barcelona_desc: "Founded as the Roman colony of #italic Barcino#! in the 1st century BC, Barcelona grew into the capital of the County of Catalonia and, by the 12th century, the maritime engine of the Crown of Aragon. Its merchant fleet and consulates stretched from the Balearics to Sicily, and from Sardinia to the crusader ports of Greece, making it the dominant sea power of the western Mediterranean. On the slopes below its great cathedral and ancient Roman walls, the city hummed with the commerce of a maritime power that looked outward to the sea for its wealth and destiny."
 cordoba_desc: "In its golden age Córdoba was the greatest city in western Europe, a city of half a million souls, of paved streets and public baths, of libraries that dwarfed anything Christendom could offer. Under 'Abd ar-Raḥmān III, who declared himself Caliph in 929, it became the capital of a rival caliphate that challenged the Abbasids in Baghdad and the Carolingians in the north. Scholars such as Averroes and Maimonides walked its streets, and its Great Mosque, the #italic Mezquita#!, stood as a monument to the extraordinary civilization that had taken root on Iberian soil. The city's capture by Ferdinand III of Castile in 1236 brought this era to a close, but its legacy endured in the knowledge it had preserved and transmitted to the wider world."
 damascus_desc: "One of the oldest continuously inhabited cities in the world, Damascus commands a fertile oasis at the foot of the Anti-Lebanon mountains, its markets fed by the waters of the Barada River. As the capital of the Umayyad Caliphate in the 7th and 8th centuries, it stood at the center of the largest empire the world had yet seen, its Great Mosque rising as one of the supreme achievements of Islamic architecture. Though the Abbasids shifted power to Baghdad, Damascus endured as one of the Levant's foremost commercial and cultural cities, its bazaars trading in silk, fine swords, and the fragrant roses for which it was famous."
 angkor_desc: "Deep in the forests of mainland Southeast Asia, the Khmer kings of Angkor built a capital unlike any other. Begun under Suryavarman II in the early 12th century, the vast temple complex of Angkor Wat was dedicated to Vishnu and designed as an earthly image of the cosmos, its moats representing the cosmic ocean and its towers the peaks of Mount Meru. At its height the greater Angkor region was sustained by an intricate system of reservoirs and irrigation canals, making it one of the most extensive urban complexes in the pre-industrial world."
 vijayanagar_desc: "Founded in 1336 on the southern bank of the Tungabhadra River by the brothers Harihara and Bukka Raya, Vijayanagar, 'City of Victory', was raised as a bulwark of Hindu civilization against the expanding power of the Delhi Sultanate. Protected by the Tungabhadra and its forbidding landscape of granite boulders and rocky gorges, the fledgling capital already commanded the fertile plains of the central Deccan. From this rocky stronghold an empire would grow that endured for more than two centuries, its markets drawing traders and goods from across the Indian Ocean world."
 naples_desc: "Founded as the Greek colony of Neapolis around 600 BC on the shores of its spectacular bay, the city passed through Roman, Byzantine, Norman, and Hohenstaufen hands before the Angevin dynasty made it the capital of the Kingdom of Naples in 1266. Under the Angevins it became one of the great royal courts of medieval Europe and the most populous city in Italy, its port channeling the wealth of the Mezzogiorno toward the wider world. The court at Naples attracted scholars, artists, and theologians, among them Thomas Aquinas, who taught and died here, making it a center of intellectual life as well as dynastic power."
 milano_desc: "Rising at the heart of the Po plain, Milan's origins as a Celtic settlement were swept aside when the Romans made it #italic Mediolanum#!, for a time the de facto capital of the western empire. After the barbarian migrations reduced its grandeur, the city was revived as a free commune, repelling Frederick Barbarossa and his imperial armies at the Battle of Legnano in 1176. Under the Visconti family, who seized signorial power in the late 13th century, Milan became the seat of a lordship that steadily absorbed the surrounding cities of Lombardy, making it the dominant force in northern Italy."
 genoa_desc: "Sheltered behind the arc of the Ligurian Apennines, Genoa built its greatness entirely on the sea. Its merchants and admirals carved out a maritime empire of trading posts and colonies stretching from the Black Sea to the Atlantic, and its fleets clashed repeatedly with those of Venice for mastery of Mediterranean commerce. Driven by the relentless ambition of its great families, the Doria, the Grimaldi, and the Spinola, the republic earned its proud epithet #italic La Superba#! and proved that a city with almost no hinterland could nonetheless become one of the wealthiest powers in Christendom."
 bologna_desc: "Founded as the Etruscan city of #italic Felsina#! and later the Roman colony of #italic Bononia#!, Bologna stands at the foot of the Apennines where the Via Emilia meets the roads north to the Po valley. It is known above all for its university, established in 1088 and the oldest in the world, which drew students of law, medicine, and philosophy from every corner of Europe to its lecture halls and the shadow of its twin medieval towers. The wealth of its merchants, the authority of its bishops, and the independence of its commune made Bologna one of the most contested prizes in the politics of medieval Italy."
 palermo_desc: "Cradled between twin headlands on Sicily's northern coast, Palermo was founded by Phoenician traders and grew into a great city under Carthaginian and later Byzantine rule before the Arab conquest of the 9th century transformed it into a flourishing Islamic metropolis of mosques, gardens, and bazaars. The Norman kings who wrested it from Arab hands in 1072 built upon this cosmopolitan legacy with extraordinary results, fusing Arab, Byzantine, and Latin traditions into glittering royal chapels and palaces that proclaimed a civilization unlike any other in Christendom. As the capital of the Norman Kingdom of Sicily and later the Hohenstaufen Empire, Palermo became one of the most cultivated and powerful royal courts in the medieval world."
 verona_desc: "Straddling the Adige at the southern edge of the Alps, Verona has been a place of passage since antiquity, its great Roman amphitheater, one of the largest and best preserved in the world, still rising above streets where legions and merchants once moved in equal measure. Under the della Scala family, the Scaligeri, who seized power in the late 13th century, it became one of the strongest #italic signorie#! of northern Italy, its lords dominating the Veneto and projecting their reach toward the Adriatic. Among those who found refuge at the Scaligeri court was Dante Alighieri, who was completing his #italic Commedia#! under the patronage of Cangrande della Scala during his long years of Florentine exile."
 siena_desc: "Built on three hills in the heart of Tuscany, Siena was one of the great powers of medieval Italy, its wealth founded on the banking and wool trades that made the Sienese merchant families creditors to kings and popes alike. The city's fierce rivalry with Florence, barely fifty kilometers to the north, shaped the history of both for generations, while its great central piazza, the Campo, served as the stage for the civic life and political drama of one of Italy's proudest communes. The paintings of Duccio di Buoninsegna and the Lorenzetti brothers made Siena one of the foremost centers of Gothic art in Europe."
 pisa_desc: "At the mouth of the Arno, Pisa built one of the great maritime empires of the medieval Mediterranean, its fleets raiding Palermo in 1063, defeating Saracen corsairs across the Tyrrhenian Sea, and establishing trading colonies from Sardinia to Antioch. Enriched by this commerce, the Pisans raised the extraordinary ensemble of cathedral, baptistery, and campanile on the #italic Campo dei Miracoli#!, monuments to a city whose wealth and confidence at its 12th-century height seemed without limit. Though the catastrophic defeat by Genoa at the Battle of Meloria in 1284 broke Pisan naval power, the city and its remarkable monuments endured."
 padova_desc: "Founded in legend by the Trojan hero Antenor and flourishing as one of the wealthiest cities of Roman Italy, Padua grew in the Middle Ages into a prosperous commune at the heart of the Veneto. Its university, founded in 1222 by scholars who broke away from Bologna, swiftly became one of the foremost centers of law and medicine in Europe, drawing students from across the continent. In the early 14th century the great painter Giotto transformed the interior of its Arena Chapel into a landmark of Western art, while the city itself thrived under the rule of the Carrara family as a court of learning and ambition."
 ferrara_desc: "Rising at the edge of the Po delta marshlands, Ferrara developed from a modest river crossing into a city shaped by the ambitions of the Este dynasty, who established themselves as its lords in the 13th century. Under their long patronage the city became a center of chivalric culture and refined court life, its lords hosting poets, jousts, and scholarly debate while carefully navigating the rivalries of Milan, Venice, and the Papal States. The wide straight streets and imposing Este castle that defined Ferrara's character were emblematic of a city where order and elegance were as important as walls and soldiers."
 parma_desc: "Founded by the Romans on the Via Emilia in 183 BC, Parma became one of the great cities of the Lombard plain, its position on the great road between Milan and Bologna and its fertile surrounding farmland making it a consistently prosperous and contested prize. As a free commune it was among the most vigorous members of the Lombard League against Frederick Barbarossa, and after years of bitter factional strife between Guelph and Ghibelline families it passed through the hands of successive signori. Its cathedral and baptistery, raised in the Romanesque style of the 12th century, expressed a civic piety and wealth that outlasted the political turbulence of its communal age."
 mantova_desc: "Ringed on three sides by the lakes formed by the slow Mincio River, Mantua occupies one of the most naturally defensible sites in northern Italy and has been inhabited since the Bronze Age. The Romans celebrated it as the birthplace of Virgil, the greatest of their poets, and the city's destiny has long been shaped by the artistic and literary ambitions of its rulers. By the early 14th century the Gonzaga family was rising to prominence here, and under their long patronage Mantua would grow into one of the most cultivated and refined courts in Italy."
 lucca_desc: "Enclosed within its ancient Roman street grid and surrounded by the rich silk-producing countryside of the Garfagnana, Lucca was one of the wealthiest cities of medieval Italy. Its merchants spread across Europe, their banking houses and silk trade making the name #italic Lucchese#! synonymous with fine cloth in the markets of Paris, London, and Bruges, while at home the city accumulated wealth enough to build one of the finest collections of Romanesque churches in Tuscany. Though repeatedly threatened by Pisa and Florence, Lucca clung to its independence with remarkable tenacity, its sturdy walls and fierce civic pride keeping it free long after rival cities had fallen to lordly rule."
 messina_desc: "Commanding the narrow strait that separates Sicily from the Italian mainland, Messina was founded by Greek colonists who called it #italic Zánklē#! for the curved sickle shape of its harbor, and its position made it from the first one of the Mediterranean's great strategic ports. It was through Messina that the Normans began their conquest of Sicily in 1061, and through its harbor that armies of every subsequent age, Angevin, Hohenstaufen, and crusaders bound for the Holy Land, passed between east and west. Though repeatedly shaken by earthquake and political upheaval, the city's extraordinary natural harbor ensured that it always recovered, drawing commerce and conflict in equal measure."
 brescia_desc: "Lying at the foot of the Alpine foothills where the pre-Alps descend toward the Lombard plain, Brescia was one of the great industrial cities of medieval Italy, its forges producing weapons and armor of renowned quality traded across Europe. As a free commune it was among the most vigorous members of the Lombard League, and its citizens' defiance of imperial armies became a cornerstone of the north Italian communal tradition. Caught between the great ambitions of Milan and Venice, Brescia's strategic position at the gateway to the Alpine passes and the quality of its craftsmen made it a prize that neither power would willingly surrender."
 cremona_desc: "Planted by the Romans on the south bank of the Po as a frontier colony in 218 BC, Cremona grew into one of the great cities of the Lombard plain, its position on the river making it a natural hub of road and water trade between east and west. The city became a byword for Ghibelline loyalty in the bitter wars between emperor and pope, suffering for its allegiances but also earning extraordinary imperial favor and wealth. Its skyline, dominated by the great #italic Torrazzo#!, the tallest medieval bell tower in Italy, and a forest of rival family towers, proclaimed the competitive civic pride of a city where power was displayed as fiercely as it was wielded."
 pavia_desc: "For two centuries after the fall of Rome, Pavia served as the capital of the Lombard kingdom in Italy, home to its warrior kings and custodian of their crown of iron. The Carolingian emperors maintained it as their Italian residence, and it retained its prestige as a royal and coronation city long after the Lombard realm had been absorbed into the Frankish empire. Its university, one of the oldest in Italy, was flourishing by the 9th century, and its position on the Ticino River commanding the western approach to the Po valley ensured that Pavia remained a prize contested by every power that sought to dominate the north."
 perugia_desc: "Perched on a hill commanding the upper Tiber valley, Perugia was one of the twelve cities of ancient Etruria and later a prosperous Roman municipality before it emerged in the Middle Ages as one of the most formidable and turbulent independent communes of central Italy. Its great Palazzo dei Priori and the Fontana Maggiore, completed in 1278 with sculpture by Nicola and Giovanni Pisano, expressed a civic pride and artistic ambition that rivaled anything in Tuscany. The university founded here in 1308 confirmed Perugia's determination to match its military and political power with an equal reputation for learning."
 ancona_desc: "Founded as a Greek colony by Syracusan exiles on the Adriatic coast, Ancona takes its name from the Greek word for elbow, describing the curved headland that shelters its harbor from the north. In the Middle Ages it grew into the most important port on the central Adriatic, its merchants trading with Byzantine Constantinople and the ports of the Levant. Despite repeated attempts by popes and emperors to bring it to heel, Ancona maintained a fierce communal independence, its harbor and its fleet the foundations of a freedom jealously guarded for centuries."
 aquila_desc: "One of the youngest great cities of medieval Italy, L'Aquila was founded around 1254 from the union of nearly a hundred villages of the Abruzzo highlands, each said to have contributed a church, a fountain, a quarter, and a bell to the new city. Set high in the Apennines at the heart of the mountain kingdom, the city grew with remarkable speed into the capital of Abruzzo, its position and walls securing it against rival lords and the ambitions of the distant Neapolitan court. The unusual circumstances of its founding, with nearly a hundred contributing communities each maintaining a share of civic identity, gave Aquila a peculiar complexity and a fierce local pride unlike any other city in the Italian south."
 ravenna_desc: "For a brief but extraordinary century Ravenna served as the last capital of the Western Roman Empire, and when Rome fell in 476 it was here that the courts of Odoacer and then the Ostrogothic king Theodoric upheld the forms and traditions of Roman governance. The Byzantine reconquest of the 6th century made it the western outpost of Constantinople, seat of the Exarchate of Ravenna, and it was during this era of Greek imperial rule that its craftsmen produced the astonishing mosaic cycles that fill its churches and mausoleums. Though long since overshadowed by Bologna and the growing cities of the Po valley, Ravenna retained in its extraordinary art the memory of an imperial glory found nowhere else in the Latin west."
 salerno_desc: "Nestled between the sea and the mountains of the Amalfi coast on its sheltered gulf, Salerno was chosen by the Norman conqueror Robert Guiscard as his capital after seizing it in 1076, serving as the first seat of Norman power in southern Italy before the royal court moved to Palermo. The city is most renowned for its #italic Schola Medica Salernitana#!, the oldest medical school in Europe, which flourished from the 9th century onward by drawing together the Greek, Arab, and Latin medical traditions that converged on this cosmopolitan southern shore. Physicians trained at Salerno spread across the continent, and the school's texts on anatomy, surgery, and herbal medicine shaped the practice of medicine throughout the medieval world."
 syracuse_desc: "Founded by Corinthian settlers in 734 BC on a small island at the mouth of a great harbor, Syracuse grew into the mightiest Greek city of the western Mediterranean, its power underscored by the catastrophic defeat it inflicted on the Athenian expedition of 415 to 413 BC. It was here that Archimedes devised his legendary war machines with which the city held Roman armies at bay, and here that successive conquerors, Carthaginian, Roman, Byzantine, Arab, and Norman, each recognized a harbor too valuable to leave unoccupied. Though long since overshadowed by Palermo, Syracuse endured as the greatest city of southeastern Sicily, its ancient harbor and stone-cut streets still bearing witness to a civilization whose brilliance had shaped the whole of the ancient Mediterranean world."
 trebizond_desc: "Perched on a narrow coastal shelf between the Pontic mountains and the Black Sea, Trebizond was one of the most dramatically situated cities in the medieval world. When Constantinople fell to the Fourth Crusade in 1204, members of the Komnenian dynasty fled here and founded the Empire of Trebizond, which endured as an independent Greek Christian state long after the Latin Empire had itself collapsed. Commanding the eastern end of the Black Sea trade route and the mountain passes into Armenia and Persia, the city attracted Genoese merchants and became a prosperous western terminus of the Silk Road, its markets drawing goods from Central Asia and beyond."
 smyrna_desc: "One of the ancient cities of the Aegean coast, Smyrna was among the sites that claimed the honor of Homer's birth and later became one of the Seven Churches of Asia Minor addressed in the Book of Revelation. Under Byzantine rule it served as a major port linking the rich Anatolian hinterland to Aegean commerce, its harbor frequented by Venetian and Genoese merchants who established trading colonies along its wharves. In the late 13th and early 14th centuries the city passed between Byzantine, Genoese, and Aydinid Turkish hands in quick succession, its exceptional position making it a prize that no power in the Aegean could afford to ignore."
 konya_desc: "Set on the high plateau of central Anatolia, Konya served as the capital of the Sultanate of Rum, the Turkish state that dominated Anatolia for much of the 12th and 13th centuries. Under the Seljuk sultans the city flourished as a center of Islamic art, architecture, and learning, its tiled mausoleums and madrasas transforming an ancient plateau city into one of the great cultural centers of the medieval Islamic world. It was here that the mystic poet Jalāl ad-Dīn Rūmī settled and died, and here that his followers founded the Mevlevi order, the Whirling Dervishes, whose music and ceremony spread the city's name far beyond the Anatolian plateau."
 sivas_desc: "Commanding the high plateau where the main routes between Anatolia and Persia converge, Sivas was one of the great crossroads cities of the medieval Near East. Under the Sultanate of Rum it grew into a major provincial capital of extraordinary architectural ambition, and the great madrasas of the 13th century, among them the celebrated Gök Medrese and the Çifte Minareli, rank among the finest examples of Seljuk stonework in Anatolia. After the Mongol conquest the city served as a key administrative center for the Ilkhanate's Anatolian provinces, its markets and caravanserais channeling the long-distance trade that flowed between Central Asia and the Mediterranean."
 kayseri_desc: "Known to the Romans as #italic Caesarea Mazaca#!, the principal city of ancient Cappadocia, Kayseri served for centuries as the gateway between the Anatolian plateau and the routes leading east toward Armenia and Mesopotamia. One of the earliest centers of Christianity in Asia Minor, it was home to Saint Basil the Great, whose theological writings and monastic rule shaped the Eastern church and continue to influence Christian practice to this day. Under the Seljuks and their successors the city was enriched with mosques, madrasas, and caravanserais, its enduring position as a crossroads of Anatolian trade ensuring that it passed between Byzantine, Danishmendid, Seljuk, and Mongol hands as each master in turn recognized its value."
 izmit_desc: "Founded by the Bithynian king Nicomedes I in the 3rd century BC and known to the Romans as #italic Nicomedia#!, the city served as the eastern capital of the Roman Empire under Diocletian, who chose it as his personal residence and the administrative heart of the eastern provinces. It was from Nicomedia in 303 that Diocletian launched his Great Persecution of the Christians, tearing down the principal church within sight of the imperial palace and initiating the last and most severe Roman assault on the faith. After the foundation of Constantinople across the water it was gradually overshadowed by its great neighbor, but retained its importance as a major port and episcopal center throughout the Byzantine centuries."
 ankara_desc: "Set on a rocky hilltop at the heart of the Anatolian plateau, Ankara was an ancient Galatian city long before the Romans made it the chief city of their province of Galatia. Its strategic position where the roads from Constantinople, the Black Sea, the Levant, and Persia all converge gave it enduring military and commercial importance, and the great temple raised by its citizens in honor of Augustus preserved inscriptions that stand among the most important surviving records of Roman history. Under the Danishmendids, the Seljuks of Rum, and the Mongols in turn, Ankara remained the key junction of the Anatolian plateau, a city whose possession signified control of the roads that crossed it."
 amasya_desc: "Nestled in a deep gorge cut by the Yeşilırmak River through the Pontic mountains, Amasya was the royal capital of the ancient kingdom of Pontus and the birthplace of the geographer Strabo, who described it in loving detail in his great work on the geography of the world. Its dramatic setting, with rock-cut royal tombs carved into the cliff faces above the river, expressed the grandeur of a Hellenistic kingdom that at its height extended its rule across much of Asia Minor. Under Byzantine, Danishmendid, Seljuk, and Mongol rule the city retained its importance as the principal center of the Pontic foothills, its deep gorge and mountain setting making it one of the most naturally defensible positions in northern Anatolia."
 rodos_desc: "For much of antiquity Rhodes was the wealthiest and most cosmopolitan port in the eastern Mediterranean, its legendary Colossus, one of the Seven Wonders of the ancient world, once standing at the harbor entrance, and its maritime law, the #italic Lex Rhodia#!, governing commerce across the known sea. After centuries of Roman, Byzantine, and Arab influence the island passed to the Knights Hospitaller in 1309, who fortified it into one of the most powerful Christian strongholds in the eastern Mediterranean. Behind its massive walls the Knights transformed Rhodes into a center of crusading power, its galley fleets patrolling the sea lanes between Christendom and the Islamic east."
 corinth_desc: "Commanding both the narrow land passage between mainland Greece and the Peloponnese and the ancient portage route across the Isthmus, Corinth was one of the wealthiest and most strategically vital cities of the ancient Greek world. In its heyday it controlled the trade between the Aegean and the Adriatic, levying tolls on goods dragged overland between its two harbors, and its bronzework and decorated pottery were exported to every corner of the Mediterranean. Though devastated by the Roman general Lucius Mummius in 146 BC, it was refounded by Julius Caesar as a Roman colony and endured as a major city, passing through Byzantine, Latin, and Frankish hands as successive powers recognized the commanding value of its position."
 candia_desc: "When the Fourth Crusade shattered the Byzantine Empire in 1204, Venice acquired Crete and made Candia its capital, transforming it over the following century into one of the most strategically important Venetian outposts in the eastern Mediterranean. The island's fertile plains fed Venetian fleets and colonies alike, and Candia's harbor served as a critical resupply point on the sea lanes between Venice and the Levant. Though the Cretan population rose in repeated rebellion against their Venetian lords, the city itself was steadily fortified and enriched, its walls and warehouses proclaiming a colonial power that intended to hold Crete indefinitely."
 edirne_desc: "Founded by the Roman emperor Hadrian on the banks of the Maritsa River and named #italic Hadrianopolis#! in his honor, Adrianople guarded the main route between Constantinople and the Danube frontier and served as a key military and administrative center for the defense of Thrace. It was here in 378 that the Visigoth cavalry shattered the legions of Emperor Valens in one of antiquity's most consequential battles, a defeat that set in motion the accommodation of the Germanic peoples within the empire's borders and helped bring about the eventual collapse of the western Roman state. Under the Byzantines Adrianople remained the foremost city of Thrace and the traditional first line of defense for Constantinople against threats from the west."
 ioannina_desc: "Set on a rocky peninsula jutting into the mountain lake of Pamvotis, Ioannina was the principal city of the Despotate of Epirus, the Greek successor state that emerged in northwestern Greece after the Fourth Crusade shattered Byzantine power in 1204. Under the Epirote despots it grew from a modest provincial town into a significant center of Greek culture and resistance, its natural defenses enhanced by strong walls and its lake providing both sustenance and protection. The mountain landscape of Epirus gave it security and isolation in equal measure, and Ioannina served as a vital stronghold anchoring Greek Christian civilization in the turbulent northwest of the former empire."
 tarnovo_desc: "Perched on three hills above a bend of the Yantra River, Tarnovo was chosen as the seat of the Second Bulgarian Empire when the brothers Asen and Peter led their great rebellion against Byzantine rule in 1185. Under the Asen dynasty it grew into one of the most formidable fortified cities in the Balkans, its Tsarevets Hill crowned by the royal palace and the Patriarchal Cathedral, symbols of a state that at its 13th-century height extended from the Danube to the Aegean. After the empire's weakening under Mongol pressure, Tarnovo endured as the capital of a diminished but proud Bulgaria, its walls and imperial memory defining the city's identity far into the 14th century."
 dubrovnik_desc: "Sheltered beneath the limestone cliffs of the Dalmatian coast, Dubrovnik grew from a Byzantine-founded refuge into one of the most prosperous and diplomatically adroit small states in the medieval Mediterranean. As the Republic of Ragusa, it navigated the competing pressures of Venice, Hungary, Serbia, and the emerging powers beyond with extraordinary skill, paying tribute where necessary while maintaining a network of merchant consulates that stretched from Flanders to the Levant. Its merchants carried goods and credit across the known world, and the elegant stone city rising behind its massive walls proclaimed a civilization that chose commerce and careful diplomacy over the costs of war."
 sredets_desc: "Known to the Romans as #italic Serdica#!, the chief city of the province of Dacia Mediterranea, the city that would become Sofia had already witnessed centuries of history when the Bulgarians made it a provincial center of their empire. It was in Serdica that the Emperor Constantine convened the great Council of 343, one of the major synods of early Christianity, and it was reportedly here that he first considered planting his new imperial capital before choosing the site on the Bosphorus. Under the Byzantine and Bulgarian empires it served as a key crossroads where the main routes of the Balkans converge, its position at the foot of the Vitosha mountain ensuring it endured every conquest as a prize worth holding."
 ohrid_desc: "Set on the shores of the ancient lake that bears its name, Ohrid rose to prominence when Saint Clement, a disciple of the missionaries Cyril and Methodius, established his great school of Slavic learning here in the late 9th century, training thousands of priests and scholars in the new Slavic literacy. After the conversion of Bulgaria, Ohrid became the seat of the Bulgarian Patriarchate and later the autocephalous Archbishopric of Ohrid, one of the most important religious centers in the Orthodox world. Its hillside crowded with churches and monasteries, the city earned the name the Jerusalem of the Balkans, its spiritual authority shaping the Christianity of the South Slavic peoples for centuries."
 nis_desc: "Known to the Romans as #italic Naissus#!, Niš commanded the main road between the Danube frontier and Constantinople at the point where the valleys of the Morava and Nišava rivers meet, making it one of the most strategically vital cities of the ancient Balkans. It was here, around 272 AD, that the Emperor Constantine the Great was born, a son of the western Balkans who would reshape the Roman Empire and the entire course of Western civilization. Though repeatedly devastated, by Attila the Hun among others, the city's crossroads position ensured its revival, and under Byzantine, Bulgarian, and Serbian rule it remained the key junction of the central Balkans."
 durres_desc: "One of the oldest cities in Europe, Durrës was founded as the Greek colony of Epidamnus around 627 BC by settlers from Corinth and Corfu, its fine natural harbor on the eastern Adriatic giving it immediate commercial importance. The Romans knew it as #italic Dyrrachium#! and made it the western terminus of the Via Egnatia, the great military road that crossed the Balkans to Byzantium, ensuring that for centuries every army marching from Rome to the east passed through its gates. Its position as the gateway between Italy and the Balkans made it one of the most fought-over cities in the region, its harbor and walls changing hands between Byzantines, Normans, Venetians, and Angevin lords across the medieval centuries."
 prizren_desc: "Nestled in a fertile valley below the peaks of the Šar Mountains, Prizren was a city of ancient foundation that the medieval Serbian state transformed into one of its principal centers from the 13th century onward. Under the Nemanjić dynasty it grew into a major administrative and commercial city, its Orthodox churches and monasteries expressing the piety and ambition of Serbian rulers who saw themselves as the heirs of Byzantine civilization. By the early 14th century it was one of the most important cities in the Serbian realm, its markets drawing merchants from Dubrovnik, Venice, and across the Levant to trade in the precious metals mined from the surrounding mountains."
 belgrad_desc: "Standing at the confluence of the Sava and Danube rivers, where the great road from Central Europe descends into the Balkans, Belgrade has been a fortified gateway since ancient times, when the Romans called it #italic Singidunum#! and stationed a legion here to guard the Danube frontier. In the Middle Ages the city passed between Bulgarians, Byzantines, and Hungarians, its hilltop fortress above the river junction making it one of the most contested strongholds in the Balkans. By the early 14th century it stood as a key prize in the struggle between the Hungarian Kingdom and the rising Serbian state, its walls watching over the rivers that divided the worlds of Latin and Orthodox Christianity."
 mecca_desc: "At the heart of Arabia rose the Ka'ba long before the Prophet, a stone shrine to which the tribes of the peninsula made yearly pilgrimage. When Muhammad was born within its precincts in 570 and received his revelation here, Mecca became the spiritual center of a faith that swept across three continents. After the Caliphates rose and fell, the city remained under the rule of the Sharifs, descendants of the Prophet, who answered in turn to the most powerful Muslim ruler of the age. Since 1269 the Mamluks of Egypt have served as its protectors, and each year their caravans bear the new #italic kiswa#! across the desert to drape the Ka'ba in fresh black silk."
 aleppo_desc: "One of the most ancient cities in the world, Aleppo was already known to the Hittites and the Akkadians as a crossroads of the northern Levant. Under the Hamdanid emir Sayf ad-Dawla in the 10th century it became a brilliant Arab court of poets and warriors, contesting the Byzantine frontier in glittering verse and steel alike. The Zengid Nūr ad-Dīn and the Ayyubid prince aẓ-Ẓāhir Ḡāzī, son of Saladin, rebuilt its great citadel into one of the most formidable fortresses in the Islamic world. Sacked by the Mongols under Hulagu in 1260, the city was reclaimed by the Mamluks who restored it as the second city of their Syrian realm, its caravan markets channeling silks and spices between Iraq and the Mediterranean."
 adan_desc: "Sheltered within the volcanic crater of an extinct volcano, Aden has served as a port between the Red Sea and the Indian Ocean since antiquity, known to Greek mariners as #italic Eudaimon Arabia#!, 'Happy Arabia', for the wealth of its trade. The Sulayhid queen Arwa governed it in the 11th century from her seat at Jibla, and after the rise of the Ayyubids it passed to the Rasulid sultans of Yemen who made it the maritime engine of their realm from 1229 onward. Its harbor draws Egyptian merchants bound for India and Indian fleets bringing pepper, cotton, and porcelain westward, the Rasulid customs house at its quays among the richest in the Islamic world."
 hormuz_desc: "For centuries the kingdom of Hormuz stood on the mainland shore of the Persian Gulf, until the threat of Mongol raids drove its ruler to abandon the old city for the small island of Jarun around 1300. There the merchants of the new Hormuz raised a city of stone houses and great warehouses, its waterless rock fed by cisterns and its fortunes by the trade of pearls, horses, and Indian spices. Under the rule of its own kings, who answered nominally to the lords of Kerman, the island became the great emporium of the Gulf, where Arab dhows, Persian carracks, and Indian junks gathered each season to exchange the goods of two oceans."
 tabriz_desc: "Set in a fertile valley north of the Sahand massif, Tabrīz had been a prosperous town since Sasanian times, but it rose to the front rank when the Ilkhans of Persia chose it as their capital. Under Ghazan Khan, who embraced Islam in 1295, and his successor Öljeitü, the city became the heart of an empire stretching from the Oxus to the Euphrates, its bazaars piled high with Chinese silks brought along the imperial #italic yam#! roads. The minister Rašīd ad-Dīn, polymath and historian, raised the suburb of #italic Rab'-e Rašīdī#! as a vast complex of madrasas, libraries, and scriptoria gathering scholars from across Eurasia. By the time the Ilkhan Abū Sa'īd died, Tabrīz had become one of the most populous and cosmopolitan cities in the world."
 isfahan_desc: "Watered by the Zāyande-rūd and set in the heart of the Iranian plateau, Isfahan has been one of Persia's great cities since the Sasanian centuries, when it was a twinned settlement of Jay and the Jewish quarter of Yahudiyya. Under the Seljuk sultan Malik Shah and his vizier Niẓām al-Mulk in the 11th century it became the capital of an empire reaching from Anatolia to Central Asia, and the great Friday Mosque rose at its center as one of the supreme monuments of Islamic architecture. The Mongols sacked it grievously in 1241, yet the city's gardens, bridges, and crafts gradually returned under Ilkhanid rule, its weavers and metalsmiths still supplying the markets of the Iranian world."
 mosul_desc: "Across the Tigris from the ruins of ancient Nineveh, Mosul has guarded the river crossing on the road between Syria and Baghdad since the earliest Islamic centuries. Under the Hamdanids and later the Atabegs of Zengi it became a powerful frontier capital from which 'Imād ad-Dīn Zengī launched the counter-crusade that took Edessa in 1144 and set in motion the long Muslim recovery of the Levant. The city is famed for its weavers, who give their name to the fine cotton cloth known across Europe as #italic mousseline#!, and its ironworkers and silversmiths supply the markets of the upper Jazīra. Spared the worst of the Mongol catastrophe through prompt submission, it remained a key Ilkhanid center on the upper Tigris."
 samarra_desc: "On the bank of the Tigris north of Baghdad, the Abbasid caliph al-Mu'taṣim founded Samarra in 836 as a vast new capital where his troublesome Turkish guard regiments could be quartered far from the populace of the old city. For nearly sixty years the world's largest empire was ruled from its broad avenues, its monumental palaces, and the unique spiral minaret of the Great Mosque, the largest mosque ever built in the Islamic world. After the caliphs returned to Baghdad in 892 the great city emptied of its courtiers and soldiers, but the shrine of the tenth and eleventh Imams kept it alive as a Shi'a pilgrimage center, its imperial ruins still towering above the river plain."
 bukhara_desc: "For more than a thousand years Bukhara has been one of the great cities of Central Asia, a Sogdian trading center that the Samanid emirs of the 9th and 10th centuries transformed into the brilliant capital of an Islamic Iran. The fired-brick mausoleum of Esmā'īl Sāmānī still stands as a marvel of early Islamic architecture, and the Kalyan minaret raised by the Karakhanids in 1127 has dominated the skyline ever since. When Genghis Khan stormed the city in 1220 he is said to have ridden into the Friday Mosque and demanded that the Quran be cast underfoot, and the destruction that followed was almost total. Yet under the Chagatai khans the city slowly revived, its madrasas once again drawing the scholars who had given it the old title #italic Bukhara-ye Šarīf#!, 'Noble Bukhara'."
 herat_desc: "Ancient Aria of the Achaemenids, Herāt commands the fertile valley of the Harī-rūd where the roads from Persia, Khorasan, and India converge. Under the Ghaznavids it was a brilliant frontier city of poets and merchants, and the Ghurid sultans who rose nearby in the 12th century enriched it with mosques and madrasas before their empire swept south into Hindustan. The Mongol horsemen of Tolui sacked it with appalling thoroughness in 1221, but after the rise of the Kartid maliks in 1245 the city was steadily rebuilt as the seat of a vassal kingdom of the Ilkhans, its position on the great east-west road ensuring its continued prosperity."
 kashgar_desc: "Set at the western edge of the Tarim Basin where the roads from Transoxiana, Ferghana, and Tibet converge, Kashgar has been a Silk Road oasis since antiquity. Under the Karakhanid khans of the 10th and 11th centuries it became a major center of Turkic Islamic civilization, the home of the great scholar Maḥmūd al-Kāšḡarī, whose #italic Dīwān Luḡāt at-Turk#! compiled the languages of the Turkic peoples for an Abbasid audience. After the Mongol conquest the city passed to the Chagatai khans, whose itinerant courts crossed the steppe between the Tianshan and the Pamirs, and Kashgar's bazaars continued to channel the trade of jade, horses, and silk that gave the oases of the Tarim their enduring wealth."
 lahore_desc: "Ancient capital of the Hindu Shahi dynasty, Lahore was conquered in 1021 by Maḥmūd of Ghazna and made the eastern capital of his sprawling empire, becoming the gateway through which Islamic civilization passed into the Indian plain. Under the Ghaznavids it grew into a glittering frontier city of mosques and madrasas, home to the Persian poet Mas'ūd Sa'd Salmān and the scholar 'Alī Hujvīrī whose Sufi shrine, the #italic Data Darbar#!, draws pilgrims to this day. After the rise of the Mamluk Sultanate of Delhi the city served as the principal Muslim bulwark against the Mongol horsemen who repeatedly thundered across the Indus, and under sultans such as Balban its fortifications were rebuilt to face the steppe."
 varanasi_desc: "Among the oldest continuously inhabited cities in the world, Varanasi, known to its devotees as #italic Kāśī#!, the City of Light, stands on the western bank of the Ganges at the holiest of all Hindu sites. Pilgrims have come here since long before recorded history to bathe in the river's waters and to seek release from the cycle of rebirth, and the ghats that descend to the Ganges are crowded with temples, ascetics, and the burning pyres of those carried here to die. The Ghurid armies under Quṭb ad-Dīn Aybak sacked the city in 1194 and razed many of its temples, but Varanasi has always recovered, its silk weavers, brass-workers, and Sanskrit scholars sustaining a civilization that no conqueror has yet erased."
 madurai_desc: "For more than a thousand years Madurai has been the capital of the Pandya kings of the Tamil south, a city whose great temple to the goddess Meenakshi crowned a civilization of poets, scholars, and warrior-aristocrats. The Tamil literary academies, the #italic Sangam#!, were said to have flourished here in antiquity, drawing the bards of the southern courts to debate and refine the language. Malik Kafur, the great general of Alauddin Khalji of Delhi, stormed the city in 1311 and carried off its accumulated treasure, and in 1335 the Tughluq governor Jalāl ad-Dīn Ḥasan proclaimed the independent Madurai Sultanate, a fragile Muslim power planted in the ancient Tamil heartland."
 patna_desc: "On the southern bank of the Ganges once stood ancient #italic Pāṭaliputra#!, capital of the Mauryan emperor Ashoka, from whose palaces the rule of the first Indian imperial state extended from Afghanistan to the Bay of Bengal. The Greek ambassador Megasthenes marveled at its wooden palisade and the splendor of its court, and the Chinese pilgrim Faxian found it still flourishing in the 5th century under the Guptas. Yet by the time of the Delhi Sultanate the great capital had decayed into the modest town of Patna, a provincial outpost of Tughluq Bihar where the legacy of one of antiquity's greatest cities was preserved only in the memory of scholars and the ruins along the riverbank."
 chittagong_desc: "Set on the broad estuaries where the rivers of eastern Bengal pour into the Bay of Bengal, Chittagong has served as a port between India and Southeast Asia since antiquity. Arab geographers knew it as #italic Samandar#!, a city of merchants whose ships traded as far as China, while the Tibetan pilgrim Dhammapala in the 10th century described its monasteries. Contested between the kings of Bengal, the rulers of Arakan, and the chiefs of the Tripura hills, it has passed from hand to hand many times, and under the Delhi Sultanate's conquest of Bengal it has come under Muslim governance, its harbor remaining the principal eastern outlet for the rice and cotton of the Ganges delta."
 jinjiang_desc: "Known to the Arabs as #italic Zaytūn#! and to Marco Polo as one of the two greatest ports in the world, Quánzhōu rose to extraordinary prominence under the Sòng and Yuán dynasties as the principal Chinese outlet to the Indian Ocean. Its harbor crowded with junks bound for the Spice Islands, India, and the Persian Gulf, the city houses entire quarters of resident Arab, Persian, Tamil, and Armenian merchants whose mosques, Hindu temples, and Christian churches stand alongside Buddhist monasteries and a Manichaean shrine. Marco Polo, who passed through in the 1290s, wrote that for every spice-laden ship that reached Alexandria, a hundred came to Zaytūn, and the customs revenues of its great trade make it one of the financial pillars of the Yuán imperial treasury."
 shangyuan_desc: "On the southern bank of the Yangtze where the river bends north toward the sea, the city today called Jiqing has been a capital and a stronghold for more than a thousand years. The ancient kings of Wú, the Eastern Jìn, and the southern dynasties of the post-Hàn age all ruled from its walls under the names #italic Jianye#! and #italic Jiankang#!, making it for centuries the cultural heart of southern China. When the Jurchen conquered the north in the 12th century the Sòng court briefly considered settling here as their new capital, and after the Mongols swept across the empire the city was rebuilt as the seat of Jiqing prefecture, its strategic position on the lower Yangtze ensuring its enduring importance among the cities of the south."
 wuxian_desc: "At the heart of the Yangtze delta, Sūzhōu, anciently known as #italic Gusu#! and as the Sòng-era #italic Píngjiāng#!, was founded in the 6th century BC as the capital of the kingdom of Wú. Set amid an intricate web of canals that earned it the proverbial pairing with Hángzhōu, 'Heaven above, Sūzhōu and Hángzhōu below', the city has long been famed for its silk weavers, its garden estates of the literati, and the refinement of its cuisine and opera. Under the Southern Sòng it grew into one of the wealthiest cities of the south, and though the Mongol conquest of 1276 left scars, by the early 14th century the gardens, pagodas, and canal-side markets of Sūzhōu are once again drawing the merchants and scholars of all China."
 guangzhou_desc: "At the mouth of the Pearl River, Guǎngzhōu has welcomed foreign ships since the Hàn dynasty, when its merchants were already trading with the lands of the southern seas. By the Táng dynasty Arab and Persian dhows were calling each season at its quays in such numbers that the city housed a separate foreign quarter governed by Muslim merchant-elders, and in 879 the rebel Huang Chao is said to have massacred more than a hundred thousand foreign residents in a single bloody campaign. The Mongol conquest brought renewed prosperity as Guǎngzhōu shared in the great Yuán-era boom of maritime trade, its harbor channeling Lingnan goods to the world while Indian and Arab merchants once again gather in its inns and warehouses."
 lhasa_desc: "Founded in the 7th century by the Tibetan emperor Songtsen Gampo, who built the Jokhang Temple to house the sacred image of the Buddha brought to him by his Nepalese and Chinese queens, Lhasa was for two centuries the heart of a Tibetan empire that rivaled Tang China and ruled from the Pamirs to the Bay of Bengal. After the collapse of the empire in the 9th century the city declined, but the Jokhang and the Ramoche temples remained the spiritual focus of Tibetan Buddhism. When the Mongols swept across the plateau in 1240 they appointed the abbots of the Sakya monastery as their viceroys, and though Sakya itself remains the seat of administration, Lhasa endures as the holy city, drawing pilgrims who circle the Barkhor and prostrate themselves before the Jowo Śākyamuni."
 kamakura_desc: "In 1185 the warlord Minamoto no Yoritomo seized power from the imperial court at Kyoto and made the coastal town of Kamakura the seat of a new military government, the #italic bakufu#!, which has ruled Japan in the emperor's name ever since. Under the Hōjō regents the city has grown into a fortress capital of stern samurai culture, ringed by mountains and the sea, and the great bronze Buddha cast in 1252 still meditates above its precinct as a monument to the new Zen-inflected Buddhism the warrior aristocracy has embraced. It was from Kamakura that the response was directed to the Mongol invasions of 1274 and 1281, both repulsed by the warrior houses of Kyushu and the providential storms that earned the name #italic kamikaze#!, the divine winds."
 hakata_desc: "For centuries Hakata has served as Japan's principal window onto the continent, the port through which the embassies of Tang and Song China, the Korean kingdoms, and the merchants of the southern seas reached the islands. The merchants of Song-era Hakata maintained a Chinatown of stone-built warehouses and Buddhist temples founded by Chinese monks, and the wealth that flowed through its quays made the city the richest port of Kyushu. It was on the long beaches outside Hakata that the Mongol invasion fleets of 1274 and 1281 came ashore, and where the Kamakura bakufu's defenders raised the great stone wall, the #italic genkō bōrui#!, whose remnants still trace the shore as a memorial to the most desperate defense in Japanese history."
 namgyeong_desc: "Set in a basin protected by mountains where the Han River bends toward the Yellow Sea, the area of Hanyang has been settled since prehistoric times and was contested in antiquity between the kingdoms of Baekje and Goguryeo. Under the Goryeo dynasty the site rose in importance as the #italic Namgyeong#!, or Southern Capital, one of three secondary capitals supplementing the royal seat at Gaegyeong, and successive kings have considered moving the court here on the advice of geomancers who praise its auspicious siting. By the early 14th century Hanyang had grown into a substantial Goryeo town under the loose suzerainty of the Mongol Yuan, its strategic position on the Han River making it the natural gateway between the Korean peninsula and the wider world."
 pagan_desc: "On the dry plain of upper Burma where the Irrawaddy bends past barren hills, the kingdom of Pagan was founded in the 11th century by King Anawrahta, who unified the Burmese-speaking peoples and embraced Theravada Buddhism brought to him by the monk Shin Arahan. For two centuries his successors raised thousands of stupas, pagodas, and temples on the plain around the capital, a vast sacred landscape unrivaled in the Buddhist world, and the wealth of the great rice-bowl of Burma fed scholars and craftsmen from across India and Sri Lanka. The Mongol armies of Kublai Khan shattered the kingdom in 1287, and by the early 14th century real power has passed to the Shan-Burmese chieftains of Myinsaing and Pinya, the ancient capital surviving as a sacred ruin where pilgrims still wander among ten thousand crumbling temples."
 sukhothai_desc: "In the early 13th century the Thai chieftains of the upper Chao Phraya threw off the rule of the Khmer of Angkor and founded the kingdom of Sukhothai, whose name means #italic Dawn of Happiness#!. Under King Ramkhamhaeng, who ruled from 1279 to 1298, the kingdom flourished as a brilliant Theravada Buddhist polity drawing monks and craftsmen from Sri Lanka, and the inscription that the king set up in 1292 to commemorate his reforms is the oldest surviving document in the Thai script which he himself was credited with devising. Though by the early 14th century Sukhothai's power was already being challenged by the rising Thai principalities of the lower Chao Phraya, the city's gilded stupas and serene Buddha images have set the standard for Thai civilization."
 thang_long_desc: "In 1010 the Vietnamese king Lý Công Uẩn moved his capital from the cramped citadel of Hoa Lư to a new city on the banks of the Red River, naming it #italic Thăng Long#!, the Ascending Dragon, after a vision he had on arrival. Under the Lý and Trần dynasties it has become the heart of Đại Việt, a city of pagodas, examination halls, and royal palaces in which Vietnamese civilization gathered its distinct identity from Chinese, Cham, and Khmer influences. Three times the Mongol armies of Kublai Khan stormed across the northern frontier seeking to bring Đại Việt to heel, and three times the soldiers of the Trần, led by the great general Trần Hưng Đạo, defeated them in battles still recited in Vietnamese memory, the most famous of them fought in 1288 on the stakes-strewn waters of the Bạch Đằng River."
 trowulan_desc: "In 1293, after the Mongol expedition to Java had been ingeniously turned against the kingdom of Singhasari's usurper, the Javanese prince Raden Wijaya founded the new realm of Majapahit and raised his capital at Trowulan on the lower Brantas. Set amid the rich rice plains of east Java, the city is laid out with brick-walled compounds, broad reservoirs, and great gates whose terracotta panels celebrate the new dynasty's victories. Under the chief minister Gajah Mada, who rose to power in the 1320s, Majapahit has begun the campaigns that will extend its overlordship across the Indonesian archipelago, and Trowulan stands at the threshold of its golden age as the heart of a great empire of the Indies."
 palembang_desc: "From the 7th century until the late 13th, Palembang was the capital of the maritime empire of Śrīvijaya, whose fleets dominated the Strait of Malacca and whose monks made the city one of the great centers of Buddhist learning in the Indies. The Chinese pilgrim Yijing in the 670s urged his colleagues to study in Palembang before proceeding to India, and the city's monasteries housed thousands of monks engaged in translation and commentary. The Chola raid of 1025 broke Śrīvijaya's monopoly on the straits, and over the following centuries the city declined into a tributary of the Javanese kingdoms, though its position on the Musi River still made it a significant port of the southern Sumatran lords."
 pegu_desc: "Set on the great lowland delta where the Sittaung and Bago rivers reach the sea, Pegu rose to power in the wake of the Mongol shattering of Pagan in 1287, when the Mon king Wareru founded a new Theravada kingdom in lower Burma. Under his successors the city, known to the Mons as #italic Hanthawaddy#!, grew into the foremost port of the upper Bay of Bengal, drawing merchants from Bengal, Sri Lanka, and the Coromandel coast to trade in teak, rubies, and the famed lacquerware of the Mon craftsmen. Its great Shwemawdaw Pagoda, said to enshrine relics of the Buddha, marks the city as the new spiritual heart of a Mon civilization reborn from the wreck of Pagan."
 chiang_mai_desc: "In 1296 the Thai king Mangrai of the upper Mae Ping valley founded a new capital he called #italic Chiang Mai#!, the New City, completing his unification of the Lan Na, the Land of a Million Rice Fields, in the mountain valleys of northern Siam. The site was chosen with the help of the kings of Sukhothai and Phayao, and its walls and moat were laid out around a central square, a sacred plan that fuses Mon, Thai, and Khmer traditions. Under Mangrai and his successors the city flourished as a center of Theravada Buddhism and craft, its monasteries patronizing the bronze casters who make the Lan Na statues prized across the Buddhist world."
 vijaya_desc: "For four centuries the Cham kingdom has ruled its coastal strip of central Vietnam from the citadel of Vijaya, set behind sand dunes within sight of the South China Sea. The towers of brick that the Chams raised across their narrow realm speak of an Indianized Hindu civilization that traded silk and aromatic woods with the merchants of the southern seas, but the kingdom was repeatedly battered between the great hammers of Khmer Angkor and Vietnamese Đại Việt. The Cham capital fell to the Khmer in 1145 and to Đại Việt in 1283 and again in 1326, each time recovering its independence but in increasingly diminished form, the brick towers of its kings still rising as silent witnesses to a civilization whose long retreat down the coast has already begun."
 lubeck_desc: "Founded in 1143 by Count Adolf II of Holstein and refounded by Henry the Lion in 1159 after a fire, Lübeck rose to become the gateway between the North Sea and the Baltic, its harbor on the Trave drawing merchants from Saxony, the Slavic lands, and Scandinavia. Frederick II granted it the status of a Free Imperial City in 1226, and from that point Lübeck's merchants, organized in self-governing guilds beneath the city's red-brick towers, wove the network of treaties tying the merchant cities of the Baltic together. Its Lübeck Law had by the 14th century been copied and adopted by more than a hundred Baltic and North Sea towns, establishing the legal framework on which the merchant communities of the north built their common lives."
 visby_desc: "Rising behind formidable stone walls on the western coast of Gotland, Visby grew in the 12th and 13th centuries into one of the wealthiest cities of the Baltic, its harbor a meeting place for the fur traders of Novgorod, the cloth merchants of Flanders, and the iron and herring shippers of the German Hansa. The Gotland Farmers' Republic that ruled the island for centuries shared the city with a privileged German merchant quarter, and the parallel rule of the two communities gave the city its peculiar wealth and complexity. Its limestone churches, of which two dozen rose within the walls by 1300, proclaimed a prosperity that made Visby for a generation the most important entrepôt of the Baltic trade."
 tallinn_desc: "On the steep limestone cliff of Toompea overlooking the bay of Reval, the Danish king Valdemar II established his fortress in 1219 in the campaign that, according to legend, saw the Dannebrog flag fall from heaven to inspire his wavering army. The town that grew below the castle was settled by German merchants and craftsmen who gave it Lübeck Law and made it a Hanseatic port, its quays handling the trade between the Russian river routes to Novgorod and the great Baltic shipping lanes. Under the loose rule of the Danish crown, the Lower Town's burghers prospered on the herring and amber trade, while the bishop and the Teutonic Order vassals contended for influence on the rock above, the city's twin character as Danish royal foothold and German merchant republic giving it a vigor unmatched among the eastern Baltic ports."
 riga_desc: "In 1201 Bishop Albert of Buxhoeveden founded Riga as the seat of his crusade against the pagan Livs and Letts who inhabited the forests beyond the Daugava. With papal blessing he established the Livonian Brothers of the Sword, the warrior order that subjugated the pagan tribes in a half-century of bloody campaigns, and the new city rapidly outgrew its origins as a missionary base into the principal Hanseatic port of the eastern Baltic. From its quays, German cogs carried Russian furs, wax, and amber to Lübeck and beyond, while Riga's own merchants, organized in great German guilds, established trading posts up the river toward the Russian principalities. The long struggle between the Riga burghers, their archbishop, and the new Livonian Order became a defining feature of the city's politics."
 bergen_desc: "Sheltered between fjords and mountains on the western coast of Norway, Bergen was founded around 1070 by King Olaf Kyrre and rose to become the principal city and royal seat of medieval Norway. Its harbor of Bryggen served as the great export point for the stockfish of the northern fisheries, and by the late 13th century German merchants from the Hanseatic cities had begun to settle in growing numbers on the wharves, establishing the Kontor that increasingly dominated Norwegian foreign trade. Royal coronations, the writing of the Norwegian sagas, and the disputes between the crown, the church, and the foreign merchants made the city the political and cultural heart of a Norwegian realm that at its 13th-century height extended from the Faroes to Greenland."
 hamburg_desc: "Founded in the 9th century when Charlemagne and his successors built a fortress on the Elbe to convert and contain the Saxons, Hamburg became the seat of an archbishopric that aspired to spread the Christian faith northward into Scandinavia. Repeatedly sacked by Vikings, Slavs, and even by the Polish king Bolesław I, the city was steadily rebuilt, and in 1189 Frederick Barbarossa granted it imperial charters of trade and customs exemption that laid the foundation of its commercial future. By the 13th century Hamburg's alliance with Lübeck against Baltic piracy had become a cornerstone of the emerging Hanseatic system, and the city's brewers, ropemakers, and shippers made it the great Elbe terminus of north German trade."
 kyiv_desc: "From the 9th century the Varangian rulers of Rus' made Kyiv the capital of a great Slavic and Norse confederation on the middle Dnieper, and under Vladimir the Great and his son Yaroslav the Wise it became, in the 11th century, one of the wealthiest and most splendid cities of eastern Europe, its Hagia Sophia and Golden Gate proclaiming a civilization that traded as readily with Constantinople as with the Baltic. The fragmentation of Rus' into competing principalities slowly weakened the city even before the Mongol cataclysm, and in 1240 the armies of Batu Khan stormed and razed it so utterly that travelers a generation later found grass growing in its streets and skulls littering its fields. Slowly recovering under loose Mongol overlordship, by the 1320s Kyiv had fallen within the orbit of the rising Grand Duchy of Lithuania, its ancient Rurikid pedigree no match for the realities of the new political order."
 pskov_desc: "Set on a rocky bluff above the confluence of the Velikaya and Pskova rivers, Pskov has been a sister city of Novgorod since the earliest centuries of Rus', sharing its tradition of the assembly, the #italic veche#!, in which the free citizens debate and decide the affairs of state. In 1136 it began to assert its independence from Novgorod, and from the 13th century the Pskov militia, led by such warriors as Prince Daumantas the Lithuanian exile, defended the western frontier of the Rus' lands against the relentless pressure of the Teutonic Order. Spared the worst of the Mongol invasions by its remote position, Pskov flourished as a republic of merchants and warriors, its great stone Kremlin and its merchant churches expressing a civic confidence unmatched among the Russian cities of the age."
 avignon_desc: "On a great rock above the Rhône at the natural crossing point between Provence and Languedoc, Avignon was a Roman colony and a counts' seat before its destiny utterly transformed in 1309. In that year Pope Clement V, unable to safely return to Rome and seeking French royal protection, established his court at Avignon, and his successors began to raise the great Palais des Papes looming over the city as the new center of Latin Christendom. Cardinal palaces, embassies from every European court, scriptoria, and money-changers crowded the streets around the papal palace, and the city's population doubled and doubled again as it took on the bewildering role of capital of the universal Church."
 toledo_desc: "On a horseshoe of rock above the Tagus, Toledo served as the capital of the Visigothic kings before the Muslim conquest of 711, and under its Moorish lords it remained one of the principal cities of al-'Andalus, its narrow streets crowded with the synagogues, churches, and mosques of an unusually tolerant religious mix. Alfonso VI of León-Castile reconquered the city in 1085, and the Castilian crown that established its capital here inherited a place where Latin, Arabic, and Hebrew learning could meet. The school of translators, patronized by Archbishop Raymond and by King Alfonso X the Wise in the 13th century, made Toledo the gateway through which much of Greek and Arab philosophy, science, and medicine reached the Latin West, fundamentally reshaping European thought."
 granada_desc: "In 1230, as Christian armies advanced across al-'Andalus and the great Almohad realm collapsed, Muḥammad ibn al-Aḥmar carved out a new emirate at Granada in the Sierra Nevada, the last refuge of Muslim Iberia. Under the Nasrid dynasty he founded, the kingdom of Granada became a tributary of Castile, but contrived to flourish as the heir of the Andalusi civilization, its mountain frontier and its dense agricultural #italic vega#! together making it a difficult prize for any conqueror. On the Sabika hill above the city the Nasrid sultans raised the palace-fortress of the Alhambra, whose courts and chambers quickly became the supreme architectural expression of Andalusi civilization."
 dublin_desc: "Founded in the 9th century by Viking raiders who established a #italic long-phort#!, a fortified ship-camp, at the dark pool, the #italic Dubh Linn#!, where the Liffey meets the sea, Dublin grew into the most important Hiberno-Norse city of Ireland. Its merchants traded slaves, hides, and silver across the Irish Sea, and its kings repeatedly clashed with the Irish overkings until Brian Boru shattered their power at Clontarf in 1014. The Anglo-Norman conquest of 1170, led by Strongbow and confirmed by Henry II, brought the city under the English crown, and Dublin became the capital of the Lordship of Ireland, its walls expanded, its cathedrals raised, and its administration of English law extending uncertainly out into the surrounding Pale."
 antwerp_desc: "On the great tidal estuary of the Scheldt, Antwerp has been a fortified margraviate of the Holy Roman Empire since the 10th century, its citadel on the Steen guarding the river crossing against Viking raiders. The Dukes of Brabant promoted it through the 12th and 13th centuries as a rival to the Flemish cities of Bruges and Ghent, and in 1296 a Hanseatic Kontor was established in the town, signaling its emergence as a serious port of north European trade. Though still in the shadow of Bruges in the early 14th century, the city's deeper harbor and easier access to the open sea drew the Italian galleys and Iberian carracks that marked the steady rise of the Scheldt port."
 lyon_desc: "Founded as the Roman colony of #italic Lugdunum#! at the confluence of the Rhône and the Saône, Lyon was the capital of the three Gauls and the seat of the imperial mint that supplied the empire with its silver coin. After the fall of Rome it became the metropolitan see of an archbishop who claimed the primacy of all Gaul, and through the Middle Ages the city's twin valleys grew into one of the great crossroads of Western Europe. Although nominally a city of the Holy Roman Empire until 1312, when it passed under direct French royal rule, Lyon was already developing as a fair city where merchants from Italy, the Low Countries, and the Mediterranean met to settle their accounts in silk, spice, and silver."
 york_desc: "Founded by the Romans in AD 71 as the legionary fortress of #italic Eboracum#!, York grew into the capital of their northern province and the place where the emperor Constantine was acclaimed by his troops in 306. After centuries as the Anglian capital of Northumbria and a great Christian center under the scholar Alcuin, the city was seized by the Great Heathen Army in 866 and became #italic Jorvik#!, capital of a Viking kingdom whose merchants traded as far as Samarkand. The Norman conquest brought the building of a great cathedral and twin castles, and through the Middle Ages York endured as the seat of an archbishop who contested ecclesiastical primacy with Canterbury, and as the second city of England in size, wealth, and antiquity."
 canterbury_desc: "When Augustine of Rome landed in Kent in 597 to convert the Anglo-Saxons, he made Canterbury the seat of his mission and the first archbishopric of the English Church, an authority which it has retained ever since. The cathedral he founded was rebuilt many times, most fatefully after the murder of Archbishop Thomas Becket within its walls in 1170, an act of royal sacrilege that turned Canterbury into one of the great pilgrimage destinations of medieval Christendom. The road from London to Canterbury was thronged with pilgrims bound for Becket's shrine, and the city's prosperity was built as much on the lodging, food, and souvenirs sold to them as on its ancient ecclesiastical importance."
 edinburgh_desc: "Crowning the volcanic plug of Castle Rock that rises sheer above its surroundings, Edinburgh has been a stronghold since the days of the Britons who knew it as #italic Din Eidyn#!. It became the principal royal burgh of Scotland under David I in the early 12th century, who founded the abbey of Holyrood at the foot of the rock and granted the town charters that drew Flemish and English merchants to its market street. The Wars of Independence at the turn of the 14th century saw the castle change hands repeatedly between Scots and English garrisons, and the famous daring raid by Thomas Randolph that recaptured it for Robert the Bruce in 1314 has become one of the legendary feats of the Scottish wars."
 kilwa_kisiwani_desc: "On a coral island off the East African coast, Kilwa Kisiwani rose in the 11th century as a Swahili settlement of Shirazi origin and grew through the 13th and early 14th centuries into the wealthiest of the city-states of the Swahili coast. Under the Mahdali dynasty, established in 1277, the sultans of Kilwa took control of the gold trade from Great Zimbabwe through the southern port of Sofala, and the wealth that resulted built the great coral palace of #italic Husuni Kubwa#!, with its octagonal bathing pool and its terraced great court, the largest pre-modern building in sub-Saharan Africa. Ibn Battuta, who visited in 1331, judged it one of the most beautiful and well-built cities he had seen in all his travels."
 mogadishu_desc: "At the northern end of the Swahili coast, Mogadishu was founded around the 10th century by Arab and Persian settlers who married into the Somali peoples of the Banaadir coast, and by the 12th century it had become a flourishing Islamic city of stone houses, mosques, and quayside warehouses. Its weavers produced the renowned #italic Maqdishawi#! cloth, traded across the Indian Ocean as far as Egypt and India, and its merchants extended their commercial reach throughout the western Indian Ocean. Ibn Battuta, who visited in 1331, found a city governed by Sultan Abu Bakr ibn Sayid 'Umar, a Berber-descended ruler under whose patronage Friday prayers in the great mosque draw crowds of merchants, jurists, and Sufi mystics from across the Islamic world."
 mombasa_desc: "Set on a coral island off the East African coast, Mombasa has been a Swahili port since at least the 12th century, when the geographer al-Idrisi described it as a substantial Muslim town and a haven for the merchants of the western Indian Ocean. Under the rule of its Shirazi-descended sultans the city grew into one of the principal trading places of the Swahili coast, second only to Kilwa in the southern half of that long ribbon of city-states, its quays receiving Arab dhows from the north and Indian fleets bound for the spice islands beyond. Its mangrove-lined harbor and its mosques of coral rag testified to a Swahili civilization that welded African, Arab, and Persian traditions into a distinctly cosmopolitan culture of the monsoon."
 sofala_desc: "At the southern end of the Swahili coast, where the Zambezi country opens onto the Indian Ocean, Sofala served from the 10th century as the great outlet for the gold of the African interior. The kingdom of Great Zimbabwe sent its gold down the long caravan routes to be exchanged at Sofala for the silks of China, the ceramics of Persia, and the cottons of India that the dhows of the monsoon brought down each year from Kilwa and beyond. The Arab geographer al-Mas'udi visited in the 10th century, and under the Mahdali sultans of Kilwa the city became an obedient outpost of the great northern Swahili polity, its prosperity wholly dependent on the gold trade and the cycles of the monsoon."
 gao_desc: "On the great northeastern bend of the Niger River, Gao was the capital of the kingdom of the Songhai from at least the 8th century, and its Islamicized rulers were trading with North Africa long before the rise of Mali. The conquering hosts of Mansa Musa swept it into the Mali Empire in the early 14th century, and Gao became one of the principal tributary cities of the great African emperor, its dhows gliding up and down the Niger to gather the salt of the Sahara and the gold of the southern forests for the markets of Timbuktu. Beneath Malian overlordship the Songhai royal house preserved itself, and the seeds of a future imperial revival were sown in the city's mosques and trading quarters."
 djenne_desc: "At the head of the inland delta of the Niger, Djenné has been a substantial settlement since the centuries before Christ, its nearby ancestor at Djenné-Djenno representing one of the earliest urban civilizations of sub-Saharan Africa. By the late 13th century the city had embraced Islam under its king Konboro, and the great mud-brick Friday Mosque he built rose at the center of a thriving inland delta town, twinned with Timbuktu in the trans-Saharan trade. Djenné's merchants gathered the gold of the Bambuk and Bure fields and the cotton of the inland delta to exchange for the salt of the desert, and the city's #italic banco#! architecture, with its protruding wooden timbers and earthen towers, set the visual signature of the Sahelian Sudan."
 great_zimbabwe_desc: "South of the Zambezi, on a high granite plateau above the Save River, the Shona-speaking peoples raised through the 11th and 12th centuries an extraordinary city of mortarless stone, the curving walls and conical towers which give the kingdom its name, from #italic dzimba dzemabwe#!, the houses of stone. At its 14th-century height the city covered hundreds of acres and may have housed as many as eighteen thousand people, its rulers commanding the gold trade flowing down to the Swahili coast at Sofala and from there to Kilwa and the wider Indian Ocean. Soapstone bird carvings, Chinese porcelain shards, and beads from Persia and India filled its markets, witnesses to the global reach of a civilization that no European then could imagine existed."
 kano_desc: "On the savanna south of the great Saharan dunes, Kano was founded, according to Hausa tradition, by the descendants of the legendary hero Bayajidda, who slew the snake of the well and made his sons the kings of the seven Hausa city-states. By the 14th century Kano was the most powerful of these states, its rocky hill of Dala honored as the birthplace of the polity, and its mud walls and dyeing pits drawing the salt and copper caravans of the Sahara to trade for the indigo-dyed cloth and leatherwork at which the Hausa craftsmen excelled. Its kings ruled according to the rites of the older Hausa religion, but along the trans-Saharan routes, Islamic missionaries and merchants made their first inroads into the kingdom."
 axum_desc: "Among the most ancient cities of Africa, Axum was the capital of the Aksumite kingdom that flourished from the 1st century, traded with Rome and India through its Red Sea port of Adulis, and in the 4th century under King Ezana embraced Christianity as its state religion, the first sub-Saharan polity to do so. The great granite stelae the Aksumites raised over their royal tombs still tower above the city's ruins, the tallest of them weighing five hundred tons and bearing the carved likeness of a multi-storied palace. By the 14th century real power had moved south with the new Solomonic dynasty restored under Yekuno Amlak in 1270, but Axum remained the spiritual capital of Ethiopian Christianity, the place where Ethiopian emperors continued to be crowned and where the Ark of the Covenant itself was, according to tradition, kept hidden in the Church of Our Lady Mary of Zion."
 mayapan_desc: "Built within a great defensive wall on the dry plain of the northern Yucatán, Mayapan rose in the late 13th century as the successor to the older Maya capital of Chichén Itzá, founded according to the Maya chronicles by the Cocom family who claimed descent from the rulers of the older city. From within the walls of the new capital the Cocom rulers headed a league of allied lords drawn from across the Yucatán, requiring the heads of subject lineages to reside under royal eye in the capital so that their loyalty might be assured. Its many smaller and less ambitious copies of the temples of Chichén proclaimed a civilization that knew itself the heir of an older and grander tradition, yet the political achievements of the league of Mayapan, holding the petty kings of the Yucatán together in a single confederacy, are truly its own."
 chan_chan_desc: "On the desert coast of northern Peru, where the Andes drop sharply to the Pacific and not a drop of rain may fall for years, the Chimu kings raised over the 12th to 14th centuries the vast city of Chan Chan, the largest pre-Columbian city of South America. Within its walls rose a succession of great royal #italic ciudadelas#!, each a self-contained palace-compound built for a single ruler and sealed up at his death, the adobe walls of each compound covered with the rhythmic relief patterns of waves and seabirds that emblemized the maritime origins of the Chimu people. From this capital the kings of Chimor ruled the longest coastal empire ever to arise in the Andes, a thousand kilometers of irrigation, fishing, and metalworking communities owing tribute to the desert city at its heart."
 cholollan_desc: "Beneath the slopes of the volcano Popocatepetl on the great central plateau of Mexico stood the city of Cholollan, whose extraordinary pyramid of #italic Tlachihualtepetl#!, the Man-Made Mountain, was the largest single structure ever raised in the pre-Columbian world. Begun in the centuries before Christ and successively enlarged by Toltec and later builders, it covered a vast base on which stood the temple of the feathered serpent Quetzalcōātl, the great deity to whom Cholollan was sacred. The city passed from Toltec into Olmeca-Xicalanca and finally into Tolteca-Chichimeca hands, where it remained the most important pilgrimage center of the central highlands, a place where the new lords of the basin went to be confirmed in their authority by the priests of Quetzalcōātl."
 qusqu_desc: "In a high valley of the Andes at the heart of what the local peoples call the four directions, the small city of Cuzco, anciently #italic Qusqu#!, the Navel of the World, was founded according to legend by Manco Cápac, who emerged with his sister-wife from the waters of Lake Titicaca to plant his golden staff at the chosen spot. Through the 13th and early 14th centuries the city was the modest seat of a regional chiefdom contesting with neighbors such as the Chancas, the Quechuas, and the Ayarmacas for primacy in the southern Andes. Its rulers, who would one day take the title of #italic Sapa Inca#!, readied the alliances and the warriors with which the next generation of their house could launch a far greater ambition over the southern Andes."
 roskilde_desc: "Set on the deep fjord of Zealand's northern coast, Roskilde rose to prominence in the 10th century as the seat of the Jelling dynasty kings who unified Denmark, and the first stone church here was built by Harald Bluetooth himself, who lies buried within its precincts. As the royal mausoleum of the Danish crown and the seat of a powerful bishopric, the city grew through the 12th and 13th centuries into the foremost town of the Danish realm, its great red-brick cathedral rising as one of the earliest examples of brick Gothic in northern Europe. By the early 14th century the rising Sound port at Copenhagen had begun to draw away the merchants, but Roskilde remained the spiritual heart of Denmark, the place where its kings were crowned and buried for more than three centuries."
 kobenhavn_desc: "On the eastern shore of Zealand looking out across the narrow Sound to Skåne, the small fishing village of #italic Havn#! was given by King Valdemar I to his foster-brother Bishop Absalon, who built a fortified castle on the island of Slotsholmen around 1167 to suppress the Wendish pirates of the Baltic. Under his successors the bishop's fortress grew into the merchant town of #italic Købmandshavn#!, the Merchants' Harbor, controlling the rich herring fisheries of the Sound where the great schools of fish gather each summer. The city's possession was bitterly disputed between the kings of Denmark and the archbishops of Roskilde, but its commanding position on the Sound steadily drew the trade of the Baltic to its quays."
 lund_desc: "Founded in the late 10th century by Sweyn Forkbeard at the heart of his Skåne possessions, Lund rose to extraordinary prominence in 1103 when Pope Paschal II raised it to the seat of the Archbishopric of all Scandinavia, separating the northern churches from the see of Hamburg-Bremen. The great Romanesque cathedral begun under Archbishop Asser was consecrated in 1145 and dominated the city, its crypt holding the famed astronomical clock and the figure of Finn the Giant. Though Nidaros was raised to its own archbishopric in 1152 and Uppsala followed in 1164, Lund retained primacy over the Danish church and over Skåne, its archbishop ranking among the highest dignitaries of the Danish realm."
 oslo_desc: "Founded, according to tradition, by King Harald Hardrada around 1049 at the head of the great fjord that bears its name, Oslo was raised to the seat of a bishopric in 1070 and grew through the medieval centuries into one of the principal towns of the Norwegian kingdom. King Håkon V Magnusson made it his royal capital in 1299, removing the court from Bergen to be closer to the political center of mainland Scandinavia, and his great fortress of Akershus, begun around 1300, looms over the harbor as a symbol of this royal ambition. The city's wooden streets crowded between the Akershus rock and the bishop's quarter, its merchants trading the timber and furs of the Norwegian interior for the grain and cloth of the Baltic ports."
 nidaros_desc: "On the bank of the Nidelva where it meets the great fjord of Trøndelag, Nidaros was founded around 997 by King Olaf Tryggvason and grew into the burial place of his Christianizing successor, King Olaf Haraldsson, who fell at the battle of Stiklestad in 1030 and was almost immediately venerated as a martyr-saint. The great cathedral built over his shrine became the holiest pilgrimage destination of the northern world, drawing the faithful from Iceland, Greenland, and the British Isles, and in 1152 the city was raised to the archiepiscopal seat of an ecclesiastical province extending from the Norwegian heartlands to the colonies of the western seas. Even after the royal capital moved south to Bergen and then Oslo, Nidaros remained the spiritual heart of Norway, the place where its kings were crowned and where St. Olaf, its eternal monarch, watched over the realm."
 abo_desc: "Established in the wake of the Second Swedish Crusade that subjugated the Finns to Christian rule in the 1240s, Åbo, known to the Finns as #italic Turku#!, grew at the mouth of the Aura River into the principal Swedish foothold on the southwestern Finnish coast. In 1300 it was raised to a bishopric, its newly consecrated cathedral becoming the spiritual center of the Finnish church, and the town's quays began drawing the Baltic trade that linked the Finnish interior to Stockholm and the Hanseatic cities beyond. Though still modest compared to the great Hanseatic ports of the southern Baltic, Åbo served as the administrative and ecclesiastical capital of the Swedish realm's Finnish dominions, its bishop ranking alongside the foremost prelates of the Swedish church."
 kalmar_desc: "Set on the southeastern coast of Sweden where the channel between the mainland and the long island of Öland narrows, Kalmar grew through the 12th century around its great stone castle, one of the earliest and most formidable royal fortresses of the Swedish realm. Its harbor served as Sweden's principal southern outlet, channeling the export of iron, copper, and butter to the Hanseatic merchants of Lübeck and beyond, and the town received its royal privileges from King Magnus Ladulås in 1276, confirming its status as one of the foremost cities of the kingdom. By the early 14th century Kalmar's strategic position on the Danish-Swedish frontier and its strong walls made it both a vital trade port and a key military stronghold, the southern bastion of the Swedish crown against the ambitions of Denmark."
 falun_desc: "On the slopes of the great red mountain of Tiskasjöberget in Dalarna lay the copper mine of #italic Stora Kopparberget#!, the largest and most productive copper source in medieval Europe and a fixture of Swedish industry since at least the 9th century. King Magnus III in 1288 granted formal privileges to the mining company that operated the workings, the #italic Stora Kopparbergs Bergslag#!, marking it as one of the oldest joint commercial enterprises in the world. The miners' settlement of Falun, set on the lake below the workings, grew around the great pit whose smoke and red oxide dust colored the surrounding houses and the soil for miles around, and the copper that flowed from its furnaces supplied not only the Swedish realm but the markets of all northern Europe."
 uppsala_desc: "A few kilometers from the modest cathedral town stands ancient Gamla Uppsala, the old pagan center where Adam of Bremen described a great temple of gold whose three idols of Thor, Odin, and Freyr were attended by sacrifices of men and beasts every ninth year, and where the royal mounds of the Yngling kings still rise above the plain. With Sweden's conversion to Christianity the cult-site was overtaken, and in 1164 Pope Alexander III raised Uppsala to the seat of the Archbishopric of all Sweden, separating the Swedish church from Lund's Danish primacy. In 1287 the see was moved a few kilometers south to the new town of Östra Aros, where construction began on the great brick Gothic cathedral that, when completed, would be the largest in Scandinavia, and at whose altar the kings of Sweden were crowned by the foremost prelates of the realm."
 skara_desc: "Set on the plains of Västergötland between the great lakes of Vänern and Vättern, Skara was raised by King Olof Skötkonung in 1014 to be the seat of Sweden's first bishopric, the German missionary Thurgot installed as its first prelate. From this modest plains town the Christian faith was carried into the still half-pagan Swedish realm, and the great Romanesque cathedral consecrated under Bishop Bengt the Good in 1150 marked Skara as the spiritual capital of Västergötland for centuries to come. Though ultimately overshadowed by Uppsala and Linköping in influence, the bishop of Skara retained the dignity of one of the foremost prelates of the Swedish realm, his cathedral chapter and #italic Skarakrönikan#! preserving the memories of the kingdom's earliest Christian centuries."
 linkoping_desc: "Set on the inland plain of Östergötland where the road from Stockholm to the southern kingdoms meets the Stång River, Linköping was raised to a bishopric in the early 12th century and has long been one of the foremost ecclesiastical centers of the Swedish realm. Its great cathedral, begun in the 12th century in the local light-gray limestone, flourished into one of the most ambitious Gothic structures in Sweden, and the bishop of Linköping ranked immediately behind the archbishop of Uppsala among the prelates of the kingdom. Nearby at Skänninge the great synod of 1248, convened by the papal legate William of Sabina, imposed clerical celibacy on the Swedish church and decisively bound it into the Latin canonical framework of the wider Christian world."
 soderkoping_desc: "Located on the Storå River where it reaches the Baltic at the head of a sheltered estuary, Söderköping grew through the 12th and 13th centuries into one of the most important ports in Sweden, its quays crowded with the cogs of Lübeck and Visby loading the iron and copper of inland Sweden for the markets of the south. A royal market town with a substantial German burgher community governing under Lübeck-derived privileges, the city hosted royal coronations, treaty negotiations, and the great fair that drew merchants from across the Baltic each summer. Though the slow silting of its waterway had already begun to threaten its harbor, Söderköping in the early 14th century remains one of the principal trading places of the Swedish east coast."
 lodose_desc: "On the Göta älv where the great river winds down from Lake Vänern toward the sea, Lödöse served as Sweden's only outlet to the Atlantic and the North Sea trade, a wooden river-port crammed onto a strip of land between the water and the steep western hills. From its quays Swedish ships sailed to Norway, England, and the cities of the Low Countries, exchanging iron and hides for the cloth and wine of the western markets, and the royal mint struck coin for the kings of Sweden starting from at least the 12th century. Caught between the contesting territorial ambitions of Denmark, Norway, and Sweden along the lower Göta älv, Lödöse's ownership was a perennial diplomatic question, its strategic value as Sweden's sole Atlantic outlet unmatched anywhere else in the kingdom."
 jonkoping_desc: "Set at the southern end of the great lake of Vättern at the natural crossing point between the Småland highlands and the plains of Östergötland, Jönköping received its royal town privileges from King Magnus Ladulås in 1284, the charter recognizing what had long been an important meeting and trading place between the kingdoms of the north and the south. Its position commanding the principal route between the central provinces and the Danish-held Skåne marches made it both a thriving market town and a frontier fortress, and the royal castle overlooking the harbor was a steady bulwark against the perennial Danish ambition to push their border north. By the early 14th century, Jönköping served as the political and military key to the Småland approach into the Swedish heartland."
 ribe_desc: "Founded around 700 as a Viking market on the marshy western coast of Jylland where a tidal creek allowed the beaching of ocean-going ships, Ribe is the oldest town in Scandinavia. Its merchants traded with the Frisian and English coasts more than a century before the Vikings reached the British Isles. Adam of Bremen described it as the principal market of Denmark, and the missionary Ansgar founded a church here in the early 9th century, making Ribe one of the earliest footholds of Christianity in the Scandinavian north. The great Romanesque cathedral begun in the 12th century in tufa stone brought from the Rhineland rose over a town whose merchants traded with the Frisian and Flemish ports across the North Sea, exchanging the salt and grain of the western Danish coast for the cloth and wine of the south."
 viborg_desc: "Set on the central plateau of Jylland between great heaths and lakes, Viborg was since pagan times the site of the Jylland #italic landsting#!, the regional assembly where the chieftains of the peninsula gathered to debate law and proclaim their kings. Throughout the medieval centuries new kings of Denmark were first acclaimed here at Viborg before riding south to Lund for ecclesiastical coronation by the archbishop, and the town's two great cathedrals, the bishop's seat and the older royal church, attested to the unusual concentration of sacred and political authority within its walls. Though the rise of Copenhagen and the eastward shift of Danish power diminished Viborg's day-to-day importance, the symbolic primacy of its #italic landsting#! remained an essential rite in the making of a Danish king."
 odense_desc: "At the heart of the island of Funen, Odense takes its name from the Norse god Odin, to whom the great cult-site here was sacred long before the coming of Christianity. The town's transformation began in 1086 when King Knud the Holy was murdered before the altar of St. Alban's Church by rebellious nobles refusing his tithe and his crusading levy, and the cult that swiftly grew around the martyred king brought papal canonization in 1101 and made Odense one of the great pilgrimage destinations of Scandinavia. The Benedictine monastery established to house the saint's relics, founded by English monks from Evesham, made the city a center of learning, and by the early 14th century Odense was the foremost town of the Danish islands west of Zealand."
 aarhus_desc: "Founded as a Viking-age settlement on the eastern coast of Jylland where the Aarhus River meets the Kattegat, Aarhus is mentioned in 948 among the four Danish bishoprics established under German missionary influence in the wake of the Christianization of King Harald Bluetooth. Its sheltered harbor made it the principal port of east Jylland through the medieval centuries, channeling the cattle and grain of the Jutish plains to the markets of Lübeck and Hamburg, and the great brick cathedral begun in the 13th century looms over a town of merchants and fisherfolk. Though overshadowed by Viborg in political importance and by Ribe in commercial weight, Aarhus by the early 14th century held an unassailable place as the leading port of Jylland's Kattegat coast."
 aalborg_desc: "On the southern bank of the Limfjord where the great inland waterway cuts across northern Jylland from the North Sea to the Kattegat, Aalborg commanded the principal crossing point of the fjord and the trade that passed east and west between the two seas. The royal castle of Aalborghus, in its earlier wooden incarnations, guarded the crossing from at least the 11th century, and the herring fisheries of the fjord made the town's merchants wealthy enough to maintain a substantial Hanseatic trade with Lübeck and the Wendish ports. Royal privileges, sober brick churches, and a growing burgher population made Aalborg by the early 14th century one of the principal towns of northern Denmark, its position on the cross-Jylland waterway giving it a strategic value unmatched in the region."
 tonsberg_desc: "According to the sagas of Snorri Sturluson, Tønsberg was founded before the great battle of Hafrsfjord that united Norway under Harald Fairhair in 872, and therefore claims the title of Norway's oldest town, its sheltered harbor on the Oslofjord serving Viking fleets and royal courts alike through the 9th and 10th centuries. The fortress of Tunsberghus on the height above the harbor became one of the principal royal castles of medieval Norway, and the great Premonstratensian abbey of Olavskloster, founded in the late 12th century, made the city a center of learning. Treaties between Norwegian kings and pretenders, royal coin-mintings, and the staging of armies for civil wars and crusades all made Tønsberg an essential place in Norwegian history, subordinate only to Bergen, Nidaros, and Oslo among the other settlements of the realm."
 stavanger_desc: "Situated in a sheltered cove of the southwestern Norwegian coast, where the great fjords of Ryfylke open onto the North Sea, Stavanger was raised to a bishopric by King Sigurd the Crusader in 1125, who brought the English bishop Reinald of Winchester to establish the new see. The Romanesque cathedral begun under Reinald's hand, in a style adopted directly from Anglo-Norman England, dominated the harbor as one of the most distinctively English-influenced churches in Scandinavia. As the seat of the bishopric of Stavanger, the city ranked among the principal ecclesiastical centers of the Norwegian realm, its bishop controlling vast lands across the dioceses of Rogaland and Agder, even as the harbor itself remains a modest fishing port at the western edge of the Norwegian world."
 hamar_desc: "Set on the western shore of Lake Mjøsa in the inland heart of Norway, Hamar was raised in 1152 to a bishopric by Cardinal Nicholas Breakspear, the future Pope Adrian IV, during his great mission to reorganize the Norwegian church and establish the archbishopric of Nidaros. The cathedral, begun shortly after on the lakeside, evolved throughout the 12th and 13th centuries into one of the most ambitious Romanesque churches of the Norwegian interior, and the bishop of Hamar, governing a diocese of mountain valleys and lake-shore parishes, ranked among the foremost prelates of the kingdom. By the early 14th century the modest cathedral town served as the principal religious center of the inland Norwegian provinces, its bishopric the spiritual focus of the lake country and the eastern Norwegian mountains."
 vyborg_desc: "Founded in 1293 by the Swedish marshal Torkel Knutsson during the Third Swedish Crusade against the Karelians, Vyborg was raised as a great stone castle on a rocky islet off the Karelian coast, the easternmost outpost of the Swedish realm and the principal fortress guarding the new frontier against Novgorod. From its walls the Swedish governors directed campaigns against Karelian and Russian raiders for thirty years, until the Treaty of Nöteborg in 1323 finally fixed the frontier between Sweden and Novgorod, leaving Vyborg as the unchallenged eastern bastion of the Swedish king. Around the castle a growing merchant town developed, drawing the trade of Karelian furs, Russian wax, and Finnish goods to its quays and serving as the eastern terminus of the Baltic shipping lanes."
 burgos_desc: "Settled in 884 by Count Diego Rodríguez Porcelos at the meeting of the Arlanzón and Vena rivers, Burgos became through the 9th and 10th centuries the foremost stronghold of the County of Castile and from 1037, under Ferdinand the Great, as the principal royal city of the unified Kingdom of Castile and León. It was the home of Rodrigo Díaz de Vivar, called El Cid Campeador, whose remains rested in the nearby monastery of San Pedro de Cardeña, and the head of the great pilgrim road, the #italic Camino Francés#!, that channeled pilgrims from across Christendom to Santiago de Compostela. The royal mausoleum of Las Huelgas, founded by Alfonso VIII in 1187, held the tombs of the Castilian kings, and the great Gothic cathedral begun in 1221 under King Ferdinand III was considered one of the supreme architectural achievements of medieval Spain."
 leon_desc: "Founded by the Romans as the camp of the #italic Legio VII Gemina#! from which it takes its name, León rose in the 10th century to be the capital of the Christian Asturian-Leonese kingdom that pushed the Reconquista south across the Cantabrian foothills onto the Meseta. The royal palace and the great basilica of San Isidoro, whose 11th-century Pantheon of Kings held the tombs of two dozen Leonese sovereigns, made the city the spiritual and political heart of a realm that for a time outweighed Castile in both prestige and territory. Although the union with Castile under Ferdinand III in 1230 shifted the political center southward to Toledo and Valladolid, León retained the symbolic dignity of its ancient royal status, and its great Gothic cathedral, begun in 1205 and modeled on the cathedrals of northern France, stood as luminous testaments to that enduring pride."
 salamanca_desc: "Set on a rocky bluff above the Tormes in the western Meseta, Salamanca was an old Celtiberian and Roman town that the Christian kingdoms repopulated under Alfonso VI in 1085 as part of the great resettlement of the lands between the Duero and Tagus. The decisive transformation came in 1218 when King Alfonso IX of León established a #italic Studium Generale#! here, and the school he founded grew with extraordinary speed into one of the four great universities of Christendom alongside Bologna, Paris, and Oxford, its #italic licentia ubique docendi#! confirmed by Pope Alexander IV in 1255. Its scholars in canon law and theology soon rivaled those of the older European #italic studia#!, and by the early 14th century Salamanca was the principal center of intellectual life in the Castilian realm."
 segovia_desc: "At the foot of the Sierra de Guadarrama, Segovia is dominated by the great Roman aqueduct of double-arcaded granite that has carried the waters of the Frío down from the sierras to the city for more than twelve hundred years without mortar, one of the most spectacular engineering monuments to survive from antiquity in all of Spain. Resettled as a frontier town by Alfonso VI after the conquest of Toledo in 1085, Segovia developed into a favored royal residence and the site of an important royal mint through the medieval centuries, the Castilian kings stopping at its Alcázar on the rock above the river to dispense justice and direct affairs of state. Its merino sheep, driven each year between the Extremaduran winter pastures and the Castilian summer uplands, made the wool of Segovia famous in Flanders markets."
 avila_desc: "On a windswept granite outcrop at the western edge of the Sistema Central, Ávila was resettled by Count Raymond of Burgundy in 1090 and immediately girdled with the most complete and formidable circuit of medieval walls in Iberia, raised by the masons of León and Burgos in less than a decade. The eighty-eight semicircular towers and nine gates that crown the rim of the rocky platform watch over a city that grew into a vital frontier stronghold of resettlement Castile, and the city's churches, including the cathedral of San Salvador whose apse is built into the eastern stretch of the ramparts, made it a center of religious life as well as a military bastion. By the early 14th century the city's walls stood undefeated as a symbol of Castilian resettlement, watching impassively over the Meseta they were raised to defend."
 madrid_desc: "Founded in the late 9th century as the small Muslim outpost of #italic Majrīṭ#!, taking its name from the abundant springs that watered its surrounding heaths, Madrid was a fortified rural town of the Caliphate's northern frontier when Alfonso VI of León-Castile captured it without resistance in 1083 during his great advance toward Toledo. The Castilian crown maintained it as a modest royal town, granting it its #italic Fuero#! in 1202 under Alfonso VIII, and the moors of its hunting grounds made it a favored stopping place for the itinerant Castilian court. In 1309 King Ferdinand IV convened the Cortes of Castile at Madrid for the first time, a sign of the town's growing administrative importance even as it remained a modest settlement in the long shadow of the nearby imperial city of Toledo."
 santiago_compostela_desc: "In the early 9th century the hermit Pelayo, guided by a strange star above an oak grove in the wild hills of Galicia, was led to a Roman tomb. Bishop Theodemir of Iria Flavia identified it as the burial place of the apostle James, the brother of John, whose body was carried there by his disciples after his martyrdom in Jerusalem. King Alfonso II of Asturias raised the first church over the rediscovered tomb, and through the 11th and 12th centuries Santiago de Compostela grew into the third greatest pilgrimage destination of Christendom after Rome and Jerusalem, the apostle's #italic concha#! shells worn on the hats of penitents from every corner of Europe. The great Romanesque cathedral begun in 1075 by Bishop Diego Peláez and continued by the formidable Bishop Diego Gelmírez dominated the end of the #italic Camino Francés#!, the most traveled road in medieval Europe, and the archbishopric of Compostela ranked among the most powerful and contested ecclesiastical lordships of Latin Christendom."
 zaragoza_desc: "Founded as #italic Caesaraugusta#! by the emperor Augustus on the Ebro at the heart of the great riverine plain, Zaragoza served as the foremost Roman city of the upper Ebro valley before passing through Visigothic and Muslim rule. Under the taifa Banū Hūd kings of the 11th century, it became the capital of one of the most cultivated Andalusi successor-state, whose suburban palace of the Aljafería shone as a jewel of late Islamic court architecture. Conquered in 1118 by Alfonso the Battler of Aragon in one of the great triumphs of the Reconquista, the city was elevated to be the capital of the new Kingdom of Aragon, and its great Mudéjar churches, royal mint, and meeting place of the Cortes of Aragon made it the political and ceremonial heart of the Aragonese crown."
 valencia_desc: "First established as the Roman colony of #italic Valentia Edetanorum#! on the broad coastal plain of the Turia, the city passed through Visigothic and Moorish hands before becoming, briefly, the personal lordship of Rodrigo Díaz de Vivar, El Cid, who held it from 1094 until his death in 1099. After his Christian forces withdrew, the city returned to Muslim rule, flourishing under the Almoravid and Almohad dynasties as one of the great cities of al-'Andalus, its #italic huerta#! of irrigated fields and citrus groves famed across the Mediterranean. King Jaume the Conqueror of Aragon entered the city in triumph on 9 October 1238, capping the longest siege of the eastern Reconquista, and founded the new Kingdom of Valencia within the Aragonese crown, retaining its irrigated agriculture, its #italic huerta#! water court, and much of its prosperity."
 palma_desc: "Founded as the Roman colony of #italic Palmaria#! on a sheltered bay of the island the Romans called the Balearic, the city passed into Vandal and Byzantine hands before its capture by the Caliphate of Córdoba in 902 transformed it into the prosperous Muslim city of #italic Madīnat Mayūrqa#!. In 1229, King Jaume the Conqueror of Aragon led the great seaborne crusade that captured the island in a single campaign, and his son Jaume II was granted the new Kingdom of Majorca in 1276, a small but wealthy realm comprised of the Balearics, Roussillon, and Montpellier. In the early 14th century the Kingdom of Majorca under Jaume III still endured as an independent vassal of the Aragonese crown, its capital one of the foremost merchant ports of the western Mediterranean, its cathedral La Seu rising in golden sandstone above the harbor."
 girona_desc: "Set at the confluence of four rivers in the eastern Pyrenees, Girona was the Roman #italic Gerunda#! on the Via Augusta and has been a fortified city since antiquity. Its Carolingian counts ruled from the 9th century as the spearhead of the Spanish March against Muslim al-'Andalus. By the 13th century, the city had become one of the principal towns of the Catalan Principality, its bishopric one of the foremost in the Crown of Aragon and its Jewish quarter, the #italic Call#!, home to a flourishing community of scholars and physicians. In 1285 Girona was besieged by King Philip III of France during the Aragonese Crusade in support of the Sicilian Vespers, and its successful defense, capped by the destruction of the French fleet at Les Formigues, became one of the proudest moments of Catalan civic memory."
 pamplona_desc: "Founded by the Roman general Pompey as #italic Pompaelo#! during his campaign of 75 BC against Sertorius, Pamplona was the capital of the Basque-Romance kingdom of Navarre from the moment Íñigo Arista was acclaimed its first king in 824. The unusual urban form of three rival walled boroughs — the Navarrería of the original Basque inhabitants, the San Cernin borough of Frankish merchants, and the San Nicolás borough of later French settlers — made the city's politics famously fractious, the three communities even occasionally fighting each other within the walls. Under the Capetian house of Évreux that held the Navarrese crown starting from 1328, Pamplona served as the capital of the only Pyrenean kingdom to retain its independence between the rising powers of Castile and Aragon, its bishop and its merchants together defining a city whose identity was at once Basque, Romance, and Frankish."
 malaga_desc: "Settled in the 8th century BC by Phoenicians from Tyre as #italic Malaka#!, named for the fish-curing industry that still anchors its economy, Málaga has been one of the principal ports of the southern Iberian coast for almost three thousand years. Under the Caliphate of Córdoba and later the Nasrid emirs of Granada, the city blossomed as the maritime gateway of al-'Andalus, its harbor receiving the silks, slaves, and spices of the Maghrebi trade and its fertile #italic Axarquía#! hinterland producing the famous sweet wines and almonds shipped across the Mediterranean. The walled alcazaba on its harbor hill, raised by the Hammudid emirs in the 11th century and steadily extended, anchored a city whose Genoese merchant colony, tannery quarters, and rich market gardens together made Málaga the economic engine of the Nasrid realm."
 almeria_desc: "Founded in the early 10th century by 'Abd ar-Raḥmān III as the great maritime arsenal of the Caliphate of Córdoba, Almería rose to extraordinary prominence under its 11th-century taifa kings as one of the wealthiest cities of al-'Andalus, its silk weavers and bronze workers exporting fine goods to the Levant and the Maghreb and its shipyards launching the galleys that briefly contested control of the western Mediterranean with the Pisans and Genoese. The catastrophic Christian capture of the city by the combined fleets of Castile, Aragon, Genoa, and Pisa in 1147 under the Second Crusade shattered this golden age, and although it was retaken by Almohad arms ten years later the city never fully recovered. By the early 14th century, Almería had been incorporated into the Nasrid kingdom of Granada as its second city, the silk still flowing from its workshops echoing the prosperity of an earlier age."
 coimbra_desc: "Set on a steep hill above the Mondego where the river bends north toward the Atlantic, Coimbra began life as the Roman #italic Aeminium#! and later took the name of the older ruined town nearby, #italic Conimbriga#!. Reconquered from the Moors by Ferdinand the Great of León in 1064, it became the principal city of the new Christian county of Portugal, and under King Afonso Henriques and his successors it served from 1139 until 1255 as the capital of the newly independent Kingdom of Portugal, the place where the early Portuguese chronicles were written and where the chivalric romances of the realm took shape. Although King Afonso III moved the court to Lisbon, Coimbra retained a powerful cultural and ecclesiastical role, and the #italic Studium Generale#! established by King Dinis in 1290, moving repeatedly between Lisbon and Coimbra, made the city one of the foremost centers of learning in Iberia."
 braga_desc: "Established by the emperor Augustus as #italic Bracara Augusta#! and made the capital of the Roman province of Gallaecia, Braga is among the oldest Christian cities of Iberia, its bishopric established by the 3rd century and its claim to be the primatial see of all Hispania carrying the weight of unbroken apostolic tradition. The successive Visigothic, Suevic, and Moorish rulers each in turn confirmed the city's ecclesiastical preeminence, and after the Reconquista the archbishopric of Braga, restored in 1070, fought a centuries-long battle with Toledo for the primacy of the Iberian church. The great Romanesque cathedral begun in 1070 and steadily enlarged through the medieval centuries served as the seat of an archbishop who not only governed the spiritual affairs of northern Portugal, but also asserted metropolitan authority over the Galician and Asturian churches whenever the political moment allowed."
 evora_desc: "Founded in remote antiquity by the Celtic Lusitanians on a low hill in the great rolling plains of the southern Alentejo, Évora became the Roman #italic Ebora Liberalitas Iulia#!, where an ancient temple of Diana remained in the heart of the old city. The town was retaken from the Moors in 1166 by the legendary Geraldo Sem Pavor, Gerald the Fearless, in a daring night assault, and through the 12th and 13th centuries it grew into the principal city of Christian Alentejo, the seat of a bishopric and the headquarters of the military orders of the Knights of Avis and the Order of Calatrava in Portugal. By the early 14th century Évora was one of the most important cities of the Portuguese realm, its trademark 12th century Romanesque cathedral a prominent feature of the town that has become a favored royal residence of the House of Avis."
 merida_desc: "Founded by Augustus in 25 BC as a colony for veterans of the Cantabrian Wars and made the capital of the Roman province of #italic Lusitania#!, Mérida grew into one of the largest and most splendid cities of the western Roman empire, its theater, amphitheater, circus, aqueducts, and great bridge across the Guadiana setting a stamp on the landscape that endured eleven centuries of decline. Under the Visigoths, it remained an episcopal see of great importance, and after the Muslim conquest it became one of the principal cities in the western marches of the Caliphate. Retaken by Alfonso IX of León in 1230, Mérida was granted to the Order of Santiago, who established their headquarters there. Although the Roman ruins towered over what became a modest frontier town, the city remained a vital strongpoint in the Christian advance into Extremadura and a powerful seat of the great Castilian military order."
 tarragona_desc: "Founded by the Romans as the great provincial capital of #italic Tarraco#! after the Second Punic War, Tarragona rose to become one of the foremost cities of the western Roman empire, the seat of the proconsuls who governed Hispania Citerior, and one of the earliest Christian communities of Iberia. Sacked by Muslim invaders in 714, the city lay almost deserted for four centuries before its formal restoration in 1118, and the archbishopric of Tarragona was reestablished as the metropolitan see of the Catalan church and the foremost prelature of the Crown of Aragon, contesting jurisdiction over the Aragonese, Catalan, and Valencian churches with vigor. As the 14th century dawned, the great Romanesque-into-Gothic cathedral rose above the old Roman ramparts as the symbol of a city slowly recovering its ancient dignity."
 murcia_desc: "Established in 825 by the Umayyad emir 'Abd ar-Raḥmān II as #italic Mursiyya#! at the bend of the Segura where the great irrigated #italic huerta#! begins to open onto the coastal plain, Murcia rose under the taifa kings of the 11th century into the principal city of the southeastern al-'Andalus, a flourishing center of silk weaving, ceramic production, and the Arabic mathematical and astronomical learning taught by the school of Ibn al-Banna. The kingdom of Murcia accepted Castilian suzerainty in 1243 under the agreement of Alcaraz, and after a rebellion was crushed by Jaume I of Aragon in 1266, the city was decisively incorporated into the Castilian crown by Alfonso X the Wise. Resettled with Catalan and Aragonese colonists, Murcia by the early 14th century served as the primary frontier city of Castile against the Nasrid kingdom of Granada to the south."
 cadiz_desc: "Settled around 1100 BC by Phoenicians from Tyre as #italic Gadir#!, the Strong Place, on a long sandbar reaching out into the Atlantic from the southern Iberian coast, Cádiz is among the oldest continuously inhabited cities in western Europe, its harbor having welcomed Phoenician, Carthaginian, Roman, Visigoth, and Moorish fleets across three thousand years. The Romans called it #italic Gades#! and made it one of the wealthiest cities of their western empire, the home of poets, senators, and the celebrated dancing girls of the imperial period, but the long decline of late antiquity reduced it to a modest fishing town by the time the Moors held it. Captured by Alfonso X the Wise in 1262 and resettled as a Castilian frontier port, Cádiz in the early 14th century served as a major southern outlet of the Castilian realm, its Atlantic-facing harbor striving toward the wider ocean beyond."
 jaca_desc: "Situated in a high Pyrenean valley on the upper Aragón river where the pilgrim road from France descends from the Somport pass, Jaca was elevated by King Ramiro I into the first capital of the infant Kingdom of Aragon in the early 11th century. The Council of Jaca in 1063 confirmed its bishopric, and the celebrated #italic fuero#! granted by King Sancho Ramírez around 1077, one of the earliest and most influential municipal charters in Iberia, drew Frankish merchants and craftsmen to settle along the road to Santiago and served as a model copied by towns across Aragon and Navarre. Its impressive Romanesque cathedral of San Pedro, which started construction around the same time, is one of the oldest in Spain. Though the Aragonese court soon moved south to Huesca and then Zaragoza as the Reconquista advanced, Jaca by the early 14th century remained the proud northern gateway between Aragon and France, and a vital staging post on the pilgrim road."
 san_sebastian_desc: "Sheltered beneath the wooded height of Mount Urgull at a narrow point of the Bay of Biscay, San Sebastián formed around a monastery dedicated to the martyr Saint Sebastian. It received its town charter from King Sancho VI the Wise of Navarre around 1180, granting the landlocked Navarrese crown a coveted window onto the sea. When Castile annexed Gipuzkoa in 1200 under Alfonso VIII, the town passed to the Castilian crown, which confirmed its privileges and favored its Gascon-speaking burghers in the fisheries and the carrying trade. Its mariners ranged far in pursuit of whales, and its harbor sent Castilian iron and wool to Bordeaux and beyond, the returning ships laden with wine. By the early 14th century, San Sebastián was one of the most important ports on the Basque coast, a walled town that lived and thrived by the sea."
 perpignan_desc: "Appearing first in records from the 10th century, Perpignan sits on the plain of the Têt between the Pyrenees and the Mediterranean. The town rose to prominence as the chief settlement of the Counts of Roussillon, eventually passing with the county to the Crown of Aragon in 1172. When King Jaume I of Aragon divided his realms among his heirs, Perpignan became the continental capital of the new Kingdom of Majorca under Jaume II in 1276, who built the great Palace of the Kings of Majorca on the heights above the town. Enriched by its weavers and the celebrated cloth of Roussillon, and by the trade passing between Catalonia and France, the city flourished as a center of drapery and tanning. By the early 14th century, Perpignan stood as the mainland seat of the Majorcan kings, a prosperous market town whose looms clothed much of the western Mediterranean."
 alicante_desc: "Settled in antiquity beneath the steep crag of Benacantil, Alicante — the town the Greeks knew as #italic Ákra Leukḗ#!, the White Headland, and the Romans as #italic Lucentum#! — became the Muslim #italic Madīnat Laqant#!, a modest port on the Mediterranean coast guarded by hilltop fortress. Captured for Castile by the future Alfonso X in 1248, the town was seized by Jaume II of Aragon during a succession crisis in Castile in 1296 and incorporated into the Kingdom of Valencia in 1308, following the partition of the conquered lands at Torrellas. At the turn of the 14th century, Alicante served as a southern harbor of the Crown of Aragon, its castle crowning the rock of Benacantil above a port that shipped the wine, almonds, and esparto of its sun-baked hinterland around the world."
 cartagena_desc: "Founded around 227 BC by the Carthaginian general Hasdrubal as #italic Qart Ḥadašt#!, the city the Romans renamed #italic Carthago Nova#! upon one of the finest natural harbors of the Mediterranean. It grew rich on its silver mines and hosted a great naval arsenal, famously stormed by Scipio Africanus in 209 BC during the war against Carthage. Its bishopric was among the oldest in Hispania, but the long centuries of decline and the Muslim conquest reduced the once-great port to a shadow of its ancient self. Retaken for Castile by the infante Alfonso in 1245 and granted its restored see, Cartagena by the early 14th century was a modest, but strategically vital harbor on the frontier of the Castilian realm, its magnificent bay still sheltering the fleets that plied the southern coast."
 algeciras_desc: "Founded in 711 by the Berber commander Ṭāriq ibn Ziyād at the very point where the Muslim conquerors first set foot in Iberia, #italic Al-Jazīra al-Ḵaḍrā'#!, the Green Island, took its name from the islet sheltering its harbor on the western shore of the strait. Across six centuries it served as the principal landing place for armies and merchants crossing from the Maghreb, the indispensable bridgehead binding al-'Andalus to North Africa. Held in turn by the Umayyads, the taifa of its own name, the Almoravids, and the Almohads, the city in the early 14th century anchored the Marinid foothold in Iberia, its fortified double harbor the chief gateway through which the soldiers and gold of Africa poured into the contested lands about the strait."
 gibraltar_desc: "Crowned by the great limestone rock that bears his name, #italic Jabal Ṭāriq#!, the Mountain of Ṭāriq, marks the spot where Ṭāriq ibn Ziyād landed his army in 711 to begin the conquest of Iberia. For centuries little more than a watchpost above the strait, the rock was fortified in 1160 by the Almohad caliph 'Abd al-Mu'min, who raised a walled town and citadel he named #italic Madīnat al-Fatḥ#!, the City of Victory, to command the narrows. Briefly seized by Castile in 1309 and recovered for Islam soon after, Gibraltar by the early 14th century stood as a fiercely contested Marinid stronghold, its towering crag dominating the gateway between two seas and two continents."
 marbella_desc: "Spread along a fertile coastal plain beneath the mountains of the Serranía, Marbella grew from a Roman settlement into the Muslim town of #italic Marballa#!, its walled alcazaba guarding a shore rich in vines, figs, and the produce of a gentle climate. A modest but prosperous port on the southern coast, it shipped the fruit and silk of its hinterland and drew its living from the fisheries of the warm Mediterranean. By the early 14th century, Marbella formed part of the Nasrid kingdom of Granada, one of the string of fortified coastal towns that guarded the seaward flank of the last Muslim realm in Iberia."
 fez_desc: "Founded by the Idrisid dynasty around 800 and sitting on both banks of the river that bears its name, Fez grew swiftly through the settlement of Andalusi refugees from Córdoba and Arab families from Kairouan, whose two quarters gave the city its enduring character. The great mosque and university of the #italic Qarawiyyīn#!, endowed in 859 by Fāṭima al-Fihrī, made Fez one of the foremost centers of learning in the Islamic world, attracting scholars of law, theology, and the sciences from across the Mediterranean. When the Marinids supplanted the Almohads, they made Fez their capital and raised beside the old city the royal quarter of #italic Fās al-Jadīd#! in 1276, with its palaces, gardens, and congregational mosque. As the 14th century began, Fez stood at the height of its glory, the political and intellectual heart of the Marinid sultanate."
 marrakesh_desc: "Founded in 1070 by the Almoravid commander Abū Bakr ibn 'Umar at the edge of the great Haouz plain beneath the snow-capped peaks of the High Atlas, Marrakesh evolved with astonishing speed from a desert camp into the imperial capital of a realm stretching from the Senegal to the Ebro. Under the Almoravids and then the Almohads who seized it in 1147, the city was adorned with palaces, gardens, and the soaring minaret of the Koutoubia mosque, its waters carried from the mountains by the ingenious underground #italic khettara#! channels. It lent its name, in the mouths of European travelers, to the whole kingdom of Morocco. Though the Marinids moved their seat north to Fez, Marrakesh by the early 14th century remained the great southern capital, the gateway between the Atlas, the Sous, and the caravan roads to the desert."
 sijilmasa_desc: "Founded in 757 in the date-palm oasis of the Tafilalt at the northern edge of the Sahara, Sijilmasa became the great northern terminus of the trans-Saharan caravan trade, the place where the gold of Ghana and Mali, carried across the desert by Berber camel caravans, was exchanged for the salt, cloth, and manufactured goods of the Mediterranean world. For centuries its mint struck the gold dinars that lubricated the commerce of the whole western Islamic world, and its merchants grew fabulously wealthy as middlemen between two continents. Independent under its own dynasties before falling to the Almoravids who first rose nearby, Sijilmasa by the early 14th century was still the indispensable desert gateway of the Marinid realm, though the slow shifting of the caravan routes had started to threaten its ancient prosperity."
 rabat_desc: "Raised by the Almohad caliph 'Abd al-Mu'min in the mid-12th century as a fortified #italic ribāṭ#! guarding the mouth of the Bou Regreg, the camp took on grand ambitions under his grandson Ya'qūb al-Manṣūr, who after his victory at Alarcos in 1195 named it #italic Ribāṭ al-Fatḥ#!, the Camp of Victory, and resolved to make it the capital of a vast empire. He began an immense congregational mosque whose great minaret, the Hassan Tower, was left unfinished at his death, standing ever after as a monument to a dream cut short. With the decline of Almohad power the grandiose city largely emptied, and by the early 14th century Rabat was a much-diminished town beside its mighty unfinished walls, watching the Atlantic at the river's mouth opposite its older neighbor Salé."
 sale_desc: "Set on the northern bank of the Bou Regreg where the river meets the Atlantic, Salé was one of the foremost ports of medieval Morocco, its merchants trading the grain, wool, leather, and wax of the interior with the Christian cities of Iberia and Italy and with the markets of the Mediterranean. The town suffered a devastating sack by a Castilian fleet in 1260, after which the Marinid sultans rebuilt and fortified it, adorning it with a fine congregational mosque and a celebrated madrasa. At the beginning of the 14th century, Salé stood as a wealthy and cultured trading city, its harbor crowded with the shipping of two seas and its scholars and jurists lending it a reputation for learning to rival the great inland cities."
 ceuta_desc: "Commanding the African shore of the strait where two seas and two continents very nearly meet, Ceuta, the Arabic #italic Sabta#!, has been since antiquity one of the most coveted harbors of the western Mediterranean, its sheltered roadstead the natural crossing point between the Maghreb and al-'Andalus. A great entrepôt of trade, its workshops famed for fine brassware and its copyists for beautiful manuscripts, the city handled the gold and goods passing between Africa and Europe and long preserved a jealous autonomy under its merchant notables, the Banū al-'Azafī. Contested between the Marinids and the Nasrids of Granada, Ceuta by the early 14th century was still a glittering prize, its prosperity and its position together making it the key to the strait."
 tangier_desc: "Guarding the western mouth of the strait where the Mediterranean opens onto the Atlantic, Tangier is among the most ancient cities of Morocco, the Phoenician trading post and Roman #italic Tingis#! that gave its name to the province of Mauretania Tingitana. Across the centuries its strategic harbor passed through Vandal, Byzantine, Umayyad, Almoravid, and Almohad hands, each prizing the city as the gateway between Africa and Europe. By the early 14th century Tangier was a Marinid port of modest size but enduring importance, its position at the very corner of the continent ensuring it could not be ignored by any power contesting the strait."
 taza_desc: "Set astride the narrow corridor between the Rif mountains and the Middle Atlas, the gap that forms the only easy passage between eastern and western Morocco, Taza has long been a fortress city of the first strategic importance. It was here that the Almohad leader 'Abd al-Mu'min established his power in the 1130s before sweeping on to conquer Marrakesh, and the city's great mosque dates from those years. The Marinids in turn made Taza one of their earliest conquests and a key stronghold guarding the road to Fez. By the early 14th century the walled town commanded the vital eastern gateway of the Marinid realm, a perennial key to the control of all Morocco."
 meknes_desc: "Founded in the 10th century by the Meknassa Berbers who gave the city its name, and fortified by the Almoravids as a stronghold on the fertile plain north of the Middle Atlas, Meknes developed amid orchards, olive groves, and grainfields into a prosperous market town. Though it always stood in the shadow of nearby Fez, the Marinids favored it with mosques and a fine madrasa, and its agricultural wealth and abundant waters made it a granary of the realm. By the early 14th century Meknes was a thriving provincial town of gardens and markets, its strategic position and rich hinterland marking it for a greater future."
 taroudant_desc: "Set in the fertile valley of the Sous between the High Atlas and the Anti-Atlas, Taroudant has long been the chief town of the rich agricultural lands of the south, watered by the river and famed for its grain, its olives, its sugar cane, and the produce of its gardens. Taken by the Almoravids in 1056 as one of their earliest conquests on the road to power, the walled city served thereafter as the capital and market of the whole Sous region, gathering the produce of the valley and the goods carried up from the desert oases. By the early 14th century Taroudant remained the prosperous heart of the south, a walled town of orchards and markets at the crossroads of mountain, plain, and desert."
 aghmat_desc: "Nestled in the foothills of the High Atlas, Aghmat was the principal town of the Haouz region long before Marrakesh existed, a flourishing market where the goods of the mountains, the plains, and the trans-Saharan caravans were exchanged. It served as the early base of the Almoravids before they founded their new capital nearby, and it was here that the deposed poet-king al-Mu'tamid of Seville lived out his last years in exile and died in 1095, his tomb becoming a place of melancholy pilgrimage. Eclipsed by the rise of Marrakesh, Aghmat by the early 14th century had dwindled to a modest town, its glory remembered chiefly in the verses of the captive king who died within its walls."
 tinmel_desc: "High in a remote valley of the High Atlas, the mountain stronghold of Tinmel was the cradle of the Almohad movement, the place where the Mahdi Ibn Tumart, preacher of the doctrine of divine unity, gathered his Berber followers in the early 12th century and launched the revolution that would overthrow the Almoravids and conquer all the Maghreb and al-'Andalus. His tomb and the great fortified mosque raised beside it made Tinmel the spiritual capital and dynastic sanctuary of the Almohad caliphs, a holy place guarded among the peaks. By the early 14th century, with the Almohads long fallen, Tinmel was a venerated but secluded shrine, its mosque standing as the monument to an empire born among these mountains."
 volubilis_desc: "Spread across a fertile plateau in the hills near the later city of Meknes, Volubilis was the Roman #italic Walīlī#!, a western capital of the province of Mauretania Tingitana and a wealthy provincial city of triumphal arches, basilicas, oil presses, and fine mosaics at the very edge of the Roman world. Though the legions withdrew in late antiquity, the town endured under its Berber inhabitants, and it was nearby that Idrīs ibn 'Abdallāh took refuge in 788 and was acclaimed the founder of the first Muslim dynasty of Morocco. As the 14th century begins, the once-great Roman city is a field of crumbling ruins beside a modest settlement, its toppled columns a reminder of the empires that have risen and fallen upon this ground."
 anfa_desc: "Set on a low rise above a wide bay on the Atlantic coast, Anfa was a Berber port town that lived by fishing, by farming the fertile Chaouia plain behind it, and by the seaborne trade of the western coast. Long jealous of its independence from the great inland dynasties, the town earned among its neighbors a reputation as a nest of bold seafarers and corsairs who preyed on the shipping of the coast. In the early 14th century, Anfa was a small but spirited Atlantic harbor on the fringe of the Marinid realm, its mariners ranging the ocean coast in pursuit of fish and plunder alike."
 azemmour_desc: "Situated on a bluff above the mouth of the great Oum Er-Rbia river where it pours into the Atlantic, Azemmour is an ancient port town that lives by the sea and the river, famed above all for the shad that run up its waters in vast shoals each spring. Its harbor handled the grain and wool of the rich Doukkala plain behind it, traded with the merchants of Iberia and the Mediterranean. By the early 14th century Azemmour was a prosperous walled port of fishermen and traders on the Atlantic shore of Morocco, its fortunes rising and falling with the river that gave it life."
 asfi_desc: "Sheltered in a bay on the Atlantic coast below low cliffs, Asfi was an old fishing and trading port that gathered the grain, wool, and produce of the 'Abda plain behind it for export across the western seas. Its harbor drew the merchants of Genoa, Catalonia, and Portugal who sought the goods of southern Morocco, and its fishermen worked the rich Atlantic waters offshore. As the 14th century started, Asfi was as one of the principal Atlantic outlets of the Marinid south, a modest but busy harbor where the produce of the interior mingled with the ships of the Christian trading cities."
 asilah_desc: "Set on the Atlantic coast a little south of the strait, Asilah was among the oldest ports of Morocco, the Phoenician and Carthaginian trading station the ancients knew as #italic Zilis#! and the Romans counted among the harbors of Mauretania Tingitana. Across the centuries its walls and quays passed through many hands, and its position on the ocean coast near the gateway of the strait kept it a place of trade and contention. By the early 14th century Asilah was a fortified Marinid port of modest size, its harbor handling the coastal trade of the Atlantic seaboard and its walls guarding against the fleets that prowled the contested waters."
 larache_desc: "Set where the river Loukkos meets the Atlantic, Larache was settled near the ruins of the ancient Phoenician colony of #italic Lixus#!: one of the oldest trading posts on the ocean coast, which legend placed among the gardens of the Hesperides. The town lived by fishing the river and the sea, by the salt of its marshes, and by the trade in grain and goods passing through its harbor. By the early 14th century Larache was a small but useful Atlantic port of the Marinid realm, its sheltered river mouth offering a haven on a coast otherwise open to the full force of the ocean."
 tetouan_desc: "Set in a fertile valley below the Rif mountains a short way inland from the Mediterranean, Tetouan was refounded and fortified by the Marinid prince Abū Ṯābit around 1286 as a military base from which to press the siege of nearby Ceuta. Its position behind a sheltering river mouth, with the mountains at its back and the sea before it, made it at once a natural stronghold and a gathering place for trade between the Rif and the coast. By the early 14th century Tetouan was a walled Marinid town of growing importance, guarding the Mediterranean approaches and the mountain roads of northern Morocco."
