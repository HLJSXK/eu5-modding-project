 request_circle_privilege_effect_text: "[SCOPE.sCountry('actor').GetName] request a Circle Privilege from the Emperor."
 request_circle_privilege_effect_text_past: "[SCOPE.sCountry('actor').GetName] requested a Circle Privilege from the Emperor."
