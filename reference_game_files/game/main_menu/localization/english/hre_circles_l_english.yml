 hre_circle_levy_request: "Request Circle Levies"
 hre_circle_levy_request_desc: "Request that the Imperial Circles raise levies for the Empire. Circle leaders are rewarded for their cooperation."
 hre_enforce_circle_landfriede: "Enforce Circle Landfriede"
 hre_enforce_circle_landfriede_desc: "Empower Circle Leaders to enforce the Imperial peace within their territories."
 HRE_CIRCLE_LEVY_CIRCLES_ACTIVE: "Imperial Circles are active"

 IMPERIAL_CIRCLES_EVENTS_FLAVOR: "Imperial Circles"

 imperial_circles.1.title: "The Imperial Circles Are Established"
 imperial_circles.1.desc: "The formation period has concluded. The Imperial Circles have been locked in place and their leaders will govern the Empire's affairs. A new chapter begins for the Holy Roman Empire."
 imperial_circles.1.a: "For the glory of the Empire!"

 imperial_circles.2.title: "Missing Funds"
 imperial_circles.2.desc: "In the recent Imperial Diet, our Circle has supported the proposed reform of the Imperial Constitution. This support has come with the common understanding among members of our circle that we, as the leader of the Circle, would distribute funds between them. Justified or not, our failure to act upon these expectations has lead to several complaints about our abuse of power, withholding funds intended for the circles members. If we do not act upon these complaints, this could seriously harm our leadership in the future."
 imperial_circles.2.a: "They are right, we should distribute it now."
 imperial_circles.2.b: "They are mistaken, no such bribery existed."
 imperial_circles.2.c: "Appeal to our friends in [GetUniqueInternationalOrganization('hre').GetLeaderCountry.GetNameWithNoTooltip]."

 imperial_circles.11.title: "Discontent in the Circle"
 imperial_circles.11.desc: "Our circle members are growing restless. If we do not act soon, our authority as Circle Leader may be openly challenged."
 imperial_circles.11.a: "Distribute emergency funds to ease tensions."
 imperial_circles.11.b: "Let them complain — we have larger concerns."

 imperial_circles.12.title: "The Princes Demand Change"
 imperial_circles.12.desc: "The frustration within the circle has reached a breaking point. Our members are openly questioning our leadership. An election may be imminent."
 imperial_circles.12.a: "We must act before it is too late."

 imperial_circles.20.title: "Our Vote Has Been Bought"
 imperial_circles.20.desc: "[SCOPE.sCountry('actor').GetName] has paid the leader of our Imperial Circle, [SCOPE.sCountry('target').GetName], to back the proposal currently before the Imperial Diet. We have received [SCOPE.GetValue('received_bribe')|0V]@gold! as our share, and our [vote|e] in the active resolution is now locked behind the Emperor's pick until it closes."
 imperial_circles.20.a: "The gold will not be refused."

 imperial_circles.50.title: "Challenge for Circle Leadership"
 imperial_circles.50.desc: "We have come forward to challenge [recipient.GetName] for the leadership of our Imperial Circle.\n\nTheir weakness and negligence can no longer be tolerated, and there are many that would surely stand behind us in our complains. If we manage to present ourselves as a clear better and stronger leader, they will fold to our demands, but failing to do so will undoubtedly hurt how we are perceived not only by foreign countries but by our people too."
 imperial_circles.50.a: "Press the challenge."
 imperial_circles.50.b: "Withdraw the challenge."
 imperial_circles.53.title: "Challenge Defeated"
 imperial_circles.53.desc: "Our challenge against [recipient.GetName] for leadership of our Imperial Circle has failed. Our prestige did not measure up against theirs, and our standing has suffered for the attempt. We must wait before pressing the matter again."
 imperial_circles.53.a: "We will bide our time."

 imperial_circles.51.title: "Deposed as Circle Leader"
 imperial_circles.51.desc: "A rival has successfully challenged our leadership. We have been stripped of the Circle Leader title and must rebuild our standing within the circle."
 imperial_circles.51.a: "This humiliation will not be forgotten."

 imperial_circles.52.title: "Circle Leadership Upheld"
 imperial_circles.52.desc: "A challenger tried to unseat us but their prestige proved insufficient. Our position as Circle Leader remains secure."
 imperial_circles.52.a: "Our authority is not so easily broken."

 imperial_circles.70.title: "Elected as Circle Leader"
 imperial_circles.70.desc: "With the previous leader no longer among our ranks, the circle has looked to us to assume leadership. We are now the Circle Leader."
 imperial_circles.70.a: "We shall lead the circle with distinction."

 imperial_circles.71.title: "The Circle Lacks a Leader"
 imperial_circles.71.desc: "One of the Imperial Circles has been left without a qualified candidate to assume leadership. The Emperor's authority is undermined when circles go ungoverned."
 imperial_circles.71.a: "We must appoint someone ourselves."

 imperial_circles.80.title: "The Imperial Crown Changes Everything"
 imperial_circles.80.desc: "We now wear the Imperial Crown. As Emperor, we cannot simultaneously hold the role of Circle Leader — the two offices demand undivided loyalty. We relinquish our circle leadership so another may step forward."
 imperial_circles.80.a: "The Empire must come first."
