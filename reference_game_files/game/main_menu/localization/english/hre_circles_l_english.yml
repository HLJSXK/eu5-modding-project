 request_circle_privilege_reject_effect_text_past: "[SCOPE.sCountry('recipient').GetName] denied [SCOPE.sCountry('actor').GetName]'s request for a Circle Privilege."
 request_circle_privilege_members_tt: "Each member of our [imperial_circle|e] gains [ShowModifier('granted_circle_privilege')] for 5 years."

 distribute_imperial_grant: "Distribute Imperial Grant"
 distribute_imperial_grant_desc: "Distribute gold from your treasury to your circle members, improving relations and circle satisfaction."
 distribute_imperial_grant_act: "Distribute gold to your circle members."
 distribute_imperial_grant_tt: "We spend [SCOPE.GetValue('total_grant')|2V]@gold! (20% of our [economical_base|e]), distributed equally among non-leader members of our [imperial_circle|e]. Each recipient gains [ShowModifier('received_imperial_circle_grant')] for 2 years and [ShowBiasValue('opinion_received_imperial_grant')|+=2] [opinion|e] of us."
 distribute_imperial_grant_effect_text: "[SCOPE.sCountry('actor').GetName] distribute an Imperial Grant to their circle."
 distribute_imperial_grant_effect_text_past: "[SCOPE.sCountry('actor').GetName] distributed an Imperial Grant to their circle."

 demand_circle_loyalty: "Demand Circle Loyalty"
 demand_circle_loyalty_desc: "Assert our authority over our circle members. We gain prestige and diplomatic standing for 3 years, but members resent the imposition and the circle's satisfaction drops."
 demand_circle_loyalty_act: "Assert your authority over your circle members."
 demand_circle_loyalty_tt: "We gain [ShowModifier('imposed_circle_authority')] for 3 years. Each non-leader member of our [imperial_circle|e] gains [ShowModifier('pressured_circle_loyalty')] for 3 years and [ShowBiasValue('opinion_demanded_loyalty')|+=2] [opinion|e] of us. The Circle's satisfaction drops by 5."
 demand_circle_loyalty_effect_text: "[SCOPE.sCountry('actor').GetName] demand loyalty from their circle."
 demand_circle_loyalty_effect_text_past: "[SCOPE.sCountry('actor').GetName] demanded loyalty from their circle."

 reform_coinage_in_circle: "Reform Circle Coinage"
 reform_coinage_in_circle_desc: "The Empire has placed authority over the regional coinage into our hands. Implementing a reform of our coin and its usage would help the economic flow of every member in our circle, while also increasing our own standing within the Circle. Unfortunately this would come at the cost of our own mints capabilities."
 reform_coinage_in_circle_act: "Reform the Coinage within our Circle."
 reform_coinage_in_circle_tt: "We will gain [ShowModifier('reformed_circle_coinage_leader')], while every member of our circle will gain [ShowModifier('reformed_circle_coinage_member')] for 5 years. Every circle member will gain [ShowBiasValue('opinion_reformed_circle_coinage')|+=2] [opinion|e] of us, and we will increase the Circle Satisfaction by 5."
 reform_coinage_in_circle_effect_text: "[SCOPE.sCountry('actor').GetName] reform the coinage of their Circle."
 reform_coinage_in_circle_text_past: "[SCOPE.sCountry('actor').GetName] reformed the coinage of their Circle."

 reduction_of_circle_titles: "Reduction of Circle Titles"
 reduction_of_circle_titles_desc: "Our circle has grown inefficient and entangled in titles and administrative positions which are able to block each other. Performing a reduction of the titles would not only ensure the efficiency of our circle, but also solidify our position as leader. Such centralization of titles would not be well received by our circle members, and would lower their satisfaction."
 reduction_of_circle_titles_act: "Perform a Reduction of Circle Titles"
 reduction_of_circle_titles_tt: "We will gain [ShowModifier('reduction_of_circle_titles')], while every circle member will gain [ShowBiasValue('opinion_reduction_of_circle_titles')|+=2] [opinion|e] of us. The Circle Satisfaction will be reduced by 5."
 reduction_of_circle_titles_effect_text: "[SCOPE.sCountry('actor').GetName] perform a reduction of circle titles"
 reduction_of_circle_titles_text_past: "[SCOPE.sCountry('actor').GetName] performed a reduction of circle titles"

 challenge_circle_leadership: "Challenge Circle Leadership"
 challenge_circle_leadership_desc: "Our current Circle leaders have proven themselves to be unworthy of the position and the responsibility. We have the opportunity to put their power into question and undermine their authority, which can lead to their hold weaken even more, or to open opposition directly."
 challenge_circle_leadership_act: "Challenge the current Circle Leader's authority."
 challenge_circle_leadership_effect_text: "[SCOPE.sCountry('actor').GetName] challenge for Circle Leadership."
 challenge_circle_leadership_effect_text_past: "[SCOPE.sCountry('actor').GetName] challenged for Circle Leadership."
 challenge_circle_leadership_tt: "We win the challenge in any of the following cases:\n  • Our circle's satisfaction is below 15 — open revolt\n  • Our circle's satisfaction is below 30 and our prestige is at least as high as theirs\n  • Our prestige exceeds theirs by 25 or more\n\nLosing or withdrawing costs prestige. A newly installed leader is immune to challenges for 2 years."

