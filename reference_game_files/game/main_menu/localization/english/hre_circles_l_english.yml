 bribe_imperial_circle: "Bribe Imperial Circle"
 bribe_imperial_circle_desc: "Pay an Imperial Circle Leader and every member of their circle to vote for our proposal at the Imperial Diet. The Circle Leader receives the full base bribe, and every other member receives 25% of that amount. Every member's vote is locked behind the Emperor's pick until the resolution closes."
 bribe_imperial_circle_act: "Bribe [SCOPE.sCountry('target').GetName] to back our Diet proposal."
 bribe_imperial_circle_effect_text: "[SCOPE.sCountry('actor').GetName] bribe [SCOPE.sCountry('target').GetName]'s circle to back the imperial proposal."
 bribe_imperial_circle_effect_text_past: "[SCOPE.sCountry('actor').GetName] bribed [SCOPE.sCountry('target').GetName]'s circle to back the imperial proposal."
 bribe_imperial_circle_members_tt: "Each other member of [SCOPE.sCountry('target').GetName]'s circle receives [SCOPE.GetValue('bribe_member_share')|0V]@gold! and has their [vote|e] in the active Imperial Diet proposal locked to the Emperor's pick."
 BRIBE_IMPERIAL_CIRCLE_CTRL_HINT: "Bribe the entire [imperial_circle|E]"

 approve_imperial_circle_proposal: "Approve Proposal"
 approve_imperial_circle_proposal_desc: "As Circle Leader, lock every member of this circle (including ourselves) into voting for the proposal currently before the Imperial Diet. No payment is required, but the lock holds until the resolution closes."
 approve_imperial_circle_proposal_act: "Whip [SCOPE.sImperialCircle('target').GetName] to vote for the proposal."
 approve_imperial_circle_proposal_effect_text: "[SCOPE.sCountry('actor').GetName] whip [SCOPE.sImperialCircle('target').GetName] to vote for the imperial proposal."
 approve_imperial_circle_proposal_effect_text_past: "[SCOPE.sCountry('actor').GetName] whipped [SCOPE.sImperialCircle('target').GetName] to vote for the imperial proposal."
 approve_imperial_circle_proposal_members_tt: "Every member of [SCOPE.sImperialCircle('target').GetName] has their [vote|e] in the active Imperial Diet proposal locked to the proposed policy."

 oppose_imperial_circle_proposal: "Oppose Proposal"
 oppose_imperial_circle_proposal_desc: "As Circle Leader, lock every member of this circle (including ourselves) into voting against the proposal currently before the Imperial Diet. Votes are locked to the current policy if one is on file, otherwise the circle abstains."
 oppose_imperial_circle_proposal_act: "Whip [SCOPE.sImperialCircle('target').GetName] to vote against the proposal."
 oppose_imperial_circle_proposal_effect_text: "[SCOPE.sCountry('actor').GetName] whip [SCOPE.sImperialCircle('target').GetName] to vote against the imperial proposal."
 oppose_imperial_circle_proposal_effect_text_past: "[SCOPE.sCountry('actor').GetName] whipped [SCOPE.sImperialCircle('target').GetName] to vote against the imperial proposal."
 oppose_imperial_circle_proposal_members_tt: "Every member of [SCOPE.sImperialCircle('target').GetName] has their [vote|e] in the active Imperial Diet proposal locked to the current policy, or to abstention if no current policy is on file."

 call_imperial_circle_to_war: "Call Circle to War"
 call_imperial_circle_to_war_desc: "Call upon a Circle Leader to bring their circle's military support to your current war."
 call_imperial_circle_to_war_act: "Call [SCOPE.sCountry('recipient').GetName]'s circle to join the war."
 call_imperial_circle_to_war_effect_text: "[SCOPE.sCountry('actor').GetName] call [SCOPE.sCountry('recipient').GetName]'s circle to war."
