 steppe_group: "Steppe Group"
 steppe_group_desc: "The $steppe_group$ is formed by various cultures belonging to the $mongolian_group$ and $tatar_group$ that live in the steppes of Eurasia."
 rhaetian_group: "Rhaetian"
 rhaetian_group_desc: "The $rhaetian_group$ people are an ethnolinguistic group composed of three primary Alpine communities: the Romansh, Ladins, and Friulians. While they do not share a single political entity, they are unified by their descent from a common Vulgar Latin substrate mixed with ancient Rhaetian and Celtic influences."
 hmong_mien_group: "Hmong-Mien"
 hmong_mien_group_desc: "The Hmong-Mien peoples inhabit the highlands of southern China and Southeast Asia, speaking languages of the independent Hmong-Mien family unrelated to any of their neighbors. Known for their vibrant textile traditions and fierce independence, they have historically resisted assimilation into the lowland empires surrounding them."
 papuan_group: "Papuan"
 papuan_group_desc: "The Papuan peoples are the indigenous inhabitants of New Guinea and neighboring islands, speaking hundreds of languages from diverse and largely unrelated language families collectively known as Papuan. Their remarkable linguistic and cultural diversity reflects thousands of years of isolated development across the island's rugged terrain."
 atlantic_group: "Atlantic"
 atlantic_group_desc: "The Atlantic peoples of West Africa inhabit the coasts and savannas from Senegambia to Sierra Leone, speaking languages of the Atlantic branch of the Niger-Congo family. They include the great horsemen and traders of the Senegambian coast as well as the forest-dwelling Mel peoples of the Sierra Leone hinterland."
 kru_group: "Kru"
 kru_group_desc: "The Kru peoples of the Liberian and Ivorian coasts speak languages of the Kru branch of Niger-Congo and are renowned for their maritime skill and fierce resistance to enslavement. Their seafaring traditions made them valued sailors along the West African coast for centuries."
 kwa_group: "Kwa"
 kwa_group_desc: "The Kwa peoples of the Gold Coast and the Bight of Benin speak languages of the Kwa branch of Niger-Congo, encompassing the Akan states of the interior and the coastal Ewe and Fon kingdoms. Their societies are marked by matrilineal inheritance among the Akan and the powerful Vodun religious tradition among the Fon and Ewe."
 volta_niger_group: "Volta-Niger"
 volta_niger_group_desc: "The Volta-Niger peoples of the Nigerian region speak languages of the Volta-Niger branch of Niger-Congo and include some of the most populous and politically sophisticated societies in West Africa. The Yoruba city-states, the Igbo village republics, and the Benin Kingdom are among the most accomplished polities on the continent."
 bantu_group: "Bantu"
 bantu_group_desc: "The Bantu peoples form the largest linguistic grouping in sub-Saharan Africa, their expansion from a homeland near the Cameroon-Nigeria border carrying Bantu languages and agricultural practices across central, eastern, and southern Africa over three millennia. Today Bantu-speaking peoples inhabit almost the entire southern half of the continent."
 central_african_group: "Central African"
 central_african_group_desc: "The peoples of Central Africa inhabit the vast Congo Basin and surrounding highlands, speaking languages of the Adamawa, Ubangian, and related families. Their cultures are as diverse as the rainforests, savannas, and rivers they call home, ranging from the forest-dwelling Baka to the river traders of the great Congo tributaries."
 nilotic_group: "Nilotic"
 nilotic_group_desc: "The Nilotic peoples are the pastoralist and semi-pastoralist communities of the Nile Valley and the East African plains, speaking languages of the Nilotic branch of Nilo-Saharan. From the cattle-herding Maasai of the Rift Valley to the fishermen of the Sudd, they are united by age-grade social structures and a deep dependence on livestock."
 nilosahelian_group: "Nilo-Saharan"
 nilosahelian_group_desc: "The Nilo-Saharan peoples inhabit a broad belt stretching from the Sahara to the Ethiopian highlands, speaking languages of the diverse Nilo-Saharan family. They include the farmers of the Nuba Mountains, the merchants of the Darfur sultanates, and the nomads of the Saharan fringe."
 cushitic_group: "Cushitic"
 cushitic_group_desc: "The Cushitic peoples of the Horn of Africa and the Nile Valley speak languages of the Cushitic branch of the Afro-Asiatic family. They encompass the camel nomads of Somalia and the Ogaden, the highland farmers of the Ethiopian Rift Valley, and the ancient Beja of the Red Sea coast."
 khoisan_group: "Khoisan"
 khoisan_group_desc: "The Khoisan peoples of southern and eastern Africa are among the oldest surviving populations on Earth, speaking languages distinguished by their remarkable click consonants. They include the San hunter-gatherers of the Kalahari and the Khoikhoi herders of the Cape, peoples who inhabited southern Africa long before the Bantu expansion."
 permic_group: "Permic"
 permic_group_desc: "The Permic peoples of the Ural Mountains region speak languages of the Permic branch of the Uralic family, closely related to Finnish and Estonian. The Komi and Udmurt peoples have long inhabited the forests between the Volga and the Urals, trading furs with their Slavic and Tatar neighbors."
 mordvinic_group: "Mordvinic"
 mordvinic_group_desc: "The Mordvinic peoples of the middle Volga region speak languages of the Mordvinic branch of the Uralic family, forming one of the largest indigenous groups of European Russia. The Moksha and Erzya are closely related but speak distinct languages and maintain separate cultural identities."
 pama_nyungan_group: "Pama-Nyungan"
 pama_nyungan_group_desc: "The Pama-Nyungan peoples inhabit the vast majority of the Australian continent, speaking languages of the Pama-Nyungan family which covers roughly eighty percent of Australia's land area. Despite the enormous diversity within this family, these peoples share broad cultural patterns including complex kinship systems, the Dreaming cosmology, and hunter-gatherer subsistence."
 australian_group: "Australian Aboriginal"
 australian_group_desc: "The Aboriginal peoples of Australia are among the oldest continuous cultures on Earth, having inhabited the continent for at least sixty-five thousand years. Their deep connection to the land, expressed through the concept of the Dreaming, and their sophisticated ecological knowledge make them unique among the world's peoples."
 east_african_coast_group: "Swahili Coast"
 east_african_coast_group_desc: "The peoples of the Swahili Coast have developed a distinctive maritime civilization along the Indian Ocean shore of East Africa, blending Bantu agricultural traditions with the mercantile culture of Arab and Persian traders. Their coral-stone city-states from Mogadishu to Kilwa formed the African terminus of the great Indian Ocean trade network."
 great_lakes_kingdoms_group: "Great Lakes Kingdoms"
 great_lakes_kingdoms_group_desc: "The peoples of the African Great Lakes region have developed some of the most sophisticated state structures in sub-Saharan Africa, with hierarchical kingdoms centered on cattle wealth and hereditary kingship. From the Buganda kingdom on the northern shore of Lake Victoria to the terraced hills of Rwanda, these interlacustrine societies share a common political culture of tribute, royal courts, and clan organization."
 east_african_nomad_group: "East African Pastoralist"
 east_african_nomad_group_desc: "The pastoralist peoples of East Africa range across the great savannas and semi-arid plains from the Ethiopian highlands to the Tanzanian steppe, herding cattle, camels, and goats between seasonal pastures. Organized through age-grade warrior systems and lacking permanent territorial states, they form a cross-linguistic cultural world spanning Nilotic, Cushitic, and other language families."
 nguni_group: "Nguni"
 nguni_group_desc: "The Nguni peoples of southeastern Africa speak a cluster of closely related Bantu languages distinguished by their rich system of click consonants borrowed from neighboring Khoisan peoples. Organized around cattle wealth, age-grade systems, and powerful chieftaincies, the Nguni gave rise to the great Zulu and Xhosa nations that dominated the eastern coast of southern Africa."
 sotho_tswana_group: "Sotho-Tswana"
 sotho_tswana_group_desc: "The Sotho-Tswana peoples of the southern African highveld speak the closely related Sotho and Tswana languages and share a common heritage of nucleated village life, cattle-based wealth, and sophisticated iron-working traditions. Their large towns on the dry plateau interior were among the most populous settlements in pre-colonial southern Africa."
 shona_group: "Shona"
 shona_group_desc: "The Shona-speaking peoples of the Zimbabwe plateau and the Limpopo valley built one of Africa's most remarkable pre-colonial civilizations, centered on the great stone enclosures of Great Zimbabwe and its successor states. Their control of the gold trade routes to the Indian Ocean coast made them a commercial power whose wealth reached as far as China and Persia."
 kongo_group: "Kongo"
 kongo_group_desc: "The Kongo peoples of the lower Congo River basin and the Atlantic coast developed one of the most centralized states in sub-Saharan Africa, the Kingdom of Kongo, with a sophisticated bureaucracy, provincial governors, and an extensive currency system using nzimbu shells. Their early encounter with Portuguese traders in the late fifteenth century made the Kingdom of Kongo one of the first African polities to engage diplomatically with European powers as an equal."
 luba_group: "Luba"
 luba_group_desc: "The Luba and Lunda peoples of the Katanga plateau and the Kasai basin built an interconnected web of tributary empires that dominated the heart of Central Africa for centuries. The Luba Empire pioneered the Nilotic model of divine kingship in Central Africa, and the Lunda expansion carried their political system of appointed governors across a vast swathe of the continent from Angola to Zambia."
 chokwe_group: "Chokwe"
 chokwe_group_desc: "The Chokwe peoples of the Angolan plateau are renowned for their exceptional artistic traditions, particularly their masks and wood carvings, and for their role in the long-distance trade networks that connected the Atlantic coast to the Central African interior. Originally subjects of the Lunda Empire, they expanded dramatically in the nineteenth century to become one of the dominant peoples of the region."
