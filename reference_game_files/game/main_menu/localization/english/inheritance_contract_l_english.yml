l_english:
 # Scripted relation — display name and description
 inheritance_contract_relation: "Inheritance Contract"
 inheritance_contract_relation_desc: "A country pays to secure the right to inherit another realm should its ruler die without an heir."

 # Offer UI keys (never visible -- offer_visible = always = no -- but required by the engine)
 offer_inheritance_contract: "Offer Inheritance Contract"
 offer_inheritance_contract_CATEGORY: "CATEGORY_FRIENDLY_ACTIONS"
 offer_inheritance_contract_cta: "Offer an [inheritance_contract|e] to [TARGET_COUNTRY.GetName]"
 offer_inheritance_contract_desc: "Grant [TARGET_COUNTRY.GetName] the right to inherit our realm should our ruler die without an heir."
 offer_inheritance_contract_cta_to_unknown: "Offer an [inheritance_contract|e] to a [country|e]"
 offer_inheritance_contract_desc_to_unknown: "Grant a [country|e] the right to inherit our realm should our ruler die without an heir."
 offer_inheritance_contract_happened_title: "Inheritance Contract Offered"
 offer_inheritance_contract_happened_desc: "[COUNTRY.GetName] have offered an [inheritance_contract|e] to [TARGET_COUNTRY.GetName], granting the right to inherit their realm should their ruler die without an heir."
 offer_inheritance_contract_proposal_question: "Offer an [inheritance_contract|e] to [TARGET_COUNTRY.GetName]?\n$INFO$"
 offer_inheritance_contract_incoming_proposal_title: "[inheritance_contract|e] Offer"
 offer_inheritance_contract_incoming_proposal_question: "[COUNTRY.GetName] wish to offer us an [inheritance_contract|e], granting us the right to inherit their realm should their ruler die without an heir. Do we accept?"

 # Request UI keys (non-buy -- disabled since can_get_without_buying = no -- but required by the engine)
 request_inheritance_contract: "Request Inheritance Contract"
 request_inheritance_contract_CATEGORY: "CATEGORY_FRIENDLY_ACTIONS"
 request_inheritance_contract_cta: "Request an [inheritance_contract|e] from [TARGET_COUNTRY.GetName]"
 request_inheritance_contract_desc: "Ask [TARGET_COUNTRY.GetName] to grant us the right to inherit their realm should their ruler die without an heir."
 request_inheritance_contract_cta_to_unknown: "Request an [inheritance_contract|e] from a [country|e]"
 request_inheritance_contract_desc_to_unknown: "Ask a [country|e] to grant us the right to inherit their realm should their ruler die without an heir."
 request_inheritance_contract_happened_title: "Inheritance Contract Established"
 request_inheritance_contract_happened_desc: "[COUNTRY.GetName] have been granted an [inheritance_contract|e] with [TARGET_COUNTRY.GetName], securing the right to inherit their realm should their ruler die without an heir."
 request_inheritance_contract_proposal_question: "Request an [inheritance_contract|e] from [TARGET_COUNTRY.GetName]?\n$INFO$"
 request_inheritance_contract_incoming_proposal_title: "[inheritance_contract|e] Request"
 request_inheritance_contract_incoming_proposal_question: "[COUNTRY.GetName] wish to establish an [inheritance_contract|e] with us, gaining the right to inherit our realm should our ruler die without an heir. Do we accept?"

 # Buy request UI keys
 buy_request_inheritance_contract: "Purchase Inheritance Contract"
 buy_request_inheritance_contract_CATEGORY: "CATEGORY_FRIENDLY_ACTIONS"
 buy_request_inheritance_contract_cta: "Purchase an [inheritance_contract|e] from [TARGET_COUNTRY.GetName]"
 buy_request_inheritance_contract_desc: "Pay [gold|e] to secure the right to inherit [TARGET_COUNTRY.GetName] should their ruler die without an heir."
 buy_request_inheritance_contract_cta_to_unknown: "Purchase an [inheritance_contract|e] from a [country|e]"
 buy_request_inheritance_contract_desc_to_unknown: "Pay [gold|e] to secure the right to inherit a heirless realm should their ruler die."
 buy_request_inheritance_contract_happened_title: "Inheritance Contract Established"
 buy_request_inheritance_contract_happened_desc: "[COUNTRY.GetName] have purchased an [inheritance_contract|e] with [TARGET_COUNTRY.GetName], securing the right to inherit their realm should their ruler die without an heir."
 buy_request_inheritance_contract_proposal_question: "Purchase an [inheritance_contract|e] from [TARGET_COUNTRY.GetName] for $COST$?\n$INFO$"
 buy_request_inheritance_contract_incoming_proposal_title: "[inheritance_contract|e] Proposal"
 buy_request_inheritance_contract_incoming_proposal_question: "[COUNTRY.GetName] wish to purchase an [inheritance_contract|e] for $COST$, securing the right to inherit our realm should our ruler die without an heir. Do we accept?"
 inheritance_contract_effect_text: "[COUNTRY.GetName] secures an [inheritance_contract|e] with [TARGET_COUNTRY.GetName]."
 inheritance_contract_effect_text_past: "[COUNTRY.GetName] secured an [inheritance_contract|e] with [TARGET_COUNTRY.GetName]."
 giving_inheritance_contract_list_who_tt: "$WHO$ has granted an [inheritance_contract|e] to $LIST$"
 receiving_inheritance_contract_list_who_tt: "$WHO$ holds an [inheritance_contract|e] with $LIST$"

 # Cancel UI keys
 cancel_inheritance_contract: "Cancel Inheritance Contract"
 cancel_inheritance_contract_cta: "Cancel our [inheritance_contract|e] with [SCOPE.sCountry('recipient').GetName]"
 cancel_inheritance_contract_desc: "We will cancel our agreement and forfeit the succession right we paid for."
 cancel_inheritance_contract_cta_to_unknown: "Cancel our [inheritance_contract|e] with a [country|e]"
 cancel_inheritance_contract_desc_to_unknown: "We will cancel our agreement and forfeit the succession right we paid for."
 cancel_inheritance_contract_happened_title: "Inheritance Contract Cancelled"
 cancel_inheritance_contract_happened_desc: "[SCOPE.sCountry('actor').GetName] has cancelled their [inheritance_contract|e] with [SCOPE.sCountry('recipient').GetName]."
 cancel_inheritance_contract_proposal_question: "Cancel [inheritance_contract|e] with [TARGET_COUNTRY.GetName]?\n$INFO$"

 # Break UI keys
 break_inheritance_contract: "Break Inheritance Contract"
 break_inheritance_contract_CATEGORY: "CATEGORY_HOSTILE_ACTIONS"
 break_inheritance_contract_cta: "Break our [inheritance_contract|e] with [SCOPE.sCountry('recipient').GetName]"
 break_inheritance_contract_desc: "We will end our [inheritance_contract|e], forfeiting the succession right we hold."
 break_inheritance_contract_cta_to_unknown: "Break our [inheritance_contract|e] with a [country|e]"
 break_inheritance_contract_desc_to_unknown: "We will end our [inheritance_contract|e], forfeiting the succession right we hold."
 break_inheritance_contract_happened_title: "Inheritance Contract Broken"
 break_inheritance_contract_happened_desc: "[SCOPE.sCountry('actor').GetName] has broken their [inheritance_contract|e] with [SCOPE.sCountry('recipient').GetName], forfeiting the succession right they had purchased."
 break_inheritance_contract_proposal_question: "Break our [inheritance_contract|e] with [TARGET_COUNTRY.GetName]?\n$INFO$"

 # Diplomatic status panel keys
 diplomatic_status_giving_inheritance_contract_name: "Inheritance Contract Granted"
 diplomatic_status_giving_inheritance_contract_tooltip: "#T Inheritance Contract Granted#!\nThis country has granted succession rights under an [inheritance_contract|e] to the following [countries|e]."
 diplomatic_status_receiving_inheritance_contract_name: "Inheritance Contract"
 diplomatic_status_receiving_inheritance_contract_tooltip: "#T Inheritance Contract#!\nThis country holds an [inheritance_contract|e] with the following [countries|e], securing the right to inherit them should their ruler die without an heir."

 # AI wants_to_give reason descs
 inheritance_contract_same_culture_group: "Shared cultural heritage strengthens trust in this arrangement."
 inheritance_contract_hre_members: "Both parties are members of the [holy_roman_empire|e], where [inheritance_contracts|e] are an established legal tradition."

 # Event strings
 inheritance_contract.1.title: "Inheritance Contract Secured"
 inheritance_contract.1.desc: "We have paid [SCOPE.sCountry('contract_partner').GetName] for the right to inherit their realm should [SCOPE.sCountry('contract_partner').GetGovernment.GetRuler.GetName] die without an heir. This is a significant investment, but the potential gains are substantial."
 inheritance_contract.1.a: "A worthy investment."

 inheritance_contract.3.title: "Inheritance Contract Invoked"
 inheritance_contract.3.desc: "The ruler of [SCOPE.sCountry('dead_ruler_country').GetName] has died without leaving an heir. Our [inheritance_contract|e] has come into effect, and their realm now falls under our crown."
 inheritance_contract.3.a: "Our patience has been rewarded."

 inheritance_contract.4.title: "Inheritance Contract Lapsed"
 inheritance_contract.4.desc: "Our ruler has died, and with them the [inheritance_contract|e] we held with [SCOPE.sCountry('dead_paying_country').GetName] has lapsed. The investment we made to secure that succession right is now lost."
 inheritance_contract.4.a: "A costly misfortune."
