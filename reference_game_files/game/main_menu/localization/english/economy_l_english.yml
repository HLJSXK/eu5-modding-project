 CREDITWORTHINESS_DRAIN_HOVER_DESC: "A separate penalty applied when we declare [bankruptcy|e]. It is subtracted from the Base Rating to give the Effective Rating, and decays back to zero slowly over many years."
 CREDITWORTHINESS_EFFECTIVE_HOVER_TITLE: "Effective Rating"
 CREDITWORTHINESS_EFFECTIVE_HOVER_DESC: "Base Rating minus the Bankruptcy Penalty, clamped to the range 0 to 100. This is the value the rest of the game reads. Below 50 raises [interest|e] on all our [loans|e] and makes banking nations reluctant to lend; above 50 lowers interest and makes them eager."
 total_debt: "Total Outstanding Debt"
 opinion_defaulted_on_loan: "Defaulted on Loan"
