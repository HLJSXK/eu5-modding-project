l_english:

 ####################################################
 # M1 Forecast Row
 ####################################################

 COLONY_FORECAST_ETA_LINE: "#T Pending#! About $MONTHS|v0$ months until the next settlement.\nThe estimate follows the current flow of [migration|e] into this colony. It will change as that flow speeds up or slows down."
 COLONY_FORECAST_ETA_LINE_SHORT: "~$MONTHS|v0$ months"
 COLONY_FORECAST_ETA_UNKNOWN: "#T Pending#!\nThis colony does not have a [migration|e] source yet. An estimate will appear once settlers start to arrive."
 COLONY_FORECAST_ETA_UNKNOWN_SHORT: "Pending"

 BOTTLENECK_SOURCE_DEPLETED: "@warning_icon! @peasants! Source Depleted"
 BOTTLENECK_SOURCE_DEPLETED_TT: "#T Slowed: Source Depleted#!\nOur source of settlers has run dry. The location sending [ShowPopTypeName('peasants')] to this colony has none left to spare, so [migration|e] will stay slow until a new source is found."

 BOTTLENECK_GOODS: "@warning_icon! @goods! Goods Shortage"
 BOTTLENECK_GOODS_TT: "#T Slowed: Goods Shortage#!\nThe colony is short on supplies. It receives less than 75% of the [goods|e] it needs, so it can support fewer new settlers."

 BOTTLENECK_MARITIME: "@warning_icon! @maritime_presence! Limited Maritime Presence"
 BOTTLENECK_MARITIME_TT: "#T Slowed: Limited Maritime Presence#!\nSettlers must cross the sea to reach this colony, and our [maritime_presence|e] in the area is too weak to carry them at full pace."

 BOTTLENECK_LOW_MIGRATION: "@warning_icon! @migration! Low Migration"
 BOTTLENECK_LOW_MIGRATION_TT: "#T Slowed: Low Migration#!\nFew of our people are willing to move to the colonies. Our [migration|e] is too low to keep settlers arriving at a steady pace."

 ####################################################
 # M2 Milestone Messages
 ####################################################

 COLONIAL_CHARTER_FIRST_FLIP_SETUP: "When the first location in a colonial province is settled by our colonists."
 COLONIAL_CHARTER_FIRST_FLIP_HEADER: "$MESSENGER$"
 COLONIAL_CHARTER_FIRST_FLIP_TITLE: "First Settlement at $LOCATION$"
 COLONIAL_CHARTER_FIRST_FLIP_DESC: "Our colonists in $PROVINCE$ have established a foothold at $LOCATION$, the first piece of the [colonial_charter|e] $CHARTER$ to fall under our crown."
 COLONIAL_CHARTER_FIRST_FLIP_FLAVOR: "From this beachhead, the rest must follow."
 COLONIAL_CHARTER_FIRST_FLIP_LOG: "First settlement of $CHARTER$: $LOCATION$"
 COLONIAL_CHARTER_FIRST_FLIP_BTN1: "Onward!"
 COLONIAL_CHARTER_FIRST_FLIP_BTN2: "OK"
 COLONIAL_CHARTER_FIRST_FLIP_BTN3: "$common_string_go_to$"
 COLONIAL_CHARTER_FIRST_FLIP_MAP: ""

 COLONIAL_CHARTER_FIRST_FLIP_OTHER_SETUP: "When the first location in another country's colonial province is settled."
 COLONIAL_CHARTER_FIRST_FLIP_OTHER_HEADER: "$MESSENGER$"
 COLONIAL_CHARTER_FIRST_FLIP_OTHER_TITLE: "First Settlement at $LOCATION$"
 COLONIAL_CHARTER_FIRST_FLIP_OTHER_DESC: "$COUNTRY$ have established a foothold at $LOCATION$ in $PROVINCE$, the first piece of the [colonial_charter|e] $CHARTER$ to fall under their crown."
 COLONIAL_CHARTER_FIRST_FLIP_OTHER_FLAVOR: "From this beachhead, the rest may follow."
 COLONIAL_CHARTER_FIRST_FLIP_OTHER_LOG: "First settlement of $CHARTER$ by $COUNTRY$: $LOCATION$"
 COLONIAL_CHARTER_FIRST_FLIP_OTHER_BTN1: "I see."
 COLONIAL_CHARTER_FIRST_FLIP_OTHER_BTN2: "OK"
 COLONIAL_CHARTER_FIRST_FLIP_OTHER_BTN3: "$common_string_go_to$"
 COLONIAL_CHARTER_FIRST_FLIP_OTHER_MAP: ""

 COLONIAL_CHARTER_SOURCE_DEPLETED_SETUP: "When a colonial charter's migration source runs out of peasants and re-rolls."
 COLONIAL_CHARTER_SOURCE_DEPLETED_HEADER: "$MESSENGER$"
 COLONIAL_CHARTER_SOURCE_DEPLETED_TITLE: "$CHARTER$ Source Depleted"
 COLONIAL_CHARTER_SOURCE_DEPLETED_DESC: "The migration source feeding the [colonial_charter|e] $CHARTER$ in $PROVINCE$ has run out of [ShowPopTypeName('peasants')]. A new source has been chosen, but progress may slow until it recovers."
 COLONIAL_CHARTER_SOURCE_DEPLETED_FLAVOR: "Even the deepest wells run dry."
 COLONIAL_CHARTER_SOURCE_DEPLETED_LOG: "$CHARTER$ migration source depleted"
 COLONIAL_CHARTER_SOURCE_DEPLETED_BTN1: "Unfortunate."
 COLONIAL_CHARTER_SOURCE_DEPLETED_BTN2: "OK"
 COLONIAL_CHARTER_SOURCE_DEPLETED_BTN3: "$common_string_go_to$"
 COLONIAL_CHARTER_SOURCE_DEPLETED_MAP: ""

 COLONIAL_CHARTER_HALFWAY_SETUP: "When a colonial charter's progress crosses 50%."
 COLONIAL_CHARTER_HALFWAY_HEADER: "$MESSENGER$"
 COLONIAL_CHARTER_HALFWAY_TITLE: "$PROVINCE$ Halfway Colonized"
 COLONIAL_CHARTER_HALFWAY_DESC: "Our colonization of $PROVINCE$ under the [colonial_charter|e] $CHARTER$ is halfway complete."
 COLONIAL_CHARTER_HALFWAY_FLAVOR: "The harder half lies ahead, but the road back is now longer than the road forward."
 COLONIAL_CHARTER_HALFWAY_LOG: "$CHARTER$ halfway"
 COLONIAL_CHARTER_HALFWAY_BTN1: "Press on."
 COLONIAL_CHARTER_HALFWAY_BTN2: "OK"
 COLONIAL_CHARTER_HALFWAY_BTN3: "$common_string_go_to$"
 COLONIAL_CHARTER_HALFWAY_MAP: ""

 COLONIAL_CHARTER_HALFWAY_OTHER_SETUP: "When another country's colonial charter crosses 50%."
 COLONIAL_CHARTER_HALFWAY_OTHER_HEADER: "$MESSENGER$"
 COLONIAL_CHARTER_HALFWAY_OTHER_TITLE: "$PROVINCE$ Halfway Colonized"
 COLONIAL_CHARTER_HALFWAY_OTHER_DESC: "The colonization of $PROVINCE$ by $COUNTRY$ under the [colonial_charter|e] $CHARTER$ is halfway complete."
 COLONIAL_CHARTER_HALFWAY_OTHER_FLAVOR: "The harder half lies ahead of them."
 COLONIAL_CHARTER_HALFWAY_OTHER_LOG: "$CHARTER$ halfway ($COUNTRY$)"
 COLONIAL_CHARTER_HALFWAY_OTHER_BTN1: "I see."
 COLONIAL_CHARTER_HALFWAY_OTHER_BTN2: "OK"
 COLONIAL_CHARTER_HALFWAY_OTHER_BTN3: "$common_string_go_to$"
 COLONIAL_CHARTER_HALFWAY_OTHER_MAP: ""

 ####################################################
 # M3 Self-Sustaining Pill
 ####################################################

 COLONY_PILL_SELF_SUSTAINING: "#G Self-sustaining#!"
 COLONY_PILL_OPERATING_AT_LOSS: "#R At a loss#!"
 COLONY_SELF_SUSTAINING_HEADER: "Self-sustaining"
 COLONY_OPERATING_AT_LOSS_HEADER: "Operating at a loss"

 COLONY_SELF_SUSTAINING_INCOME: "Monthly income: $VAL|+=$@gold!"
 COLONY_SELF_SUSTAINING_EXPENSE: "Monthly expense: #R -$VAL|2$@gold!#!"
 COLONY_SELF_SUSTAINING_RESULT: "#italic The colony is self-sustaining because its monthly balance of $BALANCE|+=2$@gold! meets the required threshold of #TOOLTIP:$BREAKDOWN_TAG$ $THRESHOLD|2L$@gold!#!.#!"
 COLONY_OPERATING_AT_LOSS_RESULT: "#italic The colony is operating at a loss because its monthly balance of $BALANCE|+=2$@gold! is below the required threshold of #TOOLTIP:$BREAKDOWN_TAG$ $THRESHOLD|2L$@gold!#!.#!"
 COLONY_SELF_SUSTAINING_THRESHOLD_BREAKDOWN: "Monthly expense × buffer: $EXPENSE|2$@gold! × $BUFFER|%$ = $THRESHOLD|2$@gold!"

 ####################################################
 # M4/M5/M6 Helpful Actions Hints
 ####################################################

 COLONY_HELPFUL_ACTIONS_TITLE: "Helpful [cabinet_actions|e]"
 COLONY_HELPFUL_ACTIONS_CHARTER_DESC: "Three [cabinet_actions|e] commonly speed up a colonial charter:\n - Encourage Migration\n - Send People to Colonial Charter\n - Settle the Frontier\n\n#weak Click to jump straight to these actions.#!"
 COLONY_HELPFUL_ACTIONS_LOCATION_DESC: "Three [cabinet_actions|e] commonly develop a newly-colonized location:\n - Increase Control\n - Develop Province\n - Encourage Migration\n\n#weak Click to jump straight to these actions.#!"
 COLONY_HELPFUL_ACTIONS_SUBJECT_DESC: "Two [cabinet_actions|e] commonly help a colonial nation grow:\n - Send People to the Colonies\n - Develop Province\n\n#weak Click to jump straight to these actions.#!"
