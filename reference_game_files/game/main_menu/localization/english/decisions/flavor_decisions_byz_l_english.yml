l_english:
 byz_army_reform_decision.title: "Reforming the [ROOT.GetCountry.GetAdjectiveWithNoTooltip] Army"
 byz_army_reform_decision.title.entry: "Reforming the Byzantine Army"
 byz_army_reform_decision.desc: "Whilst our army dominated in the past using the Themata and the numerous levies they provided, the increase in wealth and the centralization of realms has led to armies becoming a full-time profession. [target_character.GetName] with [target_character.GetHerHis] council has been hard at work drafting a new army organization, one that depends less on the [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] for troops."
 byz_army_reform_decision.desc.entry: "Whilst our army dominated in the past using the Themata and the numerous levies they provided, the increase in wealth and the centralization of realms has led to armies becoming a full-time profession. Our cabinet could draft a plan to reform our army, making us less dependent on our nobility for support."
 byz_army_reform_decision.a: "The army shall serve [target_character.GetNameWithNoTooltip]."
 byz_army_reform_decision.a.entry: "The army shall serve the King"
 byz_army_reform_decision.b: "Let us not override the role of the [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]."
 byz_army_reform_decision.b.entry: "Let us not override the role of the $nobles_estate$."
 BYZ_ALL_THEMATA_PROVINCES_GAIN_NOBLE_LOYALTY: "All [ShowPopTypeName('nobles')] [pops|e] in [locations|e] with [ShowBuildingTypeName('thema_headquarters')] gain [ShowNamedValue('pop_satisfaction_ultimate_bonus')|+=2%] [pop_satisfaction|e]."