l_english:
 prospect_for_coal.title: "Prospect for Coal"
 prospect_for_coal.desc: "The age of steam and iron runs on coal, and our own soil may yet hold what our industry so desperately craves. Let us spend the political capital to send teams of geologists and mining engineers into our coal-bearing lands, to survey the ground, sink test shafts along the promising seams, and open a new pit where the earth gives up the richest yield. The surveyors will begin with the least productive of our rural holdings, where little is lost by turning the fields over to the collieries, and the new working will start small before it grows to feed our furnaces."
 prospect_for_coal.a: "Commission the surveys."
 prospect_for_coal_effect_tt: "[coal_prospect_location.GetName] will now produce [ShowGoodsName('coal')], instead of [coal_prospect_location.GetRawMaterial.GetName]"
 prospect_for_coal.historical_info: "The great coalfields of the Ruhr, Upper Silesia, and South Wales powered the Industrial Revolution, and the systematic search for coal transformed quiet rural districts into some of the densest industrial regions on earth. Geological surveying matured into a professional discipline in the late eighteenth and early nineteenth centuries, as states and entrepreneurs raced to locate the fuel on which the new machine age depended."
