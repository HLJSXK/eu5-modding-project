l_english:
 sponsor_a_cathedral_decision.title: "Sponsor a Cathedral"
 sponsor_a_cathedral_decision.desc: "Our country still is lacking in places to worship and practice our faith. We should sponsor the construction of a new [ShowBuildingTypeName('cathedral')] to accommodate the needs of our people."
 sponsor_a_cathedral_decision.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 sponsor_a_cathedral_decision.a.entry: "$common_string_brilliant$"
 sponsor_a_cathedral_cooldown_tt: "Has not used this [decision|e] during the current ruler's reign"

 sponsor_a_great_madrasa_decision.title: "Sponsor a Great Madrasa"
 sponsor_a_great_madrasa_decision.desc: "While our country is already home to many places of worship, the ordinary [ShowBuildingTypeName('temple')] and [ShowBuildingTypeName('madrasa')] are not enough to satisfy the great minds of our scholars. We should invest into a new [ShowBuildingTypeName('great_madrasa')] to provide them with adequate spaces to study and spread their knowledge."
 sponsor_a_great_madrasa_decision.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 sponsor_a_great_madrasa_decision.a.entry: "$common_string_brilliant$"
 sponsor_a_great_madrasa_cooldown_tt: "$sponsor_a_cathedral_cooldown_tt$"

 construct_a_grand_palace_decision.title: "Commission a new Palace"
 construct_a_grand_palace_decision.desc: "Our court and our rulers family both lack a home suitable for their own prestige. We should hire an [ShowArtistTypeName('architect')] to plan the construction of a new [ShowBuildingTypeName('grand_palace')]."
 construct_a_grand_palace_decision.a: "This will be a suitable residence."
 construct_a_grand_palace_decision.a_tt: "The hired [ShowArtistTypeName('architect')] will join our [court|e]"

 strive_towards_thalassocracy_decision.title: "Establish a Thalassocracy"
 strive_towards_thalassocracy_decision.desc: "The vast seas could become a vital part of our country and its economic expansion, if only we could adequately dominate the waters along our coast. Pouring significant resources into the expansion of our navy would allow us to align our infrastructure with this new focus on oversea ambitions."
 strive_towards_thalassocracy_decision.a: "Let us embrace the sea."
 strive_towards_thalassocracy_decision.a.tt: "We will have 20 years to establish a strong navy"
 strive_thalassocracy_coastal_markets_tt: "Owns at least one coastal [market_center|e]"

 abandon_thalassocracy_decision.title: "Abandon the Thalassocracy"
 abandon_thalassocracy_decision.desc: "Ruling through our domination of the seas no longer suits our own ambitions. We should redirect our efforts to the land we live on."
 abandon_thalassocracy_decision.a: "Let us return to more solid ground."

 found_trade_company_india_decision.title: "Support our Asian Trade Routes"
 found_trade_company_india_decision.desc: "The wealthy shores of [ShowSubContinentName('south_asia')] and [ShowSubContinentName('south_east_asia')] promise us great profit. While our current trading efforts are mostly conducted by individual merchants, this is clearly not an adequate state of affairs for a country of our standing. We should leverage the tools of our state to establish larger trading missions between those foreign markets and our own."
 found_trade_company_india_decision.a: "Invest in an Indian Trading Company."

 invite_foreign_advisor_decision.title: "Purchase Foreign Innovation"
 invite_foreign_advisor_decision.desc: "Our country is severely lacking behind other great powers of the world. We can not sit idly by while other countries surpass us in the field of technology and innovation. By offering a generous salary to an individual from one of these countries, we can try and catch up with others and not fall behind further in the pursuit of modernization."
 invite_foreign_advisor_decision.a: "Welcome the foreign scholar."
 invite_foreign_advisor_decision.a.tt: "A scholar from a foreign [country|e] will join our [court|e]"
 invite_foreign_advisor_decision.b: "Our own advisors suffice."
 invite_foreign_advisor_cooldown_tt: "$sponsor_a_cathedral_cooldown_tt$"

 disempower_the_parliament_decision.title: "Challenge the Rights of the Parliament"
 disempower_the_parliament_decision.desc: "Over the last centuries our parliament has acquired certain rights that limit our government in its own freedom. We should look towards those with entrenched seats in the parliament and revoke their rights!"
 disempower_the_parliament_decision.a: "We need to curb the parliaments powers."
 disempower_the_parliament_decision.a_building_tt: "We will remove a [ShowBuildingTypeName('urban_parliament_seat')] in one of our [locations|e]"
 disempower_the_parliament_decision.a_tt: "Every [pop|e] in the [location|e] will lose [ShowNamedValue('pop_satisfaction_severe_penalty')|+=2%] [pop_satisfaction|e]"
 disempower_the_parliament_decision.b: "This is not the right time to challenge the parliament."
 disempower_the_parliament_decision_cooldown_tt: "$sponsor_a_cathedral_cooldown_tt$"

 abolish_serfdom_decision.title: "Abolish Serfdom"
 abolish_serfdom_decision.desc: "The practice of Serfdom, practiced for a long time by our own country, has developed into a hindrance for our economic pursuits. Considering the volatile political climate of our time it could be wise to abolish the practice by decree to appease both our growing middle class and ease the suffering of those under the whip."
 abolish_serfdom_decision.a: "Sign the decree."
 abolish_serfdom_decision.b: "This would be too destabilizing."

 abandon_absolutism_decision.title: "Abandon Absolutism"
 abandon_absolutism_decision.desc: "The absolutist government of our ruler has more and more become a threat to the internal stability of our country. Rumors of rebellion have become frequent and the suppression of those opposed to our regime is no easy task. Perhaps it is time to turn our back on the absolutist ideals of old and embrace a more liberal form of government for our country?"
 abandon_absolutism_decision.a: "Absolutism is no longer suitable for us."
 abandon_absolutism_decision.b: "Our authority is supreme!"

 jewish_expulsion_threat.title: "Expulsion Threat"
 jewish_expulsion_threat.desc: "The Crown issues a formal ultimatum: Jewish communities must pay an extraordinary levy or face expulsion. The threat extracts an immediate windfall from frightened communities, but the lingering climate of insecurity disrupts trade networks long sustained by Jewish intermediaries."
 jewish_expulsion_threat.a: "Issue the ultimatum."
 jewish_expulsion_threat_cooldown_tt: "$sponsor_a_cathedral_cooldown_tt$"
 STATIC_MODIFIER_NAME_jewish_expulsion_threat: "Expulsion Threat"
 jews_may_choose_to_leave_tt: "Most of our [ShowReligionAdjective('judaism')] [pops|e] will migrate to neighboring [countries|e]\n\nEach [location|e] they leave will suffer the [ShowModifier('jewish_expulsion_threat')], scaled by its share of [ShowReligionAdjectiveWithNoTooltip('judaism')] [pops]"
