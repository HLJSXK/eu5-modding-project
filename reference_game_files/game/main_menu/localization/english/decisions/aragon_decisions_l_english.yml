l_english:
 ara_coronate_ruler.title: "$flavor_ara.22.title$"
 ara_coronate_ruler.title.entry: "$flavor_ara.22.entry$"
 ara_coronate_ruler.desc: "[target_character.GetName] has ascended to the throne, and [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] and [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')] alike have gathered to witness the coronation at the prestigious location of [ShowLocationName('zaragoza')], where the [ROOT.GetCountry.GetGovernment.GetRulerTitle] will pledge to uphold the laws of the [ROOT.GetCountry.GetFlavorRank], the liberties of the people, and the privileges of the estates."
 ara_coronate_ruler.desc.entry: "A new ruler ascending the throne will not be able to properly secure loyalty of the [ShowEstateTypeName('nobles_estate')] and the [ShowEstateTypeName('peasants_estate')] unless the appropriate coronation ceremony is conducted. An uncrowned monarch is an unrecognized one."
 ara_coronate_ruler.a: "$flavor_ara.23.a$"
 ara_coronate_ruler.b: "Let us abolish this tradition."