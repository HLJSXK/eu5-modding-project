l_english:
 pol_shooting_societies_decision.title: "The Shooting Societies"
 pol_shooting_societies_decision.desc: "Life is often full of perils and foreign invaders who wish to usurp our prosperous lands. To pursue the defensive effort of one's home, many members of the [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] have taken to founding a shooting society in [ShowLocationName('krakow')], aimed at maintaining prosperity and raising a capable body of sharpshooter militia.\n\nAs our domain and people expand, new towns and cities seek to establish their own shooting societies and thus many of their representatives have taken to formally request official backing for the founding of such societies in each town and city."
 pol_shooting_societies_decision.desc.entry: "Townsmen who drill with their own powder and shot cost the treasury nothing, yet still turn out when the levy is called. What began as one society in [ShowLocationName('krakow')] could become a charter granted to every town willing to fund one, provided the $burghers_estate$ are trusted with arms."
 pol_shooting_societies_decision.a: "Shooting roosters is no #italic yolk#!, it requires precision and skill!"
 pol_shooting_societies_decision.b: "The one established in [ShowLocationNameWithNoTooltip('krakow')] will suffice."
 pol_shooting_societies_decision.historical_info: "Known as the Rooster Society, the origin of the name within the Brotherhood traces back to their early shooting contests. Initially, they utilized live chickens and roosters as targets, evolving over time to wooden rooster figures known as #italic kurs#!. This transition led to the establishment of the original name, #italic Kur's Fraternity#!, as #italic kur#! denotes #italic rooster#! in colloquial Polish.\n\nWith the advent of firearms, the resemblance between the hammerlock and a rooster's head became striking. As shooters prepared to fire by pulling back the hammerlock, the action was described as 'cocking' the firearm, solidifying the association with the rooster moniker."

 pol_privilege_of_koszyce_decision.title: "Privilege of Koszyce"
 pol_privilege_of_koszyce_decision.desc: "[ruler_scope.GetName] has approached the [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] to ask for that, in case of death with no male progeny, a daughter would be able to succeed to the throne. For the [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')], this is an ample opportunity to receive further privileges from the [ROOT.GetCountry.GetGovernment.GetRulerTitle], something that all of them can agree on. With such a privilege, the tax paid by the [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] would be decreased and further taxes would not be established without their consent. Furthermore, any future [ROOT.GetCountry.GetGovernment.GetRulerTitle] would have to pay for the costs of their visit, certainly humiliating for the [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')]."
 pol_privilege_of_koszyce_decision.desc.entry: "A throne passed to a daughter needs consent, and consent in this realm comes with a price list. The $nobles_estate$ will name it in coin and exemptions, and each concession granted now becomes a precedent no future $crown_estate$ can revoke."
 pol_privilege_of_koszyce_decision.a: "We will follow through."
 POL_may_form_union_with_lit_at_later_date: "With the [ShowEstatePrivilegeName('privilege_of_koszyce')] enacted, [ROOT.GetCountry.GetName] will be able to form a Union with [GetCountry('LIT').GetName] with $flavor_pol.55.title$ event."
 pol_privilege_of_koszyce_decision.historical_info: "Privilege of Koszyce was granted to the Szlachta by Louis I, a monarch ruling over both Hungary and Poland in a Personal Union. Thanks to this privilege, the succession of one of his daughters had been secured, but at the cost of numerous privileges to the nobility, putting Poland on track to become a 'Noble Democracy' in the future. The succession of his daughter, Jadwiga, has lead to the subsequent marriage with the Lithuanian Grand Duke Jogaila, leading to a Personal Union between Poland and Lithuania and the formation of the Commonwealth further down the line."

 pol_nihil_novi_decision.title: "Nihil Novi"
 pol_nihil_novi_decision.desc: "The [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] have brought forth a most ridiculous proposal at a recent [ROOT.GetCountry.GetGovernment.GetParliament.GetName]. Their delusions of [ROOT.GetCountry.GetGovernment.GetAdjective] adequacy have them believe that they deserve the right to not have any laws made about them without their consent. Preposterous! Yet, without their support, we will be in no position to fund our further campaigns. We must therefore consider their proposal, as absurd as it may seem. Moreover, they desire to restrict the rights of the townsfolk and to forbid the freedom of movement for their serfs. We might be forced to accept the petition of the [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]."
 pol_nihil_novi_decision.desc.entry: "There is a petition before our parliament that would leave the $nobles_estate$ answerable to no law they have not themselves approved, with the townsfolk and the serfs bound tighter in the same breath. It is an insult dressed as a request, and refusing it means finding another way to pay for our wars."
 pol_nihil_novi_decision.a: "Let them have their petty rights."
 pol_nihil_novi_decision.b: "Let us keep this in mind for later."
 pol_nihil_novi_decision.b_tt: "We will be able to select the $nihil_novi$ at a later time"
 pol_nihil_novi_decision.historical_info: "#italic Nihil novi nisi commune consensu#! is the name of a 1505 constitution of the Polish Sejm which stipulated that no new law would be instituted without the common consent of the nobility. It is regarded as the beginning of the Noble Democracy in Poland and was one of cornerstones for the later #italic Golden Liberty#!."

 pol_rule_of_the_sejm_decision.title: "Elective Monarchy in Poland"
 pol_rule_of_the_sejm_decision.desc: "The [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')], confident in their privileges, have begun calling back to their ancient claims. Citing historical precedent, more and more among the [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] assert their inalienable right to select the successors to the [ROOT.GetCountry.GetFlavorRank]. And though we would like to oppose such preposterous claims, we cannot help but notice the rising authority of the [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] at the expense of the [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')]. Unfortunately, whether we like it or not, we will have to profess trust in them for the election of the future monarchs."
 pol_rule_of_the_sejm_decision.desc.entry: "Whoever chooses the monarch holds the monarchy. The $nobles_estate$ have grown strong enough to make that claim aloud, and the $crown_estate$ is no longer strong enough to answer it."
 pol_rule_of_the_sejm_decision.a: "We will trust the Sejm!"
 pol_rule_of_the_sejm_decision.historical_info: "With a multitude of privileges in the 14th and 15th centuries, the right to elect the ruler of Poland was extended to Polish nobles. Initially, the various Jagiellonian heirs were not disputed in their succession, and as such the elections were a mere formality. That would change with the end of the Jagiellonian Dynasty, triggering the first election where Szlachta had to choose from various foreign nobles. True royal elections began in 1573 at the election of Henry of Valois and subsequent monarchs would be elected from foreign candidates until the end of the Commonwealth in the 18th century."
