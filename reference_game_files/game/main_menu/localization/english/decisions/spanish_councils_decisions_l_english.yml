l_english:
 spa_establish_the_council_of_castile_decision.title: "Establish the $royal_council_of_castile$"
 spa_establish_the_council_of_castile_decision.desc: "For too long has the [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] been shackled by the whims of petty [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] and the inefficient patchwork of local jurisdictions. The [ShowGovernmentReformName('royal_council_of_castile')], proposed by [target_character.GetName] and supported by reformers and royalists alike, offers a vision of a more centralized, professionally governed state. By empowering the council to oversee tax collection, judicial matters, and appointments, we could better direct the resources of the [ROOT.GetCountry.GetFlavorRank] toward national interest, rather than the indulgence of local governors."
 spa_establish_the_council_of_castile_decision.desc.entry: "Ruling through a patchwork of local jurisdictions leaves the $crown_estate$ dependent on whoever happens to hold sway in each of them. A standing body of trained officials answering to us alone, the [ShowGovernmentReformName('royal_council_of_castile')], would put taxation, justice, and appointments beyond the reach of local interest."
 spa_establish_the_council_of_castile_decision.a: "Let the council oversee the [ROOT.GetCountry.GetFlavorRank]."
 spa_establish_the_council_of_castile_decision.a.entry: "Let the council oversee the realm."
 establish_the_council_of_castile_tt: "Unlocks the [ShowBureaucracyTypeName('spa_council_of_castile_bureaucracy')]"
 established_the_council_of_castile_tt: "Established the [ShowBureaucracyTypeName('spa_council_of_castile_bureaucracy')] with the $spa_establish_the_council_of_castile_decision.title$ decision."
 spa_establish_the_council_of_castile_decision.historical_info: "The Royal and Supreme Council of Castile was established during the late 15th century under the Catholic Monarchs, Ferdinand II of Aragon and Isabella I of Castile. Originally a medieval advisory body, the Council was transformed into a central instrument of royal authority. It served to curb the power of the high nobility, bypass local privileges, and professionalize governance through the appointment of university-trained lawyers and bureaucrats who were serving the interests of the realm."
