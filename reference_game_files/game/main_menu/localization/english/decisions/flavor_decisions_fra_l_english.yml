l_english:
 fra_taille_tax_decision.title: "The Birth of a Permanent Taxation System"
 fra_taille_tax_decision.desc: "Following a massive undertaking, [ruler_fra.GetName] has completed a remodeling of [ROOT.GetCountry.GetName]'s finances. While [ROOT.GetCountry.GetNameWithNoTooltip] has maintained the policy of [ShowPolicyName('exceptional_only')] tax that is only collected during times of war, [ruler_fra.GetShortNameWithNoTooltip] has crafted a framework for a permanent taxation system. Through a compromise with the [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] and [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')], the new policy can be enacted, though these new taxation policies will be met with disapproval from the [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] and [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')]."
 fra_taille_tax_decision.desc.entry: "A tax voted only in wartime must be begged for again with every campaign. Fixing it permanently would end the begging, and the $nobles_estate$ and $clergy_estate$ can be brought to agree so long as the weight of it falls on the $burghers_estate$ and the $peasants_estate$ instead."
 fra_taille_tax_decision.a: "Issue it."
 fra_taille_tax_decision.b: "The old ways are better..."
 enables_taille_laws: "[ROOT.GetCountry.GetName] will gain access to [ShowLawName('fra_taille')] laws"
 fra_taille_tax_decision.historical_info: "Charles VII's reign saw a remodeling of French finances with the establishment of the Taille tax, which led to the birth of a permanent taxation system in France. While the nobility and clergy were exempt, the newly established Taille, a direct land tax, would considerably assist in the state's finances following the end of the Hundred Years' war."

 fra_5_percent_tax_decision.title: "[target_character.GetLastNameWithNoTooltip]'s Five Percent Tax"
 fra_5_percent_tax_decision.title.entry: "$de_machault$'s Five Percent Tax"
 fra_5_percent_tax_decision.desc: "When the [ShowLawName('fra_taille')] was originally instituted, it replaced an ancient feudal taxation system used by the [ROOT.GetCountry.GetLongName]. However, as time has pass, old special privileges granted to the [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] and [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] have begun to prove inefficient in the greater taxation system of the state.\n\n[target_character.GetName], a member of the [ROOT.GetCountry.GetAdjectiveWithNoTooltip] administration, has offered a proposal to redefine the [ShowLawNameWithNoTooltip('fra_taille')], to include a #italic 5 percent tax#! on the general land tax, that would be expanded to include the [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] and [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')]. While the proposal would prove beneficial for the state's finances, the [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')] and [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] have already voiced fierce opposition."
 fra_5_percent_tax_decision.desc.entry: "Exemptions granted for services rendered centuries ago still cost the treasury every year. $name_john.french_language$ $name_baptiste$ $de_machault$ proposes a flat share of the land's yield owed by everyone who holds land, which is a modest enough sum and an intolerable enough principle that the $clergy_estate$ and $nobles_estate$ are already in uproar."
 fra_5_percent_tax_decision.a: "Force it through!"
 fra_5_percent_tax_decision_tt: "$name_john.french_language$ $name_baptiste$ $de_machault$ will join our [court|e]"
 fra_5_percent_tax_decision.b: "We dare not anger them."
 unlocks_machault_tax_reforms: "[ROOT.GetCountry.GetName] will gain access to [ShowLawName('fra_5_percent_tax')] laws, an extension of the [ShowLawName('fra_taille')]"
 fra_5_percent_tax_decision.historical_info: "When Jean-Baptiste de Machault became controller-general of the finances in France in December 1745, he found the country on the verge of bankruptcy. Neither the nobles nor the clergy were paying the general land tax, the Taille. In 1749, Machault tried to reform the system by proposing to substitute the old tax of a tenth, which many of the clergy and the nobility evaded, with a five percent tax without exceptions. The proposal was met by such loud protests that Machault was unable to see it through."

 fra_fouage_tax_decision.title: "The Fouage Tax"
 fra_fouage_tax_decision.desc: "Throughout [scope_ruler.GetHisHer] reign, [scope_ruler.GetName] has lived a rather luxurious lifestyle in [scope_ruler.GetHisHer] capacity as [ROOT.GetCountry.GetGovernment.GetRulerTitle]. From expensive travels across the various estates in [GetCountry('FRA').GetName], to the upkeep of the [ROOT.GetCountry.GetGovernment.GetAdjective] palace in [ROOT.GetCountry.GetCapital.GetName], the [ROOT.GetCountry.GetGovernment.GetAdjective] treasury has been left vastly drained of its funds. To counteract [scope_ruler.GetShortNameWithNoTooltip] lavish lifestyle, members of the cabinet have put forth the idea of levying #italic The Fouage Tax#! as a new Hearth tax on households throughout [GetCountry('FRA').GetNameWithNoTooltip]. While this proposed tax will be a hefty price for the [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')] to pay, it would allow the [ROOT.GetCountry.GetGovernment.GetAdjective] treasury to recover its funds while also allowing [scope_ruler.GetShortNameWithNoTooltip] to maintain [scope_ruler.GetHisHer] luxurious lifestyle."
 fra_fouage_tax_decision.desc.entry: "Palaces, progresses, and a court that travels in state are not paid for out of the ruler's own pocket. A hearth tax reaches every household in $FRA$ and would refill the treasury quickly, which recommends it to the cabinet and to nobody living under those hearths."
 fra_fouage_tax_decision.a: "Levy it for the [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')]."
 fra_fouage_tax_decision.a.entry: "Levy it for the $crown_estate$."
 fra_fouage_tax_decision.b: "Pause implementation of the levy for now."
 fra_fouage_tax_decision.c: "The State will not cover the luxuries of [scope_ruler.GetShortNameWithNoTooltip]."
 fra_fouage_tax_decision.c.entry: "The State will not cover the luxuries of the ruler."
 variable_tt_enabled_fouage_tax: "Enabled Fouage"
 fra_fouage_tax_decision.historical_info: "Initially levied during the reign of King Phillipe III to cover royal expenses alongside the financial effects of the Black Death and the Hundred Years' War, the Fouage (Hearth) Tax would become one of the notable taxes raised in order to maintain the royal treasury of the Monarchs of France. While certain [GetCountry('FRA').GetAdjectiveWithNoTooltip] regions saw the tax imposed on them, it eventually became more widespread across the entirety of France in the later 14th century."

 fra_edict_of_toleration_decision.title: "The Edict of Fontainebleau"
 fra_edict_of_toleration_decision.desc: "The spread of the Reformation has sent shock waves across [ShowContinentName('europe')], with many of those who have grown untrusting of the [ShowReligionAdjective('catholic')] Church teachings and have now professed themselves to the newly founded [ShowReligionAdjective('lutheran')] faith. While the majority of [GetCountry('FRA').GetName] still stay true to the [ShowReligionAdjectiveWithNoTooltip('catholic')] faith, the growing influence of the [ShowReligionAdjectiveWithNoTooltip('lutheran')] followers has forced the [ROOT.GetCountry.GetGovernment.GetCourtTitle] to take action.\n\n[ruler_fra.GetName] has been petitioned to enact the [ShowPolicyName('edict_of_fontainebleau')], an edict aimed at crushing the growing [ShowReligionAdjectiveWithNoTooltip('lutheran')] influence before it can bring great unrest to [GetCountry('FRA').GetNameWithNoTooltip]."
 fra_edict_of_toleration_decision.desc.entry: "A faith that spreads among merchants and printers is harder to stamp out than one held by peasants. The [ShowReligionAdjective('lutheran')] congregations are still few, and our court must decide whether to break them now with the [ShowPolicyName('edict_of_fontainebleau')] or learn to live beside them."
 fra_edict_of_toleration_decision.a: "We are forced to take action to combat the rise of heresy."
 fra_edict_of_toleration_decision.b: "We should seek to maintain a humanist outlook with [ShowReligionAdjectiveWithNoTooltip('lutheran')] followers."

 fra_colonial_ambitions_decision.title: "Rapprochement to Colonial Affairs"
 fra_colonial_ambitions_decision.desc: "With the religious turmoil that has engulfed [GetCountry('FRA').GetName] for decades, the [ROOT.GetCountry.GetGovernment.GetAdjective] [ROOT.GetCountry.GetGovernment.GetCourtTitle] has proposed once again pursuing colonial ambitions into the new world. While the voyages of previous explorers have already brought [GetCountry('FRA').GetNameWithNoTooltip] great information in regards to the new lands, the religious outbreak of the Reformation forced the [ROOT.GetCountry.GetGovernment.GetCourtTitle] to abandon any further colonial ambitions. However, other colonial powers in [ShowContinentName('europe')] have already established their own settlements across the new world, and [GetCountry('FRA').GetAdjectiveWithNoTooltip] settlements may lead to diplomatic breakdowns with other colonial powers.\n\nOthers in the [ROOT.GetCountry.GetGovernment.GetCourtTitle] have also proposed that the state pursue ambitions to monopolize the new Indian Trade routes, and instead establish a trading company in [ShowContinentName('asia')]."
 fra_colonial_ambitions_decision.desc.entry: "We know the way west, what we have lacked is a decade quiet enough at home to use the knowledge. Rivals have spent that decade planting colonies, so any settlement of ours will now be made in somebody else's neighborhood, unless we look instead to the trade of [ShowContinentName('asia')]."
 fra_colonial_ambitions_decision.a: "The lands of the New World should be our focus."
 fra_colonial_ambitions_decision.b: "We should instead seek to monopolize the Indian trade."

 fra_centralize_monarchy_decision.title: "Consolidation of Appanage Lands"
 fra_centralize_monarchy_decision.desc: "Following centuries of fragmentation, the crown has finally reclaimed many of the defunct appanage lands, reintegrating them into the royal domain once more. While the varying cadet branches of the capetian house have proven to be capable subjects, they also left any attempts for centralization impossible. With these lands now consolidated, [ROOT.GetCountry.GetGovernment.GetRuler.GetName] and his court can take steps towards reforming [GetCountry('FRA').GetName] into a more modern state."
 fra_centralize_monarchy_decision.desc.entry: "For generations the appanages were governed by cousins, which was convenient and made reform impossible. Those lands answer directly to the crown at last, and a realm that answers to one authority can finally be administered as one state."
 fra_centralize_monarchy_decision.a: "A major step towards the Modernization of [GetCountry('FRA').GetNameWithNoTooltip]."

 fra_code_louis_decision.title: "Draft the Code Louis"
 fra_code_louis_decision.desc: "Seeking to unify the laws of the land, [fra_ruler.GetName] alongside many of [fra_ruler.GetHisHer] closest advisors in the [ROOT.GetCountry.GetGovernment.GetCourtTitle] have finalized the creation of the #italic Code Louis#!, the first attempt for a unified legal code across all of [ROOT.GetCountry.GetName]. For centuries, [ROOT.GetCountry.GetNameWithNoTooltip] has existed with two perpetual, co-existing legal systems, with the northern provinces being governed by old customary laws, while in the southern provinces Roman civil laws serve as the primary legal code.\n\nWhile the Code Louis would see [ROOT.GetCountry.GetNameWithNoTooltip] legal code unified, some advisors have urged caution in rushing its implementation, as some provinces, especially southern ones previously governed by Roman Law, may face hurdles to adopt the new legal code."
 fra_code_louis_decision.desc.entry: "A merchant crossing from one province to the next changes law as surely as he changes horses. One code for all of $FRA$ would end that, though the southern provinces have kept Roman law since before there was a kingdom and will not surrender it quickly."
 fra_code_louis_decision.a: "It is time all of [ROOT.GetCountry.GetNameWithNoTooltip] follow one, uniformed law."
 fra_code_louis_decision.a.entry: "It is time all of us follow one, uniformed law."
 fra_code_louis_decision.b: "Adopt the Code in only the Northern provinces of [ROOT.GetCountry.GetNameWithNoTooltip] for now."
 fra_code_louis_decision.b.entry: "Adopt the Code in only the Northern provinces of $FRA$ for now."

 fra_versailles_residence_decision.title: "The [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] and Versailles"
 fra_versailles_residence_decision.title.entry: "The $nobles_estate$ and Versailles"
 fra_versailles_residence_decision.desc: "Ever since its construction, Versailles has quickly become a popular gathering place for [fra_ruler.GetName] and the [ROOT.GetCountry.GetGovernment.GetAdjective] family to house members of the various notable political families in [ROOT.GetCountry.GetName]. While the palace was constructed to be a symbol of the [ROOT.GetCountry.GetAdjectiveWithNoTooltip] [ROOT.GetCountry.GetGovernment.GetRulerTitle]'s 'Divine Right to Rule', it has also proven to become a symbol of political favoritism and status for those who are permitted to reside in it for some time.\n\nMany of [fra_ruler.GetHerHis] close advisors have urged [fra_ruler.GetShortNameWithNoTooltip] to extend invitations to many of the influential families still entrenched in the old feudal way in order to [ROOT.GetCountry.GetGovernment.GetCourtTitle] them to reside in Versailles. Courting these old families would allow power to further coalesce around the [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')]."
 fra_versailles_residence_decision.desc.entry: "A great house full of guests is also a great house full of hostages. The families that still hold to the old feudal habits could be invited to Versailles and flattered into staying, and every season they remain is a season the $crown_estate$ grows less afraid of them."
 fra_versailles_residence_decision.a: "Extend invitations to the prominent families to reside in Versailles."
 fra_versailles_residence_decision.b: "The palace was constructed for the [ROOT.GetCountry.GetGovernment.GetAdjective] family pleasure, let us keep it that way."
 fra_versailles_residence_decision.b.entry: "The palace was constructed for the royal family pleasure, let us keep it that way."
 this_may_lead_to_permanent_weakening_of_the_nobility: "Allowing members of the [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] to reside in Versailles may see their influence permanently weakened."

 fra_versailles_permanent_decision.title: "A Permanent Residence for the [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]"
 fra_versailles_permanent_decision.title.entry: "A Permanent Residence for the $nobles_estate$"
 fra_versailles_permanent_decision.desc: "Efforts to secure the loyalty and political influence of the [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] by allowing them residence in Versailles has proven to be quite effective, with many members from the various political families increasingly choosing to reside in the palace rather than live in their own estates. Whenever [ROOT.GetCountry.GetGovernment.GetAdjective] balls are held in Versailles, these members appear almost enthralled by the luxury of the palace, and are quick to maintain close ties with [fra_ruler.GetName] in order to stay in [fra_ruler.GetHisHer] graces.\n\nOnce a thorn in the side of the [ROOT.GetCountry.GetAdjective] [ROOT.GetCountry.GetGovernment.GetRulerTitle], Versailles has led to a near seduction of the power wielded by many belonging to the [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]. However, now it seems [fra_ruler.GetShortNameWithNoTooltip] has truly emerged as an unequal, unchallengeable [ROOT.GetCountry.GetGovernment.GetRulerTitle]."
 fra_versailles_permanent_decision.desc.entry: "The trap has closed more gently than anyone expected. The $nobles_estate$ now compete for rooms and precedence in our house rather than for power in their own, and a ruler no longer troubled by rivals is unchallenged."
 fra_versailles_permanent_decision.a: "The Eminence of Versailles has forever eclipsed the [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]."
 fra_versailles_permanent_decision.a.entry: "The Eminence of Versailles has forever eclipsed the $nobles_estate$."
 fra_versailles_permanent_decision.b: "The historical power of the [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] still has to be respected."
 fra_versailles_permanent_decision.b_tt: "We will be able to select the $permanent_residence_in_versailles$ at a later time"
 fra_versailles_permanent_decision.b.entry: "The historical power of the $nobles_estate$ still has to be respected."

 fra_marcel_great_ordinance_decision.title: "The Great Ordinance"
 fra_marcel_great_ordinance_decision.desc: "The recent conflicts have left the finances of the [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] heavily strained, forcing [ROOT.GetCountry.GetGovernment.GetRuler.GetName] to petition the Estates-General for renewed support in levying funds and forces for the [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')]. However, the recent decades have sowed discontent throughout the Estates-General, especially within the Third Estate where support for war has been met with skepticism in regards to shifting financial policies since the start of the most recent conflict. One of the growing leaders in this opposition is the influential [etienne_marcel.GetName] who has garnered great support for a counter-proposal in order to break the stalemate within the Estates-General and secure our crown new funding. In his proposed 'Great Ordinance', [etienne_marcel.GetNameWithNoTooltip] demands that the [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')] concede to limiting its authority, paving the way for [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] led reforms."
 fra_marcel_great_ordinance_decision.desc.entry: "The Estates-General has reached an stalemate in the debates to finance our current wars. The Third Estate, led by influential merchants, has proposed a 'Great Ordinance', buying their support with increased privileges and powers for themselves. We could accept their proposal, or find alternative means to secure funding from the Estates-General."
 fra_marcel_great_ordinance_decision.a: "Desperate times call for desperate measures."
 fra_marcel_great_ordinance_decision.b: "Look to the nobility for help instead!"
 fra_marcel_great_ordinance_decision.c: "Attempt to negotiate a compromise with Marcel."
 fra_marcel_great_ordinance_decision_cooldown: "Recently refused to cooperate with Marcel"
 fra_marcel_great_ordinance_decision.historical_info: "Following the Battle of Poitiers and the capture of King John II, the Dauphin Charles, now acting as Regent, was forced to convene a meeting of the Estates-General in order to handle the fallout of the battle. He met with fierce opposition from Étienne Marcel, who wielded the influence of the Third Estate. Marcel demanded that Charles agree to several agreements such as the signing of the Great Ordinance, alongside other political compromises such as the releasing of King Charles 'The Bad' of Navarre, who the former was politically aligned with. While Charles initially resisted Marcel's demands, he eventually conceded to them, and signed the Ordinance. King John II however banned the Ordinance in 1357, preventing it from coming into full effect."

 fra_marcel_compromise_decision.title: "The Great Ordinance Compromise"
 fra_marcel_compromise_decision.desc: "The [ROOT.GetCountry.GetLongName] is still immersed in war, and the hardships of our country that prompted [etienne_marcel.GetName] to make his suggestions have not lessened. We refused those suggestions in the past, but we may be forced to face the reality: without the support of the Estates-General, it may be difficult for the [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] to pull through. Perhaps it is time we reach ourselves to [etienne_marcel.GetNameWithNoTooltip] and try to review his earlier proposal in order to achieve a compromise. Granted, we will have to yield some of our own authority to him, but we could get the financial support of the Estates-General in return."
 fra_marcel_compromise_decision.desc.entry: "We refused to yield to the terms of the Great Ordinance, but we are still immersed in conflicts and the Estates-General is still willing to take advantage of the situation. If we reach out to them, maybe we can arrive at a compromise."
 fra_marcel_compromise_decision.a: "Attempt to negotiate a compromise with Marcel."
 fra_marcel_compromise_decision.a.tt: "$Marcel$ will no longer oppose us"
 fra_marcel_compromise_decision.historical_info: "$fra_marcel_great_ordinance_decision.historical_info$"

 fra_formalized_relations_decision.title: "The Affairs of [ShowRegionNameWithNoTooltip('italy_region')]"
 fra_formalized_relations_decision.desc: "Recently, there has been a renewed approach to our southern borders along the Alps. While the [ROOT.GetCountry.GetGovernment.GetAdjective] [ROOT.GetCountry.GetGovernment.GetCourtTitle] has in the past had contact with several [ShowCultureGroupName('italian_group')] states and families of [ShowRegionName('italy_region')], the ability to maintain a cohesive relationship with the region had been limited. Various advisors and courtiers have suggested to [fra_ruler.GetName] that [ROOT.GetCountry.GetName] should seek to grow our influence in the region, as while [ShowRegionNameWithNoTooltip('italy_region')] is home to varying different states, they have the potential to be powerful political allies. There are also those in the [ROOT.GetCountry.GetGovernment.GetCourtTitle] that suggest we take a more domineering approach, and seek to forcefully bring our [ShowCultureGroupNameWithNoTooltip('italian_group')] neighbors under the wing of [ROOT.GetCountry.GetNameWithNoTooltip]."
 fra_formalized_relations_decision.desc.entry: "In recent years, the passes over the Alps look less like a frontier and more like an opportunity. The [ShowCultureGroupName('italian_group')] states of [ShowRegionName('italy_region')] are wealthy, divided, and available either as allies or as subjects, depending on which counsel we choose to take."
 fra_formalized_relations_decision.a: "Seek to establish cordial relations with beneficial states."
 fra_formalized_relations_decision.b: "We should maintain a neutral policy for now."
 fra_formalized_relations_decision.c: "Our [ShowCultureGroupNameWithNoTooltip('italian_group')] neighbors would be better served under our dominion."
