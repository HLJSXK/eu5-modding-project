 charter_manila_galleon.title: "Charter a Manila Galleon"
 charter_manila_galleon.desc: "With the return route across the Pacific charted and proven, the ocean is no longer a barrier but a road. Let us fit out a great galleon on our western coast, load her holds with silver, and send her along the northern passage to Asia and back — silver going out, silk and spices coming home. The outlay is heavy and the voyage long, but a single galleon safely returned pays for itself many times over. She will not be back within the year, and the sea may yet take her; but if she comes home, so will her fortune."
 charter_manila_galleon.a: "Fit out the galleon and load the season's silver."
