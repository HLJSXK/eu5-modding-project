l_english:
 eng_yorkist_tradition_decision.title: "Recruitment of Middle-class Bureaucrats"
 eng_yorkist_tradition_decision.desc: "It is becoming increasingly difficult to source talented men to take on government postings, and voices have been raised that we ought to widen the selection to encompass the expanding middle-class, notably lawyers in addition to members of the [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]. Both parties eagerly await to see if we will implement such a policy to heed the calls for change."
 eng_yorkist_tradition_decision.desc.entry: "The middle class is expanding, and thus some have raised the need to include some of them in government positions. Being able to find people of talent to employ, so including the middle class among our pool to draw from would certainly widen our options."
 eng_yorkist_tradition_decision.a: "Give them our support."
 eng_yorkist_tradition_decision.b: "They have no place in Governance."
 enable_yorkist_tradition_policy: "Grants access to the [ShowPolicyName('yorkist_tradition_policy')] [policy|e]"
 eng_yorkist_tradition_decision.historical_info: "Promoting government officials from the middle class, primarily clerics and lawyers, was a long-held Yorkish tradition in England. It was firmly opposed by the nobility and the clergy, who saw it as a privilege unique to men of higher social status or divine appointment."

 eng_court_of_the_star_chamber_decision.title: "Court of the Star Chamber"
 eng_court_of_the_star_chamber_decision.desc: "Justice is currently dispensed to the best capacity of the [ShowPolicyName('common_law_policy')]. Yet, proceedings are tediously slow as they rely on precedent and the decisions of judges. Certain cases take weeks, if not months, before a verdict is reached. There are calls for a secondary judiciary court with a certain degree of flexibility in its procedures, allowing it to handle cases considered too sensitive or complex for ordinary law courts. However, a potential but modest effect could be the extension of the [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] power, suppressing opposition, and punishing dissent when needed."
 eng_court_of_the_star_chamber_decision.desc.entry: "Precedent is our traditional way of dispending justice, but it necessarily makes the procedures slow and case rulings to take a long time. A second bench, free to set its own procedure, would dispose of such matters quickly, it could become a habit that would serve the $crown_estate$ well."
 eng_court_of_the_star_chamber_decision.a: "An integral tool."
 eng_court_of_the_star_chamber_decision.b: "[ShowPolicyNameWithNoTooltip('common_law_policy')] will suffice."
 enable_court_of_the_star_chamber_reform: "Grants access to the [ShowGovernmentReformName('court_of_the_star_chamber_reform')] [government_reform|e]"
 eng_court_of_the_star_chamber_decision.historical_info: "The Court of Star Chamber emerged from the meetings of the king's Privy Council, gradually gaining significance during the reign of Henry VII. Its name originated from the star pattern adorning the ceiling of Westminster Palace, where it convened. In 1487, the Court was established as a distinct judicial body, separate from the Council, tasked with hearing petitions for redress."

 eng_benevolence_tax_decision.title: "Establish the Benevolence Tax"
 eng_benevolence_tax_decision.desc: "On account of the excellent management of the country, [ROOT.GetCountry.GetGovernment.GetRuler.GetName] has successfully restored the power and stability of the [ROOT.GetCountry.GetAdjective] monarchy following the [ShowDisasterName('war_of_the_roses')]. Credited to the close attention to detail and opposition to lavish spending, [ROOT.GetCountry.GetGovernment.GetRuler.GetHisHer] focus seems to have turned towards raising new revenues by introducing a ruthlessly efficient mechanism of taxation."
 eng_benevolence_tax_decision.desc.entry: "A ruler who spends little and counts carefully soon notices how much everyone else is spending. The peace won after the [ShowDisasterName('war_of_the_roses')] has left the treasury stable and the ruler's attention free to wander toward the purses of the wealthy."
 eng_benevolence_tax_decision.a: "Peace and economic prosperity."
 eng_benevolence_tax_decision.b: "Let us bask in the stability we have created."
 eng_benevolence_tax_decision.a.custom: "Grants access to the [ShowGovernmentReformName('benevolence_tax_reform')] [government_reform|e]"
 eng_benevolence_tax_decision.historical_info: "The reign of Henry VII helped stabilize the kingdom's finances and consolidated the power of the monarchy. With the help of his chancellor, John Morton, the King introduced the payment of a benevolence tax with the reasoning that someone living modestly must be saving money, and therefore could afford the benevolence, whereas someone living extravagantly was obviously rich, and could therefore also afford to pay it."

 eng_council_of_the_north_decision.title: "Council of the North"
 eng_council_of_the_north_decision.desc: "It has been suggested that the lack of conciliar justice in the north is further exacerbated by the sheer distance to [ROOT.GetCountry.GetCapital.GetName]. Setting up an independent council in [target_location.GetName] to deal with such matters would delegate some authority in return for ensuring that justice is upheld."
 eng_council_of_the_north_decision.desc.entry: "Justice delayed by three weeks of hard riding is justice denied. A council seated at [ShowLocationName('york')] with authority of its own would answer the northern counties without their petitions crossing the whole country first, at the price of authority we can no longer exercise ourselves."
 eng_council_of_the_north_decision.a: "We are in agreement."
 eng_council_of_the_north_decision.b: "Red tape is not the solution."
 eng_council_of_the_north_decision.b_tt: "Every location in [ShowAreaName('northumbria_area')] will gain the [ShowModifier('lack_of_conciliar_justice')] [modifier|e]"
 STATIC_MODIFIER_NAME_lack_of_conciliar_justice: "Lack of Conciliar Justice"
 eng_council_of_the_north_decision.historical_info: "The Council of the North was an administrative body that was set up with the intended goal of exerting more direct control over the northern counties. The main function of the council was to maintain law and order and ensure the loyalty of the Crown's most northern subjects. It was eventually abolished in 1641 during the English Civil War."

 eng_austere_monastic_life_decision.title: "The Reformation of the Monasteries"
 eng_austere_monastic_life_decision.desc: "The excessive wealth of religious orders in [ROOT.GetCountry.GetName] has long been a thorn in the side of the reformists. Discontent among the [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')] against powerful ecclesiastical institutions is another contributing factor for seeking change.\n\nWe could attempt to reform these practices and return religious orders to the austere and cloistered ideal.\n\nA total of #Y [ROOT.GetVariable('num_of_monasteries').GetValue]#! monasteries appear in records following visitations."
 eng_austere_monastic_life_decision.desc.entry: "Nothing offends the poor quite so much as a wealthy hermit. The reformists have been saying so for years, the $peasants_estate$ have started agreeing with them, and returning the orders to their vows would be popular with everyone except the orders themselves."
 eng_austere_monastic_life_decision.a: "Reform."
 eng_austere_monastic_life_decision.a.custom: "Monastic orders see an exodus of members who rejoin the [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')]"
 eng_austere_monastic_life_decision.b: "$common_string_leave_them_be$"
 eng_austere_monastic_life_decision.b.custom: "[ShowPopTypeName('clergy')] in monastic orders gain [ShowNamedValue('pop_satisfaction_extreme_bonus')|+=2%] [pop_satisfaction|e]"
 eng_austere_monastic_life_decision.tt: "It will not be possible to dissolve the monasteries unless this [privilege|e] is revoked"
 eng_austere_monastic_life_decision.historical_info: "The Reformation or Dissolution of the Monasteries was a major event during the 16th century following England's embrace of the Reformation. Thomas Cromwell, the chief minister to the King, initially sought to dismantle the monastic system, which was seen as an extension of the Roman Catholic Church. The event culminated in the closure of religious houses, including monasteries, abbeys, and convents all across England."

 eng_navy_board_decision.title: "The Navy Board"
 eng_navy_board_decision.desc: "It has been acknowledged that our borders are somewhat vulnerable to foreign invasion. To safeguard the future of [ROOT.GetCountry.GetName], we must exert control over the seas surrounding our island to thwart any attempts at encroachment on our lands.\n\nBy expanding our logistical capabilities and streamlining the management of our fleet, we can bolster shipbuilding efforts as well as support a larger navy at reduced expense."
 eng_navy_board_decision.desc.entry: "An island is only as safe as the water around it, and ours is watched by fleets we did not build. Putting the yards, stores, and victualling under one board would let us keep more ships at sea for the same coin, which is the only kind of naval expansion we can presently afford."
 eng_navy_board_decision.a: "Make the necessary changes."
 eng_navy_board_decision.b: "The Army is what matters."
 enable_navy_board_reform: "Grants access to the [ShowGovernmentReformName('navy_board_reform')] [government_reform|e]"
 eng_navy_board_decision.historical_info: "In the 16th century, during the reign of King Henry VIII, the Navy Board was established to oversee naval affairs, including shipbuilding and logistical management. Under Henry's guidance, the Navy Board facilitated the expansion of the English fleet, with the aim of transforming it into a force to be reckoned with and ensure England's security from foreign invasions."

 eng_grand_remonstrance_decision.title: "The Grand Remonstrance"
 eng_grand_remonstrance_decision.desc: "A Parliament representative has presented a list of grievances that they feel would rectify their concerns regarding corruption and spiritual influence in matters of state. They point out that [ROOT.GetCountry.GetGovernment.GetRuler.GetName] has been ruling without summoning Parliament for a considerable time, and now seek to preserve their rights and privileges by curbing the power of the monarchy.\n\nAdditionally, there is the issue of the king's counselors within the [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')], whose presence is seen as an extension of the Church's influence in state matters. There has been a proposal to bar clergy members from participating in the cabinet. In return, Parliament would be more supportive of future legislation."
 eng_grand_remonstrance_decision.desc.entry: "Parliament has drawn up its grievances in writing, which is what men do when they intend to be answered rather than heard. They want the monarchy checked and the $clergy_estate$ turned out of the cabinet, and in exchange they hint at a cooperation we have not enjoyed for years."
 eng_grand_remonstrance_decision.a: "Draft a carefully worded refusal."
 eng_grand_remonstrance_decision.b: "Agree to the terms."
 eng_grand_remonstrance_decision.c: "Attempt to reach a compromise."
 eng_grand_remonstrance_decision.tt1: "Parliament may react with hostility and attempt to curb royal powers by any means necessary"
 STATIC_MODIFIER_NAME_grand_remonstrance_refused: "Grand Remonstrance Refused"
 eng_grand_remonstrance_decision.b.custom: "The [ShowGovernmentReformName('grand_remonstrance_reform')] [government_reform|e] is implemented"
 eng_grand_remonstrance_decision.c.custom1: "The low diplomatic skill of our ruler makes it unlikely to succeed"
 eng_grand_remonstrance_decision.c.custom2: "The diplomatic skill of our ruler may sway enough members of parliament"
 eng_grand_remonstrance_decision.tt2: "The compromise may not have a favorable outcome"
 eng_grand_remonstrance_decision.historical_info: "The Grand Remonstrance was a political document presented to King Charles I of England in 1641 by Parliament. It highlighted their frustration with the king and proposed sweeping changes to limit his ability to interfere with parliamentary proceedings. It also addressed fears of Catholicism and expressed concerns about the influence of the king's advisers. Shortly after the Grand Remonstrance was handed over, tensions between Parliament and the king escalated, which would culminate in the outbreak of the English Civil War."

 eng_overhauled_admiralty_decision.title: "Overhaul the Board of Admiralty"
 eng_overhauled_admiralty_decision.desc: "A naval administrator is showing great potential despite the lack of maritime experience. The influence, diligence, and talent of [samuel_pepys.GetName] could help reform the Board of Admiralty and contribute to the professionalization of the Royal Navy."
 eng_overhauled_admiralty_decision.desc.entry: "The Navy has never wanted for brave captains, only for someone able to count its stores. $name_samuel$ $Pepys$ has never commanded a ship and is very likely the right man for exactly that reason."
 eng_overhauled_admiralty_decision.a: "Appoint him Secretary of the Board."
 eng_overhauled_admiralty_decision.b: "Reap the rewards of his ongoing labor."
 enable_overhauled_admiralty_reform: "Grants access to the [ShowGovernmentReformName('overhauled_admiralty_reform')] [government_reform|e]"
 STATIC_MODIFIER_NAME_samuel_pepys_diligence: "Diligence of Samuel Pepys"
 eng_overhauled_admiralty_decision.tt3: "his work on the Navy Board streamlines the operational ability of the Navy"
 eng_overhauled_admiralty_decision.historical_info: "The work of Samuel Pepys was integral to the Royal Navy in modernizing and reforming the navy during a significant period in its history. Some of the changes included the improvement of the supply and provisioning of the navy and the establishment of a system of regular pay for sailors and officers. Today he is mostly remembered for the extensive diary he kept for a period of ten years, recording every detail of his life and providing a meticulous record of historical events such as the Great Fire and the Great Plague of London."

 eng_taxation_law_decision.title: "The Income Tax"
 eng_taxation_law_decision.desc: "The country's financial situation remains rather delicate, prompting discussions about the need for reform. There's a prevailing sentiment that the current taxation systems disproportionately benefit the wealthy while yielding little government revenue. Cabinet member [william_pitt_the_younger.GetName] is advocating for temporary income taxation to shore up the country's finances and redistribute wealth, a proposal which will not sit well with the [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] and the [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]."
 eng_taxation_law_decision.desc.entry: "A tax that spares the rich raises little and satisfies no one. $name_william$ $Pitt$ proposes to take a share of income directly, for a limited term and with no exemptions worth the name, which is why the $nobles_estate$ and the $clergy_estate$ will fight it to the last."
 eng_taxation_law_decision.a: "Fair and progressive."
 eng_taxation_law_decision.b: "Customs duties and Excise taxes will sustain us."
 eng_taxation_law_decision.c: "A political hot potato."
 eng_taxation_law_decision.custom: "Grants access to the [ShowLawName('eng_taxation_law')] [law|e]"
 eng_taxation_law_decision.tt: "Parliament is displeased by the disregard for the delicate state of [target_root_country.GetNameWithNoTooltip]'s financial stability"
 STATIC_MODIFIER_NAME_temporary_income_tax: "Temporary Income Tax"
 eng_taxation_law_decision.historical_info: "The income tax was introduced by British Prime Minister William Pitt the Younger to address the financial strain caused by the ongoing Napoleonic Wars. Pitt's income tax was designed as a progressive tax, meaning that individuals with higher incomes paid a higher percentage of their income in taxes. It faced opposition from high-income earners and was eventually repelled following the conclusion of the war."

 eng_factory_working_conditions_decision.title: "The Factory Act"
 eng_factory_working_conditions_decision.desc: "Reformers are championing improved working rights for factory workers who are often subject to seamless exploitation, inadequate protection, and low wages. Any attempt to alter the current situation is expected to face opposition and potentially have adverse effects on economic growth and productivity. Nevertheless, we risk an exodus of workforce if the situation does not improve."
 eng_factory_working_conditions_decision.a: "The poor souls are in need of relief."
 eng_factory_working_conditions_decision.b: "The workers power the economic engine."
 eng_factory_working_conditions_decision.c: "The ingrates could show some gratitude."
 eng_factory_working_conditions_decision.custom: "Grants access to the [ShowLawName('factory_working_conditions_law')] [law|e]"
 eng_factory_working_conditions_decision.historical_info: "The Factory Act was a major piece of legislation in Britain and marked a turningpoint in the efforts to improve working conditions and protect the rights of factory workers, especially children who would otherwise work for most of the day for little pay. The act introduced age restrictions, educational requirements and factory inspections, and forced factory owners to improve general safety as well as keep employment records."

 eng_coke_smelting_decision.title: "Invest in the Work of the Darby's"
 eng_coke_smelting_decision.desc: "Pioneering ironmaster [abraham_darby.GetName] has developed a new source of fuel used in blast furnaces. This fuel, known simply as 'coke', is considered less volatile and capable of generating a consistently higher heat compared to the industry's current preference, charcoal. [abraham_darby.GetNameWithNoTooltip] is now conducting a trial implementation at his family-owned [ShowBuildingTypeName('iron_foundry')],with promising results."
 eng_coke_smelting_decision.desc.entry: "Charcoal burns hot enough for a smith and never quite hot enough for a furnace. $name_abraham$ $Darby$ has been baking coal into something steadier, and the first trials at his [ShowBuildingTypeName('iron_foundry')] suggest iron could soon be made in quantities the forests could never have supported."
 eng_coke_smelting_decision.a: "Make it an industry norm."
 eng_coke_smelting_decision.tt2: "The new source of processed fuel requires larger quantities of [ShowGoodsName('coal')]"
 enable_coke_smelting_advance: "Grants access to the [ShowAdvanceName('coke_smelting')] [advance|e]"
 unlocked_advance_coke_smelting_tt: "Has taken the $eng_coke_smelting_decision.title$ [decision|e]"
 eng_coke_smelting_decision.historical_info: "The coke smelting process invented by Abraham Darby I is regarded as a major catalyst that significantly advanced the Industrial Revolution. Its immediate effects were a fundamental transformation in iron production techniques, which would allow for the widespread adoption of iron and steel across a variety of industries. It also laid the foundation for the mass production of cast iron, which was crucial to the Industrial Revolution."

 eng_royal_society_decision.title: "The Royal Society"
 eng_royal_society_decision.desc: "The gathering of our greatest scientific minds has produced some of the greatest inventions in our society. We could set up an independent body, governed by its own council and headquartered in [ROOT.GetCountry.GetCapital.GetName], to promote science and its benefits and recognize and support outstanding science. It would also provide scientific advice for policy and education, applying focus to our research efforts."
 eng_royal_society_decision.desc.entry: "Learned men already meet, correspond, and quarrel without any help from us; what they lack is a roof and a charter. Granting both would put the country's natural philosophers within reach of our questions as well as their own."
 eng_royal_society_decision.a: "Marvellous idea."
 eng_royal_society_decision.b: "Invest in our universities instead."
 eng_royal_society_decision.historical_info: "The Royal Society was founded in 1660, during the reign of King Charles II of England. Its orchestrators were leading members of the scientific community, who were deeply committed to expanding the boundaries of scientific understanding and ensuring the advancement of science. The goal was to create a platform where scientists, scholars, and intellectuals could meet and exchange their research findings, in order to foster ideas into tangible results."
 eng_royal_society_decision.tt1: "Our ruler becomes patron of this newly formed learned society"

 eng_royal_academy_of_arts_decision.title: "Royal Academy of Arts"
 eng_royal_academy_of_arts_decision.desc: "It has been suggested that an institution tasked with promoting creativity and advance the arts be set up, with funding provided by [ROOT.GetCountry.GetGovernment.GetRuler.GetName]. It should serve as a school or academy of design for the use of students in the arts, with an annual exhibition of contemporary art arranged, which would be open to all artists."
 eng_royal_academy_of_arts_decision.desc.entry: "Painters trained abroad bring back foreign taste along with their technique. An academy of our own, with a school, a yearly exhibition open to any artist, and the ruler's purse behind it, would let the next generation learn its trade at home."
 eng_royal_academy_of_arts_decision.a: "Artfully approved!"
 eng_royal_academy_of_arts_decision.b: "Better spent on educating the poor."
 STATIC_MODIFIER_NAME_increased_educational_spending: "Increased Educational Spending"
 eng_royal_academy_of_arts_decision.historical_info: "The Royal Academy of Arts is a privately funded institution dedicated to the promotion of visual arts and architecture. It was founded in 1768 by a group of artists, including Sir Joshua Reynolds and Sir William Chambers, with King George III as the academy's first royal patron. Membership in the Royal Academy is highly prestigious and is awarded to artists and architects who have made significant contributions to their respective fields."

 eng_enclosure_act_decision.title: "The Enclosure Act"
 eng_enclosure_act_decision.desc: "Factory and land owners are petitioning Parliament to allow for further privatization of public lands, to expedite the migration of workforce from rural locations to urban areas. Although likely to cause significant social displacement, it would also ensure the ample availability of the workforce and boost the overall agricultural output."
 eng_enclosure_act_decision.a: "A displaced worker is a productive worker."
 eng_enclosure_act_decision.a.custom: "Resentful [ShowPopTypeName('peasants')] riot, and 10 rural [locations|e] lose [ShowNamedValue('pop_satisfaction_ultimate_penalty')|+=2%] [prosperity|e]"
 eng_enclosure_act_decision.tt: "The Act speeds up the process of urbanization and encourage further industrialization at the expense of the [ShowEstateTypeName('peasants_estate')]"
 enable_enclosure_act_policy: "Grants access to the [ShowPolicyName('enclosure_act')] [policy|e]"
 enclosure_riots: "Enclosure Riots"
 eng_enclosure_act_decision.historical_info: "The Enclosure Acts were a series of laws enacted in England that allowed for further enclosure, or privatization, of common lands and open fields. They were part of broader economic and agricultural transformations deemed necessary to support the rise of commercial agriculture and the growth of industrialization. The Acts contributed to social inequality and led to the displacement of thousands of rural laborers who were forced to seek employment in the cities. It culminated in riots by dispossessed farmers and laborers who resisted the loss of their traditional rights."

 sco_witchcraft_act_decision.title: "The [ROOT.GetCountry.GetAdjectiveWithNoTooltip] Witchcraft Act"
 sco_witchcraft_act_decision.title.entry: "The Witchcraft Act"
 sco_witchcraft_act_decision.desc: "The increasing popular aversion towards witches and witchcraft has been increasingly brought to the attention of the court. Reports of witches' activities pile up in front of [ROOT.GetCountry.GetGovernment.GetRuler.GetName], requiring a prompt resolution. The reports are wide-ranging, from the seemingly harmless local healer accused of brewing potions to alleged demonic possessions. There is even a farmer who swears he got turned into a newt once but got better.\n\nProposals for a new act persecuting witches are increasing, and the [ROOT.GetCountry.GetGovernment.GetRulerTitle] has started also expressing [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] own opinion on the matter."
 sco_witchcraft_act_decision.desc.entry: "The court now receives more accusations of sorcery than of theft, and someone must decide which of them are worth an assize. A statute would at least put the matter on a legal footing, though a law against witches has the curious property of producing more of them."
 sco_witchcraft_act_decision.a: "Defend the Witchcraft Act."
 sco_witchcraft_act_decision.b: "Denounce it."
 sco_witchcraft_act_decision.historical_info: "The Scottish Witchcraft Act of 1563 made both practicing witchcraft and the fact of consulting with witches capital offenses. James VI played a major part in it through his role in the North Berwick witch trials, which were the first major series of trials under the new act. The King published a defense of witch-hunting in the 'Daemonologie' in 1597 but later became increasingly skeptical and took steps to limit prosecutions. Scotland tried an estimated 6,000 people for witchcraft, where seventy-five percent of the accused were women, and over 1,500 people were executed."

 sco_preserve_clan_autonomy_decision.title: "The Statutes of Iona"
 sco_preserve_clan_autonomy_decision.desc: "While many of the [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] residing in the [ROOT.GetCountry.GetAdjective] lowlands have taken to having their heirs educated in local schools, many of the remaining [ShowCultureName('highland')] clans still follow traditional education.\n\nAs time has progressed, this has grown to be seen as a detriment to [ROOT.GetCountry.GetNameWithNoTooltip]. Some within the [ROOT.GetCountry.GetGovernment.GetCourtTitle] have suggested that a new policy be enacted that would force members of these clans to enroll their heirs into one of the various schools in the lowlands of [ROOT.GetCountry.GetNameWithNoTooltip].\n\nThe policy would no doubt produce a more educated generation of clan leadership, some worry it will see the [ShowCultureNameWithNoTooltip('highland')] clans become akin to that of the lowlands."
 sco_preserve_clan_autonomy_decision.desc.entry: "A clan that schools its heirs at home raises men loyal to the clan; a clan that sends them south raises men loyal to whoever taught them. Compelling the [ShowCultureName('highland')] chiefs to do the latter would give us a more useful generation of lairds, and a less Highland one."
 sco_preserve_clan_autonomy_decision.a: "Implement the Statutes."
 sco_preserve_clan_autonomy_decision.b: "Their old rights shall be reinforced."

 eng_east_india_company_decision.title: "The [ROOT.GetCountry.GetAdjectiveWithNoTooltip] East Indian Company"
 eng_east_india_company_decision.title.entry: "The East Indian Company"
 eng_east_india_company_decision.desc: "As all other nations in this time with a coastline, the [ROOT.GetCountry.GetLongName] has also managed to duplicate the efforts of their overseas expansions, and have found a route to the East Indies. Creating a company to exploit its many riches will for sure be to our benefit."
 eng_east_india_company_decision.desc.entry: "The route east is no longer a secret worth keeping, and every rival with a harbor is already sailing it. A chartered company would let private money carry the risk of the voyages while the crown collects on what comes back."
 eng_east_india_company_decision.a: "We will exploit this!"
 eng_east_india_company_decision.b: "Let us focus on the homeland."

 sco_company_of_scotland_decision.title: "Found the [ShowGovernmentReformNameWithNoTooltip('company_of_scotland')]"
 sco_company_of_scotland_decision.desc: "With our increased interest in overseas trade, the lack of governmental oversight of our intercontinental trade routes is growing more and more concerning. We should grant monopolies of trade to worthwhile individuals, tasked with the organization of our shipping and protection of our investments."
 sco_company_of_scotland_decision.a: "The Company will bring prosperity to our country!"
 sco_company_of_scotland_decision.b: "This does sound a bit risky."
