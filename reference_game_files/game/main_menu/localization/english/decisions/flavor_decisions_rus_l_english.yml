l_english:
 mos_prikazi_decision.title: "Establish the $prikazi_reform$ Offices"
 mos_prikazi_decision.desc: "The absence of an efficient administration is seen as a hindrance for [ROOT.GetCountry.GetName] to take its rightful place among the great powers. We could improve the governance by setting up a series of offices to oversee different areas of governmental affairs, which in turn can expedite the implementation of various decrees by [ROOT.GetCountry.GetGovernment.GetRuler.GetName] and help centralize power."
 mos_prikazi_decision.desc.entry: "A ruler who signs a decree has no guarantee anyone downriver will read it, let alone obey it. Standing offices, each answerable for one part of the state's business, would carry the ruler's word further than the ruler's reputation ever could alone."
 mos_prikazi_decision.a: "How are we to function otherwise."
 mos_prikazi_decision.b: "Free reins are the recipe for success."
 mos_prikazi_decision.tt1: "Several bureaus are set up, enabling [cabinet_members|e] to oversee them via [cabinet_action|e]"
 enable_prikazi_reform: "Grants access to the [ShowGovernmentReformName('prikazi_reform')] [government_reform|e]"
 mos_prikazi_decision.historical_info: "Prikazi refers to the administrative offices in place during the time of the Tsardom and the early Russian Empire. They were essential for implementing the policies and decisions of the Tsar but also dealt with day-to-day functions related to state affairs. Some of the larger offices dealt with matters concerning foreign affairs and were crucial during a time when Russia saw itself surrounded by enemies and still struggling to assert its independence from the Golden Horde."

 mos_razriadnyi_decision.title: "[ShowGovernmentReformNameWithNoTooltip('razriadnyi_reform')]"
 mos_razriadnyi_decision.desc: "There are few available records of population, property, and taxation which makes it harder to control spending and fund an expansion of our administration. We could conduct a regular census, conducted by the newly established [ShowGovernmentReformName('razriadnyi_reform')], that would provide detailed records of individuals and households across [ROOT.GetCountry.GetName], in order to assess the resources and obligations of our subjects."
 mos_razriadnyi_decision.desc.entry: "A treasury that cannot count its subjects cannot honestly tax them, and ours has been guessing for years. A standing census bureau would put a real number on what we can raise in men and coin, which is worth knowing even before the first campaign it pays for."
 mos_razriadnyi_decision.a: "Examine every nook and cranny."
 mos_razriadnyi_decision.b: "A breach of privacy and integrity."
 enable_razriadnyi_reform: "Grants access to the [ShowGovernmentReformName('razriadnyi_reform')] [government_reform|e]"
 mos_razriadnyi_decision.historical_info: "The Military Chancellery, #italic Razriadnyi Prikaz#!, introdcued a new Census as a means of determining the tax liability of the population based on wealth, property, and social standing. It was also a way of ensuring each estate provided the required amount of soldiers and war materials in accordance with their obligations. The records became instrumental in order to rule over a vast and diverse territory."

 mos_build_kremlin_decision.title: "Construct the Kremlin"
 mos_build_kremlin_decision.desc: "The Rus' lands are repeatedly subject to raids and it is imperative that we are able to protect our people during times of trouble. The fortification system surrounding [target_location.GetName] is not up for the task and could be overrun, setting back our progress towards becoming a regional power.\n\nWe should construct a powerful fortification with wall sections that will rival anything in the vicinity."
 mos_build_kremlin_decision.desc.entry: "Raiders do not wait for walls to be finished before testing them, and ours would not survive the testing. Rebuilding the defenses of [ShowLocationName('moscow')] costs a fortune we would rather not spend, but losing the city costs considerably more."
 mos_build_kremlin_decision.a: "Have the finest [ShowGoodsNameWithNoTooltip('lumber')] brought in."
 mos_build_kremlin_decision.b: "We do not wish to provoke our neighbors."
 mos_build_kremlin_decision.c: "Ransack a subject [ShowBuildingTypeNameWithNoTooltip('castle')] for materials."
 threatened_by_military_expansion: "Threatened by Military Expansions"
 safe_haven_during_raids: "Provides Safe Haven during Raids"
 mos_build_kremlin_decision.tt1: "Rival neighbors perceive the construction of a powerful [ShowBuildingTypeNameWithNoTooltip('kremlin')] as a hostile act"
 mos_build_kremlin_decision.tt2: "Neighboring subjects consider the construction of a powerful [ShowBuildingTypeNameWithNoTooltip('kremlin')] a safe haven during raids"
 mos_build_kremlin_decision.a.custom1: "Every neighbor country loses [ShowBiasValue('threatened_by_military_expansion')|+=0] [opinion|e] of us"
 mos_build_kremlin_decision.a.custom2: "Every neighbor [subject|e] gains [ShowBiasValue('safe_haven_during_raids')|+=0] [opinion|e] of us"
 mos_build_kremlin_decision.b.custom1: "Every neighbor country gains #G 3#! [trust|e] of us"
 mos_build_kremlin_decision.b.custom2: "Every neighbor [subject|e] loses [ShowBiasValue('lack_of_protection')|+=0] [opinion|e] of us"
 lack_of_protection: "Lack of Protection"
 mos_kremlin_construction: "Kremlin Construction"
 mos_build_kremlin_decision.tt3: "Almost all the [ShowGoodsName('clay')] and [ShowGoodsName('lumber')] needed is obtained by forcibly demolishing the [ShowBuildingTypeNameWithNoTooltip('castle')] at one of our subjects' locations"
 mos_build_kremlin_decision.historical_info: "The original Moscow Kremlin was mainly constructed from wood and came to include not only walls and towers, but also many administrative buildings. Its construction was an expensive project, but it was considered necessary due to the proved ineffectiveness of the simple wooden ramparts used until then against repeated Tatar slave raids and enemy sieges."

 mos_vestiarium_decision.title: "The Vestiarium"
 mos_vestiarium_decision.desc: "The royal treasury remains undocumented and lacks any kind of inventory, making it challenging to ascertain the overall value of accumulated assets. It is imperative that we create a means of better managing our wealth since it can be used to forward both diplomatic goals and help strengthen the governance of the whole country."
 mos_vestiarium_decision.a: "Efficient governance is key to success."
 mos_vestiarium_decision.b: "The web of diplomacy must be spun."
 mos_vestiarium_decision.custom: "Grants access to the [ShowLawName('vestiarium')] [law|e]"
 mos_vestiarium_decision.historical_info: "The #italic Vestiarium#! of Vasili I was an inventory of valuable items belonging to the royal treasury. It was introduced to create a financial and inventory record of anything ranging from precious metals, jewelry, textiles and clothing, items that could be used for state ceremonies and diplomatic gifts."

 mos_byzantine_court_ceremonies_decision.title: "Ties to the Old $BYZ_ADJ$ Dynasty"
 mos_byzantine_court_ceremonies_decision.desc: "The fall of [ShowLocationName('constantinople')] has presented us with the option of marrying into the former ruling class of [GetCountry('BYZ').GetName]. [sophia_palaiologina.GetName]'s hand in marriage would introduce the influences of [GetCountry('BYZ').GetAdjectiveWithNoTooltip] culture to [ROOT.GetCountry.GetGovernment.GetCourtTitle], strengthen our claim as the natural successor of the Roman Empire and torchbearer of the [ShowReligionAdjective('orthodox')] faith, and any offspring of the [ROOT.GetCountry.GetGovernment.GetRulerTitle] would be able to claim their descent from the emperors of the fallen empire."
 mos_byzantine_court_ceremonies_decision.desc.entry: "A crown taken by conquest is still a crown taken by force; a crown joined by marriage looks more like inheritance. Marrying the blood of [ShowLocationName('constantinople')] to our line, any child of that match could one day claim descent from emperors rather than mere conquerors."
 mos_byzantine_court_ceremonies_decision.a: "A prophesized match."
 mos_byzantine_court_ceremonies_decision.a_tt: "Our ruler will marry an offspring of the byzantine ruling dynasty, divorcing the current spouse if necessary."
 mos_byzantine_court_ceremonies_decision.b: "It offers little advantage."
 mos_byzantine_court_ceremonies_decision.tt1: "A descendant of the ruling Byzantine dynasty is added as a [character|e]"
 enable_byzantine_court_ceremonies_reform: "Grants access to the [ShowGovernmentReformName('byzantine_court_ceremonies_reform')] [government_reform|e]"
 mos_byzantine_court_ceremonies_decision.tt2: "Her resentment shown towards certain diplomats sours diplomatic relations between us and our [heathen|e] neighbors"
 STATIC_MODIFIER_NAME_mongol_intolerance: "Mongol Intolerance"
 mos_byzantine_court_ceremonies_decision.historical_info: "The marriage between Ivan III and Sophia Palaiologina introduced elaborate court ceremonies and etiquette to the Muscovite court, which helped to further its claim as the Third Rome. Sophia would give birth to eleven children and was to become grandmother of the infamous Ivan the Terrible. Her intolerance towards Mongol overlordship caused several diplomatic incidents and helped accelerate Muscovy's break from the Golden Horde in 1480."

 mos_monastic_reformation_decision.title: "Institutionalize the Teachings of Nil Sorsky"
 mos_monastic_reformation_decision.desc: "Spiritual pioneer Nil Sorsky is campaigning for reform within the Church as a response to the wealth and materialism that has crept into some [ROOT.GetCountry.GetAdjective] monasteries. His movement, known as the Non-Possessors, is proposing a return to the principles of poverty and humility, with emphasis on a simple lifestyle fully devoted to the teachings of Christ. Any such attempts will likely encounter resistance by the established Church, who believe it is imperative to retain some material wealth in order to carry out its functions."
 mos_monastic_reformation_decision.desc.entry: "Nil Sorsky preaches that a monk who owns land has already lost the argument for owning nothing else, and enough of the clergy agree with him to make the Church nervous. Supporting the Non-Possessors costs us the goodwill of every wealthy monastery, but buys the loyalty of every monk who never wanted one."
 mos_monastic_reformation_decision.a: "Support the Non-Possessors."
 mos_monastic_reformation_decision.b: "Support the Possessors."
 mos_monastic_reformation_decision.custom1: "Grants access to the [ShowLawName('monastic_reformation_movement')] [law|e]"
 mos_monastic_reformation_decision.custom2: "A [policy|e] under the [ShowLawName('monastic_reformation_movement')] [law|e] may only be changed once every ten years"
 mos_monastic_reformation_decision.historical_info: "Nil Sorsky was a Russian Orthodox monk who helped shape the movement known as the Non-Possessors. It consisted of monks who sought a strict adherence to monastic poverty, thereby criticizing the ownership of land and wealth by the monasteries. The teachings faced opposition from some within the Church who were resistant to the changes proposed. Nevertheless, his teaching left a lasting mark on Russian spirituality and Nil Sorsky is today regarded as a saint in the Eastern Orthodox Church."

 mos_stroganov_school_decision.title: "Establish the Stroganov School"
 mos_stroganov_school_decision.desc: "The wealthy [ShowDynastyName('stroganov_dynasty')] merchant family are strong supporters of the Arts and are considering the sponsorship of a local school for the creation of religious icons, much of which is used to adorn their many palaces across the [ROOT.GetCountry.GetFlavorRank]. Any art pieces created by the school would be designed specifically for private use and are unlikely to benefit the country as a whole, but will reaffirm the support of the powerful family and contribute towards the spiritual well-being of [ROOT.GetCountry.GetName]."
 mos_stroganov_school_decision.desc.entry: "The [ShowDynastyName('stroganov_dynasty')] want icons for their own chapels, not saints for the nation, and they are prepared to pay for the privilege. A school built on their coin produces nothing the treasury can spend, only a family that owes us less and expects more."
 mos_stroganov_school_decision.a: "We scratch each other's backs."
 mos_stroganov_school_decision.b: "Promote their business instead."
 mos_stroganov_school_decision.c: "Have them wield influence at court."
 enable_stroganov_influences_cabinet_action: "The [ShowCabinetActionName('stroganov_influences')] [cabinet_action|e] becomes available to members of the [ShowDynastyNameWithNoTooltip('stroganov_dynasty')] dynasty"
 mos_stroganov_school_decision.historical_info: "The Stroganov School of icon-painting was founded during a period when medieval painting thrived in Russia, predating the onset of Westernization of art that later extended to Eastern Europe. The art created was very much a reflection of the tastes of royal and noble patrons, eventually including the Tsar. The school enjoyed popularity until the establishment of Saint Petersburg, which hastened its decline as Western influences gradually took hold."

 mos_novodevichy_convent_decision.title: "The Novodevichy Convent"
 mos_novodevichy_convent_decision.desc: "In the wake of the triumphant conquest of [ShowAreaName('smolensk_area')], an opportunity arises to commemorate the victory by fortifying the southern defensive belt of [ShowLocationName('moscow')] for the security of [ROOT.GetCountry.GetName]. The idea of constructing a fortified convent comes from strategic necessity, but it could also be used to house the many [ShowPopTypeName('nobles')] women who have been forced to take the veil, securing favor amongst the [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] in the process."
 mos_novodevichy_convent_decision.desc.entry: "A victory is worth more if something of stone and permanent remembers it. A fortified convent south of [ShowLocationName('moscow')] would guard the approach won at [ShowAreaName('smolensk_area')] while quietly absorbing the [ShowPopTypeName('nobles')] daughters no one else wants to marry, a convenience the $nobles_estate$ will not openly admit to wanting."
 mos_novodevichy_convent_decision.a: "More bang for the buck."
 mos_novodevichy_convent_decision.b: "[ShowLocationNameWithNoTooltip('moscow')] is already defended adequately."
 mos_novodevichy_convent_decision.c: "Offer a stipend to the affected women."
 mos_novodevichy_convent_decision.historical_info: "The Novodevichy Convent was founded by Grand Prince Vasily III in honor of the successful conquest of the Smolensk area. It was established as a fortress and a religious institution to protect the western approaches to the city. The convent also provided residence to women from Russian royal families who were encouraged to embrace monastic life."

 mos_limit_namestnik_decision.title: "The Powers of the Namestniks"
 mos_limit_namestnik_decision.desc: "The Namestnik Viceroys wield considerable power to allow them to govern the most remote of regions in [ROOT.GetCountry.GetName]. This arrangement presents a series of challenges, such as denying us a significant portion of generated revenue and difficulties in maintaining their obedience. We should work towards establishing direct control over regional governance and centralize the administration, potentially at the expense of local elites."
 mos_limit_namestnik_decision.desc.entry: "A viceroy who governs a province unsupervised soon governs it as though it were his own. Direct rule from the center would return the revenue the Namestnik currently keep for themselves, at the cost of every local loyalty those offices were built on."
 mos_limit_namestnik_decision.a: "It is a thing of the past."
 mos_limit_namestnik_decision.b: "We do not fiddle with the undisturbed."
 disable_namestnik_policy: "The [ShowPolicyName('namestnik_policy')] [policy|e] becomes unavailable"
 mos_limit_namestnik_decision.historical_info: "The Namestniks held significant administrative and executive powers in Russia, acting as the monarch's representatives in distant territories. Their powers were somewhat curtailed during the reign of Ivan IV, however they would endure until a series of reforms were instigated by Peter 'the Great', as part of overall changes to Russia's administrative structure."

 mos_posolsky_prikaz_decision.title: "Posolsky Prikaz"
 mos_posolsky_prikaz_decision.desc: "The diligent work of [ivan_viskovatiy.GetName] has paid off, resulting in a more efficient handling of foreign affairs and a streamlined bureaucracy. It is now being proposed that we establish a separate bureau to handle matters related to diplomacy and such, to establish the same standards as those that apply to other government areas."
 mos_posolsky_prikaz_decision.desc.entry: "$name_john.east_slavic_language$ $Viskovatiy$ has been running foreign affairs efficiently for some time without a proper office to run them from. Making that arrangement permanent costs us nothing his talent has not already been quietly providing."
 mos_posolsky_prikaz_decision.a: "A sensible choice."
 mos_posolsky_prikaz_decision.b: "A shop for international mischief."
 enable_posolsky_cabinet_action: "Grants access to the [ShowCabinetActionName('posolsky')] [cabinet_action|e]"
 mos_posolsky_prikaz_decision.historical_info: "The #italic Posolsky Prikaz#! served as a governmental bureau overseeing foreign affairs and diplomatic affairs. It played an important role in the management of diplomatic relations, the deployment of ambassadors, and the administration of international affairs."


 mos_moscow_artillery_yard_decision.title: "[ShowLocationNameWithNoTooltip('moscow')] Artillery Yard"
 mos_moscow_artillery_yard_decision.desc: "With the advancement of artillery technology on the battlefield, it is increasingly crucial to be able to supply the army with an ample supply of munition pieces to sustain the war effort. We should task our engineers with establishing a dedicated facility focused on artillery production, transforming [ShowLocationName('moscow')] into a center for technological innovations and a dependable supplier."
 mos_moscow_artillery_yard_decision.a: "A dynamite deal."
 mos_moscow_artillery_yard_decision.b: "Time better spent on military drills."
 mos_moscow_artillery_yard_decision.historical_info: "The Moscow Artillery Yard was built during the reign of Ivan IV, and played an important role in enhancing Russia's military capabilities. The production of cannons and artillery was crucial for Russia's expanding military influence, and contributed to its military successes in several conflicts."

 mos_ban_oprichniki_decision.title: "The Oprichnik Raids"
 mos_ban_oprichniki_decision.desc: "The Oprichnik continue to carry out the execution of individuals perceived as disloyal. Recently, several [ShowPopTypeName('nobles')] estates in rural areas have been targeted, leading to [ShowPopTypeName('peasants')] assigned to the land to become displaced due to being prohibited from leaving the household of which they are assigned to. If this situation is not addressed promptly, we are at risk of facing endemic food shortages."
 mos_ban_oprichniki_decision.a: "Put an end to the Oprichnik."
 mos_ban_oprichniki_decision.b: "Not our concern."
 STATIC_MODIFIER_NAME_displaced_farmers: "Displaced Farmers"
 disable_oprichnik_policy: "The [ShowPolicyName('oprichnik_policy')] [policy|e] become unavailable"
 mos_ban_oprichniki_decision.historical_info: "The Oprichniks were involved in the confiscation of property from those deemed enemies of the state. This practice further consolidated the economic power of the Tsar and his loyal supporters but had the undesired effect of peasants becoming displaced and driven away as their former masters were either killed or captured. This in turn had a devastating effect on food production as fields were left unmanaged."

 mos_aptekarsky_prikaz_decision.title: "Aptekarsky Prikaz"
 mos_aptekarsky_prikaz_decision.desc: "The governmental bureaus set up in accordance with the [ShowGovernmentReformName('prikazi_reform')] reform each serve a distinct role within the governmental machinery, yet the recent pestilence highlights the need for a renewed focus on matters concerning the health and wellbeing of our subjects. We must establish a separate office to better coordinate any necessary response for when the next divine punishment or deadly outbreak occurs, or risk a shortfall of able workers to farm the lands and defend our great [ROOT.GetCountry.GetFlavorRank]."
 mos_aptekarsky_prikaz_decision.desc.entry: "The Prikazi offices are not well equipped to handle disease outbreaks and provide policies for those parts of our country which are struck by plague. We should create a new, separate bureau from the preexisting offices, providing aid in the case of pestilence striking our population again."
 mos_aptekarsky_prikaz_decision.a: "Leeches and blood-letting for everyone."
 mos_aptekarsky_prikaz_decision.b: "All we need is prayer."
 mos_aptekarsky_prikaz_decision.tt1: "The court rejoices at the preferential medical treatment offered to the upper levels of society by the Aptekarasky Prikaz"
 enable_aptekarsky_cabinet_action: "Grants access to the [ShowCabinetActionName('aptekarsky')] [cabinet_action|e]"
 mos_aptekarsky_prikaz_decision.historical_info: "The Aptekarsky Prikaz was a governmental bureau with a wide range of responsibilities, including overseeing the production and distribution of medicines, regulating pharmacies, and addressing issues related to public health. It was also tasked with the well-being and health of the Tsar and his court. The Aptekarsky Prikaz remained an important part of the administration of Imperial Russia until it was disbanded following the 1917 revolution."

 mos_bolshogo_dvortsa_prikaz_decision.title: "$bolshogo_dvortsa$"
 mos_bolshogo_dvortsa_prikaz_decision.desc: "Governor [alexey_lvov.GetName] of [ShowLocationName('nizhny_novgorod')] has recently returned to court to take on the responsibilities of Okolnichy, a senior role which would allow him to take on additional administrative responsibilities. We could expand this role to also encompass a new prikaz bureau overseeing palace affairs and supervision of monasteries, per the [ShowGovernmentReformName('prikazi_reform')] reform. It would strive towards better management of court expenses and ensure the policies of the [ShowPolicyName('non_possessors')] are fully implemented."
 mos_bolshogo_dvortsa_prikaz_decision.desc.entry: "$name_alexis.east_slavic_language$ already holds the trust that comes with the rank of Okolnichy; the only thing missing is an office to match it. Placing the palace estates and the monasteries under one loyal hand would tidy an administration that has long managed both badly and separately."
 mos_bolshogo_dvortsa_prikaz_decision.a: "An agreeable solution."
 mos_bolshogo_dvortsa_prikaz_decision.b: "No need for additional supervision."
 enable_bolshogo_dvortsa_cabinet_action: "Grants access to the [ShowCabinetActionName('bolshogo_dvortsa')] [cabinet_action|e]"
 enable_bolshogo_dvortsa_cabinet_action.tt2: "The [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] are overjoyed by the trust placed in them"
 mos_bolshogo_dvortsa_prikaz_decision.historical_info: "Prince Alexey Mikhaylovich Lvov was a deputy governor who quickly rose the ranks of the Tsarist government, leading diplomatic delegations and serving as ambassador after being appointed majordomo of the Tsar's court. He served as head of the bureau of palace affairs, a role he would keep until his eventual retirement."

 mos_greek_latin_academy_decision.title: "Establish the $greek_latin_academy$"
 mos_greek_latin_academy_decision.desc: "A pious scholar originating from [ShowLocationName('polotsk')] has brought forward a proposal to establish a linguistic academy, focused mainly on educating governmental officials in the language of diplomacy, namely [latin.GetName]. [simon_sitnianowicz.GetName], being no stranger to controversial ideas, has also proposed that he be entrusted with teaching grammar, poetics, and rhetoric to the common people. Such an initiative ought to be commended by allocating funds to ensure it is brought to fruition."
 mos_greek_latin_academy_decision.desc.entry: "Our diplomats lack proficiency in the [ShowLanguageName('latin_language')], which is a huge detriment to our foreign affairs. $name_simeon.east_slavic_language$ $Sitnianowicz$ proposes to teach it properly, and has further offered to teach the common people rhetoric as well, in order to strengthen their grasp of the language."
 mos_greek_latin_academy_decision.a: "Communication is key."
 mos_greek_latin_academy_decision.b: "Time better spent on sermons and preaching."
 mos_greek_latin_academy_decision.c: "Enlist him as private tutor."
 mos_greek_latin_academy_decision.d: "The people must remain in the dark."
 mos_greek_latin_academy_decision.tt1: "$name_simeon.east_slavic_language$ $Sitnianowicz$ is added as a [character|e]"
 mos_greek_latin_academy_decision.tt2: "He dedicates his time to disseminating enlightened ideas and crafting poetry"
 mos_greek_latin_academy_decision.tt3: "The [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] are content to witness the exile of a man of unorthodox ideas."
 mos_greek_latin_academy_decision.historical_info: "Symeon of Polotsk was a Belarusian Orthodox monk, poet, and translator who is remembered for his literary contributions, considered instrumental to the establishment of Orthodox Christian tradition. He introduced the teaching of Greek and Latin to Russia, and throughout his life, he also helped translate several works of Western theologians, facilitating the spread of knowledge to the Orthodox Church."

 mos_collegium_decision.title: "The Collegium"
 mos_collegium_decision.desc: "The recent overhaul of government bodies has necessitated a more efficient ministerial governance to prevent any overlapping of agency responsibilities. Let us scrap the existing [ShowGovernmentReformName('prikazi_reform')] system, replacing it with a series of collegiums. Each collegium will have distinct duties and a separation of powers, with the added responsibility of providing advice on unresolved cases when solicited."
 mos_collegium_decision.a: "Out with the old, in with the new."
 mos_collegium_decision.b: "Governance is delicate and must not be trifled with."
 variable_prikazi_tt: "The Prikaz System Governs the State"
 enable_collegium_reform: "Grants access to the [ShowGovernmentReformName('collegium_reform')] [government_reform|e]"
 mos_collegium_decision.tt1: "The [ShowGovernmentReformNameWithNoTooltip('prikazi_reform')] [government_reform|e] and any associated [cabinet_action|e] become unavailable"
 mos_collegium_decision.tt2: "Steps are taken to enhance the administration of [ShowLocationName('neva')] in line with the [ShowPolicyName('dop_law_governing_senate')] [policy|e]" 
 mos_collegium_decision.historical_info: "After the establishment of the Governing Senate, Peter 'the Great' set up various collegiums as administrative bodies responsible for different aspects of governance, such as the Synod and the Admiralty Board. Inspiration was drawn from similar reforms that had been recently implemented in neighboring Sweden. The urgency for reform was expedited by the growing number of territories of the Russian Empire."

 mos_sukharev_tower_decision.title: "Sukharev Tower"
 mos_sukharev_tower_decision.desc: "The navy depends on a steady supply of able sailors and the transfer of knowledge from one generation to another. To accommodate our nautical ambitions, we should establish a school providing technical education to lay the groundwork for a continued expansion of our armed forces. A design for a majestic tower was recently submitted and could house such an establishment, simultaneously contributing to the beautification of the [ShowLocationName('moscow')] cityscape."
 mos_sukharev_tower_decision.a: "A befitting ambition."
 mos_sukharev_tower_decision.b: "No need for such extravagances."
 mos_sukharev_tower_decision.tt1: "The top floor is designated to James Bruce, who sets up an astronomical observatory with a stellar view"
 mos_sukharev_tower_decision.tt2: "A state-of-the-art water supply system is constructed on the second floor for the benefit of [ShowLocationName('moscow')]"
 mos_sukharev_tower_decision.historical_info: "The Sukharev Tower was constructed in the late seventeenth century to commemorate the victory of Peter 'the Great' over the Streltsy, who had risen against him in the preceding years. The tower served various purposes over the years, such as barracks, educational facilities, infrastructure, and storage for merchants, until its eventual destruction by Soviet authorities in 1934."

 mos_chosen_rada_decision.title: "The Chosen Council"
 mos_chosen_rada_decision.desc: "The power of the [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] is impeding the centralization of power required for swift decision-making. It has been proposed that we create an executive council of chosen individuals to help expedite governmental procedures and curb the influence of noblemen, offering a chance to tackle diverse issues and implement necessary reforms. [alexi_adashev.GetName] and [sylvestr_the_priest.GetName] are close friends of the [ROOT.GetCountry.GetGovernment.GetRulerTitle] and are expected to sit on the council."
 mos_chosen_rada_decision.desc.entry: "A council of favorites answers to the ruler; the $nobles_estate$ answer to no one, which is exactly the problem. Placing $name_alexander.east_slavic_language$ $adashev$ and $name_silvester.east_slavic_language$ at the center of government would move decisions out of the assembly and into a room we actually control."
 mos_chosen_rada_decision.a: "A formidable force of able men."
 mos_chosen_rada_decision.a_tt: "$name_alexander.east_slavic_language$ $adashev$ and $name_silvester.east_slavic_language$ will join our [court|e]"
 mos_chosen_rada_decision.b: "Such a council will hold no sway."
 mos_chosen_rada_decision.tt3: "$name_alexander.east_slavic_language$ $adashev$ and $name_silvester.east_slavic_language$ are hunted down and executed to the delight of the [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]"
 enable_chosen_rada_reform: "Grants access to the [ShowGovernmentReformName('chosen_rada_reform')] [government_reform|e]"
 mos_chosen_rada_decision.historical_info: "The Chosen Council was a group of advisors who played a significant role in the early years of Ivan IV's reign. It was comprised of individuals like Alexi Adashev and the priest Sylvestr, who were trusted advisors to Grand Prince Ivan IV and were necessary for Ivan's efforts to centralize power, reform the legal system, and address various issues affecting the state."

 rus_russian_absolutism_decision.title: "The Absolute Overhaul of Governance"
 rus_russian_absolutism_decision.desc: "The time has come to modernize the governance of [ROOT.GetCountry.GetName] by dispensing with archaic traditions and inefficient means of governance. By strengthening the legislative power of the [ROOT.GetCountry.GetGovernment.GetRulerTitle] and ensuring that [ROOT.GetCountry.GetGovernment.GetRuler.GetHisHer] decrees are swiftly implemented by a coordinated and centralized government body, we can move ahead and ensure that any reform is not derailed by corruption and time-consuming appeals."
 rus_russian_absolutism_decision.desc.entry: "A decree that must survive a council before it survives contact with reality has already been half defeated. Concentrating authority in the ruler and a single coordinated ministry would let reform outrun the appeals and delays that have buried every previous attempt."
 rus_russian_absolutism_decision.a: "A fresh start."
 rus_russian_absolutism_decision.b: "The Old Way is better!"
 enable_russian_absolutism_reform: "Grants access to the [ShowGovernmentReformName('russian_absolutism')] [government_reform|e]"
 rus_russian_absolutism_decision.tt1: "The [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] are infuriated by the blatant disregard for their privileges and entitlement"
 rus_russian_absolutism_decision.historical_info: "During the reign of Peter 'the Great', he replaced medieval and obsolete forms of government with effective autocracy. In 1711, he abolished the boyar council and established the Senate as the supreme organ of state, coordinating central and local actions, overseeing revenue, and drafting legislation. Martial discipline was applied to civil institutions, with a guard officer on duty in the Senate."

 rus_state_controlled_church_decision.title: "The Governmental Guardianship"
 rus_state_controlled_church_decision.desc: "The Patriarchate retains considerable power and influence, yet it continues to obstruct progress and innovation in favor of tradition and ecclesiastical power hoarding. It must be abolished, and a new system put in its place to strengthen governmental control over the Church and ensure its obedience to the state."
 rus_state_controlled_church_decision.a: "Abolish the Patriarchate."
 rus_state_controlled_church_decision.b: "$common_string_leave_them_be$"
 rus_state_controlled_church_decision.c: "Business as usual, for a price."
 rus_state_controlled_church_decision.tt1: "The Holy Synod enforces strict censorship on all publications"
 rus_state_controlled_church_decision.historical_info: "In 1721, Peter 'the Great' abolished the Patriarchate of Moscow to subordinate the Orthodox Church to the state. The Holy Synod, a spiritual college representing the Tsar's will, replaced the patriarch. An ober-prokuror was appointed to oversee the Holy Synod, which fiercely persecuted dissenters and imposed censorship on publications."

 rus_academy_of_sciences_decision.title: "Academy Of Sciences"
 rus_academy_of_sciences_decision.desc: "It is important that we cultivate knowledge and scientific pursuits to ensure [ROOT.GetCountry.GetName] stays current on the international stage. Let us propose the establishment of an Academy of Sciences in our new capital of enlightenment and turn it into a bastion of innovation in fields such as mathematics, astronomy, physics, chemistry, and more."
 rus_academy_of_sciences_decision.desc.entry: "A great power that imports its mathematics and its physics will always be a step behind the powers that produce their own. An Academy of Sciences in our newest city would announce, more than any victory could, that $RUS$ intends to be counted among the latter."
 rus_academy_of_sciences_decision.a: "Intellectual prowess must match military might."
 rus_academy_of_sciences_decision.b: "Progress through dialogue."
 rus_academy_of_sciences_decision.tt1: "The contributions of $name_basil.east_slavic_language$ $tatishchev$ to the academy significantly expedites its establishment, adding to its contributions towards [ShowLocationName('neva')]"
 rus_academy_of_sciences_decision.tt2: "The litterary works of $name_james$ $Bruce$ are added to the academy's collection, enriching its scholarly resources"
 rus_academy_of_sciences_decision.tt3: "The finest minds of our country actively engage in extensive correspondence with other educational institutions across Europe, exchanging ideas and favoring the path of diplomacy"
 rus_academy_of_sciences_decision.historical_info: "The Saint Petersburg Academy of Sciences was established by Peter 'the Great', following his lengthly journey throughout Europe as part of the 'Great Embassy'. The academy drew inspiration from the Paris Academy as well as the Royal Society of London, who shared a similar goal of promoting scientific and scholarly research. The academy played an important role in advancing scientific knowledge and cultural development in Russia."

 rus_manifesto_of_freedom_decision.title: "The Manifesto of Freedom"
 rus_manifesto_of_freedom_decision.desc: "The ability to govern necessitates a stable country with a strong ruler holding the reins firmly. At the moment, there is brewing discontent over the choices made by [ROOT.GetCountry.GetGovernment.GetRuler.GetName], and it would be prudent to at least ensure the continued support of the [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] until the situation improves. Let us offer generous concessions that exempt the [ShowPopTypeName('nobles')] from state service along with other civil liberties, allowing us to focus on stabilizing the fragile nature of the absolutist rule currently enjoyed."
 rus_manifesto_of_freedom_decision.desc.entry: "An absolute ruler with a discontented $nobles_estate$ is not, in practice, very absolute. Freeing the $nobles_estate$ from compulsory service costs the state their obligation, but buys a $nobles_estate$ with far less reason to conspire while the throne finds its footing."
 rus_manifesto_of_freedom_decision.a: "A necessary evil."
 rus_manifesto_of_freedom_decision.b: "Let us find a middle ground."
 rus_manifesto_of_freedom_decision.c: "An offensive notion."
 rus_manifesto_of_freedom_decision.tt1: "The extensive privileges granted to the [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] remain unrevokable during the reign of our current ruler"
 revoke_manifesto_of_freedom: "The extensive privileges bestowed upon the [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] remain unrevokable during the reign of the ruler who granted them."
 rus_manifesto_of_freedom_decision.tt2: "The [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] take advantage of the dire state of the country and actively work to obstruct the rule of [target_root_country.GetGovernment.GetRuler.GetName]"
 rus_manifesto_of_freedom_decision.historical_info: "The #italic Manifesto of Freedom of the Nobility#! was granted by Emperor Peter III during his short and unsuccessful reign. Several factors were behind its conception, namely that he had managed to alienate most of the nobility due to shifting geopolitical alliances which deprived Russia of a significant military victory against Prussia. Seeking to stabilize his rule, Peter reduced the obligations of the nobility and seized Church land to pay for it, which instead offended the clergy. His insistence for implementing Prussian military drills on the Army nearly provoked an uprising, prompting his wife, Catherine, to depose him in a coup."

 rus_speransky_liberalization_decision.title: "The Sparks of Change"
 rus_speransky_liberalization_decision.desc: "The implementation of a new constitutional system remain a top priority for progressive pioneer [mikhail_speransky.GetName], who endures in cabinet to spearhead any suitable changes. Let us embrace the winds of change and sail into uncharted waters with only a liberal compass to guide us."
 rus_speransky_liberalization_decision.desc.entry: "$name_michael.east_slavic_language$ $Speransky$ has spent years drafting a constitution nobody has yet been brave enough to grant. Backing him now commits us to reforms whose shape we cannot fully predict, which is precisely why every ruler before us chose to wait."
 rus_speransky_liberalization_decision.a: "Winds Ahoy!"
 rus_speransky_liberalization_decision.b: "Controversial and dangerous."
 enable_speransky_liberalization_reform: "Grants access to the [ShowGovernmentReformName('speransky_liberalization_reform')] [government_reform|e]"
 rus_speransky_liberalization_decision.tt1: "Progressive steps are taken to modernize the administration of [target_root_country.GetName] despite [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] opposition"
 rus_speransky_liberalization_decision.historical_info: "Tsar Alexander I, guided by a vision of reform, undertook substantial changes during his rule. In 1802, he introduced a more organized administration by establishing eight ministries, a move that showcased his commitment to efficient governance. This era witnessed the influence of Mikhail Speransky, a key advisor to the Tsar and an advocate for modernization."

 rus_free_economic_society_decision.title: "Free Economic Society"
 rus_free_economic_society_decision.desc: "Agriculture remains a staple in our society, yet the cultivation methods and farming techniques used by the [ShowPopTypeName('peasants')] are static and low-yielding in comparison to competing powers. For a modest cost, one of our architects has proposed the creation of an economic organization to advance the knowledge in agriculture and commerce, and has also offered to take on a leading role in its administration.\n\nShould the organization succeed, it must also aim to improve the education of farmers and promote the training of skilled workers by providing practical advice and publishing journals and research papers on the topic."
 rus_free_economic_society_decision.desc.entry: "A peasant who farms as his grandfather did will feed no more mouths than his grandfather did. $name_gregory.east_slavic_language$ $Orlov$ offers, cheaply and at his own initiative, to found a society that teaches better methods, though its promises of journals and schooling for farmers reach further than the request was for."
 rus_free_economic_society_decision.a: "We must nourish ourselves after all."
 rus_free_economic_society_decision.b: "This is not the way."
 STATIC_MODIFIER_NAME_potato_varieties_introduced: "Potato Varieties Introduced"
 rus_free_economic_society_decision.tt1: "New varieties of [ShowGoodsName('potato')] and groundbreaking cultivation methods are introduced by the Society, contributing to increased crop yields"
 rus_free_economic_society_decision.tt2: "The [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] applaud the efforts to retain their position of power over the [ShowPopTypeName('peasants')]"
 rus_free_economic_society_decision.historical_info: "The Free Economic Society was founded by Grigory Orlov with support from Empress Catherine II, who herself felt that the agricultural practices of Russia were outdated and lagging behind other great powers, notably Britain. The society published several papers on new farming techniques, introduced crops, and organized educational efforts for farmers so that they could work the land more efficiently and produce more food."

 rus_imperial_academy_arts_decision.title: "Imperial Academy of Arts"
 rus_imperial_academy_arts_decision.desc: "Visionary reformer [ivan_shuvalov.GetName] is continuing [ivan_shuvalov.GetHisHer] unabated reforms of the educational system and persists with the ongoing support of the arts. [ivan_shuvalov.GetSheHe|U] is seeking to institute an academy devoted to achieving the highest standards in the arts and architecture, nurture and develop [ROOT.GetCountry.GetAdjective] artistic talent by sponsoring its most promising students to innovative cities across Europe for further study. Let us embrace this initiative and build a stronghold of cultural advancement to transform [ShowLocationName('neva')] into a beacon of classicism."
 rus_imperial_academy_arts_decision.desc.entry: "$name_john.east_slavic_language$ $Shuvalov$ has already reformed the schools; he now wants an academy that sends our most promising painters and architects abroad to study, and brings back artists good enough that [ShowLocationName('neva')] need not import its taste from Europe any longer."
 rus_imperial_academy_arts_decision.a: "A chivalrous proposal."
 rus_imperial_academy_arts_decision.b: "Cabinet responsibilities take precedence."
 rus_imperial_academy_arts_decision.c: "If it ain't broke."
 rus_imperial_academy_arts_decision.tt1: "The esteemed $name_gregory.east_slavic_language$ $Orlov$ donates a significant share of his art collection to the newly formed academy"
 rus_imperial_academy_arts_decision.tt2: "$name_john.east_slavic_language$ $Shuvalov$ solely focuses on [cabinet|e] duties, excelling at his post and raising the bar for public service"
 rus_imperial_academy_arts_decision.tt3: "Current architectural styles are reinforced and enjoy a second renaissance"
 rus_imperial_academy_arts_decision.historical_info: "The Imperial Academy of Arts was an art academy situated by the Neva River in Saint Petersburg. Founded in 1757 by Ivan Shuvalov, a statesman and art enthusiast, it promoted the Neoclassical style and technique, and aimed to emulate European art academies as well as invited foreign artists to teach Russian students."

 mos_moscow_orphanage_decision.title: "The Well-Intended Orphanage"
 mos_moscow_orphanage_decision.desc: "A noteworthy idea is being presented by cabinet member [ivan_betskoy.GetName] to tackle what is perceived as one of the greatest travesties taking place, namely the abandonment of newborn children. It is being suggested that we establish a safe refuge for the less fortunate, and provide them with sustenance and literature to ensure they grow up to become productive members of society. The matter of funding remains an unresolved issue, but several viable options are being considered to sustain this initiative."
 mos_moscow_orphanage_decision.desc.entry: "A child abandoned at birth costs the state nothing today and a great deal in twenty years, one way or another. $name_john.east_slavic_language$ $Betskoy$ proposes a refuge that raises them into useful subjects instead, if only someone can be found to pay for it."
 mos_moscow_orphanage_decision.a: "A lucrative investment."
 mos_moscow_orphanage_decision.b: "A worthy cause."
 mos_moscow_orphanage_decision.c: "Each to their own."
 mos_moscow_orphanage_decision.tt1: "The orphanage set up several private banking branches to manage loans and savings to fund operations"
 mos_moscow_orphanage_decision.tt2: "Funding is generously provided by the treasury"
 mos_moscow_orphanage_decision.historical_info: "The Moscow Orphanage was established in 1763 under the direction of Empress Catherine 'the Great' and Ivan Betskoy, a minister in her government and great advocator of educational reforms. The institution was conceived when Enlightenment ideals were gaining traction in Russia and across Europe. Despite being well-funded, it was plagued by high infant mortality rates and had limited impact on the lives of abandoned children, although some did benefit from the education provided and were able to secure employment as a result."

 rus_institute_of_noble_maidens_decision.title: "Institute of Noble Maidens"
 rus_institute_of_noble_maidens_decision.desc: "The education of women remains a hotly debated topic and is strongly supported by enthusiastic advocate [ivan_betskoy.GetName], who has summoned the cabinet with the intention of creating a cultivating institution devoted to the schooling of dutiful women. These women are envisioned to fulfill roles as valuable contributors to both family and society. Let us commission a suitable structure dedicated to progressive ideas and inclusiveness, and begin shaping a new generation, free from the detrimental impact of ignorant parenting."
 rus_institute_of_noble_maidens_decision.desc.entry: "A daughter raised only for the household will manage nothing beyond it. $name_john.east_slavic_language$ $Betskoy$ wants an institution that teaches young women to be more than that, built on the wager that an educated mother raises a more capable next generation than an ignorant one."
 rus_institute_of_noble_maidens_decision.a: "Construct it."
 rus_institute_of_noble_maidens_decision.b: "[ShowLocationNameWithNoTooltip('moscow')] is well suited for it."
 rus_institute_of_noble_maidens_decision.b.tt: "If present, we will re-purpose the [ShowBuildingTypeNameWithNoTooltip('novodevichy_convent')]. Else we will construct the [ShowBuildingTypeNameWithNoTooltip('institute_of_noble_maidens')] in [ShowLocationNameWithNoTooltip('moscow')]"
 rus_institute_of_noble_maidens_decision.c: "A threat to the established order."
 rus_institute_of_noble_maidens_decision.tt1: "Printed charters are dispatched to all maidens of the [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] and [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]"
 rus_printed_charters: "Printed Charters"
 rus_institute_of_noble_maidens_decision.historical_info: "The Institute of Noble Maidens, established by Ivan Betskoy with strong support from Empress Catherine 'the Great', aimed to expose women to intellectual thinkers of the time, including Voltaire and Locke. Children joined the convent at a young age, experiencing a separation from their parents for a period of six years. The institute would change locations several times, and was funded by an annual fee to ensure exclusivity and restrict entry to low-ranking members of society."

 rus_nakaz_decision.title: "Nakaz"
 rus_nakaz_decision.desc: "It is becoming increasingly important to propel [ROOT.GetCountry.GetName] into a new era of enlightenment and progress. A visionary overhaul of the legal code aligned with the invigorating principles sweeping across Europe would fit the bill, encompassing ideals such as reason, justice, and humanitarianism. By embracing these values, we can finally shed the outdated legal practices that are hindering social development. Let us embark on the path of reform, and implement equality of all citizens before the law."
 rus_nakaz_decision.desc.entry: "The need to introduce of a new legal code has become increasingly obvious and many enlightened scholars are petitioning our ruler for a reform of law. However a forceful implementation might cause severe backlash from certain bodies within our government."
 rus_nakaz_decision.a: "Progress can be painful."
 rus_nakaz_decision.b: "Settle for a penal reform."
 rus_nakaz_decision.c: "We dare not."
 enable_nakaz_reform: "Grants access to the [ShowGovernmentReformName('nakaz_reform')] [government_reform|e]"
 rus_nakaz_decision.tt1: "[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] are infuriated by the threat posed to their position of power"
 rus_nakaz_decision.tt3: "The cave towards conservative forces sees their agenda strengthened"
 rus_nakaz_decision.historical_info: "The #italic Nakaz Pravilnosti#!, or #italic Instruction on Laws#!, was a legal code introduced by Catherine 'the Great' in an attempt to modernize and reform the legal system. Influenced by Enlightenment ideas, it sought to create a legal system that aligned with the progressive philosophies of the time, as well as simplify and clarify laws. It introduced more humane punishments, restricted the use of torture, and emphasized the equality of all citizens before the law. The Nakaz was never fully implemented due to the many conservative forces that opposed it, and Catherine eventually shifted her focus towards other priorities."

 rus_intellectual_movements_decision.title: "The Onset of Nationalism"
 rus_intellectual_movements_decision.desc: "The definition of, and perceived supremacy of the [ShowCultureGroupName('slavic_group')] culture is a hotly debated topic amongst scholars. Opinions differ over whether we should pursue a more pro-western stance to ensure [ROOT.GetCountry.GetName] does not stagnate in an endless cycle of tradition, or whether the importance of continuation is understated, and ought to remain a central part in preserving the [ROOT.GetCountry.GetAdjectiveWithNoTooltip] identity. The divergence has spurred the creation of two distinct intellectual movements that wish to steer us in opposite directions, and we must decide on the path that aligns with our vision for the future."
 rus_intellectual_movements_decision.desc.entry: "Scholars have split over whether the [ShowCultureGroupName('slavic_group')] identity is worth preserving intact or worth trading away for western progress, and the argument has hardened into two camps that cannot both shape the future of $RUS$. Choosing between them settles nothing the other side will accept quietly."
 rus_intellectual_movements_decision.a: "Support the Slavophiles."
 rus_intellectual_movements_decision.b: "Support the Westernizers."
 rus_intellectual_movements_decision.custom1: "Grants access to the [ShowLawName('intellectual_movements')] [law|e]"
 rus_intellectual_movements_decision.custom2: "A [policy|e] under the [ShowLawName('intellectual_movements')] [law|e] may only be changed once every ten years"
 rus_intellectual_movements_decision.historical_info: "Westernizers and Slavophiles were two distinct intellectual and ideological movements in nineteenth-century Russia. They had differing views on Russia's path of development, its relationship with Western Europe, and the preservation of Russian cultural identity. Westernizers favored modernization by adopting Western ideas, institutions, and technologies, whereas the Slavophiles emphasized the preservation of traditional Russian values, spirituality, and communal structures."

 rus_secretnoye_byuro_decision.title: "The Secret Office of Investigation"
 rus_secretnoye_byuro_decision.desc: "Concerns have been raised regarding the ability of the [current_policy.GetName] to suppress elite challenges towards the government of [ROOT.GetCountry.GetName]. Foreign influences in the Council of the Empire have proposed a specialized agency that may be better suited to the task, with brute force being the preferred method of dissuasion. Let us resurrect the knout and reorganize the secret police to instill a renewed sense of authority and thwart any attempt of derailing our supreme rule."
 rus_secretnoye_byuro_decision.desc.entry: "A current policy that merely discourages sedition is not the same as one that prevents it, and foreign agents in the bureaucracy have noticed the difference. Reviving the knout and a dedicated secret police answers the complaint, at the cost of every pretense that $RUS$ governs by anything gentler than fear."
 rus_secretnoye_byuro_decision.a: "Obedience demands the occasional sacrifice."
 rus_secretnoye_byuro_decision.b: "We are above this."
 enable_secretnoye_byuro_policy: "Grants access to the [ShowPolicyName('secretnoye_byuro_policy')] [policy|e]"
 rus_secretnoye_byuro_decision.tt1: "It is selectable only while a [cabinet_member|e] performs the [ShowCabinetActionName('bironovshchina')] [cabinet_action|e]"
 rus_secretnoye_byuro_decision.historical_info: "The Secret Office of Investigation played a major part during the rule of Empress Anna Ioannovna, who used it to keep her political opponents in check as a means of securing her authoritarian rule. Punishments included having one's nose slit or being beaten to death by a knout, which was a typical whip characterized by a rawhide thong or a rope connected to an extended wooden handle. It is estimated that around twenty-thousand nobles became victims of political purges."

 rus_proclaim_tsardom_decision.title: "Proclaim the $tsardom$"
 rus_proclaim_tsardom_decision.desc: "The gathering of the Rus' lands is complete, and the [GetInternationalOrganizationType('tatar_yoke').GetName] is broken. Our [GetCountry('RUS').GetFlavorRank] now stands supreme among the principalities, and our [GetCountry('RUS').GetGovernment.GetEstateName('clergy_estate')] urge us to claim a dignity to match: our sovereign should be crowned [SelectLocalization(GetCountry('RUS').GetGovernment.GetRulerOrRegent.IsFemale,'rank_empire_tsar_ruler_female','rank_empire_tsar_ruler_male')], heir to the emperors of old and guardian of the [ShowReligionAdjective('orthodox')] faith.\n\nSuch a coronation would proclaim to every court in Europe and every khanate of the steppe that [GetCountry('RUS').GetName] bow to no foreign crown."
 rus_proclaim_tsardom_decision.desc.entry: "The Rus' lands are gathered, the [GetInternationalOrganizationType('tatar_yoke').GetName] is broken, and a ruler who has already achieved an empire's work now merely lacks an empire's title. Claiming one costs nothing but presumption, and tells every court in Europe exactly how we expect to be addressed from now on."
 rus_proclaim_tsardom_decision.a: "Let our sovereign be crowned [SelectLocalization(GetCountry('RUS').GetGovernment.GetRulerOrRegent.IsFemale,'rank_empire_tsar_ruler_female','rank_empire_tsar_ruler_male')] of All Russia."
 rus_proclaim_tsardom_decision.historical_info: "On 16 January 1547, Ivan IV of Moscow was crowned in the Cathedral of the Dormition within the Kremlin, the first Muscovite ruler to be formally invested with the title of Tsar. Metropolitan Macarius, who had championed the new dignity, placed upon him the Cap of Monomakh, a jeweled fur-trimmed crown that court tradition held to be a gift from the Byzantine emperor Constantine IX to Grand Prince Vladimir Monomakh centuries earlier.\n\nThe new title marked a deliberate break from the older style of Grand Prince, asserting a rank equal to that of an emperor and heir to the fallen Christian empires of the East. Foreign courts were slow to recognize it: it took decades of diplomacy before the Holy Roman Empire and the Papacy accepted Tsar as the equivalent of King, rather than a mere translation of Grand Prince."