l_english:
 tur_enderun_academy_decision.title: "The Enderûn Academy"
 tur_enderun_academy_decision.desc: "In order to train administrators and generals for our growing realm, we could institute a school run by the inner circle of the court, to keep the students close to the ruler. This would not only allow us a great deal of insight, but would also bind the students to us, ensuring the continued importance of the [ROOT.GetCountry.GetGovernment.GetRuler.GetDynasty.GetName] dynasty in all matters of state.\n\nYet we should not only allow nobles to enroll, but any youth gifted enough, no matter his background."
 tur_enderun_academy_decision.desc.entry: "A servant raised inside the palace owes his position to the dynasty and nothing to his father's name. A school run by the inner court would give us administrators and commanders whose careers begin and end at our pleasure, and there is no reason to reserve its benches for the wellborn."
 tur_enderun_academy_decision.a: "This is the future!"
 tur_enderun_academy_decision.historical_info: "Mehmed II established a school in the courtyard of the newly constructed Topkapi Palace. Students were chosen from among the most promising Devşirme recruits (conscripted Christian youths), and were trained in the Islamic faith, the sciences, and the military arts, as well as many languages. The staffing of government posts with Devşirme recruits trained in the palace school and loyal to the sultan formed the backbone of the Ottoman system of patrimonial rule throughout the fifteenth and sixteenth centuries."

 tur_expanded_timariot_decision.title: "Expansion of the Timariot System"
 tur_expanded_timariot_decision.desc: "To finance an expansion of the Timariot system, clever advisors have suggested that we could reroute some revenue from the Waqf, the mosque-based foundations that support charity towards the wretched and forlorn. This would certainly strengthen our army even further, and reduce the power of the [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')], but might cause widespread discontent once the more pious segments of the people learn about it."
 tur_expanded_timariot_decision.desc.entry: "Land granted for cavalry pays for itself; charity endowments pay for nothing we can march. Diverting the Waqf would put more horsemen in the field and clip the $clergy_estate$ at the same stroke, though the devout will hardly fail to notice where the money went."
 tur_expanded_timariot_decision.a: "The state needs the money."
 tur_expanded_timariot_decision.b: "The Waqf must never be touched!"
 tur_expanded_timariot_decision.historical_info: "Mehmed II sought to expand his personal power within the Ottoman Empire at all costs. Near the end of his reign he attempted to reduce the power of the ulema by rerouting revenues from the #italic Waqf#! foundations that supported them to the timar system instead, strengthening the Ottoman army. This move would turn out to be controversial however..."

 tur_enderun_service_decision.title: "The Interior Service"
 tur_enderun_service_decision.desc: "Skilled eunuch slaves have long played a limited role in our government, but there is great potential in these castrated men, without ambitions of family and temporal power. As there are several talented young slave-boys at court, we could tie such capable courtiers closer to the [ROOT.GetCountry.GetGovernment.GetRuler.GetDynasty.GetName] dynasty by giving them formal roles in our household, at the expense of the sycophantic old [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] who used to vie for such positions."
 tur_enderun_service_decision.desc.entry: "A man who can father no dynasty of his own has little reason to build one at our expense. Formal household office for the palace eunuchs would raise the ablest of them above the $nobles_estate$, who have long treated such posts as their inheritance."
 tur_enderun_service_decision.a: "A court reform is long overdue."
 tur_enderun_service_decision.b: "No, we must continue to rely on the [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]."
 tur_enderun_service_decision.b.entry: "No, we must continue to rely on the $nobles_estate$."
 tur_enderun_service_decision.historical_info: "#italic Enderûn#!, from a Persian word for #italic inside#!, designated the courtiers closest to the Ottoman sultan. They were contrasted with the #italic Birûn#!, the exterior service, which was the bureaucracy of the empire. The ranks of the Enderûn were chiefly made up of eunuchs and young Christian slaves, whose tasks focused on attending and educating the imperial family, but over time, some of them aquired great political power."

 tur_imperial_harem_decision.title: "Organization of the Harem"
 tur_imperial_harem_decision.desc: "Up until now, the [ROOT.GetCountry.GetGovernment.GetRuler.GetDynasty.GetName] court has been spread out among various palaces and positions. But if we truly aspire to greatness, we might concentrate our power and presence to [capital_location.GetName]. This would entail moving all the royal Cariye concubines there, and install them in enclosed confines of splendid luxury.\n\nBut the [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] would see this as an aggressive move against them, since it would deprive many of them of the personal access to [target_ruler.GetName] that they have long enjoyed."
 tur_imperial_harem_decision.desc.entry: "Power follows whoever stands nearest the ruler, and at present that is whoever happens to own the closest palace. Gathering the household into one guarded residence in the capital would settle the matter permanently, which is precisely why the $nobles_estate$ will resent it."
 tur_imperial_harem_decision.a: "Create the Imperial Harem."
 tur_imperial_harem_decision.b: "Our court organization works fine as is."
 tur_imperial_harem_decision.historical_info: "In the 16th century, Ottoman dynastic power became concentrated to the Topkapi palace in Constantinople, and most members of the royal family, especially women, would spend all their lives there. This transformed the harem into a well-organized hierarchical institution, whose emphasis on seclusion of the dynastic life made personal access to the ruler a great privilege, and thus conveyed his power."

 tur_eunuch_viziers_decision.title: "Create the Kızlar Ağası Position"
 tur_eunuch_viziers_decision.desc: "[mehmed_agha.GetName] is a brilliant [ROOT.GetCountry.GetGovernment.GetCourtTitle] eunuch, one of the guardians of the [ROOT.GetCountry.GetGovernment.GetAdjective] harem. Several factions at [ROOT.GetCountry.GetGovernment.GetCourtTitle] want a new position created for him, #italic Kızlar Ağası#!, Guardian of the Girls. In this role he would supervise the private quarters of the [ROOT.GetCountry.GetGovernment.GetRulerTitle], and mediate between the harem and the high council. He would also rise above the old white chief eunuch, the #italic Kapı Ağası#!, who is responsible for the boy servants at [ROOT.GetCountry.GetGovernment.GetCourtTitle], but has never been truly trustworthy."
 tur_eunuch_viziers_decision.desc.entry: "Whoever controls access to the ruler's private quarters controls a great deal more than a door. $name_muhammad.turkish_language$ has the wit for such an office, and raising him to #italic Kızlar Ağası#! would also settle an old question about the loyalty of the chief white eunuch."
 tur_eunuch_viziers_decision.a: "Elevate the Kızlar Ağası."
 mehmed_agha_tt: "A skilled [character|e] will join our court and receive the [ShowModifier('kizlar_agha_modifier')] [modifier|e]"
 tur_eunuch_viziers_decision.b: "Strengthen the Kapı Ağası instead."
 valide_sultan_objects.tt: "The Valide Sultan will not accept this."
 mehmed_agha_fired.tt: "[mehmed_agha.GetNameWithNoTooltip] leaves the [ROOT.GetCountry.GetGovernment.GetCourtTitle]."
 tur_eunuch_viziers_decision.historical_info: "The number of eunuchs at the Ottoman court steadily grew. In 1574, the Kızlar Ağası position was created for Mehmed Agha, giving the eunuchs unprecedented power. African eunuchs were seen as more trustworthy because their homelands were so far away, and over time grew much more influential than the white eunuchs. Thanks in part to the Kızlar Ağası's close connections to the powerful Valide Sultans (queen mothers), the post soon became vizier of the first rank, outranked only by the grand vizier and the $common_string_shaikh_al_islam$."

 tur_sekban_system_decision.title: "End the [ShowAdvanceNameWithNoTooltip('timariots')]"
 tur_sekban_system_decision.desc: "The [ShowAdvanceName('timariots')] system, which has long served us well, is facing critical problems. The land grants we give out to these cavalrymen have become more and more subdivided and poor, and our musket-armed enemies ensure that cavalry is not as dominant on the battlefield as in days of old. If we do not hand out any more Timar lands, we could, as their holders age and die, turn them into tax farms for the direct benefit of the state. The army could also be modernized, more focused on infantry soldiers armed with gunpowder weapons."
 tur_sekban_system_decision.a: "We must change with the times."
 timars_unavailable.tt: "The Timar [reforms|e] will become permanently unavailable."
 tur_sekban_system_decision.historical_info: "The Timar system of land grants to Sipâhi cavalrymen became unsustainable over time. As the great Ottoman conquests became a thing of the past, there was no longer enough land to hand out. Other factions in the army, especially the Janissaries, also demanded grants. Realizing that a reform was long overdue, the Ottomans abolished the system and came to rely more heavily on recruitment of Sekban soldiers from the peasantry."

 tur_kanum_i_osmani_decision.title: "[ShowPolicyNameWithNoTooltip('tur_kanum_i_osmani')]"
 tur_kanum_i_osmani_decision.desc: "Thanks to the growth of the [ROOT.GetCountry.GetFlavorRank], there has been a host of different people that reside within its borders. Many are already solidified as part of our nation, following the old [ROOT.GetCountry.GetAdjective] laws. Yet, it seems that those laws are not enough. [target_character.GetName], known for being a pioneer of reforms, wishes instead to rewrite the entire legal code of [ROOT.GetCountry.GetNameWithNoTooltip], something to bring internal stability rather than encourage the growth of the borders with conquest."
 tur_kanum_i_osmani_decision.desc.entry: "Laws written for a frontier principality do not govern an empire of many peoples. A single code, issued in our name and binding upon all of them, would buy the internal order that further conquest cannot, and we have conquered quite enough for one age."
 tur_kanum_i_osmani_decision.a: "These laws will lead us to a new age."
 tur_kanum_i_osmani_decision.b: "We will keep these reforms in mind."
 tur_change_tur_kanum_policy_to_give_values_weighted_by_crown_power: "The [modifiers|e] that the [ShowPolicyName('tur_kanum_i_osmani')] [policy|e] gives will be #Y 50%#! more effective, but instead their effectiveness will scale with the [estate_power|e] of the [GetEstateName('crown_estate')]"

 tur_autonomous_kadiluks_decision.title: "Empower the Qāḍī"
 tur_autonomous_kadiluks_decision.desc: "The #italic Qāḍī#!, the judges in all things important to [ShowReligionGroupAdjective('muslim')] people, have long been a pillar of the state, and the office of Qāḍī a dream for many scholars. But with recent advances in governance and tax farming, the Qāḍī now seek greater autonomy over the #italic Kadiluk#! land grants that they are responsible for. Granting them this, they suggest, would benefit our claim to primacy over all of [ShowReligionGroupNameWithNoTooltip('muslim')], and forever increase the trust between them and the Sublime Porte."
 tur_autonomous_kadiluks_decision.a: "They deserve our trust."
 tur_autonomous_kadiluks_decision.b: "They are powerful enough already."
 has_enabled_kadiluks_privilege: "Has enabled this [estate_privilege|e] through the '$tur_autonomous_kadiluks_decision.title$' [decision|e]"
 tur_autonomous_kadiluks_decision.historical_info: "The Ottoman Empire of the 17th saw a gradual weakening of the sultan's power, with more and more influence being vested into institutions such as the janissaries and the Qāḍī. A Kadiluk was the jurisdiction given to a Qāḍī, and within it, he would oversee both taxation and military conscription. Through the Kadiluks, the Qāḍī could wield significantly influence, especially in the provinces outside immediate centers of royal power, and their status reached a new height after the Edirne Incident in 1703, when sultan Mustafa II was overthrown."

 tur_malikane_decision.title: "The $ottoman_tax_farming$ Reform"
 tur_malikane_decision.desc: "Pondering our economy, [grand_vizier.GetName] has prepared a new tax farming system, called #italic Malikâne#!. A village or district will be auctioned to the highest bidder, who will then hold the right to tax it for life. This would improve our old system, [grand_vizier.GetSheHe] claims, by making a tax farmer more invested in the long-term welfare of his lands, and less prone to bleeding them dry before his tenure ends. It would also save us the bureaucratic hassle of administering all those one-year contracts that were the norm in ages past — but on the other hand, those were rather profitable."
 tur_malikane_decision.desc.entry: "A tax farmer holding a village for one year will strip it; a tax farmer holding it for life will tend it. #italic Malikâne#! sells that lifetime right to the highest bidder, trading the fat annual auctions of the past for districts still worth taxing a decade from now."
 tur_malikane_decision.a: "Implement this reform."
 malikane_available.tt: "The [ShowGovernmentReformName('ottoman_malikane_tax_reform')] [government_reform|e] will become available."
 tur_malikane_decision.historical_info: "The Malikâne system was introduced in 1695 by the ill-fated grand vizier Elmas Mehmed Pasha. He seems to have had good intentions, wanting to improve long-term economic gains, but partially failed. The system met fierce obstruction from the old generation of tax farm holders, and state oversight into the new type of life-time grants was lacking. Despite the reform, the state soon faced military losses and struggled to pay its soldiers. Elmas was killed by his own men in 1697, and in 1703, unpaid janissaries overthrew Mustafa II."

 tur_coffee_house_espionage_decision.title: "Infiltration of Coffee Houses"
 tur_coffee_house_espionage_decision.desc: "Too often, the coffee houses where many [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] gather become haven for traitorous fraternization, and even plots of rebellion, especially among the $janissaries_advance$. While the vivid discussions taking place over dark coffee and sweet desserts have been good for commerce and community, it could not hurt to expand our spy network, making sure no secret exchange goes unheard. "
 tur_coffee_house_espionage_decision.desc.entry: "Men speak more freely over coffee than under questioning, and the houses where the $burghers_estate$ gather are thick with talk the $janissaries_advance$ would rather we never heard. Closing them would cost us the trade and the gossip alike, whereas filling them with our own listeners costs us neither."
 tur_coffee_house_espionage_decision.a: "Information is power."
 tur_coffee_house_espionage_decision.b: "Have a crackdown on coffee houses."
 tur_coffee_house_espionage_decision.c: "The coffee must flow unhindered."
 coffee_house_espionage_available.tt: "The [ShowGovernmentReformName('ottoman_coffee_house_espionage')] [government_reform|e] will become available."
 tur_coffee_house_espionage_decision.historical_info: "The coffee houses in the Ottoman Empire were dynamic meeting places for men of many different professions, ethnicity and faiths, where Turkish artisans could mingle with Russian vagabonds and Venetian merchants. As such, they became a forum for public discourse, novel ideas, art — and rebellion. The Janissary coffeehouses especially provided a way to connect with undercover networks for assassinations, information, and resources. The government implanted many spies into the coffee houses and similar public institutions, to gain insight into public sentiment and any talks of crime or rebellion."

 tur_new_order_army_decision.title: "The New Order Army"
 tur_new_order_army_decision.desc: "Pondering the strength of our rivals and the dangers of a changing world, but especially the constant threat of rebellion from the unruly and decadent $janissaries_advance$, [target_ruler.GetName] has a new idea. [target_ruler.GetSheHe|U] wants to reform the army into a highly professional, modern force, bolstered by instructors from [ShowContinentName('europe')] and new uniforms, traditions and training. But in doing so, [target_ruler.GetSheHe] would risk the wrath of the $janissaries_advance$, the $bashi_bazouks$, the members of the $sekban_system$, and all others who profit from the current state of things."
 tur_new_order_army_decision.desc.entry: "The obstacle to a modern army is not money or instructors but the army we already keep. Raising a disciplined force alongside the $janissaries_advance$ means arming the men who will one day be ordered to disband them, and the $bashi_bazouks$ and the $sekban_system$ can read that intention as well as we can."
 tur_new_order_army_decision.a: "We need this change."
 tur_new_order_army_decision.b: "The old ways are good enough."
 new_order_army_available.tt: "The [ShowGovernmentReformName('ottoman_new_order_army')] [government_reform|e] will become available."
 tur_new_order_army: "Unlocked [ShowGovernmentReformNameWithNoTooltip('ottoman_new_order_army')]"
 tur_new_order_army_decision.historical_info: "The Niẓām-i Jedīd, the #italic New Order Army#! was established in 1797. It was the core part of the reform program of Selim III. He hoped to reverse the decentralization of the empire and circumvent the entrenched power of the Janissaries, by gradually replacing the Janissary corps with a modern infantry force after the model of the armies of Europe."
