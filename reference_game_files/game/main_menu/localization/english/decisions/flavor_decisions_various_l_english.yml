l_english:
 ser_novo_brdo_mine_decision.title: "The [ShowLocationNameWithNoTooltip('novo_brdo')] Code"
 ser_novo_brdo_mine_decision.desc: "The bustling mining town of [ShowLocationName('novo_brdo')] has developed its own set of rules and practices to manage the complex operations and rights associated with its lucrative industry. As of late, there has been a growing call to adopt a comprehensive nationwide mining code based on its principles. The proposed [ShowPolicyName('novo_brdo_mining_law')] would standardize the organization of mining towns, delineate the rights and responsibilities of miners, and ensure fair practices and safety measures across [ROOT.GetCountry.GetName]."
 ser_novo_brdo_mine_decision.desc.entry: "One mining town has worked out, through trial and dispute, rules that keep its shafts profitable and its miners from killing each other over them. Making [ShowLocationName('novo_brdo')]'s customs the law for every mine in $SER$ costs the other towns their local practice, but saves them from inventing the same rules badly."
 ser_novo_brdo_mine_decision.a: "Let us compile a new law."
 ser_novo_brdo_mine_decision.b: "Maintain the current mining regulations."
 has_unlocked_novo_brdo_tt: "Has unlocked the law via the #Y The [ShowLocationNameWithNoTooltip('novo_brdo')] Code#! [decision|e]"
 STATIC_MODIFIER_NAME_ser_novo_brdo_code: "The Novo Brdo Code"
 ser_novo_brdo_mine_decision.historical_info: "The Mining Code of Novo Brdo, established in 1412 by Stefan Lazarević, was a comprehensive set of regulations governing mining operations, workers' rights, and the organization of mining towns in medieval Serbia. It provided detailed guidelines on property rights, safety measures, and economic practices, significantly influencing the development and prosperity of mining communities."

 chi_grand_pronouncements_decision.title: "Grand Pronouncements"
 chi_grand_pronouncements_decision.desc: "[target_character.GetName|U] stipulates that the downfall of the previous dynasty was caused in its entirety by the corruption and overreach of the governmental ministers. In this vein, [target_character.GetHeShe] argues that a more strict and legalistic legal code should be enacted in order to prevent [ROOT.GetCountry.GetName] from suffering the same fate."
 chi_grand_pronouncements_decision.desc.entry: "Dynasties do not fall to invasion nearly so often as they fall to the ministers meant to be serving them. The court intends to write a code strict enough that no minister mistakes the palace for his own, whatever the cost to the flexibility such men usually enjoy."
 chi_grand_pronouncements_decision.a: "Strike down on corruption."
 chi_grand_pronouncements_decision.b: "Corruption? In our government? Impossible."
 chi_ming_dynasty_code_will_be_changed: "[ShowPolicyName('chi_ming_dynasty_code_policy')] will be changed to include the modifiers of [ShowModifier('chi_grand_pronouncements')]."
 integrated_grand_prounouncements: "Has integrated the [ShowModifier('chi_grand_pronouncements')] into the [ShowPolicyName('chi_ming_dynasty_code_policy')]."

 cas_right_of_possession_decision.title: "[ShowPolicyNameWithNoTooltip('right_of_possesion')]"
 cas_right_of_possession_decision.desc: "Under the steady guidance of the [ShowLawName('mesta_council_law')], our [ShowGoodsName('wool')] has prospered and expanded its influence over the [ROOT.GetCountry.GetAdjective] lands. To keep the organization thriving and under control, it would be beneficial to implement the [ShowPolicyName('right_of_possesion')], a law that would regulate the usage of pastures and force a reasonable limit on the rental payments necessary."
 cas_right_of_possession_decision.desc.entry: "A guild left to police itself eventually polices only its own interests. The [ShowLawName('mesta_council_law')] has grown [ShowGoodsName('wool')] into a fortune, and a fixed limit on pasture rents would keep that fortune from being extracted entirely from the farmers who lease the land beneath it."
 cas_right_of_possession_decision.a: "Establish the [ShowPolicyNameWithNoTooltip('right_of_possesion')]."
 cas_right_of_possession_decision.b: "The current situation is preferable."
 cas_right_of_possession_decision.c: "Abolish the [ShowLawNameWithNoTooltip('mesta_council_law')]!"
 cas_right_of_possession_decision.c.tt: "All [ShowGoodsNameWithNoTooltip('wool')] Locations we own in [ShowRegionName('iberia_region')] will lose the [ShowModifier('merino_wool')] Modifier permanently"

 cas_altered_nueva_recopilacion_decision.title: "Novísima Recopilación"
 cas_altered_nueva_recopilacion_decision.desc: "Despite the [ShowAdvanceName('enlightenment_advance')] creeping upon [ROOT.GetCountry.GetName], many of our laws have been outdated, specifically [ShowPolicyName('nueva_recopilacion_policy')]. Seeing that, [target_character.GetName] wishes to rid any traditionalist ideas, rewriting them to stray away from Roman canon law. This would help educate the masses, teaching them more than just the [ROOT.GetCountry.GetReligion.GetAdjective] faith that has been dominating our legal system."
 cas_altered_nueva_recopilacion_decision.desc.entry: "A legal code drafted before the [ShowAdvanceName('enlightenment_advance')] still governs us as though it had not happened. Rewriting the [ShowPolicyName('nueva_recopilacion_policy')] away from Roman canon law would teach the people something besides the faith the courts have leaned on for a century."
 cas_altered_nueva_recopilacion_decision.a: "We shall allow these ideas of progress to prosper."
 cas_altered_nueva_recopilacion_decision.b: "Let us not stray away from our traditions."
 cas_altered_nueva_recopilacion_decision.historical_info: "An improvement of the Nueva Recopilación, the Novísima Recopilación shied away from the Roman canon character that the previous version had. Instead, it was a stepping stone for the unification of Castile and Aragon within the Spanish realm. Implemented in 1805, these laws would be the study of any legal cases within Spain, but it would not be as modern as the rising Napoleonic Code at the time."
 spa_alter_nueva_recopilacion_policy_tt: "The [ShowPolicyName('nueva_recopilacion_policy')] [policy|e] bonuses will now focus on [research|e], and they will scale with the [estate_power|e] of the [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]."

 cas_spanish_cloth_industry_decision.title: "Reputable Merino [ShowGoodsNameWithNoTooltip('wool')]"
 cas_spanish_cloth_industry_decision.desc: "The increased quality of our [ShowGoodsName('wool')] has also increased its reputation in other European markets and increased the demand from abroad. This could open the industry led by the [ShowLawName('mesta_council_law')] to be a very profitable export for us if we support it. Some Members of the [ShowLawNameWithNoTooltip('mesta_council_law')] are also arguing to use this quality [ShowGoodsNameWithNoTooltip('wool')] as a basis to create a [ROOT.GetCountry.GetAdjective] [ShowGoodsName('fine_cloth')] industry and establish a strong [ROOT.GetCountry.GetCulture.GetName] Cloth Industry!"
 cas_spanish_cloth_industry_decision.desc.entry: "Raw [ShowGoodsName('wool')] sold abroad enriches foreign weavers more than it enriches us. Building a [ShowGoodsName('fine_cloth')] trade on the back of the [ShowLawName('mesta_council_law')] would let us sell the finished article instead, if the council can be persuaded the extra step is worth the investment."
 cas_spanish_cloth_industry_decision.a: "Focus on the export!"
 cas_spanish_cloth_industry_decision.a.tt: "All [ShowGoodsNameWithNoTooltip('wool')] Locations we own in [ShowRegionName('iberia_region')] will receive the [ShowModifier('quality_merino_wool')] Modifier for 50 years"
 cas_spanish_cloth_industry_decision.b: "Support our domestic industry."
 cas_spanish_cloth_industry_decision.b.tt: "Unlocks the Spanish Cloth Production Methods for [ShowBuildingTypeNameWithNoTooltip('fine_cloth_guild')]."
 has_unlocked_spanish_cloth_industry: "Has supported the Spanish Cloth Industry in the event"
 STATIC_MODIFIER_NAME_quality_merino_wool: "Quality Merino Wool"

 por_casa_de_india_decision.title: "Casa da Índia"
 por_casa_de_india_decision.desc: "We need to efficiently oversee and administer [ROOT.GetCountry.GetAdjective] interests and possessions in $india$ and [ShowContinentName('africa')]. It has been suggested that the best way to achieve this is to create an institution directly under the [ROOT.GetCountry.GetGovernment.GetAdjective] Treasurer with monopoly rights to all related trade connections and goods."
 por_casa_de_india_decision.desc.entry: "Trade scattered across $india$ and [ShowContinentName('africa')] is trade nobody is properly accounting for. One institution under the Treasurer, holding monopoly on the goods that matter most, would answer for all of it in a single ledger."
 por_casa_de_india_decision.a: "Sounds like a good plan."
 por_casa_de_india_decision.a.tt: "Unlocks the [ShowGovernmentReformName('por_casa_de_india')] [government_reform|e]"

 hol_ned_shipbuilding_decision.title: "The Fluitschip"
 hol_ned_shipbuilding_decision.desc: "The expansive [ROOT.GetCountry.GetCulture.GetName] economy has put large demands on our merchant marine. The very shallow [ROOT.GetCountry.GetCulture.GetNameWithNoTooltip] waters also mean that common merchant ships such as caravels are unable to approach many of the [ROOT.GetCountry.GetAdjectiveWithNoTooltip] ports. So far this has been handled by the use of smaller boeiers but with financial backing from [target_character.GetName], a merchant from [ShowLocationName('hoorn')], a new type of ship has been developed.\nThe fluitship or fluyt is longer and has a very characteristic pear-shaped stern and is built to be effectively manned by a small crew. As it is able to carry larger cargoes while still handling the shallow Dutch waters and behaving very well in the open sea this ship is a godsend for our merchants."
 hol_ned_shipbuilding_decision.desc.entry: "A boeier can reach the shallows our ports demand but carries too little to be worth the voyage. $name_peter.dutch_dialect$ $name_john.dutch_dialect$ $Liorne$ has funded a longer, pear-sterned design that manages both, carrying a real cargo through water barely deep enough for a rowboat."
 hol_ned_shipbuilding_decision.a: "This is definitely a good idea!"
 hol_ned_shipbuilding_decision_tt: "$name_peter.dutch_dialect$ $name_john.dutch_dialect$ $Liorne$ will join our [court|e]"
 hol_ned_shipbuilding_decision.b: "Interesting idea, but now it is not the time. Maybe later?"

 nov_ivan_hundred_strong_decision.title: "[ShowEstatePrivilegeNameWithNoTooltip('novgorod_ivans_hundred')] Merchant Association"
 nov_ivan_hundred_strong_decision.desc: "Being one of the major centers of trade, [ROOT.GetCountry.GetName] has come to be home to many powerful merchant associations. Among these associations however, the [ShowEstatePrivilegeName('novgorod_ivans_hundred')] is one of the most influential, maintaining a strong grip over the trade of [ShowGoodsName('beeswax')]. Seeking to grow their influence further, many of the association's high ranking officials have reached out to [our_ruler.GetName] and the Veche in hopes of earning further support. Some within the [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] have quietly urged [our_ruler.GetNameWithNoTooltip] to avoid empowering the association further, as they may grow to have too much influence over [ROOT.GetCountry.GetNameWithNoTooltip]'s trade."
 nov_ivan_hundred_strong_decision.desc.entry: "The [ShowEstatePrivilegeName('novgorod_ivans_hundred')] already controls the [ShowGoodsName('beeswax')] trade more thoroughly than any single guild ought to, and its officials want more support still. The $nobles_estate$ are quietly asking us to refuse them, fearing a merchant body too powerful to answer to the Veche at all."
 nov_ivan_hundred_strong_decision.a: "Grant them empowered support from the Veche."
 empower_ivan_hundred_privilege: "The [ShowEstatePrivilegeName('novgorod_ivans_hundred')] will gain the following for 25 years:\n#R -5.00%#! [ShowModifierTypeName('global_crown_estate_power')] and #G +20.00%#! [ShowModifierTypeName('global_merchant_capacity_modifier')]"
 ivan_hundred_strengthened_requirement: "The following bonus can be gained from the $nov_ivan_hundred_strong_decision.title$ [decision|e]:"
 variable_ivan_hundred_strengthened_tt: "The [ShowEstatePrivilegeName('novgorod_ivans_hundred')] has been Strengthened"
 ivan_hundred_strengthened: "Strengthend the Ivan's Hundred"

 nov_ivan_hundred_beeswax_decision.title: "[ShowEstatePrivilegeNameWithNoTooltip('novgorod_ivans_hundred')] Requests Monopoly on [ShowGoodsNameWithNoTooltip('beeswax')]"
 nov_ivan_hundred_beeswax_decision.desc: "Following additional support from the Veche, the [ShowEstatePrivilegeName('novgorod_ivans_hundred')] have grown to enjoy their higher status. Seeking to obtain further support for their endeavors, the association has requested that they been given a sole monopoly over the [ShowGoodsName('beeswax')] production in Novgorod. While the association has always maintained a large influence over the trade, a monopoly would firmly solidify their control over the good."
 nov_ivan_hundred_beeswax_decision.a: "Grant the request for greater influence over the [ShowGoodsNameWithNoTooltip('beeswax')] trade."
 nov_ivan_hundred_beeswax_decision.b: "Prevent the [ShowEstatePrivilegeNameWithNoTooltip('novgorod_ivans_hundred')] from growing stronger."
 ivan_hundred_beeswax_increase: "The [ShowEstatePrivilegeName('novgorod_ivans_hundred')] will gain the following for 25 years:\n#G +10.00%#! [ShowModifierTypeName('selling_efficiency')] and #G +25.00%#! [ShowModifierTypeName('global_beeswax_output_modifier')]"
 ivan_hundred_beeswax_increase_requirement: "The following bonus can be gained from the $nov_ivan_hundred_beeswax_decision.title$ [decision|e]:"
 ivan_hundred_beeswax: "Greater Influence over Beeswax trade"

 kbo_serfdom_reform_decision.title: "Continuation of Slave Raids"
 kbo_serfdom_reform_decision.desc: "As it happens in various parts of the continent, so too our economy depends largely on the influx and utility of forced labor. The frequent raids propped up by our army and local warlords supply our markets with fresh manpower to serve in every corner of our society. However, due to our recent advances and investment in these activities, we have accumulated a profound number of these people. Thus, it befalls on us to decide whether we wish to continue investing in these raids and magnify the flow of conquered people within or market or decide to grant them a position within our society and allow them to flourish as part of it."
 kbo_serfdom_reform_decision.a: "Our economy will greatly benefit from this trade."
 kbo_serfdom_reform_decision.b: "Let us work to integrate all in our society."
 kbo_pop_promotion_more_potent_tt: "We will gain access to the [ShowCabinetActionName('kbo_pop_promote_action')] unique [cabinet_action|e]"

 kbo_amenokal_salt_traders_decision.title: "Azalai & Taghlamt"
 kbo_amenokal_salt_traders_decision.desc: "For centuries, after the introduction of the camel in Western and Central Africa, many traders have taken it upon themselves to traverse the adverse environments in search of profits and mercantile adventures using routes such as the Azalai or Taghlamt. Known as the Amenokal, these powerful individuals would oversee and travel across the desert, from oasis to oasis, linking faraway locations and trading valuable [ShowGoodsName('salt')]. In these markets, salt would be sold in slabs or bricks in exchange for food, cattle, and other important commodities. Whether to give such a privileged overseeing position to powerful individuals or not is a delicate matter, and one that would require our most trusted advisors to handle."
 kbo_amenokal_salt_traders_decision.a: "Let the Amenokal of each caravan oversee their trade."

 kbo_sharia_courts_decision.title: "$sharia$ in $KBO$"
 kbo_sharia_courts_decision.desc: "Our great nation has been one of the oldest and fastest adopters of [ShowReligionAdjective('sunni')] [ShowReligionGroupName('muslim')]. With a newfound vigor for true belief and armed with relentless energy, we have done our best to consolidate our religious values and defend our people from prying heathens. However, one aspect of our faith that has not taken hold just yet, is the $sharia$. While the collection of religious laws is present in our country for a long time already, it does not reach into every corner of our country yet. Some of our advisors are favoring the creation of special courts with the task to carry the enforcement of the $sharia$, others caution against intertwining religion and administration."
 kbo_sharia_courts_decision.a: "Entrenching the $sharia$ deeper within our government the next logical step!"
 kbo_enable_sharia_courts_cabinet_action_tt: "We will gain access to the [ShowCabinetActionName('kbo_sharia_courts')] unique [cabinet_action|e]"

 teu_kulm_law_revised_decision.title: "Revising the $kulm_law$"
 teu_kulm_law_revised_decision.desc: "The [ShowSituationName('black_death')] has ravaged through the entire continent of [ShowContinentName('europe')], decimating numerous towns and plunging settlements into ruin. Though the economic impact on the [ROOT.GetCountry.GetLongName] has been terrible, worse yet is the fact that lower population in numbers in Germany have decreased migratory pressures, decreasing population growth in [ShowAreaName('prussia_area')]. Unless we provide more incentives to migrate into [ROOT.GetCountry.GetAdjectiveWithNoTooltip] lands, we will soon be left without any migrants, who form an essential part of our Christianization mission."
 teu_kulm_law_revised_decision.desc.entry: "The [ShowSituationName('black_death')] has thinned Germany enough that fewer migrants remain to send east, and our order in [ShowAreaName('prussia_area')] depends on a steady stream of them. Sweetening the terms of settlement costs concessions we would rather keep, but an empty frontier converts no one."
 teu_kulm_law_revised_decision.a: "Give more benefits to the migrants."
 teu_kulm_law_revised_decision.b: "We will need to cope with this."
 teu_impact_on_kulm_law: "[ShowEstatePrivilegeName('kulm_law')] will be modified by:\n#g +0.1#! [ShowModifierTypeName('rural_migration_attraction')]\n#r -10.0%#! [ShowModifierTypeName('burghers_estate_max_tax')]"
 teu_impact_on_kulm_law_not_revised: "[ShowEstatePrivilegeName('kulm_law')] will be modified by:\n#r -50.0%#! [ShowModifierTypeName('german_migration_attraction_modifier')]\n#g +10.0%#! [ShowModifierTypeName('global_pop_assimilation_speed_modifier')]"
 kulm_law_revised_tooltip: "Has revised the [ShowEstatePrivilegeName('kulm_law')] through the $teu_kulm_law_revised_decision.title$ [decision|e]."
 kulm_law_not_revised_tooltip: "Has chosen not to revise the [ShowEstatePrivilegeName('kulm_law')] through the $teu_kulm_law_revised_decision.title$ [decision|e]."

 bra_kreditwerk_reformed_decision.title: "Reform the $bra_kreditwerk$"
 bra_kreditwerk_reformed_decision.desc: "Despite the Powers granted to the Kreditwerk, the Institution managed to go into heavy debt, mismanaging our finances to a large degree. Since we are now faced with the immediate bankruptcy of the Kreditwerk, we will have to make a decision regarding its future. There are multiple factions forming within the ranks of our advisors, some advising it to reform the Kreditwerk and put it under the direct administration of the crown, while others recommend the total abolishment of the Institution."
 bra_kreditwerk_reformed_decision.a: "Reform the Institution under the crown."
 bra_kreditwerk_reformed_decision.b: "Let's get rid of this evil."
 bra_kreditwerk_reformed_decision.c: "Bail it out and let it continue."

 boh_unity_brethren_decision.title: "Support the Unity of Brethren"
 boh_unity_brethren_decision.desc: "During the past years of practicing [ShowReligionAdjective('hussite')] liturgy, the tree of our faith has sprung many branches as it flourishes and grows within our country. Many believers flock to congregations to partake in ecclesiastical rituals, purified and free from the touch of heretics gone astray.\n\nHowever, in this environment of piety and theolatry, a growing number of our [ShowEstateTypeName('clergy_estate')] have turned to an extreme interpretation of [ShowReligionNameWithNoTooltip('hussite')] that preaches the exclusion of the nobility and merchants from becoming representatives of the Church, liturgy being conducted in simple and humble ceremonies while rejecting the apostolic succession."
 boh_unity_brethren_decision.desc.entry: "A faith that keeps growing eventually grows past what its founders intended, and ours has. Some of the $clergy_estate$ now preach that nobles and merchants have no place in the Church at all, which is a purer doctrine than the one we started with and a considerably more disruptive one."
 boh_unity_brethren_decision.a: "Let them preach, their words hold truth."
 unity_brethren_privilege: "Unity of Brethren"
 unity_brethren_privilege_desc: "A movement of radical [ShowReligionName('hussite')] focused around the bare elegance of preaching and worshipping, focusing on excluding powerful individuals from the [ShowEstateTypeName('burghers_estate')] and [ShowEstateTypeName('nobles_estate')] while promoting the mother tongue and simplified ceremonies during communion."

 ara_sindicat_remenca_decision.title: "Sindicat Remença"
 ara_sindicat_remenca_decision.desc: "The nobility in the [ROOT.GetCountry.GetLongName] has begun to strictly enforce the rules that tie peasants to the land, and this combined with a stricter enforcement of seignorial rights in general has led to unrest among the peasants. The poorest peasants strongly support open rebellion while the better off favor appealing to us for reforms and the end of seignorial abuses.\n\nIt would be an excellent opportunity to gain the support of the peasants, as we are in a constant power struggle with the nobility. Suggestions have been made regarding allowing the peasants to form a [ShowEstatePrivilegeName('ara_sindicat_remenca')], a peasants' guild or primitive trade union, which will grant them more liberty."
 ara_sindicat_remenca_decision.desc.entry: "A peasant bound absolutely to the land has no lawful way to resist his lord, only an unlawful one, and unlawful resistance is what the poorest among them are now choosing. A chartered guild gives the better-off peasants a legal outlet instead, and buys us their loyalty against the nobility at very little cost to the crown."
 ara_sindicat_remenca_decision.a: "Allow the peasants to form the Sindicat Remença."
 ara_sindicat_remenca_decision.b: "Ignore the peasant rabble."
 ara_sindicat_remenca: "Sindicat Remença"
 ara_sindicat_remenca_desc: "The Sindicat Remença is a peasants' guild or primitive trade union. This was first introduced in Catalonia in 1448."

 nov_tysiatskii_influential_decision.title: "The Old Tysiatskii"
 nov_tysiatskii_influential_decision.desc: "Though the [ShowEstatePrivilegeName('tysiatskii_privilege')] has remained a elected office within [ROOT.GetCountry.GetName], it has largely remained a office that the [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] has maintained a close control of, with many elected Tysiatskii often hailing from [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] families. However, in recent times, even after retiring from the office, former Tysiatskii has grown to maintain considerable influence over the subsequent election, oftentime advocating for a son to succeed them in the position. Known as #italic Old Tysiatskii#!, these individuals have grown to be a force to be reckoned with within the Veche."
 nov_tysiatskii_influential_decision.desc.entry: "An elected office is not much of a check on power if the same families keep winning the election. The #italic Old Tysiatskii#! now steer the vote toward their own sons even after leaving office, and the $nobles_estate$ have quietly made the post theirs in all but name."
 nov_tysiatskii_influential_decision.a: "We should seek to wield their influence."
 nov_tysiatskii_influential_decision.b: "Strive to weaken [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] influence over the office."
 nov_tysiatskii_influential_decision.b.entry: "Strive to weaken $nobles_estate$ influence over the office."
 nov_tysiatskii_influence_weakened: "Tysiatskii Influence Weakened"
 nov_influential_tysiatskii: "Influential Tysiatskii"
 nov_tysiatskii_influence_weakened_benefits: "The [ShowEstatePrivilegeName('tysiatskii_privilege')] will gain the following for 30 years:\n#G -25.00%#! [ShowModifierTypeName('global_nobles_estate_power')] and #G +0.10#! [ShowModifierTypeName('stability_investment')]"
 nov_tysiatskii_influence_event_happened: "Tysiatskii has gained more influence!"
 nov_tysiatskii_influence_event_happened_possible_event: "The Tysiatskii may attempt to assert himself over the [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] in the future!"
 nov_influential_tysiatskii_benefits: "The [ShowEstatePrivilegeName('tysiatskii_privilege')] will gain the following for 30 years:\n#R +25.00%#! [ShowModifierTypeName('global_nobles_estate_power')] and #G +15.00%#! [ShowModifierTypeName('army_heavy_infantry_power')]"
 nov_influential_tysiatskii_requirement: "The following bonus can be gained from the $nov_tysiatskii_influential_decision.title$ [decision|e]:"
 nov_tysiatskii_influence_weakened_requirement: "The following bonus can be gained from the $nov_tysiatskii_influential_decision.title$ [decision|e]:"

 boh_district_paving_decision.title: "Taxation Rights of the [ShowLocationNameWithNoTooltip('prague')] Districts"
 boh_district_paving_decision.desc: "As the urban borders of [ShowLocationName('prague')] grow, many prominent figures that serve as heads of the various districts of the city, such as the Malá Strana, have come forth demanding the right to tax the citizens that live within their boundaries.\n\nThis move would certainly transfer a lot of influence from the hands of our treasury to that of the [ShowEstateTypeName('nobles_estate')] and must therefore be examined with utmost caution."
 boh_district_paving_decision.a: "Very well, grant them their request."

 boh_joint_assembly_decrees_decision.title: "A Joint General Assembly"
 boh_joint_assembly_decrees_decision.desc: "Since our ascension as the heads of the [GetUniqueInternationalOrganization('hre').GetName], we have noticed a distinct difference between the Empire's judicial procedures and ours. The gap widens with cultural and traditional differences even more as we strive to defend and legitimize our rule.\n\nIn an effort to cement our position and bring our people closer to the Empire, many advisors to [target_character.GetName] have suggested a joint general assembly. It would feature members of the [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] and figureheads from all imperial princes alongside ours, and allow the confirmation of many existing Roman laws pertaining to their privileges."
 boh_joint_assembly_decrees_decision.desc.entry: "Ruling the $hre$ and ruling our own lands are, in practice, two different jobs with two different sets of law, and the gap between them grows more awkward every year we hold both crowns. A joint assembly seating our $nobles_estate$ alongside the imperial princes would confirm the Roman laws they value, at the cost of treating them as something closer to equals."
 boh_joint_assembly_decrees_decision.a: "A vital and necessary step to legitimize our rule."
 every_elector_25_opinion_tt: "Every Elector will gain [ShowBiasValue('granted_joint_assembly_decrees_modifier')|+=0] opinion of us"

 ven_doges_palace_decision.title: "Expanding the [ShowBuildingTypeNameWithNoTooltip('doges_palace')]"
 ven_doges_palace_decision.desc: "The construction of the [ShowBuildingTypeName('doges_palace')] in [ShowLocationName('venice')] began in the 9th century and continued throughout the subsequent centuries. Originally conceived as a fortress-like edifice, the palace evolved over time into a magnificent representation of Gothic architecture. This architectural marvel serves the dual purpose of being both the residence of the [ROOT.GetCountry.GetGovernment.GetRulerTitle], the preeminent political leader of the [GetCountry('VEN').GetLongNameWithNoTooltip] and housing various government offices and courts.\n\nOver the time, however, the building has grown visibly old and in a need of renovation. Perhaps, we should consider turning it into a palace that would dwarf even the royal residences of Western kings."
 ven_doges_palace_decision.desc.entry: "A palace begun as a fortress in the 9th century has grown grand by accident rather than by design, and it shows. Rebuilding the [ShowBuildingTypeName('doges_palace')] into something that outshines the residences of western kings would cost a fortune we would otherwise spend on ships."
 ven_doges_palace_decision.a: "Sound idea!"
 ven_doges_palace_decision.historical_info: "By the 16th century, the Doge's Palace had undergone substantial renovations and expansions, resulting in a significant augmentation of its grandeur. One of the most remarkable developments was the completion of its iconic facade, which faced the Grand Canal, showcasing the palace's architectural splendor to all who approached by water. This period of renovation and expansion further solidified the palace's status as an enduring symbol of Venetian power and authority. Its halls and chambers, characterized by intricate designs and opulent decorations, not only bore witness to centuries of political activities but also stood as an enduring testament to the city's rich history and continued significance on the global stage."

 ven_piazza_san_marco_decision.title: "[ShowBuildingTypeNameWithNoTooltip('piazza_san_marco')]"
 ven_piazza_san_marco_decision.desc: "The growing power and wealth of our illustrious [ROOT.GetCountry.GetFlavorRank] call for an investment in the development of our capital, ensuring that our prosperity is visibly reflected in the grandeur of [ShowLocationName('venice')]. A proposal has been brought forward to renovate the central square, [ShowBuildingTypeName('piazza_san_marco')], transforming it with magnificent arches and marble to showcase the splendor of our maritime empire. Such renovation would enhance the beauty of our city and serve as a testament to our enduring power and cultural prominence."
 ven_piazza_san_marco_decision.desc.entry: "A maritime empire that looks poor at home will not be believed rich abroad. Rebuilding the square before [ShowLocationName('venice')]'s palace in marble and arches spends coin on nothing anyone can eat, and buys a reputation that opens doors coin alone cannot."
 ven_piazza_san_marco_decision.a: "We shall fund the renovation."
 unlocked_piazza_san_marco_tt: "We have unlocked the $piazza_san_marco$ [building|e] through a flavor [decision|e]"
 ven_piazza_san_marco_decision.historical_info: "#italic Piazza San Marco#!, also known as St. Mark's Square, is the principal public square in Venice, Italy, and one of the city's most famous landmarks. The square, developed around the 9th century and expanded to its present size in the 12th century, has been continously improved with new renovations and new landmarks. It is surrounded by iconic buildings, including St. Mark's Basilica, the Doge's Palace, and the St. Mark's Clocktower, and served as a central gathering place in Venice for centuries, hosting political, religious, and social activities."

 ven_teatro_san_cassiano_decision.title: "[ShowBuildingTypeNameWithNoTooltip('teatro_san_cassiano')]"
 ven_teatro_san_cassiano_decision.desc: "[ShowLocationName('venice')], already a glittering jewel of [ShowRegionName('italy_region')]'s cultural landscape, has long been home to a thriving community of artists and performers. To further cement its status as a center of artistic excellence and to provide a grand stage for our talented citizens, there is a growing call to construct a magnificent theatre and opera house. The proposed [ShowBuildingTypeName('teatro_san_cassiano')] would be a beacon of splendor and wealth, showcasing the artistic brilliance of [ShowLocationNameWithNoTooltip('venice')] and attracting admirers from far and wide."
 ven_teatro_san_cassiano_decision.desc.entry: "A city already famous for its art has nowhere fit to stage the best of it. The proposed [ShowBuildingTypeName('teatro_san_cassiano')] would give [ShowLocationName('venice')] a stage worthy of its reputation, and give every rival port one more reason to envy us."
 ven_teatro_san_cassiano_decision.a: "Commission its construction!"
 unlocked_teatro_san_cassiano_tt: "We have unlocked the $teatro_san_cassiano$ [building|e] through a flavor [decision|e]"
 ven_teatro_san_cassiano_decision.historical_info: "The Teatro San Cassiano, built in Venice in 1637, was the first public opera house in the world, marking a significant milestone in the history of performing arts and solidifying Venice's role as a leading cultural center."

 ven_walls_of_ston_decision.title: "Fortifying [ShowLocationNameWithNoTooltip('dubrovnik')]"
 ven_walls_of_ston_decision.desc: "[ShowLocationName('dubrovnik')] is a major trading [target_location.GetRank.GetName] and one of the most valuable assets of our maritime empire. Despite its importance, [ShowLocationNameWithNoTooltip('dubrovnik')]'s defense is quite outdated, making it an easy prey for our enemies invading from both the land and the sea. Allocating gold to the modernization of the existing walls and building a proper fortification to protect it would certainly not go to waste."
 ven_walls_of_ston_decision.desc.entry: "[ShowLocationName('dubrovnik')] earns us more in a good trading season than most of our provinces manage in a year, and it could be taken by a raiding party that never troubles to besiege it properly. Proper walls cost gold we would rather spend elsewhere, right up until the day the city falls without them."
 ven_walls_of_ston_decision.a: "[ShowLocationNameWithNoTooltip('dubrovnik')] must be well protected."
 ven_walls_of_ston_decision.b: "Its current fortifications are strong enough."
 ven_walls_of_ston_decision.historical_info: "Built in the 14th century, the Walls of Ston are a series of defensive stone walls located on the Pelješac Peninsula in Croatia. These walls serve to protect the valuable salt pans and the town of Ston. Extending approximately 7 kilometers, the Walls of Ston are among the longest fortifications in Europe, renowned for their impressive length and strategic importance in medieval time."

 zan_husuni_kubwa_decision.title: "The [ShowBuildingTypeNameWithNoTooltip('husuni_kubwa')]"
 zan_husuni_kubwa_decision.desc: "[GetCharacter('zan_abu_al_mawahib_al_hasan_ibn_suleiman').GetName] originally commissioned a [ROOT.GetCountry.GetGovernment.GetAdjective] residence at the heart of [target_location.GetName], intended to be the most impressive palace. However, misfortunes, the redirection of funds, and personal illness all sought to stall and outright end the project. Despite these troubles, our architects have presented an updated plan for the palace, bolstered with warehouses and chambers especially made for merchant exchanges, accompanied by an illustrious throne room. Their only obstacle, right now, is coin."
 zan_husuni_kubwa_decision.desc.entry: "Every ruler before us wanted this palace finished and every ruler before us found a reason it could not be. A new plan for [ShowLocationName('kilwa_kisiwani')], with warehouses enough to match our trade and a throne room worth receiving guests in, waits only on the money the previous attempts also lacked."
 zan_husuni_kubwa_decision.a: "Commission the construction."
 zan_husuni_kubwa_decision.b: "It is too expensive, for now..."
 zan_husuni_kubwa_decision.historical_info: "Husuni Kubwa stands as a testament to the architectural and political prowess of the Kilwa Sultanate during its 14th-century zenith. Built under Sultan al-Ḥasan ibn Sulaymān in Kilwa Kisiwani, this sprawling palace complex, covering 1.6 hectares, was constructed primarily from coral stone and featured a blend of Swahili, Islamic, and Persian architectural influences. It included luxurious private chambers, large courtyards, sophisticated bathhouses, and storage rooms, highlighting its multifaceted role as a royal residence, commercial hub, and fortification."
 construct_the_building_at_another_time_tt: "We may choose to construct the [ShowBuildingTypeNameWithNoTooltip('husuni_kubwa')] at another time..."
 unlocked_husuni_kubwa_tt: "We have unlocked the $husuni_kubwa$ [building|e] through a flavor [event|e]"

 pap_quirinal_palace_decision.title: "Summer Residence of the Popes"
 pap_quirinal_palace_decision.desc: "The [GetCountry('PAP').GetGovernment.GetRulerTitle] has expressed interest in establishing a summer residence away from the bustling, crowded streets of central [ShowLocationName('rome')]. Quirinal Hill, one of the famed Seven Hills of [ShowLocationNameWithNoTooltip('rome')], is seen as an ideal location, offering a tranquil escape with cool breezes and panoramic views. If we proceed, the renowned architect [fontana.GetName] could oversee the design and construction of the palace."
 pap_quirinal_palace_decision.desc.entry: "The bustle of central [ShowLocationName('rome')] is exactly what a Pope wants to avoid, and Quirinal Hill offers the breeze and the view without the crowd. $name_dominic$ $Fontana$ is the architect capable of building it, provided the Holy See is willing to pay for a second residence it does not strictly need."
 pap_quirinal_palace_decision.a: "Build the summer residence on Quirinal Hill."
 pap_quirinal_palace_decision.b: "This is not the time for lavish projects, we should focus on improving the skills of our artists instead."
 pap_quirinal_palace_decision.historical_info: "The Quirinal Palace was commissioned in 1583 by Pope Gregory XIII as a summer residence for the papacy. Designed with input from prominent architects, including Domenico Fontana, the palace offered a retreat from the heat and crowds of central Rome. When the newly formed Kingdom of Italy annexed much of what was left of the Papal State, the Quirinal Palace palace became the seat of Italian kings."

 nav_camara_comptos_decision.title: "The Cámara de Comptos"
 nav_camara_comptos_decision.desc: "Finances of a realm are a serious thing and our [ROOT.GetCountry.GetGovernment.GetRuler.GetName] believes that the [ROOT.GetCountry.GetLongName] will greatly benefit if we found a permanent institution to handle these issues.\n\nDrawing inspiration from similar institutions in the [GetCountry('FRA').GetLongName], we will make our nation more economically viable and capable of handling better the possible financial struggles that our delicate situation can make us face."
 nav_camara_comptos_decision.desc.entry: "A treasury run on improvisation manages well enough in good years and fails badly in bad ones, and $FRA$'s example shows a standing institution fares better than either. Founding our own would trade some of the ruler's personal discretion over the purse for an office that outlasts any single ruler's attention to it."
 nav_camara_comptos_decision.a: "A permanent court will be established."
 nav_camara_comptos_decision.historical_info: "The origin of the Cámara de Comptos can be found in the #italic oidores#! (from the verb #italic oir#!, 'to hear'), officers that administered and supervised the royal finances since at least 1258, when the first Book of Comptos can be dated. This institution, deeply influenced by similar French ones (as the #italic Chambre des Comptes#! of Paris), was made permanent by King Charles II and carried the duty of controlling the expenses of the realm and advice the rulers in financial matters.\n\nIt is considered the oldest Court of Auditors of Spain and it is still in use, serving the Parliament of the Chartered Community of Navarre."

 hun_bibliotheca_corviniana_decision.title: "[ShowBuildingTypeNameWithNoTooltip('bibliotheca_corviniana')]"
 hun_bibliotheca_corviniana_decision.desc: "As the [ShowInstitutionName('renaissance')] spreads across the continent like a wildfire, igniting the flames of knowledge and cultural rebirth, our [ROOT.GetCountry.GetGovernment.GetCourtTitle] has been abuzz with the possibilities it brings. Scholars, artists, and thinkers have begun to gather in our cities, inspired by the new wave of ideas sweeping through [ShowContinentName('europe')]. A suggestion was brought up - to construct a grand library in [ROOT.GetCountry.GetCapital.GetName] - one that would attract scholars from far and wide, and make [GetCountry('HUN').GetName] a bastion of the [ShowInstitutionNameWithNoTooltip('renaissance')]. Funding such an ambitious project, however, would be quite expensive. Shall we invest in the building of [ShowBuildingTypeName('bibliotheca_corviniana')]?"
 hun_bibliotheca_corviniana_decision.desc.entry: "Every city claiming to lead the [ShowInstitutionName('renaissance')] has already built something to prove it, and $HUN$ has not. A great library in the capital would draw the scholars currently passing us by, at a cost that will look easier to justify in hindsight than it does today."
 hun_bibliotheca_corviniana_decision.a: "Magnificent!"
 hun_bibliotheca_corviniana_decision.b: "We are better served with improving our educational instituations."
 unlocked_bibliotheca_corviniana_tt: "We have unlocked the $bibliotheca_corviniana$ [building|e] through a flavor [decision|e]"
 hun_bibliotheca_corviniana_decision.historical_info: "Matthias Corvinus, nicknamed the Renaissance King, was a great patron of arts and science. During his reign, Hungary became the first country outside of Italy to embrace the Renaissance, and Bibliotheca Corviniana became one of his largest contributions to the cultural revival in Hungary. It served as a hub for scholarly exchange and played a pivotal role in the dissemination of knowledge throughout the country. Scholars from across the continent were drawn to the library, contributing to the intellectual vibrancy of the Renaissance. It served as a symbol of the Renaissance's intellectual fervor in Hungary and the power of patronage in cultivating knowledge and innovation."

 mam_ablaq_palace_decision.title: "The Citadel of [ShowLocationNameWithNoTooltip('cairo')]"
 mam_ablaq_palace_decision.desc: "A hub of knowledge, enlightenment, and ample trade between the depths of [ShowContinentName('africa')] and the Mediterranean, [target_location.GetName] is the beating heart of our growing [ROOT.GetCountry.GetFlavorRank]. The citadel has served generations of the most illustrious and prestigious rulers. Our current [ROOT.GetCountry.Custom('GetRulerOrRegentTitle')] has recently been presented with ambitious plans to expand the various facets of it that would involve a new mosque-madrasa, an expanded audience hall as well as a center to manufacture Kiswa."
 mam_ablaq_palace_decision.desc.entry: "A citadel that has hosted generations of rulers can still be made to look as though it hosts only the greatest of them. Expanding it with a new mosque-madrasa, a grander audience hall and a Kiswa workshop would say as much about our reign as any campaign, for considerably less blood."
 mam_ablaq_palace_decision.a: "Very well."
 mam_ablaq_palace_decision.b: "We will be frugal, instead."
 unlocked_ablaq_palace_tt: "We have unlocked this [building|e] through the '$mam_ablaq_palace_decision.title$' [decision|e]"

 son_trans_saharan_decision.title: "Flourishment of the Trans-Saharan Trade"
 son_trans_saharan_decision.desc: "The Trans-Saharan Trade has reached new levels since we dominated the routes. Instead of sitting idly, we can try to expand our outposts in the destinations where our caravans arrive. [ShowLocationName('alexandria')], [ShowLocationName('tunis')], and [ShowLocationName('fez')] specifically, they are the main destinations that should be aided."
 son_trans_saharan_decision.a: "Let these caravan stops flourish."
 son_trans_saharan_decision.b: "Instead of the locations, let us reinforce the entire trade."
 son_trans_saharan_decision.c: "Investing money into this is not worth it."
 son_unlock_unique_buildings_in_alexandria_tunis_and_fez_tt: "Unlocks the construction of [ShowBuildingTypeName('trans_saharan_trade_outposts')] in [ShowLocationName('fez')], [ShowLocationName('tunis')], and [ShowLocationName('alexandria')]"

 son_conversion_west_africa_decision.title: "Converting the [ShowReligionGroupAdjectiveWithNoTooltip('folk_african_group')] Nations"
 son_conversion_west_africa_decision.desc: "Although we are the strongest power in [ShowRegionName('guinea_region')], there are still nations that do not follow [ShowReligionGroupName('muslim')]. While we could use force to convert them, [target_character.GetName] wants to pursue a more peaceful strategy. [target_character.GetSheHe|U] wishes to use diplomacy to spread [ShowReligionGroupNameWithNoTooltip('muslim')] rather than using the sword to stir up more unrest."
 son_conversion_west_africa_decision.desc.entry: "The sword converts no one who survives the conversion, only silences those who might have argued. The ruler would rather send missionaries into [ShowRegionName('guinea_region')] than soldiers, trading a slower spread of the faith for one that does not leave a smoking village behind it."
 son_conversion_west_africa_decision.a: "That sounds like a good idea."
 son_conversion_west_africa_decision.b: "Using force is the better option."
 son_unlock_diplo_action_to_demand_conversion_tt: "We will unlock the [ShowCountryInteractionName('demand_conversion_to_islam')] [country_interaction|E] against the unbelievers of [ShowRegionName('guinea_region')]"

 ori_elephant_hunting_grounds_decision.title: "The Hunt for [ShowGoodsNameWithNoTooltip('elephants')]"
 ori_elephant_hunting_grounds_decision.desc: "With a surplus of [ShowGoodsName('elephants')] in [ROOT.GetCountry.GetName], discussions have arisen about increasing the number of regiments that utilize these mighty beasts. However, our current [ShowBuildingTypeName('elephant_hunting_grounds')] lack the resources needed to properly expand their hunting operations and supply adequate equipment. It may be time to provide them with the support they require. [target_character.GetName] and the [ROOT.GetCountry.GetGovernment.GetCourtTitle], in particular, are even willing to allocate some of their own funds to make this a reality."
 ori_elephant_hunting_grounds_decision.desc.entry: "An elephant is worth little to the army until someone has caught, trained, and equipped it, and our [ShowBuildingTypeName('elephant_hunting_grounds')] presently manage barely any of that. The court is prepared to spend its own coin on the expansion, which leaves the choice less about money than about whether more war elephants suit our present ambitions."
 ori_elephant_hunting_grounds_decision.a: "Let us sponsor these hunts."
 ori_elephant_hunting_grounds_decision.b: "No need to waste any money on this."
 ori_double_elephant_hunting_ground_level_tt: "The max level of the [ShowBuildingTypeName('elephant_hunting_grounds')] [building|e] will be increased by #G +2#!"
 INCREASED_MAX_LEVEL_ELEPHANT_HUNTING_GROUND: "Increased Max Level from [events|e]"

 jap_rangaku_decision.title: "Rangaku"
 jap_rangaku_decision.desc: "The [target_country.GetAdjective] merchants have now been present on Dejima Island in [target_location.GetName] for some time, and contact between our people and the enclave has been tightly controlled. Even so, our two cultures cannot help but spot glimpses of the other. The [target_country.GetAdjectiveWithNoTooltip] people seem to know things that we do not, particularly in medicine, but also in science, production, and mechanical engineering. Some of our richer citizens have even elected to make use of the [target_country.GetAdjectiveWithNoTooltip] surgeon in the enclave, rather than rely on local doctors.\n\nIt is clear there is much that could be learned from increased interaction with these visitors from the West, if we are willing to risk opening our provinces to them a bit more."
 jap_rangaku_decision.desc.entry: "A closely watched trading post still lets a little knowledge leak through the walls meant to contain it, and the $NED_ADJ$ enclave has been leaking medicine, mechanics, and science for years now. Loosening our watch would let in more of it, at the cost of the isolation that watch was built to preserve."
 jap_rangaku_decision.a: "Open our provinces to the [target_country.GetAdjectiveWithNoTooltip] knowledge."
 jap_rangaku_decision.a.entry: "Open our provinces to the $NED_ADJ$ knowledge."
 jap_rangaku_decision.a.tt: "Unlocks the [ShowGovernmentReformName('jap_rangaku')] [government_reform|e]"
 jap_rangaku_decision.b: "Keep our provinces closed."

 mch_mandarin_language_reforms_decision.title: "Adopting the Old Regime"
 mch_mandarin_language_reforms_decision.desc: "We are but another line in the lineage of the divine emperors of $china$. The various dynasties before us have already established efficient bureaucracies that were able to hold the massive [GetInternationalOrganization('middle_kingdom').GetName] together. Why should we not adopt those policies? Such action would make us more [ShowSocietyDirectionName('sinicized')], but would also preserve continuity and bolster our authority in eyes of the commons."
 mch_mandarin_language_reforms_decision.a: "We shall adopt those institutions."
 mch_mandarin_language_reforms_decision.b: "Favor the [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')]."
 mch_mandarin_language_reforms_decision.b.entry: "Favor the $tribes_estate$."
 unlock_chinese_language_reforms: "This will lock the [ShowGovernmentReformName('three_departments_system')] [government_reform|e]."
 MCH_conditional_benefit: "If we do not embrace [ShowGovernmentReformName('three_departments_system')] [government_reform|e], [ShowEstatePrivilegeName('mch_tribal_favor')] will give additional benefits."

 pru_unified_legal_system_decision.title: "A Reform of Law"
 pru_unified_legal_system_decision.desc: "A state like ours needs to be adaptable to changes at all times. Now a promising candidate is rising through the ranks of our legal system, that could spearhead direly needed reforms of our legal system. This [target_character.GetName] has been working as the president of the #italic Kammergericht#! and has drafted plans to reform the legal system all over [ROOT.GetCountry.GetName]. If we support his efforts this could lead to a swift and radical reformation of our country."
 pru_unified_legal_system_decision.desc.entry: "A legal system inherited from a dozen different eras serves no one especially well, which is usually reason enough for it to survive another generation unreformed. The president of the #italic Kammergericht#! has drafted the plans to change that, and backing him commits us to reform whose full shape we have not yet seen."
 pru_unified_legal_system_decision.a: "Support his reforms!"
 pru_unified_legal_system_decision.a_tt: "The [character|e] proposing the reform will appear in our [court|e]"
 pru_unified_legal_system_decision.a.tt: "The Reform Progress will be significantly faster"
 pru_unified_legal_system_decision.b: "Rein his ambitions in."
 pru_unified_legal_system_decision.b.tt: "The Reform Progress will be significantly slower"

 boh_bohemian_commonwealth_decision.title: "Establishment of a Commonwealth"
 boh_bohemian_commonwealth_decision.desc: "Our path through history has seen [ROOT.GetCountry.GetName] rise from a minor power to imperial heights - becoming a major power on the global scene, ruling vast regions and numerous nations. Governing such a nation, however, requires a steady hand. With fears of separatism and tension between the [ROOT.GetCountry.GetFlavorRank]'s nationalities, some are suggesting to adopt a new constitution. They claim that must look beyond what has traditionally been considered [ROOT.GetCountry.GetNameWithNoTooltip] to establish a greater commonwealth. Our empire shall span vast regions of [ShowContinentName('europe')], and we shall take our seat among the great powers of the world."
 boh_bohemian_commonwealth_decision.desc.entry: "An empire that rose from a minor kingdom did not do so by treating its many nations as one, and holding them together now may require finally admitting they are not. A new commonwealth, wider than what was traditionally ours, risks the very identity that built the empire in order to keep the empire from tearing along its seams."
 boh_bohemian_commonwealth_decision.a: "Adopt a new constitution."

 ned_unified_dutch_admiralties_decision.title: "Establishment of the Five Admiralties"
 ned_unified_dutch_admiralties_decision.desc: "Our lands may be ruled by [target_character.GetName], but the differences between our provinces have divided our [ShowBuildingTypeName('admiralty')] up. This factionalism between [ShowLocationName('groningen')], [ShowLocationName('hoorn')], [ShowLocationName('rotterdam')], [ShowLocationName('middelburg')], and [ShowLocationName('amsterdam')] prevents us from unifying our navies. However, allowing them to pursue their interest may allow for a higher commitment from each of them."
 ned_unified_dutch_admiralties_decision.desc.entry: "Five admiralties answering to five ports is five navies competing for the same ships. Unifying [ShowLocationName('groningen')], [ShowLocationName('hoorn')], [ShowLocationName('rotterdam')], [ShowLocationName('middelburg')] and [ShowLocationName('amsterdam')] under one command would end the rivalry, though letting each pursue its own interest a while longer might in fact raise more from all five than forcing the merger ever would."
 ned_unified_dutch_admiralties_decision.a: "Let us allow these admiralties to exist on their own."
 ned_unified_dutch_admiralties_decision.b: "Unify them into one."
 NED_UNLOCKS_UNIFIED_ADMIRALTIES_GOV_REFORM: "Unlocks the [ShowGovernmentReformName('unified_admiralty_reform')] [government_reform|e]."
 ned_unified_dutch_admiralties_decision.historical_info: "During the Dutch Revolt against the Habsburgs, the Dutch people created a confederation in which each province was allowed to retain its own interests. This confederation, though, was still plagued with factionalism, as the Statists and Orangists fought for control over the numerous provinces. It was not until the Napoleonic Era and the Batavian Republic that this whole system was abolished, leading to the Kingdom of the Netherlands as we know it."

 hol_ned_seven_provinces_decision.title: "The Seven Provinces"
 hol_ned_seven_provinces_decision.desc: "Although the Low Countries have been unified with a common cause, they are still divided thanks to de-jure claims and cultural differences. However, we can use this disunity to our advantage. By creating a confederation where each province has its laws and rights, whilst still having them obey the central government, we can properly ensure that each one of them is protected and can prosper on their own, allowing us to look outwards instead."
 hol_ned_seven_provinces_decision.a: "Let us create this confederation."
 hol_ned_seven_provinces_decision.b: "Decentralizing is not the solution."

 swe_age_of_freedom_decision.title: "Re-Evaluating Absolutism"
 swe_age_of_freedom_decision.desc: "[ROOT.GetCountry.GetName|U] is on the brink of collapse. The current [ROOT.GetCountry.GetGovernment.GetActiveRegentTitle] has as many detractors as supporters, with groups popping up to support rival claimants every day. There has been so much foreign interference in [ROOT.GetCountry.GetAdjectiveWithNoTooltip] rule that we feel more like a puppet state than a great nation, and people of all classes openly resent carrying the crushing weight of absolute rule.\n\nTo maintain total control could prove to be a fatal blunder on the [ROOT.GetCountry.GetGovernment.GetActiveRegentTitle]'s part. We must prepare for violent opposition to whichever choice we make."
 swe_age_of_freedom_decision.desc.entry: "A regent with rivals in every corner of the realm is not really ruling, only refereeing, and foreign courts have noticed the difference as clearly as our own subjects have. Holding to absolute rule now risks a fight none of us can be certain of winning, whichever way we choose to answer it."
 swe_age_of_freedom_decision.a: "Abandon absolutism."
 swe_age_of_freedom_decision.b: "Hold on to the reins..."
 swe_age_of_freedom_always: "This is a locked reform that can not be removed by choice."
 swe_age_of_freedom_decision.historical_info: "The death of the childless Charles XII left his younger sister Ulrika Eleonora in charge as Queen. The staunch parliamentarian, Chancellor Arvid Horn, immediately seized this opportunity to bring down the absolutism and strengthen the powers of Parliament. While his democratic leanings were in a way commendable, his actions were to completely destabilize Sweden and make her a puppet of foreign interests for the next 50 years. This so-called 'Age of Freedom' also saw the aristocracy regain some of their lost ground. However, the young queen saw no clear alternative that would not upset her war-weary people too much."

 iro_iroquois_interactions_decision.title: "Legacy of the Great Peacemaker"
 iro_iroquois_interactions_decision.desc: "Once a divided people, the [ShowCultureGroupName('haudenosaunee_group')] Confederation came together through the works of the Great Peacemaker, Deganawida, who united the once rivaling tribes into a familial union. While in the time since the founding of the confederation the tribes of the [ShowCultureGroupNameWithNoTooltip('haudenosaunee_group')] have remained united and coexisted, some whispers have begun to grow that a dominant tribe should emerge to serve as the principal leader. However, such a feat would risk jeopardizing the very founding principles that Deganawida founded the [ShowCultureGroupNameWithNoTooltip('haudenosaunee_group')] Confederation on."
 iro_iroquois_interactions_decision.a: "Times are changing."
 may_unify_haudenosaunee_confederation: "Unlocks the [ShowCountryInteractionName('form_closer_bond_iroquois')] and [ShowCountryInteractionName('merge_tribe_iroquois')] interactions against fellow [ShowCultureGroupName('haudenosaunee_group')] nations. Uniting [ShowCultureGroupNameWithNoTooltip('haudenosaunee_group')] territories will allow us to reform into a united [ShowCultureGroupNameWithNoTooltip('haudenosaunee_group')] Confederacy."