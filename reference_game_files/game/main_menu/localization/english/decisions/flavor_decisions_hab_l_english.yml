l_english:
 hab_monastery_reform_melk_decision.title: "The Reformist Movement of [ShowLocationNameWithNoTooltip('melk')]"
 hab_monastery_reform_melk_decision.desc: "Some members of our [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] have met in the area of [ShowLocationName('melk')] to discuss the steady decline of the monastic culture in [ROOT.GetCountry.GetName]. With more and more rising complaints, it becomes clear that our monasteries are in dire need of reforms. If we act quickly, we could be seen as a shining example of [ROOT.GetCountry.GetReligion.GetAdjective] reforms."
 hab_monastery_reform_melk_decision.desc.entry: "A monastery that has forgotten its rule is worth less to us than an empty field, and ours have been drifting for years. The gathering at [ShowLocationName('melk')] gives us a pretext to act while the [ShowReligionAdjective('catholic')] world is watching, and to be seen leading rather than following."
 hab_monastery_reform_melk_decision.a: "Implement the reforms."
 hab_monastery_reform_melk_decision.b: "The current ways are fine."

 hab_vienna_concordat_decision.title: "The Concordat of [ShowLocationNameWithNoTooltip('vienna')]"
 hab_vienna_concordat_decision.desc: "After lengthy negotiations with papal delegations, we have finally reached an agreeable point representing both the interests of [ROOT.GetCountry.GetName] and [GetCountry('PAP').GetName]. After centuries of hostilities and doubt between the [GetUniqueInternationalOrganization('hre').GetName] and the [GetUniqueInternationalOrganization('catholic_church').GetLeaderTitle], this could be a turning point in our relations, establishing friendly ground between us."
 hab_vienna_concordat_decision.desc.entry: "Emperors and popes have spent centuries disputing who appoints whom, and the quarrel has never profited either. A settled agreement with the Pope would trade away some of our freedom of appointment for something we have never had: a papacy that does not treat the $hre$ as a rival."
 hab_vienna_concordat_decision.a: "Sign the treaty!"
 hab_vienna_concordat_decision.b: "We do not need the help of the [GetUniqueInternationalOrganization('catholic_church').GetLeaderTitle]."

 hab_monastery_reform_accepted_decision.title: "The [ShowBuildingTypeNameWithNoTooltip('monastery')] Council of [ROOT.GetCountry.GetNameWithNoTooltip]"
 hab_monastery_reform_accepted_decision.title.entry: "The [ShowBuildingTypeNameWithNoTooltip('monastery')] Council of $HAB$"
 hab_monastery_reform_accepted_decision.desc: "With the Reformation reaching our country, it has also dire consequences for our [ShowBuildingTypeName('monastery')] organization. The [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] are complaining about the lack of new members in the [ShowBuildingTypeNameWithNoTooltip('monastery')] buildings and the desperate financial state they are in. We could install a council that would take the [ShowBuildingTypeNameWithNoTooltip('monastery')] administration in their hands in the hope of solving the problem."
 hab_monastery_reform_accepted_decision.desc.entry: "Empty novice halls and empty coffers are administrative problems before they are spiritual ones. A council holding the purse strings of every [ShowBuildingTypeName('monastery')] in our lands could put them in order rather faster than the $clergy_estate$ will manage alone."
 hab_monastery_reform_accepted_decision.a: "Reform the [ShowBuildingTypeNameWithNoTooltip('monastery')] structure."
 hab_monastery_reform_accepted_decision.a.tt: "Unlocks the [ShowProductionMethodName('hab_reformed_monastery_maintenance')] for all [ShowBuildingTypeNameWithNoTooltip('monastery')] buildings in our country."
 hab_monastery_reform_accepted_decision.b: "They will just have to adapt on their own."

 hab_tractatus_incorporalibus_decision.title: "The Struggles of the [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('peasants_estate')]"
 hab_tractatus_incorporalibus_decision.title.entry: "The Struggles of the $peasants_estate$"
 hab_tractatus_incorporalibus_decision.desc: "Representatives of the [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')] have approached [target_ruler.GetName] to help their current weak position due to the ongoing strains of war. While we care little for the opinions of these farmers, it is undeniable that we need to secure their cooperation for the necessary taxation and military support. By granting them a set of laws regulating their duties to their landlord, we could regulate the relationship between both parties and secure legal cooperation, making future disputes easier to solve."
 hab_tractatus_incorporalibus_decision.desc.entry: "Obligations that exist only by custom get argued over in every bad harvest, and war has made every harvest bad. Setting the duties of the $peasants_estate$ down in writing binds them as surely as it binds their landlords, and a farmer who knows exactly what he owes is a farmer who pays it."
 hab_tractatus_incorporalibus_decision.a: "Grant them the privilege."
 hab_tractatus_incorporalibus_decision.b: "The [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('peasants_estate')] dare to demand things from us?"
 hab_tractatus_incorporalibus_decision.b.entry: "The $peasants_estate$ dare to demand things from us?"

 hab_geheime_kabinettskanzlei_decision.title: "[ShowGovernmentReformNameWithNoTooltip('geheime_kabinettskanzlei')]"
 hab_geheime_kabinettskanzlei_decision.desc: "Espionage can be an unreliable craft, especially when we have to rely on direct connections with individuals. Other countries have already established institutions to cover these needs and we should now create one of these Black Chambers ourselves. The [ShowGovernmentReformName('geheime_kabinettskanzlei')] would pick up their work under the cover of a postal office, giving them easy access to the mail traveling through our country."
 hab_geheime_kabinettskanzlei_decision.a: "[ROOT.GetCountry.Custom('common_string_ok')]"
 hab_geheime_kabinettskanzlei_decision.a.entry: "$common_string_alright$"
 hab_geheime_kabinettskanzlei_decision.a_tt: "Unlocks the [ShowGovernmentReformName('geheime_kabinettskanzlei')] [government_reform|e]"
 hab_geheime_kabinettskanzlei_decision.b: "Intelligence is a useless asset."

 hab_geheimer_rat_decision.title: "Institutionalizing the [ShowAdvanceNameWithNoTooltip('geheimrat')]"
 hab_geheimer_rat_decision.desc: "Although our recent establishment of the [ShowAdvanceName('geheimrat')] was widely celebrated, some at our [ROOT.GetCountry.GetGovernment.GetCourtTitle] are wondering whether this informal establishment is enough. They argue that perhaps, it should be institutionalized as an integral part of the [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')]'s policies, ensuring that only the most trusted and capable individuals influence the affairs of the [ROOT.GetCountry.GetFlavorRank]."
 hab_geheimer_rat_decision.desc.entry: "An informal circle of advisors lasts exactly as long as the ruler who gathered it. Written into the offices of the $crown_estate$, the [ShowAdvanceName('geheimrat')] would outlive us and keep the business of the realm in the hands of the few men fit to hear it."
 hab_geheimer_rat_decision.a: "Institutionalize it!"
 hab_geheimer_rat_decision.a.tt: "Unlocks events about important personalities who were members of the [ShowGovernmentReformName('hab_geheimer_rat')]."
 hab_geheimer_rat_decision.b: "Its current form serves its purpose well."

 hab_privilegium_maius_decision.title: "The Privilegium Maius in Our Hands"
 hab_privilegium_maius_decision.desc: "Now that we have been elected to the position of [GetUniqueInternationalOrganization('hre').GetLeaderTitle], we can finally correct the grave mistake made by our predecessors as [GetUniqueInternationalOrganization('hre').GetLeaderTitle]. As the leader of the [GetUniqueInternationalOrganization('hre').GetName], we can now grant the privileges the [target_ruler.GetDynasty.GetName] dynasty deserves."
 hab_privilegium_maius_decision.desc.entry: "We have been denied the full proclamation of our rightful privileges by previous Emperors. Now that the imperial crowns rests on our head, it is finally time to right this wrong."
 hab_privilegium_maius_decision.a: "Time to right this wrong."
 hab_privilegium_maius_decision.privilegium_not_granted_tt: "The Privilegium Maius has not yet been fully Granted"
 hab_privilegium_maius_decision.privilegium_not_decided_tt: "It is after 1370 and the Privilegium Maius has not been suggested yet"