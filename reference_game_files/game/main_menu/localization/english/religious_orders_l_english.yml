 crusaders_calling_desc: "A militant order chartered to fight heathens on an active crusade frontier."
 wardens_calling: "Wardens"
 wardens_calling_desc: "A frontier order chartered to garrison a long-running border."
 confidants_calling: "Confidants"
 confidants_calling_desc: "A crown-aligned brotherhood serving the ruling dynasty and its administration."
 mariners_calling: "Mariners"
 mariners_calling_desc: "A maritime crusading order chartered to fight by sea and explore beyond Christendom."
 contemplatives_calling: "Contemplatives"
 contemplatives_calling_desc: "A cloistered order given over to prayer, the liturgy and ascetic withdrawal from the world."
 scholars_calling: "Scholars"
 scholars_calling_desc: "A teaching order copying manuscripts, schooling clerics and advancing the arts and sciences."
 cultivators_calling: "Cultivators"
 cultivators_calling_desc: "A reforming order of monks and lay brothers who clear waste ground and work it through their granges."
 preachers_calling: "Preachers"
 preachers_calling_desc: "An order of friars devoted to preaching, the conversion of unbelievers and the defense of doctrine."
 almoners_calling: "Almoners"
 almoners_calling_desc: "Friars sworn to poverty who beg their bread and give it away, tending the poor and the sick."
 confessors_calling: "Confessors"
 confessors_calling_desc: "An order of friars living in community, hearing confession and shepherding souls with a gentle hand."

