 # Iberian military orders
 order_of_calatrava_religious_order: "Order of Calatrava"
 order_of_calatrava_religious_order_desc: "Founded in 1158 by the Cistercian abbot Raymond of Fitero to hold the fortress of Calatrava after the Templars abandoned it. It was the first military order native to Castile."
 order_of_santiago_religious_order: "Order of Santiago"
 order_of_santiago_religious_order_desc: "Established around 1170 to protect pilgrims on the road to Santiago de Compostela and to wage holy war against the Moors."
 order_of_alcantara_religious_order: "Order of Alcántara"
 order_of_alcantara_religious_order_desc: "Born as the Order of San Julián del Pereiro around 1166, it took the name Alcántara after that town was granted to it in 1218."
 order_of_christ_religious_order: "Order of Christ"
 order_of_christ_religious_order_desc: "Chartered in 1319 by King Dinis of Portugal as heir to the suppressed Knights Templar, inheriting their Portuguese estates and seating its convent at Tomar."
 order_of_avis_religious_order: "Order of Avis"
 order_of_avis_religious_order_desc: "A Portuguese order under the Benedictine rule, named for the town of Avis granted to it around 1211."
 order_of_montesa_religious_order: "Order of Montesa"
 order_of_montesa_religious_order_desc: "Created in 1317 by King James II of Aragon to take over the dissolved Templar and Hospitaller holdings in the Crown of Aragon, with its seat at Montesa Castle in Valencia."

 benedictine_order_religious_order: "Benedictine Order"
 benedictine_order_religious_order_desc: "The black monks who follow the Rule written by Benedict of Nursia in the sixth century, the bedrock of Western monasticism. Their abbots count among the great lords of the Church."
 cistercian_order_religious_order: "Cistercian Order"
 cistercian_order_religious_order_desc: "The austere reform of Cîteaux, founded in 1098 to return to a strict reading of the Benedictine rule. Its white monks and lay brothers are renowned for clearing land and working it through their granges."
 augustine_order_religious_order: "Augustine Order"
 augustine_order_religious_order_desc: "Communities of priests living in common under the Rule of Saint Augustine, neither quite monks nor secular clergy. Their houses serve cathedrals, run schools and hospitals, and shepherd parishes."
 dominican_order_religious_order: "Dominican Order"
 dominican_order_religious_order_desc: "The Order of Preachers, founded by Dominic de Guzmán to combat heresy with learning and the spoken word. Its friars fill the universities' chairs and dispute doctrine from the great pulpits of Christendom."
 franciscan_order_religious_order: "Franciscan Order"
 franciscan_order_religious_order_desc: "The friars minor of Francis of Assisi, sworn to absolute poverty in imitation of Christ. They walk among the town poor, begging their bread and preaching by example."

