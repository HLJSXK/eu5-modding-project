 # Generic 1600-1836 bureaucracies

 # ADM

 board_of_revenue_bureaucracy: "Board of Revenue"
 board_of_revenue_bureaucracy_desc: "A centralized body responsible for the collection, assessment, and management of state revenues. Institutions such as the English Board of Treasury or the French #italic Contrôle général des finances#! showed how a well-funded Revenue Board could dramatically increase the crown's income — but a neglected one, riddled with sinecures and corruption, becomes a drain on the very revenues it was created to protect."

 privy_council_bureaucracy: "Privy Council"
 privy_council_bureaucracy_desc: "An inner council of trusted advisors that acts as the principal instrument of royal government. Bodies such as the English Privy Council or the Spanish #italic Consejo Real#! allowed monarchs to govern effectively by bringing the great offices of state under a single coordinated body. Without adequate support, however, a Privy Council devolves into a forum for factional infighting, alienating the very estates whose cooperation the crown depends upon."

 audit_bureau_bureaucracy: "Audit Bureau"
 audit_bureau_bureaucracy_desc: "A dedicated body charged with scrutinizing public accounts and checking the corrupt practices of officials and tax farmers. Institutions modeled on the French #italic Cour des Comptes#! or the Dutch #italic Rekenkamer#! gave the crown a powerful tool to recover lost revenues and hold administrators accountable. Left underfunded, however, an Audit Bureau loses its independence — entrenched interests fill the vacuum and the tax apparatus is captured by the very parties it was meant to police."

 colonial_office_bureaucracy: "Colonial Office"
 colonial_office_bureaucracy_desc: "A ministry responsible for directing policy toward overseas territories, managing colonial appointments, and overseeing the legal framework of empire. The English Colonial Office, exemplify how organized metropolitan oversight can accelerate the settlement of distant possessions. Without proper resourcing, however, colonial advertisement encourages people to leave our country without giving them better options within our empire."

 # DIP

 admiralty_board_bureaucracy: "Admiralty Board"
 admiralty_board_bureaucracy_desc: "A board of commissioners responsible for the administration, supply, and strategic direction of the navy. The British Admiralty and the Spanish #italic Consejo de Guerra#!'s naval arm demonstrated that professional naval administration was as decisive as the ships themselves. A well-maintained Admiralty can grow a large and experienced pool of sailors — but when funding lapses, recruitment continues while training does not, and naval tradition erodes even as the fleet expands."

 foreign_ministry_bureaucracy: "Foreign Ministry"
 foreign_ministry_bureaucracy_desc: "A permanent bureau dedicated to conducting the state's external relations, maintaining a corps of resident ambassadors, and coordinating intelligence from abroad. France's #italic Ministère des Affaires Étrangères#! pioneered the professional diplomatic service that other powers would eventually copy. A properly resourced Foreign Ministry builds prestige through successful negotiation — but an underfunded one produces embarrassments — envoys who cannot afford their households, despatches that go unanswered, and a reputation that suffers accordingly."

 trade_commission_bureaucracy: "Trade Commission"
 trade_commission_bureaucracy_desc: "A regulatory body tasked with licensing merchants, adjudicating commercial disputes, setting tariffs, and combating smuggling. Institutions such as the British Board of Trade or the oversight councils of the Dutch #italic Vereenigde Oost-Indische Compagnie#! showed how organized state engagement with commerce could transform national prosperity. Without enforcement capacity, however, a Trade Commission becomes toothless — licensed monopolies are evaded, tariff revenues leak away, and the broader trading economy is left worse off than before."

 # MIL

 war_council_bureaucracy: "War Council"
 war_council_bureaucracy_desc: "A supreme military committee responsible for the planning, coordination, and oversight of land forces. The Habsburg #italic Hofkriegsrat#! and the British War Office represent different answers to the same problem of how to impose strategic direction on armies too large for any single commander to control alone. A funded War Council produces a steady stream of capable officers — but when its budgets are cut, the institutional machinery that identifies and promotes talent breaks down, and army tradition decays."

 ordnance_board_bureaucracy: "Board of Ordnance"
 ordnance_board_bureaucracy_desc: "A specialized department responsible for the manufacture, storage, and supply of artillery, munitions, and field engineering. England's Board of Ordnance and the French #italic Corps Royal de l'Artillerie#! demonstrated that the professionalization of siege warfare required a permanent bureaucratic institution, not improvised contractors. A well-funded Board of Ordnance greatly improves siege capability — but when starved of resources, it turns inward — foundries go unmaintained, magazine inspections are skipped, and the fortresses that the Board was supposed to keep in repair begin to crumble."

 commissariat_bureaucracy: "Commissariat"
 commissariat_bureaucracy_desc: "A logistical branch of the military establishment responsible for provisioning armies in the field with food, forage, clothing, and equipment. The system developed under Louvois for the armies of Louis XIV — later refined into the #italic Intendance#! — showed that an army that fed itself from organized depots could sustain campaigns of a scale and duration impossible for forces that lived off the land. A properly funded Commissariat swells the effective manpower available for campaigning; an underfunded one forces armies to compensate through ruinous private contracts, driving up maintenance costs far beyond what the manpower gain is worth."

 # Chinese bureaucracies

 central_secretariat_bureaucracy: "Central Secretariat"
 central_secretariat_bureaucracy_desc: "The #italic $zhongshu_sheng$#! was the Yuán dynasty's supreme civil administrative body, directing all governance across the empire from the capital. A well-funded Secretariat legitimizes the dynasty's authority through decisive, coordinated rule — but when its operations are neglected, the resulting administrative chaos raises the cost of every political decision the crown must make."

 imperial_censorate_bureaucracy: "Imperial Censorate"
 imperial_censorate_bureaucracy_desc: "The #italic Yùshǐtái#! under the Yuán — later reformed as the #italic Dūcháyuàn#! under the Míng — was the inspectorate charged with rooting out corruption among officials and ensuring the law was upheld from capital to province. When properly funded, its investigators recover tax income that would otherwise leak away through official misconduct — but left without resources, they lose the reach to act, and estates move swiftly to exploit the oversight vacuum."

 six_boards_bureaucracy: "Six Boards"
 six_boards_bureaucracy_desc: "The #italic Liùbù#! were the six ministries of the Míng dynasty — Personnel, Revenue, Rites, War, Justice, and Works — that collectively administered the entire apparatus of the state. Together they represent the most comprehensive bureaucratic structure in the world; well-funded, they deliver a marked increase in tax revenues, but neglected, the six boards become entrenched power bases for factional officials who serve their own interests before the throne's."
 six_boards_deactivate_disables_oversight_law_tt: "Removing this [bureaucracy|e] will prevent access to the [ShowLawName('six_ministries_overseer_law')] law"

 grand_secretariat_bureaucracy: "Grand Secretariat"
 grand_secretariat_bureaucracy_desc: "The #italic Nèigé#! was the inner advisory council that in practice governed the Míng empire, drafting edicts, mediating between the Emperor and the outer bureaucracy, and coordinating policy across the $six_boards_bureaucracy$. A properly resourced Grand Secretariat builds imperial prestige through decisive, unified governance — but an underfunded one loses the Emperor's ear, and the legitimacy it was created to sustain begins to erode."
