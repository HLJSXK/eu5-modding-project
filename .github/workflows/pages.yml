name: Deploy simulator to GitHub Pages

on:
  push:
    branches: [global-sol, beta, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tools/sol_demand_simulator/requirements.txt

      - name: Install Python dependencies
        run: pip install -r tools/sol_demand_simulator/requirements.txt

      - name: Generate static JSON data
        run: python tools/sol_demand_simulator/export_static.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/simulator
