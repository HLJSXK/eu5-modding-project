# Known EU5 enum values (verified from reference_official_defines/ and reference_game_files/).
# Used by review.py for deterministic enum validation without LLM.
# Extended by record.py when new verified enum values are discovered.

enums:

  location_rank:
    values:
      - rural_settlement
      - town
      - city
    source: "reference_official_defines/types/building_types.txt"
    notes: "Engine-defined enum. village and other EU4 values are INVALID and produce silent failures."

  # Societal value shift direction keywords (monthly_towards_* modifiers)
  societal_value_direction:
    values:
      - innovative
      - traditional
      - centralized
      - decentralized
      - hierarchical
      - egalitarian
      - mercantile
      - agrarian
    source: "docs/task_summaries/Task_Summary_Fix_Dynamic_Missions_Errors.md"
    notes: "Used as monthly_towards_<value> modifier names for country-scoped societal value shifts."
