# Known EU5 scripting anti-patterns.
# Each entry: pattern (bad), correction (good), category, source, date.
# Added to automatically by record.py when findings are verified.

anti_patterns:

  - pattern: monthly_control
    correction: local_monthly_control
    category: modifier
    scope: location
    source: "docs/task_summaries/Task_Summary_Fix_Dynamic_Missions_Errors.md"
    date: "2026-01-29"
    notes: "Invalid modifier; local_monthly_control is the correct location-scoped name."

  - pattern: local_control
    correction: local_monthly_control
    category: modifier
    scope: location
    source: "docs/task_summaries/Task_Summary_Fix_Dynamic_Missions_Errors.md"
    date: "2026-01-29"
    notes: "Invalid modifier; use local_monthly_control."

  - pattern: court_expenses_add
    correction: court_spending_cost
    category: modifier
    scope: country
    source: "docs/task_summaries/Task_Summary_Fix_Dynamic_Missions_Errors.md"
    date: "2026-01-29"
    notes: "Invalid modifier name; court_spending_cost is correct."

  - pattern: innovativeness_gain
    correction: monthly_towards_innovative
    category: modifier
    scope: country
    source: "docs/task_summaries/Task_Summary_Fix_Dynamic_Missions_Errors.md"
    date: "2026-01-29"
    notes: "EU5 uses societal value shifts (monthly_towards_*) rather than direct innovativeness modifiers."

  - pattern: taxation_cap_add
    correction: global_estate_max_tax
    category: modifier
    scope: country
    source: "docs/task_summaries/Task_Summary_Fix_Dynamic_Missions_Errors.md"
    date: "2026-01-29"
    notes: "Taxation cap is handled by estate taxation system."

  - pattern: local_monthly_conversion
    correction: local_pop_conversion_speed_modifier
    category: modifier
    scope: location
    source: "docs/task_summaries/Task_Summary_Fix_Dynamic_Missions_Errors.md"
    date: "2026-01-29"
    notes: "Pop conversion is a percentage modifier in EU5."

  - pattern: local_conversion_speed
    correction: local_pop_conversion_speed_modifier
    category: modifier
    scope: location
    source: "docs/task_summaries/Task_Summary_Fix_Dynamic_Missions_Errors.md"
    date: "2026-01-29"
    notes: "Pop conversion is a percentage modifier in EU5."

  - pattern: local_monthly_assimilation
    correction: local_pop_assimilation_speed_modifier
    category: modifier
    scope: location
    source: "docs/task_summaries/Task_Summary_Fix_Dynamic_Missions_Errors.md"
    date: "2026-01-29"
    notes: "Pop assimilation is a percentage modifier in EU5."

  - pattern: local_assimilation_speed
    correction: local_pop_assimilation_speed_modifier
    category: modifier
    scope: location
    source: "docs/task_summaries/Task_Summary_Fix_Dynamic_Missions_Errors.md"
    date: "2026-01-29"
    notes: "Pop assimilation is a percentage modifier in EU5."

  - pattern: life_expectancy
    correction: global_life_expectancy
    category: modifier
    scope: country
    source: "docs/task_summaries/Task_Summary_Fix_Dynamic_Missions_Errors.md"
    date: "2026-01-29"
    notes: "Must use global_ prefix for country-scoped life expectancy."

  - pattern: "location_rank:village"
    correction: "location_rank:rural_settlement | location_rank:town | location_rank:city"
    category: enum
    scope: location
    source: "docs/guides/AI_Tool_Workflow_Prompt.md"
    date: "2026-03-01"
    notes: "village is not a valid location_rank value. Engine-defined enum; wrong values produce silent failures."

  - pattern: "text_single inside blockoverride common_header_text"
    correction: "blockoverride overrides a text PROPERTY, not a widget container — do not nest child widgets"
    category: gui
    scope: gui
    source: "docs/guides/AI_Tool_Workflow_Prompt.md | cards.gui:1084"
    date: "2026-03-01"
    notes: "Guessing blockoverride accepts child widgets caused a bug. Always read the relevant .gui file."

  - pattern: "removing custom_tooltip from event options"
    correction: "custom_tooltip with dotted keys (e.g. .tooltip, .tt) is valid — verify with reference_game_files before removing"
    category: event
    scope: event
    source: "docs/guides/AI_Tool_Workflow_Prompt.md"
    date: "2026-03-01"
    notes: "Dotted suffix convention confirmed in ali_qushji_settles.txt. Never remove custom_tooltip without Step 2/3 verification."
