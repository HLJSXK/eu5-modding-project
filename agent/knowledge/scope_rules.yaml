# EU5 modifier scope rules.
# prefix_patterns: modifier name prefixes that imply a specific scope.
# apply_scope: where the modifier must be placed (country/location/character/unit/estate).
# Used by review.py to flag scope mismatches without an LLM call.

scope_rules:

  prefix_patterns:

    - prefix: "global_"
      scope: country
      notes: "global_ prefixed modifiers apply at the country level."

    - prefix: "local_"
      scope: location
      notes: "local_ prefixed modifiers apply at the location (province) level."

    - prefix: "monthly_towards_"
      scope: country
      notes: "Societal value shifts are country-scoped."

    - prefix: "character_"
      scope: character
      notes: "character_ prefixed modifiers apply to individual characters."

    - prefix: "unit_"
      scope: unit
      notes: "unit_ prefixed modifiers apply to military units."

  # Explicit exceptions where the prefix rule does not apply
  exceptions:
    - modifier: "local_pop_conversion_speed_modifier"
      scope: location
      notes: "Pop modifiers are location-scoped despite _modifier suffix."

    - modifier: "local_pop_assimilation_speed_modifier"
      scope: location
      notes: "Pop modifiers are location-scoped despite _modifier suffix."

  # Valid modifier categories from 00_modifier_types.txt header
  valid_categories:
    - country
    - location
    - province
    - character
    - unit
    - mercenary
    - religion
    - internationalorganisation
    - rebel
    - dynasty
    - estate
