    goods_marker: SOL_GUI_SECTION_LOCAL_GOODS
    content_width: 500
    overall_row:
    - 500
    - 76
    estate_row:
    - 500
    - 58
    overall_bar:
    - 296
    - 29
    estate_bar:
    - 300
    - 29
  country:
    gui: src/stable/in_game/gui/panels/situation/global_living_standard.gui
    standalone_gui: src/sol_standalone/in_game/gui/panels/situation/global_living_standard.gui
    goods_marker: SOL_GUI_SECTION_COUNTRY_GOODS
    content_width: 500
    overall_row:
    - 500
    - 76
    estate_row:
    - 500
    - 58
    overall_bar:
    - 296
    - 29
    estate_bar:
    - 300
    - 29
  section_order:
  - overall_balance
  - estate_balances
  - goods
  markers:
    overall_balance: SOL_C_BALANCE_TITLE
    estate_balances: SOL_C_ESTATE_HEADER
