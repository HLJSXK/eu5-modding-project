  group_labels_prefix: SOL_SUBGROUP_
  group_tiers:
    required:
    - staple
    - protein
    - basic_clothing
    - heating
    - crude_goods
    daily:
    - condiments
    - household
    - standard_clothing
    - intoxicants
    - medicine
    - ritual
    - knowledge
    luxury:
    - luxury_food
    - luxury_drinks
    - luxury_goods
    - spices
    - precious
    - treasures
    - weapons
    - mounts
  card_size:
    location:
    - 122
    - 48
    country:
    - 122
    - 48
  icons_per_row: 6
  columns: 4
generic_goods_tooltip:
  reference: ai_gui_assessment/images/proto/sheet_C.png
  design: tier_and_group_labels_with_all_member_icon_name_chips
  includes_current_good: true
  hide_section_when_ungrouped: true
  undefined_goods_policy: hide_section
  price_preferences: [2, 1.5, 1.25, 1, 0.75, 0.5, 0.25]
  files:
  - src/stable/main_menu/gui/shared/goods_details.gui
  - src/sol_standalone/main_menu/gui/shared/goods_details.gui
  forbidden_scope_expressions:
  - GetMarket
  - Location.GetOwner
  - Player.MakeScope
market_goods_tooltip:
  template: SpecificGoodsMarket_tooltip
  price_slot: sol_goods_price_context
  files:
  - src/stable/in_game/gui/shared/market_tooltips.gui
  - src/sol_standalone/in_game/gui/shared/market_tooltips.gui
  ratio: current_market_price_divided_by_base_price
  current_tier_highlight: gold_background_and_frame
  highlight_border_width: 1
  tier_comparison: actual_price_against_scaled_base_price
  retains_vanilla_content: true
