# EU5 Known Anti-Patterns
# ========================
# Machine-readable knowledge store. Feed into:
#   - scripts/validate.py  (static pre-flight checks)
#   - scripts/gen_brief.py (generates docs/knowledge/BRIEF.md)
#
# Fields:
#   id        : unique slug (no spaces)
#   pattern   : Python regex to detect the bad form in source files
#   bad       : human-readable description of the bad form
#   correction: what to do instead
#   category  : modifier | enum | encoding | gui | scope | event | localization
#   scope     : country | location | character | global | any
#   source    : reference file that verifies the correction (path:line if known)
#   notes     : one-line explanation of why the bad form fails
#
# To add a new entry: append a YAML dict with all fields, then run:
#   python scripts/gen_brief.py

- id: location_auto_modifier_nonfunctional
  pattern: 'category\s*=\s*location'
  only_in_paths: ['auto_modifiers']
  bad: "auto_modifier with category = location (inside auto_modifiers/ file)"
  correction: "TRY_REPLACE entry in main_menu/common/static_modifiers/ with game_data.category = location"
  category: modifier
  scope: location
  source: "src/stable/main_menu/common/static_modifiers/A_SOL_war_modifiers.txt:4-6"
  notes: "Location auto_modifiers are NON-FUNCTIONAL in EU5; bake effects into static_modifier values instead"

- id: location_rank_invalid_village
  pattern: 'location_rank\s*[=?]=\s*location_rank:village'
  bad: "location_rank:village"
  correction: "location_rank:rural_settlement"
  category: enum
  scope: location
  source: "reference_game_files/game/in_game/common/diseases/bubonic_plague.txt"
  notes: "EU4 rank name; EU5 valid values are rural_settlement, town, city"

- id: location_rank_invalid_hamlet
  pattern: 'location_rank\s*[=?]=\s*location_rank:hamlet'
  bad: "location_rank:hamlet"
  correction: "location_rank:rural_settlement"
  category: enum
  scope: location
  source: "reference_game_files/game/in_game/common/diseases/bubonic_plague.txt"
  notes: "EU4 rank name; EU5 valid values are rural_settlement, town, city"

- id: location_rank_invalid_metropolis
  pattern: 'location_rank\s*[=?]=\s*location_rank:metropolis'
  bad: "location_rank:metropolis"
  correction: "location_rank:city"
  category: enum
  scope: location
  source: "reference_game_files/game/in_game/common/building_types/unique_buildings.txt"
  notes: "EU4 rank name; EU5 valid values are rural_settlement, town, city"

- id: custom_tooltip_do_not_remove
  pattern: ''
  bad: "Removing custom_tooltip from event options (wrong fix for dotted key confusion)"
  correction: "Keep custom_tooltip; verify key format via Step 2/3 — dotted suffix IS valid in event options"
  category: gui
  scope: any
  source: "reference_game_files/game/in_game/common/character_interactions/ali_qushji_settles.txt"
  notes: "AI wrongly removed custom_tooltip thinking dotted key format was invalid. Never remove; only verify format."

- id: blockoverride_widget_child_invalid
  pattern: 'blockoverride\s+"common_header_text"\s*\{[^}]*text_single'
  bad: "text_single widget inside blockoverride \"common_header_text\""
  correction: "blockoverride overrides a 'text' property value, not a widget container; do not add child widgets"
  category: gui
  scope: any
  source: "reference_game_files/game/main_menu/common/cards.gui:1084"
  notes: "Guessing block structure causes silent failures; always read cards.gui before using blockoverride"

- id: yaml_localization_non_ascii_quotes
  pattern: '[“”‘’]'
  bad: "Smart/curly quotes (“”‘’) in localization YAML"
  correction: "Use straight ASCII double-quotes (\") only; escape with \\\" inside values"
  category: localization
  scope: any
  source: "reference_official_defines/docs/data_types_gui.txt"
  notes: "PDX parser rejects non-ASCII quote characters; the failure is silent"

- id: eu4_province_modifier_scope
  pattern: 'add_province_modifier'
  bad: "add_province_modifier (EU4 effect)"
  correction: "add_location_modifier or add_static_modifier with location scope"
  category: scope
  scope: location
  source: "reference_game_files/game/in_game/common/"
  notes: "EU4 province scope effects do not exist in EU5; use location-scoped equivalents"

- id: eu4_has_province_modifier
  pattern: 'has_province_modifier'
  bad: "has_province_modifier (EU4 trigger)"
  correction: "has_location_modifier"
  category: scope
  scope: location
  source: "reference_game_files/game/in_game/common/"
  notes: "EU4 province scope triggers do not exist in EU5"

- id: demand_hardcoded_redistribution
  pattern: ''
  bad: "Hardcoded redistribution coefficients for substitute goods (multiply = 0.4 on scarce good + add = X on every other good)"
  correction: "Weight-normalization: demand_i = (weight_i / total_weight) × N × scale; each good starts at weight 1; scarcity subtracts 0.5; total_weight uses min = 0.001 guard; redistribution is automatic"
  category: scope
  scope: any
  source: "src/stable/in_game/common/script_values/SOL_goods_weight_values.txt"
  notes: "Hardcoded coefficients require O(N²) recalculation when adding a new good; weight-normalization requires only one new weight value and one add line in the group total"

- id: script_value_inline_subexpr_variable_refs
  pattern: 'multiply\s*=\s*\{[^}]*(?:multiply|divide)\s*=\s*local_'
  bad: "multiply = { value = X  multiply = local_var  divide = local_var  add = local_var } inside a script_value"
  correction: "Flatten to top-level sequence: multiply = local_var  (no braces); each op on its own line"
  category: encoding
  scope: any
  source: "reference_game_files/game/in_game/common/script_values/_script_values.info:77-82"
  notes: "Inline sub-expression example in .info only shows scalar literals; variable refs (local_*, named sv) inside multiply={} blocks are unconfirmed and likely silently broken"

- id: float_precision_exceeds_5dp
  pattern: '\d\.\d{6,}'
  bad: "float literal with 6+ decimal places (e.g. value = 0.123456789)"
  correction: "Round to at most 5 decimal places: value = 0.12346; EU5 engine reads no further"
  category: precision
  scope: any
  source: "user-reported engine behavior (2026-04)"
  notes: "EU5 engine truncates all float literals at 5 decimal places; digits beyond the 5th are silently ignored"

- id: demand_share_pop_scope_in_location_indicator
  pattern: ''
  bad: "Referencing pop-scoped weight values (SOL_<good>_weight) from location-scope indicator script_values"
  correction: "In location-scope indicators, compute scarcity-only base weights inline via market variable list checks; do not reference pop-scope weight values which include religion/culture modifiers unavailable at location scope"
  category: scope
  scope: location
  source: "src/stable/in_game/common/script_values/SOL_substitute_good_indicators.txt"
  notes: "Location-scope script_values cannot access pop attributes; sol_demand_share_* replicate only the scarcity adjustment, not religion/culture multipliers"

- id: gui_no_getgoods_from_string
  pattern: "GetGoods\\('|GetGoodsFromKey|MakeGoods\\("
  bad: "GetGoods('key'), GetGoodsFromKey, or MakeGoods('key') in GUI expressions to construct a Goods object from a string literal"
  correction: "Goods datacontext must come from a data model accessor chain (e.g. GoodsMarketEntry.GetGoods, Trade.GetGoods, GoodsItem.GetGoods in a foreach); there is no string-to-Goods lookup function in EU5 GUI"
  category: gui
  scope: any
  source: "reference_game_files/game/in_game/gui/shared/market_tooltips.gui:435"
  notes: "Exhaustive search of all reference_game_files *.gui files found zero occurrences of any string-to-Goods constructor; all goods access is typed accessor chains only"

- id: gui_goodsview_inaccessible_in_tooltip
  pattern: 'GoodsView\.GetGoods'
  bad: "datamodel = \"[GoodsView.GetGoods]\" inside a ContextualTooltipType or tooltipwidget template to iterate all goods and filter by key"
  correction: "GoodsView is a view-model object only available in goods_overview.gui panel scope; it is not accessible from tooltip/ContextualTooltipType contexts. No equivalent all-goods datamodel exists for tooltip scope."
  category: gui
  scope: any
  source: "reference_game_files/game/in_game/gui/goods_overview.gui:77"
  notes: "Exhaustive search of reference_game_files found GoodsView only in the goods_overview panel; tooltip templates have no equivalent all-goods iteration datamodel"

- id: dev_scaling_demand_cancellation
  pattern: ''
  bad: "Emitting SOL goods demand values without pre-dividing by (development/10), causing demand to scale with location development level; or using only 'divide = location.development' without 'multiply = 10', which produces 1/10 of target instead of cancelling"
  correction: "Add 'divide = { value = location.development  min = 1 }' AND 'multiply = 10' to every single-group demand block in SOL_goods_demand_values.txt. The min=1 guard prevents div/0 at development=0 (engine also multiplies by 0 there, so demand is 0 either way). Together they divide by (development/10); the EU5 engine then multiplies by (development/10), cancelling to net factor 1."
  category: scope
  scope: pop
  source: "reference_game_files/game/in_game/common/death_reason/02_life_expectancy.txt:191"
  notes: "Intentional hidden shim. Net math: scale × (10/development) × (development/10) = scale. CRITICAL: 'divide = location.development' alone gives net 1/10 (not 1), silently reducing all demands to 10% of target. Always pair with 'multiply = 10'. Multi-group aggregates inherit the cancellation from sub-values; no additional ops needed there. Display values in z_SOL_group_demand_scales_location.txt must remain undivided."

- id: alpha_export_multiplier_cheapest_good
  pattern: ''
  bad: "Exporting alpha (budget-share) values directly from simulator without adjustment, causing in-game spending to fall below simulated income"
  correction: "EXPORT_ALPHA_MULTIPLIER = 1.0 in engel_export.py (Σα = 1 preserved). The compensating multiplier now lives in-game as global_var:sol_era_coeff (initialised to 1.5 at Age 1, decays ×0.95/era to 1.16067 by Age 6). Both multipliers are injected in z_SOL_group_demand_scales_location.txt via 'multiply = local_sol_era_coeff' and 'multiply = local_sol_scarcity_adj_<strata>'. To recalibrate the base: edit sol_init_export_adj and sol_update_export_adj_era in A_SOL_economy_effects.txt — both must change in lockstep."
  category: encoding
  scope: any
  source: "tools/sol_demand_simulator/engel_export.py:68 / src/stable/in_game/common/scripted_effects/A_SOL_economy_effects.txt"
  notes: "Intentional backend shim: substitute groups cause pops to choose cheapest good (not average-priced), and conditional-unlock goods are absent in early game. Together these underfeed actual spending vs. simulator prediction. The era coefficient compensates and is dynamic: era decay (×0.95/era starting at 1.5) + per-market scarcity correction (per stratum via local_sol_scarcity_adj_<strata> script_values). The starting value was tuned down from 2.0 to 1.5 to reduce over-compensation observed in early-game balance testing (2026-05-07)."

- id: multiply_global_variable_nonexistent
  pattern: 'multiply_global_variable'
  bad: "multiply_global_variable = { name = X  value = 0.95 } to scale a global variable in-place"
  correction: "Use set_global_variable with hardcoded per-case values: set_global_variable = { name = X  value = computed_literal }. For era-decay patterns, hardcode the result per age (idempotent, no dedup guard needed). If truly dynamic, compute in a local_variable then use set_global_variable = { name = X  value = local_var:tmp }."
  category: scope
  scope: any
  source: "reference_game_files/game/in_game/common/scripted_effects/global_effects.txt"
  notes: "Exhaustive search of reference_game_files/ and reference_mods/ found no multiply_global_variable effect. Only set_global_variable and change_global_variable exist for global-scope numeric variables."

- id: positive_sign_in_float_literal
  pattern: 'value = +0.xxx'
  bad: "Writing a leading + sign on positive float literals, e.g. value = +0.025 or change_variable = { ... value = +0.003 }"
  correction: "Omit the + sign entirely: value = 0.025. The EU5/Jomini parser does not accept a leading + on numeric literals and will misread the value."
  category: scripted_values
  scope: any
  source: "runtime observation"
  notes: "Triggered by Python f-string format spec +:  e.g. f'{delta:+.5f}' emits +0.00357 for positive deltas. Fix: use f'{delta:.5f}' so no leading sign is emitted for positive values."

- id: icon_widget_before_texticon_check
  pattern: ''
  bad: "Using an icon widget or designing custom icon syntax without first checking if @icon_name! inline texticon syntax already covers the case"
  correction: "Check font_icons.gui for existing texticon definitions first; use @icon_name! in raw_text/text/localization if available; fall back to icon widget; only design from scratch as last resort"
  category: gui
  scope: any
  source: "reference_game_files/game/main_menu/gui/shared/font_icons.gui"
  notes: "EU5 has 180+ pre-defined inline icons via the @xxx! texticon system; skipping this check causes unnecessary widget complexity and misses the preferred engine-native approach"

- id: variable_prefix_must_be_var
  pattern: '\bvariable:[a-zA-Z_]'
  bad: "variable:NAME as an event-target / value reference (e.g. value = variable:foo, multiply = variable:foo, add = variable:foo)"
  correction: "Use the short form: var:NAME (e.g. value = var:foo). EU5/Jomini's event-target link prefix for scope variables is 'var', not 'variable'. The long form does not resolve."
  category: scripted_values
  scope: any
  source: "reference_game_files/game/in_game/common/attribute_columns/06_country.txt:149"
  notes: "Engine error: 'Failed to find a valid event target link variable:NAME' / 'Cannot read [variable:NAME] as a script value'. The set_variable / change_variable / has_variable effects all use the keyword 'variable' inside their own block (name = NAME, value = X), but READING a variable elsewhere in script_values, triggers, or modifier values requires the var: prefix. Comments in source files often informally write 'variable:foo' for documentation — never copy that into actual code."

- id: change_variable_value_op_invalid
  pattern: 'change_variable\s*=\s*\{[^{}]*\bvalue\s*='
  bad: "change_variable = { name = X  value = Y } — value is not a valid operation for change_variable"
  correction: "Use change_variable = { name = X  add = Y } (or subtract / multiply / divide). Negative literals are fine for add: e.g. add = -0.00020. value = is reserved for set_variable."
  category: scripted_values
  scope: any
  source: "EU5 engine error: 'change_variable effect [ No operation specified ]'"
  notes: "set_variable accepts 'value = X' (absolute assignment); change_variable does NOT — it requires an operation keyword (add/subtract/multiply/divide). Mixing them up emits a runtime PostValidate error and the change is silently dropped. Often introduced by codegen scripts that mirror set_variable templates without adapting the op keyword. Pattern uses [^{}]* (not [^}]*) so it does NOT cross nested-block boundaries — this prevents false positives on the legal form 'change_variable = { name = X  add = { value = Y  multiply = Z } }' where value = is the inner-block scalar literal of add's value-with-operations form."

- id: global_var_unguarded_in_script_value
  pattern: 'multiply\s*=\s*global_var:|add\s*=\s*global_var:|divide\s*=\s*global_var:|subtract\s*=\s*global_var:'
  bad: "Direct 'multiply = global_var:NAME' (or add/subtract/divide) inside a script_value, expecting an on_game_start effect to set the global first"
  correction: "Wrap the global read in a guarded local script_value: define 'local_NAME = { value = <safe_default>  if = { limit = { has_global_variable = NAME }  value = global_var:NAME } }' and reference 'multiply = local_NAME' instead. Optionally also init via on_game_start as defense-in-depth, but the wrapper is the load-bearing fix."
  category: scope
  scope: global
  source: "src/stable/in_game/common/script_values/SOL_pop_values.txt (local_sol_era_coeff)"
  notes: "EU5 evaluates script_values during file-load validation BEFORE any on_action (including on_game_start) fires. An unguarded global_var read produces 'Failed to fetch variable', 'Event target link global_var returned an unset scope', and 'Got value of type none' errors that propagate up to every caller script_value. on_game_start init alone cannot fix this — the validation pass runs earlier. Wrapping with has_global_variable + safe default is the only robust approach."

- id: market_scope_set_variable_unsupported
  pattern: 'every_market_in_world\s*=\s*\{[^{}]*\bset_variable\b'
  bad: "Direct set_variable / change_variable on market scope (e.g. every_market_in_world = { set_variable = { name = X value = Y } ... })"
  correction: "Markets do NOT support persistent script variables. Hop to the trade-center location first: every_market_in_world = { location = { set_variable = { ... } } }. Downstream readers fetch via market.location.var:NAME (single shared cache for all locations sharing the market). For GUI, use Market.GetCenterLocation.MakeScope.GetVariable(...) — note the accessor is GetCenterLocation, NOT GetLocation."
  category: scope
  scope: global
  source: "src/stable/in_game/common/scripted_effects/z_SOL_scarcity_score.txt (SOL_update_market_scarcity_scores); reference_game_files/game/in_game/gui/context_menu.gui:940 — '[PanToLocation(Location.GetMarket.GetCenterLocation)]'; reference_game_files/game/in_game/events/economy/prices.txt:417 — 'from_market.location.sub_continent'"
  notes: "Market is a scope but its variable system is read-only at script level — set_variable / change_variable / has_variable on a bare market scope silently fail. The market's hub location (script: market.location, GUI: Market.GetCenterLocation) IS a normal Location and supports the full variable system. Pattern works because all locations sharing a market dereference market.location to the same trade-center Location, giving a per-market shared cache without per-location duplication. GUI accessor is GetCenterLocation, not GetLocation — only GetCenterLocation appears in vanilla GUI files."

- id: gui_market_getlocation_invalid
  pattern: '\.GetMarket\.GetLocation\b'
  bad: "Calling .GetMarket.GetLocation in GUI expressions to access a market's hub location"
  correction: "Use .GetMarket.GetCenterLocation instead. The accessor on a Market data object is GetCenterLocation (returns the trade-center Location), not GetLocation. Example: Player.GetCapital.GetMarket.GetCenterLocation.MakeScope.GetVariable('foo')."
  category: gui
  scope: any
  source: "reference_game_files/game/in_game/gui/context_menu.gui:940 — 'ondoubleclick = \"[PanToLocation(Location.GetMarket.GetCenterLocation)]\"'"
  notes: "Exhaustive search of reference_game_files for .GetMarket.GetLocation returned zero matches; .GetMarket.GetCenterLocation is the canonical accessor. Using the wrong name silently returns a null/invalid datacontext — the GUI element renders empty without an error tooltip."

- id: yearly_january_pulse_spike
  pattern: ''
  bad: "Gating heavy per-country / per-location work behind 'limit = { current_month = 1 }' inside a situation's on_monthly block — fires on every January 1 for every country at once"
  correction: "Use vanilla 'yearly_country_pulse' on_action instead — it fires once per country per year on each country's own anniversary date, naturally distributing load across the whole year. For globally-scoped yearly work (e.g. every_market_in_world scans), keep the situation-month-1 gate but split the work into market-hub-cached or quarterly passes. Anything that iterates every_owned_location per country per year MUST go through yearly_country_pulse, not the global situation."
  category: scope
  scope: global
  source: "src/stable/in_game/common/situations/SOL_economy_situation.txt:23-71; src/stable/in_game/common/on_action/SOL_economy_on_actions.txt:6-10"
  notes: "Documentation-only (no regex lint). The situation's on_monthly with current_month=1 gate causes ALL countries to recompute simultaneously on Jan 1, producing a yearly frame-time spike. Vanilla yearly_country_pulse staggers per-country work because each country's pulse fires on its own creation-date anniversary, not all on Jan 1. The performance impact is O(N_countries × per_country_work) compressed into a single tick. Detected when SOL January lag report (2026-05-07) traced to 6.7M conditional checks on Jan 1 from 5-strata × 336-checks per location across 4000+ owned locations."

- id: event_missing_outcome_field
  pattern: ''
  bad: "country_event / age_event / etc. without an 'outcome = ...' top-level field"
  correction: "Add 'outcome = neutral' (or good / bad / positive / negative) below 'desc = ...' in every event block. Vanilla 1.2 added a hard validator: events without an outcome emit 'Event #X is missing an outcome' to error.log on game-load. The five accepted values are neutral, good, bad, positive, negative — match the event's actual flavor (use neutral for pure-notification events with no consequential choice)."
  category: event
  scope: any
  source: "reference_game_files/game/in_game/events/ages.txt:7 (ages_of_eu.1 uses 'outcome = neutral'); EU5 1.2 changelog — added in unscoped 'Bug Fixes' / event_database validator pass; engine error: 'Event #X is missing an outcome in events/Y.txt' from event_database.cpp:648"
  notes: "Pre-1.2 events did not require this field and ran fine without it. 1.2 added the validator that emits the missing-outcome warning per event, per file-load. The warning does NOT block the event from firing in-game, but it floods error.log and indicates a category mismatch. Use 'outcome = neutral' for tooltip-only / show_as_tooltip notification events (matches vanilla age events). Use 'good' / 'bad' / 'positive' / 'negative' when the event has a clear directional flavor for the player. Documentation-only entry (no regex lint) because parsing top-level event blocks reliably is hard, and validate.py would over- or under-match."

- id: limit_in_scope_transition_block
  pattern: null
  bad: "'limit = { ... }' directly inside a scope-transition block such as 'location = { limit = { ... } }', 'country = { limit = { ... } }', etc."
  correction: "Wrap with 'if = { limit = { ... } }' inside the scope-transition block. 'limit' is only valid directly inside iteration effects (every_*, random_*, ordered_*, while). Inside a scope-hop block it is an 'Unknown effect limit' error."
  category: scope
  scope: any
  source: "src/stable/in_game/common/scripted_effects/z_SOL_scarcity_score.txt:1864 — engine error: 'Unknown effect limit at ... :1864' from jomini_effect.cpp:556"
  notes: "Scope-transition blocks (location={}, country={}, etc.) are NOT loops — the engine does not recognise 'limit' there. Use 'if = { limit = { ... } }' for conditional execution inside a scope hop."
