  notes: "User-reported: debug_log output is unreliable for test readings. CMF stores a snapshot per row (cmf_log_num/num2/num3 maps, max 200 rows; clear with cmf_clear_log). action and arg1 are flags rendered via Localize, so each needs a localization key. goods_demand_in_market is the market-wide total from all sources; isolate one country by differencing against a baseline."

