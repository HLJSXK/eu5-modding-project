- id: sol_country_goods_modifier_accounting_parity
  pattern: null
  bad: Writing size = M - 1 for a per-good country demand modifier when the same good already has other global_<good>_pop_demand
    sources, or changing SOL accounting for a good without changing its engine demand
  correction: Sources of the same modifier type add inside one factor (1 + sum); different types (per-good, global_pop_demand,
    local_pop_demand, vanilla percent rows) multiply. For target relative factor M against external same-good offset e, write
    size = (1+e)*(M-1). A factor below zero clamps demand to 0. Freeze unsupported goods at M=1 in both transfers and accounting.
  category: modifier
  scope: country
  source: In-game test 2026-10 (tmp/demand modifier test/6-13.png); reference_game_files/game/main_menu/common/modifier_type_definitions/00_modifier_types.txt:12773;
    docs/technical/EU5_Modding_Knowledge_Base.md 6.5.1
  notes: 'Measured on HUN nobles: legumes +0.5/+0.5 -> x2.0; sugar +0.25/-0.75 -> x0.5; fish -1.5 -> removed; wheat per-good
    0.5, global 0.5, local 1.0 -> x4.5. Per-good M therefore multiplies cleanly with SOL local_pop_demand. Age 1 goods_demand
    offsets did not appear in the breakdown in this test; read e from the actual breakdown rather than age files.'
