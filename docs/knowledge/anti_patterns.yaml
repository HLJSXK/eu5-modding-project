# eu5-modding-project project-specific anti-patterns; reusable entries are loaded from .eu5-base/docs/knowledge/anti_patterns.yaml.
- id: sol_substitution_auto_modifier_recomputes_baskets
  pattern: null
  bad: Granting static country modifiers for SOL goods substitution, or computing price preferences, group allocation, population/market aggregation or external offsets inside an auto modifier or its scale script value.
  correction: Compute size=(1+e)*(M-1) in the existing monthly human/normal-AI or yearly reduced-frequency-AI solve. Country auto modifiers only read guarded sol_sub_size_<good> caches through sol_substitute_<good>_scale. Delete zero size caches after effective spending and summary calculations consume them, so neutral goods fail the auto potential. Generate AUTO_MODIFIER_NAME_ and AUTO_MODIFIER_DESC_ keys in both supported languages, as current vanilla does. The scheduled solve subtracts that same active cached contribution from the total modifier before deriving external demand. Keep solver spending in sol_good_effective_<good>; never read aggregate modifiers from the auto scale. Remove static grants, live-strength/request snapshots and dead dirty polling; no old-save migration.
  category: modifier
  scope: country
  source: User decision 2026-10-23; scripts/sol_substitution.py; scripts/test_sol_substitution_performance.py; docs/technical/SOL_Substitution_Auto_Modifiers_20261023.md
  notes: Engine actions can reevaluate auto modifiers at very high frequency. Source and offline tests verify constant per-good cache reads, no writes or economic reads during repeated auto evaluation, and unchanged scheduled basket results. Engine refresh timing and fixed-point rounding remain unverified.
- id: sol_living_standard_is_not_a_ratio
  pattern: null
  bad: Treating SOL as baseline-basket multiples, weighting it by baseline consumption, displaying it as a percentage, or assuming a one-to-one conversion means equality without checking units.
  correction: SOL = flat bonuses + max(0, 1 + summed percentage bonuses) * annual liquid funds per thousand people, with a zero floor per estate/location. Percentage bonuses never multiply flat bonuses. Aggregate annual totals with population denominators and display the amount directly. PP = annual funds per thousand / annual baseline per thousand; only PP displays ratio minus one as percent. Zero-baseline populations still have SOL. Changing baskets must change PP but not SOL. Map color comparisons may normalize SOL against world average; displayed SOL must remain an amount.
  category: scope
  scope: location
  source: Explicit user formula correction 2026-10-23; docs/technical/SOL_Living_Standard_Formula_Correction_Plan_20261023.md; scripts/test_sol_living_standard.py
  notes: Project definition, not engine behavior. Regression fixtures distinguish the old and corrected formulas with unequal estate populations, basket rescaling and zero-baseline tribesmen. Native in-game acceptance remains pending.
- id: sol_living_standard_feeds_demand
  pattern: null
  bad: Treating living standard (SOL) and purchasing power as one number, for example reading a SOL value or the local SOL modifier in the raw/final demand scale, the country solver targets, or the applied local_pop_demand modifier, or labelling an income or purchasing-power figure as living standard.
  correction: Purchasing power is liquid funds / baseline spending and alone drives demand. Living standard is flat bonuses + max(0, 1 + summed percentage bonuses) * annual liquid funds per thousand people, floored at zero per estate/location and aggregated by population. Compute it after the demand pass. The tier, world ranking, living-standard maps and local migration/population-growth feedback read SOL; location/panel bars, HUD section 2 and purchasing-power map read purchasing power. Feedback uses cached local SOL in the existing monthly apply traversal (attraction clamp 0.02*SOL to 0..0.5; growth -0.001 below 0.1 and +0.001 above 10, neutral at both boundaries). Put modifiers in scripts/sol_living_standard_source.py, never in demand emitters.
  category: scope
  scope: location
  source: User decision 2026-10-23 (SOL separated from purchasing power before building-based SOL bonuses); scripts/sol_living_standard_source.py; scripts/test_sol_living_standard.py; docs/technical/SOL_Living_Standard_Purchasing_Power_Separation_20261023.md
  notes: Project design rule, not engine behavior. At zero modifier SOL equals purchasing power times annual baseline consumption per thousand, not purchasing power itself. test_sol_living_standard.py fails if any demand variable in any of the five deploy targets reads a SOL-only name, if location SOL stops being the last step of sol_compute_location_pop_demand, or if a purchasing-power surface reads SOL. In-game acceptance of the SOL-ranked tier, ranking and both SOL maps is pending.
- id: sol_living_standard_building_sources_bypass_native_modifiers
  pattern: null
  detectability: advisory
  bad: Computing SOL building bonuses by scanning buildings or changing liquid funds, registering deferred country/estate sources as part of the first batch, multiplying flat bonuses by percentages, or changing generated outputs directly.
  correction: Keep the 17 first-batch building coefficients in BUILDING_SOURCES in sol_living_standard_source.py. Generate two location modifier types, matching icon entries and MODIFIER_TYPE_NAME_/DESC_ localization in both languages. Inject only modifier blocks with TRY_INJECT; read native totals through modifier:local_sol_living_standard and modifier:local_sol_living_standard_modifier. Native modifier scaling follows building level and goods access. Estate hooks inherit shared flat and percent hooks; clamp 1 + summed percentages at zero before multiplying funds, then add flat * population and floor the total. Do not introduce traversals or demand reads. Compatibility submods inherit these definitions from SOL.
  category: modifier
  scope: location
  source: docs/technical/SOL_Living_Standard_Modifier_Sources_Design_20261023.md sections 2 and 4.5; scripts/sol_living_standard_source.py; scripts/test_sol_living_standard.py; .eu5-base/reference_mods/3613232232/in_game/common/script_values/pp_farming_capacity.txt:70; .eu5-base/reference_game_files/game/in_game/common/building_types/readme.txt:34
  notes: SOL implementation contract using the source-verified custom modifier bridge already specified in the design. Offline fixtures cover mixed sources and isolation; actual building/tooltips, scaling and migration/growth settlement remain pending in-game acceptance. War, disease, social values and estate-specific native modifier types are deferred.
- id: sol_substitution_level_icons_need_a_separate_row
  pattern: null
  bad: Overlaying tiny +/- text on the goods image, or replacing actual country substitution direction with the seven market price weights.
  correction: Keep each goods image at 18 by 18 and put one native level icon in an independent 18-unit row underneath. Use three malus arrows, price_stable, and three bonus arrows for the actual country multiplier; reserve no neutral dead band. Require an initialized country calculation before showing a level. Keep unavailable goods dim while their initialized country level remains visible. Increase card and wrapped-row heights together and preserve supply counts and hover data.
  category: gui
  scope: any
  source: User screenshot and icon-only request 2026-10-23; scripts/sol_goods_ui.py; reference_game_files/game/main_menu/gui/shared/font_icons.gui:947,2084-2134; reference_official_defines/docs/data_types_common.txt:414,571,742.
  notes: The seven display bands are m<0.5; 0.5<=m<0.75; 0.75<=m<1; m=1; 1<m<=1.25; 1.25<m<=1.5; m>1.5. Exact 25%/50% changes stay in the lower-magnitude band. This is a display classification, not a change to country multipliers or seven-tier price preference weights. CORE grouped goods show one icon after initialization; compatibility-only goods outside substitution groups keep no level. Offline tests cover all levels and boundaries, readiness, visible pixels, row alignment and compatibility tooltip bounds; corrected runtime acceptance is pending.
- id: sol_country_map_tooltip_keeps_player_localization
  pattern: null
  bad: Reusing SOL HUD sections three/four for another country's map tooltip while leaving player-bound GUI or localization, or letting nested ranking rows replace the primary country.
  correction: Capture the hovered country's MakeScope as Scope and adapt primary Player expressions to Scope.GetCountry. Adapt localized expressions from both gen_sol_lshud and gen_sol_ls_gui, including SOL_SUB_SUMMARY, while peer rows continue to bind Country. Register CountryMapTooltip_<mode> with country tooltip contexts at every zoom and verify a foreign title, self row, spending total and substitution summary in both languages.
  category: gui
  scope: country
  source: scripts/sol_map_modes_source.py; scripts/test_sol_lshud_ui.py; .eu5-base/reference_game_files/game/in_game/gui/cooltip.gui:4622; .eu5-base/reference_official_defines/docs/data_types_script.txt:438,1776.
  notes: SOL-specific integration rule. Offline regression initially caught the external SOL_SUB_SUMMARY key still reading Player even after direct GUI adaptation. Source and offline rendering confirm the correction; native map tooltip dispatch remains pending in-game acceptance.
- id: sol_income_table_columns_shorter_than_row_decorations
  pattern: null
  bad: Giving the SOL income table 460-unit row decorations while its visible columns and padding only occupy 418 units, and verifying only the declared row rectangle.
  correction: Make the header and every income row use the same full-width column budget, explicit zero spacing, and symmetric padding. Include the combined arrow/annual-change cell or its same-width no-prior-year placeholder in that budget. Verify the sum of in-flow child widths equals the row width and that every decoration and cell remains inside the tooltip content margins.
  category: gui
  scope: any
  source: User runtime screenshot 2026-10-23; ai_gui_assessment/prototypes/living_standard_4sections/build.py tooltip_income; reference_game_files/game/main_menu/gui/shared/main_menu_cooltip_types.gui:1742.
  notes: The screenshot's roughly 21-unit left offset agrees with half of the 42-unit shortfall; the exact engine allocation path is inferred. The correction uses 6-unit padding on both sides and columns totaling 448 units. Later readability tuning narrows the estate column to 96 units and widens annual income/per-capita income to 108/90, each with a 6-unit left text gutter. Bilingual stable/standalone regressions cover annual-data and placeholder states, aligned headers, intrinsic and decoration bounds, and nine-digit income/eight-character per-capita values that fit at 11-point type. Corrected runtime acceptance remains pending.
- id: sol_purchasing_power_ruler_curve_and_origin_drift
  pattern: null
  bad: Computing SOL purchasing-power labels or ticks with a different mapping from the fill, retaining nonlinear spacing after the user requested linear halves, or aligning the ruler through an unsized expanding spacer.
  correction: Share the row/ruler column geometry and use a fixed full-width ruler wrapper with an explicit track offset. For clamped raw alpha-minus-one c, map negative values to (c+1)/2 and positive values to 1/2+c/4; the five labels belong at 0, 1/4, 1/2, 3/4, and 1. Center ticks vertically on the track and keep a zero-baseline cursor at 1/2. Clamp only the visual bar; preserve the full raw percentage.
  category: gui
  scope: any
  source: User runtime screenshot and subsequent request for linear halves 2026-10-22; scripts/gen_sol_ls_gui.py; reference_official_defines/docs/data_types_common.txt:366,1117.
  notes: The screenshot shows the entire ruler shifted right; its hbox spacer handling is inferred, so the replacement uses explicit coordinates. The first correction retained the old nonlinear fill; the user then requested equidistant labels with -50% and +100% bisecting their respective halves. Offline bilingual tests compare every label/tick with the fill and cover intermediate values, clamped endpoints, and no consumption; in-game acceptance remains pending.
- id: capacity_floor_starves_zero_pressure_classes
  bad: Reading a country-solver class coefficient in the tens or hundreds (e.g. Class 1 = 105.98) as a data error or numerical
    blow-up
  correction: Expect it. Capacity targets are baseline_total * capacity_floor + baseline_total * negative_pool * pressure_share,
    and pressure is clipped at zero, so a stratum whose baseline is BELOW target (needs scaling up) contributes zero pressure
    and its class receives only the 1% floor. That class column then carries ~1-3% of the mass of the dominant class, and
    ||W^-1 row|| reaches 96-404, so a normal 0.01 monthly move in a compression ratio swings that coefficient by 1-4 units.
    Switching capacity to abs(baseline - target) cuts median amplification from 120.6 to 55.9 but does NOT improve feasibility
    and shrinks the surviving Class 4 margin from 0.164 to 0.033.
  category: scope
  scope: country
  source: 'HUN five-save series 2026-08-11: Class 1 column mass 1.98-5.50 vs Class 4 156-177; capacity targets C1/C2 ~1.9-2.3
    vs C4 140-193 with capacity_floor = 0.01, negative_pool = 0.96'
  notes: 'Documentation-only (no regex lint). Amplification and feasibility are independent problems: amplification comes
    from unequal column mass (the 1% anchor), feasibility comes from cone containment. Raising capacity_floor trades jitter
    for margin in both directions, so it is a tuning decision rather than a fix. HUN is especially exposed because nobles
    are 68% of national spending yet carry zero pressure, leaving the class that represents them with almost no matrix mass.'
- id: commodity_offset_must_exclude_own_modifier
  pattern: null
  bad: Reading global commodity demand while the previous SOL substitution modifier is still included, or writing M-1 despite
    an external additive offset
  correction: Remove the own named country modifier, read modifier:global_<good>_pop_demand, and write (1+e)(M-1). Apply the
    same nonnegative effective factor once in internal spending. Read live modifier values rather than copying age definitions.
  category: modifier
  scope: country
  source: reference_official_defines/docs/effects.log:105; reference_game_files/game/in_game/common/scripted_effects/country_effects.txt:2376;
    SOL_Substitute_Groups_Global_Modifier_Implementation.md section 4.3
  notes: Modifier read syntax is source-verified. Same-type addition and cross-type multiplication were measured on 2026-10-10;
    removal-to-read timing, engine refresh and fixed-point stability of this generated implementation still require in-game
    acceptance.
- id: country_pulse_manual_on_action_merge_unnecessary
  pattern: null
  bad: Copying vanilla or framework entries into monthly_country_pulse/yearly_country_pulse just to preserve existing on_actions
  correction: 'Use the compact yearly_country_pulse style for both monthly_country_pulse and yearly_country_pulse: define
    only this mod''s on_actions entries. The engine merges on_actions from duplicate pulse definitions automatically.'
  category: scope
  scope: country
  source: user-reported engine behavior (2026-06-08); src/stable/in_game/common/on_action/SOL_economy_on_actions.txt:5-12
  notes: Manual payload copies are noisy and drift-prone. Keep events/random_events only when this mod itself adds them; do
    not duplicate vanilla or CMF on_action dispatchers.
- id: country_solver_infeasibility_misdiagnosis
  bad: Diagnosing a country-solver negative_factor or a class-wide -100% local_pop_demand by inspecting condition number,
    classifier churn, coefficient magnitude, or by assuming a near-zero coefficient was a clamped floating-point artifact
  correction: Run tools/eu5_save_parser/cone_feasibility.py FIRST. Exact-solve feasibility means target in cone(class columns);
    because every class column sums nonnegative location vectors, cone(any 4-way partition) is contained in cone(all owned
    locations). If the all-location residual exceeds ~0.01 the target is unreachable and NO classifier change, class count,
    capacity rule, or conditioning fix can help - only relaxing the target or accepting an approximation. See docs/technical/SOL_Country_Level_Strata_Demand_Model.md
    section 3.9.
  category: scope
  scope: country
  source: 'HUN five-save series 2026-08-11 (SP_HUN_1337_10_02 .. 1338_02_02, playthrough d95e1b3a): all-location cone residual
    0.0465-0.1057, 8-43 locations require negative factors; docs/technical/SOL_Country_Level_Strata_Demand_Model.md section
    3.9'
  notes: 'Documentation-only (no regex lint). Linear independence is NOT the feasibility criterion: det(M) != 0 only gives
    uniqueness, and measured HUN condition numbers were a healthy 55.6-96.0 while the exact solve still failed. A zero coefficient
    returned by a nonnegative approximation is a legitimate boundary optimum, not a clamped artifact, so tightening the gate
    to reject delta < 0 does not stop -100% (it cannot reject = 0). Four wrong attributions were ruled out by data: silent
    zero-clamping, ill-conditioning, the yearly unit-spending refresh as switch trigger (1337.10/11/12 had frozen unit spending
    yet flipped infeasible->feasible), and classifier churn as an independent cause (1338 data under 1337 classes still gave
    Class 4 = -1.089). The real conflict is structural: nobles/clergy need scaling up while lower needs scaling down ~41%,
    but their per-location spending is coupled (nobles-vs-lower share correlation 0.29-0.47), so no nonnegative factor field
    separates them.'
- id: country_substitution_repeated_monthly_replace
  pattern: null
  bad: Repeating market/pop basket expansion for every location and replacing unchanged country goods modifiers every month
  correction: Aggregate owned population by market/pop type, evaluate each basket once, and cache seven country-adjusted market
    spending totals. Apply permanent goods modifiers only on real size changes or missing modifiers; subtract the actually
    applied size when reading external offsets and retain an observed-total snapshot for clean-month checks. Keep the separate
    monthly location modifier lifetime policy.
  category: scope
  scope: country
  source: reference_official_defines/docs/effects.log:2824-2828; country_effects.txt:846-850; docs/technical/SOL_Monthly_Performance_Optimization_20261015.md
  notes: Offline 180-location/3-market fixture cuts refresh variable operations from 571285 to 12023. This is not measured
    EU5 wall time; intermediate fixed-point rounding and engine cache invalidation require in-game acceptance.
- id: empty_sol_caches_mistaken_for_parser_failure
  bad: Seeing every sol_location_* column empty in an exported save and concluding the parser broke, the export is corrupt,
    or the save is unusable for analysis
  correction: 'Check metadata.json''s countries_with_sol_variables field first. A value of 0 means the save itself carries
    no SOL runtime state -- the mod was absent or disabled when it was written -- so no amount of re-parsing will produce
    those columns. Confirm against the raw save with ''grep -c sol_location_demand_class <save>.eu5'': a working save returns
    tens of thousands of hits, an unusable one returns 0. Crucially, such a save is NOT useless: every engine-native column
    still exports (population per stratum, shares, owner, market, rank, development, control), which is enough for population-structure
    and heterogeneity analysis. Only SOL-derived quantities are lost -- per-stratum base spending B_s(l), net income I_s(l),
    and the raw coefficient m_raw(l) -- which means feasibility and improvement analysis is impossible because the target
    vector t cannot be reconstructed.'
  category: scope
  scope: country
  source: 'data/save_analysis/_all_SP_*_1536_09_21_636b7b0a/metadata.json reports countries_with_sol_variables: 0 while exporting
    28,573 location records and 16,660 owned locations; the 1386 save at identical location count reports 13,630 non-empty
    sol_location_raw_demand_scale values. Raw-save grep: 1386 has 84,215 hits for sol_location_demand_class, 1536 has 0'
  notes: 'Documentation-only (no regex lint). The earlier cone_survey note recorded this save as ''623 no-valid-location countries
    and 0 scored, likely a data issue'', which reads as a defect to investigate rather than a save that simply predates or
    excludes the mod. The distinction matters because the two situations call for opposite responses: a parser defect needs
    fixing, whereas a SOL-less save should be routed to the analyses it can still support. Verified usable for the heterogeneity
    measurement in tools/eu5_save_parser/heterogeneity_survey.py: it yields 295 countries with 5+ locations and the widest
    noble-share spread of any save examined (median 7.1x max/min, versus 3.8x in 1337). It is not in that tool''s default
    save list -- the write-up settled on three timepoints -- but pass it explicitly with --saves 1536_09_21 to include it.
    The point stands regardless: a SOL-less save is a restricted dataset, not a broken one.'
