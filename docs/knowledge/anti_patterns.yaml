- id: solver_entry_guards_omitted_from_description
  bad: Describing the country demand solver's control flow by reading only the solver file (B_SOL_country_demand_solver.txt)
    or only the effect that performs the work, and presenting the raw-error prefilter as if it were the first gate
  correction: 'Read the dispatching effect sol_solve_country_pop_demand in A_SOL_economy_effects.txt top to bottom before
    describing when the solver runs. Its if/else_if/else chain applies three separate gates in order, and two of them live
    in the aggregation file rather than the solver: (1) num_locations < 5 routes straight to sol_solve_country_pop_demand_raw_only,
    skipping classification entirely; (2) the CMF per-side toggle check requires at least one of that side''s exact/approx
    toggles to be on, else raw_only; (3) only then does the solver body run, where sol_country_demand_gate_possible checks
    whether any raw row exceeds tolerance. Grep for ''num_locations'' in the aggregation file to find size gates -- they will
    never appear in the solver file.'
  category: scope
  scope: country
  source: 'src/stable/in_game/common/scripted_effects/A_SOL_economy_effects.txt lines 3598-3639 (sol_solve_country_pop_demand);
    the size gate''s rationale is in the comment at 3600-3607: pigeonhole caps the matrix at three non-empty columns below
    four locations, median scaled L1 for a single-location country moves only 0.329 -> 0.310 versus 0.371 -> 0.222 from three
    locations up, and skipping them drops 70% of the exact-failed country count for 17% of the owned-location traversal'
  notes: 'Documentation-only (no regex lint). The size prefilter is deliberately placed before everything else because num_locations
    is known up front while the non-empty class count only exists after the confidence-ordered classification pass has already
    been paid for. It is easy to miss when tracing the solver because it sits in the caller, not in the solver file, and because
    the solver''s own gate_possible variable looks like the entry condition. Anything describing solver cost, coverage, or
    the size-vs-feasibility relationship is wrong without it: it is also the direct engineering consequence of the 1-9 location
    bucket''s 10.1% feasibility rate, so a write-up citing that bucket while omitting the gate leaves the reader without the
    reason it exists.'
- id: substitution_performance_requires_actual_cadence
  pattern: null
  bad: Attributing default monthly AI cost to the entire substitution aggregate, or assuming solver/substitution toggles skip
    every newly added runtime cost
  correction: Trace monthly and yearly callers separately. Humans and normal-cadence AI solve monthly; reduced-frequency AI solves on its yearly anniversary with no monthly snapshot polling. Country substitution refresh precedes size/solver gates, and substitution-off still computes external spending. Auto modifiers only read cached deltas. Count scheduled refreshes and economic reads before claiming engine-time attribution.
  category: scope
  scope: country
  source: src/stable/in_game/common/on_action/SOL_economy_on_actions.txt; scripts/sol_substitution.py; docs/technical/SOL_Substitution_Auto_Modifiers_20261023.md
  notes: The 2026-10-14 snapshot/static-modifier audit described an earlier implementation. The 2026-10-23 cache-only auto refactor removes that polling and grant path. Offline operation counts do not measure native demand refresh cost.
- id: sol_substitution_partial_group_from_quantities
  pattern: null
  bad: Inferring each pop's substitute groups or members from positive calibrated quantities, producing partial groups and singleton responses
  correction: Use data/pop_group_baskets.csv subscriptions. Every subscribed member must have positive net demand of at least 0.00001, and core consumption must equal the subscribed group union. Validate before codegen; average overlaps only over subscribed groups. Remove PP lumber uniformly at target level and preserve M&T positive minima after price scaling.
  category: goods
  scope: pop
  source: scripts/gen_whole_group_baskets.py; scripts/sol_substitution.py; scripts/test_sol_substitution.py; docs/technical/SOL_Substitution_Whole_Group_Basket_Plan_20261022.md
  notes: CAS commoners previously consumed only olives in the sugar/salt/olives group, forcing their olive response to 1 and diluting substitution. Offline commoner-only and mixed-stratum regressions with no sugar now give olives 4/3 and salt 2/3 for weights 2 and 1. Migration preserves allocated group budgets before rounding; overlapping groups share final quantities and must be rounded together.
- id: yearly_january_pulse_spike
  pattern: ''
  bad: Gating heavy per-country / per-location work behind 'limit = { current_month = 1 }' inside a situation's on_monthly
    block — fires on every January 1 for every country at once
  correction: Use vanilla 'yearly_country_pulse' on_action instead — it fires once per country per year on each country's
    own anniversary date, naturally distributing load across the whole year. For globally-scoped yearly work (e.g. every_market_in_world
    scans), keep the situation-month-1 gate but split the work into market-hub-cached or quarterly passes. Anything that iterates
    every_owned_location per country per year MUST go through yearly_country_pulse, not the global situation.
  category: scope
  scope: global
  source: src/stable/in_game/common/situations/SOL_economy_situation.txt:23-71; src/stable/in_game/common/on_action/SOL_economy_on_actions.txt:6-10
  notes: Documentation-only (no regex lint). The situation's on_monthly with current_month=1 gate causes ALL countries to
    recompute simultaneously on Jan 1, producing a yearly frame-time spike. Vanilla yearly_country_pulse staggers per-country
    work because each country's pulse fires on its own creation-date anniversary, not all on Jan 1. The performance impact
    is O(N_countries × per_country_work) compressed into a single tick. Detected when SOL January lag report (2026-05-07)
    traced to 6.7M conditional checks on Jan 1 from 5-strata × 336-checks per location across 4000+ owned locations.
