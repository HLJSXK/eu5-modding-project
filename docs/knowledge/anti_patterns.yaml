- id: sol_hud_income_requires_complete_same_month_history
  pattern: null
  bad: Treating a calendar-year change or the latest monthly PCI as a full-year comparison, withholding current income/ranking until YoY exists, or rescanning owned locations for the HUD
  correction: Accumulate cached per-estate net income in the solver's existing location pass. Annualize by twelve per thousand people,
    and publish current PCI on every solve, starting with the first sample. Retain same-month samples with year/day guards only for
    previous/YoY/trend publication. Clear unavailable comparisons instead of retaining stale YoY; show a no-prior-year-data state.
    Rank current country income caches annually and on existing global refreshes without requiring YoY or any location traversal.
  category: gui
  scope: country
  source: scripts/sol_lshud_income_source.py; scripts/sol_lshud_ranking_source.py; scripts/test_sol_lshud_income.py
  notes: User-approved availability correction and offline execution evidence (2026-10-18). An April 1337 start can participate in January
    1338 rankings before April's first valid YoY. Total net income is the sum of individually nonnegative cached
    estate incomes (sol_location_total_income), preserving the solver's maintenance treatment rather than the older cross-estate display sum.
