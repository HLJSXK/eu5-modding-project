- id: retired_solver_strategy_described_from_stale_docs
  bad: Describing or reasoning about the country demand solver's approximation strategy from BRIEF.md / PROJECT_OVERVIEW.md
    prose (e.g. 'player four-strategy L2 path', 'AI proportional_fast', 'minimax vertices', 'active-set candidates') without
    grepping the generated solver first
  correction: 'Grep the generated file before describing runtime behaviour: ''grep -c <effect_name> src/stable/in_game/common/scripted_effects/B_SOL_country_demand_solver.txt''.
    A count of 1 means definition-only (dead code, never called); 0 means the effect is not rendered at all and exists only
    in the generator''s _SOLVER_EFFECTS name list used for file routing. As of 2026-08-13 only two strategies are live: id
    7 exact-direct and id 8 the 209-case vertex sweep, with id 0 for raw_fallback. The objective is scaled L1 (mean of the
    four per-row relative residuals) with scaled L-infinity as a 1% tie-break, under a hard no-worsen constraint against raw
    -- NOT an L2 least-squares fit.'
  category: scope
  scope: country
  source: 'src/stable/in_game/common/scripted_effects/B_SOL_country_demand_solver.txt lines 528-575 (solve_approximation)
    and 577-670 (sol_vertex_row_metric / sol_vertex_metrics / sol_vertex_consider); verified counts on 2026-08-13: run_fast_proportional
    0, minimax_vertex_enumeration 0, approx_candidate_* 0, approx_assess 1, select_approx_strategy 1, approx_prepare_strategy
    1, solve_reduced_3 1, solve_reduced_4 1, vertex_case_* 209'
  notes: 'Documentation-only (no regex lint). BRIEF.md was self-contradictory: its Core Features paragraph correctly stated
    the L2 variants and minimax_ratio were retired, while the SOL System Architecture and runtime-cost paragraphs further
    down still described the retired L2/proportional_fast path and strategy ids 1-6. Reading the latter produced a technical
    write-up describing three algorithms that do not exist in the shipped mod. Two further traps: (a) the offline tool tools/eu5_save_parser/demand_analysis.py
    DOES still implement balanced_l2/improvement_l2/target_l2/absolute_l2/minimax_ratio/proportional_fast as comparison baselines,
    so finding them there is not evidence they run in-game; (b) A_SOL_economy_effects.txt still carries a CMF log branch for
    strategy id 6 (proportional fast) that no code path can now produce. Prefer the generated .txt as ground truth over any
    prose, including this file.'
- id: situation_custom_mapmode_visibility_states
