- id: script_value_inline_subexpr_variable_refs
  pattern: 'multiply\s*=\s*\{[^}]*(?:multiply|divide)\s*=\s*local_'
  bad: "multiply = { value = X  multiply = local_var  divide = local_var  add = local_var } inside a script_value"
  correction: "Flatten to top-level sequence: multiply = local_var  (no braces); each op on its own line"
  category: encoding
  scope: any
  source: "reference_game_files/game/in_game/common/script_values/_script_values.info:77-82"
  notes: "Inline sub-expression example in .info only shows scalar literals; variable refs (local_*, named sv) inside multiply={} blocks are unconfirmed and likely silently broken"

- id: float_precision_exceeds_5dp
  pattern: '\d\.\d{6,}'
  bad: "float literal with 6+ decimal places (e.g. value = 0.123456789)"
  correction: "Round to at most 5 decimal places: value = 0.12346; EU5 engine reads no further"
  category: precision
  scope: any
  source: "user-reported engine behavior (2026-04)"
  notes: "EU5 engine truncates all float literals at 5 decimal places; digits beyond the 5th are silently ignored"

- id: gui_no_getgoods_from_string
  pattern: "GetGoods\\('|GetGoodsFromKey|MakeGoods\\("
  bad: "GetGoods('key'), GetGoodsFromKey, or MakeGoods('key') in GUI expressions to construct a Goods object from a string literal"
  correction: "Goods datacontext must come from a data model accessor chain (e.g. GoodsMarketEntry.GetGoods, Trade.GetGoods, GoodsItem.GetGoods in a foreach); there is no string-to-Goods lookup function in EU5 GUI"
  category: gui
  scope: any
  source: "reference_game_files/game/in_game/gui/shared/market_tooltips.gui:435"
  notes: "Exhaustive search of all reference_game_files *.gui files found zero occurrences of any string-to-Goods constructor; all goods access is typed accessor chains only"

- id: gui_goodsview_inaccessible_in_tooltip
  pattern: 'GoodsView\.GetGoods'
  bad: "datamodel = \"[GoodsView.GetGoods]\" inside a ContextualTooltipType or tooltipwidget template to iterate all goods and filter by key"
  correction: "GoodsView is a view-model object only available in goods_overview.gui panel scope; it is not accessible from tooltip/ContextualTooltipType contexts. No equivalent all-goods datamodel exists for tooltip scope."
  category: gui
  scope: any
  source: "reference_game_files/game/in_game/gui/goods_overview.gui:77"
  notes: "Exhaustive search of reference_game_files found GoodsView only in the goods_overview panel; tooltip templates have no equivalent all-goods iteration datamodel"

- id: multiply_global_variable_nonexistent
  pattern: 'multiply_global_variable'
  bad: "multiply_global_variable = { name = X  value = 0.95 } to scale a global variable in-place"
  correction: "Use set_global_variable with hardcoded per-case values: set_global_variable = { name = X  value = computed_literal }. For era-decay patterns, hardcode the result per age (idempotent, no dedup guard needed). If truly dynamic, compute in a local_variable then use set_global_variable = { name = X  value = local_var:tmp }."
  category: scope
  scope: any
  source: "reference_game_files/game/in_game/common/scripted_effects/global_effects.txt"
  notes: "Exhaustive search of reference_game_files/ and reference_mods/ found no multiply_global_variable effect. Only set_global_variable and change_global_variable exist for global-scope numeric variables."

- id: positive_sign_in_float_literal
  pattern: 'value = +0.xxx'
  bad: "Writing a leading + sign on positive float literals, e.g. value = +0.025 or change_variable = { ... value = +0.003 }"
  correction: "Omit the + sign entirely: value = 0.025. The EU5/Jomini parser does not accept a leading + on numeric literals and will misread the value."
  category: scripted_values
  scope: any
  source: "runtime observation"
  notes: "Triggered by Python f-string format spec +:  e.g. f'{delta:+.5f}' emits +0.00357 for positive deltas. Fix: use f'{delta:.5f}' so no leading sign is emitted for positive values."

- id: icon_widget_before_texticon_check
  pattern: ''
  bad: "Using an icon widget or designing custom icon syntax without first checking if @icon_name! inline texticon syntax already covers the case"
  correction: "Check font_icons.gui for existing texticon definitions first; use @icon_name! in raw_text/text/localization if available; fall back to icon widget; only design from scratch as last resort"
  category: gui
  scope: any
  source: "reference_game_files/game/main_menu/gui/shared/font_icons.gui"
  notes: "EU5 has 180+ pre-defined inline icons via the @xxx! texticon system; skipping this check causes unnecessary widget complexity and misses the preferred engine-native approach"

- id: modifier_icon_not_effect_field
  pattern: null
  bad: "Trying to assign an icon to add_location_modifier, add_static_modifier, or the static modifier block itself"
  correction: "Define the icon in main_menu/common/modifier_icons/<file>.txt using modifier keys with positive/negative texture paths. For a custom static modifier, map the static modifier id; only map the contained modifier type if that key is not already defined by vanilla or another loaded mod."
  category: gui
  scope: any
  source: "reference_game_files/game/main_menu/common/modifier_icons/00_modifier_icons.txt:1-4; reference_mods/3613232232/main_menu/common/modifier_icons/pp_victuals_modifier_icons.txt:4-7"
  notes: "Modifier tooltips and location modifier rows call GetIcon on StaticModifier/ModifierWrap objects; the texture mapping is data-driven from modifier_icons, not an effect parameter."

- id: modifier_icon_duplicate_vanilla_key
  pattern: null
  bad: "Defining a vanilla modifier_icons key such as local_pop_demand in a mod add-on file to override its texture"
  correction: "Do not duplicate existing modifier_icons keys in additive files. Map the custom static modifier id instead, or use an explicit replacement strategy for the whole vanilla definition if a vanilla-key override is truly required."
  category: gui
  scope: any
  source: "reference_game_files/game/main_menu/common/modifier_icons/00_modifier_icons.txt:5853-5855"
  notes: "modifier_icons is a keyed database; duplicate keys are rejected with a 'Duplicated key ... will not be created' log, leaving the original definition active."

- id: mapmode_dds_incomplete_mips
  pattern: null
  bad: "Custom mapmode DDS with an incomplete mip chain or non-vanilla-compatible DDS header"
  correction: "Write mapmode DDS files with a full mip chain down to 1x1 and a Clausewitz-style 2D header (`dwDepth = 1`); keep the file under `main_menu/gfx/interface/icons/map_modes/<map_mode_id>.dds`."
  category: gui
  scope: any
  source: "reference_mods/3613232232/in_game/gfx/map/map_modes/MAP_MODE_ICONS.md:75-83; reference_mods/3613232232/main_menu/gfx/interface/icons/map_modes/pp_local_fruit_output_modifier.dds header"
  notes: "MapMode.GetIcon uses ID-based DDS lookup and is stricter than direct GUI texture references; reference mapmode DXT5 assets use complete mip chains (for 128x128, 8 levels and 22,000 bytes)."

- id: mapmode_pinned_by_default_field_invalid
  pattern: 'pinned_by_default\s*='
  only_in_paths: ['gfx/map/map_modes']
  bad: "Adding pinned_by_default = yes/no inside an in_game/gfx/map/map_modes/*.txt mapmode definition"
  correction: "Omit pinned_by_default from mapmode data files unless a current official schema verifies the field. Keep category/index so the mapmode remains selectable; players can pin it from the UI."
  category: gui
  scope: any
  source: "EU5 error.log: Malformed token: yes in gfx/map/map_modes/SOL_map_modes.txt; reference_official_defines/1.3.4-beta/docs/data_types_uncategorized.txt:88402"
  notes: "The UI exposes MapMode.IsMapModePinnedByDefault, but the current mapmode data parser does not accept pinned_by_default as a writable field and can fail on the yes/no value."

- id: variable_prefix_must_be_var
  pattern: '\bvariable:[a-zA-Z_]'
  bad: "variable:NAME as an event-target / value reference (e.g. value = variable:foo, multiply = variable:foo, add = variable:foo)"
  correction: "Use the short form: var:NAME (e.g. value = var:foo). EU5/Jomini's event-target link prefix for scope variables is 'var', not 'variable'. The long form does not resolve."
  category: scripted_values
  scope: any
  source: "reference_game_files/game/in_game/common/attribute_columns/06_country.txt:149"
  notes: "Engine error: 'Failed to find a valid event target link variable:NAME' / 'Cannot read [variable:NAME] as a script value'. The set_variable / change_variable / has_variable effects all use the keyword 'variable' inside their own block (name = NAME, value = X), but READING a variable elsewhere in script_values, triggers, or modifier values requires the var: prefix. Comments in source files often informally write 'variable:foo' for documentation — never copy that into actual code."

- id: change_variable_value_op_invalid
  pattern: 'change_variable\s*=\s*\{[^{}]*\bvalue\s*='
  bad: "change_variable = { name = X  value = Y } — value is not a valid operation for change_variable"
  correction: "Use change_variable = { name = X  add = Y } (or subtract / multiply / divide). Negative literals are fine for add: e.g. add = -0.00020. value = is reserved for set_variable."
  category: scripted_values
  scope: any
  source: "EU5 engine error: 'change_variable effect [ No operation specified ]'"
  notes: "set_variable accepts 'value = X' (absolute assignment); change_variable does NOT — it requires an operation keyword (add/subtract/multiply/divide). Mixing them up emits a runtime PostValidate error and the change is silently dropped. Often introduced by codegen scripts that mirror set_variable templates without adapting the op keyword. Pattern uses [^{}]* (not [^}]*) so it does NOT cross nested-block boundaries — this prevents false positives on the legal form 'change_variable = { name = X  add = { value = Y  multiply = Z } }' where value = is the inner-block scalar literal of add's value-with-operations form."

- id: global_var_unguarded_in_script_value
  pattern: 'multiply\s*=\s*global_var:|add\s*=\s*global_var:|divide\s*=\s*global_var:|subtract\s*=\s*global_var:'
  bad: "Direct 'multiply = global_var:NAME' (or add/subtract/divide) inside a script_value, expecting an on_game_start effect to set the global first"
  correction: "Wrap the global read in a guarded local script_value: define 'local_NAME = { value = <safe_default>  if = { limit = { has_global_variable = NAME }  value = global_var:NAME } }' and reference 'multiply = local_NAME' instead. Optionally also init via on_game_start as defense-in-depth, but the wrapper is the load-bearing fix."
  category: scope
  scope: global
  source: "runtime observation from EU5 script_value validation"
  notes: "EU5 evaluates script_values during file-load validation BEFORE any on_action (including on_game_start) fires. An unguarded global_var read produces 'Failed to fetch variable', 'Event target link global_var returned an unset scope', and 'Got value of type none' errors that propagate up to every caller script_value. on_game_start init alone cannot fix this — the validation pass runs earlier. Wrapping with has_global_variable + safe default is the only robust approach."

- id: global_variable_map_add_does_not_update
  pattern: null
  bad: "Using add_to_global_variable_map by itself to update an existing key"
  correction: "Remove the existing key first, then add the new value: remove_from_global_variable_map = { name = X key = scope:Y } followed by add_to_global_variable_map = { name = X key = scope:Y value = Z }."
  category: scope
  scope: global
  source: "user-reported engine behavior (2026-06)"
  notes: "add_to_global_variable_map only inserts missing keys. If the key already exists, the old value is silently kept."

- id: temporary_local_variables_must_be_removed
  pattern: null
  bad: "Leaving set_local_variable/change_local_variable scratch values alive after the scripted effect has finished using them"
  correction: "At the matching evaluation scope, add remove_local_variable = <name> after the last read of every temporary local variable. In generated loops, generate the cleanup list together with the declarations so added goods or pop types cannot bypass it."
  category: scope
  scope: any
  source: "reference_game_files/game/in_game/common/scripted_effects/international_organization_effects.txt:719-756; reference_mods/3735059838/in_game/common/scripted_effects/SYS-scripted_effect.txt:44,138-140,214-220"
  notes: "Local variables used as calculation scratch space are not durable caches. Explicit cleanup prevents repeated market, country, or UI calculations from retaining temporary state and growing memory use."

- id: market_scope_set_variable_unsupported
  pattern: 'every_market_in_world\s*=\s*\{[^{}]*\bset_variable\b'
  bad: "Direct set_variable / change_variable on market scope (e.g. every_market_in_world = { set_variable = { name = X value = Y } ... })"
  correction: "Markets do NOT support persistent script variables. For market-keyed caches, write a global_variable_map and use the market scope as key: remove_from_global_variable_map/add_to_global_variable_map with key = scope:market_cache, then read via global_variable_map(name|scope:market_cache) or GUI GetVariableFromGlobalVariableMap('name', Market.MakeScope)."
  category: scope
  scope: global
  source: "reference_mods/3692202776/in_game/common/scripted_guis/cmm_core_auto_apply_scripted_gui.txt:12-17; reference_game_files/game/in_game/gui/context_menu.gui:1748"
  notes: "Market scopes are valid keys for global_variable_map even though direct market set_variable/change_variable storage is unsupported. Do not use the market center location as an artificial cache owner for SOL market data."

- id: sol_market_center_location_cache
  pattern: "GetCenterLocation\\.MakeScope\\.GetVariable\\('sol_market_|location\\s*=\\s*\\{\\s*set_variable\\s*=\\s*\\{\\s*name\\s*=\\s*sol_market_"
  only_in_paths: ['src/stable']
  bad: "Using a market center location variable as a SOL market-keyed cache"
  correction: "Use global_variable_map keyed by the market scope instead. Script: remove_from_global_variable_map = { name = sol_market_* key = scope:sol_market_cache } then add_to_global_variable_map = { name = sol_market_* key = scope:sol_market_cache value = ... }. GUI: GetVariableFromGlobalVariableMap('sol_market_*', Location.GetMarket.MakeScope)."
  category: scope
  scope: global
  source: "reference_mods/3692202776/in_game/common/scripted_guis/cmm_core_auto_apply_scripted_gui.txt:12-17; reference_mods/3692202776/loading_screen/data_binding/cmm_macros_settings.txt:88"
  notes: "SOL market data belongs to the market key, not to an arbitrary center location. Center-location caches are brittle and obscure the actual key."

- id: demands_goods_by_pops_is_shortage_not_consumption
  pattern: null
  bad: "Using demands_goods_by_pops = goods:<good> as a generic consumed-good or market pop-demand test"
  correction: "For a known market, scope to the good and use is_demanded_in_market_by_pops = scope:<market>. Reserve demands_goods_by_pops for checks where pop demand exceeds supply."
  category: trigger
  scope: market
  source: "reference_game_files/game/main_menu/localization/english/triggers_l_english.yml:5842; reference_game_files/game/in_game/common/trigger_localization/goods_triggers.txt:61; reference_mods/3629022149/in_game/common/on_action/country_monthly_stockpile.txt:3967"
  notes: "The trigger localization for demands_goods_by_pops describes a shortage condition, not mere consumption. The goods-scope trigger is_demanded_in_market_by_pops accepts a market scope target."

- id: gui_only_scope_variable_unused_warning
  pattern: null
  bad: "Using set_variable only to feed GUI/localization display, with no live script-side read"
  correction: "For GUI-only display caches, ensure the scope variable is also read in a live script path. Moving the cache to global_variable_map can be correct for keying/storage, but does not by itself satisfy unused-variable validation."
  category: gui
  scope: any
  source: "EU5 error.log jomini_effect.cpp:1162; reference_official_defines/docs/data_types_script.txt:34; reference_mods/3692202776/in_game/common/scripted_guis/cmm_core_auto_apply_scripted_gui.txt:12-17"
  notes: "Jomini's unused-variable validation does not count GUI/localization-only reads. Scope variables written only for panel display can flood error.log with 'Variable X is set but is never used'."

- id: gui_only_global_variable_map_unused_warning
  pattern: null
  bad: "Writing global_variable_map values only for GUI display, with GetVariableFromGlobalVariableMap(...) as the sole read"
  correction: "Keep global_variable_map for keyed caches when appropriate, but also read each map name in a live script path with global_variable_map(name|scope:key). A local-variable count or no-op script-side read is enough when the value is only displayed."
  category: gui
  scope: global
  source: "EU5 error.log jomini_effect.cpp:1162 for gls_country_consumes_*; reference_mods/3692202776/in_game/common/scripted_triggers/cmf_core_triggers.txt:9"
  notes: "Jomini's unused-variable validation also ignores GUI-only GetVariableFromGlobalVariableMap reads. Use in unused scripted triggers/effects does not count; the read must sit in an effect/trigger that actually runs."

- id: gui_market_getlocation_invalid
  pattern: '\.GetMarket\.GetLocation\b'
  bad: "Calling .GetMarket.GetLocation in GUI expressions to access a market's hub location"
  correction: "Use .GetMarket.GetCenterLocation only when the UI truly needs the trade-center Location object. For market-keyed caches, prefer global_variable_map keyed by Market.MakeScope instead of center-location variables."
  category: gui
  scope: any
  source: "reference_game_files/game/in_game/gui/context_menu.gui:940 — 'ondoubleclick = \"[PanToLocation(Location.GetMarket.GetCenterLocation)]\"'"
  notes: "Exhaustive search of reference_game_files for .GetMarket.GetLocation returned zero matches; .GetMarket.GetCenterLocation is the canonical accessor for navigation to the center location. It is not a recommended cache storage path for SOL market data."

- id: situation_custom_mapmode_not_script_field
  pattern: null
  bad: "Adding map_mode = <tag> to a situation definition or using a child widget's _show state when the child is created already visible"
  correction: "Keep is_data_map/map_color for the situation data map. For a separate custom mapmode, add a zero-size widget inside the situation_panel and use a trigger_on_create state whose on_start calls \"[PdxGuiWidget.PushMapModeOverride('<tag>')]\". The widget-scoped override is removed when the situation-specific panel widget is destroyed."
  category: gui
  scope: any
  source: "reference_game_files/game/in_game/common/situations/readme.txt:12-18; reference_official_defines/docs/data_types_gui.txt:5872-5882; src/stable/in_game/gui/SOL_migration_caller.gui:35-50; reference_game_files/game/in_game/gui/shared/population_tooltip.gui:9-13"
  notes: "Situation script exposes data-map coloring but no verified field selecting a separate custom mapmode. A dynamically instantiated situation child can start already visible, so _show never runs; trigger_on_create handles that case. Vanilla PushMapModeOverride callers do not manually PopMapModeOverride because the override belongs to the PdxGuiWidget lifecycle."

- id: gui_state_on_start_does_not_inherit_datacontext
  pattern: 'state\s*=\s*\{[^{}]*\btrigger_on_create\s*=\s*yes[^{}]*\bon_start\s*=\s*"\[MapMode\.SetMapMode\]"'
  only_in_paths: ['src/stable/in_game/gui']
  bad: "Calling [MapMode.SetMapMode] from state.on_start while expecting a sibling or parent datacontext = [GetMapMode('<tag>')] to supply the MapMode object"
  correction: "Call the object-returning function inside the action expression: on_start = \"[GetMapMode('<tag>').SetMapMode]\"."
  category: gui
  scope: any
  source: "EU5 error.log: No context supplied, wanted context of type 'MapMode' for 'MapMode.SetMapMode'; reference_mods/3692202776/in_game/gui/cmf/cmf_after_lobby_caller.gui:10"
  notes: "trigger_on_create state actions do not inherit the widget's datacontext for method dispatch. The action expression must create or receive the required object itself."

- id: situation_custom_mapmode_visibility_states
  pattern: null
  bad: "Using _show/_hide plus global SetMapMode/SetDefaultMapMode to manage a mapmode for a dynamically instantiated situation panel"
  correction: "Use trigger_on_create with PdxGuiWidget.PushMapModeOverride on a zero-size child of the situation-specific panel. This fires when the child is created already visible and ties cleanup to that widget's destruction."
  category: gui
  scope: any
  source: "In-game SOL panel test (2026-07-22): _show did not enter sol_living_standard; src/stable/in_game/gui/SOL_migration_caller.gui:35-50; reference_official_defines/docs/data_types_gui.txt:5872-5882"
  notes: "_show only runs after an existing widget changes from hidden to shown. It is not a construction callback, so it misses a situation child created after its parent is already shown. A global SetDefaultMapMode cleanup can also discard the player's prior mapmode instead of restoring the overridden mode."

- id: yearly_january_pulse_spike
  pattern: ''
  bad: "Gating heavy per-country / per-location work behind 'limit = { current_month = 1 }' inside a situation's on_monthly block — fires on every January 1 for every country at once"
  correction: "Use vanilla 'yearly_country_pulse' on_action instead — it fires once per country per year on each country's own anniversary date, naturally distributing load across the whole year. For globally-scoped yearly work (e.g. every_market_in_world scans), keep the situation-month-1 gate but split the work into market-hub-cached or quarterly passes. Anything that iterates every_owned_location per country per year MUST go through yearly_country_pulse, not the global situation."
  category: scope
  scope: global
  source: "src/stable/in_game/common/situations/SOL_economy_situation.txt:23-71; src/stable/in_game/common/on_action/SOL_economy_on_actions.txt:6-10"
  notes: "Documentation-only (no regex lint). The situation's on_monthly with current_month=1 gate causes ALL countries to recompute simultaneously on Jan 1, producing a yearly frame-time spike. Vanilla yearly_country_pulse staggers per-country work because each country's pulse fires on its own creation-date anniversary, not all on Jan 1. The performance impact is O(N_countries × per_country_work) compressed into a single tick. Detected when SOL January lag report (2026-05-07) traced to 6.7M conditional checks on Jan 1 from 5-strata × 336-checks per location across 4000+ owned locations."

- id: estate_building_count_hardcoded_lists
  pattern: null
  bad: "Counting estate buildings with hard-coded building type lists or plain num_buildings instead of checking the building's estate owner/type"
  correction: "Iterate a location with every_buildings_in_location and filter the building scope with estate_type ?= estate_type:<estate>, e.g. estate_type ?= estate_type:nobles_estate."
  category: scope
  scope: location
  source: "reference_game_files/game/in_game/events/DHE/flavor_SWE.txt:1076-1078"
  notes: "Building scope exposes estate_type; this avoids brittle building-name lists and excludes non-estate buildings while counting per-location estate buildings."

- id: event_missing_outcome_field
  pattern: ''
  bad: "country_event / age_event / etc. without an 'outcome = ...' top-level field"
  correction: "Add 'outcome = neutral' (or good / bad / positive / negative) below 'desc = ...' in every event block. Vanilla 1.2 added a hard validator: events without an outcome emit 'Event #X is missing an outcome' to error.log on game-load. The five accepted values are neutral, good, bad, positive, negative — match the event's actual flavor (use neutral for pure-notification events with no consequential choice)."
  category: event
  scope: any
  source: "reference_game_files/game/in_game/events/ages.txt:7 (ages_of_eu.1 uses 'outcome = neutral'); EU5 1.2 changelog — added in unscoped 'Bug Fixes' / event_database validator pass; engine error: 'Event #X is missing an outcome in events/Y.txt' from event_database.cpp:648"
  notes: "Pre-1.2 events did not require this field and ran fine without it. 1.2 added the validator that emits the missing-outcome warning per event, per file-load. The warning does NOT block the event from firing in-game, but it floods error.log and indicates a category mismatch. Use 'outcome = neutral' for tooltip-only / show_as_tooltip notification events (matches vanilla age events). Use 'good' / 'bad' / 'positive' / 'negative' when the event has a clear directional flavor for the player. Documentation-only entry (no regex lint) because parsing top-level event blocks reliably is hard, and validate.py would over- or under-match."

- id: goods_demand_block_value_syntax
  pattern: ''
  bad: "goods demand entry using block syntax: wine = { value = SOL_wine_demand }"
  correction: "Direct scalar assignment — no block wrapper: wine = SOL_wine_demand"
  category: scripted_values
  scope: pop
  source: "reference_game_files/game/in_game/common/goods_demand/pop_demands.txt"
  notes: "pop_demand good entries must be plain key = value pairs (matching vanilla wine = 1 pattern). Block wrapper { value = ... } causes the parser to load only the first entry and drop all subsequent goods plus category. Both quoted strings and block wrappers are broken; direct assignment is the only valid form."

- id: limit_in_scope_transition_block
  pattern: null
  bad: "'limit = { ... }' directly inside a scope-transition block such as 'location = { limit = { ... } }', 'country = { limit = { ... } }', etc."
  correction: "Wrap with 'if = { limit = { ... } }' inside the scope-transition block. 'limit' is only valid directly inside iteration effects (every_*, random_*, ordered_*, while). Inside a scope-hop block it is an 'Unknown effect limit' error."
  category: scope
  scope: any
  source: "src/stable/in_game/common/scripted_effects/z_SOL_scarcity_score.txt:1864 — engine error: 'Unknown effect limit at ... :1864' from jomini_effect.cpp:556"
  notes: "Scope-transition blocks (location={}, country={}, etc.) are NOT loops — the engine does not recognise 'limit' there. Use 'if = { limit = { ... } }' for conditional execution inside a scope hop."

- id: database_operation_priority_ignored
  pattern: null
  bad: "Using a later filename, a zz_ prefix, or a lower playlist position as a universal way to make any INJECT/REPLACE database edit win"
  correction: "Separate exact-path file overwrites from database object edits. For object edits, compare operation type first (INJECT_OR_CREATE -> REPLACE_OR_CREATE -> TRY_INJECT -> TRY_REPLACE -> INJECT -> REPLACE), then use filename order only when the operation types are identical."
  category: compatibility
  scope: top-level database object
  source: "User-provided EU5 compatibility mechanics note (2026-07-21); docs/technical/EU5_Multi_Mod_Compatibility.md"
  notes: "Documentation-only (no regex lint). Database entries are batched by operation type before filename ordering. Exact-path collisions use a separate whole-file rule: mod over base/DLC, then the lower mod in the playlist. INJECT is top-level append rather than nested deep merge, and scripted effects/triggers treat INJECT like replacement."

- id: static_modifier_full_replace_for_numeric_delta
  pattern: null
  bad: "Copying an entire vanilla static modifier into TRY_REPLACE when the intended change is only an additive numeric adjustment"
  correction: "Use TRY_INJECT with only the difference between the desired final modifier value and the verified vanilla value; omit game_data and unchanged fields"
  category: compatibility
  scope: any
  source: "reference_mods/3613232232/main_menu/common/static_modifiers/pp_location_modifier_adjustments.txt:439-455; reference_mods/3613232232/in_game/common/static_modifiers/pp_population_growth_and_food_adjustments.txt:174-177"
  notes: "Static modifier values accumulate across injected entries. Delta-only injection preserves unrelated vanilla fields and allows other mods to contribute their own modifier deltas. Fields that cannot be neutralized additively still require replacement."

- id: price_resource_inject_treated_as_additive
  pattern: null
  bad: "Treating a repeated price resource field such as gold as an additive delta, or injecting a negative value to cancel an earlier mod's price injection"
  correction: "Repeated scalar fields injected into a price object replace the earlier field value. When two mods use the same operation type, use filename order to select the owner; use a verified full replacement only when filename ordering cannot express the intended final object. Never emit a negative cleanup injection."
  category: compatibility
  scope: price
  source: "user-reported EU5 1.3.11 runtime behavior (2026-07-24); src/stable/in_game/common/prices/A_SOL_economy_prices.txt:177-191; reference_mods/3613232232/in_game/common/prices/pp_road_gold_adjustments.txt:2-13"
  notes: "In the SOL-PP stack, A_SOL_economy_prices.txt loads before pp_road_gold_adjustments.txt within TRY_INJECT, so PP's road gold fields naturally replace SOL's. A later compatibility injection of -10/-25/-100/-400 became authoritative and road costs were clamped to zero. This price behavior differs from additive numeric static modifiers."

- id: goods_upper_group_includes_workers_1_3_11
  pattern: null
  bad: "Expanding the goods demand group key 'upper' to nobles, clergy, and burghers only"
  correction: "In EU5 1.3.11, expand 'upper' to nobles, clergy, burghers, laborers, and soldiers for both demand_add and demand_multiply. Peasants and tribesmen remain outside the group."
  category: goods
  scope: pop
  source: "user-reported engine behavior (2026-07-21); tools/sol_demand_simulator/parser.py"
  notes: "Documentation-only (no regex lint). Any calibrated demand_add injection must be regenerated after applying the expanded group to vanilla demand, otherwise laborer and soldier injections are computed from an understated vanilla net demand."

- id: pop_demand_development_controls_left_active
  pattern: null
  bad: "Calibrating pop demand while leaving either NPop.DEVELOPMENT_SCALE_ON_DEMAND or per-good development_threshold values active"
  correction: "Treat them as two independent controls. Set NPop.DEVELOPMENT_SCALE_ON_DEMAND = 0 to remove the engine-wide multiplier, and fully negate every goods development_threshold with a late INJECT so vanilla + inject = 0. Compatibility goods such as PP victuals need their own negation."
  category: goods
  scope: pop
  source: "reference_game_files/game/loading_screen/common/defines/00_defines.txt:1599; reference_game_files/game/in_game/common/goods/00_raw_materials.txt:292,425,538; reference_game_files/game/in_game/common/goods/02_produced_goods.txt:21,91,143,228,251,345; reference_mods/3613232232/in_game/common/goods/pp_goods_victuals.txt:32"
  notes: "Documentation-only (no regex lint). DEVELOPMENT_SCALE_ON_DEMAND = 0 removes the universal (1 + development * scale) multiplier but does not clear goods gates. Conversely, negating every development_threshold does not remove the universal multiplier. Both layers must be disabled for development-independent demand calibration."

- id: pop_demand_regional_modifiers_left_active
  pattern: null
  bad: "Taking over a compatibility good's pop demand while leaving loaded continent_demand_modifier or sub_continent_demand_modifier blocks active"
  correction: "Audit every source goods block for continent_demand_modifier and sub_continent_demand_modifier. When the compatibility patch owns final demand, emit late negative INJECT blocks that exactly cancel each recorded key, just like wealth/development gate negations."
  category: goods
  scope: pop
  source: "reference_game_files/game/in_game/common/goods/03_food.txt:100-102; reference_game_files/game/in_game/common/goods/00_raw_materials.txt:298-300; reference_mods/3785316314/in_game/common/goods/soap_goods.txt:159-168,195-198"
  notes: "Documentation-only (no regex lint). These goods-level regional modifiers change pop demand by continent or sub-continent after the base demand values are loaded. A compatibility target that recalibrates demand_add but leaves them active gets regionally divergent final demand. The Just Goods compatibility generator now audits and negates them for aromatics, palmoil, soap, and whaleoil."

- id: cmm_disabled_setting_left_registered
  pattern: null
  bad: "Leaving a disabled feature in the mod's CMM registration effect, or directly mutating CMM internal maps to hide a stale setting from old saves"
  correction: "Replace the mod registration effect and omit disabled settings and callbacks. CMM's _cmm_register_group clears each group's setting-key list during every registration cycle, so omitted settings disappear from both new games and upgraded saves. Hard-disable the gameplay trigger separately for defense in depth."
  category: framework
  scope: country
  source: "reference_mods/3692202776/in_game/common/scripted_effects/cmm_core_effects.txt:198-199"
  notes: "Documentation-only (no regex lint). Localization and unused scripted GUI definitions do not create a visible setting; CMM panel visibility is driven by the rebuilt per-group registration list."

- id: cmm_compat_opt_in_reuses_legacy_setting_id
  pattern: null
  bad: "Reusing a formerly enabled or hidden CMM setting ID for a new compatibility opt-in and expecting default_value = 0 to reset upgraded saves"
  correction: "Register a compatibility-specific setting ID with default_value = 0, sync it to the gameplay alias, and omit the legacy setting ID. Gate the gameplay trigger through that alias and keep the feature off when CMM is absent."
  category: framework
  scope: country
  source: "reference_mods/3692202776/in_game/common/scripted_effects/cmm_core_bool_setting_effects.txt:28-35,56-59; reference_mods/3692202776/in_game/common/scripted_effects/cmm_core_alias_effects.txt:99-115"
  notes: "Documentation-only (no regex lint). CMM applies a setting's default only when its variable-map key is missing. A saved legacy key keeps its old value, so a fresh compatibility ID is the safe way to preserve default-off behavior without directly rewriting CMM internal maps."

- id: scripted_effect_duplicate_without_replace
  pattern: null
  bad: "Defining an existing scripted effect again in a later or zz_-prefixed file without a REPLACE operation"
  correction: "Emit REPLACE:<effect_name> for each scripted effect whose body must change. Prefer outputting only changed effects instead of copying the whole source file."
  category: compatibility
  scope: scripted_effect
  source: "runtime error.log (2026-07-21): 'Duplicated key sol_refresh_market_pop_demand_maps will not be created from file: common/scripted_effects/zz_A_SOL_economy_effects.txt'"
  notes: "A later filename does not turn a plain duplicate definition into an override. The engine keeps the original effect and rejects the duplicate, so compatibility-only branches never run."

- id: inject_duplicate_nested_trigger_section
  pattern: null
  bad: "TRY_INJECT on an existing database object with a second nested trigger section such as allow = { ... }"
  correction: "Copy the verified complete source object and use REPLACE when nested logic must change; preserve every required sibling field from the source."
  category: compatibility
  scope: top-level database object
  source: "runtime error.log (2026-07-21): 'Trigger section already read earlier: allow' in common/cabinet_actions/A_SOL_war_cabinet_actions.txt"
  notes: "Database injection appends top-level content and does not deep-merge nested trigger blocks. A duplicate singleton section is rejected by that database parser."

- id: simple_assign_trigger_not_equal_operator
  pattern: '\bbuilding_category\s*!='
  bad: "Using != with the simple-assign building_category trigger"
  correction: "Wrap the equality trigger in NOT, for example: NOT = { building_category = government_category }"
  category: trigger
  scope: any
  source: "reference_mods/3735059838/in_game/common/scripted_effects/epbm_calculate.txt:32; runtime error.log (2026-07-22): 'building_category trigger [ Trigger is simple assign, but used a symbol other than = in the middle ]'"
  notes: "Simple-assign triggers accept only = in the middle. Boolean negation belongs in a NOT block; != makes the scripted effect fail to compile."

- id: removed_setting_leaves_unset_variable_reads
  pattern: null
  bad: "Removing a CMM setting and its active alias setter while leaving script values, triggers, or scripted GUIs that read the alias variable"
  correction: "Remove or exact-path override every residual reader; retain variable-free constant fallbacks for referenced script values and only the scripted GUI callbacks that remain registered"
  category: framework
  scope: global
  source: "runtime error.log (2026-07-22): Variable 'sol_cts' is used but is never set. Setting it in an unused scripted trigger or effect does not count"
  notes: "The engine's variable analysis ignores setters that only occur in unreachable or unused scripted objects. Dummy setters do not cleanly retire a setting; remove the readers instead."

- id: scripted_trigger_called_from_wrong_entry_scope
  pattern: null
  bad: "Calling a scripted trigger from a scope it does not support because one of its internal scope links happens to reach the desired object"
  correction: "Verify the scripted trigger's entry scope from its complete body. Call it only from that scope, or replace it with equivalent triggers valid in the current scope"
  category: scope
  scope: any
  source: "reference_game_files/game/in_game/common/scripted_triggers/pop_triggers.txt:28-39; runtime error.log (2026-07-22): owner trigger wrong scope country from is_gaelic_clans called by epbm_calculate"
  notes: "is_gaelic_clans starts with pop-only culture and foreign-building checks and then follows owner to country. Calling it directly from country makes its owner link invalid even though the nested privilege checks are country-scoped."

- id: gui_compatibility_merge_uses_stale_upstream_base
  pattern: null
  bad: "Building a final exact-path GUI compatibility override from vanilla or an earlier dependency when a later UI overhaul already owns and merges that file, then deleting the later file's optional cm_* references because the source mod is not a formal dependency"
  correction: "Audit same-relative-path files and dependency metadata, choose the final downstream owner's GUI file as the merge base, and add the third mod's controls to that unified file. Keep valid references to optional definitions when the integration is intentionally load-order based; classify missing cm_* definitions as expected only when Construction Manager is not enabled. Do not turn an exact-path merge into a self-contained rewrite unless the feature is explicitly being removed."
  category: compatibility
  scope: gui
  source: "reference_mods/3812518640/.metadata/metadata.json; reference_mods/3812518640/in_game/gui/location_window.gui:2256-2260,7884-7895,8069-8094"
  notes: "Glorp UI and Construction Manager already conflict on the exact path in_game/gui/location_window.gui. Glorp's file integrates CM controls, so the correct SOL merge base is the complete Glorp file with the SOL button inserted. SOL does not declare either Workshop mod in metadata. With SOL alone, cm_* lookup errors are expected and do not prevent the Glorp/SOL layout from displaying; with all three mods, Construction Manager supplies the definitions and the errors disappear."

- id: monthly_savings_pressure_recomputed_for_ai
  pattern: null
  bad: "Calling gls_compute_savings_pressure unconditionally for every country (including AI) from the global situation's on_monthly, and again calling gls_compute_panel_display (which itself just re-runs gls_compute_savings_pressure) from gls_full_refresh_country right after sol_update_local_pop_demand_modifiers already refreshed it"
  correction: "Gate gls_compute_savings_pressure in the situation on_monthly behind is_human = yes (AI never reads gls_savings_pressure_adjustment for panel display; the value that actually affects gameplay is recomputed monthly per-country by sol_update_local_pop_demand_modifiers via monthly_country_pulse). Drop the gls_compute_panel_display call from gls_full_refresh_country since sol_update_local_pop_demand_modifiers in the same effect chain already refreshed the identical cache."
  category: scope
  scope: country
  source: "src/stable/in_game/common/situations/SOL_economy_situation.txt:22-27; src/stable/in_game/common/scripted_effects/A_SOL_economy_effects.txt:2762-2779,2787-2790,3525-3532 (mirrored in src/sol_standalone)"
  notes: "Documentation-only (no regex lint). gls_compute_savings_pressure only writes owner.var:gls_savings_pressure_adjustment, which sol_compute_location_pop_demand reads for the applied SOL modifier. For AI countries that cache is overwritten every month anyway by their own monthly_country_pulse tick before it can be consumed for display, so the situation's every-country every-month call was pure O(N_countries) waste. Same redundancy pattern as yearly_january_pulse_spike but on the monthly cadence; found during a 2026-07-28 review of monthly-tick computation cost."

- id: pop_needs_income_scale_left_vanilla
  pattern: null
  bad: "Calibrating strata income and pop demand while leaving NPop.POP_NEEDS_INCOME_SCALE at the vanilla value of 1.33"
  correction: "Set NPop.POP_NEEDS_INCOME_SCALE = 1 in every base SOL deploy target so pop-needs expenditure uses the nominal cost of purchased goods"
  category: goods
  scope: pop
  source: "reference_game_files/game/loading_screen/common/defines/00_defines.txt:1600; user-reported in-game testing (2026-07-26)"
  notes: "The vanilla 1.33 value makes pops pay 33% above nominal goods cost. Leaving it active breaks SOL's income-closed strata balance independently of demand quantities and development controls."

- id: cmf_log_entry_overloaded
  pattern: null
  bad: "Packing many unrelated diagnostics or more than four dynamic values into one CMF log entry"
  correction: "Keep each CMF entry to one diagnostic concept and at most four dynamic values. Prefer compact labels; split an essential wide vector into short rows, or omit secondary fields rather than emitting an unreadable line."
  category: framework
  scope: any
  source: "user-reported in-game CMF log readability feedback (2026-08-07)"
  notes: "CMF renders the actor and localized action text in one log row. Dense profile/equation entries become difficult to read or copy even when the total remains below the 200-entry cap."

- id: ordered_scope_without_explicit_max
  pattern: null
  bad: "Omitting max from an ordered_* scope while expecting it to iterate every matching object"
  correction: "Set an explicit sufficient max for full ordered traversal, or a verified dynamic bound. Reserve max = 1 or the default single result for deliberate best-candidate selection."
  category: scope
  scope: any
  source: "user-reported in-game SOL classification log (2026-08-07); scripts/sol_economy_effects_source.py; reference_game_files/game/in_game/events/character/consort_events.txt:645-652"
  notes: "In runtime testing, ordered_owned_location without max scored 189 valid locations in the first pass but assigned only the first location in the ordered pass. An explicit max = 100000 makes the classification pass traverse all practical country location counts."

- id: variable_map_value_inline_math_block
  pattern: 'add_to_(?:global_)?variable_map\s*=\s*\{[^\n]*\bvalue\s*=\s*\{'
  bad: "Passing an inline arithmetic block such as value = { value = var:X divide = var:Y } to add_to_global_variable_map"
  correction: "Evaluate arithmetic with set_variable first, pass the resulting scalar as value = var:temporary_value, then remove the temporary variable after the map write."
  category: scope
  scope: any
  source: "runtime error.log (2026-08-07): Failed to find event target link '{' and Failed to read 'divide'/'min' for add_to_global_variable_map; reference_mods/3739393770/in_game/common/scripted_effects/dmsd_update_display.txt:30-33"
  notes: "The variable-map effect parses value as a direct scalar or event target, not a script-math block. The invalid SOL CMF writes corrupted class raw-average/share diagnostics without changing classification or solver gameplay state."

- id: value_expression_clamp_direction_reversed
  pattern: 'value\s*=\s*\{[^\n}]*\bmax\s*=\s*0(?:\s|\})'
  bad: "Using max = 0 when a value expression must be clamped to a nonnegative lower bound"
  correction: "Use min = 0 for a lower bound and max = <positive limit> for an upper bound; verify both sides when writing a bounded value expression."
  category: scope
  scope: any
  source: "reference_game_files/game/in_game/common/auto_modifiers/country.txt:330-335"
  notes: "EU5 value expressions apply min as the lower clamp and max as the upper clamp. Reversing them can silently zero positive solver factors; the SOL exact-derived minimax candidate exposed this at runtime on 2026-08-08."

- id: cmm_default_off_alias_initialized
  bad: "Initializing a default-OFF CMM bool alias in the mod's on_game_start defaults effect, e.g. set_global_variable = { name = sol_x_enabled value = no }"
  correction: "Omit default-OFF aliases from the init effect entirely. cmm_sync_bool_alias sets the global only when the toggle is ON and calls remove_global_variable when OFF, so has_global_variable must stay false until CMM enables it. Also invert the CMM-absent fallback in the matching sol_*_is_on trigger: default-ON toggles use OR = { NOT = { has_global_variable_map = cmm } ... }, while default-OFF toggles must NOT include that escape or they read as enabled without CMM."
  category: framework
  scope: global
  source: "reference_mods/3692202776/in_game/common/scripted_effects/cmm_core_alias_effects.txt:105-125; reference_mods/3662193478/in_game/common/scripted_effects/fum_cmm_effects.txt:8-15 (FUM never initializes its default_value = 0 aliases)"
  notes: "Documentation-only (no regex lint) because a legitimate default-ON init line is textually identical apart from the value. set_global_variable with value = no still creates the key, so has_global_variable returns true and a default-OFF feature runs from turn one. Any setting registered with default_value = 0 must appear in exactly four places: cmm_register_global_bool_setting, cmm_sync_bool_alias, the cmf_on_callback switch, and a <mod_id>__<setting_id>_on_changed scripted GUI when cmm_add_scripted_gui is called — but never in the init defaults."

- id: country_solver_infeasibility_misdiagnosis
  bad: "Diagnosing a country-solver negative_factor or a class-wide -100% local_pop_demand by inspecting condition number, classifier churn, coefficient magnitude, or by assuming a near-zero coefficient was a clamped floating-point artifact"
  correction: "Run tools/eu5_save_parser/cone_feasibility.py FIRST. Exact-solve feasibility means target in cone(class columns); because every class column sums nonnegative location vectors, cone(any 4-way partition) is contained in cone(all owned locations). If the all-location residual exceeds ~0.01 the target is unreachable and NO classifier change, class count, capacity rule, or conditioning fix can help - only relaxing the target or accepting an approximation. See docs/technical/SOL_Country_Level_Strata_Demand_Model.md section 3.9."
  category: scope
  scope: country
  source: "HUN five-save series 2026-08-11 (SP_HUN_1337_10_02 .. 1338_02_02, playthrough d95e1b3a): all-location cone residual 0.0465-0.1057, 8-43 locations require negative factors; docs/technical/SOL_Country_Level_Strata_Demand_Model.md section 3.9"
  notes: "Documentation-only (no regex lint). Linear independence is NOT the feasibility criterion: det(M) != 0 only gives uniqueness, and measured HUN condition numbers were a healthy 55.6-96.0 while the exact solve still failed. A zero coefficient returned by a nonnegative approximation is a legitimate boundary optimum, not a clamped artifact, so tightening the gate to reject delta < 0 does not stop -100% (it cannot reject = 0). Four wrong attributions were ruled out by data: silent zero-clamping, ill-conditioning, the yearly unit-spending refresh as switch trigger (1337.10/11/12 had frozen unit spending yet flipped infeasible->feasible), and classifier churn as an independent cause (1338 data under 1337 classes still gave Class 4 = -1.089). The real conflict is structural: nobles/clergy need scaling up while lower needs scaling down ~41%, but their per-location spending is coupled (nobles-vs-lower share correlation 0.29-0.47), so no nonnegative factor field separates them."

- id: capacity_floor_starves_zero_pressure_classes
  bad: "Reading a country-solver class coefficient in the tens or hundreds (e.g. Class 1 = 105.98) as a data error or numerical blow-up"
  correction: "Expect it. Capacity targets are baseline_total * capacity_floor + baseline_total * negative_pool * pressure_share, and pressure is clipped at zero, so a stratum whose baseline is BELOW target (needs scaling up) contributes zero pressure and its class receives only the 1% floor. That class column then carries ~1-3% of the mass of the dominant class, and ||W^-1 row|| reaches 96-404, so a normal 0.01 monthly move in a compression ratio swings that coefficient by 1-4 units. Switching capacity to abs(baseline - target) cuts median amplification from 120.6 to 55.9 but does NOT improve feasibility and shrinks the surviving Class 4 margin from 0.164 to 0.033."
  category: scope
  scope: country
  source: "HUN five-save series 2026-08-11: Class 1 column mass 1.98-5.50 vs Class 4 156-177; capacity targets C1/C2 ~1.9-2.3 vs C4 140-193 with capacity_floor = 0.01, negative_pool = 0.96"
  notes: "Documentation-only (no regex lint). Amplification and feasibility are independent problems: amplification comes from unequal column mass (the 1% anchor), feasibility comes from cone containment. Raising capacity_floor trades jitter for margin in both directions, so it is a tuning decision rather than a fix. HUN is especially exposed because nobles are 68% of national spending yet carry zero pressure, leaving the class that represents them with almost no matrix mass."

- id: reduced_frequency_pulse_drops_modifier_between_solves
  bad: "Implementing a 'reduce calculation frequency' toggle by moving both the solve AND the add_location_modifier call to yearly_country_pulse with years = 1, so the modifier's lifetime is what carries the value between solves"
  correction: "Split the effect: keep applying the modifier every month from the cached per-location size variable (months = 1, mode = replace) and move only the expensive solve to yearly_country_pulse. A stale coefficient re-applied monthly is acceptable; a lapsed modifier is not."
  category: scope
  scope: country
  source: "src/stable/in_game/common/on_action/SOL_economy_on_actions.txt; gls_full_refresh_country in scripts/sol_economy_effects_source.py calls the monthly updater unconditionally on every game start and save load"
  notes: "Documentation-only (no regex lint). Relying on a years = 1 modifier to bridge yearly solves looks self-sustaining in steady state but breaks at every entry point that is not the yearly pulse: game start, save load, player-to-AI handover, a newly formed country, and switching the toggle on mid-game all write (or leave) a months = 1 modifier that expires long before the country's own anniversary date arrives. The country then runs on the bare demand_add baseline for up to 11 months with no error and no log line. Applying monthly from the cache also makes the toggle safe to flip at any time, and costs only the every_owned_location write the default configuration was already paying."

- id: retired_solver_strategy_described_from_stale_docs
  bad: "Describing or reasoning about the country demand solver's approximation strategy from BRIEF.md / PROJECT_OVERVIEW.md prose (e.g. 'player four-strategy L2 path', 'AI proportional_fast', 'minimax vertices', 'active-set candidates') without grepping the generated solver first"
  correction: "Grep the generated file before describing runtime behaviour: 'grep -c <effect_name> src/stable/in_game/common/scripted_effects/B_SOL_country_demand_solver.txt'. A count of 1 means definition-only (dead code, never called); 0 means the effect is not rendered at all and exists only in the generator's _SOLVER_EFFECTS name list used for file routing. As of 2026-08-13 only two strategies are live: id 7 exact-direct and id 8 the 209-case vertex sweep, with id 0 for raw_fallback. The objective is scaled L1 (mean of the four per-row relative residuals) with scaled L-infinity as a 1% tie-break, under a hard no-worsen constraint against raw -- NOT an L2 least-squares fit."
  category: scope
  scope: country
  source: "src/stable/in_game/common/scripted_effects/B_SOL_country_demand_solver.txt lines 528-575 (solve_approximation) and 577-670 (sol_vertex_row_metric / sol_vertex_metrics / sol_vertex_consider); verified counts on 2026-08-13: run_fast_proportional 0, minimax_vertex_enumeration 0, approx_candidate_* 0, approx_assess 1, select_approx_strategy 1, approx_prepare_strategy 1, solve_reduced_3 1, solve_reduced_4 1, vertex_case_* 209"
  notes: "Documentation-only (no regex lint). BRIEF.md was self-contradictory: its Core Features paragraph correctly stated the L2 variants and minimax_ratio were retired, while the SOL System Architecture and runtime-cost paragraphs further down still described the retired L2/proportional_fast path and strategy ids 1-6. Reading the latter produced a technical write-up describing three algorithms that do not exist in the shipped mod. Two further traps: (a) the offline tool tools/eu5_save_parser/demand_analysis.py DOES still implement balanced_l2/improvement_l2/target_l2/absolute_l2/minimax_ratio/proportional_fast as comparison baselines, so finding them there is not evidence they run in-game; (b) A_SOL_economy_effects.txt still carries a CMF log branch for strategy id 6 (proportional fast) that no code path can now produce. Prefer the generated .txt as ground truth over any prose, including this file."

- id: empty_sol_caches_mistaken_for_parser_failure
  bad: "Seeing every sol_location_* column empty in an exported save and concluding the parser broke, the export is corrupt, or the save is unusable for analysis"
  correction: "Check metadata.json's countries_with_sol_variables field first. A value of 0 means the save itself carries no SOL runtime state -- the mod was absent or disabled when it was written -- so no amount of re-parsing will produce those columns. Confirm against the raw save with 'grep -c sol_location_demand_class <save>.eu5': a working save returns tens of thousands of hits, an unusable one returns 0. Crucially, such a save is NOT useless: every engine-native column still exports (population per stratum, shares, owner, market, rank, development, control), which is enough for population-structure and heterogeneity analysis. Only SOL-derived quantities are lost -- per-stratum base spending B_s(l), net income I_s(l), and the raw coefficient m_raw(l) -- which means feasibility and improvement analysis is impossible because the target vector t cannot be reconstructed."
  category: scope
  scope: country
  source: "data/save_analysis/_all_SP_*_1536_09_21_636b7b0a/metadata.json reports countries_with_sol_variables: 0 while exporting 28,573 location records and 16,660 owned locations; the 1386 save at identical location count reports 13,630 non-empty sol_location_raw_demand_scale values. Raw-save grep: 1386 has 84,215 hits for sol_location_demand_class, 1536 has 0"
  notes: "Documentation-only (no regex lint). The earlier cone_survey note recorded this save as '623 no-valid-location countries and 0 scored, likely a data issue', which reads as a defect to investigate rather than a save that simply predates or excludes the mod. The distinction matters because the two situations call for opposite responses: a parser defect needs fixing, whereas a SOL-less save should be routed to the analyses it can still support. Verified usable for the heterogeneity measurement in tools/eu5_save_parser/heterogeneity_survey.py: it yields 295 countries with 5+ locations and the widest noble-share spread of any save examined (median 7.1x max/min, versus 3.8x in 1337). It is not in that tool's default save list -- the write-up settled on three timepoints -- but pass it explicitly with --saves 1536_09_21 to include it. The point stands regardless: a SOL-less save is a restricted dataset, not a broken one."

- id: solver_entry_guards_omitted_from_description
  bad: "Describing the country demand solver's control flow by reading only the solver file (B_SOL_country_demand_solver.txt) or only the effect that performs the work, and presenting the raw-error prefilter as if it were the first gate"
  correction: "Read the dispatching effect sol_solve_country_pop_demand in A_SOL_economy_effects.txt top to bottom before describing when the solver runs. Its if/else_if/else chain applies three separate gates in order, and two of them live in the aggregation file rather than the solver: (1) num_locations < 5 routes straight to sol_solve_country_pop_demand_raw_only, skipping classification entirely; (2) the CMF per-side toggle check requires at least one of that side's exact/approx toggles to be on, else raw_only; (3) only then does the solver body run, where sol_country_demand_gate_possible checks whether any raw row exceeds tolerance. Grep for 'num_locations' in the aggregation file to find size gates -- they will never appear in the solver file."
  category: scope
  scope: country
  source: "src/stable/in_game/common/scripted_effects/A_SOL_economy_effects.txt lines 3598-3639 (sol_solve_country_pop_demand); the size gate's rationale is in the comment at 3600-3607: pigeonhole caps the matrix at three non-empty columns below four locations, median scaled L1 for a single-location country moves only 0.329 -> 0.310 versus 0.371 -> 0.222 from three locations up, and skipping them drops 70% of the exact-failed country count for 17% of the owned-location traversal"
  notes: "Documentation-only (no regex lint). The size prefilter is deliberately placed before everything else because num_locations is known up front while the non-empty class count only exists after the confidence-ordered classification pass has already been paid for. It is easy to miss when tracing the solver because it sits in the caller, not in the solver file, and because the solver's own gate_possible variable looks like the entry condition. Anything describing solver cost, coverage, or the size-vs-feasibility relationship is wrong without it: it is also the direct engineering consequence of the 1-9 location bucket's 10.1% feasibility rate, so a write-up citing that bucket while omitting the gate leaves the reader without the reason it exists."

