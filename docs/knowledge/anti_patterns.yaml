- id: gui_text_single_autoresize_beats_declared_size
  pattern: null
  bad: "Giving a fixed-width column cell a `size = { 46 26 }` and expecting the column to be 46px wide"
  correction: "Set `autoresize = no` on every fixed-width text cell. `text_single` inherits `autoresize = yes` from `text_single_template`, and autoresize makes the declared size lose to the text's intrinsic width, so the cell collapses to its content and the columns run together. Keep the default only where shrink-to-fit is wanted."
  category: gui
  scope: any
  source: "reference_game_files/game/loading_screen/gui/textformatting.gui:636-642 (`text_single_template` sets `autoresize = yes`); renderer `engine.py` measures `hw = sw` only when autoresize is off"
  notes: "Cost real debugging time on the SOL estate ledger: five declared columns (46/50/58/52/96) all rendered at content width and fused into one run of digits. The renderer reproduces the game's behaviour, so this was visible before launch. Rule also in the GUI guide section 2 (2026-10-13)."

- id: gui_wrapping_text_without_max_width_inflates_frame
  pattern: null
  bad: "Placing a wrapping `text_multi`/`textbox` in a layout without a `max_width`, assuming the parent's width will constrain it"
  correction: "Give every wrapping text an explicit `max_width`. An hbox measures its children with no width hint, so an uncapped multiline text reports its full *unwrapped* width as a **minimum**, and a minimum defeats the contextual-tooltip width cap: the whole tooltip is dragged wider than its frame. `max_width` caps that minimum as well as the hint."
  category: gui
  scope: any
  source: "Symptom measured in the project renderer (an informational paragraph reported 663px as a minimum inside a 520px card); mechanism in `ai_gui_assessment/renderer/engine.py` `hw = max(min(hw, tooltip_avail), child_min_w)`"
  notes: "Missed twice in the SOL tooltip rebuild - first as a bare `text_multi`, then again after rebuilding it on TooltipListBase, because the cap only applies once `max_width` is set. Rule also in the GUI guide section 2 (2026-10-13)."

- id: gui_text_localizes_raw_text_is_literal
  pattern: null
  bad: "Putting a localization key in `raw_text`, or an expression/`#format#` markup string in `text`"
  correction: "`text` resolves a localization key (and also evaluates an embedded `[expression]`); `raw_text` is printed verbatim. Labels use `text`; expressions, inline `@icon!` texticons and `#colour ... #!` markup go in `raw_text`."
  category: gui
  scope: any
  source: "reference_game_files/game/main_menu/gui/shared/goods_details.gui:61-64 vs 159 (`raw_text = \"[Goods.GetNumSources]\"` beside `text = \"[Goods.GetDemandsInfo]\"`)"
  notes: "Symptom is a raw key printed in the UI (e.g. `SOL_GUI_ROW_STRATUM_INCOME`), which reads as a styling bug rather than a property bug. Rule also in the GUI guide section 4 (2026-10-13)."

- id: gui_blockoverride_cannot_parameterize_siblings
  pattern: null
  bad: "Declaring one block in a type and instantiating the type five times, expecting five different values - e.g. five table cells each with its own `blockoverride \"cell_value\"`"
  correction: "A `blockoverride` replaces a block *entirely*, and an instance's own override beats one inherited from outside, so sibling instances of the same type each keep their own default. Expose ONE container block per row (`block \"sol_cells\" {}`) and let the caller fill it with its own child instances, each carrying its own override."
  category: gui
  scope: any
  source: "reference_game_files/game/main_menu/gui/shared/main_menu_cooltip_types.gui:1601 (`type TooltipTableHeader`); confirmed by rendering in `ai_gui_assessment/renderer/`"
  notes: "Design constraint behind the SOL kit's single-container-block-per-row shape. Getting it wrong silently duplicates elements rather than erroring: emitting five cells *alongside* a block that already held five defaults produced ten per row (2026-10-13)."

- id: gui_tooltip_listbase_already_emits_a_table_header
  pattern: null
  bad: "Building a section caption on `TooltipListBase` and adding a body child for the title"
  correction: "`TooltipListBase` already contains a `TooltipTableHeader`, so a caption needs only to override `tableheader_text`/`table_header_background`. Adding a body stacks a second header and makes the band roughly twice as tall as intended (measured ~60px instead of ~33px)."
  category: gui
  scope: any
  source: "reference_game_files/game/main_menu/gui/shared/main_menu_cooltip_types.gui:1560-1578"
  notes: "Found by measuring band height when replacing a TooltipTextBlock (43px) with a caption type: the naive version came out 60px, i.e. taller than what it replaced (2026-10-13)."

- id: gui_pieslice_colour_is_rgb_and_values_are_raw_counts
  pattern: null
  bad: "Referencing a named colour in a `pieslice` colour field, or pre-dividing slice values into percentages"
  correction: "A `pieslice` `color` takes a literal `{ r g b a }` list - a named colour cannot be used there. Slice `value`s may be expressions and are normalised by the engine, so pass raw counts and the same chart works at any scale."
  category: gui
  scope: any
  source: "reference_game_files/game/main_menu/gui/shared/backgrounds.gui:3317 (`bg_circle_piechart`); existing SOL tooltip pieslices; pop colours in `main_menu/common/named_colors/02_map.txt`"
  notes: "Consequence: pop colours must be transcribed as RGB literals (pop_nobles 224/59/80 -> 0.328 0.454 0.800, etc.). Slice drawing verified in the project renderer by pixel ratio on a 30/70 test (2026-10-13)."

- id: gui_generated_block_shape_change_requires_rebuild_not_line_patch
  pattern: null
  bad: "Having a compatibility generator patch an earlier generator's output by inserting a line before a marker and compensating for a spacer count"
  correction: "When the block's shape can change, rebuild the whole block from a shared renderer. Line insertion encodes the old layout (cell markup, row width, how many trailing spacers exist) and breaks the moment the shape changes - silently, if the compensating arithmetic still balances."
  category: gui
  scope: any
  source: "scripts/sol_goods_ui.py (`render_goods_vbox`/`replace_goods_vbox`), consumed by scripts/gen_sol_ls_gui.py, gen_sol_pp_compat.py and gen_sol_jtg_compat.py"
  notes: "Triggered by regrouping the SOL goods grid by demand group: PP's old `Expected one weaponry widget ... found 0` failed loudly, but JTG's version also had to drop an alphabetical sort that would have silently undone the group order (2026-10-13)."

- id: gui_flowcontainer_does_not_wrap_by_width
  pattern: null
  bad: "Using `flowcontainer` with a `maximumsize` and expecting children to wrap onto a new line when the width runs out (CSS flex-wrap)"
  correction: "No vanilla `flowcontainer` wraps by available width; the only wrapping seen is a fixed item count (`wrap_count = N`, e.g. agenda_view.gui:638). For width-dependent wrapping, split the content into explicit rows in the generator."
  category: gui
  scope: any
  source: "grep over reference_game_files/game: 56 `flowcontainer` direction uses, wrapping only via `wrap_count` (agenda_view.gui:638, expeditions_lateralview.gui:170/299)"
  notes: "Found while prototyping the SOL goods-group rows (2026-10-13). Not verified in game; treat as source-level evidence."

- id: gui_stacked_bar_is_barchart_not_progressbar_arithmetic
  pattern: null
  bad: "Faking a stacked or offset bar by overlapping several progressbars, or sizing widgets from expressions"
  correction: "Use `barchart` with `barslice` / `barslice_no_highlight` children: slice values are normalised like a pie, `direction = vertical` stacks bottom-up, `righttoleft = yes` reverses, and a transparent slice (`color = { 0 0 0 0 }`) offsets the next. Vanilla uses it inside tooltips (combat_tooltips.gui:2909) and as a horizontal bar (guelphs_and_ghibellines.gui:7)."
  category: gui
  scope: any
  source: "reference_game_files/game/in_game/gui/shared/combat_tooltips.gui:2909; in_game/gui/panels/situation/guelphs_and_ghibellines.gui:7; in_game/gui/outliner_entries.gui:6533; loading_screen/gui/shared/defaults.gui:140 (`type barslice`)"
  notes: "A transparent leading slice as an offset has no vanilla precedent - verify in game before relying on it. The project renderer draws barchart/progressbar since 2026-10-13 (run.py proto)."

- id: gui_bare_widget_never_sizes_to_its_children
  pattern: null
  bad: "Wrapping content in a bare `widget = { background = {...} hbox = { ... } }` and expecting the widget to take its children's size, or trying to rescue it with `minimumsize` on the widget itself"
  correction: "A widget-like element takes its hint from a declared `size`, or only from children that carry `set_parent_size_to_minimum = yes` (a child's `resizeparent = yes` is honoured the same way). A bare `widget` with neither measures 0, and `minimumsize` on the parent does not rescue it because the parent is measured before that. Either use a `vbox`/`hbox` (which do size to their children) as the framed container, or put `set_parent_size_to_minimum = yes` on the child."
  category: gui
  scope: any
  source: "148 vanilla uses of `set_parent_size_to_minimum` in reference_game_files/game (e.g. alertmanager.gui:269, agenda_view.gui:220, alert_settings.gui:522); project renderer ai_gui_assessment/renderer/engine.py `_measure` widget branch and `_place` (`if c.kind in BOX ... and not size` / `set_parent_size_to_minimum`)"
  notes: "Cost a full prototype round: the SOL tooltip hero rendered as `widget 400x0` with all its content scrolled over the section below, and probes isolated it (a sized child measures; the same child inside a bare widget measures 0). Same rule applies to art placed as a bare `background` on a childless element - emit it as a sized child widget instead (2026-10-13)."

- id: gui_progressbar_using_is_a_type_not_a_texture
  pattern: null
  bad: "Writing `progressbar = { size = { W H } using = bar_gold min = 0 max = ... value = ... }` on the assumption that `using` names a texture"
  correction: "`using = X` inlines the properties of a `type X`; it is not a texture reference. If no `X` exists the progressbar resolves no texture and draws nothing at all - silently, while still occupying its layout slot and reporting a normal size. A progressbar needs an explicit `progresstexture` (and optionally `noprogresstexture`), plus `texture_density` / `spriteType` / `spriteborder` on the element."
  category: gui
  scope: any
  source: "Vanilla `type progressbar` in loading_screen/gui/shared/defaults.gui:225 (its own `using = tooltip_se` is a sound/behaviour type); main_menu/gui/shared/progressbars.gui:285 `template progress_bar_goldish_blue` names `progresstexture`/`noprogresstexture` directly; no `bar_*` type exists anywhere in reference_game_files"
  notes: "Every bar in the SOL prototype tooltips measured correctly and drew nothing (2026-10-13). The failure is invisible to both the renderer's measure pass and a size check - only the pixels reveal it."

- id: gui_expression_properties_need_brackets
  pattern: null
  bad: "Passing an expression to a numeric property without brackets, e.g. `layoutstretchfactor_horizontal = \"FixedPointToInt(Multiply_float(x, 1000))\"`"
  correction: "Expression-valued properties must be wrapped as `\"[...]\"`. Unbracketed, the string does not evaluate: it resolves to the default (0 for stretch factors), which the engine then treats as a real value, so two such children split the space evenly instead of proportionally."
  category: gui
  scope: any
  source: "Existing expression rules in docs/guides/EU5_GUI_Modding_Guide.md §4; reproduced in the project renderer (Evaluator.resolve vs. literal) with `run.py proto` - an unbracketed pair of stretch factors landed at 36/36 in a 72px hbox instead of 17/983"
  notes: "Adjacent trap: the project renderer's evaluator functions are BINARY - `Max_float(a, b, c)` raises `TypeError`, so multi-argument folds must be nested pairwise (2026-10-13)."

- id: gui_tooltip_text_template_requires_context
  pattern: null
  bad: "Using tooltip_text_block_template for ordinary situation-panel body text"
  correction: "Use text_multi with autoresize=yes, layoutpolicy_horizontal=expanding and explicit max_width in ordinary panels. Keep tooltip_text_block_template for contextual tooltips only: its inherited fonttintcolor reads ExtraTooltipInfo.GetTintColor."
  category: gui
  scope: any
  source: "User runtime log 23:09:26 and 23:10:03; main_menu_cooltip_types.gui:336; council_of_trent.gui:219"
  notes: "Renderer now resolves inherited fonttintcolor bindings; situation mocks no longer supply ExtraTooltipInfo. Regression reproduces old failure and verifies all four generated panels in both languages. New in-game confirmation pending."

- id: gui_fractional_stretch_weights_collapse
  pattern: null
  bad: "Passing 0..1 float shares as layoutstretchfactor_horizontal; preview moves but runtime markers coincide"
  correction: "Use scaled int32 weights via FixedPointToInt(Multiply_CFixedPoint(share, 10000)); hide zero-weight spacers. Give each marker its own complete track."
  category: gui
  scope: any
  source: "2026-10-14 user runtime screenshot; reference_official_defines/docs/data_types_uncategorized.txt:129321 (GetInertiaCapWeight returns int32); societal_values_lateralview.gui:311"
  notes: "Renderer now rejects float stretch bindings. Regression checks 0%, 1%, 25%, 90%, 100%. Fix requires new in-game confirmation."
- id: gui_fixed_card_header_needs_explicit_width
  pattern: null
  bad: "A fixed card label inside a size {-1 17} non-expanding header elides to dots in game; expanding cards stretch incomplete rows"
  correction: "Budget explicit positive widths for header, label and count; use fixed cards and tightly sized icon rows. Check descendant bounds and label visibility."
  category: gui
  scope: any
  source: "2026-10-14 user runtime screenshot; SOL_living_standard_kit.gui sol_group_row; EU5_GUI_Modding_Guide.md layout policies"
  notes: "Renderer preview did not reproduce the engine's negative-width header collapse; explicit geometry is checked by regression."

- id: eu5_14_country_modifier_name_field
  pattern: 'add_country_modifier\s*=\s*\{\s*name\s*='
  bad: "Using name= to identify an add_country_modifier object in EU5 1.4"
  correction: "Use modifier= as in the current vanilla source. The older effects.log example still says name= and is not authoritative when current runtime logs reject it."
  category: modifier
  scope: country
  source: "reference_game_files/game/in_game/common/scripted_effects/country_effects.txt:846; user error.5.log:2575-2630 (2026-10-14 session)"
  notes: "SOL's 56 name= substitutions failed parsing, followed by empty-object/PostValidate errors. New-game confirmation of the corrected modifier's demand effect remains required."

- id: local_variables_are_not_market_storage
  pattern: null
  bad: "Treating local_var as independent per-market storage, or validating that assumption with a Scope.local dictionary in an offline fixture"
  correction: "Local variables are event-context links visible across scope switches. Use market-keyed global_variable_map for per-market isolation; use local_var only for one calculation's scratch and explicitly remove it. Correct offline fixtures to share one local context across scope switches."
  category: scope
  scope: any
  source: "reference_official_defines/docs/event_targets.log:822-830; reference_game_files/game/in_game/common/scripted_effects/location_effects.txt:145-168; effects.log:531-537"
  notes: "Vanilla transfer_pop sets pops_to_add inside target scope and reads it after returning to root. Market scope also cannot hold persistent set_variable values. SOL market population and spending caches use maps, including a typed country owner map to prevent shared-market cross-country reuse."

- id: country_substitution_repeated_monthly_replace
  pattern: null
  bad: "Repeating market/pop basket expansion for every location and replacing unchanged country goods modifiers every month"
  correction: "Aggregate owned population by market/pop type, evaluate each basket once, and cache seven country-adjusted market spending totals. Apply permanent goods modifiers only on real size changes or missing modifiers; subtract the actually applied size when reading external offsets and retain an observed-total snapshot for clean-month checks. Keep the separate monthly location modifier lifetime policy."
  category: scope
  scope: country
  source: "reference_official_defines/docs/effects.log:2824-2828; country_effects.txt:846-850; docs/technical/SOL_Monthly_Performance_Optimization_20261015.md"
  notes: "Offline 180-location/3-market fixture cuts refresh variable operations from 571285 to 12023. This is not measured EU5 wall time; intermediate fixed-point rounding and engine cache invalidation require in-game acceptance."

- id: gui_quoted_string_newline_escape
  pattern: '(?:tooltip|raw_text|text(?:context)?)\s*=\s*"[^"\r\n]*?(?<!\\)\\[nt]'
  only_in_paths: ["/gui/"]
  bad: "Emitting literal backslash-n or backslash-t into a quoted GUI string"
  correction: "GUI lexing allows only escaped quotes/backslashes. Insert [Localize('NEWLINE_BREAK')] for tooltip line breaks; newline escapes belong in localization YAML. Do not double the slash merely to suppress the lexer error."
  category: gui
  scope: any
  source: "2026-10-15 user lexer.cpp:805 log; reference_game_files/game/in_game/gui/shared/character_tooltips.gui:1571; main_menu/localization/english/economy_l_english.yml:38"
  notes: "SOL goods-cell generator emitted invalid escapes on every hover. The shared generator now uses vanilla NEWLINE_BREAK and renderer pdx tokenizer rejects invalid escapes; bilingual location/country hover regression checks real line breaks."

- id: requested_modifier_size_is_not_live_strength
  pattern: null
  bad: "Subtracting a cached requested modifier size from a live aggregate getter and interpreting any difference as an external modifier change"
  correction: "When the named modifier exists, read country_modifier_strength(<modifier key>) and subtract that actual strength. Keep the last requested size for change-only writes and a separate live-strength snapshot for own drift detection/repair. Account internal spending with the actual applied strength."
  category: scope
  scope: country
  source: "reference_official_defines/docs/triggers.log:3517-3523; scripts/test_sol_substitution_performance.py"
  notes: "Controlled offline tests cover corrupt request caches, actual own drift, real 0.00001 external changes and stale diagnostic payload. They do not prove engine precision/refresh timing or establish the cause of the user's tenfold performance regression. Ordinary clean guards do not add strength getter calls."

- id: local_effect_min_is_not_value_floor
  pattern: 'change_local_variable\s*=\s*\{[^{}]*\bmin\s*=\s*0(?:\s|\})'
  bad: "Using change_local_variable min=0 as a nonnegative lower-bound clamp"
  correction: "Use set_local_variable with value={ value=... min=0 } to express the lower bound. Do not copy value-block clamp semantics into the change-local effect or its offline interpreter."
  category: scope
  scope: any
  source: "2026-10-15 HUN debug saves 1337.5.15/6.15/7.15: 4311 reason6 samples; country_effects.txt:1660-1665; docs/technical/SOL_Three_Save_Performance_Fix_20261015.md"
  notes: "Every recorded sample has new_total=actual_own, hence external baseline must be1, but the old local-effect min produced0. The offline fixture incorrectly modeled this as max(value,0), concealing mass monthly AI re-solving. Only this local-effect behavior is established by saves; do not reverse persistent-variable or script-value clamp rules globally."
