  correction: "Run effects from the console as `effect c:TAG = { ... }`. Record numbers in the CMF Action Log instead: cache the values as location variables, save the location as scope:cmf_log_loc, and call cmf_log_with_location_values = { action = <loc flag> arg1 = <label flag> value = scope:cmf_log_loc.var:a value2 = ... value3 = ... }. The pane shows two decimals, so pre-scale small values. Market goods totals are readable as `value = \"market.goods_demand_in_market(goods:wheat)\"` from a location."
