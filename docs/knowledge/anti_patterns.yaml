# EU5 Known Anti-Patterns
# ========================
# Machine-readable knowledge store. Feed into:
#   - scripts/validate.py  (static pre-flight checks)
#   - scripts/gen_brief.py (generates docs/knowledge/BRIEF.md)
#
# Fields:
#   id        : unique slug (no spaces)
#   pattern   : Python regex to detect the bad form in source files
#   bad       : human-readable description of the bad form
#   correction: what to do instead
#   category  : modifier | enum | encoding | gui | scope | event | localization | trigger
#   scope     : country | location | character | global | any
#   source    : reference file that verifies the correction (path:line if known)
#   notes     : one-line explanation of why the bad form fails
#
# To add a new entry: append a YAML dict with all fields, then run:
#   $env:PYTHONUTF8='1'; & $env:EU5_PYTHON scripts/gen_brief.py

- id: gui_price_tier_selection_from_rounded_ratio
  pattern: null
  bad: "Highlighting a price preference tier from the displayed/rounded ratio, or putting market-dependent selection in the generic goods legend"
  correction: "Use a market-only price legend and select exactly one tier by comparing actual price to base price multiplied by each strict/inclusive threshold. Draw a one-unit gold outline and faint fill as a sized, conditional ignore-layout child before the text; keep generic/card legends static and hide selection for zero base prices, invalid markets and ungrouped goods."
  category: gui
  scope: any
  source: "reference_game_files/game/main_menu/gui/shared/window_components.gui:26; reference_game_files/game/main_menu/gui/shared/building_tooltips.gui:859; reference_game_files/game/in_game/gui/shared/production_method_details.gui:160; scripts/sol_substitution.py:29-36; scripts/test_sol_substitution_ui.py:test_current_price_tier_highlight_boundaries_and_pixels"
  notes: "Vanilla source and offline expression/pixel checks, 2026-10-15. Market ratios are display values, not the adopted country multiplier; current-tier selection matches the runtime price comparisons without dividing first. New in-game confirmation pending."

- id: gui_goods_tooltip_market_extension
  pattern: null
  bad: "Treating SOL basket-cell hover text as the actual goods tooltip redesign, or reading a Market in the shared goods_details template"
  correction: "Goods_tooltip, Goods_Cards_tooltip and SpecificGoodsMarket_tooltip all inline goods_details. Put static group membership and price preferences there; expose a slot whose market-specific override is supplied only at SpecificGoodsMarket_tooltip, where Market.GetMarketEntry(Goods.Self) already supplies the market entry. Preserve the full vanilla file when overriding its path."
  category: gui
  scope: any
  source: "reference_game_files/game/main_menu/gui/shared/goods_details.gui:28; reference_game_files/game/in_game/gui/shared/production_tooltips.gui:458,495; reference_game_files/game/in_game/gui/shared/market_tooltips.gui:1515-1523; reference_official_defines/docs/data_types_uncategorized.txt:76572,98436"
  notes: "Source evidence, 2026-10-15. Sheet C rows include the current good and every member of every matching group. Seven static preferences follow strict runtime thresholds; only a market tooltip adds the live price/base-price ratio, with a protected denominator. Bilingual previews do not establish in-game hover behavior."

- id: substitution_performance_requires_actual_cadence
  pattern: null
  bad: "Attributing default monthly AI cost to the entire substitution aggregate, or assuming solver/substitution toggles skip every newly added runtime cost"
  correction: "Trace monthly and yearly callers separately. Clean reduced-frequency AI only checks snapshots and applies modifiers; dirty AI enters the full solve. Country substitution refresh precedes size/solver gates, and substitution-off still computes per-good external spending. Count actual dirty solves and successful modifier writes before claiming engine-time attribution."
  category: scope
  scope: country
  source: "src/stable/in_game/common/on_action/SOL_economy_on_actions.txt:32; src/stable/in_game/common/scripted_effects/A_SOL_economy_effects.txt:5039,5438; docs/technical/SOL_Monthly_Performance_Audit_20261014.md"
  notes: "Source and offline operation-count audit, 2026-10-14. A 7-to-215 map-read increase is confined to location recomputation, not every clean AI month. Existing logs are not an effect-time profiler."

- id: gui_dim_copy_over_opaque_icon
  pattern: null
  bad: "Drawing a translucent goods icon over an always-visible opaque copy to indicate unavailable supply"
  correction: "Make the full and dim copies mutually exclusive with visible bindings. Verify rendered pixels as well as the alpha property."
  category: gui
  scope: any
  source: "scripts/sol_goods_ui.py:_good_cell; scripts/test_sol_substitution_ui.py:test_supply_dimming_and_substitution_markers"
  notes: "Source and renderer pixel evidence, 2026-10-13: alpha 0.3 over the opaque original leaves it bright."

- id: gui_substitution_primary_group_hides_memberships
  pattern: null
  bad: "Using a unique good's primary group to populate labelled substitution-group rows"
  correction: "Show every membership from goods_weights.csv in labelled rows; reserve primary-group ordering for unique lists. Keep spending deduplicated."
  category: gui
  scope: any
  source: "data/goods_weights.csv; scripts/sol_goods_order.py:group_rows; scripts/test_sol_substitution_ui.py:test_all_memberships_and_compat_extras"
  notes: "Data-backed check, 2026-10-13: 56 unique goods have 67 memberships."

- id: gui_missing_market_weight_is_not_neutral
  pattern: null
  bad: "Displaying a missing market price-weight entry as the neutral weight 1.00"
  correction: "Check Scope.IsSet and select pending-data localization when the entry is absent. Do not imply a missing cache is neutral."
  category: gui
  scope: location
  source: "reference_official_defines/docs/data_types_script.txt:34,3427; reference_game_files/game/main_menu/gui/shared/goods_details.gui:135"
  notes: "Official API/source evidence and offline hover checks, 2026-10-13; engine hover remains unverified."

- id: gui_override_requires_an_existing_slot
  pattern: null
  bad: "Putting blockoverride sol_good_tooltip on a bare widget when no inherited block has that name"
  correction: "Print the resolved type and verify the slot. For a widget tooltip, assign tooltip directly; use blockoverride only for an existing inherited block."
  category: gui
  scope: any
  source: "loading_screen/gui/shared/defaults.gui:294 (widget inherits tooltip_se); scripts/sol_goods_ui.py; guidef.py widget/sol_group_row"
  notes: "Source-level finding on 2026-10-13. No sol_good_tooltip block existed in the shared kit; layout previews did not exercise hover behavior. Contextual tips now read the location owner or panel country and the location market, while generic goods tips retain only membership."

- id: commodity_offset_must_exclude_own_modifier
  pattern: null
  bad: "Reading global commodity demand while the previous SOL substitution modifier is still included, or writing M-1 despite an external additive offset"
  correction: "Remove the own named country modifier, read modifier:global_<good>_pop_demand, and write (1+e)(M-1). Apply the same nonnegative effective factor once in internal spending. Read live modifier values rather than copying age definitions."
  category: modifier
  scope: country
  source: "reference_official_defines/docs/effects.log:105; reference_game_files/game/in_game/common/scripted_effects/country_effects.txt:2376; SOL_Substitute_Groups_Global_Modifier_Implementation.md section 4.3"
  notes: "Modifier read syntax is source-verified. Same-type addition and cross-type multiplication were measured on 2026-10-10; removal-to-read timing, engine refresh and fixed-point stability of this generated implementation still require in-game acceptance."

- id: gui_format_tag_requires_separator_before_punctuation
  pattern: '#(?:R-|E/)'
  bad: "Writing #R-[expression] or #E/[expression] without separating the formatting tag from punctuation"
  correction: "Separate the tag and its body with whitespace: #R -[expense|2]#! and #E /[target|0]#!. Use plain numeric formatting inside an explicitly coloured span."
  category: gui
  scope: any
  source: "reference_game_files/game/in_game/gui/cooltip.gui:3479; docs/error_log/error.log (2026-10-13 17:03:35)"
  notes: "Runtime tags included r- or e/ followed by internal numeric colour markers. The renderer previously accepted these malformed tags; Engine.process now reports the missing separator."

- id: gui_numeric_property_cannot_use_text_formatting
  pattern: '(?:value|min|max)\s*=\s*"\[[^\]\r\n]*\|[+0-9%=][^\]\r\n]*\]"'
  bad: "Passing a formatted text expression such as ScriptValue(...)|+0 to a pieslice value or other numeric GUI property"
  correction: "Use a numeric binding, e.g. FixedPointToFloat(Scope.ScriptValue(...)), for slice value. Keep |+0 or percent formatting in text/raw_text only."
  category: gui
  scope: any
  source: "reference_game_files/game/in_game/gui/location_window.gui:1455; docs/error_log/error.log (2026-10-13 16:53)"
  notes: "The engine reports Unexpected characters at end of Statement for all five location and five country slices. The renderer now rejects the suffix in data bindings while retaining formatted text and quoted pipe literals."

- id: metadata_requires_empty_relationships_array
  pattern: null
  bad: "Omitting relationships from metadata because a standalone target has no dependencies"
  correction: "Declare relationships as an empty JSON array for independent mods; keep actual dependencies in the array for dependent targets."
  category: framework
  scope: any
  source: "reference_mods/3605677866/.metadata/metadata.json:12; docs/error_log/error.log (Expected member relationships)"
  notes: "Runtime metadata reader requires the member even when it is empty. Updating workspace metadata does not repair a separate old installed copy."

- id: localization_generated_caption_has_one_owner
  pattern: null
  bad: "Keeping a GUI caption in handwritten economy localization after adding the same key to generated UI localization"
  correction: "Give each key one definition per language and target. Remove old caption definitions when generated UI vocabulary owns them; preserve UTF-8 BOM. Check the complete target, not one file."
  category: localization
  scope: any
  source: "docs/error_log/error.log (duplicate SOL_GUI_SECTION_POP / SOL_GUI_SECTION_CONSUMPTION); scripts/gen_sol_ls_gui.py UI_STRINGS"
  notes: "Both English and Chinese were duplicated although only the active Chinese language was reported. Stable and standalone need independent checks."

- id: resolution_message_database_uses_fixed_path
  pattern: null
  bad: "Registering a resolution message type in an arbitrary main_menu/gui/SOL_economy_messages.txt file"
  correction: "Generate main_menu/gui/messagetypes.txt from the current vanilla database plus SOL's additional types. Preserve every vanilla definition and combine files explicitly when another mod owns the same path."
  category: gui
  scope: any
  source: "reference_official_defines/types/resolutions.txt:140; reference_game_files/game/main_menu/gui/messagetypes.txt:3338; installed eu5.exe message-handler path gui/messagetypes.txt"
  notes: "Runtime lookup failed although the arbitrary file existed. show_message=no does not avoid registration-time lookup. Fixed-path correction still needs a fresh game run; messagetypes_custom.txt is not established as a Mod registration API."

- id: gui_fixedpoint_conversion_requires_fixedpoint_arithmetic
  pattern: 'FixedPointToInt\(\s*(?:Add|Subtract|Multiply|Divide|Min|Max)_float\('
  bad: "Passing the result of float arithmetic to FixedPointToInt"
  correction: "Keep frame arithmetic in CFixedPoint: ScriptValue -> *_CFixedPoint with typed constants -> FixedPointToInt -> Add_int32. Python coercion is not evidence of engine validity."
  category: gui
  scope: any
  source: "reference_official_defines/docs/data_types_script.txt:3727; docs/data_types_common.txt:468/928/940; docs/error_log/error.log (2026-10-13)"
  notes: "Runtime FetchData failures froze all six SOL dials at their first frame. The renderer now reports this type error."

- id: gui_numeric_constant_is_not_a_binding
  pattern: '(?:min|max)\s*=\s*"\[\s*[-+]?\d+(?:\.\d+)?\s*\]"'
  bad: "Writing max = [1] as a data binding"
  correction: "Use a numeric property literal such as max = 1. Constants inside function arguments use explicit typed literals."
  category: gui
  scope: any
  source: "reference_game_files/game/in_game/gui/war_lateralview.gui:347-349; docs/error_log/error.log (No function for call '')"
  notes: "The renderer previously accepted the invalid numeric binding; it now reports INVALID BINDING."

- id: gui_progressbar_needs_an_empty_texture
  pattern: null
  bad: "Providing only progresstexture and expecting a parent background to supply the empty region"
  correction: "Set noprogresstexture explicitly. The progressbar shader samples Texture0 for the filled region and Texture1 for the empty region. A separate background does not bind Texture1."
  category: gui
  scope: any
  source: "reference_game_files/game/main_menu/gui/shared/progressbars.gui:165-170; installed game clausewitz/loading_screen/gfx/FX/pdxgui_progressbar.shader"
  notes: "The supplied screenshot showed solid lime bars while the renderer drew red/gold textures. Exact missing-sampler colour is engine-dependent. Evidence: screenshot symptom and source for the correction (2026-10-13)."

- id: gui_weight_is_not_a_percentage
  pattern: null
  bad: "Formatting raw SOL tax/power weights as percentages or deriving irregular names by plural concatenation"
  correction: "Map existing names explicitly and divide effective estate weights by local_total_tax_share before percent formatting. Nobles/commoners use effective weights after the transfer."
  category: gui
  scope: location
  source: "src/stable/in_game/common/script_values/SOL_pop_values.txt:2-71; docs/error_log/error.log (missing local_commoners_tax_share)"
  notes: "Screenshot displayed thousands of percent; weights are amounts, not fractions. The commoner key is singular. Mocks now carry raw weights and report missing script values (2026-10-13)."

- id: gui_diagnostics_must_not_depend_on_optional_solver_caches
  pattern: null
  bad: "Reading estate diagnostics from solver-preparation caches"
  correction: "Accumulate five estate funds/baselines in gls_accumulate_panel_stats alongside panel totals and expose gls_sol_*_display."
  category: gui
  scope: country
  source: "scripts/sol_economy_effects_source.py emit_section_50_panel_stats_stable / emit_section_50_panel_stats_standalone"
  notes: "Raw-only paths skip preparation for small countries and disabled solvers, leaving absent or stale caches. Reuse the panel traversal. Zero-baseline estates display No consumption, not -100%. Source evidence (2026-10-13)."

- id: gui_fixed_group_row_overflows_with_compat_goods
  pattern: null
  bad: "Putting an arbitrarily large compatibility goods group inside one fixed-width hbox"
  correction: "Budget labels, icons and every gap against the row width, then split members into explicit continuation rows in the shared generator. Check descendant positions, not only the parent's measured size. SOL's 216px row uses an 80px label, 20px icons and 2px gaps; six icons fit."
  category: gui
  scope: any
  source: "src/stable/in_game/gui/SOL_living_standard_kit.gui:299; scripts/sol_goods_ui.py render_group_columns; tmp/check_sol_ui_runtime.py"
  notes: "Static renderer check (2026-10-13): JTG's 26 ungrouped goods escaped the tooltip despite a nominal 216px row. Explicit chunks preserve all goods and grouping; no new in-game measurement."

- id: gui_standalone_target_missing_shared_types
  pattern: null
  bad: "Generating standalone GUI instances while keeping their shared type definitions only in stable"
  correction: "Include the shared kit in the standalone generator outputs and --check contract. Test target dependencies using the game and selected target only. A renderer loaded with stable can hide missing standalone types."
  category: gui
  scope: any
  source: "build.bat deploy_target; scripts/gen_sol_ls_gui.py _outputs; src/sol_standalone/.metadata/metadata.json"
  notes: "Source evidence (2026-10-13): build.bat mirrors each target's own directory, and standalone does not depend on stable. The generated standalone kit must match the stable source."

- id: gui_prototype_mock_default_masks_missing_data
  pattern: null
  bad: "A catch-all prototype mock returning zero before the scenario's supplied script values"
  correction: "Register only explicitly provided script-value/map keys before scenario mocks. Unspecified keys fall through to the scenario, and missing script values remain Unknown."
  category: gui
  scope: any
  source: "ai_gui_assessment/renderer/run.py _proto_mocks; ai_gui_assessment/renderer/data.py Evaluator.lookup"
  notes: "Tool regression (2026-10-13): explicit overrides, scenario fallback and missing-key reporting are checked separately. A zero unknown-expression count must not come from zero defaults."

- id: sol_country_goods_modifier_accounting_parity
  pattern: null
  bad: "Writing size = M - 1 for a per-good country demand modifier when the same good already has other global_<good>_pop_demand sources, or changing SOL accounting for a good without changing its engine demand"
  correction: "Sources of the same modifier type add inside one factor (1 + sum); different types (per-good, global_pop_demand, local_pop_demand, vanilla percent rows) multiply. For target relative factor M against external same-good offset e, write size = (1+e)*(M-1). A factor below zero clamps demand to 0. Freeze unsupported goods at M=1 in both transfers and accounting."
  category: modifier
  scope: country
  source: "In-game test 2026-10 (tmp/demand modifier test/6-13.png); reference_game_files/game/main_menu/common/modifier_type_definitions/00_modifier_types.txt:12773; docs/technical/EU5_Modding_Knowledge_Base.md 6.5.1"
  notes: "Measured on HUN nobles: legumes +0.5/+0.5 -> x2.0; sugar +0.25/-0.75 -> x0.5; fish -1.5 -> removed; wheat per-good 0.5, global 0.5, local 1.0 -> x4.5. Per-good M therefore multiplies cleanly with SOL local_pop_demand. Age 1 goods_demand offsets did not appear in the breakdown in this test; read e from the actual breakdown rather than age files."

- id: sol_v11_overlap_uses_average
  pattern: null
  bad: "Restoring v1.1 substitute groups as a direct sum of group demands or calling normalized weights a conserved quantity or expenditure budget"
  correction: "Read the final demand blocks at commit 9670e141: all 11 overlapping goods add two group multipliers and divide by 2 before the engine applies the per-pop-type goods baseline. Preserve this distinction from any new budget-conserving design."
  category: modifier
  scope: pop
  source: "9670e141:src/stable/in_game/common/script_values/SOL_goods_demand_values.txt:679; 9670e141:src/stable/in_game/common/goods_demand/z_SOL_pop_demand.txt:10; docs/technical/SOL_Substitute_Groups_Global_Modifier_Audit.md"
  notes: "v1.1 has 20 groups, 67 memberships and 56 goods including optional victuals. The current 56-good core replaces victuals with camels. Legacy UI grouping comments and formula headers omit parts of the final runtime calculation."

- id: location_auto_modifier_nonfunctional
  pattern: 'category\s*=\s*location'
  only_in_paths: ['auto_modifiers']
  bad: "auto_modifier with category = location (inside auto_modifiers/ file)"
  correction: "Use main_menu/common/static_modifiers/: define new objects with game_data.category = location, or use a minimal TRY_INJECT delta when modifying an existing object"
  category: modifier
  scope: location
  source: "src/stable/main_menu/common/static_modifiers/A_SOL_war_modifiers.txt:4-8; reference_mods/3613232232/main_menu/common/static_modifiers/pp_location_modifier_adjustments.txt:439"
  notes: "Location auto_modifiers are NON-FUNCTIONAL in EU5; bake effects into static_modifier values instead"

- id: sol_demand_add_baseline_must_remain
  pattern: null
  bad: "Deleting or bypassing the calibrated SOL demand_add baseline when moving runtime demand to local_pop_demand"
  correction: "Keep data/target_demand.csv -> src/stable/in_game/common/goods/z_SOL_pop_goods.txt as the corrected demand_add baseline; apply local_pop_demand only as the monthly location-level multiplier."
  category: modifier
  scope: location
  source: "src/stable/in_game/common/goods/z_SOL_pop_goods.txt; reference_game_files/game/main_menu/common/modifier_type_definitions/00_modifier_types.txt:11864"
  notes: "The SOL multiplier is calibrated against corrected demand_add values. Removing that baseline changes absolute pop demand before the multiplier is applied."

- id: country_pulse_manual_on_action_merge_unnecessary
  pattern: null
  bad: "Copying vanilla or framework entries into monthly_country_pulse/yearly_country_pulse just to preserve existing on_actions"
  correction: "Use the compact yearly_country_pulse style for both monthly_country_pulse and yearly_country_pulse: define only this mod's on_actions entries. The engine merges on_actions from duplicate pulse definitions automatically."
  category: scope
  scope: country
  source: "user-reported engine behavior (2026-06-08); src/stable/in_game/common/on_action/SOL_economy_on_actions.txt:5-12"
  notes: "Manual payload copies are noisy and drift-prone. Keep events/random_events only when this mod itself adds them; do not duplicate vanilla or CMF on_action dispatchers."

- id: cost_modifier_renamed_to_efficiency_1_3
  pattern: '\b(?:global_build_buildings_cost|local_build_buildings_cost|local_build_new_buildings_cost|local_trade_embark_disembark_cost_modifier|stability_cost)\s*='
  only_in_paths: ['src/stable']
  bad: "EU5 <=1.2 cost modifier name for construction, trade embark/disembark, or stability investment"
  correction: "Use the EU5 1.3 efficiency modifier name: global_build_buildings_efficiency, local_build_buildings_efficiency, local_build_new_buildings_efficiency, local_trade_embark_disembark_efficiency, or stability_cost_efficiency. Flip the sign when preserving old cost penalties/discounts."
  category: modifier
  scope: any
  source: "reference_game_files/game/main_menu/common/modifier_type_definitions/00_modifier_types.txt:4103,4167,4175,6838,10255"
  notes: "EU5 1.3 renamed these cost-style modifiers to positive-good efficiency modifiers. Positive efficiency reduces cost, so old positive cost penalties become negative efficiency and old negative cost discounts become positive efficiency."

