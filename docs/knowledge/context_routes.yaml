# SOL-specific additions; the context loader merges shared routes and cards.
mod_roots:
  - src/stable
  - src/sol_standalone
  - src/sol_pp_compatibility_submod
  - src/sol_mnt_compatibility_submod
  - src/sol_jtg_compatibility_submod
domain_routes:
  - id: sol_gui_script_oos
    expand_mod_roots: true
    path_prefixes:
      - in_game/gui/
      - in_game/common/scripted_guis/
      - in_game/common/on_action/
      - in_game/common/situations/
      - scripts/sol_economy_effects_source.py
      - scripts/sol_oos.py
      - scripts/sol_oos_trace_source.py
      - scripts/test_sol_economy_cadence.py
      - scripts/update_mod_version.py
    card: sol_gui_script_oos.md
    summary: confirmed GUI-to-script OOS cause; native startup, migration and load boundaries
    reason: SOL lifecycle or GUI execution path touched
    required_check:
      id: sol_no_gui_script_execution
      message: >-
        User-confirmed runtime cause: GUI execution of scripts causes SOL multiplayer OOS.
        Do not use GetScriptedGui(...).Execute for initialization, migration or economic writes,
        including CMF GUI-backed load hooks. on_game_start is not equivalent to post-lobby/load.
        Read the three-callback responsibility map and native hook limits before editing.
maintenance_routes:
  - id: sol_lifecycle_knowledge
    path_prefixes:
      - docs/knowledge/context_routes.yaml
      - docs/knowledge/risk_cards/sol_gui_script_oos.md
    reads:
      - path: docs/knowledge/risk_cards/sol_gui_script_oos.md
        reason: confirmed SOL runtime cause and native replacement assessment
