 soap_events.1.title: "The Roses of Kran"
 soap_events.1.desc: "A new and highly prized variety of rose has taken root in the fertile valley of [kran.GetName]. Introduced through [target_nation.GetAdjective] trade routes, its blossoms yield a fragrant oil coveted by perfumers and merchants alike. Local growers report excellent harvests, and enterprising officials suggest encouraging its cultivation across the region. While the venture would require investment and labor, the promise of future profits is difficult to ignore."
 soap_events.1.entry: "The Roses of Kran"
 soap_events.1.historical_info: "The cultivation of oil-bearing roses in central Bulgaria expanded during Ottoman rule, particularly in the region around Kran and Kazanlak. The damask rose, likely introduced through Ottoman trade networks from the eastern Mediterranean and the Middle East, thrived in the sheltered valley between the Balkan and Sredna Gora mountains. By the seventeenth and eighteenth centuries, rose oil production had become one of the region's most valuable industries. The area would later become known as Bulgaria's Rose Valley, supplying rose oil to markets across Europe and the Near East."
 soap_events.1.a: "Let the roses bloom throughout the valley."
 soap_events.1.b: "We have more pressing concerns."
 STATIC_MODIFIER_NAME_soap_rose_valley: "Rose Valley"
 STATIC_MODIFIER_DESC_soap_rose_valley: "The fertile valley of Kran has become a center for the cultivation of oil-bearing roses, producing a fragrant oil that is highly prized by perfumers and merchants alike."

 soap_events.2.title: "John Gerarde"
 soap_events.2.desc: "The [target_nation.GetAdjective] botanist and gardener [john_gerarde.GetName] has published a comprehensive catalogue of plants and their properties. His work gathers knowledge from physicians, herbalists, and gardeners alike, describing hundreds of species and their uses in medicine, cultivation, and daily life. Copies of his new work have already begun circulating among scholars and landowners, who are eagerly discussing the possibilities of introducing new crops and improving old practices."
 soap_events.2.entry: "John Gerarde"
 soap_events.2.historical_info: "Published in 1597, The Herball, or Generall Historie of Plantes by John Gerarde became one of the most influential botanical works in the English language. Drawing upon earlier continental sources as well as Gerarde's own gardening experience, it described hundreds of plants and their medicinal, culinary, and horticultural uses. The work remained a standard reference for generations of physicians, apothecaries, and gardeners."
 soap_events.2.a: "A valuable addition to every library."
 general_historie_plantes: "The Generall Historie of Plantes"
 general_historie_plantes_desc: "A comprehensive catalogue of plants and their properties, gathering knowledge from physicians, herbalists, and gardeners alike. It describes hundreds of species and their uses in medicine, cultivation, and daily life."

 soap_events.3.title: "Savon de Marseille"
 soap_events.3.desc: "The reputation of [marseille.GetName]'s [soap.GetName] has spread throughout [target_nation.GetName], yet not all producers maintain the standards expected of such a prized commodity. To protect the industry's good name, the Crown has issued new regulations governing the manufacture of soap. Only the finest olive oils may be used, while inferior ingredients are forbidden. Though some artisans grumble at the restrictions, others welcome the opportunity to distinguish their wares from cheap imitations."
 soap_events.3.entry: "Savon de Marseille"
 soap_events.3.historical_info: "In 1688, under the reign of Louis XIV, regulations were issued to govern the production of Marseille soap. Often associated with the mercantilist policies of Jean-Baptiste Colbert and his successors, these rules required manufacturers to use pure olive oil and prohibited the use of lower-quality fats. The regulations helped establish 'Savon de Marseille' as a recognized mark of quality throughout Europe and reinforced Marseille's position as a leading center of soap production. Also called the 'Colbert Decree', Jean-Baptiste had actually already died by the time the regulations were issued."
 soap_events.3.a: "Enforce the new regulations and protect our reputation."

 soap_events.4.title: "The Academy's Prize"
 soap_events.4.desc: "As the supply of Alkali remains a concern for soapmakers throughout [target_nation.GetName], the #italic Royal Academy#! has announced a prize for anyone who can develop a more efficient method of producing this essential ingredient. While [potash.GetName] is plentiful, they seek a more modern, scalable solution. The Academy has announced a prize for any scholar capable of producing alkali from abundant domestic materials. Inventors, chemists, and entrepreneurs now race to claim both the reward and lasting fame."
 soap_events.4.entry: "The Academy's Prize"
 soap_events.4.historical_info: "The French Academy of Sciences in 1775, under the patronage of the ill-fated King Louis XVI, established the Alkali Prize in the hope of finding an inexpensive process for producing sodium carbonate from a far cheaper substance. Nicolas Leblanc, a trained surgeon, refined a radical process for transforming common salt, and was rewarded with a 15 year patent. Sadly, his innovation became a victim of history: whilst a plant was set up to enable the mass production of Leblanc’s method, he was paid no reward and the coming of the French Revolution led to his factory being confiscated by the revolutionary forces."
 soap_events.4.a: "We must find new alkali."
 soap_events.4.b: "Just using potash is enough."

 soap_events.5.title: "Nicolas Leblanc"
 soap_events.5.desc: "After years of experimentation, the surgeon and chemist [nicolas_leblanc.GetName] has unveiled a remarkable process for producing #italic soda ash#! from common salt. What was once dependent upon scarce plant ashes and costly imports may, in the future, be manufactured in unprecedented quantities. Soapmakers, glassworks, and textile workshops stand to benefit greatly from this technological breakthrough."
 soap_events.5.entry: "Nicolas Leblanc"
 soap_events.5.historical_info: "In 1791, Nicolas Leblanc patented a process for manufacturing sodium carbonate from common salt. The invention provided a practical alternative to traditional sources of alkali, which had previously been obtained from plant ashes and other limited natural materials. Although Leblanc himself saw little benefit from his discovery and suffered greatly during the French Revolution, his process became one of the foundational technologies of the modern chemical industry, enabling the large-scale production of soap, glass, paper, and textiles."
 alkali_prize_hunt_tt: "The French Academy has offered a prize."
 soap_events.5.a: "Leblanc's process is promising."
 STATIC_MODIFIER_NAME_soda_ash_manufacturing: "Soda Ash Manufacturing"
 STATIC_MODIFIER_DESC_soda_ash_manufacturing: "Soda Ash is made using the Leblanc process, which transforms common salt into sodium carbonate through a series of chemical reactions."

 soap_events.6.title: "The Perfumers of Grasse"
 soap_events.6.desc: "The town of [grasse.GetName] in [target_nation.GetName] has become renowned for its mastery of fragrances. Drawing upon local harvests of flowers and herbs to make unique [aromatics.GetName], many skilled artisans have established workshops dedicated to the production of [perfume.GetName] and scented oils. Among these entrepreneurs is [jean_galimard.GetName], whose enterprise has found eager customers among the nobility. The growing trade promises both wealth and prestige for the region."
 soap_events.6.entry: "The Perfumers of Grasse"
 soap_events.6.historical_info: "In 1747, Jean de Galimard founded a perfume house in Grasse, a town that would become synonymous with the French fragrance industry. Originally known for its leatherworking and glove-making trades, Grasse developed a thriving perfume sector based on the cultivation of aromatic flowers such as jasmine, rose, lavender, and orange blossom. By the eighteenth century, the town had emerged as one of Europe's foremost centers of perfumery, supplying luxury fragrances to courts across the continent."
 soap_events.6.a: "A scent fit for kings."
 de_galimard: "de Galimard"
 STATIC_MODIFIER_NAME_house_of_galimard: "Galimard Perfumery"
 STATIC_MODIFIER_DESC_house_of_galimard: "The House of Galimard, founded by Jean de Galimard in 1747, is a renowned perfume house based in Grasse, France. Known for its exquisite fragrances crafted from local flowers and aromatic ingredients, the House of Galimard has established itself as a prestigious name in the world of perfumery."

soap_events.7.title: "The Queen's Water"
soap_events.7.desc: "A fragrant [perfume.GetName] of rosemary and spirits has captured the imagination of the [target_nation.GetAdjective] nobility. Praised for its invigorating scent and reputed medicinal properties, the preparation known as #italic Hungary Water#! has spread rapidly through the court of [ruler.GetName]. Whether remedy or luxury, demand for the aromatic tonic continues to grow."
soap_events.7.entry: "The Queen's Water"
soap_events.7.historical_info: "Hungary Water was among Europe's earliest famous alcohol-based perfumes. Its exact origins remain uncertain, though traditions dating from the seventeenth century claim it was first prepared for Queen Elizabeth of Hungary in the late fourteenth century, either by a court alchemist or a reclusive monk. Originally distilled from rosemary and thyme in brandy, it later appeared in many variations incorporating lavender, sage, mint, citrus blossoms, and other aromatics. Renowned as both a perfume and a medicinal preparation, Hungary Water helped popularize the use of alcohol-based fragrances throughout Europe."
soap_events.7.a: "A fragrance worthy of Hungarian royalty."
soap_events.7.b: "Share this perfume with the courts of Europe."
soap_event: "A fortunate opportunity"

soap_events.8.title: "The Worshipful Company of Tallow Chandlers"
soap_events.8.desc: "The growing towns of [target_nation.GetName] require ever greater quantities of candles and soap. To ensure quality and regulate the trade, the [tallow.GetName] chandlers of [london.GetName] have petitioned for official recognition of their craft. By organizing production and establishing standards, they promise a more reliable supply of these essential goods for households, workshops, and churches alike."
soap_events.8.entry: "The Worshipful Company of Tallow Chandlers"
soap_events.8.historical_info: "The Worshipful Company of Tallow Chandlers is one of the ancient livery companies of the City of London. Granted a royal charter in 1462 by Edward IV, the company regulated the production of candles and related goods made from animal fats. Tallow was an essential raw material in pre-industrial society, used not only for illumination but also in the manufacture of soap. Through inspection, apprenticeship, and quality control, the guild helped organize one of the most important urban industries of late medieval England."
soap_events.8.a: "Let us recognize the chandlers."
STATIC_MODIFIER_NAME_tallow_chandlers: "The Worshipful Company of Tallow Chandlers"
STATIC_MODIFIER_DESC_tallow_chandlers: "The Worshipful Company of Tallow Chandlers was granted a royal charter."

soap_events.9.title: "The Felling's Candle Disaster"
soap_events.9.desc: "A terrible explosion has struck the collieries at Felling near [newcastle.GetName]. A pocket of firedamp ignited deep within the mine, unleashing devastation throughout the tunnels and claiming the lives of dozens of miners. The force of the blast shattered galleries, collapsed shafts, and left entire families awaiting news from below. As reports of the catastrophe spread through [target_nation.GetName], many wonder whether safer methods of illumination might be devised for work beneath the earth."
soap_events.9.entry: "The Felling's Candle Disaster"
soap_events.9.historical_info: "On 25 May 1812, an explosion at Felling Colliery near Newcastle killed 92 miners. The disaster was likely caused when a naked flame, commonly a candle, ignited a buildup of methane gas known as firedamp. The scale of the tragedy shocked the people of Britain and inspired renewed efforts to improve mine safety. In the years that followed, inventors including Sir Humphry Davy developed safety lamps designed to prevent the ignition of flammable gases in coal mines."
soap_events.9.a: "Investigate the cause of the disaster."
soap_events.9.b: "Blame the workers for negligence."

soap_events.10.title: "The Davy Lamp"
soap_events.10.desc: "The dangers of firedamp have long haunted the coal mines of [target_nation.GetName]. Following a series of deadly explosions, the chemist [hump_davey.GetName] has devised a new form of safety lamp. By enclosing the flame within a fine wire gauze, the lamp provides illumination while greatly reducing the risk of igniting flammable gases. Mine owners and workers alike have greeted the invention with cautious optimism."
soap_events.10.entry: "The Davy Lamp"
soap_events.10.a: "Our investment paid off."
hunt_for_the_lamp_tt: "The Government has recently invested in safer mine lighting."

soap_events.11.title: "The Nature of Fats"
soap_events.11.desc: "For centuries, [target_nation.GetAdjective] soapmakers and chandlers have relied upon experience and tradition when working with fats and oils. Now, the chemist [michel_chevruel.GetName] has demonstrated that these substances are not simple materials, but compounds composed of distinct fatty acids and glycerin. His discoveries provide a much deeper understanding of soapmaking, candle production, and the chemistry of everyday life."
soap_events.11.entry: "The Nature of Fats"
soap_events.11.historical_info: "Between 1811 and 1823, Michel Eugène Chevreul conducted pioneering research into the composition of fats and oils. He identified several fatty acids, including stearic and oleic acid, and demonstrated that fats consisted of fatty acids combined with glycerin. His work transformed the understanding of soapmaking and candle manufacture, helping establish organic chemistry as a scientific discipline and laying the foundation for modern industrial processing of fats and oils."
soap_events.11.a: "Chevreul's discoveries will revolutionize the industry."
eugene_chevreul: "Eugène Chevreul"

soap_events.12.title: "Stearin Candles"
soap_events.12.desc: "Recent advances in the chemistry of fats based on the research of [michel_chevruel.GetName] have led to the production of new kinds of [candles.GetName]. Made from purified stearin rather than ordinary tallow, these candles burn brighter, produce less smoke, and retain their shape even in warm weather. Though more costly to manufacture, their superior quality has attracted considerable interest among [target_nation.GetAdjective] households and churches."
soap_events.12.entry: "Stearin Candles"
soap_events.12.historical_info: "Building upon the work of the French chemist Michel Eugène Chevreul, candle makers in the 1820s developed stearin candles from purified fatty acids. These candles burned brighter, cleaner, and longer than traditional tallow candles while producing less smoke and odor. The innovation revolutionized candle manufacturing and became one of the most important advances in lighting before the widespread adoption of gas and electric illumination."
soap_events.12.a: "A magnificent improvement."
stearin_candles_invention: "Stearin Candles"
STATIC_MODIFIER_NAME_stearin_candles_invention: "Stearin Candles"
STATIC_MODIFIER_DESC_stearin_candles_invention: "Stearin candles are made from purified stearin rather than ordinary tallow, burn brighter, produce less smoke and and retain their shape better in warm weather."

soap_events.13.title: "The Crown and the Forests"
soap_events.13.desc: "The forests of [target_nation.GetName] have long provided timber, fuel, and hunting grounds. Yet as demand grows for potash, tar, and charcoal, their value extends far beyond the needs of local communities. Seeking to secure these resources for the benefit of the kingdom, [ruler.GetName] is strongly considering asserting greater authority over the use and exploitation of the forests of the realm."
soap_events.13.entry: "The Crown and the Forests"
soap_events.13.historical_info: "Following his accession in 1568, King Johan III of Sweden continued the Crown's efforts to strengthen royal control over the kingdom's natural resources. Sweden's vast forests supplied timber, tar, charcoal, and potash, all of which were increasingly important to trade and industry. By asserting greater authority over their exploitation, the Crown sought both to increase revenues and to secure strategic resources for the realm."
soap_events.13.a: "The forests serve the realm."
soap_events.13.b: "A dangerous overreach."
STATIC_MODIFIER_NAME_swedish_forest_crownlands: "Swedish Crown Forests"
STATIC_MODIFIER_DESC_swedish_forest_crownlands: "The forests of Sweden are under the direct control of the Crown, providing timber, fuel, and resources for the kingdom's industries and trade."

soap_events.14.title: "The First Patent"
soap_events.14.desc: "As settlements spreads into the frontier, vast quantities of [lumber.GetName] are cleared to make way for farms and towns. From the resulting ashes, enterprising manufacturers produce [potash.GetName], a commodity essential to soapmaking, glassmaking, and numerous other trades. Seeking to encourage innovation, [target_nation.GetName] has granted a patent to [samuel_hopkins.GetName] for an improved method of production."
soap_events.14.entry: "The First Patent"
soap_events.14.historical_info: "On July 31, 1790, Samuel Hopkins received the first patent issued under the laws of the United States. His invention concerned an improved method of producing potash and pearl ash from wood ashes, substances widely used in the manufacture of soap, glass, and fertilizers. Signed by President George Washington, Secretary of State Thomas Jefferson, and Attorney General Edmund Randolph, the patent marked the beginning of the American patent system."
soap_events.14.a: "Our nation must be built upon ingenuity."

soap_events.15.title: "George Ravenscroft"
soap_events.15.desc: "[target_nation.GetAdjective] glassmakers have long struggled to match the quality of the finest Venetian [glass.GetName]. Now however, [george_ravenscroft.GetName] has introduced a new method of manufacture that incorporates lead oxide into the glass mixture. The resulting product possesses an unusual brilliance, clarity, and weight."
soap_events.15.entry: "George Ravenscroft"
soap_events.15.historical_info: "In the 1670s, George Ravenscroft developed a new type of glass containing lead oxide. Seeking to rival the renowned glassmakers of Venice, he experimented with alternative formulas that produced a clearer and more brilliant material. The resulting lead crystal became highly prized for decorative objects, tableware, and luxury goods, establishing a tradition of English glassmaking that endured for centuries."
soap_events.15.a: "Surely a breakthrough in glassmaking."
STATIC_MODIFIER_NAME_english_glassmaking_traditions: "English Glassmaking Traditions"
STATIC_MODIFIER_DESC_english_glassmaking_traditions: "The English tradition of glassmaking, exemplified by George Ravenscroft's introduction of lead crystal, has produced high-quality glassware known for its brilliance and clarity."

soap_events.16.title: "Venetian Ceruse"
soap_events.16.desc: "The merchants of [target_nation.GetName] have long supplied [ShowContinentName('europe')] with luxuries from every corner of the world. Now, a type of fine white [cosmetics.GetName] known as #italic Venetian Ceruse#! has become a coveted commodity among the courts and noble households. Praised for the pale complexion it bestows, the fashionable preparation commands high prices and further strengthens Venice's reputation as a center of refinement and luxury. "
soap_events.16.entry: "Venetian Ceruse"
soap_events.16.historical_info: "Venetian Ceruse was a highly regarded cosmetic made primarily from lead carbonate. Popular throughout Renaissance and early modern Europe, it was prized for the smooth white complexion it produced and was used by nobles and courtiers alike. Though celebrated for its appearance, prolonged use often resulted in severe lead poisoning, causing skin damage, illness, and even death. Despite these dangers, Venetian Ceruse remained fashionable for centuries."
soap_events.16.a: "Lead Poisoning? That's just superstition."
STATIC_MODIFIER_NAME_venetian_ceruse: "Venetian Ceruse"
STATIC_MODIFIER_DESC_venetian_ceruse: "Venetian Ceruse was a highly regarded cosmetic made primarily from lead carbonate, popular throughout Renaissance and early modern Europe."

soap_events.17.title: "The Letters of Madame de Sévigné"
soap_events.17.desc: "The correspondence of Madame de Sévigné has become widely admired among the educated classes. Filled with observations on court life, fashion, literature, and society, her letters circulate far beyond their intended recipients. Readers eagerly discuss the latest styles and customs described within, helping to spread the tastes of the [target_nation.GetName] court throughout the realm."
soap_events.17.entry: "The Letters of Madame de Sévigné"
soap_events.17.historical_info: "Marie de Rabutin-Chantal, Marquise de Sévigné, is remembered for the thousands of letters she wrote during the seventeenth century, particularly to her daughter. Rich in descriptions of court life under Louis XIV, her correspondence is an unparalleled account of aristocratic society, fashion, politics, and daily life. Published after her death, the letters became celebrated as masterpieces of French literature and remain an important historical source for the age."
soap_events.17.a: "A fascinating glimpse into court life."

soap_events.18.title: "The Cosmetics Controversy"
soap_events.18.desc: "Certain pamphleteers and moralists have taken aim at the growing use of [cosmetics.GetName], [perfume.GetName], wigs, and other fashionable artifices in [target_nation.GetName]. Some critics denounce such practices as deception, while their defenders argue that elegance and refinement are hallmarks of civilized society. The dispute has begun to attract a little attention in higher circles, much to the amusement of fashionable circles."
soap_events.18.entry: "The Cosmetics Controversy"
soap_events.18.historical_info: "A persistent legend claims that the British Parliament passed a law in 1770 allowing marriages to be annulled if a woman had employed cosmetics, perfumes, false hair, or other artifices to attract her husband. No evidence exists that such a statute was ever enacted, and historians generally regard the story as a satirical fabrication. Nevertheless, the tale reflects contemporary debates about fashion, cosmetics, and social expectations in eighteenth-century Britain."
soap_events.18.a: "Fashion must endure."
soap_events.18.b: "They have a point."

soap_events.19.title: "The Death of Maria Gunning"
soap_events.19.desc: "The death of the celebrated Countess of [coventry.GetName] has shocked fashionable society. Renowned for her beauty, she was said to rely heavily upon white [cosmetics.GetName] to maintain the pale complexion favored by the aristocracy. Her passing has renewed discussion of [lead.GetName] employed by apothecaries and perfumers, though many remain unwilling to abandon the latest fashions."
soap_events.19.entry: "The Death of Maria Gunning"
soap_events.19.historical_info: "Maria Gunning, Countess of Coventry, was one of the most celebrated beauties of eighteenth-century Britain. Following her death in 1760, contemporaries widely attributed her decline to the prolonged use of white lead cosmetics such as Venetian Ceruse. Although the precise role of lead poisoning remains uncertain, her story became a famous warning about the dangers hidden behind fashionable beauty treatments and helped shape public attitudes toward cosmetics."
soap_events.19.a: "Such is the price of beauty."

soap_events.20.title: "William Hogarth"
soap_events.20.desc: "The painter and engraver [william_hogarth.GetName] has won widespread acclaim for his vivid depictions of contemporary life. Through scenes of vice, ambition, folly, and misfortune, his works entertain while offering sharp commentary on society. Reproduced as engravings and sold throughout the country, his images have reached an audience far beyond the traditional patrons of art."
soap_events.20.entry: "William Hogarth"
soap_events.20.historical_info: "William Hogarth was one of Britain's most influential artists and printmakers. Renowned for works such as A Harlot's Progress, A Rake's Progress, Marriage A-la-Mode, and Gin Lane, he combined artistic skill with social satire to depict the virtues and vices of eighteenth-century society. His engravings were widely distributed and helped establish a distinctly British school of art, while also demonstrating the growing influence of print culture."
soap_events.20.a: "Offer him a royal patronage."
soap_events.20.b: "Another satirist? How dull."

soap_events.21.title: "A Rake's Progress"
soap_events.21.desc: "A new series of engravings by [william_hogarth.GetName] has captured the public imagination. The work follows the rise and fall of a young heir who squanders his inheritance on vice, gambling, and extravagance before meeting a miserable end. Both entertaining and cautionary, the prints have found eager audiences among all classes of [target_nation.GetAdjective] society."
soap_events.21.entry: "A Rake's Progress"
soap_events.21.historical_info: "Published between 1732 and 1735, A Rake's Progress is one of William Hogarth's most celebrated works. Through a sequence of eight paintings and engravings, Hogarth tells the story of Tom Rakewell, a spendthrift heir whose reckless pursuit of pleasure leads him from wealth and privilege to imprisonment and insanity. The series established Hogarth as one of Britain's foremost satirists and remains a landmark in the history of narrative art."
soap_events.21.a: "A brilliant commentary on the follies of youth."
rake_progress: "A Rake's Progress
rake_progress_desc: "A series of engravings by William Hogarth that follows the rise and fall of a young heir who squanders his inheritance on vice, gambling, and extravagance before meeting a miserable end. Both entertaining and cautionary, the prints have found eager audiences among all classes of society."

soap_events.22.title: "Gin Lane"
soap_events.22.desc: "A new print by [william_hogarth.GetName] has stirred discussion throughout [target_nation.GetName]. Depicting a district consumed by drunkenness, poverty, and neglect, the work presents a grim vision of the consequences of excessive gin consumption. Though some dismiss it as exaggeration, others see in it a powerful warning against vice and disorder."
soap_events.22.entry: "Gin Lane"
soap_events.22.historical_info: "Published in 1751, Gin Lane is among William Hogarth's most famous engravings. Created during the height of the Gin Craze in Britain, the print portrays the social consequences of widespread gin consumption among the urban poor. Issued alongside Beer Street, which presented a more positive image of traditional English ale, the work formed part of a broader campaign supporting measures to curb excessive gin drinking. Gin Lane remains one of the most influential examples of social satire in European art."
soap_events.22.a: "A powerful indictment of the dangers of gin."
gin_lane: "Gin Lane"
gin_lane_desc: "An engraving by William Hogarth depicting the devastating effects of gin consumption on London society."

soap_events.23.title: "The Eddystone Lighthouse"
soap_events.23.desc: "The Eddystone Rocks have long posed a grave danger to vessels entering [plymouth.GetName]. Hidden beneath the waves and battered by relentless storms, they have claimed countless [target_nation.GetAdjective] ships. To reduce these losses, the engineer Henrey Wistanley has undertaken the ambitious task of erecting a lighthouse upon the reef itself. Should the beacon endure, it will guide mariners safely through one of the kingdom's most perilous waters."
soap_events.23.entry: "The Eddystone Lighthouse"
soap_events.23.historical_info: "Completed in 1698, the first Eddystone Lighthouse was designed and constructed by Henry Winstanley on the treacherous Eddystone Rocks southwest of Plymouth. The project represented one of the earliest attempts to build a permanent structure on an exposed offshore reef. Although the lighthouse was destroyed during the Great Storm of 1703, its construction was a significant advance in maritime safety and inspired the more durable Eddystone lighthouses that followed."
soap_events.23.a: "A great idea for maritime safety."
soap_events.23.b: "A stupid waste of money."
eddystone_tt: "Has built the Eddystone lighthouse"

soap_events.24.title: "The Great Storm of 1703"
soap_events.24.desc: "A tempest of unprecedented fury has swept across the [ShowAreaName('west_country_area')]. Many houses have been unroofed, church steeples toppled, and countless ships driven onto the rocks by winds of terrifying strength. Reports of destruction continue to arrive from every corner of the country, while survivors are struggling to comprehend the scale of the calamity."
soap_events.24.entry: "The Great Storm of 1703"
soap_events.24.historical_info: "The Great Storm of 1703 struck southern England and the English Channel in late November and early December. Regarded as one of the most severe storms ever recorded in Britain, it caused widespread destruction on land and at sea. Thousands of sailors perished, entire naval squadrons were lost, and Henry Winstanley's Eddystone Lighthouse was destroyed. Contemporary observers viewed the disaster as an event of almost biblical magnitude."
soap_events.24.a: "A tragic loss of life."

soap_events.25.title: "Rudyerd's Lighthouse"
soap_events.25.desc: "The destruction of the Eddystone Lighthouse near [plymouth.GetName] during the Great Storm has left one of [target_nation.GetName] most dangerous maritime hazards once again unmarked. Determined to restore the beacon, the silk merchant and engineer John Rudyerd has undertaken the construction of a new lighthouse upon the rocks. Drawing upon the lessons of his predecessor's failure, the new tower promises greater strength and durability against the relentless sea."
soap_events.25.entry: "Rudyerd's Lighthouse"
soap_events.25.historical_info: "Completed in 1709, John Rudyerd's Eddystone Lighthouse replaced the structure destroyed during the Great Storm of 1703. Simpler and more practical than Henry Winstanley's ambitious design, Rudyerd's wooden tower successfully guided mariners for nearly half a century. Its eventual destruction by fire in 1755 demonstrated the hazards of timber construction, but the lighthouse was widely regarded as a success and paved the way for John Smeaton's celebrated masonry tower."
soap_events.25.b: "I'm not falling for that again."

soap_events.26.title: "Smeaton's Lighthouse"
soap_events.26.desc: "A of Rudyerd's Lighthouse by fire has once again left the Eddystone Rocks near [plymouth.GetName] without a beacon. Commissioned to solve the problem, the engineer John Smeaton has devised an entirely new design. Constructed from interlocking blocks of stone and inspired by the strength of an oak tree, the lighthouse promises to withstand both storm and sea. Mariners and engineers alike look upon the undertaking as a triumph of ingenuity."
soap_events.26.entry: "Smeaton's Lighthouse"
soap_events.26.historical_info: "Completed in 1759, John Smeaton's Eddystone Lighthouse is regarded as one of the great engineering achievements of the eighteenth century. Built from interlocking granite blocks upon the treacherous Eddystone Rocks, the structure introduced innovations that influenced lighthouse construction around the world. Its remarkable durability established Smeaton's reputation as one of Britain's foremost civil engineers and marked a turning point in the development of modern maritime infrastructure."

soap_events.27.title: "The Lighthouse of Kings"
soap_events.27.desc: "Engineers are proposing to raise a magnificent lighthouse, at the mouth of the Gironde, where shifting sands and hidden shoals imperil navigation. Combining elegance with utility, the tower will guide vessels safely toward the ports of western France while proclaiming the wealth and authority of the [target_nation.GetAdjective] Crown. Sailors speak of its beacon with gratitude, and visitors marvel at its grandeur."
soap_events.27.entry: "The Lighthouse of Kings"
soap_events.27.historical_info: "Completed in 1611 after decades of construction, the Cordouan Lighthouse stands at the entrance to the Gironde Estuary. Designed by Louis de Foix, it was among the first great modern lighthouses and combined practical navigation with royal symbolism. Its chapel, apartments, and elaborate architecture earned it the title 'The King of Lighthouses and the Lighthouse of Kings.' Cordouan remains one of the most celebrated maritime monuments in Europe."
soap_events.27.a: "A solid investment."
soap_events.27.b: "A waste of money."

lighthouse_early: "Early Lighthouse"
lighthouse_early_desc: "A sturdy stone tower with a beacon fire, helping sailors navigate coastlines and avoid dangerous waters."
lighthouse_early_advance: "$lighthouse_early$"
lighthouse_early_advance_desc: "$lighthouse_early_desc$"
early_lighthouse_maintenance: "Lighthouse Maintenance"

lighthouse_modern: "Modern Lighthouse"
lighthouse_modern_desc: "An advanced lighthouse with a powerful enclosed lantern, guiding ships safely through the night and poor weather."
lighthouse_modern_advance: "$lighthouse_modern$"
lighthouse_modern_advance_desc: "$lighthouse_modern_desc$"
modern_lighthouse_maintenance: "Lighthouse Maintenance"

soap_events.28.title: "The Argand Lamp"
soap_events.28.desc: "A remarkable new lamp has been demonstrated in [target_nation.GetName] by an inventor named [ami_argand.GetName]. Through the use of a hollow cylindrical wick and a glass chimney, the design produces a brighter and steadier flame than traditional candles or oil lamps. Years of experimentation have refined every aspect of its construction, from the circulation of air to the purification of fuel."
soap_events.28.entry: "The Argand Lamp"
soap_events.28.historical_info: "In 1780, Aimé Argand developed a revolutionary oil lamp that dramatically improved illumination. Rather than a single invention, the Argand lamp was the result of numerous advances working together: a cylindrical wick, a glass chimney to enhance airflow, improved fuel refinement, and mechanisms for regulating the flame. Producing several times more light than a candle while consuming fuel efficiently, the lamp quickly spread throughout Europe. Manufactured in France by Antoine-Arnoult Quinquet and others, it became widely used in homes, workshops, public buildings, and lighthouses, representing one of the most important advances in lighting before the advent of gas and electric illumination."
soap_events.28.a: "A brighter age may begin with a brighter flame."

soap_events.29.title: "Clapperton's Expedition"
soap_events.29.desc: "Henry Bathurst, the 3rd Earl Bathurst, has approached us seeking to expand our knowledge of the interior of [ShowContinentName('africa')]. To that end, he has assembled an unusual company. The naturalist Walter Oudney, naval officer [hugh_clapperton.GetName] and soldier [dixon_denham.GetName] are to be entrusted with a hazardous mission beyond the Sahara. Their destination lies far beyond the limits of our maps, in lands known only through scattered reports of merchants, travelers, and ancient geographers. Though the dangers are considerable, the promise of discovery and adventure is greater still."
soap_events.29.entry: "Clapperton's Expedition"
soap_events.29.historical_info: "In 1822, the British government sponsored an expedition into the central Sudan under the patronage of Henry Bathurst, 3rd Earl Bathurst. Walter Oudney and Hugh Clapperton departed for Tripoli to prepare for their journey into the African interior, where they were joined by Dixon Denham. Together, the three men crossed the Sahara in search of geographic, scientific, and commercial knowledge. Their mission would become one of the most significant African expeditions of the nineteenth century."
soap_events.29.a: "Fund the expedition."
soap_events.29.b: "Lake Chade is but a myth."
clapperton_expedition_tt: "Clapperton's Expedition has been funded."

soap_events.30.title: "Lake Chad"
soap_events.30.desc: "After crossing the vast Sahara and enduring months of hardship, the expedition has reached one of the great geographical mysteries of [ShowContinentName('africa')]. Long known through the accounts of merchants and travelers yet absent from many maps, #italic Lake Chad#! lies before them at last. The surrounding lands support thriving communities and extensive trade networks, confirming that the interior is neither empty nor unknown, but home to kingdoms and peoples of considerable wealth and influence."
soap_events.30.entry: "Lake Chad"
soap_events.30.historical_info: "In 1823, Walter Oudney, Hugh Clapperton, and Dixon Denham became among the first Europeans to reach and describe Lake Chad. Although the lake had long been known to local populations and recorded in earlier accounts, its existence and extent remained poorly understood in Europe. After successfully crossing the Sahara, the expedition gathered valuable information on the geography, commerce, and states of the Lake Chad region, greatly expanding European knowledge of the African interior."
soap_events.30.a: "A remarkable discovery."

soap_events.31.title: "Spitsbergen"
soap_events.31.desc: "Reports have arrived of a rugged archipelago far to the north of [ShowRegionName('scandinavian_region')], discovered amidst ice-choked seas and towering mountains. Though the land appears inhospitable and unfit for settlement, its surrounding waters teem with marine life. Merchants and mariners alike speculate that these distant islands may offer new opportunities for trade, hunting, and exploration."
soap_events.31.entry: "Spitsbergen"
soap_events.31.historical_info: "In 1596, the Dutch navigator Willem Barentsz sighted the Arctic archipelago he named Spitsbergen, meaning 'pointed mountains.' The discovery occurred during his search for a Northeast Passage to Asia. Although the islands themselves offered little in the way of settlement, their surrounding waters soon became the center of a thriving whaling industry, drawing ships from across Europe and establishing Spitsbergen as one of the most important regions of Arctic exploration."
soap_events.31.a: "I see a good business venture."
soap_events.31.b: "It's just worthless ice and rock."

soap_events.32.title: "The Founding of Smeerenburg"
soap_events.32.desc: "The rich whaling grounds of Spitsbergen have drawn increasing numbers of ships to the Arctic. To support the growing industry, merchants and whalers have established a permanent station upon the remote northern shores. Here, whale blubber may be rendered into [whaleoil.GetName] before the long voyage back to [target_nation.GetName], reducing costs and greatly improving the profitability of the hunt."
soap_events.32.entry: "Where others see ice and desolation, merchants see opportunity."
soap_events.32.historical_info: "Founded around 1619 by Dutch whalers on Amsterdam Island in Svalbard, Smeerenburg or 'Blubber Town' served as one of the most important whaling stations of the seventeenth century. Its furnaces rendered whale blubber into oil on site, allowing ships to transport a far more valuable cargo back to Europe. Although often exaggerated in popular accounts, Smeerenburg became a symbol of the Arctic whaling boom and the growing reach of European maritime enterprise."
soap_events.32.a: "The Arctic yields its riches."
soap_events.32.b: "Too high a cost for too little gain."

soap_events.33.title: "The Essex Disaster"
soap_events.33.desc: "Grave news has arrived from the [ShowRegionName('north_pacific_ocean_region')]. The whaleship Essex has been lost after a violent encounter with an enormous sperm whale. Forced to abandon their vessel, the crew took to open boats and began a desperate struggle for survival across thousands of miles of ocean. Tales of the catastrophe have spread rapidly through maritime communities, reminding all who go to sea of the dangers that accompany the pursuit of [whaleoil.GetName]."
soap_events.33.entry: "The hunter became the hunted"
soap_events.33.historical_info: "On 20 November 1820, the American whaleship Essex was rammed and sunk by a sperm whale in the Pacific Ocean. The surviving crew escaped in small boats but endured a harrowing voyage lasting several months. Starvation, exposure, and desperation claimed many lives before the survivors were rescued. The disaster became one of the most famous episodes in the history of whaling and later helped inspire Herman Melville's novel Moby-Dick."
soap_events.33.a: "A terrible loss."

soap_events.34.title: "Samuel Taylor Coleridge"
soap_events.34.desc: "A poet of uncommon imagination has attracted growing attention among readers and critics alike. Through works that blend vivid imagery, philosophical reflection, and supernatural themes, [sam_coleridge.GetName] has challenged established literary conventions and helped shape a new movement in [target_nation.GetName]. His writings have inspired admiration, debate, and no small measure of imitation."
soap_events.34.entry: "The imagination is its own realm."
soap_events.34.historical_info: "Samuel Taylor Coleridge was one of the leading figures of English Romanticism. Together with William Wordsworth, he published Lyrical Ballads in 1798, a collection often regarded as the beginning of the Romantic movement in English literature. His best-known works include The Rime of the Ancient Mariner, Kubla Khan, and Christabel. Beyond poetry, Coleridge was an influential critic, philosopher, and lecturer whose ideas shaped nineteenth-century literature and thought."
soap_events.34.a: "A visionary poet."
taylor_coleridge: "Taylor Coleridge"

soap_events.35.title: "The Rime of the Ancient Mariner"
soap_events.35.desc: "A strange new poem by [sam_coleridge.GetName] has captured the imagination of readers throughout [target_nation.GetName]. Telling the tale of a sailor cursed after slaying an albatross, the work recounts a harrowing voyage across haunted seas, where loneliness, guilt, and the forces of nature weigh heavily upon the crew. Its vivid imagery and maritime themes have earned both admiration and controversy."
soap_events.35.entry: "Water, water, every where, nor any drop to drink"
soap_events.35.historical_info: "Published in 1798 by Samuel Taylor Coleridge, The Rime of the Ancient Mariner became one of the defining works of English Romanticism. The poem follows an old sailor whose thoughtless act brings disaster upon his ship and companions. Blending maritime adventure with supernatural elements and moral reflection, it helped transform popular perceptions of the sea from a mere highway of commerce into a realm of mystery, danger, and sublime beauty."
soap_events.35.a: "A tale to haunt every mariner."
rime_mariner: "The Rime of the Ancient Mariner"
rime_mariner_desc: "A sailor's tale of guilt, redemption, and the terrors of the sea."

soap_events.101.title: "Perfumed Gloves"
soap_events.101.desc: "Due to the unappealing smell of tanned leather, gloves coated in [perfume.GetName] have become the latest craze among the fashionable elite. Scented with expensive oils and floral extracts, they are now sought after by nobles throughout [target_nation.GetName]."
soap_events.101.a: "I'm fashionable! Get me a pair!"
soap_events.101.b: "A ridiculous craze."

soap_events.102.title: "A Great Catch"
soap_events.102.desc: "Our heroic whalers have returned to [target_location.GetName] laden with [whaleoil.GetName] and baleen after an exceptionally successful season. Incredulous tales of vast pods and daring hunts spread among both peasant and nobleman alike in [target_nation.GetName]. Meanwhile, merchants have begun to eagerly bid for the valuable cargo."
soap_events.102.a: "A Fortunate Haul."
STATIC_MODIFIER_NAME_whale_boon: "A Great Catch"
STATIC_MODIFIER_DESC_whale_boon: "Our whalers have returned with holds full of baleen and whale oil."

soap_events.103.title: "Exceptional Bloom"
soap_events.103.desc: "A season of ideal weather has covered many of the fields in [target_nation.GetName] in beautiful blossoms. The abundance of flowers is so great that it has delighted growers and distillers alike, providing ample supplies for perfumes, rosewater, and other [aromatics.GetName]."
soap_events.103.a: "Nature's bounty is ours to reap."
STATIC_MODIFIER_NAME_aromatics_boon: "Exceptional Bloom"
STATIC_MODIFIER_DESC_aromatics_boon: "The fields in our nation are full of blossoms."

soap_events.104.title: "Ecclesiastical Candles"
soap_events.104.desc: "Representatives of the clergy of [target_nation.GetName] have petitioned the authorities for assistance in purchasing [candles.GetName] for churches, shrines, and religious ceremonies. Such patronage will please our clergymen, but would obviously require substantial funds from our national treasury."
soap_events.104.a: "Fund the candles."
soap_events.104.b: "The church must provide its own"

soap_events.105.title: "Beauty Craze"
soap_events.105.desc: "As of now it is unclear who specifically started it. A duchess, a merchant's wife, or perhaps some actor of questionable reputation. What is clear is that everyone in [target_nation.GetName] now insists on wearing the same powders, rouges, creams, and perfumes. Courtiers whisper of beauty secrets, merchants raise their prices, and those who fail to keep up with the latest fashions risk becoming the subject of ridicule."
soap_events.105.a: "A little powder never hurt anyone."
soap_events.105.b: "Has everyone gone crazy?"

