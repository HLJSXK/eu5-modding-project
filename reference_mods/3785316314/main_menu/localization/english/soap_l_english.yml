 STATIC_MODIFIER_NAME_whaleoil_demand_0: "Whaling Industry Demand"
 STATIC_MODIFIER_DESC_whaleoil_demand_0_desc: "As Europeans are expanding their maritime activities, the demand for whale oil is slowly increasing."
 STATIC_MODIFIER_NAME_whaleoil_demand_1: "Whale Oil Demand"
 STATIC_MODIFIER_DESC_whaleoil_demand_1_desc: "With the start of the Age of Sail, the demand for whale oil is increasing as it becomes a preferred fuel for lighting and lubrication in ships and coastal cities."
 STATIC_MODIFIER_NAME_whaleoil_demand_2: "Whale Oil Demand"
 STATIC_MODIFIER_DESC_whaleoil_demand_2_desc: "As Global Trade expands and urban populations grow, the demand for whale oil continues to rise, driven by its use in lighting, lubrication, and industrial processes."
 STATIC_MODIFIER_NAME_whaleoil_demand_3: "Whale Oil Demand"
 STATIC_MODIFIER_DESC_whaleoil_demand_3_desc: "Development rises in the 17th century, and whale oil becomes increasingly important for lighting and industrial uses, leading to a significant increase in demand."
 STATIC_MODIFIER_NAME_whaleoil_demand_4: "Whale Oil Demand"
 STATIC_MODIFIER_DESC_whaleoil_demand_4_desc: "With the advent of the Industrial Revolution, whale oil demand surges as it becomes a critical resource for lighting, lubrication, and manufacturing processes in rapidly growing urban centers and industries."

 basque_vigias: "Vigias"
 basque_vigias_desc: "The Basque people were pioneers in the early whaling industry, with their vigias playing a crucial role in spotting whales from the shore. These skilled observers were essential for the success of early whaling expeditions."
