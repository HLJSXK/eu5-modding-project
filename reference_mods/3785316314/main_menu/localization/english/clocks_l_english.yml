 # Academy Events 
 # Scholasticism
 academic_events.1.title: "A Theological Debate"
 academic_events.1.desc: "A difficult question concerning the nature of divine knowledge has divided the scholars of [academy_location.GetName]. Theologians and philosophers now debate whether such matters may be approached through reason, or whether they must remain within the bounds of revelation. What began as a dispute among a handful of scholars has drawn the attention of learned men throughout [target_nation.GetName]."
 academic_events.1.a: "Reason must prevail."
 academic_events.1.b: "Leave these matters to scripture."

 academic_events.2.title: "The Nature of Causation"
 academic_events.2.desc: "An intriguing question concerning the nature of causation is currently dividing the scholars of [academy_location.GetName]. Some argue that every event must follow from a necessary cause, while others maintain that observation alone cannot reveal such a necessity. The argument has grown heated as each side searches the works of earlier thinkers for support."
 academic_events.2.a: "Seek the causes behind all things."
 academic_events.2.b: "Do not claim what cannot be observed."

 academic_events.3.title: "The Problem of Universals"
 academic_events.3.desc: "The scholars of [academy_location.GetName] have become divided over the nature of concepts such as humanity, justice, and beauty. Some of the brightest minds in [target_nation.GetName] maintain that such things possess a reality beyond individual objects, while others argue that they exist only as names given by the mind. What appears at first to be a question of words has become a dispute over the very nature of reality."
 academic_events.3.a: "Universals are merely names."
 academic_events.3.b: "Universals possess a reality of their own."

 academic_events.4.title: "A Question of Free Will"
 academic_events.4.desc: "A difficult question concerning human freedom has occupied the scholars of [academy_location.GetName]. If the course of events is governed by causes beyond our control, the scholars ask, what remains of mankind's freedom to choose? The question has stirred fierce arguments over whether a person can truly be praised or condemned for actions that were somehow destined to occur."
 academic_events.4.a: "Man remains master of his choices."
 academic_events.4.b: "All things follow their appointed course."

 academic_events.5.title: "The Nature of the Soul"
 academic_events.5.desc: "A debate concerning the nature of the soul has drawn philosophers and theologians into dispute at [academy_location.GetName]. The question has become whether the faculties of the soul may be understood through the workings of the body, or whether they belong to an entirely different order. Several scholars have begun examining the question anew, much to the discomfort of those who believe the matter already settled."
 academic_events.5.a: "The body may reveal the nature of the soul."
 academic_events.5.b: "The soul cannot be known through the body."

 academic_events.6.title: "A Strange Celestial Body"
 academic_events.6.desc: "An unusual object has been observed in the heavens, prompting much discussion among the scholars of [academy_location.GetName]. Its appearance has raised questions about whether the celestial realm is truly as constant and orderly as commonly believed. Some scholars insist that a single strange observation cannot overturn centuries of astronomical learning, while others see an opportunity to test what is believed to be certain."
 academic_events.6.a: "Question what we know of the heavens."
 academic_events.6.b: "The heavens remain as they have always been."

 academic_events.7.title: "The Measure of Time"
 academic_events.7.desc: "Scholars of [academy_location.GetName] have begun debating the nature of time and how it ought to be measured. Small disagreements over calendars and calculations have revealed larger questions about whether the divisions by which people mark time truly correspond to the workings of nature. The matter has proven strangely difficult to settle."
 academic_events.7.a: "Seek a more precise measure."
 academic_events.7.b: "The old reckoning is sufficient."

 academic_events.8.title: "A Difficult Translation"
 academic_events.8.desc: "A passage of an old work has proven unusually difficult to interpret at [academy_location.GetName]. Several meanings appear possible, and the scholars must decide whether to preserve the familiar reading or pursue an interpretation that better fits the surrounding text. Even a single word, they now realize, may alter the meaning of an entire passage."
 academic_events.8.a: "Let the text speak for itself."
 academic_events.8.b: "Trust the established interpretation."

 academic_events.9.title: "The Nature of Illness"
 academic_events.9.desc: "A puzzling illness has caused the scholars of [academy_location.GetName] to reconsider several familiar explanations of disease. Some propose that closer observation of the body may reveal causes that have escaped earlier physicians, while others defend the wisdom of inherited teachings. As the physicians argue, the question becomes whether knowledge should be inherited from the masters or discovered anew."
 academic_events.9.a: "Study the body anew."
 academic_events.9.b: "Trust the wisdom of the physicians."

# Humanist
 academic_events.10.title: "A Rediscovered Text"
 academic_events.10.desc: "An old manuscript has come into the hands of the scholars of [academy_location.GetName], containing passages that have long been unknown to them. Its contents differ in several respects from the teachings commonly associated with the subject, suggesting that something important may have been forgotten. Word of the discovery has already begun to spread among the learned."
 academic_events.10.a: "Study the forgotten work."
 academic_events.10.b: "Trust the established authorities."

 academic_events.11.title: "The Study of Language"
 academic_events.11.desc: "The scholars of [academy_location.GetName] have begun taking a renewed interest in the structure and history of language. Some argue that words have changed their meanings over generations, and that careful study of their origins may uncover ideas that later scholars have misunderstood. Others see little value in questioning meanings that have long been accepted."
 academic_events.11.a: "Study the origins of words."
 academic_events.11.b: "Words mean what tradition has taught."

 academic_events.12.title: "A New Translation"
 academic_events.12.desc: "A scholar at [academy_location.GetName] has undertaken a fresh translation of an important old work. The new rendering departs from several familiar interpretations, and some readers have been startled to find that the author's words may not mean quite what generations of scholars have claimed. The controversy has given new life to a text thought long understood."
 academic_events.12.a: "Return to the original meaning."
 academic_events.12.b: "Preserve the traditional reading."

 academic_events.13.title: "An Ancient Wisdom"
 academic_events.13.desc: "Scholars at [academy_location.GetName] have begun comparing the teachings of an ancient work with those currently accepted. Several contradictions have emerged, suggesting that the wisdom of earlier generations may have been more varied than previously believed. For some, this is an invitation to rediscover forgotten ideas, but for others, it is a dangerous invitation to doubt too much."
 academic_events.13.a: "Examine the old teachings anew."
 academic_events.13.b: "The received wisdom has endured."

 academic_events.14.title: "The Art of Rhetoric"
 academic_events.14.desc: "A renewed interest in rhetoric has taken hold among the scholars of [academy_location.GetName]. Students have begun gathering around teachers who insist that a learned person must know not only what to say, but how to persuade others of its truth. Their critics fear that beautiful words may eventually become more valued than sound arguments."
 academic_events.14.a: "Words should serve understanding."
 academic_events.14.b: "Truth needs no ornament."

 academic_events.15.title: "A Chronicle Reconsidered"
 academic_events.15.desc: "A scholar at [academy_location.GetName] has begun examining an old chronicle with unusual care. Several details appear inconsistent with commonly accepted accounts, and passages once copied without question are now being compared against other surviving evidence. What began as an exercise in careful reading may force [target_nation.GetName] to reconsider part of its own past."
 academic_events.15.a: "Question the old account."
 academic_events.15.b: "Respect the traditional history."

 academic_events.16.title: "The Virtue of Learning"
 academic_events.16.desc: "A debate has arisen at [academy_location.GetName] over the purpose of scholarly education. Some argue that learning should cultivate the judgment, character, and abilities of the individual, rather than merely fill the mind with inherited knowledge. Others warn that abandoning the old purpose of education risks producing clever minds without proper foundations."
 academic_events.16.a: "Learning should shape the individual."
 academic_events.16.b: "Learning should preserve knowledge."

 academic_events.17.title: "A Forgotten Author"
 academic_events.17.desc: "The scholars of [academy_location.GetName] have discovered references to an author whose works have largely disappeared from common study. The surviving fragments suggest ideas that differ considerably from those of the authorities most often consulted, and curiosity has begun to spread among the students. Perhaps the forgotten scholar was neglected for good reason—or perhaps generations have simply forgotten something valuable."
 academic_events.17.a: "Restore the forgotten author."
 academic_events.17.b: "There is wisdom in the established canon."

 academic_events.18.title: "The Original Meaning"
 academic_events.18.desc: "A disagreement has arisen at [academy_location.GetName] over how an old work should be understood. Some scholars argue that its meaning must be sought within the world and language in which it was written, rather than through centuries of accumulated commentary. Others maintain that generations of scholars could not all have misunderstood the same work."
 academic_events.18.a: "Seek the meaning of the original."
 academic_events.18.b: "Trust generations of interpretation."

 # Discovery Humanism
 academic_events.19.title: "A Scholar's Reputation"
 academic_events.19.desc: "A gifted scholar at [academy_location.GetName] has gained a remarkable following among students and fellow scholars alike. Their arguments challenge several respected teachings, and their growing reputation has begun to unsettle those who believe scholarship should remain within established bounds."
 academic_events.19.a: "Let talent challenge tradition."
 academic_events.19.b: "Reputation is no proof of wisdom."

 academic_events.20.title: "A Corrupted Manuscript"
 academic_events.20.desc: "Several copies of an old work have been compared at [academy_location.GetName], revealing that generations of scribes have introduced numerous differences into the text. Scholars now face the difficult task of determining which passages preserve the author's original words."
 academic_events.20.a: "Recover the original text."
 academic_events.20.b: "The received text is good enough."

 academic_events.21.title: "A Forgotten History"
 academic_events.21.desc: "An unfamiliar account of the past has been brought before the scholars of [academy_location.GetName]. Its version of events differs from the histories commonly accepted in [target_nation.GetName], raising uncomfortable questions about how much of the past rests upon repetition rather than evidence."
 academic_events.21.a: "Let evidence judge the past."
 academic_events.21.b: "Tradition preserves what matters."

 academic_events.22.title: "A New Education"
 academic_events.22.desc: "A teacher at [academy_location.GetName] has begun arguing that a learned person should be trained in many forms of knowledge rather than confined to a single discipline. Students have embraced the idea, while some senior scholars fear that breadth will come at the expense of depth."
 academic_events.22.a: "Teach the whole person."
 academic_events.22.b: "Master one discipline."

 academic_events.23.title: "Knowledge From Afar"
 academic_events.23.desc: "Travellers returning to [target_nation.GetName] have brought unfamiliar accounts, observations, and writings to the scholars of [academy_location.GetName]. Some of these reports contradict knowledge long regarded as certain, though their strange origins have led many to question their reliability."
 academic_events.23.a: "There is knowledge beyond our borders."
 academic_events.23.b: "Foreign tales are easily mistaken."

 academic_events.24.title: "An Unexplained Phenomenon"
 academic_events.24.desc: "An unusual phenomenon has been observed and recorded by scholars at [academy_location.GetName], yet none of the accepted explanations seems entirely satisfactory. Some argue that the observation itself must be mistaken, while others see an opportunity to discover something not yet understood."
 academic_events.24.a: "Investigate what we cannot explain."
 academic_events.24.b: "The established explanation remains sufficient."

 academic_events.25.title: "A Controversial Sermon"
 academic_events.25.desc: "A learned speaker has delivered a sermon at [academy_location.GetName] that questions several commonly accepted interpretations of religious teaching. The words have spread well beyond the academy, provoking both admiration and unease among the scholars and clergy of [target_nation.GetName]."
 academic_events.25.a: "Let difficult truths be spoken."
 academic_events.25.b: "Some teachings should not be disturbed."

 academic_events.26.title: "A Book Takes Flight"
 academic_events.26.desc: "A scholarly work produced at [academy_location.GetName] has begun circulating far beyond its original audience. Its arguments are being discussed by scholars who have never met its author, and ideas once confined to a single circle are suddenly travelling across [target_nation.GetName]."
 academic_events.26.a: "Let knowledge spread freely."
 academic_events.26.b: "Ideas require proper guidance."

 academic_events.27.title: "The Uncertain Authority"
 academic_events.27.desc: "A respected authority has been found to have made several errors in a work long relied upon by the scholars of [academy_location.GetName]. The discovery has caused considerable discomfort, for accepting the mistakes would mean reconsidering conclusions built upon them."
 academic_events.27.a: "Even the great may be mistaken."
 academic_events.27.b: "Do not cast aside proven wisdom."

 # Late Humanism
 academic_events.28.title: "An Experiment"
 academic_events.28.desc: "A scholar at [academy_location.GetName] has begun testing an established claim through repeated experiment rather than argument alone. The results have proved difficult to reconcile with several respected authorities, and the scholar now insists that nature itself must be allowed to settle the dispute."
 academic_events.28.a: "Let experiment decide."
 academic_events.28.b: "The authorities know better."

 academic_events.29.title: "A New Instrument"
 academic_events.29.desc: "An unfamiliar instrument has arrived at [academy_location.GetName], allowing scholars to make observations with a precision previously impossible. Some believe it may reveal things hidden from ordinary sight, while others question whether knowledge gained through such devices can be trusted."
 academic_events.29.a: "See what the instrument reveals."
 academic_events.29.b: "Trust what the senses already show."

 academic_events.30.title: "The Moving Heavens"
 academic_events.30.desc: "A new astronomical argument has reached the scholars of [academy_location.GetName], challenging several assumptions about the motions of the heavens. The proposal would require a considerable rethinking of how the celestial realm is ordered, and not all scholars are prepared to abandon the old arrangement."
 academic_events.30.a: "Let the heavens be reconsidered."
 academic_events.30.b: "The ancient order still holds."

 academic_events.31.title: "The Anatomy Lesson"
 academic_events.31.desc: "Physicians at [academy_location.GetName] have begun examining the human body with unusual care, comparing direct observations with descriptions inherited from earlier authorities. Several discrepancies have already been found, raising the uncomfortable possibility that some long-accepted teachings are simply mistaken."
 academic_events.31.a: "Trust what the body reveals."
 academic_events.31.b: "The old physicians knew their craft."

 academic_events.32.title: "A Law of Nature"
 academic_events.32.desc: "Scholars at [academy_location.GetName] have begun searching for a simple principle that might explain several seemingly unrelated phenomena. If such a principle exists, nature may prove to be governed by regular rules that can be discovered rather than merely described."
 academic_events.32.a: "Seek the laws behind nature."
 academic_events.32.b: "Nature cannot be reduced so simply."

 academic_events.33.title: "A World Newly Mapped"
 academic_events.33.desc: "New reports and maps reaching [academy_location.GetName] have revealed lands and distances that do not fit comfortably within established geographical knowledge. Scholars now face the task of reconciling inherited descriptions of the world with observations gathered from distant places."
 academic_events.33.a: "Redraw the known world."
 academic_events.33.b: "The old maps remain our guide."

 academic_events.34.title: "The Nature of Matter"
 academic_events.34.desc: "A dispute has arisen at [academy_location.GetName] over what matter is ultimately composed of. Some scholars argue that familiar substances may be understood as combinations of smaller constituents, while others defend the traditional account of the elements and their qualities."
 academic_events.34.a: "Search for the hidden constituents."
 academic_events.34.b: "The traditional elements suffice."

 academic_events.35.title: "A Scholar's Correspondence"
 academic_events.35.desc: "A scholar at [academy_location.GetName] has begun exchanging letters with thinkers far beyond [target_nation.GetName]. Their correspondence has brought unfamiliar arguments and observations into the academy, allowing ideas to be tested against the experiences of distant scholars."
 academic_events.35.a: "Share knowledge without borders."
 academic_events.35.b: "Our own tradition is sufficient."

 academic_events.36.title: "The Trial of an Idea"
 academic_events.36.desc: "A controversial theory has gained enough support among the scholars of [academy_location.GetName] to warrant a serious examination. Its opponents have challenged its foundations, but its defenders now propose putting the theory to the test rather than settling the matter through argument alone."
 academic_events.36.a: "Put the theory to the test."
 academic_events.36.b: "A disputed theory deserves no place here."

 # Scientific Method
 academic_events.37.title: "A Repeated Experiment"
 academic_events.37.desc: "A series of experiments at [academy_location.GetName] has produced the same result time and again. The finding has prompted scholars to argue that an observation is of little value until it can be reproduced by others under the same conditions."
 academic_events.37.a: "Repeat the experiment."
 academic_events.37.b: "A single demonstration is enough."

 academic_events.38.title: "A Precise Measurement"
 academic_events.38.desc: "Scholars at [academy_location.GetName] have begun replacing approximate descriptions with careful measurements. Small differences once dismissed as insignificant have revealed patterns that were invisible to earlier observers."
 academic_events.38.a: "Measure everything precisely."
 academic_events.38.b: "Approximation serves well enough."

 academic_events.39.title: "The Language of Mathematics"
 academic_events.39.desc: "A difficult natural problem has been expressed mathematically by scholars at [academy_location.GetName]. The new approach suggests that phenomena once thought too complicated to describe may be governed by simple relationships."
 academic_events.39.a: "Put nature into numbers."
 academic_events.39.b: "Nature cannot be reduced to equations."

 academic_events.40.title: "A New Classification"
 academic_events.40.desc: "The growing number of specimens and observations at [academy_location.GetName] has made old classifications increasingly difficult to maintain. Scholars have proposed reorganizing their knowledge according to shared characteristics rather than inherited categories."
 academic_events.40.a: "Classify by what we observe."
 academic_events.40.b: "Preserve the traditional categories."

 academic_events.41.title: "A Mechanical Explanation"
 academic_events.41.desc: "A scholar at [academy_location.GetName] has proposed explaining a natural phenomenon through the movement and interaction of matter rather than through hidden qualities or purposes. The argument has sparked debate over whether nature can ultimately be understood as a system of mechanisms."
 academic_events.41.a: "Seek the mechanism."
 academic_events.41.b: "Nature is more than mechanism."

 academic_events.42.title: "A Reproducible Finding"
 academic_events.42.desc: "An important result obtained at [academy_location.GetName] has been independently reproduced by another scholar. The agreement has strengthened the belief that reliable knowledge should survive the distance between observers and the differences between their methods."
 academic_events.42.a: "Trust what can be reproduced."
 academic_events.42.b: "Agreement does not prove truth."

 academic_events.43.title: "An Unseen World"
 academic_events.43.desc: "Improved instruments have allowed the scholars of [academy_location.GetName] to observe structures too small or distant to be perceived by ordinary senses. These discoveries have raised difficult questions about how much of the natural world remains hidden from unaided human sight."
 academic_events.43.a: "Study what lies beyond our senses."
 academic_events.43.b: "The senses remain our surest guide."

 academic_events.44.title: "A New Theory"
 academic_events.44.desc: "A scholar at [academy_location.GetName] has proposed a theory capable of explaining several observations that previously seemed unrelated. Its predictions can be tested, but accepting it would require abandoning several familiar explanations."
 academic_events.44.a: "Test the new theory."
 academic_events.44.b: "Do not abandon proven explanations."

 academic_events.45.title: "The Arithmetic of Chance"
 academic_events.45.desc: "Scholars at [academy_location.GetName] have begun applying mathematics to uncertain events, seeking regular patterns within what appears to be random chance. The approach may offer a new way to reason about risks and events that cannot be predicted individually."
 academic_events.45.a: "Measure uncertainty."
 academic_events.45.b: "Chance cannot be calculated."

 academic_events.46.title: "The Rights of Man"
 academic_events.46.desc: "A debate at [academy_location.GetName] has turned toward the question of whether certain rights belong to every person by virtue of being human. The idea has attracted considerable attention among scholars, though its implications for the laws and customs of [target_nation.GetName] remain deeply controversial."
 academic_events.46.a: "Rights belong to all."
 academic_events.46.b: "Rights belong to the established order."

 academic_events.47.title: "The Freedom of Thought"
 academic_events.47.desc: "Scholars at [academy_location.GetName] have begun debating whether ideas should ever be forbidden merely because they challenge accepted beliefs. Some argue that truth has nothing to fear from criticism, while others warn that unrestricted inquiry may undermine the foundations of society."
 academic_events.47.a: "Let every idea be examined."
 academic_events.47.b: "Some ideas must remain forbidden."

 academic_events.48.title: "The Measure of Society"
 academic_events.48.desc: "The scholars of [academy_location.GetName] have begun collecting systematic information about the population, wealth, and conditions of [target_nation.GetName]. They believe that careful measurement may reveal social problems that cannot be understood through anecdote alone."
 academic_events.48.a: "Measure society."
 academic_events.48.b: "Numbers cannot describe a people."

 academic_events.49.title: "A New Theory of Government"
 academic_events.49.desc: "A political philosopher at [academy_location.GetName] has proposed that legitimate government derives from the consent of those it governs. The argument has attracted students eager to reconsider the foundations of political authority, while its opponents warn against disturbing the established order."
 academic_events.49.a: "Authority must answer to the people."
 academic_events.49.b: "Authority comes from tradition."

 academic_events.50.title: "The Punishment of Crime"
 academic_events.50.desc: "A debate over criminal justice has emerged at [academy_location.GetName]. Some scholars argue that punishment should seek to reform the offender and prevent future crimes, while others maintain that justice requires punishment proportionate to the offense."
 academic_events.50.a: "Punishment should reform."
 academic_events.50.b: "Punishment should repay the crime."

 academic_events.51.title: "The Toleration Question"
 academic_events.51.desc: "Scholars at [academy_location.GetName] have begun debating whether people of different faiths should be permitted to practice their beliefs without interference. Supporters argue that peaceful coexistence strengthens society, while opponents fear that toleration may weaken its moral foundations."
 academic_events.51.a: "Let conscience be free."
 academic_events.51.b: "Society needs one moral order."

 academic_events.52.title: "The Science of Society"
 academic_events.52.desc: "A group of scholars at [academy_location.GetName] has begun applying methods of observation and measurement to human society. They hope that patterns in human behavior may be studied with the same rigor increasingly applied to the natural world."
 academic_events.52.a: "Human behavior can be studied."
 academic_events.52.b: "People cannot be reduced to numbers."

 academic_events.53.title: "A Universal Education"
 academic_events.53.desc: "A proposal before [academy_location.GetName] argues that education should be made available to far more of the population of [target_nation.GetName]. Its supporters believe that an educated population will strengthen society, while its critics question whether learning is suited to everyone."
 academic_events.53.a: "Knowledge belongs to everyone."
 academic_events.53.b: "Education should remain selective."

 academic_events.54.title: "The Wealth of Nations"
 academic_events.54.desc: "Scholars at [academy_location.GetName] have begun questioning what truly makes a nation prosperous. Their discussions have turned toward trade, labor, production, and the movement of wealth, challenging older assumptions about how prosperity is created."
 academic_events.54.a: "Study the forces of prosperity."
 academic_events.54.b: "Preserve the old economic order."

 clocks_event: "A fortunate oppertunity"

 # Historic Events
 clocks_events.1.title: "A Clock for the Frauenkirche"
 clocks_events.1.desc: "The great tower of the Frauenkirche has watched over [nuremberg.GetName] for generations, its bells marking the hours of prayer and commerce alike. Now the city's clockmakers have proposed adding a mechanical clock whose figures will emerge at the hour to honour the Golden Bull and the seven Prince-Electors of the Empire.\n\nSuch a work would require considerable skill and expense, but it would be more than a timepiece. The moving figures, intricate mechanisms and fine workmanship would proclaim the ingenuity of our craftsmen to merchants, pilgrims and visitors from across [ShowContinentName('europe')]."
 clocks_events.1.entry: "A Clock for the Frauenkirche"
 clocks_events.1.historical_info: "The Männleinlaufen of the Frauenkirche in Nuremburg was constructed between 1361 and 1362. Its mechanical figures commemorate the Golden Bull of 1356, with the seven Prince-Electors processing before the seated Emperor Charles IV at noon each day. The clock served not merely as a practical timepiece, but as a striking expression of the city's place within the Holy Roman Empire and the skill of its craftsmen."
 clocks_events.1.a: "Let the clockmakers show what they can do."
 clocks_events.1.b: "We have more pressing matters than elaborate toys."
 frauenkirche_clock: "Männleinlaufen"
 frauenkirche_clock_desc: "A magnificent mechanical clock whose seven Electors process before Emperor Charles IV, commemorating the Golden Bull and proclaiming the skill of Nuremberg's clockmakers."

 clocks_events.2.title: "Giovanni de' Dondi"
 clocks_events.2.desc: "A learned visitor has arrived at our court in [capital.GetName] by the name of [giovanni_de_dondi.GetName], a physician and astronomer from [target_location.GetName]. He has spent years studying the movements of the heavens and the intricate mechanisms by which they may be measured, and now seeks a patron for his talents. He offers his knowledge and service to our court, promising to apply his considerable learning to whatever task we might set before him."
 clocks_events.2.entry: "Giovanni de' Dondi"
 clocks_events.2.historical_info: "Giovanni de' Dondi dell'Orologio was a physician, astronomer, and clockmaker from Chioggia. He came from a family of clockmakers and was renowned for bringing together the study of astronomy, mathematics, medicine, and mechanical craftsmanship. His reputation as a learned and accomplished craftsman made him a notable figure in the intellectual life of fourteenth-century Italy."
 clocks_events.2.a: "A learned man is always welcome."
 clocks_events.2.b: "We have little need for his services."
 de_dondi: "de' Dondi"

 clocks_events.3.title: "The Astrarium"
 clocks_events.3.desc: "[giovanni_de_dondi.GetName] has come before the court with ideas unlike anything heard before at [target_location.GetName]. He shows elaborate drawings of a device with seven faces, each turning to the motion of a different heavenly body: The Sun, the Moon, and the five wandering stars known to the ancients. He calls this curious memento a #italic Astrarium#!. We could provide the small fortune required to fund the bronze and brass needed."
 clocks_events.3.entry: "The Astrarium"
 clocks_events.3.historical_info: "Giovanni de' Dondi's Astrarium, completed around 1364 after roughly sixteen years of work, was a planetary clock with seven dials tracking the Sun, Moon, and the five planets known in antiquity, alongside a calendar of feast days and a system for calculating the date of Easter. It was among the most sophisticated mechanical devices of the medieval period and became legendary among later clockmakers, Though the original was lost, several modern reconstructions have been built from de' Dondi's own detailed treatise."
 clocks_events.3.a: "Fund the Astrarium."
 clocks_events.3.b: "We cannot spare the expense."
 astrarium: "Astrarium"
 astrarium_desc: "A planetary clock of seven faces, each turning in time with the Sun, the Moon, and the five wandering stars. It is the crowning achievement of Giovanni de' Dondi, said to capture the very motion of the heavens in bronze and brass."

 clocks_events.4.title: "Henri de Vic of Lorraine"
 clocks_events.4.desc: "A clockmaker out of [metz.GetName], one [henri_de_vick.GetName], has arrived in [capital.GetName] seeking patronage. He speaks of an escapement of his own design, steadier and more reliable than any yet built, fit for a great public clock that might set the hours for an entire city. Such a man, given a workshop and the king's ear, could see the age of the tower clock begin in earnest."
 clocks_events.4.entry: "Henri de Vic of Lorraine"
 clocks_events.4.historical_info: "Henri de Vic was a clockmaker from Lorraine, was commissioned around 1370 by King Charles V of France to build a public clock for a tower of the Palais de la Cité, now part of the Conciergerie. Installed by 72, it is considered the first great public clock in Paris and one of the earliest of its kind in Europe. De Vic's escapement design, the mechanism that regulates a clock's ticking, would go on to influence tower clock construction across Europe."
 clocks_events.4.a: "Bring him into our service."
 clocks_events.4.b: "We have no need of him."
 de_vick: "de Vic"

 clocks_events.5.title: "The Horloge du Palais"
 clocks_events.5.desc: "[henri_de_vick.GetName] believes his design is ready. He proposes a great clock for a tower of the Palais de la Cité in [paris.GetName], its single hand marking the hour for all of to see. It will not be cheap, but such a clock would stand as a lasting symbol of [target_nation.GetAdjective] royal authority over the very hours of the day."
 clocks_events.5.entry: "The Horloge du Palais"
 clocks_events.5.historical_info: "The Horloge du Palais, installed around 1372 on a tower of the Palais de la Cité (now part of the Conciergerie), was commissioned by Charles V of France and built by Henri de Vic. Its single hand displayed only the hour, and its bells struck to mark royal announcements as well as the passage of time. It is considered the first great public clock of Paris and remains, in restored form, the city's oldest surviving clock."
 clocks_events.5.a: "Commission the clock."
 clocks_events.5.b: "The treasury cannot bear it." 
 horloge_du_palais: "Palace Clock"
 horloge_du_palais_desc: "A finely crafted clock adorns the palace, its precise workings a testament to the skill of our clockmakers and a fitting display of the refinement of our court."
 
 clocks_events.6.title: "The Hours of Salisbury"
 clocks_events.6.desc: "The canons of [salisbury.GetName] Cathedral have commissioned a mechanical clock unlike any before it in [target_nation.GetName], one without a face, tracking no hour hand at all. Instead it will strike a great bell at each hour, its iron frame and weighted gears driving the toll that summons the [clergy.GetName] to prayer and marks the passage of the day for all who dwell nearby."
 clocks_events.6.entry: "The Hours of Salisbury"
 clocks_events.6.historical_info: "The Salisbury Cathedral clock, believed to date from around 1386, is one of the oldest surviving mechanical clocks in the world and the oldest still working in its original form. It has no dial, striking a bell on the hour by means of an iron-framed weight-driven mechanism. It remained in continuous use for centuries before being restored to working order in the 20th century."
 clocks_events.6.a: "Fund the clock's construction."
 clocks_events.6.b: "The cathedral must find its own means."
 salisbury_cathedral_clock: "Salisbury Cathedral Clock"
 salisbury_cathedral_clock_desc: "An ingenious clockwork mechanism keeps time within the cathedral, its steady rhythm a testament to the skill of English craftsmen and the ordered passage of the hours."

 clocks_events.7.title: "The Astronomical Clock of Prague"
 clocks_events.7.desc: "The clockmaker [mikulas_of_kadan.GetName], working alongside the scholars in [prague.GetName], proposes a device to crown the Old Town Hall. He has plans for a massive clock that will not merely toll the hour, but chart the position of the sun and moon against the zodiac, mark the times of sunrise and sunset, and mount a procession of moving figures to mark the day's passing. Though expensive, its construction would stand as a testament to the learning and craft of [target_nation.GetName] for centuries to come."
 clocks_events.7.entry: "The Astronomical Clock of Prague"
 clocks_events.7.historical_info: "The Prague Orloj, mounted on the Old Town Hall, was first installed in 1410, built by clockmaker Mikuláš of Kadaň with astronomical design attributed to Jan Šindel, a professor at Charles University. It tracks the positions of the sun and moon, displays zodiacal information, and features an hourly procession of moving figures including the Apostles and a mechanical skeleton representing Death. It is the oldest astronomical clock in the world still in operation."
 clocks_events.7.a: "Commission the great clock."
 clocks_events.7.b: "We have no need of such a spectacle."
 of_kadan: "of Kadaň"
 prague_orloj: "Prague Orloj"
 prague_orloj_desc: "A marvel of clockmaking adorns the heart of Prague, its intricate workings marking the hours while displaying the movements of the heavens for all to see."

 clocks_events.8.title: "Clocks Enter the Home"
 clocks_events.8.desc: "Members of the [burghers.GetName] have begun taking a liking to something once unthinkable outside a church tower or a town hall. They are buying mechanical timepieces, kept within their own homes, ticking away the hours for their family's private use. It shows that what was once the province of cathedrals and councils may soon become a mark of any household of means in all of [target_nation.GetName]. Should our own craftsmen be encouraged to bring [clocks.GetName] down from the tower and into the parlor?"
 clocks_events.8.entry: "Clocks Enter the Home"
 clocks_events.8.historical_info: "As mechanical clocks became more reliable and affordable, they gradually spread beyond churches, towers, and civic buildings into the homes of wealthy households. What had once been a public instrument for marking the hours became a symbol of refinement and prosperity, while growing demand for domestic clocks encouraged craftsmen to develop ever smaller and more intricate mechanisms."
 clocks_events.8.a: "Bring the clock into the home."
 clocks_events.8.b: "Let the towers keep the time."

 clocks_events.9.title: "The Nuremberg Egg"
 clocks_events.9.desc: "A locksmith named [peter_henlein.GetName] has been experimenting with small drum-shaped [clocks.GetName] driven not by hanging weights, but by a coiled mainspring, wound by hand and small enough to carry on one's person. He claims such a device could run for a full day and a half between windings. Should his idea prove sound, the towers and tabletops of [target_location.GetName] may soon give way to a type of clock a man might carry in his own pocket."
 clocks_events.9.entry: "The Nuremberg Egg"
 clocks_events.9.historical_info: "Peter Henlein was a locksmith and clockmaker of Nuremberg, is traditionally credited with developing one of the earliest spring-driven portable clocks around 1505-1510, made possible by his refinement of the coiled mainspring mechanism. These small drum-shaped timepieces, later known as 'Nuremberg eggs', marked a major step toward the portable watch and cemented Nuremberg's reputation as a center of fine clockwork."
 clocks_events.9.a: "Support his experiments"
 clocks_events.9.b: "We have no use for such trinkets"
 STATIC_MODIFIER_NAME_peter_henlein_watchmaking: "Watchmaking Tradition"
 STATIC_MODIFIER_DESC_peter_henlein_watchmaking: "Peter Henlein's spring-driven mechanism has inspired a generation of local craftsmen, boosting the production and demand of fine clocks."

 clocks_events.10.title: "The Paris Clockmakers' Guild"
 clocks_events.10.desc: "The clockmakers of [target_location.GetName] have long practiced their craft as an offshoot of the locksmiths' trade, subject to rules that fit hinges and hasps rather than gears and escapements. Now they petition the crown for a guild of their own. A guild with the authority to set standards, train apprentices, and mark their finest [clocks.GetName] as worthy of the name Parisian. Granting their charter would formally recognize clockmaking as a craft in its own right, and draw skilled hands to the city from across [target_nation.GetName]."
 clocks_events.10.entry: "The Paris Clockmakers' Guild"
 clocks_events.10.historical_info: "The Corporation des Horlogers de Paris, the guild of Parisian clockmakers, was formally chartered in 1544 under Francis I, separating clockmaking from the locksmiths' guild it had previously been grouped under. The charter established standards of craftsmanship and apprenticeship for the trade, reflecting the growing sophistication and status of clockmaking as Paris developed into one of Europe's centers of horology."
 clocks_events.10.a: "Grant the charter."
 clocks_events.10.b: "The old guild will suffice."

 clocks_events.11.title: "The Augsburg Clockmakers' Guild"
 clocks_events.11.desc: "Rivaling [nuremberg.GetName] in wealth and craft, the artisans of [augsburg.GetName] now seek the same recognition long enjoyed by their neighbors to the north. A formal guild, they argue, would let Augsburg's clockmakers set their own standards for [clocks.GetName], guard their secrets, and compete for the patronage of princes and emperors alike. With the city's reputation for fine metalwork and its position astride the trade routes of [ShowRegionName('south_german_region')], such a guild could make [target_nation.GetName] a rival to any center of horology in the Empire."
 clocks_events.11.entry: "The Augsburg Clockmakers' Guild"
 clocks_events.11.historical_info: "The clockmakers' guild of Augsburg was established in 1564, formalizing a trade that had already flourished in the city for decades. Augsburg, alongside Nuremberg, became one of the two great centers of clock and scientific instrument production in the Holy Roman Empire, its craftsmen renowned for elaborate table clocks, astronomical instruments, and automata exported across Europe."
 clocks_events.11.a: "Grant the charter."
 clocks_events.11.b: "Let them remain as they are."

 clocks_events.12.title: "The Nuremberg Clockmakers' Guild"
 clocks_events.12.desc: "For generations, the clockmakers of [target_location.GetName] have practiced under the shadow of the locksmiths' guild, their trade too new to warrant recognition of its own. Now the city council proposes to formalize the craft of [clocks.GetName] in earnest, for a master must henceforth submit a masterwork of true sophistication, a striking table clock complete with astrolabe and calendar, before earning the right to call himself a master clockmaker. Such standards would raise the bar for every workshop in the city, and with it, the renown of Nuremberg's timepieces across [ShowContinentName('europe')]."
 clocks_events.12.entry: "The Nuremberg Clockmakers' Guild"
 clocks_events.12.historical_info: "In 1565, the Nuremberg city council formalized guild requirements for clockmakers seeking master status, mandating the production of a masterpiece - typically a striking table clock featuring an astronomical dial and calendar - within a set period. This built on Nuremberg's decades-long reputation as a center of horological craft, cementing the city alongside Augsburg as one of the twin capitals of German clockmaking."
 clocks_events.12.a: "Formalize the guild requirements."
 clocks_events.12.b: "Leave the craft as it stands."

 clocks_events.13.title: "The Great Clock of Strasbourg"
 clocks_events.13.desc: "For decades the cathedral of [target_location.GetName] has stood with its old clock silent, its construction abandoned amid the deaths of its architects and the turmoil of religious strife. Now a mathematician #italic Conrad Dasypodius#!, pupil of the clock's original designer, proposes to finish what was begun a generation ago. He wishes for the clock to be adorned with painted panels, moving statues, and a mechanical rooster to crow the hour and the device would chart the movements of sun, moon, and planets, calculate the date of Easter for centuries to come, and stand as a monument to the union of science and craft in [target_nation.GetName]."
 clocks_events.13.entry: "The Great Clock of Strasbourg"
 clocks_events.13.historical_info: "The second Strasbourg Cathedral astronomical clock was completed in 1574, its construction resumed after decades of interruption under the direction of mathematician Conrad Dasypodius, pupil of the original designer Christian Herlin. Built chiefly by the Swiss clockmaker brothers Isaac and Josias Habrecht, with astronomical, artistic, and musical elements contributed by several collaborators, it featured a calendar, astrolabe, planetary dials, moving statues, a six-tune carillon, and a mechanical rooster - a synthesis of the most advanced scientific knowledge of its age. It remained in operation for over two centuries before being succeeded by a third clock in the 19th century."
 clocks_events.13.a: "Complete the great clock."
 clocks_events.13.b: "The old clock's silence will remain."
 strasbourg_cathedral_clock: "Strasbourg Cathedral Clock"
 strasbourg_cathedral_clock_desc: "A magnificent clockwork marvel adorns the cathedral, its intricate mechanisms measuring the hours and the movements of the heavens while showcasing the ingenuity of Strasbourg's craftsmen."

 clocks_events.16.title: "The Voyage of H4"
 clocks_events.16.desc: "For decades [john_harrison.GetName] has labored in obscurity, chasing the great prize offered by Parliament for any device that can solve the longitude problem at sea. His latest creation is unlike nothing like the earlier bulky sea [clocks.GetName], but instead a compact, watch-sized instrument he calls H4, said to keep time with great precision even amid the pitch and roll of the open ocean."
 clocks_events.16.entry: "The Voyage of H4"
 clocks_events.16.historical_info: "John Harrison's H4 marine chronometer was tested on a voyage to Jamaica in 1761, carried by his son William Harrison. Over the roughly two-month voyage, the watch lost only about five seconds, far exceeding the accuracy required to win the Longitude Prize, though Harrison would face years of further disputes with the Board of Longitude before receiving full recognition and reward for his achievement."
 clocks_events.16.a: "Fund the voyage."
 clocks_events.16.b: "We will not gamble on his claims."

 clocks_events.17.title: "The Tourbillon"
 clocks_events.17.desc: "[abraham_louis_breguet.GetName], already the most celebrated watchmaker in [capital.GetName], claims to have solved a problem that has plagued fine [clocks.GetName] for a century, namely the way gravity itself disturbs a watch's accuracy depending on how it is held or worn. His invention, a rotating cage he calls the tourbillon, carries the escapement and balance wheel through a full revolution every minute, canceling out the errors that come from any fixed position."
 clocks_events.17.entry: "The Tourbillon"
 clocks_events.17.historical_info: "Abraham-Louis Breguet, a Swiss-born watchmaker working in Paris, received a ten-year patent for his tourbillon regulator on 26 June 1801. The rotating cage mechanism compensated for the effects of gravity on a watch's escapement by continuously cycling its orientation, dramatically improving accuracy. Though difficult and costly to produce the tourbillon became renowned as one of the most prestigious complications in fine watchmaking, a status it retains to this day."
 clocks_events.17.a: "Support his invention."
 clocks_events.17.b: "We cannot spare the funds."

 # Mirrors
 clocks_events.30.title: "Jan van Eyck"
 clocks_events.30.desc: "A painter of remarkable precision, [jan_van_eyck.GetName] has found favor among the [burghers.GetName] of [target_nation.GetName] for his unmatched skill with oils, rendering fabric, light, and reflection with an exactness few can rival. Word is that his current commission includes a small convex mirror, painted so faithfully that it seems to show the entire room reflected within its glass, tiny figures and all. Such mastery of light and surface would bring great distinction to any court he serves."
 clocks_events.30.entry: "Jan van Eyck"
 clocks_events.30.historical_info: "Jan van Eyck was a Flemish painter renowned for his technical precision and innovative use of oil paint. His 1434 double portrait now known as the Arnolfini Portrait features a small convex mirror on the rear wall, painted in extraordinary detail to reflect the room and its occupants, one of the most celebrated depictions of a mirror in Western art, and a showcase of the sophistication Flemish glassmaking and painting had achieved by the early 15th century."
 clocks_events.30.a: "Welcome him to court."
 clocks_events.30.b: "We have no need of painters."
 van_eyck: "van Eyck"

 clocks_events.31.title: "The Arnolfini Portrait"
 clocks_events.31.desc: "[jan_van_eyck.GetName] has completed a commission for the Italian merchant #italic Giovanni Arnolfini#!, a double portrait of the man and his wife within their own home, rendered with such exactitude that every fold of fabric, every gleam of brass, seems almost real enough to touch. At the very center of the composition hangs a small convex mirror, painted in miniature perfection, reflecting the room and its occupants entire."
 clocks_events.31.entry: "The Arnolfini Portrait"
 clocks_events.31.historical_info: "The Arnolfini Portrait, painted by Jan van Eyck in 1434, depicts the Italian merchant Giovanni di Nicolao Arnolfini and his wife in their home in Bruges. At the center of the composition hangs a convex mirror reflecting the entire room in miniature, including two additional figures, one possibly van Eyck himself, entering through the doorway behind the viewer. The painting is considered one of the greatest technical achievements of Early Netherlandish art and a landmark demonstration of the possibilities of oil paint."
 clocks_events.31.a: "A Masterpiece."
 arnolfini_portrait: "Arnolfini Portrait"
 arnolfini_portrait_desc: "A remarkable portrait captures the likeness of a wealthy merchant and his bride, its intricate detail and rich colours displaying the growing mastery of Netherlandish painters."

 clocks_events.32.title: "Parmigianino"
 clocks_events.32.desc: "A young painter from [target_location.GetName], barely out of his apprenticeship, is already being spoken of as a prodigy. [parmigianino.GetName], called #italic Parmigiaino#! for the city of his birth, has absorbed the lessons of #italic Correggio#! and made them his own, with an elegance and inventiveness that seem far beyond his years. Some say he means to travel to [rome.GetName] to try his fortune before the Pope himself. A court that secures his talent first may reap the rewards of a long and remarkable career."
 clocks_events.32.entry: "Parmigianino"
 clocks_events.32.historical_info: "Girolamo Francesco Maria Mazzola, known as Parmigianino after his native city of Parma, was an Italian Mannerist painter whose precocious talent was already evident in his early twenties. Trained partly under the influence of Correggio, he would go on to travel to Rome in 1524 seeking papal patronage, and became one of the defining painters of the early Mannerist style, celebrated for his elegant, elongated figures and inventive compositions."
 clocks_events.32.a: "Welcome the young painter to our court instead."
 clocks_events.32.b: "We have no need of him."

 clocks_events.33.title: "Self-Portrait in a Convex Mirror"
 clocks_events.33.desc: "Barely twenty-one years old, [parmigianino.GetName] has completed a portrait unlike any that has come before it, not of himself as he is, but as he appears reflected in a barber's convex mirror, his hand looming enormous in the foreground while the room behind him bends and warps around the glass's curve. He has even paidnted it on a specially shaped wooden panel, cut and rounded to mimic the very mirror he studied. He means to carry it to [rome.GetName] as proof of his skill, a single dazzling object meant to announce his talent to the world, and, he hopes, to the Pope himself."
 clocks_events.33.entry: "Self-Portrait in a Convex Mirror"
 clocks_events.33.historical_info: "Parmigianino painted his Self-Portrait in a Convex Mirror around 1523, at about twenty-one years of age. Executed on a specially prepared convex wooden panel to replicate the distortions of the mirror he used as his model, the work exaggerates his hand in the foreground while bending the surrounding room. He brought it to Rome in 1524 as a demonstration piece for Pope Clement VII, and it remains one of the most celebrated and technically audacious self-portraits of the Renaissance."
 clocks_events.33.a: "Display the self-portrait."
 self_portrait_convex_mirror: "Self-Portrait in a Convex Mirror"
 self_portrait_convex_mirror_desc: "A remarkable study of the artist's own likeness, its distorted reflection displaying a fascination with perspective, light, and the strange possibilities of painting."

 clocks_events.34.title: "The Venetian Mirror Trade"
 clocks_events.34.desc: "The glassworkers of Murano have perfected a secret their guild guards jealously, a technique for backing sheets of the clearest crystal glass with a thin layer of [tin.GetName] and [mercury.GetName], producing [mirrors.GetName] of a clarity and size unlike anything else in [ShowContinentName('europe')]. Many wealthy patrons pay extraordinary sums to acquire even a single example. Encouraging this trade further, and guarding the secret of its making, could turn [target_nation.GetAdjective] mirrors into one of the most coveted luxuries on the continent."
 clocks_events.34.entry: "The Venetian Mirror Trade"
 clocks_events.34.historical_info: "From the 1500s onward, the glassmawakers of Murano, an island in the Venetian lagoon, developed and jealously guarded techniques for producing large, clear mirror glass backed with a tin-mercury amalgam. By the mid-16th century, Venetian mirrors had become a coveted luxury export, sought after by royal and noble courts across Europe, and the Republic went to considerable lengths - including threats against glassworkers who left the city with their trade secrets - to preserve its near-monopoly on the craft."
 clocks_events.34.a: "Foster the glassmakers' trade."
 clocks_events.34.b: "Leave the guild to its own affairs."
 clocks_venetian_mirror_glass: "Venetian Mirrors"

 clocks_events.35.title: "Caravaggio"
 clocks_events.35.desc: "A young painter from [milano.GetName] has arrived in [target_location.GetName], penniless and quarrelsome, but with a talent for realism that unsettles as much as it impresses. [caravaggio.GetName], already known simply as #italic Caravaggio #!, paints saints with the dirt-streaked feet of peasants and plunges his figures into darkness so absolute that only a shaft of light reveals them. His manner has already made him enemies among the more conventional masters, but those who have seen his work say it is unlike anything painted before."
 clocks_events.35.entry: "Caravaggio"
 clocks_events.35.historical_info: "Michelangelo Merisi da Caravaggio arrived in Rome in the early 1590s after training in Milan, where he developed the dramatic use of light and shadow called tenebrism that would define his style and influence generations of Baroque painters. Volatile and often embroiled in violence, Caravaggio nonetheless became one of the most sought-after and imitated painters of his era before his death in exile following a fatal brawl in 1606."
 clocks_events.35.a: "Welcome him to court."
 clocks_events.35.b: "His reputation precedes him unfavorably."

 clocks_events.36.title: "Narcissus"
 clocks_events.36.desc: "[caravaggio.GetName] has turned his brush to an old myth, but rendered it in a way none before him have dared. His #italic Narcissus#! kneels alone at the edge of a black pool, bent double over his own reflection, the whole composition folding into a single unbroken circle of flesh and water. There is no landscape, no temple, no chorus of nymphs, only the youth, his shadow-self staring back, and the darkness that swallows all else."
 clocks_events.36.entry: "Narcissus"
 clocks_events.36.historical_info: "Narcissus, painted by Caravaggio around 1597, depicts the youth of Ovid's Metamorphoses transfixed by his own reflection in a pool of water. The composition forms a near-perfect circle between the figure and his mirrored double, set against Caravaggio's characteristic void of darkness. Long debated in its attribution, the painting was formally credited to Caravaggio by art historian Roberto Longhi in 1916 and today hangs in the Galleria Nazionale d'Arte Antica in Rome."
 clocks_events.36.a: "Display the painting."
 narcissus: "Narcissus"
 narcissus_desc: "A haunting depiction of the youth who could not tear his gaze from his own reflection, exploring the beauty of the human form and the peril of vanity."

 clocks_events.37.title: "Jan Brueghel the Elder"
 clocks_events.37.desc: "The son of the great Pieter Bruegel has made a name entirely his own. [jan_brueghel_the_elder.GetName], painter at the court of [vienna.GetName], is celebrated for his minute and jewel-like detail. He paints crowded cabinets of curiosities, garlands of flowers rendered petal by petal, and gleaming instruments and mirrors reflecting entire rooms in miniature. A painter of such precision, welcomed at court, would find no shortage of wondrous collections worth committing to canvas."
 clocks_events.37.entry: "Jan Brueghel the Elder"
 clocks_events.37.historical_info: "Jan Brueghel the Elder, son of Pieter Bruegel the Elder, was a Flemish painter renowned for his extraordinarily fine detail, particularly in flower still lifes and elaborate allegorical scenes depicting collections of art, scientific instruments, and curiosities. As court painter to Archduke Albert VII and Archduchess Isabella in Antwerp, he later collaborated with Peter Paul Rubens on the celebrated Five Senses series, whose Allegory of Sight prominently features a mirror alongside telescopes and other instruments of vision."
 clocks_events.37.a: "Welcome him to our court."
 clocks_events.37.b: "We have no need of him."

 clocks_events.38.title: "Allegory of Sight"
 clocks_events.38.desc: "[jan_brueghel_the_elder.GetName] has completed the first of a most ambitious series, an allegory of the senses, painted in collaboration with the celebrated #italic Peter Paul Rubens#!. His panel for Sight depicts Venus and Cupid within a princely gallery crowded beyond counting: telescopes and spectacles, gilded frames and marble busts, a great mirror reflecting the room entire, and canvas after canvas rendered so precisely that each could be studied as a painting in its own right. It is less a single work than an inventory of vision itself - every instrument, every reflection, every way that light may be caught and understood."
 clocks_events.38.entry: "Allegory of Sight"
 clocks_events.38.historical_info: "Allegory of Sight, painted around 1617 by Jan Brueghel the Elder in collaboration with Peter Paul Rubens, depicts Venus and Cupid within an opulent gallery filled with paintings, scientific instruments, and curiosities, including one of the earliest known depictions of a telescope in art. It formed part of a larger series on the Five Senses (1617-1618), now held in the Museo del Prado, and reflects the encyclopedic collecting culture of the Habsburg Netherlandish court under Archduke Albert VII and Archduchess Isabella."
 clocks_events.38.a: "Display the painting."
 allegory_of_sight: "Allegory of Sight"
 allegory_of_sight_desc: "A celebration of vision and the arts, where instruments, paintings, and precious objects reveal the growing fascination with sight, knowledge, and the wonders of the natural world."

 clocks_events.39.title: "English Mirror Glass"
 clocks_events.39.desc: "For as long as any merchant can recall, the finest [mirrors.GetName] have come from a single source, the glassworks of [venice.GetName], jealously guarded and dearly priced. #italic Sir Robert Mansell#!, already holder of the monopoly on [target_nation.GetAdjective] glass, proposes to end that dependence. He has brought foreign craftsmen to his glasshouse in [london.GetName], skilled in the cylinder method of blowing and flattening [glass.GetName], and believes English hands can produce mirror plate to rival anything Venice sends abroad. Success would mean coin kept at home that once crossed the sea to [ShowRegionName('italy_region')], and a new industry besides."
 clocks_events.39.entry: "English Mirror Glass"
 clocks_events.39.historical_info: "English manufacture of mirror glass began around 1625 at Sir Robert Mansell's glasshouse in London, which held a royal monopoly on English glass production from 1615. Using the cylinder process, blowing glass into cylinders, which were then split and flattened, Mansell's workshop, staffed partly by foreign craftsmen, produced England's first domestically made mirror glass, breaking the country's long dependence on imports from Venice."
 clocks_events.39.a: "Support the new glasshouse."
 clocks_events.39.b: "Venetian glass will suffice."

 clocks_events.40.title: "Gerrit Dou"
 clocks_events.40.desc: "Trained as a glazier under his own father before apprenticing with the celebrated #italic Rembrandt#!, a young painter of [leiden.GetName] named [gerrit_dou.GetName] has begun to draw remarkable attention. His method is unlike any other, he paints with the aid of a concave lens and a convex mirror, using the tools of his father's trade to sharpen his eye and correct his perspective, achieving a polish and precision that seems almost to defy the brush. Some say he spends five days on a single hand. Whatever the truth, his small and jewel-like panels already command prices few painters half his age could dream of."
 clocks_events.40.entry: "Gerrit Dou"
 clocks_events.40.historical_info: "Gerrit Dou was a Dutch Golden Age painter from Leiden, trained first as a glazier under his glassmaker father before studying under Rembrandt. He founded the Leiden fijnschilder tradition, known for small, meticulously detailed panels achieved partly through the use of a concave lens and convex mirror to aid his perception and perspective. He remained in Leiden his whole life, even declining an invitation from King Charles II of England, and enjoyed an international reputation and high prices for his work."
 clocks_events.40.a: "Welcome him to court"
 clocks_events.40.b: "We have no need of him"

 clocks_events.41.title: "The Manufacture Royale des Glaces de Miroirs"
 clocks_events.41.desc: "Minister Colbert has long chafed at the sums that flow yearly out of the treasury and into the coffers of [venice.GetName] for the finest [mirrors.GetName] in [ShowContinentName('europe')]. His solution is a royal manufactory of our own, established here in [target_location.GetName], staffed by artisans lured away from Murano itself at considerable expense and no small risk to their persons. Should the venture succeed, [target_nation.GetName] need never again depend on a foreign monopoly for glass fit to grace the halls of kings."
 clocks_events.41.entry: "The Manufacture Royale des Glaces de Miroirs"
 clocks_events.41.historical_info: "The Manufacture royale de glaces de miroirs was established by royal letters patent in October 1665 under the direction of Jean-Baptiste Colbert, financed in part by the state and granted a twenty-year monopoly on French mirror and glass production. Established in the Faubourg Saint-Antoine of Paris with the help of Venetian glassworkers - some smuggled out of Murano at great risk - the enterprise would go on to produce the mirrors for the Hall of Mirrors at Versailles and eventually became the company known today as Saint-Gobain."
 clocks_events.41.a: "Establish the royal manufactory."
 clocks_events.41.b: "I fear we will remain dependent on Venice."
 STATIC_MODIFIER_NAME_mirror_manufacture_royale: "Royal Mirror Manufactury"
 STATIC_MODIFIER_DESC_mirror_manufacture_royale: "A royal manufactury dedicated to the production of fine mirrors, bringing together skilled craftsmen and costly techniques to produce glass worthy of the finest palaces."

 clocks_events.42.title: "The Hall of Mirrors"
 clocks_events.42.desc: "The royal architect proposes a gallery unlike any other in [ShowContinentName('europe')], a corridor running the length of the palace at #italic Versailles#!, its walls lined not with tapestries or paintings, but with hundreds of [mirrors.GetName], each pane forged by the crown's own glassworks. Set opposite a row of arched windows overlooking the gardens, the mirrors would flood the hall with reflected light, doubling every candle and every gilded ornament into infinity. Such a chamber would announce, more plainly than any decree, that [target_nation.GetName] now rivals, nay surpasses, [venice.GetName] in the very art the Venetians once claimed as theirs alone."
 clocks_events.42.entry: "The Hall of Mirrors"
 clocks_events.42.historical_info: "The Hall of Mirrors (Galerie des Glaces) at the Palace of Versailles was constructed between 1678 and 1684 under the direction of architect Jules Hardouin-Mansart, its 357 mirrors supplied by the newly established Manufacture royale de glaces de miroirs. Facing a row of seventeen arched windows overlooking the gardens, the mirrored gallery became one of the most celebrated interiors in Europe and a powerful symbol of French industrial and artistic ascendancy over Venice's former glass monopoly."
 clocks_events.42.a: "Commission the great hall."
 clocks_events.42.b: "The expense cannot be justified."
 hall_of_mirrors: "Hall of Mirrors"
 hall_of_mirrors_desc: "An extraordinary gallery lined with mirrors, multiplying the splendour of the court and proclaiming the wealth, refinement, and power of its patron."

 clocks_events.60.title: "Gemma Frisius"
 clocks_events.60.desc: "A physician and mathematician at the University of [leuven.GetName], [gemma_frisius.GetName] has turned his considerable talents toward crafting [precision_instruments.GetName], crafting globes, astrolabes, and astronomical rings of a precision that has already drawn admiration from scholars across [ShowContinentName('europe')]. His latest proposal is stranger still, a method he calls #italic triangulation#!, by which the distance to any place may be calculated using nothing more than angles measured from two known points. Such a mind, applied to surveying, mapmaking, or navigation, could prove immensely valuable to any realm wise enough to claim it."
 clocks_events.60.entry: "Gemma Frisius"
 clocks_events.60.historical_info: "Gemma Frisius was a Dutch physician, mathematician, cartographer, and instrument maker based at the University of Leuven. In 1533 he became the first to describe triangulation as a method for accurate surveying, and he later proposed using precise clocks to determine longitude at sea. His workshop, in collaboration with engraver Gaspard van der Heyden and later his student Gerardus Mercator, produced globes and astronomical instruments renowned across Europe for their accuracy, including the astronomical rings that still bear his name."
 clocks_events.60.a: "Welcome him to court."
 clocks_events.60.b: "We have no need of him."

 clocks_events.63.title: "Jost Bürgi"
 clocks_events.63.desc: "A [culture.GetName] clockmaker of remarkable and largely self-taught skill, [jost_burgi.GetName], has entered service seeking a patron worthy of his talents. He claims to have devised a new form of escapement, a #italic cross-beat mechanism#!, he calls it, that regulates the ticking of [clocks.GetName] with an accuracy twenty times greater than any before it, precise enough to time the very crossing of stars through the sights of an instrument. Such precision would make his clocks not mere timepieces, but genuine tools of astronomical science."
 clocks_events.63.entry: "Jost Bürgi"
 clocks_events.63.historical_info: "Jost Bürgi was a Swiss clockmaker, instrument maker, and mathematician who entered the service of Landgrave Wilhelm IV of Hesse-Kassel in 1579. Working at Kassel's observatory, one of the first buildings purpose-built for astronomical observation, Bürgi developed the cross-beat escapement, dramatically improving clock accuracy and making them useful as genuine scientific instruments for timing stellar observations. He later worked for Emperor Rudolf II in Prague alongside Johannes Kepler, and is credited as an independent inventor of logarithms."
 clocks_events.63.a: "Welcome him to court."
 clocks_events.63.b: "We have no need of him."

 clocks_events.64.title: "Blaise Pascal"
 clocks_events.64.desc: "A prodigy barely out of his teens has built something that seems to defy explanation, a box of interlocking brass gears and dials that can add and subtract sums of any size, its wheels turning with each entry to carry tens automatically from one digit to the next. [blaise_pascal.GetName] says he built it to spare his father, a tax collector at [target_location.GetName], the tedium of endless columns of figures. Whatever its origin, such a machine hints at a future for [target_nation.GetName] where calculation itself might be mechanized."
 clocks_events.64.entry: "Blaise Pascal"
 clocks_events.64.historical_info: "Blaise Pascal invented the Pascaline, an early mechanical calculator, around 1642 at the age of nineteen, to assist his father's work as a tax supervisor in Rouen. The device could add and subtract directly, and multiply or divide through repeated operations, using an ingenious carry mechanism that let each digit dial operate independently. Pascal built around fifty prototypes and roughly twenty further machines over the following years, and in 1649 received a royal privilege granting him exclusive rights to manufacture calculating machines in France."
 clocks_events.64.a: "Welcome him to court."
 clocks_events.64.b: "We have no need of him."

 clocks_events.65.title: "Robert Hooke"
 clocks_events.65.desc: "A restless and prodigiously talented natural philosopher, [robert_hooke.GetName], has already turned his hand to more [precision_instruments.GetName] and discoveries than most men manage in a lifetime, improved microscopes, a wheel barometer, a universal joint for machinery, even a spring to regulate a watch's balance wheel, developed at the very same time as a rival across the sea in [ShowAreaName('holland_area')]. His latest ambition is grander still, a book of engravings showing the hidden world revealed by the microscope, down to the very structure of cork and the eye of a fly."
 clocks_events.65.entry: "Robert Hooke"
 clocks_events.65.historical_info: "Robert Hooke was an English natural philosopher and instrument maker whose 1665 book Micrographia, illustrated with his own detailed engravings from microscope observations, became a scientific sensation and introduced the term 'cell' to biology. A brilliant and prolific inventor, Hooke also devised the balance spring for watches independently of Christiaan Huygens, built an early reflecting telescope, formulated Hooke's Law of elasticity, and served as Curator of Experiments for the Royal Society."
 clocks_events.65.a: "Welcome him to court."
 clocks_events.65.b: "We have no need of him."

 clocks_events.66.title: "The Royal Observatory"
 clocks_events.66.desc: "The problem of longitude at sea has plagued mariners for generations, costing ships and lives on voyages that ought to have reached safe harbor. A proposal has reached the crown to found a new observatory at #italic Greenwich Burough#! in [target_location.GetName], staffed with the finest [precision_instruments.GetName] money can buy and an astronomer charged with charting the stars and the moon with such precision that a captain, far from any shore, might reckon his position by the heavens alone."
 clocks_events.66.entry: "The Royal Observatory"
 clocks_events.66.historical_info: "The Royal Observatory at Greenwich was founded in 1675 by King Charles II, with the building designed by Christopher Wren and construction overseen partly by Robert Hooke. Its purpose, as stated in the founding warrant, was 'the finding out of the longitude of places for perfecting navigation and astronomy.' The first Astronomer Royal, John Flamsteed, began a decades-long program of precise stellar observation there, laying the groundwork for solving the longitude problem and later establishing Greenwich as the global reference point for time and longitude."
 clocks_events.66.a: "Found the observatory."
 clocks_events.66.b: "The expense cannot be justified."
 royal_observatory: "Royal Observatory"
 royal_observatory_desc: "A centre of astronomical study where learned men chart the heavens, refine their instruments, and seek ever greater precision in the measurement of time and the movements of the stars."
 royal_observatory_maintenance: "Royal Observatory"

 clocks_events.67.title: "John Hadley's Reflector"
 clocks_events.67.desc: "For decades, astronomers have chased the promise of #italic Isaac Newton's#! reflecting telescope, its mirrors said to gather light without the color-fringed distortions that plague ordinary lenses. Yet every attempt to build one larger than a curiosity has failed for the [mirrors.GetName] too difficult to grind, too easily flawed. [john_hadley.GetName] believes he has solved it, presenting before the Royal Society a reflector six feet long with a mirror six inches across, ground and polished to a true parabolic curve."
 clocks_events.67.entry: "John Hadley's Reflector"
 clocks_events.67.historical_info: "John Hadley presented the first large, practical Newtonian reflecting telescope to the Royal Society on 12 January 1721, succeeding where earlier attempts by Newton and James Gregory had produced only small or unreliable instruments. His reflector, with a six-inch parabolic mirror and roughly six-foot tube, achieved magnifications of around 200 times, far surpassing Newton's original. Hadley's success and subsequent designs helped bring reflecting telescopes into general astronomical use; he later invented the reflecting octant, a precursor to the marine sextant, in 1730."
 clocks_events.67.a: "Support his work."
 clocks_events.67.b: "We have no need of him."

 clocks_events.68.title: "The Greenwich Meridian"
 clocks_events.68.desc: "The #italic Royal Observatory#! has grown weary of [precision_instruments.GetName] that bend and buckle under their own weight, throwing measurements into doubt. The observatory has found a solution in the instrument maker [john_bird.GetName], a former watchmaker whose skill at dividing and casting metal is said to be unmatched in the realm, and who now proposes a great mural quadrant, eight feet across and accurate to a fraction of a minute of arc. With such an instrument fixed permanently to the observatory wall, the heavens themselves might finally be measured with a precision worthy of the age."
 clocks_events.68.entry: "The Greenwich Meridian"
 clocks_events.68.historical_info: "John Bird was a former watchmaker turned instrument maker who completed an eight-foot brass mural quadrant for the Royal Observatory at Greenwich in June 1750, commissioned by Astronomer Royal James Bradley. Unlike earlier iron instruments, which sagged and lost accuracy under their own weight, Bird's brass quadrant remained accurate to within a fraction of a degree for over sixty years of continuous use. Its precision made it the standard against which observatories across Europe - from St. Petersburg to Cadiz to Paris - commissioned their own duplicates, cementing Greenwich's role at the center of practical astronomy."
 clocks_events.68.a: "Commission the great quadrant."
 clocks_events.68.b: "The expense cannot be justified."

 clocks_events.69.title: "Jesse Ramsden's Dividing Engine"
 clocks_events.69.desc: "For as long as [precision_instruments.GetName] have divided the circular scales on sextants and theodolites, the work has been done by hand, which is painstaking, slow, and never perfectly consistent from one instrument to the next. [jesse_ramsden.GetName] believes he has found a way to remove human error from the equation entirely with a mahogany-framed machine of his own design, capable of dividing an arc into precise fractions of a degree with mechanical exactness."
 clocks_events.69.entry: "Jesse Ramsden's Dividing Engine"
 clocks_events.69.historical_info: "Jesse Ramsden, an English instrument maker, completed the definitive version of his dividing engine in 1775, a machine capable of mechanically graduating the circular scales of sextants, theodolites, and telescopes to an accuracy of under half a second of arc, a dramatic improvement over hand division. The Board of Longitude paid him for the design in 1777, and his innovation, refined further into a circular dividing engine, became foundational to the precision instrument industry and to projects such as Britain's national triangulation survey."
 clocks_events.69.a: "Support his engine."
 clocks_events.69.b: "We have no need of him."

 clocks_events.70.title: "Reichenbach & Ertel"
 clocks_events.70.desc: "In [target_location.GetName], a former engineer named [georg_von_reichenbach.GetName] has founded a workshop that promises to bring German the making of [precision_instruments.GetName] to a level unmatched anywhere in [ShowContinentName('europe')]. With his partner [traugott_ertel.GetName], a blacksmith turned master mechanic, Reichenbach proposes something novel, a meridian circle, combining the separate functions of the transit instrument and the mural circle into a single device of unprecedented accuracy."
 clocks_events.70.entry: "Reichenbach & Ertel"
 clocks_events.70.historical_info: "Georg von Reichenbach and Traugott Ertel partnered in Munich from 1814, forming the celebrated Mathematisch-Mechanisches Institut Reichenbach & Ertel. Reichenbach's chief innovation was the meridian (or transit) circle, combining the functions of the transit instrument and mural circle into a single, more accurate device. The firm's instruments, particularly its meridian circles and theodolites, were commissioned by observatories across Europe - especially in Russia, where they equipped major institutions including the observatory at Tartu (Dorpat) and, later, Pulkovo."
 clocks_events.70.a: "Support their institute."
 clocks_events.70.b: "We have no interest in their work."

 clocks_events.80.title: "Hans Lippershey's Kijker"
 clocks_events.80.desc: "An [optics.GetName]-maker from [target_location.GetName], by the name of [hans_lippershey.GetName], claims to have stumbled upon something remarkable while grinding lenses for his shop. He made a simple tube fitted with two glasses, one convex and one concave, that makes distant objects appear as though they stood nearby. He calls it a #italic kijker#!, or 'looker,' and has petitioned the States General for a patent and exclusive rights to its manufacture."
 clocks_events.80.entry: "Hans Lippershey's Kijker"
 clocks_events.80.historical_info: "Hans Lippershey, a spectacle-maker of Middelburg, submitted the earliest known written patent application for a telescope to the States General of the Netherlands on 2 October 1608, calling his instrument a kijker. Though his request for an exclusive patent was denied, officials noted the device was too simple to keep secret, especially once rival claimants Jacob Metius and Sacharias Janssen came forward, the States General rewarded him with 900 florins. News of the invention spread rapidly across Europe within months, reaching Galileo Galilei by 1609."
 clocks_events.80.a: "Reward the invention."
 clocks_events.80.b: "We have no need of him."

 clocks_events.83.title: "Francesco Fontana"
 clocks_events.83.desc: "A lawyer of [target_location.GetName] turned lens-grinder, [francesco_fontana.GetName] claims to have built a telescope of his own design years before word of Galileo's instrument ever reached these shores. Using two convex lenses rather than a convex and concave pair, it yields a wider field of view, if an inverted image. Whatever the truth of his claim to priority, his drawings of the Moon's surface, painstakingly rendered through his own glass, are said to be the most detailed anyone has yet produced."
 clocks_events.83.entry: "Francesco Fontana"
 clocks_events.83.historical_info: "Francesco Fontana was a Neapolitan lawyer and self-taught optician who claimed to have built a telescope using two convex lenses, the same design later formalized by Kepler, as early as 1608, well before Galileo's instrument became known. Whatever the truth of that claim, Fontana was demonstrably active by the late 1620s producing detailed telescopic drawings of the Moon, among the most accurate of his era, and speculated on the possible existence of additional moons around Jupiter, Venus, and Saturn."
 clocks_events.83.a: "Support his work."
 clocks_events.83.b: "We have no need of him."

 clocks_events.84.title: "Evangelista Torricelli"
 clocks_events.84.desc: "Named #italic Granducal Mathematician#! after Galileo's own recommendation, [evangelista_torricelli.GetName] has proven himself no mere theorist. Beyond his work on geometry and the vacuum, he has developed a rare and lucrative skill at grinding telescope lenses, melting his own glass and shaping it with such precision that [optics.GetName]-makers across Italy seek his methods, jealously guarded though they are."
 clocks_events.84.entry: "Evangelista Torricelli"
 clocks_events.84.historical_info: "Evangelista Torricelli succeeded Galileo as court mathematician to Grand Duke Ferdinando II de' Medici in Florence in 1642. Alongside his renowned work inventing the mercury barometer and advancing the mathematics of indivisibles, Torricelli developed exceptional skill in lens grinding and glassworking, producing telescope and microscope lenses of remarkable quality, some later found, under 20th-century analysis, to be machined with extraordinary precision. His lens-grinding techniques, detailed in private correspondence, contributed significantly to the broader development of optical instrument-making in 17th-century Italy."
 clocks_events.84.a: "Support his workshop in Florence."
 clocks_events.84.b: "We have no need of him."
 STATIC_MODIFIER_NAME_clocks_torricelli_optics_workshop: "Torricelli's Optics Workshop"
 STATIC_MODIFIER_DESC_clocks_torricelli_optics_workshop: "Evangelista Torricelli's mastery of lens grinding and glassworking has drawn scholars and artisans to Florence, quickening the pace of research in the city."

 clocks_events.85.title: "Micrographia"
 clocks_events.85.desc: "[robert_hooke.GetName] has completed a work unlike anything printed before it, a great volume of engravings drawn from his own observations through the compound microscope, revealing a world invisible to the naked eye. Fleas rendered larger than a man's hand, the honeycomb structure of cork he calls #italic cells#!, the eye of a fly magnified beyond recognition. Each plate in his #italic Micrographia#! is truly more astonishing than the last."
 clocks_events.85.entry: "Micrographia"
 clocks_events.85.historical_info: "Robert Hooke's Micrographia was published in January 1665, presenting his detailed observations and illustrations made using a compound microscope of his own design. The book introduced the term 'cell' to biology, following his observation of the honeycomb-like structure of cork, and became an immediate popular and scientific sensation. Samuel Pepys famously called it 'the most ingenious booke that ever I read in my life.' It remains one of the most influential works in the history of microscopy and scientific illustration."
 clocks_events.85.a: "Publish the work."
 micrographia: "Micrographia"
 micrographia_desc: "A remarkable study of the hidden world beneath the naked eye, revealing the astonishing detail of insects, plants, and other minute structures through the use of the microscope."

 # Great Works of Art
 ARTIST_TYPE_NAME_mechanical_engineer: "Mechanical Engineer"
 ARTIST_TYPE_DESC_mechanical_engineer: "Mechanical engineers apply principles of mathematics, physics, and craftsmanship to the design and construction of machines and mechanisms."
 astronomical_clock: "Astronomical Clock"
 astronomical_clock_desc: "A monumental clock combining timekeeping with an astronomical dial, tracking the position of the sun, moon, and zodiac alongside the hour, often mounted in a town hall or cathedral tower."
 automaton: "Automaton"
 automaton_desc: "A mechanical figure, powered by clockwork or spring-driven gears, built to move, gesture, or perform as though alive, prized as a marvel of engineering as much as a work of art."
 orrery: "Orrery"
 orrery_desc: "A geared mechanical model of the heavens, with orbiting spheres driven by clockwork to demonstrate the motion of the sun, moon, and planets."
 globe: "Globe"
 globe_desc: "A finely wrought sphere mapping either the earth or the heavens, often crafted in pairs and prized as much for their craftsmanship as their geographic or astronomical accuracy."
 armillary_sphere: "Armillary Sphere"
 armillary_sphere_desc: "A skeletal model of nested rings representing the great circles of the heavens, used by astronomers to calculate the positions of celestial bodies and by scholars to demonstrate the order of the cosmos."

