 MODIFIER_TYPE_DESC_mirrors_used_for_minting: "This determines if [ShowGoodsName('mirrors')] is used for coins in the [country|e]."
 MODIFIER_TYPE_NAME_ban_exports_of_mirrors: "Ban Exports of $mirrors$"
 MODIFIER_TYPE_DESC_ban_exports_of_mirrors: "This blocks the [export|e] of [ShowGoodsName('mirrors')] from all [markets|e] that a [country|e] owns."
 MODIFIER_TYPE_NAME_ban_imports_of_mirrors: "Ban Imports of $mirrors$"
 MODIFIER_TYPE_DESC_ban_imports_of_mirrors: "This blocks the [import|e] of [ShowGoodsName('mirrors')] to all [markets|e] that a [country|e] owns."
 MODIFIER_TYPE_NAME_local_mirrors_output_modifier: "Local $mirrors$ Output"
 MODIFIER_TYPE_DESC_local_mirrors_output_modifier: "This modifies the [output|e] of [ShowGoodsName('mirrors')] in this [location|e]."
