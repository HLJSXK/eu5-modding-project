 royal_glassworking_rights: "Glassworking Rights"
 royal_glassworking_rights_desc: "This [location|e] has been granted legal privileges over the production and distribution of [ShowGoodsName('glass')], conferring a significant competitive advantage."

 clocks_events.100.title: "A Clock for the Court"
 clocks_events.100.desc: "Word has reached the court of extraordinary [clocks.GetName] made by a clockmaker named [target_character.GetName] from [target_location.GetName] and commissioned by wealthy members of the nobility. The clocks' brass wheels and hidden springs mark the hours with uncanny precision, while their gilded cases are works of art in their own right."
 clocks_events.100.a: "We must have one of our own!"
 clocks_events.100.b: "Yes, quite pretty. Let's move on."

 clocks_events.101.title: "Keeping Better Time"
 clocks_events.101.desc: "The steady ticking of [clocks.GetName] is becoming a familiar sound in [target_location.GetName]. Merchants arrive when they promise, workshops open at appointed hours, and meetings no longer depend quite so much on the position of the sun. A town that once moved by custom is beginning to move by the clock."
 clocks_events.101.a: "A little order never hurts."

 clocks_events.102.title: "A Mechanical Wonder"
 clocks_events.102.desc: "A craftsman from [target_location.GetName] has unveiled a mechanical figure that bows, turns its head, and moves its hands with startling grace. Crowds gather to watch it perform, unsure whether to applaud the ingenuity or recoil from something that seems almost alive. Even the most learned among them struggle to explain how such a thing can be."
 clocks_events.102.a: "Let the court have a wonder of its own."
 clocks_events.102.b: "A clever toy, nothing more."

 clocks_events.103.title: "An Astrolabe for the Scholar"
 clocks_events.103.desc: "A learned scholar has come before us with an ambitious request. He requires an astrolabe of exceptional quality, costly enough to make even a generous patron hesitate. He insists that with the heavens rendered properly before him, he may chart courses, measure the movements of the stars, and perhaps uncover truths still hidden from mankind."
 clocks_events.103.a: "Give him the means to seek the truth."
 clocks_events.103.b: "We have better uses for such luxuries."

 clocks_events.104.title: "A Clearer World"
 clocks_events.104.desc: "One of our councillors has begun to struggle with his sight. Documents blur before him, seals must be held close to his face, and the man who once read a page at a glance now hesitates over every line. Yet there is talk of a new invention: carefully shaped lenses that might restore some of what age has taken."
 clocks_events.104.a: "Have spectacles made for him."
 clocks_events.104.b: "Age comes for us all."

 clocks_events.105.title: "A Fashionable Accessory"
 clocks_events.105.desc: "Spectacles, once the preserve of scholars and the infirm, have begun to appear in the finest drawing rooms. Some wear them out of necessity, while others wear them because the right pair lends an air of learning and distinction. In court, even an aid to failing eyesight can become an ornament."
 clocks_events.105.a: "Find me a fashionable pair."
 clocks_events.105.b: "We need not dress ourselves as scholars."

 clocks_events.106.title: "A Shattered Mirror"
 clocks_events.106.desc: "A great mirror has fallen from its mounting and broken upon the floor. Its silvered surface lies in a glittering ruin, while the room has fallen strangely silent. A servant crosses himself and a courtier mutters that broken glass never brings good fortune. Soon enough, everyone has found some old tale to explain the omen."
 clocks_events.106.a: "Oh, this is a dreadful sign."
 clocks_events.106.b: "It is only broken glass."

 clocks_events.107.title: "A Reflection of Wealth"
 clocks_events.107.desc: "[mirrors.GetName] are becoming easier to acquire, and the wealthy have discovered their particular power. Great looking-glasses now catch the light in halls and chambers, reflecting chandeliers, fine clothes, and the faces of those fortunate enough to possess them. A household may now display its riches not only for its guests, but back to itself."
 clocks_events.107.a: "Let our splendor be reflected."
 clocks_events.107.b: "A household needs no mirror to prove its worth."

 academic_events.100.title: "A Diaspora of Knowledge"
 academic_events.100.desc: "Though the banners of [winner.GetName] now fly over the [academy|e] of [location.GetName], its former glory has all but withered. The halls that once drew the brightest minds now stand beneath a foreign master, and before the siege began its scholars abandoned the libraries and lecture halls they called home."
 academic_events.100.a: "We shall rebuild this once proud academy."
 academic_events.100.b: "The Sword is mightier than the Pen."

 academic_events.101.title: "A Scholar in Exile"
 academic_events.101.desc: "He arrived with little more than the clothes on his back and the contents of his mind. Driven from [location.GetName] rather than serve its new master, [new_character.GetName] has found his way to our court. He asks for neither wealth nor office, but only the protection of our patronage, that he might continue his work beneath a roof where his thoughts need not bow to a foreign ruler."
 academic_events.101.scholar_arrives_tt: "A scholar has arrived at our court seeking patronage"
 academic_events.101.a: "Offer him our patronage."
 academic_events.101.b: "Turn him away."

 academic_events.80.title: "Too Many Academies"
 academic_events.80.desc: "Our academies have grown beyond what our coffers and scholars can properly support. Chairs sit unfilled, funding is stretched thin across too many halls, and it is plain that something must give. One of our academies will have to close."
 academic_events.80.a: "Close one immediately."
 academic_events.80.b: "We'll close one as soon as possible."
 
