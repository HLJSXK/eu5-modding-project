 # Game Concepts
 game_concept_academy: "Academy"
 game_concept_academy_i: "@academy!"
 game_concept_academy_desc: "An Academy is a location dedicated to advanced learning and [research|e]. As its [academic_tradition|e] grows, it contributes more to its [country|e]'s [academic_influence|e] and [research_progress|e]."
 game_concept_academic_influence: "Academic Influence"
 game_concept_academic_influence_i: "@academic_influence!"
 game_concept_academic_influence_desc: "Academic Influence is a resource a [country|e] accumulates from [locations|e] with an [academy|e] and may be spent on scholarly endeavors, such as inviting foreign scholars."
 game_concept_academic_tradition: "Academic Tradition"
 game_concept_academic_tradition_i: "@academic_tradition!"
 game_concept_academic_tradition_desc: "Academic Tradition reflects an [academy|e]'s current scholarly standing. It is a score that combines [literacy|e] and [academic_momentum|e]. The higher it is, the more [academic_influence|e] and [research_progress|e] the Academy generates for its [country|e]."
 game_concept_academic_momentum: "Academic Momentum"
 game_concept_academic_momentum_i: "@academic_momentum!"
 game_concept_academic_momentum_desc: "Academic Momentum is the portion of an [academy|e]'s [academic_tradition|e] earned through recent achievements. It rises and falls as new centers of learning arise and older ones fade into obscurity."

 # Academy Actions
 expand_royal_library: "Expand Royal Library"
 expand_royal_library_desc: "A magnificent library is a testament to the wealth and refinement of its patron. By expanding our Royal Library with rare manuscripts and learned works, we shall earn lasting Prestige."
 invite_foreign_scholar: "Invite Foreign Scholar"
 invite_foreign_scholar_desc: "Scholars from distant lands bring with them new ideas, methods, and perspectives. By welcoming a renowned foreign scholar to our realm, we may enrich our own tradition of learning."
 assemble_learned_council: "Assemble a Learned Council"
 assemble_learned_council_desc: "The burdens of rule are seldom borne alone. By gathering our realm's most learned minds to advise the Crown, we shall benefit from their wisdom in matters of state."
 STATIC_MODIFIER_NAME_learned_council: "Learned Council"
 STATIC_MODIFIER_DESC_learned_council: "Our realm's most learned minds have gathered to advise the Crown."
 arrange_tutelage: "Arrange Tutelage"
 arrange_tutelage_desc: "The education of an [child|e] will shape the future of the realm. By using our considerable influence to place them under the guidance of one of our capable scholars, they may acquire the wisdom and skills needed to rule."
 appoint_scholar: "Appoint Scholar"
 appoint_scholar_desc: "Learning flourishes when guided by capable minds. By appointing a distinguished scholar to one of our centers of learning, we shall ensure that knowledge continues to prosper."
 promote_center_learning: "Promote Center of Learning"
 promote_center_learning_desc: "A center of learning flourishes under enlightened patronage. By extending our support to one of our foremost institutions, it may attract scholars from far and wide and be capable of breakthroughs never thought possible."
 seat_of_rector_clergy: "Rectorate Seat"
 seat_of_rector_nobility: "Rectorate Seat"
 seat_of_rector_burghers: "Rectorate Seat"
 seat_of_rector_why: "Can only be requested via [ShowGenericActionName('promote_center_learning')]."
 dissolve_academy: "Dissolve Academy"
 dissolve_academy_desc: "Not every institution proves worthy of continued patronage. By dissolving an academy that has outlived its purpose, its resources may be put to better use elsewhere."
 
