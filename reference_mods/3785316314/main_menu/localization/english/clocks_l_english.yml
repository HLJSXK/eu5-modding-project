 MODIFIER_TYPE_NAME_mirrors_impacts_inflation: "Mirrors Impacts Inflation"
 MODIFIER_TYPE_DESC_mirrors_impacts_inflation: "This determines how the production of [ShowGoodsName('mirrors')] impacts [inflation|e] in the [country|e]."
 MODIFIER_TYPE_NAME_local_mirrors_guild_building_levels: "Mirrormaker Guild Building Levels"
 MODIFIER_TYPE_DESC_local_mirrors_guild_building_levels: "This increases the Max Level of the [ShowBuildingTypeName('mirrors_guild')] in this [location|e]."
 
 # Rector Seats
 rectorate_chair_clergy: "Academic Seat"
 rectorate_chair_clergy_desc: "The seat of a chartered academy. Each Academic Seat represents a center of higher learning whose influence depends upon its governing authority."
 rectorate_chair_nobility: "$rectorate_chair_clergy$"
 rectorate_chair_nobility_desc: "$rectorate_chair_clergy_desc$"
 rectorate_chair_burghers: "$rectorate_chair_clergy$"
 rectorate_chair_burghers_desc: "$rectorate_chair_clergy_desc$"
 academy_seat_maintenance: "Academy Seats"

 # Age 1 Good Techs
 cathedral_clocks_advance: "Cathedral Clocks"
 cathedral_clocks_advance_desc: "The great cathedrals and civic towers of Europe are acquiring a new voice. Mechanical clocks are appearing atop bell towers, their bells marking the hours with a regularity no human watcher can ever sustain."
 optics_guild: "Lensmakers' Guild"
 optics_guild_desc: "A guild of skilled craftsmen dedicated to the grinding and polishing of optical lenses. Their work improves spectacles, magnifying glasses, and the quality of precision glasswork."
 optics_guild_advance: "$optics_guild$"
 optics_guild_advance_desc: "$optics_guild_desc$"
 ground_lenses: "Ground Lenses"
 ground_lenses_desc: "The careful grinding and polishing of glass produces lenses of ever greater clarity, opening new possibilities for spectacles, instruments, and the study of the natural world."
 achromatic_lenses: "Achromatic Lenses"
 achromatic_lenses_desc: "By combining lenses of differing optical properties, natural philosophers overcome chromatic distortion, greatly improving the precision of astronomical observations and scientific instruments."
 refined_lenses_advance: "Refined Lenses"
 refined_lenses_advance_desc: "Improved techniques for grinding and polishing glass produce finer lenses, allowing craftsmen to create clearer and more precise optical instruments."

 brass_foundry: "Brass Furnace"
 brass_foundry_desc: "A furnace specializing in the casting of brass for instruments, ornaments, and machinery. The alloy's durability and workability make it indispensable to skilled craftsmen."
 brass_foundry_advance: "$brass_foundry$"
 brass_foundry_advance_desc: "$brass_foundry_desc$"
 brass_foundry_shruff_maintenance: "Brass Shruff Casting"
 brass_foundry_maintenance: "Brass Casting"

 # Age 1 Extra Technologies
 nominalism_advance: "Nominalism"
 nominalism_advance_desc: "Nominalism is the belief that abstract ideas such as humanity, justice, or nation do not exist as real things, but are simply names we give to groups of similar individuals."
 scholarly_networks_advance: "Scholarly Networks"
 scholarly_networks_advance_desc: "A growing web of correspondence between universities, monasteries, courts, and learned individuals allows ideas to travel farther and faster than ever before."
 algorism_advance: "Algorism"
 algorism_advance_desc: "The complete academic adoption of Hindu-Arabic numerals and written arithmetic transforms mathematical practice across Europe. More efficient calculation replaces older methods, improving commerce and astronomy."
 alfonsine_tables_advance: "Alfonsine Tables"
 alfonsine_tables_advance_desc: "The Alfonsine Tables greatly improve the calculation of planetary positions, eclipses, and the calendar. Adopted across Europe's universities, they will become the foundation of practical astronomy for generations."
 questioning_aristotle_advance: "Questioning Aristotle"
 questioning_aristotle_advance_desc: "Late scholastic thinkers increasingly subject Aristotle's natural philosophy to critical analysis rather than treating it as unquestionable authority."
 
 # Age 1 Uniques
 oxford_calculators_advance: "Oxford Calculators"
 oxford_calculators_advance_desc: "The scholars of Merton College apply mathematics to the study of motion, force, and change, demonstrating that the natural world may be understood through quantitative analysis."
 hesychasm_advance: "Hesychasm"
 hesychasm_advance_desc: "Hesychasm focusses on inner stillness, contemplative prayer, and direct communion with God through the unceasing Jesus Prayer."
 lay_vernacular_preaching_advance: "Lay Vernacular Preaching"
 lay_vernacular_preaching_advance_desc: "Preaching increasingly reaches the laity in their own languages rather than in Latin alone."

 # Age 1 Laws
 academic_tradition_law: "Academic Tradition"
 academic_tradition_law_desc: "The dominant philosophical tradition taught in our realm's universities."
 via_antiqua_tradition: "Via Antiqua"
 via_antiqua_tradition_desc: "Instruction follows the traditional scholastic curriculum focussing on Aristotelian philosophy, theological disputation, and the authority of established texts as the foundation of learning."
 via_moderna_tradition: "Via Moderna"
 via_moderna_tradition_desc: "Teaching focusses on logic, critical reasoning, and nominalist philosophy, encouraging students to refine inherited knowledge through careful analysis and debate."
 academic_organization_law: "Academic Organization"
 academic_organization_law_desc: "The organization and patronage of scholarship determines how knowledge is preserved, exchanged, and advanced throughout our realm."
 informal_networks_org: "Informal Networks"
 informal_networks_org_desc: "Learning depends upon personal relationships between masters, students, clerics, and patrons. Knowledge spreads slowly through correspondence, travel, and individual reputation."
 scholarly_networks_org: "Scholarly Networks"
 scholarly_networks_org_desc: "Scholars maintain enduring networks of correspondence that connect universities, monasteries, and courts well beyond our own borders."
 
 # Age 2 Good Techs
 spectacles_advance: "Spectacles"
 spectacles_advance_desc: "The invention of spectacles and the refinement of lens grinding will allow scholars, clerics, merchants, and administrators to remain productive well into old age."
 
  # Age 2 Extra Technologies
 ad_fontes_advance: "Ad Fontes"
 ad_fontes_advance_desc: "The rediscovery of classical texts encourages scholars to return to the original sources, rather than translations and commentaries."
 greek_studies_advance: "Greek Studies"
 greek_studies_advance_desc: "The arrival of Greek scholars and manuscripts introduces Europe to a wealth of previously ignored classical works. The study of the Greek language grants new access to ancient philosophy, science, and literature."
 perspective_geometry_advance: "Linear perspective"
 perspective_geometry_advance_desc: "The application of geometry to perspective allows artists and architects to represent three-dimensional space much better than before."
 scholarly_patronage_advance: "Scholarly Patronage"
 scholarly_patronage_advance_desc: "Recognizing the prestige and practical value of learning, rulers and wealthy patrons support scholars, universities, and academies."
 practical_astronomy_advance: "Practical Astronomy"
 practical_astronomy_advance_desc: "Careful observation and mathematical calculation improve the accuracy of astronomical tables and celestial measurements. These advances enhance navigation, cartography and timekeeping."
 classical_rhetoric_advance: "Classical Rhetoric"
 classical_rhetoric_advance_desc: "The study of classical rhetoric revives the arts of eloquence and persuasion. Mastery of oratory, composition, and public speaking may become an essential part of education, diplomacy, and civic life."
 flamboyant_gothic_advance: "Flamboyant Architecture"
 flamboyant_gothic_advance_desc: "Even as the Renaissance begins to take hold, an evolution of the Gothic tradition continues to develop. Flamboyant architecture adorns gothic churches, halls, and civic monuments with intricate tracery resembling leaping flames."

 # Age 2 Uniques
 civic_humanism_advance: "Civic Humanism"
 civic_humanism_advance_desc: "Inspired by the ideals of ancient Rome, scholars argue that education should prepare citizens to serve the state rather than just the Church."

 # Age 2 Laws
 studia_humanitatis_tradition: "Studia Humanitatis"
 studia_humanitatis_tradition_desc: "Education centers upon the humanities, cultivating eloquence, moral philosophy, history, poetry, and classical languages through the study of ancient authors."
 scholarly_patronage_org: "Scholarly Patronage"
 scholarly_patronage_org_desc: "Princes, churches, and wealthy benefactors support scholars through patronage. Their resources enable ambitious research and attract learned men to courts and universities."
 civic_humanism_tradition: "Civic Humanism"
 civic_humanism_tradition_desc: "Learning prepares students for public service, combining classical scholarship with ethics, rhetoric, and political thought to educate capable magistrates and statesmen."

 # Age 3 Good Techs & Mirrors
 mirrors_guild_advance: "$mirrors_guild$"
 mirrors_guild_advance_desc: "$mirrors_guild_desc$"
 mirrors_guild: "Mirrormakers' Guild"
 mirrors_guild_desc: "Mirrormakers organize into guilds that regulate production, protect trade secrets, and maintain standards of craftsmanship. Their workshops refine the arts of polishing."
 bronze_mirrors: "Bronze Mirrors"
 bronze_mirrors_desc: "Polished bronze surfaces provide a durable means of catching and reflecting light, though their clarity remains limited compared with finer mirrors."
 convex_mirrors: "Convex Mirrors"
 convex_mirrors_desc: "Curved mirrors offer a wider field of view, producing a curious and distorted reflection prized for both practical use and artistic experimentation."
 convex_mirrors_advance: "$convex_mirrors$"
 convex_mirrors_advance_desc: "$convex_mirrors_desc$"
 metal_backed_mirrors: "Tin-backed Mirrors"
 metal_backed_mirrors_desc: "Glass backed with a polished layer of tin produces a clearer reflection than older polished-metal mirrors, though the process remains costly and demanding."
 tin_backed_mirrors_venice_advance: "$metal_backed_mirrors$"
 tin_backed_mirrors_venice_advance_desc: "$metal_backed_mirrors_desc$"
 tin_backed_mirrors_advance: "$metal_backed_mirrors$"
 tin_backed_mirrors_advance_desc: "$metal_backed_mirrors_desc$"
 silver_backed_mirrors: "Silver-backed Mirrors"
 silver_backed_mirrors_desc: "A delicate layer of silver behind the glass produces an exceptionally bright and faithful reflection, making such mirrors objects of considerable luxury and refinement."
 silver_backed_mirrors_advance: "$silver_backed_mirrors$"
 silver_backed_mirrors_advance_desc: "$silver_backed_mirrors_desc$"

 clocks_guild_advance: "$clocks_guild$"
 clocks_guild_advance_desc: "$clocks_guild_desc$"
 early_clocks: "Early Clocks"
 early_clocks_desc: "Crude weight-driven mechanisms of iron and brass, marking the hours in the homes of the wealthy - reliable enough, though far from precise."
 fine_clocks: "Fine Clocks"
 fine_clocks_desc: "Pendulum-regulated movements bring a new steadiness to household timekeeping, their brass workings kept true by the swing of a weighted rod."
 modern_clocks: "Modern Clocks"
 modern_clocks_desc: "Steel springs and finely machined components allow for clocks and watches of remarkable accuracy, small enough to carry and precise enough to trust at sea."

 clocks_guild: "Clockmakers' Guild"
 clocks_guild_desc: "As the craft of clockmaking matures, its practitioners draw together into formal guilds to regulate their trade, protect their secrets, and ensure the quality of their work."
 precision_instruments_guild: "Artificer's Guild"
 precision_instruments_guild_desc: "A guild of skilled craftsmen dedicated to the construction of precise measuring instruments such as quadrants, astrolabes, and surveying tools."
 fine_precision_instruments: "Fine Instruments"
 fine_precision_instruments_desc: "Carefully crafted instruments allow craftsmen and scholars to measure, observe, and calculate with a precision previously beyond their reach."
 modern_instruments: "Modern Instruments"
 modern_instruments_desc: "Advances in precision craftsmanship produce instruments of remarkable accuracy, bringing greater certainty to the study of nature and the measurement of the world."

 precision_instruments_guild_advance: "$precision_instruments_guild$"
 precision_instruments_guild_advance_desc: "$precision_instruments_guild_desc$"
 surveying_tools_advance: "Precision Surveying Tools"
 surveying_tools_advance_desc: "Advances in precision instruments allow surveyors to produce more accurate maps and measurements, improving navigation, engineering, and the administration of land."
 water_powered_trip_hammers_advance: "Water-Powered Trip Hammers"
 water_powered_trip_hammers_advance_desc: "Driven by waterwheels, trip hammers automate the forging and shaping of metal, greatly increasing the scale and efficiency of ironworking and other heavy industries."

 # Age 3 Extra Technologies
 renaissance_humanism_advance: "Renaissance Humanism"
 renaissance_humanism_advance_desc: "Humanist scholars turn their attention to the history and moral philosophy of classical antiquity."
 platonic_revival_advance: "Platonic Revival"
 platonic_revival_advance_desc: "The recovery and translation of Plato's works restore Platonic philosophy to prominence in Europe. Alongside Aristotle, his ideas inspire new debates on philosophy, theology, and the nature of the cosmos."
 christian_humanism_advance: "Christian Humanism"
 christian_humanism_advance_desc: "Humanist scholarship is applied to the study of Christian texts and teachings. By returning to original sources and emphasizing personal piety, Christian humanists look to renew religious life through a deeper understanding of scripture."
 biblical_criticism_advance: "Biblical Criticism"
 biblical_criticism_advance_desc: "Scholars subject biblical texts to careful linguistic and historical analysis, comparing manuscripts and examining translations against their original languages."
 legal_humanism_advance: "Legal Humanism"
 legal_humanism_advance_desc: "Applying the principles of humanism to the study of law, jurists return to the original texts of Roman jurisprudence. Through philology they challenge centuries of medieval commentary and lay the foundations of a more systematic legal tradition."
 planetary_tables_advance: "Planetary Tables"
 planetary_tables_advance_desc: "Increasingly accurate planetary tables allow astronomers and navigators to predict the motions of the heavens with great precision."
 cubic_equations_advance: "Cubic Equations"
 cubic_equations_advance_desc: "Italian mathematicians develop methods for solving cubic equations, overcoming a problem that had resisted scholars since antiquity."
 print_networks_advance: "Print Networks"
 print_networks_advance_desc: "Printing houses, booksellers, and scholars begin to work together to create a network for the production and exchange of knowledge."
 renaissance_education_advance: "Renaissance Education"
 renaissance_education_advance_desc: "New educational ideals focus on the study of grammar, rhetoric, history, poetry, and moral philosophy."
 renaissance_architecture_advance: "Renaissance Architecture"
 renaissance_architecture_advance_desc: "Architects look to the monuments of ancient Rome for inspiration, favoring symmetry, proportion, and classical forms."
 university_charters_advance: "University Charters"
 university_charters_advance_desc: "Princes, popes, and city governments grant universities formal charters defining their privileges, governance, and academic freedoms. These institutions gain greater autonomy, attract scholars from across Europe, and become enduring centers of higher learning."

 # Age 3 Uniques
 utraquism_advance: "Utraquism"
 utraquism_advance_desc: "Utraquism advocates communion under both kinds for the laity while calling for moral reform within the Church. Its teachings strengthen vernacular worship and challenge established ecclesiastical authority."
 
 # Age 3 Laws
 court_philosophy_law: "Court Philosophy"
 court_philosophy_law_desc: "The philosophers and scholars patronized by the court shape the intellectual character of the realm, influencing everything from education and theology to the study of nature."
 aristotelian_philosophy: "Aristotelianism"
 aristotelian_philosophy_desc: "The court looks to Aristotelian philosophy as the foundation of natural order, ethics, and political life. Tradition, hierarchy, and the pursuit of virtue guide both governance and learning."
 neoplatonic_philosophy: "Neoplatonism"
 neoplatonic_philosophy_desc: "The court embraces a vision of the cosmos ordered by divine harmony and eternal ideals. Philosophy, religion, and the arts seek to reflect the higher perfection underlying the material world."
 printing_networks_org: "Printing Networks"
 printing_networks_org_desc: "Printers, booksellers, and scholars form interconnected networks for the production and circulation of books. The rapid dissemination of texts accelerates learning, standardizes knowledge, and brings new ideas to a wider audience."
 hermeticist_philosophy: "Hermeticism"
 hermeticist_philosophy_desc: "We should encourage the study of occult philosophy, alchemy, astrology, and hidden correspondences within creation. Wisdom is sought through the belief that nature conceals divine mysteries awaiting discovery."

 # Age 4 Good Techs
 spyglass_advance: "Spyglasses"
 spyglass_advance_desc: "The development of the spyglass will greatly extend the range of human sight, improving navigation, reconnaissance, and astronomical observation."
 fusee_advance: "Fusee Clocks"
 fusee_advance_desc: "The fusee fixes the mainspring's issues with deceptive simplicity, greatly increasing the accuracy of our clocks."
 clockwork_diplomacy_advance: "Clockwork Diplomacy"
 clockwork_diplomacy_advance_desc: "A finely made clock, presented at the right moment to the right court, can accomplish what years of negotiation can not. In an age before a common diplomatic language exists between civilisations, clocks speak for themselves."
 microscopes_advance: "Microscopes"
 microscopes_advance_desc: "Ground lenses arranged to reveal a world invisible to the naked eye, refining the craft of instrument-makers and opening new avenues for scientific inquiry."

 # Age 4 Extra Technologies
 neo_stoicism_advance: "Neostoicism"
 neo_stoicism_advance_desc: "We should values reason, discipline, and self-restraint as the highest virtues of rulership. Public duty and steadfastness in adversity must become the ideals expected of both princes and their ministers."
 ramist_logic_advance: "Ramism"
 ramist_logic_advance_desc: "Ramism simplifies traditional logic and focusses on clear organization and method."
 reformation_theology_advance: "Reformation Theology"
 reformation_theology_advance_desc: "The Reformation inspires new approaches to Christian doctrine, encouraging the study of scripture and reshaping religious education."
 baconian_empiricism_advance: "Baconian Empiricism"
 baconian_empiricism_advance_desc: "Baconian Empiricism promotes observation and experimentation as the foundation of knowledge, replacing reliance on ancient authorities with evidence gathered from the natural world."
 methodical_education_advance: "Methodical Education"
 methodical_education_advance_desc: "Methodical Education introduces more systematic ways of teaching, organizing subjects into structured lessons that improve learning and the spread of knowledge."
 symbolic_algebra_advance: "Symbolic Algebra"
 symbolic_algebra_advance_desc: "Symbolic Algebra replaces lengthy written calculations with symbols and equations, allowing mathematicians to solve increasingly complex problems."
 logarithms_advance: "Logarithms"
 logarithms_advance_desc: "Logarithms greatly simplify difficult calculations, making mathematical work faster and improving astronomy, navigation, engineering, and commerce."
 heliocentrism_advance: "Heliocentrism"
 heliocentrism_advance_desc: "Heliocentrism proposes that the Earth and other planets revolve around the Sun, transforming the study of astronomy and humanity's understanding of the cosmos."
 natural_law_advance: "Natural Law"
 natural_law_advance_desc: "Natural Law argues that universal principles of justice can be discovered through reason, influencing political thought, legal systems, and the relations between nations."
 early_baroque_architecture_advance: "Early Baroque Architecture"
 early_baroque_architecture_advance_desc: "Artists, architects, and patrons embrace a bold new style characterized by grandeur, movement, and emotional intensity. Through dramatic forms and rich ornamentation, the Baroque transforms religious, civic, and courtly culture."
 observatory_building: "Observatory"
 observatory_building_desc: "A dedicated center for the observation of celestial phenomena, equipped with instruments for studying the motions of the heavens. Observatories support astronomical research, improve navigation and cartography, and serve as symbols of scientific patronage and learning."
 observatory_building_advance: "$observatory_building$"
 observatory_building_advance_desc: "$observatory_building_desc$"
 observatory_maintenance: "Observatories"

 # Age 4 Uniques
 socinianism_advance: "Socinianism"
 socinianism_advance_desc: "Socinianism rejects the doctrine of the Trinity and focusses on reason, moral teaching, and the careful interpretation of Scripture. Its rational approach to Christianity challenges established confessions and broadens debates over religious belief and toleration."

 # Age 4 Laws
 neostoicism_philosophy: "Neostoicism"
 neostoicism_philosophy_desc: "Neostoicism gains favor among princes and their counselors as a philosophy of government. By combining Stoic ideals of reason, discipline, and public duty with Christian morality, it offers rulers an ethical framework for exercising authority with constancy and restraint."
 ramism_tradition: "Ramist Tradition"
 ramism_tradition_desc: "Instruction is organized through clear method, simplified logic, and practical reasoning, replacing scholastic complexity with a more systematic approach to learning."
 learned_academies_org: "Learned Academies"
 learned_academies_org_desc: "Permanent academies provide scholars with organized institutions devoted to research, discussion, and the advancement of knowledge. Supported by patrons and governments, they become enduring centers of intellectual life."
 academic_authority_law: "Academic Authority"
 academic_authority_law_desc: "Our academic authority determines who governs the academies, oversees their administration, and controls appointments, curricula, and the conferral of academic degrees."
 academic_authority_clergy: "Clerical Authority"
 academic_authority_clergy_desc: "Ecclesiastical authorities oversee the governance of the academies, ensuring that instruction, appointments, and degrees remain aligned with religious doctrine and the interests of the Church."
 academic_authority_nobility: "Noble Authority"
 academic_authority_nobility_desc: "Princes and noble patrons direct the affairs of the academies, using them to educate loyal servants of the state and to promote learning in accordance with their political priorities."
 academic_authority_burghers: "Burgher Authority"
 academic_authority_burghers_desc: "Urban magistrates and civic elites administer the academies, encouraging practical instruction and awarding degrees that serve the commercial and administrative needs of their communities."
 academic_authority_crown: "Crown Authority"
 academic_authority_crown_desc: "The Crown directs the affairs of the academies, appointing scholars and overseeing instruction to ensure that learning serves the needs of the state and its administration."

 # Age 5 Good Techs
 precision_timekeeping_advance: "Precision Timekeeping"
 precision_timekeeping_advance_desc: "The mechanical clock has long been able to mark the hours, but at great imprecision. We can harness the regularity of the pendulum, reducing the daily error of a well-made clock from minutes to seconds at a stroke. The recoil anchor escapement gives the pendulum the mechanical partner it needs to function reliably within a clock, while the balance spring brings similar precision to portable watches."
 brass_mill: "Brass Rolling Mill"
 brass_mill_desc: "A workshop equipped with powered rolling mills for producing uniform brass sheets, strips, and plates. By replacing laborious hammering with precision rollers, it enables more efficient production."
 brass_mill_advance: "$brass_mill$"
 brass_mill_advance_desc: "$brass_mill_desc$"
 brass_mill_shruff_maintenance: "Brass Shruff Casting"
 brass_mill_maintenance: "Brass Casting"
 
 # Age 5 Extra Technologies
 early_enlightenment_advance: "Early Enlightenment"
 early_enlightenment_advance_desc: "Building upon the Scientific Revolution and the legacy of humanism, the Early Enlightenment champions reason as the foundation of knowledge and government. Philosophers and scholars seek to apply rational inquiry to society, religion, and the natural world, laying the intellectual foundations of the modern age."
 rationalism_advance: "Rationalism"
 rationalism_advance_desc: "Rationalism holds that reason is the primary source of knowledge and that universal truths could be discovered through logical deduction. By applying mathematical principles to philosophy and science, rationalist thinkers seek to reveal the fundamental order underlying both nature and human society."
 deism_advance: "Deism"
 deism_advance_desc: "Deism teaches that reason and observation of the natural world are sufficient to understand the existence of a Creator, without reliance on revelation or ecclesiastical authority. It encourages a conception of religion grounded in natural law, morality, and the orderly design of the universe."
 social_contract_advance: "Social Contract"
 social_contract_advance_desc: "Social contract theory argues that political authority arises from an agreement between rulers and the governed, rather than divine or hereditary right."
 empiricism_advance: "Empiricism"
 empiricism_advance_desc: "Empiricism maintains that knowledge is derived from observation, experiment, and experience rather than innate ideas alone."
 calculus_advance: "Calculus"
 calculus_advance_desc: "The development of calculus will give us powerful mathematical tools for describing motion, change, and continuous quantities."
 analytic_geometry_advance: "Analytic Geometry"
 analytic_geometry_advance_desc: "Analytic geometry will unite algebra and geometry by expressing geometric figures through numerical coordinates."
 newtonian_astronomy_advance: "Celestial Mechanics"
 newtonian_astronomy_advance_desc: "By applying universal laws of motion and gravitation to the heavens, celestial mechanics explain the movements of planets, moons, and comets within a single mathematical framework."
 republic_of_letters_advance: "Republic of Letters"
 republic_of_letters_advance_desc: "The Republic of Letters is an international community of scholars who exchanged ideas through correspondence, publications, and learned societies on a never before seen scale."
 society_building: "Scientific Society"
 society_building_desc: "A learned society dedicated to the advancement of knowledge through discussion, correspondence, and research. Bringing together philosophers, scientists, and scholars under the patronage of the state or wealthy benefactors, academies promote intellectual exchange, sponsor investigations into the natural world, and help spread new discoveries across the Republic of Letters."
 society_building_advance: "$society_building$"
 society_building_advance_desc: "$society_building_desc$"
 society_maintenance: "Societies"
 high_baroque_architecture_advance: "High Baroque Architecture"
 high_baroque_architecture_advance_desc: "High Baroque architecture reaches new heights of grandeur through monumental scale, dramatic forms, and richly ornamented interiors."
 
 # Age 5 Uniques
 old_believers_advance: "Old Believers"
 old_believers_advance_desc: "Rejecting the liturgical reforms of the Russian Orthodox Church, the Old Believers preserve traditional rites and practices."

 # Age 5 Catchup Technologies
 clocks_catchup_advance: "Clockmaking Innovations"
 clocks_catchup_advance_desc: "The spread of Western European mechanical timekeeping beyond its origins is driven by trade, diplomacy, and the exchange of skilled craftsmen. What once had to be imported at great cost, may now be made by our own artisans."
 optics_catchup_advance: "Optical Craftsmanship"
 optics_catchup_advance_desc: "The techniques of lens grinding and optical glassmaking spread through trade, diplomacy, and scholarship. Local craftsmen begin producing spectacles, magnifying lenses, and other optical devices that had once been imported from Europe."

 # Age 5 Laws
 republic_of_letters_org: "Republic of Letters"
 republic_of_letters_org_desc: "An international community of scholars exchanges discoveries through correspondence, publications, and learned societies. Crossing political and confessional boundaries, the Republic of Letters fosters collaboration on an never before seen scale."
 absolutism_philosophy: "Absolutism"
 absolutism_philosophy_desc: "The court regards sovereign authority as the indispensable foundation of order and stability. Government is organized around the central power of the ruler, whose authority directs the affairs of the state."
 newtonian_tradition: "Newtonianism"
 newtonian_tradition_desc: "Natural philosophy is taught through observation, experiment, and mathematical demonstration, revealing the universal laws governing both the heavens and the Earth."
 cartesianism_tradition: "Cartesianism"
 cartesianism_tradition_desc: "Students pursue knowledge through systematic doubt, logical deduction, and mathematical reasoning, seeking universal truths founded upon clear and distinct principles."
 cartesian_rationalism_philosophy: "Rationalism"
 cartesian_rationalism_philosophy_desc: "The court regards sovereign authority as the indispensable foundation of order and stability. Government is organized around the central power of the ruler, whose authority directs the affairs of the state."
 liberalism_philosophy: "Constitutional Liberalism"
 liberalism_philosophy_desc: "The court recognizes individual liberty, property, and the rule of law as the proper basis of political authority. Government exists to protect the rights of its citizens rather than merely exercise power over them."
 neothomism_tradition: "Neothomism"
 neothomism_tradition_desc: "The academy restores Thomistic philosophy as the foundation of theology, ethics, and natural philosophy, harmonizing faith with disciplined reason."

 # Age 6 Good Techs
 achromatic_lenses_advance: "$achromatic_lenses$"
 achromatic_lenses_advance_desc: "$achromatic_lenses_desc$"
 precision_mechanics_advance: "Precision Mechanics"
 precision_mechanics_advance_desc: "Advances in the art of fine mechanical craftsmanship allow instruments to be made with unprecedented accuracy, bringing greater precision to the measurement of time, distance, and the natural world."

 # Age 6 Extra Technologies
 rational_inquiry_advance: "Rational Inquiry"
 rational_inquiry_advance_desc: "Rational inquiry applies reason, observation, and systematic investigation to the pursuit of knowledge. Its methods will shape philosophy, science, politics, and scholarship, laying the foundations of the modern intellectual world."
 critical_philosophy_advance: "Critical Philosophy"
 critical_philosophy_advance_desc: "Critical philosophy examines the limits of human reason and the conditions under which knowledge is possible. By reconciling rationalism and empiricism, it will transform metaphysics, ethics, and political thought."
 idealism_advance: "Idealism"
 idealism_advance_desc: "Idealism argues that reality is fundamentally shaped by the mind and that reason plays a central role in understanding the world. Its influence will reshape philosophy, religion, and the arts throughout the nineteenth century."
 romanticism_advance: "Romanticism"
 romanticism_advance_desc: "Romanticism celebrates emotion, imagination, individuality, and the sublime alongside reason. It will inspire new movements in literature, art, music, and political thought while challenging the intellectual ideals of the Enlightenment."
 utilitarianism_advance: "Utilitarianism"
 utilitarianism_advance_desc: "Utilitarianism judges moral and political actions according to the happiness and well-being they produce. Its principles will influence legal reform, public administration, and modern political philosophy."
 analysis_advance: "Mathematical Analysis"
 analysis_advance_desc: "Mathematical analysis extends the methods of calculus through rigorous study of functions, limits, and continuous change. It will provide the foundation for increasingly sophisticated mathematics and the physical sciences."
 probability_theory_advance: "Probability Theory"
 probability_theory_advance_desc: "Probability theory develops mathematical methods for measuring uncertainty and chance. Its principles will transform statistics, economics, insurance, and the scientific study of populations."
 projective_geometry_advance: "Projective Geometry"
 projective_geometry_advance_desc: "Projective geometry studies the properties of figures that remain unchanged under projection and perspective. Its methods will expand the frontiers of geometry and influence mathematics, engineering, and the visual arts."
 scientific_journals_advance: "Scientific Journals"
 scientific_journals_advance_desc: "Scientific journals provide a regular forum for the publication, discussion, and preservation of new discoveries. By encouraging the exchange and scrutiny of research, they will accelerate scientific progress and strengthen international scholarly collaboration."
 neoclassical_architecture: "Neoclassical Architecture"
 neoclassical_architecture_desc: "Inspired by the architecture of ancient Greece and Rome, Neoclassical architecture focusses on symmetry, proportion, and restrained ornamentation. Its orderly forms will become the preferred expression of civic virtue, public authority, and Enlightenment ideals."

 # Age 6 Laws
 scientific_journals_org: "Scientific Journals"
 scientific_journals_org_desc: "Regular scholarly journals provide a common forum for publishing discoveries, evaluating new ideas, and preserving scientific knowledge. Research becomes increasingly collaborative, cumulative, and accessible to the wider learned world."
 wolffianism_tradition: "Wolffianism"
 wolffianism_tradition_desc: "Every branch of knowledge is arranged into a coherent rational system, encouraging students to master philosophy, science, and law through orderly demonstration and method."
 scottish_common_sense_tradition: "Common Sense Philosophy"
 scottish_common_sense_tradition_desc: "Instruction prioritizes practical reasoning, moral intuition, and everyday experience, rejecting excessive skepticism while cultivating sound judgment and civic virtue."
 encyclopedism_tradition: "Encyclopedism"
 encyclopedism_tradition_desc: "Learning encourages the collection, organization, and dissemination of knowledge across every discipline, promoting collaboration and the free exchange of ideas among scholars."
 kantianism_tradition: "Kantianism"
 kantianism_tradition_desc: "Students examine the limits of reason and the foundations of knowledge, exploring the relationship between experience, morality, and human freedom through critical inquiry."
 enlightened_rationalism_philosophy: "Enlightened Rationalism"
 enlightened_rationalism_philosophy_desc: "The court applies reason and scientific inquiry to the reform of government and society. Institutions are evaluated according to utility, efficiency, and the public good rather than custom alone."
 german_idealism_philosophy: "German Idealism"
 german_idealism_philosophy_desc: "The court views the state as the expression of a higher moral and historical order. Philosophy prioritizes the development of reason, culture, and national spirit as the foundations of political life."

