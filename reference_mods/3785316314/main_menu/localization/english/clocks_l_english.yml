 # Game Rules - Good Availability
 rule_clocks_availability: "#E Just Clocks:#! Goods Availability"
 setting_tt_historical_clocks: "Historical"
 setting_tt_historical_clocks_desc: "[ShowGoodsName('clocks')] and [ShowGoodsName('optics')] become available to [countries|e] in [ShowContinentName('europe')] first, and to other nations later. Better [production_method|e]s for [ShowGoodsName('clocks')], [ShowGoodsName('optics')], [ShowGoodsName('precision_instruments')], and [ShowGoodsName('mirrors')] are only available to nations in [ShowSubContinentName('western_europe')]."
