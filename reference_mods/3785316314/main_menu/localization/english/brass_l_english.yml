 # Buildings & Advances
 calamine_extracting_advance: "Calamine Extraction"
 calamine_extracting_advance_desc: "Calamine, the zinc-bearing ore found across the hills of the Low Countries, the Rhineland, and Central Europe, had been mined since antiquity for its role in the production of brass."
 bells_guild: "Bell Foundry"
 bells_guild_desc: "A bell foundry is among the most demanding of all metalworking establishments. The casting of a large bell requires precise alloys of copper and tin, carefully proportioned moulds of loam and clay, and the controlled pouring of tonnes of molten metal in a single uninterrupted operation."
 early_distillation_metallurgy_advance: "Distillation Metallurgy"
 early_distillation_metallurgy_advance_desc: "Unlike other metals, zinc vaporizes before it can be collected as a liquid, making its isolation through conventional smelting impossible. Metallurgists in India and China overcame this by heating zinc ore inside sealed clay vessels, capturing the vapor and condensing it back into pure metallic zinc."
 dinanderie_advance: "Dinanderie"
 dinanderie_advance_desc: "The brass-smiths of Dinant on the river Meuse had by the medieval period developed a tradition of decorative metalwork so refined and distinctive that their craft gave its name to the art itself. Aquamaniles, baptismal fonts, candelabras, and lecterns of exceptional quality flowed from their workshops to churches and courts across Europe."
 brass_chinese_bell_casting_advance: "Chinese Bell Casting"
 brass_chinese_bell_casting_advance_desc: "Chinese bell founders have refined their craft over millennia, producing instruments of extraordinary acoustic precision through careful control of bronze alloys and mould geometry. The great ritual bells of temples and imperial courts are cast to specific tonal relationships, their profiles calculated to produce two distinct notes from a single strike depending on where the bell is struck."
 brass_bidri_wares_advance: "Bidriware"
 brass_bidri_wares_advance_desc: "Bidriware is a metalworking tradition of the Deccan, in which vessels and decorative objects are cast from an alloy of zinc, copper, and lead, then inlaid with fine silver wire worked into geometric and floral patterns of exceptional intricacy."
 brass_tibetan_bell_rituals_advance: "Tibetan Bell Rituals"
 brass_tibetan_bell_rituals_advance_desc: "The drilbu, a small hand bell cast in bronze or brass, is among the most sacred objects in Tibetan Buddhist practice. Held in the left hand and rung in precise sequences alongside the ritual thunderbolt sceptre, is not just a signal but as sacred utterance: the voice of the feminine principle of wisdom made audible."
 brassware_guild: "Brassworkers' Guild"
 brassware_guild_desc: "Brassworkers have organised their craft into guilds, regulating the quality of their wares, controlling entry to the trade, and setting the standards by which brass goods are made and sold."
 carillon_casting_advance: "Carillon Casting"
 carillon_casting_advance_desc: "Advances in bell casting and tuning will enable founders to produce sets of accurately pitched bells capable of performing complex melodies."
 brassware_workshop: "Brassware Workshop"
 brassware_workshop_desc: "Dedicated workshops now produce brassware in greater quantities than the individual craftsman's bench allows, bringing together journeymen, apprentices, and specialist tools under a single roof."
 brassware_workshop_advance: "$brassware_workshop$"
 brassware_workshop_advance_desc: "$brassware_workshop_desc$"
 improved_sand_casting_advance: "Improved Sand Molding"
 improved_sand_casting_advance_desc: "By pressing finely prepared sand around wooden patterns, founders can create molds more quickly, cheaply, and consistently than with traditional methods. The technique allows workshops to reproduce complex brass vessels, candlesticks, and decorative fittings in greater numbers, expanding production while reducing the skill and time required for each casting."
 brassware_manufactory: "Brassware Manufactory"
 brassware_manufactory_desc: "Production is divided among specialist hands, founders, finishers, polishers, and engravers, each performing a single task with greater speed and consistency than any generalist craftsman could achieve alone."
 brassware_manufactory_advance: "$brassware_manufactory$"
 brassware_manufactory_advance_desc: "$brassware_manufactory_desc$"
 distillation_metallurgy_advance: "Spelter Production"
 distillation_metallurgy_advance_desc: "Improvements in zinc distillation allows for metallic zinc, known as spelter, to be produced in ever greater quantities. Unlike the older calamine process, the direct alloying of copper with spelter will give brassmakers control over their alloys."
 brassware_mill: "Brassware Factory"
 brassware_mill_desc: "Water and steam-driven machinery now performs the heaviest work of the brass trade, rolling sheet, drawing wire, and stamping forms at a scale and speed no workshop of craftsmen could match."
 brassware_mill_advance: "$brassware_mill$"
 brassware_mill_advance_desc: "$brassware_mill_desc$"
 silverware_guild: "Silversmith"
 silverware_guild_desc: "The silversmith's craft demands the highest standards of purity and precision. Working a metal too soft for heavy use yet too precious for careless handling, the silversmith transforms ingots into plate, cutlery, and devotional objects through skillful hammering, chasing, and engraving."
 pewterware_guild: "Pewterers' Guild"
 pewterware_guild_desc: "Pewter, an alloy of tin with small additions of lead, copper, or antimony, occupies a middle station in the hierarchy of metals. It is affordable where silver is not, yet respectable where wood or earthenware will not suffice. The pewterer's guild regulates the composition of the alloy and the the weight of finished wares."
 pewterware_workshop: "Pewterware Workshop"
 pewterware_workshop_desc: "Pewterware workshops now bring together journeymen casters, turners, and burnishers under one roof, producing plates, flagons, and measures in increased quantities."
 pewterware_workshop_advance: "$pewterware_workshop$"
 pewterware_workshop_advance_desc: "$pewterware_workshop_desc$"
 pewterware_manufactory: "Pewterware Manufactory"
 pewterware_manufactory_desc: "The manufactory divides the production of pewterware into distinct operations. First casting, followed by trimming on the lathe, planishing, and finally finishing. Each task is assigned to hands trained in that task alone. The result is a uniformity and output that guild workshops cannot rival."
 pewterware_manufactory_advance: "$pewterware_manufactory$"
 pewterware_manufactory_advance_desc: "$pewterware_manufactory_desc$"
 pewterware_mill: "Pewterware Factory"
 pewterware_mill_desc: "Steam-powered rolling mills now produce sheet tin and pewter alloy stock with a consistency and speed that transforms the trade. Stamping presses cut and form plates, dishes, and vessel bodies in a fraction of the time once spent at the casting bench, while the lathe and polishing wheel finish goods by the gross."
 pewterware_mill_advance: "$pewterware_mill$"
 pewterware_mill_advance_desc: "$pewterware_mill_desc$"
 ornaments_guild: "Braziers' Guild"
 ornaments_guild_desc: "The braziers' guild represents the craftsmen who cast and work copper, brass, and bronze into the decorative and devotional objects that furnish the great household and the house of God alike. Candlesticks, censers, aquamaniles, lecterns, and small statuary flow from the brazier's workshop. These are objects where the metalworker's skill is judged not only by utility but by beauty, and where the quality of the casting and the refinement of the finish are the measure of the craftsman's art."
 metalcrafting_advance: "Metalcrafting"
 metalcrafting_advance_desc: "The working of metal by hammer is the basis for every branch of the metalworking trades. Advances in these foundational skills raise the quality and consistency of goods across the entire craft."
 brassworking_advance: "Brassworking"
 brassworking_advance_desc: "The particular demands of brass, specifically its tendency to work-harden under the hammer, its sensitivity to the proportions of copper and zinc, and the care required in annealing and finishing, have given rise to a body of craft knowledge distinct from the working of other metals. Brassworkers who master these properties can produce goods of greater refinement, durability, and decorative quality than those who treat the metal as merely a cheaper substitute for bronze."
 printing_type_workshop: "Type Foundry"
 printing_type_workshop_desc: "The casting of movable type demands exceptional precision. Each sort must be perfectly rectangular, of exact height-to-paper, and cast from an alloy of lead, tin, and antimony hard enough to survive thousands of impressions without distortion. The type foundry brings together punch-cutters, matrix-strikers, and casters whose combined skill determines the quality of every page the press will ever print."
 printing_type_workshop_advance: "$printing_type_workshop$"
 printing_type_workshop_advance_desc: "$printing_type_workshop_desc$"
 printing_type_manufactory: "Type Manufactory"
 printing_type_manufactory_desc: "The growing appetite of commercial presses for large quantities of standardised type has driven the organisation of type founding into a manufactural form, with separate hands responsible for alloy preparation, casting, breaking off, and dressing each sort. The result is a more consistent product delivered in greater volume, allowing printers to maintain larger cases and set longer runs without waiting on the founder's bench."
 printing_type_manufactory_advance: "$printing_type_manufactory$"
 printing_type_manufactory_advance_desc: "$printing_type_manufactory_desc$"
 printing_type_mill: "Type Factory"
 printing_type_mill_desc: "Machine casting has transformed the type trade. Where a skilled founder could produce only a few thousand sorts a day by hand, mechanical casters fed with prepared alloy now produce them by the hundred thousand, driving down the cost of type and making print itself cheaper."
 printing_type_mill_advance: "$printing_type_mill$"
 printing_type_mill_advance_desc: "$printing_type_mill_desc$"

 MODIFIER_TYPE_NAME_local_ornaments_guild_building_levels: "Ornaments Foundry Building Levels"
 MODIFIER_TYPE_DESC_local_ornaments_guild_building_levels: "This increases the Max Level of the [ShowBuildingTypeName('ornaments_guild')] in this [location|e]."
 MODIFIER_TYPE_NAME_local_bells_guild_building_levels: "Bell Foundry Building Levels"
 MODIFIER_TYPE_DESC_local_bells_guild_building_levels: "This increases the Max Level of the [ShowBuildingTypeName('bells_guild')] in this [location|e]."
 MODIFIER_TYPE_NAME_local_silverware_guild_building_levels: "Silversmith Building Levels"
 MODIFIER_TYPE_DESC_local_silverware_guild_building_levels: "This increases the Max Level of the [ShowBuildingTypeName('silverware_guild')] in this [location|e]."
 AUTO_MODIFIER_NAME_country_metalware_demands: "Era-based Metalware Demand"
 AUTO_MODIFIER_DESC_country_metalware_demands: "As time advances and people gain more access to porcelain, the demand for Brass- and Pewterware will go down."

 STATIC_MODIFIER_NAME_yunnan_pewterware: "Yunnan Pewterware" 
 STATIC_MODIFIER_DESC_yunnan_pewterware: "Rich tin deposits and centuries of skilled craftsmanship have made Yunnan renowned for its finely crafted pewterware, prized for its elegance and enduring quality."
 STATIC_MODIFIER_NAME_alluvial_tin: "Alluvial Tin"
 STATIC_MODIFIER_DESC_alluvial_tin: "Extensive alluvial tin deposits have made this region a renowned centre of mining and trade."

 brass_guild_maintenance_shruff: "Shruff Brassware Guilds"
 brass_guild_maintenance_calamine: "Calamine Brassware Guilds"
