l_english:
 zinc: "Zinc"
 zinc_desc: "Zinc was known in antiquity but remained difficult to isolate in large quantities until advances in metallurgy spread from India and China. Most commonly used for the production of brass and other alloys, it became increasingly important as metalworking techniques improved. Though rarely as prestigious as silver or copper, zinc was an essential component of many manufactured goods."
