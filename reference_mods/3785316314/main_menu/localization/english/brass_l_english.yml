 bells_guild_maintenance: "Bell Metal Foundries"
 ornaments_guild_maintenance: "Statuary Bronze Foundries"
 silverware_guild_maintenance: "Silversmiths"

 houseware_rights: "Houseware Rights"
 houseware_rights_desc: "This [location|e] has been granted legal privileges over the production and distribution of [ShowGoodsName('brassware')] and [ShowGoodsName('pewterware')], conferring a significant competitive advantage."
 ornaments_rights: "Ornaments Rights"
 ornaments_rights_desc: "This [location|e] has been granted legal privileges over the production and distribution of [ShowGoodsName('ornaments')], conferring a significant competitive advantage."
 bells_rights: "Bell Rights"
 bells_rights_desc: "This [location|e] has been granted legal privileges over the production and distribution of [ShowGoodsName('bells')], conferring a significant competitive advantage."
 silverware_rights: "Silverware Rights"
 silverware_rights_desc: "This [location|e] has been granted legal privileges over the production and distribution of [ShowGoodsName('silverware')], conferring a significant competitive advantage."
 
 MODIFIER_TYPE_NAME_local_smelters_max_level: "Local Smelters Max Level"
 MODIFIER_TYPE_DESC_local_smelters_max_level: "This modifies how many levels the [ShowBuildingTypeName('local_smelters')] can have."
 MODIFIER_TYPE_NAME_retort_works_max_level: "Retort Works Max Level"
 MODIFIER_TYPE_DESC_retort_works_max_level: "This modifies how many levels the [ShowBuildingTypeName('retort_works')] can have."
 
 water_powered_bellows: "Water-Powered Bellows"
 water_powered_bellows_desc: "Water-powered bellows are a simple but effective way to increase the airflow to a furnace, allowing it to reach higher temperatures and melt metals more efficiently."

 coke_experimentation: "Industrial Furnaces"
 coke_experimentation_desc: "Improvements in furnace construction and the growing use of coke as a fuel allow smelters to reach higher temperatures with greater efficiency. These innovations increase metal production while reducing dependence on dwindling supplies of charcoal."

 retort_works: "Retort Works"
 retort_works_desc: "Retort works are facilities for the distillation of certain metals like zinc or mercury. By heating these ores in sealed retorts, metallurgists can capture the vapor and condense it into pure metal, which can then be used in chemical processes or alloyed with other metals."
 retort_works_advance: "$retort_works$"
 retort_works_advance_desc: "$retort_works_desc$"
 retort_works_maintenance: "Retort Works"

 continuous_distilliation_advance: "Continuous Distillation"
 continuous_distilliation_advance_desc: "Continuous distillation allows for the ongoing processing of ores in retorts, increasing efficiency and output. This method enables metallurgists to maintain a steady production of metals like zinc or mercury."

 brass_events.1.title: "Georgius Agricola"
 brass_events.1.desc: "A learned physician and scholar named [georgius_agricola.GetName] from [birth_location.GetName] has settled in the prosperous mining town of [target_location.GetName]. While tending to the ailments of miners, he has developed a keen interest in the extraction of ores such as [silver.GetName] and [zinc.GetName] and the methods employed by those who work beneath the earth. Through careful observation and discussion with the experienced miners and smelters who are employed in the mines, Agricola seeks to bring order to a craft long governed by traditions."
 brass_events.1.entry: "Georgius Agricola"
 brass_events.1.historical_info: "Georgius Agricola was a German physician and humanist scholar who settled in Joachimsthal around 1527. Fascinated by the town's thriving silver mines, he began systematically studying mining, metallurgy, and mineralogy through direct observation rather than relying solely on ancient authorities. These investigations culminated in Bermannus, the first of several influential works that earned Agricola recognition as the father of mineralogy and a pioneer of scientific metallurgy."
 brass_events.1.a: "He is gifted with a truly precocious intellect."

 brass_events.2.title: "Bermannus"
 brass_events.2.desc: "After years spent observing the mines of [target_location.GetName] and speaking with miners, smelters and engineers, [georgius_agricola.GetName] has completed his new work #italic Bermannus#!. Rather than relying solely upon the writings of antiquity, Agricola presents mining as a discipline founded upon observation and experience. In his dialogue, he explains how mining and the tools and metallurgy that miners employ work. Scholars across [target_nation.GetName] have already begun to take notice, and even Eramus of [rotterdam.GetName] himself has praised the work for its clarity and insight."
 brass_events.2.entry: "Bermannus"
 brass_events.2.a: "Knowledge is as valuable as silver."
 brass_events.2.b: "The old ways are better."
 bermannus: "Bermannus"
 bermannus_desc: "Bermannus is a comprehensive treatise on mining and metallurgy. It details the techniques of ore extraction, smelting, and refining, as well as the tools and machinery used in the process."

 brass_events.3.title: "De Natura Fossilium"
 brass_events.3.desc: "A learned physician and scholar who now lives in [target_location.GetName], and goes by the name [georgius_agricola.GetName], has published #italic De Natura Fossilium#!, an ambitious study of minerals, ores, gemstones, and rocks. In his treatise, he presents a systemetic appraoch to how the Earth works, introducing the concept of geology through drawing upon years of observation in the mining districts of [ShowAreaName('upper_saxony_area')] and [ShowAreaName('bohemia_area')]."
 brass_events.3.entry: "De Natura Fossilium"
 brass_events.3.a: "Knowledge is as valuable as silver."
 brass_events.3.b: "Let's spend our resources on more practical matters."
 natura_fossilium: "De Natura Fossilium"
 natura_fossilium_desc: "De Natura Fossilium is a comprehensive study of minerals, ores, gemstones, and rocks. It details the classification and properties of these natural resources based on careful observation and empirical evidence."

 brass_events.4.title: "De Re Metallica"
 brass_events.4.desc: "After decades of tireless study, [georgius_agricola.GetName] has completed his magnum opus, #italic De Re Metallica#!. Within its twelve books lie the accumulated wisdom of generations of miners, engineers, assayers, and metallurgists, gathered from the great mining districts of [ShowAreaName('upper_saxony_area')] and [ShowAreaName('bohemia_area')]. From the discovery of ore and the sinking of shafts to the workings of water-powered machinery, ventilation, smelting, and the governance of mines, no aspect of the miner's craft has escaped Agricola's careful eye. By preserving these arts in writing, knowledge once confined to the depths of the earth may now endure for generations to come and indeed usher in an entirely new era of understanding mining in [ShowContinentName('europe')]."
 brass_events.4.entry: "De Re Metallica"
 brass_events.4.a: "Truly a masterpiece."
 brass_events.4.b: "Let's spend our resources on more practical matters."
 re_metallica: "De Re Metallica"
 re_metallica_desc: "De Re Metallica is an exhaustive account of mining and metallurgy. It details every stage of mining, ore processing, smelting, and mine administration with remarkable precision, drawing upon years of observation in the mines of Saxony and Bohemia."

 brass_events.5.title: "The Bristol Zinc Process"
 brass_events.5.desc: "For centuries, brassmakers from [ShowContinentName('europe')] have relied upon the ancient calamine process, producing brass by heating [copper.GetName] together with [zinc.GetName] ores. Now, the Bristol metallurgist [william_champion.GetName] has devised an improved method for producing metallic zinc itself through distillation. By refining the metal before alloying it with copper, brass may be manufactured more efficiently and with greater consistency. The process promises to strengthen the growing industries of [bristol.GetName] and may reduce Europe's dependence on imported zinc."
 brass_events.5.entry: "The Bristol Zinc Process"
 brass_events.5.historical_info: "In 1738, the English metallurgist William Champion patented a vertical retort distillation process for producing metallic zinc from calamine ores at his works in Bristol. While metallic zinc had long been produced in India and imported into Europe, Champion's process was the first commercially successful method developed in Britain. By making domestic zinc production economically viable, his invention greatly expanded the English brass industry and laid the foundations of Europe's modern zinc metallurgy."
 brass_events.5.a: "A meaningful investment."
 brass_events.5.b: "Our resources are better spent elsewhere."
 STATIC_MODIFIER_NAME_brass_zinc_mining_champion: "The Bristol Zinc Process"
 STATIC_MODIFIER_DESC_brass_zinc_mining_champion: "The Bristol Zinc Process, developed by William Champion, allows for the efficient production of metallic zinc through distillation. This innovation improves the quality and consistency of brass production and reduces dependence on imported zinc."
 
 brass_events.6.title: "Andreas Sigismund Marggraf"
 brass_events.6.desc: "At the laboratories of the Academy of Sciences, the chemist [andreas_marggraf.GetName] has demonstrated a reliable method for isolating metallic [zinc.GetName] from its ores. Though long employed in the manufacture of brass, zinc has seldom been studied as a metal in its own right. Through careful experimentation, Marggraf has shown that the substance may be produced in pure form, deepening the understanding of metallurgy and strengthening the growing science of chemistry."
 brass_events.6.entry: "Andreas Sigismund Marggraf"
 brass_events.6.historical_info: "Andreas Sigismund Marggraf was a Prussian chemist and director of the Berlin Academy's chemical laboratory. In 1746, he published a method for producing pure metallic zinc by reducing calamine with charcoal in a closed vessel. Although metallic zinc had been produced in India and later in Britain, Marggraf's work provided the first clear scientific demonstration of its isolation in Europe. His experiments helped establish zinc as a distinct chemical element and made important contributions to analytical chemistry."
 brass_events.6.a: "Knowledge refines industry."
 andreas_sigismund: "Andreas Sigismund"

 brass_events.7.title: "Jean-Jacques Dony"
 brass_events.7.desc: "Rich deposits of [zinc.GetName] ore have long been known in the hills surrounding [liege.GetName], yet their full potential has remained unrealized. Under the direction of the engineer [jean_dony.GetName], new smelting methods have transformed [target_nation.GetName] into one of [ShowContinentName('europe')]'s greatest centers of zinc production. What was once a difficult and costly metal to obtain may now be produced on an industrial scale, supplying industries across Europe with the material needed for brassmaking and the expanding chemical arts."
 brass_events.7.entry: "Jean-Jacques Dony"
 brass_events.7.historical_info: "Jean-Jacques Daniel Dony was a Belgian engineer and industrialist who pioneered large-scale zinc production. In 1805, he obtained the concession to exploit the rich zinc deposits of Vieille-Montagne near Liège, where he developed improved smelting techniques that made zinc production commercially viable on an industrial scale. His work laid the foundations for the famous Vieille Montagne company, which would become one of the world's leading zinc producers during the nineteenth century and helped establish Belgium as a center of non-ferrous metallurgy."
 brass_events.7.a: "We finally understand the chemistry of zinc."
 jean_jacques: "Jean-Jacques"
 STATIC_MODIFIER_NAME_liege_zinc_boom: "New Smelting Methods"
 STATIC_MODIFIER_DESC_liege_zinc_boom: "The new smelting methods developed by Jean-Jacques Dony have transformed the zinc production capabilities of Liège, improving efficiency and output."
 
 brass_events.8.title: "Anton von Swab"
 brass_events.8.desc: "For centuries, manufacturors of European [brassware.GetName] have relied upon calamine, never fully understanding the elusive metal hidden within the ore. Now however, [target_nation.GetAdjective] metallurgist [anton_von_swab.GetName] has at last succeeded in isolating metallic [zinc.GetName]. Though the new metal remains costly to produce, its discovery promises to transform brassmaking and deepen [ShowContinentName('europe')]'s understanding of metallurgy."
 brass_events.8.entry: "Anton von Swab"
 brass_events.8.historical_info: "While brass had been produced in Europe since antiquity by heating copper with calamine ore, metallic zinc itself remained largely unknown outside Asia. In 1742, the Swedish mining engineer Anton von Swab successfully distilled metallic zinc from calamine, marking one of Europe's earliest successful isolations of the metal and advancing both metallurgy and mineral chemistry."
 brass_events.8.a: "Knowledge refines industry."
 von_swab: "von Swab"

 brass_events.11.title: "The Secrets of Antimony"
 brass_events.11.desc: "The physician and alchemist [alexander_suchten.GetName] has published #italic The Secrets of Antimony#!, a treatise devoted to one of nature's most curious metals. Long regarded with suspicion for its poisonous qualities, [antimony.GetName] is presented instead as a substance of remarkable potential when properly understood. Rejecting the empty promises of [gold.GetName]-making, Suchten argues that the true purpose of the chemical arts lies in the study of nature and the improvement of medicine. His work has rekindled interest in the practical applications of alchemy."
 brass_events.11.entry: "The Secrets of Antimony"
 brass_events.11.historical_info: "Published in 1570, De Secretis Antimonii was the most influential work of the German alchemist and physician Alexander von Suchten. A leading follower of Paracelsus, Suchten argued that antimony possessed valuable medicinal and chemical properties when carefully prepared, while criticizing fraudulent alchemists who pursued only the transmutation of metals into gold. His writings helped establish antimony as one of the defining substances of Renaissance chemistry and influenced physicians and chemists throughout Central Europe."
 brass_events.11.a: "Nature still holds many secrets."
 von_suchten: "Von Suchten"
 secrets_of_antimony: "The Secrets of Antimony"
 secrets_of_antimony_desc: "The Secrets of Antimony is a treatise on the properties and uses of antimony. It details the preparation of antimony compounds, their medicinal applications, and the chemical principles underlying their behavior."

 brass_events.12.title: "Alchemia"
 brass_events.12.desc: "[andreas_libavius.GetName] has published #italic Alchemia#!, a comprehensive treatise that seeks to organize the scattered knowledge of the chemical arts into a single systematic work. Rejecting needless secrecy and obscure symbolism, Libavius argues that chemical knowledge should be openly taught, carefully recorded, and tested through experiment. His work promises to shape the education of future physicians, apothecaries, and natural philosophers from all over [ShowContinentName('europe')]."
 brass_events.12.entry: "Alchemia"
 brass_events.12.historical_info: "Published in 1597, Alchemia was written by the German physician and chemist Andreas Libavius. This work is often regarded as the first systematic chemistry textbook, as it brought together contemporary knowledge of laboratory techniques, apparatus, chemical preparations, and metallurgy into a structured educational work. Although Libavius remained committed to aspects of traditional alchemy, which included the notion of turning lead into gold, he also championed the open dissemination of scientific knowledge and helped lay the foundations for chemistry as an academic discipline."
 brass_events.12.a: "Knowledge is as valuable as silver."
 alchemia: "Alchemia"
 alchemia_desc: "Alchemia is a comprehensive treatise on the chemical arts. It details laboratory techniques, apparatus, chemical preparations, and metallurgy, while advocating for the open dissemination of scientific knowledge and the systematic education of future chemists."

 brass_events.13.title: "Jan Baptist van Helmont"
 brass_events.13.desc: "A young physician and natural philosopher, [jan_van_helmont.GetName], has begun attracting attention throughout the [ShowAreaName('brabant_area')] for his unusual methods of inquiry. Born in [brussels.GetName] and educated at the ancient Old University of [leuven.GetName], he has rejected many of the accepted teachings of the schools in favor of careful observation and experiment. His investigations may yet reveal truths that have long escaped even the greatest philosophers and inspire scholars across [ShowContinentName('europe')]."
 brass_events.13.entry: "Jan Baptist van Helmont"
 brass_events.13.historical_info: "Jan Baptist van Helmont was a Flemish physician, chemist, and natural philosopher from the Spanish Netherlands. Educated at the University of Leuven, he became one of the foremost pioneers of experimental chemistry. His studies of combustion, fermentation, and plant growth led him to introduce the word 'gas' into scientific vocabulary, while his writings challenged traditional Aristotelian and Galenic theories. Published after his death, his Ortus Medicinae became one of the most influential scientific works of the seventeenth century."
 brass_events.13.a: "Fund his research."
 brass_events.13.b: "Let's spend our resources on more practical matters."
 jan_baptist: "Jan Baptista"
 van_helmont: "Van Helmont"

 brass_events.14.title: "Ortus Medicinae"
 brass_events.14.desc: "After his death, the writings of [jan_van_helmont.GetName] have finally been gathered and published as #italic Ortus Medicinae#!. Drawing upon decades of experiments conducted in [target_nation.GetName], the work challenges many long-held beliefs of physicians and natural philosophers. Through studies of combustion, fermentation, and the invisible vapors released by chemical reactions, Van Helmont argues that the natural world is governed not merely by ancient authority, but by careful observation and experiment. His ideas are certain to provoke debate among scholars across [ShowContinentName('europe')]."
 brass_events.14.entry: "Ortus Medicinae"
 brass_events.14.a: "Knowledge is as valuable as silver."
 ortus_medicinae: "Ortus Medicinae"
 ortus_medicinae_desc: "Ortus Medicinae is a comprehensive treatise on the chemical arts. It details laboratory techniques, apparatus, chemical preparations, and metallurgy, while advocating for the open dissemination of scientific knowledge and the systematic education of future chemists."

 brass_events.15.title: "Johann Rudolf Glauber"
 brass_events.15.desc: "The chemist [johann_glauber.GetName] has earned renown throughout [target_nation.GetName] for his investigations into salts, acids, and mineral substances. Working from his laboratory in [amsterdam.GetName], he has developed improved methods for preparing chemicals on a practical scale and discovered a remarkable crystalline [salt.GetName] with valuable medicinal and industrial applications. His methods have found eager audiences among apothecaries, glassmakers, dyers, and metallurgists throughout [ShowContinentName('europe')], demonstrating that the chemical arts may serve industry as readily as philosophy."
 brass_events.15.entry: "Johann Rudolf Glauber"
 brass_events.15.historical_info: "Johann Rudolf Glauber was a German-Dutch chemist who spent much of his career in Amsterdam. Best known for discovering sodium sulfate, later known as Glauber's Salt, he developed improved methods for producing mineral acids, salts, and other industrial chemicals. Through his practical approach to laboratory work and large-scale chemical production, Glauber helped transform chemistry from an alchemical pursuit into an industrial science, influencing manufacturing throughout seventeenth-century Europe."
 brass_events.15.a: "Chemistry shall serve industry."
 johann_rudolf: "Johann Rudolf"

 brass_events.16.title: "The Triumphal Chariot of Antimony"
 brass_events.16.desc: "A remarkable new treatise entitled #italic The Triumphal Chariot of Antimony#! has begun circulating among physicians, alchemists, and natural philosophers throughout [target_nation.GetName]. Published in [leipzig.GetName], the work blends practical laboratory techniques with allegorical philosophy and extols the virtues of [antimony.GetName]. Whether penned by the mysterious Benedictine monk Basil Valentine or another learned author, its influence is already inspiring renewed experimentation across [ShowContinentName('europe')]."
 brass_events.16.entry: "The Triumphal Chariot of Antimony"
 brass_events.16.historical_info: "First published in 1604 by Johann Thölde, The Triumphal Chariot of Antimony was attributed to the legendary Benedictine monk Basil Valentine, whose historical existence remains uncertain. Combining practical metallurgical knowledge with alchemical symbolism, the treatise celebrated the medicinal and chemical properties of antimony while helping to popularize Paracelsian ideas. It became one of the most influential alchemical works of the seventeenth century and shaped generations of chemists, physicians, and natural philosophers."
 brass_events.16.a: "The hidden virtues of antimony shall be revealed."
 brass_events.16.b: "Mysteries of alchemists are best left unexplored."
 currus_triumphalis: "The Triumphal Chariot of Antimony"
 currus_triumphalis_desc: "The Triumphal Chariot of Antimony is a treatise on the properties and uses of antimony. It blends practical laboratory techniques with allegorical philosophy, extolling the virtues of antimony and arguing that the chemical arts may serve medicine and industry as readily as the pursuit of hidden wisdom."

 brass_events.17.title: "Nicolas Lemery"
 brass_events.17.desc: "A chemist from [paris.GetName] called [nicolas_lemery.GetName] has completed a comprehensive study of [antimony.GetName], describing its preparation, properties, and medicinal applications with remarkable clarity. Rejecting mystical speculation in favour of careful observation and experiment, his work promises to bring order to one of the most controversial substances in [ShowContinentName('europe')]."
 brass_events.17.entry: "Nicolas Lemery"
 brass_events.17.historical_info: "Published in 1707, Nicolas Lémery's Traité de l'Antimoine became one of the defining works of early modern chemistry. By systematically describing the preparation and medicinal use of antimony compounds, it helped move chemistry beyond its alchemical origins and contributed to the growing acceptance of chemical medicine throughout Europe."
 brass_events.17.a: "Knowledge is as valuable as silver."
 traite_antimoine: "Traité de l'Antimoine"
 traite_antimoine_desc: "Traité de l'Antimoine is a comprehensive treatise on the properties and uses of antimony. It details the preparation of antimony compounds, their medicinal applications, and the chemical principles underlying their behavior."

 brass_events.21.title: "The Company of Mineral and Battery Works"
 brass_events.21.desc: "Two men have appeared before the Crown with an ambitious proposal to make [target_nation.GetName] less dependent on imported goods. The [english.GetName] mining entrepreneur [william_humfrey.GetName] and the German metallurgist [christopher_shute.GetName] seek royal support to expand the brass industry in [target_location.GetName]. Drawing upon the closely guarded techniques of the Holy Roman Empire, they propose constructing a new works for the manufacturing of [brassware.GetName]. Should their venture succeed, the realm could lessen its reliance on imported brass and lay the foundations for a thriving metalworking industry."
 brass_events.21.entry: "The Company of Mineral and Battery Works"
 brass_events.21.historical_info: "On 17 September 1565, Queen Elizabeth I granted William Humfrey and Christopher Schutz a royal patent to introduce brass manufacture, calamine mining, wire drawing, and battery wares into England. Schutz, an experienced German metallurgist, brought valuable continental knowledge of brassmaking, while Humfrey oversaw the development of the enterprise under royal patronage. Their work led directly to the establishment of England's first successful brassworks at Tintern and paved the way for the incorporation of the Company of Mineral and Battery Works in 1568."
 brass_events.21.a: "Make a royal investment."
 brass_events.21.b: "Not now, we have more pressing matters."
 brass_event: "A fortunate opportunity"

 brass_events.22.title: "The Bristol Brass Company"
 brass_events.22.desc: "The growing brass industry of [target_nation.GetName] has outgrown the scattered [brassware.GetName] workshops of earlier generations. Merchants, Quaker industrialists, and metalworkers have pooled their capital into a single company, combining [copper.GetName] supplies from [ShowAreaName('wales_area')] with imported [zinc.GetName] and modern rolling mills. By coordinating production from mine to finished ware, the Bristol Brass Company promises to make [english.GetName] brass a match for the finest foundries in [ShowContinentName('europe')]."
 brass_events.22.entry: "The Bristol Brass Company"
 brass_events.22.historical_info: "Founded in 1702, the Bristol Brass Company became Britain's leading producer of brass during the eighteenth century. Drawing on Welsh copper, imported calamine, and improved manufacturing methods, it transformed brassmaking from a collection of local workshops into a large-scale industrial enterprise and laid the foundations for later innovations by the Champion family."
 brass_events.22.a: "Support the venture."
 brass_events.22.b: "Not now, we have more pressing matters."

 brass_events.23.title: "The Birmingham Brass Boom"
 brass_events.23.desc: "[birmingham.GetName]'s manufacturers have long depended upon [bristol.GetName] for their supply of [brassware.GetName]. Increasingly frustrated by fluctuating prices and limited availability, local industrialists have subscribed funds to establish their own metal company. If successful, Birmingham may rival Bristol as the foremost centre of [target_nation.GetName]'s brass industry."
 brass_events.23.entry: "The Birmingham Brass Boom"
 brass_events.23.historical_info: "In 1780, Birmingham merchant Peter Capper published a public appeal urging the town's manufacturers to produce their own brass rather than rely upon Bristol. His proposal led to public subscriptions and the establishment of the Birmingham Metal Company, marking the rise of Birmingham as a major centre of Britain's brass industry and weakening Bristol's long-held dominance."
 brass_events.23.a: "Support the venture."
 brass_events.23.b: "Not now, we have more pressing matters."
 STATIC_MODIFIER_NAME_birmingham_brass_boom: "The Birmingham Brass Boom"
 STATIC_MODIFIER_DESC_birmingham_brass_boom: "The Birmingham Brass Boom encouraged local manufacturers to produce their own brass. This led to the establishment of the Birmingham Metal Company and marked the rise of Birmingham as a major centre of Britain's brass industry, challenging Bristol's dominance."

 brass_events.24.title: "Luigi Galvani"
 brass_events.24.desc: "Professor [luigi_galvani.GetName] has astonished the learned world with experiments suggesting that muscles can be stimulated by an invisible electrical force. In his laboratory in [target_location.GetName] he placed different metals in contact with the nerves of dissected frogs, and observed violent contractions that he attributed to an intrinsic #italic animal electricity#!. Though the nature of this mysterious force remains uncertain, Galvani's work may open up an entirely new field of scientific inquiry."
 brass_events.24.entry: "Luigi Galvani"
 brass_events.24.historical_info: "Luigi Galvani was an Italian physician and physicist whose experiments on frog muscles laid the foundations of electrophysiology. While he believed he had discovered 'animal electricity', his observations inspired Alessandro Volta to investigate the electrical properties of different metals, ultimately leading to the invention of the voltaic pile, the first true electric battery. Galvani's work marked a turning point in the study of electricity and its relationship with living organisms."
 brass_events.24.a: "Support his research."
 brass_events.24.b: "Let's spend our resources on more practical matters."

 brass_events.25.title: "The Nuremberg Metalworkers"
 brass_events.25.desc: "The workshops of [target_location.GetName] have earned renown for their finely crafted [brassware.GetName]s. From household vessels to scientific instruments and ornate decorations, the city's master coppersmiths have established a reputation that attracts merchants from across [ShowContinentName('europe')]."
 brass_events.25.entry: "The Nuremberg Metalworkers"
 brass_events.25.historical_info: "From the late Middle Ages onward, Nuremberg became one of Europe's foremost centres of metal craftsmanship. Its artisans produced brass and copper wares, scientific instruments, clocks, and luxury goods that were exported throughout the continent."
 brass_events.25.a: "Encourage their craft."
 brass_events.25.b: "Our support lies elsewhere."

 brass_events.26.title: "The Aachen Kupfermeister"
 brass_events.26.desc: "The master metalworkers of [target_location.GetName] have perfected the production of [brassware.GetName] by combining copper with calamine. Their workshops produce high-quality sheets, wire, and household wares sought by merchants across [ShowContinentName('europe')], bringing prosperity to the city."
 brass_events.26.entry: "The Aachen Kupfermeister"
 brass_events.26.historical_info: "From the fifteenth century onward, Aachen and its surrounding region became one of Europe's leading centres of brass production. The wealthy Kupfermeister, or 'Copper Masters,' oversaw extensive brassworks whose influence later spread to nearby Stolberg."
 brass_events.26.a: "Invest in the brassworks."
 brass_events.26.b: "The workshops require no patronage."

 brass_events.27.title: "The Coppersmiths of Istanbul"
 brass_events.27.desc: "The guilds of [target_location.GetName] have long fashioned copper into elegant household [brassware.GetName], ceremonial vessels, and richly decorated works of art. Their skill has made the city's coppersmiths renowned throughout [ShowContinentName('europe')]."
 brass_events.27.entry: "The Coppersmiths of Istanbul"
 brass_events.27.historical_info: "Istanbul was home to some of the largest and most prestigious coppersmith guilds in the Islamic world. Their workshops supplied copper and brass wares to markets across the Balkans, Anatolia, and the eastern Mediterranean."
 brass_events.27.a: "Support the guilds."
 brass_events.27.b: "They will prosper without us."
 STATIC_MODIFIER_NAME_famous_coppersmiths: "Famous Coppersmiths"
 STATIC_MODIFIER_DESC_famous_coppersmiths: "The city's skilled coppersmiths produce finely crafted wares renowned for their quality, attracting merchants and enriching the local economy."

 brass_events.28.title: "De la Pirotechnia"
 brass_events.28.desc: "After decades spent among [ShowContinentName('europe')]'s furnaces, foundries, and mines, metallurgist [vannoccio_biringuccio.GetName] has compiled a remarkable treatise describing the practical arts of mining, smelting, casting, and metalworking. His work promises to preserve generations of hard-earned knowledge and spread the secrets of metallurgy to craftsmen across all of [ShowContinentName('europe')]."
 brass_events.28.entry: "De la Pirotechnia"
 brass_events.28.historical_info: "Published in 1540, De la pirotechnia by Vannoccio Biringuccio was the first comprehensive work devoted to metallurgy and the mechanical arts. Covering subjects from mining and smelting to cannon founding and brassmaking, it became one of the most influential technical books of the Renaissance."
 brass_events.28.a: "Distribute copies to our foundries."
 brass_events.28.b: "Our craftsmen know their trade."
 pirotechnia: "De la Pirotechnia"
 pirotechnia_desc: "De la Pirotechnia is a comprehensive treatise on metallurgy and the mechanical arts. It details mining, smelting, casting, and metalworking techniques, preserving generations of hard-earned knowledge for craftsmen across Europe."

 brass_events.29.title: "Peter Vischer" 
 brass_events.29.desc: "The renowned bronze founder [peter_vischer.GetName] has offered his services to our court. His mastery of bronze casting has earned him commissions from princes, bishops, and wealthy patrons throughout the Empire. Though securing his talents will require considerable expense, the monuments he creates could endure for generations as symbols of our prestige." 
 brass_events.29.entry: "Peter Vischer" 
 brass_events.29.historical_info: "Peter Vischer the Elder was Germany's foremost Renaissance bronze founder. From his workshop in Nuremberg, he produced magnificent tombs, shrines, and sculptures for churches and princely courts across the Holy Roman Empire. His masterpiece, the Shrine of Saint Sebald, remains one of the greatest achievements of Renaissance bronze casting." 
 brass_events.29.a: "Commission his works." 
 brass_events.29.b: "Our treasury cannot afford such luxuries."

 brass_events.31.title: "The Invention of Sheffield Plate"
 brass_events.31.desc: "While repairing a silver-handled knife, Sheffield cutler [thomas_boulsover.GetName] has discovered that [silver.GetName] and [copper.GetName] can be permanently fused into a single sheet. The resulting material possesses the appearance of solid silver at only a fraction of the cost. If adopted on a larger scale, this new #italic Sheffield Plate#! could transform the market for household wares and place luxury within reach of a growing [target_nation.GetAdjective] middle class."
 brass_events.31.entry: "The Invention of Sheffield Plate"
 brass_events.31.historical_info: "Around 1743, Thomas Boulsover of Sheffield accidentally discovered a method of fusing silver and copper into a durable composite known as Sheffield Plate. The process allowed elegant tableware and decorative objects to be produced at far lower cost than solid silver. Sheffield Plate rapidly became one of Britain's most successful metal industries and reshaped the markets for both silverware and pewter during the eighteenth century."
 brass_events.31.a: "Support the venture."
 brass_events.31.b: "Not now, we have more pressing matters."
 STATIC_MODIFIER_NAME_sheffield_plate: "Sheffield Plate"
 STATIC_MODIFIER_DESC_sheffield_plate: "The invention of Sheffield Plate allows silver and copper to be permanently fused into a single sheet, creating a material that has the appearance of solid silver at a fraction of the cost."

 brass_events.41.title: "Josiah Wedgwood"
 brass_events.41.desc: "Through relentless experimentation, [josiah_wedgwood.GetName] has perfected new methods of [pottery.GetName] production. His refined creamware and jasperware combine elegance with affordability, while modern manufacturing techniques promise to make fine pottery available to households across [ShowContinentName('europe')]. With the proper patronage, the potteries of [stoke.GetName] may become the envy of the world."
 brass_events.41.entry: "Josiah Wedgwood"
 brass_events.41.historical_info: "Josiah Wedgwood transformed the Staffordshire pottery industry during the eighteenth century through scientific experimentation, improved manufacturing techniques, and innovative marketing. His creamware, later known as Queen's Ware, and his celebrated jasperware became internationally renowned, while his Etruria Works helped establish Staffordshire as the world's leading centre of ceramic production."
 brass_events.41.a: "Support the venture."
 brass_events.41.b: "Not now, we have more pressing matters."
 STATIC_MODIFIER_NAME_wedgwood_pottery: "Wedgwood Potteries" 
 STATIC_MODIFIER_DESC_wedgwood_pottery: "Scientific innovation and modern production methods have transformed the local pottery industry, producing ceramics with unmatched quality."

 brass_events.51.title: "Paul de Lamerie"
 brass_events.51.desc: "The young Huguenot silversmith [paul_de_lamerie.GetName] has petitioned the Crown for financial backing to establish his own workshop in [london.GetName]. His craftsmanship of the finest [silverware.GetName] has already attracted the attention of discerning patrons, and with sufficient capital he could rival the finest goldsmiths on the Continent, bringing both wealth and prestige to [target_nation.GetName]."
 brass_events.51.entry: "Paul de Lamerie"
 brass_events.51.historical_info: "In 1712, Paul de Lamerie established his own workshop in London after completing his apprenticeship. Widely regarded as Britain's greatest eighteenth-century silversmith, his workshop produced magnificent Rococo silverware for aristocrats, merchants, and the royal court, setting the standard for English craftsmanship."
 brass_events.51.a: "Support the venture."
 brass_events.51.b: "Not now, we have more pressing matters."
 de_lamerie: "de Lamerie"
 STATIC_MODIFIER_NAME_rococo_silverware: "Rococo Silverware" 
 STATIC_MODIFIER_DESC_rococo_silverware: "Master silversmiths produce elegant Rococo silverware renowned for its exceptional craftsmanship and artistic refinement."

 brass_events.52.title: "Thomas Germain"
 brass_events.52.desc: "The renowned Parisian goldsmith [thomas_germain.GetName] has received commissions from the royal court for an ambitious series of [silverware.GetName] masterpieces. Patronage of his workshops in [paris.GetName] would ensure that our kingdom remains the foremost centre of luxury metalwork in [ShowContinentName('europe')]."
 brass_events.52.entry: "Thomas Germain"
 brass_events.52.historical_info: "Thomas Germain was the leading French goldsmith of the early eighteenth century. Appointed Goldsmith to the King, he created magnificent Rococo silverwork for Louis XV and Europe's nobility, helping establish Paris as the unrivalled centre of luxury craftsmanship."
 brass_events.52.a: "Support the venture."
 brass_events.52.b: "Not now, we have more pressing matters."

 brass_events.53.title: "Benvenuto Cellini"
 brass_events.53.desc: "The celebrated Florentine goldsmith [benvenuto_cellini.GetName] has arrived at our court seeking patronage. Renowned for his extraordinary skill in goldsmithing, engraving, and bronze casting, Cellini offers to place his talents in our service. Though his ambitions are as great as his temper, the masterpieces he creates could bring lasting prestige to [target_nation.GetName]."
 brass_events.53.entry: "Benvenuto Cellini"
 brass_events.53.historical_info: "Benvenuto Cellini was one of the greatest goldsmiths and sculptors of the Italian Renaissance. Working for popes, dukes, and kings, including Francis I of France and the Medici of Florence, he produced some of Europe's finest works of goldsmithing and bronze sculpture. His autobiography remains one of the most celebrated memoirs of the Renaissance."
 brass_events.53.a: "Offer him our patronage."
 brass_events.53.b: "Not now, we have more pressing matters."

 brass_events.54.title: "The Augsburg Silversmiths" 
 brass_events.54.desc: "The workshops of [augsburg.GetName] have earned an unrivalled reputation for their magnificent [silverware.GetName]. Master silversmiths fashion elaborate table services, ceremonial vessels, and ecclesiastical treasures for emperors, princes, and bishops across [ShowContinentName('europe')]. With continued patronage, their artistry will surely further enhance the prestige and prosperity of [target_nation.GetName]." 
 brass_events.54.entry: "The Augsburg Silversmiths" 
 brass_events.54.historical_info: "During the sixteenth and seventeenth centuries, Augsburg became one of Europe's foremost centres of silversmithing. Its master craftsmen supplied royal courts, churches, and wealthy merchants with exquisite silver tableware, ceremonial objects, and decorative works whose quality earned international renown. Augsburg silver remained a hallmark of luxury craftsmanship throughout the Early Modern period." 
 brass_events.54.a: "Patronize the silversmiths." 
 brass_events.54.b: "Their reputation speaks for itself." 
 STATIC_MODIFIER_NAME_augsburg_silversmiths: "Augsburg Silversmiths" 
 STATIC_MODIFIER_DESC_augsburg_silversmiths: "The city's master silversmiths produce magnificent works of silver renowned throughout Europe for their exceptional craftsmanship and artistic refinement."

 brass_events.61.title: "The Bells of Kampen"
 brass_events.61.desc: "The master bellfounder [gerhard_van_wou.GetName] is planning to establish his foundry in [kampen.GetName], where his extraordinary skill in casting bronze [bells.GetName] has already attracted commissions from churches and cities across Northern [ShowContinentName('europe')]. Supporting his workshop would ensure that the sound of our craftsmanship echoes far beyond our borders."
 brass_events.61.entry: "The Bells of Kampen"
 brass_events.61.historical_info: "Gerhard van Wou was the foremost bellfounder of the late Middle Ages. Working from his foundry in Kampen, he cast hundreds of bronze bells for churches throughout the Low Countries and the Holy Roman Empire. His masterpiece, the Gloriosa of Erfurt Cathedral, remains one of the largest and finest medieval bells ever cast."
 brass_events.61.a: "Support the venture."
 brass_events.61.b: "Not now, we have more pressing matters."
 van_wou: "van Wou"

 brass_events.62.title: "The Hemony Brothers"
 brass_events.62.desc: "The gifted bellfounders [pieter_hemony.GetName] and his brother François have perfected the art of tuning bronze [bells.GetName]. Their harmonious carillons are unlike any heard before, and churches and city councils across [ShowContinentName('europe')] now seek commissions from their workshops."
 brass_events.62.entry: "The Hemony Brothers"
 brass_events.62.historical_info: "Pieter and François Hemony were the greatest bellfounders of the seventeenth century. Working first in Zutphen and later in Amsterdam, they collaborated with the musician Jacob van Eyck to produce the world's first accurately tuned carillons, setting a new standard for bellfounding throughout Europe."
 brass_events.62.a: "Support their foundry."
 brass_events.62.b: "The old bells still ring well enough."
 STATIC_MODIFIER_NAME_tuned_carillons: "Tuned Carillons"
 STATIC_MODIFIER_DESC_tuned_carillons: "Master bellfounders produce finely tuned bronze bells whose unmatched harmony has earned commissions from across Europe."

 brass_events.63.title: "Andrey Chokhov"
 brass_events.63.desc: "The renowned master founder [andrey_chokhov.GetName] has petitioned for funds to expand the foundries of [moscow.GetName]. Already celebrated for his mastery of casting immense bronze [bells.GetName], he claims that greater furnaces and improved moulds will allow his workshops to produce [cannons.GetName]s unlike any yet seen in [ShowContinentName('europe')], bringing glory to both Church and State."
 brass_events.63.entry: "Andrey Chokhov"
 brass_events.63.historical_info: "Andrey Chokhov was Muscovy's greatest bronze founder. Working at the Moscow Cannon Yard, he cast numerous monumental church bells whose craftsmanship earned widespread acclaim, alongside many of Russia's finest bronze cannon. His work established Moscow as one of Europe's leading centres of large-scale bronze founding."
 brass_events.63.a: "Finance the expansion."
 brass_events.63.b: "The foundry can manage without our support."

 brass_events.64.title: "Hans Löffler"
 brass_events.64.desc: "A skilled bellfounder named [hans_loffler.GetName] has established a reputation for his precisely cast bronze [bells.GetName]. Working within reach of [target_location.GetName], he has drawn commissions from parishes and city councils eager for reliable, well-tuned bells. Securing his services for our own foundries could bring lasting benefit to [target_nation.GetName]."
 brass_events.64.entry: "Hans Löffler"
 brass_events.64.historical_info: "Bellfounding in the Alpine lands of the Empire was typically a family trade, passed from master to apprentice across generations and closely tied to the region's mining and metalworking industries. Founders based near centers like Innsbruck often supplied both ecclesiastical bells and, when called upon, cannon for the Habsburg court."
 brass_events.64.a: "Support his foundry."
 brass_events.64.b: "Not now, we have more pressing matters."

 brass_events.65.title: "Gert Klinghe"
 brass_events.65.desc: "The bellfounder [gert_klinghe.GetName] has built a modest but respected workshop in [target_location.GetName], casting bronze [bells.GetName] for the churches of the surrounding Hanseatic lands. His craftsmanship has not gone unnoticed among merchants and clergy alike, and with proper support his foundry could grow into one of the region's foremost."
 brass_events.65.entry: "Gert Klinghe"
 brass_events.65.historical_info: "In the towns of the Hanseatic League, bellfounding was closely bound to civic and religious life. Bells regulated the rhythms of trade, worship, and defense, and a city's founders were often counted among its most respected craftsmen, their bronze cast from the same furnaces that served the shipbuilders and merchants of the northern seas."
 brass_events.65.a: "Support his foundry."
 brass_events.65.b: "Not now, we have more pressing matters."

 brass_events.66.title: "Abel Rudhall"
 brass_events.66.desc: "Having inherited the family foundry of [target_location.GetName], [abel_rudhall.GetName] has continued the tradition of finely tuned bronze [bells.GetName] pioneered by his father and grandfather. His workshop, employing lathe-turning methods to perfect the pitch of each casting, has already begun supplying rings of bells to parishes across [target_nation.GetName] and beyond. Patronage now could see his name carried to churches across the wider [ShowContinentName('europe')]an world."
 brass_events.66.entry: "Abel Rudhall"
 brass_events.66.historical_info: "Abel Rudhall (1714–1760) headed the celebrated Rudhall foundry of Gloucester, a family business that cast several thousand church bells over three generations. Building on his grandfather's technique of tuning bells by turning them on a lathe rather than chipping the bronze, the Rudhalls became renowned for reliable, well-pitched rings supplied to churches throughout England, Ireland, and the American colonies."
 brass_events.66.a: "Support his foundry."
 brass_events.66.b: "Not now, we have more pressing matters."

 brass_events.67.title: "Willem Wegewaert"
 brass_events.67.desc: "The bellfounder [willem_wegewaert.GetName] has settled his craft near [target_location.GetName], casting bronze [bells.GetName] for the churches and town halls of the region. His work has already earned favorable comparison with the established foundries of the Low Countries, and continued patronage might see his workshop rival even those of [mechelen.GetName] and [kampen.GetName]."
 brass_events.67.entry: "Willem Wegewaert"
 brass_events.67.historical_info: "The Low Countries and the neighboring lands of the Rhineland formed one of Europe's densest networks of bellfounding towns during the sixteenth century. Itinerant founders traveled between commissions, casting bells on-site to avoid the difficulty of transporting them, and competition between established centers like Mechelen, Kampen, and Deventer drove steady improvements in casting and tuning."
 brass_events.67.a: "Support his foundry."
 brass_events.67.b: "Not now, we have more pressing matters."

 brass_events.68.title: "Peter van den Ghein"
 brass_events.68.desc: "The bellfounder [peter_ghein.GetName] has taken up the family trade in [target_location.GetName], casting bronze [bells.GetName] of exceptional tone and precision. His foundry, known as De Swaene, has already begun attracting commissions from churches and city councils across the Low Countries. Should his reputation continue to grow, [target_nation.GetName] may very well become the foremost center of bellfounding in all [ShowContinentName('europe')]."
 brass_events.68.entry: "Peter van den Ghein"
 brass_events.68.historical_info: "Peter I van den Ghein established his own foundry, known as De Swaene, in Mechelen in 1528, continuing a bellfounding tradition his father Willem had begun in the city in 1506. Over the following two centuries, the Van den Ghein family, later known as Vanden Gheyn, became the most celebrated bellfounding dynasty in the Low Countries, casting carillons and bells for churches and towns across Europe."
 brass_events.68.a: "Support his foundry."
 brass_events.68.b: "Not now, we have more pressing matters."
 van_den_ghein: "van den Ghein"

 brass_events.69.title: "Melchior de Haze"
 brass_events.69.desc: "The bellfounder [melchior_haze.GetName] has established himself in [target_location.GetName], where his skillfully tuned bronze [bells.GetName] have begun to draw comparison with the celebrated Hemony brothers of [amsterdam.GetName]. Though the great age of the carillon may have passed its peak, his workshop still offers craftsmanship of considerable renown to churches and city councils across the Low Countries."
 brass_events.69.entry: "Melchior de Haze"
 brass_events.69.historical_info: "Melchior de Haze was one of the leading bellfounders of Antwerp during the later seventeenth century, working in the years after the deaths of the celebrated Hemony brothers, whose secretive tuning methods set the standard for the era. Though de Haze's carillons were generally regarded as less finely tuned than the Hemonys' work, his foundry remained among the most respected in the Southern Netherlands."
 brass_events.69.a: "Support his foundry."
 brass_events.69.b: "Not now, we have more pressing matters."
 de_haze: "de Haze"

 brass_events.71.title: "The Mainz Printing House" 
 brass_events.71.desc: "Following his partnership with the financier [johann_fust.GetName], the skilled printer [peter_schoeffer.GetName] has transformed the printing workshop of [mainz.GetName] into a thriving enterprise. No longer merely an ingenious curiosity, [printing_type.GetName] has become a profitable industry capable of producing [books.GetName] in never before seen numbers. Supporting this workshop may establish us as the most important printing center in [ShowContinentName('europe')]." 
 brass_events.71.entry: "The Mainz Printing House" 
 brass_events.71.historical_info: "After Johannes Gutenberg's partnership collapsed in 1455, Johann Fust and Peter Schöffer took control of the printing workshop in Mainz. Together they established one of Europe's first successful commercial printing houses, producing the celebrated Mainz Psalter in 1457 and helping transform printing from an invention into a flourishing industry." 
 brass_events.71.a: "Invest in the printing house." 
 brass_events.71.b: "The manuscript trade is sufficient."
 STATIC_MODIFIER_NAME_master_printers: "Master Printers" 
 STATIC_MODIFIER_DESC_master_printers: "The city's renowned printers produce books of exceptional quality, attracting scholars, merchants, and patrons from across Europe."

 brass_events.72.title: "William Caslon"
 brass_events.72.desc: "The engraver and typefounder [william_caslon.GetName] has established a workshop in [london.GetName] dedicated to the production of finely cut [printing_type.GetName]. His elegant letterforms have already attracted the attention of printers throughout our realm, and with continued patronage his foundry could establish a new standard for the printed word in [target_nation.GetName] and beyond."
 brass_events.72.entry: "William Caslon"
 brass_events.72.historical_info: "William Caslon was England's foremost typefounder. Beginning in the 1720s, his beautifully proportioned typefaces transformed English printing and became the standard for books, newspapers, and official documents throughout Britain and its colonies."
 brass_events.72.a: "Patronize him."
 brass_events.72.b: "We are not interested."

 brass_events.73.title: "John Baskerville" 
 brass_events.73.desc: "The printer [john_baskerville.GetName] has perfected a new style of typography distinguished by elegant letterforms, superior inks, and exceptionally smooth paper. His workshop in [birmingham.GetName] has begun producing [books.GetName] of remarkable clarity and beauty, setting a new standard for the printed word and [printing_type.GetName] in general." 
 brass_events.73.entry: "John Baskerville" 
 brass_events.73.historical_info: "John Baskerville  was one of Britain's greatest printers and type designers. Working from Birmingham, he revolutionized printing through improvements in typography, papermaking, ink production, and presswork. His typefaces became celebrated throughout Europe for their elegance and exceptional legibility." 
 brass_events.73.a: "Support his innovations." 
 brass_events.73.b: "The old presses are sufficient."

 brass_events.74.title: "The Plantin Press" 
 brass_events.74.desc: "The printer [christophe_plantin.GetName] has established a magnificent printing house in [antwerp.GetName], where scholars, engravers, and craftsmen work together to produce [books.GetName] of unmatched quality. With royal privileges and an ever-growing network of trade, his enterprise promises to be one of [ShowContinentName('europe')]'s greatest centres of publishing." 
 brass_events.74.entry: "The Plantin Press" 
 brass_events.74.historical_info: "Christophe Plantin founded the Plantin Press in Antwerp in 1555. It became the largest and most influential printing house in Europe, producing thousands of books in numerous languages, including the celebrated Polyglot Bible. The Plantin Press helped establish Antwerp as one of the great publishing capitals of the Renaissance." 
 brass_events.74.a: "Support the press." 
 brass_events.74.b: "Books require no patronage."

 brass_events.75.title: "The Didot Printing House" 
 brass_events.75.desc: "The distinguished Didot family has transformed its workshop in [paris.GetName] into one of [ShowContinentName('europe')]'s finest printing houses. Through elegant typography, superior paper, and meticulous craftsmanship, their editions have become the standard by which all fine [books.GetName] are judged."
 brass_events.75.entry: "The Didot Printing House"
 brass_events.75.historical_info: "During the eighteenth century, the Didot family established Paris as a centre of typographical excellence. François-Ambroise Didot standardized type measurement through the Didot point system, while later generations perfected modern typefaces and advances in printing that influenced publishers throughout Europe." 
 brass_events.75.a: "Encourage their enterprise." 
 brass_events.75.b: "Our printers need no assistance."

 brass_events.76.title: "Hugo van der Goes"
 brass_events.76.desc: "A gifted painter by the name of [hugo_van_der_goes.GetName] from the Low Countries has earned renown for his remarkable mastery of oil painting and naturalistic composition. Should his talents be encouraged, his works may come to rank among the finest produced in [ShowContinentName('europe')]."
 brass_events.76.entry: "Hugo van der Goes"
 brass_events.76.historical_info: "Born around 1440, Hugo van der Goes became one of the foremost painters of the Early Netherlandish school. His Portinari Altarpiece profoundly influenced Italian Renaissance painting after its arrival in Florence, while his expressive style established him among the greatest artists of the fifteenth century."
 brass_events.76.a: "A master worthy of our patronage."
 brass_events.76.b: "We have no need of another painter."
 van_der_goes: "van der Goes"

 brass_events.77.title: "Andrea Mantegna"
 brass_events.77.desc: "A gifted painter from [target_location.GetName] named [andrea_mantegna.GetName] has begun to earn widespread acclaim for his mastery of perspective and classical composition. Should his talents be fostered, his works may come to define a new age of Italian painting."
 brass_events.77.entry: "Andrea Mantegna"
 brass_events.77.historical_info: "Born near Padua in 1431, Andrea Mantegna became one of the foremost painters of the Early Italian Renaissance. His innovative use of perspective transformed religious art, while masterpieces such as the San Zeno Altarpiece and the Camera degli Sposi secured his place among Italy's greatest artists."
 brass_events.77.a: "A master worthy of our patronage."
 brass_events.77.b: "We have no need of another painter."

 brass_events.78.title: "Rogier van der Weyden"
 brass_events.78.desc: "A painter named [rogier_van_der_weyden.GetName] has established himself in the Low Countries, earning widespread admiration for his emotional compositions and masterful command of oil painting. With suitable patronage, his works may become the finest of their age."
 brass_events.78.entry: "Rogier van der Weyden"
 brass_events.78.historical_info: "Born in Tournai around 1399, Rogier van der Weyden became official painter to the city of Brussels and one of the foremost masters of Early Netherlandish painting. His deeply expressive religious works, including the Beaune Altarpiece and The Descent from the Cross, profoundly influenced European art for generations."
 brass_events.78.a: "A master worthy of our patronage."
 brass_events.78.b: "We have no need of another painter."
 van_der_weyden: "van der Weyden"

 brass_events.79.title: "Michael Pacher"
 brass_events.79.desc: "A gifted painter and sculptor named [michael_pacher.GetName] from the Alpine lands has earned acclaim for uniting German craftsmanship with the latest artistic innovations from [ShowRegionName('italy_region')]. With suitable patronage, his monumental works may become the pride of churches throughout the Empire."
 brass_events.79.entry: "Michael Pacher"
 brass_events.79.historical_info: "Born around 1435 near Bruneck, Michael Pacher was among the greatest artists of the late Gothic period. Combining masterful woodcarving with Italian Renaissance perspective, he created the celebrated St. Wolfgang Altarpiece, one of Central Europe's finest works of religious art."
 brass_events.79.a: "A master worthy of our patronage."
 brass_events.79.b: "We have no need of another artist."

 brass_events.80.title: "Matthias Grünewald"
 brass_events.80.desc: "A gifted painter by the name of [matthias_grunewald.GetName], renowned for the emotional power of his religious works has begun to attract widespread admiration. With suitable patronage, his extraordinary talent may produce masterpieces that inspire the faithful for generations."
 brass_events.80.entry: "Matthias Grünewald"
 brass_events.80.historical_info: "Born around 1470, Matthias Grünewald was among the greatest painters of the German Renaissance. His Isenheim Altarpiece, created for the Antonite monastery at Isenheim, is celebrated for its profound emotional intensity and remains one of the masterpieces of European religious art."
 brass_events.80.a: "A master worthy of our patronage."
 brass_events.80.b: "We have no need of another painter."

 brass_events.81.title: "The Birmingham Toy Industry"
 brass_events.81.desc: "The workshops of [birmingham.GetName] have become renowned for the production of so called 'toy wares', which are small but finely crafted goods fashioned from brass, steel, and precious metals. Buttons, buckles, snuff boxes, and countless other [ornaments.GetName] now flow from the city's manufactories, earning both wealth and an enviable reputation for craftsmanship."
 brass_events.81.entry: "The Birmingham Toy Industry"
 brass_events.81.historical_info: "During the eighteenth century, Birmingham emerged as Europe's foremost producer of 'toy wares'—a contemporary term for small luxury metal goods rather than children's toys. Its workshops specialized in buttons, buckles, jewelry, snuff boxes, and decorative brass and steel objects, laying the foundations of the city's industrial prosperity."
 brass_events.81.a: "Encourage the manufactories."
 brass_events.81.b: "I see no profit in this venture."
 STATIC_MODIFIER_NAME_toy_factory: "Famous Toy Factory" 
 STATIC_MODIFIER_DESC_toy_factory: "A thriving industry of small luxury metal goods has emerged, producing buttons, buckles, snuff boxes, and other finely crafted ornaments that bring wealth and prestige to the city."

 brass_events.82.title: "The Nuremberg Toy Industry" 
 brass_events.82.desc: "The craftsmen of [nuremberg.GetName] have earned widespread renown for their ingenious 'toy wares' such as miniatures, dolls, mechanical curiosities, and other finely crafted luxuries. Coveted by merchants and noble households alike, these delicate creations have become one of the city's most celebrated exports. Continued patronage would ensure [target_nation.GetName] remains the foremost centre of such craftsmanship." 
 brass_events.82.entry: "The Nuremberg Toy Industry" 
 brass_events.82.historical_info: "From the sixteenth century onward, Nuremberg became Europe's leading centre for the manufacture of toys, miniatures, and mechanical curiosities. Its highly skilled artisans produced dolls, tin figures, dollhouse furnishings, and intricate novelties that were exported throughout the continent, establishing the city as the birthplace of Germany's toy-making tradition." 
 brass_events.82.a: "Encourage these workshops." 
 brass_events.82.b: "Such trifles are beneath our concern."

 brass_events.83.title: "Pisanello" 
 brass_events.83.desc: "The celebrated artist [pisanello.GetName] has arrived at our court seeking patronage. Inspired by the portrait coins of ancient Rome, he has perfected the art of casting commemorative bronze medals that immortalize rulers, scholars, and great deeds with remarkable realism. His creations have already become the envy of [ShowRegionName('italy_region')]'s princely courts, and securing his services would bring lasting prestige to [target_nation.GetName]." 
 brass_events.83.entry: "Pisanello" 
 brass_events.83.historical_info: "Pisanello was among the most celebrated artists of the Italian Renaissance and the inventor of the Renaissance portrait medal. Around 1438, he revived the classical tradition of commemorative bronze medallions, creating lifelike portraits inspired by ancient Roman coins. His innovations established the medal as a new artistic medium that spread rapidly among the courts of Europe." 
 brass_events.83.a: "Commission commemorative medals." 
 brass_events.83.b: "Our painters already preserve our legacy."
 di_puccio_pisano: "di Puccio Pisano"

 brass_events.84.title: "Annibale Fontana"
 brass_events.84.desc: "A young Milanese sculptor named [annibale_fontana.GetName] has begun to distinguish himself through work of exceptional delicacy, carving portrait medals, bronze reliefs, and intricate scenes upon rock crystal with a precision few can match. Though still building his reputation, his talent for combining the sculptor's eye with the engraver's patience has already drawn admiring attention. Securing his services could bring rare and refined works to [target_nation.GetName]."
 brass_events.84.entry: "Annibale Fontana"
 brass_events.84.historical_info: "Annibale Fontana was a Milanese sculptor, medallist, and rock-crystal engraver of the late Renaissance. Beginning his career carving portrait medals and bronze reliefs, he later achieved renown for his luminous intaglio scenes cut into rock crystal, work commissioned by patrons including Duke Albert V of Bavaria. In his later years he turned to large-scale sculpture, producing the statue of the Assumption and numerous façade figures for the church of Santa Maria presso San Celso in Milan."
 brass_events.84.a: "Offer him our patronage."
 brass_events.84.b: "Not now, we have more pressing matters."

 brass_events.85.title: "Giambologna"
 brass_events.85.desc: "A gifted sculptor from the Low Countries has arrived in [target_location.GetName], where his remarkable command of bronze and marble has already attracted considerable admiration. Should his talents be cultivated, he may one day produce works worthy of the greatest courts in [ShowContinentName('europe')]."
 brass_events.85.entry: "Giambologna"
 brass_events.85.historical_info: "Born Jean Boulogne in Douai around 1529, Giambologna settled in Florence after studying in Antwerp and Rome. Under Medici patronage he became the foremost sculptor of the late Renaissance, creating masterpieces such as Flying Mercury, the Neptune Fountain, and the Equestrian Monument of Cosimo I."
 brass_events.85.a: "A master worthy of our patronage."
 brass_events.85.b: "We have no need of him."
 de_boulogne: "de Boulogne"

 brass_events.86.title: "Pietro Tacca"
 brass_events.86.desc: "A promising young sculptor from [ShowAreaName('tuscany_area')] has entered the workshops of [target_location.GetName], where his talent for bronze casting has already begun to attract notice. Under the guidance of accomplished masters, he may yet become one of the foremost sculptors of his age."
 brass_events.86.entry: "Pietro Tacca"
 brass_events.86.historical_info: "Born in Carrara in 1577, Pietro Tacca trained under Giambologna in Florence before succeeding him as court sculptor to the Medici. He became one of the leading bronze sculptors of the seventeenth century, creating works such as Il Porcellino, the Four Moors Fountain, and the Equestrian Monument of Philip IV."
 brass_events.86.a: "His future shows great promise."
 brass_events.86.b: "He will have to succeed on his own."

 brass_events.87.title: "Tommaso Laureti"
 brass_events.87.desc: "An accomplished painter and architect from [ShowAreaName('sicily_area')] has arrived in [target_location.GetName], where his talent for grand civic designs has begun to attract attention. Given the opportunity, his work could transform the appearance of cities for generations to come."
 brass_events.87.entry: "Tommaso Laureti"
 brass_events.87.historical_info: "Born in Palermo around 1530, Tommaso Laureti established himself in Bologna before later entering papal service in Rome. Best remembered for designing the Neptune Fountain in Bologna and for his frescoes in the Vatican, he was among the leading architects and painters of the late Renaissance."
 brass_events.87.a: "A talent worthy of patronage."
 brass_events.87.b: "We have no need of another artist."

 brass_events.88.title: "Andrea del Verrocchio"
 brass_events.88.desc: "An accomplished [target_nation.GetAdjective] sculptor and goldsmith has established a thriving workshop in [target_location.GetName]. Renowned for his mastery of bronze and marble, his talents promise to enrich the artistic reputation of any court fortunate enough to secure his service."
 brass_events.88.entry: "Andrea del Verrocchio"
 brass_events.88.historical_info: "Born in Florence around 1435, Andrea del Verrocchio became one of the leading sculptors and goldsmiths of the Early Renaissance. His workshop trained many celebrated artists, including Leonardo da Vinci, while his own masterpieces include Putto with Dolphin and the Equestrian Monument of Bartolomeo Colleoni."
 brass_events.88.a: "A master worthy of our patronage."
 brass_events.88.b: "We have no need of another artist."

 ARTIST_TYPE_NAME_bell_founder: "Bell founder"
 ARTIST_TYPE_DESC_bell_founder: "A skilled artisan who casts and tunes bronze bells for churches, civic buildings, and carillons. Sometimes they dabble in cannons too."
 statuette: "Statuette"
 statuette_desc: "A small sculpture, often made from metal, often depicting a religious or mythological figure, used for decoration or as a votive offering."
 great_cannon: "Great Cannon"
 great_cannon_desc: "A large artillery piece, typically made of bronze, too impractical for regular military use but symbolically powerful."
 great_bell: "Great Bell"
 great_bell_desc: "A large bell, often made of bronze, used in churches or civic buildings to signal time or events."
 royal_plate: "Royal Plate"
 royal_plate_desc: "A set of ceremonial tableware, often made from precious metals, used for state occasions and royal banquets."
 medal: "Medal"
 medal_desc: "A small, flat, round piece of metal, often made from bronze or silver, used to commemorate an event or achievement."
 altarpiece: "Altarpiece"
 altarpiece_desc: "A work of art, often a painting or sculpture, placed behind or above an altar in a church, often depicting religious scenes or figures."
 reliquary: "Reliquary"
 reliquary_desc: "A richly ornamented container, often fashioned from precious metals and gemstones, made to house and display the sacred relics of saints or other holy figures for veneration."

