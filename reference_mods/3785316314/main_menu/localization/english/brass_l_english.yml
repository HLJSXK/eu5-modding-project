 brassware: "Brassware"
 brassware_desc: "Brassware encompasses the many household, decorative, and industrial goods made from brass, an alloy of copper and zinc. Its golden appearance made it a popular substitute for precious metals, while its durability ensured widespread use in tools, instruments, fittings, and ornaments. The growth of urban workshops greatly increased the demand for finely crafted brass goods."
