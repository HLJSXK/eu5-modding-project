 STATIC_MODIFIER_NAME_brass_zinc_mining: "La Calamine"
 STATIC_MODIFIER_DESC_brass_zinc_mining: "The hills around Aachen conceal some of the richest calamine deposits in the world, a fact known to brass-smiths since Roman times. The town of La Calamine sits atop this wealth, and the miners and merchants of the region have long supplied the furnaces of the Rhineland and the Low Countries with the essential ore from which brass is made."

 antimony: "Antimony"
 antimony_desc: "Antimony has long been valued as an additive in metallurgy, where even small quantities could alter the properties of other metals. It was used to harden lead for ammunition, improve alloys, and produce pigments and medicines. While rarely traded in the same volumes as other metals, its specialized applications made it a valuable commodity."
