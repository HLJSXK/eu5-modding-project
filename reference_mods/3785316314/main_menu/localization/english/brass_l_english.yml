 brass_events.101.title: "Poison or Medicine?"
 brass_events.101.desc: "A physician in [first_location.GetName] has gained a reputation for prescribing [antimony.GetName]-based remedies. While many praise his cures, others insist his treatments are little better than poison. His fame has drawn merchants and patients from across [target_nation.GetName]."
 brass_events.101.a: "A promising remedy."
 brass_events.101.b: "Reckless Quackery."
 STATIC_MODIFIER_NAME_antimony_poison: "Antimony Poisoning"
 STATIC_MODIFIER_DESC_antimony_poison: "The physician's use of antimony-based remedies has drawn both praise and criticism, with some hailing his treatments as miraculous cures while others warn of their potential toxicity."
 STATIC_MODIFIER_NAME_antimony_remedies: "Antimony Remedies"
 STATIC_MODIFIER_DESC_antimony_remedies: "The physician's use of antimony-based remedies has drawn both praise and criticism, with some hailing his treatments as miraculous cures while others warn of their potential toxicity."

 brass_events.102.title: "Cheap Imitations"
 brass_events.102.desc: "Merchants in [first_location.GetName] have begun flooding local markets with cut-rate [pewterware.GetName], cast from alloys thinned with cheap [lead.GetName] to save on costlier [tin.GetName]. While the wares sell brisklay among those who cannot afford better, established pewterers warn that the flood of shoddy goods threatens both the health of buyers and the reputation of the craft itself."
 brass_events.102.a: "Tax the lower quality Pewter higher."
 brass_events.102.b: "Enforce the guild's standards."

 brass_events.103.title: "A Royal Gift"
 brass_events.103.desc: "Our court advisors suggest that [target_location.GetName]'s silversmiths be commissioned to produce fine [silverware.GetName] befitting gifts for foreign courts and visiting envoys. A well-chosen gift, they argue, does more to smooth negotiations than a dozen letters, and a reputation for generosity abroad could serve us well in the years to come."
 brass_events.103.a: "Commission the guild."
 brass_events.103.b: "Our envoys can manage without such extravagance."
 STATIC_MODIFIER_NAME_diplomatic_bonus_silverware: "Diplomatic Service"
 STATIC_MODIFIER_DESC_diplomatic_bonus_silverware: "Fine silverware and luxurious table settings impress foreign envoys and visiting dignitaries, enhancing the prestige and refinement of our diplomatic court."

 brass_events.104.title: "Master Brass Founder"
 brass_events.104.desc: "A master craftsman in [first_location.GetName] has earned a considerable reputation for his exquisite [brassware.GetName], his candlesticks, basins, and ornamental fittings prized for their fine polish and intricate detail. Word of his skill has begun to spread beyond the town, and offering him our patronage could see his talents placed in service of our own workshops."
 brass_events.104.a: "Offer him our patronage."
 brass_events.104.b: "Not now, we have more pressing matters."

 brass_events.105.title: "A Cracked Bell"
 brass_events.105.desc: "Disaster struck when the great [bells.GetName] of [first_location.GetName] cracked during a local festival. The townsfolk insist they must be recast before the next holy day, though doing so will require a considerable quantity of bronze and skilled labor."
 brass_events.105.a: "Recast it immediately."
 brass_events.105.b: "The old bell will have to suffice."

 brass_events.106.title: "Artisan Competition"
 brass_events.106.desc: "Two rival craftsmen in [first_location.GetName], each celebrated for their exceptional [ornaments.GetName], have both petitioned for mastership of the local guild. The dispute has split the workshops and threatens to turn bitter, and it now falls to us to settle the matter, whether by the judgment of their peers or by the weight of their purses."
 brass_events.106.a: "Let the guild judge their skill."
 brass_events.106.b: "Let the highest bidder prevail."

 brass_events.107.title: "A New Font"
 brass_events.107.desc: "A punchcutter in [first_location.GetName] has unveiled a striking new typeface. Printers praise its clarity, while foreign workshops are already offering generous sums for copies of the punches and matrices. The punchcutter has petitioned for our support, to secure the rights to produce the new [printing_type.GetName]."
 brass_events.107.a: "Keep the design exclusive to our printers."
 brass_events.107.b: "Sell the punches abroad."

 seongdeok_bell: "Bell of King Seongdeok"
 seongdeok_bell_desc: "Cast in 771 during the height of the Unified Silla Kingdom, the Bell of King Seongdeok stands as Korea's greatest surviving bronze bell. Commissioned to honor the late king, its unmatched craftsmanship, deep resonant tone, and exquisite Buddhist ornamentation symbolize the artistic, spiritual, and technological achievements of Silla's golden age."
 todaiji: "Todaiji Temple"
 todaiji_desc: "Founded in the eighth century as the foremost temple of the realm, Tōdaiji stands as a monument to both imperial authority and Buddhist devotion."
 shoro: "Tōdaiji Shōrō"
 shoro_desc: "The ancient bell tower of Tōdai-ji houses one of Japan's largest temple bells. Struck to mark the hours of prayer and the passing of the seasons, its solemn toll has echoed across Nara for centuries and was reconstructed in 1210."
 capitoline_wolf: "Capitoline Wolf"
 capitoline_wolf_desc: "Depicting the she-wolf said to have suckled Romulus and Remus, the legendary founders of Rome, the Capitoline Wolf has long stood as a powerful emblem of the Eternal City's mythical origins."
 jowo_rinpoche: "Jowo Rinpoche"
 jowo_rinpoche_desc: "Created in the early seventh century and venerated as the truest likeness of the historical Buddha, the Jowo Rinpoche is the holiest statue in Tibetan Buddhism. It draws pilgrims from across the Himalayas for centuries, serving as both a sacred relic and a symbol of Tibet's spiritual heart."
 jokhang: "Jokhang"
 jokhang_desc: "Founded in the seventh century by King Songtsen Gampo, the Jokhang is the spiritual heart of Tibetan Buddhism and the foremost pilgrimage site of Tibet. Built to enshrine the revered Jowo Rinpoche, its halls have welcomed generations of pilgrims whose devotion has made the temple a lasting symbol of faith, learning, and royal patronage."
 golden_buddha_wat_traimit: "Golden Buddha of Wat Traimit"
 golden_buddha_wat_traimit_desc: "Fashioned from solid gold during the height of the Sukhothai Kingdom, this revered image of the Buddha embodies the spiritual devotion and artistic refinement of its age."
 spinario: "Spinario"
 spinario_desc: "Depicting a youth absorbed in removing a thorn from his foot, the Spinario is among the most celebrated bronzes to survive from classical antiquity and is widely admired for its lifelike naturalism and quiet introspection."
 marcus_aurelius_equestrian: "Equestrian Statue of Marcus Aurelius"
 marcus_aurelius_equestrian_desc: "Cast in the second century, this bronze equestrian statue of Emperor Marcus Aurelius is the finest of its kind to survive from antiquity. Preserved through the Middle Ages by the mistaken belief that it depicted Constantine the Great, it remains a powerful symbol of Roman imperial authority and artistic achievement."
 chola_nataraja: "Chola Bronze Nataraja"
 chola_nataraja_desc: "Depicting Śiva as the Lord of the Cosmic Dance, this bronze masterpiece embodies the artistic and spiritual heights of the Chola age. Cast by the lost-wax method with extraordinary grace and balance, it serves as both an object of worship and one of the finest achievements of Indian sculpture."
 golden_madonna_essen: "Golden Madonna of Essen"
 golden_madonna_essen_desc: "Created during the Ottonian Renaissance, the Golden Madonna of Essen is the oldest surviving free-standing sculpture of the Virgin Mary in the West. Fashioned from gold leaf over a wooden core, it has long been venerated as both a sacred relic and a masterpiece of medieval craftsmanship."
 majesty_sainte_foy: "Majesty of Sainte Foy"
 majesty_sainte_foy_desc: "Fashioned to enshrine the relics of Saint Faith, this golden reliquary enthroned in majesty became one of the greatest pilgrimage treasures of medieval Christendom. Adorned with precious gems and ancient cameos donated by generations of the faithful, it reflects both profound devotion and exceptional craftsmanship."
 great_buddha_kamakura: "Great Buddha of Kamakura"
 great_buddha_kamakura_desc: "Cast in bronze during the Kamakura period, this colossal image of Amida Buddha embodies serenity and spiritual grandeur. Revered by pilgrims and monks, it stands as one of Japan's greatest achievements in Buddhist art and a lasting symbol of faith."
 ife_head: "Ife Brass Head"
 ife_head_desc: "Renowned for their striking naturalism and refined craftsmanship, the brass heads of Ife rank among the greatest achievements of African sculpture. Cast by the lost-wax method, they embody the artistic sophistication and sacred kingship of the Yoruba city of Ife."
 statue_st_peter: "Statue of Saint Peter"
 statue_st_peter_desc: "Depicting the Apostle seated in blessing and holding the Keys of Heaven, this bronze statue has long been an object of pilgrimage and veneration. This statue is truly one of the most revered devotional images in Christendom."
 reliquary_bust_st_yrieix: "Reliquary Bust of Saint Yrieix"
 reliquary_bust_st_yrieix_desc: "Crafted by the master goldsmiths of Limoges, this magnificent silver-gilt reliquary was fashioned to enshrine the skull of Saint Yrieix. Richly adorned with filigree, rock crystal, and precious stones, it exemplifies the exceptional artistry and devotional splendor of medieval Limousin."
 pala_doro: "Pala d'Oro"
 pala_doro_desc: "Adorned with hundreds of Byzantine enamels, pearls, and precious gemstones, the Pala d'Oro is among the most magnificent altarpieces ever created. Enriched over centuries by Venetian patrons and treasures brought from Constantinople, it stands as a dazzling testament to the wealth, piety, and artistic splendor of Saint Mark's Basilica."
 shrine_three_kings: "Shrine of the Three Kings"
 shrine_three_kings_desc: "Fashioned to enshrine the relics of the Three Magi, this gilded reliquary is the greatest masterpiece of medieval goldsmithing. Richly adorned with gold, silver, enamels, and precious gemstones, it transformed Cologne into one of the most important pilgrimage destinations of Christendom."
 antependium_sant_ambrogio: "Antependium of Sant'Ambrogio"
 antependium_sant_ambrogio_desc: "Fashioned in gold and silver by the master goldsmith Volvinius, this magnificent altar frontal adorns the high altar of the Basilica of Sant'Ambrogio. Richly decorated with scenes from the life of Christ and the patron saint of Milan, it stands among the finest surviving masterpieces of Carolingian metalwork."
 basilica_sant_ambrogio: "Basilica of Sant'Ambrogio"
 basilica_sant_ambrogio_desc: "Founded by Saint Ambrose in the fourth century and rebuilt in the Romanesque style, the Basilica of Sant'Ambrogio ranks among the most revered churches of Italy. Long associated with the coronation of the Kings of Italy and the enduring legacy of its patron saint, it stands as a symbol of Milan's spiritual and political importance."
 lothair_cross: "Lothair Cross"
 lothair_cross_desc: "Fashioned during the Ottonian Renaissance, the Lothair Cross is among the finest masterpieces of medieval goldsmithing. Adorned with gems, pearls, and an ancient cameo of King Lothair II, it served as the ceremonial processional cross of Aachen Cathedral and symbolized the continuity of imperial rule."
 monza_ampullae: "Monza Ampullae"
 monza_ampullae_desc: "These small pilgrimage flasks, brought from the Holy Land, preserve sacred oils and earth associated with the sites of Christ's life and Passion. Treasured in the cathedral of Monza since the early Middle Ages, they rank among the most important surviving relics of early Christian pilgrimage."
 monza_cathedral: "Monza Cathedral"
 monza_cathedral_desc: "Founded by the Lombard queen Theodelinda, Monza Cathedral became the guardian of the Iron Crown of Lombardy and one of the kingdom's most revered sanctuaries. Its treasury, enriched by royal patronage and sacred relics, made it a lasting symbol of Lombard piety and kingship."
 gloucester_candlestick: "Gloucester Candlestick"
 gloucester_candlestick_desc: "Cast in bronze with extraordinary intricacy, the Gloucester Candlestick is among the greatest masterpieces of Romanesque metalwork. Its twisting beasts, foliage, and human figures display remarkable technical virtuosity, reflecting the artistic brilliance of twelfth-century England."
 stavelot_triptych: "Stavelot Triptych"
 stavelot_triptych_desc: "Commissioned by Abbot Wibald, this magnificent reliquary triptych enshrines fragments of the True Cross within two Byzantine reliquaries set into a splendid Mosan frame. Uniting the artistic traditions of East and West, it ranks among the finest treasures of medieval Christendom."
 baptistere_saint_louis: "Basin of Muhammad ibn al-Zayn"
 baptistere_saint_louis_desc: "Fashioned from brass inlaid with gold and silver by the master craftsman Muhammad ibn al-Zayn, this magnificent basin ranks among the greatest achievements of Mamluk metalwork. Covered with scenes of courtly life, hunting, and triumph, it reflects the wealth and artistic refinement of the Mamluk Sultanate."
 theophanu_cross: "Theophanu Cross"
 theophanu_cross_desc: "Commissioned by Abbess Theophanu during the Ottonian Renaissance, this magnificent processional cross is adorned with gold, pearls, and precious gemstones. A masterpiece of medieval goldsmithing, it reflects the wealth, piety, and artistic refinement of the imperial abbey of Essen."
 maesta: "Maestà"
 maesta_desc: "Painted by Duccio di Buoninsegna for the high altar of Siena Cathedral, the Maestà is one of the supreme masterpieces of medieval Italian painting. Richly adorned with gold leaf and depicting the Virgin enthroned amidst saints and angels, it became both the spiritual heart of Siena and a defining achievement of the Sienese School."
 basilica_san_zeno: "Basilica of San Zeno"
 basilica_san_zeno_desc: "Founded over the burial site of Saint Zeno, the Basilica of San Zeno in Verona is one of Italy's finest Romanesque churches."

 brass_events.201.title: "The Tsar Bell"
 brass_events.201.desc: "Master founders in [target_location.GetName] have proposed casting the largest [bells.GetName] ever attempted. Commissioned to proclaim the majesty of the realm and the glory of the Orthodox faith, the colossal bell would dwarf every bell cast before it. Such an undertaking would demand enormous quantities of bronze and no small expense, yet should it succeed, its fame would spread throughout all of [ShowContinentName('europe')]."
 brass_events.201.entry: "The Tsar Bell"
 brass_events.201.historical_info: "Commissioned by Empress Anna Ioannovna in 1733, the Tsar Bell was cast in Moscow by Ivan and Mikhail Motorin. Weighing nearly 200 tons, it remains the largest bell ever cast. Before it could be hung or rung, however, a fire broke out during construction. Cold water thrown upon the heated bronze caused a massive fragment to crack away, leaving the bell forever silent. Despite never fulfilling its intended purpose, the Tsar Bell remains one of the greatest achievements of bronze founding."
 brass_events.201.a: "Let our glory be cast in bronze."
 brass_events.201.b: "Such extravagance serves no practical purpose."
 tsar_bell: "Tsar Bell"
 tsar_bell_desc: "The largest bell ever cast, weighing nearly 200 tons. Commissioned by Empress Anna Ioannovna in 1733, it was never hung or rung due to a catastrophic crack during casting, yet remains a symbol of Russian ambition."

 brass_events.202.title: "The Liberty Bell"
 brass_events.202.desc: "The Assembly of [target_location.GetName] wishes to commission a great [bells.GetName] to hang within the State House. This bell will commemorate the principles of justice and good government and bear the Biblical inscription: '#italic Proclaim Liberty Throughout All the Land Unto All the Inhabitants Thereof.#!' Though intended for ceremonial use, it may yet become a lasting symbol of our nation."
 brass_events.202.entry: "The Liberty Bell"
 brass_events.202.historical_info: "Commissioned in 1751 for the Pennsylvania State House, the Liberty Bell was cast by the Whitechapel Bell Foundry in London before being recast in Philadelphia after cracking during testing. During the nineteenth century it became an enduring symbol of the American abolitionist movement and, later, of liberty itself. Although popularly associated with the Declaration of Independence, there is no contemporary evidence that it rang on 4 July 1776."
 brass_events.202.a: "May its voice proclaim liberty."
 brass_events.202.b: "Our treasury has greater needs."
 liberty_bell: "Liberty Bell"
 liberty_bell_desc: "A great bell commissioned in 1751 to hang within the Pennsylvania State House. Bearing the inscription 'Proclaim Liberty Throughout All the Land Unto All the Inhabitants Thereof,' it has become an enduring symbol of liberty and justice."

 brass_events.203.title: "The Sigismund Bell"
 brass_events.203.desc: "The cathedral chapter in [target_location.GetName] has proposed the casting of an immense bronze bell for Wawel Cathedral. Such an undertaking would demand vast quantities of metal and the services of a master founder, yet the finished bell would stand as a lasting symbol of [target_nation.GetName]'s devotion to [religion.GetName]."
 brass_events.203.entry: "The Sigismund Bell"
 brass_events.203.historical_info: "The Sigismund Bell was commissioned by King Sigismund I the Old in 1520 and cast by the Nuremberg founder Hans Behem in 1521. Installed in Wawel Cathedral, it became Poland's most celebrated bell and has traditionally been rung only on the nation's most important religious and state occasions."
 brass_events.203.a: "Let its voice ring across the realm."
 brass_events.203.b: "We cannot spare the expense."
 sigismund_bell: "Sigismund Bell"
 sigismund_bell_desc: "Cast by Hans Behem in 1521 for Wawel Cathedral, the Sigismund Bell is regarded as Poland's national bell. Reserved for the kingdom's most solemn religious festivals and historic occasions, its deep peal has echoed across Kraków for centuries."

 brass_events.205.title: "The Pummerin"
 brass_events.205.desc: "A group of clergymen in [target_location.GetName] has proposed the casting of a great bell from bronze recovered from cannons captured during recent wars. Such a work would commemorate the triumph of [religion.GetName], while proclaiming the strength and prosperity of [target_nation.GetName] for generations to come."
 brass_events.205.entry: "The Pummerin"
 brass_events.205.historical_info: "The original Pummerin was cast in 1711 from bronze taken from Ottoman cannon captured during the relief of Vienna in 1683. Hung in St. Stephen's Cathedral, it became Austria's most celebrated bell and a lasting symbol of the Habsburg victory over the Ottoman Empire."
 brass_events.205.a: "Let victory ring from every tower."
 brass_events.205.b: "Such celebrations can wait."
 pummerin: "Pummerin"
 pummerin_desc: "Cast in 1711 from the bronze of captured Ottoman cannon, the Pummerin became the great bell of St. Stephen's Cathedral in Vienna. For centuries its deep toll marked the most significant religious festivals and state occasions of the Habsburg lands."

 brass_events.206.title: "Maria Gloriosa"
 brass_events.206.desc: "A chapter of [target_location.GetName] Cathedral has proposed comissioning [culture.GetName] bellfounder [character.GetName] for the casting of a magnificent bronze bell worthy of the city's great church. The undertaking will demand vast quantities of metal and the skill of an accomplished founder, but its voice could inspire the faithful of [target_nation.GetName] for centuries to come."
 brass_events.206.entry: "Maria Gloriosa"
 brass_events.206.historical_info: "Maria Gloriosa was cast by the Dutch bell founder Gerhard van Wou in 1497 for Erfurt Cathedral. Renowned for both its immense size and exceptional tone, it is widely regarded as one of the finest medieval bells ever made and remains in use today."
 brass_events.206.a: "Let its voice resound for generations."
 brass_events.206.b: "The cathedral must wait."
 maria_gloriosa: "Maria Gloriosa"
 maria_gloriosa_desc: "Cast by Gerhard van Wou in 1497 for Erfurt Cathedral, Maria Gloriosa is celebrated for its remarkable tone and craftsmanship. Often considered the finest surviving medieval bell, it has rung across Erfurt for more than five centuries."

 brass_events.208.title: "Perseus with the Head of Medusa"
 brass_events.208.desc: "The celebrated sculptor [character.GetName] has presented an ambitious proposal for a monumental bronze statue to adorn the Loggia dei Lanzi in [target_location.GetName]. Casting such a work in a single piece would test even the finest founder, but its completion would proclaim the artistic brilliance and prestige of [target_nation.GetName]."
 brass_events.208.entry: "Perseus with the Head of Medusa"
 brass_events.208.historical_info: "Perseus with the Head of Medusa was commissioned for Florence by Duke Cosimo I de' Medici and cast by Benvenuto Cellini between 1545 and 1554. Its successful single-piece bronze casting was a remarkable technical achievement and secured Cellini's reputation as one of the greatest sculptors of the Renaissance."
 brass_events.208.a: "A masterpiece worthy of our city."
 brass_events.208.b: "The risk is too great."
 perseus_medusa: "Perseus with the Head of Medusa"
 perseus_medusa_desc: "Cast by Benvenuto Cellini between 1545 and 1554, Perseus with the Head of Medusa is among the masterpieces of Renaissance bronze sculpture. Celebrated for its daring single-piece casting and dramatic composition, it remains one of Florence's defining monuments."

 brass_events.210.title: "The Colleoni Monument"
 brass_events.210.desc: "A distinguished condottiero has bequeathed a considerable fortune to [target_nation.GetName], provided a magnificent equestrian monument is erected in his memory. Accepting such a commission would honour a lifetime of military service while demonstrating the republic's gratitude to those who defend it."
 brass_events.210.entry: "The Colleoni Monument"
 brass_events.210.historical_info: "The Equestrian Monument of Bartolomeo Colleoni was commissioned by the Republic of Venice in accordance with Colleoni's will. Begun by Andrea del Verrocchio in 1481 and completed after his death by Alessandro Leopardi in 1496, it is regarded as one of the greatest equestrian sculptures of the Renaissance."
 brass_events.210.a: "A worthy tribute to loyal service."
 brass_events.210.b: "The treasury has other priorities."
 colleoni_monument: "Colleoni Monument"
 colleoni_monument_desc: "Created by Andrea del Verrocchio and completed by Alessandro Leopardi in 1496, the Colleoni Monument stands in Venice as one of the masterpieces of Renaissance bronze sculpture. Its powerful depiction of the famed condottiero became a model for later equestrian monuments across Europe."

 brass_events.211.title: "Gattamelata"
 brass_events.211.desc: "Supporters of a renowned condottiero have petitioned for the erection of a grand equestrian monument in [target_location.GetName]. They wish for the state to comission [character.GetName], which would be a costly affair, but such a work of art would stand as a lasting tribute to military virtue and the honour of those who faithfully serve [target_nation.GetName]."
 brass_events.211.entry: "Gattamelata"
 brass_events.211.historical_info: "The Equestrian Monument of Gattamelata was commissioned by the family of the condottiero Erasmo da Narni, known as Gattamelata, shortly after his death. Created by Donatello between 1445 and 1453, it was the first life-sized equestrian bronze cast since antiquity and became one of the defining masterpieces of the Renaissance."
 brass_events.211.a: "A fitting memorial to faithful service."
 brass_events.211.b: "Such honours are unnecessary."
 gattamelata: "Gattamelata"
 gattamelata_desc: "Created by Donatello between 1445 and 1453, Gattamelata revived the monumental bronze equestrian statue after more than a millennium. Standing before the Basilica of Saint Anthony in Padua, it became one of the most influential sculptures of the Renaissance."

 brass_events.212.title: "Flying Mercury"
 brass_events.212.desc: "The court has been presented by the famous sculptor [character.GetName] with an ambitious design for an elegant bronze statue of Mercury, messenger of the gods. Balancing upon a breath of wind, the work would demand extraordinary skill from its sculptor, yet it promises to become a triumph of artistry worthy of [target_nation.GetName]."
 brass_events.212.entry: "Flying Mercury"
 brass_events.212.historical_info: "Flying Mercury was created by Giambologna around 1580 for the Medici court in Florence. Celebrated for its daring composition, in which Mercury appears to soar upon a single outstretched toe, it became one of the defining masterpieces of late Renaissance bronze sculpture."
 brass_events.212.a: "Commission this marvel of bronze."
 brass_events.212.b: "Our patronage lies elsewhere."
 flying_mercury: "Flying Mercury"
 flying_mercury_desc: "Created by Giambologna around 1580, Flying Mercury is among the most celebrated bronzes of the late Renaissance. Its seemingly weightless composition and technical virtuosity made it one of the sculptor's most admired works, with casts finding their way into princely collections across Europe."

 brass_events.213.title: "Judith and Holofernes"
 brass_events.213.desc: "Courtiers have proposed to comission [character.GetName] for a monumental bronze depiction of Judith's triumph over Holofernes. Beyond its artistic merit, the work would stand as a powerful symbol of courage overcoming tyranny, making it a fitting ornament for [target_location.GetName] in the backdrop of the wider Italian Wars."
 brass_events.213.entry: "Judith and Holofernes"
 brass_events.213.historical_info: "Judith and Holofernes was created by Donatello between 1457 and 1464 for the Medici Palace in Florence. After the expulsion of the Medici in 1494, the bronze was moved to the Piazza della Signoria, where it came to symbolize liberty and resistance to tyranny."
 brass_events.213.a: "Let virtue triumph in bronze."
 brass_events.213.b: "A simpler monument will suffice."
 judith_holofernes: "Judith and Holofernes"
 judith_holofernes_desc: "Created by Donatello between 1457 and 1464, Judith and Holofernes is among the masterpieces of early Renaissance bronze sculpture. Its powerful biblical imagery and later association with Florentine republican ideals made it one of the city's most celebrated monuments."

 brass_events.214.title: "The Saliera"
 brass_events.214.desc: "The royal household has proposed commissioning [character.GetName] for an elaborate gold salt cellar unlike any yet seen. Combining precious metals with exquisite craftsmanship, such a work would proclaim the refinement and splendour of [target_nation.GetName]'s court to all who behold it."
 brass_events.214.entry: "The Saliera"
 brass_events.214.historical_info: "The Saliera was created by Benvenuto Cellini between 1540 and 1543 for the French king Francis I. Fashioned from gold and enamel, it is the only surviving goldsmith's work securely attributed to Cellini and is widely regarded as the greatest masterpiece of Renaissance metalwork."
 brass_events.214.a: "Spare no expense."
 brass_events.214.b: "Such luxuries can wait."
 saliera: "Saliera"
 saliera_desc: "Created by Benvenuto Cellini between 1540 and 1543, the Saliera is the finest surviving masterpiece of Renaissance goldsmithing. Its intricate figures of Neptune and Tellus transformed a humble salt cellar into one of the most celebrated works of decorative art ever produced."

 brass_events.215.title: "Il Porcellino"
 brass_events.215.desc: "The magistrates of [target_location.GetName] have proposed comissioning [character.GetName] with adorning the city's market with a finely cast bronze boar. Though less grand than a monument to princes or heroes, such a work would lend distinction to the marketplace and delight citizens and visitors alike."
 brass_events.215.entry: "Il Porcellino"
 brass_events.215.historical_info: "Il Porcellino was cast by Pietro Tacca between 1612 and 1633 for the Mercato Nuovo in Florence. Based on an ancient Roman marble sculpture, the bronze boar became one of the city's most beloved landmarks and remains a symbol of Florence to this day."
 brass_events.215.a: "A worthy adornment for our city."
 brass_events.215.b: "The market has no need of such luxuries."
 il_porcellino: "Il Porcellino"
 il_porcellino_desc: "Cast by Pietro Tacca for Florence's Mercato Nuovo, Il Porcellino transformed an ancient Roman model into one of the city's most enduring symbols. For centuries, locals and travellers alike have paused to admire—and touch—the famous bronze boar."

 brass_events.216.title: "The Neptune Fountain"
 brass_events.216.desc: "The authorities of [target_location.GetName] have proposed the erection of a magnificent fountain crowned by a monumental bronze Neptune. The sculptor [character.GetName] has submitted an ambitious design, one that would transform the city's principal square into a lasting testament to the prosperity and authority of [target_nation.GetName]."
 brass_events.216.entry: "The Neptune Fountain"
 brass_events.216.historical_info: "The Neptune Fountain was commissioned for Bologna by Pope Pius IV and completed by Giambologna in 1566. The monumental bronze figure of Neptune became one of the sculptor's earliest masterpieces and remains among the defining works of late Renaissance public sculpture."
 brass_events.216.a: "Let Neptune reign over the square."
 brass_events.216.b: "The city has greater needs."
 neptune_fountain: "Neptune Fountain"
 neptune_fountain_desc: "Completed by Giambologna in 1566, the Neptune Fountain dominates Bologna's Piazza del Nettuno with its monumental bronze figure of the sea god. Commissioned under Pope Pius IV, it became one of the masterpieces of Renaissance civic sculpture."

 brass_events.217.title: "Putto with Dolphin"
 brass_events.217.desc: "[character.GetName] has proposed an elegant bronze fountain crowned by a playful putto astride a dolphin. Though modest in scale, the work would showcase exceptional craftsmanship while lending grace and refinement to the gardens and courtyards of [target_location.GetName]."
 brass_events.217.entry: "Putto with Dolphin"
 brass_events.217.historical_info: "Putto with Dolphin was created by Andrea del Verrocchio around 1470 for the Medici Villa at Careggi. Celebrated for its lively composition and technical mastery, the bronze was later moved to the Palazzo Vecchio, where it became one of Florence's most admired Renaissance sculptures."
 brass_events.217.a: "A graceful work of art."
 brass_events.217.b: "Our patronage lies elsewhere."
 putto_with_dolphin: "Putto with Dolphin"
 putto_with_dolphin_desc: "Created by Andrea del Verrocchio around 1470, Putto with Dolphin is among the finest bronze fountain sculptures of the Early Renaissance. Its lively composition and natural movement exemplify the artistic innovations that made Florence a centre of Renaissance sculpture."

 brass_events.218.title: "The Equestrian Monument"
 brass_events.218.desc: "Courtiers have proposed to comission [character.GetName] for a monumental bronze equestrian statue to honour the founder of our ruling dynasty. Such an ambitious work promises to stand as a lasting symbol of authority and the prosperity of [target_nation.GetName]."
 brass_events.218.entry: "The Equestrian Monument"
 brass_events.218.historical_info: "The Equestrian Statue of Cosimo I de' Medici was created by Giambologna between 1587 and 1594 for the Piazza della Signoria in Florence. Celebrating the founder of the Grand Duchy of Tuscany, it became one of the defining equestrian monuments of the late Renaissance and inspired similar works throughout Europe."
 brass_events.218.a: "A monument worthy of remembrance."
 brass_events.218.b: "Such grandeur is unnecessary."
 cosimo_i_equestrian: "Equestrian Statue of Cosimo I de' Medici"
 cosimo_i_equestrian_desc: "Created by Giambologna between 1587 and 1594, the Equestrian Statue of Cosimo I de' Medici dominates Florence's Piazza della Signoria. Its masterful bronze casting and commanding composition established a model for princely monuments across Europe."

 brass_events.219.title: "The Tsar Cannon"
 brass_events.219.desc: "The master founder [character.GetName] has proposed the casting of an enormous bronze cannon unlike any yet seen. Though its sheer size would make it ill-suited to the battlefield, such a work would stand as an unmistakable symbol of [target_nation.GetName]'s power and the skill of its craftsmen."
 brass_events.219.entry: "The Tsar Cannon"
 brass_events.219.historical_info: "The Tsar Cannon was cast by Andrey Chokhov in Moscow in 1586. Although among the largest bombards ever produced, it was intended primarily as a display of Muscovite prestige and is not believed to have seen active service."
 brass_events.219.a: "Let the world marvel at our foundries."
 brass_events.219.b: "Build cannon for war, not spectacle."
 tsar_cannon: "Tsar Cannon"
 tsar_cannon_desc: "Cast by Andrey Chokhov in 1586, the Tsar Cannon is among the largest bronze bombards ever produced. More a monument to Muscovite ambition than a practical weapon, it remains one of the greatest achievements of Renaissance cannon founding."

 brass_events.223.title: "The Royal Gold Cup"
 brass_events.223.desc: "The royal household in [target_location.GetName] has proposed commissioning an elaborate gold cup for use during the most important ceremonies of the court. Fashioned from precious metals and adorned with intricate enamels, such a masterpiece would proclaim the magnificence and refinement of [target_nation.GetName] before princes and ambassadors alike."
 brass_events.223.entry: "The Royal Gold Cup"
 brass_events.223.historical_info: "The Royal Gold Cup was created in Paris between 1376 and 1380 for the French royal court, probably during the reign of Charles V. It is the only surviving complete medieval French royal gold vessel and is widely regarded as one of the greatest masterpieces of Gothic goldsmithing."
 brass_events.223.a: "Let our court be remembered."
 brass_events.223.b: "Such extravagance is unnecessary."
 royal_gold_cup: "Royal Gold Cup"
 royal_gold_cup_desc: "Created for the French royal court in the late fourteenth century, the Royal Gold Cup is the finest surviving example of medieval French goldsmithing. Its exquisite enamels and lavish decoration made it one of the greatest treasures of Gothic courtly art."

 brass_events.225.title: "The Jade Wine Cup"
 brass_events.225.desc: "The imperial court in [target_location.GetName] has proposed commissioning an exquisite wine cup carved from a single piece of precious jade. Such a work would demand the finest lapidaries and artisans, yet it would stand as a fitting expression of the refinement and magnificence of [target_nation.GetName]."
 brass_events.225.entry: "The Mughal Jade Wine Cup"
 brass_events.225.historical_info: "The Jade Wine Cup of Jahangir was created in Agra in 1611 for the Mughal emperor Jahangir. Carved from a single piece of nephrite jade and inscribed with the emperor's name, it is regarded as one of the finest surviving masterpieces of Mughal hardstone carving."
 brass_events.225.a: "Commission this imperial treasure."
 brass_events.225.b: "Our artisans have other priorities."
 jahangir_jade_wine_cup: "Jade Wine Cup of Jahangir"
 jahangir_jade_wine_cup_desc: "Carved in Agra in 1611 from a single piece of nephrite jade, the Jade Wine Cup of Jahangir exemplifies the extraordinary refinement of Mughal lapidary art. Its elegant form and imperial inscription have made it one of the greatest surviving treasures of the Mughal court."

 brass_events.226.title: "The Gold Crucifix"
 brass_events.226.desc: "Notable clergymen have proposed comissioning [character.GetName] to fashion a magnificent crucifix from gold for a place of worship in [target_location.GetName]. Such a commission would demand immense skill and costly materials, but the finished work would stand as both an expression of devotion and a testament to the artistry of [target_nation.GetName]."
 brass_events.226.entry: "Cellini's Gold Crucifix"
 brass_events.226.historical_info: "The Gold Crucifix was created by Benvenuto Cellini between 1562 and 1563. Executed in gold for the Medici, it is regarded as one of the master's greatest surviving religious works and a masterpiece of Renaissance goldsmithing."
 brass_events.226.a: "A fitting work of faith."
 brass_events.226.b: "Such splendour is beyond our means."
 cellini_gold_crucifix: "Cellini's Gold Crucifix"
 cellini_gold_crucifix_desc: "Created by Benvenuto Cellini between 1562 and 1563, the Gold Crucifix exemplifies the refinement of Renaissance goldsmithing. Combining profound religious symbolism with extraordinary technical mastery, it ranks among the sculptor's finest surviving works in precious metal."

 brass_events.227.title: "The Isenheim Altarpiece"
 brass_events.227.desc: "The brethren of the monastery at [target_location.GetName] have proposed commissioning [character.GetName] for a magnificent altarpiece for their hopspital chapel. Intended to inspire the faithful and bring solace to the sick in their care, the work would stand as both a profound expression of devotion and a lasting testament to the piety of [target_nation.GetName]."
 brass_events.227.entry: "The Isenheim Altarpiece"
 brass_events.227.historical_info: "The Isenheim Altarpiece was commissioned by the Antonite monastery at Isenheim and painted by Matthias Grünewald between 1512 and 1516. Created for a hospital treating sufferers of St. Anthony's Fire, its vivid imagery of Christ's suffering and resurrection offered comfort to the sick and established it as one of the greatest masterpieces of the Northern Renaissance."
 brass_events.227.a: "Commission this work of devotion."
 brass_events.227.b: "Our resources must serve elsewhere."
 isenheim_altarpiece: "Isenheim Altarpiece"
 isenheim_altarpiece_desc: "Painted by Matthias Grünewald between 1512 and 1516 for the Antonite monastery at Isenheim, this monumental altarpiece is celebrated for its dramatic depiction of Christ's Passion and Resurrection. Created to inspire and comfort the sick, it ranks among the greatest masterpieces of Northern Renaissance art."

 brass_events.228.title: "The Portinari Altarpiece"
 brass_events.228.desc: "A prominent merchant from [target_location.GetName] has proposed commissioning a magnificent altarpiece for a local hospital from [character.GetName], one of the finest painters in the Low Countries."
 brass_events.228.entry: "The Portinari Altarpiece"
 brass_events.228.historical_info: "The Portinari Altarpiece was commissioned by Tommaso Portinari from Hugo van der Goes between 1475 and 1478 in Bruges. Shipped to Florence in 1483, it profoundly influenced Italian painters through its realism, luminous colour, and mastery of oil painting."
 brass_events.228.a: "That sounds like a worthwhile comission."
 brass_events.228.b: "The commission is not worth the expense."
 portinari_altarpiece: "Portinari Altarpiece"
 portinari_altarpiece_desc: "Painted by Hugo van der Goes between 1475 and 1478, the Portinari Altarpiece ranks among the masterpieces of Early Netherlandish painting. Its arrival in Florence introduced Italian artists to the extraordinary realism and technical brilliance of Flemish oil painting."

 brass_events.230.title: "The San Zeno Altarpiece"
 brass_events.230.desc: "The monks of the Abbey of San Zeno have proposed commissioning a magnificent new altarpiece for the basilicia in [target_location.GetName] from the painter [character.GetName]. Employing the latest artistic innovations, the work promises to adorn the abbey with a masterpiece worthy of [target_nation.GetName]'s growing reputation for patronage."
 brass_events.230.entry: "The San Zeno Altarpiece"
 brass_events.230.historical_info: "The San Zeno Altarpiece was commissioned from Andrea Mantegna for the Abbey of San Zeno in Verona and completed around 1459. Renowned for its masterful use of perspective and unified architectural setting, it became one of the defining masterpieces of the Early Italian Renaissance."
 brass_events.230.a: "Commission this masterpiece."
 brass_events.230.b: "The abbey must make do without it."
 san_zeno_altarpiece: "San Zeno Altarpiece"
 san_zeno_altarpiece_desc: "Painted by Andrea Mantegna around 1459 for the Abbey of San Zeno in Verona, the San Zeno Altarpiece transformed Renaissance painting through its convincing perspective and harmonious architectural composition. It remains one of the finest masterpieces of fifteenth-century Italian art."

 brass_events.231.title: "The Beaune Altarpiece"
 brass_events.231.desc: "The governors of the hospital at [target_location.GetName] have proposed commissioning a magnificent altarpiece from the celebrated painter [character.GetName]. Intended to inspire the faithful and comfort the sick in their final hours, the work would become a lasting monument to the charity and devotion of [target_nation.GetName]."
 brass_events.231.entry: "The Beaune Altarpiece"
 brass_events.231.historical_info: "The Beaune Altarpiece was commissioned by Nicolas Rolin for the Hôtel-Dieu at Beaune and painted by Rogier van der Weyden between 1445 and 1450. Its imposing depiction of the Last Judgment offered hope and consolation to the hospital's patients, while establishing it as one of the masterpieces of Early Netherlandish painting."
 brass_events.231.a: "Commission this work of mercy."
 brass_events.231.b: "The hospital must do without."
 beaune_altarpiece: "Beaune Altarpiece"
 beaune_altarpiece_desc: "Painted by Rogier van der Weyden between 1445 and 1450 for the Hôtel-Dieu at Beaune, the Beaune Altarpiece is among the greatest masterpieces of Early Netherlandish art. Its dramatic vision of the Last Judgment was created to comfort the sick and remind them of the promise of salvation."

 brass_events.232.title: "The St. Wolfgang Altarpiece"
 brass_events.232.desc: "The clergy of the pilgrimage church at [target_location.GetName] have proposed commissioning a magnificent carved altarpiece from the master [character.GetName]. Combining painted panels with richly sculpted figures, the work promises to inspire pilgrims while proclaiming the devotion and prosperity of [target_nation.GetName]."
 brass_events.232.entry: "The St. Wolfgang Altarpiece"
 brass_events.232.historical_info: "The St. Wolfgang Altarpiece was commissioned for the pilgrimage church of Saint Wolfgang and created by Michael Pacher between 1471 and 1481. Combining monumental sculpture with innovative Renaissance perspective, it is regarded as one of the greatest masterpieces of late Gothic art in Central Europe."
 brass_events.232.a: "Commission this magnificent altar."
 brass_events.232.b: "The expense cannot be justified."
 st_wolfgang_altarpiece: "St. Wolfgang Altarpiece"
 st_wolfgang_altarpiece_desc: "Created by Michael Pacher between 1471 and 1481 for the pilgrimage church of Saint Wolfgang, this monumental winged altarpiece unites masterful woodcarving with richly painted panels. It stands among the finest achievements of late Gothic religious art."

 brass_events.233.title: "The Reliquary Bust of Charlemagne"
 brass_events.233.desc: "The canons of [target_location.GetName] have proposed commissioning a magnificent reliquary in the likeness of Charlemagne. Fashioned from silver and richly adorned with precious ornaments, the work would honour the emperor's memory while affirming the sacred traditions and authority of [target_nation.GetName]."
 brass_events.233.entry: "The Reliquary Bust of Charlemagne"
 brass_events.233.historical_info: "The Reliquary Bust of Charlemagne was created for Aachen Cathedral around 1350 to house the skull of Emperor Charlemagne. Crafted by an unknown goldsmith, it became one of the most important works of medieval goldsmithing and a powerful symbol of the Holy Roman Empire's imperial heritage."
 brass_events.233.a: "A worthy tribute to the Emperor."
 brass_events.233.b: "We cannot justify the expense."

 reliquary_bust_charlemagne: "Reliquary Bust of Charlemagne"
 reliquary_bust_charlemagne_desc: "Created around 1350 for Aachen Cathedral, the Reliquary Bust of Charlemagne enshrines the skull of the great emperor within a richly decorated silver and gilt likeness. Revered throughout the Holy Roman Empire, it remains one of the finest masterpieces of medieval goldsmithing."