 pewterware: "Pewterware"
 pewterware_desc: "Pewterware refers to vessels, plates, and other household items made primarily from tin-based alloys. More affordable than silver yet more refined than simple pottery, pewter became a common feature of homes, taverns, and churches across Europe. The widespread use of pewter tableware supported a thriving network of craftsmen and merchants."
