 STATIC_MODIFIER_NAME_cheese_hub: "Local Cheese Markets"
 STATIC_MODIFIER_DESC_cheese_hub: "A center of dairy trade and experimentation where local makers refine new methods of aging, salting, and culturing cheese."
 
 cheese_events.1.title: "The Commercialization of Cheddar"
 cheese_events.1.desc: "Demand for a local [cheese.GetName] named #italic Cheddar#! from [bristol.GetName] and its surrounding areas has grown considerably in nearby markets, with merchants across [target_nation.GetName] praising its keeping qualities and distinctive flavour. Local dairymen now seek support to expand production and establish a more regular trade, though more traditional cheesemongers warn that this may erode long-standing traditions."
 cheese_events.1.a: "It should remain a local tradition."
 cheese_events.1.b: "We should encourage the Cheddar trade."
 cheese_events.1.historical_info: "Cheddar cheese originates from the village of Cheddar in southwest England. Cheddar Gorge on the edge of the village contains a number of caves, which provided the ideal humidity and steady temperature for maturing the cheese. Known for its sharp, rich, and slightly nutty flavor, cheddar became popular beyond Somerset after it was favored by the English royal court, while its firm texture and keeping qualities made it well suited for trade across the realm."
 cheese_events.1.entry: "Commercialization of Cheddar"

 cheese_events.2.title: "The Commercialization of Edam"
 cheese_events.2.desc: "Demand for a local [cheese.GetName] from a village near [alkmaar.GetName] has grown considerably in nearby markets, with merchants across [target_nation.GetName] praising its mild flavor and remarkable keeping qualities. Local dairymen now seek support to expand production and establish a more regular trade, though more traditional cheesemongers warn that this may may erode long-standing traditions."
 cheese_events.2.b: "We should encourage the Edam Trade."
 cheese_events.2.historical_info: "Edam cheese originates from the town of Edam in the northern Netherlands. Traditionally formed into small wax-covered wheels, Edam is known for its mild, slightly salty, and nutty flavor. Its durable nature and long shelf life made it ideal for maritime trade, allowing Dutch merchants to export it widely during the rise of Dutch commercial power."
 cheese_events.2.entry: "Commercialization of Edam"

 cheese_events.3.title: "The Commercialization of Gouda"
 cheese_events.3.desc: "Demand for a local [cheese.GetName] from a town near the city of [leiden.GetName] has grown considerably in nearby markets, with merchants across [target_nation.GetName] praising its creamy texture and sweet, buttery taste. Local dairymen now seek support to expand production and establish a more regular trade, though more traditional cheesemongers warn that this may erode long-standing traditions."
 cheese_events.3.b: "We should encourage the Gouda Trade."
 cheese_events.3.historical_info: "Gouda cheese originates from the city of Gouda in Holland, where farmers from the surrounding countryside gathered to trade their cheeses in the city market. With its creamy texture and sweet, buttery taste, Gouda became increasingly popular alongside the expansion of Dutch trade and urban markets throughout northern Europe."
 cheese_events.3.entry: "Commercialization of Gouda"

 cheese_events.4.title: "The Commercialization of Parmigiano-Reggiano"
 cheese_events.4.desc: "Demand for a local [cheese.GetName] from the region around [parma.GetName] has grown considerably in nearby markets, with merchants across [target_nation.GetName] praising its hard texture and savory, nutty flavor. Local dairymen now seek support to expand production and establish a more regular trade, though more traditional cheesemongers warn that this may erode long-standing traditions."
 cheese_events.4.b: "We should encourage the Parmigiano trade."
 cheese_events.4.historical_info: "Parmigiano-Reggiano originates from the monasteries and dairies surrounding Parma and Reggio Emilia in northern Italy. Aged for long periods, the cheese developed a hard texture and a savory, nutty flavor prized by merchants and nobles alike. Its excellent keeping qualities allowed it to travel along the trade routes of Renaissance Italy and beyond."
 cheese_events.4.entry: "Commercialization of Parmigiano-Reggiano"

 cheese_events.5.title: "The Commercialization of Roquefort"
 cheese_events.5.desc: "Demand for a local [cheese.GetName] from a village near [roquefort.GetName] has grown considerably in nearby markets, with merchants across [target_nation.GetName] praising its sharp, tangy, and earthy flavor. Local dairymen now seek support to expand production and establish a more regular trade, though more traditional cheesemongers warn that this may erode long-standing traditions."
 cheese_events.5.b: "We should encourage the Roquefort Trade."
 cheese_events.5.historical_info: "Roquefort cheese originates from the village of Roquefort-sur-Soulzon in southern France. The cool caves beneath the nearby cliffs provided ideal conditions for cultivating the cheese’s distinctive blue mold, giving Roquefort its sharp, tangy, and earthy flavor. Its reputation among French nobles and merchants helped spread its fame across the kingdom."
 cheese_events.5.entry: "Commercialization of Roquefort"

 cheese_events.6.title: "The Commercialization of Gruyère"
 cheese_events.6.desc: "Demand for a local [cheese.GetName] from the alpine region surrounding [gruyere.GetName] has grown considerably in nearby markets, with merchants across [target_nation.GetName] praising its firm texture and rich, slightly sweet, and nutty taste. Local dairymen now seek support to expand production and establish a more regular trade, though more traditional cheesemongers warn that this may erode long-standing traditions."
 cheese_events.6.b: "We should encourage the Gruyère Trade."
 cheese_events.6.historical_info: "Gruyère cheese originates from the alpine region surrounding Gruyères in western Switzerland. Produced in large wheels suited for transport through mountain trade routes, Gruyère became known for its firm texture and rich, slightly sweet, and nutty taste. Growing demand in the markets of central Europe gradually turned it into one of Switzerland’s most valued cheeses."
 cheese_events.6.entry: "Commercialization of Gruyère"

 cheese_events.7.title: "The Commercialization of Emmental"
 cheese_events.7.desc: "Demand for a local [cheese.GetName] from the Emme Valley near [bern.GetName] has grown considerably in nearby markets, with merchants across [target_nation.GetName] praising its large holes and mild, buttery, slightly fruity flavor. Local dairymen now seek support to expand production and establish a more regular trade, though more traditional cheesemongers warn that this may erode long-standing traditions."
 cheese_events.7.b: "We should encourage the Emmental Trade."
 cheese_events.7.historical_info: "Emmental cheese originates from the Emme Valley near Bern in Switzerland. Recognized by its large holes and mild, buttery, slightly fruity flavor, Emmental benefited from advances in alpine dairying and large-scale wheel production. Its durable form made it a successful export throughout the commercial networks of early modern Europe."
 cheese_events.7.entry: "Commercialization of Emmental"

 cheese_events.8.title: "The Commercialization of Manchego"
 cheese_events.8.desc: "Demand for a local [cheese.GetName] from the plains of La Mancha around [toledo.GetName] in central Spain has grown considerably in nearby markets, with merchants across [target_nation.GetName] praising its firm texture and buttery, slightly tangy flavor. Local dairymen now seek support to expand production and establish a more regular trade, though more traditional cheesemongers warn that this may erode long-standing traditions."
 cheese_events.8.b: "We should encourage the Manchego Trade."
 cheese_events.8.historical_info: "Manchego cheese originates from the plains of La Mancha in central Spain, where it was traditionally produced from the milk of Manchega sheep. Known for its firm texture and buttery, slightly tangy flavor, Manchego grew in popularity alongside the expansion of Castilian trade, which carried the cheese to markets across the Iberian Peninsula."
 cheese_events.8.entry: "Commercialization of Manchego"

 cheese_events.9.title: "Pantaleone da Confienza"
 cheese_events.9.desc: "A promising author and diplomat from [turin.GetName], a man named [pantaleone.GetName] has appeared at court. He is seeking patronage for a future work, which he claims will be a comprehensive history of cheese. While some are skeptical of his ambitions, others see potential in his project to elevate the cultural status of cheese and its role in our society."
 cheese_events.9.a: "Invite him to court."
 cheese_events.9.b: "Cheese? Who cares about cheese?"
 cheese_events.9.entry: "Pantaleone da Confienza"
 cheese_events.9.historical_info: "Pantaleone de Confienza was an Italian writer and diplomat born around Turin in the 1440s. He is best known for his book, Summa lacticiniorum (translated to “A Compendium of Milk Products”), which was published in 1477. The work is a comprehensive history of cheese and other milk products, drawing on Pantaleone’s extensive travels across Europe to gather information on different varieties, production methods, and cultural significance. His book was well received by both the court and the public, and it remains a valuable resource for anyone interested in the world of cheese."

 cheese_events.10.title: "A Compendium of Milk Products"
 cheese_events.10.desc: "[pantaleone.GetName] has published his book, #italic Summa lacticiniorum#!, which is a comprehensive history of [cheese.GetName] and other milk products. The work has been well received by both the court and the public of [target_country.GetName], with many praising its detailed descriptions of different cheeses and the insights it provides into the art of cheesemaking. Pantaleone's travels across [ShowContinentName('europe')] and his research have allowed him to compile a wide range of information on cheese varieties, production methods, and cultural significance, making it a valuable resource for anyone interested in the world of cheese."
 cheese_events.10.a: "Publish it."
 cheese_events.10.b: "That was underwhelming."
 cheese_events.10.entry: "A Compendium of Milk Products"
 da_confienza: "Da Confienza"
 summa_lacticiniorum: "Summa Lacticiniorum"
 summa_lacticiniorum_desc: "A comprehensive history of cheese and other milk products, drawing on extensive travels across Europe to gather information on different varieties, production methods, and cultural significance."

 cheese_events.11.title: "The Bread and Cheese Revolt"
 cheese_events.11.desc: "A rural uprising erupts across [alkmaar.GetName] and [hoorn.GetName] after new taxes deepen years of hunger, economic decline, and resentment toward noble authority. Peasants, fishermen, and townspeople rally behind banners marked with bread and [cheese.GetName], symbols of the common people fighting against mounting burdens imposed by the ruling authorities."
 cheese_events.11.a: "Crush them with force."
 cheese_events.11.b: "Let's negotiate."
 cheese_events.11.entry: "The Bread and Cheese Revolt"
 cheese_events.11.historical_info: "The Bread and Cheese Revolt was a popular uprising that took place in the early 1490s in the regions of Kennemerland and West-Friesland in the northern Netherlands. The revolt was sparked by a combination of factors, including economic hardship, high taxes, and resentment toward the ruling nobility. The rebels, consisting of peasants, fishermen, and townspeople, rallied under banners featuring bread and cheese, symbols of their struggle for basic sustenance and justice. The revolt was eventually suppressed by the authorities after the stadtholder of Holland requested aid from Albert III, Duke of Saxony, but it remains a significant event in Dutch history as an example of popular resistance against oppressive rule."
 STATIC_MODIFIER_NAME_cheese_lower_taxes_peasants: "Lower Taxes for Peasants"
 STATIC_MODIFIER_DESC_cheese_lower_taxes_peasants: "Peasants in this region have lower taxes due to the influence of the Bread and Cheese Revolt."

 cheese_events.12.title: "The Merry Entertainer"
 cheese_events.12.desc: "A young performer named [john_heywood.GetName] has been making a name for himself in [target_capital.GetName]. Known for his witty interludes and skill at the virginals, he has caught the attention of several courtiers who speak highly of his merry disposition and clever satires of everyday life. Unlike the old morality plays with their biblical allegories, Heywood's short comedies feature contemporary characters: quarreling husbands and wives, pardoners and friars, and other recognizable types from the streets of London. His humor is earthy and broad, yet displays considerable skill in construction and dialogue. Several at court suggest we invite this entertaining fellow into royal service."
 cheese_events.12.a: "Invite him to court."
 cheese_events.12.b: "We have no interest in a jester."
 cheese_events.12.entry: "The Merry Entertainer"
 cheese_events.12.historical_info: "John Heywood was an english playwright and poet born around 1497. He is best known for his interludes, which were short comedic plays performed between the acts of longer productions or during feasts. Heywood's works often featured contemporary characters and situations, providing a humorous commentary on everyday life in Tudor England. His skillful use of language and clever satire made him a popular figure in London's theatrical circles, and he eventually gained the attention of the royal court, where he served as a performer and entertainer for King Henry VIII and his successors."

 cheese_events.13.title: "The Moon is Made of Green Cheese"
 cheese_events.13.desc: "Our court entertainer [john_heywood.GetName] has published a new collection of proverbs. Among these is a curious entry: #italic 'The moon is made of a greene cheese'#!, where #italic 'greene'#! means fresh or unaged. This phrase has delighted [target_capital.GetName]'s taverns. Some literal-minded souls have begun debating whether the celestial orb could truly be dairy, while natural philosophers roll their eyes at such absurdity."
 cheese_events.13.a: "It's just a joke, don't take it seriously."
 cheese_events.13.b: "This is nonsense! We should ban such foolishness."
 cheese_events.13.entry: "The Moon is Made of Green Cheese"
 cheese_events.13.historical_info: "In 1546, Heywood published 'A Dialogue Conteinyng the Nomber in Effect of All the Prouerbes in the Englishe Tongue' (commonly known today as 'The Proverbs of John Heywood'), one of the earliest comprehensive collections of English proverbs. The work preserved hundreds of folk sayings that might otherwise have been lost, including #italic 'the moon is made of greene cheese' #!. This phrase was never an actual belief, but was used to indicate extreme credulity. A devout Catholic, Heywood fell out of favor under Protestant Queen Elizabeth I and went into exile in Mechelen around 1564, where he died sometime after 1575."
 proverbs_john_heywood: "The Proverbs of John Heywood"
 proverbs_john_heywood_desc: "One of the earliest comprehensive collections of English proverbs, preserving hundreds of folk sayings that might otherwise have been lost."

 cheese_events.14.title: "The Great Nottingham Cheese Riot"
 cheese_events.14.desc: "A dispute over [cheese.GetName] prices in [nottingham.GetName] has escalated into a full-blown riot, with merchants and townspeople clashing in the streets. The unrest has caused significant damage to local businesses and has drawn the attention of regional authorities, who are now considering measures to restore order through violent means."
 cheese_events.14.a: "Send in the troops to restore order."
 cheese_events.14.b: "Let them seethe a little."
 cheese_events.14.entry: "The Great Cheese Riot"
 cheese_events.14.historical_info: "The Nottingham cheese riot, also known as the Great Cheese Riot, started on 2 October 1766 at the city's annual Goose Fair. Coming at a time of food shortages and rising foodstuff prices in England, violence broke out when city residents attempted to prevent Lincolnshire merchants taking away Nottinghamshire cheeses they had bought at the fair. A warehouse, shops and a cargo boat were looted and hundreds of cheese wheels were rolled through the streets by angry rioters."

 cheese_events.15.title: "Casu Martzu"
 cheese_events.15.desc: "During a trip through the hills near [alghero.GetName], a local guide has introduced [target_character.GetName] to a unique cheese called Casu Martzu. This Sardinian delicacy is made from sheep's milk and is infested with live insect larvae. The guide assures us that the larvea are an essential part of the [cheese.GetName]'s flavor and texture, and that it is considered a prized delicacy by locals."
 cheese_events.15.a: "Try a taste of Casu Martzu."
 cheese_events.15.b: "It's infested with what now?! No thanks."
 cheese_events.15.entry: "Casu Martzu"
 cheese_events.15.historical_info: "Casu Martzu, also known as 'maggot cheese', is a traditional Sardinian cheese made from sheep's milk. What sets it apart is that it is intentionally infested with the larvae of the cheese fly (Piophila casei). The larvae help break down the cheese, giving it a soft texture and a strong, pungent flavor. Despite its unique characteristics, Casu Martzu is considered a delicacy in Sardinia, though in the modern age it has been banned in many countries due to health concerns."
 DEATH_REASON_rotten_cheese: "[CHARACTER.GetHeSheFormal|U] died unexpectedly from consuming rotten cheese."

 cheese_events.16.title: "Samuel Pepys buries his Cheese"
 cheese_events.16.desc: "During the day, as the Great Fire of [london.GetName] was raging, [samuel_pepys.GetName] spent much of the day arranging the removal of his possessions. Many of his valuables were sent to a friend from the Navy Office at Bethal Green. The next day, with the fire advancing, he begun to believe that Seething Lane was in grave danger, and so he buried his [cheese.GetName] in the garden of his house, hoping to protect it from the flames."
 cheese_events.16.a: "What a prudent move! Cheese is precious."
 cheese_events.16.entry: "Samuel Pepys buries his Cheese"
 cheese_events.16.historical_info: "Samuel Pepys was an English naval administrator and Member of Parliament, best known for his diary which provides a detailed first-hand account of major events in 17th century England, including the Great Fire of London in 1666. During the fire, Pepys took measures to protect his possessions, including burying his cheese in the garden of his house on Seething Lane. This act has become a memorable anecdote from his diary, illustrating the value placed on cheese even during times of crisis." 

 cheese_events.17.title: "The Alkmaar Cheese Market"
 cheese_events.17.desc: "The town square of [alkmaar.GetName] has become a spectacle of commerce, where merchants from across [target_nation.GetName] gather to trade great wheels of [cheese.GetName] beneath the watchful eyes of weighmasters and inspectors. Porters in colorful guild garb carry Edam and Gouda across the market as barges wait in nearby canals to carry the prized goods abroad. Strict standards of quality and careful regulation have brought prosperity to the city, and many now claim that no finer cheese market exists in all of [ShowContinentName('europe')]."
 cheese_events.17.a: "We must visit the Alkmaar Cheese Market!"
 cheese_events.17.entry: "The Alkmaar Cheese Market"
 cheese_events.17.historical_info: "The Alkmaar Cheese Market is a traditional cheese market held in the town of Alkmaar in the Netherlands. It has been a major center of cheese trade since the 16th century, where merchants gather to buy and sell large wheels of cheese, particularly Edam and Gouda. The market is known for its lively atmosphere, with porters dressed in colorful guild garb carrying the cheese across the square, and weighmasters ensuring fair trade. The Alkmaar Cheese Market remains a popular tourist attraction and a symbol of the rich cheese-making heritage of the Netherlands."
 
 cheese_events.18.title: "The Mammoth Cheese Wheel"
 cheese_events.18.desc: "Dairy farmers of Massachusetts have presented an enormous wheel of [cheese.GetName] to [ruler.GetName], crafted from the milk of hundreds of cows and weighing more than a thousand pounds. Intended as a tribute to republican simplicity and the virtues of the independent farmer, the #italic 'Mammoth Cheese'#! has become a spectacle throughout the young republic."
 cheese_events.18.a: "What an impressive tribute to our nation!"
 cheese_events.18.entry: "The Mammoth Cheese Wheel"
 cheese_events.18.historical_info: "The Mammoth Cheese Wheel, also known as the 'Mammoth Cheese', was a giant wheel of cheese made from the milk of hundreds of cows in Massachusetts. It was presented to President Thomas Jefferson in 1802 as a tribute to republican simplicity and the virtues of the independent farmer. Weighing over a thousand pounds, the Mammoth Cheese became a spectacle throughout the young republic, with crowds gathering to witness the colossal gift wherever it passed. Newspapers across the nation debated whether the great cheese represented the prosperity of the countryside or merely an extravagant display of political devotion."

 cheese_events.19.title: "The Roquefort Monopoly"
 cheese_events.19.desc: "Producers in the village of Roquefort near [st_affrique.GetName] have petitioned [ruler.GetName] for exclusive rights to mature their [cheese.GetName] within the famous caves beneath the Combalou cliffs. Merchants argue that the unique caverns produce a quality unmatched anywhere in [christendom.GetName], and that royal protection would preserve the reputation of the prized blue cheese across distant markets."
 cheese_events.19.a: "We should respect their monopoly."
 cheese_events.19.b: "Monopolies are bad for trade. Open those caves!"
 cheese_events.19.entry: "The Roquefort Monopoly"
 cheese_events.19.historical_info: "In 1411 the production of Roquefort cheese was granted a royal monopoly by King Charles VI of France, which allowed the local producers in Roquefort-sur-Soulzon to maintain exclusive rights to produce and sell the cheese. This monopoly has been fiercely protected over the centuries, with the producers guarding their methods and the reputation of their product. The caves of Roquefort-sur-Soulzon provide the ideal conditions for cultivating the distinctive blue mold that gives Roquefort its unique flavor, and the local producers have maintained a strict control over the production process to ensure the quality and authenticity of their cheese."
 roquefort_monopoly: "Roquefort Monopoly has been granted."

 cheese_events.20.title: "The Work of Bartolomeo Scappi"
 cheese_events.20.desc: "The renowed chef [bartolomeo_scappi.GetName] has approached a publishing house in [venice.GetName] with a proposal to write a comprehensive cookbook that includes recipes for various cheeses and their uses in cooking. The man, also known as the personal chef of [pope.GetName] himself, is famous for his culinary expertise and innovative techniques."
 cheese_events.20.a: "Support his project."
 cheese_events.20.b: "We have no interest in cookbooks."
 cheese_events.20.entry: "The Work of Bartolomeo Scappi"
 cheese_events.20.historical_info: "Bartolomeo Scappi was an Italian chef who served as the personal chef to Pope Pius V during the 16th century. He is best known for his cookbook, 'Opera dell'arte del cucinare' (The Art of Cooking), published in 1570. The book is a comprehensive collection of recipes and culinary techniques, including various uses of cheese in cooking. Scappi's work was highly influential in the development of Italian cuisine and remains a valuable resource for chefs and food historians today."
 work_bartolomeo_scappi: "Opera Dell'Arte del Cucinare"
 work_bartolomeo_scappi_desc: "A comprehensive collection of recipes and culinary techniques by Bartolomeo Scappi, including various uses of cheese in cooking."

 cheese_events.101.title: "Monastic Cheese Tradition"
 cheese_events.101.desc: "The monks of our local monastery in [first_location.GetName] have long been known for their skill in cheesemaking and have recently refined their techniques to produce a new [cheese.GetName] that has garnered some attention in nearby markets. While the monks are hesitant to commercialize their product on a large scale, they are open to sharing their knowledge and allowing local producers and scholars to learn from their methods."
 cheese_events.101.a: "Encourage them to share their knowledge."
 cheese_events.101.b: "Leave them to their monastic pursuits."

 cheese_events.102.title: "Cheese for the Troops"
 cheese_events.102.desc: "Our commanders have requested a steady supply of [cheese.GetName] to provision our armies, citing its delicious taste, nutritional value and long shelf life as ideal for sustaining troops during campaigns. Officials are considering purchasing excess cheese from local producers to meet this demand, though some worry that diverting supplies to the military may strain resources for civilian consumption and trade."
 cheese_events.102.a: "That's a great idea! Let's support our troops with cheese."
 cheese_events.102.b: "We should focus on civilian needs first."
 STATIC_MODIFIER_NAME_cheese_supplies_for_armies: "Armies supplied with cheese"
 STATIC_MODIFIER_DESC_cheese_supplies_for_armies: "Our armies are being provisioned with cheese, providing them with a reliable source of nourishment during campaigns."

 cheese_events.103.title: "A Cheese Toll"
 cheese_events.103.desc: "With the [cheese.GetName] trade booming in [target_nation.GetName], some local authorities are proposing the implementation of a toll on cheese transported through key trade routes. Proponents argue that this would generate much-needed revenue for infrastructure, while the [burghers.GetName] and merchants who rely on cheese trade worry that it could increase costs and disrupt commerce."
 cheese_events.103.a: "A toll? That sounds reasonable."
 cheese_events.103.b: "We won't hinder our merchants."

 cheese_events.104.title: "A Cheesy Rivalry"
 cheese_events.104.desc: "Two prominent cheesemakers from [first_location.GetName] and [second_location.GetName] have developed a rivalry over the quality and reputation of their [cheese.GetName]. Both producers claim that their cheese is superior and have been engaging in public disputes, which has drawn attention from local markets and consumers. They have now come to [ruler.GetName] seeking a final verdict in whose cheese is truly the best."
 cheese_events.104.a: "No doubt, the cheese from [first_location.GetName] is superior!"
 cheese_events.104.b: "I believe the cheese from [second_location.GetName] is better!"
 cheese_events.104.c: "They are both delicious."

 cheese_events.105.title: "Rotten Cheese"
 cheese_events.105.desc: "A batch of [cheese.GetName] from a local producer in [first_location.GetName] has been found to be spoiled and has caused illness among those who consumed it. The incident has raised concerns about food safety and the need for better regulation, oversight and storage facilities."
 cheese_events.105.a: "We must ensure it doesn't happen again."
 cheese_events.105.b: "Accidents happen, there's no need for regulation."
 better_cheese_preservation: "Local Sponsorship for better Cheese Preservation"

 cheese_events.106.title: "Dispute over Grazing Rights"
 cheese_events.106.desc: "A conflict has arisen between two groups of dairy farmers in [first_location.GetName] over access to grazing land for their [livestock.GetName]. Both sides claim historical rights to the land and have been unable to reach an agreement, leading to tensions and disruptions in [cheese.GetName] production."
 cheese_events.106.a: "We should mediate a fair agreement."

 cheese_events.107.title: "Cheese Adulteration"
 cheese_events.107.desc: "Authorities have uncovered a case of [cheese.GetName] diluting, where a producer in [target_nation.GetName] has been caught mixing water into their cheese to increase profits. This has sparked outrage among consumers and honest producers, who are calling for strict penalties and increased oversight to prevent such fraudulent practises in the future."
 cheese_events.107.a: "Sanction the offenders."
 cheese_events.107.b: "Let's just give them a warning."

 cheese_events.108.title: "Cheese for the Navies"
 cheese_events.108.desc: "Naval officials have requested large quantities of hard [cheese.GetName] to provision our fleets, arguing that it keeps well during long voyages and provides sailors with reliable nourishment at sea. Merchants and cheesemakers welcome the lucrative contracts, though some warn that supplying the navy on such a scale may raise prices and strain provisions ashore."
 cheese_events.108.a: "That's a great idea! Let's support our navy with cheese."
 cheese_events.108.b: "We should focus on civilian needs first."
 STATIC_MODIFIER_NAME_cheese_supplies_for_navies: "Navies supplied with cheese"
 STATIC_MODIFIER_DESC_cheese_supplies_for_navies: "Our navies are being provisioned with cheese, providing sailors with a reliable source of nourishment during long voyages at sea."

 cheese_events.109.title: "A Cheese Festival"
 cheese_events.109.desc: "The town of [first_location.GetName] is hosting an annual [cheese.GetName] festival to celebrate the local dairy industry and promote its products. The event features cheese tastings, competitions, and cultural activities that draw visitors from across [region.GetName]. The festival has a chance to become a significant boost to the local economy and a source of pride for the community."
 cheese_events.109.a: "Let's organize nationwide cheese festivals!"
 cheese_events.109.b: "Let's sponsor this local festival."
 cheese_events.109.c: "Cheese festivals? Not really our thing."

 cheese_events.110.title: "A Royal Taste for Cheese"
 cheese_events.110.desc: "Our ruler [ruler.GetName] has developed a particular fondness for a certain type of [cheese.GetName] produced in [first_location.GetName]. Rumours are abuzz that this partcular cheese is currently being considered for a royal endorsement, which would significantly boost its reputation and prestige across our realm."
 cheese_events.110.a: "I declare this a royal cheese."
 cheese_events.110.b: "We are above cheese."