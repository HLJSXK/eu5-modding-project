 MODIFIER_TYPE_DESC_ban_exports_of_cheese: "This blocks the [export|e] of [ShowGoodsName('cheese')] from all [markets|e] that a [country|e] owns."
 MODIFIER_TYPE_NAME_ban_imports_of_cheese: "Ban Imports of $cheese$"
 MODIFIER_TYPE_DESC_ban_imports_of_cheese: "This blocks the [import|e] of [ShowGoodsName('cheese')] to all [markets|e] that a [country|e] owns."
