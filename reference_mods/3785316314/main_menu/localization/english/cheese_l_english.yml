l_english:
 cheese: "Cheese"
 cheese_desc: "Cheese is a dairy product created through the curdling and fermentation of milk, with evidence of cheesemaking dating back over seven thousand years to ancient Mesopotamia. Throughout history, it has served as a vital source of preserved nutrition, allowing communities to store protein and fats long-term before refrigeration existed. Different regions developed distinctive varieties based on local milk sources and cultural practices, making cheese both a staple food and a marker of cultural identity."
 cheese_guild: "Cheesemakers' Guild"
 cheese_guild_desc: "A guild of skilled and dedicated cheesemakers who have honed their craft over generations and produce a wide variety of cheeses using traditional methods."
 cheese_workshop: "Cheesemakers' Workshop"
 cheese_workshop_desc: "Produced in larger workshops with dedicated aging cellars and proper storage for the fermentation process, we will be able to create greater quantities of quality cheese than before."
 cheese_manufactory: "Creamery"
 cheese_manufactory_desc: "The growing demand for dairy products has led to the establishment of large-scale production facilities where traditional cheesemaking techniques have been standardized and streamlined for greater efficiency."
 cheese_mill: "Dairy Plant"
 cheese_mill_desc: "The pinnacle of dairy production, these industrial complexes process vast quantities of milk into cheese and other products through highly organized operations, with specialized equipment and quality controls that ensure consistent output for national and international markets."
 rural_cheesemaker: "Rural Cheesemaker"
 rural_cheesemaker_desc: "Small-scale cheesemakers working on individual farms produce modest quantities using traditional methods passed down through generations, supplying local villages and nearby markets with fresh dairy products."
 weighing_house: "Waag"
 weighing_house_desc: "A historic Dutch public weigh house used for the official weighing and registration of commercial goods."
 weighing_house_maintenance: "Waag Maintenance"
 cheese_cities_advance: "Kaassteden"
 cheese_cities_advance_desc: "Kaassteden are historic Dutch cheese-market towns, particularly in Holland, known for their traditional cheese markets, weigh houses, and central role in the Dutch cheese trade from the medieval period onward."
 cheese_market_rights_dutch: "Kaasstad"
 cheese_market_rights_dutch_desc: "This [location|e] has been recognized as a Kaasstad, a chartered cheese-market town where farmers from the surrounding countryside bring their [ShowGoodsName('cheese')] to be weighed, graded, and traded under the watchful eye of the town's weighing house. The ceremony of the market, carried out by liveried cheese-porters and overseen by sworn weighmasters, has made these towns synonymous with quality."
 cheese_market_rights: "Cheese Market Rights"
 cheese_market_rights_desc: "This [location|e] has been granted legal privileges over the production and distribution of [ShowGoodsName('cheese')], conferring a significant competitive advantage."
 cheese_waxing: "Beeswax Sealing"
 cheese_waxing_desc: "To protect the cheese during aging and prevent spoilage, we can apply a layer of beeswax to seal the surface. This method helps maintain the cheese's moisture and flavor while allowing it to mature properly over time."
 cheese_workshop_advance: "$cheese_workshop$"
 cheese_workshop_advance_desc: "$cheese_workshop_desc$"
 cheese_workshop_manufactory_advance: "$cheese_manufactory$"
 cheese_workshop_manufactory_advance_desc: "$cheese_manufactory_desc$"
 cheese_manufactory_advance: "$cheese_manufactory$"
 cheese_manufactory_advance_desc: "$cheese_manufactory_desc$"
 cheese_mill_advance: "$cheese_mill$"
 cheese_mill_advance_desc: "$cheese_mill_desc$"
 cheese_press_advance: "Advanced Cheese Press"
 cheese_press_advance_desc: "The development of more efficient and powerful cheese presses allows for better whey removal during the cheesemaking process, resulting in firmer textures and improved quality across a wider range of cheese varieties."
 cheese_weighing_houses_advance: "$weighing_house$"
 cheese_weighing_houses_advance_desc: "$weighing_house_desc$"
 cheese_alpine_pastures: "Alpine Pastures"
 cheese_alpine_pastures_desc: "The use of high-altitude pastures for grazing dairy animals can enhance the flavor and quality of cheese. This practice has been particularly beneficial for the development of renowned alpine cheeses such as Gruyère and Emmental."
 cheese_guild_advance: "$cheese_guild$"
 cheese_guild_advance_desc: "$cheese_guild_desc$"

