 meat_manufactory: "Curing House"
 meat_manufactory_desc: "A large-scale establishment specializing in the preservation of meat through salting, smoking, and brining."
 meat_mill: "Cannery"
 meat_mill_desc: "An industrial facility preserving meat in sealed containers, greatly extending its shelf life and transportability."

