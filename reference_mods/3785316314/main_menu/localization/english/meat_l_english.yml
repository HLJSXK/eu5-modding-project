 meat_production_methods: "Horse Meat Traditions"
 meat_production_methods_desc: "The consumption of horse meat provides an additional source of food, particularly among frontier and nomadic communities."

 meat_farm_pigs: "Hog Farm"
 meat_farm_pigs_desc: "A farm for raising swine for pork, bacon, and other meat products."
 meat_farm_goats: "Goat Ranch"
 meat_farm_goats_desc: "A ranch for raising goats for meat products."
 meat_farm_reindeer: "Reindeer Ranch"
