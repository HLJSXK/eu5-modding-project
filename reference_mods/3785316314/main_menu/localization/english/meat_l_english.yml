 meat_livestock_breeding_advance: "Scientific Livestock Breeding"
 meat_livestock_breeding_advance_desc: "Advances in animal husbandry encourage the systematic selection of breeding stock based on desirable traits. Through careful record-keeping and controlled breeding programs, farmers develop larger, healthier, and more productive animals, greatly increasing yields of meat and other livestock products all the while laying the foundations for the modern agricultural sciences."

