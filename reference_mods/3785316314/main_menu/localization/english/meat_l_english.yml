 meat_events.1.title: "The Compleat Angler"
 meat_events.1.desc: "A new edition of [izaak_walton.GetName]'s celebrated work has found eager readers among [target_nation.GetAdjective] gentlemen. Blending practical instruction with observations on nature, friendship, and the pleasures of the countryside, the book has helped elevate fishing from a means of obtaining food into a respected leisure pursuit."
 meat_events.1.entry: "The Compleat Angler"
 meat_events.1.historical_info: "First published in 1653, Izaak Walton's The Compleat Angler became one of the most influential books on fishing ever written. Combining advice on angling with anecdotes, poetry, and reflections on rural life, it helped shape the culture of recreational fishing in Britain and beyond. The work remained in print for centuries and is regarded as a classic of English literature."
 meat_events.1.a: "A most agreeable pastime."
 the_compleat_angler: "The Compleat Angler"
 the_compleat_angler_desc: "This widespread celebrated work encourages fishing as a leisure activity and popular pastime."

 meat_events.2.title: "François Rabelais"
 meat_events.2.desc: "The writings of [francois_rabelais.GetName] are gaining widespread acclaim for their humor, satire, and exuberant portrayal of everyday life. Filled with lavish banquets, hunting parties, and scenes of prodigious consumption, his works celebrate the pleasures of the table while lampooning the pretensions of [target_nation.GetAdjective] scholars, clergy, and nobles."
 meat_events.2.entry: "François Rabelais"
 meat_events.2.historical_info: "François Rabelais was a French Renaissance writer, physician, and humanist best known for his series of novels concerning the giants Gargantua and Pantagruel. His works combined satire, classical learning, and earthy humor, exploring themes of education, religion, politics, and human nature. Rich descriptions of feasting and food helped make his writings enduring symbols of abundance and conviviality."
 meat_events.2.a: "Invite this man to court."
 meat_events.2.b: "He spreads dangerous ideas."

 meat_events.3.title: "Gargantua and Pantagruel"
 meat_events.3.desc: "The tales of [francois_rabelais.GetName] have found an ever-growing audience. Through the adventures of the giants Gargantua and Pantagruel, readers from all over [target_nation.GetName] can delight in scenes of lavish feasting, sharp satire, and irreverent humor. Though condemned by some authorities, the works have secured Rabelais' reputation as one of the foremost [target_nation.GetAdjective] writers of his age."
 meat_events.3.entry: "Gargantua and Pantagruel"
 meat_events.3.a: "A feast in literary form."
 gargantua: "Gargantua and Pantagruel"
 gargantua_desc: "The famous tales of François Rabelais celebrate lavish banquets and abundant fare, popularizing a taste for hearty meals."

 meat_events.4.title: "Pieter Aertsen"
 meat_events.4.desc: "The paintings of a relatively unknown [target_nation.GetAdjective] painter named [pieter_aertsen.GetName] have attracted attention for their detailed depictions of kitchens, markets, and butcher stalls. Overflowing with cuts of [meat.GetName], [game.GetName], and other provisions, his works celebrate the abundance of daily life while demonstrating a remarkable mastery of still life and genre painting."
 meat_events.4.entry: "Pieter Aertsen"
 meat_events.4.historical_info: "Pieter Aertsen was a Dutch painter active during the sixteenth century. He pioneered large-scale market and kitchen scenes, often depicting foodstuffs with unprecedented detail while placing religious subjects in the background. His works, including The Meat Stall, influenced generations of Netherlandish artists and helped establish food and market scenes as important artistic subjects."
 meat_events.4.a: "Commission his work."
 meat_events.4.b: "We have no room for another painter."

 meat_events.5.title: "The Meat Stall"
 meat_events.5.desc: "[pieter_aertsen.GetName]'s latest work, which he has named #italic The Meat Stall#! is considered a masterpiece by many of the [target_nation.GetAdjective] elite. Dominated by an impressive display of butchered [meat.GetName], sausages, and other provisions, the painting elevates the ordinary market stall into a subject worthy of artistic admiration."
 meat_events.5.entry: "The Meat Stall"
 meat_events.5.historical_info: "Painted in 1551, The Meat Stall is among Pieter Aertsen's most celebrated works. The painting depicts an abundance of meat products displayed before a bustling market scene, while a small religious episode unfolds in the background. Aertsen's innovative composition helped establish market and food scenes as respected subjects in Netherlandish art."
 meat_events.5.a: "A masterpiece of abundance."
 the_meat_stall: "The Meat Stall"
 the_meat_stall_desc: "Pieter Aertsen's celebrated painting inspires artists with its vivid portrayal of markets, food, and everyday life."

 meat_events.6.title: "Joachim Beuckelaer"
 meat_events.6.desc: "The paintings of [joachim_beuckelaar.GetName] have become increasingly sought after in [target_nation.GetName]. His bustling market scenes and kitchen interiors depict an abundance of [meat.GetName], poultry, [fish.GetName], and produce, rendered with remarkable detail and realism."
 meat_events.6.entry: "Joachim Beuckelaer"
 meat_events.6.historical_info: "Joachim Beuckelaer was a Flemish painter specialising in market and kitchen scenes with elaborate displays of food and household equipment. His development of the genre of market and kitchen scenes was influential on the development of still life art in Northern Europe as well as Italy and Spain. He also painted still lifes with no figures in the central scene. He further added the staffage or the garments in works of other local painters, such as Anthonis Mor."
 meat_events.6.a: "Comission his work."
 meat_events.6.b: "We have no room for another painter."

 meat_events.7.title: "Marx Rumpolt"
 meat_events.7.desc: "The head cook of our court, a man named [marx_rumpolt.GetName] has compiled an extensive collection of recipes drawn from the kitchens of princes and nobles. Covering everything from [meat.GetName] and [game.GetName] to [fish.GetName], pastries, and sauces, his work showcases the richness and sophistication of contemporary cookery."
 meat_events.7.entry: "Marx Rumpolt"
 meat_events.7.historical_info: "Marx Rumpolt was a German chef who served as Küchenmeister to the Elector of Mainz. His Ein New Kochbuch, published in 1581, was among the largest cookbooks of its age. Containing hundreds of recipes and detailed instructions for preparing meat, fish, game, and other dishes, it remains an important source on Renaissance cuisine."
 meat_events.7.a: "Great, now I'm hungry."
 a_new_cookbook: "Ein New Kochbuch"
 a_new_cookbook_desc: "Marx Rumpolt's celebrated cookbook encourages the refinement of culinary arts and the preparation of increasingly elaborate dishes."

 meat_events.8.title: "The Accomplished Cook"
 meat_events.8.desc: "A new cookbook by [robert_may.GetName] has garnered a great amount of praise among professional cooks. Drawing upon decades of experience in noble kitchens, the work presents an extensive collection of recipes for [meat.GetName], [game.GetName], [fish.GetName], pies, and sauces, reflecting the richness of [target_nation.GetAdjective] cuisine."
 meat_events.8.entry: "The Accomplished Cook"
 meat_events.8.historical_info: "Published in 1660, The Accomplished Cook was written by the English chef Robert May. Containing hundreds of recipes and detailed instructions, the work documented the culinary traditions of aristocratic households and became one of the most influential cookbooks of seventeenth-century England."
 meat_events.8.a: "Great, now I'm hungry."
 the_accomplished_cook: "The Accomplished Cook"
 the_accomplished_cook_desc: "Robert May's celebrated cookbook promotes the preparation of elaborate dishes and the refinement of English cookery."

 de_serres: "de Serres"
 meat_events.9.title: "Olivier de Serres"
 meat_events.9.desc: "[olivier_serres.GetName] has devoted much of his life to the improvement of agriculture. Rejecting tradition for its own sake, he advocates careful observation, experimentation, and practical experience in the management of fields, [livestock.GetName], and rural estates. His ideas have helped establish agriculture as a subject worthy of study in [target_nation.GetName]."
 meat_events.9.entry: "Olivier de Serres"
 meat_events.9.historical_info: "Olivier de Serres was a French agronomist whose writings helped transform agriculture into a subject of systematic study. Best known for Le Théâtre d'Agriculture et Mesnage des Champs, he documented methods of livestock husbandry, crop cultivation, and estate management based on practical experience and careful observation. His work influenced agricultural practice for generations."
 meat_events.9.a: "Very good."

 meat_events.10.title: "Jethro Tull"
 meat_events.10.desc: "Dissatisfied with traditional methods of cultivation, [jethro_tull.GetName] has devoted himself to improving agriculture through observation, experimentation, and mechanical innovation. His ideas challenge long-held assumptions about farming and demonstrate how new techniques can increase the productivity of [target_nation.GetAdjective] agricultural land."
 meat_events.10.entry: "Jethro Tull"
 meat_events.10.historical_info: "Jethro Tull was an English agricultural pioneer whose innovations helped shape the British Agricultural Revolution. Best known for developing an improved seed drill, he advocated systematic cultivation practices based upon observation and experimentation. His work contributed to the growing view of agriculture as a science capable of continual improvement."
 meat_events.10.a: "Very good."

 meat_events.11.title: "Charqui"
 meat_events.11.desc: "Among the peoples of the [ShowRegionName('andes_region')], meat has long been preserved through a combination of salting and drying. [target_nation.GetAdjective] settlers have readily adopted this practice, recognizing the value of a foodstuff that can be stored for months and transported across vast distances without spoiling."
 meat_events.11.entry: "Charqui"
 meat_events.11.historical_info: "Charqui, derived from the Quechua word ch'arki, is a form of preserved meat traditionally produced in the Andes. By salting and drying meat in the region's cold, arid climate, Andean peoples created a durable source of nourishment suitable for storage and transport. Following the Spanish conquest, the technique was widely adopted throughout Spanish America and later inspired related preserved meat products elsewhere in the world."
 meat_events.11.a: "A practical innovation."

 meat_events.12.title: "Westphalian Ham"
 meat_events.12.desc: "The butchers and farmers of [munster.GetName] have perfected the art of curing pork. Through careful salting and smoking, they produce hams renowned for their rich flavor and exceptional keeping qualities, earning the region a reputation for some of the finest preserved [meat.GetName] in [ShowContinentName('europe')]."
 meat_events.12.entry: "Westphalian Ham"
 meat_events.12.historical_info: "Westphalian ham is a traditional German cured ham originating in the region of Westphalia. Produced from specially selected pork legs that are salted and cold-smoked, often over beechwood, it became one of the most celebrated cured meats of Central Europe. Its distinctive flavor and durability made it a valued delicacy for centuries."
 meat_events.12.a: "A cut above the rest."
 STATIC_MODIFIER_NAME_meat_westphalian_ham: "Westphalian Ham"
 STATIC_MODIFIER_DESC_meat_westphalian_ham: "The renowned hams of Westphalia exemplify the art of curing and smoking meat, setting a standard for quality that others strive to emulate."
 meat_event: "A fortunate opportunity"

 meat_events.13.title: "Parma Ham"
 meat_events.13.desc: "The curing traditions of [parma.GetName] have produced hams renowned for their delicate flavor and exceptional quality. Prepared through careful salting and lengthy aging, this prized [meat.GetName] have become synonymous with the craftsmanship of [ShowRegionName('italy_region')]."
 meat_events.13.entry: "Parma Ham"
 meat_events.13.historical_info: "Parma ham, or Prosciutto di Parma, is a traditional Italian cured ham produced in and around the city of Parma. Prepared from pork legs that are salted and aged for extended periods, it has been produced for centuries and became one of Italy's most celebrated regional specialties. Its reputation rested upon both the quality of local ingredients and the skill of its producers."
 meat_events.13.a: "A true delicacy."
 STATIC_MODIFIER_NAME_meat_parma_ham: "Parma Ham"
 STATIC_MODIFIER_DESC_meat_parma_ham: "The curing traditions of Parma have produced hams renowned for their delicate flavor and exceptional quality, making them among Italy's most celebrated meats."

 meat_events.14.title: "The Hams of Teruel"
 meat_events.14.desc: "In the uplands of [ShowAreaName('aragon_area')], the dry air and cool climate of [teruel.GetName] have long favored the curing of pork. Local producers carefully salt and age their hams, creating a delicacy renowned for its flavor and keeping qualities."
 meat_events.14.entry: "The Hams of Teruel"
 meat_events.14.historical_info: "The province of Teruel in Aragón has been associated with the production of cured ham for centuries. Benefiting from a cold, dry climate well suited to the aging process, local producers developed a reputation for high-quality hams that were prized throughout Spain. Teruel remains one of the country's most important centers of ham production."
 meat_events.14.a: "A taste of Aragón."
 STATIC_MODIFIER_NAME_meat_teruel_ham: "The Hams of Teruel"
 STATIC_MODIFIER_DESC_meat_teruel_ham: "The curing traditions of Teruel demonstrate the value of careful aging and regional craftsmanship in the production of preserved meats."

 meat_events.15.title: "Nuremberg Sausages"
 meat_events.15.desc: "The butchers of [nuremberg.GetName] have earned a reputation for producing sausages of remarkable quality. Prepared according to established local traditions and carefully regulated standards, these small sausages have become one of [target_nation.GetName]'s most celebrated specialties."
 meat_events.15.entry: "Nuremberg Sausages"
 meat_events.15.historical_info: "Nuremberg sausages are a traditional German sausage originating in the city of Nuremberg. Produced for centuries according to local regulations, they became renowned throughout the Holy Roman Empire for their distinctive flavor and consistent quality. They remain among Germany's most famous regional meat products."
 meat_events.15.a: "A local specialty."
 STATIC_MODIFIER_NAME_meat_nuremberg_sausages: "Nuremberg Sausages"
 STATIC_MODIFIER_DESC_meat_nuremberg_sausages: "The butchers of Nuremberg are renowned for producing sausages of exceptional quality according to long-established local traditions."

 meat_events.16.title: "Mortadella di Bologna"
 meat_events.16.desc: "The sausage makers of [bologna.GetName] have perfected the production of #italic Mortadella#!. Finely minced pork, carefully seasoned and prepared according to local tradition, has earned the city a reputation for one of [ShowRegionName('italy_region')]'s most celebrated meat products."
 meat_events.16.entry: "Mortadella di Bologna"
 meat_events.16.historical_info: "Mortadella is a traditional Italian sausage associated with the city of Bologna. Produced from finely ground pork and seasoned with spices, it became one of the city's most famous culinary specialties during the medieval and early modern periods. Strict regulations governing its production helped maintain its reputation for quality."
 meat_events.16.a: "A Bolognese specialty."
 STATIC_MODIFIER_NAME_meat_mortadella_di_bologna: "Mortadella di Bologna"
 STATIC_MODIFIER_DESC_meat_mortadella_di_bologna: "The sausage makers of Bologna are renowned for their skill in producing finely crafted cured meats."

 meat_events.17.title: "Bayonne Ham"
 meat_events.17.desc: "The curing traditions of [bayonne.GetName] have earned widespread admiration across all of [target_nation.GetName]. Prepared with carefully selected salt and aged according to local custom, the region's hams are renowned for their delicate flavor and exceptional quality."
 meat_events.17.entry: "Bayonne Ham"
 meat_events.17.historical_info: "Bayonne ham is a traditional French cured ham associated with the region surrounding the city of Bayonne. Produced for centuries using local salt and carefully controlled curing methods, it became one of France's most celebrated meat products. Its reputation spread widely during the early modern period and endures to this day."
 meat_events.17.a: "A Gascon delicacy."
 STATIC_MODIFIER_NAME_meat_bayonne_ham: "Bayonne Ham"
 STATIC_MODIFIER_DESC_meat_bayonne_ham: "The curing traditions of Bayonne have produced hams renowned throughout France for their quality and flavor."

 meat_events.18.title: "The Smithfield Market"
 meat_events.18.desc: "The [livestock.GetName] market at Smithfield in [london.GetName] has grown into one of the principal centers of the [target_nation.GetAdjective] [meat.GetName] trade. Herds of cattle and flocks of sheep arrive from across the countryside, supplying the butchers and consumers of London with a steady source of fresh meat. With some minor investments, we could easily transform this market into one of the most important livestock markets in [ShowContinentName('europe')]."
 meat_events.18.entry: "The Smithfield Market"
 meat_events.18.historical_info: "Located just beyond the walls of medieval London, Smithfield Market served as England's foremost livestock market for centuries. Vast numbers of cattle, sheep, and other animals were bought and sold there, helping to provision one of Europe's largest cities. The market played a central role in the development of England's commercial meat trade."
 meat_events.18.a: "Expand the Smithfield Market."
 meat_events.18.b: "It is too costly."
 STATIC_MODIFIER_NAME_smithfield_market: "The Smithfield Market"
 STATIC_MODIFIER_DESC_smithfield_market: "Smithfield Market is the heart of London's livestock trade."

 meat_events.19.title: "Les Halles"
 meat_events.19.desc: "In the heart of [paris.GetName], the markets of Les Halles teem with merchants, butchers, fishmongers, and customers from every walk of life. Vast quantities of [livestock.GetName] pass through its stalls each day, making it one of the principal centers of commerce and provisioning in [target_nation.GetName]. With some minor investments, we could easily transform this market into one of the most important livestock markets in [ShowContinentName('europe')]."
 meat_events.19.entry: "Les halles"
 meat_events.19.historical_info: "Founded in the twelfth century, Les Halles served as the central food market of Paris for hundreds of years. Meat, fish, produce, and countless other goods were bought and sold beneath its halls, helping to provision one of Europe's largest cities. Its importance grew alongside that of Paris itself, making it one of the most famous markets in France."
 meat_events.19.a: "Expand the belly of Paris."
 meat_events.19.b: "It is too costly."
 STATIC_MODIFIER_NAME_les_halles_market: "Les Halles"
 STATIC_MODIFIER_DESC_les_halles_market: "Les Halles is the marketplace of Paris."

 meat_events.20.title: "Hungarian Grey Cattle"
 meat_events.20.desc: "Across the wide grasslands of [ShowRegionName('carpathia_region')] roam great herds of grey cattle, tended by herdsmen who guide them from pasture to pasture with practiced skill. The hardiness and endurance of this [livestock.GetName] is renowned, allowing them to survive long journeys to distant markets. Merchants from across [ShowSubContinentName('eastern_europe')] eagerly seek these beasts, and the wealth brought by their trade has become a familiar sight throughout the [hungarian.GetName] countryside."
 meat_events.20.entry: "Hungarian Grey Cattle"
 meat_events.20.historical_info: "The Hungarian Grey Cattle emerged as one of the most important livestock breeds of the Kingdom of Hungary. During the late medieval and early modern periods, immense herds were driven across Central Europe to supply growing urban markets. Their resilience and ability to travel long distances made them a cornerstone of Hungary's cattle trade."
 meat_events.20.a: "Expand the herds."
 meat_events.20.b: "Preserve existing pastures."
 STATIC_MODIFIER_NAME_hungarian_cattle: "Hungarian Grey Cattle"
 STATIC_MODIFIER_DESC_hungarian_cattle: "The hardy grey cattle of the Hungarian Plain support prosperous livestock production and a thriving export trade."

 meat_events.21.title: "Dutch Ox Markets"
 meat_events.21.desc: "The markets of [ShowAreaName('holland_area')] are alive with the bellowing of [livestock.GetName] and the cries of merchants seeking the finest beasts. Oxen from near and far are driven into the bustling market squares of [leiden.GetName] and [alkmaar.GetName], where farmers, traders, and butchers gather to strike profitable bargains. Through careful organization and thriving commerce, these markets have become a cornerstone of regional prosperity."
 meat_events.21.entry: "Dutch Ox Markets"
 meat_events.21.historical_info: "The Low Countries developed some of Europe's most sophisticated agricultural and commercial networks during the late medieval and early modern periods. Livestock markets played an important role in this success, with cattle and oxen traded through organized fairs and urban marketplaces. Dutch merchants connected producers and consumers across northwestern Europe, making the cattle trade a valuable source of wealth."
 meat_events.21.a: "Invest funds to encourage the trade."
 meat_events.21.b: "When our markets prosper, we prosper."
 STATIC_MODIFIER_NAME_dutch_ox_markets: "Dutch Ox Markets"
 STATIC_MODIFIER_DESC_dutch_ox_markets: "Well-organized cattle markets draw merchants from across the region, enriching local communities through the trade of oxen and livestock."

meat_events.22.title: "Claude Bourgelat"
meat_events.22.desc: "For generations, the care of [livestock.GetName] has relied upon custom and experience. [claude_bourgelat.GetName] proposes a more systematic approach, bringing the methods of natural philosophy to the study of animal health. His teachings promise healthier herds, fewer losses to disease, and new advances in animal husbandry."
meat_events.22.entry: "Claude Bourgelat"
meat_events.22.historical_info: "Claude Bourgelat was a French veterinarian and founder of the world's first modern veterinary school in Lyon in 1761. His work transformed veterinary medicine into a scientific discipline and helped improve the health and productivity of livestock throughout Europe."
meat_events.22.a: "An excellent development."

meat_ice_houses_advance: "Ice Houses"
meat_ice_houses_advance_desc: "Ice houses are insulated buildings used to store ice harvested during winter. By packing ice beneath layers of straw or sawdust, communities could preserve food, chill drinks, and keep meat fresh throughout much of the year."
meat_pigeon_houses_advance: "Dovecotes"
meat_pigeon_houses_advance_desc: "Dovecotes are structures intended to house pigeons or doves. They may be free-standing structures in a variety of shapes, or built into the end of a house or barn. They generally contain pigeonholes for the birds to nest. Pigeons and doves were an important food source historically in the Middle East and Europe and were kept for their eggs and dung"
meat_transhumance_advance: "Transhumance"
meat_transhumance_advance_desc: "Transhumance is the seasonal movement of livestock between different grazing grounds. By moving herds to upland pastures in summer and lowlands in winter, pastoralists could make better use of available forage and support larger animal populations."
meat_drover_roads_advance: "Drovers' Roads"
meat_drover_roads_advance_desc: "Drovers' roads are routes used to move livestock over long distances between grazing lands and markets. These established paths enabled the large-scale trade of cattle, sheep, and other animals while reducing conflicts with farmers and landowners."
meat_veterinary_medicine_advance: "Veterinary Medicine"
meat_veterinary_medicine_advance_desc: "Veterinary medicine applies medical knowledge to the care of livestock and other animals. Improved treatments, disease prevention, and animal husbandry reduce losses, increase productivity, and help maintain healthier herds."

meat_events.50.title: "The Last Great Herds"
meat_events.50.desc: "For generations, vast herds of [bison.GetName] have roamed [target_location.GetName], providing [meat.GetName], [leather.GetName], and [furs.GetName] in abundance. But years of hunting and settlement have taken their toll. Travelers report that the once-endless herds grow smaller with each passing season. Some argue that the land should now be put to more productive use, while others insist that the remaining herds must be preserved before they vanish entirely."
meat_events.50.a: "Let us shift our focus."
meat_events.50.b: "We have no interest in developing this land."

meat_events.101.title: "The Prize Bull"
meat_events.101.desc: "Word spreads of an extraordinary bull owned by a local breeder in [target_location.GetName]. Its size, strength, and temperament are said to be unmatched, and herders from across [target_nation.GetName] have gathered to inspect the animal. Acquiring it for our herds could improve breeding stock for years to come, though at considerable expense."
meat_events.101.a: "Its value lies in the breeding stock."
meat_events.101.b: "Celebrate this national achievement."
STATIC_MODIFIER_NAME_the_prize_bull: "The Prize Bull"
STATIC_MODIFIER_DESC_the_prize_bull: "A extraordinary bull has captivated the hearts and souls of the local population."

meat_events.102.title: "The Wolf Problem"
meat_events.102.desc: "Several pastoral communities around [target_location.GetName] report increasing cattle losses to wolf attacks. Herdsmen petition the government for assistance, arguing that growing predator populations threaten both [livestock.GetName] and rural livelihoods. Naturalists caution, however, that a large-scale cull may have unforeseen consequences."
meat_events.102.a: "Organize a nationwide wolf hunt."
meat_events.102.b: "Compensate affected herders."

meat_events.103.title: "The Sacred Herd"
meat_events.103.desc: "A herd of cattle in [target_location.GetName] has long been regarded with special reverence by local communities. Though no law protects the animals, custom dictates that they not be slaughtered. As demand for [meat.GetName] grows, local authorities are asking whether these traditions should continue to be respected."
meat_events.103.a: "Honor the tradition."
meat_events.103.b: "Superstition must not hinder commerce."

meat_events.104.title: "A Season of Plenty"
meat_events.104.desc: "Excellent grazing conditions, mild weather, and abundant water across [target_nation.GetName] have combined to create an exceptional year for [livestock.GetName] producers. Herds are larger, healthier, and more productive than expected, leading many to wonder how best to make use of the surplus."
meat_events.104.a: "Send the surplus to the slaughter."
meat_events.104.b: "Expand the herds."
STATIC_MODIFIER_NAME_meat_surplus_meat: "A Season of Plenty"
STATIC_MODIFIER_DESC_meat_surplus_meat: "Excellent grazing conditions, mild weather, and abundant water have combined to create an exceptional year for livestock producers."
STATIC_MODIFIER_NAME_meat_surplus_livestock: "A Season of Plenty"
STATIC_MODIFIER_DESC_meat_surplus_livestock: "Excellent grazing conditions, mild weather, and abundant water have combined to create an exceptional year for livestock producers."

meat_events.105.title: "Festival Slaughter"
meat_events.105.desc: "An upcoming festival in [target_location.GetName] has led to a sharp increase in demand for meat across several regions. Merchants, butchers, and [livestock.GetName] producers all stand to profit from the celebrations, but some officials warn that excessive slaughter may leave markets undersupplied in the months ahead."
meat_events.105.a: "Meet the demand and celebrate lavishly."
meat_events.105.b: "Limit slaughter to preserve the herds."

meat_events.106.title: "A New Type of Sausage"
meat_events.106.desc: "Butchers in [target_location.GetName] have begun producing a new variety of sausage that makes use of cuts and trimmings that would otherwise go to waste. The product has proven popular with consumers, and some [target_nation.GetAdjective] merchants believe it could open new markets for preserved [meat.GetName]."
meat_events.106.a: "Promote its production nationwide."
meat_events.106.b: "Such innovations are beneath our concern."