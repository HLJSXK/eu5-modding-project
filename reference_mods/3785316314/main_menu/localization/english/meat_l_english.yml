l_english:
 meat: "Meat"
 meat_desc: "Fresh, salted, smoked, dried, and cured animal products have sustained populations and provisioned armies throughout history. Produced from livestock and preserved through a variety of techniques, meat has long been a vital source of nourishment, commerce, and military supply, supporting both local markets and long-distance trade."
