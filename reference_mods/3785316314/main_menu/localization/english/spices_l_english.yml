 STATIC_MODIFIER_NAME_spices_cardamom_hills: "Cardamom Hills"
 STATIC_MODIFIER_DESC_spices_cardamom_hills: "The Cardamom Hills are a mountain range in the Western Ghats of India. They are known for their production of cardamom."
 STATIC_MODIFIER_NAME_spices_ceylon_cinnamon: "True Cinnamon"
 STATIC_MODIFIER_DESC_spices_ceylon_cinnamon: "Ceylon cinnamon, also known as true cinnamon, is a type of cinnamon that is native to Sri Lanka. It is considered to be of higher quality than cassia cinnamon."
 STATIC_MODIFIER_NAME_spices_banda_islands: "Banda Islands"
 STATIC_MODIFIER_DESC_spices_banda_islands: "The Banda Islands are a group of ten small volcanic islands in the Banda Sea, part of the Maluku Islands of Indonesia. They are famous for being the only source of nutmeg and mace until the mid-19th century."
 STATIC_MODIFIER_NAME_spices_banda_extra_extra: "Nutmeg and Mace"
 STATIC_MODIFIER_DESC_spices_banda_extra_extra: "Nutmeg and Mace are some of the most valuable spices on earth."

 spices_events.1.title: "The Banda Islands"
 spices_events.1.desc: "Our explorers are the first Europeans to reach [banda.GetName]. These islands are the only source of [nutmeg.GetName] and mace in the world. For centuries [venetian.GetName] and [arabian.GetName] traders have controlled our access to these valuable spices, but now we are finally granted the opportunity to establish our own control over this lucrative trade."
 spices_events.1.entry: "The Banda Islands"
 spices_events.1.historical_info: "In 1512, the Portuguese explorer António de Abreu reached the Banda Islands, marking the first European contact with the region. The islands were the sole source of nutmeg and mace, making them a highly coveted prize in the spice trade. The Portuguese established a trading post on the islands, but control over the lucrative spice trade would later shift to the Dutch and then to the British, leading to centuries of competition and conflict over these valuable commodities."
 spices_events.1.a: "Establish a Trading Post."
 spices_events.1.b: "We will return with a larger force."
 spices_events.1.c: "Let's trade with the locals."
 spices_events.1.d: "We have no interest for now."

 spices_events.2.title: "Tomé Pires"
 spices_events.2.desc: "One of the apothecaries in our court, [tome_pires.GetName], has been suggested to serve as a #italic Factor#!, a trader commissioned to receive and sell goods. If appointed, he will depart for [kannur.GetName], a major trading hub in the [indian_ocean.GetName], where he will establish a trading post and begin trading spices and other goods on our behalf."
 spices_events.2.entry: "Tomé Pires"
 spices_events.2.historical_info: "Tomé Pires was a Portuguese apothecary, diplomat, and explorer who lived during the late 15th and early 16th centuries. He is best known for his work Suma Oriental, a comprehensive account of the geography, peoples, and trade of Asia, particularly the Indian Ocean region and Southeast Asia. Pires’ book provided valuable information about the spice trade, including details on the production and commerce of spices such as cinnamon, nutmeg, and cloves. His work was widely consulted by European merchants and officials, contributing to the expansion of Portuguese trade and influence in Asia."
 spices_events.2.a: "Send him to India."
 spices_events.2.b: "We'd prefer to focus his efforts elsewhere."
 tome_leaves_for_kannur: "[tome_pires.GetName] travels to [kannur.GetName]."
 tome_pires_journey_tt: "Tomé Pires is travelling in the Orient."

 spices_events.3.title: "Tomé Pires is on the Move"
 spices_events.3.desc: "After serving as a Factor in [kannur.GetName] for several years, [tome_pires.GetName] has gained valuable experience and knowledge of the spice trade. He has suggested that he could be even more effective if he were to move to [temasek.GetName], another major trading hub in the region. There, he plans to establish a [office.GetName] and expand our influence in the [market.GetName]."
 spices_events.3.entry: "Tomé Pires is on the Move"
 spices_events.3.a: "Support his move."
 spices_events.3.b: "He should stay in India."
 tome_leaves_for_temasek: "[tome_pires.GetName] travels to [temasek.GetName]."

 spices_events.4.title: "Suma Oriental"
 spices_events.4.desc: "Drawing upon his years of experience in the [indian_ocean.GetName] trade, [tome_pires.GetName] has written a book titled #italic Suma Oriental#!, a comprehensive account of the geography, peoples, and commerce of [ShowContinentName('asia')]. Containing valuable information on the spice trade, the work could prove an invaluable resource for our merchants and explorers."
 spices_events.4.entry: "Suma Oriental"
 spices_events.4.historical_info: "Suma Oriental (full title: Suma Oriental que trata do Mar Roxo até aos Chins) was a Portuguese account of Asia written by Tomé Pires between roughly 1512 and 1515. The work describes the geography, peoples, customs, politics, and trade networks of the Indian Ocean and Southeast Asia, with particular attention given to the spice trade and the commercial centers frequented by Portuguese merchants. It is considered one of the earliest and most important European sources on maritime Asia in the early 16th century."
 spices_events.4.a: "Fund and publish it immediately."
 spices_events.4.b: "Circulate it among our merchants and explorers."
 suma_oriental: "Suma Oriental"
 suma_oriental_desc: "A 16th-century account of the geography, peoples, and trade of Asia written by Tomé Pires, with a particular focus on the spice trade and the Indian Ocean world."
 STATIC_MODIFIER_NAME_spices_tome_pires_works_hard: "The lessons of Tomé Pires"
 STATIC_MODIFIER_DESC_spices_tome_pires_works_hard: "Tomé Pires' experiences in the spice trade are furthering our trading efforts."

 spices_events.5.title: "Tomé Pires' Final Journey"
 spices_events.5.desc: "Eager to expand our reach in the [market.GetName], [tome_pires.GetName] has proposed leading an expedition to [guangzhou.GetName], a great hub for the trade of spices and other valuable goods. His expertise could prove invaluable in establishing relations with the local [culture.GetName] traders and gaining access to their lucrative wares."
 spices_events.5.entry: "Tomé Pires' Final Journey"
 spices_events.5.a: "Support his expedition to [guangzhou.GetName]."
 spices_events.5.b: "We should focus on Malacca for now."

 spices_events.6.title: "A Foreign Ambassador to Guangzhou"
 spices_events.6.desc: "A foreign ambassador from [portugal.GetName] has arrived in [guangzhou.GetName], seeking to establish diplomatic and trade relations. The man is well-versed in the customs and languages of the region, and has expressed a particular interest in our spices. He has requested an audience with our leaders to discuss potential trade agreements."
 spices_events.6.a: "Welcome the ambassador and discuss trade agreements."
 spices_events.6.b: "We should be cautious in our dealings with foreign powers."
 new_trade_opportunities: "New Trade Opportunities"
 new_trade_opportunities_desc: "Through diplomacy, we have established new trade opportunities."
 new_trade_obstructions: "Trade Obstructions"
 new_trade_obstructions_desc: "We have lost access to some trade opportunities due to diplomatic tensions."

 spices_events.7.title: "Trade Mission Successful"
 spices_events.7.desc: "Our trade mission to [guangzhou.GetName] has been a resounding success. We have established strong diplomatic and trade relations with the Chinese, gaining access to their markets and securing a steady supply of spices and other valuable goods. This will greatly enhance our economy and strengthen our position in the region."
 spices_events.7.a: "A great success!"

 spices_events.8.title: "Trade Mission Failed"
 spices_events.8.desc: "Our trade mission to [guangzhou.GetName] has failed. Diplomatic tensions have arisen, and we have lost access to the Chinese markets. This is a significant setback for our economy and our position in the region."
 spices_events.8.a: "A shame."

 spices_events.9.title: "The Nutmeg Trade"
 spices_events.9.desc: "Merchants from [target_nation.GetName] have arrived in [banda.GetName] seeking access to the lucrative trade in [nutmeg.GetName] and mace, spices found nowhere else in the world. By negotiating with the local #italic orang kaya#! and establishing permanent trading posts, we hope to secure a dominant position in one of the most profitable trades in [ShowContinentName('asia')]."
 spices_events.9.entry: "The Nutmeg Trade"
 spices_events.9.historical_info: "In 1598, one of the first Dutch expeditions to the East Indies was launched by a Dutch pre-company under the command of Jacob Corneliszoon van Neck, Jacob van Heemskerck, and Wybrand van Warwijck. Arriving in the Banda Islands in 1599, the Dutch established contact with local leaders, signed trade agreements, and constructed a trading post. The Banda Islands were of immense value due to being the world’s only source of nutmeg and mace."
 spices_events.9.a: "We must establish more trade posts."
 spices_events.9.b: "It's not worth our efforts."

 spices_events.10.title: "The Banda Massacre"
 spices_events.10.desc: "Despite [target_nation.GetAdjective] control of the [banda.GetName], we are struggling to maintain our hold on the valuable [nutmeg.GetName] and mace trade. The #italic Orang Kaya#!, or rich men, have been resistant to our presence, and continues to subvert our efforts to extract these valuable spices. In response, we are ready to take drastic measures to secure our control over the islands and their precious resources."
 spices_events.10.entry: "The Banda Massacre"
 spices_events.10.historical_info: "In 1621, the Dutch East India Company carried out the Banda Massacre in an effort to secure a monopoly over the lucrative nutmeg trade. Thousands of Bandanese were killed, enslaved, or displaced after resisting Dutch demands for exclusive control of the spice trade, permanently transforming the Banda Islands and their economy."
 spices_events.10.a: "We will crush all resistance at any cost."
 spices_events.10.b: "We should try to negotiate with the locals."
 STATIC_MODIFIER_NAME_spices_banda_islands_extra: "Banda Islands - Intensified Production"
 STATIC_MODIFIER_DESC_spices_banda_islands_extra: "The Banda Islands are a group of ten small volcanic islands in the Banda Sea, part of the Maluku Islands of Indonesia. They are famous for being the only source of nutmeg and mace until the mid-19th century."

 spices_events.11.title: "The Perkeniers System"
 spices_events.11.desc: "With [banda.GetName] now firmly under [target_nation.GetAdjective] authority, Company officials have proposed a reorganization of the [nutmeg.GetName] trade to strengthen our monopoly over these valuable spices. The plantations shall be divided into estates, known as perken, and entrusted to loyal perkeniers who will oversee the cultivation and export of nutmeg and mace on the Company’s behalf."
 spices_events.11.entry: "The Perkeniers System"
 spices_events.11.historical_info: "The perkeniers system was a method of organizing the cultivation of nutmeg and mace on the Banda Islands under Dutch control. The islands were divided into estates, or perken, which were managed by perkeniers responsible for overseeing the production of the valuable spices. This system allowed the Dutch to maintain a monopoly over the nutmeg trade, ensuring a steady supply of the highly sought-after commodities while maximizing profits for the Company."
 spices_events.11.a: "Implement it immediately."
 spices_events.11.b: "Let's make the islands prosper."
 STATIC_MODIFIER_NAME_spices_banda_islands_mega: "Banda Islands - Maximum Production"
 STATIC_MODIFIER_DESC_spices_banda_islands_mega: "The Banda Islands are a group of ten small volcanic islands in the Banda Sea, part of the Maluku Islands of Indonesia. They are famous for being the only source of nutmeg and mace until the mid-19th century."

 spices_events.12.title: "Smuggling Nutmeg Trees"
 spices_events.12.desc: "Our advisors have suggested a daring plot to attempt to smuggle [nutmeg.GetName] trees out of [banda.GetName] and establish plantations in our own territories. If succesful, this could break the [victim_nation.GetAdjective] monopoly on these valuable spices and open up new opportunities for [target_nation.GetName]."
 spices_events.12.entry: "Smuggling Nutmeg Trees"
 spices_events.12.historical_info: "In the late 18th century, Pierra Poivre led a daring expedition to smuggle nutmeg trees out of the Banda Islands, then under Dutch control, and establish plantations in French territories. This act of botanical espionage was part of a broader effort by European powers to break the Dutch monopoly on the lucrative nutmeg trade, ultimately leading to the spread of nutmeg cultivation beyond its original source and transforming global spice markets."
 spices_events.12.a: "Support the smuggling operation."
 spices_events.12.b: "We should respect the monopoly on nutmeg."
 opinion_spices_stole_nutmeg: "They stole our Nutmeg!"
 antagonism_spices_stole_nutmeg: "They Stole our Nutmeg!"

 spices_events.13.title: "A Nutmeg Monopoly Shattered"
 spices_events.13.desc: "We have learned that [target_nation.GetName] has successfully managed to smuggle [nutmeg.GetName] trees out of [banda.GetName] and established plantations in [target_location.GetName]. If these stolen trees are successfully transplanted, it may prove to be a significant blow to the [victim_nation.GetAdjective] monopoly on nutmeg."
 spices_events.13.a: "This is a disaster!"

 spices_events.14.title: "The Ginger Root"
 spices_events.14.desc: "Our explorers have discovered lands rich in [ginger.GetName] cultivation. For centuries, ginger has been a highly sought-after spice, prized for its culinary and medicinal uses. By establishing control over these new sources of ginger, we could potentially tap into a lucrative market that has existed since ancient times and establish [target_nation.GetName] as a major player in the ginger trade."
 spices_events.14.entry: "The Ginger Root"
 spices_events.14.historical_info: "Historically, ginger originated in Maritime Southeast Asia and spread through Indian Ocean trade networks long before Europeans arrived. By the medieval and early modern eras, Europeans viewed ginger as one of the most important eastern spices, valued for medicine, cooking, and trade. Portuguese explorers and merchants later established direct access to ginger-producing regions after opening the sea route around Africa in the late 15th century, greatly expanding the spice trade. Ginger cultivation was eventually introduced into the Caribbean by the Spanish, where it became a profitable colonial export during the 16th–18th centuries."
 spices_events.14.a: "We should establish direct trade routes."
 spices_ginger_found: "Ginger Craze!"
 spices_ginger_found_desc: "There is increased demand for ginger."

 spices_events.15.title: "Garcia de Orta"
 spices_events.15.desc: "The physician and scholar [garcia_orta.GetName], one of the #italic New Christians of Portugal#!, all whom are converted Jews, has petitioned to depart for [goa.GetName]. Learned in medicine and fascinated by the spices and remedies of the East, he claims that Goa offers opportunity for study and service. Yet whispers spread that he seeks escape from the growing scrutiny of the Inquisition."
 spices_events.15.entry: "Garcia de Orta"
 spices_events.15.historical_info: "Garcia de Orta was born into a family of converted Jews, or New Christians, in Portugal during a period of increasing religious persecution. In 1534 he departed for Portuguese India, eventually settling in Goa, where he became a renowned physician and scholar of Asian medicine and spices. His work Colóquios dos simples e drogas da India became one of Europe’s most important early texts on Indian spices, including ginger, pepper, and cinnamon. Although he died before formal prosecution, the Goa Inquisition later condemned his memory, and his remains were exhumed and burned posthumously on charges of secretly practicing Judaism."
 spices_events.15.a: "Let him go."
 spices_events.15.b: "Let the inquisition have him."
 de_orta: "de Orta"

 spices_events.16.title: "Colloquies of the Simples and Drugs of India"
 spices_events.16.desc: "After years spent in [goa.GetName] studying the plants, medicines, and spices of [ShowSubContinentName('south_asia')], Garcia de Orta has completed a remarkable manuscript. Written as a series of dialogues, the work describes the uses and trade of [ginger.GetName], [pepper.GetName], [cinnamon.GetName], and countless eastern remedies unfamiliar to most physicians in [ShowContinentName('europe')]."
 spices_events.16.entry: "Colloquies of the Simples and Drugs of India"
 spices_events.16.historical_info: "Garcia de Orta published Colóquios dos simples e drogas da India in Goa in 1563. The book was one of the first European scientific works devoted to Indian medicine, tropical plants, the spice trade and several tropical diseases. Unlike many medieval authors who relied on ancient authorities, Garcia de Orta emphasized direct observation and conversations with local physicians and merchants. His writings introduced many Europeans to more accurate knowledge about ginger and other Asian spices, making the work highly influential in Renaissance medicine and commerce."
 colloquies: "Colloquies of the Simples and Drugs of India"
 colloquies_desc: "A 16th-century work by Garcia de Orta, providing, among other things, detailed information on the medicinal and culinary uses of Indian spices and remedies, including ginger, pepper, and cinnamon."
 spices_events.16.a: "Allow it to be published."
 spices_events.16.b: "We should suppress this heretical work."

 spices_events.17.title: "The English Physician"
 spices_events.17.desc: "A new herbal text by the physician [nicholas_culpeper.GetName] has begun circulating among the commoners. Written in the [english.GetName] tongue rather than scholarly [latin.GetName], the book describes the medicinal uses of countless plants and spices, including [ginger.GetName]. Culpeper also criticizes the traditional medical establishment in [target_nation.GetName] for hoarding knowledge from the common folk and chastizes them for their greedy practises in the work. Learned physicians condemn the work as reckless populism, while many among the people praise its practical remedies."
 spices_events.17.entry: "The English Physician"
 spices_events.17.historical_info: "Nicholas Culpeper published The English Physician in 1652. The book was a popular herbal guide that provided practical information on the medicinal uses of plants and spices, including ginger, in the English language rather than Latin. Culpeper's work was notable for its criticism of the medical establishment, which he accused of hoarding knowledge and exploiting patients for profit. While many learned physicians condemned the book as reckless populism, it was widely praised by the general public for its accessible remedies and practical advice, making it a significant influence on herbal medicine in England and beyond."
 spices_events.17.a: "I see no harm in it."
 spices_events.17.b: "This is dangerous nonsense."
 the_english_physician: "The English Physician"
 the_english_physician_desc: "A 17th-century herbal guide by Nicholas Culpeper, providing practical information on the medicinal uses of plants and spices, including ginger, in the English language, and criticizing the medical establishment for hoarding knowledge and exploiting patients."

 spices_events.18.title: "A Prophesy of the White King"
 spices_events.18.desc: "The herbalist and astrologer [nicholas_culpeper.GetName] has published yet another controversial work. Filled with prophetic warnings, astrological signs, veiled criticism of the established order and most outrageously a prediction of the disposition and death of our monarch, [ruler.GetName], #italic A Prophecy of the White King; and Dreadfull Dead-man Explaned#! has spread rapidly among the populace."
 spices_events.18.entry: "A Prophesy of the White King"
 spices_events.18.historical_info: "Nicholas Culpeper was not only a physician and herbal writer, but also an astrologer and political pamphleteer during the turbulent years of the English Civil War. His work A Prophecy of the White King blended prophecy, astrology, and political commentary, reflecting the intense religious and political anxieties of 17th-century England. Though far less influential than his medical writings, the pamphlet contributed to Culpeper’s reputation as a controversial and anti-establishment figure willing to challenge traditional authority."
 spices_events.18.a: "We should ignore this nonsense."
 spices_events.18.b: "Now he's gone too far."
 treatise_white_king: "A Treatise of the White King"
 treatise_white_king_desc: "A 17th-century pamphlet by the English astrologer Nicholas Culpeper and William Lilly, containing a prophecy that the English king would be overthrown by a foreign power."

 spices_events.19.title: "Hans Sloane"
 spices_events.19.desc: "The physician and natural philosopher [hans_sloane.GetName] has risen to great prominence within the scholarly circles of [target_nation.GetName]. Having studied the plants and medicines of the colonies, his collections and writings have earned admiration from physicians, merchants, and learned societies alike. Following the death of Isaac Newton, Sloane has now been elected the 13th President of the Royal Society, truly showing off his reputation as one of the foremost scholars of the age."
 spices_events.19.entry: "Hans Sloane"
 spices_events.19.historical_info: "Hans Sloane was an Anglo-Irish physician, collector, and natural philosopher best known for his studies of the natural world and colonial medicine. After traveling to Jamaica in the late 17th century, he documented numerous Caribbean plants and spices, including ginger. In 1727, following the death of Isaac Newton, Sloane was elected the 13th President of the Royal Society, becoming one of the leading scientific figures of Enlightenment Britain. His enormous collections later formed the foundation of the British Museum."
 spices_events.19.a: "Fantastic fellow, that Sloane!"

 spices_events.20.title: "Sloane's Chocolate Milk"
 spices_events.20.desc: "While studying the plants and medicines of [yaguabo.GetName], [hans_sloane.GetName] encountered the bitter [cocoa.GetName] drinks consumed throughout the colonies. Finding the taste rather unpleasant, he experimented with mixing chocolate, [sugar.GetName] and milk together, creating a far gentler beverage. The strange new drink has since attracted growing interest among merchants and the fashionable classes of the realm. Already grocers are claiming to sell 'Sloane's Chocolate Milk' as a medicinal elixir, and some even suggest that it could be the basis for a new type of confectionery!"
 spices_events.20.entry: "Sloane's Chocolate Milk"
 spices_events.20.historical_info: "Hans Sloane traveled to Jamaica in the 1680s, where he encountered cacao-based drinks consumed in the Caribbean and Spanish colonial world. Later accounts claim that Sloane disliked the bitterness of traditional chocolate beverages and experimented by combining cacao with milk. Though he did not invent chocolate itself, his recipe became highly influential in Britain and is often associated with the later development of milk chocolate drinks in Europe. By the 1750s, a Soho grocer named Nicholas Sanders claimed to be selling Sloane's recipe as a medicinal elixir, perhaps making 'Sir Hans Sloane's Milk Chocolate' the first brand-name milk chocolate drink. By the nineteenth century, the Cadbury Brothers sold tins of drinking chocolate whose trade cards also invoked Sloane's recipe."
 sloanes_chocolate: "Sloane's Chocolate Milk"
 sloanes_chocolate_desc: "A sweetened milk beverage made with cacao, inspired by the recipe of the Anglo-Irish physician Hans Sloane, who is often credited with popularizing the combination of chocolate and milk in Britain."

 spices_events.21.title: "Jamaican Ginger"
 spices_events.21.desc: "Settlers upon the island of [jamaica.GetName] have begun cultivating [ginger.GetName] in the colony’s rich tropical soil. The spice, which is greatly prized in the markets of [ShowContinentName('europe')] and [ShowContinentName('asia')], appears to flourish in the [ShowRegionName('caribbean_region')] climate. Merchants and plantation owners are anticipating handsome profits from the new crop."
 spices_events.21.entry: "Jamaican Ginger"
 spices_events.21.historical_info: "After the English conquest of Jamaica in 1655, colonists expanded the cultivation of ginger across the island. Jamaica’s climate proved highly favorable for the crop, and Jamaican ginger soon became well known throughout European markets for its quality. During the 17th century, ginger was among the colony’s most profitable exports before sugar plantations came to dominate the Caribbean economy."
 spices_events.21.a: "Encourage it."
 spices_events.21.b: "Prevent it."

 spices_events.22.title: "The Golden Spice"
 spices_events.22.desc: "Our merchants and explorers, returning from the distant ports of [ShowSubContinentName('south_asia')], speak of a curious yellow spice known among the locals as [turmeric.GetName]. Valued not only for its sharp, earthy flavor but also for its medicinal and dyeing properties, this #italic golden root#! has long been cultivated throughout [ShowContinentName('asia')]. Samples brought before our court astonish physicians and cooks and some are proclaiming it a remedy against fevers and ailments of the stomach, while cloth-makers are marveling at the brilliance of its pigments. Such a versatile spice may very well become a profitable treasure of the Orient!"
 spices_events.22.entry: "The Golden Spice"
 spices_events.22.historical_info: "Turmeric originated in South Asia and had been used for thousands of years in Indian cuisine, medicine, and religious practices before European arrival in the Indian Ocean. Portuguese traders in the late 15th and early 16th centuries were among the first Europeans to encounter turmeric directly through maritime trade routes established around Africa after Vasco da Gama’s voyage to India in 1498. Although never as economically dominant as pepper, cloves, or nutmeg, turmeric became known in European markets as both a spice and a dye."
 spices_events.22.a: "Even the humblest root of India bears the color of gold."
 spices_turmeric_found: "Turmeric Craze!"
 spices_turmeric_found_desc: "There is increased demand for Turmeric."

 spices_events.23.title: "The Scientific Isolation of Curcumin"
 spices_events.23.desc: "[target_nation.GetAdjective] natural philosophers and apothecaries studying the properties of [turmeric.GetName] at our national universities have succeeded in isolating the substance responsible for its brilliant golden hue. This crystalline compound, now referred to in scholarly circles as #italic curcumin#!, may possess unusual reactive properties and may prove useful in medicine, textile production, and chemical research."
 spices_events.23.entry: "The Scientific Isolation of Curcumin"
 spices_events.23.historical_info: "Curcumin is the primary active pigment found in turmeric (Curcuma longa). European scientific interest in turmeric expanded significantly during the Enlightenment and early modern scientific revolution as trade with Asia increased. Chemists in the 19th century eventually isolated curcumin in crystalline form, helping establish foundations for modern organic chemistry and pharmacology. The study of imported botanical substances from Asia played an important role in the development of European chemistry, medicine, and industrial dye research."
 spices_events.23.a: "Chapeau!"

 spices_events.24.title: "The Queen of Spices"
 spices_events.24.desc: "Though known in [ShowContinentName('europe')] since ancient times, [cardamom.GetName] long reached our markets only through costly intermediaries in [alexandria.GetName]. Now, with direct access to the ports of [ShowSubContinentName('south_asia')], merchants from all over [target_nation.GetName] are signalling the the possiblity of securing a steady supply of this highly prized spice. Called the #italic Queen of Spices#! by eastern traders, it is prized for its sharp sweetness and pleasing aroma."
 spices_events.24.entry: "The Queen of Spices"
 spices_events.24.historical_info: "Cardamom (Elettaria cardamomum) has been cultivated in southern India for thousands of years and was known to the ancient Greeks and Romans through long-distance trade networks. Throughout the Middle Ages, limited quantities reached Europe via Arab and Venetian merchants, where it remained an expensive luxury good used in medicine, cooking, and perfumery. The establishment of direct maritime trade routes between Europe and India after the Portuguese voyages of the late 15th century greatly increased European access to cardamom and other eastern spices. While never matching the economic importance of pepper or cloves, cardamom became increasingly associated with aristocratic consumption and the expanding global spice trade."
 spices_events.24.a: "A fragrance worthy of every royal court."
 spices_cardamom_found: "Cardamom Craze!"
 spices_cardamom_found_desc: "There is increased demand for Cardamom."

 spices_events.25.title: "The Source of True Cinnamon"
 spices_events.25.desc: "For centuries, [cinnamon.GetName] has reached European markets through countless intermediaries, its true origins concealed behind the mysteries of eastern trade. Merchants spoke of distant forests and fabulous lands where the precious bark was gathered, yet few in [christianity.GetName] knew the source with certainty. Now, [target_nation.GetAdjective] navigators report that the finest cinnamon, softer, sweeter, and more fragrant than the common cassia of Asian markets, is cultivated upon the island of [ceylon.GetName]. This discovery has caused great excitement among many traders and officials, for direct access to the source of true cinnamon promises immense profits and strategic advantage in the spice trade."
 spices_events.25.entry: "The Source of True Cinnamon"
 spices_events.25.historical_info: "True cinnamon (Cinnamomum verum), sometimes called Ceylon cinnamon, is native to Sri Lanka. Although cinnamon had been known in Europe since antiquity through Arab and Venetian trade networks, Europeans often lacked clear knowledge of its precise origin and frequently confused true cinnamon with cassia and related spices from East and Southeast Asia. Following the Portuguese arrival in the Indian Ocean and Sri Lanka in the early 16th century, European powers gained direct access to the cultivation and export of true cinnamon. Control over the cinnamon trade became a major objective of Portuguese and later Dutch colonial policy in the region."
 spices_events.25.a: "We must secure a monopoly on this precious spice."
 spices_cinnamon_found: "Cinnamon Craze!"
 spices_cinnamon_found_desc: "There is increased demand for Cinnamon."

 spices_events.26.title: "The Bark of Cathay"
 spices_events.26.desc: "Not all [cinnamon.GetName] reaching the markets of [ShowContinentName('europe')] comes from [ceylon.GetName]. Merchants trading through the ports of [ShowSubContinentName('east_asia')] increasingly distinguish a harsher, darker bark known commonly as #italic cassia#!. Though lacking the delicate sweetness of true cinnamon, cassia is more plentiful, less costly, and well suited for preservation, cookery, and common trade. Some merchants in [target_nation.GetName] argue that widespread cassia imports may weaken the value of finer cinnamon, while others welcome the opportunity to satisfy Europe’s growing appetite for eastern spices at lower cost."
 spices_events.26.entry: "The Bark of Cathay"
 spices_events.26.historical_info: "Cassia refers to several related cinnamon species originating in China and Southeast Asia, particularly Cinnamomum cassia. European and Mediterranean civilizations had known cassia since antiquity through overland and maritime trade routes, often alongside true cinnamon from Sri Lanka. Prior to direct European expansion into Asia, distinctions between cassia and true cinnamon were inconsistent and frequently obscured by intermediaries in Arab and Indian Ocean trade networks. During the Age of Exploration, increasing contact with Asian producers and merchants allowed European traders to better distinguish between the rarer 'true cinnamon' of Ceylon and the more abundant cassia varieties traded throughout East and Southeast Asia."
 spices_events.26.a: "We'll make money nonetheless."

 spices_events.27.title: "Cargo from Cathay"
 spices_events.27.desc: "Among the wares unloaded from eastern vessels is a curious spice unlike any commonly traded in [ShowContinentName('europe')]: a small, star-shaped pod with a powerful aroma of licorice and sweet herbs. [chinese.GetName] merchants prize the spice greatly, claiming it flavors both medicine and cuisine throughout [ShowSubContinentName('east_asia')]. Though some [target_nation.GetAdjective] apothecaries are comparing its qualities to anise, the spice possesses a stronger fragrance and remarkable keeping properties during long voyages."
 spices_events.27.entry: "Cargo from Cathay"
 spices_events.27.historical_info: "Star anise (Illicium verum) is native to southern China and northern Vietnam, where it had long been used in regional cooking, medicine, and aromatic preparations. Although related in flavor to Mediterranean anise, it is botanically distinct and was largely unknown in Europe before expanding maritime trade with Asia during the early modern period. European merchants encountered star anise through direct trade with Chinese and Southeast Asian markets during the Age of Exploration. Its unusual shape, strong aroma, and medicinal reputation quickly made it a prized exotic curiosity among apothecaries and wealthy consumers."
 spices_events.27.a: "Even its shape appears fashioned by the heavens."
 spices_star_anise_found: "Star Anise Craze!"
 spices_star_anise_found_desc: "There is increased demand for Star Anise."

 spices_events.28.title: "The Black Pod"
 spices_events.28.desc: "Among the latest cargoes arriving from our voyages to [ShowRegionName('mesoamerica_region')] is a dark, slender pod unlike any spice known in [ShowContinentName('europe')]. Though plain in appearance, the pod releases a rich and pleasing fragrance when carefully prepared. It is extraordinary sweet, floral, and softer than the harsher spices of the Indies. [target_nation.GetAdjective] merchants claim the substance is prized in the lands where [cocoa.GetName] is consumed by many [aztec.GetName] nobles and warriors. Apothecaries, confectioners, and perfumers now compete for access to this rare [vanilla.GetName] believing it suitable for many things. Though supplies remain scarce and cultivation uncertain, sellers insist the strange black pod may soon rival the value of eastern spices among wealthy consumers."
 spices_events.28.entry: "The Black Pod"
 spices_events.28.historical_info: "Vanilla (Vanilla planifolia) originated in Mesoamerica and was cultivated long before European contact by indigenous peoples of the region. It later became associated with cacao beverages consumed by aristocratic elites in Central America. European merchants encountered vanilla during the early colonial period and quickly developed a taste for its rich aroma and flavor. Because the vanilla orchid depended upon specific pollinators native to the Americas, successful cultivation outside its homeland remained difficult for centuries, contributing greatly to its rarity and value in European markets."
 spices_events.28.a: "We must find a way to cultivate this new spice."
 spices_vanilla_found: "Vanilla Craze!"
 spices_vanilla_found_desc: "There is increased demand for Vanilla!."

 spices_events.29.title: "Edmond and the Vanilla Orchid"
 spices_events.29.desc: "For years, [target_nation.GetAdjective] botanists struggled to cultivate [vanilla.GetName] beyond its native lands in [ShowRegionName('mesoamerica_region')]. Though the vines flowered readily in tropical climates, their blossoms withered without bearing fruit, frustrating every attempt to establish profitable plantations abroad. Now, a breakthrough has emerged from an unlikely source. A young slave by the name of #italic Edmond Albius#! has demonstrated a simple method of hand-pollinating the delicate orchid blossoms, allowing vanilla to be cultivated far from its original homeland. What once depended upon rare insects and uncertain conditions may now be reproduced wherever suitable climates and labor can be found."
 spices_events.29.entry: "Edmond Albius and the Vanilla Orchid"
 spices_events.29.historical_info: "Vanilla cultivation long remained confined largely to Mesoamerica because the orchid depended upon specific native pollinators. In 1841, Edmond Albius, a young enslaved man on the island of Réunion, developed an efficient hand-pollination technique that revolutionized vanilla production. His discovery allowed vanilla cultivation to spread rapidly throughout the Indian Ocean, especially in Madagascar and Réunion, eventually transforming Madagascar into the world’s leading producer of vanilla. The technique became one of the most important agricultural innovations in the history of colonial cash-crop production."
 spices_events.29.a: "This is a remarkable discovery!"
 spices_events.29.b: "Spread the technique to nearby Madagascar."

 spices_events.30.title: "Pierre Poivre"
 spices_events.30.desc: "A retired [target_nation.GetAdjective] missionary, who was injured in service of the #italic Society of Foreign Missions#!, [pierre_poivre.GetName] has approached the French East India Company with a daring proposal. He wishes to set out with a trade expedition to [quang_yen.GetName]. Though lacking formal naval rank, Poivre possesses considerable knowledge of eastern commerce and an unusual fascination with the spices of the Indies."
 spices_events.30.entry: "Pierre Poivre"
 spices_events.30.historical_info: "Pierre Poivre was an 18th-century French botanist, explorer, and colonial administrator best known for breaking Dutch monopolies over valuable spices. During his voyages through Southeast Asia, Poivre secretly acquired nutmeg and clove plants from the Spice Islands and introduced them to French-controlled territories in the Indian Ocean, particularly Mauritius and Réunion. His efforts helped establish new centers of spice cultivation outside Dutch control and became an important episode in the global competition over botanical resources, colonial agriculture, and commercial monopolies."
 spices_events.30.a: "We should support his expedition."
 spices_events.30.b: "Let's employ this man at court."
 poivre_leaves_for_vietnam: "[pierre_poivre.GetName] travels to [quang_yen.GetName]."
 poivre_journey_tt: "Pierre Poivre is travelling in the Orient."

 spices_events.31.title: "Seeds of Empire"
 spices_events.31.desc: "For generations, the spice trade of the eastern seas has remained under the jealous protection of foreign monopolists. [cloves.GetName] and [nutmeg.GetName], which are worth fortunes in the markets of [ShowContinentName('europe')] are cultivated only upon a handful of guarded islands, where rival powers enforce strict control over every seedling and sapling. Now, however, [pierre_poivre.GetName] reports a remarkable success. Through secrecy, persuasion, and no small amount of deception, living spice plants have been secured and transported beyond the reach of their former masters. Experimental gardens on [mauritius.GetName] already show signs that the precious crops may survive transplantation."
 spices_events.31.entry: "Seeds of Empire"
 spices_events.31.a: "He's a genius!"

 spices_events.32.title: "Voyages d’un Philosophe"
 spices_events.32.desc: "Having withdrawn from colonial administration and long service in the Indies, [pierre_poivre.GetName] has published an account of his travels under the title #italic Voyages d’un philosophe#!. Blending observations on commerce, botany, empire, and the peoples of distant lands, the work has attracted considerable attention among [target_nation.GetAdjective] scholars, merchants, and reformers alike. Poivre writes not as a conqueror, but as a man convinced that knowledge and cultivation may enrich a nation more surely than conquest alone."
 spices_events.32.entry: "Voyages d’un Philosophe"
 spices_events.32.a: "A fascinating account of the indies."
 voyages_philosopher: "Voyages d’un Philosophe"
 voyages_philosopher_desc: "Voyages d’un Philosophe is a travelogue by the French botanist and explorer Pierre Poivre, detailing his journeys through Southeast Asia and his efforts to acquire valuable spice plants for cultivation in French territories. The book provides insights into the spice trade, colonial agriculture, and botanical exploration during the 18th century."

 spices_events.33.title: "Jean-Baptiste Labat"
 spices_events.33.desc: "After many years spent among the colonies of the western seas, the Dominican missionary [jean_labat.GetName] has returned to [ShowContinentName('europe')] bearing detailed accounts of plantation life, colonial commerce, fortifications, and the customs of distant islands. His writings, which are rich with observations on [sugar.GetName] cultivation, slavery, trade, and natural curiosities, have attracted wide interest among merchants, naval officers, and men of learning alike. Unlike many other missionaries, Labat writes with unusual attention to practical matters. He praises improvements in plantation management, advocates stronger colonial defenses, and speaks openly of the immense wealth flowing from the tropical colonies."
 spices_events.33.entry: "Jean-Baptiste Labat"
 spices_events.33.historical_info: "Jean-Baptiste Labat was a French Dominican missionary, engineer, writer, and colonial administrator active in the Caribbean during the late 17th and early 18th centuries. Best known for his Nouveau Voyage aux Isles de l’Amérique, Labat documented plantation economies, colonial society, military affairs, and agricultural practices in the French Caribbean. His writings became widely read in Europe and offered unusually detailed descriptions of colonial life and commerce during the height of the Atlantic plantation system. Labat also contributed to improvements in fortifications, sugar production, and colonial infrastructure."
 spices_events.33.a: "A learned, yet practical man."
 new_voyage: "Nouveau voyage aux iles de l'Amerique"
 new_voyage_desc: "Nouveau Voyage aux Isles de l’Amérique is a travelogue by the French Dominican missionary Jean-Baptiste Labat, detailing his experiences in the Caribbean and providing insights into plantation economies, colonial society, and natural history during the late 17th and early 18th centuries."

 spices_events.35.title: "Charles Plumier"
 spices_events.35.desc: "After years spent traveling through the colonies of the western seas, the Franciscan botanist [charles_plumier.GetName] has returned to [target_nation.GetName] bearing an astonishing collection of sketches, specimens, and observations gathered from the tropical Americas. His studies describe countless unfamiliar plants, fruits, and flowers previously unknown to European scholars. Physicians and natural philosophers marvel at the richness of the colonial flora, while merchants speculate that many of these exotic species may hold value in medicine, horticulture, or commerce."
 spices_events.35.entry: "Charles Plumier"
 spices_events.35.historical_info: "Charles Plumier was a 17th-century French botanist, missionary, and explorer renowned for his expeditions to the Caribbean and the Americas. Commissioned by the French Crown, Plumier documented hundreds of plant species and produced some of the finest botanical illustrations of his age. His work, including Nova Plantarum Americanarum Genera, greatly expanded European knowledge of American flora during the Scientific Revolution. Plumier also introduced and described numerous species unfamiliar to European science, including the plant later named Begonia. The genus Plumeria was named in his honor."
 spices_events.35.a: "A remarkable collection of botanical knowledge."
 nova_plantarum: "Nova Plantarum Americanarum Genera"
 nova_plantarum_desc: "Nova plantarum americanarum genera is a foundational botanical text published in 1703 by French botanist Charles Plumier. It introduced European science to hundreds of newly discovered plant genera from the Caribbean and the Americas."

 spices_events.36.title: "Antoine-Augustin Parmentier"
 spices_events.36.desc: "For generations, humble [potato.GetName] have been regarded with suspicion in many parts of [ShowContinentName('europe')], valued more as fodder than as food fit for respectable tables. Yet the pharmacist and agronomist [antoine_parmentier.GetName] insists that such prejudices are misplaced. After years of observation and experimentation, Parmentier argues that the potato possesses remarkable nutritional value and may serve as a reliable safeguard against famine. His publications and public demonstrations have attracted the attention of both scholars and statesmen."
 spices_events.36.entry: "Antoine-Augustin Parmentier"
 spices_events.36.historical_info: "Antoine-Augustin Parmentier was an 18th-century French pharmacist, nutritionist, and agricultural reformer. Best known for promoting the potato as a food crop, Parmentier challenged widespread European prejudices against its consumption. His work, including Examen chimique des pommes de terre (1773), helped demonstrate the nutritional value and practical advantages of potato cultivation. Through publications, public advocacy, and agricultural experiments, Parmentier contributed significantly to the acceptance of potatoes across Europe, where they would eventually become one of the continent’s most important staple crops."
 spices_events.36.a: "The potato is a worthy food for all."
 spices_events.36.b: "The potato is unfit for human consumption."
 examen_chimique: "Examen Chimique des Pommes de Terre"
 examen_chimique_desc: "Examen chimique des pommes de terre is a scientific treatise published in 1773 by Antoine-Augustin Parmentier, presenting chemical analyses of potatoes and advocating for their nutritional value and potential as a food crop in Europe."

 spices_events.37.title: "Francisco Hernández de Toledo"
 spices_events.37.desc: "For years, tales have reached the [target_nation.GetAdjective] court of strange herbs, unknown fruits, and remarkable remedies used by the peoples of [ShowContinentName('america')]. While many seek [gold.GetName] and [silver.GetName], some argue that knowledge itself may prove the greater treasure. Our royal physician, [francisco_toledo.GetName], has petitioned the [crown.GetName] for funding to survey the flora, fauna, and medicinal practices of our American possessions. The undertaking would be costly and offer little immediate profit, yet its findings may enrich medicine, agriculture, and natural philosophy throughout the realm."
 spices_events.37.entry: "Francisco Hernández de Toledo"
 spices_events.37.historical_info: "Francisco Hernández de Toledo was a Spanish physician, naturalist, and court doctor to Philip II of Spain. Educated in medicine during the height of the Spanish Renaissance, Hernández gained a reputation as a learned scholar with a keen interest in the natural world. In 1570, Philip II appointed him to lead a royal expedition to New Spain, making him one of the first scientists sent abroad by a European state specifically to study nature. During seven years in the Americas, Hernández traveled extensively, collecting specimens and recording the names, properties, and uses of thousands of plants and animals. He worked closely with Indigenous healers, physicians, and interpreters, documenting medicinal knowledge that was largely unknown in Europe."
 spices_events.37.a: "This is a worthy endeavor."
 spices_events.37.b: "Let him remain at court."
 f_hernandez: "Francisco Hernández"
 d_toledo: "de Toledo"
 francisco_leaves_spain: "Francisco Hernández travels to the New World."
 francisco_journey_tt: "Francisco Hernández is travelling in the Americas."

 spices_events.38.title: "Historia Natural de Nueva España"
 spices_events.38.desc: "After many years abroad, [francisco_toledo.GetName] has returned from [ShowContinentName('america')]. As expected, the physician arrives not with chests of [silver.GetName] or tales of conquest, but with wagonloads of manuscripts, drawings, dried specimens, and other curious objects he collected. His work describes hundreds of unfamiliar plants, animals, and medicines, many recorded with the assistance of local physicians and healers. Courtiers marvel at the strange illustrations, while scholars eagerly compete for access to the collection."
 spices_events.38.entry: "Historia Natural de Nueva España"
 spices_events.38.a: "Welcome home, Francisco."
 historia_natural: "Historia Natural de Nueva España"
 historia_natural_desc: "Historia Natural de Nueva España is a comprehensive natural history of New Spain, published in 1615 by Spanish physician Francisco Hernández."

 spices_events.39.title: "José de Acosta"
 spices_events.39.desc: "A Jesuit scholar who recently returned from [ShowContinentName('america')] has presented the [target_nation.GetAdjective] Crown with a remarkable treatise concerning the lands and peoples of the New World. Drawing upon years of observation in [ShowRegionName('mesoamerica_region')], [jose_acosta.GetName] challenges many long-held assumptions about geography, climate, nature, and the origins of the American peoples. His writings seek not merely to describe the Indies, but to explain them."
 spices_events.39.entry: "José de Acosta"
 spices_events.39.historical_info: "José de Acosta was a Spanish Jesuit, missionary, historian, and natural philosopher who spent nearly fifteen years in the Spanish Americas, particularly in Peru and Mexico. His experiences formed the basis of his most famous work, Historia natural y moral de las Indias, published in 1590. The book was among the first attempts to explain the natural environment, geography, and peoples of the Americas through direct observation rather than classical authority. Acosta discussed subjects ranging from high-altitude sickness in the Andes to climate, flora, fauna, and the origins of Indigenous peoples. Widely translated throughout Europe, it became one of the most influential works on the New World in the late sixteenth and early seventeenth centuries and helped shape European understanding of the Americas for generations."
 spices_events.39.a: "An interesting read."
 d_acosta: "de Acosta"
 historia_moral: "Historia Natural y Moral de las Indias"
 historia_moral_desc: "Historia Natural y Moral de las Indias is a comprehensive account of the natural history and cultures of the Americas, published in 1590 by Spanish Jesuit scholar José de Acosta."

 spices_events.40.title: "Georg Eberhard Rumphius"
 spices_events.40.desc: "For decades, a Company servant stationed in [ambon.GetName] has devoted himself to the study of the natural world. Through tropical storms, personal tragedy, and failing eyesight, [georg_rumpf.GetName] has continued to collect, classify, and describe the plants and animals of [ShowAreaName('moluccas_area')]. His great work, a comprehensive account of the flora of Ambon and the surrounding islands, now stands ready for publication."
 spices_events.40.entry: "Georg Eberhard Rumphius"
 spices_events.40.historical_info: "Georg Eberhard Rumphius was a naturalist employed by the Dutch East India Company on the island of Ambon in present-day Indonesia. Over several decades he compiled the Herbarium Amboinense, one of the most important botanical studies produced before the age of Linnaeus. Rumphius continued his work despite extraordinary hardships. He gradually lost his sight, his wife and daughter were killed in an earthquake and tsunami in 1674, and a fire later destroyed many of his manuscripts and illustrations. Undeterred, he reconstructed much of the work with the assistance of colleagues and local informants. The Herbarium Amboinense was eventually published after his death and became a foundational source for later botanists, including Carl Linnaeus. Rumphius is often regarded as one of the greatest naturalists of the early modern period and a pioneer of tropical botany."
 spices_events.40.a: "A fascinating figure."
 georg_eberhard: "Georg Eberhard"
 ambon_kruidboek: "Het Amboinsche kruidboek"
 ambon_kruidboek_desc: " The Herbarium Amboinense is a comprehensive botanical work by Georg Eberhard Rumphius, detailing the flora of the Ambon region in Indonesia. It was published posthumously and became an important reference for tropical botany."

 spices_events.41.title: "Hendrik Adriaan van Rheede"
 spices_events.41.desc: "The Governor of our possessions on in [ShowSubContinentName('south_asia')] has undertaken an unusual enterprise. Rather than concerning himself solely with trade and administration, [adriaan_rheede.GetName] has assembled physicians, scholars, artists, and local experts to document the plants of India. Years of labor have produced a vast collection of illustrations and descriptions he has named #italic Hortus Indicus Malabaricus#!, recording not only the appearance of countless species but also their medicinal and practical uses."
 spices_events.41.entry: "Hendrik Adriaan van Rheede"
 spices_events.41.historical_info: "Hendrik Adriaan van Rheede was a Dutch colonial administrator who served the Dutch East India Company in India. During his tenure on the Malabar Coast, he organized the creation of the Hortus Malabaricus, a twelve-volume encyclopedia of the region's plants. Published between 1678 and 1693, the work was produced through collaboration between European officials and local Indian physicians, scholars, and artists. It contained detailed descriptions and illustrations of hundreds of plant species, together with their names in local languages and information about their medicinal uses. The Hortus Malabaricus became one of the most important botanical works of the seventeenth century and was later used extensively by Carl Linnaeus when developing modern biological classification. It remains one of the earliest and most comprehensive scientific studies of the flora of South Asia."
 spices_events.41.a: "Magnificent work."
 h_adriaan: "Hendrik Adriaan"
 v_rheede: "van Rheede"
 hortus_indicus: "Hortus Indicus Malabaricus"
 hortus_indicus_desc: "Hortus Indicus Malabaricus is a monumental botanical work by Hendrik Adriaan van Rheede, documenting the flora of the Malabar region in India. It was published in 12 volumes between 1678 and 1693 and is renowned for its detailed descriptions and illustrations of Indian plants, many of which were previously unknown to European science."

 spices_events.42.title: "Joseph Banks"
 spices_events.42.desc: "Few men have done more to advance the study of nature than [joseph_banks.GetName]. Having traveled to distant lands and assembled one of the finest collections of natural specimens in [ShowContinentName('europe')], Banks has become a leading voice among the learned societies of [target_nation.GetName]. His influence extends far beyond his own observations, for new expeditions seek his advice, scientific institutions value his patronage, and statesmen increasingly look to natural philosophy as a source of national prestige and practical benefit."
 spices_events.42.entry: "Joseph Banks"
 spices_events.42.historical_info: "Joseph Banks was an English naturalist, botanist, and statesman of science. He first gained fame as the chief naturalist aboard HMS Endeavour, collecting thousands of specimens during the voyage of James Cook. His greatest influence, however, came after his return. As president of the Royal Society for over forty years, Banks became one of the central figures of Enlightenment science. He advised governments, sponsored expeditions, supported botanical gardens, encouraged the transfer of useful plants throughout the British Empire, and maintained correspondence with scholars across Europe and beyond. Unlike many scientists remembered for a single discovery, Banks is notable for building the institutions and networks that enabled scientific research on a global scale. By the time of his death, he was widely regarded as one of the most influential patrons of science in the world."
 spices_events.42.a: "A fine fellow!"

 spices_events.43.title: "Thomas Cavendish"
 spices_events.43.desc: "A young gentleman of considerable ambition has petitioned [target_nation.GetName] for support in a voyage beyond the known horizons of our realm. Inspired by recent maritime successes and eager to emulate the feats of the greatest navigators, [thomas_cavendish.GetName] proposes an expedition into distant seas in search of glory, profit, and opportunity. Though still largely unproven, Cavendish possesses wealth, determination, and a keen interest in navigation. Some at court dismiss him as an adventurer chasing fame, while others see in him the makings of a great explorer."
 spices_events.43.entry: "Thomas Cavendish"
 spices_events.43.historical_info: "Thomas Cavendish was an English navigator and privateer best known for completing the third circumnavigation of the globe and the second commanded from start to finish by a single expedition. Between 1586 and 1588 he led a voyage through the Strait of Magellan into the Pacific, where he raided Spanish possessions and captured the richly laden Manila galleon Santa Ana. Returning to England with substantial wealth and prestige, Cavendish became one of the most celebrated mariners of the Elizabethan age. Although his final expedition ended disastrously, his successful circumnavigation demonstrated the growing capability of English seafarers to operate on a global scale."
 spices_events.43.a: "Get this man a ship."
 spices_events.43.b: "Send him away."

 spices_events.44.title: "William Roxburgh"
 spices_events.44.desc: "For many years, the physician and natural philosopher [william_roxburgh.GetName] has devoted himself to the study of the plants of [ShowSubContinentName('south_asia')]. Through painstaking observation, careful illustration, and extensive correspondence with scholars abroad, he has assembled one of the most comprehensive records of the subcontinent's natural wealth ever produced. Though some in [target_nation.GetName] dismiss such endeavors as mere cataloguing, others argue that knowledge gathered today may yield benefits for generations to come."
 spices_events.44.entry: "William Roxburgh"
 spices_events.44.historical_info: "William Roxburgh was a Scottish surgeon, botanist, and one of the most important scientific figures in British India. Serving first with the East India Company and later as superintendent of the Calcutta Botanic Garden, Roxburgh devoted much of his career to documenting the flora of South Asia. He described hundreds of species, commissioned thousands of botanical illustrations, and laid the foundations for the scientific study of Indian plants. His most famous work, Flora Indica, was published posthumously and became a cornerstone of nineteenth-century botany. Roxburgh combined careful field observation with systematic classification, helping transform botany from a collection of curiosities into a rigorous scientific discipline. For this reason, he is widely remembered as the father of Indian Botany."

 spices_events.101.title: "Gingerbread Craze"
 spices_events.101.desc: "The locals of [target_location.GetName] have been enthralled by a baker's new take on gingerbread. What began as a curiosity sold from a single shop has quickly become the latest fashion, with long queues forming each morning and competitors from all over [target_nation.GetName] rushing to imitate the recipe. As a result prices for [ginger.GetName] are rising."
 spices_events.101.a: "I'd like to try some myself."

 spices_events.102.title: "Ginger Remedies"
 spices_events.102.desc: "Several [target_nation.GetAdjective] captains operating out of [target_location.GetName] have taken to carrying [ginger.GetName] aboard their vessels, claiming it helps settle the stomach during rough seas. Sailors who once dreaded long voyages now swear by the spice, and merchants have been quick to capitalize on the growing demand."
 spices_events.102.a: "Ginger? Who could've known."
 STATIC_MODIFIER_NAME_spices_ginger_remedies: "Ginger Remedies"
 STATIC_MODIFIER_DESC_spices_ginger_remedies: "The widespread use of ginger among the nation's sailors has improved morale and reduced the discomforts of life at sea."

 spices_events.103.title: "Clove Cigarettes"
 spices_events.103.desc: "[target_nation.GetAdjective] merchants returning from [ShowRegionName('indonesia_region')] have introduced an unusual habit to [target_location.GetName], namely mixing [cloves.GetName] with [tobacco.GetName] before smoking it. Though many dismissed the practice at first, the distinctive aroma has attracted a growing number of curious imitators. Demand for cloves has risen as the fashion spreads through the city's taverns and Coffee Houses."
 spices_events.103.a: "A curious practise."
 spices_cloves_needed: "Clove Craze!"
 spices_cloves_needed_desc: "Rising popularity of Cloves have increased demand."

 spices_events.104.title: "The Scent of Wealth"
 spices_events.104.desc: "Among the wealthy [target_nation.GetAdjective] households of [target_location.GetName], scented sachets filled with [cloves.GetName] have become the latest fashion. Carried on one's person or displayed within the home, the fragrant spice has come to be seen as a subtle mark of refinement and prosperity. Merchants report brisk sales as nobles compete to follow the trend."
 spices_events.104.a: "Fetch me some!"

 spices_events.105.title: "Sweet Perfumes"
 spices_events.105.desc: "Apothecaries in [target_location.GetName] have begun experimenting with extracts derived from [vanilla.GetName]. The spice's sweet and pleasant aroma has been concocted into fragrances that have proven especially popular among wealthy [target_nation.GetName] patrons, and demand has grown as the latest perfumes spread through fashionable circles."
 spices_events.105.a: "How sweet and pleasant."

 spices_events.106.title: "Vanilla Cream"
 spices_events.106.desc: "A confectioner in [target_location.GetName] has won acclaim for a series of desserts flavored with [vanilla.GetName]. The delicacies have become particularly fashionable among affluent [target_nation.GetName] households, whose enthusiasm has driven demand for the spice to new heights."
 spices_events.106.a: "Sublime!"

 spices_events.107.title: "A Golden Dye"
 spices_events.107.desc: "Preparations for an upcoming festival in [target_location.GetName] have led artisans to dye large banners, using [turmeric.GetName] as a dye. Though the color does not last, its brilliant golden hue has proven popular for banners, decorations, and ceremonial garments, driving up demand for the spice."
 spices_events.107.a: "Such vibrant colours!"

 spices_events.108.title: "Curious Apothecaries"
 spices_events.108.desc: "A number of [target_nation.GetAdjective] apothecaries have recently turned their attention to the alchemical properties of [turmeric.GetName], exchanging notes on its unusual properties and experimenting with entirely new preparations. Though few firm conclusions have been reached, their investigations have sparked considerable interest in the spice."
 spices_events.108.a: "Let's fund some research ourselves."
 spices_events.108.b: "What a waste of time."

 spices_events.109.title: "Cardamom Coffee"
 spices_events.109.desc: "An aromatic variation of [coffee.GetName] has become the latest topic of conversation in [target_location.GetName]. Infused with [cardamom.GetName], the beverage has proven especially popular among fashionable circles, whose enthusiasm has fueled national demand for the spice."
 spices_events.109.a: "Sounds delicious!"

 spices_events.110.title: "A Noble Delicacy"
 spices_events.110.desc: "What was once a rare luxury has become a fixture of noble life. [cardamom.GetName] now graces banquet tables, flavors confectioneries, perfumes fashionable salons, and appears in remedies prescribed by court physicians. Among the [target_nation.GetAdjective] elite, an appreciation for the exotic spice has become a mark of refinement and good taste, with many households competing to display the finest preparations."
 spices_events.110.a: "Let us indulge."

 spices_events.111.title: "Nutmeg Fortunes"
 spices_events.111.desc: "[target_nation.GetAdjective] merchants have returned with cargo holds filled with [nutmeg.GetName]. Recently sold at enormous profit, the venture has made them some of the wealthiest men in the realm almost overnight. Their lavish spending and newfound influence have attracted both admiration and suspicion. While some argue that his success demonstrates the opportunities of the spice trade, others warn that no private citizen should wield such wealth."
 spices_events.111.a: "I'm sure he doesn't mind sharing."
 spices_events.111.b: "Good for him!"

 spices_events.112.title: "False Nutmeg"
 spices_events.112.desc: "Inspectors in the [market.GetName] have discovered that a shipment advertised as premium [nutmeg.GetName] contains a mixture of inferior spices, bark, and ground seeds. Several [target_nation.GetAdjective] merchants insist the adulteration occurred before the cargo reached our shores, while others accuse local traders of knowingly deceiving customers. The affair has begun to undermine confidence in the spice trade."
 spices_events.112.a: "Let's compensate everyone."
 spices_events.112.b: "Tough luck."

 spices_events.113.title: "Pepper Fever"
 spices_events.113.desc: "Rumors of poor harvests and disrupted trade routes have spread rapidly through the markets. Merchants and nobles from all over [target_nation.GetName] have begun stockpiling [pepper.GetName], fearing that prices may soon rise beyond all reason. Warehouses are emptying, speculation is rampant, and some traders are already making fortunes from the panic. Local officials urge intervention before the situation spirals further out of control."
 spices_events.113.a: "Quickly! Stock the royal apothecary!"
 spices_pepper_needed: "Pepper Craze!"
 spices_pepper_needed_desc: "Rising popularity of Pepper have increased demand."

 spices_events.114.title: "The Pepper Tax"
 spices_events.114.desc: "Seeking new sources of revenue, local officials in [target_nation.GetName] have proposed a special levy upon the trade of [pepper.GetName]. Merchants protest that the tax will discourage commerce and encourage smuggling, while treasury officials insist that such a widely consumed commodity is too valuable to leave untaxed. The matter has quickly become a subject of heated debate in the markets."
 spices_events.114.a: "We could use more revenue streams."
 spices_events.114.b: "Tariffs? In this economy?"

 spices_events.115.title: "Exotic Aromas"
 spices_events.115.desc: "A shipment of [star_anise.GetName] recently arrived from the markets of [ShowSubContinentName('east_asia')]. Though unfamiliar to most of our people, its sweet fragrance has attracted considerable attention among perfumers, apothecaries, and wealthy households. Some [target_nation.GetAdjective] merchants claim demand is rising rapidly, while others dismiss it as yet another passing fascination with foreign curiosities."
 spices_events.115.a: "The Orient holds many treasures."

 spices_events.116.title: "Apothecary Curiosity"
 spices_events.116.desc: "A local apothecary in [target_location.GetName] has become fascinated by the unusual properties of [star_anise.GetName]. After experimenting with the spice in various tonics and remedies, he claims it possesses remarkable medicinal qualities. Though many learned physicians remain skeptical of such extravagant assertions, his shop has become a popular destination for curious customers seeking the latest eastern wonder in a hope to fix their ailments."
 spices_events.116.a: "He's not doing any harm."
 spices_events.116.b: "Nonsense. Shut it down."
 STATIC_MODIFIER_NAME_spices_star_health: "Star Anise health benefits"
 STATIC_MODIFIER_DESC_spices_star_health: "An Apothecary has found an exciting new tonic made with Star Anise."

 spices_events.117.title: "Cinnamon Pastries"
 spices_events.117.desc: "Bakers throughout [target_location.GetName] have begun experimenting with [cinnamon.GetName] in their pastries and sweet breads. What began as a novelty among wealthy patrons has quickly become fashionable among artisans and merchants alike. The warm aroma drifting from bakeries has drawn crowds to the markets. All of [target_nation.GetName] seems to be enthralled by the spice."
 spices_events.117.a: "Oh, those lovely scents."

 spices_events.118.title: "Winter Spice"
 spices_events.118.desc: "The approach of Christmastide has caused demand for [cinnamon.GetName] to surge throughout [target_nation.GetName]. [religion.GetAdjective] bakers, brewers, and noble households are all seeking greater quantities of the spice for their seasonal fare. Warehouses are filling quickly, while enterprising merchants hold back their stocks in hopes of profiting from the rising prices."
 spices_events.118.a: "Ah, the winter season."

 coffeehouse: "Coffee House"
 coffeehouse_desc: "Frequented by merchants, scholars, and officials, coffee houses have become centers of commerce, debate, and the exchange of information. News often travels as quickly as the coffee is served."
 teahouse: "Tea House"
 teahouse_desc: "Offering a refined setting for conversation and relaxation, tea houses attract merchants, scholars, and travelers alike. They provide a welcome respite from the bustle of everyday life."
 chocolate_house: "Chocolate House"
 chocolate_house_desc: "A fashionable establishment serving chocolate beverages and confections. Frequented by the wealthy and well-connected, chocolate houses became centers of elite social life, political discussion, and commercial networking during the age of colonial trade."
 tavern: "Tavern"
 tavern_desc: "A place of drink, gossip, and companionship, the tavern is the social heart of many communities. Rumors, fashions, and tales from distant lands are exchanged as freely as ale."
 inn: "Roadside Inn"
 inn_desc: "Providing food, lodging, and stabling for travelers, inns are vital waypoints along roads and trade routes. Merchants, pilgrims, and couriers bring news and stories from afar to those who pass through their doors."

 coffee_drinking_tradition_advance: "Coffee Drinking Culture"
 coffee_drinking_tradition_advance_desc: "riginating in the Arabian Peninsula, coffee Houses became centers of social life, commerce, scholarship, and political discussion. The widespread practice of drinking coffee fostered networks of communication, encouraged intellectual exchange, and provided gathering places that connected merchants, travelers, and local communities across the region."
 tea_drinking_tradition_advance: "Tea Drinking Culture"
 tea_drinking_tradition_advance_desc: "Tea has long served as a cornerstone of social and cultural life across Asia. From refined ceremonies to daily gatherings, the shared practice of drinking tea fostered hospitality, strengthened social bonds, and provided spaces for conversation, learning, and reflection. The spread of tea culture connected communities through trade and encouraged the exchange of ideas across vast distances."
 coffee_houses_advance: "Coffee Houses"
 coffee_houses_advance_desc: "Emerging across Europe's cities during the early modern period, coffee Houses became vibrant centers of commerce, news, and intellectual exchange. Merchants, scholars, officials, and travelers gathered to discuss politics, science, and trade, helping to spread new ideas and foster a more informed and connected society."
 chocolate_house_advance: "Chocolate Houses"
 chocolate_house_advance_desc: "Introduced from the Americas, chocolate quickly became a fashionable luxury among Europe's urban elite. Chocolate houses emerged as exclusive venues where nobles, merchants, and politicians gathered to socialize, conduct business, and discuss the affairs of the day. Their popularity helped stimulate trade networks and reinforced the growing culture of urban consumption."

 coffeehouse_maintenance: "Coffee Houses"
 teahouse_maintenance: "Tea Houses"
 tavern_wine_maintenance: "Inns & Taverns"
 tavern_beer_maintenance: "Inns & Taverns"
 chocolate_house_maintenance: "Chocolate Houses"

 spices_events.45.title: "Lloyd's Coffee House"
 spices_events.45.desc: "The [coffeehouse.GetName]s of [london.GetName] have become the talk of the city, but few are so well attended as that of Edward Lloyd. Merchants, seafarers, gentlemen, and scholars from all over [target_nation.GetName] gather there daily to exchange news and opinions from across the kingdom and beyond. Such places are increasingly regarded as indispensable forums for both trade and learning."
 spices_events.45.entry: "LLoyd's Coffee House"
 spices_events.45.historical_info: "Founded by Edward Lloyd around 1688, Lloyd's Coffee House became the foremost gathering place for those involved in maritime trade. Its reputation for trustworthy shipping news attracted merchants and underwriters, who negotiated insurance agreements for vessels and cargoes. Over time these activities evolved into Lloyd's of London, one of the world's most influential insurance markets and a cornerstone of modern maritime finance."
 spices_events.45.a: "Such a curiousity."
 spices_events.45.b: "No, I don't think so."
 spices_the_enlightenment: "The Enlightened Bourgeoisie"

 spices_events.46.title: "Jonathan's Coffee House"
 spices_events.46.desc: "Near the Royal Exchange, a certain [coffeehouse.GetName] has become a favored gathering place for brokers, merchants, and investors. Here, prices are called aloud, bargains struck, and fortunes won or lost on rumors from home and abroad. The growing trade in shares and securities has made the establishment one of the busiest corners of [london.GetName]'s commercial life."
 spices_events.46.entry: "Jonathan's Coffee House"
 spices_events.46.historical_info: "Jonathan's Coffee House emerged as a center for securities trading in the late seventeenth and early eighteenth centuries. Stockbrokers and merchants gathered there to buy and sell shares, particularly after restrictions on their activities elsewhere. The informal market that developed within its walls would eventually lead to the creation of the London Stock Exchange, one of the world's oldest and most influential financial institutions."

 spices_events.47.title: "The Grecian Coffee House"
 spices_events.47.desc: "In a quiet corner of [london.GetName], a [coffeehouse.GetName] has earned a reputation among London's learned men. There, scholars, clergymen, physicians, and gentlemen gather to debate matters of philosophy, science, and politics. New ideas travel quickly from table to table, and spirited discussion often continues long into the evening."
 spices_events.47.entry: "The Grecian Coffee House"
 spices_events.47.historical_info: "Established in 1702, the Grecian Coffee House became one of London's foremost intellectual gathering places. Its patrons included members of the Royal Society, lawyers, physicians, and scholars interested in the latest developments in science and philosophy. As coffee houses became centers of discussion and learning, establishments such as the Grecian played an important role in the spread of Enlightenment thought throughout Britain."

 spices_events.48.title: "Café Procope"
 spices_events.48.desc: "On the Left Bank of [paris.GetName], a newly fashionable [coffeehouse.GetName] has begun attracting an eclectic clientele. Writers, philosophers, lawyers, and gentlemen gather beneath its roof to exchange ideas, discuss current affairs, and debate the questions of the age. As its reputation grows, so too does its influence upon the intellectual life of the capital."
 spices_events.48.entry: "Café Procope"
 spices_events.48.historical_info: "Founded in 1686 by the Sicilian entrepreneur Francesco Procopio dei Coltelli, Café Procope became the most famous coffee house in France. It attracted many of the leading figures of the Enlightenment, including Voltaire, Rousseau, and Diderot. Through the discussions and publications associated with its patrons, the establishment became one of the principal centers of intellectual and literary life in eighteenth-century Europe."

 spices_events.49.title: "Café de Foy"
 spices_events.49.desc: "Situated beside the gardens of the Palais-Royal in [paris.GetName], Café de Foy has become a popular gathering place for Parisians eager for the latest news and gossip. Merchants, lawyers, officers, and men of letters mingle beneath its awnings, where public affairs are debated with a candor seldom found elsewhere. Few establishments better capture the mood of the capital."
 spices_events.49.entry: "Café de Foy"
 spices_events.49.historical_info: "Located in the Palais-Royal district of Paris, Café de Foy became one of the most politically active coffee houses in France. It is best remembered as the place where Camille Desmoulins called upon the crowd to take up arms on 12 July 1789, two days before the Storming of the Bastille. The café's prominence reflected the growing influence of public opinion and political discussion in the years preceding the French Revolution."

 spices_events.50.title: "Caffè Florian"
 spices_events.50.desc: "Beneath the arcades of Saint Mark's Square in [venice.GetName], a fashionable [coffeehouse.GetName] has become a favored meeting place for merchants, travelers, and men of culture. Visitors from every corner of [ShowContinentName('europe')] pass through its doors, bringing with them news, ideas, and stories from distant lands."
 spices_events.50.entry: "Caffè Florian"
 spices_events.50.historical_info: "Founded in 1720 by Floriano Francesconi, Caffè Florian is among the oldest coffeehouses in Europe. Situated in the heart of Venice, it attracted merchants, diplomats, artists, and visitors from across the continent. Its success reflected Venice's enduring role as a crossroads between Europe and the wider world."

 spices_events.51.title: "Zur Blauen Flasche"
 spices_events.51.desc: "An unusual beverage from the East has found a growing audience among the people of [vienna.GetName]. At a newly established [coffeehouse.GetName], merchants, officials, travelers, and scholars from all over [target_nation.GetName] gather to exchange news and conversation over steaming cups of the dark brew. What was once regarded as a foreign curiosity is rapidly becoming a fixture of urban life."
 spices_events.51.entry: "Zur Blauen Flasche"
 spices_events.51.historical_info: "Traditionally dated to 1685, Zur Blauen Flasche, The Blue Bottle, is often cited as Vienna's first coffeehouse. While the details of its founding remain the subject of debate, the establishment symbolizes the emergence of Vienna's celebrated coffeehouse culture. During the following centuries, Viennese coffeehouses became important centers of social, intellectual, and commercial life."

 spices_events.52.title: "White's Chocolate House"
 spices_events.52.desc: "A fashionable establishment serving the increasingly popular drink of chocolate has become a favored haunt of [london.GetName]'s [nobles.GetName]. Noblemen, courtiers, and wealthy gentlemen gather beneath its roof to wager, socialize, and discuss affairs of state. To be seen there is rapidly becoming a mark of status in the capital."
 spices_events.52.entry: "White's Chocolate House"
 spices_events.52.historical_info: "Founded in 1693, White's Chocolate House became one of London's most exclusive social venues. Renowned for gambling and aristocratic patronage, it eventually developed into White's, among the most prestigious gentlemen's clubs in Britain. Its clientele included leading politicians, nobles, and members of the royal family."

