l_english:
 cinnamon: "Cinnamon"
 cinnamon_desc: "Cinnamon is a fragrant spice made from the inner bark of trees native to South and Southeast Asia, traded since antiquity for its culinary and medicinal uses. Controlled for centuries by complex trade networks linking Asia, the Middle East, and Europe, it became one of the most coveted luxuries of the spice trade era."
 nutmeg: "Nutmeg"
 nutmeg_desc: "Nutmeg is a highly prized spice native to the Banda Islands of Indonesia, obtained from the seed of an evergreen tree alongside the related spice mace. Its rarity and demand made it one of the most profitable commodities of the early modern spice trade, driving fierce competition and colonial conflict among European powers."
 ginger: "Ginger"
 ginger_desc: "Ginger is a pungent root cultivated in tropical regions for thousands of years, valued both as a spice and a medicinal remedy. Its durability made it a major commodity in overland and maritime trade networks, spreading from Asia into the cuisines and pharmacopoeias of Europe, Africa, and the Middle East."
 cardamom: "Cardamom"
 cardamom_desc: "Cardamom is an aromatic spice made from the seeds of plants native to India and Southeast Asia, renowned for its intense fragrance and complex flavor. Traded widely through Middle Eastern and Indian Ocean markets, it was used in cooking, medicine, and perfumes, making it one of the most valuable spices by weight."
 turmeric: "Turmeric"
 turmeric_desc: "Turmeric is a bright yellow spice derived from the root of a tropical plant native to South Asia, long prized for its culinary, medicinal, and dyeing properties. Widely traded across Asia and the Indian Ocean, it became an important ingredient in regional cuisines and traditional remedies, while also serving as a valued coloring agent for textiles and foods."
 vanilla: "Vanilla"
 vanilla_desc: "Vanilla is a fragrant spice obtained from the cured pods of a tropical orchid first cultivated in Mesoamerica by Indigenous peoples. Following European contact with the Americas, vanilla became a highly prized export used in perfumes, medicines, and luxury foods, though its cultivation remained limited and labor-intensive for centuries."
 star_anise: "Star Anise"
 star_anise_desc: "Star Anise is a star-shaped spice native to southern China and Southeast Asia, valued for its strong licorice-like flavor and aromatic qualities. Traded extensively along Asian merchant routes, it was used in cooking, medicine, and perfumery, becoming a sought-after luxury in foreign markets."

