l_english:
 AHM: "Ahom Kingdom"
 AHM_ADJ: "Ahom"
 AHM_f: "Ahom Kingdom"
 AHM_f_desc: "Restore the Swargadeo's mandate over the Brahmaputra valley. Six centuries of Tai-Ahom rule held this corner of South Asia against every wave of invaders, repelling the Mughals seventeen times and binding hill, valley, and river under the Buranji court chronicles, the paik corvee system, and a religion that wove Tai animism into Saiva and Vaishnava devotion. The unconquered kingdom of Charaideo is reborn."
