l_english:
 SVB: "Suvarnabhumi"
 SVB_ADJ: "Suvarnabhumin"
 SVB_f: "Suvarnabhumi"
 SVB_f_desc: "Suvarnabhumi — the 'Land of Gold' of Buddhist sutras and stone inscriptions — is the mainland's own name for itself, the pan-Theravada empire that the Khmer cakkavatti, the Ayutthayan god-kings, the Toungoo conquerors, and the Lao mandala-lords all dreamed of in their turn. Forming Suvarnabhumi requires holding all four civilizational anchors of mainland Southeast Asia: Angkor's wat-temples, Ayutthaya's golden chedis, Bagan's stupa-strewn plain, and Vientiane's That Luang. Under one saffron-and-gold dharma-wheel banner, the four cultural cores of mainland Indochina answer to a single Buddhist universal monarch, fulfilling a vision that Bayinnaung briefly held and that fragmented at his death."
