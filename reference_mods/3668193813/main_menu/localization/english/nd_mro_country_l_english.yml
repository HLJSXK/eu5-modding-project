l_english:
 MRO: "Moro Sultanate"
 MRO_ADJ: "Moro"
 MRO_f: "Moro Sultanate"
 MRO_f_desc: "The Moro Sultanate is the unrealized pan-Islamic confederation of Mindanao and Sulu — the Sultan-Caliph to whom the rival sultanates of Sulu, Maguindanao, Lanao, and Buayan, the rajahs of Butuan, and the datus of Zamboanga and the Iranun coast all swore a single oath of fealty. Its warrior aristocracy carries the wavy-bladed kris and kalis; its vinta fleets, lateen-rigged and faster than any galleon, harry Spanish, Dutch, and English intruders from the Sulu Sea to the Visayas. Forming it requires unifying Mindanao under the Sunni faith and seating a single Caliph at Maimbung and Kuta Watu — the alternative to three centuries of colonial conquest the southern islands never accepted."
