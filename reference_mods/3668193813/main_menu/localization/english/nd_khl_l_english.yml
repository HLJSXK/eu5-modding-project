 nd_khl_bayt_al_hikmah_scholarship: "Translation Movement"
 nd_khl_bayt_al_hikmah_scholarship_desc: "Paper, binding cloth, and bound codices for the great translation academy."
 nd_khl_mint_maintenance: "Mint Operations"
 nd_khl_mint_maintenance_desc: "Silver bullion, copper alloy, and minting tools for the Caliphal coinage."
 nd_khl_madrasah_maintenance: "Madrasah Curriculum"
 nd_khl_madrasah_maintenance_desc: "Paper, scholar's cloth, and bound study texts for the universal madrasah."
 nd_khl_khanqah_maintenance: "Khanqah Hospitality"
 nd_khl_khanqah_maintenance_desc: "Cloth, grain, and wool for the Sufi lodge and its travelers."
