 # ============================================================
 # DESTINY EVENTS — titles, descriptions, options
 # ============================================================
 nd_khl.14.t: "The Universal Caliph Crowned"
 nd_khl.14.d: "The bay'ah is sworn before a million witnesses. From the steps of the Kaaba to the Topkapi gate, from the Qarawiyyin to the Lahore Fort, every qadi, sheikh, sayyid, sharif, and amir of the Sunni world places his hand on the Caliph's and pledges obedience. The Caliph is no longer one ruler among many; he is the Amir al-Mu'minin in fact, not merely in title. A new age begins."
 nd_khl.14.a: "May the Khilafah endure forever"

 nd_khl.15.t: "The Two Seas Are Ours"
 nd_khl.15.d: "The Caliphal admiral at Aden reports: the Bab al-Mandab is closed to all flags but the green. The Caliphal admiral at Hormuz reports: the Strait is patrolled by Khilafan dhows and warships, no Frankish ship passes without paying. The two gates of the monsoon are turned at last; the Indian Ocean is once more a Muslim sea."
 nd_khl.15.a: "Set sail for the Malabar"

 nd_khl.16.t: "The Spice Crescent"
 nd_khl.16.d: "Calicut and Goa stand under the Caliphal banner. The Zamorin sends gifts; the old Bahmani sultans pay tribute; the Portuguese Estado da India is reduced to a few coastal forts and a memory. The Malabar pepper, the Coromandel cotton, and the Bengali silk all flow now into Khilafan factor-houses. The Caliph's grand vizier presents two policies for the new commerce."
 nd_khl.16.a: "Cooperative trade with the monsoon powers"
 nd_khl.16.b: "Forceful monopoly: Caliphal goods only"

 nd_khl.17.t: "The Two Oceans Speak Arabic"
 nd_khl.17.d: "Mombasa, Malacca, Aceh. The Swahili coast, the Strait of Malacca, the northern tip of Sumatra. The Khilafah holds the entry and the exit and every island in between. From the Arabian Peninsula to the Spice Islands, no merchant moves but with a Caliphal pass; no fleet sails but with the green banner. The world's oceans are bilingual: Arabic and silence. What shall be the great work of this hour?"
 nd_khl.17.a: "An empire of universal commerce"
 nd_khl.17.b: "An empire of universal learning"

 nd_khl.18.t: "Rome and Vienna Fall"
 nd_khl.18.d: "The Pope flees toward Avignon; the Emperor retreats beyond the Alps. The minarets rise on the Seven Hills; the call to prayer echoes from the Stephansdom. The Latin Christendom that has resisted the Khilafah for nine centuries is broken at its capitals. The Caliphal armies march onward; the work is not yet done."
 nd_khl.18.a: "On to Paris and Madrid"

 nd_khl.19.t: "The Hammer Falls East and West"
 nd_khl.19.d: "Delhi is taken: the Khilafah rules the throne of Aurangzeb directly, no longer by Mughal proxy. Vijayanagar is broken: the great Hindu southern empire is reduced to ash. India answers to one Caliph. In the same hour, the last Aragonese and Castilian holdouts fall, and the Mediterranean is bracketed by Khilafan banners. The next campaign begins. Where shall the sword fall?"
 nd_khl.19.a: "The eastern jihad: India must be Islamic"
 nd_khl.19.b: "The western reconquest: Iberia and Italy must be Islamic"

 nd_khl.20.t: "The World Submits"
 nd_khl.20.d: "Paris, Venice, Madrid. The Capets, the Doge, the Habsburgs, all three thrones fall in a single decade. The Mediterranean is a Khilafan lake; the Atlantic coast is a Khilafan frontier; the Caliphal flag flies from Lisbon to Lahore. No power on earth resists. The grand vizier submits two memoranda for the new universal order."
 nd_khl.20.a: "The Khilafah perfects the universal sword"
 nd_khl.20.b: "The Khilafah perfects the universal state"

 # ============================================================
 # DESTINY TIMED MODIFIER NAMES AND DESCRIPTIONS
 # ============================================================
 STATIC_MODIFIER_NAME_nd_khl_dest_monsoon_compact: "The Monsoon Compact"
 STATIC_MODIFIER_DESC_nd_khl_dest_monsoon_compact: "The Caliphate trades with the monsoon powers as partners, not subjects. Khilafan factor-houses appear in Calicut, Cochin, Acheen, Brunei. Indian and Malay merchants are accepted in the Caliphal court; Arabic, Persian, and Tamil traders share warehouses; the Indian Ocean becomes a multinational Khilafan free trade zone."
 STATIC_MODIFIER_NAME_nd_khl_dest_pepper_monopoly: "The Pepper Monopoly"
 STATIC_MODIFIER_DESC_nd_khl_dest_pepper_monopoly: "Pepper, cloves, and nutmeg are reserved for the Caliphal pass. Foreign traders without Khilafan licenses are seized; the spice trade becomes a strict royal monopoly. The treasury fattens and the corsairs grow rich, but the diplomatic corps is reduced as foreign embassies depart in protest."

 STATIC_MODIFIER_NAME_nd_khl_dest_oceanic_civilization: "Oceanic Civilization"
 STATIC_MODIFIER_DESC_nd_khl_dest_oceanic_civilization: "The Khilafah is no longer a continental empire with a navy; it is a maritime civilization in its own right. Arabic-speaking trading communities flourish from Mombasa to Manila; Khilafan exploration fleets push out beyond the monsoon into the open Pacific; the spice routes are no longer routes but the spine of a hemispheric polity."
 STATIC_MODIFIER_NAME_nd_khl_dest_pan_islamic_university: "The Pan-Islamic University Network"
 STATIC_MODIFIER_DESC_nd_khl_dest_pan_islamic_university: "The Bayt al-Hikmah is no longer one library but a network: branch universities in Cordoba, Cairo, Baghdad, Bukhara, Lahore, and Aceh, all teaching the unified Khilafan curriculum, all sharing manuscripts via Caliphal couriers. The Christian and Hindu worlds resent the cultural dominance, but the Khilafah's scholars span continents."

 STATIC_MODIFIER_NAME_nd_khl_dest_hindu_jihad: "The Hindu Jihad"
 STATIC_MODIFIER_DESC_nd_khl_dest_hindu_jihad: "The eastern campaign continues. The Khilafan armies push beyond Delhi into the Deccan, the Ganges valley, and the southern coasts. The fortresses of the Hindu kingdoms fall one by one to the unified Khilafan siege train; the great temple cities of the south submit or are destroyed."
 STATIC_MODIFIER_NAME_nd_khl_dest_andalusi_reconquista: "The Andalusi Reconquista"
 STATIC_MODIFIER_DESC_nd_khl_dest_andalusi_reconquista: "The wound of 1492 is reversed. Granada is restored, then Toledo, then the Italian peninsula bends. The Christian crusader orders mount a final response, and the antagonism of the Latin world rises to its peak, but the Caliphal banners advance regardless."

 STATIC_MODIFIER_NAME_nd_khl_dest_universal_sword: "The Universal Sword"
 STATIC_MODIFIER_DESC_nd_khl_dest_universal_sword: "Heretic Christendom and heathen India both lie open to the Caliphal armies. The sipahi cavalry, the janissary corps, the Mughal artillery train, and the Andalusi reconquerors campaign in coordinated theaters. No power on earth fields a force that can stop them in open battle."
 STATIC_MODIFIER_NAME_nd_khl_dest_caliphal_imperium: "The Caliphal Imperium"
 STATIC_MODIFIER_DESC_nd_khl_dest_caliphal_imperium: "The conquered world is administered. Forts rise in every conquered province; the imperial road network reaches from Lisbon to Lahore; Caliphal diplomatic missions are dispatched to every remaining throne. The Khilafah is not just an army but a state, the world's first and only universal state."

 # ============================================================
 # DESTINY BUILDINGS
 # ============================================================
 nd_khl_bayt_al_hikmah_restored: "Bayt al-Hikmah Restored"
 nd_khl_bayt_al_hikmah_restored_desc: "The second House of Wisdom: a global institution of translation, library, observatory, and university combined. The first Bayt al-Hikmah was Baghdad's; this one is the world's. Manuscripts arrive from Mombasa and Malacca alongside those from Cordoba and Bukhara, all rendered into Arabic by a permanent staff of translators."
 nd_khl_caliphal_foundry: "Caliphal Imperial Foundry"
 nd_khl_caliphal_foundry_desc: "The universal armory of the Khilafah. Cannon foundries from Cairo, Edirne, Lahore, and Cordoba are unified into a single production system; standardized bombards, mortars, field guns, and matchlocks are cast to one specification and shipped to every Caliphal arsenal."

 # Maintenance PMs for destiny buildings
 nd_khl_bayt_al_hikmah_restored_scholarship: "Universal Translation"
 nd_khl_bayt_al_hikmah_restored_scholarship_desc: "Paper, bound books, manuscript cloth, and decorative gems for the global House of Wisdom."
 nd_khl_caliphal_foundry_maintenance: "Imperial Foundry Operations"
 nd_khl_caliphal_foundry_maintenance_desc: "Weaponry, firearms, tools, and iron stock for the Caliphal cannon and small arms production."

 # ===== BUREAUCRACIES =====
 khl_diwan_al_mazalim_bureaucracy: "Diwan al-Mazalim"
 khl_diwan_al_mazalim_bureaucracy_desc: "The Caliphal Court of Grievances, traced to Caliph Umar ibn al-Khattab (d. 644) and codified by al-Mawardi in the eleventh century. The Caliph or his wazir-mazalim sits in personal jurisdiction over wrongs the qadi courts cannot reach: oppressive governors, predatory tax-farmers, abuse of waqf endowments. Restored at universal scale, it is the supreme appellate authority over every emir and qadi in the ummah."
 khl_bayt_al_mal_bureaucracy: "Bayt al-Mal"
 khl_bayt_al_mal_bureaucracy_desc: "The Public Treasury of Islam, opened by Abu Bakr in Medina and made an empire-wide ledger by Caliph Umar's divan-registers. Zakat, jizya, kharaj, fay', and ghanima pool here and disburse as soldier-stipends, waqf endowments, and welfare to the poor. Restored as a single fiscal house spanning the whole ummah, with the qadi-clergy as the Caliph's revenue partners through zakat assessment."
 khl_pan_islamic_ulama_bureaucracy: "Pan-Islamic Ulama Council"
 khl_pan_islamic_ulama_bureaucracy_desc: "The unification of the four orthodox Sunni madhhabs -- Hanafi, Shafi'i, Maliki, Hanbali -- under joint Caliphal patronage, modeled on the Mamluk practice of seating a chief qadi from each madhhab and extended to imperial scale. Coordinated fatwas, harmonized procedure, and a transregional clerical training corps anchored on al-Azhar. The price of orthodox consolidation is paid by the dhimmi communities whose old legal pluralism narrows under sustained Sunni pressure."
 khl_hajj_caravan_bureaucracy: "Hajj Caravan Apparatus"
 khl_hajj_caravan_bureaucracy_desc: "The imperial organization of the universal pilgrimage. The mahmal procession, instituted by Sultan Baybars in 1266, sent the caliphal palanquin from Cairo to Mecca each Dhu al-Hijja; under a restored universal Caliphate the apparatus coordinates parallel caravans from Damascus, Constantinople, Cordoba, and Delhi, all converging on the Hijaz under armed escort. Spiritual legitimacy, transregional prestige, diplomatic reach, and a logistics spine threaded across the desert."
 khl_bayt_al_hikmah_bureaucracy: "Bayt al-Hikmah Network"
 khl_bayt_al_hikmah_bureaucracy_desc: "The universal-scale revival of the Abbasid House of Wisdom, founded under al-Ma'mun in Baghdad around 830. A federation of translation bureaus and observatories yokes the Toledo, Cordoba, Cairo, Damascus, Baghdad, Isfahan, and Samarkand academies into a single transregional scholarly apparatus. Greek, Sanskrit, Persian, and Latin works flow through a coordinated translation pipeline. The orthodox jurists who follow al-Ghazali in mistrusting falsafa as rationalist intrusion view the network with suspicion."

 # The auto-modifier governing slot grant on formation
 AUTO_MODIFIER_NAME_nd_khl_bureaucracy_authority: "Caliphal Authority"
 AUTO_MODIFIER_DESC_nd_khl_bureaucracy_authority: "On restoring the universal Caliphate, [KHL.GetName] gains the institutional authority to host the historical bureaucracies of the imperial Khilafah."
