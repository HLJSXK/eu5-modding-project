 # ============================================================
 # DESTINY TREE — advance names and descriptions
 # ============================================================
 nd_khl_destiny: "The Universal Caliph Crowned"
 nd_khl_destiny_desc: "The first khutba is read from a thousand minbars in the name of one Caliph. From al-Andalus to Sindh, the world recognizes a single sovereign of the believers. The path the Khilafah takes from this hour will shape every age that follows."

 nd_khl_dest_two_seas: "Mastery of the Two Seas"
 nd_khl_dest_two_seas_desc: "Secure both the Bab al-Mandab and the Strait of Hormuz. Aden and Hormuz are the gates of the monsoon trade; control of both means the Khilafah's flag commands every dhow from Sofala to Canton. The Caliphal treasury draws on the wealth of the Indian Ocean for the first time since the Fatimid sea routes."

 nd_khl_dest_spice_crescent: "The Spice Crescent"
 nd_khl_dest_spice_crescent_desc: "Hold Calicut and Goa, the Malabar entrepots, and bring the silk and pepper trades into Khilafan markets. The crescent of Indian Ocean ports stretching from Aden to Cochin becomes a single mercantile system, the spice trade an instrument of Caliphal policy."

 nd_khl_dest_two_oceans_caliphate: "The Caliphate of the Two Oceans"
 nd_khl_dest_two_oceans_caliphate_desc: "Take Mombasa, Malacca, and Aceh. The Khilafah's banner now flies on both shores of the Indian Ocean and at the gateway to the South China Sea. The Bayt al-Hikmah is rebuilt on a scale to match the empire: a global institution of learning that synthesizes the knowledge of three civilizations."

 nd_khl_dest_two_cities: "The Two Cities of the Franks"
 nd_khl_dest_two_cities_desc: "Conquer Rome and Vienna. The two great Frankish capitals fall to the Caliphal sword: the See of Saint Peter and the gate of central Europe. The Christian empires of the Latins are broken at their heart; jihad against Christendom is no longer a frontier action but a planetary fact."

 nd_khl_dest_hammer: "The Hammer of Christendom and India"
 nd_khl_dest_hammer_desc: "Hold Delhi and Vijayanagar. The Hindu Sultanate of Delhi is restored under direct Caliphal rule; the southern Hindu power of Vijayanagar is broken in turn. The subcontinent's ancient resistance to the Dar al-Islam ends. East and West fall to one hammer."

 nd_khl_dest_world_submits: "The World Submits"
 nd_khl_dest_world_submits_desc: "Take Paris, Venice, and Madrid. The three capitals of Frankish power, Capet, Doge, and Habsburg, fall to the Caliphal armies. The Imperial Foundry is built to commemorate the conquest: a universal armory casting the cannon of every conquest from Cordoba to Lahore to one specification."

