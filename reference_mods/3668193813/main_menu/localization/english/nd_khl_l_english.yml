l_english:
 # ============================================================
 # Formation event
 # ============================================================
 nd_khl.1.t: "The Universal Khilafah Restored"
 nd_khl.1.d: "After a millennium of dynastic fragmentation, the ummah is one again. Mecca, Medina, Cairo, Damascus, Baghdad, and the seats of the old Umayyad and Abbasid caliphates answer to a single throne. The black standard of the Prophet flies from al-Andalus to Sindh; the call to Friday prayer in every congregational mosque is offered in the name of one Caliph. This is not the work of any one dynasty, Umayyad, Abbasid, Fatimid, Almohad, Mamluk, or Ottoman, but the Rashidun ideal made flesh: the universal community of believers under one banner.\n\nThe ulama gather in council. The viziers wait at the gate of the diwan. The world holds its breath. What kind of Khilafah will rise from this restoration?\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_khl.1.a: "The Caliph in Mecca: restore the Rashidun ideal"
 nd_khl.1.b: "The Caliph in Baghdad: revive the Abbasid civilization"
 nd_khl.1.c: "The Sword and the Sultan: a militant gunpowder Khilafah"

 # ============================================================
 # Formation choice modifiers
 # ============================================================
 STATIC_MODIFIER_NAME_nd_khl_caliph_in_mecca: "The Caliph in Mecca"
 STATIC_MODIFIER_DESC_nd_khl_caliph_in_mecca: "The Caliph rules from the Haramayn, the Two Holy Mosques. Religious authority radiates outward from Mecca and Medina; the founding model of the Rashidun is restored. Sharia is the law, the ulama the only ministers that matter, and the ummah is converted by prestige and example as much as by sword."
 STATIC_MODIFIER_NAME_nd_khl_caliph_in_baghdad: "The Caliph in Baghdad"
 STATIC_MODIFIER_DESC_nd_khl_caliph_in_baghdad: "The Khilafah revives the Abbasid imperial civilization: a cosmopolitan synthesis of Arab, Persian, and Turkic learning. Bayt al-Hikmah is rebuilt, the great translation movement resumes, and the Khilafan court welcomes scholars of every faith. The Caliph governs the world from a city of ministries, libraries, and bazaars."
 STATIC_MODIFIER_NAME_nd_khl_sword_and_sultan: "The Sword and the Sultan"
 STATIC_MODIFIER_DESC_nd_khl_sword_and_sultan: "The Khilafah is the world's gunpowder empire. Cannons cast in Cairo, musketeers drilled in Edirne, slave-soldiers raised in Cordoba and the Caucasus march under one banner. The Caliph is warrior-imam: jihad against Christendom, Hindu India, and heterodox sects is permanent state policy."

 # ============================================================
 # DHE event modifiers
 # ============================================================
 STATIC_MODIFIER_NAME_nd_khl_translation_movement: "The Translation Movement"
 STATIC_MODIFIER_DESC_nd_khl_translation_movement: "Greek, Sanskrit, Persian, and Syriac texts are systematically rendered into Arabic. Hunayn ibn Ishaq's heirs work in the new Bayt al-Hikmah, and the science of three civilizations passes into a single language."
 STATIC_MODIFIER_NAME_nd_khl_falsafa_revival: "The Falsafa Revival"
 STATIC_MODIFIER_DESC_nd_khl_falsafa_revival: "Ibn Sina, al-Farabi, and Ibn Rushd are read again in every Khilafan court. Islamic philosophy reclaims its place between revelation and reason; the synthesis that produced Aquinas is renewed in its own homeland."

 STATIC_MODIFIER_NAME_nd_khl_amir_al_hajj: "The Amir al-Hajj"
 STATIC_MODIFIER_DESC_nd_khl_amir_al_hajj: "The annual pilgrimage caravan is now a state institution, commanded by the Amir al-Hajj appointed by the Caliph himself. To shelter the pilgrim is the Caliph's first duty after the defense of the faith."
 STATIC_MODIFIER_NAME_nd_khl_zubayda_road: "The Darb Zubayda"
 STATIC_MODIFIER_DESC_nd_khl_zubayda_road: "Wells, cisterns, caravanserais, and waystations stretch from Kufa to Mecca, named for Zubayda bint Ja'far, granddaughter of Caliph al-Mansur. The pilgrim road is also a trade road, and the trade road is also a road of state."

 STATIC_MODIFIER_NAME_nd_khl_baghdad_reborn: "Baghdad Reborn"
 STATIC_MODIFIER_DESC_nd_khl_baghdad_reborn: "The horror of 1258, when Hulegu's Mongols sacked Baghdad and threw the libraries of the Caliphs into the Tigris, is reversed at last. The City of Peace is rebuilt; the Round City is replanned; the Tigris reflects domes and minarets again."
 STATIC_MODIFIER_NAME_nd_khl_dar_al_islam_unbroken: "Dar al-Islam Unbroken"
 STATIC_MODIFIER_DESC_nd_khl_dar_al_islam_unbroken: "The fragmentation of the post-Mongol world is healed. Every Sunni community, from Granada to the Indus, knows it stands within a single Dar al-Islam, defended by a single Caliph."

 STATIC_MODIFIER_NAME_nd_khl_ulama_concord: "The Concord of the Ulama"
 STATIC_MODIFIER_DESC_nd_khl_ulama_concord: "The four Sunni madhhabs: Hanafi, Shafi'i, Maliki, and Hanbali, confer in council under the Caliph's patronage. Differences remain, but the schools recognize one another and one supreme authority above them all."
 STATIC_MODIFIER_NAME_nd_khl_madhhab_synthesis: "The Madhhab Synthesis"
 STATIC_MODIFIER_DESC_nd_khl_madhhab_synthesis: "A new generation of jurists trained in all four madhhabs reasons across them, producing a synthetic fiqh suitable for an empire that spans Berber, Arab, Persian, Turkic, and Indian Muslims."

 STATIC_MODIFIER_NAME_nd_khl_caliphal_guard: "The Caliphal Ghulam Guard"
 STATIC_MODIFIER_DESC_nd_khl_caliphal_guard: "Slave-soldiers raised from childhood in the Caliph's household form an elite mounted guard, devoted only to the throne. Their loyalty is to the Caliph alone, not to any tribe, dynasty, or province."
 STATIC_MODIFIER_NAME_nd_khl_ghulam_governors: "Ghulam Governors"
 STATIC_MODIFIER_DESC_nd_khl_ghulam_governors: "The most able ghulam are sent out as provincial commanders and governors. They have no local kin to favor, no native hereditary claim, only their oath to the Caliph who raised them."

 STATIC_MODIFIER_NAME_nd_khl_caliphal_artillery: "The Caliphal Artillery Park"
 STATIC_MODIFIER_DESC_nd_khl_caliphal_artillery: "Great siege bombards cast in Cairo, mortars in Edirne, and field guns from the foundries of Constantinople move under one Caliphal command. No fortress in the world is beyond reach."
 STATIC_MODIFIER_NAME_nd_khl_jihad_of_the_gun: "The Jihad of the Gun"
 STATIC_MODIFIER_DESC_nd_khl_jihad_of_the_gun: "Janissary corps, Mamluk arquebusiers, and Mughal matchlockmen are unified into a single doctrine: the gunpowder jihad. The Khilafah's enemies face concentrated firepower under religious motivation."

 STATIC_MODIFIER_NAME_nd_khl_indian_ocean_supremacy: "Indian Ocean Supremacy"
 STATIC_MODIFIER_DESC_nd_khl_indian_ocean_supremacy: "From Aden to Calicut, from Mombasa to Malacca, the Caliphal banner rules the monsoon trade. The Portuguese intrusion is rolled back; the spice trade flows once more under Khilafan protection."
 STATIC_MODIFIER_NAME_nd_khl_mediterranean_thalassocracy: "Mediterranean Thalassocracy"
 STATIC_MODIFIER_DESC_nd_khl_mediterranean_thalassocracy: "The fleet at Alexandria, the dockyards of the Golden Horn, and the corsair captains of the Maghreb answer to one Kapudan Pasha. The Mediterranean becomes a Khilafan lake."

 STATIC_MODIFIER_NAME_nd_khl_quranic_press: "The Qur'anic Press"
 STATIC_MODIFIER_DESC_nd_khl_quranic_press: "Arabic typesetting, long resisted by calligraphers, is finally mastered. Printed Qur'ans, hadith collections, and devotional manuals reach every village mosque."
 STATIC_MODIFIER_NAME_nd_khl_scientific_press: "The Scientific Press"
 STATIC_MODIFIER_DESC_nd_khl_scientific_press: "Treatises on astronomy, medicine, mathematics, and law come off Khilafan presses by the thousand. Scientific knowledge propagates faster than ever in Islamic history."

 STATIC_MODIFIER_NAME_nd_khl_sober_sufism: "The Sober Path"
 STATIC_MODIFIER_DESC_nd_khl_sober_sufism: "The Naqshbandi and Qadiriyya orders win Caliphal favor: their sober, scholarly Sufism reinforces orthodoxy rather than challenging it. Mystical devotion strengthens the state."
 STATIC_MODIFIER_NAME_nd_khl_ecstatic_sufism: "The Ecstatic Path"
 STATIC_MODIFIER_DESC_nd_khl_ecstatic_sufism: "The Mevlevi, Bektashi, and Chishti orders flourish under Caliphal patronage. Music, poetry, and dance become tools of universal Islamic conversion across cultural lines."

 STATIC_MODIFIER_NAME_nd_khl_central_diwan: "The Central Diwan"
 STATIC_MODIFIER_DESC_nd_khl_central_diwan: "Tax registers from Lisbon to Lahore are unified. The Caliphal diwan keeps a single ledger for the whole world, and from that ledger the world is governed."
 STATIC_MODIFIER_NAME_nd_khl_provincial_timariots: "Provincial Timariots"
 STATIC_MODIFIER_DESC_nd_khl_provincial_timariots: "Sipahi cavalry, iqta-holders, and Mamluk land-grantees are unified under a single tenure system: serve the Caliph in war, hold land in return. Provincial cavalry levies multiply across the empire."

 STATIC_MODIFIER_NAME_nd_khl_silver_dirham_standard: "The Silver Dirham Standard"
 STATIC_MODIFIER_DESC_nd_khl_silver_dirham_standard: "A single weight of silver, struck in mints from Cordoba to Bukhara, is accepted in every market of the Khilafah. Currency manipulation by local rulers ends; the Caliphal dirham is the world's standard."
 STATIC_MODIFIER_NAME_nd_khl_caliphal_mints: "The Caliphal Mints"
 STATIC_MODIFIER_DESC_nd_khl_caliphal_mints: "Silver from the Hindu Kush, Anatolia, and the Sahel flows into Caliphal mints; gold from West Africa and Egypt is struck into the Khilafan dinar. The treasury overflows."

 STATIC_MODIFIER_NAME_nd_khl_modernist_reform: "The Caliphal Tanzimat"
 STATIC_MODIFIER_DESC_nd_khl_modernist_reform: "Codified law, conscript armies, salaried officials, technical schools, telegraphs, and railways: the Khilafah modernizes from above, drawing on European models without surrendering Islamic identity."
 STATIC_MODIFIER_NAME_nd_khl_salafi_revival: "The Salafi Revival"
 STATIC_MODIFIER_DESC_nd_khl_salafi_revival: "A return to the way of the salaf al-salih, the pious ancestors. The accretions of centuries are stripped away; a leaner, harder, more militant Sunni orthodoxy emerges, rejecting both Sufi heterodoxy and European reform."

 # ============================================================
 # Advance event titles and descriptions
 # ============================================================
 nd_khl.2.t: "The House of Wisdom Reopens"
 nd_khl.2.d: "Two centuries after Hulegu's Mongols hurled the books of Bayt al-Hikmah into the Tigris, a new House of Wisdom rises in Baghdad's restored quarter. Translators in Greek, Syriac, Persian, and Sanskrit work alongside Arab philosophers; al-Ma'mun's old vision is renewed. Already manuscripts of Galen, Aristotle, and Aryabhata are circulating again, copied in elegant naskh in dozens of madrasahs from Fez to Samarkand. The Caliph stands beside the chief translator and asks: what kind of knowledge shall we honor first?"
 nd_khl.2.a: "Translate every science of the world"
 nd_khl.2.b: "Restore the philosophical tradition"

 nd_khl.3.t: "The Caliphal Hajj"
 nd_khl.3.d: "Until now, three pilgrim caravans converged on Mecca every year, one from Damascus, one from Cairo, and one from Baghdad, each commanded by a different ruler's officer, each protected by different Bedouin tribes paid different bribes. The new Caliphal decree changes that. From now on, a single Amir al-Hajj, appointed by the Caliph and reporting to no one else, commands all pilgrim caravans. The wells of the Darb Zubayda are repaired; the forts of the Syrian road are regarrisoned; the great Cairo caravan is reorganized. How shall the Caliph project this new institution?"
 nd_khl.3.a: "Make the hajj caravan a march of state"
 nd_khl.3.b: "Make the pilgrim road a trade road"

 nd_khl.4.t: "Baghdad Rises Again"
 nd_khl.4.d: "On the banks of the Tigris, masons lay the foundations of a new caliphal palace where the Round City of al-Mansur once stood. The new madrasahs go up next: the Mustansiriyya is rebuilt, then the Nizamiyya. Engineers restore the irrigation canals the Mongols broke. The trauma of 1258, when the Tigris ran black with the ink of drowned books and red with the blood of the last Abbasid Caliph, is finally being healed by ordinary craftsmanship. Where shall the Khilafah's effort be focused?"
 nd_khl.4.a: "Rebuild Baghdad as the world's greatest city"
 nd_khl.4.b: "Restore every ruined province of the ummah"

 nd_khl.5.t: "The Council of the Ulama"
 nd_khl.5.d: "For the first time since the early Abbasids, the chief jurists of the four Sunni madhhabs sit in council together. The Hanafi mufti of Constantinople, the Shafi'i sheikh of al-Azhar, the Maliki imam of the Qarawiyyin, and the Hanbali alim of Mecca debate the boundaries of what is permitted, what is forbidden, and what is left to discretion. The Caliph presides but does not vote. What shall come of this synod?"
 nd_khl.5.a: "Affirm orthodoxy through unity"
 nd_khl.5.b: "Forge a new universal jurisprudence"

 nd_khl.6.t: "The Caliphal Ghulam"
 nd_khl.6.d: "The slave-soldier system, once the curse of the late Abbasids when ghilman became kingmakers in Samarra, is now the Khilafah's most reliable institution. Boys from the Caucasus, the Sudan, and the Balkans are bought, converted, schooled, drilled, and bound to the Caliph alone. They have no kin to favor and no homeland to flee to. As the corps grows, the Caliph must decide what work it shall do."
 nd_khl.6.a: "Deploy the ghulam as the Caliph's guard"
 nd_khl.6.b: "Send the best as provincial governors"

 nd_khl.7.t: "The Gunpowder Caliphate"
 nd_khl.7.d: "Mehmed's bombards once felled the walls of Constantinople. Selim's musketeers swept the Mamluks at Marj Dabiq. Babur's gunners broke the Lodis at Panipat. Now those traditions, Ottoman, Mamluk, Mughal, all bend the knee to one Caliph and merge into one doctrine of war. The Topkapi master gunners drill in Aleppo; the Mughal arquebusiers train in Cairo; the foundries of Edirne, Alexandria, and Lahore cast cannon to a single specification. How shall the new doctrine be applied?"
 nd_khl.7.a: "The Caliphal artillery train"
 nd_khl.7.b: "The musket-armed jihad"

 nd_khl.8.t: "Two Oceans, One Banner"
 nd_khl.8.d: "The fleet at Alexandria carries the green Caliphal banner; so does the dockyard at Suez, the squadron at Aden, the patrol at Hormuz, the corsair fleet of the Maghreb, and the Ottoman Kapudan-i Derya's ships of the line. For the first time since the Fatimids, the Indian Ocean and the Mediterranean are commanded together. The Portuguese intrusion can be answered with a coordinated reply. Where shall the Khilafah strike first?"
 nd_khl.8.a: "Drive the Franks from the Indian Ocean"
 nd_khl.8.b: "Master the Mediterranean as a Khilafan lake"

 nd_khl.9.t: "Arabic Type"
 nd_khl.9.d: "After two centuries of resistance from the calligraphers' guilds, the first Arabic-script printing press is licensed in Constantinople, then Cairo, then Baghdad, then Cordoba. The technical problem of cursive Arabic, with its letters changing shape by position, has at last been solved by Khilafan typographers. Books that once cost a year's wages now cost weeks. The Caliph must decide what shall flow first from the new presses."
 nd_khl.9.a: "Print the Qur'an for every village mosque"
 nd_khl.9.b: "Print the sciences for every madrasah"

 nd_khl.10.t: "The Tariqas Unite"
 nd_khl.10.d: "Until this council, every Sufi order, the Naqshbandi, the Qadiriyya, the Mevlevi, the Bektashi, the Chishti, the Shadhili, has answered to its own silsila of masters and disciples, sometimes orthodox, sometimes heterodox, often both. Now the chief sheikhs of the great orders gather under Caliphal patronage. The Caliph proposes: there is no one Sufi path, but there is one Khilafah, and every order shall serve it. The orders accept. The question is which Sufism shall flourish."
 nd_khl.10.a: "Patronize the sober and orthodox orders"
 nd_khl.10.b: "Patronize the ecstatic and converting orders"

 nd_khl.11.t: "The Universal Diwan"
 nd_khl.11.d: "The Abbasid iqta, the Mamluk iqta, the Seljuk-Ottoman timar, the Mughal jagir, all four were the same idea in different languages: a soldier holds land from the state and serves the state in war. The Khilafan grand vizier proposes that they be unified, codified, and rationalized into a single tenure system, manageable from a single ledger in the Central Diwan. The reform faces resistance from established holders. How shall it be implemented?"
 nd_khl.11.a: "Centralize tax assessment in the Diwan"
 nd_khl.11.b: "Empower local timariots in return for service"

 nd_khl.12.t: "The Khilafan Dirham"
 nd_khl.12.d: "Since the days of Abd al-Malik, the dirham has been the silver currency of the Islamic world, and since the day after that, every local ruler has debased it for his own benefit. The Khilafan reform forbids local minting, fixes the dirham's weight and silver content by Caliphal decree, and stamps the new coins from a few central mints under direct supervision. Merchants from Granada to Bengal will trust this coinage. What is the Khilafah's monetary policy?"
 nd_khl.12.a: "A pure silver standard, Caliphal coinage only"
 nd_khl.12.b: "Open the Caliphal mints, increase the supply"

 nd_khl.13.t: "The Caliphal Tanzimat"
 nd_khl.13.d: "European steam ships dock at Khilafan ports. European telegraph lines reach Khilafan capitals. European armies, smaller than the Caliph's by a factor of ten, defeat his frontier forces by drill and rifled musket. Reform is no longer optional. The grand vizier presents two memoranda: one calling for codified law, conscript armies, technical schools, salaried officials, and an industrial economy; the other calling for a return to the way of the salaf, a stripping-away of accretions, a militant orthodox revival. The Caliph hears both and must choose."
 nd_khl.13.a: "Modernize from above; adopt what works"
 nd_khl.13.b: "Return to the way of the pious ancestors"

 # ============================================================
 # Advances
 # ============================================================
 nd_khl_mujahid_levy: "Mujahid Volunteers"
 nd_khl_mujahid_levy_desc: "The volunteer fighter who answers the Caliph's call to defend the Dar al-Islam, drawn from across the ummah without regard to tribe or land."
 nd_khl_ribat_network: "The Ribat Network"
 nd_khl_ribat_network_desc: "The frontier garrison-monastery, half fortress and half retreat, holds the marches of the Khilafah. From Aghlabid Tunisia to the Khorasan border, the ribats of the ummah are now a single defensive system."
 nd_khl_hajj_logistics: "Hajj Logistics"
 nd_khl_hajj_logistics_desc: "The annual pilgrimage to Mecca is codified as a permanent state institution. The Amir al-Hajj commands; the Caliphal treasury underwrites; the wells, forts, and waystations of the Darb Zubayda and the Syrian road are maintained by Caliphal decree."
 nd_khl_grand_jami: "The Grand Jami Mosque"
 nd_khl_grand_jami_desc: "The Friday-prayer congregational mosque is the visible center of every Khilafan city. From the Umayyad Mosque of Damascus to the Great Mosque of Cordoba, the Khilafah's great jami define the urban fabric of the Islamic world."
 nd_khl_caliphal_diwan: "The Caliphal Diwan"
 nd_khl_caliphal_diwan_desc: "The Abbasid bureaucratic apparatus, the diwan al-rasa'il, diwan al-jund, diwan al-kharaj, is restored as the spine of the universal state. Trained scribes administer in standardized Arabic from a single chancery."
 nd_khl_universal_sharia: "Universal Sharia"
 nd_khl_universal_sharia_desc: "The four Sunni madhhabs, Hanafi, Shafi'i, Maliki, Hanbali, are recognized as one jurisprudence applied across the empire. Where they differ, qadis apply the local madhhab; where they agree, the law is universal."

 nd_khl_bayt_al_hikmah: "Bayt al-Hikmah Restored"
 nd_khl_bayt_al_hikmah_desc: "Al-Ma'mun's House of Wisdom, the great translation academy that rendered Greek, Sanskrit, and Persian science into Arabic, is rebuilt in Baghdad. Hunayn ibn Ishaq's heirs work in restored chambers; the manuscripts the Mongols destroyed are recopied from surviving exemplars in Cordoba, Cairo, and Bukhara."
 nd_khl_ghulam_corps: "The Ghulam Corps"
 nd_khl_ghulam_corps_desc: "The slave-soldier mounted guard, perfected under al-Mu'tasim and refined by every Islamic dynasty since, is the Caliph's personal cavalry. The ghulam answer to the throne alone, not to tribe or province."
 nd_khl_caliphal_galley: "The Caliphal Galley"
 nd_khl_caliphal_galley_desc: "The Mediterranean fleets of Cordoba, Tunis, Alexandria, and Constantinople are unified into a single Caliphal navy. The Levantine, Maghrebi, and Andalusi shipbuilding traditions cross-fertilize."
 nd_khl_caliphal_dirham: "The Caliphal Dirham"
 nd_khl_caliphal_dirham_desc: "Abd al-Malik's silver dirham of 696 is restored as the universal coinage. Local minting is regulated; weights are standardized; the Khilafan dirham becomes the world's reserve currency."
 nd_khl_universal_madrasah: "The Universal Madrasah"
 nd_khl_universal_madrasah_desc: "The Nizamiyya, the Mustansiriyya, al-Azhar, the Qarawiyyin, the great madrasahs of Bukhara and Samarkand and Cordoba teach a unified Khilafan curriculum. A scholar trained in Fez can teach in Lahore."
 nd_khl_tariqa_unification: "The Tariqas Unified"
 nd_khl_tariqa_unification_desc: "The Sufi orders, Naqshbandi, Qadiriyya, Mevlevi, Bektashi, Chishti, Shadhili, are brought under Caliphal patronage. The Caliph endorses no single tariqa, but every order accepts him as Amir al-Mu'minin."

 nd_khl_post_mongol_restoration: "Post-Mongol Restoration"
 nd_khl_post_mongol_restoration_desc: "The damage of the Mongol century, sacked cities, ruined irrigation, lost manuscripts, decimated populations, is systematically repaired. The Khilafah's engineers and bureaucrats undo what Hulegu, Timur, and the Black Death together had wrought."
 nd_khl_gunpowder_caliphate: "The Gunpowder Caliphate"
 nd_khl_gunpowder_caliphate_desc: "Ottoman bombards, Mamluk arquebuses, and Mughal matchlocks are fused into a single Khilafan doctrine of gunpowder warfare. The Caliphal foundries cast cannon by a single specification from Cairo to Lahore."
 nd_khl_universal_iqta: "Universal Iqta"
 nd_khl_universal_iqta_desc: "The land-grant systems of the Abbasids (iqta), Mamluks (iqta), Seljuks-Ottomans (timar), and Mughals (jagir) are unified into a single tenure: hold land for service, lose land for failure to serve."
 nd_khl_two_oceans_fleet: "The Two Oceans Fleet"
 nd_khl_two_oceans_fleet_desc: "The Mediterranean fleet at Constantinople and Alexandria and the Indian Ocean fleet at Suez and Aden are placed under unified Caliphal command. From Gibraltar to Malacca, one Kapudan Pasha commands."
 nd_khl_arabic_press: "The Arabic Printing Press"
 nd_khl_arabic_press_desc: "The technical problem of cursive Arabic typesetting is at last solved. Printed Qur'ans, hadith collections, legal manuals, and scientific treatises spread literacy at unprecedented speed."
 nd_khl_caliphal_corsairs: "Caliphal Corsairs"
 nd_khl_caliphal_corsairs_desc: "The Barbary corsairs, the Levantine privateers, and the Adeni raiders all sail under Caliphal letters of marque. The Khilafah's enemies cannot move a merchantman without paying."
 nd_khl_sharif_legitimacy: "Sharif Legitimacy"
 nd_khl_sharif_legitimacy_desc: "The Caliph's descent from the Prophet's family is publicly affirmed by every Sharif in Mecca, Medina, and Hadramawt. The legitimacy of the Khilafah is bound to the bloodline of the Prophet himself."

 nd_khl_caliphal_corps: "The Caliphal Slave Corps"
 nd_khl_caliphal_corps_desc: "The janissary system of the Ottomans, the Mamluk Bahri and Burji, the Persian ghulam: all are absorbed into a single Caliphal slave-corps numbering tens of thousands. They are the world's first standing professional army."
 nd_khl_tofangchi: "The Tofangchi Corps"
 nd_khl_tofangchi_desc: "The Persian-Mughal tofangchi musketeer is unified with the Mamluk arquebusier and the Ottoman tüfekçi into a single Caliphal light infantry tradition: matchlock and discipline."
 nd_khl_oceanic_galleon: "The Oceanic Galleon"
 nd_khl_oceanic_galleon_desc: "Combining Indian Ocean dhow rigging with Iberian galleon construction, the Khilafan oceanic galleon carries Caliphal trade and Caliphal arms across both oceans."
 nd_khl_universal_court: "The Universal Court"
 nd_khl_universal_court_desc: "The Abbasid divani court of Baghdad, the Topkapi protocol of the Ottomans, the Mughal darbar, all are absorbed into a single Khilafan court ceremonial, projecting universal sovereignty."
 nd_khl_pan_sunni_authority: "Pan-Sunni Authority"
 nd_khl_pan_sunni_authority_desc: "The Caliph is recognized as imam of all four Sunni madhhabs simultaneously. His Friday khutba is read in every congregational mosque from Granada to Sumatra."
 nd_khl_imperial_integration: "Imperial Integration"
 nd_khl_imperial_integration_desc: "Berber, Arab, Egyptian, Levantine, Anatolian, Persian, Turkic, Indian, and Andalusi Muslims all consider themselves subjects of one Khilafah first, members of their local communities second."

 nd_khl_caliphal_absolutism: "Caliphal Absolutism"
 nd_khl_caliphal_absolutism_desc: "The Caliph is no longer first among equals among the local rulers of the Sunni world; he is the absolute sovereign over a single integrated state stretching across three continents."
 nd_khl_modern_navy: "The Modern Caliphal Navy"
 nd_khl_modern_navy_desc: "Frigates and ships-of-the-line, dockyards modeled on the best Iberian and Atlantic practice, professional captains drawn from a single Khilafan academy: the navy modernizes without losing its Mediterranean and monsoon character."
 nd_khl_caliphal_bank: "The Caliphal Bank"
 nd_khl_caliphal_bank_desc: "A Khilafan credit network using sakk (cheques), suftaja (bills of exchange), and the new institutional lending of the post-Reformation world ties Cairo, Damascus, Baghdad, Constantinople, Aleppo, and Cordoba into a single financial system."
 nd_khl_caliphal_science: "The Caliphal Scientific Revolution"
 nd_khl_caliphal_science_desc: "The Khilafah's astronomers, mathematicians, physicians, and chemists, working from Mecca to Cordoba in a single Arabic scientific community, drive a Khilafan parallel to the European scientific revolution."
 nd_khl_universal_legitimacy: "Universal Legitimacy"
 nd_khl_universal_legitimacy_desc: "Christian and Hindu states accept the Khilafah's diplomatic precedence; the rulers of Spain, France, the Holy Roman Empire, and the Hindu kingdoms address the Caliph as a peer or superior. The Khilafah is the world's senior power."

 nd_khl_caliphal_tanzimat: "The Caliphal Tanzimat"
 nd_khl_caliphal_tanzimat_desc: "Codified law, conscript armies, salaried officials, technical schools, telegraphs, railways: the Khilafah modernizes from above, drawing on European models without surrendering its Islamic character."
 nd_khl_modern_army: "The Modern Caliphal Army"
 nd_khl_modern_army_desc: "Conscription replaces the levy and the slave-corps. Rifled muskets replace matchlocks. Drilled battalions replace sipahi cavalry. The Nizami Jadid is the model army of the late Khilafah."
 nd_khl_steam_navy: "The Steam Navy"
 nd_khl_steam_navy_desc: "Steam frigates and ironclads built in Khilafan dockyards from Constantinople to Bombay carry the green banner into the age of industrial naval warfare."
 nd_khl_pan_islamic_congress: "The Pan-Islamic Congress"
 nd_khl_pan_islamic_congress_desc: "A modern diplomatic institution, the Caliphal Congress speaks for the ummah at the Concert of Powers. Where the European empires send foreign ministers, the Khilafah sends a single voice for the global Islamic community."
 nd_khl_industrial_khilafah: "The Industrial Khilafah"
 nd_khl_industrial_khilafah_desc: "Cotton mills in Egypt, foundries in Anatolia, shipyards in Suez, mechanized looms in Damascus, and railroad networks linking Cairo, Baghdad, and Lahore: the Khilafah industrializes on its own terms."

 # ============================================================
 # Custom unit names
 # ============================================================
 a_nd_khl_mujahid_volunteers: "Mujahid Volunteers"
 a_nd_khl_mujahid_volunteers_desc: "Volunteer infantry from across the ummah, motivated by faith and the Caliph's call. Highly motivated but lightly armored."
 a_nd_khl_ghulam_cavalry: "Ghulam Cavalry"
 a_nd_khl_ghulam_cavalry_desc: "The Caliph's slave-soldier mounted guard, raised from childhood and bound to the throne alone. Elite shock cavalry in the Yarmuk tradition."
 n_nd_khl_caliphal_galley: "Caliphal Galley"
 n_nd_khl_caliphal_galley_desc: "Mediterranean galley combining Andalusi, Maghrebi, Egyptian, and Levantine shipbuilding traditions. The standard warship of the unified Khilafan Mediterranean fleet."
 n_nd_khl_caliphal_galleon: "Caliphal Galleon"
 n_nd_khl_caliphal_galleon_desc: "Heavy ocean-going warship combining Iberian galleon design with Indian Ocean rigging, suited equally to Mediterranean broadside and monsoon-season trade protection."
 a_nd_khl_caliphal_corps: "Caliphal Slave Corps"
 a_nd_khl_caliphal_corps_desc: "Janissary-equivalent slave infantry: drilled, drilled again, fed by the Caliphal kitchen, paid by the Caliphal treasury, and bound to the Caliph alone."
 a_nd_khl_tofangchi: "Tofangchi Musketeers"
 a_nd_khl_tofangchi_desc: "Light musketeer skirmishers in the Persian-Mughal tradition, armed with matchlocks and trained to harry larger formations."
 n_nd_khl_oceanic_galleon: "Oceanic Galleon"
 n_nd_khl_oceanic_galleon_desc: "The large broadside warship of the Two Oceans Fleet, designed for sustained naval operations across both the Mediterranean and the Indian Ocean."
 n_nd_khl_caliphal_frigate: "Caliphal Frigate"
 n_nd_khl_caliphal_frigate_desc: "Modernized fast warship combining the best Iberian and Ottoman naval traditions, the workhorse of the absolutist-era Caliphal navy."
 a_nd_khl_nizami_jadid: "Nizami Jadid"
 a_nd_khl_nizami_jadid_desc: "The New Order army: conscript infantry drilled in European fashion but serving under the Khilafan flag. Rifled musket, modern uniform, professional officer corps."
 n_nd_khl_steam_frigate: "Caliphal Steam Frigate"
 n_nd_khl_steam_frigate_desc: "Steam-powered modern warship built in the dockyards of Suez, Constantinople, and Bombay, projecting Khilafan naval power into the industrial age."

 # ============================================================
 # Custom buildings
 # ============================================================
 nd_khl_ribat_garrison: "Ribat"
 nd_khl_ribat_garrison_desc: "Frontier garrison-monastery housing volunteer fighters and ascetics on the marches of the Khilafah. Half fortress, half religious retreat."
 nd_khl_hajj_caravanserai: "Hajj Caravanserai"
 nd_khl_hajj_caravanserai_desc: "Walled compound with stables, water cisterns, and shaded sleeping quarters along the pilgrim road. Maintained by Caliphal decree, it serves both pilgrims and merchant caravans."
 nd_khl_grand_jami_mosque: "Grand Jami Mosque"
 nd_khl_grand_jami_mosque_desc: "The great Friday-prayer congregational mosque, the visible heart of every Khilafan city. The minbar from which the Caliph's khutba is delivered."
 nd_khl_caliphal_diwan_building: "Caliphal Diwan"
 nd_khl_caliphal_diwan_building_desc: "The chancery and finance ministry of the Khilafah, with its trained scribes, sealed registers, and standardized Arabic protocols."
 nd_khl_bayt_al_hikmah_building: "Bayt al-Hikmah"
 nd_khl_bayt_al_hikmah_building_desc: "House of Wisdom: a great library, translation academy, and observatory combined. Greek, Sanskrit, Persian, and Syriac manuscripts are rendered into Arabic; new science is generated in dialogue with translated tradition."
 nd_khl_caliphal_mint: "Caliphal Mint"
 nd_khl_caliphal_mint_desc: "Mint of the silver dirham and gold dinar, struck to Caliphal weight specifications and accepted in every market of the Khilafah."
 nd_khl_universal_madrasah_building: "Universal Madrasah"
 nd_khl_universal_madrasah_building_desc: "Religious-academic college teaching the unified Khilafan curriculum. A scholar trained in Fez can teach in Bukhara; a graduate of al-Azhar serves in Lahore."
 nd_khl_sufi_khanqah: "Sufi Khanqah"
 nd_khl_sufi_khanqah_desc: "Sufi lodge housing a tariqa fraternity. The brothers conduct dhikr, host travelers, support converts, and bind the local community to the universal Caliphal Sufi network."
 nd_khl_caliphal_bank_building: "Caliphal Bank"
 nd_khl_caliphal_bank_building_desc: "Major credit institution offering sakk, suftaja, and modern institutional lending across the pan-Khilafan financial network."

