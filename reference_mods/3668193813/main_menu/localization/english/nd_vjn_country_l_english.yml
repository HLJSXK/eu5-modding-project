l_english:
 VJN: "Karnata Empire"
 VJN_ADJ: "Karnata"
 VJN_f: "Karnata Empire"
 VJN_f_desc: "Restore the imperial dignity of Vijayanagara, the great Hindu empire of the south. Forged in the crucible of resistance against the Deccan sultanates and elevated to its zenith under Krishnadeva Raya, the Karnata Rajya unites the Dravidian peoples under the boar-banner of Varaha — guardian of dharma, patron of temples, and master of the spice-trading coasts."
