l_english:
 ALM: "Almohad Caliphate"
 ALM_ADJ: "Almohad"
 ALM_f: "Almohad Caliphate"
 ALM_f_desc: "The Almohad Caliphate (al-Muwaḥḥidūn, 'those who affirm divine unity') was the Berber Muslim empire that succeeded the Almoravids and united the Maghreb and al-Andalus under a single rule from its capital at Marrakesh. Founded on the religious reform movement of Ibn Tumart and consolidated by Abd al-Mu'min, at its height under Yaqub al-Mansur it stretched from the Atlantic shores of Morocco across to Tripolitania and northward into Iberia, where Sevilla served as its peninsular seat. A Maghrebi Sunni state with Marrakesh and Fez as its core, it requires the Almohad core in North Africa; reuniting al-Andalus is the Caliph's prerogative, not his prerequisite."
