 # Bureaucracy slot grant + bureaucracy display strings
 # ============================================================
 AUTO_MODIFIER_NAME_nd_num_bureaucracy_authority: "Comancheria Federal Authority"
 AUTO_MODIFIER_DESC_nd_num_bureaucracy_authority: "The five hordes of Numunu Sookobitu have proclaimed the federation, and four Comanche institutions stand ready to be raised into permanent organs: the Council of the Comanche Nation under the dual paraibos-tekwuniwapi office, the Multi-Horde Federation of Penateka, Yamparika, Quahadi, Nokoni, and Kotsoteka, the Comanchero Trade License regime, and the Captive-Incorporation system that turns the raid-cycle into a demographic engine. Two slots open alongside the capital's implicit slot, allowing three of the four to be entrenched while the fourth remains an occasion-summoned council in the federation's older custom."

 num_council_of_comanche_nation_bureaucracy: "Council of the Comanche Nation"
 num_council_of_comanche_nation_bureaucracy_desc: "The inter-band assembly under the dual paraibos and tekwuniwapi co-rulership. The paraibos -- peace chiefs -- negotiated tribute, captive-ransom, and the Comanchero licenses; the tekwuniwapi -- war chiefs -- led the raid-cycle. When the divisions converged at Council Hill or Big Spring the paired authority was raised over all five hordes at once, ratifying peace, war, and inter-band redistribution. Maintained, the council speaks with one voice; neglected, the paraibos and tekwuniwapi pull in opposite directions and the federation rides without a line."

 num_multi_horde_federation_bureaucracy: "Multi-Horde Federation"
 num_multi_horde_federation_bureaucracy_desc: "The five-division federal structure binding Penateka of the honey-eaters, Yamparika of the root-eaters, Quahadi of the antelope, Nokoni who-turn-back, and Kotsoteka the buffalo-eaters. Each horde kept its own paraibos and its own raid-radius -- Penateka south to Coahuila, Quahadi west across the Llano Estacado, Yamparika north to the Arkansas. The federation pooled the divisions for war and ratified peace at the inter-band council, but never abolished division-level autonomy. Maintained, each horde governs its own territory; neglected, the divisions ride against each other and the council at Council Hill cannot gather a quorum."

 num_comanchero_license_bureaucracy: "Comanchero Trade License"
 num_comanchero_license_bureaucracy_desc: "The Comanche-administered customs system regulating the Hispanic and Pueblo traders -- the comancheros -- who entered Comancheria to deal in horses, hides, captives, and silver. The Comanche granted licenses, fixed exchange rates at the rendezvous-fairs, and took a cut of every caravan. By the 1830s the comancheros operated under a recognized customs regime, returning yearly to fixed waterholes the paraibos had designated as licensed marts. Texan accounts describe a non-state with working tariff machinery. Maintained, the marts feed the federation's treasury; neglected, they decay into smuggling routes and the older bands accuse the paraibos of growing rich off Pueblo merchants."

 num_captive_incorporation_bureaucracy: "Captive-Incorporation System"
 num_captive_incorporation_bureaucracy_desc: "The institutionalized practice of absorbing captives -- Mexican, Pueblo, Anglo -- into Comanche bands as adopted kin. Captives were taken in raid, ransomed to their relatives for horses or silver, or, if young, raised as Comanche children and married into the lineages. By the nineteenth century, sizeable percentages of Comanche population were captive-descended Mexican or Anglo, and the institution had become the federation's demographic engine. Maintained, captives become Comanche and the multi-ethnic federation grows; neglected, the unassimilated form a resentful faction and the older lineages complain that the bands have been diluted."
 STATIC_MODIFIER_NAME_nd_num_paraibo_confederation: "Paraibo-Tekwuniwapi Confederation"
 STATIC_MODIFIER_DESC_nd_num_paraibo_confederation: "The Numunu federal governance: paraibos (peace chiefs) and tekwuniwapi (war chiefs) ruling the five great divisions -- Penateka, Yamparika, Quahadi, Nokoni, Kotsoteka -- through the Council of the Comanche Nation at Council Hill. Inter-band assembly, kinship-bound, bison-economy cohesion. No unitary kingdom; the Comanche Empire is a confederation."
