 # ============================================================
 # Static modifier loc (formation choices + DHE rewards)
 # ============================================================
 STATIC_MODIFIER_NAME_nd_num_continental_empire: "Continental Empire"
 STATIC_MODIFIER_DESC_nd_num_continental_empire: "Numunu Sookobitu rides as raid-tribute empire. The paraibos and tekwuniwapi command a mobile state extracting tribute from the borderlands, captives absorbed into the nation through the war-band, the bison economy underwriting an empire that moves with the herd."
 STATIC_MODIFIER_NAME_nd_num_sovereign_nation: "Sovereign Nation"
 STATIC_MODIFIER_DESC_nd_num_sovereign_nation: "The Comanche nation is consolidated as a state with defined borders, the Council of the Comanche Nation seated permanently, schoolhouse Numic literacy and treaty diplomacy with neighboring powers. The horse empire becomes a nation among nations."
 STATIC_MODIFIER_NAME_nd_num_council_hill_compact: "Council Hill Compact"
 STATIC_MODIFIER_DESC_nd_num_council_hill_compact: "At Council Hill the paraibos negotiate a continental compact, embassies received with formal protocol. The Comanche speak as the senior power of the Southern Plains."
 STATIC_MODIFIER_NAME_nd_num_council_hill_armed_peace: "Armed Peace"
 STATIC_MODIFIER_DESC_nd_num_council_hill_armed_peace: "Peace from a position of strength: every concession from neighbors is mirrored by a fortified Comanche encampment. The horse herds remain saddled, ready."
 STATIC_MODIFIER_NAME_nd_num_assimilation_engine: "The Absorbed Nations"
 STATIC_MODIFIER_DESC_nd_num_assimilation_engine: "Mexicans, Pueblos, Anglos taken in raids are adopted, raised as Comanche children, marrying into the bands. The Comanche become a multi-ethnic nation through the captive-incorporation engine."
 STATIC_MODIFIER_NAME_nd_num_tribute_engine: "Tribute Extraction"
 STATIC_MODIFIER_DESC_nd_num_tribute_engine: "Captives are ransomed back to their kin for horses, weapons, and silver. The seasonal raid-cycle becomes a tribute system underwriting the imperial treasury."
 STATIC_MODIFIER_NAME_nd_num_comanchero_license: "Comanchero License"
 STATIC_MODIFIER_DESC_nd_num_comanchero_license: "The New Mexican traders are licensed to enter Comancheria. Caravans cross the Llano carrying weapons and metal goods northward, returning with horses, hides, and captives bound for the Santa Fe market."
 STATIC_MODIFIER_NAME_nd_num_direct_caravan: "Direct Caravan Trade"
 STATIC_MODIFIER_DESC_nd_num_direct_caravan: "The Comanche send their own caravans south to Santa Fe and east to the Anglo settlements. No middleman takes a share of the borderlands trade."
 STATIC_MODIFIER_NAME_nd_num_great_raid_press: "Press the Raid"
 STATIC_MODIFIER_DESC_nd_num_great_raid_press: "The seasonal raid-cycle into Texas, Coahuila, and Nuevo Leon strips the northern Mexican provinces of livestock and captives. The horse-warriors return laden."
 STATIC_MODIFIER_NAME_nd_num_great_raid_consolidate: "Consolidate the Raid"
 STATIC_MODIFIER_DESC_nd_num_great_raid_consolidate: "Captured horses and the absorbed warriors are folded into the bands. The army grows through the raid rather than being expended in it."
 STATIC_MODIFIER_NAME_nd_num_mexico_offensive: "Bajio Offensive"
 STATIC_MODIFIER_DESC_nd_num_mexico_offensive: "The eight-hundred-warrior column rides past Saltillo and Monterrey into the Bajio itself. Zacatecas burns; the haciendas of San Luis Potosi pay or empty. Every cycle the line of war moves south."
 STATIC_MODIFIER_NAME_nd_num_mexico_consolidation: "Tributary Frontier"
 STATIC_MODIFIER_DESC_nd_num_mexico_consolidation: "Northern Mexico is no longer raided so much as taxed. Provincial governors negotiate annual payments in horses, silver, and captives ransomed; the Comancheria treasury runs on Mexican peso."
 STATIC_MODIFIER_NAME_nd_num_llano_refuge: "Llano Estacado Refuge"
 STATIC_MODIFIER_DESC_nd_num_llano_refuge: "The Llano Estacado is a sea of grass with no landmark, no water source the outsider knows. To enter is to die of thirst; the Quahadi navigate it by Big Dipper and memory."
 STATIC_MODIFIER_NAME_nd_num_numic_orthography: "Numic Orthography"
 STATIC_MODIFIER_DESC_nd_num_numic_orthography: "The Comanche language is given a written form. Schoolhouse alphabets spread the puhakat traditions, the Buffalo songs, the council histories into permanent record."

 # ============================================================
 # Formation event
 # ============================================================
 nd_num.1.t: "Numunu Sookobitu Rises"
 nd_num.1.d: "From the Llano Estacado the paraibos have summoned the bands: Penateka of the honey-eaters, Yamparika of the root-eaters, Quahadi of the antelope, Nokoni who-turn-back, Kotsoteka the buffalo-eaters. The Spanish horse-stock has long since become the foundation of a new economy; the bison herds still cover the southern plains; northern Mexico pays tribute or burns. The question is what shape the Comanche state should take.\n\nShould Numunu Sookobitu remain the great mobile empire of raid-and-tribute, expanding through the war-band and the captive incorporated as kin? Or should the Comanche consolidate as a sovereign nation among nations, with formal borders, written treaties, and the schoolhouse Numic alphabet?\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_num.1.a: "Continental empire — the raid is the state."
 nd_num.1.b: "Sovereign nation — the council seats permanently."

 # ============================================================
 # DHE event loc
 # ============================================================
 nd_num.2.t: "The Horse Returns to the Plains"
 nd_num.2.d: "The Pueblo Revolt of 1680 has scattered the Spanish horse herds across the Southern Plains. What was once a luxury gifted to a few chiefs becomes the everyday property of every Comanche warrior. The Numunu transform from foot-skirmishers into the most accomplished light cavalry the continent has ever seen, the herds following the bison cycle as the warriors follow the herds.\n\nThe paraibos must decide how to wield this new mobility — to press the raids deep into Mexico while the advantage is fresh, or to consolidate the herds and the absorbed warriors into a deeper army?"
 nd_num.2.a: "Press the raids while the Spanish are stunned!"
 nd_num.2.b: "Build the herds and fold absorbed warriors into the bands."

 nd_num.3.t: "The Absorbed Nations"
 nd_num.3.d: "A captive Mexican woman, taken at twelve, has borne three Comanche sons and now sits as the senior wife of a Penateka war-chief. A Pueblo silversmith, abducted from Taos in his youth, hammers Comanche bridle ornaments. An Anglo orphan, raised among the Yamparika, speaks no English and counts coup beside his adopted brothers.\n\nThis is how the Comanche grew — not as a closed bloodline but as a nation that absorbed its captives into kinship. The council debates whether the nation should formalize this engine of assimilation, or instead extract tribute from the captured: ransoming them back to their kin and turning the raid-cycle into a continental treasury."
 nd_num.3.a: "Adopt the captives — the nation grows by absorption."
 nd_num.3.b: "Ransom the captives — the raid funds the treasury."

 nd_num.4.t: "The Comanchero Trade"
 nd_num.4.d: "The Comancheros — New Mexican traders licensed by the Comanche to cross the Llano — arrive at the encampments with metal goods, weapons, dried chiles. They depart with horses, bison hides, and captives bound for the Santa Fe market. This is the borderlands trade circuit: a parasitic economy on the Spanish frontier, the Comanche its sole sovereign.\n\nShould the council license the Comancheros formally as the Comanche trade arm — extracting a share of every caravan — or should the Comanche send their own riders south, cutting out the New Mexican middleman entirely?"
 nd_num.4.a: "License the Comancheros — let them work for us."
 nd_num.4.b: "Send Comanche caravans direct to Santa Fe."

 nd_num.5.t: "Council Hill"
 nd_num.5.d: "At Council Hill, the great parliament-stone east of the Wichita range, the paraibos receive emissaries from Texas, from the United States, from the Mexican governors. Each delegation arrives bearing gifts; each departs with a treaty written in a hand the Comanche can now read.\n\nThe question before the council is the diplomatic posture itself: should the Comanche speak to neighbors as a continental compact, the senior signatory among the Plains nations? Or should every embassy be received as supplicants beside fortified war-camps, peace negotiated only from a position of armed superiority?"
 nd_num.5.a: "Continental compact — speak as the senior power."
 nd_num.5.b: "Armed peace — every embassy beside a war-camp."

 nd_num.6.t: "The Great Raid"
 nd_num.6.d: "Eight hundred Comanche horse-warriors ride south out of the Llano in late summer. Three weeks later the Coahuila haciendas burn for two hundred miles; the captives — children, women, horses by the thousand — return north with the war-band. This is not a campaign but a season. Northern Mexico has paid this tribute for a century.\n\nDoes the council press the raid harder, while the Mexican states are absorbed in their civil wars? Or consolidate the gains and rotate the warriors home to teach the new horse-doctrine to a fresh generation?"
 nd_num.6.a: "Press the raid — Mexico is open."
 nd_num.6.b: "Rotate the warriors — train the next generation."

 nd_num.7.t: "The Llano Estacado Heartland"
 nd_num.7.d: "The Llano Estacado — the Staked Plain — is the Quahadi heartland and the Comanche refuge. A mesa-top sea of grass three hundred miles across, with no landmark, no surface water the outsider can find. Spanish columns vanished here in the 1700s; American cavalry would later vanish here too. The Quahadi guides navigate by Big Dipper and the memory of generations, leading the bands to hidden springs at predawn.\n\nThe council fortifies the heartland: war-camps at every approach, supply caches along the secret paths, the Llano declared the inviolable sanctuary of the Comanche state."
 nd_num.7.a: "The Llano is sealed."

 nd_num.8.t: "The Numic Alphabet"
 nd_num.8.d: "A schoolhouse rises at the council ground. The Comanche language — Numu Tekwapuha — is given written form, the elders dictating the Buffalo songs, the puhakat medicine traditions, the council histories into permanent record. Children learn to read in their own tongue before they ride.\n\nThe Comanche, once the most mobile nation on the continent, anchor themselves in script. The nation will outlive the bison."
 nd_num.8.a: "Numu Tekwapuha is written."

 # ============================================================
 # Advance loc
 # ============================================================
 # Age 1
 nd_num_numic_migration: "Numic Plains Migration"
 nd_num_numic_migration_desc: "The Numunu separate from the broader Shoshonean tradition and migrate south onto the Plains, learning the bison cycle and the seasonal grass."
 nd_num_seasonal_camp: "Seasonal Bison Camp"
 nd_num_seasonal_camp_desc: "Mobile camps follow the bison herds across the Southern Plains, hide-processing at every halt. The foundation of the Plains economy."
 nd_num_skirmisher_tradition: "Numic Skirmisher Tradition"
 nd_num_skirmisher_tradition_desc: "Pre-horse Comanche foot-warriors fight in the broken terrain of the canyon country with bow and lance, the older Numic combat style."
 nd_num_medicine_bundle: "Puhakat Medicine Bundle"
 nd_num_medicine_bundle_desc: "Each warrior carries a medicine bundle assembled from his vision quest. The puhakat tradition binds the Comanche to ancestral spirits and confers protection in the raid."
 nd_num_council_lodge_tradition: "Council Lodge Tradition"
 nd_num_council_lodge_tradition_desc: "The paraibos of each band gather at the council lodge to debate matters of war and peace, no decision binding without consensus among the bands."
 nd_num_big_dipper_navigation: "Big Dipper Navigation"
 nd_num_big_dipper_navigation_desc: "The Comanche navigate by the Big Dipper as cosmological pole and earthly compass, riding by night across the trackless Llano to springs no outsider can find."
 # Age 2
 nd_num_horse_mastery: "Comanche Horse Mastery"
 nd_num_horse_mastery_desc: "After the Pueblo Revolt of 1680 scatters the Spanish herds, the Comanche become the most accomplished light cavalry on the continent. Every warrior owns horses; the bands move with the herd."
 nd_num_paraibos_confederation: "Paraibos Confederation"
 nd_num_paraibos_confederation_desc: "The five great bands — Penateka, Yamparika, Quahadi, Nokoni, Kotsoteka — confederate under a paraibos council. The peace chief and tekwuniwapi war chief speak with separate authority."
 nd_num_horse_warrior: "Comanche Horse Warrior"
 nd_num_horse_warrior_desc: "The iconic Plains horse-archer, fighting from the saddle with bow and Spanish lance, fluent in maneuvers no European cavalry could match."
 nd_num_pueblo_lessons: "Pueblo Lessons"
 nd_num_pueblo_lessons_desc: "Captured Pueblo silversmiths, weavers, and horse-grooms teach their crafts to the bands. The first wave of the captive-incorporation engine."
 nd_num_buffalo_hide_trade: "Buffalo Hide Trade"
 nd_num_buffalo_hide_trade_desc: "Bison hides become the bulk export of Comancheria. Hide processing is industrialized at the seasonal camps; the bands trade hides for metal goods at Comanchero outposts."
 nd_num_tekwuniwapi_doctrine: "Tekwuniwapi Doctrine"
 nd_num_tekwuniwapi_doctrine_desc: "The war-chief commands by acclamation, leading raids by personal example. Authority in war is earned in the saddle, not inherited from the council."
 # Age 3
 nd_num_comanchero_trade: "Comanchero Trade Network"
 nd_num_comanchero_trade_desc: "New Mexican traders are licensed to cross the Llano and trade with the bands. The borderlands trade circuit makes Santa Fe a Comanche-dependent market."
 nd_num_captive_incorporation: "Captive Incorporation"
 nd_num_captive_incorporation_desc: "Mexican, Pueblo, and Anglo captives are adopted as Comanche children, marry into the bands, and become full Numunu within a generation. The nation grows through absorption."
 nd_num_raid_economy: "Raid-Economy"
 nd_num_raid_economy_desc: "The seasonal raid-cycle becomes the central economic activity of the empire. Northern Mexican provinces pay tribute or burn; the Comanche treasury fills with horses and silver."
 nd_num_raider_doctrine: "Raider Doctrine"
 nd_num_raider_doctrine_desc: "A specialized cavalry arm — light, fast, self-supplied for the long ride — is separated from the main horse-warrior tradition for the dedicated raid into Mexico."
 nd_num_horse_aristocracy: "Horse Aristocracy"
 nd_num_horse_aristocracy_desc: "Wealth in Comancheria is counted in horses. A man with a hundred horses speaks at the council; a man with five hundred gives his daughters in alliance to neighboring bands."
 nd_num_buffalo_monopoly: "Strategic Bison Monopoly"
 nd_num_buffalo_monopoly_desc: "The Comanche control the bison herds of the Southern Plains by enforcing seasonal hunting boundaries against rival nations. The herd is the empire's strategic resource."
 # Age 4
 nd_num_council_of_comanche_nation: "Council of the Comanche Nation"
 nd_num_council_of_comanche_nation_desc: "The paraibos confederation is formalized as the Council of the Comanche Nation — a permanent senate of band-chiefs that binds the entire confederation to common policy."
 nd_num_llano_estacado: "Llano Estacado Heartland"
 nd_num_llano_estacado_desc: "The Staked Plain is fortified as the Comanche refuge — the inviolable Quahadi heartland where no outside army can survive without a Comanche guide."
 nd_num_tribute_system: "Imperial Tribute System"
 nd_num_tribute_system_desc: "Northern Mexican provinces pay annual tribute in horses, silver, and trade-license to escape the raid-cycle. The Comanche treasury reaches its peak."
 nd_num_medicine_lodge: "Medicine Lodge Tradition"
 nd_num_medicine_lodge_desc: "Permanent medicine lodges house the puhakat — the medicine men whose bundles bind the bands to ancestral spirits."
 nd_num_horse_breeding_program: "Horse Breeding Program"
 nd_num_horse_breeding_program_desc: "Selective breeding from the Spanish, Pueblo, and absorbed Anglo bloodlines produces the Comanche pony — small, sturdy, unmatched on the Plains."
 nd_num_great_raid_doctrine: "Great Raid Doctrine"
 nd_num_great_raid_doctrine_desc: "The annual late-summer raid into Mexico is regularized as a doctrinal campaign — eight hundred warriors riding south, three months on the trail, returning with the captures of a season."
 # Age 5
 nd_num_council_hill: "Council Hill Diplomacy"
 nd_num_council_hill_desc: "The great parliament-stone east of the Wichita range receives embassies from Texas, the United States, and the Mexican governors. The Comanche speak as a continental power."
 nd_num_bison_strategic_economy: "Strategic Bison Economy"
 nd_num_bison_strategic_economy_desc: "The bison herds are managed as the strategic foundation of the empire — hunting quotas, seasonal sanctuaries, the herd defended as state property."
 nd_num_frontier_diplomacy: "Frontier Diplomacy"
 nd_num_frontier_diplomacy_desc: "Permanent diplomatic missions in San Antonio, Santa Fe, and Washington negotiate the borderlands as a triangular state-system, the Comanche the senior partner."
 nd_num_eagle_warrior: "Eagle Warrior Aristocracy"
 nd_num_eagle_warrior_desc: "An elite cavalry of the high empire, drawn from the great horse-aristocrat lineages, the Eagle Warriors lead the Great Raid and command at Council Hill."
 nd_num_quahadi_homeland: "Quahadi Homeland"
 nd_num_quahadi_homeland_desc: "The Quahadi band, the antelope-eaters of the Llano, fortify the heartland with hidden supply caches and the secret water-paths only their guides remember."
 nd_num_borderland_caravan: "Borderland Caravan Network"
 nd_num_borderland_caravan_desc: "Comanche caravans extend north to the Arkansas, south to Saltillo, east to the Red River. The borderlands trade circuit is fully Comanche-administered."
 # Age 6
 nd_num_numic_literacy: "Numic Schoolhouse Literacy"
 nd_num_numic_literacy_desc: "Numu Tekwapuha is given written form. The Buffalo songs, puhakat traditions, and council histories enter permanent record. Comanche children read in their own tongue."
 nd_num_treaty_diplomacy: "Treaty Diplomacy"
 nd_num_treaty_diplomacy_desc: "The Comanche enter the international treaty system as a sovereign signatory, written agreements binding the United States, Mexico, and the Plains nations."
 nd_num_sovereign_endurance: "Sovereign Endurance"
 nd_num_sovereign_endurance_desc: "Numunu Sookobitu endures past the bison decimation, past the US cavalry, past the dispossession that broke every other Plains nation. The horse empire becomes a permanent state."
 nd_num_modern_plains_cavalry: "Modern Plains Cavalry"
 nd_num_modern_plains_cavalry_desc: "The Comanche horse tradition, modernized with breech-loading carbines and the late-empire saddle. The last buildable Comanche cavalry."
 nd_num_constitution_of_comancheria: "Constitution of Comancheria"
 nd_num_constitution_of_comancheria_desc: "A written constitution formalizes the Council of the Comanche Nation as the legislature of a sovereign state. The horse empire becomes a republic."
 nd_num_industrial_horse_corral: "Industrial Horse Corral"
 nd_num_industrial_horse_corral_desc: "Selective breeding programs at scale, modern stables, and a horse-export economy. Comancheria supplies cavalry mounts to half the continent."

