 # Destiny advances
 nd_num_destiny: "Numunu Sookobitu Destiny"
 nd_num_destiny_desc: "The horse empire stands. The paraibos must now decide whether the Numunu state will be ridden as a continental tribute empire or seated as a sovereign nation among nations."
 nd_num_dest_a1_northern_frontier: "Northern Mexico Tribute Frontier"
 nd_num_dest_a1_northern_frontier_desc: "Take the Tamaulipeco lowlands south of the Rio Grande as the first tribute-frontier of the empire. Own #bold Tamaulipeco#! and #bold Maratine#! and field a 30-thousand strong army."
 nd_num_dest_a2_coahuila_dominion: "Coahuila Dominion"
 nd_num_dest_a2_coahuila_dominion_desc: "The Guachichil and Coahuila highlands fall to the southern raid. Own #bold Guachichil#!, #bold Cuencame#!, and #bold Chisos#!, field a 50-thousand army, and consolidate 3500 development under Comanche rule."
 nd_num_dest_a3_continental_hegemony: "Continental Hegemony"
 nd_num_dest_a3_continental_hegemony_desc: "Numunu Sookobitu becomes the senior power of the continent. Own #bold Mapimi#!, #bold Cuanales#!, #bold Alazapa#!, and #bold Xumani#!; field a 75-thousand army; hold 75 prestige and 3000 gold. Unlocks the Imperial Bison-Council Hall."
 nd_num_dest_b1_indigenous_alliance: "Regional Indigenous Alliance"
 nd_num_dest_b1_indigenous_alliance_desc: "Embrace the institution of #bold Legalism#!, hold 50 prestige and 75 stability. The first foundations of the sovereign Comanche state are laid in council protocol and written law."
 nd_num_dest_b2_plains_coalition: "Plains-Wide Indigenous Coalition"
 nd_num_dest_b2_plains_coalition_desc: "Embrace the #bold Printing Press#! and pivot the Plains nations into a Comanche-led coalition. Own #bold He Sapa#! (the Black Hills) and #bold Awatixa#! (the Mandan villages); hold 2000 gold and 50 prestige."
 nd_num_dest_b3_pan_indigenous_confederation: "Pan-Indigenous Confederation"
 nd_num_dest_b3_pan_indigenous_confederation_desc: "The Comanche-led Indigenous federation is recognized as a sovereign signatory among the great powers. Embrace #bold Global Trade#!; own #bold Bighorn Mountains#!, #bold Marapa#!, and #bold Minisose#!; hold 5000 development, 75 prestige, 75 stability. Unlocks the Treaty Hall."

 # Destiny event titles, descriptions, options
 nd_num.9.t: "The Destiny Path Opens"
 nd_num.9.d: "The paraibos have set the course of the nation. The bands ride forward in the chosen direction — the seasonal raid-cycle deepening into a continental empire, or the council seating itself as the diplomatic core of an Indigenous federation."
 nd_num.9.a: "The path is set."

 nd_num.10.t: "The Tribute Frontier"
 nd_num.10.d: "The Comanche horse-warriors have crossed the Rio Grande and broken the Tamaulipeco coast. Maratine pays tribute in livestock and horses; the rancheros of the lower river deliver their seasonal levy to a Comanche embassy. The first true imperial province of Numunu Sookobitu sits south of the river. The horse-empire stretches into Mexico."
 nd_num.10.a: "The southern frontier is ours."

 nd_num.11.t: "Coahuila Falls to the Raid"
 nd_num.11.d: "Guachichil. Cuencame. Chisos. The high desert of Coahuila and Durango folds under the seasonal raid. Spanish presidios are abandoned; Indigenous communities welcome the Comanche-led collapse of viceregal authority. The question before the council: do the bands press the raid deeper still while the Mexican states reel, or do they fortify what they have taken and absorb the absorbed populations into the empire?"
 nd_num.11.a: "Press the raid — Mexico is open all the way to Zacatecas!"
 nd_num.11.b: "Fortify the new dominion — make it permanent."

 nd_num.12.t: "Continental Hegemony"
 nd_num.12.d: "Mapimi, Cuanales, Alazapa, Xumani — from the Bolson de Mapimi to the Sierra Madre, from Nuevo Leon to the Chihuahuan plateau, the continental empire holds. The paraibos sit at the apex of an imperial structure that subordinates every settled state of northern Mexico. The council debates the form of the empire's permanent administration: a viceregal structure modeled on the absorbed Spanish institutions, or a tribute-and-treasury system in the Comanche style?"
 nd_num.12.a: "Establish a Comanche viceroyalty over the conquests."
 nd_num.12.b: "Convert tribute into a unified continental treasury."

 nd_num.13.t: "The Council of Allied Nations"
 nd_num.13.d: "At the council ground the paraibos receive the first formal embassies from the surrounding nations — Apache, Kiowa, Pueblo. The Comanche language has been given written form; treaties are signed in a hand the bands can read. The work of the sovereign Comanche state begins not in the war-camp but in the chamber."
 nd_num.13.a: "The Indigenous alliance takes shape."

 nd_num.14.t: "The Plains-Wide Coalition"
 nd_num.14.d: "The Black Hills are sacred to the Lakota; the Missouri river-villages are home to the Mandan and the Hidatsa. The Comanche council has extended its reach to bring these northern nations into the confederation, the printing press carrying the Numunu language and treaty texts up the Plains corridor. The council debates the form of the wider coalition: a council-of-equals seated permanently at Council Hill, or a network of mobile diplomatic envoys reaching every Indigenous capital from the Apache lands to the Great Lakes?"
 nd_num.14.a: "Convene a permanent Pan-Plains Council."
 nd_num.14.b: "Send Comanche envoys to every Indigenous capital."

 nd_num.15.t: "The Pan-Indigenous Confederation"
 nd_num.15.d: "The Bighorn range, Marapa, Minisose. The Comanche-led federation reaches from the Llano Estacado to the Saskatchewan, from the Black Hills to the Mandan riverfront. The United States and Mexico negotiate as equals; the United Kingdom sends a chargé d'affaires. The Comanche become the sovereign pivot of an Indigenous bloc in the international system. The council closes the question with a single decision: shall the federation rest on the Pan-Indigenous Pact of council protocol and shared spirituality, or on a written constitution binding every signatory nation as a federal subject?"
 nd_num.15.a: "Pan-Indigenous Pact — council protocol and the Buffalo song bind us."
 nd_num.15.b: "Constitutional Pact — written federation, every nation a signatory."

 # Static modifier loc — destiny timed modifiers
 STATIC_MODIFIER_NAME_nd_num_dest_a2_press_north: "Press the Mexican Raid"
 STATIC_MODIFIER_DESC_nd_num_dest_a2_press_north: "While the Mexican states are absorbed in their civil wars, the Comanche raid drives deeper into the highland presidios. Every season the war-band returns laden with captives, horses, and silver."
 STATIC_MODIFIER_NAME_nd_num_dest_a2_fortify_gains: "Fortify the Borderland"
 STATIC_MODIFIER_DESC_nd_num_dest_a2_fortify_gains: "The conquered Mexican provinces are fortified, hide-camps and horse-corrals built across the new dominion, the absorbed populations integrated into the band system. The empire is made permanent."
 STATIC_MODIFIER_NAME_nd_num_dest_a3_continental_viceroyalty: "Continental Viceroyalty"
 STATIC_MODIFIER_DESC_nd_num_dest_a3_continental_viceroyalty: "A Comanche viceregal structure replaces the broken Spanish institutions, paraibos seated as imperial governors over the absorbed provinces. The clergy of every faith bow to the council, but Anglo missionaries are turned away from the new empire's reach."
 STATIC_MODIFIER_NAME_nd_num_dest_a3_unifying_tribute: "Unified Continental Treasury"
 STATIC_MODIFIER_DESC_nd_num_dest_a3_unifying_tribute: "Tribute from northern Mexico, the Comanchero trade, and the bison hide export are unified under a single imperial treasury. The borderland traders and absorbed merchants are brought into the council; inflation is controlled, credit is cheap, the empire prospers."
 STATIC_MODIFIER_NAME_nd_num_dest_b2_pan_plains_council: "Pan-Plains Council"
 STATIC_MODIFIER_DESC_nd_num_dest_b2_pan_plains_council: "The permanent council ground hosts envoys from every Plains nation. Mercenary war-bands are obviated by a coalition levy; devastation from the older raid-cycle is repaired in collective effort."
 STATIC_MODIFIER_NAME_nd_num_dest_b2_diplomatic_envoys: "Mobile Diplomatic Envoys"
 STATIC_MODIFIER_DESC_nd_num_dest_b2_diplomatic_envoys: "Comanche-trained envoys reach every Indigenous capital from the Apache to the Great Lakes, carrying the Numic script and the treaty texts. The coalition rejects mercenary war-bands as a tool of the European powers."
 STATIC_MODIFIER_NAME_nd_num_dest_b3_pan_indigenous_pact: "Pan-Indigenous Pact"
 STATIC_MODIFIER_DESC_nd_num_dest_b3_pan_indigenous_pact: "The federation rests on council protocol and the shared spirituality of the Plains. The Buffalo song binds the coalition; the puhakat speak with one voice; building the council infrastructure is the duty of every signatory band."
 STATIC_MODIFIER_NAME_nd_num_dest_b3_constitutional_pact: "Constitutional Pact"
 STATIC_MODIFIER_DESC_nd_num_dest_b3_constitutional_pact: "A written federal constitution binds every Indigenous signatory as a sovereign subject of the Comanche-led confederation. Burgher merchants administer the inter-nation trade; envoys range from the Llano to the Arctic."

 # Destiny capstone buildings
 nd_num_imperial_bison_council: "Imperial Bison-Council Hall"
 nd_num_imperial_bison_council_desc: "The apex Numunu polity, where paraibos and tekwuniwapi co-rule the continental empire. Beneath the Bison-Council standard the absorbed nations are governed as imperial provinces."
 nd_num_treaty_hall: "Treaty Hall and Numic Schoolhouse"
 nd_num_treaty_hall_desc: "The diplomatic chamber of the sovereign Comanche state, with the Numic schoolhouse adjoined. Treaties with the United States, Mexico, and the Indigenous nations are drafted, debated, signed, and archived under one roof."

 # Destiny capstone production methods
 nd_num_pm_imperial_bison_council_maintenance: "Imperial Council Maintenance"
 nd_num_pm_imperial_bison_council_maintenance_desc: "Horses for the imperial guard, leather for the paraibos saddles, weaponry for the war-band, livestock for the council feasts."
 nd_num_pm_treaty_hall_maintenance: "Treaty Hall Maintenance"
 nd_num_pm_treaty_hall_maintenance_desc: "Paper for the treaty drafts, books for the schoolhouse library, fine cloth for the chamber's protocol, furniture for the diplomatic seats."

