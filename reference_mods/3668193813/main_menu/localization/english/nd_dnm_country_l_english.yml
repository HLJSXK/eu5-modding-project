l_english:
 DNM: "Danubian Monarchy"
 DNM_ADJ: "Danubian"
 DNM_f: "Danubian Monarchy"
 DNM_f_desc: "The Danubian Monarchy is the empire the House of Habsburg forges by abandoning the Reich. To the Holy Roman Emperor the German hegemony and the Danube super-state were forever mutually exclusive: an emperor bound to the imperial diet, the electors and the Reichstag could never centralize Austria, Bohemia and Hungary into one obedient crown. Forming the Danubian Monarchy resolves that dilemma the only way it can be resolved, by rupture. You renounce the imperial dignity, walk your hereditary, Bohemian and Hungarian lands out of the Holy Roman Empire, and refound them as a sovereign empire of your own, answerable to no diet but your own court. The German princes are left to their Reich; you take the Danube. This is not Austria-Hungary, the dualist compromise that history would only reach after a century of crisis, but the centralized multi-ethnic monarchy the Habsburgs always reached for and never grasped."
