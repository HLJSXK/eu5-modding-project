l_english:
 TBT: "Tibetan Empire"
 TBT_ADJ: "Tibetan"
 TBT_f: "Tibetan Empire"
 TBT_f_desc: "Restore the Yarlung-era empire (Bod chen po) of Songtsen Gampo, Trisong Detsen, and Ralpacan, when Tibetan armies rode from Lhasa to the Tang frontier and held the Tarim Basin against China. This is the warrior-imperial Tibet of stone-pillar edicts and the Bon-Buddhist synthesis, not the later Gelug theocracy of the lamas. From the Potala to Samye, the Tsenpo's banner rises again over the Roof of the World."
