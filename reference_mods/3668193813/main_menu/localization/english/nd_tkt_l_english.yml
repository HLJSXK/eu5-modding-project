l_english:
 # ============================================================
 # Knights of the Temple (TKT) - Localization
 # Country name and adjective live in nd_tkt_country_l_english.yml
 # ============================================================

 # === Formation event ===
 nd_tkt.1.t: "The Eight-Pointed Cross Refounded"
 nd_tkt.1.d: "The papal bull #bold Vox in excelso#! is lifted. The Pauperes Commilitones Christi Templique Salomonici, dissolved by Clement V at Vienne in 1312 and stripped from Aragon and Portugal a generation later, are refounded as a sovereign brotherhood. The Castelo dos Templarios above the Nabantia hill is ours; Peniscola or Monzon stands in our name; the Treasurer's chest is opened.\n\nBefore the chapter sits a question that has waited a hundred years. Are we the Old Order, the secret-chapter Templars whose bills of exchange once spanned Christendom and whose Latin Rule was written by Bernard of Clairvaux? Or are we the New Order of Christ, publicly papal-sanctioned, the Atlantic mandate of Henry of Sagres made our institutional heart?\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_tkt.1.a: "The Old Order Restored: Bernard's Rule, the secret chapter, the Beausant raised."
 nd_tkt.1.b: "The New Order of Christ: cross-of-Christ on the sail, Atlantic mandate, papal reform."

 # === Formation timed modifiers ===
 STATIC_MODIFIER_NAME_nd_tkt_old_order_restored: "The Old Order Restored"
 STATIC_MODIFIER_DESC_nd_tkt_old_order_restored: "The dissolution is annulled. The brother-knights swear the older oaths under sealed doors; the Beausant gonfanon is raised over the Nabantia hill; the Treasurer-General's chest is unsealed in its medieval form. The brotherhood is feared and isolated in equal measure."
 STATIC_MODIFIER_NAME_nd_tkt_order_of_christ: "The New Order of Christ"
 STATIC_MODIFIER_DESC_nd_tkt_order_of_christ: "The reform is accepted. The splayed cross-of-Christ replaces the older emblem on every sail; the Atlantic mandate of Henry of Sagres becomes the Order's institutional heart; foreign postulants are admitted; the bills of exchange flow under papal seal through Catholic Europe."

 # === DHE 2: Tomar Convent ===
 nd_tkt.2.t: "The Castelo dos Templarios"
 nd_tkt.2.d: "Master Gualdim Pais's twelfth-century plan is finished at last. The ringed convent-fortress on the Nabantia hill is finished: the Charola rotunda, the chapter-house, the Cloister of the Cemetery, the great cistern. From the keep the eight-pointed cross looks down across half of Iberia. The brotherhood has its visible heart."
 nd_tkt.2.a: "Build it as Bernard intended."
 STATIC_MODIFIER_NAME_nd_tkt_castelo_templario: "Castelo Templario"
 STATIC_MODIFIER_DESC_nd_tkt_castelo_templario: "Master Gualdim's design completed. Tomar's ringed convent-fortress stands as the institutional and ceremonial heart of the brotherhood."

 # === DHE 3: Bills of Exchange ===
 nd_tkt.3.t: "The Treasurer's Chest Reopened"
 nd_tkt.3.d: "The medieval Templar invention is revived in our chambers. A pilgrim or a Genoese factor deposits silver at the Tomar preceptory and withdraws bullion at Saragossa, Lyon, or Acre, all under the Treasurer-General's seal. The Convent debates the temper of its lending: a sober writ that sustains the Order's name, or an aggressive chest that fills the coffers but exposes the silver to default."
 nd_tkt.3.a: "Sober lending: the Treasurer's writ is gold."
 nd_tkt.3.b: "Aggressive lending: the Silver Chest is opened wide."
 STATIC_MODIFIER_NAME_nd_tkt_treasurers_writ: "The Treasurer's Writ"
 STATIC_MODIFIER_DESC_nd_tkt_treasurers_writ: "Bills of exchange under conservative Treasurer-General oversight. Lending is restrained; the Convent's name is good silver across Catholic Europe."
 STATIC_MODIFIER_NAME_nd_tkt_silver_chest: "The Silver Chest"
 STATIC_MODIFIER_DESC_nd_tkt_silver_chest: "Aggressive Templar lending: princes, bishops, and Italian houses borrow from the Convent's chambers. Returns are higher; the silver is exposed."

 # === DHE 4: Sagres Mandate ===
 nd_tkt.4.t: "The Sagres Mandate"
 nd_tkt.4.d: "The school of navigation at Cape Sagres is funded from the Convent's chambers, as Henry of Portugal funded it from the Order of Christ in our world's history. The brothers ask what the Atlantic mandate should mean. Some read it as a crusade: a flanking move down the Saharan coast around Granada and Marinid Morocco. Others read it as discreet commerce: gold-dust, ivory, and malagueta pepper running through Templar factories without a single proclamation."
 nd_tkt.4.a: "Outflank the Moor: the African coast is a crusading frontier."
 nd_tkt.4.b: "Quiet trade: the factories work in silence."
 STATIC_MODIFIER_NAME_nd_tkt_african_outflanking: "The African Outflanking"
 STATIC_MODIFIER_DESC_nd_tkt_african_outflanking: "Templar caravels work down the Saharan coast as a crusading flank. Reach and aggression rise; the diplomatic price is bluntness."
 STATIC_MODIFIER_NAME_nd_tkt_quiet_trade: "The Quiet Trade"
 STATIC_MODIFIER_DESC_nd_tkt_quiet_trade: "The Atlantic mandate redefined as discreet commerce. Gold-dust, ivory, malagueta pepper move through Templar factories without proclamation."

 # === DHE 5: Secret Chapter ===
 nd_tkt.5.t: "The Secret Chapter Codified"
 nd_tkt.5.d: "The closed initiations attributed to the medieval brotherhood, the rite of the cord, the kiss of obedience, the gnostic acclamations whispered in Provencal dialect, are codified as the Order's hidden discipline. The chapter-master asks what kind of brotherhood we should be. An open chapter that admits foreign postulants and dresses the rites as Marian devotion? Or an iron Iberian chapter, hereditary and closed?"
 nd_tkt.5.a: "Open chapter: foreign postulants admitted, rites dressed as Marian devotion."
 nd_tkt.5.b: "Iron chapter: hereditary, Iberian, closed."
 STATIC_MODIFIER_NAME_nd_tkt_open_chapter: "The Open Chapter"
 STATIC_MODIFIER_DESC_nd_tkt_open_chapter: "Foreign postulants admitted; the secret rites dressed as Marian devotion. The Convent gains a wide diplomatic net."
 STATIC_MODIFIER_NAME_nd_tkt_iron_chapter: "The Iron Chapter"
 STATIC_MODIFIER_DESC_nd_tkt_iron_chapter: "The chapter is hereditary, Iberian, and closed. Brothers swear the older oaths in Latin behind sealed doors. Discipline is iron; foreigners are kept at arm's length."

 # === DHE 6: Beausant ===
 nd_tkt.6.t: "The Beausant Raised"
 nd_tkt.6.d: "The Beausant gonfanon, black above white, the fair-and-foul war banner of the medieval brotherhood, is raised again over the Iberian companies. The chapter must decide whom to muster under it: the brother-knights of every commandery, drawn from clergy and minor nobility, or the broad lay confraternities (the milites Christi in minor orders) who supply the bulk of the Order's armed crews."
 nd_tkt.6.a: "Brother-knights: the elite commanderies in full strength."
 nd_tkt.6.b: "Confraternity militia: the lay brothers and minor orders."
 STATIC_MODIFIER_NAME_nd_tkt_brother_knight_levy: "Brother-Knight Levy"
 STATIC_MODIFIER_DESC_nd_tkt_brother_knight_levy: "Commanderies raise their full armed brotherhoods. Heavy cavalry and brother-knights take the field in numbers unseen since the Holy Land."
 STATIC_MODIFIER_NAME_nd_tkt_confraternity_militia: "Confraternity Militia"
 STATIC_MODIFIER_DESC_nd_tkt_confraternity_militia: "The lay confraternities are mustered alongside the brothers. The armies grow larger but less elite."

 # === DHE 7: Atlantic Factories ===
 nd_tkt.7.t: "The Factor-General of the Atlantic"
 nd_tkt.7.d: "The factories at Madeira, Arguin, and Sao Jorge da Mina, half banking-house, half armed stockade, multiply along the Saharan and Guinean coast. A standing officer, the Factor-General, is appointed at Lagos to coordinate gold-dust assays, malagueta consignments, and the slave-and-ivory accounts. The Order's overseas commerce gains a single coordinating hand."
 nd_tkt.7.a: "Lagos as the seat of the Atlantic factor."
 STATIC_MODIFIER_NAME_nd_tkt_factor_general: "Factor-General of the Atlantic"
 STATIC_MODIFIER_DESC_nd_tkt_factor_general: "A standing officer at Lagos rules over the Atlantic factories. The Order's overseas commerce gains a coordinated hand."

 # === DHE 8: Heretical Rumours ===
 nd_tkt.8.t: "The Baphomet Rumours"
 nd_tkt.8.d: "Three centuries after Philip the Fair's trial, the accusations have not died. Idol-worship, gnostic kissing rites, the bearded head called Baphomet venerated in chapter, brothers spitting on the cross at initiation: black legend that travels in pamphlets, sermons, and tavern talk from Lisbon to Lyon. The Convent must choose. Crush the rumours through inquisitorial purge? Or weaponise them into intelligence-network mystique?"
 nd_tkt.8.a: "Inquisitorial purge: crush the rumours, restore the Order's name."
 nd_tkt.8.b: "Whisper network: cultivate the mystique, let enemies fear what they cannot prove."
 STATIC_MODIFIER_NAME_nd_tkt_inquisitorial_purge: "Inquisitorial Purge"
 STATIC_MODIFIER_DESC_nd_tkt_inquisitorial_purge: "The Convent welcomes a Templar inquisition: heretical rumours are crushed publicly. Domestic confidence rises; the chapter's hidden lore is lost."
 STATIC_MODIFIER_NAME_nd_tkt_whisper_network: "The Whisper Network"
 STATIC_MODIFIER_DESC_nd_tkt_whisper_network: "The trial-era rumours are cultivated rather than crushed. The Convent's enemies fear what they cannot prove; intelligencers travel under cover of Baphomet-mystique."

 # === DHE 9: Templar Carrack ===
 nd_tkt.9.t: "The Cross on the Sail"
 nd_tkt.9.d: "The splayed cross-of-Christ, painted on the mainsail of every Templar carrack from Lagos to the Azores, becomes the universal sailmark of the Order's Atlantic fleet. The Lisbon and Lagos shipwrights are brought into the brotherhood as lay brothers; the ports' caulkers and rope-makers swear minor obedience. The Order's ships fly a sign that doubles as marine identification and sacramental claim."
 nd_tkt.9.a: "Paint every sail."
 STATIC_MODIFIER_NAME_nd_tkt_cross_on_sail: "Cross on the Sail"
 STATIC_MODIFIER_DESC_nd_tkt_cross_on_sail: "Every Templar carrack carries the splayed cross-of-Christ painted on its mainsail. The Order's maritime presence rises sharply; shipwright pops swear minor obedience."

 # === DHE 10: Cartulary ===
 nd_tkt.10.t: "The Codex Templariorum"
 nd_tkt.10.d: "The medieval cartularies of the Order, enormous parchment registries of charters, debts, estates, and judicial customs from every preceptory between Provence and the Tagus, are codified into a single written law of the brotherhood. The Codex Templariorum stands at the chapter-house: the constitutional foundation of a sovereign banking brotherhood."
 nd_tkt.10.a: "Bind the Codex in vellum and chain it to the lectern."
 STATIC_MODIFIER_NAME_nd_tkt_codex_templariorum: "The Codex Templariorum"
 STATIC_MODIFIER_DESC_nd_tkt_codex_templariorum: "The medieval cartularies codified into a written law of the brotherhood. The Convent's administration tightens; separatist drift abates."

 # === Advances ===
 nd_tkt_tomar_convent: "Tomar Convent"
 nd_tkt_tomar_convent_desc: "Master Gualdim Pais's twelfth-century fortress-monastery on the Nabantia hill is preserved as the Templar capital. Charola rotunda, ringed walls, and chapter-house unite cathedral, treasury, and royal court."
 nd_tkt_beausant_gonfanon: "Beausant Gonfanon"
 nd_tkt_beausant_gonfanon_desc: "The black-above-white war banner of the medieval brotherhood is raised again. Brother-knight commanderies muster their full heavy cavalry under the Beausant."
 nd_tkt_templar_sergeants: "Templar Sergeants"
 nd_tkt_templar_sergeants_desc: "The second-class brothers, recruited from non-noble pops as lay brothers. Lighter horse, less armor, but disciplined and free of the noble ban. Buildable light cavalry."
 nd_tkt_latin_rule: "The Latin Rule of Bernard"
 nd_tkt_latin_rule_desc: "The Rule of the Order, written by Bernard of Clairvaux at the Council of Troyes in 1129. Brother-knights live monastically: poverty, chastity, obedience under a single Master."
 nd_tkt_iberian_preceptories: "Iberian Preceptories"
 nd_tkt_iberian_preceptories_desc: "Local commanderies scattered across Aragon, Castile, and Portugal: each a fortified estate with treasury, chapel, and stables. The institutional cell of the Templar network."
 nd_tkt_bills_of_exchange: "Bills of Exchange"
 nd_tkt_bills_of_exchange_desc: "The medieval Templar invention reborn. A pilgrim or merchant deposits silver at one preceptory and withdraws bullion at another under the Treasurer-General's seal. The Order is again the Christian world's first international bank."
 nd_tkt_secret_chapter: "The Secret Chapter"
 nd_tkt_secret_chapter_desc: "The closed initiations attributed to the medieval Templars, the rite of the cord, the gnostic acclamations, the kiss of obedience, are codified as the Order's hidden discipline. The chapter cultivates a network of agents under cover of mystique."
 nd_tkt_cartulary: "The Cartulary"
 nd_tkt_cartulary_desc: "The medieval Templar registries, charters, debts, and estate customs from every preceptory between Provence and the Tagus, are modernised into double-entry ledgers and a unified judicial code."
 nd_tkt_order_galleys: "Order Galleys"
 nd_tkt_order_galleys_desc: "The slim oared galleys of the Aragonese and Catalan commanderies, retasked from Holy Land logistics to Iberian-Atlantic patrol. Buildable galley with cross-of-Christ sailmark."
 nd_tkt_treasurer_apparatus: "Brother-Treasurer Apparatus"
 nd_tkt_treasurer_apparatus_desc: "The office of the Treasurer-General at Tomar coordinates the Order's finances across all preceptories. The clergy estate gains a permanent stake in the Convent's revenue."
 nd_tkt_sagres_navigation_school: "Sagres Navigation School"
 nd_tkt_sagres_navigation_school_desc: "In alt-history funded directly from Tomar revenues, as Henry of Portugal funded it from the Order of Christ. Pilots, cartographers, and rutter-writers of the Atlantic, all in Templar habit."
 nd_tkt_templar_carrack: "Templar Carrack"
 nd_tkt_templar_carrack_desc: "The Atlantic carrack with the splayed cross-of-Christ painted on its mainsail. The signature ship of the Order's exploration mandate."
 nd_tkt_atlantic_factories: "Atlantic Factories"
 nd_tkt_atlantic_factories_desc: "Madeira, Arguin, and Sao Jorge da Mina: the armed trading-house at the end of every Atlantic voyage. Half banking-house, half stockade, wholly Templar."
 nd_tkt_cross_of_christ: "Cross of Christ"
 nd_tkt_cross_of_christ_desc: "The splayed Latin cross with thinner limbs replaces the older Templar emblem. Painted on every sail and pennon, it announces the Order's papal-sanctioned Atlantic mission."
 nd_tkt_lay_confraternity: "Lay Brothers' Confraternity"
 nd_tkt_lay_confraternity_desc: "The lay confraternities (laici fratres) attached to each commandery. Soldiers, laborers, and burghers swear minor obedience and supply the Order's overseas crews."
 nd_tkt_templar_bank: "Templar Bank"
 nd_tkt_templar_bank_desc: "The medieval Templar financial system reaches maturity. Bills of exchange, letters of credit, safe deposit, and inter-preceptory transfers, all under the Treasurer-General at Tomar."
 nd_tkt_baphomet_rumours: "Baphomet Rumours"
 nd_tkt_baphomet_rumours_desc: "The trial-era heretical accusations endure as black legend across Catholic Europe. The Convent decides to weaponise them: enemies fear what they cannot prove, and the brotherhood's intelligencers travel under cover of mystique."
 nd_tkt_factor_general_advance: "Factor-General"
 nd_tkt_factor_general_advance_desc: "The standing officer at Lagos governing the Order's Atlantic factories. A central administration for the Templar overseas mercantile system."
 nd_tkt_templar_galleon: "Templar Galleon"
 nd_tkt_templar_galleon_desc: "The full Atlantic galleon. Iberian hull, Aragonese fittings, brother-knight gunners. The Convent's standing battle-line."
 nd_tkt_captaincy_of_brothers: "Captaincy of Brothers"
 nd_tkt_captaincy_of_brothers_desc: "Madeira, Cape Verde, the Azores: each ruled by a knight-captain answering directly to the Tomar Convent. The militarised governorship of Atlantic colonies."
 nd_tkt_discount_bank: "Discount Bank"
 nd_tkt_discount_bank_desc: "The Order's bank evolves into a discount institution buying mercantile bills at face value before maturity. Transaction-based revenue scales with overseas trade."
 nd_tkt_tomar_cabinet: "Tomar Cabinet"
 nd_tkt_tomar_cabinet_desc: "The Convent's governing cabinet at the refounded Tomar fortress. Eight brothers under the Master manage policy, finance, and fleets."
 nd_tkt_templar_frigate: "Templar Frigate"
 nd_tkt_templar_frigate_desc: "The late sailing warship of the Order, lighter than the galleon, built for Atlantic patrol of the factory routes."
 nd_tkt_convent_arsenal: "Convent Arsenal"
 nd_tkt_convent_arsenal_desc: "The Order's shipyards on the Tagus and the Algarve. Galleons, frigates, and supply ships in continuous rotation; cordage and naval stores from Convent-owned pine forests."
 nd_tkt_industrial_bank: "Industrial Templar Bank"
 nd_tkt_industrial_bank_desc: "The Convent's bank survives into the age of paper money, joint-stock companies, and colonial commerce. Medieval bills of exchange evolve into modern instruments under the same eight-pointed cross."
 nd_tkt_convent_free_port: "Convent Free Port"
 nd_tkt_convent_free_port_desc: "The Tomar-Lagos-Faro corridor opened to international commerce. British, Dutch, and French ships put in under Convent flag, paying tolls into the Templar Treasury."
 nd_tkt_constitutional_brotherhood: "Constitutional Brotherhood"
 nd_tkt_constitutional_brotherhood_desc: "The Codex Templariorum rewritten as a constitution. The Master is constrained; the eight tongues' representatives sit in chapter; the brotherhood becomes a constitutional banking republic."

 # === Buildings ===
 nd_tkt_tomar_convent_building: "Tomar Convent"
 nd_tkt_tomar_convent_building_desc: "The Castelo dos Templarios on the Nabantia hill: ringed convent-fortress, Charola rotunda, chapter-house, Cloister of the Cemetery. The institutional and ceremonial heart of the brotherhood."
 nd_tkt_preceptory: "Templar Preceptory"
 nd_tkt_preceptory_desc: "The local commandery of the Order: barracks, treasury, chapel, stables, all behind a curtain wall. The institutional cell of the medieval Templar network."
 nd_tkt_banking_house: "Templar Banking House"
 nd_tkt_banking_house_desc: "Bills of exchange, letters of credit, safe deposit. The medieval Templar financial invention transposed to a sovereign banking institution. Silver and gold bullion underwrite the chamber's continental network of credit."
 nd_tkt_navigation_school: "Sagres Navigation School"
 nd_tkt_navigation_school_desc: "Pilots, cartographers, and rutter-writers of the Atlantic. The school of navigation funded directly from the Tomar Convent's chambers."
 nd_tkt_atlantic_factory: "Atlantic Factory"
 nd_tkt_atlantic_factory_desc: "The armed trading-house at the end of every Atlantic voyage. Half banking-house, half stockade, wholly Templar. Madeira, Arguin, Sao Jorge da Mina pattern."
 nd_tkt_chamber_of_credit: "Templar Chamber of Credit"
 nd_tkt_chamber_of_credit_desc: "The mature Templar bank. Continental clearing-house, safe deposit, letters of credit, discount on mercantile bills. Government-category, the financial cabinet of the Convent."
 nd_tkt_captaincy: "Brother-Captaincy"
 nd_tkt_captaincy_desc: "The militarised colonial governorship: Madeira, Cape Verde, Azores ruled by knight-captains answering directly to the Tomar Convent."
 nd_tkt_convent_arsenal_building: "Convent Arsenal"
 nd_tkt_convent_arsenal_building_desc: "The Order's shipyards on the Tagus and the Algarve. Galleons, frigates, and supply ships in continuous rotation; cordage and naval stores from Convent-owned pine forests."

 # === Building PM names ===
 nd_tkt_tomar_convent_maintenance: "Convent Maintenance"
 nd_tkt_tomar_convent_maintenance_desc: "Stone, masonry, parchment, and fine cloth keep the convent-fortress whole and the chapter-house furnished."
 nd_tkt_preceptory_maintenance: "Preceptory Maintenance"
 nd_tkt_preceptory_maintenance_desc: "Weaponry, tools, horses, and altar wine for the daily round of a Templar commandery."
 nd_tkt_banking_house_production: "Bullion Accounts"
 nd_tkt_banking_house_production_desc: "Silver and gold bullion held in the Templar vaults as collateral for bills of exchange and letters of credit. Tools and assay instruments maintain the chamber's daily operations."
 nd_tkt_navigation_school_maintenance: "School Maintenance"
 nd_tkt_navigation_school_maintenance_desc: "Parchment, books, beeswax, and furniture for the navigation school's pilots and cartographers."
 nd_tkt_atlantic_factory_maintenance: "Factory Maintenance"
 nd_tkt_atlantic_factory_maintenance_desc: "Naval supplies, ledger paper, weaponry, and cloth for the armed trading-house."
 nd_tkt_chamber_of_credit_maintenance: "Chamber Maintenance"
 nd_tkt_chamber_of_credit_maintenance_desc: "Parchment, books, beeswax, and furniture for the late-period Templar banking apparatus."
 nd_tkt_captaincy_maintenance: "Captaincy Maintenance"
 nd_tkt_captaincy_maintenance_desc: "Parchment, weaponry, horses, and furniture for the brother-knight captain's household."
 nd_tkt_convent_arsenal_maintenance: "Arsenal Maintenance"
 nd_tkt_convent_arsenal_maintenance_desc: "Lumber, naval supplies, tar, tools, and a few cannons keep the Order's shipyards in continuous rotation."

 # === Units ===
 a_nd_tkt_brother_knight: "Templar Brother-Knight"
 a_nd_tkt_brother_knight_desc: "The full brother-knight: lance, mail, the splayed cross, riding under the Beausant. Levied through the commandery system from clerical pops in minor orders."
 a_nd_tkt_sergeant: "Templar Sergeant"
 a_nd_tkt_sergeant_desc: "The second-class brother: lighter horse, leather, sword. Recruited from soldier and burgher pops as lay brothers in minor orders."
 n_nd_tkt_order_galley: "Order Galley"
 n_nd_tkt_order_galley_desc: "Slim Aragonese-pattern galley with the cross-of-Christ on the foresail. The Catalan corso pattern repurposed as Templar coastal power."
 n_nd_tkt_templar_carrack: "Templar Carrack"
 n_nd_tkt_templar_carrack_desc: "The Atlantic carrack with the splayed cross-of-Christ painted on its mainsail. The Order's Atlantic exploration ship."
 n_nd_tkt_templar_galleon: "Templar Galleon"
 n_nd_tkt_templar_galleon_desc: "The full Atlantic galleon: Iberian hull, Aragonese fittings, brother-knight gunners. The Convent's standing battle-line."
 n_nd_tkt_templar_frigate: "Templar Frigate"
 n_nd_tkt_templar_frigate_desc: "The late sailing patrol frigate of the Order, lighter than the galleon, built for Atlantic-factory route patrol."

 # === Levies ===
 levy_nd_tkt_brother_knight: "Brother-Knight Levy"
 levy_nd_tkt_brother_knight_desc: "Heavy cavalry levy raised from clerical brothers under minor orders. The Order's elite mounted strike force."

 # === Event variable tooltips ===
 nd_tkt_formed_tt: "the Knights of the Temple have been formed"
 nd_tkt_path_a_tt: "the Old Order Restored path"
 nd_tkt_path_b_tt: "the New Order of Christ path"
 nd_tkt_continental_clearing_house: "Continental Clearing-House"
 nd_tkt_continental_clearing_house_desc: "The Templar bank as the settlement institution of European inter-state finance. Bills of exchange from London, Amsterdam, Marseille, and Hamburg clear through Tomar's chamber. The brotherhood's prestige rests on the silver chest of Christendom."

 # ============================================================
 # === DESTINY TREE ===
 # Post-formation mission tree: root + 2 paths x 3 stages.
 # ============================================================

 # === Destiny advance names and descriptions ===
 nd_tkt_destiny: "Destiny of the Brotherhood"
 nd_tkt_destiny_desc: "The Convent's refoundation calls for a long-term project. The brotherhood's institutional discipline holds; now the chapter sets its eye on a destiny: the secret-chapter banking shadow-empire over Catholic Europe, or the public Atlantic imperium of the cross-of-Christ."

 # Path A
 nd_tkt_dest_continental_commanderies: "Continental Commanderies"
 nd_tkt_dest_continental_commanderies_desc: "The medieval Templar heartland. Restore the Provencal preceptories around #bold Avignon#! and the Champagne mother-house at #bold Troyes#!, where Bernard wrote the Latin Rule in 1129. The continental commandery network is the spine of the shadow-empire."
 nd_tkt_dest_court_penetration: "Catholic-Court Penetration"
 nd_tkt_dest_court_penetration_desc: "The royal treasuries of #bold Paris#! and #bold Barcelona#! take Templar credit. The Convent's Treasurer-General becomes the silent intermediary of Catholic state finance. Embrace #bold Banking#!, accumulate #bold 2000 gold#!, and bind the courts to the chamber."
 nd_tkt_dest_shadow_empire: "The Templar Shadow-Empire"
 nd_tkt_dest_shadow_empire_desc: "Hold #bold London#!, #bold Rome#!, and #bold Lyon#!: the great Catholic courts, the papal seat, and the Rhone-Saone banking artery all pass through Tomar's chamber. With #bold 3000 gold#! and #bold 75 prestige#!, the Grand Chapter rises as the Convent's secret heart."

 # Path B
 nd_tkt_dest_atlantic_islands: "The Atlantic Islands Secured"
 nd_tkt_dest_atlantic_islands_desc: "The three island-clusters from which the Atlantic wind-routes are commanded: #bold Funchal#! in Madeira, #bold Ponta Delgada#! in the Azores, and #bold Teguise#! in the Canaries. The Templar habit replaces the older flags above the harbors."
 nd_tkt_dest_african_outposts: "The African Atlantic Outposts"
 nd_tkt_dest_african_outposts_desc: "Hold #bold Arguin#! on the Mauritanian coast and #bold Cabo Corso#! on the Gold Coast. Embrace #bold Global Trade#! and accumulate #bold 2000 gold#!. The factor-system drives gold-dust, malagueta, and ivory through the Convent's ledgers."
 nd_tkt_dest_atlantic_imperium: "The Trans-Atlantic Templar Imperium"
 nd_tkt_dest_atlantic_imperium_desc: "Hold #bold Sao Tome#! on the equator and #bold Maxorata#! in the southern Canaries. Embrace #bold Manufactories#!, hold #bold 3000 gold#! and #bold 75 prestige#!, and trade #bold sugar#! through the capital market. The Atlantic Captain-General's Hall rises at Lagos."

 # === Destiny event titles, descriptions, options ===
 # Destiny root acknowledgement
 nd_tkt.11.t: "The Convent Settles its Long-Term Course"
 nd_tkt.11.d: "The chapter has met behind the closed doors of the Charola. The brotherhood's institutional discipline holds; the silver is in its chest; the brother-knights are in their commanderies; the cross-of-Christ flies from Tomar to Sines. The chapter-master poses the question that has waited since the Vox in excelso was lifted: what is the long-term project of the Order? The Templar Imperium of the medieval banker-knight, or the Atlantic Empire of the Order of Christ?"
 nd_tkt.11.a: "Set the brotherhood on its destiny."

 # Path A Stage 1
 nd_tkt.12.t: "The Continental Commanderies Restored"
 nd_tkt.12.d: "Avignon's preceptory rides under the eight-pointed cross again; the mother-house at Troyes, where Bernard's Rule was set down in 1129, opens its chapter-doors after a hundred years of silence. The medieval Templar heartland of Provence and Champagne is institutional once more, and the Convent's brother-knights ride the old commandery-roads of Catholic Europe."
 nd_tkt.12.a: "Convene the chapter at Troyes."

 # Path A Stage 2
 nd_tkt.13.t: "The Catholic Courts Take the Convent's Credit"
 nd_tkt.13.d: "The royal treasuries of #bold Paris#! and #bold Barcelona#! take their loans from Tomar's chambers. The brothers debate the temper of the Convent's reach. Should the Treasurer-General cultivate a quiet, networked influence, hidden in audit-books and discreet advisors? Or should the chapter consolidate hereditary discipline at home, the iron Iberian brotherhood at full strength behind the Templar bank?"
 nd_tkt.13.a: "The Treasurer's court network: discreet, advisorial, audit-driven."
 nd_tkt.13.b: "The Iron Brotherhood: hereditary, levied, disciplined."

 # Path A Stage 3
 nd_tkt.14.t: "The Templar Shadow-Empire Complete"
 nd_tkt.14.d: "London's Treasury, Rome's Camera Apostolica, and Lyon's bourse all settle through Tomar. The brotherhood is the silent magistracy of Catholic state finance. The chapter must decide its public face: a silent dominion, moving by lightning annexations and unseen hands? Or an openly proclaimed Grand Magisterium, the Order acknowledged as Catholic Europe's banking magistracy?"
 nd_tkt.14.a: "The Silent Dominion: forced marches, lightning annexations, unseen hand."
 nd_tkt.14.b: "The Grand Magisterium: open, magisterial, the brotherhood in honor."

 # Path B Stage 1
 nd_tkt.15.t: "The Atlantic Islands Under the Cross"
 nd_tkt.15.d: "Funchal's harbor in Madeira, Ponta Delgada's roadstead in the Azores, Teguise's stone wharf in the Canaries: three island-clusters under the splayed cross-of-Christ. The Atlantic wind-routes, the trade-winds and the westerlies that command every voyage between Europe and the southern coast, are now ours to enter and leave at will."
 nd_tkt.15.a: "The Atlantic is opened to the brotherhood."

 # Path B Stage 2
 nd_tkt.16.t: "Arguin and Cabo Corso"
 nd_tkt.16.d: "The factor at Arguin counts the malagueta; the chapel at Cabo Corso (Sao Jorge da Mina) blesses the gold-dust into Tomar's seal. The brothers debate the African mandate. Should the Convent press it as a Mauritanian crusade, the cross-of-Christ at the prow of caravels burning Marinid harbors? Or run a quiet factor's circuit, ledger-driven, under the cover of Templar coin?"
 nd_tkt.16.a: "The Mauritanian Crusade: a flank around Granada and the Marinids."
 nd_tkt.16.b: "The Factor's Circuit: silver and ivory, no proclamation."

 # Path B Stage 3
 nd_tkt.17.t: "The Atlantic Imperium of the Cross"
 nd_tkt.17.d: "Sao Tome's equatorial church flies the cross-of-Christ above the sugar-mills; Maxorata's stone factor-house is the southernmost watch of the Canaries. Tomar's manufactories refine colonial silver into the Order's coin. The chapter raises the Atlantic Captain-General's Hall at Lagos and debates its institutional form: a hardened sugar-armada under brother-captains, or a chartered colonial brotherhood that opens the islands to migration and burgher-trade?"
 nd_tkt.17.a: "The Sugar Armada: brother-captains, convoyed fleets, hardened naval order."
 nd_tkt.17.b: "The Chartered Brotherhood: charters, migrants, bank branches."

 # === Destiny timed modifier names and descriptions ===
 STATIC_MODIFIER_NAME_nd_tkt_dest_treasurers_court_network: "The Treasurer's Court Network"
 STATIC_MODIFIER_DESC_nd_tkt_dest_treasurers_court_network: "The Convent's chambers hold the silver of the Catholic courts. Loan capacity grows; advisor cultivation cheapens. Naval matters are neglected in the chamber-house's shadow."
 STATIC_MODIFIER_NAME_nd_tkt_dest_iron_brotherhood: "The Iron Brotherhood"
 STATIC_MODIFIER_DESC_nd_tkt_dest_iron_brotherhood: "The chapter is hereditary, Iberian, and disciplined. Nobles' commanderies levy at full strength; the clergy estate's tithe runs through the Convent's audit; brother-knights recover quickly between battles."
 STATIC_MODIFIER_NAME_nd_tkt_dest_silent_dominion: "The Silent Dominion"
 STATIC_MODIFIER_DESC_nd_tkt_dest_silent_dominion: "The shadow-empire moves in silence. Brother-knight columns force-march; minor courts are annexed before they can call for help. Supply lines stretch thin in the rush."
 STATIC_MODIFIER_NAME_nd_tkt_dest_grand_magisterium: "The Grand Magisterium"
 STATIC_MODIFIER_DESC_nd_tkt_dest_grand_magisterium: "The Convent rules openly as Catholic Europe's banking magistracy. Brother-knight tradition is preserved across campaigns; the peasantry under Templar lordship prosper."
 STATIC_MODIFIER_NAME_nd_tkt_dest_mauritanian_crusade: "The Mauritanian Crusade"
 STATIC_MODIFIER_DESC_nd_tkt_dest_mauritanian_crusade: "The Sagres mandate read as a crusade. Templar caravels burn Marinid harbors along the Saharan coast; the Order's naval prestige rises with every sail."
 STATIC_MODIFIER_NAME_nd_tkt_dest_factor_circuit: "The Factor's Circuit"
 STATIC_MODIFIER_DESC_nd_tkt_dest_factor_circuit: "Gold-dust, malagueta, and ivory run through the Convent's ledgers. Trade lanes are protected; burgher pops circulate. The military leadership pool atrophies as silver replaces sword."
 STATIC_MODIFIER_NAME_nd_tkt_dest_sugar_armada: "The Sugar Armada"
 STATIC_MODIFIER_DESC_nd_tkt_dest_sugar_armada: "The Madeiran sugar fleets sail under Templar convoy. Caravels and galleons run home to the Algarve with their holds full; on-station repair masters keep the fleet at sea."
 STATIC_MODIFIER_NAME_nd_tkt_dest_atlantic_chartered_brotherhood: "The Atlantic Chartered Brotherhood"
 STATIC_MODIFIER_DESC_nd_tkt_dest_atlantic_chartered_brotherhood: "The Convent issues colonial charters under its own seal. Migrants flock to the islands and the Atlantic factories; the Templar bank's town-branches multiply along the trade lanes."

 # === Destiny capstone buildings ===
 nd_tkt_grand_chapter: "Grand Chapter"
 nd_tkt_grand_chapter_desc: "The Convent's secret heart: the closed chapter-house behind the Charola rotunda, where the hereditary brothers and the silent Treasurer-General convene over the European debt-ledgers. The institutional pinnacle of the Templar Shadow-Empire."
 nd_tkt_grand_chapter_maintenance: "Grand Chapter Maintenance"
 nd_tkt_grand_chapter_maintenance_desc: "Parchment, books, fine cloth, and beeswax for the chapter's hidden audit-rooms and the Treasurer-General's private session."
 nd_tkt_atlantic_captain_general: "Atlantic Captain-General's Hall"
 nd_tkt_atlantic_captain_general_desc: "The military-mercantile cabinet of the Atlantic empire at Lagos. Brother-knight captains of every Atlantic colony report; charters are stamped, fleets dispatched, audits heard. The institutional pinnacle of the Atlantic Imperium."
 nd_tkt_atlantic_captain_general_maintenance: "Captain-General Maintenance"
 nd_tkt_atlantic_captain_general_maintenance_desc: "Parchment, naval supplies, weaponry, and furniture for the Captain-General's command and the captain-knight's quarters."

 # ============================================================
 # === BUREAUCRACIES ===
 # ============================================================

 tkt_sacred_convent_bureaucracy: "Sacro Capitulo Generale"
 tkt_sacred_convent_bureaucracy_desc: "The Sacred Convent General Chapter, the constitutional hub of the brotherhood. Under the Latin Rule of Bernard (Council of Troyes 1129) the Master is elected by the Convent and rules by the consent of the Chapter, which sits annually at Tomar to confirm magistral measures, judge breaches of Rule, and admit postulants. Its members are the Provincial Masters of Aragon, Castile, Portugal, and Provence-in-exile, with the conventual officers (the Seneschal, Marshal, Drapier, Almoner, Treasurer). Magistral acts taken without Chapter consent are nullified by the Visitor-General, the Order's standing auditor of commanderies."
 tkt_treasurer_general_bureaucracy: "Apparatus Thesaurarii"
 tkt_treasurer_general_bureaucracy_desc: "The Treasurer-General Apparatus, the Order's signature institution and the first international banking corporation of medieval Christendom. The preceptories of every province hold vaults open to deposit; a pilgrim or factor depositing silver at one preceptory withdraws bullion at another under a sealed bill of exchange. The Apparatus takes fees on transfer, lends on bond to crowned heads (Philip II of France banked his ransom of the Plantagenets through the Paris house; James I of Aragon mortgaged his crown jewels through Barcelona), and holds the mortuaries of deceased brothers. Its officers are chaplain-clerks under monastic discipline."
 tkt_capitulum_occultum_bureaucracy: "Capitulum Occultum"
 tkt_capitulum_occultum_bureaucracy_desc: "The Secret Chapter. The trial of 1307-1314 fixed in Catholic memory the rumour of a hidden inner chapter beneath the open conventual one: closed initiations under sealed doors, the rite of the cord, the kiss of obedience, the gnostic acclamations whispered in Provencal dialect. Refounded as the sovereign Order's standing inquiry chamber at Tomar, the Capitulum Occultum audits the brothers' own loyalty, runs intelligencers under cover of preceptory-business, and weaponises the Baphomet-rumour heritage into mystique that travels in pamphlets and tavern-talk from Lisbon to Lyon. Its officers answer only to the Master."
 tkt_capitanias_do_mar_bureaucracy: "Capitanias do Mar"
 tkt_capitanias_do_mar_bureaucracy_desc: "The Maritime Captaincies, built on the alt-history Order of Christ inheritance from Henry of Sagres. The system divides every Atlantic colony into hereditary captaincy-grants under brother-knight donatarios: Madeira (Funchal, Machico), the Azores, Sao Tome, and the African factor-coast at Arguin and Cabo Corso. Each is governed by a knight-captain who answers to the Lagos Factor-General and through him to the Tomar Convent. The captain holds judicial, fiscal, and military authority over the captaincy in exchange for a tenth of revenues to the Treasurer-General. The pattern is half-feudal, half-conventual; it is the Order's actual instrument of Atlantic empire."

 AUTO_MODIFIER_NAME_nd_tkt_bureaucracy_authority: "Magistral Authority"
 AUTO_MODIFIER_DESC_nd_tkt_bureaucracy_authority: "The Convent at Tomar may institute up to three permanent bureaucratic offices, drawn from the Sacred Convent General Chapter, the Treasurer-General Apparatus, the Capitulum Occultum, and the Maritime Captaincies — the four pillars of the alt-history sovereign Templar state."
 STATIC_MODIFIER_NAME_nd_tkt_militant_brotherhood: "Sovereign Order of the Temple"
 STATIC_MODIFIER_DESC_nd_tkt_militant_brotherhood: "The brotherhood's institutional core: brother-knights and sergeants bound by Bernard's Rule, the chapter convened in secret session, the Master elected for life. Clergy lead the Templar host; the commanderies and convent-fortresses stand fortified beyond any secular kingdom; the Order's character drifts toward holy war by founding charter. The Order cannot be converted away from Catholic faith. Vanilla military_order_reform may be activated formally via the Government tab to lock in the title."
