l_english:
 NIN: "Assyrian Empire"
 NIN_ADJ: "Assyrian"
 NIN_f: "Assyrian Empire"
 NIN_f_desc: "Athur reborn. Where the Patriarchate of the East and the monastic networks of Tur Abdin furnish the political continuity, the Sargonid imperial template furnishes the form: Nineveh as capital, a professional standing army, an Aramaic civil service, and the deportation-and-integration administration that once bound Babylon, the Levant, and Memphis under one crown. This is what the Neo-Assyrian Empire might have looked like had it survived through the Catholicate of Seleucia-Ctesiphon — a counterfactual revival of the 671 BC peak under Esarhaddon and Ashurbanipal, channeled through medieval Syriac Christian institutions and crowned at Nineveh."
