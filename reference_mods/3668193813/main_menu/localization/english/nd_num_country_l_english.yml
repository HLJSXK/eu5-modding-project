l_english:
 NUM: "Comancheria"
 NUM_ADJ: "Comanche"
 NUM_f: "Comancheria"
 NUM_f_desc: "Form Numunu Sookobitu, the Comanche country, as a sovereign Plains-horse empire. From the Llano Estacado heartland the paraibos and tekwuniwapi unite the Penateka, Yamparika, Quahadi, Nokoni, and Kotsoteka divisions into a single confederation, extracting tribute from the borderlands and turning the bison economy into the foundation of a continental power. This is the Comanche Empire as Pekka Hämäläinen described it: an Indigenous state that imposed its will on the Southern Plains for a century and a half, made permanent."
