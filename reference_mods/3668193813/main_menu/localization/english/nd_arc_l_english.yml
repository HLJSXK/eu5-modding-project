l_english:
 # === Static Modifiers ===
 STATIC_MODIFIER_NAME_nd_arc_apostolic_sanctuary: "Apostolic Sanctuary"
 STATIC_MODIFIER_DESC_nd_arc_apostolic_sanctuary: "The kingdom remains the Apostolic shield. The Catholicos of Sis presides without union, the Hethumid crown defends the older theology, and the realm gathers strength from the cohesion of an undivided national church. Latin courts grumble; the people stand."
 STATIC_MODIFIER_NAME_nd_arc_latin_union: "Latin Union of Sis"
 STATIC_MODIFIER_DESC_nd_arc_latin_union: "The Council of Sis swears its oath to Rome. Latin merchants pour into Ayas under the cross of union, the chivalric houses send their younger sons to serve at court, and Cyprus and the Crusader states open their galleys to the Cilician banner. Highland monasteries mutter against the betrayal."
 STATIC_MODIFIER_NAME_nd_arc_levon_crown: "The Crown of Levon"
 STATIC_MODIFIER_DESC_nd_arc_levon_crown: "Pope Celestine III and Emperor Henry VI both sent crowns to Tarsus. Levon was a king the world recognized."
 STATIC_MODIFIER_NAME_nd_arc_genoese_partners: "Genoese Partners"
 STATIC_MODIFIER_DESC_nd_arc_genoese_partners: "The Republic of San Giorgio takes the warehouses at Mopsuestia. The kingdom's iron, timber, and spices move under the lion of Genoa."
 STATIC_MODIFIER_NAME_nd_arc_venetian_partners: "Venetian Partners"
 STATIC_MODIFIER_DESC_nd_arc_venetian_partners: "Venice signs at Ayas. In 1301 alone the galleys carry ninety thousand ducats of trade through the harbour."
 STATIC_MODIFIER_NAME_nd_arc_steppe_brotherhood: "Steppe Brotherhood"
 STATIC_MODIFIER_DESC_nd_arc_steppe_brotherhood: "Hethum I rode to Karakorum. The Mongol-Armenian alliance presses its case against the Mamluks; the kingdom hunts beside the Ilkhanate."
 STATIC_MODIFIER_NAME_nd_arc_hedged_diplomacy: "Hedged Diplomacy"
 STATIC_MODIFIER_DESC_nd_arc_hedged_diplomacy: "The Mongol embrace is useful but never trusted. The crown builds its own walls, repairs its own harbours, and remembers that allies depart."
 STATIC_MODIFIER_NAME_nd_arc_patriarchal_seat: "Patriarchal Seat"
 STATIC_MODIFIER_DESC_nd_arc_patriarchal_seat: "The Catholicos resides in the kingdom. Where the patriarch sits, the spiritual centre of the Armenian world is."
 STATIC_MODIFIER_NAME_nd_arc_royal_banneret: "Royal Banneret"
 STATIC_MODIFIER_DESC_nd_arc_royal_banneret: "Knighthoods bound to the crown, sworn to the Hethumid banner. A standing chivalric host, paid by the king's purse, drilled to royal command."
 STATIC_MODIFIER_NAME_nd_arc_frontier_orders: "Frontier Orders"
 STATIC_MODIFIER_DESC_nd_arc_frontier_orders: "Crusader military orders entrusted with the marches. Hospitallers at Selefkia, Templars at Bagras, Teutonics at Harunia: an iron belt against the Mamluk."
 STATIC_MODIFIER_NAME_nd_arc_island_kingdom: "Island Kingdom"
 STATIC_MODIFIER_DESC_nd_arc_island_kingdom: "The Lusignan house union with Cyprus binds two crowns into one Mediterranean realm. Famagusta to Ayas, one fleet, one banner, one royal house."

 # === Formation Event ===
 nd_arc.1.t: "The Council of Sis"
 nd_arc.1.d: "The crown of Sis is set; the kingdom holds. Yet the prelates have come to the citadel with a question that cannot be deferred. For two centuries the Apostolic Church has stood apart from Chalcedon and from Rome alike, the older theology preserved by mountains and martyrs. Now the Latins offer aid in exchange for union, the Crusaders speak of one obedience, the Italian merchants ask whose chapel they may use in Ayas. The highland clergy refuse: better the Mamluk than the Pope, better isolation than the loss of the kingdom's soul. The barons in Frankish surcoats answer them: better Cyprus than ruin, better the Pope than the desert. Two paths open before the Catholicate; both are the kingdom's life.\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_arc.1.a: "Apostolic Sanctuary: keep the kingdom undivided in faith"
 nd_arc.1.b: "Latin Union of Sis: open the realm to Crusader Christendom"

 # === DHE Events ===
 nd_arc.2.t: "The Crown at Tarsus"
 nd_arc.2.d: "On 6 January 1198, in the cathedral of Tarsus, Levon the Magnificent received from the hands of the Archbishop of Mainz the crown that Emperor Henry VI had sent him, and from a separate legate the crown that Pope Celestine III had likewise sent. He stood as king before the Latin world and the Greek world together; the kingdom that had been only an Armenian principality became a kingdom of Christendom. Coinage struck at Sis bore his crowned image, charters were sealed in five languages, and the chronicles of three churches recorded his accession. The Hethumid line that followed inherited a kingdom that the world acknowledged."
 nd_arc.2.a: "By the grace of God, a king."

 nd_arc.3.t: "The Italian Concessions"
 nd_arc.3.d: "Genoa and Venice both press their case at Sis. Each republic offers customs exemptions, naval cooperation, fortified quarters; each demands the better warehouses, the lower duties, the right of consul. The treaties of 1201, 1215, and 1245 lie open in the chancery, ready for renewal under whichever lion the crown prefers. The kingdom cannot serve both republics with the same favour. The choice will define which Italian fleet considers the Levant its sea."
 nd_arc.3.a: "To Genoa: the warehouses of Mopsuestia"
 nd_arc.3.b: "To Venice: the galleys of Ayas"

 nd_arc.4.t: "The Embassy to Karakorum"
 nd_arc.4.d: "In 1254 Hethum I rode east through the Mongol lands to the court of the Great Khan Möngke. He covered four thousand miles and was received in audience for fifty days. He returned with promises: that Christian churches in Mongol-held lands would be tax-exempt, that Cilicia and the Ilkhanate would campaign together against the Mamluks, that Jerusalem might one day be Christian again. The Mongol-Armenian alliance, sealed by that journey, shaped the kingdom's strategy for a century. The question is how far to commit."
 nd_arc.4.a: "Press the alliance: stake everything on the steppe brotherhood"
 nd_arc.4.b: "Use the alliance, but never depend on it"

 nd_arc.5.t: "The Catholicate at Hromkla"
 nd_arc.5.d: "When the Seljuks closed the highlands, the Catholicos of the Armenian Apostolic Church withdrew westward. The seat moved to Hromkla on the Euphrates, then to Sis itself. Where the patriarch sits, the spiritual capital of the Armenian world is; and where the Hethumid crown sits, the patriarch now resides. Bishops from Anatolia, Cilicia, and the diaspora come to Sis for confirmation. The kingdom is no longer merely a refuge for the church: it is the church's seat. Pilgrim coins fill the offering plates, monastic libraries fatten, and the Catholicate's blessing legitimizes the crown."
 nd_arc.5.a: "The crown and the cross, in one city."

 nd_arc.6.t: "The Knightly Orders of the Crown"
 nd_arc.6.d: "Under the Lusignan kings, the chivalric culture of Outremer is grafted formally onto the Hethumid military system. Tournaments are proclaimed at Sis, heralds register coats of arms, and the orders of the Cross of Cilicia and the Knights of Saint Thaddeus are organized. The question is whether to bind the orders directly to the crown as a royal banneret, or to grant frontier castles to the established Crusader orders and let them defend the marches in their own discipline. Both produce knights; the difference is who commands them."
 nd_arc.6.a: "Royal banneret: knighthoods bound to the crown"
 nd_arc.6.b: "Frontier orders: Hospitallers and Templars on the marches"

 nd_arc.7.t: "The Cypriot Concord"
 nd_arc.7.d: "The Lusignans of Cyprus and the Lusignans of Cilicia are the same house. Marriages, partitions, and successions interweave the crowns; in time, the same banner flies above Sis and Famagusta. The Concord formalizes the union: shared admiralty, shared customs, shared diplomacy. The kingdom of Cilicia ceases to be a peninsula on a hostile coast; it becomes one half of a maritime realm whose other half is an island fortress in the eastern Mediterranean. The dream the Mamluks broke in 1375 is restored as policy."
 nd_arc.7.a: "One house, one sea."

 # === Advances ===
 nd_arc_kingship_of_levon: "Kingship of Levon"
 nd_arc_kingship_of_levon_desc: "The crown sent by both Emperor Henry VI and Pope Celestine III in 1198 made the Cilician principality a kingdom recognized by the whole of Christendom. The royal seat at Sis became the heart of an internationally legitimate Armenian state."
 nd_arc_cilician_knights: "Cilician Knights"
 nd_arc_cilician_knights_desc: "Frankish chivalric culture grafted onto the older Armenian aznavur cavalry. Lance and kite shield, tournament and tournament-fashioned battle, an Armenian-Latin hybrid that fought as well as any Crusader heavy horse."
 nd_arc_mavragort_levy: "Mountain Mavragort"
 nd_arc_mavragort_levy_desc: "The Cilician highlands behind the coastal plain are still Armenian by stock and Apostolic by faith. From them the kingdom raises hardy infantry suited to the broken country of the Taurus passes."
 nd_arc_pilgrim_crossroads: "Pilgrim Crossroads"
 nd_arc_pilgrim_crossroads_desc: "Drazark monastery, Tarsus the city of Saint Paul, the road to Jerusalem: the kingdom sits at the western edge of the Armenian world and the eastern edge of the Latin one. Pilgrims cross both ways, and their offerings build a culture."
 nd_arc_catholicate_of_sis: "Catholicate of Sis"
 nd_arc_catholicate_of_sis_desc: "The patriarchal seat of the Armenian Apostolic Church moves to Cilicia. Where the Catholicos sits, the spiritual centre of the Armenian world is; and from 1293, that seat is at Sis itself."
 nd_arc_italian_concessions: "Italian Concessions"
 nd_arc_italian_concessions_desc: "Treaties with Pisa, Genoa, and Venice grant Italian merchants tax exemptions, fondachi, and consular jurisdiction. The kingdom's customs revenues swell; in 1301 alone the Venetian galleys move ninety thousand ducats through Ayas."
 nd_arc_mongol_alliance: "Mongol Alliance"
 nd_arc_mongol_alliance_desc: "Hethum I's journey to Karakorum in 1254 forged a strategic axis with the Mongols against the Mamluk sultanate. The kingdom became the Ilkhanate's western flank in Christian war."
 nd_arc_hethumid_constabulary: "Hethumid Constabulary"
 nd_arc_hethumid_constabulary_desc: "Smbat the Constable, brother of King Hethum I, codified the kingdom's military law in his Antioch Assises. The royal cavalry corps drilled to a single discipline, accountable to a single command."
 nd_arc_korikos_galleys: "Korikos Galleys"
 nd_arc_korikos_galleys_desc: "The fortified harbour at Korikos was both castle and royal arsenal. The royal fleet wintered there, supplying the kingdom's galley-based naval doctrine."
 nd_arc_lusignan_chivalry: "Lusignan Chivalry"
 nd_arc_lusignan_chivalry_desc: "The Lusignan kings of the late Cilician period imported the high chivalric culture of Outremer in full: tournaments, heralds, knightly orders, and a self-conscious crusading identity to match Latin Christendom."
 nd_arc_smpadagirk: "Smpadagirk"
 nd_arc_smpadagirk_desc: "Smbat the Constable's law book, compiled in 1265 from Roman, canon, Frankish, and Armenian sources. The first systematic codification of Cilician civil and criminal law."
 nd_arc_silk_road_terminus: "Silk Road Terminus"
 nd_arc_silk_road_terminus_desc: "The caravan routes from the steppe and from China terminated at Ayas. Marco Polo entered Asia through this port; the Silk Road's western mouth was Cilician."
 nd_arc_cypriot_concord: "Cypriot Concord"
 nd_arc_cypriot_concord_desc: "The Lusignan house ruled both Cyprus and Cilicia. Intermarriage, succession compacts, and shared admiralty wove the two crowns into a single Mediterranean dynastic project."
 nd_arc_order_commanderies: "Order Commanderies"
 nd_arc_order_commanderies_desc: "Hospitaller, Templar, and Teutonic fortifications studded the Cilician marches. The orders held Bagras, Trapessac, T'il Hamtun, Selefkia, and Sarvandikar in cooperation with the crown."
 nd_arc_crusader_galleon: "Crusader Galleon"
 nd_arc_crusader_galleon_desc: "The heavy galleon-class warship adopted from Italian and Aragonese yards. Cilician shipwrights, with access to Taurus timber and Italian designs, produced ocean-capable Mediterranean vessels."
 nd_arc_tax_farmer_nakharars: "Tax-Farmer Nakharars"
 nd_arc_tax_farmer_nakharars_desc: "The Hethumid crown bound the noble nakharar houses to royal fiscal administration. Tax-farming privileges were granted in exchange for sworn loyalty and military service."
 nd_arc_apostolic_synodics: "Apostolic Synodics"
 nd_arc_apostolic_synodics_desc: "The Apostolic schools at Sis answered the Latin schoolmen with their own systematic theology. Synodic colleges trained clergy in patristics, in canon law, and in disputation with Rome."
 nd_arc_levantine_thalassocracy: "Levantine Thalassocracy"
 nd_arc_levantine_thalassocracy_desc: "The kingdom that survived 1375 by mastering the sea fulfills its long ambition: the eastern Mediterranean as Cilician water, from Cyprus to Antioch to Alexandria's road."
 nd_arc_constitutional_catholicosate: "Constitutional Catholicosate"
 nd_arc_constitutional_catholicosate_desc: "A council-state where the patriarch of Sis sits with the king and the high nobles. Conscience and crown in one chamber, the Apostolic Church as constitutional partner."
 nd_arc_diaspora_networks: "Armenian Diaspora Networks"
 nd_arc_diaspora_networks_desc: "Armenian merchant houses spread across Europe, India, and Persia under the patronage of Sis. The crown sponsors trading colonies, sends consuls, and channels remittances home."
 nd_arc_mekhitarist_press: "Mekhitarist Press"
 nd_arc_mekhitarist_press_desc: "Mekhitar of Sebaste's Catholic Armenian congregation, fused with the Sis Apostolic schools, drives a printing revolution: dictionaries, grammars, classical translations, and a national periodical press."
 nd_arc_industrial_combinats: "Cilician Industrial Combinats"
 nd_arc_industrial_combinats_desc: "Iron from the Taurus, copper from the Anti-Taurus, lumber from the cedar slopes, and naval supplies from the coast: integrated industrial complexes anchor the late kingdom's economy."
 nd_arc_civic_order: "Mediterranean Civic Order"
 nd_arc_civic_order_desc: "A constitutional crown of Sis, where Apostolic Church, hereditary nobility, mercantile burghers, and royal cabinet share governance under codified civic law."

 # === Buildings ===
 nd_arc_sis_citadel: "Sis Citadel"
 nd_arc_sis_citadel_desc: "The Hethumid royal seat carved into the cliffs above Sis. Within its walls the king of Armenia held court, the Catholicos resided, and the army of the kingdom mustered."
 nd_arc_drazark_monastery: "Drazark Monastery"
 nd_arc_drazark_monastery_desc: "The Hethumid royal monastery in the Taurus foothills, scriptorium and necropolis of the dynasty. Its libraries preserved the kingdom's literary memory."
 nd_arc_hromkla_catholicate: "Catholicate Seat"
 nd_arc_hromkla_catholicate_desc: "The patriarchal residence of the Armenian Apostolic Church. From Hromkla on the Euphrates and ultimately at Sis itself, the Catholicos governed the Armenian church."
 nd_arc_ayas_customhouse: "Ayas Customhouse"
 nd_arc_ayas_customhouse_desc: "The fortified port of Ayas was the kingdom's wealth in stone form. Italian galleys, Mongol caravans, and pilgrim ships all paid their dues here."
 nd_arc_mopsuestia_emporium: "Mopsuestia Emporium"
 nd_arc_mopsuestia_emporium_desc: "The river entrepot on the Pyramus where Genoese warehouses received Cilician timber and iron, and Silk Road caravans deposited spices and silk for shipment west."
 nd_arc_order_commandery: "Order Commandery"
 nd_arc_order_commandery_desc: "A frontier castle held by a military order. Hospitallers, Templars, and Teutonics were granted Cilician strongpoints in cooperation with the crown."
 nd_arc_apostolic_seminary: "Apostolic Seminary"
 nd_arc_apostolic_seminary_desc: "The schools of Sis where Apostolic clergy trained in theology, canon law, and the languages of disputation. The kingdom's intellectual answer to the Latin universities."
 nd_arc_royal_arsenal: "Royal Arsenal"
 nd_arc_royal_arsenal_desc: "The royal shipyards and gun foundries. Cilician timber, iron, and labour combined under crown management to produce an ocean-capable fleet."
 nd_arc_taurus_combinat: "Taurus Combinat"
 nd_arc_taurus_combinat_desc: "Integrated heavy-industry works producing iron, copper, naval supplies, and steel. Anchored on Taurus mineral resources and the kingdom's growing labour pool."

 # === Building Production Method Loc ===
 nd_arc_sis_citadel_upkeep: "Citadel Garrison"
 nd_arc_sis_citadel_upkeep_desc: "Stone, masonry, weaponry, and tools to maintain the royal stronghold."
 nd_arc_drazark_upkeep: "Monastic Upkeep"
 nd_arc_drazark_upkeep_desc: "Beeswax for candles, paper for scriptoria, books for the library, and incense for the liturgy."
 nd_arc_hromkla_upkeep: "Patriarchal Household"
 nd_arc_hromkla_upkeep_desc: "The provisioning of the Catholicos's residence: beeswax, paper, books, and incense."
 nd_arc_ayas_upkeep: "Customhouse Operation"
 nd_arc_ayas_upkeep_desc: "Naval stores for the harbour, paper for the ledgers, cloth for the customs officers, and tools for the docks."
 nd_arc_cilician_workshop: "Cilician Workshop"
 nd_arc_cilician_workshop_desc: "The Italian-licensed manufactories on the Pyramus river: Genoese factors processing Cilician iron and Taurus lumber into shipyard-grade naval supplies, and Genoese weavers spinning Silk Road raw silk into fine cloth for Mediterranean markets. Where Mopsuestia is the customs ledger, the workshop is the loom and the foundry."
 nd_arc_mopsuestia_upkeep: "Customs and Ledger"
 nd_arc_mopsuestia_upkeep_desc: "Paper for the Genoese-Cilician contract registers, cloth for the consul's chambers, beeswax for the seal-pressers, and tools for the embankment quays."
 nd_arc_export_pm: "Iron and Timber Export"
 nd_arc_export_pm_desc: "Cilician iron from Taurus mines and lumber from the cedar slopes worked into shipyard-grade naval supplies. Italian factors purchase the output for Egyptian and Aegean yards."
 nd_arc_silk_caravan_pm: "Silk Caravan Trade"
 nd_arc_silk_caravan_pm_desc: "Silk Road raw silk and dyestuffs received at the Pyramus warehouses and worked into fine cloth on Italian-licensed looms before forwarding to Genoa, Venice, and the Tyrrhenian ports."
 nd_arc_commandery_upkeep: "Commandery Service"
 nd_arc_commandery_upkeep_desc: "Stone and masonry for repairs, weaponry for the brethren, and beeswax for the chapel."
 nd_arc_seminary_upkeep: "Seminary Library"
 nd_arc_seminary_upkeep_desc: "Paper, books, beeswax, and cloth: the working materials of an Apostolic school."
 nd_arc_arsenal_upkeep: "Arsenal Operation"
 nd_arc_arsenal_upkeep_desc: "Lumber, naval supplies, tools, and cannons: the materials of a state shipyard."
 nd_arc_combinat_steel_pm: "Combinat Steelworks"
 nd_arc_combinat_steel_pm_desc: "Iron, coal, and tools combined in integrated furnaces to produce industrial steel."

 # === Units ===
 a_nd_arc_cilician_knights: "Cilician Knights"
 a_nd_arc_cilician_knights_desc: "Heavy cavalry of Armenian aznavur stock armed and drilled in the Frankish manner. The lance, the kite shield, the tournament-trained mount: the elite of the kingdom."
 a_nd_arc_mavragort: "Mountain Mavragort"
 a_nd_arc_mavragort_desc: "Highland Armenian infantry from the Taurus passes, raised to skirmish in broken country and to ambush in the defiles."
 a_nd_arc_cilician_lancers: "Cilician Lancers"
 a_nd_arc_cilician_lancers_desc: "The royal cavalry corps of the Hethumid constabulary. Smbat the Constable's drill manual, the king's livery, and the discipline of a standing chivalric force."
 a_nd_arc_lusignan_knights: "Lusignan Knights"
 a_nd_arc_lusignan_knights_desc: "The full chivalric corps of the late kingdom under Lusignan rule: heralded, ordered, paid by the crown, and as competent as any in Outremer."
 n_nd_arc_royal_galley: "Royal Galley"
 n_nd_arc_royal_galley_desc: "The galley-class warship of the kingdom's royal fleet, stationed at Korikos. Light, fast, and Levant-suited: the workhorse of Cilician sea power."
 n_nd_arc_crusader_galleon: "Crusader Galleon"
 n_nd_arc_crusader_galleon_desc: "The heavy galleon adapted from Italian and Aragonese designs, built in Cilician yards from Taurus timber. The kingdom's first ocean-capable warship."

 # === Levies ===
 levy_nd_arc_cilician_knights: "Cilician Knights Levy"
 levy_nd_arc_cilician_knights_desc: "The heavy cavalry of the noble nakharar houses, summoned to the royal banner."
 levy_nd_arc_mavragort: "Mavragort Levy"
 levy_nd_arc_mavragort_desc: "Highland infantry raised from the Apostolic peasantry of the Taurus."

 nd_arc_pyramus_warehouses: "Pyramus Warehouses"
 nd_arc_pyramus_warehouses_desc: "The Genoese-licensed warehouses on the Pyramus river embankments at Mopsuestia. The kingdom's iron, timber, and silk passed through their accounting in Genoese ledgers, and Cilician fortunes rose with the Italian commerce that flowed through them."
 nd_arc_royal_admiralty: "Royal Admiralty of Sis"
 nd_arc_royal_admiralty_desc: "The state shipyard, gun foundry, and naval bureaucracy under direct crown management. Cilician timber, iron, labour, and Italian shipwright tradition combined into a fleet capable of contesting the eastern Mediterranean."
 nd_arc_formed_tt: "Cilician Armenia formed"
 nd_arc_path_a_tt: "Apostolic Sanctuary path chosen"
 nd_arc_path_b_tt: "Latin Union path chosen"
 nd_arc_levantine_free_port: "Levantine Free Port"
 nd_arc_levantine_free_port_desc: "The late-kingdom liberalization of customs at Ayas, Famagusta, and the secondary harbours. Italian and northern merchants enter on equal terms; Cilician shipping competes by quality, not by tariff."

 # === Destiny Tree ===
 nd_arc_destiny: "The Long Horizon of Sis"
 nd_arc_destiny_desc: "The crown is set, the church question answered. Now the kingdom must choose what kind of state it intends to become across the centuries to come."
 nd_arc_dest_levant_vanguard: "Levant Vanguard"
 nd_arc_dest_levant_vanguard_desc: "Recover Jerusalem and Edessa. The first restoration of the Crusader-era Christian states must come from Cilicia, or it will not come at all."
 nd_arc_dest_liberation_sees: "Liberation of the Sees"
 nd_arc_dest_liberation_sees_desc: "Bring Aleppo and Damascus under Cilician arms. The patriarchates of the eastern Christian world must answer to the Apostolic crown of Sis."
 nd_arc_dest_apostolic_imperium: "Apostolic Imperium"
 nd_arc_dest_apostolic_imperium_desc: "Acre, the last Crusader capital. Mosul, the eastern see. The kingdom completes its inheritance: the Christian East gathered under one banner, with army and treasury to hold it."
 nd_arc_dest_cilician_reach: "Cilician Reach"
 nd_arc_dest_cilician_reach_desc: "Antalya and Rhodes secured, banking embraced. The kingdom projects its merchants and galleys past its own coast and into the southern Aegean."
 nd_arc_dest_aegean_condominium: "Aegean Condominium"
 nd_arc_dest_aegean_condominium_desc: "Crete and Modon answer to Sis. The kingdom shares the eastern Mediterranean with no rival; its galleys winter where they please."
 nd_arc_dest_mediterranean_apex: "Mediterranean Apex"
 nd_arc_dest_mediterranean_apex_desc: "Alexandria's road and Smyrna's wealth pay their dues at Sis. The eastern sea is a Cilician lake; the kingdom is the bourse of three continents."

 # === Destiny Path Variable Tooltips ===
 # (formed_tt and path_x_tt already defined above)

 # === Destiny Events ===
 nd_arc.8.t: "The Long Horizon"
 nd_arc.8.d: "The chancery has produced a memorandum. With the church question settled, the council looks ahead: not to the next campaign or the next harvest but to the kingdom's shape a century hence. Land or sea, restoration or projection, eastern Christian or Mediterranean cosmopolitan. The choice is no longer between options; it is between futures."
 nd_arc.8.a: "Set the kingdom's course."

 nd_arc.9.t: "Edessa and Jerusalem Recovered"
 nd_arc.9.d: "The banner of the Apostolic crown flies above Edessa, the city Baldwin lost in 1144, and above Jerusalem, lost in 1187. What two centuries of Crusader effort failed to restore, the Cilician kingdom has now restored. The Catholicos blesses the new sees, the chronicles of three churches record the names of the king's captains, and a generation of Armenian pilgrims sees its holiest cities under its own crown."
 nd_arc.9.a: "The Holy Sepulchre stands under our cross."

 nd_arc.10.t: "Aleppo and Damascus"
 nd_arc.10.d: "Aleppo, the great commercial capital of Syria. Damascus, the Umayyad city of seventy mosques and the patriarchate of the eastern Orthodox. Both cities have fallen to Cilician arms; both must now be governed. The chancery presents two memoranda. The marshals propose using the captured cities as launch-points for further war: spoils, recruits, and momentum can carry the banner all the way to Egypt. The Catholicos and his synod propose the opposite: the Christian sees of the East have been recovered, and reconciliation under the Apostolic obedience must precede any further conquest. The choice will define the next generation."
 nd_arc.10.a: "A conqueror's charter: press the advantage."
 nd_arc.10.b: "A reconciliation of sees: heal the church first."

 nd_arc.11.t: "The Apostolic Imperium"
 nd_arc.11.d: "Acre, where Crusader Outremer perished in 1291, flies the cross of Cilicia. Mosul, where the Church of the East was patriarched, answers to the Catholicos of Sis. The army has done what no Crusader, no Mongol, and no Byzantine ever did: assembled the Christian East under one crown. The court must now decide what the imperium is. A militant kingdom whose levies muster on Christian principle and whose sermons address Jerusalem? Or an administered inheritance whose first task is to assimilate the conquered and govern them as Cilicians?"
 nd_arc.11.a: "An Armenian Jerusalem: militant Christian imperium."
 nd_arc.11.b: "An Apostolic inheritance: govern, do not parade."

 nd_arc.12.t: "Antalya and Rhodes"
 nd_arc.12.d: "The southern Anatolian coast and the great fortress-island of Rhodes have entered the Cilician sphere. The fondachi fly Cilician banners alongside the Italian; the Hospitallers, where they remain, hold their commanderies as kingdom vassals. Banking has come to Sis: Italian credit instruments are now part of every chancery contract. The kingdom is no longer a Levantine peninsula; it is a maritime power on the eastern Mediterranean's western shore."
 nd_arc.12.a: "The galleys answer to Sis."

 nd_arc.13.t: "Crete and the Morea"
 nd_arc.13.d: "Candia, Modon, and the harbours of the Morea have been brought into the Cilician fleet's wintering rotation. The kingdom's reach now extends from Famagusta to the Ionian. Two Italian republics offer to integrate themselves with the kingdom's commercial system. Genoa proposes a continental factor's contract: Cilician-Genoese factors handling trade volume from Tabriz to Bruges. Venice proposes a maritime condominium: shared admiralties, shared exploration, the kingdom's flag carried past the Pillars and into the Atlantic."
 nd_arc.13.a: "A Genoese axis: trade volume across continents."
 nd_arc.13.b: "A Venetian axis: a maritime condominium beyond the inner sea."

 nd_arc.14.t: "The Mediterranean Apex"
 nd_arc.14.d: "Alexandria's road and Smyrna's wealth have entered the kingdom's customs. The ancient eastern Mediterranean, the sea of three continents, answers in practice to a single kingdom: the heir of Cilicia, the inheritor of Lusignan Cyprus, the patron of the Italian republics. The chancery presents two visions of what to do with the apex. Build out the bourse at Sis -- a true Levantine clearing-house, the financial capital of the East. Or sail outward -- carry the kingdom's flag and people across the western Mediterranean and beyond, the cosmopolitan thalassocracy that Cilicia always wanted to be."
 nd_arc.14.a: "Build the Bourse: Sis as financial capital of the East."
 nd_arc.14.b: "The Lions of Armenia: cosmopolitan thalassocracy."

 # === Destiny Static Modifiers ===
 STATIC_MODIFIER_NAME_nd_arc_dest_conquerors_charter: "A Conqueror's Charter"
 STATIC_MODIFIER_DESC_nd_arc_dest_conquerors_charter: "The captured patriarchates supply men, money, and momentum. The kingdom's hosts march again before the cities have cooled, and the spoils of two great conquests flood the Cilician treasury -- and its prices."
 STATIC_MODIFIER_NAME_nd_arc_dest_reconciled_sees: "Reconciliation of the Sees"
 STATIC_MODIFIER_DESC_nd_arc_dest_reconciled_sees: "The Apostolic Catholicate gathers the recovered patriarchates into one obedience. Heretical communities are tolerated within bounds, the older theology gains in clarity, and the kingdom's people grow weary of the war that brought them here."
 STATIC_MODIFIER_NAME_nd_arc_dest_armenian_jerusalem: "An Armenian Jerusalem"
 STATIC_MODIFIER_DESC_nd_arc_dest_armenian_jerusalem: "The kingdom proclaims itself protector of Christian Jerusalem. Levies muster on principle, heathen subjects are tolerated under the protective Apostolic order, and the court grows lavish on its own legend."
 STATIC_MODIFIER_NAME_nd_arc_dest_apostolic_inheritance: "Apostolic Inheritance"
 STATIC_MODIFIER_DESC_nd_arc_dest_apostolic_inheritance: "The conquered are assimilated, the inherited integrated. The kingdom administers what it has won as a single state, accepting the larger government that this requires."
 STATIC_MODIFIER_NAME_nd_arc_dest_genoese_axis: "Genoese Axis"
 STATIC_MODIFIER_DESC_nd_arc_dest_genoese_axis: "Cilician-Genoese factors handle the kingdom's overland trade from Tabriz to Bruges. The trade centres swell. Subject populations under Italian factors grumble at the privilege of the foreign clerks."
 STATIC_MODIFIER_NAME_nd_arc_dest_venetian_axis: "Venetian Axis"
 STATIC_MODIFIER_DESC_nd_arc_dest_venetian_axis: "Shared admiralties, shared explorers, shared yards. The fleet runs lean and sails far -- but the army diminishes in expectation as the navy claims the crown's purse."
 STATIC_MODIFIER_NAME_nd_arc_dest_levantine_bourse_mod: "The Bourse of Sis"
 STATIC_MODIFIER_DESC_nd_arc_dest_levantine_bourse_mod: "Sis becomes the clearing-house of the East: contracts settled daily, prosperity built on legible commerce, public works rising in every harbour. Wealthy provinces, however, grow conscious of their wealth."
 STATIC_MODIFIER_NAME_nd_arc_dest_armenian_lions: "The Lions of Armenia"
 STATIC_MODIFIER_DESC_nd_arc_dest_armenian_lions: "Cosmopolitan crews, multilingual courts, and a thalassocracy proud of its mixed blood. The realm grows in people and accepted cultures, even as its rivals refuse it the easy peace."

 # === Destiny Buildings ===
 nd_arc_greater_catholicate: "Greater Catholicate"
 nd_arc_greater_catholicate_desc: "The military-religious headquarters of the restored Christian East. Cathedral, chivalric muster, and war-council under one roof at Sis: the institution that holds the Apostolic Imperium together."
 nd_arc_levantine_bourse: "Levantine Maritime Bourse"
 nd_arc_levantine_bourse_desc: "The clearing-floor of the eastern Mediterranean. Italian, Armenian, Greek, and Egyptian factors close their contracts here daily; the kingdom's flag and currency are accepted at par from Famagusta to Marseille."

 # === Destiny Building PMs ===
 nd_arc_greater_catholicate_upkeep: "Catholicate Household"
 nd_arc_greater_catholicate_upkeep_desc: "Beeswax for the perpetual liturgy, books for the curia, incense for the ceremonies of state, and weapons for the armed brothers."
 nd_arc_bourse_upkeep: "Bourse Operation"
 nd_arc_bourse_upkeep_desc: "Paper for the daily ledgers, fine cloth for the factors' liveries, cloth for the assistants, and tools for the press of the contracts."

 # === Bureaucracies ===
 arc_catholicate_of_sis_bureaucracy: "Catholicate of Sis"
 arc_catholicate_of_sis_bureaucracy_desc: "The patriarchal seat of the Armenian Apostolic Church, transferred from Hromkla to Sis in 1293 after the Mamluks sacked the older see, and resident in the royal capital under Hethumid protection. The Catholicos presided over the Synod of Sis, the standing council of bishops, and confirmed the Apostolic theology against the successive Roman overtures of 1198, 1244, 1289, and 1307. From its scriptoria came the great Armenian illuminated gospels of Sis and Drazark, and from its courts came the canon law that bound every Armenian community from Crimea to Persia. Where the Catholicos sat, the spiritual centre of the Armenian world stood."
 arc_royal_chancery_bureaucracy: "Royal Chancery of Sis"
 arc_royal_chancery_bureaucracy_desc: "The writing office of the Hethumid kings, a self-conscious adaptation of Frankish chancery practice grafted onto Armenian royal tradition. Levon I sealed his charters in five languages; the Assizes of Antioch were translated into Armenian under Smbat the Constable around 1265; royal coinage bore Latin, Armenian, and occasionally Arabic legends. The chancery functioned as the kingdom's diplomatic interface with Rome, the Byzantine emperors, the Mongol khans of Tabriz, and the Italian republics, drafting the multilingual treaties whose clauses survive in archives in Sis, Genoa, Venice, and the Vatican."
 arc_italian_factors_court_bureaucracy: "Italian Factor's Court"
 arc_italian_factors_court_bureaucracy_desc: "The consular jurisdictions held by the Genoese and Venetian merchant communities at Ayas and Mopsuestia under the treaties of 1201, 1215, and 1245. Each republic installed its own consul, who held civil and commercial jurisdiction over his nation's merchants in the kingdom, kept his own seal, and answered to the Doge rather than to the Catholicos or the king. The arrangement was the price of Mediterranean integration: Italian capital, ships, and credit flowed through Cilician harbours on terms set in San Giorgio's loggia and the Rialto, and the Hethumid crown gained access to the long-distance trade that no Eastern kingdom could otherwise touch."
 arc_connetablie_bureaucracy: "Connetablie of the Realm"
 arc_connetablie_bureaucracy_desc: "The Frankish-styled military command of the Hethumid kingdom, adopted from the Crusader Principality of Antioch and formalized under the Rubenid and Hethumid dynasties. The Constable (gundstabl) headed the feudal host and the chivalric hierarchy of sixty barons. Hethum I's brother Smbat the Constable (1208-1276) translated the Assizes of Antioch into Armenian and codified knight-fee obligations on the Latin model -- the realm's barons each owed a fixed cavalry contingent under the Constable's banner. It was a Latin-style feudal levy on Armenian soil, and it gave the kingdom an army the Mamluks took two centuries to grind down."
 arc_customs_diwan_of_ayas_bureaucracy: "Customs Diwan of Ayas"
 arc_customs_diwan_of_ayas_bureaucracy_desc: "The customs administration of the kingdom's great port on the Gulf of Iskenderun, the principal Mediterranean entrepot of Cilician Armenia and -- after the Mamluk fall of Acre in 1291 -- the chief Christian harbour for the Levant trade. Marco Polo sailed from Ayas in 1271; Francesco Pegolotti's Pratica della Mercatura, written around 1340, lists its duties, currencies, and weights in painstaking detail. The Hethumid kings granted reduced tariffs to favoured republics and skimmed the rest into the royal treasury, but the cost of the regime fell on the inland fellahin whose grain was taxed at the gate and again at the harbour to feed the merchant city."

 # === Bureaucracy Authority ===
 AUTO_MODIFIER_NAME_nd_arc_bureaucracy_authority: "Hethumid Chancellery"
 AUTO_MODIFIER_DESC_nd_arc_bureaucracy_authority: "The kingdom of Cilicia governs itself from the citadel of Sis through a permanent administrative apparatus -- the royal chancery, the Catholicate's synod, the consular courts of the Italian factors, and the customs offices of Ayas. From this foundation the kingdom's distinctive institutions of state begin to take their durable form."
