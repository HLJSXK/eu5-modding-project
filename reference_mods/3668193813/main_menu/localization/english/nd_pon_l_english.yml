l_english:

 # ===== Variable tooltips =====
 nd_pon_formed_tt: "The Pontic restoration has been proclaimed"
 nd_pon_path_a_tt: "Chose the #bold Roman Restoration#! destiny (Komnenian Restoration)"
 nd_pon_path_b_tt: "Chose the #bold Black Sea Commonwealth#! destiny (Pontic Republic)"

 # ===== Formation event nd_pon.1 =====
 nd_pon.1.t: "Heir to the Pontic Shore"
 nd_pon.1.d: "From the cliff monastery of Sumela on Mount Mela to the silver veins of Argyria, from the harbour of Trebizond to the Pontic-Greek villages of the Caucasian foothills, the Pontic-Greek world is being reassembled. The basileus is to be enthroned in the Hagia Sophia of Trebizond, the heir of Alexios I Komnenos and his Pontic descendants who held this corner of the Roman world for 257 years before Mehmed's siege of 1461.\n\nBut the form of the new realm is contested. The court chronicler Bessarion of Trebizond and the metropolitan of Sumela urge a Komnenian Restoration: the basileus crowned in purple, an imperial liturgy and chrysobull, the silver-mining oligarchs of Argyria as the senatorial class, the kingdom organised as a small-scale basileia. The merchant councils of Trebizond, Sinope, and Kerasounta urge a Pontic Republic: the three urban triads as constitutional partners under royal charter, an autocephalous Pontic Orthodox Church as the political centre, the basileus as a primus inter pares confirmed by the burgher assemblies.\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_pon.1.a: "Komnenian Restoration - the basileia of the Pontic shore"
 nd_pon.1.b: "Pontic Republic - the urban-mercantile commonwealth"

 # ===== Formation timed modifiers =====
 STATIC_MODIFIER_NAME_nd_pon_komnenian_restoration: "Komnenian Restoration"
 STATIC_MODIFIER_DESC_nd_pon_komnenian_restoration: "The basileus is enthroned in purple in the Hagia Sophia of Trebizond. The silver of Argyria flows into the imperial fisc, the late-Roman ceremonial is observed, the chrysobull is sealed in violet ink. A small basileia preserves the imperial idea on the Pontic shore."

 STATIC_MODIFIER_NAME_nd_pon_pontic_republic: "Pontic Republic"
 STATIC_MODIFIER_DESC_nd_pon_pontic_republic: "Trebizond, Sinope, and Kerasounta sit together in the burgher assembly. The autocephalous Pontic Orthodox Church holds the political centre; the basileus is confirmed in office by the merchant councils of the three Pontic emporia."

 # ===== nd_pon.2 - Coronation at Trebizond =====
 nd_pon.2.t: "Coronation in the Hagia Sophia of Trebizond"
 nd_pon.2.d: "The basileus walks beneath the painted Pantocrator in the Hagia Sophia of Trebizond, the church Manuel I Komnenos raised in 1238. The metropolitan of Trebizond places the diadem on his head, sings the polychronion in Pontic-Greek inflection, and seals the chrysobull in violet. The court is now ceremonial; the question is what to do with the ceremony.\n\nSome of the senate argue for projecting the imperial claim outward: a small basileia speaking peer-to-peer with Constantinople, Venice, and the Caucasian crowns, drawing prestige from the Komnenoid lineage. Others argue for projecting it inward: the diadem becomes the centre of a court of office and rank, binding the Pontic-Greek nobility into a Trapezuntine archontate."
 nd_pon.2.a: "Project the imperial claim outward"
 nd_pon.2.b: "Bind the nobility through court office"

 STATIC_MODIFIER_NAME_nd_pon_imperial_claim: "Imperial Claim of the Komnenoi"
 STATIC_MODIFIER_DESC_nd_pon_imperial_claim: "The basileus speaks as a peer of the great Roman, Latin, and Caucasian crowns. The Komnenoid lineage carries weight in Constantinople, Venice, and Tbilisi alike."

 STATIC_MODIFIER_NAME_nd_pon_pontic_archontate: "Pontic Archontate"
 STATIC_MODIFIER_DESC_nd_pon_pontic_archontate: "The Pontic-Greek nobility is bound into a court of office and rank, drawing satisfaction from the ceremonial of the Komnenian basileia."

 # ===== nd_pon.3 - The Sumela Endowment =====
 nd_pon.3.t: "The Endowment of Sumela"
 nd_pon.3.d: "The basileus's chrysobull is delivered to the abbot of Sumela, the cliff-cut monastery of the Theotokos on Mount Mela above Trabzon, founded under Theodosius I in 386. The chrysobull endows the monastery with revenues from the silver of Argyria, exempts its peasants from the levies, and confirms its possession of the Panagia Sumeliotissa, the icon of the Theotokos that Alexios III Komnenos installed in 1364.\n\nThe abbot writes back to ask what the basileus expects of the endowment. Shall Sumela become a contemplative scriptorium, a Pontic-Greek Mount Athos preserving the icons and chronicles? Or shall it work as a frontier mission, taking in highland villagers, baptising Lazi and Tzanid converts, feeding the Pontic peasantry from its granaries?"
 nd_pon.3.a: "A scriptorium and icon-school of the Pontic Mount"
 nd_pon.3.b: "A working frontier mission of the Pontic highlands"

 STATIC_MODIFIER_NAME_nd_pon_sumela_scriptorium: "Sumela Scriptorium"
 STATIC_MODIFIER_DESC_nd_pon_sumela_scriptorium: "The cliff monastery becomes the Pontic-Greek Mount Athos: a scriptorium, an icon-school, a centre of Pontic Orthodox learning whose books circulate from Sumela to Sinope to Caffa."

 STATIC_MODIFIER_NAME_nd_pon_sumela_frontier: "Sumela Frontier Mission"
 STATIC_MODIFIER_DESC_nd_pon_sumela_frontier: "Sumela's monks ride out into the highlands, baptising Lazi and Tzanid villagers and feeding the Pontic peasantry from the monastery's granaries."

 # ===== nd_pon.4 - Argyria Silver Strike =====
 nd_pon.4.t: "The Silver of Argyria"
 nd_pon.4.d: "The mine-overseers of Argyria and Halybe send word that the deep galleries have struck a fresh seam. The Pontic Alps have not yielded silver in this volume since the days of Mithridates Eupator. Within months the Trapezuntine aspron is restruck heavier; within a year the basileus's customs officers in Trebizond are weighing Italian carracks to make sure they do not undercut the Pontic coin.\n\nThe assayers warn that the rapid output will be inflationary. The treasurers, however, are smiling: this is the moment that finances every project the basileia has put off for a century."
 nd_pon.4.a: "Restrike the Trapezuntine aspron"

 STATIC_MODIFIER_NAME_nd_pon_argyria_strike: "Argyria Silver Strike"
 STATIC_MODIFIER_DESC_nd_pon_argyria_strike: "The deep seams of Argyria yield silver in volumes not seen since Mithridates Eupator. The Pontic fisc is full; the cost is some inflation as the new aspron settles."

 # ===== nd_pon.5 - Compact with the Bagrationi =====
 nd_pon.5.t: "The Compact with the Bagrationi"
 nd_pon.5.d: "The Bagrationi king of Georgia receives the Pontic ambassador in the cathedral of Mtskheta. The two crowns share a Christian frontier against the Turkmen beyliks of the upland passes; they share a Komnenoid bloodline three generations deep, since Maria-Despoina of Trebizond married Alexios II Komnenos's heir; and they share a fear that the Pontic shore and the Caucasian valleys will be swallowed piecemeal if they do not act in concert.\n\nThe ambassador returns with two offers laid in parallel. The first is a marriage alliance: the Pontic and Bagrationi houses bound into one legitimacy, the Komnenoid claim and the Bagrationi crown braided permanently. The second is a military league: a joint commitment to campaign together against the beyliks, with shared frontier garrisons in the upland passes."
 nd_pon.5.a: "A marriage alliance with the Bagrationi house"
 nd_pon.5.b: "A military league against the upland beyliks"

 STATIC_MODIFIER_NAME_nd_pon_bagrationi_marriage: "Bagrationi Marriage"
 STATIC_MODIFIER_DESC_nd_pon_bagrationi_marriage: "The Komnenoid and Bagrationi houses are braided into one Christian frontier legitimacy. The basileus's diplomats speak with extra weight in Tbilisi, Erzurum, and the Caucasian valleys."

 STATIC_MODIFIER_NAME_nd_pon_caucasian_league: "Caucasian Christian League"
 STATIC_MODIFIER_DESC_nd_pon_caucasian_league: "Pontic and Georgian armies campaign together against the Turkmen beyliks of the upland passes. The frontier garrisons are shared; the manpower flows in both directions."

 # ===== nd_pon.6 - The Pontic Carrack =====
 nd_pon.6.t: "The First Pontic Carrack"
 nd_pon.6.d: "The shipyards at the mouth of the Trebizond stream have copied the Genoese carrack from the yards at Caffa, married it to the Pontic galley's deeper draught, and produced something neither Italian nor strictly Trapezuntine. The first vessel sails the Trebizond-Sinope-Caffa circuit under Pontic colours, returning with cargoes of Crimean grain, Tatar furs, and Caucasian wine that the old Pontic galleys could never carry in such volume.\n\nThe basileus's admirals press for a permanent admiralty: a fleet command at Trebizond, paid berthing for Pontic merchants at Sinope and Kerasounta, and a tariff structure that prices Italian carracks out of Pontic waters."
 nd_pon.6.a: "Charter the Pontic Admiralty at Trebizond"

 STATIC_MODIFIER_NAME_nd_pon_pontic_admiralty: "Pontic Admiralty"
 STATIC_MODIFIER_DESC_nd_pon_pontic_admiralty: "A fleet command sits at Trebizond. Pontic carracks ply the Black Sea triangle under Pontic colours; sailors and shipyards multiply at Sinope and Kerasounta."

 # ===== nd_pon.7 - 1461 Averted =====
 nd_pon.7.t: "1461 Averted"
 nd_pon.7.d: "Mehmed the Conqueror's army stands before the walls of Trebizond. The siege engines have been rolled across the Pontic Alps from Erzurum; the Ottoman fleet is anchored off Platana. In the historical chronicle the Komnenoi surrendered: David Komnenos walked out under safe-conduct, was deported to Adrianople, and was strangled in 1463 with most of his family. The empire of the Komnenoi-of-Trebizond, founded in 1204, perished in 1461.\n\nNot this time. The walls hold. The relief column from the Caucasian league breaks Mehmed's encirclement; the Pontic carracks burn the Ottoman supply ships at Platana; the cliff monasteries of Sumela become field hospitals. After three months of siege the Ottoman army withdraws across the Pontic Alps. The empire of the Komnenoi has outlived the Roman Constantinople by eight years and counting.\n\nWhat does 1461 averted mean for the kingdom going forward? Some argue for defiance, taking the survival as the foundation of a Pontic-Roman idea that cannot be erased. Others argue for renewal, integrating Constantinopolitan refugees into a Pontic state that knows itself, finally, as the legitimate Roman heir."
 nd_pon.7.a: "Pontic Defiance - the empire that did not fall"
 nd_pon.7.b: "Post-Imperial Pontus - integrate the Roman refugees"

 STATIC_MODIFIER_NAME_nd_pon_pontic_defiance: "Pontic Defiance"
 STATIC_MODIFIER_DESC_nd_pon_pontic_defiance: "The empire that did not fall. Trebizond stands; the Komnenoi reign; the Roman idea has a Pontic heart, defended in arms by every villager of the Pontic Alps."

 STATIC_MODIFIER_NAME_nd_pon_post_imperial_pontus: "Post-Imperial Pontus"
 STATIC_MODIFIER_DESC_nd_pon_post_imperial_pontus: "Constantinopolitan refugees pour into the Pontic emporia. The kingdom integrates them as the legitimate heir of the Roman idea, knowing itself, finally, as the empire that survived."

 # ===== nd_pon.8 - The Pontic Phanar =====
 nd_pon.8.t: "The Pontic Phanariots"
 nd_pon.8.d: "A class of bilingual mercantile-administrative families has consolidated itself across the Pontic shore. They were merchants of the Trebizond-Sinope-Caffa triangle a century ago; they are now diplomats, customs officers, financial undersecretaries to the basileus, and translators between Pontic-Greek, Tatar Turkish, Russian, and Italian. The court chronicler calls them the Pontic Phanariots, after the comparable class that grew up around the Patriarchate of Constantinople.\n\nThe basileus's secretaries press for formal recognition: charters for the Pontic Phanariot houses, integration of their networks into the Pontic diplomatic corps, recognition of their schools as the kingdom's secondary educational backbone."
 nd_pon.8.a: "Charter the Pontic Phanariot houses"

 STATIC_MODIFIER_NAME_nd_pon_phanariot_network: "Pontic Phanariot Network"
 STATIC_MODIFIER_DESC_nd_pon_phanariot_network: "Bilingual Pontic-Greek-Turkish-Russian merchant clans serve as the kingdom's diplomatic backbone. Their networks reach Constantinople, Moscow, Venice, and Cairo."

 # ===== nd_pon.9 - Pontic Megale Idea =====
 nd_pon.9.t: "The Pontic Megale Idea"
 nd_pon.9.d: "The 19th-century Pontic-Greek awakening has come. The villages of the Pontic Alps, the merchant clans of Trebizond and Sinope, the monks of Sumela and the Cappadocian rock-hewn sanctuaries, and the Caucasian Pontic-Greek diaspora villages have organised themselves into a single national project. The pamphleteers of Trebizond write of a Pontic Megale Idea, distinct from the Constantinopolitan one: the gathering-in of every Pontic-Greek community from the Crimean coast to the Cappadocian uplands.\n\nThe form of the renewed Pontic state is contested. Some call for an Eastern Empire, an Orthodox imperial revival in the Komnenian-Byzantine mould, projecting Pontic-Greek culture across the Black Sea world. Others call for a constitutional Pontic state, drawing on the burgher tradition of Trebizond and Sinope, organised as a parliamentary republic of free Pontic-Greek peoples."
 nd_pon.9.a: "An Eastern Empire of Orthodox revival"
 nd_pon.9.b: "A Pontic constitutional republic of free peoples"

 STATIC_MODIFIER_NAME_nd_pon_eastern_empire: "Eastern Empire"
 STATIC_MODIFIER_DESC_nd_pon_eastern_empire: "An Orthodox imperial revival in the Komnenian-Byzantine mould. The Pontic crown projects across the Black Sea as the Eastern Christian alternative to the western powers."

 STATIC_MODIFIER_NAME_nd_pon_pontic_constitution: "Pontic Constitution"
 STATIC_MODIFIER_DESC_nd_pon_pontic_constitution: "A parliamentary republic of free Pontic-Greek peoples. The burgher tradition of Trebizond and Sinope becomes the constitutional backbone of the new Pontic state."

 # ===== Advances =====
 nd_pon_komnenian_coronation: "Komnenoi-of-Trebizond Coronation"
 nd_pon_komnenian_coronation_desc: "The Pontic basileus is enthroned in the Hagia Sophia of Trebizond, sustaining the imperial idea of the Komnenoi-of-Trebizond who ruled the Pontic shore from 1204 to 1461."

 nd_pon_sumela_endowment: "Sumela Monastery"
 nd_pon_sumela_endowment_desc: "Endow the cliff-cut monastery of the Theotokos Sumela on Mount Mela, founded in 386 AD. Mother house of the Pontic-Greek monastic tradition."

 nd_pon_argyria_tradition: "Argyria Silver Workings"
 nd_pon_argyria_tradition_desc: "Open the silver veins of Argyria and Halybe in the Pontic Alps, the ancient mines that fed the Trapezuntine aspron coin."

 nd_pon_akrites_tradition: "Pontic Akrites"
 nd_pon_akrites_tradition_desc: "Akritic frontier-guard infantry of the Pontic Alps: tough mountain villagers garrisoning the upland passes."

 nd_pon_pontic_liburnae: "Pontic Liburnae"
 nd_pon_pontic_liburnae_desc: "The Black Sea successor to the late Roman liburna, a small fast escort galley plying the Trebizond-Sinope-Caffa circuit."

 nd_pon_pontic_emporia: "Pontic Mercantile Emporia"
 nd_pon_pontic_emporia_desc: "Trebizond, Sinope, and Kerasounta as autonomous merchant communes under royal charter -- the urban triad of the Pontic shore."

 nd_pon_cappadocian_sanctuary: "Cappadocian Rock-Hewn Sanctuaries"
 nd_pon_cappadocian_sanctuary_desc: "The Goreme and Soganli school of cave-cut chapels, repurposed by the Pontic state as cultural anchors of the southern frontier."

 nd_pon_argyria_mines: "Argyria Mining Expansion"
 nd_pon_argyria_mines_desc: "Permanent expansion of the silver mining economy of the Pontic Alps. The aspron coin is restruck and the imperial fisc filled."

 nd_pon_caucasian_compact: "Caucasian Christian Compact"
 nd_pon_caucasian_compact_desc: "Diplomatic compact with the Bagrationi of Georgia and the Mamikonid-Bagratuni Armenian house, sealing the Caucasian Christian frontier."

 nd_pon_trapezitai_levy: "Pontic Trapezitai"
 nd_pon_trapezitai_levy_desc: "Light cavalry of the Pontic coast: scouts, raiders, mounted skirmishers along the Trebizond-Sinope road."

 nd_pon_pontic_vernacular: "Pontic-Greek Vernacular"
 nd_pon_pontic_vernacular_desc: "The Pontic-Greek dialect, distinct from Constantinopolitan Greek, becomes the language of court chronicle and Sumela's scriptorium."

 nd_pon_pontic_carrack: "Pontic Carrack"
 nd_pon_pontic_carrack_desc: "A Black Sea carrack marrying the Trapezuntine galley tradition with Italian rigging copied from the Genoese of Caffa."

 nd_pon_imperial_court_revival: "Komnenian Imperial Court"
 nd_pon_imperial_court_revival_desc: "The capital ceremonial court of the Komnenoi-of-Trebizond: silentiarii, chrysobulls, the trinketed forms of late-Roman address."

 nd_pon_pontic_triangle: "Pontic Triangle Trade"
 nd_pon_pontic_triangle_desc: "The Trebizond-Sinope-Caffa triangle bound into a single circulation of Pontic-Greek, Genoese, and Tatar markets."

 nd_pon_autocephaly: "Pontic Orthodox Autocephaly"
 nd_pon_autocephaly_desc: "The Pontic Orthodox Church asserts administrative independence from Constantinople, centred on the metropolitan see of Trebizond."

 nd_pon_komnenoid_diplomacy: "Komnenoid Diplomatic Networks"
 nd_pon_komnenoid_diplomacy_desc: "The Komnenoid claim becomes diplomatic currency: cousinly marriages with Trapezuntine, Italian, Tatar, Caucasian, and Aegean Greek courts."

 nd_pon_1461_averted: "1461 Averted"
 nd_pon_1461_averted_desc: "Mehmed the Conqueror's siege of Trebizond is broken. The empire of the Komnenoi-of-Trebizond outlives the Roman Constantinople."

 nd_pon_kapheneia: "The Pontic Kapheneion"
 nd_pon_kapheneia_desc: "The Pontic-Greek village tavern-coffeehouse: Trapezuntine raki, Pontic wine, the news exchange of every village square."

 nd_pon_confessional_pontus: "Pontic Confessional Court"
 nd_pon_confessional_pontus_desc: "The autocephalous Pontic Orthodox Church regularises confessional courts, guarding orthodoxy against Latin, Armenian, and Sufi influence."

 nd_pon_stratiotai: "Pontic Stratiotai"
 nd_pon_stratiotai_desc: "The Komnenian armoured infantry tradition revived: late-medieval stratiotai of the Pontic-Greek nobility and free villagers."

 nd_pon_pontic_factors: "Pontic Mercantile Factors"
 nd_pon_pontic_factors_desc: "Pontic-Greek merchant factors in Venice, Genoa, Cairo, and Alexandria, knitting the kingdom into the Mediterranean and Levantine trade."

 nd_pon_pontic_phanariots: "Pontic Phanariots"
 nd_pon_pontic_phanariots_desc: "A bilingual Pontic-Greek-Turkish-Russian mercantile-administrative class, the kingdom's diplomatic and commercial backbone."

 nd_pon_pontic_ship_of_line: "Pontic Ship of the Line"
 nd_pon_pontic_ship_of_line_desc: "A Black Sea ship of the line built in the Trebizond yards, the mature Pontic naval tradition come to fruition."

 nd_pon_pontic_absolutism: "Pontic Centralised Absolutism"
 nd_pon_pontic_absolutism_desc: "The basileus rules through the refurbished Komnenian court: a Black Sea analogue of the Petersburgian or Versaillaise centralisation projects."

 nd_pon_pontic_roads: "Pontic Alpine Roads"
 nd_pon_pontic_roads_desc: "Engineered roads through the Pontic Alps, making the silver of Argyria, the timber of the Pontic forests, and the grain of the Caucasus reachable from Trebizond."

 nd_pon_pontic_megale: "Pontic Megale Idea"
 nd_pon_pontic_megale_desc: "The 19th-century awakening of the Pontic-Greek diaspora into a single national project, distinct from the Constantinopolitan Megale Idea."

 nd_pon_pontic_industry: "Pontic Industrial Revolution"
 nd_pon_pontic_industry_desc: "The first mechanised mills along the rivers of the Pontic Alps, the silver-refining works at Argyria, the shipyard at Trebizond."

 nd_pon_pontic_constitutional: "Pontic Constitutional Movement"
 nd_pon_pontic_constitutional_desc: "The Phanariot class, the Trebizond merchant guilds, and the Sumela monastic networks reform the kingdom into a constitutional Pontic state."

 # ===== Buildings =====
 nd_pon_sumela_monastery: "Sumela Monastery"
 nd_pon_sumela_monastery_desc: "The cliff-cut monastery of the Theotokos Sumela on Mount Mela above Trabzon. Founded 386 AD; mother house of the Pontic-Greek monastic tradition."

 nd_pon_argyria_silver_mine: "Argyria Silver Mine"
 nd_pon_argyria_silver_mine_desc: "The deep silver workings of Argyria and Halybe in the Pontic Alps. Source of the silver that backed the Trapezuntine aspron."

 nd_pon_rock_hewn_sanctuary: "Rock-Hewn Sanctuary"
 nd_pon_rock_hewn_sanctuary_desc: "Cave-cut Christian sanctuary in the Pontic-Cappadocian tradition: cells, chapels, and refectories carved into the volcanic tuff."

 nd_pon_komnenian_court: "Komnenian Imperial Court"
 nd_pon_komnenian_court_desc: "The Trapezuntine court ceremonial of the Komnenoi-of-Trebizond, preserving the late-Roman basileia at the capital."

 nd_pon_kapheneion: "Pontic Kapheneion"
 nd_pon_kapheneion_desc: "Rural Pontic-Greek tavern-coffeehouse, the village news exchange. Distils Trapezuntine raki from local fruit and wine."

 # ===== Building PMs =====
 nd_pon_sumela_office: "Sumela's Liturgical Office"
 nd_pon_sumela_office_desc: "Beeswax candles, paper, and books for the Pontic-Greek liturgy, copied and bound at the cliff scriptorium."

 nd_pon_argyria_extraction: "Argyria Silver Extraction"
 nd_pon_argyria_extraction_desc: "Deep-shaft extraction of silver ore from the Argyria seams, refined with stone tools and pontic forge-craft."

 nd_pon_sanctuary_office: "Cappadocian Sanctuary Liturgy"
 nd_pon_sanctuary_office_desc: "The pottery, paper, and beeswax of the rock-hewn cave chapels of Cappadocia."

 nd_pon_komnenian_ceremonial: "Komnenian Court Ceremonial"
 nd_pon_komnenian_ceremonial_desc: "Fine cloth, paper, beeswax, and books for the silentiarii and chrysobull of the Pontic court."

 nd_pon_kapheneion_distilling: "Pontic Raki Distilling"
 nd_pon_kapheneion_distilling_desc: "Trapezuntine raki distilled from Pontic wine and orchard fruit, the mainstay of the village kapheneion."

 # ===== Units =====
 a_nd_pon_akrites: "Pontic Akrites"
 a_nd_pon_akrites_desc: "Akritic frontier infantry of the Pontic Alps: tough upland villagers, defensive specialists, masters of the rocky pass."

 a_nd_pon_trapezitai: "Pontic Trapezitai"
 a_nd_pon_trapezitai_desc: "Mounted skirmishers of the Pontic coast: fast scouts and despatch riders along the Trebizond-Sinope road."

 a_nd_pon_stratiotai: "Pontic Stratiotai"
 a_nd_pon_stratiotai_desc: "Late-medieval armoured infantry of the Pontic-Greek nobility and free villagers, equipped from the iron of Argyria and the discipline of Sumela's military treatises."

 n_nd_pon_trapezuntine_liburnian: "Trapezuntine Liburnian"
 n_nd_pon_trapezuntine_liburnian_desc: "Black Sea descendant of the late Roman liburna: small, fast, used as a grain-convoy escort and despatch boat."

 n_nd_pon_pontic_carrack: "Pontic Carrack"
 n_nd_pon_pontic_carrack_desc: "Black Sea carrack with Trapezuntine hull and Italian rigging, workhorse of the Trebizond-Sinope-Caffa circuit."

 n_nd_pon_pontic_ship_of_line: "Pontic Ship of the Line"
 n_nd_pon_pontic_ship_of_line_desc: "A Black Sea ship of the line built in the Trebizond yards, with extra-thickened hull for the Pontic swell."

 # ===== Levies =====
 levy_nd_pon_akrites: "Pontic Akrites Levy"
 levy_nd_pon_akrites_desc: "Levy of akritic mountain frontier infantry from the upland villages of the Pontic Alps."

 levy_nd_pon_trapezitai: "Pontic Trapezitai Levy"
 levy_nd_pon_trapezitai_desc: "Levy of light cavalry from the lesser nobility of the Pontic shore and the Caucasian foothills."

 # ===== New buildings (added in fix pass) =====
 nd_pon_pontic_funduq: "Pontic Funduq"
 nd_pon_pontic_funduq_desc: "Pontic-Greek urban merchant emporium-warehouse: bulk storage of grain, wine, silver, and fur for the Trebizond-Sinope-Caffa triangle."

 nd_pon_pontic_bank_house: "Pontic Bank House"
 nd_pon_pontic_bank_house_desc: "Pontic-Greek financial house of the Phanariot age: merchant clans pooling capital, issuing bills of exchange, extending credit to the basileus."

 nd_pon_trebizond_arsenal: "Trebizond Arsenal"
 nd_pon_trebizond_arsenal_desc: "The shipyard-arsenal at the mouth of the Trebizond stream, refurbished into a working naval base for the Pontic Ship of the Line."

 nd_pon_argyria_refining_works: "Argyria Refining Works"
 nd_pon_argyria_refining_works_desc: "Late industrial refining works at Argyria: mechanised extraction and steel-refining using Pontic iron and Erzurum coal."

 # New PMs
 nd_pon_funduq_maintenance: "Funduq Operations"
 nd_pon_funduq_maintenance_desc: "Cloth, paper, and pottery for the Pontic merchant emporium's clerks and warehousing."

 nd_pon_bank_house_maintenance: "Bank House Operations"
 nd_pon_bank_house_maintenance_desc: "Paper, books, and fine cloth for the Phanariot banking houses and their bills of exchange."

 nd_pon_arsenal_maintenance: "Trebizond Arsenal Operations"
 nd_pon_arsenal_maintenance_desc: "Lumber, naval supplies, and tools for the Trebizond shipyard."

 nd_pon_refining_steel: "Argyria Steel Refining"
 nd_pon_refining_steel_desc: "Iron and coal smelted into Pontic steel in the mechanised refining works of Argyria."

 # New advances (added in fix pass)
 nd_pon_admiralty_reform: "Pontic Admiralty Reform"
 nd_pon_admiralty_reform_desc: "Centralised naval command at Trebizond, refurbishing the shipyards and crewing standing fleet rosters of Pontic Ships of the Line."

 nd_pon_pontic_mining_revival: "Pontic Alpine Mining Revival"
 nd_pon_pontic_mining_revival_desc: "Modernised mining and refining in the Pontic Alps drives the late-industrial Pontic economy: iron, copper, silver, and steel from the upland workings."

 # ==========================================================================
 # ===== DESTINY TREE LOCALIZATION =====
 # ==========================================================================

 # ----- Destiny advance names and descriptions -----
 nd_pon_destiny: "The Pontic Destiny"
 nd_pon_destiny_desc: "The Pontic restoration is proclaimed. The basileia of Trebizond now charts its course: the Komnenian Roman restoration, or the Black Sea Commonwealth. Choose at formation; the path then unfolds in three stages."

 nd_pon_dest_anatolikon: "The Anatolikon Reconquest"
 nd_pon_dest_anatolikon_desc: "Reach back from the Pontic shore into the old Anatolian heartland. Reconquer Bursa (Prousa) and Iznik (Nicaea) -- the cradle cities of late-Roman Asia Minor and the seat of the second Roman exile after 1204. Requires prestige >= 50."

 nd_pon_dest_aegean_strategos: "The Aegean Strategos"
 nd_pon_dest_aegean_strategos_desc: "Push the Komnenian frontier into the Aegean and the European Balkans. Hold Smyrna, Chios, and Edirne; raise the army to fifty regiments and the kingdom's total development to one thousand. The Pontic-Roman crown now speaks as a peer of all the western powers."

 nd_pon_dest_nea_rhomaion: "Nea Rhomaion -- New Rome Restored"
 nd_pon_dest_nea_rhomaion_desc: "The Komnenian basileus returns from Pontic exile to the Queen of Cities. Hold Constantinople, Thessaloniki, and Athens under one Roman crown; raise the army to seventy-five regiments; reach 75 prestige and 3000 gold. Unlocks the Hagia Sophia Nea Rhomaion in the capital."

 nd_pon_dest_pontic_network: "The Pontic Trade Network"
 nd_pon_dest_pontic_network_desc: "Bind the Black Sea littoral into a single Pontic-led mercantile circulation. Hold Tana on the Sea of Azov and Cetatea Alba on the Dniester mouth; have silk in the Trebizond market; reach 1000 gold. The Pontic shore becomes the central exchange of the Black Sea world."

 nd_pon_dest_caucasian_compact_full: "The Caucasian Compact in Full"
 nd_pon_dest_caucasian_compact_full_desc: "The Bagrationi crown of Georgia and the kingdoms of Imereti and Lazica fold into the Pontic commonwealth. Hold Tbilisi and Kutaisi; embrace the institution of Banking; reach 2000 gold."

 nd_pon_dest_council_of_faithful: "The Council of the Faithful"
 nd_pon_dest_council_of_faithful_desc: "The Black Sea Commonwealth at its full extent. Hold Sukhumi, Batumi, and Poti to bind the western Caucasian shore; embrace Global Trade; raise total development to 1500 and gold to 3000. A federated Orthodox commonwealth of Greek-Caucasian-Pontic peoples. Unlocks the Pontic Council Hall in the capital."

 # ----- Destiny event nd_pon.10 (root) -----
 nd_pon.10.t: "The Pontic Destiny"
 nd_pon.10.d: "The chrysobull of formation has been sealed in violet, the basileus is enthroned, and the new banner of Pontus flies above Trebizond. Now the kingdom must look forward. The senate-chronicle of Bessarion records two great destinies open to the Pontic-Greek house: the slow march of the Komnenoi-of-Trebizond back to the Queen of Cities, gathering all that was lost in 1204 and 1453, or the patient weaving of a Black Sea Commonwealth -- a federated Orthodox compact of Pontic, Caucasian, and frontier peoples around the central shore.\n\nThe choice has been made; what follows is the long work of bringing the destiny into being."
 nd_pon.10.a: "Let the destiny unfold."

 # ----- Destiny event nd_pon.11 (Path A Stage 1) -----
 nd_pon.11.t: "The Anatolikon Reclaimed"
 nd_pon.11.d: "Pontic columns descend from Bursa and Iznik. The old Roman themes of Anatolikon and Opsikion stand again under Pontic-Komnenian banners. The first dream of the Roman restoration is realised: the empire of the Pontic shore now reaches into the Anatolian heartland of the late-Roman house."
 nd_pon.11.a: "The Anatolian themes stand once more."

 # ----- Destiny event nd_pon.12 (Path A Stage 2) -----
 nd_pon.12.t: "The Aegean Reach"
 nd_pon.12.d: "Smyrna, Chios, and Edirne fly Pontic colours. The Komnenian basileia is no longer a Pontic curiosity but a Roman power of the Aegean and the Balkans. The court at Trebizond debates how to project the new strength: by sea, with a Pontic thalassocracy of carracks and galleys ruling the Aegean isles -- or by land, with the field-army stratiotai becoming a permanent Roman corps in the western theatres."
 nd_pon.12.a: "A Pontic thalassocracy of the Aegean."
 nd_pon.12.b: "A permanent stratiotai field-corps."

 # ----- Destiny event nd_pon.13 (Path A Stage 3 -- capstone) -----
 nd_pon.13.t: "Nea Rhomaion -- New Rome Restored"
 nd_pon.13.d: "The Komnenian basileus rides into Constantinople through the Golden Gate. The Hagia Sophia is reconsecrated under the Pontic-Orthodox rite; the chrysobull of New Rome is sealed in violet ink. Thessaloniki and Athens kneel under the same Roman crown. The empire of the Komnenoi-of-Trebizond, founded in Pontic exile in 1204, has restored the Roman idea in fact as well as in name.\n\nWhat shape does the restored Rome take? The court chronicler argues for Basileus Rhomaion -- the empire fully restored, the basileus speaking as Caesar Augustus from the cathedra of Justinian. The metropolitans argue for Pax Komnenia -- a settled Roman order, a Komnenian peace across the eastern Mediterranean, the empire's energies turning to consolidation."
 nd_pon.13.a: "Basileus Rhomaion -- Caesar Augustus restored."
 nd_pon.13.b: "Pax Komnenia -- the Komnenian peace."

 # ----- Destiny event nd_pon.14 (Path B Stage 1) -----
 nd_pon.14.t: "The Black Sea Trade Network"
 nd_pon.14.d: "Tana on the Sea of Azov and Cetatea Alba on the Dniester mouth join the Pontic commercial circulation. Pontic carracks ply the Black Sea triangle from end to end; the Trebizond market is the central exchange of every Black Sea good. The first foundation of the Black Sea Commonwealth is laid."
 nd_pon.14.a: "The Black Sea is a Pontic sea."

 # ----- Destiny event nd_pon.15 (Path B Stage 2) -----
 nd_pon.15.t: "The Caucasian Compact in Full"
 nd_pon.15.d: "The Bagrationi king of Georgia signs the Pontic compact in the cathedral of Mtskheta; the Imeretian crown and the Lazic frontier-lords follow. Tbilisi and Kutaisi join the Pontic council. The Caucasian-Christian frontier is folded into the Black Sea Commonwealth as full partners.\n\nWhat shape does the Caucasian-Pontic union take? The court favours a Caucasian Dynasty -- Bagrationi-Komnenoid blood braided into one ruling house, a single mercantile-Christian dynasty governing both shores. The merchant councils favour a Caucasian League -- a federated league of Pontic-Caucasian trading cities, governed by an annual council at Trebizond, with no single dynasty above the burgher delegates."
 nd_pon.15.a: "A Caucasian-Pontic ruling dynasty."
 nd_pon.15.b: "A Caucasian-Pontic federated league."

 # ----- Destiny event nd_pon.16 (Path B Stage 3 -- capstone) -----
 nd_pon.16.t: "The Council of the Faithful"
 nd_pon.16.d: "The Black Sea Commonwealth assembles its first full council at Trebizond. The burgher delegates of Sinope, Caffa, Tana, and the new Caucasian member-cities of Sukhumi, Batumi, and Poti sit alongside the metropolitan of Trebizond, the abbot of Sumela, and the basileus's chairman. The federated Orthodox commonwealth of Greek-Caucasian-Pontic peoples is now a recognised polity.\n\nWhat form does the Council take? The metropolitans urge an Orthodox Council -- an explicitly confessional body, the Pontic answer to the Council of Trent. The Phanariot houses urge a pluralist Phanariot Commonwealth -- a council where confessional questions are bracketed and Pontic-Greek diaspora administrators serve as the spine of governance."
 nd_pon.16.a: "An Orthodox Council of the Faithful."
 nd_pon.16.b: "A pluralist Phanariot Commonwealth."

 # ----- Destiny timed modifiers -----
 STATIC_MODIFIER_NAME_nd_pon_dest_aegean_thalassocracy: "Aegean Thalassocracy"
 STATIC_MODIFIER_DESC_nd_pon_dest_aegean_thalassocracy: "Pontic carracks and galleys crowd the Aegean isles. The empire's reach is a naval reach; the basileus rules from a deck as much as from a throne."

 STATIC_MODIFIER_NAME_nd_pon_dest_strategoi_legacy: "Strategoi Legacy"
 STATIC_MODIFIER_DESC_nd_pon_dest_strategoi_legacy: "The Pontic stratiotai become a permanent Roman field-corps. Recruitment is steady, morale recovers swiftly, the cavalry's edge sharpens."

 STATIC_MODIFIER_NAME_nd_pon_dest_basileus_rhomaion: "Basileus Rhomaion"
 STATIC_MODIFIER_DESC_nd_pon_dest_basileus_rhomaion: "The basileus speaks as Caesar Augustus from the cathedra of Justinian in the Hagia Sophia. The empire is fully restored. The cost is steep: the new fisc inflates as silver is recoined for the imperial ceremonial."

 STATIC_MODIFIER_NAME_nd_pon_dest_pax_komnenia: "Pax Komnenia"
 STATIC_MODIFIER_DESC_nd_pon_dest_pax_komnenia: "The Komnenian peace settles across the eastern Mediterranean. Friendly territory restores worn troops; the home army learns to bear long campaigns; the Roman peoples accept extended war for the empire's sake."

 STATIC_MODIFIER_NAME_nd_pon_dest_caucasian_dynasty: "Caucasian-Pontic Dynasty"
 STATIC_MODIFIER_DESC_nd_pon_dest_caucasian_dynasty: "The Bagrationi-Komnenoid bloodline binds the two crowns into one ruling house. Pontic merchants find a friendlier reception abroad; devastated provinces recover faster under the dynastic standard."

 STATIC_MODIFIER_NAME_nd_pon_dest_caucasian_league: "Caucasian-Pontic League"
 STATIC_MODIFIER_DESC_nd_pon_dest_caucasian_league: "A federated league of Pontic-Caucasian trading cities, governed by an annual council at Trebizond. The merchant capacity of every member city expands; maritime networks reach further than ever."

 STATIC_MODIFIER_NAME_nd_pon_dest_council_orthodox: "Orthodox Council of the Faithful"
 STATIC_MODIFIER_DESC_nd_pon_dest_council_orthodox: "The Council of the Faithful as an explicitly Orthodox confessional body. Heretic communities are tolerated within the commonwealth's frame; garrison rosters grow steadily; pretender movements wither under conciliar legitimacy."

 STATIC_MODIFIER_NAME_nd_pon_dest_council_phanar: "Phanariot Commonwealth"
 STATIC_MODIFIER_DESC_nd_pon_dest_council_phanar: "The Council of the Faithful as a pluralist Phanariot governance: the Pontic-Greek diaspora administrators are the commonwealth's spine. Naval governorships multiply; levies recruit faster. The cost: council politics distract from the slow craft of training generals."

 # ----- Destiny capstone buildings -----
 nd_pon_hagia_sophia_nea_rhomaion: "Hagia Sophia Nea Rhomaion"
 nd_pon_hagia_sophia_nea_rhomaion_desc: "The reclaimed Great Church of Constantinople, restored as the seat of the Komnenian basileia of New Rome. Justinian's cathedra is occupied once more by a Roman emperor, this time of the Pontic-Komnenoid line."

 nd_pon_nea_rhomaion_ceremonial: "New Roman Imperial Ceremonial"
 nd_pon_nea_rhomaion_ceremonial_desc: "Fine cloth, paper, books, beeswax, and incense for the restored ceremonial of the New Rome: chrysobulls, polychronia, the great cathedral liturgies."

 nd_pon_council_hall: "Pontic Council Hall"
 nd_pon_council_hall_desc: "The Council Hall of the Black Sea Commonwealth: a Phanariot-modelled mercantile council chamber where burgher delegates of every member city meet under Pontic chairmanship."

 nd_pon_council_hall_clerks: "Council Hall Clerks"
 nd_pon_council_hall_clerks_desc: "Paper, books, and fine cloth for the secretariat of the Council of the Faithful: bilingual clerks copying minutes in Greek, Caucasian, and Italian hands."


 # ----- Bureaucracy authority (auto_modifier) -----
 AUTO_MODIFIER_NAME_nd_pon_bureaucracy_authority: "Komnenoid Imperial Authority"
 AUTO_MODIFIER_DESC_nd_pon_bureaucracy_authority: "The restored Komnenoid imperial household at Trebizond inherits the institutional apparatus of the Trapezuntine Empire: the autocephalous Pontic synod at Sumela, the multilingual Logothesion, the Argyria silver-mining authority, and the Caffa-Trebizond mercantile council. Two bureaucracy slots are granted; the capital adds a third."

 # ----- Bureaucracies -----
 pon_synodos_of_the_pontic_church_bureaucracy: "Synodos of the Pontic Church"
 pon_synodos_of_the_pontic_church_bureaucracy_desc: "The autocephalous Pontic Orthodox synod, headed by the Metropolitan of Trebizond and convened at the cliff-monastery of Sumela above the Pyxites valley. The synod gathered the bishops of Trebizond, Kerasounta, Sinope and the Hegumens of Sumela, Vazelon and Peristera alongside the Caucasian Orthodox sees of Lazica and Abkhazia. It chrismated its own bishops, retained a distinct calendar honoring Saints Eugenios and Aquila of Trebizond, and licensed the Pontic-school icon workshops. Its autonomy from Constantinople predated 1204 and outlived the empire by a generation."

 pon_logothesion_of_trebizond_bureaucracy: "Logothesion of Trebizond"
 pon_logothesion_of_trebizond_bureaucracy_desc: "The imperial chancery of the Komnenoi-of-Trebizond, modeled on the Constantinopolitan logothete tradition but adapted to a polyglot diplomatic environment. Under the protonotarios and the megas logariastes it issued chrysobulls in the Trapezuntine chancery hand and drafted correspondence in Greek, Persian, Mongol Turkic and Italian Latin to Ilkhans, Aqquyunlu sultans, Genoese podestas, Venetian bailos and Komnenian collateral lines. Its scroll-keepers recited the Komnenian polychronia at every audience, binding a small empire to a vast diplomatic network."

 pon_argyria_mint_bureaucracy: "Argyria Mint and Mining Authority"
 pon_argyria_mint_bureaucracy_desc: "The coordinated silver-mining and minting apparatus of the Trapezuntine Empire. The Argyria mines in the Pontic Alps south of Tripolis (modern Gumushane, the silver-house) supplied bullion to the imperial mint at Trebizond, which struck the aspron-trachy and the silver aspron-komnenaton in continuous high-fineness issues from the thirteenth century onward. The despotes ton metallon reported directly to the Komnenian household; Trapezuntine silver circulated as the standard medium of Black Sea trade, accepted at Caffa, Sinope, Tana and the Anatolian beyliks."

 pon_caffa_trebizond_council_bureaucracy: "Caffa-Trebizond Mercantile Council"
 pon_caffa_trebizond_council_bureaucracy_desc: "The standing council of major Pontic-Italian-Caffan mercantile families regulating Black Sea trade, prize disputes, customs incidence and convoy escorts. Pontic archontic-mercantile lines (Tzanichites, Skouterides, Mesarites, Doranites) sat alongside Genoese-Caffan houses (Gattilusio, Centurione, Di Negro) and Sinope Greek merchant families. The council met seasonally at Trebizond and Caffa under joint Trapezuntine-Genoese presidency, fixed the kommerkion duties on grain, salt-fish, caviar, alum, silk and slave traffic, and arbitrated inter-city prize cases. It is the Trapezuntine antecedent of the later Phanariot mercantile commonwealth."
