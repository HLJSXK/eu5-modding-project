 # ===== STATIC MODIFIERS: FORMATION CHOICES =====
 STATIC_MODIFIER_NAME_nd_svb_cakkavatti: "Cakkavatti — The Wheel-Turning Monarch"
 STATIC_MODIFIER_DESC_nd_svb_cakkavatti: "The king is bodhisattva and dhamma-raja, the universal monarch who turns the wheel of the law. Centralized sacral kingship in the manner of Angkor's Jayavarman VII and Toungoo Bayinnaung — armies advance under the saffron banner, and the prestige of the throne radiates outward across the mandala."
 STATIC_MODIFIER_NAME_nd_svb_sangha_federation: "The Sangha Federation"
 STATIC_MODIFIER_DESC_nd_svb_sangha_federation: "What binds Suvarnabhumi is not the throne but the trans-mainland Buddhist monastic order. Each Khmer, Thai, Burmese, Mon, and Lao king governs his own people, but every saffron-robed monk crosses every border, and the sangha is the empire. Loose suzerainty, broad tolerance, and the dharma as the only universal law."
 STATIC_MODIFIER_NAME_nd_svb_three_worlds: "The Three Worlds Empire"
 STATIC_MODIFIER_DESC_nd_svb_three_worlds: "King Lithai's Trai Phum Phra Ruang made the empire a mortal-realm reflection of the Buddhist cosmos. Court ceremony, sumptuary law, and karmic-merit hierarchy are all theatrical performances of cosmological order — the king as Mount Meru at the center, the realms of gods, men, and hells radiating outward in elaborate ritual pageantry."

 # ===== STATIC MODIFIERS: ADVANCE EVENTS =====
 STATIC_MODIFIER_NAME_nd_svb_assimilation: "Indochinese Synthesis"
 STATIC_MODIFIER_DESC_nd_svb_assimilation: "The conquered Mon, Khmer, and Lao are not subjects but Suvarnabhumin in the making — Theravada Buddhism is the universal solvent."
 STATIC_MODIFIER_NAME_nd_svb_tributary_mandala: "Mandala of Tributaries"
 STATIC_MODIFIER_DESC_nd_svb_tributary_mandala: "Bayinnaung's model — sub-kings retain their thrones and provide elephant-corps levies in turn for tribute, prestige, and protection."
 STATIC_MODIFIER_NAME_nd_svb_state_sangha: "State-Aligned Sangha"
 STATIC_MODIFIER_DESC_nd_svb_state_sangha: "The reformed sangha-raja hierarchy reports directly to the throne. Royal ordination councils enforce orthodoxy and ritual purity throughout the empire."
 STATIC_MODIFIER_NAME_nd_svb_forest_sangha: "Forest Sangha Tradition"
 STATIC_MODIFIER_DESC_nd_svb_forest_sangha: "The forest-dwelling meditation monks remain the spiritual elite, drawing lay devotion across cultural lines and fostering popular Buddhist piety."
 STATIC_MODIFIER_NAME_nd_svb_open_court: "The Cosmopolitan Court"
 STATIC_MODIFIER_DESC_nd_svb_open_court: "Like King Narai's Ayutthaya, the capital hosts Persian, Japanese, French, Dutch, Chinese, and Indian quarters — the empire becomes a turntable of Eurasian commerce."
 STATIC_MODIFIER_NAME_nd_svb_chosen_advisors: "Chosen Foreign Advisors"
 STATIC_MODIFIER_DESC_nd_svb_chosen_advisors: "Like Sheikh Ahmad and Constantine Phaulkon, select foreigners are elevated to high office while the kingdom's commerce remains under royal monopoly."
 STATIC_MODIFIER_NAME_nd_svb_french_drill: "French Drill Manual"
 STATIC_MODIFIER_DESC_nd_svb_french_drill: "Konbaung infantry drill on the European model — disciplined matchlock formations, volley fire, and bayonet-equipped musketeers serving as elite corps."
 STATIC_MODIFIER_NAME_nd_svb_burmese_arsenal: "The Burmese Royal Arsenal"
 STATIC_MODIFIER_DESC_nd_svb_burmese_arsenal: "State-run gun foundries cast firearms locally rather than importing them, supplying the rapidly expanding levies of the late empire."

 # ===== FORMATION EVENT =====
 nd_svb.1.t: "Suvarnabhumi — The Land of Gold"
 nd_svb.1.d: "What the Pali sutras called Suvarnabhumi — the Golden Land — has come at last under one banner. The wat-temples of Angkor and the chedis of Ayutthaya, the stupa-strewn plain of Bagan and the That Luang of Vientiane, all four civilizational anchors of mainland Southeast Asia answer to a single Buddhist universal monarch. Bayinnaung held this scope briefly before fragmentation; the Khmer Empire dreamed of it before Thai expansion eroded its frontiers; King Lithai imagined it as the mortal-realm Mount Meru of the Trai Phum cosmology. Now the saffron-and-gold dharma-wheel banner flies over every mainland kingdom from Pagan to the Mekong delta. But what is Suvarnabhumi to be — a single sacral throne, a federation under one sangha, or the Three Worlds made flesh?\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_svb.1.a: "Cakkavatti: the universal monarch turns the wheel"
 nd_svb.1.b: "Sangha Federation: kings divided, dharma united"
 nd_svb.1.c: "The Three Worlds: empire as cosmic order"

 # ===== ADVANCE EVENTS =====
 nd_svb.2.t: "Bayinnaung's Vision Fulfilled"
 nd_svb.2.d: "By 1580, the Toungoo king Bayinnaung — what the Portuguese called the most powerful monarch in Asia after the emperor of China — had assembled the largest contiguous polity in Southeast Asian history: Burma proper, the Shan States, Lan Na, Lan Xang, Manipur, and Ayutthaya itself, all sworn vassals to Pegu. He held it together by personal allegiance to the Cakkavatti, ruling from a single capital with no institutional successor. Within a generation of his death, the empire fragmented. We have done what he could not — the doctrine of pan-mainland conquest fulfilled. But how shall we hold what he lost?"
 nd_svb.2.a: "Make every conqueror a Suvarnabhumin"
 nd_svb.2.b: "Rule through the mandala of sub-kings"
 nd_svb.3.t: "The Sinhalese Ordination"
 nd_svb.3.d: "Senior monks have arrived from Sri Lanka — heirs of the Mahavihara orthodoxy, bearing the full Pali canon and the unbroken Theravada lineage stretching back to the Third Buddhist Council. As King Anawrahta did at Bagan, as Ramkhamhaeng did at Sukhothai, we now invite them to re-ordain our own sangha and establish a 'pure' Sinhala lineage. The reformed sangha will bind every monastery from the Irrawaddy to the Mekong under one ordination — but who shall command it: the throne, or the forest hermitage?"
 nd_svb.3.a: "The sangha-raja answers to the throne"
 nd_svb.3.b: "Honor the forest-dwelling masters"
 nd_svb.4.t: "The Cosmopolitan Court"
 nd_svb.4.d: "Embassies arrive — French Jesuits, Persian Shi'ites with the merchant lord Sheikh Ahmad, Japanese ronin retainers, Dutch VOC factors, Chinese tea-traders, English East India Company envoys, and Indian Muslim port-officials all jostling for position at the capital. Persian quarters and Japanese settlements line the riverfront alongside Portuguese churches and Chinese pagodas. The empire has become — as Ayutthaya was under Narai — a turntable of Eurasian commerce. Shall we throw the gates wide, or carefully select our partners?"
 nd_svb.4.a: "All quarters, all flags welcome"
 nd_svb.4.b: "Elevate chosen foreigners; control the rest"
 nd_svb.5.t: "Konbaung's Gunpowder Reform"
 nd_svb.5.d: "Alaungpaya, founder of the Konbaung line, has decreed standardized matchlock training and disciplined volley-fire formations. Teak war-boats now carry up to thirty musketeers and 6-pounder swivel cannon; siege artillery is mounted on wooden platforms to clear walls. French gunners — drifted east after Pondicherry's troubles — drill our infantry in European fashion. Shall we follow their model wholesale, or build our own arsenal?"
 nd_svb.5.a: "Adopt the European drill manual"
 nd_svb.5.b: "Royal arsenals, Burmese pattern"
 nd_svb.6.t: "The Three Worlds Codified"
 nd_svb.6.d: "King Lithai's Trai Phum Phra Ruang — the Three Worlds According to King Ruang — has become the canonical ideology of statecraft. Composed in 1345 as the oldest known work of Thai literature, it maps the thirty-one realms of Buddhist cosmology: eleven levels of the desire-realm Kamadhatu, sixteen of the form-realm Rupadhatu, four of the formless Arupadhatu. Every painted hell-scene at every wat now reminds the laity that good karma leads to heaven and evil to torment. The empire is reframed as the mortal mirror of Mount Meru, and the king reigns at the cosmic center."
 nd_svb.6.a: "Let every wat paint the realms anew"
 nd_svb.7.t: "The Hydraulic City"
 nd_svb.7.d: "Across one thousand square kilometers of the Angkor plain, our engineers have completed the network of barays, canals, moats, and embankments that gave the Khmer Empire its agricultural foundation. The West Baray alone holds enough water to recharge the dry-season groundwater table for the whole region; the Jayatataka supplies the city itself. Twin monsoon floods are tamed, paddy is double-cropped, and what was sustained engineering brilliance under Suryavarman now serves a renewed Suvarnabhumi. The fourteenth-century droughts that broke Angkor's old hydraulic city will not break ours — we have learned from history."
 nd_svb.7.a: "The Land of Gold drinks deep"

 # ===== ADVANCES =====
 nd_svb_baray_engineering: "Baray Engineering"
 nd_svb_baray_engineering_desc: "The Khmer hydraulic-city tradition of monsoon water management — vast reservoirs, canal networks, and embankments that captured the wet season's floods to recharge the dry season's paddy fields."
 nd_svb_pali_sangha: "The Pali Sangha"
 nd_svb_pali_sangha_desc: "Adopting Pali as the canonical liturgical language unites the trans-mainland Theravada monastic order — Khmer, Mon, Burmese, Thai, and Lao monks all chant the same suttas, cross every border, and form a continuous spiritual fabric."
 nd_svb_wat_architecture: "Wat-Temple Architecture"
 nd_svb_wat_architecture_desc: "The Indianized stone-temple tradition that produced Angkor Wat, the Bayon, and Bagan's stupa-strewn plain — sandstone and laterite assembled into mountain-temple complexes that anchor the spiritual geography of the realm."
 nd_svb_riverine_warfare: "Riverine Warfare"
 nd_svb_riverine_warfare_desc: "Long teak war canoes manned by drummed-rowed crews, fighting on the Mekong, the Chao Phraya, and the Irrawaddy — the great river systems that are mainland Southeast Asia's true highways."
 nd_svb_monsoon_paddy: "Monsoon Paddy Intensification"
 nd_svb_monsoon_paddy_desc: "Wet-rice double-cropping along the great rivers, sustained by communal labor mobilization and traditional water management — the agricultural foundation that allowed Angkor and Pagan to feed their imperial populations."
 nd_svb_bronze_buddha: "Bronze Buddha Foundry"
 nd_svb_bronze_buddha_desc: "The lost-wax casting of bronze Buddha images, a major artistic-religious industry from the Sukhothai walking Buddhas to the seated Mara-victories of Mandalay. State foundries supply the temples; donor patronage funds the casting; merit accrues to king and devotee alike."
 nd_svb_royal_chedi: "Royal Chedi-Stupa Construction"
 nd_svb_royal_chedi_desc: "Monumental relic-mound construction as legitimacy theater — every king must crown a chedi, and the great gilded spires of Pegu, Ayutthaya, and Vientiane mark the dynastic genealogy of the empire."
 nd_svb_sinhalese_ordination: "Sinhalese Ordination Reform"
 nd_svb_sinhalese_ordination_desc: "Importing senior monks from Sri Lanka to re-ordain the local sangha and establish a 'pure' Mahavihara lineage — the reform pattern that ran from Anawrahta's Bagan and Ramkhamhaeng's Sukhothai down to the eighteenth-century reordinations of mainland Theravada."
 nd_svb_elephant_doctrine: "Royal Elephant Kraal Doctrine"
 nd_svb_elephant_doctrine_desc: "The mass capture and training of war elephants — Khmer, Thai, and Burmese kings all maintained royal kraals where wild herds were corralled, broken to harness, and trained for battle, parade, and royal hunts. The institutional doctrine that produced the empire's elephant corps."
 nd_svb_mandala_statecraft: "Mandala Statecraft"
 nd_svb_mandala_statecraft_desc: "The Indianized concentric-tributary kingship model: a divine-king at the cosmic center surrounded by sub-kings owing personal allegiance, a system that scales from a single river-valley capital to a pan-mainland empire."
 nd_svb_toungoo_elephants: "Toungoo Elephant Doctrine"
 nd_svb_toungoo_elephants_desc: "Bayinnaung's signature — massed columns of war elephants in disciplined heavy-shock formations, supported by infantry and cavalry. The Portuguese described his elephant corps as the most formidable in Asia, eclipsing even the Mughal mass."
 nd_svb_great_river_port: "The Great River Ports"
 nd_svb_great_river_port_desc: "Establishing entrepot ports at the mouths and confluences of the Mekong, the Chao Phraya, and the Irrawaddy — the river-mouth trading cities that bind upcountry rice and gemstones to the maritime spice routes."
 nd_svb_gemstone_trade: "Gemstone Trade Monopolies"
 nd_svb_gemstone_trade_desc: "Burmese rubies from the Mogok valley, Cambodian sapphires from Pailin, and the spinels and pearls of the inland trade — royal monopolies on the mainland's gem fields, sold through Ayutthaya and Pegu to the world."
 nd_svb_bayinnaung_doctrine: "Bayinnaung Doctrine"
 nd_svb_bayinnaung_doctrine_desc: "The strategic blueprint of pan-mainland conquest: rapid mobilization of multi-cultural levies, mass-elephant assault columns, and the suppression of Shan rebels and Lao resistance through overwhelming concentration of force."
 nd_svb_lacquerware: "Lacquerware Tradition"
 nd_svb_lacquerware_desc: "The Burmese yun and Thai lai-rod-nam court crafts — sap-of-the-thitsi-tree lacquer applied in many layers to bamboo and wood, then incised, gilded, or inlaid with mother-of-pearl. A signature export of the mainland courts."
 nd_svb_cakkavatti_guard: "The Cakkavatti Royal Guard"
 nd_svb_cakkavatti_guard_desc: "The elite household infantry of the universal monarch — palace guards drawn from soldier-castes, drilled in the king's own compound, and answerable directly to the throne. The personal retinue of the dhamma-raja."
 nd_svb_cosmopolitan_court: "Cosmopolitan Court"
 nd_svb_cosmopolitan_court_desc: "The capital becomes the diplomatic crossroads of Eurasia — Persian Shi'ite ministers, Japanese mercenary captains, French Jesuit emissaries, Dutch VOC factors, and Chinese tea-merchants all enrolled at court, each in their own assigned quarter."
 nd_svb_trai_phum: "Trai Phum Cosmology"
 nd_svb_trai_phum_desc: "King Lithai's Three Worlds According to King Ruang — the canonical Buddhist cosmology of mainland Southeast Asian statecraft, mapping thirty-one realms from the Avici hells through human existence to the formless heavens of the Brahmas."
 nd_svb_sumptuary_law: "Royal Sumptuary Law"
 nd_svb_sumptuary_law_desc: "Elaborate gradation of dress, parasol-tiers, palanquin-types, and ceremonial speech-registers, all encoding karmic-merit hierarchy in visible form. The court becomes a living theatre of cosmological order."
 nd_svb_early_gunpowder: "Early Matchlock Adoption"
 nd_svb_early_gunpowder_desc: "Portuguese mercenaries and traders bring matchlock muskets and bronze cannons to mainland courts. Diogo Soares de Mello served at Ayutthaya, Filipe de Brito ruled Syriam — the Iberian gunpowder revolution arrives early on the Bay of Bengal."
 nd_svb_monk_soldiers: "Reformist Sangha"
 nd_svb_monk_soldiers_desc: "Reformist saffron-robed monastics actively shape state policy, mediate disputes, and lead lay piety movements. The sangha-state alliance becomes the empire's spiritual bone."
 nd_svb_burmese_musketeer: "Burmese Musketeer Corps"
 nd_svb_burmese_musketeer_desc: "Standing matchlock infantry recruited from the rural hinterland and drilled at royal cantonments — Konbaung's signature force, deployed in disciplined volleys and trained in jungle and wetland combat."
 nd_svb_konbaung_reform: "Konbaung Military Reform"
 nd_svb_konbaung_reform_desc: "Alaungpaya's organizational reforms — standardized levy recruitment from rural districts, integrated firearms training, and royal decrees on musket handling — transforming traditional mass-elephant levies into a hybrid gunpowder army."
 nd_svb_theravada_state: "Theravada State Religion"
 nd_svb_theravada_state_desc: "The formal codification of Theravada Buddhism as imperial state ideology — royal dhamma-raja titulature, state ordination councils, and chedi-construction tied to dynastic legitimacy."
 nd_svb_imperial_roads: "Imperial Pilgrim Roads"
 nd_svb_imperial_roads_desc: "The great trunk roads connecting the wat-temple sites of the empire — pilgrim routes that double as troop-march and tax-collector roads, knitting the river-valley capitals into a single administrative fabric."
 nd_svb_dharma_protector: "Protector of the Dharma"
 nd_svb_dharma_protector_desc: "The royal title sasana-bhirakkhita — protector of the Buddhist dispensation. The king maintains the sangha, sponsors the canonical councils, and gilds the great chedis as karmic merit accruing to throne and dynasty."
 nd_svb_jingal_artillery: "Konbaung Jingal Artillery"
 nd_svb_jingal_artillery_desc: "Pivot-mounted swivel guns and zumbooruks — large-bore wall pieces and camel-mounted small cannon that bridged the gap between musket and field artillery in the late Burmese armies."
 nd_svb_pan_mainland_identity: "Pan-Mainland Identity"
 nd_svb_pan_mainland_identity_desc: "The shared Theravada civilizational consciousness becomes a self-aware imperial identity — Suvarnabhumin, not Khmer or Thai or Burmese, is what the educated subject increasingly calls themselves."
 nd_svb_anti_colonial_stance: "Resist Colonial Penetration"
 nd_svb_anti_colonial_stance_desc: "Where the historical fragmented mainland fell piecewise to British Burma, French Indochina, and the unequal treaties imposed on Siam, a unified Suvarnabhumi confronts European expansion as a single great power — and may yet hold the line."
 nd_svb_rice_industrial_export: "Industrial Rice Export"
 nd_svb_rice_industrial_export_desc: "The Chao Phraya and Irrawaddy deltas, drained and double-cropped on an industrial scale, become the rice basket of monsoon Asia — feeding Singapore, Hong Kong, Calcutta, and the labor lines of the South China Sea."

 # ===== UNITS =====
 n_nd_svb_war_canoe: "War Canoe"
 n_nd_svb_war_canoe_desc: "Long teak fighting canoe rowed by drummed crews, mounting bow chasers and packed with javelin-and-firearm marines. The signature riverine warship of mainland Southeast Asia."
 a_nd_svb_toungoo_elephant: "Toungoo War Elephant"
 a_nd_svb_toungoo_elephant_desc: "Mass-elephant heavy shock cavalry in the Toungoo manner — armored war elephants in massed columns, each carrying mahout, archers, and matchlock men in the howdah, deployed in disciplined assault lines."
 a_nd_svb_cakkavatti_guard: "Cakkavatti Royal Guard"
 a_nd_svb_cakkavatti_guard_desc: "Elite household heavy infantry of the dhamma-raja — armored palace guards drawn from soldier-caste families, sworn personally to the universal monarch."
 a_nd_svb_cakkavatti_guard_levy: "Cakkavatti Royal Guard"
 a_nd_svb_cakkavatti_guard_levy_desc: "Levy form of the Cakkavatti Royal Guard."
 a_nd_svb_burmese_musketeer: "Burmese Musketeer"
 a_nd_svb_burmese_musketeer_desc: "Konbaung-era matchlock light infantry, trained in jungle and wetland combat. The mainstay of the late mainland gunpowder army, equally at home in stockade defense and amphibious assault."
 a_nd_svb_burmese_musketeer_levy: "Burmese Musketeer"
 a_nd_svb_burmese_musketeer_levy_desc: "Levy form of the Burmese Musketeer."
 a_nd_svb_jingal_artillery: "Jingal Artillery"
 a_nd_svb_jingal_artillery_desc: "Konbaung swivel-gun and camel-borne zumbooruk crews — the late Burmese answer to European field artillery, mobile and well-suited to the river-valley terrain of the empire."

 # ===== BUILDINGS =====
 nd_svb_baray: "Royal Baray"
 nd_svb_baray_desc: "The vast earthen-embankment monsoon reservoir of the Khmer hydraulic city — capturing wet-season floods to feed dry-season paddy and recharging the regional water table for sustained agricultural intensification."
 nd_svb_baray_maintenance: "Baray Upkeep"
 nd_svb_baray_maintenance_desc: "Maintaining embankments, sluices, and feeder canals against monsoon erosion."
 nd_svb_pali_college: "Pali Monastic College"
 nd_svb_pali_college_desc: "A residential teaching monastery where Pali grammar, the Tipitaka canon, and Abhidhamma philosophy are taught to ordained monks — the spiritual and educational backbone of the trans-mainland sangha."
 nd_svb_pali_college_maintenance: "Pali College Upkeep"
 nd_svb_pali_college_maintenance_desc: "Palm-leaf manuscript copying, monastic robes, and the daily incense and dana offerings of the temple."
 nd_svb_wat_temple: "Royal Wat-Temple"
 nd_svb_wat_temple_desc: "An Angkor or Bagan style stone-temple complex — concentric galleries, central prang or stupa-spire, libraries, ordination hall, and surrounding monk-quarters. The spiritual anchor of the surrounding region."
 nd_svb_wat_temple_maintenance: "Wat-Temple Upkeep"
 nd_svb_wat_temple_maintenance_desc: "Sandstone repair, gilding renewal, ceremonial cloth, and the constant burning of incense before the central images."
 nd_svb_bronze_buddha_foundry: "Bronze Buddha Foundry"
 nd_svb_bronze_buddha_foundry_desc: "The lost-wax casting workshop where bronze Buddha images, ceremonial bells, and gilded ritual vessels are produced for temples across the empire and for export — a major consumer-goods industry tied to religious devotion."
 nd_svb_bronze_buddha_foundry_operation: "Lost-Wax Bronze Casting"
 nd_svb_bronze_buddha_foundry_operation_desc: "Beeswax model carving, clay investment, copper-tin alloy melt, and the long polishing and gilding of finished bronze Buddha images and sacred vessels — luxury religious metalwork for temples across the empire."
 nd_svb_chedi_stupa: "Royal Chedi-Stupa"
 nd_svb_chedi_stupa_desc: "A monumental gilded relic-mound — the dynastic merit-monument of mainland Theravada kingship, marking the central axis of the capital and gathering pilgrim devotion across the realm."
 nd_svb_chedi_stupa_maintenance: "Chedi Upkeep"
 nd_svb_chedi_stupa_maintenance_desc: "Gold-leaf renewal, masonry repair, and the perpetual offerings of pilgrim devotion."
 nd_svb_elephant_kraal: "Royal Elephant Kraal"
 nd_svb_elephant_kraal_desc: "A massive timber-stockade compound where wild elephants are corralled, sorted, broken to harness, and trained — the breeding and training ground of the empire's war-elephant corps."
 nd_svb_elephant_kraal_maintenance: "Kraal Upkeep"
 nd_svb_elephant_kraal_maintenance_desc: "Daily fodder, harness leather and rope, and the constant rebuilding of stockade timbers and feeding-stalls."
 nd_svb_river_port: "Riverine Entrepot Port"
 nd_svb_river_port_desc: "A walled river-mouth port — Bago, Ayutthaya, Phnom Penh, Vientiane, Yangon — fortified warehouses, foreign quarters, and stone docks that anchor the empire's river-based commerce to the maritime spice routes."
 nd_svb_river_port_maintenance: "River Port Upkeep"
 nd_svb_river_port_maintenance_desc: "Dredging silt-prone channels, hull-careening, naval-stores depots, and the constant repair of stone docks and timber piers."

 # ===== EVENT TOOLTIP VARIABLES =====
 nd_svb_formed_tt: "Suvarnabhumi has been formed."
 nd_svb_path_a_tt: "Path: Cakkavatti — Universal Buddhist Monarch."
 nd_svb_path_b_tt: "Path: Sangha Federation — kings divided, dharma united."
 nd_svb_path_c_tt: "Path: The Three Worlds Empire — cosmological statecraft."

 # ===== ADDITIONAL BUILDINGS =====
 nd_svb_lacquerware_atelier: "Lacquerware Atelier"
 nd_svb_lacquerware_atelier_desc: "A guild workshop producing Burmese yun and Thai lai-rod-nam lacquerware — sap-of-the-thitsi-tree applied in many layers to bamboo and wood, then incised, gilded, or inlaid with mother-of-pearl. The signature luxury export of the mainland courts."
 nd_svb_lacquerware_atelier_operation: "Lacquerware Production"
 nd_svb_lacquerware_atelier_operation_desc: "Cutting bamboo cores, layering thitsi sap, polishing, and decorating finished pieces in the court styles."
 nd_svb_gem_workshop: "Royal Gem Workshop"
 nd_svb_gem_workshop_desc: "A guild atelier where Mogok rubies, Pailin sapphires, and the spinels and pearls of the inland trade are cut, polished, and set in gold for the royal court and the export market."
 nd_svb_gem_workshop_operation: "Royal Gem-Setting"
 nd_svb_gem_workshop_operation_desc: "Faceting and polishing rough stones, gold-setting and silver-mounting, and pricing finished jewels for court use and export."
 nd_svb_royal_arsenal: "Royal Arsenal"
 nd_svb_royal_arsenal_desc: "A state-run gun foundry and powder mill — saltpeter from inland deposits, iron from the hills, and lumber from the teak forests are combined into matchlock muskets, swivel guns, and bronze cannons under royal monopoly."
 nd_svb_royal_arsenal_operation: "Royal Firearms Production"
 nd_svb_royal_arsenal_operation_desc: "Bore-drilling, stock-fitting, powder-grinding, and the testing and fielding of finished royal-issue firearms."

 # ===== DESTINY ADVANCES =====
 nd_svb_destiny: "Suvarnabhumi Destined"
 nd_svb_destiny_desc: "The Land of Gold awakens to its imperial vocation. From the wat-spires of Pagan to the chedis of Vientiane, the Cakkavatti's wheel begins to turn. Achieve stability 75 to consolidate the new order and unlock a destiny path."
 nd_svb_dest_champa_conquest: "The Champa Conquest"
 nd_svb_dest_champa_conquest_desc: "The Cham coastal cities — Simhapura, Vijaya — must fall to the saffron banner before the eastern frontier can be secured. Push elephant columns across the Annamite range and break the last Hindu kingdom of mainland Southeast Asia. Required: own Simhapura and Vijaya, army size 30."
 nd_svb_dest_red_river: "The Red River Submits"
 nd_svb_dest_red_river_desc: "Đại Việt held the Red River against southern empires for a millennium. To complete the Cakkavatti's circuit, even Thăng Long must answer to Pegu. Required: own Thăng Long, total development 9500, army size 50."
 nd_svb_dest_universal_monarch: "Universal Monarch's Realm"
 nd_svb_dest_universal_monarch_desc: "Yunnan in the north, Malacca and Temasek in the south — the four cardinal anchors of the Cakkavatti's wheel. What Bayinnaung lost in a generation, we hold by destiny. Unlocks the Cakkavatti's Throne. Required: own Kunming, Malacca, and Temasek, army size 75, prestige 75."
 nd_svb_dest_sinhalese_axis: "The Sinhalese Axis"
 nd_svb_dest_sinhalese_axis_desc: "The trans-mainland sangha is born from the Mahavihara at Anuradhapura. Re-establish the Sinhalese ordination axis with mainland endowments and the printing press to bind every monastery in one orthodoxy. Required: own Anuradhapura, gold 1000, embraced Printing Press."
 nd_svb_dest_three_worlds_flesh: "Three Worlds Made Flesh"
 nd_svb_dest_three_worlds_flesh_desc: "Trai Phum cosmology demands that the empire be a mortal-realm mirror of Mount Meru — gilded chedis, lacquered halls, gem-encrusted Buddha images. The luxury-export economy underwrites the cosmological state. Required: total development 9500, gems and lacquerware in your markets, prestige 50."
 nd_svb_dest_civilization_suvarnabhumi: "The Civilization of Suvarnabhumi"
 nd_svb_dest_civilization_suvarnabhumi_desc: "From Pagan's manuscript libraries to Ayutthaya's Persian quarters, the empire becomes the Eurasian crossroads of letters and learning. A unified Theravada civilization, prosperous and literate, takes its place among the great empires of the world. Unlocks the Pali University. Required: embraced Scientific Revolution, gold 3000, total development 12500."

 # ===== DESTINY EVENTS =====
 nd_svb.8.t: "The Wheel Turns"
 nd_svb.8.d: "What was prophesied in the Sutta Pitaka has come at last — a Cakkavatti has arisen in the Land of Gold, and the wheel of the dharma turns again. From the western Irrawaddy to the eastern Mekong, monasteries fly the saffron banner; from the Cham coast to the Sri Lankan straits, embassies seek out the universal monarch. The court astrologers cast horoscopes; the ministers debate doctrine. The road ahead branches: shall the Wheel be turned by the sword of conquest, or by the gentler turning of the dharma's law?"
 nd_svb.8.a: "Let the wheel turn."
 nd_svb.9.t: "The Cham Coast Falls"
 nd_svb.9.d: "Simhapura's red-brick towers, Vijaya's harbor walls — the last Cham strongholds have surrendered to our elephant corps. The Hindu kingdom that fought Khmer and Đại Việt for a thousand years bows at last to a Buddhist universal monarch. The eastern frontier is secured; the South China Sea opens to our shipping. The Annamite range, that ancient barrier between mainland and coast, is no longer a frontier but an inner road."
 nd_svb.9.a: "Onward to the Red River."
 nd_svb.10.t: "Thăng Long Submits"
 nd_svb.10.d: "Where Lê dynasty Đại Việt repulsed Mongol khans and Ming emperors, our forces have done what no southern power achieved — taken Thăng Long itself. The Red River delta, with its dense rice-population and fortified citadels, now answers to the Cakkavatti. The question is how to govern this most ancient and most stubborn of mainland kingdoms: as Suvarnabhumin like all the rest, or as a perpetually garrisoned northern march?"
 nd_svb.10.a: "Make Đại Việt a Suvarnabhumi province."
 nd_svb.10.b: "Garrison the Red River as a northern march."
 nd_svb.11.t: "The Universal Monarch's Realm"
 nd_svb.11.d: "Kunming in the north, Malacca and Temasek in the south — the four cardinal anchors are ours. From the Tai-Yi salt-mines of Yunnan to the spice quays of the Strait, from the Cham coast to the Sinhalese ordination-axis, the entire mandala of mainland Southeast Asia answers to one Cakkavatti. The dhamma-raja sits at the cosmic center, and the saffron wheel turns over a domain Bayinnaung could only dream of holding. Now we must decide what kind of empire this is to be — a centralized dharma-imperium administered from a single throne, or the apex of a tributary mandala in which sub-kings rule under the universal monarch's protection?"
 nd_svb.11.a: "A unified dharma-imperium."
 nd_svb.11.b: "The mandala of sub-kings reaches its apex."
 nd_svb.12.t: "The Mahavihara Lineage"
 nd_svb.12.d: "Senior monks have arrived from the Mahavihara at Anuradhapura, bearing the unbroken Sinhalese ordination back to its mainland disciples. Where Anawrahta and Ramkhamhaeng received it piecemeal, we hold the entire axis — Anuradhapura, Pagan, Ayutthaya, Vientiane, the printing presses already at work multiplying the Tipitaka in Pali, Khmer, Burmese, Mon, and Lao scripts. The sangha is now a single fabric stretching from the Sri Lankan dagobas to the Mekong delta."
 nd_svb.12.a: "The orthodoxy is established."
 nd_svb.13.t: "The Three Worlds Codified"
 nd_svb.13.d: "King Lithai's Trai Phum has become the imperial cosmology — every wat hall painted with the thirty-one realms, every chedi gilded as a mortal Mount Meru, every Buddha image cast in bronze and lacquer-finished by court ateliers. Mogok rubies, Pailin sapphires, and the goldsmith's craft of Ayutthaya supply the empire's visible wealth. The civilizational ideology demands an organizational core to sustain it — shall the court ateliers concentrate craftsmanship at the capital, or shall the merit-economy of pilgrimage routes spread prosperity across the wat-temples of the realm?"
 nd_svb.13.a: "Concentrate craft at the court."
 nd_svb.13.b: "Cultivate the pilgrim economy of the wats."
 nd_svb.14.t: "The Civilization of Suvarnabhumi"
 nd_svb.14.d: "From Pagan's palm-leaf libraries to Ayutthaya's Persian quarter, from the Mahavihara monks to the Konbaung astronomers, Suvarnabhumi has become a self-aware civilization — peer of the Ming court, the Mughal durbar, the Ottoman Porte, and the European chancelleries. Pali commentaries, court chronicles, and astronomical treatises pour from the printing presses. The sangha-state has produced its own renaissance. Now the elders debate the empire's intellectual settlement: a flourishing of textual scholarship across all schools, or a single canonical council to fix the orthodoxy for ages to come?"
 nd_svb.14.a: "A flourishing of Pali letters."
 nd_svb.14.b: "Convene the canonical council."

 # ===== DESTINY TIMED MODIFIERS =====
 STATIC_MODIFIER_NAME_nd_svb_dest_dai_viet_subjugation: "Đại Việt Subjugated"
 STATIC_MODIFIER_DESC_nd_svb_dest_dai_viet_subjugation: "The Red River delta is folded into Suvarnabhumi proper. Veteran armies push outward, casus belli are easy to come by, and the long supply lines of empire extend beyond the monsoon rains."
 STATIC_MODIFIER_NAME_nd_svb_dest_red_river_garrison: "The Red River Garrison"
 STATIC_MODIFIER_DESC_nd_svb_dest_red_river_garrison: "The Đại Việt frontier is held as a fortified northern march — heavy garrisons, long defensive walls along the Hồng River, and locally-recruited levy regiments that can be mobilized in season."
 STATIC_MODIFIER_NAME_nd_svb_dest_dharma_imperium: "The Dharma Imperium"
 STATIC_MODIFIER_DESC_nd_svb_dest_dharma_imperium: "A single sacral throne rules the mainland from Pagan to Tonkin. Conquered cultures integrate quickly, the rice-baskets of the great deltas feed the imperial population, and the levy-ban resources can be mobilized at speed."
 STATIC_MODIFIER_NAME_nd_svb_dest_mandala_apex: "The Mandala at Apex"
 STATIC_MODIFIER_DESC_nd_svb_dest_mandala_apex: "The tributary system reaches its peak — sub-kings at Pegu, Ayutthaya, Lan Xang, and Đại Việt provide elephant-corps levies and rapid-march support, but the sangha must feed itself across vast distances."
 STATIC_MODIFIER_NAME_nd_svb_dest_court_atelier: "Court Atelier System"
 STATIC_MODIFIER_DESC_nd_svb_dest_court_atelier: "The royal workshops of Pegu, Ayutthaya, and Vientiane concentrate the empire's master artisans — gilded glassware, gem-set lacquer, and the burgher guilds prosper under royal protection."
 STATIC_MODIFIER_NAME_nd_svb_dest_pilgrim_economy: "The Pilgrim Economy"
 STATIC_MODIFIER_DESC_nd_svb_dest_pilgrim_economy: "The great wat-temple network draws lay devotion across the empire — pilgrim quarters fill the towns, monastic dispensaries spread medical knowledge, and the merit-economy lubricates ordinary commerce."
 STATIC_MODIFIER_NAME_nd_svb_dest_pali_renaissance: "The Pali Renaissance"
 STATIC_MODIFIER_DESC_nd_svb_dest_pali_renaissance: "Printing presses pour out Pali commentaries, Khmer chronicles, and Burmese astronomical treatises. Literacy spreads from the monasteries to the lay population, and the empire heals quickly from the wars of conquest."
 STATIC_MODIFIER_NAME_nd_svb_dest_canonical_council: "The Canonical Council"
 STATIC_MODIFIER_DESC_nd_svb_dest_canonical_council: "A single great council fixes the orthodox Tipitaka for all of Suvarnabhumi. Clergy power and noble literacy rise together, but heterodox schools are suppressed and the political settlement is uneasy."

 # ===== DESTINY BUILDINGS =====
 nd_svb_cakkavatti_throne: "Cakkavatti's Throne"
 nd_svb_cakkavatti_throne_desc: "The universal monarch's audience hall — a vast pillared chamber at the cosmic center of the realm, where ambassadors from the four cardinal directions kneel before the dhamma-raja. Capital only."
 nd_svb_cakkavatti_throne_maintenance: "Throne Hall Upkeep"
 nd_svb_cakkavatti_throne_maintenance_desc: "Court silks, ceremonial regalia, and the daily provisioning of the universal monarch's retinue."
 nd_svb_pali_university: "Pali University"
 nd_svb_pali_university_desc: "A great trans-mainland scholastic monastery — printing presses turning out the Tipitaka, lecture halls debating Abhidhamma philosophy, and Pali grammar taught alongside Sanskrit, Persian, and astronomical sciences. The intellectual capital of Theravada civilization."
 nd_svb_pali_university_maintenance: "Pali University Upkeep"
 nd_svb_pali_university_maintenance_desc: "Manuscript copying, printed-book editions of the Tipitaka, daily incense and dana offerings, and the robes of the resident sangha."

