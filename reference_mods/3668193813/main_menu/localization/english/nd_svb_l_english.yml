 # ===== BUREAUCRACIES =====
 svb_royal_sangha_council_bureaucracy: "Royal Sangha Council"
 svb_royal_sangha_council_bureaucracy_desc: "A state-appointed Sangharaja and a council of elder theras (the Sudhamma model formalized by Bayinnaung's 1560s sasana-purification reforms and the Burmese Thathanabaing of 1784) certify ordinations, police monastic discipline, and arbitrate doctrinal disputes across the trans-mainland sangha. Theravada cohesion becomes a binding institution above any one realm, but provincial abbots resent central oversight."
 svb_sakdina_hierarchy_bureaucracy: "Sakdina Hierarchy"
 svb_sakdina_hierarchy_bureaucracy_desc: "King Borommatrailokkanat's 1454 codification of dignity-rank: every subject is assigned a numerical sakdina corresponding to rai of land, governing court precedence, service-grant entitlement, and even legal procedure (testimony weight scaled to rank). The defining administrative innovation of Ayutthaya, copied across the Tai-Khmer-Mon world."
 svb_mandala_tributary_ring_bureaucracy: "Mandala Tributary Ring"
 svb_mandala_tributary_ring_bureaucracy_desc: "The Indianized circle-of-kings: a paramount cakkavatti at the cosmic center, ringed by tributary kings paying bunga mas, kneeling at coronation, and providing levies in war. Bayinnaung's 1564 reduction of Maha Chakkraphat to vassal-king of Pegu is the textbook case. Sovereignty radiates from prestige, not from fixed borders."
 svb_court_brahmin_college_bureaucracy: "Court Brahmin College"
 svb_court_brahmin_college_bureaucracy_desc: "The Phra Maha Rajaguru and the Devasathan: court Brahmins retained from pre-Theravada Indianization to perform coronation rites (Borommatrailokkanat's 1460s ceremony), the Trīyampawāi seasonal swing-rituals, and astrological-cosmological consultation. A foreign-stock specialist caste serving the throne directly, sidestepping both the sangha and the noble hierarchy."
 svb_royal_elephant_corps_bureaucracy: "Royal Elephant Corps"
 svb_royal_elephant_corps_bureaucracy_desc: "The king's elephant stable: war-elephant breeding, a hereditary mahout caste, and the cosmological 'elephant treasure' that marks the seven regalia of a universal monarch. Bayinnaung's 1563 white-elephant war against Ayutthaya turned a captured albino into a casus belli. The corps is at once military shock, royal prestige, and Buddhist iconography."
 svb_phrai_corvee_registry_bureaucracy: "Phrai Corvée Registry"
 svb_phrai_corvee_registry_bureaucracy_desc: "The Ayutthaya labor draft. Free commoners (phrai luang) are registered to nai master-officials and owe six months of royal service per year — public works, monsoon dyke repair, royal granary, military mobilization. Codified alongside sakdina but mechanically distinct: this is the mobilization base of the realm. Nobles fight over phrai-counts more bitterly than over land."

 # ===== BUREAUCRACY AUTHORITY (auto-modifier on formation) =====
 AUTO_MODIFIER_NAME_nd_svb_bureaucracy_authority: "Cakkavatti's Mandala"
 AUTO_MODIFIER_DESC_nd_svb_bureaucracy_authority: "On formation, [SVB.GetName] gains the institutional reach of a universal-monarch realm — the capacity to host historical mainland-Theravada bureaucracies. The capital provides one slot; the cakkavatti's prerogative grants two more."
