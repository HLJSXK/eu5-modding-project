l_english:

# ===== STATIC MODIFIERS =====
 STATIC_MODIFIER_NAME_nd_drr_loya_jirga: "Loya Jirga of Kandahar"
 STATIC_MODIFIER_DESC_nd_drr_loya_jirga: "The grand assembly of Pashtun chieftains has bound the tribes by oath. Manpower flows from every Abdali, Ghilji, and Tajik valley, and the standard of the new Shah is honoured from Herat to the Khyber."

 STATIC_MODIFIER_NAME_nd_drr_sword_of_khorasan: "Sword of Khorasan"
 STATIC_MODIFIER_DESC_nd_drr_sword_of_khorasan: "The Shah's army marches in the tradition of Nadir, descending from the Afghan highlands toward Persia and Hindustan. The Empire is built sabre by sabre, each campaign paid for in plunder."

 STATIC_MODIFIER_NAME_nd_drr_panipat_press: "After Panipat"
 STATIC_MODIFIER_DESC_nd_drr_panipat_press: "The Marathas are broken on the field of Panipat. The Shah orders the campaign continued before the Hindustani princes can rally."

 STATIC_MODIFIER_NAME_nd_drr_panipat_consolidate: "Tribute of Panipat"
 STATIC_MODIFIER_DESC_nd_drr_panipat_consolidate: "The army returns to Kandahar with the Koh-i-Noor and a year of plunder. The Empire turns to administration, integrating the conquered into the Shah's realm."

 STATIC_MODIFIER_NAME_nd_drr_pass_tribute: "Rahdari Tribute"
 STATIC_MODIFIER_DESC_nd_drr_pass_tribute: "Every caravan over the Khyber and the Bolan pays toll in coin. The royal treasury grows on the back of the great trade between Persia, Turan, and Hindustan."

 STATIC_MODIFIER_NAME_nd_drr_pass_free_passage: "Open Passes"
 STATIC_MODIFIER_DESC_nd_drr_pass_free_passage: "Caravans move freely along the imperial roads, paying only modest dues. Bukharan and Indian merchants flock to the Afghan markets, and the bazaars of Kabul and Peshawar swell."

 STATIC_MODIFIER_NAME_nd_drr_naqshbandi_unity: "Naqshbandi Unity"
 STATIC_MODIFIER_DESC_nd_drr_naqshbandi_unity: "The Mujaddidi shaykhs preach a renewed orthodoxy from the khanaqahs of Kabul and Peshawar. Sufi guidance binds tribesman, peasant, and townsman to a single confessional cause."

 STATIC_MODIFIER_NAME_nd_drr_naqshbandi_cosmopolitan: "Cosmopolitan Tariqa"
 STATIC_MODIFIER_DESC_nd_drr_naqshbandi_cosmopolitan: "The Sufi orders teach a wide tolerance, embracing Hindki traders, Qizilbash neighbours, and Sikh subjects. The mosque, the temple, and the gurdwara are all kept under the Shah's peace."

 STATIC_MODIFIER_NAME_nd_drr_sadozai_centralize: "Sadozai Crown"
 STATIC_MODIFIER_DESC_nd_drr_sadozai_centralize: "The succession is settled by force of arms. The Sadozai house centralizes the realm, breaking rebellious sardars and asserting the Shah's writ from Herat to Lahore."

 STATIC_MODIFIER_NAME_nd_drr_sadozai_sardars: "Council of Sardars"
 STATIC_MODIFIER_DESC_nd_drr_sadozai_sardars: "The succession is settled by consensus. The tribal chiefs are confirmed in their lands and levies, and the Empire endures as a federation of Pashtun lords loyal to a first-among-equals."

# ===== FORMATION EVENT =====
 nd_drr.1.t: "The Loya Jirga at Kandahar"
 nd_drr.1.d: "October 1747. The shrine of Sher-e-Surkh outside Kandahar is crowded with the chieftains of every Pashtun tribe. The Abdali, the Ghilji, the Yusufzai, the Mohmand; the Qizilbash captains, the Tajik notables, the Hindki merchants. Nadir Shah is dead, his army scattered, and the treasury of Persia has come home to Afghanistan in the saddlebags of the Abdali horsemen who once served him.\n\nFor nine days the jirga has argued. Some would have a council of equals, others a Shah. The mystic Sabir Shah Kabuli has settled it: he places a sheaf of wheat in the turban of the young Abdali commander and proclaims him Padshah. The Abdali henceforth shall be called Durrani, the Pearl of Pearls.\n\nNow the choice falls to the new realm: shall it be the empire of the tribes, or the empire of the sword?\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_drr.1.a: "By consensus of the jirga, we shall be the empire of the tribes."
 nd_drr.1.b: "By the standard of Ahmad Shah, we shall conquer from Mashhad to Delhi."

# ===== ADVANCE EVENTS =====

 nd_drr.2.t: "The Third Battle of Panipat"
 nd_drr.2.d: "14 January 1761. On the dust plain north of Delhi, the Shah's mailed cavalry, his Rohilla allies, and two thousand swivel-mounted shutarnal camel guns face the host of the Maratha Confederacy. By dusk, sixty thousand of the enemy lie dead. Sadashivrao Bhau is killed; the Peshwa's heir is killed; the Maratha advance to the Indus is broken for a generation. The Shah holds the field, but his Afghan soldiers, unpaid for two years, are mutinous and longing for the cool of Kandahar."
 nd_drr.2.a: "Press the advantage; let the Hindustani princes know who rules the north."
 nd_drr.2.b: "Return to Kandahar with the loot; rule what we have already won."

 nd_drr.3.t: "Customs of the Khyber"
 nd_drr.3.d: "The great trans-Asian trade runs through our passes. Bukharan caravans bring fine horses, lapis, and slaves; Indian caravans bring spice, silk, and indigo; Persian merchants bring carpets and saffron. The rahdar officers stationed at the Khyber, the Bolan, and the Kabul gates report a swelling tide of traffic. The question is how heavily to tax it."
 nd_drr.3.a: "Tax every load. The treasury must be filled."
 nd_drr.3.b: "Keep the dues light. The trade itself enriches the empire."

 nd_drr.4.t: "Light of the Mujaddidi"
 nd_drr.4.d: "The Naqshbandi-Mujaddidi tariqa, renewed by Shah Waliullah of Delhi and his Afghan disciples, has spread through the khanaqahs of Kabul, Peshawar, and Kandahar. Its shaykhs preach a sober Sunni orthodoxy and a discipline of the heart. Their writings circulate from the Volga to the Deccan. How shall the empire receive them?"
 nd_drr.4.a: "Adopt their orthodoxy as the empire's confessional standard."
 nd_drr.4.b: "Embrace their wide humanism; many faiths share the realm."

 nd_drr.5.t: "After the Shah"
 nd_drr.5.d: "Ahmad Shah is dead, and Timur Shah after him. The sons of the dynasty contend at Kabul, Peshawar, and Kandahar; the sardars of the Barakzai and the Popalzai weigh which prince to back. The Sikhs are stirring in Punjab, the Persians press at Mashhad, and the Empire's edges are fraying. The choice is whether to rule by crown or by council."
 nd_drr.5.a: "Crush the sardars; let the throne dictate to the tribes."
 nd_drr.5.b: "Govern through the sardars; the empire is their federation, not the king's."

 nd_drr.6.t: "The Pashtunwali"
 nd_drr.6.d: "The unwritten code of the Pashtuns predates the Empire and outlives every dynasty. Nanawatai, the right of sanctuary; melmastia, the duty of hospitality; badal, the obligation of vengeance; nang, the demand of honour. No qazi enforces these laws, no Shah may abolish them, but every Pashtun, from the highest sardar to the lowest tribesman, lives by them. The Shah's wisdom is to rule with the code, not against it."
 nd_drr.6.a: "So shall it be among the Pashtuns."

 nd_drr.7.t: "The Bala Hissar of Kabul"
 nd_drr.7.d: "On its shoulder of rock above Kabul, the Bala Hissar has stood since the days of the Hindu Shahis. Babur strengthened it, the Mughals garrisoned it, and now its bastions are rebuilt for the Durrani court. Sister citadels rise above Kandahar, Ghazni, and Herat. From these fortresses the Shah commands the high passes; an enemy who takes the lowlands has won nothing if the Bala Hissar remains."
 nd_drr.7.a: "The high citadels are the spine of the empire."

# ===== ADVANCES =====
 nd_drr_pashtunwali: "Pashtunwali Code"
 nd_drr_pashtunwali_desc: "The unwritten honour code of the Pashtuns, binding every tribesman to nanawatai, melmastia, badal, and nang. The Empire rules with the code, not against it."

 nd_drr_bala_hissar: "Bala Hissar Fortifications"
 nd_drr_bala_hissar_desc: "The mountain citadels of Kabul, Kandahar, Ghazni, and Herat command the passes. From their bastions the Shah holds the high country, even when the lowlands are lost."

 nd_drr_mountain_raiders: "Mountain Raiders"
 nd_drr_mountain_raiders_desc: "The Pashtun tribesmen know every defile of the Hindu Kush. As light infantry they harry, ambush, and bleed any invader who climbs into their hills."

 nd_drr_kandahari_horses: "Kandahari Horse Trade"
 nd_drr_kandahari_horses_desc: "Kandahar is the great horse market of the crossroads, where Turkmen, Persian, and Indian buyers contend for the best Afghan stock."

 nd_drr_pass_tolls: "Rahdari Customs"
 nd_drr_pass_tolls_desc: "The rahdar officers post tolls at the Khyber, the Bolan, and Kabul gates, taxing every caravan that crosses between Hindustan, Persia, and Turan."

 nd_drr_sufi_networks: "Sufi Shrine Networks"
 nd_drr_sufi_networks_desc: "Naqshbandi and Qadiri orders bind tribe and crown through the khanaqahs and dargahs that dot the empire's roads."

 nd_drr_hindki_merchants: "Hindki Merchant Communities"
 nd_drr_hindki_merchants_desc: "The Hindu and Sikh trading families of Kabul, Peshawar, and Multan are kept under royal protection. Their networks reach to Bukhara, Lhasa, and Banaras."

 nd_drr_khorasan_revival: "Khorasan Revival"
 nd_drr_khorasan_revival_desc: "Persian poetry, Indo-Persian historiography, and Dari court letters flourish in the Durrani diwan. The Empire is heir to Khorasan as well as to Pashtunkhwa."

 nd_drr_jirga_councils: "Jirga Councils"
 nd_drr_jirga_councils_desc: "Tribal assemblies decide local matters by consensus. The Shah governs by council, not decree, and the Empire holds together because every chief feels heard."

 nd_drr_hotaki_revival: "Hotaki Revival"
 nd_drr_hotaki_revival_desc: "The memory of Mirwais Hotak's revolt against the Safavids steels Afghan arms. The Pashtuns once took Isfahan; they may do so again."

 nd_drr_sistan_qanats: "Sistan Qanats"
 nd_drr_sistan_qanats_desc: "Karez and qanat irrigation revives the Helmand basin and the wastes of Sistan. The empire's granaries fill where for centuries only nomads grazed."

 nd_drr_naqshbandi_tariqa: "Naqshbandi-Mujaddidi Tariqa"
 nd_drr_naqshbandi_tariqa_desc: "The renewed Sufi order of Sirhindi spreads through the empire. Its shaykhs preach a disciplined Sunni orthodoxy and bind the tribes to a single confessional cause."

 nd_drr_jezail_tradition: "Jezail Rifle Tradition"
 nd_drr_jezail_tradition_desc: "Khyber gunsmiths produce the long-barrel matchlock, accurate to ranges no European musket can match. Pashtun marksmen dominate the broken country."

 nd_drr_indo_persian_court: "Indo-Persian Court"
 nd_drr_indo_persian_court_desc: "The Durrani diwan blends Persianate administration with Hindustani court forms. Munshis, mirzas, and pandits all serve the Shah."

 nd_drr_tribal_sardars: "Council of Sardars"
 nd_drr_tribal_sardars_desc: "The hereditary chiefs of the nine great Durrani tribes form the Shah's permanent council, raising levies and arbitrating between the clans."

 nd_drr_abdali_heritage: "Abdali Heritage"
 nd_drr_abdali_heritage_desc: "Sabir Shah's blessing renamed the Abdali the Durrani: the Pearl of Pearls. The dynasty bears the prestige of that founding."

 nd_drr_loya_jirga_advance: "Loya Jirga Tradition"
 nd_drr_loya_jirga_advance_desc: "The grand assembly of all Pashtun tribes is the constitutional foundation of the Empire. Each new Shah is acclaimed by it; each great war is sanctioned by it."

 nd_drr_ghulam_khana: "Ghulam Khana"
 nd_drr_ghulam_khana_desc: "The royal household guard, drawn from Pashtun, Tajik, and Qizilbash veterans. Mailed lancers loyal only to the Shah."

 nd_drr_zamburak_corps: "Zamburak Corps"
 nd_drr_zamburak_corps_desc: "Camel-mounted swivel guns, fast across desert and steppe. At Panipat two thousand zamburakis broke the Maratha line."

 nd_drr_panipat_doctrine: "Panipat Doctrine"
 nd_drr_panipat_doctrine_desc: "The Durrani way of war: heavy mailed cavalry on the wings, jezailchis in skirmish, zamburaks in mobile reserve. A doctrine forged in the great Indian campaigns."

 nd_drr_kandahar_treasury: "Kandahar Treasury"
 nd_drr_kandahar_treasury_desc: "The royal mint and tribute repository at Kandahar receives the loot of Delhi, the customs of the Khyber, and the tribute of Sindh."

 nd_drr_sadozai_succession: "Sadozai Succession"
 nd_drr_sadozai_succession_desc: "The dynastic crisis after Timur Shah, when Sadozai princes contend at Kabul, Peshawar, and Herat. The way the empire navigates this crisis shapes its century."

 nd_drr_frontier_defense: "Frontier Defense"
 nd_drr_frontier_defense_desc: "The long retreat from Punjab and Sindh teaches the empire to fight on the defensive. Every gorge of the Hindu Kush becomes a fortress."

 nd_drr_modernization: "Durrani Modernization"
 nd_drr_modernization_desc: "Tentative reforms under the late Sadozai and early Barakzai shahs: the printing press at Kabul, the artillery school, the survey of the realm."

 nd_drr_lashkar_reform: "Lashkar Reform"
 nd_drr_lashkar_reform_desc: "The tribal levy is reorganized for modern war, with permanent regiments drawn from the Pashtun valleys and standardized arms."

# ===== UNITS =====
 a_nd_drr_pashtun_lashkar: "Pashtun Lashkar"
 a_nd_drr_pashtun_lashkar_desc: "Tribal warband levied through the loya jirga. Each man brings his own jezail or tulwar; collectively they are the spine of the Empire's army and a terror in their home mountains."

 a_nd_drr_jezailchi: "Jezailchi"
 a_nd_drr_jezailchi_desc: "Long-barrel matchlock skirmisher from the Khyber gunsmith villages. Famous for picking off officers at ranges no European musket can reach, and for vanishing back into the rocks."

 a_nd_drr_ghulam_khana: "Ghulam Khana"
 a_nd_drr_ghulam_khana_desc: "Royal household heavy cavalry. Mailed lancers drawn from Pashtun, Tajik, and Qizilbash veterans, sworn personally to the Shah."

 a_nd_drr_zamburak: "Zamburak"
 a_nd_drr_zamburak_desc: "A swivel gun mounted on a kneeling camel. Fast across desert and stony ground, devastating at the close range that broke the Marathas at Panipat."

 a_nd_drr_zamburak_levy: "Zamburak Levy"
 a_nd_drr_zamburak_levy_desc: "Tribal swivel-gunners raised through the soldiers and tribesmen of the Empire. Cheaper than the regular zamburak corps, but fights with the same fearsome sting."

# ===== LEVIES =====
 levy_nd_drr_pashtun_lashkar: "Pashtun Lashkar"
 levy_nd_drr_pashtun_lashkar_desc: "Tribal warband mobilized by the call of the loya jirga, drawn from peasants, tribesmen, and the soldier estate."

 levy_nd_drr_zamburak: "Zamburak Levy"
 levy_nd_drr_zamburak_desc: "Camel-mounted swivel gunners raised from the Empire's soldiers and tribesmen for fast, hard-hitting field service."

# ===== BUILDINGS =====
 nd_drr_bala_hissar_fort: "Bala Hissar"
 nd_drr_bala_hissar_fort_desc: "Mountain citadel commanding a city and its passes. The Bala Hissar of Kabul, the Arg of Kandahar, and the Citadel of Herat all follow this pattern."

 nd_drr_bala_hissar_upkeep: "Citadel Garrison"
 nd_drr_bala_hissar_upkeep_desc: "Stone, weapons, lumber, and tar to keep the bastions and gunports of a Bala Hissar in fighting order."

 nd_drr_rahdari_post: "Rahdari Post"
 nd_drr_rahdari_post_desc: "Customs station on the imperial caravan roads. Rahdar officers register caravans, levy tolls, and dispatch mounted escorts."

 nd_drr_rahdari_upkeep: "Toll Administration"
 nd_drr_rahdari_upkeep_desc: "Horses for the rahdar escorts, paper for the registers, leather and cloth for the tents and saddles of the customs riders."

 nd_drr_jezail_workshop: "Jezail Workshop"
 nd_drr_jezail_workshop_desc: "Khyber gunsmith house producing the long-barrel matchlock. The barrels are forged of pattern-welded iron and fitted with delicately curved stocks."

 nd_drr_jezail_forging: "Long-Barrel Forging"
 nd_drr_jezail_forging_desc: "Saltpeter, iron, and tools combined into the famous Khyber jezail rifle, prized across Asia."

 nd_drr_jezail_maintenance: "Workshop Maintenance"
 nd_drr_jezail_maintenance_desc: "Coal, iron, lumber, and tools to keep the forges running and the master gunsmiths fed."

 nd_drr_kandahar_treasury_bld: "Royal Treasury"
 nd_drr_kandahar_treasury_bld_desc: "The royal mint and tribute repository at Kandahar. Built to hold the Koh-i-Noor and the loot of Delhi, it became the financial spine of the Empire."

 nd_drr_treasury_upkeep: "Treasury Administration"
 nd_drr_treasury_upkeep_desc: "Paper for the registers, silver and gems for the assayers, books for the imperial accountants."

# ===== EVENT VARIABLE TOOLTIPS =====
 nd_drr_formed_tt: "Durrani Empire has been formed"
 nd_drr_path_a_tt: "Loya Jirga path chosen"
 nd_drr_path_b_tt: "Sword of Khorasan path chosen"

# ===== ADDITIONAL UNITS =====
 a_nd_drr_ghazi: "Ghazi"
 a_nd_drr_ghazi_desc: "Pashtun frontier warriors of the Hotaki revival, called to jihad against the Safavids and the Marathas. Heavy shock infantry that fights with religious fervor in the broken country."

 a_nd_drr_kohistani: "Kohistani Light Infantry"
 a_nd_drr_kohistani_desc: "Modernized mountain infantry of the late Sadozai and Barakzai era. Drilled in European fashion but still at home in the gorges of the Hindu Kush."

# ===== ADDITIONAL LEVY =====
 levy_nd_drr_ghazi: "Ghazi Levy"
 levy_nd_drr_ghazi_desc: "Religious volunteers raised through the soldier and tribesmen estates, mobilized by the Hotaki memory and the call of Sufi shaykhs."

# ===== ADDITIONAL BUILDINGS =====
 nd_drr_horse_market: "Kandahari Horse Market"
 nd_drr_horse_market_desc: "The great regional horse fair where Turkmen, Persian, and Indian buyers contend for the best Afghan stock. The treasury thrives on its tolls."

 nd_drr_horse_fair_upkeep: "Horse Fair Maintenance"
 nd_drr_horse_fair_upkeep_desc: "Livestock, horses, leather, and grain to keep the great horse fair running through every season."

 nd_drr_khanaqah: "Sufi Khanaqah"
 nd_drr_khanaqah_desc: "Naqshbandi or Qadiri lodge combining shrine, seminary, and hostel for travelling dervishes. The shaykhs bind tribesmen and townsmen alike to the Empire's confessional life."

 nd_drr_khanaqah_upkeep: "Khanaqah Endowment"
 nd_drr_khanaqah_upkeep_desc: "Paper for the manuscripts, books for the seminary, incense and beeswax for the rituals at the dargah."

 nd_drr_hindki_quarter: "Hindki Quarter"
 nd_drr_hindki_quarter_desc: "Hindu and Sikh trading enclave under royal firman. Their family networks reach Bukhara, Lhasa, and Banaras, channeling trade through the Empire's bazaars."

 nd_drr_hindki_upkeep: "Hindki Quarter Maintenance"
 nd_drr_hindki_upkeep_desc: "Cloth, paper, pottery, and incense for the daily life and trade of the Hindki community."

 nd_drr_kabul_press: "Kabul Lithographic Press"
 nd_drr_kabul_press_desc: "The first Afghan printing press, established under Barakzai patronage at Kabul. Dari and Pashto books spread literacy and lay the foundation of a modern Afghan public."

 nd_drr_press_upkeep: "Press Operations"
 nd_drr_press_upkeep_desc: "Paper, books, and tools to keep the lithographic stones inked and the type-cases stocked."

# ===== DESTINY ADVANCES =====
 nd_drr_destiny: "The Long Road of the Empire"
 nd_drr_destiny_desc: "The Loya Jirga has crowned a Shah; now the empire must choose its long road. Either inward toward Khorasan, or outward toward Hindustan."

 nd_drr_dest_khorasan_restored: "Khorasan Restored"
 nd_drr_dest_khorasan_restored_desc: "Reclaim the Persianate heartland. Take Mashhad and Nishapur and stabilize the realm; the empire's centre of gravity returns to where Khorasan, Sistan, and the Hindu Kush meet."

 nd_drr_dest_pearls_federation: "Pearls of the Federation"
 nd_drr_dest_pearls_federation_desc: "Develop the Khorasani heartland into the empire's economic core. Take Merv and Bukhara, raise total development to imperial levels, and fill the treasury. The qanat circuit is the empire's spine."

 nd_drr_dest_sunni_imamate: "Sunni Imamate of Khorasan"
 nd_drr_dest_sunni_imamate_desc: "Stand as the Sunni Imamate of Khorasan: heir to the Samanids, rival to the Safavid throne, and patron of the qanat-monastery network. Take Samarkand and Isfahan, and unlock the Khorasani Qanat Network as your imperial irrigation work."

 nd_drr_dest_march_indus: "March on the Indus"
 nd_drr_dest_march_indus_desc: "Continue Ahmad Shah's invasions. Take Lahore and Multan; raise an army of thirty thousand. The wealth and population of Hindustan are within the Shah's reach."

 nd_drr_dest_loot_delhi: "The Loot of Delhi"
 nd_drr_dest_loot_delhi_desc: "Sack Delhi and the Doab. Take Delhi, Agra, and Sirhind; bring back the loot of the Mughal capital. The Peacock Throne is yours by right of conquest."

 nd_drr_dest_pearl_of_pearls: "Pearl of Pearls Crowned"
 nd_drr_dest_pearl_of_pearls_desc: "Make the Indus your river and Kabul your imperial seat. Hold Srinagar, Thatta, and Peshawar; field a great army; let the Bala Hissar of Kabul rise as the Imperial Diwan, the Mughal mantle taken in earnest."

# ===== DESTINY EVENT TEXT =====

 nd_drr.8.t: "The Long Road of the Empire"
 nd_drr.8.d: "The Shah sits in council at the Bala Hissar. The Loya Jirga has spoken; the standard is raised; the treasury is full. But the question is what kind of empire this shall be: an empire of Khorasan, looking inward to its mountain plateau and the Persian-speaking world, or an empire of Hindustan, looking outward to the wealth of the Indus and the Yamuna. The sardars argue, the qazis quote, the Hindki merchants weigh their ledgers. The road must be chosen."
 nd_drr.8.a: "The road shall be ours to walk."

 nd_drr.9.t: "Khorasan Returns to the Pearl"
 nd_drr.9.d: "Mashhad and Nishapur are ours. The shrine of the Imam Reza is again under Sunni administration; the bazaars of Nishapur send their carpets, saffron, and turquoise to Kandahar. The Persian-speaking notables of Khorasan ride to the Shah's diwan, and the Khorasani culture which has always been the empire's twin language now becomes its administrative spine. The wastes of the Helmand basin and the orchards of Herat are ours by right and by history."
 nd_drr.9.a: "Khorasan is the soul of the empire."

 nd_drr.10.t: "The Qanat Circuit"
 nd_drr.10.d: "Merv and Bukhara are taken. The empire's mirabs survey the qanat lines from Sistan to Khwarezm; the Hindki bankers underwrite a hundred new caravan stages; the Hazara peasants dig new karez under royal warrant. There is more to do than there are hands. The Shah's diwan must decide: shall the qanat circuit be expanded by corvee, the labor of the realm pressed into imperial works? Or shall the trade itself fund the works, the caravans bringing the silver that pays the diggers?"
 nd_drr.10.a: "Press the corvee. The qanat is built by the realm itself."
 nd_drr.10.b: "Tax the caravans. The trade itself shall fund the works."

 nd_drr.11.t: "Imam of the Sunna"
 nd_drr.11.d: "Samarkand and Isfahan are taken. The empire stretches from the Aral steppe to the Persian Gulf, and the Shah is now the unrivalled patron of Sunni Khorasan, with the shrine of Imam Reza, the tomb of Tamerlane, and the Friday mosque of Isfahan all in his hand. From Naqshbandi shaykhs to Hindki bankers, every voice of the empire asks the same question: shall the Shah be the Imam of the Sunna, defender of the orthodox faith and rival to the Safavids' Shia mantle? Or shall he keep the Durrani Horizon, the wide tolerance of the Persianate ecumene?"
 nd_drr.11.a: "I am Imam of the Sunna; the orthodox creed is my standard."
 nd_drr.11.b: "The Durrani Horizon: many faiths under one Persianate roof."

 nd_drr.12.t: "March on the Indus"
 nd_drr.12.d: "Lahore and Multan have fallen. The Shah's army stands on the Indus and looks east, where the Mughal pretender holds Delhi only by sufferance, the Marathas raid the Doab, the Sikhs harry the Punjab, and the Jats hold the Yamuna. None of these powers can field what we have fielded. The Hindustani plain lies open. The campaign continues."
 nd_drr.12.a: "Onward to Delhi."

 nd_drr.13.t: "The Loot of Delhi"
 nd_drr.13.d: "Delhi has fallen, and Agra, and Sirhind. The Mughal Emperor sits as our pensioner; the Peacock Throne is broken up and shipped to Kandahar; the Koh-i-Noor is in the saddlebag of the Shah. Forty crores in tribute have been promised. Yet the Doab is restless and the Maratha confederacy has not yet been broken. Two voices contend in the diwan: chastise the rebel princes by the sword, or rule them through Hindustani administrators in Mughal forms?"
 nd_drr.13.a: "Chastise them. The sword is the only language the princes know."
 nd_drr.13.b: "Rule through the Yamuna diwan; let the munshis administer."

 nd_drr.14.t: "Padshah-e Hind"
 nd_drr.14.d: "Srinagar of Kashmir, Thatta of Sindh, Peshawar of the Khyber, and the great army drilling at Kabul. The Shah is acclaimed Padshah-e Hind, master of all the lands from the Oxus to the Yamuna. The Bala Hissar of Kabul rises as a new imperial seat, modelled on the Red Fort, with diwans for the Pashtun nobles, the Hindustani munshis, the Hindki bankers, and the Persian poets. Now the question: rule as the Mughal mantle taken whole, or rule from Kabul as the imperial Durrani capital, distinct from the Mughal past?"
 nd_drr.14.a: "I take the Mughal mantle. I am Padshah-e Hind."
 nd_drr.14.b: "Kabul is the imperial seat. The Durrani realm is its own."

# ===== DESTINY BUILDINGS =====

 nd_drr_dest_qanat_network: "Khorasani Qanat Network"
 nd_drr_dest_qanat_network_desc: "An imperial irrigation work uniting the karez and qanat lines from Sistan to Khwarezm. Mirabs of the diwan survey new shafts every season; the orchards of Herat, Mashhad, and Bukhara feed an empire."

 nd_drr_dest_qanat_upkeep: "Qanat Maintenance"
 nd_drr_dest_qanat_upkeep_desc: "Stone, tools, and lumber for the shafts and channels of the qanat circuit. Wheat to feed the diggers and mirabs of the realm."

 nd_drr_dest_imperial_diwan: "Imperial Diwan of Kabul"
 nd_drr_dest_imperial_diwan_desc: "The Bala Hissar of Kabul rebuilt as the imperial seat, modelled on the Red Fort of Delhi. Pashtun sardars, Hindustani munshis, Hindki bankers, and Persian poets all attend the Shah in his hall of audience."

 nd_drr_dest_diwan_upkeep: "Diwan Operations"
 nd_drr_dest_diwan_upkeep_desc: "Paper for the firmans, fine cloth for the durbar, furniture for the diwan-i-am, tools for the imperial workshops."

# ===== DESTINY TIMED MODIFIERS =====

 STATIC_MODIFIER_NAME_nd_drr_dest_qanat_corvee: "Qanat Corvee"
 STATIC_MODIFIER_DESC_nd_drr_dest_qanat_corvee: "The empire's labor is pressed into the qanat works. New shafts run from Sistan to Khwarezm; villages thrive at the heads of new channels. The realm grows by water and stone."

 STATIC_MODIFIER_NAME_nd_drr_dest_caravan_circuit: "Caravan Circuit"
 STATIC_MODIFIER_DESC_nd_drr_dest_caravan_circuit: "The trade pays for itself. Bukharan, Indian, and Persian caravans flow through the Khorasani circuit; Kabul, Herat, and Kandahar swell with new merchants and bazaaris. The diwan dispatches its diplomats wide."

 STATIC_MODIFIER_NAME_nd_drr_dest_imam_of_sunna: "Imam of the Sunna"
 STATIC_MODIFIER_DESC_nd_drr_dest_imam_of_sunna: "The Shah is acclaimed Imam of the Sunna. The shrines of Imam Reza, of Tamerlane, of Naqshband all are under his patronage; his armies fight under the green standard of orthodoxy and the empire is the rival of every Shia throne."

 STATIC_MODIFIER_NAME_nd_drr_dest_durrani_horizon: "The Durrani Horizon"
 STATIC_MODIFIER_DESC_nd_drr_dest_durrani_horizon: "The empire is the wide tolerant Persianate ecumene of poets, mystics, traders, and scholars. The Hindki banker, the Naqshbandi shaykh, the Qizilbash captain, the Hazara mirab all walk under one imperial sky."

 STATIC_MODIFIER_NAME_nd_drr_dest_chastise_doab: "Chastise the Doab"
 STATIC_MODIFIER_DESC_nd_drr_dest_chastise_doab: "The princes of the Doab are taught by the sword. The empire's heavy infantry, jezailchi skirmishers, and zamburak corps drill for the next campaign; rebel forts fall faster than they can be raised."

 STATIC_MODIFIER_NAME_nd_drr_dest_yamuna_diwan: "The Yamuna Diwan"
 STATIC_MODIFIER_DESC_nd_drr_dest_yamuna_diwan: "Hindustani munshis and Mughal-trained administrators staff the new imperial diwan on the Yamuna. The empire integrates its conquests through paper, register, and firman."

 STATIC_MODIFIER_NAME_nd_drr_dest_padshah_e_hind: "Padshah-e Hind"
 STATIC_MODIFIER_DESC_nd_drr_dest_padshah_e_hind: "The Shah takes the Mughal mantle in earnest. From the Oxus to the Yamuna, the empire's standard is the Padshah-e Hind, and the heavy Pashtun cavalry rides under a new imperial sun."

 STATIC_MODIFIER_NAME_nd_drr_dest_kabul_diwan: "The Kabul Diwan"
 STATIC_MODIFIER_DESC_nd_drr_dest_kabul_diwan: "Kabul is the seat of the empire, not Delhi. The Bala Hissar rises as the imperial diwan, with hall of audience, garden of audience, and library; ambassadors of every land attend the Shah in the high citadel."

