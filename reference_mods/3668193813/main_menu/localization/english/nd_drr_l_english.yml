# ===== BUREAUCRACIES =====
 AUTO_MODIFIER_NAME_nd_drr_bureaucracy_authority: "Sadozai Imperial Apparatus"
 AUTO_MODIFIER_DESC_nd_drr_bureaucracy_authority: "On formation at the Kandahar loya jirga, [DRR.GetName] inherits the layered institutional traditions of its frontier -- the Pashtun tribal council, the Persianate wazir's chancery, the Hindki banking houses of the Indus, and the Naqshbandi-Mujaddidi clerical hierarchy. Grants two bureaucracy slots so the player may operate up to three historical Durrani institutions (with the universal capital slot)."

 drr_loya_jirga_bureaucracy: "Loya Jirga"
 drr_loya_jirga_bureaucracy_desc: "The grand assembly of Pashtun chieftains. In October 1747, after the assassination of Nader Shah, nine days of debate at the shrine of Sher-i Surkh in Kandahar elected Ahmad Shah Abdali (later Durrani) as padshah-i durr-i-durran -- pearl of pearls. Every Sadozai succession after his death was confirmed at a similar jirga, and the Abdali, Ghilji, Tajik and Hazara khans expected to be heard. The institution constrained the Shah but bound every tribe by oath to the imperial standard; manpower flowed from valleys whose chiefs could not be coerced but could be honoured."

 drr_diwan_ala_bureaucracy: "Diwan-i-A'la"
 drr_diwan_ala_bureaucracy_desc: "The supreme chancery of the wazir, modelled on Safavid and Mughal high diwans. Shah Wali Khan Bamizai, wazir to Ahmad Shah from 1761, ran imperial finance, drafted firmans, and supervised the provincial subadars of Kashmir, Punjab, Sindh and Khorasan. Persian was its language, Indo-Persian munshis its clerks. The diwan was a counterweight to the Pashtun sardars whose loyalties were tribal first; when the chancery functioned, revenue flowed and the firmans were obeyed. When it failed -- as it did during the post-1772 succession crises under Timur Shah's sons -- the empire fragmented along the lines the diwan had been built to suppress."

 drr_hindki_sarrafs_bureaucracy: "Hindki Sarrafs"
 drr_hindki_sarrafs_bureaucracy_desc: "The Multani, Shikarpuri and Khatri banking houses that operated hundi credit networks from Astrakhan to Hyderabad. Hindu and Sikh sarrafs and arhatiyas held the imperial revenue contracts of Punjab, Sindh and the trans-Indus passes; their hundis financed Ahmad Shah's eight invasions of Hindustan, including the field army that won at Panipat in 1761. Maliki-minded ulama resented the depth of dhimmi participation in imperial finance and occasionally pressed for jizya enforcement. The empire ignored them: the zamburak gunners and qizilbash horse could not be paid in fatwas."

 drr_naqshbandi_mashaikh_bureaucracy: "Naqshbandi-Mujaddidi Mashaikh"
 drr_naqshbandi_mashaikh_bureaucracy_desc: "The Sufi tariqa founded by Imam Rabbani Sirhindi (d. 1624) and continued by Shah Waliullah of Delhi (d. 1762). Naqshbandi pirs of the Mujaddidi line crossed the Pashtun belt, blessing Ahmad Shah's invasions of Hindustan as defence of the umma against the Marathas and Sikhs and binding the rural tribes to the throne through their khanaqahs at Peshawar, Kabul, and Kandahar. The mashaikh gave the Sadozai a religious legitimacy independent of Mughal Delhi -- but a clergy that could anathemise a wayward shah as easily as it had crowned him."
