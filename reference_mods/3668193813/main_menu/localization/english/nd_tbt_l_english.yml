l_english:
 # === FORMATION EVENT ===
 nd_tbt.1.t: "The Tsenpo's Banner Rises Again"
 nd_tbt.1.d: "From the Yarlung Valley the imperial summons goes out, and the great clans of Bod ride to Lhasa beneath the white-and-red banner of the Tsenpo. The Potala stands restored above the Lhasa plain, the Jokhang's bronze doors are thrown open, and the Imperial pillar where Songtsen Gampo carved his oath in stone is washed clean of the moss of fragmentation.\n\nFor centuries the Roof of the World had splintered into ecclesiastical fiefs and pacified bonds. Now the warrior-empire of Trisong Detsen and Ralpacan, the empire that rode from Lhasa to the Tang frontier and held the Tarim oases against the Sons of Heaven, returns. But what kind of empire shall it be? The gshen-priests of Yungdrung Bon press the old imperial cult of mountain-deities and warrior-tsenpos. The lamas of Samye press the cosmopolitan synthesis of the Three Dharma Kings, the translation projects, the Mahayana mandala-empire.\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_tbt.1.a: "Restore the Yungdrung-Bon imperial cult (convert to Bon)"
 nd_tbt.1.b: "Embrace the Dharma Kings' Buddhist synthesis"

 STATIC_MODIFIER_NAME_nd_tbt_yungdrung_imperial_cult: "Yungdrung Bon Imperial Cult"
 STATIC_MODIFIER_DESC_nd_tbt_yungdrung_imperial_cult: "The pre-Buddhist priesthood of the eternal-swastika Bon serves the imperial state. The mountain-gods bless the Tsenpo and the rgyal-blon ride to war beneath the imperial banner of Yarlung."

 STATIC_MODIFIER_NAME_nd_tbt_dharma_kings_synthesis: "Synthesis of the Three Dharma Kings"
 STATIC_MODIFIER_DESC_nd_tbt_dharma_kings_synthesis: "The cosmopolitan mandala-empire of Songtsen Gampo, Trisong Detsen, and Ralpacan returns. Sanskrit and Chinese sutras flow into the Tibetan tongue; Samye's translation halls hum with the labor of a hundred panditas."

 # === ADVANCE EVENT 2: Imperial Edicts on Stone (rdo-ring) ===
 nd_tbt.2.t: "The Edicts in Stone"
 nd_tbt.2.d: "Beneath the Jokhang's outer wall a new rdo-ring rises. The chief minister, the chief lon-chen, and the heads of the great clans gather to swear the imperial oath as the inscription is carved: the Tsenpo's law, the borders of the realm, the rights and duties of every clan. As Trisong Detsen and Ralpacan once carved their oaths into stone for all generations to read, so shall this empire bind itself.\n\nBut binding works two ways. Shall the law on the pillar bind the people to the Tsenpo, or bind the Tsenpo and the rgyal-blon to one another?"
 nd_tbt.2.a: "Carve our edicts as the supreme law of all"
 nd_tbt.2.b: "Carve the noble oath of the rgyal-blon"

 STATIC_MODIFIER_NAME_nd_tbt_law_carved_in_stone: "Law Carved in Stone"
 STATIC_MODIFIER_DESC_nd_tbt_law_carved_in_stone: "The imperial edict on the rdo-ring is the supreme law of every clan and district. The chronicles will record that none defied it."

 STATIC_MODIFIER_NAME_nd_tbt_oath_of_the_blon: "Oath of the Blon"
 STATIC_MODIFIER_DESC_nd_tbt_oath_of_the_blon: "The pillar binds the Tsenpo and the great rgyal-blon clans into a single sworn brotherhood. Their levies ride at the imperial summons; their lands serve the imperial cause."

 # === ADVANCE EVENT 3: Samye and the Bon-Buddhist Debate ===
 nd_tbt.3.t: "The Samye Debate"
 nd_tbt.3.d: "At Samye monastery, founded by Trisong Detsen in 779 to the plan of an Indian mandala, two great Buddhist schools contend for the empire's soul. The Indian master Kamalashila argues for gradual cultivation through study and discipline; the Chinese Chan teacher Heshang Moheyan argues for sudden enlightenment.\n\nIn the historical record the Indians prevailed and Heshang was sent home. But scripture and chronicle alike preserve both arguments still. The Tsenpo himself must adjudicate. Which way shall the empire's Buddhism flow?"
 nd_tbt.3.a: "Adopt the Indian Mahayana of gradual cultivation"
 nd_tbt.3.b: "Embrace the Chinese Chan of sudden awakening"

 STATIC_MODIFIER_NAME_nd_tbt_indian_mahayana_path: "Indian Mahayana Path"
 STATIC_MODIFIER_DESC_nd_tbt_indian_mahayana_path: "The translation halls fill with Sanskrit panditas. Logic, debate, and graduated bodhisattva practice spread from Samye to every monastery on the plateau."

 STATIC_MODIFIER_NAME_nd_tbt_chinese_chan_path: "Chinese Chan Path"
 STATIC_MODIFIER_DESC_nd_tbt_chinese_chan_path: "The Heshang's school of sudden awakening flourishes in spite of history. Chan masters take the seat at Samye, and a quieter, less doctrinal Buddhism roots itself across Bod."

 # === ADVANCE EVENT 4: Tarim Basin Garrisons ===
 nd_tbt.4.t: "The Four Garrisons of the Tarim"
 nd_tbt.4.d: "The Tarim Basin oases, the Tang protectorate of Anxi, fall once again to imperial Tibetan armies. Khotan, Kashgar, Kucha, and Karashahr open their gates to riders out of the Kunlun passes. The Silk Road is in our hands. Caravans from Sogdiana and Khorasan now pay their tariffs to the Tsenpo's customs-houses.\n\nWhat shall we make of these oasis cities? Garrison them as imperial provinces and integrate the merchants directly, or hold them lightly as protectorates that pay tribute and supply auxiliaries?"
 nd_tbt.4.a: "Garrison the oases as imperial Silk Road provinces"
 nd_tbt.4.b: "Bind the oasis kings as tribute-paying protectorates"

 STATIC_MODIFIER_NAME_nd_tbt_silk_road_dominion: "Silk Road Dominion"
 STATIC_MODIFIER_DESC_nd_tbt_silk_road_dominion: "Imperial garrisons hold the Four Garrisons. The Sogdian, Khotanese, and Uyghur merchants pay their tariffs to Lhasa. The Silk Road is a Tibetan road."

 STATIC_MODIFIER_NAME_nd_tbt_oasis_protectorate: "Oasis Protectorate"
 STATIC_MODIFIER_DESC_nd_tbt_oasis_protectorate: "The oasis kings retain their thrones in exchange for tribute, levies, and oaths to the Tsenpo. The empire holds them through honor rather than legions."

 # === ADVANCE EVENT 5: Treaty of 821-822 ===
 nd_tbt.5.t: "The Treaty Pillar at the Jokhang"
 nd_tbt.5.d: "The trilingual pillar before the Jokhang Temple records the great Sino-Tibetan peace of 821-822, the 'uncle-nephew' treaty between the Tsenpo and the Tang Son of Heaven. The frontier is fixed; the sworn boundary at the Hexi corridor is to stand 'as the rivers flow and the sun rises'.\n\nA generation has passed since the inscription was first carved. The Tsenpo's council debates whether to honor the treaty as the foundation of a stable order, or to seize the moment of weakness on the Tang frontier and renew the war that built our empire."
 nd_tbt.5.a: "Honor the sworn borders as our diplomatic foundation"
 nd_tbt.5.b: "Renew the frontier war while we hold the advantage"

 STATIC_MODIFIER_NAME_nd_tbt_sworn_borders: "Sworn Borders"
 STATIC_MODIFIER_DESC_nd_tbt_sworn_borders: "The treaty pillar stands. Tibetan ambassadors carry the imperial seal as far as Chang'an, Bagan, and Samarkand. Every neighbor takes our word as binding."

 STATIC_MODIFIER_NAME_nd_tbt_frontier_war_renewed: "Frontier War Renewed"
 STATIC_MODIFIER_DESC_nd_tbt_frontier_war_renewed: "The Tsenpo's army rides east. The Hexi corridor and the Gansu marchlands are open ground, and the imperial cause demands their reclamation."

 # === ADVANCE EVENT 6: Imperial Cabinet Codification (gar-zlon) ===
 nd_tbt.6.t: "The Council of the Seven Ministers"
 nd_tbt.6.d: "The chief minister Gar Tongtsen, who served Songtsen Gampo as the architect of the early empire, formalizes the gar-zlon: the seven-minister imperial cabinet. The blon-chen (chief minister), the nang-blon (interior), the phyi-blon (foreign affairs), the dmag-blon (war), the gtsang-blon (treasury), the chos-blon (religion), and the rgyal-blon-chen (master of the great clans) meet in council to administer the empire while the Tsenpo leads the host.\n\nThis is a new shape of imperial government: the Tsenpo rides at the head of his army, while the empire continues to govern itself."
 nd_tbt.6.a: "Convene the Council of the Seven"

 STATIC_MODIFIER_NAME_nd_tbt_council_of_seven: "Council of the Seven Ministers"
 STATIC_MODIFIER_DESC_nd_tbt_council_of_seven: "The gar-zlon meets daily in Lhasa. The empire continues to administer itself even when the Tsenpo is in the field on campaign."

 # === ADVANCE EVENT 7: Tonmi Sambhota's Script Reform ===
 nd_tbt.7.t: "The Letters of the Plateau"
 nd_tbt.7.d: "The minister Tonmi Sambhota returns from his long study in India bearing a new alphabet, adapted from a Brahmi-derived Indic script and shaped to the sounds of the Tibetan tongue. By Songtsen Gampo's order it becomes the imperial script, used for edicts, treaties, chronicles, and the first translations of Buddhist scripture.\n\nWhere before our edicts traveled by herald's voice and were forgotten in a generation, now they shall be carved on stone, brushed on palm-leaf, and printed on block. The empire learns to remember itself."
 nd_tbt.7.a: "Promulgate the script across the empire"

 STATIC_MODIFIER_NAME_nd_tbt_letters_of_the_plateau: "Letters of the Plateau"
 STATIC_MODIFIER_DESC_nd_tbt_letters_of_the_plateau: "Block-printed scripture and brush-written chronicle pour from imperial scriptoria. Literacy spreads from Lhasa down every valley road."

 # === ADVANCES — AGE 1 ===
 nd_tbt_seven_ministers: "Council of Seven Ministers"
 nd_tbt_seven_ministers_desc: "Codify the gar-zlon imperial cabinet of seven ministers established by Gar Tongtsen, allowing the empire to administer itself while the Tsenpo campaigns in the field."
 nd_tbt_yul_sde_levy: "Yul-sde District Levy"
 nd_tbt_yul_sde_levy_desc: "The imperial khri-sde administrative grid muster spear-and-bow levies by household. Every district owes the Tsenpo its quota of armed men."
 nd_tbt_rgyal_blon_cavalry: "Rgyal-blon Mailed Cavalry"
 nd_tbt_rgyal_blon_cavalry_desc: "The Tang chronicles called them 'men and horses encased in iron'. The great clans field armored lancers as the empire's shock arm."
 nd_tbt_rdo_ring_edicts: "Rdo-ring Imperial Edicts"
 nd_tbt_rdo_ring_edicts_desc: "Carve imperial law on stone pillars across the realm in the manner of Songtsen Gampo, Trisong Detsen, and Ralpacan. What is carved in stone outlasts every dynasty."
 nd_tbt_yungdrung_bon: "Yungdrung Bon Cult"
 nd_tbt_yungdrung_bon_desc: "Restore the pre-Buddhist priesthood of the eternal-swastika Bon as the imperial state cult. Mountain-deities and warrior-rites bless the Tsenpo's banner."
 nd_tbt_yak_wool_weaving: "Yak-Wool Weaving"
 nd_tbt_yak_wool_weaving_desc: "Heavy felted nambu cloth and the famous Tibetan carpets, woven from yak wool that no lowland flock can match."
 nd_tbt_tonmi_script: "Tonmi Sambhota's Script Reform"
 nd_tbt_tonmi_script_desc: "Adopt the new alphabet adapted from Brahmi for the Tibetan tongue. The imperial scriptoria can now record edicts, chronicles, and translated scripture in our own script."

 # === ADVANCES — AGE 2 ===
 nd_tbt_samye_synthesis: "Samye Monastic Synthesis"
 nd_tbt_samye_synthesis_desc: "Found Samye monastery in the mandala plan, a translation-university where Sanskrit, Chinese, and Tibetan scholarship meet. The empire becomes the patron of cosmopolitan Buddhism."
 nd_tbt_tarim_garrisons: "Tarim Basin Garrisons"
 nd_tbt_tarim_garrisons_desc: "Hold the Four Garrisons of the Anxi protectorate against the Tang. Tibetan armies on the Silk Road campaigning thousands of li from Lhasa."
 nd_tbt_chama_trade: "Chama Tea-Horse Trade"
 nd_tbt_chama_trade_desc: "Build the great trade-fair caravanserais of the chama route. Yunnan and Sichuan tea flows up to the plateau in exchange for warhorses bound for the Tang armies."
 nd_tbt_translation_bureau: "Imperial Translation Bureau"
 nd_tbt_translation_bureau_desc: "The lo-tsa-ba master translators render Sanskrit Mahayana, Chinese Chan, and Khotanese tantra into Tibetan. The plateau becomes the great compiler of Asian Buddhism."
 nd_tbt_himalayan_metallurgy: "Himalayan Metallurgy"
 nd_tbt_himalayan_metallurgy_desc: "Tibetan iron and copper of legendary quality. The mailed cavalry's armor was famed across Asia for its workmanship."
 nd_tbt_imperial_horse_breeding: "Imperial Horse-Breeding"
 nd_tbt_imperial_horse_breeding_desc: "The imperial pastures of the Amdo grasslands feed the chama trade and our own cavalry alike. Tibetan warhorses are demanded across China."

 # === ADVANCES — AGE 3 ===
 nd_tbt_uncle_nephew_treaty: "Uncle-Nephew Treaty"
 nd_tbt_uncle_nephew_treaty_desc: "The 821-822 treaty pillar at the Jokhang sets a Sino-Tibetan peace 'as the rivers flow and the sun rises'. The empire as a co-equal of the Tang."
 nd_tbt_rdzong_doctrine: "Rdzong Fortress Doctrine"
 nd_tbt_rdzong_doctrine_desc: "Crowning every strategic crag, the dzong fortresses chain together a defensive spine. Stone walls climb the mountain faces."
 nd_tbt_khams_riders: "Khams-pa Frontier Riders"
 nd_tbt_khams_riders_desc: "The long-armed horsemen of the eastern marches, raised on raid and feud, deployed as light cavalry striking far beyond the imperial frontier."
 nd_tbt_butter_tea_economy: "Butter-Tea Economy"
 nd_tbt_butter_tea_economy_desc: "Pressed brick-tea, salt, and yak butter — the staple trinity of plateau life. The chama caravanserais now process and re-export brick tea for every market."
 nd_tbt_codified_imperial_law: "Codified Imperial Law"
 nd_tbt_codified_imperial_law_desc: "The Bka' yig-tshang corpus codifies the imperial edicts on stone into a written legal tradition. Imperial judges ride the circuit."
 nd_tbt_high_pass_logistics: "High-Pass Logistics"
 nd_tbt_high_pass_logistics_desc: "The army-supply officers of the dmag-blon master the high passes. Imperial columns can march through the Kunlun and Karakoram with rations intact."

 # === ADVANCES — AGE 4 ===
 nd_tbt_imperial_guard_reform: "Imperial Guard (sku-srung) Reform"
 nd_tbt_imperial_guard_reform_desc: "Establish the sku-srung as a standing imperial guard distinct from the levy. Disciplined heavy infantry, professional and permanent."
 nd_tbt_himalayan_isolation_doctrine: "Himalayan Isolation Doctrine"
 nd_tbt_himalayan_isolation_doctrine_desc: "Hold the empire behind the highest passes on Earth. Let lowland armies break themselves on the rdzong before reaching the plateau heart."
 nd_tbt_state_buddhism_reform: "State Buddhism Reform"
 nd_tbt_state_buddhism_reform_desc: "The imperial sangha is reformed as an instrument of state. Royal patronage runs the great monasteries; doctrinal disputes are settled by imperial decree."
 nd_tbt_revived_court_culture: "Revived Court Culture"
 nd_tbt_revived_court_culture_desc: "The Yarlung-imperial court tradition is consciously revived: poetry, music, the ritual seasons, the chronicles of the Tsenpos. Lhasa becomes the cultural capital of the plateau world."
 nd_tbt_vajra_tradition: "Vajra Tantric Tradition"
 nd_tbt_vajra_tradition_desc: "The vajrayana tantric corpus, painstakingly translated and indexed at the great monasteries, becomes the empire's distinctive Buddhist contribution to Asia. Silk-brocade thangka paintings hang in every imperial sanctuary."
 nd_tbt_ten_pillars_taxation: "Ten-Pillars Imperial Taxation"
 nd_tbt_ten_pillars_taxation_desc: "Ten standardized tax-pillars are erected across the empire, fixing the imperial portion of harvest, herd, and trade in carved law."

 # === ADVANCES — AGE 5 ===
 nd_tbt_plateau_artillery_doctrine: "Plateau Artillery Doctrine"
 nd_tbt_plateau_artillery_doctrine_desc: "Bronze guns cast in the Lhasa imperial foundries from Khams copper. Artillery emplaced on the rdzong walls dominates every approach to the plateau."
 nd_tbt_lhasa_grand_assembly: "Lhasa Grand Assembly"
 nd_tbt_lhasa_grand_assembly_desc: "The gar-zlon expands into a grand imperial assembly with seats for the regional clans, the great monasteries, and the merchant guilds."
 nd_tbt_brick_tea_monopoly: "Imperial Brick-Tea Monopoly"
 nd_tbt_brick_tea_monopoly_desc: "The pressing, sealing, and export of brick-tea bricks becomes a crown monopoly. Every brick stamped with the imperial seal."
 nd_tbt_great_road_network: "Imperial Road Network"
 nd_tbt_great_road_network_desc: "The Tsenpo's road service maintains a network of post-roads, courier-stations, and bridge-corveed crossings across the empire. A dispatch from Lhasa reaches Khotan in fourteen days."
 nd_tbt_gold_panning_industry: "Imperial Gold-Panning"
 nd_tbt_gold_panning_industry_desc: "The placer-gold and silver of the headwaters of the Indus, Sutlej, and Brahmaputra are organized as crown industries. Tibetan bullion buys what Tibetan armies cannot reach."
 nd_tbt_mountain_engineering: "Mountain Engineering Corps"
 nd_tbt_mountain_engineering_desc: "Imperial engineers specializing in high-altitude construction — sluice-bridges over Himalayan gorges, stepped stupas climbing crag faces, the engineering tradition that made the rdzong possible."

 # === ADVANCES — AGE 6 ===
 nd_tbt_modern_imperial_military: "Modern Imperial Military"
 nd_tbt_modern_imperial_military_desc: "The yul-sde levy and the rgyal-blon noble cavalry give way to a professional standing army, drilled on European pattern but commanded in the Tibetan tongue."
 nd_tbt_state_printing_press: "State Printing Press"
 nd_tbt_state_printing_press_desc: "The imperial scriptoria adopt mechanical typesetting and steam-driven presses. Tibetan-script books, gazettes, and almanacs flow from Lhasa to every market town."
 nd_tbt_himalayan_industry: "Himalayan Industrial Reform"
 nd_tbt_himalayan_industry_desc: "Hydraulic mills harness the great rivers descending the plateau. Iron foundries, textile mills, and powder works rise around Lhasa and Shigatse."
 nd_tbt_revived_imperial_idea: "Revived Imperial Idea"
 nd_tbt_revived_imperial_idea_desc: "Modern historians and chroniclers re-discover the Yarlung empire and proclaim its restoration as the destiny of the Tibetan nation. The Tsenpo's title regains its old weight."
 nd_tbt_neutral_diplomacy_doctrine: "Asian Neutral Diplomacy"
 nd_tbt_neutral_diplomacy_doctrine_desc: "The empire positions itself as the neutral mediator between the lowland powers. Lhasa diplomats are trusted to carry messages between rivals who would not trust their own envoys."
 nd_tbt_modern_administration: "Modern Administration"
 nd_tbt_modern_administration_desc: "The seven imperial ministries are reorganized as modern administrative departments. The plateau becomes a state in the modern sense, even as it remains an empire in the old sense."

 # === BUILDINGS ===
 nd_tbt_rdo_ring: "Rdo-ring (Imperial Stone Pillar)"
 nd_tbt_rdo_ring_desc: "A monumental stone pillar inscribed with imperial law, treaty terms, and the oaths of the great clans. The Jokhang rdo-ring still preserves the Sino-Tibetan treaty of 821-822 carved in three scripts."
 nd_tbt_bon_sanctuary: "Bon Imperial Sanctuary"
 nd_tbt_bon_sanctuary_desc: "A Yungdrung-Bon temple-fortress staffed by gshen-priests of the pre-Buddhist tradition. The imperial mountain-deity rites are observed here, and the local levy musters in its forecourt."
 nd_tbt_samye_monastery: "Samye-Style Monastic Complex"
 nd_tbt_samye_monastery_desc: "A grand mandala-plan monastic complex modeled on Samye, founded by Trisong Detsen in 779. Translation halls, debate-courtyards, scriptoria, and stupa-towers cluster around a central temple."
 nd_tbt_imperial_scriptorium: "Imperial Scriptorium"
 nd_tbt_imperial_scriptorium_desc: "The translation-and-printing bureau where Sanskrit, Chinese, Khotanese, and Persian texts are rendered into the Tibetan script and block-printed for distribution across the empire."
 nd_tbt_rdzong: "Rdzong (Plateau Fortress)"
 nd_tbt_rdzong_desc: "A crag-perched stone fortress, the strategic spine of the imperial defensive system. Rdzong garrisons hold the high passes and watch the imperial frontiers from above."
 nd_tbt_chama_caravanserai: "Chama Trade-Fair Caravanserai"
 nd_tbt_chama_caravanserai_desc: "A fortified caravanserai on the tea-horse trade route. Yunnan brick tea is exchanged for Tibetan warhorses; the customs officers of the gtsang-blon collect imperial tariffs."
 nd_tbt_nambu_workshop: "Nambu Yak-Wool Workshop"
 nd_tbt_nambu_workshop_desc: "A weavers' guildhall producing nambu felt cloth and the famous Tibetan carpets. Heavy yak wool, locally fulled and dyed, processed for both domestic use and Asia-wide export."
 nd_tbt_council_hall: "Imperial Council Hall (gar-zlon)"
 nd_tbt_council_hall_desc: "The hall where the seven imperial ministers meet to administer the empire while the Tsenpo campaigns. Codified by chief minister Gar Tongtsen in 654-655."

 # === BUILDING PRODUCTION METHODS ===
 nd_tbt_rdo_ring_maintenance: "Stone Pillar Maintenance"
 nd_tbt_rdo_ring_maintenance_desc: "The masons and scribes who clean, recut, and re-ink the inscriptions on the imperial pillars."
 nd_tbt_bon_sanctuary_maintenance: "Bon Sanctuary Maintenance"
 nd_tbt_bon_sanctuary_maintenance_desc: "Incense, ritual cloths, butter-lamps, and the herd offerings sustained for the gshen-priests' rites."
 nd_tbt_samye_maintenance: "Samye Monastic Maintenance"
 nd_tbt_samye_maintenance_desc: "Paper for translations, beeswax for lamps, incense for the daily rites, and pottery for the refectories."
 nd_tbt_block_print_pm: "Block-Print Scripture"
 nd_tbt_block_print_pm_desc: "Carved wooden blocks of Sanskrit and Tibetan canon, inked and printed onto pressed paper at the monastic scriptoria."
 nd_tbt_tantric_translation_pm: "Tantric Translation Project"
 nd_tbt_tantric_translation_pm_desc: "The lo-tsa-ba master translators render Sanskrit tantric texts into Tibetan, producing block-printed editions of the Kangyur and Tengyur."
 nd_tbt_thangka_workshop_pm: "Thangka Painting Workshop"
 nd_tbt_thangka_workshop_pm_desc: "Painted thangka scrolls on cloth backings, the principal devotional art of the imperial sangha. Wool, leather, and beeswax bind the silk-cotton mounts."
 nd_tbt_scriptorium_maintenance: "Scriptorium Maintenance"
 nd_tbt_scriptorium_maintenance_desc: "Paper, beeswax, ink-pot pottery, and the carved blocks of the imperial scriptorium."
 nd_tbt_scripture_printing_pm: "Scripture Block-Printing"
 nd_tbt_scripture_printing_pm_desc: "Block-printed Buddhist scripture, royal chronicles, and administrative records produced for distribution across the empire."
 nd_tbt_modern_press_pm: "Modern Tibetan Press"
 nd_tbt_modern_press_pm_desc: "Mechanical typesetting and steam-driven presses produce Tibetan-script books, almanacs, and government gazettes for the plateau market."
 nd_tbt_rdzong_maintenance: "Rdzong Garrison Maintenance"
 nd_tbt_rdzong_maintenance_desc: "Stonework, weapons, and provisions for the high-pass fortress garrisons."
 nd_tbt_caravanserai_maintenance: "Caravanserai Maintenance"
 nd_tbt_caravanserai_maintenance_desc: "Fodder, brick-tea stocks, traveler's cloth, and pack-mule equipment for the chama trade-fair."
 nd_tbt_horse_trade_pm: "Tea-for-Horse Exchange"
 nd_tbt_horse_trade_pm_desc: "The imperial chama trade — brick tea from Yunnan exchanged for Tibetan warhorses, salt, and pack-yaks."
 nd_tbt_brick_tea_pm: "Imperial Brick Tea"
 nd_tbt_brick_tea_pm_desc: "Pressed brick-tea, sealed with the imperial stamp and the trade-fair tariff. Bricks travel from the chama caravanserais to every steppe market."
 nd_tbt_nambu_maintenance: "Nambu Workshop Maintenance"
 nd_tbt_nambu_maintenance_desc: "Yak wool, looms, and the dyer's tools sustained for the weavers' guild."
 nd_tbt_yak_wool_pm: "Nambu Felt Weaving"
 nd_tbt_yak_wool_pm_desc: "Heavy yak-wool felt cloth, locally fulled and rough-dyed, the everyday textile of the plateau."
 nd_tbt_imperial_carpet_pm: "Imperial Carpet Weaving"
 nd_tbt_imperial_carpet_pm_desc: "Hand-knotted Tibetan carpets dyed with Himalayan pigments, prized across Asia and exported as far as Persia."
 nd_tbt_silk_weaving_pm: "Silk-Wool Brocade"
 nd_tbt_silk_weaving_pm_desc: "The vajra tradition's silk-brocade thangka cloth, woven of imported silk and local wool, dyed in the temple colors of the imperial sangha."
 nd_tbt_imperial_drape_pm: "Imperial Court Drape"
 nd_tbt_imperial_drape_pm_desc: "Wool-and-silk court textiles dyed in imperial colors, woven for the Tsenpo's revived court ceremony."
 nd_tbt_council_hall_maintenance: "Council Hall Maintenance"
 nd_tbt_council_hall_maintenance_desc: "Paper, beeswax, masonry, and the ceremonial cloths for the seven ministers' chamber."

 # === UNITS ===
 a_nd_tbt_yul_sde: "Yul-sde Conscript Spearmen"
 a_nd_tbt_yul_sde_desc: "The household conscripts of the imperial khri-sde district levy. Spear, longbow, and leather-and-iron lamellar; raised under noble command for the Tsenpo's campaigns."
 a_nd_tbt_rgyal_blon_cavalry: "Rgyal-blon Mailed Cavalry"
 a_nd_tbt_rgyal_blon_cavalry_desc: "The empire's noble cavalry, riders and horses encased in iron lamellar to the eyes. Armed with the famously long Tibetan lance, they fought arrayed in dismounted ranks as much as in the charge."
 a_nd_tbt_imperial_guard: "Sku-srung Imperial Guard"
 a_nd_tbt_imperial_guard_desc: "The standing professional infantry of the revived empire. Where the yul-sde levy returns home each season, the sku-srung serve for life under direct imperial pay."
 a_nd_tbt_khams_riders: "Khams-pa Frontier Riders"
 a_nd_tbt_khams_riders_desc: "The long-armed horsemen of the eastern Khams marches — raid-trained, raised in feud, deployed as light cavalry striking far beyond the imperial frontier."
 a_nd_tbt_plateau_artillery: "Plateau Artillery"
 a_nd_tbt_plateau_artillery_desc: "Bronze guns cast in the Lhasa imperial foundries from Khams copper. The crew-roles draw on the engineer-corps tradition that built the rdzong."

 # === LEVIES ===
 levy_nd_tbt_yul_sde: "Yul-sde Conscript Levy"
 levy_nd_tbt_yul_sde_desc: "The imperial district levy mustered by household across the empire's khri-sde administrative grid."
 levy_nd_tbt_rgyal_blon: "Rgyal-blon Cavalry Levy"
 levy_nd_tbt_rgyal_blon_desc: "The mailed nobility of the great clans, summoned to the imperial banner."

 # === DESTINY VARIABLE TOOLTIPS ===
 nd_tbt_formed_tt: "The Tibetan Empire has been restored"
 nd_tbt_path_a_tt: "Chose the Yungdrung Bon imperial cult at formation"
 nd_tbt_path_b_tt: "Chose the Dharma Kings' Buddhist synthesis at formation"

 # ===== DESTINY TREE LOCALIZATION =====

 # === Destiny advances ===
 nd_tbt_destiny: "The Tsenpo's Destiny"
 nd_tbt_destiny_desc: "The Yarlung-imperial restoration is complete. The empire stands at a crossroads — the warrior path of Inner Asian dominion, or the dharma path of universal Mahayana civilization. Stability of 75 unlocks the imperial road ahead."

 # Path A — Inner Asian Empire
 nd_tbt_dest_tarim_recovery: "March on the Steppe"
 nd_tbt_dest_tarim_recovery_desc: "The Yarlung empire's reach already touches the Tian Shan and the Tang frontier. Now push north onto the Mongol steppe itself: Karakorum and Urga acknowledge the Tsenpo's banner. The empire is no longer just an Inner Asian power; it is a steppe-overlord, the way the Yarlung tsenpos briefly were in the late 8th century when the Eastern Türk khaganate paid them tribute."
 nd_tbt_dest_hexi_corridor: "Past the Hexi Frontier"
 nd_tbt_dest_hexi_corridor_desc: "The historical Yarlung empire campaigned along the Tang frontier through the Wei-river and Sichuan corridors but never quite held them in fact. The destiny makes the contested frontier permanent imperial ground. Lanzhou (the upper Yellow River prefectural seat), Xining (the Qinghai corridor controlling the route to Hexi), and Chengdu (the Sichuan basin's commercial capital) all answer to Lhasa. The 763-829 Tang-Tibetan border wars end with the Tsenpo's seal on every prefectural document."
 nd_tbt_dest_inner_asian_empire: "The Inner Asian Empire"
 nd_tbt_dest_inner_asian_empire_desc: "In 763 AD a Tibetan host captured Chang'an itself; the Tang emperor fled, and the city of three million flew the Tsenpo's banner for fifteen days before the imperial army withdrew. The destiny capstone permanises that fifteen days into a lasting reign over the Wei valley. Chang'an pays tribute from the Yellow River; Kunming pays tribute from the Yunnan plateau where the Yarlung empire once held Nanzhao as a tributary. The warrior-empire of Trisong Detsen is restored to dimensions even the historical empire only briefly held. Unlocks the Imperial Stone-Pillar Palace at Lhasa."

 # Path B — Dharma Imperium
 nd_tbt_dest_pala_heartland: "Reclaim the Pala Heartland"
 nd_tbt_dest_pala_heartland_desc: "Bring Bihar back into the dharma — Gaya beside the bodhi-tree, Rajgir of the First Buddhist Council. The Pala-era seats of Mahayana that produced Tibetan Buddhism return to imperial guardianship."
 nd_tbt_dest_bengali_sangha: "Restore the Bengali Sangha"
 nd_tbt_dest_bengali_sangha_desc: "Hold Pala Bengal: Gaur and Sonargaon, the lower Ganges Buddhist heartland. The imperial scriptoria absorb the Pala translation tradition and the great printing press preserves it for every monastery."
 nd_tbt_dest_dharma_imperium: "The Dharma Imperium"
 nd_tbt_dest_dharma_imperium_desc: "Mongolia converts under the imperial sangha — the Orkhon and Khentii steppe become the eastern arm of a Mahayana civilization-empire stretching from Bengal to Lake Baikal. Unlocks the Great Translation House."

 # === Destiny variable tooltips already exist (nd_tbt_path_a_tt etc.) ===

 # === Destiny event 8: Root ===
 nd_tbt.8.t: "The Tsenpo's Destiny"
 nd_tbt.8.d: "The empire is whole. The mountain-passes are watched, the rdo-ring stand inscribed, the great clans muster on imperial summons. Now the council looks beyond the plateau.\n\nThe ministers debate. Some argue the Tsenpo's destiny lies in restoration: ride east as Songtsen Gampo and Trisong Detsen rode, take back the Tarim and the Hexi corridor, build a Yarlung empire that reaches from the Karakoram to the Mongol steppe. Others argue the empire's true vocation is civilizational, not territorial: become the Mahayana axis of Asia, restore the dharma to its Pala homeland, carry the doctrine to the steppe-peoples in the lineage of the Three Dharma Kings.\n\nWhichever destiny the Tsenpo chooses, the imperial council declares the path open."
 nd_tbt.8.a: "Let the imperial road be opened"

 # === Destiny event 9: Tarim recovered ===
 nd_tbt.9.t: "The Steppe Bows to Lhasa"
 nd_tbt.9.d: "Tibetan riders pour out of the high passes onto the Mongol steppe. Karakorum, the Khentii camp-cities, the Onon and Kerulen valleys bow before the imperial host. The Eastern Türk khaganate-successors offer the same tribute their ancestors offered Trisong Detsen in the 780s; Mongol clans fold into the imperial federation as auxiliary tümens.\n\nThe Tsenpo of Lhasa is now also a steppe-overlord. The chronicles will record that the empire reaches from Inner Asia to the Onon."
 nd_tbt.9.a: "The steppe is the Tsenpo's grazing-land"

 # === Destiny event 10: Hexi corridor ===
 nd_tbt.10.t: "The Tang Frontier Crossed"
 nd_tbt.10.d: "Lanzhou, Xining, and Chengdu fall in succession to the imperial host. Tibet has crossed the Tang frontier proper -- past the Hexi corridor, past the Anxi garrisons, into the Wei-river valley and the Sichuan basin themselves. The 763-829 border wars are over; the imperial Tibetan host stands inside what was for centuries Tang heartland. The Sichuan tea-merchants pay their tariffs to Tibetan customs-officers; Lanzhou's Yellow River dockyards build for the Tsenpo's fleet.\n\nNow the imperial council debates how to hold the conquest: as a fortified frontier-line of garrisons and watch-towers, or as the open trade-road of the chama and the Silk Route?"
 nd_tbt.10.a: "Fortify the corridor as a garrison-line"
 nd_tbt.10.b: "Open the corridor as the great caravan-road"

 STATIC_MODIFIER_NAME_nd_tbt_dest_hexi_garrison_line: "Hexi Garrison Line"
 STATIC_MODIFIER_DESC_nd_tbt_dest_hexi_garrison_line: "Watchtowers and rdzong fortresses chain along the corridor. The frontier holds, but the cost of keeping it falls on the lowland districts."
 STATIC_MODIFIER_NAME_nd_tbt_dest_hexi_caravan_road: "Hexi Caravan Road"
 STATIC_MODIFIER_DESC_nd_tbt_dest_hexi_caravan_road: "The corridor pulses with caravans east and west. Imperial banks underwrite Sogdian and Uyghur merchants in exchange for fees and tariffs."

 # === Destiny event 11: Inner Asian Empire (capstone) ===
 nd_tbt.11.t: "Chang'an Beneath the Pillar"
 nd_tbt.11.d: "In 763 AD, twenty thousand Tibetan riders entered Chang'an. The Tang emperor fled south; the city of three million flew the Tsenpo's banner for fifteen days before the imperial host withdrew under negotiated terms. Tang chronicles called it a humiliation; Tibetan court-records called it the high tide of the empire. Now, after centuries, the imperial host has returned, and Chang'an does not pass back. The Wei valley pays tribute to Lhasa from the Yellow River; Kunming pays tribute from the Yunnan plateau where the Yarlung empire once held Nanzhao as a tributary; the steppe-tümens, the Tarim oases, the Hexi corridor, and the Wei-Sichuan corridor all answer to the Tsenpo's pillar.\n\nThe court-scribes carve the names of every submitted ruler on the new Imperial Pillar Palace, that none may forget. The ministers debate the imperial style of the new dispensation. Shall the Tsenpo rule as a warrior-king of Yarlung, leading the host in person as the Three Dharma Kings did, or as a steppe-overlord receiving tribute from a hundred subordinate princes?"
 nd_tbt.11.a: "Lead the imperial host as the warrior-Tsenpo"
 nd_tbt.11.b: "Reign as the steppe-overlord of subject princes"

 STATIC_MODIFIER_NAME_nd_tbt_dest_warrior_tsenpo: "Warrior-Tsenpo of Yarlung"
 STATIC_MODIFIER_DESC_nd_tbt_dest_warrior_tsenpo: "The Tsenpo rides at the head of his army as Songtsen Gampo and Trisong Detsen rode. The empire is at war wherever the imperial standard goes."
 STATIC_MODIFIER_NAME_nd_tbt_dest_steppe_overlord: "Steppe Overlord"
 STATIC_MODIFIER_DESC_nd_tbt_dest_steppe_overlord: "A hundred subordinate princes pay tribute and supply auxiliaries. The empire's reach extends through diplomacy and tribute as much as through arms."

 # === Destiny event 12: Pala heartland ===
 nd_tbt.12.t: "Beneath the Bodhi-Tree"
 nd_tbt.12.d: "Gaya falls. The Tibetan host enters the Mahabodhi temple-precinct unopposed; the bodhi-tree under which the Buddha attained enlightenment stands beneath the imperial banner. Rajgir, where the first Buddhist Council convened, opens its gates the same week.\n\nThe Pala-era heartland of the Mahayana, the cradle of the dharma that came to Tibet, is once again under Buddhist guardianship. The chronicles will say that the Tsenpo wept when he made his offerings at the Mahabodhi."
 nd_tbt.12.a: "Make imperial offerings at the Mahabodhi"

 # === Destiny event 13: Bengali sangha ===
 nd_tbt.13.t: "The Bengal Sangha Restored"
 nd_tbt.13.d: "Gaur, Sonargaon, and Monghyr — the lower Ganges Buddhist heartland — pass under the imperial banner. The lo-tsa-ba master translators arrive at the great Pala monastic foundations to copy, translate, and re-print every surviving Indic manuscript.\n\nShall this be a translation project to recover and complete the Tibetan canon, or a great gathering of Bengali panditas at Lhasa to instruct the imperial sangha directly?"
 nd_tbt.13.a: "Launch the Great Translation Project"
 nd_tbt.13.b: "Convene the Pandita Court at Lhasa"

 STATIC_MODIFIER_NAME_nd_tbt_dest_great_translation: "Great Translation Project"
 STATIC_MODIFIER_DESC_nd_tbt_dest_great_translation: "The Sanskrit and Pali manuscripts of the Pala vihara return to Tibetan tongue under the printing-press imperial canon."
 STATIC_MODIFIER_NAME_nd_tbt_dest_pandita_court: "Pandita Court at Lhasa"
 STATIC_MODIFIER_DESC_nd_tbt_dest_pandita_court: "The great panditas of Bengal, Kashmir, and Magadha lecture daily in the imperial halls. The court grows cosmopolitan, but the old plateau traditions thin."

 # === Destiny event 14: Dharma Imperium (capstone) ===
 nd_tbt.14.t: "The Mahayana Universal Council"
 nd_tbt.14.d: "Mongolia converts. The Orkhon and Khentii steppe acknowledge the imperial sangha; Bhagalpur on the Ganges sends its panditas to Lhasa to instruct the Mongol khans in the doctrine. The imperial Mahayana stretches from the Bay of Bengal to Lake Baikal — the eastern Buddhist civilization, fulfilled.\n\nWhat shape shall the dharma imperium take? A great universal council uniting every Buddhist tradition under Lhasa, or a permanent dual-throne dynasty of lama and khan, in the lineage of Altan Khan and the Dalai Lama?"
 nd_tbt.14.a: "Convene the Mahayana Universal Council"
 nd_tbt.14.b: "Found the Lama-Khan Dynastic Order"

 STATIC_MODIFIER_NAME_nd_tbt_dest_mahayana_council: "Mahayana Universal Council"
 STATIC_MODIFIER_DESC_nd_tbt_dest_mahayana_council: "Every Buddhist tradition from Bengal to Mongolia sits under a single imperial council. The dharma is one, and Lhasa is its seat."
 STATIC_MODIFIER_NAME_nd_tbt_dest_lama_dynasty: "Lama-Khan Dynastic Order"
 STATIC_MODIFIER_DESC_nd_tbt_dest_lama_dynasty: "The lineage of dual-throne sovereignty: lama and khan, sangha and steppe, in the model of Altan Khan and the Dalai Lama. The clergy carry the empire's spine. The merchant-houses pay the cost."

 # === Destiny capstone buildings ===
 nd_tbt_imperial_pillar_palace: "Imperial Stone-Pillar Palace"
 nd_tbt_imperial_pillar_palace_desc: "A vast stone-and-timber palace at Lhasa, walls inscribed in the rdo-ring tradition with the names of every conquered oasis and tributary khanate from the Tarim to the Mongol steppe. Houses the imperial muster-ground and the Tsenpo's war-chamber."
 nd_tbt_great_translation_house: "Great Translation House"
 nd_tbt_great_translation_house_desc: "An imperial monastic-academy on the Samye plan, scaled to Mahayana universal ambition. Translation halls in every major Indic and Inner Asian language, a permanent council of panditas, and the imperial block-printing presses preserving the canon."

 # === Destiny capstone building production methods ===
 nd_tbt_pillar_palace_maintenance: "Pillar Palace Maintenance"
 nd_tbt_pillar_palace_maintenance_desc: "Stone, masonry, weaponry, and warhorses for the imperial muster-ground and the Tsenpo's standing escort."
 nd_tbt_translation_house_maintenance: "Translation House Maintenance"
 nd_tbt_translation_house_maintenance_desc: "Paper, beeswax for lamps, incense for the daily rites, and the stockpiles of book-blanks for the imperial press."

 # === Bureaucracies ===
 AUTO_MODIFIER_NAME_nd_tbt_bureaucracy_authority: "Authority of the Tsenpo"
 AUTO_MODIFIER_DESC_nd_tbt_bureaucracy_authority: "The restored Yarlung crown commands the institutional apparatus of the imperial period: the gar-zlon council, the stong-sde myriarchy, the bonpo ritual office, and the lo-tsa-ba translation court. Grants two bureaucracy slots in addition to the slot from the imperial capital."

 gar_zlon_bureaucracy: "gar-zlon -- Imperial Council"
 gar_zlon_bureaucracy_desc: "Codified by the chief minister Gar Tongtsen Yulsung in 654-655, the gar-zlon was a standing cabinet of seven blon-po ministers around the blon-chen-po grand minister, who functioned as the empire's chief executive under the tsenpo. The Old Tibetan Annals and the bilingual treaty inscriptions show this seven-minister structure persisting through the imperial period; the great clans were bound permanently into the executive, and no act of war, treaty, or succession was sealed without the council's mark. The cost was that the tsenpo could no longer rule alone: the Gar lineage's own monopoly provoked Tridu Songtsen's purge of 698, and after every clan that followed the Gar into the blon-chen-po's office tried in turn to make the chair hereditary."

 stong_sde_bureaucracy: "stong-sde -- Myriarchy Levy"
 stong_sde_bureaucracy_desc: "Songtsen Gampo's reforms in the 630s organized central Tibet into four ru ('horns') subdivided into stong-sde ('thousand-districts') of nominally one thousand households apiece, each owing armed men, mounts, and grain to the imperial muster. The yul-sde land-administration officers kept the rolls; subsequent tsenpos extended the system across Sumpa, Zhang-zhung, Amdo, and into the conquered Tarim oases. The stong-sde gave the Yarlung empire a peasant-based field army that no other steppe-derived power of its century could match -- and bound the conscripted households into hereditary military service that increasingly resembled serfdom by the imperial period's end."

 bonpo_priesthood_bureaucracy: "Bonpo Imperial Cult"
 bonpo_priesthood_bureaucracy_desc: "The pre-Buddhist ritual aristocracy of the Yarlung tsenpos: chaplain-judges, funerary specialists for the imperial tombs at Chongye, oracle-officers (ku-tsab) interpreting the omens that ratified war and treaty, and ritual judges in the tsenpo's court. Their cosmology of the lha-sras tsenpo descending from the sky on the dmu-rope gave the Yarlung dynasty its sacred legitimacy. Even after Trisong Detsen's eighth-century Buddhist conversion, bonpo institutions survived as a parallel apparatus -- and Langdarma's ninth-century reaction sought to restore them to primacy. Wherever the bon-po cult persists as a department of state, the great clans and the older priesthood feel the empire is theirs."

 lo_tsa_ba_court_bureaucracy: "lo-tsa-ba Translation Court"
 lo_tsa_ba_court_bureaucracy_desc: "The imperial Buddhist translation project, the institutional achievement of the Three Dharma Kings -- Songtsen Gampo, Trisong Detsen (755-797), and Tri Ralpacan (815-838). The sgra-bsgyur lo-tsa-ba ('translator-officials') were a salaried imperial corps drawing on Indian panditas at Samye (founded 779) and the standardized Tibetan vocabulary fixed by the Mahavyutpatti decrees. Their output was the bka'-'gyur and bstan-'gyur canon -- one of the largest translation projects in pre-modern history. Ralpacan codified the seven-monk rule, by which seven peasant households supported each ordained monk; the warrior-clans resented the drain on rents owed them, and the assassination plots that ended Ralpacan's reign were the same factional violence Langdarma later turned against Buddhism itself."
 nd_tbt_imperial_press: "Imperial Press"
 nd_tbt_imperial_press_desc: "The block-print edition shops of the imperial chancery and the great monastic academies. Where the scriptorium copies and the monastery translates, the press binds — issuing the imperial canon, the bka'-'gyur, the bstan-'gyur, and the modern state-press editions in standardized woodblock and movable-type runs."
 nd_tbt_press_block_print_pm: "Block-Print Edition"
 nd_tbt_press_block_print_pm_desc: "The carved hardwood blocks of the imperial canon and dharma corpus. Print-runs distributed to monastic academies, government offices, and frontier dzongs."
 nd_tbt_press_scripture_pm: "Imperial Scripture Edition"
 nd_tbt_press_scripture_pm_desc: "Pigmented imperial editions of the bka'-'gyur and bstan-'gyur — vermilion title pages, gold-leaf chapter heads, the codified state Buddhism in monumental edition."
 nd_tbt_press_modern_pm: "Modern State Press"
 nd_tbt_press_modern_pm_desc: "Movable-type editions of the imperial chronicle, the codified law, and the dharma corpus. Vernacular Tibetan editions for the chos-grwa academies, classical for the imperial chancery."
 nd_tbt_brick_tea_press: "Brick Tea Press"
 nd_tbt_brick_tea_press_desc: "The Kham and Amdo press-sheds that compress green tea leaf into trade-grade bricks. Each brick is bound with bamboo strap and salt-cured for caravan transit. The upstream production behind the chama tea-horse trade."
 nd_tbt_press_brick_tea_pm: "Brick Tea Press"
 nd_tbt_press_brick_tea_pm_desc: "Compressed green-tea bricks bound for the steppe caravan trade. Lumber for the press frames, salt for cure, livestock for transport-fodder, and the Kham peasants' winter labour."
 nd_tbt_thangka_atelier: "Thangka Atelier"
 nd_tbt_thangka_atelier_desc: "The painters' workshops of the great tantric thangka tradition. Silk-and-cotton scrolls primed with chalk, painted with mineral pigments — malachite, cinnabar, lapis, gold leaf — depicting buddhas, mandalas, and the imperial lineage portraits that decorate every chos-grwa wall."
 nd_tbt_atelier_thangka_pm: "Thangka Painting"
 nd_tbt_atelier_thangka_pm_desc: "Silk-cotton scroll thangkas painted in the Karma-gadri or Menri tradition — pigment ground with hide-glue, gold leaf burnished over consecrated brocade, the imperial lineage rendered in mineral colour."
