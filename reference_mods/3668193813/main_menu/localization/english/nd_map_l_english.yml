l_english:
 nd_map_formed_tt: "Wallmapu has been forged"
 nd_map_path_a_tt: "Path of Wallmapu Endurance"
 nd_map_path_b_tt: "Path of Pillan's Spear"
 # ===== Static Modifiers =====
 STATIC_MODIFIER_NAME_nd_map_wallmapu_endurance: "Wallmapu Endurance"
 STATIC_MODIFIER_DESC_nd_map_wallmapu_endurance: "The cordillera and the Valdivian forests are our walls. The huinca who enters them does not return. We do not need their cities, their gold, or their god — we need only the land that bore us."
 STATIC_MODIFIER_NAME_nd_map_pillan_spear: "Pillan's Spear"
 STATIC_MODIFIER_DESC_nd_map_pillan_spear: "What Lautaro began at Tucapel, the federation must finish. The Toki rides north, the boleadora swings east, and the Spaniard learns that there is no border the Mapuche cannot cross when the spear of Pillan is raised."
 STATIC_MODIFIER_NAME_nd_map_curalaba_legacy: "The Curalaba Legacy"
 STATIC_MODIFIER_DESC_nd_map_curalaba_legacy: "Pelantaru's ambush at Curalaba broke the Spanish governor and erased seven cities from the map of conquest. The lesson endures: Wallmapu is not a province to be administered, but a people to be feared."
 STATIC_MODIFIER_NAME_nd_map_quilin_compact: "Compact of Quilín"
 STATIC_MODIFIER_DESC_nd_map_quilin_compact: "On the riverbank at Quilín the Spanish crown set its name beside ours as equal sovereigns. The Bío-Bío is a recognized border, the Parlamentos are a recognized custom, and Wallmapu is a recognized nation."
 STATIC_MODIFIER_NAME_nd_map_quilin_unbroken: "The Bío-Bío Unbroken"
 STATIC_MODIFIER_DESC_nd_map_quilin_unbroken: "The federation refuses the treaty as a trap dressed in friendship. The river is no border — it is a temporary truce-line, and the Konas remain ready for the day the huinca breaks his own paper."
 STATIC_MODIFIER_NAME_nd_map_lautaro_doctrine: "Lautaro's Doctrine"
 STATIC_MODIFIER_DESC_nd_map_lautaro_doctrine: "The young Toki who served Valdivia as a stable boy returned with the secret: the horse is not a Spanish weapon — it is a weapon. The first Mapuche cavalry corps rides under his name."
 STATIC_MODIFIER_NAME_nd_map_steed_seizure: "The Captured Herd"
 STATIC_MODIFIER_DESC_nd_map_steed_seizure: "Stolen, raided, and bred from broken Spanish stock, the Mapuche herd grows on the Puelmapu pampas. Within a generation the Reche ride as well as any conquistador, and on better terrain."

 # ===== Formation Event =====
 nd_map.1.t: "The Council of All Lands"
 nd_map.1.d: "From Pikun to Williche, from the Valdivian forest to the dry plains beyond the cordillera, the lonkos and tokis have ridden to a single ngillatun field. Four centuries of scattered Lof and federated Aillarewe end here. The drum of the kultrun calls the trompe-trompe of the federation, and a Toki Mapu — a war-leader of the whole land — must be acclaimed.\n\nThe debate is not over whether to fight. It is over what fight is ours. The elder lonkos counsel patience: Wallmapu has held the cordillera for two-and-seventy generations because it has refused to leave it. The young tokis — riders of the new horse, raiders of the Spanish settlements at Cuyo — counsel that the Mapuche have never been so strong, and that the spear of Pillan should now be raised over every land the huinca claims south of Lima.\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_map.1.a: "Wallmapu Endurance — the cordillera is enough"
 nd_map.1.b: "Pillan's Spear — drive the huinca into the sea"

 # ===== DHE: Curalaba Uprising =====
 nd_map.2.t: "The Disaster of Curalaba"
 nd_map.2.d: "On the night of December 23rd at the ford of Curalaba, the Toki Pelantaru ambushed Governor Martín García Óñez de Loyola. The governor died, his fifty horsemen died, and within six years every Spanish city south of the Bío-Bío — Valdivia, Imperial, Angol, Villarrica, Santa Cruz, San Bartolomé, Osorno — had been razed by uprising warriors. The Destruction of the Seven Cities is the largest territorial reversal the Spanish empire ever suffered in the Americas. From this moment, the conquistador's road south ends at the river."
 nd_map.2.a: "Wallmapu shall not be measured in leagues but in dead governors."

 # ===== DHE: Treaty of Quilín =====
 nd_map.3.t: "The Quilín Parlamento"
 nd_map.3.d: "On the field of Quilín in 1641, the Marquis de Baides — Governor of Chile, representative of the Spanish crown — sets his name on a treaty with the assembled lonkos of the federation. It is the first and only treaty the Spanish empire will ever sign with an Indigenous American nation as legal equals. The terms recognize Wallmapu's sovereignty south of the Bío-Bío, establish an annual Parlamento for renewing peace, and forbid Spanish settlement beyond the river. The lonkos must decide: do we hold the federation to this paper as a true compact, or do we treat it as a temporary breath between wars?"
 nd_map.3.a: "Honor the compact — the Parlamentos shall be observed"
 nd_map.3.b: "The Bío-Bío is a truce-line, not a border"

 # ===== DHE: Lautaro's Doctrine =====
 nd_map.4.t: "Lautaro and the First Cavalry"
 nd_map.4.d: "Felipe Lautaro served Pedro de Valdivia as a stable-boy and learned every weakness of the Spanish horse: how it tires, how it is fed, how its rider eats and rests. He defected to his own people, took the title of Toki, and returned at the head of a force that destroyed Valdivia at Tucapel and killed the conqueror with his own hands. From his campaign comes the first Mapuche cavalry corps — and from his methods comes every Mapuche victory of the next two centuries."
 nd_map.4.a: "The horse no longer belongs to the huinca alone."

 # ===== DHE: Captured Steed =====
 nd_map.5.t: "The Herd Beyond the River"
 nd_map.5.d: "What began as raids on lone outposts is now a sustained transfer of horse-flesh: the Mapuche have stolen, broken, and bred enough stock to mount their own infantry, and beyond the cordillera in Puelmapu the federation's herds graze on grass no Spaniard has ridden. By the next generation, no European cavalry will have an advantage of mobility against the Reche on his own land."
 nd_map.5.a: "The pampas are ours to ride."

 # ===== Advances =====
 nd_map_lof_confederation: "Lof Confederation"
 nd_map_lof_confederation_desc: "The lof — the kinship-lineage household — is the foundation of Mapuche political life. From the lof rises the rewe (council of nine), and from the rewe the aillarewe (federation of nine councils). No king, no court — but every man and every horse counted."
 nd_map_aillarewe_federation: "Aillarewe Federation"
 nd_map_aillarewe_federation_desc: "Nine rewe form an aillarewe; nine aillarewe form a butalmapu; four butalmapu form Wallmapu. The structure is fractal, voluntary, and astonishingly resilient: it has no head to cut off."
 nd_map_ngillatun_ceremony: "Ngillatun Ceremony"
 nd_map_ngillatun_ceremony_desc: "Every four years, the federation gathers on a sacred field for the ngillatun: a four-day ritual of fertility, peace, and political summit. The dance, the chicha, and the inter-aillarewe negotiations are inseparable."
 nd_map_valdivian_forest: "Valdivian Forest Mastery"
 nd_map_valdivian_forest_desc: "The temperate rainforests of Ngulumapu — coihue, alerce, and ulmo trees up to four thousand years old — are mapped, named, and known by every Mapuche warrior in a way no Spanish guide can match."
 nd_map_toki_council: "Toki Council"
 nd_map_toki_council_desc: "The Toki — bearer of the toki-kura war-axe — is elected for the duration of a campaign and obeyed absolutely while the campaign lasts. After it, he returns to his lof. There is no standing king to capture, no capital to sack, no court to corrupt."
 nd_map_inca_repulse: "The Maule Repulse"
 nd_map_inca_repulse_desc: "When Tupac Yupanqui's Inca army crossed the Maule in the 1480s, the Promaucae and Mapuche met them at the Battle of the Maule. After three days of stalemate, the Inca turned back. The southern frontier of Tawantinsuyu was set at the Maule, and Wallmapu remained unconquered."
 nd_map_machi_shamans: "Machi Shamans"
 nd_map_machi_shamans_desc: "The machi — most often a woman — is the Mapuche shaman, healer, prophet, and battlefield ritualist. She mediates between the living and the Pillan, and her voice can override even a Toki on matters of spiritual consequence."
 nd_map_ruka_settlement: "Ruka Settlement"
 nd_map_ruka_settlement_desc: "The ruka — a thatched dwelling of coligüe canes and totora-reed roof — is built communally in a single day, oriented toward the dawn. A Mapuche village is a constellation of ruka, not a town with a plaza."
 nd_map_lautaro_doctrine: "Lautaro's Doctrine"
 nd_map_lautaro_doctrine_desc: "Lautaro's tactical legacy: relays of fresh horsemen, false retreats into prepared ambushes, and the deliberate exhaustion of Spanish columns before contact. The first Mapuche cavalry corps is born of his doctrine."
 nd_map_tucapel_triumph: "The Tucapel Triumph"
 nd_map_tucapel_triumph_desc: "On Christmas Day 1553, Lautaro's force annihilated Pedro de Valdivia and his army at Tucapel. The conqueror of Chile was killed — by some accounts, with molten gold poured down his throat. The Spanish southern advance died with him."
 nd_map_curalaba_uprising: "The Curalaba Uprising"
 nd_map_curalaba_uprising_desc: "Pelantaru's ambush at Curalaba in 1598 began the six-year Destruction of the Seven Cities. Every Spanish settlement south of the Bío-Bío was burned. The conquistador's road ends at the river."
 nd_map_captured_steed: "The Captured Steed"
 nd_map_captured_steed_desc: "By the early 17th century, the Mapuche have raided, bred, and trained enough horse stock that two-thirds of a battle line fights mounted. They have done what no other people in the Americas managed: matched the conquistador in cavalry."
 nd_map_cordilleran_ambush: "Cordilleran Ambush"
 nd_map_cordilleran_ambush_desc: "Pre-positioned wood-spike traps, concealed boleadora-throwers in the canopy, and a deep knowledge of the cordilleran tracks — the Mapuche turn every gorge between Bío-Bío and Toltén into an ambush corridor."
 nd_map_bio_bio_frontier: "The Bío-Bío Frontier"
 nd_map_bio_bio_frontier_desc: "After the Destruction of the Seven Cities, the Bío-Bío becomes a fortified line — Mapuche pukara on the south bank, Spanish forts on the north. For two centuries, neither side advances."
 nd_map_pehuenche_alliance: "Pehuenche Alliance"
 nd_map_pehuenche_alliance_desc: "The Pehuenche — gatherers of the pehuén pinenut in the high Andes — formally join the federation. Their high-altitude passes become Mapuche territory, and the cordillera itself becomes a federation asset."
 nd_map_treaty_of_quilin: "The Treaty of Quilín"
 nd_map_treaty_of_quilin_desc: "The 1641 Quilín treaty: the only treaty the Spanish empire ever signed with an Indigenous American nation as a legal equal. The Bío-Bío is recognized as a sovereign border. The Parlamento institution is born."
 nd_map_malon_raids: "Malón Raids"
 nd_map_malon_raids_desc: "The malón — from Mapudungun maleu, 'to do harm' — is a fast mounted raid for cattle, horses, weapons, and captives. Lientur perfects it as a sustained strategy; by the 18th century, the Spanish frontier from Cuyo to Buenos Aires lives in fear of the dust-cloud."
 nd_map_parlamento_general: "Parlamento General"
 nd_map_parlamento_general_desc: "The annual Parlamento at Tapihue or Negrete: hundreds of lonkos and Spanish governors gathered for renegotiation, gift-exchange, and the renewal of Quilín. The federation conducts diplomacy as a peer of an empire."
 nd_map_puelmapu_expansion: "The Puelmapu Expansion"
 nd_map_puelmapu_expansion_desc: "Mapudungun-speakers cross the cordillera into the Argentine pampa, absorbing or displacing the Tehuelche and Het bands. Within a century, the steppe from Mendoza to the Río Negro is Mapuche territory."
 nd_map_wenteche_horsemanship: "Wenteche Horsemanship"
 nd_map_wenteche_horsemanship_desc: "The wenteche — 'people of the central valley' — develop the heavy lance charge against Spanish formations. The boleadora-throwing scout screens; the lancer breaks the line."
 nd_map_boqueador_raiders: "Boqueador Raiders"
 nd_map_boqueador_raiders_desc: "The boqueador — pathfinder and pass-scout — guides federation columns through the cordilleran boquetes (passes). Every Spanish punitive expedition that follows him into the mountains comes back smaller, or not at all."
 nd_map_salinas_grandes: "Salinas Grandes"
 nd_map_salinas_grandes_desc: "The vast salt flats of the Argentine pampa are the federation's economic lung: salt to preserve cattle, cattle to feed the malón, and trade-routes that reach to Buenos Aires and Concepción alike."
 nd_map_pillan_worship: "Pillan Worship Reformed"
 nd_map_pillan_worship_desc: "The federation codifies the worship of Pillan and Ngenechen — the creator-spirit and ancestor-power — as a single confessional system. The Jesuit missions are politely rejected; the machi remain the keepers of the sacred."
 nd_map_standing_warband: "The Standing Warband"
 nd_map_standing_warband_desc: "The first standing Mapuche barracks: a permanent professional warband of konas, not a seasonal levy. The federation begins to keep a regular army for the first time in its history."
 nd_map_mapudungun_literacy: "Mapudungun Literacy"
 nd_map_mapudungun_literacy_desc: "Father Luis de Valdivia's Mapudungun grammar — written by a Jesuit, but in the people's own tongue — is reclaimed by Mapuche scholars. By the 19th century, mapudungun is being printed in pamphlets and treaty texts."
 nd_map_pacification_resistance: "Resistance to Pacification"
 nd_map_pacification_resistance_desc: "The Chilean and Argentine 'Pacification' campaigns of the 1860s-1880s are the federation's longest war. With breech-loading rifles seized in raids, the Mapuche lonkos make every kilometer of the cordillera a graveyard for the new republics' regiments."
 nd_map_wallmapu_sovereignty: "Wallmapu Sovereignty"
 nd_map_wallmapu_sovereignty_desc: "Recognized as a state by the international system: Wallmapu sends embassies to Buenos Aires, Lima, Madrid, and London. The federation has done what no other Indigenous American nation has accomplished — it has survived as a sovereign."
 nd_map_trapil_orature: "Trapil Orature"
 nd_map_trapil_orature_desc: "The trapil — the bound oral history kept by the lonkos — is committed to print. The genealogies, the campaign-songs, the speeches at every Parlamento since Quilín are now archive."
 nd_map_industrial_reche: "The Industrial Reche"
 nd_map_industrial_reche_desc: "Steam mills, telegraph stations, and rifle workshops at Temuco. The federation industrializes on its own terms — the lof persists as the political unit, but the goods it consumes are now its own machine-made."
 nd_map_pampa_horse_trade: "The Pampa Horse-Trade"
 nd_map_pampa_horse_trade_desc: "Horse and cattle export from Patagonia becomes the federation's signature trade. From Salinas Grandes the herds move to Buenos Aires, Valparaíso, and the Lima market — Mapuche cattle feeding three foreign capitals."

 # ===== Units =====
 a_nd_map_kona_warband_unit: "Kona Warband"
 a_nd_map_kona_warband_unit_desc: "Spear-and-club levy of the Lof — every kinship-household contributes its young men. Untrained but locally rooted, devastating in the forests they grew up in."
 a_nd_map_kona_spearmen_unit: "Kona Spearmen"
 a_nd_map_kona_spearmen_unit_desc: "Disciplined federation spearmen — the central infantry of the Mapuche battle-line. Carries the long Mapuche pike adapted from observed Spanish tercios."
 a_nd_map_malon_rider_unit: "Malón Rider"
 a_nd_map_malon_rider_unit_desc: "Levied noble horsemen for fast plunder-raids. Carries the lance, the bola, and a string of remounts."
 a_nd_map_kona_lancer: "Kona Lancer"
 a_nd_map_kona_lancer_desc: "Lautaro's first Mapuche cavalry corps — light lancers riding captured and bred Spanish stock. Initiative and false-retreat tactics learned from Lautaro's service in Valdivia's stables."
 a_nd_map_malon_lancer: "Malón Lancer"
 a_nd_map_malon_lancer_desc: "Mounted plunder-raider — fast, lightly armored, bola-equipped. The terror of the Spanish frontier from Mendoza to Concepción."
 a_nd_map_wenteche_lancer: "Wenteche Lancer"
 a_nd_map_wenteche_lancer_desc: "Heavy shock cavalry of the central valley — armored in cuirass scavenged from Spanish casualties, riding the largest horses Wallmapu can breed. The federation's hammer."
 a_nd_map_boqueador: "Boqueador"
 a_nd_map_boqueador_desc: "Pathfinder and pass-scout. Knows every boquete in the cordillera and can guide a column over a track no Spanish guide will admit exists."
 a_nd_map_winka_rifleman: "Winka Rifleman"
 a_nd_map_winka_rifleman_desc: "Mapuche rifleman of the resistance era — armed with breech-loading rifles seized or traded from the huinca, fighting on home ground against the Pacification armies."

 # ===== Levies =====
 levy_nd_map_kona_warband: "Kona Warband Levy"
 levy_nd_map_kona_spearmen: "Kona Spearmen Levy"
 levy_nd_map_malon_riders: "Malón Riders Levy"

 # ===== Buildings =====
 nd_map_ngillatun_field: "Ngillatun Field"
 nd_map_ngillatun_field_desc: "The sacred ceremonial ground for the four-yearly ngillatun. Both temple and political summit, the field is laid out around a sacred rewe-pole."
 nd_map_lof_clanhouse: "Lof Clanhouse"
 nd_map_lof_clanhouse_desc: "The kinship-lodge of the Mapuche lineage, where the lonko receives visitors, mediates disputes, and keeps the trapil — the bound oral history of his line."
 nd_map_pillan_sanctuary: "Pillan Sanctuary"
 nd_map_pillan_sanctuary_desc: "Shrine of Ngenechen and the Pillan ancestors. The machi keeps the sacred fire and the kultrun drum here, and refuses entry to the huinca priest."
 nd_map_ruka_compound: "Ruka Compound"
 nd_map_ruka_compound_desc: "A clustered settlement of traditional Mapuche dwellings — coligüe-cane walls, totora-reed roof, central hearth. Built communally in a single day."
 nd_map_cordilleran_path: "Cordilleran Path"
 nd_map_cordilleran_path_desc: "A concealed forest-mountain trail with pre-positioned ambush points. The federation maintains these paths as defensive infrastructure — every gorge becomes a killing-ground."
 nd_map_konas_guardhouse: "Konas Guardhouse"
 nd_map_konas_guardhouse_desc: "Permanent professional barracks for a standing warband of konas — the federation's first regular army facility, breaking the seasonal-levy tradition."

 # ===== PM keys =====
 nd_map_ngillatun_maintenance: "Ngillatun Field Maintenance"
 nd_map_ngillatun_maintenance_desc: "Livestock for the four-yearly feast, fiber crops for the ceremonial cloth, and beeswax for the votive candles."
 nd_map_clanhouse_maintenance: "Clanhouse Upkeep"
 nd_map_clanhouse_maintenance_desc: "Lumber for the timbered hall, livestock for the lonko's table, and wool for the kinship-blankets that hang from the walls."
 nd_map_sanctuary_maintenance: "Sanctuary Upkeep"
 nd_map_sanctuary_maintenance_desc: "Beeswax for the sacred fire, lumber for the rewe-pole, fiber crops for the ceremonial cloth, and wild game for the machi's healing rites."
 nd_map_ruka_maintenance: "Ruka Upkeep"
 nd_map_ruka_maintenance_desc: "Lumber and coligüe-cane for the walls, fiber crops for the cordage, and fish from the rivers and coast."
 nd_map_path_maintenance: "Cordilleran Path Maintenance"
 nd_map_path_maintenance_desc: "Lumber for the spike-traps, weaponry for the cached arms, and horses for the relay-riders who carry warning down the trail."
 nd_map_guardhouse_maintenance: "Guardhouse Upkeep"
 nd_map_guardhouse_maintenance_desc: "Weaponry, horses, livestock for the konas' table, and lumber for the barracks-hall."
 nd_map_machi_rite: "Machi Rite"
 nd_map_machi_rite_desc: "Codified Ngenechen ritual practice — beeswax for the sacred fire, ceremonial cloth, and wild game for the machi's healing rites."
 nd_map_konas_drilling: "Konas Drill"
 nd_map_konas_drilling_desc: "Continuous drilling of the standing warband — modern firearms training added to the traditional weapons-and-horse curriculum."

 # ===== Destiny Tree =====
 nd_map_destiny: "A Federation's Great Project"
 nd_map_destiny_desc: "The four butalmapu have ridden to a single field, the kultrun has been struck, and the Toki Mapu has been acclaimed. The federation has done what no Mapuche generation managed before — it has chosen, as one people, what its long century shall be. The work begins now."

 nd_map_dest_codified_parlamento: "The Codified Parlamento"
 nd_map_dest_codified_parlamento_desc: "The annual Parlamentos at Tapihue and Negrete are codified into a permanent legislative cycle. Lonkos, machi, and tokis are summoned to a fixed calendar; the federation's debates become law. Requires the institution of legalism and a treasury of 1,000 ducats."
 nd_map_dest_free_republic: "The Free Republic of Reche"
 nd_map_dest_free_republic_desc: "The federation reorganizes itself as a republic of the Reche — a polity of free men, governed by election and consent, with no king and no court. Requires the institution of professional armies, 50 prestige, and 1,500 total development."
 nd_map_dest_recognized_nation: "Recognized Among Nations"
 nd_map_dest_recognized_nation_desc: "Wallmapu sends embassies to Madrid, London, Paris, and Buenos Aires. The world's chancelleries acknowledge what the Bío-Bío has known for centuries: an Indigenous American republic, sovereign and recognized. Requires global trade, 75 prestige, 3,000 ducats, and stability."

 nd_map_dest_march_toki_mapu: "March of the Toki Mapu"
 nd_map_dest_march_toki_mapu_desc: "The Toki Mapu — war-leader of all Wallmapu — rides north into the central valley, breaking the Pikumche frontier and seizing the Aconcaguan heartland. Requires ownership of Valparaiso and the Aconcagua Volcano."
 nd_map_dest_cordillera_crossed: "The Cordillera Crossed"
 nd_map_dest_cordillera_crossed_desc: "The federation's columns climb the boquetes and descend into Cuyo and the Diaguita lands of the north pampa. The Andes is no longer a wall — it is a corridor. Requires ownership of Cuyo and Kilmes, and a treasury of 2,000 ducats."
 nd_map_dest_toki_apu: "Toki Apu of All Lands"
 nd_map_dest_toki_apu_desc: "From Salta to the Tandil hills, from the cordillera to the Atlantic, the Mapuche imperial confederation is realized. The Toki Apu — supreme war-leader of the continent — sits in permanent assembly. Requires ownership of Salta and Tandil, an army of 75 regiments, 2,000 total development, and stability."

 nd_map_dest_imperial_toki: "The Imperial Toki"
 nd_map_dest_pampa_dominion: "Pampa Dominion"

 # ===== Destiny Static Modifiers =====
 STATIC_MODIFIER_NAME_nd_map_dest_lonko_senate: "The Lonko Senate"
 STATIC_MODIFIER_DESC_nd_map_dest_lonko_senate: "The lonkos of the four butalmapu sit as a permanent legislative body. Authority that once flowed only through campaign-tokis now flows through a calendar of senate-sessions, and the legitimacy of the federation rests on it."
 STATIC_MODIFIER_NAME_nd_map_dest_machi_judiciary: "The Machi Judiciary"
 STATIC_MODIFIER_DESC_nd_map_dest_machi_judiciary: "Where lonkos legislate, machi judge. Disputes between lof, between aillarewe, and between citizen and federation are heard in the sanctuary of the Pillan, and the rulings are obeyed without recourse."
 STATIC_MODIFIER_NAME_nd_map_dest_atlantic_embassies: "Embassies on the Atlantic"
 STATIC_MODIFIER_DESC_nd_map_dest_atlantic_embassies: "Wallmapu's ambassadors are received in Madrid, London, and Paris. The federation conducts diplomacy as a peer of the Atlantic powers — and trade follows the embassy banner."
 STATIC_MODIFIER_NAME_nd_map_dest_continental_compact: "Continental Compact of Peoples"
 STATIC_MODIFIER_DESC_nd_map_dest_continental_compact: "Wallmapu calls a continental Parlamento of the Indigenous nations — Tehuelche, Diaguita, Pehuenche, Tawantinsuyu's heirs — and offers a compact of mutual recognition. The free republic becomes the standard, and the conqueror's century is rebuked."
 STATIC_MODIFIER_NAME_nd_map_dest_huinca_road: "The Huinca Road Reversed"
 STATIC_MODIFIER_DESC_nd_map_dest_huinca_road: "The road the conquistador built down from Lima — the camino real — is now ridden in the opposite direction. The Toki Mapu marches it north as fast as Valdivia rode it south."
 STATIC_MODIFIER_NAME_nd_map_dest_pehuenche_passes: "Pehuenche Pass-Wardens"
 STATIC_MODIFIER_DESC_nd_map_dest_pehuenche_passes: "Every cordilleran boquete is held by Pehuenche guides. The federation's columns move through the Andes as if it were level ground; the huinca's columns move into ambushes."
 STATIC_MODIFIER_NAME_nd_map_dest_imperial_toki: "The Imperial Toki"
 STATIC_MODIFIER_DESC_nd_map_dest_imperial_toki: "The Toki Apu is acclaimed in permanent session — no longer the elected leader of a single campaign, but the standing war-chief of an imperial federation. The lof bend their lances to him."
 STATIC_MODIFIER_NAME_nd_map_dest_pampa_dominion: "Pampa Dominion"
 STATIC_MODIFIER_DESC_nd_map_dest_pampa_dominion: "The cattle-steppe from Salinas Grandes to the Atlantic is Mapuche pasture. Ranchers, herders, and settler-Reche move freely across the pampas, and the cordillera is no longer the federation's frontier — it is its spine."

 # ===== Destiny Events =====
 nd_map.6.t: "The Great Project"
 nd_map.6.d: "On the field of Wallmapu, the kultrun has been struck for the long road. The federation has chosen its century. The lonkos and tokis ride home from the council with the same word in their mouths: the work begins now."
 nd_map.6.a: "The federation has chosen its road."

 nd_map.7.t: "A Permanent Calendar"
 nd_map.7.d: "The annual Parlamentos at Tapihue and Negrete — once gatherings of renegotiation between Spanish governor and Mapuche lonko — are now sessions of a federal legislature. The calendar is fixed. The lonkos meet not when the huinca calls, but when the Reche calls. The Parlamento has become a senate."
 nd_map.7.a: "Let the senate sit."

 nd_map.8.t: "The Free Republic Declared"
 nd_map.8.d: "The federation declares itself a republic of the Reche — a polity of free men. The question is what kind of republic it shall be: a Lonko Senate of legislative chiefs, or a Machi Judiciary of spiritual jurists? Both are Mapuche. Neither has a precedent on the continent."
 nd_map.8.a: "The lonkos shall legislate."
 nd_map.8.b: "The machi shall judge."

 nd_map.9.t: "The Republic Recognized"
 nd_map.9.d: "Wallmapu has done what no Indigenous American nation has accomplished — it stands as a sovereign republic, recognized by the Atlantic powers. Now the question of its diplomatic posture: shall it look outward to the Atlantic capitals, or inward to a continental compact of free peoples?"
 nd_map.9.a: "Embassies to Madrid, London, and Paris."
 nd_map.9.b: "A continental compact of free peoples."

 nd_map.10.t: "The Toki Mapu Rides North"
 nd_map.10.d: "The horse-relays carry the call from the Pikumche frontier to the Aconcaguan ridges: the Toki Mapu has crossed the Maule. The boundary that held back Tupac Yupanqui in 1480 is now the federation's pivot, not its limit. The ridelines reach the sea at Valparaiso."
 nd_map.10.a: "The Maule is no longer a frontier."

 nd_map.11.t: "Beyond the Cordillera"
 nd_map.11.d: "The federation's columns have crossed the Andes — by the road the huinca built or by the boquetes the Pehuenche know. Cuyo bows, the Diaguita country opens, and the Mapuche have done what no Andean people achieved: they fight on both sides of the cordillera as one."
 nd_map.11.a: "Ride the conquistador's own road north."
 nd_map.11.b: "The Pehuenche shall hold every pass."

 nd_map.12.t: "Toki Apu of the Continent"
 nd_map.12.d: "The four butalmapu have become five, then seven. From Salta to the Tandil hills, from the cordillera spine to the Atlantic dunes, the federation's banner rides. The Toki Apu must now choose his style — the imperial war-leader of an acclaimed dominion, or the herd-king of a continental pampa-state?"
 nd_map.12.a: "Acclaim the imperial Toki Apu."
 nd_map.12.b: "Hold the pampa as the federation's heartland."

 # ===== Destiny Buildings =====
 nd_map_parlamento_permanente: "Parlamento Permanente"
 nd_map_parlamento_permanente_desc: "The perpetual republican assembly of the Reche. Where once the Parlamentos were summoned by Spanish governors at Quilín or Negrete, the federation now keeps a standing house — paper, ink, and elected lonkos in continuous session."
 nd_map_parlamento_maintenance: "Parlamento Upkeep"
 nd_map_parlamento_maintenance_desc: "Paper for the legislative record, fine cloth for the lonkos' senatorial robes, furniture for the assembly hall, and tools for the scribes' presses."
 nd_map_toki_apu_hall: "Toki Apu Standing Hall"
 nd_map_toki_apu_hall_desc: "The imperial Toki's permanent seat — not a campaign-tent struck after the war, but a standing hall of the war-leader of all lands. Konas mount guard, lonkos pay tribute, and the lances are racked along the walls."
 nd_map_toki_apu_maintenance: "Standing Hall Upkeep"
 nd_map_toki_apu_maintenance_desc: "Weaponry for the konas' arsenal, horses for the relay-stables, livestock for the imperial table, and lumber for the ever-extended hall."

 # ===== BUREAUCRACIES =====
 AUTO_MODIFIER_NAME_nd_map_bureaucracy_authority: "Wallmapu Federal Authority"
 AUTO_MODIFIER_DESC_nd_map_bureaucracy_authority: "The Aillarewe federations of Wallmapu have proclaimed the federation, and four institutional councils stand ready to be raised into permanent organs: the Toki Apu war-assembly, the Aillarewe regional federation, the Machi sisterhood of trance-judges, and (after Quilin) the Parlamento General. Two slots open alongside the capital's implicit slot, allowing three of the four to be entrenched while the fourth remains an emergency convocation in the federation's older custom."

 map_toki_apu_council_bureaucracy: "Toki Apu Council"
 map_toki_apu_council_bureaucracy_desc: "The war-leader assembly. In ordinary times each lof answered to its lonko and each rewe to its council; only when the Aillarewe convened to wage a campaign did they elect a Toki -- the axe-bearer -- and only when several Aillarewe federated did they raise a Toki Apu of all war-bands. Lautaro held this rank against Valdivia at Tucapel; Pelantaru against Onez de Loyola at Curalaba. Institutionalizing the council gives the federation a single mobilizing fist at the cost of unsettling the great-house ulmen, who prefer their own rewe to the axe-bearer's writ."

 map_aillarewe_federation_bureaucracy: "Aillarewe Federation"
 map_aillarewe_federation_bureaucracy_desc: "The nine-rewe regional confederacy that is the institutional spine of Wallmapu. Each Aillarewe -- Pikunche, Wenteche, Nagche, Lafkenche, Pewenche, Wulluche -- was a permanent federation of nine councils that pooled disputes, organized winter ngillatun ceremonies, and kept the boundary-rolls between lineages. Confederation business was conducted by ulmen seated at the rewe-stone, never by a central court. Raising the Aillarewe to a standing institution preserves the local autonomy of the lof at the price of any aspiration to a centralized Toki Mapu."

 map_machi_sisterhood_bureaucracy: "Machi Sisterhood"
 map_machi_sisterhood_bureaucracy_desc: "The order of female and machi-weye two-spirit shamans who served as healers, judges, and chroniclers of the lineages. The machi presided over the ngillatun-rewe fertility rites, interrogated suspected wekufu sorcerers at the kalku-trials, and kept the genealogies that the lineages needed to argue land claims. Their authority sits outside the warrior hierarchy: ulmen fear the kalku-trial, lonkos defer to the trance-ceremony. Maintained, the order knits the federation in shared ritual; neglected, it turns predatory, denouncing rivals under trance-accusation."

 map_parlamento_general_bureaucracy: "Parlamento General"
 map_parlamento_general_bureaucracy_desc: "The formal council that the Spanish governors of Chile were forced to convene with the lonkos of the Aillarewe -- at Quilin in 1641, then at Negrete, Tapihue, and elsewhere across the seventeenth and eighteenth centuries. After the Curalaba defeat the Crown of Castile acknowledged the federation as a sovereign counterparty; the Parlamentos issued bilingual treaty texts, set the Bio-Bio frontier, exchanged captives, and arbitrated cross-frontier trade. It is the only Indigenous-American institution recognized in the Atlantic diplomatic system before the eighteenth century -- and the only Mapuche institution that the older rewe-lineages regard with suspicion, as the seat where their autonomy is bargained away."
 STATIC_MODIFIER_NAME_nd_map_toki_federation: "Toki Council Federation"
 STATIC_MODIFIER_DESC_nd_map_toki_federation: "The Wallmapu's federal governance: Aillarewes of nine Lof clans, each represented by a Lonko peace-chief; a Toki war-chief elected only when the federation rides in arms; the Coyaqtun parliament-assembly binding the federation in council. There is no hereditary king. The Wallmapu is a federation of kindreds, not a kingdom in chief's robes."
