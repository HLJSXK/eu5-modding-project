l_english:
 nd_hos_formed_tt: "The Order of Saint John has been refounded"
 nd_hos_path_a_tt: "Chose the #bold Crusading Order#! destiny"
 nd_hos_path_b_tt: "Chose the #bold Hospitalier Realm#! destiny"
 STATIC_MODIFIER_NAME_nd_hos_crusading_order: "Crusading Order"
 STATIC_MODIFIER_DESC_nd_hos_crusading_order: "The Order remains a militant brotherhood. Every brother knight wears the eight-pointed cross to war. Galleys patrol the sea-lanes against the corsairs of Algiers and Tripoli, and the Convent's discipline is the discipline of holy war."
 STATIC_MODIFIER_NAME_nd_hos_hospitalier_realm: "Hospitalier Realm"
 STATIC_MODIFIER_DESC_nd_hos_hospitalier_realm: "The Order rules a sovereign Mediterranean state. Maltese harbors hum with corso prizes and pilgrim ships. The Sacra Infermeria draws the sick of half a continent. The eight tongues meet in council, and the Convent's writ runs as far as its galleys can sail."
 nd_hos.1.t: "The Convent of the Eight-Pointed Cross"
 nd_hos.1.d: "The Sovereign Order of the Hospital of Saint John of Jerusalem has refounded itself. The brothers who lost Acre, who were driven from Rhodes, who saw the langues scattered across Catholic Europe — they have raised the white cross above the harbor walls once more.\n\nThe question is what the Order shall be. Some among the langues argue that nothing has changed: the brothers took monastic vows to fight the infidel, and the galleys must sail until the Mediterranean is Christian. Others see a different Order — sovereign in its own right, lord of a Mediterranean island state, hospitalier to all of Christendom, drawing wealth from the corso and care from the Sacra Infermeria. The Convent must choose its character.\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_hos.1.a: "We are the sword of Christendom. The galleys never rest"
 nd_hos.1.b: "We are an island realm. Hospital, harbor, and council guide us"
 STATIC_MODIFIER_NAME_nd_hos_galley_squadron: "Galley Squadron of the Order"
 STATIC_MODIFIER_DESC_nd_hos_galley_squadron: "The Convent's galleys sail in disciplined squadrons under the Captain-General. Knight officers and Maltese crews drilled in boarding tactics; every prow carries the eight-pointed cross."
 nd_hos.2.t: "Squadron of the Order"
 nd_hos.2.d: "Three galleys: the slim Hospitaller war-galley with its overhanging spur, the long oar-banks driven by free Maltese rowers, and the carved stern bearing the white cross of Saint John. From the Bay of Birgu the Convent's squadron sails out under the Captain-General — past Saint Elmo, past Gozo, into the open sea where Ottoman and Algerian shipping plies.\n\nFrom the Rhodes period through the era of Romegas, the Order's galleys earned a reputation no other Mediterranean fleet could match. They did not need numbers; they needed boldness. Hospitaller captains hunted prizes along the Barbary Coast, raided the Aegean, and carried the war into the Ottoman lake. The squadron was small. Its reputation was vast."
 nd_hos.2.a: "Captain-General, the squadron is yours"
 STATIC_MODIFIER_NAME_nd_hos_council_of_langues: "Council of the Langues"
 STATIC_MODIFIER_DESC_nd_hos_council_of_langues: "The eight tongues confer in the Sacred Council. Provence, Auvergne, France, Italy, Aragon, Castile, Germany, England — each langue sends its Pilier, and the Order is governed by a multinational confederation."
 STATIC_MODIFIER_NAME_nd_hos_grand_master_supremacy: "Grand Master Supremacy"
 STATIC_MODIFIER_DESC_nd_hos_grand_master_supremacy: "The Grand Master rules as a sovereign prince. The Sacred Council advises, but the Magistral Palace decides. The langues serve at the Master's pleasure, and the Order's writ is unified."
 nd_hos.3.t: "The Eight Tongues"
 nd_hos.3.d: "Each langue has its auberge — a long stone hostel where its brothers lodge, dine, and conduct administrative business under their Pilier. From the Auberge de Castille on the heights of Valletta to the Auberge d'Auvergne by the Forni quarters, the eight tongues divide the work of the Convent.\n\nProvence holds the office of Grand Commander. France holds the Hospitaller of the Sick. Italy holds the Admiral. Castile holds the Chancellor. Aragon, Auvergne, Germany, and England each fill their roles in turn. It is a system without precedent in Catholic Europe: a multinational federal religious-military order. But the system has its strain. Should the Master rule absolutely, or should the langues balance him?"
 nd_hos.3.a: "Let the Sacred Council govern. The langues are the Order"
 nd_hos.3.b: "The Grand Master is sovereign. One head, one Order"
 STATIC_MODIFIER_NAME_nd_hos_silver_plate_medicine: "Silver Plate Medicine"
 STATIC_MODIFIER_DESC_nd_hos_silver_plate_medicine: "Patients in the Sacra Infermeria are served on silver plate to inhibit the spread of contagion. Wounds are dressed with honey. Wards are separated by disease. The Order's hygiene is generations ahead of its time."
 STATIC_MODIFIER_NAME_nd_hos_school_of_anatomy: "School of Anatomy"
 STATIC_MODIFIER_DESC_nd_hos_school_of_anatomy: "The Sacra Infermeria has opened a school of anatomy, surgery, and pharmacy. Physicians come from across Catholic Europe to learn the modern art of healing in the wards of the Order."
 nd_hos.4.t: "The Sacra Infermeria"
 nd_hos.4.d: "Built in 1574 along the harbor walls of Valletta, the Sacra Infermeria is the largest hospital in Christendom. Its great ward — over 150 paces long — accommodates 900 patients in beds that line both walls under a vast open vault. The Order's brothers attend the sick personally; this is the Order's founding mission, older than the war against the infidel.\n\nThe innovations astonish visitors. Patients eat from silver plate, because silver inhibits whatever invisible miasma carries disease. Wounds are dressed with honey. Each ward is reserved for one type of illness, separating contagion. By the seventeenth century the Infermeria has become the most advanced hospital in Europe, and physicians come from Paris, Bologna, Salamanca, and Vienna to study its practices.\n\nThe Order must decide where to invest. Should the wards expand the modern hygienic practice, or should the Infermeria become a school where physicians are trained?"
 nd_hos.4.a: "Silver plates and honey-dressings. The wards are sacred"
 nd_hos.4.b: "Found a school of anatomy. Train Christendom's physicians"
 STATIC_MODIFIER_NAME_nd_hos_licensed_corso: "Licensed Corso"
 STATIC_MODIFIER_DESC_nd_hos_licensed_corso: "The Tribunale degli Armamenti issues commissions to corsair captains under the Order's flag. Prize income is regulated, the Grand Master takes his share, and Maltese harbors fill with captured cargo."
 STATIC_MODIFIER_NAME_nd_hos_unlicensed_corso: "Unlicensed Corso"
 STATIC_MODIFIER_DESC_nd_hos_unlicensed_corso: "The Tribunale's writ is ignored. Maltese harbors fill faster with captured cargo and the Convent's treasury swells, but Greek and Venetian merchant houses lodge fierce protests in every Catholic court. The Order's name is stained across Christendom."
 nd_hos.5.t: "Tribunale degli Armamenti"
 nd_hos.5.d: "In 1605 the Grand Master establishes a tribunal of five commissioners — the Tribunale degli Armamenti — to bring order to the corso. Privateers operating from Maltese harbors must now be licensed by the tribunal, fly the Order's flag, attack only Muslim shipping, and respect safe-conduct passes issued by Christian princes.\n\nThe corso transforms from informal raiding into a regulated commerce of war. Prize cargoes are condemned by the tribunal, captives are ransomed, and the Order's treasury takes a defined share. Captains from Provence, Sicily, Catalonia, and Malta itself sail under Hospitaller commission.\n\nBut the Sacred Council is divided. The wealthier captains argue against the tribunal's restrictions: a Greek hull carrying Ottoman cargo, a Venetian galleass running the blockade with Aleppine silk, a Ragusan trader supplying the Sublime Porte — all should be fair prize, regardless of the safe-conduct in their lockers. Let the patents go out unrestricted, they say, and watch the Convent's vaults fill twice as fast. The Latin chancellors warn what such a policy will cost in the harbours of Christendom."
 nd_hos.5.a: "Issue the patents. The corso is regulated"
 nd_hos.5.b: "Loose the patents. Every infidel-touching cargo is fair prize"
 STATIC_MODIFIER_NAME_nd_hos_bulwark_of_christendom: "Bulwark of Christendom"
 STATIC_MODIFIER_DESC_nd_hos_bulwark_of_christendom: "The Order's bastions stand as Christendom's southern wall. The garrison drills daily, the redoubts are stocked, and the Convent has reaffirmed before all Catholic Europe that the Hospitaller cross will not yield."
 STATIC_MODIFIER_NAME_nd_hos_engineers_of_the_trace: "Engineers of the Trace"
 STATIC_MODIFIER_DESC_nd_hos_engineers_of_the_trace: "The Order has institutionalized military engineering. Italian trace specialists, Maltese masons, and knight officers train together. The bastions of Valletta become a school for fortification across Catholic Europe."
 nd_hos.6.t: "The Bastions Hold"
 nd_hos.6.d: "The Great Siege of 1565 lasted four months. Six hundred knights and six thousand men-at-arms held against forty thousand Ottoman troops under Mustapha Pasha and Piali. Fort Saint Elmo fell after thirty-one days of bombardment. Fort Saint Angelo did not fall. Senglea did not fall. La Valette refused every parley and fought from the walls beside his brothers.\n\nThe siege was lifted in September. The Ottoman army withdrew, broken. The Order survived, and so did Catholic Mediterranean Europe. In the years that followed, the Maltese fortifications were redoubled: Italian engineer Francesco Laparelli laid out the city of Valletta as a fortified peninsula. The trace italienne, perfected on Maltese rock, became a school of military engineering studied across Catholic Europe.\n\nThe Order must decide how to use this reputation: as a bulwark to defend, or as a school to teach."
 nd_hos.6.a: "We are the wall of Christendom. None shall pass"
 nd_hos.6.b: "Train the engineers. The bastion is a school"
 STATIC_MODIFIER_NAME_nd_hos_constitution_of_the_order: "Constitution of the Order"
 STATIC_MODIFIER_DESC_nd_hos_constitution_of_the_order: "The Codice del Ordine is promulgated. Every brother's right and duty is written. The Sacred Council, the Master's authority, the langues' privileges — all are codified into a constitution that holds the Convent together."
 nd_hos.7.t: "Codice del Ordine"
 nd_hos.7.d: "Under Grand Master Hugues Loubenx de Verdalle, the Order codifies its accumulated statutes, customs, and council decrees into a single Codice — the constitution of the Sovereign Military Hospitaller Order. Every right of every brother, every privilege of every langue, every duty of every officer, is now written in a single book.\n\nThe codification settles disputes that had simmered for generations. The Master's authority is defined; so are its limits. The langues' rights are secured; so are their obligations. The Convent's revenues — responsions, prize money, hospital funds, commandery rents — are accounted for. From this moment, the Order has a written constitution, and the multinational confederation governs itself by law rather than by improvisation."
 nd_hos.7.a: "The Codice is law. Let the Order be governed thus"
 nd_hos_hospitalier_tradition: "Hospitalier Tradition"
 nd_hos_hospitalier_tradition_desc: "The Order's founding mission: care for the sick before all else. The hospital came before the sword."
 nd_hos_knights_hospitaller: "Knights Hospitaller"
 nd_hos_knights_hospitaller_desc: "Sworn brother knights of the Convent, bound by vows of poverty, chastity, and obedience. Disciplined heavy infantry of the Order."
 nd_hos_squadron_of_the_order: "Squadron of the Order"
 nd_hos_squadron_of_the_order_desc: "The slim Hospitaller war-galley, the Order's signature weapon at sea. Designed for ramming and boarding, crewed by knight officers and Mediterranean sailors."
 nd_hos_order_commandery: "Order's Commandery"
 nd_hos_order_commandery_desc: "The fortified preceptory: barracks, treasury, and chapel of the langue. The local seat of the Order across Catholic Europe."
 nd_hos_langues_system: "Langues System"
 nd_hos_langues_system_desc: "The Order is divided into eight tongues — Provence, Auvergne, France, Italy, Aragon, Castile, Germany, England — each with its own auberge, Pilier, and office of state."
 nd_hos_statutes_of_rhodes: "Statutes of Rhodes"
 nd_hos_statutes_of_rhodes_desc: "The Order's first written codification of customs and rules under Grand Master Roger de Pins. The constitutional spine of a sovereign religious order."
 nd_hos_mediterranean_galley_tactics: "Mediterranean Galley Tactics"
 nd_hos_mediterranean_galley_tactics_desc: "Oar-and-sail tactics perfected against Ottoman fleets. The slim Hospitaller galley specialized in boarding and ramming, with discipline that no merchant fleet could match."
 nd_hos_apothecary_of_the_order: "Apothecary of the Order"
 nd_hos_apothecary_of_the_order_desc: "The Order's medicinal workshops, distilling theriac and balms from cultivated herbs. Hospitaller medicaments are exported across Catholic Europe."
 nd_hos_maltese_bastions: "Maltese Bastions"
 nd_hos_maltese_bastions_desc: "The bastioned trace italienne adapted to Mediterranean rock. Forts Saint Angelo and Saint Elmo guard the harbor, and Valletta itself is a fortified peninsula."
 nd_hos_sacra_infermeria: "Sacra Infermeria"
 nd_hos_sacra_infermeria_desc: "The great hospital of Valletta. Pioneered modern hygiene with silver plates, honey wound dressings, and disease-separated wards. The most advanced hospital in Christendom."
 nd_hos_corso_privateering: "Corso Privateering"
 nd_hos_corso_privateering_desc: "State-licensed corsair warfare against Ottoman and Barbary shipping. Maltese captains sail under the Order's flag, sharing prize money with the Treasury."
 nd_hos_tongues_treasury: "Tongues' Treasury"
 nd_hos_tongues_treasury_desc: "Each langue remits a share of European commandery income — the responsions — to the Convent. The Order's wealth is pooled from a Catholic continent."
 nd_hos_great_siege_veterans: "Great Siege Veterans"
 nd_hos_great_siege_veterans_desc: "The spirit of 1565 institutionalized: garrison troops drilled in fortress assault defense, blending Spanish tercio discipline with the Order's siege experience."
 nd_hos_tribunale_armamenti: "Tribunale degli Armamenti"
 nd_hos_tribunale_armamenti_desc: "The prize court of the corso. Five commissioners license corsair captains, set rules of engagement, and apportion prize income to the Order's treasury."
 nd_hos_capitana_galley: "Maltese Squadron Capitana"
 nd_hos_capitana_galley_desc: "The Sacra Capitana — the admiral's galley. Carved sterns, gilded prows, and the most experienced knight crew in the Order."
 nd_hos_valletta_arsenal: "Valletta Arsenal"
 nd_hos_valletta_arsenal_desc: "The Order's shipyards on the Grand Harbour. Galleys, supply carracks, and later sailing frigates, built and refitted in continuous rotation."
 nd_hos_codice_del_ordine: "Codice del Ordine"
 nd_hos_codice_del_ordine_desc: "The Order's comprehensive law-code. Every brother's right, every langue's privilege, every officer's duty, written into a single constitution."
 nd_hos_frigate_squadron: "Frigate Squadron of the Order"
 nd_hos_frigate_squadron_desc: "As galleys faded, the Order built sailing frigates to keep its Mediterranean police role. Faster and lighter than ships of the line, designed for corsair-hunting."
 nd_hos_school_of_anatomy_advance: "School of Anatomy and Surgery"
 nd_hos_school_of_anatomy_advance_desc: "Established at the Sacra Infermeria in 1676, training physicians from across Catholic Europe in the most modern surgical and pharmaceutical practice of the age."
 nd_hos_hospitaller_customs: "Hospitaller Customs"
 nd_hos_hospitaller_customs_desc: "Malta as Mediterranean quarantine station. The Lazaretto and Customs House extract reliable income from passing trade while keeping disease out of the harbors."
 nd_hos_mediterranean_quarantine: "Mediterranean Quarantine"
 nd_hos_mediterranean_quarantine_desc: "Malta sets the standards for European maritime quarantine. The Lazaretto system at its zenith, regulating the movement of ships, crews, and cargoes across the inland sea."
 nd_hos_order_reformed: "The Order Reformed"
 nd_hos_order_reformed_desc: "The constitutional reforms of Grand Masters Pinto and Rohan modernize the langues, regularize the central administration, and prepare the Order for an enlightened age."
 nd_hos_late_corso: "Late Corso"
 nd_hos_late_corso_desc: "The Order's anti-piracy mission preserved into the revolutionary era. Maltese frigates patrol the Mediterranean trade lanes, hunting Algerian and Tripolitan corsairs."
 nd_hos_maltese_free_port: "Maltese Free Port"
 nd_hos_maltese_free_port_desc: "Malta opens to international commerce. The harbor becomes a Mediterranean entrepot for British, French, Levantine, and Italian trade in the late eighteenth century."
 nd_hos_magistral_library: "Magistral Library"
 nd_hos_magistral_library_desc: "The Order's archive and scholarly library at Valletta. Knight-archivists catalogue langue records, charts, and medical treatises in a scholarly institution that rivals Italian university libraries."
 nd_hos_magistral_library_building: "Magistral Library"
 nd_hos_magistral_library_building_desc: "The Order's archive and scholarly library: knight-archivists catalogue correspondence, langue records, charts, and medical treatises."
 nd_hos_magistral_library_maintenance: "Archive and Scriptorium"
 nd_hos_magistral_library_maintenance_desc: "Paper, books, furniture, and beeswax kept on hand. The archivists curate the documentary memory of the Order across eight tongues."
 a_nd_hos_knights: "Knights Hospitaller"
 a_nd_hos_knights_desc: "Sworn brother knights of the Convent — heavy infantry knight-monks, the combat brothers of the Order. Bound by monastic vows; disciplined where common levies break."
 a_nd_hos_tercio: "Tercio of the Order"
 a_nd_hos_tercio_desc: "Veteran heavy infantry combining Spanish tercio drill with the Order's discipline. Drawn from the soldiers who held the bastions of 1565 and their successors."
 n_nd_hos_galley: "Order's Galley"
 n_nd_hos_galley_desc: "The slim Hospitaller war-galley with its overhanging spur. Designed to ram and board Ottoman and Barbary shipping in close engagements."
 n_nd_hos_capitana: "Sacra Capitana"
 n_nd_hos_capitana_desc: "The Grand Master's flagship galley. Carved stern, gilded prow, the eight-pointed cross of Saint John on every banner. The most heavily armed galley in the Mediterranean."
 n_nd_hos_frigate: "Maltese Frigate"
 n_nd_hos_frigate_desc: "The late-period Hospitaller sailing warship. Built at the Valletta arsenal for Mediterranean corsair-hunting: faster than a ship of the line, with a fraction of the weight."
 nd_hos_commandery: "Order's Commandery"
 nd_hos_commandery_desc: "The fortified preceptory of a langue: barracks, treasury, and chapel combined under a knight-commander's authority."
 nd_hos_commandery_maintenance: "Order's Drill"
 nd_hos_commandery_maintenance_desc: "The brothers train daily; the chapel is maintained; the commandery's stores are kept full."
 nd_hos_auberge: "Auberge of the Tongues"
 nd_hos_auberge_desc: "The administrative-residential building of a langue. Each tongue maintains its own auberge — hostel for visiting brothers, language office, and regional administration center."
 nd_hos_auberge_maintenance: "Auberge Council"
 nd_hos_auberge_maintenance_desc: "Brothers gather under the Pilier of the langue; correspondence is dispatched across the langue's homeland; the records of the tongue are kept."
 nd_hos_apothecary: "Apothecary of the Order"
 nd_hos_apothecary_desc: "The Order's medicinal workshop. Cultivates herbs, distills theriac and balms, and exports Hospitaller medicaments across Catholic Europe."
 nd_hos_apothecary_production: "Theriac Compounding"
 nd_hos_apothecary_production_desc: "The Order's signature medicinal compound, prepared from a mixture of beeswax, fiber crops, and wine — exported under the seal of the eight-pointed cross."
 nd_hos_infermeria: "Sacra Infermeria"
 nd_hos_infermeria_desc: "The great hospital of Valletta. Silver plates, honey wound-dressings, disease-separated wards, and a school of anatomy. The most advanced hospital in Christendom."
 nd_hos_infermeria_maintenance: "Hospital of Saint John"
 nd_hos_infermeria_maintenance_desc: "The brothers attend the sick. The wards are kept hygienic by the Order's standards: silver plates, honey-dressings, separated wards. Pharmacy and laundry run continuously."
 nd_hos_star_fortifications: "Star Fortifications of the Order"
 nd_hos_star_fortifications_desc: "Bastioned harbor defenses adapted from the Italian trace. Forts Saint Angelo and Saint Elmo, the Senglea bastions, and the Valletta peninsula's curtain walls."
 nd_hos_fortifications_maintenance: "Garrison and Stores"
 nd_hos_fortifications_maintenance_desc: "Powder, shot, and rations for the bastion garrison. Walls patched after every storm; ditches kept clear; cannons kept oiled."
 nd_hos_arsenal: "Valletta Arsenal"
 nd_hos_arsenal_desc: "The Order's shipyards on the Grand Harbour. Galley docks, supply yards, and later frigate slips line the inlets between Birgu and Senglea."
 nd_hos_arsenal_maintenance: "Arsenal Yards"
 nd_hos_arsenal_maintenance_desc: "Lumber stocked, tar boiled, naval stores maintained, knight captains and Maltese shipwrights kept on retainer."
 nd_hos_lazaretto: "Lazaretto and Customs"
 nd_hos_lazaretto_desc: "The maritime quarantine station and customs house. Visiting ships and crews wait in the Lazaretto before disembarking, providing customs revenue and disease control."
 nd_hos_lazaretto_maintenance: "Quarantine Roster"
 nd_hos_lazaretto_maintenance_desc: "Ledgers, chits, and quarantine certificates kept; medicaments and clean linen rotated through the wards; the Customs Master records every cargo."
 nd_hos_destiny: "The Convent's Project"
 nd_hos_destiny_desc: "The Order has refounded itself. Now the Convent must decide what kind of state it shall become — a militant Mediterranean imperium projecting force from sea to sea, or a sovereign island realm whose harbors are the legal, mercantile, and medical pivot of the Catholic Mediterranean."
 nd_hos_dest_levant_reclaimed: "Reclaim the Levantine Coast"
 nd_hos_dest_levant_reclaimed_desc: "Plant the eight-pointed cross again at Acre and Tripoli — the Order's lost homes from the days of the Crusader Kingdoms. Field a standing army of thirty regiments to project force from the Holy Land coast."
 nd_hos_dest_ottoman_lake_broken: "Break the Ottoman Lake"
 nd_hos_dest_ottoman_lake_broken_desc: "Take Smyrna and Alexandria, the great Ottoman naval and supply ports of the eastern Mediterranean. Build prestige and field fifty regiments. The Mediterranean must cease to be a Turkish lake."
 nd_hos_dest_mare_nostrum: "Mare Nostrum"
 nd_hos_dest_mare_nostrum_desc: "The capstone of the militant project: Constantinople, Tunis, Beirut — north shore, south shore, east shore. The Mediterranean is the Order's lake, and the Grand Magistery rises above the Convent's harbor."
 nd_hos_dest_lazaretto_network: "The Lazaretto Network"
 nd_hos_dest_lazaretto_network_desc: "Embrace banking and accumulate one thousand ducats. Bring the Levantine silk trade through Maltese harbors. Malta becomes a clearing-house for trade and quarantine in the Catholic Mediterranean."
 nd_hos_dest_continental_authority: "Continental Health Authority"
 nd_hos_dest_continental_authority_desc: "Embrace the printing press, raise prestige, accumulate two thousand ducats, and pull the fine-cloth trade through Maltese customs. Disseminate Hospitaller medical practice and quarantine standards across Catholic Europe."
 nd_hos_dest_sacra_maxima: "Sacra Infermeria Maxima"
 nd_hos_dest_sacra_maxima_desc: "The capstone of the mercantile-medical project: embrace manufactories, accumulate three thousand ducats, win prestige, and bring the silver trade through the Convent's harbor. The Lazaretto Imperial rises along the Grand Harbour as the legal and sanitary pivot of the inland sea."
 nd_hos.8.t: "The Convent's Long Road"
 nd_hos.8.d: "The Sacred Council has chosen the Order's project. Whether the eight-pointed cross sails out at the prow of an imperial galley or rises above the Lazaretto's quarantine wards, the Convent's road is set. The brothers know what they must build — and the langues turn their commanderies to the work.\n\nA destiny path has opened in the Traditions tab. The Convent will know whether it has fulfilled its project."
 nd_hos.8.a: "Let the work begin"
 nd_hos.9.t: "Acre and Tripoli Restored"
 nd_hos.9.d: "Galleys spill knights and tercio onto the Levantine sands once again. Acre's old harbor — where the Order made its last stand in 1291 — is held by Hospitaller troops, and the eight-pointed cross flies above its walls for the first time in over a hundred years. Tripoli falls in the season after, its citadel reduced by Maltese cannon and held by knights in white surcoat.\n\nThe Convent has done what no Catholic prince since Saint Louis has done. The Holy Land coast is partly reclaimed, and the Order has its old strategic depth back: a Levantine bridgehead from which to project force into the Ottoman heart."
 nd_hos.9.a: "The brothers stand on Levantine ground again"
 nd_hos.10.t: "The Ottoman Lake Is Broken"
 nd_hos.10.d: "Smyrna's harbor — long the chief Ottoman naval base on the Aegean — is taken by Hospitaller squadrons. Alexandria, the great Egyptian port, falls in a combined-arms operation: galleys closing the harbor entrance while tercio land east of Pharos. Two of the Sultan's most important Mediterranean ports now answer to the Convent.\n\nThe Convent must decide how to use this victory. Some captains want the squadron driven into Ottoman waters in decisive engagement, hunting their fleets to destruction in the Romegas tradition. Others argue for a sustained Mediterranean patrol — galley squadrons rotating endlessly along every coast, choking trade and asserting Hospitaller presence as a permanent fact of the inland sea."
 nd_hos.10.a: "Drive the squadron into the Ottoman fleet. Engage and destroy"
 nd_hos.10.b: "Patrol the sea-lanes endlessly. Be everywhere at once"
 nd_hos.11.t: "Mare Nostrum"
 nd_hos.11.d: "Constantinople under Hospitaller cannon. Tunis taken from the Barbary corsairs. Beirut and the Levantine ports flying the eight-pointed cross. The Mediterranean — the inland sea of antique empires, the Ottoman lake of the past century — has become the Order's domain in fact as well as name. Brother knights lord over harbors from the Hellespont to the Pillars of Hercules.\n\nThe Grand Magistery rises in the harbor of Valletta, a Magistral Palace fit for a Mediterranean imperium: chambers of state, naval council, langue chancery, throne hall for envoys of half a world. The Convent must decide its character at this height: an Imperial Bulwark guarding every reclaimed shore with fortress and garrison, or a Pax Hospitalleria of patrol fleets keeping the inland sea pacified by attrition rather than walls."
 nd_hos.11.a: "Garrison every shore. We are the Bulwark"
 nd_hos.11.b: "Patrol every sea-lane. We are the peace itself"
 nd_hos.12.t: "Banking and the Lazaretto"
 nd_hos.12.d: "Maltese banking houses settle the accounts of Levantine silk merchants whose ships put in at the Grand Harbour. Brother-bankers count Genoese florins, Venetian ducats, Aleppine sequins, French ecus. The Convent's vaults swell with Mediterranean silver, and the Lazaretto roster fills with quarantined captains waiting for clean papers.\n\nThe banking institution and the silk trade have made Malta a Mediterranean clearing-house. Visiting merchants pay customs on entry, settle their cross-account at the Maltese bank, take their quarantine certificate, and sail with the Order's seal endorsing them in every Catholic harbor."
 nd_hos.12.a: "The Convent has its commercial state"
 nd_hos.13.t: "The Quarantine Becomes Imperial"
 nd_hos.13.d: "Hospitaller quarantine certificates are honored in Genoa, Marseille, Barcelona, Naples, Ragusa. The Order's printers run continuous editions of the Maltese Sanitary Manual, distributed to every Catholic port. Fine-cloth merchants from Florence and Lyon route through Malta because of the discount on insurance offered by an Order-sealed cargo.\n\nThe Convent must decide how to extend this authority. The Lazaretto wing argues for a continental Quarantine Network — fortified, capital-intensive Lazaretto stations at every harbor, with Maltese commissioners sitting in each. The Customs wing argues for an Imperial Customs House — Maltese officers stationed in every Catholic harbor collecting fees on every cargo, the Order as the Mediterranean's commercial chancery."
 nd_hos.13.a: "Build the Lazaretto network. The harbors quarantine together"
 nd_hos.13.b: "Build the customs houses. The Order chancers all trade"
 nd_hos.14.t: "Sacra Infermeria Maxima"
 nd_hos.14.d: "Manufactories along the Grand Harbour. Silver from across the Catholic world settling in Maltese bank-vaults. The Lazaretto Imperial — three storeys of quarantine wards, customs offices, and Apothecary chambers — open above the harbor walls. Pilgrims from Spain, merchants from Hamburg, physicians from Padua, all passing through the Convent's halls.\n\nThe Order is no longer merely a sovereign island state. It is the legal, sanitary, and commercial pivot of the Mediterranean. Now the Convent must give the project its final character: a Universal Pharmacopeia making Maltese medicaments and naval-supply standards continental, or a Council of Lazarettos chairing a federation of quarantine stations across half a world."
 nd_hos.14.a: "The Pharmacopeia is the Order's gift to Christendom"
 nd_hos.14.b: "The Council of Lazarettos. Federate the harbors of the world"
 STATIC_MODIFIER_NAME_nd_hos_dest_decisive_engagement: "Decisive Engagement"
 STATIC_MODIFIER_DESC_nd_hos_dest_decisive_engagement: "The squadron sails into the Ottoman fleet. The Order's galleys ram, board, and capture in the tradition of Romegas; the Hospitaller flag returns to harbor with prizes in tow."
 STATIC_MODIFIER_NAME_nd_hos_dest_mediterranean_patrol: "Mediterranean Patrol"
 STATIC_MODIFIER_DESC_nd_hos_dest_mediterranean_patrol: "The Order's galleys rotate endlessly along every Mediterranean coast. The continuous deployment is glorious; the cost of paying crews and provisioning bases drives a small monetary inflation."
 STATIC_MODIFIER_NAME_nd_hos_dest_imperial_bulwark: "Imperial Bulwark"
 STATIC_MODIFIER_DESC_nd_hos_dest_imperial_bulwark: "Hospitaller fortresses rise at every reclaimed harbor. Garrisons stocked, walls patched, bastions extended. The Mediterranean is a chain of forts under the eight-pointed cross."
 STATIC_MODIFIER_NAME_nd_hos_dest_pax_hospitalleria: "Pax Hospitalleria"
 STATIC_MODIFIER_DESC_nd_hos_dest_pax_hospitalleria: "The inland sea is pacified by patrol rather than wall. Repair-yards open in every reclaimed harbor; ships return to sea quickly; attrition along the coasts is minimized by the Order's continuous logistics."
 STATIC_MODIFIER_NAME_nd_hos_dest_quarantine_network: "Mediterranean Quarantine Network"
 STATIC_MODIFIER_DESC_nd_hos_dest_quarantine_network: "Lazaretto stations at every Catholic harbor, with Maltese commissioners sitting in each. The Order's protection extends through trade-permit chits; the network of fortified stations is expensive to maintain."
 STATIC_MODIFIER_NAME_nd_hos_dest_customs_imperial: "Customs Imperial"
 STATIC_MODIFIER_DESC_nd_hos_dest_customs_imperial: "Maltese customs officers in every Catholic harbor; cargo fees flowing back to Valletta; transport galleys reduced in cost by the volume of trade. Reinforcement of distant land armies, however, suffers from the focus on commerce."
 STATIC_MODIFIER_NAME_nd_hos_dest_universal_pharmacopeia: "Universal Pharmacopeia"
 STATIC_MODIFIER_DESC_nd_hos_dest_universal_pharmacopeia: "Maltese medicaments, naval supplies, and burgher trade-pieces flow to half a continent. The Order is the medical and logistical backbone of Catholic Europe."
 STATIC_MODIFIER_NAME_nd_hos_dest_council_of_lazarettos: "Council of Lazarettos"
 STATIC_MODIFIER_DESC_nd_hos_dest_council_of_lazarettos: "The Order chairs a federation of Lazaretto stations across half a world. Population capacity rises from improved sanitation; trade flows freely through the Order's network; sailors trained at every member port enter Maltese service."
 nd_hos_grand_magistery: "Grand Magistery"
 nd_hos_grand_magistery_desc: "The Magistral Palace at its imperial height: Grand Master's chambers, naval council, langue chancery, and reception hall for envoys of the Mediterranean dominion."
 nd_hos_grand_magistery_maintenance: "Magistral Court"
 nd_hos_grand_magistery_maintenance_desc: "Paper for the chancery, fine cloth for the magistral household, furniture for the audience chambers, weaponry for the magistral guard."
 nd_hos_lazaretto_imperial: "Lazaretto Imperial"
 nd_hos_lazaretto_imperial_desc: "The Sacra Infermeria Maxima: continental health authority, customs clearing-house, and trade-permit chancery. Three storeys of wards, offices, and apothecary chambers above the Grand Harbour."
 nd_hos_lazaretto_imperial_maintenance: "Imperial Wards"
 nd_hos_lazaretto_imperial_maintenance_desc: "Medicaments cycled through the wards; paper for the trade-permit chancery; beeswax for the apothecaries; cloth for the quarantine roster."
 hos_council_of_tongues_bureaucracy: "Sacro Consiglio Compito"
 hos_council_of_tongues_bureaucracy_desc: "The Council of the Tongues — the Order's federal supreme council, constituted under the Statutes of Margat (1206) and Roger de Pins (1357). Each of the eight langues sits under its pilier (conventual bailiff): the Marshal of Provence, the Grand Commander of Auvergne, the Hospitaller of France, the Admiral of Italy, the Drapier of Aragon, the Grand Chancellor of Castile, the Grand Bailiff of Germany, and the Turcopolier of England. No pilier may be deposed by the Grand Master alone, and Council consent is required for war, alliance, and the levy of responsions from the priories."
 hos_tribunale_armamenti_bureaucracy: "Tribunale degli Armamenti"
 hos_tribunale_armamenti_bureaucracy_desc: "The Maritime Tribunal, established at Valletta in 1605 to license, regulate, and adjudicate the corso — the Order's state-licensed Mediterranean privateering campaign against Muslim shipping. The Tribunal issues patenti del corso under the magisterial seal, hears prize cases, and takes the decima (one tenth) for the Common Treasury and another tenth for the Grand Master. Its judges are drawn from the Italian and Spanish langues; investors are Maltese burghers, knights in command, and silent partners across the Catholic Mediterranean. Loosely held, the patenti are sold for Greek and Venetian prizes, and the Order's name is stained across Christendom."
 hos_sacra_infermeria_bureaucracy: "Sacra Infermeria"
 hos_sacra_infermeria_bureaucracy_desc: "The Holy Infirmary, the Order's defining religious institution. The Maltese Sacra Infermeria opened at Valletta in 1574 with a Great Ward 155 metres long, extended through the seventeenth century into one of the largest hospitals in Europe. The Statutes oblige every brother-knight to serve a turn at the patients' bedside in the servitio dei poveri; patients are addressed as Our Lords the Sick and dined off silver plate. The Infirmary pioneers standardized medical casebooks, anatomical surgery through its Anatomy Theatre, and systematic compounding of medicaments through the Apothecary. Patients of every faith are admitted without distinction."
 hos_comun_tesoro_bureaucracy: "Tribunale del Comun Tesoro"
 hos_comun_tesoro_bureaucracy_desc: "The Common Treasury Chamber, the Order's central fiscal institution. Each commandery in every European priory remits one-third of its annual revenue to the Treasury as the responsion. The Comun Tesoro audits these returns, collects the mortuaries (estates of deceased knights), and manages the Order's banking relations with the Genoese and the papal Curia. Its Receivers and Procurator General are appointed by the Grand Master and form the magisterial counterweight to the langue-based Council, binding the priories into magisterial fiscal authority through Lascaris's centralization (1636-1657) and Rohan's Codice del Ordine (1782)."
 AUTO_MODIFIER_NAME_nd_hos_bureaucracy_authority: "Magistral Authority"
 AUTO_MODIFIER_DESC_nd_hos_bureaucracy_authority: "The Sacred and Sovereign Council of the Order may institute up to three permanent bureaucratic offices, drawn from the Council of the Tongues, the Tribunale degli Armamenti, the Sacra Infermeria, and the Common Treasury — the four pillars of the Order's mature constitutional state."
 STATIC_MODIFIER_NAME_nd_hos_militant_brotherhood: "Sovereign Order of Saint John"
 STATIC_MODIFIER_DESC_nd_hos_militant_brotherhood: "The Convent's institutional core: brother-knights bound by monastic vows, the eight tongues confederated under the Grand Master, the Pope's military arm in temporal sovereignty. Clergy lead the Order's hosts in person; the fortress walls stand higher than any secular kingdom; the Convent's character drifts toward holy war by ancient custom. The Order cannot be converted away from Catholic faith. Vanilla military_order_reform may be activated formally via the Government tab to lock in the title."
