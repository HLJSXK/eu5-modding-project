l_english:
 YMP: "Yamato Empire"
 YMP_ADJ: "Imperial Japanese"
 YMP_f: "Yamato Empire"
 YMP_f_desc: "The dream Toyotomi Hideyoshi died chasing. In 1592 he hurled the samurai armies of unified Japan against Korea and on toward Ming China, intending nothing less than a Japanese-led empire over all East Asia; only his death in 1598 collapsed the campaign and gave Tokugawa his pretext for two and a half centuries of isolation. The Yamato Empire is the alternative: the bakufu refuses sakoku, the Imjin War succeeds, and the chrysanthemum throne extends from Hokkaido through Hanseong to the Yangtze. Japanese castles rise above Pyongyang, samurai become the imperial officer corps of a continental order, and the Mikado reigns over an East Asian empire built from Edo's ambition rather than Edo's seclusion."
