l_english:
 HOS: "Sovereign Order of Saint John"
 HOS_ADJ: "Hospitaller"
 HOS_f: "Sovereign Order of Saint John"
 HOS_f_desc: "Refound the Sovereign Military Hospitaller Order of Saint John of Jerusalem, the crusading brotherhood that lost the Holy Land yet endured. From their fortress on Rhodes — and later from Malta — the Knights of Saint John maintain the eight-pointed white cross as a sovereign Catholic order: a multinational brotherhood of langues, a fleet that hounds the corsairs of the Mediterranean, and a hospitalier tradition that founded the first true hospitals of Christendom."
