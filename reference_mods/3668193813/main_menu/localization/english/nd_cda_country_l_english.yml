l_english:
 CDA: "Aragonese Empire"
 CDA_ADJ: "Catalan-Aragonese"
 CDA_f: "Aragonese Empire"
 CDA_f_desc: "Forge the Catalan-Aragonese Mediterranean thalassocracy that briefly bound Iberia to Italy under a single sovereign — the alternative path of unification that ended when Castile absorbed Aragon in 1469. Restore the multi-kingdom personal union of Alfonso V the Magnanimous, holding the royal seats of Barcelona, Naples and Palermo, and ruling Aragon, Catalonia, Valencia, the Balearics, Sardinia, Sicily and the Mezzogiorno from a peripatetic court. A maritime mercantile empire of Catalan consulates, Almogavar mercenaries, the Consolat de Mar and the Senyera Reial — the Aragon that looked east across the sea instead of west toward Castile."
