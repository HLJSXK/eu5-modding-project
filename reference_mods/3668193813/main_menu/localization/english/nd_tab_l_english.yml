l_english:
 # ============================================================================
 # Formation event
 # ============================================================================
 nd_tab.1.t: "The Mount of Tabor"
 nd_tab.1.d: "On the chalk hilltop south of Prague, refugee peasants and burghers raise the brotherhood-republic. The chalice flies above the wagon laager. Five papal crusades have broken against Žižka's flails; the radical wing of the Hussite revolution has, against every expectation, won.\n\nNow the brotherhood must decide what kind of state it has built. The Tabor commune was always two movements at once: a millenarian peasant brotherhood preaching the imminent Kingdom of God, and an institutional republic of disciplined field armies under captains like Prokop the Great. Both wings refused the Compactata of Basel. Both rejected Roman authority. But the question they fought over for fifteen years remains: how radical should the chalice church be?\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_tab.1.a: "The Commune of Brethren — communal property and the chalice for all"
 nd_tab.1.b: "The Calixtine Realm — the disciplined Hussite republic of Prokop"

 # ============================================================================
 # Formation choice modifiers
 # ============================================================================
 STATIC_MODIFIER_NAME_nd_tab_commune_of_brethren: "Commune of Brethren"
 STATIC_MODIFIER_DESC_nd_tab_commune_of_brethren: "The radical Tabor wing prevails. Communal property, married priesthood, women combatants, Czech vernacular liturgy: the brotherhood is one flesh under the chalice. Manpower flows from the broad mobilization of every soul, but Christendom recoils from the heretic-republic on the Vltava."

 STATIC_MODIFIER_NAME_nd_tab_calixtine_compact: "Calixtine Compact"
 STATIC_MODIFIER_DESC_nd_tab_calixtine_compact: "Prokop the Great's institutional vision prevails. Chalice for all, but ordered Bohemian republican politics: nobles, burghers and field-army captains share governance under a strict elective discipline. The wagon armies are professional and the war-score against the crusaders is decisive — but the millenarian fire is banked."

 # ============================================================================
 # DHE event 2: war-wagon doctrine choice
 # ============================================================================
 nd_tab.2.t: "Vozová Hradba — The Wagon Wall"
 nd_tab.2.d: "Žižka's mobile fortress doctrine has changed European warfare. Ox-drawn wagons reinforced with iron plates, fitted with hand cannon, light artillery and crossbow loopholes; chained together they form a wagon-wall that breaks knightly cavalry charges and serves as the field army's nightly camp. Where the wagons go, the brotherhood goes.\n\nThe captains debate doctrine. Žižka's school treats the wagon as an offensive system: a moving fortress projected aggressively into enemy territory, supplied by raid and tribute. Prokop's school treats it as a defensive bastion: a wagon-fort the field army falls back into to grind any attacker against."
 nd_tab.2.a: "The Žižkovský way — the wagon as moving fortress"
 nd_tab.2.b: "The wagon as defensive bastion"

 STATIC_MODIFIER_NAME_nd_tab_zizka_doctrine: "Žižkovský Doctrine"
 STATIC_MODIFIER_DESC_nd_tab_zizka_doctrine: "The field army moves where the chalice flies. Aggressive wagon-fort doctrine: rapid concentration, deep raids, recruitment in stride."

 STATIC_MODIFIER_NAME_nd_tab_wagon_bastion: "Wagon Bastion"
 STATIC_MODIFIER_DESC_nd_tab_wagon_bastion: "The brotherhood's wagons are mobile fortresses. Crusader hosts grind themselves against the laager and march home in fragments."

 # ============================================================================
 # DHE event 3: Four Articles enforcement
 # ============================================================================
 nd_tab.3.t: "The Four Articles of Prague"
 nd_tab.3.d: "Free preaching of the word. Communion in both kinds — the chalice for the laity. Apostolic poverty of the clergy. Severe punishment of all open sins. The Four Articles, drafted in Prague in 1420 and fought for these many years, are now the constitution of the brotherhood.\n\nBut the Articles themselves can be read two ways. The strict reading binds every Christian to the brotherhood's discipline: blasphemy, fornication, simony, drunkenness — all answerable to the elective court. The tolerant reading prizes the chalice and the vernacular word above all; let the brethren preach freely and trust the Word to do its work."
 nd_tab.3.a: "Strict enforcement: open sins answerable to the brotherhood"
 nd_tab.3.b: "The chalice for all: vernacular preaching, tolerant discipline"

 STATIC_MODIFIER_NAME_nd_tab_articulus_strict: "Articulus Strict"
 STATIC_MODIFIER_DESC_nd_tab_articulus_strict: "The chalice church enforces apostolic discipline. Confessional uniformity is rapid; popular dissent is rare; the brethren walk soberly under the elective court."

 STATIC_MODIFIER_NAME_nd_tab_articulus_tolerant: "Articulus Tolerant"
 STATIC_MODIFIER_DESC_nd_tab_articulus_tolerant: "The brotherhood places the chalice and the vernacular Word above clerical discipline. Czech printing presses multiply, and tolerance for dissenting Christian sects becomes a Tabor distinctive."

 # ============================================================================
 # DHE event 4: Lipany averted
 # ============================================================================
 nd_tab.4.t: "Lipany Averted"
 nd_tab.4.d: "In the history that did not happen, the Tabor and Sirotci field army shattered against the Utraquist-Catholic coalition at Lipany in May 1434. The radical wing of the Hussite revolution was destroyed in a single afternoon and the chalice church absorbed into a moderate compromise.\n\nIn this history, Lipany did not happen — or it happened differently. Prokop the Great did not die in the rout. The brotherhood's field army stands intact. Now the question is what to do with it. Press on against the crusader powers and dictate terms to the Empire? Or consolidate the brotherhood at home, integrating the surviving Sirotci radicals into a single disciplined commonwealth?"
 nd_tab.4.a: "Press the field army onward against the crusaders"
 nd_tab.4.b: "Consolidate the brotherhood: integrate the Sirotci wing"

 STATIC_MODIFIER_NAME_nd_tab_field_army_offensive: "Field Army Offensive"
 STATIC_MODIFIER_DESC_nd_tab_field_army_offensive: "The brotherhood's wagon-fortresses roll into Saxony, Brandenburg, Lusatia. The crusader powers learn to fear the chalice."

 STATIC_MODIFIER_NAME_nd_tab_brotherhood_consolidated: "Brotherhood Consolidated"
 STATIC_MODIFIER_DESC_nd_tab_brotherhood_consolidated: "The Sirotci radicals integrate into the brotherhood's institutional structure. Faction strife dissolves into a disciplined chalice republic."

 # ============================================================================
 # DHE event 5: Vernacular scripture (single-option)
 # ============================================================================
 nd_tab.5.t: "The Czech Bible"
 nd_tab.5.d: "The Plzeň Bible — among the earliest printed Bibles in any European vernacular — finds its place in every parish hall, schoolroom, and wagon-laager chapel of the brotherhood. Tabor's egalitarian church is now an egalitarian church of literacy: peasant, burgher and noble read the same vernacular scripture, sing the same Czech hymns, and argue the same gloss in the same elective courts.\n\nNo other state in Europe will catch up to this for a century."
 nd_tab.5.a: "The vernacular Word makes a literate brotherhood"

 # ============================================================================
 # DHE event 6: Married priesthood
 # ============================================================================
 nd_tab.6.t: "Apostolic Marriages"
 nd_tab.6.d: "The chalice clergy take wives. The Tabor brotherhood follows the apostolic example over the Roman tradition: the priest is married, raises children, and tills the same fields as his flock. The clergy are not a caste apart but the senior brethren of the commune, elected and dismissed by the laity they serve.\n\nThe practice scandalizes Catholic Europe. It also doubles the rate of clerical literacy in Tabor's parishes within a generation: the priest's household becomes a school, the priest's wife a deacon in everything but name."
 nd_tab.6.a: "The clergy are brethren, not a caste"

 STATIC_MODIFIER_NAME_nd_tab_apostolic_clergy: "Apostolic Clergy"
 STATIC_MODIFIER_DESC_nd_tab_apostolic_clergy: "Married parish clergy raise families and run village schools. Population, literacy and confessional unity all grow together."

 # ============================================================================
 # DHE event 7: Brotherhood Diet
 # ============================================================================
 nd_tab.7.t: "The Brotherhood Diet"
 nd_tab.7.d: "Tabor's four elected captains — the founding hejtmané of 1420 — become the constitutional kernel of a mature elective republic. The Brotherhood Diet, sitting biannually, is composed of city aldermen, parish elders, and field-army captains, all chosen by chalice-and-Articles oath rather than by bloodline.\n\nThe debate now is who exactly may sit. The strict reading recognizes only the field-tested captains and aldermen — the four-captain model writ large, a discipline of the elect. The open reading admits the wider commune: peasants, women preachers (a Tabor distinctive), and burghers' guilds, on the principle that the brotherhood is one body of the chalice."
 nd_tab.7.a: "Four-captain discipline: the elect lead the brotherhood"
 nd_tab.7.b: "Open the diet: peasants, women, burghers all may sit"

 STATIC_MODIFIER_NAME_nd_tab_four_captains: "Four-Captain Discipline"
 STATIC_MODIFIER_DESC_nd_tab_four_captains: "The Brotherhood Diet is an elective discipline of the proven: field-army captains, city aldermen, parish elders. Decisions move with military precision."

 STATIC_MODIFIER_NAME_nd_tab_open_diet: "Open Diet"
 STATIC_MODIFIER_DESC_nd_tab_open_diet: "The chalice republic admits every brother and sister to the elective body. Peasants and women preachers gain seats unheard of elsewhere in Europe."

 # ============================================================================
 # DHE event 8: Czech humanism (single-option)
 # ============================================================================
 nd_tab.8.t: "Comenius and the Czech Humanists"
 nd_tab.8.d: "Jan Amos Komenský — Comenius — bishop of the Czech Brethren, lays out a complete philosophy of education in the Tabor tradition: vernacular schooling for all classes and both sexes, learning by doing, knowledge organized for the commonwealth. By the eighteenth century his successors form the leading edge of European humanism.\n\nThe seed planted in 1420 — the chalice for the layman, the Word in his own tongue, the brotherhood as one school — flowers as a Czech intellectual republic that the Catholic powers cannot suppress, because every Czech peasant can read."
 nd_tab.8.a: "The chalice tradition flowers as Czech humanism"

 # ============================================================================
 # Advances
 # ============================================================================
 nd_tab_bohemian_reform_preachers: "Bohemian Reform Preachers"
 nd_tab_bohemian_reform_preachers_desc: "Conrad Waldhauser, Milíč of Kroměříž, and the Bethlehem Chapel preach the Czech Reformation a generation before Hus. Vernacular preaching is a living institution before the brotherhood is born."

 nd_tab_waldensian_refuge: "Waldensian Refuge"
 nd_tab_waldensian_refuge_desc: "Czech Waldensians of southern Bohemia kept anti-clerical traditions alive through the 14th century. Refugee Waldensians swell the ranks of the early brotherhood."

 nd_tab_jan_hus_legacy: "The Legacy of Jan Hus"
 nd_tab_jan_hus_legacy_desc: "The Bohemian preacher of apostolic poverty, excommunicated in 1411, burned at Constance in 1415 under safe conduct. His martyrdom detonates the Hussite Wars."

 nd_tab_free_town_charters: "Free Town Charters"
 nd_tab_free_town_charters_desc: "Žatec, Hradec Králové, Tabor: Czech free towns are urban brotherhoods of craftsmen and burghers, with elective aldermen and civic militia. They are republics in fact before they are so in law."

 nd_tab_hradiste_communes: "Hradiště of Tabor"
 nd_tab_hradiste_communes_desc: "Refugee peasants found Tabor on a defensible hilltop in 1420, naming it after the Mount of Transfiguration. Pisek, Wodrian and Žatec imitate the fortified-egalitarian model."

 nd_tab_vozova_hradba: "Vozová Hradba — The Wagon Wall"
 nd_tab_vozova_hradba_desc: "Žižka's mobile fortress: ox-wagons reinforced with iron plate, fitted with hand cannon, light artillery and crossbow loopholes. Chained together they break knightly cavalry charges. The tactical revolution of the fifteenth century."

 nd_tab_pistala_handgunners: "Píšťala Handgunners"
 nd_tab_pistala_handgunners_desc: "The Czech píšťala — the whistle-pipe, ancestor of the modern pistol — is a Hussite invention. Hand-cannon skirmishers shock European cavalry from inside the wagon laager."

 nd_tab_brotherhood_levy: "Brotherhood in Arms"
 nd_tab_brotherhood_levy_desc: "Every Taborite is sworn to the chalice and the wagon. Threshing flails and improvised pikes arm the citizen-soldier; the wagon-fort doctrine makes peasant infantry the equal of feudal cavalry."

 nd_tab_four_articles: "The Four Articles of Prague"
 nd_tab_four_articles_desc: "Free preaching, communion in both kinds, apostolic poverty of clergy, severe punishment of open sins. The constitutional document of the Hussite revolution."


 nd_tab_lipany_averted: "Lipany Averted"
 nd_tab_lipany_averted_desc: "In the history that did not happen, the Tabor and Sirotci field army shattered at Lipany in 1434 and the radical wing was absorbed into a moderate Utraquism. In this history, the field army endures. Prokop the Great lives. The chalice republic is sovereign."

 nd_tab_sirotci_banner: "Banner of the Sirotci"
 nd_tab_sirotci_banner_desc: "After Žižka's death in 1424 his most radical adherents named themselves the Orphans (Sirotci) in mourning. Under Prokop the Great they raid as far as Brandenburg, the Baltic, Hungary."

 nd_tab_vernacular_scripture: "The Czech Bible"
 nd_tab_vernacular_scripture_desc: "The Plzeň Bible (1432) is among medieval Europe's earliest printed vernacular Bibles. Vernacular scripture is the literacy engine of the brotherhood."

 nd_tab_communal_property: "Communal Property"
 nd_tab_communal_property_desc: "Incoming brethren surrender private wealth to common storehouses. The brotherhood manages fields, stores and field-army logistics as one fiscal organism — Kautsky's medieval Jacobins."

 nd_tab_itinerant_preachers: "Itinerant Preachers"
 nd_tab_itinerant_preachers_desc: "Hussite preachers (kazatelé) wander the chalice-lands rousing peasants, women and burghers into the brotherhood's life. Their pulpits double as recruiting stations."

 nd_tab_married_priesthood: "Apostolic Marriages"
 nd_tab_married_priesthood_desc: "The chalice clergy take wives, raise families, till the same fields as their flocks. By the Reformation, central European reformers cite the Tabor precedent."

 nd_tab_communal_charity: "Communal Charity"
 nd_tab_communal_charity_desc: "Tabor's egalitarianism extends to almsgiving: hospitals as clinic and almshouse, with no distinction of rank. A model for Reformation parish-poor-relief across Protestant Europe."

 nd_tab_crusade_defied: "Crusades Defied"
 nd_tab_crusade_defied_desc: "Five papal crusades broke against the chalice. By the Reformation this defeat of Catholic continental power is the founding myth of European Protestantism's military self-confidence."

 nd_tab_unitas_fratrum: "Unitas Fratrum"
 nd_tab_unitas_fratrum_desc: "The Czech Brethren refine the Tabor commune's communal pacifism into one of Europe's earliest mass-literacy churches — and a republic of letters."

 nd_tab_brotherhood_diet: "The Brotherhood Diet"
 nd_tab_brotherhood_diet_desc: "Tabor's four elected captains are the constitutional kernel of a mature elective republic: the Brotherhood Diet of city aldermen, parish elders and field-army captains."

 nd_tab_comenius_pedagogy: "Comenian Pedagogy"
 nd_tab_comenius_pedagogy_desc: "Comenius (Jan Amos Komenský), bishop of the Czech Brethren, becomes Europe's most influential pedagogue. Vernacular schooling for all classes, both sexes — three centuries early."

 nd_tab_brethren_printing: "Brethren Printing in Exile"
 nd_tab_brethren_printing_desc: "Czech Brethren printers run a republic-of-letters book trade selling vernacular religious and pedagogical texts across Europe. The Vernacular Press becomes a profitable export industry."

 nd_tab_anti_absolutism: "Anti-Absolutism"
 nd_tab_anti_absolutism_desc: "The Hussite-republican ethos refuses to bend to the absolutist court reforms sweeping Europe. A constitutional alternative to Versailles."

 nd_tab_czech_humanism: "Czech Humanism"
 nd_tab_czech_humanism_desc: "The Tabor-Brethren-Comenius lineage flowers in the age of revolutions. Religion, vernacular literacy, communal charity recast as civic virtue for the modern republic."

 nd_tab_first_commune: "The First Commune"
 nd_tab_first_commune_desc: "Nineteenth-century radicals rediscover the Tabor brotherhood as a deep precedent for European socialism. The chalice republic is named the first commune."

 nd_tab_brotherhood_in_arms: "Brotherhood in Arms"
 nd_tab_brotherhood_in_arms_desc: "Levée en masse meets the Hussite war-wagon tradition. Mass mobilization combined with disciplined defensive doctrine produces a national-republican military system."

 nd_tab_civic_militia: "Civic Militia"
 nd_tab_civic_militia_desc: "The modern descendant of the war-wagon brotherhood: communal armouries, parish drill, and the chalice-and-flag tradition of citizen soldiery in the Czech republic."

 # ============================================================================
 # Units
 # ============================================================================
 a_nd_tab_tabor_militia: "Tabor Militia"
 a_nd_tab_tabor_militia_desc: "Peasant flail-and-pike levy of the war-wagon brotherhood. Every Taborite male was sworn to defend the chalice; the wagon-fort doctrine makes their improvised arms a match for feudal cavalry."

 a_nd_tab_handgunners: "Píšťala Handgunners"
 a_nd_tab_handgunners_desc: "Czech hand-cannon skirmishers. The píšťala (whistle-pipe), the ancestor of the modern pistol, is a Hussite invention. Devastating shock against unarmored infantry and panicking cavalry."

 a_nd_tab_sirotci: "Sirotci Heavy Infantry"
 a_nd_tab_sirotci_desc: "The Orphans — radical militants who took the field after Žižka's 1424 death, calling themselves Sirotci in mourning. Under Prokop the Great they raided as far as Brandenburg and the Baltic."

 a_nd_tab_vozova_hradba: "Vozová Hradba"
 a_nd_tab_vozova_hradba_desc: "Hussite war-wagons: armored ox-drawn fortresses fitted with houfnice howitzers, hand cannon and crossbow loopholes. Slow but devastating defensive firepower; the wagon-wall formation revolutionized European warfare."

 # ============================================================================
 # Levies
 # ============================================================================
 levy_nd_tab_tabor_militia: "Tabor Militia Levy"
 levy_nd_tab_tabor_militia_desc: "Mobilization of the chalice-sworn peasantry. Flail, pike and the wagon laager."

 # ============================================================================
 # Buildings
 # ============================================================================
 nd_tab_hradiste: "Hradiště"
 nd_tab_hradiste_desc: "Communal fortified mount-town in the model of the original Tabor (1420), founded on a defensible hilltop and named after the Mount of Transfiguration. Defensive bastion of the chalice republic."

 nd_tab_articulus_house: "Articulus House"
 nd_tab_articulus_house_desc: "Town-level political-religious assembly that ratifies and enforces the Four Articles of Prague. The kernel of the Hussite-republican constitution."

 nd_tab_vernacular_press: "Vernacular Press"
 nd_tab_vernacular_press_desc: "Czech-language printing house. Hussite Bohemia produced one of medieval Europe's earliest vernacular Bible programs; the Plzeň Bible (1432) is a literacy engine for the brotherhood."

 nd_tab_communal_hospital: "Communal Hospital"
 nd_tab_communal_hospital_desc: "Hussite egalitarian healthcare: clinic and almshouse for the sick, widows, orphans and pilgrims, with no distinction of rank. A model for Reformation parish-poor-relief."

 nd_tab_brotherhood_treasury: "Brotherhood Treasury"
 nd_tab_brotherhood_treasury_desc: "Communal property administration. Incoming brethren surrender private wealth to common storehouses; the Treasury manages fields, stores and field-army logistics as one fiscal organism."

 nd_tab_hussite_pulpit: "Hussite Pulpit"
 nd_tab_hussite_pulpit_desc: "Preacher-led recruitment hall. Itinerant preachers (kazatelé) rouse peasants, women and burghers into the brotherhood's life; the pulpit doubles as a recruiting station for the chalice field army."

 # ============================================================================
 # Building production methods
 # ============================================================================
 nd_tab_hradiste_maintenance: "Hradiště Garrison"
 nd_tab_hradiste_maintenance_desc: "Stone, lumber, weapons and a brewing barrel keep the mount-town garrison ready."

 nd_tab_articulus_maintenance: "Articulus Records"
 nd_tab_articulus_maintenance_desc: "Paper, books, candles and benches for the elective court. The constitutional life of the brotherhood requires its own bureaucratic apparatus."

 nd_tab_vernacular_press_maintenance: "Press Operations"
 nd_tab_vernacular_press_maintenance_desc: "Paper, books, beeswax and printing tools. The press never sleeps."

 nd_tab_communal_hospital_maintenance: "Hospital Charity"
 nd_tab_communal_hospital_maintenance_desc: "Medicaments, beer, linen and candles for the sick, widows and orphans of the brotherhood."

 nd_tab_brotherhood_treasury_maintenance: "Treasury Administration"
 nd_tab_brotherhood_treasury_maintenance_desc: "Paper, ledger books, candles and benches for the keepers of the common stores."

 nd_tab_hussite_pulpit_maintenance: "Pulpit Provision"
 nd_tab_hussite_pulpit_maintenance_desc: "Books and candles for the preacher; bread and beer for the brethren who answer the call."

 nd_tab_brethren_press_pm: "Brethren Book Trade"
 nd_tab_brethren_press_pm_desc: "Czech Brethren in exile print vernacular pedagogical and religious texts for sale across central and northern Europe, consuming paper and ink-dyes to produce books for the republic of letters."


 a_nd_tab_republican_infantry: "Czech Republican Infantry"
 a_nd_tab_republican_infantry_desc: "Modern levée-en-masse heavy infantry of the chalice republic. The Tabor war-wagon brotherhood transmuted into republican mass-conscription: disciplined, dense fire under the Czech-republican standard."

 nd_tab_komensky_school: "Komenský School"
 nd_tab_komensky_school_desc: "Vernacular pedagogical institution of the Czech Brethren tradition. Comenius systematized schooling for all classes and both sexes a century before the Enlightenment caught up; the Komenský School is the parish-level realization of his pedagogy."

 nd_tab_komensky_school_maintenance: "School Provision"
 nd_tab_komensky_school_maintenance_desc: "Books, paper, candles and benches. The Brethren teach by doing — knowledge organized for the commonwealth."

 # ============================================================================
 # Variable tooltips
 # ============================================================================
 nd_tab_formed_tt: "Tabor Republic Formed"
 nd_tab_path_a_tt: "Path: Commune of Brethren"
 nd_tab_path_b_tt: "Path: Calixtine Realm"

 # ============================================================================
 # DESTINY TREE
 # ============================================================================

 # ----- Destiny Advances -----
 nd_tab_destiny: "Destiny of the Chalice Republic"
 nd_tab_destiny_desc: "The brotherhood has won. Now the long project of the Hussite republic begins. Choose the Path of Czech Reformation or the Communal Republic from the formation event to unlock further objectives."

 nd_tab_dest_silesian_reform: "Reform on the Silesian Frontier"
 nd_tab_dest_silesian_reform_desc: "Bring Wrocław and Görlitz under the chalice. Silesia and Lusatia are the natural frontier of the Hussite reformation; the burghers of these cities have read Hus, but their bishops still wear Roman mitres. Earn enough prestige that the Empire takes the brotherhood seriously as a confessional power."

 nd_tab_dest_reformation_export: "Continental Reformation"
 nd_tab_dest_reformation_export_desc: "Embrace the Confessionalism institution and seize Wittenberg — the cradle of the German reform. The chalice and the Ninety-Five Theses must speak with one voice. Treasuries fund printing, mission, and the disciplined missionary armies of the chalice."

 nd_tab_dest_bohemian_synod: "The Bohemian Synod"
 nd_tab_dest_bohemian_synod_desc: "Augsburg, Geneva, Leipzig — the three cities of the Reformation under one Bohemian-led council. The chalice republic commands a continental Protestant alliance, with the field army and the prestige to keep it. Unlocks the Bohemian Synod Hall."

 nd_tab_dest_civic_brotherhood: "The Civic Brotherhood"
 nd_tab_dest_civic_brotherhood_desc: "Embrace Meritocracy. Deepen the inner commune: elective offices for parish, town, and field, and a treasury rich enough to fund the brotherhood's experiment in egalitarian governance."

 nd_tab_dest_vernacular_commonwealth: "The Vernacular Commonwealth"
 nd_tab_dest_vernacular_commonwealth_desc: "Embrace the Renaissance and develop a Czech-language print culture so deep that paper trades through the capital market. The chalice republic becomes a continental industry of vernacular literacy."

 nd_tab_dest_demokraticky_sjezd: "Demokratický Sjezd"
 nd_tab_dest_demokraticky_sjezd_desc: "Embrace the Enlightenment. The Tabor commune crowns its long project: a fully democratic Czech-vernacular parliament where every parish elder and field captain may sit. Unlocks the Demokratický Sjezd."

 # ----- Destiny DHE Events -----
 nd_tab.9.t: "A Destiny for the Chalice"
 nd_tab.9.d: "The brotherhood-republic stands. The Compactata are torn up; Roman authority has been refused; the wagon-walls have rolled five papal hosts back into the Empire. Now the chalice flies above a sovereign state, and the long project begins. The captains, preachers, and aldermen meet at the Articulus House to debate what comes next.\n\nThe destiny tab in the Traditions panel now lights up — your formation choice has set the path."
 nd_tab.9.a: "The chalice writes its own future"

 nd_tab.10.t: "The Silesian Frontier"
 nd_tab.10.d: "Wrocław and Görlitz fly the chalice. The Silesian and Lusatian burghers, long sympathetic to Hus, now belong to the brotherhood by treaty and by garrison. Czech preachers ride out into the Empire as far as the Oder, and the chalice's prestige rises through every diet of the Hanseatic and Imperial cities.\n\nThe Silesian frontier is the chalice's first foreign harvest."
 nd_tab.10.a: "The frontier is the brotherhood's"

 nd_tab.11.t: "The Reformation Comes"
 nd_tab.11.d: "Wittenberg has fallen to the chalice. Confessionalism is a state institution; the Bohemian seal sits beside the Saxon on Reformation tracts; the brotherhood's printers reset their forms in German as well as Czech. The Empire is on fire with reform, and the chalice republic is its senior partner.\n\nThe captains debate how to push the reform further. Send our preachers and diplomats out among the German princes — or arm the Lutheran reformers and let the brotherhood's wagons do the talking?"
 nd_tab.11.a: "Send our preachers across the Empire"
 nd_tab.11.b: "Arm the Lutheran reformers"

 STATIC_MODIFIER_NAME_nd_tab_dest_brotherhood_preachers: "Brotherhood Preachers Abroad"
 STATIC_MODIFIER_DESC_nd_tab_dest_brotherhood_preachers: "Hussite preachers and diplomats fan out among the German princes. Information networks spread, treaty channels multiply — but the brotherhood's coffers strain under the cost of the apostolate."

 STATIC_MODIFIER_NAME_nd_tab_dest_arm_the_reformers: "Arm the Reformers"
 STATIC_MODIFIER_DESC_nd_tab_dest_arm_the_reformers: "Bohemian wagons and Píšťala handgunners stiffen every Lutheran levy. Army tradition surges, and the reform armies grow — but the old Hussite-Czech nobility resent being made into a forge for foreign upstarts."

 nd_tab.12.t: "The Bohemian Synod"
 nd_tab.12.d: "Augsburg, Geneva, Leipzig under the chalice. Hussite, Lutheran and Reformed delegations sit at one Bohemian-led table, and a unified central-European Protestantism takes constitutional shape. The Synod Hall in Prague is the headquarters of the reform.\n\nThe captains debate the council's posture. Press for theological union and a peaceful continental settlement — or treat the synod as a militant high command, the chalice church under arms against the Catholic powers?"
 nd_tab.12.a: "A united Reformation under one synod"
 nd_tab.12.b: "A militant synod, the chalice church under arms"

 STATIC_MODIFIER_NAME_nd_tab_dest_united_synod: "United Reformation Synod"
 STATIC_MODIFIER_DESC_nd_tab_dest_united_synod: "Hussite, Lutheran and Reformed delegations meet under one chalice. Diplomatic channels deepen, allies and subjects bind tighter, and even rival powers think twice before declaring war on the synod."

 STATIC_MODIFIER_NAME_nd_tab_dest_militant_synod: "Militant Synod"
 STATIC_MODIFIER_DESC_nd_tab_dest_militant_synod: "The synod hall doubles as a war council. Crusader fortresses fall faster, breaches are stormed, and the Reformation marches under one banner — though every coin pays double for siege works."

 nd_tab.13.t: "The Civic Brotherhood"
 nd_tab.13.d: "Meritocracy is now Tabor's institution as well as its principle. Aldermen, captains, parish elders — none inherit office. Every parish elects its preacher; every town elects its captain; every field-army company elects its hejtman. The brotherhood's coffers fund the experiment, and the experiment funds the brotherhood.\n\nThe peasant in his Articulus House hears the same agenda as the burgher in his guild. No other state in Europe can say so."
 nd_tab.13.a: "The brotherhood is the republic"

 nd_tab.14.t: "The Vernacular Commonwealth"
 nd_tab.14.d: "Renaissance learning meets the Czech vernacular. Brotherhood presses run day and night; paper from the capital's market trades as far as Lübeck and Lyon. Every parish school has a printed primer; every burgher reads Czech; the commonwealth is a republic of letters before it is anything else.\n\nThe diet debates how to channel the print boom. Pour resources into the pedagogical project — the schools, the vernacular treatises, the developmental ideal? Or empower the burgher guilds whose presses and ink-mills carry it to market?"
 nd_tab.14.a: "Pour the press into the pedagogical project"
 nd_tab.14.b: "Empower the burgher guild houses"

 STATIC_MODIFIER_NAME_nd_tab_dest_print_revolution: "Print Revolution"
 STATIC_MODIFIER_DESC_nd_tab_dest_print_revolution: "Brotherhood presses publish vernacular treatises by the cartload. Czech development quickens, and Europe takes the chalice republic seriously as a great power of letters."

 STATIC_MODIFIER_NAME_nd_tab_dest_burgher_compact: "Burgher Compact"
 STATIC_MODIFIER_DESC_nd_tab_dest_burgher_compact: "The press boom passes into burgher hands. Land trade routes carry Czech books across central Europe and merchant capacity expands — but the chalice clergy resent the burghers' new wealth and influence."

 nd_tab.15.t: "Demokratický Sjezd"
 nd_tab.15.d: "The Enlightenment has come to the chalice republic. Comenius's pedagogy is universal; every Czech peasant reads; every parish elects to a national assembly conducted entirely in the Czech vernacular. The Demokratický Sjezd is the working democratic experiment Europe has been arguing about for two centuries.\n\nThe captains debate the final shape. Open the franchise without limit — every brother and sister, peasant or burgher, on the rolls? Or keep an elective discipline of the proven, the four-captain model writ large for a modern republic?"
 nd_tab.15.a: "Open the franchise to every brother and sister"
 nd_tab.15.b: "An elective discipline of the proven"

 STATIC_MODIFIER_NAME_nd_tab_dest_open_franchise: "Open Franchise"
 STATIC_MODIFIER_DESC_nd_tab_dest_open_franchise: "Every brother and sister votes. Estate satisfaction climbs broadly, and the country drifts toward a free-subject liberalism unheard of elsewhere in Europe."

 STATIC_MODIFIER_NAME_nd_tab_dest_disciplined_republic: "Disciplined Elective Republic"
 STATIC_MODIFIER_DESC_nd_tab_dest_disciplined_republic: "The four-captain model writ large. Annexation of fellow Czech lands is cheap, war-torn provinces recover quickly, and a culture of qualitative excellence permeates the brotherhood's institutions."

 # ----- Destiny Buildings -----
 nd_tab_synod_hall: "Bohemian Synod Hall"
 nd_tab_synod_hall_desc: "Continental Reformation council seat. The chalice republic convenes Hussite, Lutheran and Reformed delegations under one Bohemian-led synod, codifying a unified central-European Protestantism."

 nd_tab_synod_hall_maintenance: "Synod Provision"
 nd_tab_synod_hall_maintenance_desc: "Books, paper, beeswax and fine cloth for the council fathers. The synod records its own canon law in a dozen vernaculars."

 nd_tab_demokraticky_sjezd: "Demokratický Sjezd"
 nd_tab_demokraticky_sjezd_desc: "Vernacular-Czech parliament: the brotherhood's elective ethos institutionalized as a fully democratic civic assembly. Every parish elder, burgher master and field-army captain may sit; records and debates are kept in Czech."

 nd_tab_demokraticky_sjezd_maintenance: "Sjezd Records"
 nd_tab_demokraticky_sjezd_maintenance_desc: "Paper, ledger books, furniture and chamber drapery. The democratic experiment runs on a paper trail."

 # ============================================================================
 # Bureaucracies -- chalice-republic institutions
 # ============================================================================

 AUTO_MODIFIER_NAME_nd_tab_bureaucracy_authority: "Brotherhood Administrative Authority"
 AUTO_MODIFIER_DESC_nd_tab_bureaucracy_authority: "The chalice republic's elective machinery is mature enough to operate institutional ministries. Alongside the capital's standing slot, Tabor may sustain two further bureaucracies of its choosing -- four chalice institutions are available, of which three may be active at once."

 hejtmane_council_bureaucracy: "Council of the Hejtmané"
 hejtmane_council_bureaucracy_desc: "Žižka's collective field command of 1420, formalized after his death in 1424 as a four-captain elective executive sitting for both the Tabor and Sirotci wings. Hejtmané were nominated by city aldermen, parish brotherhoods, and the field-army's own veterans, ratified in joint session, and removable by the same. The hereditary nobility had no seat: the Council of the Hejtmané ran the chalice republic in war and peace as an apostolic college."

 snem_bratrsky_bureaucracy: "Sněm Bratrský"
 snem_bratrsky_bureaucracy_desc: "The Brotherhood Diet, convened from 1421 at Čáslav and refined across the 1430s as the working parliament of the Hussite cities. Delegates spoke in vernacular Czech and were counted by parish brotherhood, not by birth or estate. The Diet ratified the Four Articles of Prague as constitutional law, voted military levies, and elected the captains -- the first sustained example in Latin Europe of an estate-blind republican assembly seating peasants alongside burghers."

 articulus_tribunal_bureaucracy: "Court of the Articulus"
 articulus_tribunal_bureaucracy_desc: "The religious-juridical tribunal that judged conformity to the Four Articles of Prague (1420): free preaching, communion in both kinds, apostolic poverty of clergy, and severe punishment of mortal sin. Married priests, women preachers, and lay elders sat as judges; Roman canon law was excluded. The court ratified iconoclasms, dissolved monasteries, and tried Catholic clergy for simony, building a chalice church the papacy refused to recognize for two centuries."

 communal_storehouses_bureaucracy: "Communal Storehouses"
 communal_storehouses_bureaucracy_desc: "The kádby -- great vats into which incoming brothers and sisters surrendered their private wealth on joining the commune. Tabor administered fields, granaries, and the field-army's baggage as a single fiscal organism out of these storehouses, distributing food, cloth, and arms to the brotherhood by need. Karl Kautsky cited the kádby as a medieval precedent for European socialism; in their working decade they fed the army that defeated five papal crusades."
 STATIC_MODIFIER_NAME_nd_tab_peasant_commune: "Tabor Peasant Commune"
 STATIC_MODIFIER_DESC_nd_tab_peasant_commune: "The brotherhood's egalitarian governance, made permanent. The peasantry are ascendant in council and field; the nobility are diminished where not abolished outright. Communal ownership of land and granaries; council-elected captains; the Four Articles of Prague as constitutional law. The Tabor is a republic in the strong sense -- a Hussite peasant commonwealth, not a kingdom in republican costume."
