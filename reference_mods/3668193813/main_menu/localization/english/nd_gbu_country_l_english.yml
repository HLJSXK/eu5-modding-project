l_english:
 GBU: "Greater Burgundy"
 GBU_ADJ: "Burgundian"
 GBU_f: "Greater Burgundy"
 GBU_f_desc: "The Burgundian Middle Kingdom revived. Forged from the corridor of wealth that Philip the Good and Charles the Bold welded into a single composite state, Greater Burgundy unites the Flemish cities, the Walloon marches, Lorraine, the Free County, and the ducal heartland into a sovereign kingdom answering to neither Paris nor the Empire. The crown Charles sought at Trier is at last placed upon Burgundian brows, the Order of the Golden Fleece its chivalric backbone."
