l_english:

 # ============================================================
 # Variable tooltips
 # ============================================================
 nd_vjn_formed_tt: "The Karnata Empire has been formed."
 nd_vjn_path_a_tt: "Karnata Destiny: the Pampa-Virupaksha line."
 nd_vjn_path_b_tt: "Karnata Destiny: the Tuluva court."

 # ============================================================
 # Formation event
 # ============================================================
 nd_vjn.1.t: "The Boar-Banner Rises"
 nd_vjn.1.d: "From the granite ridges above the Tungabhadra, the imperial gopurams of Vijayanagara lift their tiered crowns over a city of half a million. The throne of Hampi is yours: the Karnata Rajya restored, dharma defended, the southern peoples gathered under the saffron Varaha. But your court must choose its character. The Saluva-Tuluva transition has shown that the empire can be governed in two voices, and the rituals you privilege will define what your dynasty becomes.\n\nWill you raise the empire as the great patron of Saiva temple and Brahmin learning, anchoring legitimacy in the goddess Pampa-Virupaksha and the Sringeri matha — or will you walk the path of Krishnadeva Raya: a cosmopolitan court of Telugu poets, Vaishnava devotion, Portuguese horse-traders, and Persian envoys, an empire whose dharma flows outward through commerce?\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_vjn.1.a: "The Pampa-Virupaksha Line: temple, tank, and Brahmin sanction"
 nd_vjn.1.b: "The Tuluva Court: Telugu verse, Vaishnava devotion, foreign trade"

 # ============================================================
 # Formation timed modifiers
 # ============================================================
 STATIC_MODIFIER_NAME_nd_vjn_pampa_virupaksha_line: "The Pampa-Virupaksha Line"
 STATIC_MODIFIER_DESC_nd_vjn_pampa_virupaksha_line: "The empire is anchored in Saiva temple-ritual and the Sringeri matha. Brahmin sanction and monumental temple-building convert the southern peoples and raise vast manpower for the imperial host."
 STATIC_MODIFIER_NAME_nd_vjn_tuluva_court: "The Tuluva Court"
 STATIC_MODIFIER_DESC_nd_vjn_tuluva_court: "Vaishnava devotion, Telugu literary patronage, and the cosmopolitan court of Krishnadeva Raya. The Karnata empire trades with Portuguese, Persian, and Arab merchants and welcomes envoys from across the Indian Ocean."

 # ============================================================
 # Advance event 2: Krishnadeva Raya's coronation
 # ============================================================
 nd_vjn.2.t: "The Coronation of Krishnadeva Raya"
 nd_vjn.2.d: "The third son of Tuluva Narasa Nayaka has taken the throne at Hampi. Krishnadeva — chess-master, polyglot, poet of the Amuktamalyada and patron of Allasani Peddana, scholar-warrior, and the most magnetic ruler in southern memory — is crowned at an enlarged Virupaksha temple in 1509. His reign offers two faces: Krishnadeva the philosopher-king who composed Telugu verses on statecraft, or Krishnadeva the dig-vijaya conqueror who broke the Gajapati at Kondavidu and humbled Bijapur at Raichur.\n\nHow shall your court remember him?"
 nd_vjn.2.a: "As scholar-emperor: convene the Bhuvana Vijaya"
 nd_vjn.2.b: "As dig-vijaya conqueror: ride against the doab"

 STATIC_MODIFIER_NAME_nd_vjn_amuktamalyada_reign: "The Amuktamalyada Reign"
 STATIC_MODIFIER_DESC_nd_vjn_amuktamalyada_reign: "The emperor's verse and patronage flower across Telugu, Sanskrit, Tamil, and Kannada. The court is the lodestar of Dravidian letters."
 STATIC_MODIFIER_NAME_nd_vjn_dig_vijaya_campaign: "Dig-Vijaya Campaign"
 STATIC_MODIFIER_DESC_nd_vjn_dig_vijaya_campaign: "The Karnata armies sweep across the Krishna-Tungabhadra doab and crash through the Gajapati frontier. The empire's prestige spreads with its banners."

 # ============================================================
 # Advance event 3: Portuguese horse trade
 # ============================================================
 nd_vjn.3.t: "Horses from the Sea"
 nd_vjn.3.d: "The southern climate breaks horses; the empire imports its cavalry mounts. The Portuguese capture of Goa in 1510 has rearranged the trade. Arabian and Persian war-horses, once the lifeblood of the Bahmani cavalry, can now flow through Goa under continuous Portuguese factorage — reliable, sealed, and dependent on the Estado da India's goodwill. Or the empire can deal directly with the Hormuzi and Mappilla merchant houses at Bhatkal and Honnavar, paying lower prices for shipments that arrive when they arrive, with the Persian Gulf factors taking their margin in spices and saltpetre rather than Portuguese silver.\n\nThe Konkan ports are at the empire's command. The choice is whose horse-merchants they will host."
 nd_vjn.3.a: "The Portuguese factor at Goa. Continuous supply, by treaty."
 nd_vjn.3.b: "The Hormuzi houses at Bhatkal. The horses come, and so does no foreign garrison."
 STATIC_MODIFIER_NAME_nd_vjn_goa_partnership: "Goa Partnership"
 STATIC_MODIFIER_DESC_nd_vjn_goa_partnership: "Portuguese factors at Goa deliver Arabian and Persian war-horses to the imperial cavalry on continuous contract. The supply is reliable, the cavalry is mounted, and the Portuguese are courted with imperial favour."
 STATIC_MODIFIER_NAME_nd_vjn_hormuzi_merchants: "Hormuzi Merchants"
 STATIC_MODIFIER_DESC_nd_vjn_hormuzi_merchants: "Hormuzi and Mappilla merchant houses bring Persian and Arabian horses directly to Bhatkal and Honnavar. The cavalry is mounted at lower price and without Portuguese leverage, but the Hindu court must learn to accommodate Konkani Muslim merchant princes — and the brahmins of the imperial assembly grumble."

 # ============================================================
 # Advance event 4: Amara-Nayaka system
 # ============================================================
 nd_vjn.4.t: "The Amara-Nayaka System Codified"
 nd_vjn.4.d: "Across the empire, the imperial court formalizes the system of amaram tenure: territorial governorships granted to nayaka commanders in exchange for sworn military service. Each amara-nayaka maintains a quota of cavalry, infantry, elephants, and forts; collects revenue from his territory's peasants, craftsmen, and merchants; and remits a portion to the imperial treasury. The system promises a vast standing army at the dynasty's call. It also creates dozens of military lords with armies of their own.\n\nThe court must decide how tightly the imperial chains will bind them."
 nd_vjn.4.a: "Audit them strictly: tax registers, sealed quotas, rotating postings"
 nd_vjn.4.b: "Reward them generously: levies in exchange for autonomy"

 STATIC_MODIFIER_NAME_nd_vjn_loyal_nayakas: "Audited Nayakas"
 STATIC_MODIFIER_DESC_nd_vjn_loyal_nayakas: "The amara-nayakas serve under sealed registers and rotating postings. The crown holds them on a tight tether, and the imperial treasury fills."
 STATIC_MODIFIER_NAME_nd_vjn_imperial_levy: "Imperial Nayaka Levy"
 STATIC_MODIFIER_DESC_nd_vjn_imperial_levy: "The amara-nayakas raise vast levies in exchange for free hand in their amarams. The empire's banners fly thicker than ever, though the grandees grow."

 # ============================================================
 # Advance event 5: Lessons of Talikota
 # ============================================================
 nd_vjn.5.t: "The Shadow of Talikota Averted"
 nd_vjn.5.d: "The four-power Sultanate coalition assembled north of the Krishna in the manner of 1565 — Bijapur, Ahmadnagar, Golconda, Bidar uniting their cavalry against the Karnata empire. In our world, on that Friday at Talikota, the Gilani brothers commanding Rama Raya's Muslim regiments defected mid-battle and the imperial line collapsed. The empire's regent was beheaded; Hampi was sacked for five months and never recovered.\n\nIn this age, your court has read that history before it could happen. The court purges, drills, and reorganizes the host. Two reform paths beckon: a unified command structure under a single field-marshal, or a thorough purification of court factions and dynastic rivals."
 nd_vjn.5.a: "Establish unified field command and Frankish-style drill"
 nd_vjn.5.b: "Purge the factions; no Gilanis at our throat again"

 STATIC_MODIFIER_NAME_nd_vjn_unified_command: "Unified Imperial Command"
 STATIC_MODIFIER_DESC_nd_vjn_unified_command: "The imperial host fights as one column under a single Senapati, drilled in continental fashion with massed artillery. The disasters of divided command are not repeated."
 STATIC_MODIFIER_NAME_nd_vjn_purified_court: "Purified Court"
 STATIC_MODIFIER_DESC_nd_vjn_purified_court: "Court factions are dissolved, foreign commanders examined for loyalty, and the temple establishment reaffirmed at the heart of imperial ritual. The empire stands ideologically unified."

 # ============================================================
 # Advance event 6: Bhuvana Vijaya / Ashtadiggajas
 # ============================================================
 nd_vjn.6.t: "The Hall of World-Conquest"
 nd_vjn.6.d: "Within the new pillared hall called Bhuvana Vijaya — the Hall of World-Conquest — the emperor convenes the literary court. Two factions wait on his patronage. The Ashtadiggajas, the eight 'elephants of the directions,' speak in Telugu: Allasani Peddana the andhra-kavita-pitamaha, Nandi Thimmana of Parijatapaharanam, Pingali Surana of the bilingual Raghava-Pandaviyam, Tenali Ramakrishna the wit. Beside them stand the Sanskrit kavya pandits of Vyasa Tirtha's circle, scholars of the Madhva matha and the dvaita Vedanta — keepers of pan-Indian classical learning, advocates of a Sanskrit court legible to every brahmin from Kashmir to Sri Lanka.\n\nThe emperor's purse can elevate one school to court office. The other will keep its honour but lose its first claim on imperial patronage."
 nd_vjn.6.a: "Telugu is now a language of dharma. The Ashtadiggajas in residence."
 nd_vjn.6.b: "Vyasa Tirtha at our right hand. Sanskrit kavya is the empire's voice."
 STATIC_MODIFIER_NAME_nd_vjn_telugu_bhuvana: "Telugu Bhuvana"
 STATIC_MODIFIER_DESC_nd_vjn_telugu_bhuvana: "The Ashtadiggajas in residence at the Hall of World-Conquest. Vernacular Telugu becomes the language of empire — administered, taught, and recited in courts from Pulicat to the Krishna. The literary energy of a continent flows through Karnata channels."
 STATIC_MODIFIER_NAME_nd_vjn_sanskrit_kavya: "Sanskrit Kavya"
 STATIC_MODIFIER_DESC_nd_vjn_sanskrit_kavya: "Vyasa Tirtha's dvaita matha rises at court. Pan-Indian classical scholarship sets the tone of imperial discourse: every brahmin north and south recognizes the Karnata as an emperor of dharma, and the empire's chronicles are read in the same Sanskrit from Kashmir to Lanka."

 # ============================================================
 # Advances — Age 1
 # ============================================================
 nd_vjn_sangama_foundation: "Sangama Foundation"
 nd_vjn_sangama_foundation_desc: "Harihara and Bukka, captives of the Tughluqs turned founders, raise Vijayanagara on the southern bank of the Tungabhadra in 1336 as a Hindu bulwark against the Sultanate's southern advance. The dynasty takes its legitimacy from the Saiva matha at Sringeri and the goddess Pampa of Hampi."
 nd_vjn_kuravar_levies: "Kuravar Levies"
 nd_vjn_kuravar_levies_desc: "The hill-peoples of the Western and Eastern Ghats — Kuravas, Irulas, and the broader forest castes — provide skirmishing archers and javelin-bearers to the imperial host. They know the jungle and the hill-track; the imperial cavalry rides through territory they have already mapped."
 nd_vjn_vidyaranya_sanction: "The Sanction of Vidyaranya"
 nd_vjn_vidyaranya_sanction_desc: "Vidyaranya, the Advaita Vedantin pontiff of the Sringeri Sharada Peetham, blesses the Sangama foundation and gives the dynasty spiritual sanction. The matha lends its scholar-clergy to the imperial court; the empire is born under a sage's hand."
 nd_vjn_tank_irrigation: "Tank Irrigation"
 nd_vjn_tank_irrigation_desc: "The Tungabhadra valley is laced with kere — earthen tanks fed by anicut diversion-dams across the river. The Hiriya canal alone irrigates Hampi, Kamalapura, and the imperial estates. Karnata agriculture is feast where the rains alone would be famine."
 nd_vjn_dravidian_architecture: "Dravidian Temple Architecture"
 nd_vjn_dravidian_architecture_desc: "Pyramidal gopurams, tiered mantapas, sculpted yali-pillars, monolithic Nandis, processional streets aligned to the sanctum: the Vijayanagara school synthesizes the Chola, Pallava, Hoysala, and Pandya inheritances into a unified imperial idiom."
 nd_vjn_bhakti_traditions: "Bhakti Devotional Traditions"
 nd_vjn_bhakti_traditions_desc: "The Alvars and Nayanars sang devotion in Tamil; the Haridasas now sing it in Kannada and Telugu. Purandaradasa, Kanakadasa, and Vyasaraja knit the southern peoples into a shared devotional vernacular that runs deeper than dynasty."

 # ============================================================
 # Advances — Age 2
 # ============================================================
 nd_vjn_devaraya_court: "The Court of Devaraya II"
 nd_vjn_devaraya_court_desc: "Devaraya II, called Gajabetegara — the elephant-hunter — receives at Hampi the embassy of Abdul Razzaq from Timurid Herat (1442) and the merchant Niccolo de' Conti from Venice. The court's diplomatic reach now spans Persia, the Bahmani Deccan, the Indian Ocean, and the Mediterranean."
 nd_vjn_amara_nayaka_system: "The Amara-Nayaka System"
 nd_vjn_amara_nayaka_system_desc: "Territorial governorships called amarams are granted to nayaka commanders in exchange for sworn military service: cavalry, infantry, elephants, forts, and a remitted share of revenue. The empire raises armies through a feudal-military bureaucracy unique to the Karnata."
 nd_vjn_saluva_consolidation: "The Saluva Consolidation"
 nd_vjn_saluva_consolidation_desc: "After the chaos of the late Sangama succession, Saluva Narasimha seizes the throne in 1485, restores the imperial treasury, and reforms the army on the model of Vir Vir Narasimha. The empire centralizes."
 nd_vjn_swarnakara_guilds: "Swarnakara Bronze Guilds"
 nd_vjn_swarnakara_guilds_desc: "The swarnakara — the goldsmiths of the south — continue the Chola lost-wax tradition that produced the Nataraja and the Tirupati bronzes. Imperial workshops pour bronze processional icons, ritual lamps, sword-fittings, and elephant-armor for the empire's temples and armies."
 nd_vjn_cosmopolitan_court: "The Cosmopolitan Court"
 nd_vjn_cosmopolitan_court_desc: "Persians, Arabs, Italians, Portuguese, and Tibetans pass through Hampi's Bhima Gate. The court speaks Telugu, Sanskrit, and Persian; the imperial register is kept in four scripts. The Karnata empire is the most polyglot Hindu power on earth."
 nd_vjn_imperial_elephant_corps: "Imperial Elephant Corps"
 nd_vjn_imperial_elephant_corps_desc: "The empire keeps thousands of war elephants in the stables of Hampi, Penukonda, and Anegondi. Armored howdahs, palanquin commanders, and a mahout caste of hereditary elephant-handlers sustain the gajapati tradition the Karnata empire wears as its own."

 # ============================================================
 # Advances — Age 3
 # ============================================================
 nd_vjn_krishnadeva_coronation: "The Coronation of Krishnadeva Raya"
 nd_vjn_krishnadeva_coronation_desc: "The third son of Tuluva Narasa Nayaka, born 1471, is crowned at Hampi in 1509. Soldier, scholar, statesman, polyglot, poet of the Amuktamalyada — Krishnadeva will reign for twenty years and bring the empire to its absolute zenith."
 nd_vjn_ashtadiggajas: "The Ashtadiggajas"
 nd_vjn_ashtadiggajas_desc: "Eight 'elephants of the directions' fill the imperial Bhuvana Vijaya — the Hall of World-Conquest. Allasani Peddana, Nandi Thimmana, Tenali Ramakrishna, Pingali Surana, and their fellows raise Telugu literature to a golden age and make Hampi the Athens of the south."
 nd_vjn_arabian_horse_trade: "The Goa Horse Trade"
 nd_vjn_arabian_horse_trade_desc: "The Portuguese capture of Goa in 1510 reroutes the Arabian and Persian horse-trade through Karnata-allied factors. The empire's heavy cavalry, long hampered by the southern climate, finally rides on imported Arabians at scale."
 nd_vjn_coastal_emporia: "Coastal Emporia"
 nd_vjn_coastal_emporia_desc: "Bhatkal, Honavar, Mangalore, Cochin, Kollam, Pulicat, Masulipatnam: the Karnata empire commands the southern coasts on both the Malabar and Coromandel sides. Spices flow out, horses and silver flow in."
 nd_vjn_dig_vijaya_doctrine: "Dig-Vijaya Doctrine"
 nd_vjn_dig_vijaya_doctrine_desc: "The classical Hindu campaign of conquest in all directions — the dig-vijaya — is reformulated under Krishnadeva as a doctrine of fast-marching columns, fort-reduction by entrenched cannon, and the systematic humiliation of feudatory courts."
 nd_vjn_strategic_diplomacy: "Strategic Diplomacy"
 nd_vjn_strategic_diplomacy_desc: "The empire never fights all the Sultanates at once. Bijapur is humbled while Ahmadnagar is conciliated; Golconda is courted while Berar is bullied. Krishnadeva's diplomatic instinct keeps the four-power coalition from forming for a generation."

 # ============================================================
 # Advances — Age 4
 # ============================================================
 nd_vjn_gajadhwaja_corps: "The Gajadhwaja Elephant Corps"
 nd_vjn_gajadhwaja_corps_desc: "Under the gajadhwaja — the elephant-banner — the imperial corps of war elephants is reorganized into permanent regiments. Howdahs are armored against firearms; mahouts are trained from childhood; the Karnata gajasena becomes the most feared elephant force in the subcontinent."
 nd_vjn_aravidu_restoration: "The Aravidu Restoration"
 nd_vjn_aravidu_restoration_desc: "The Aravidu dynasty under Tirumala and his successors restores the empire from the southern capitals — Penukonda, Chandragiri, Vellore — and recovers the doab. The Karnata Rajya endures where in our timeline it fell."
 nd_vjn_persian_factors: "Persian and Arab Factors"
 nd_vjn_persian_factors_desc: "Imperial trading factors from Hormuz, Aden, and Muscat establish counting-houses at the Karnata port-cities. The empire's spice exports flow north through Persian merchant networks; horse and silver imports flow back."
 nd_vjn_lessons_of_talikota: "The Lessons of Talikota"
 nd_vjn_lessons_of_talikota_desc: "Whether averted or survived, the lessons of the Talikota plain are absorbed: never a divided command; never trust mercenary captains beyond their last paid month; always reserve a regrouping force; always know the enemy's pre-battle envoys."
 nd_vjn_pluralist_patronage: "Pluralist Patronage"
 nd_vjn_pluralist_patronage_desc: "Madhva mathas at Udupi, Sringeri Advaita pontiffs, Veerashaiva matas, Jain bastis, and Vaishnava temples at Tirupati and Srirangam all receive imperial endowment. The Karnata empire patronizes every Hindu strand without forcing one to dominate."
 nd_vjn_telugu_court_language: "Telugu as Imperial Court Language"
 nd_vjn_telugu_court_language_desc: "Krishnadeva's Amuktamalyada legacy elevates Telugu beside Sanskrit and Kannada as a language of imperial administration. Inscriptions, grants, and court epics now run in four scripts; the Dravidian peoples are bound through their own letters into the imperial vision."

 # ============================================================
 # Advances — Age 5
 # ============================================================
 nd_vjn_nayaka_reincorporation: "The Reincorporation of the Nayaka Kingdoms"
 nd_vjn_nayaka_reincorporation_desc: "Madurai under the Nayaks of Madurai, Thanjavur under the Nayaks of Thanjavur, Gingee, Mysore, Ikkeri: the breakaway nayaka principalities of the post-Talikota collapse are brought back under direct imperial authority. The Karnata Rajya stands whole."
 nd_vjn_imperial_treasury: "The Imperial Treasury"
 nd_vjn_imperial_treasury_desc: "Karnata fiscal reform consolidates the multiple regional revenue systems into a unified imperial treasury at Hampi, with subsidiary treasuries at Penukonda and Madurai. Revenue assessment is regularized; surplus funds the imperial monumental program."
 nd_vjn_coromandel_textiles: "Coromandel Textile Manufactories"
 nd_vjn_coromandel_textiles_desc: "Madras, Pulicat, Masulipatnam, Pondicherry, Sadras: the Coromandel coast textile manufactories produce the finest painted and dyed cottons in the early-modern world. Karnata cloth dresses Persia, Arabia, the Spice Islands, and increasingly Europe."
 nd_vjn_dravidian_naval_doctrine: "Dravidian Naval Doctrine"
 nd_vjn_dravidian_naval_doctrine_desc: "Imperial squadrons on both the Malabar and Coromandel coasts establish a Karnata naval doctrine: shallow-draft frigates for monsoon waters, paired with European-style heavy ships purchased through Goa or built at Cochin and Pulicat shipyards."

 # ============================================================
 # Advances — Age 6
 # ============================================================
 nd_vjn_karnata_renaissance: "The Karnata Renaissance"
 nd_vjn_karnata_renaissance_desc: "Modern Telugu under Gurazada Apparao, modern Kannada under Kuvempu's antecedents, modern Tamil under Subramania Bharati's forerunners, modern Malayalam under Ezhuthachan's heirs: the Dravidian languages enter the print era together, fused by the imperial court's continued patronage of all four."
 nd_vjn_industrial_coromandel: "Industrial Coromandel"
 nd_vjn_industrial_coromandel_desc: "Steam-powered cotton mills at Madras and Madurai, mechanized bronze-foundries at Salem, and tea estates in the Nilgiris bring the imperial economy into the industrial age while preserving the swarnakara and weaver guilds as skilled-labor partners."
 nd_vjn_dravidian_cabinet: "The Dravidian Cabinet"
 nd_vjn_dravidian_cabinet_desc: "Modern cabinet government conducts its business in Telugu, Tamil, Kannada, and Malayalam — the four-language imperial machinery that no European empire ever managed to displace."
 nd_vjn_imperial_conscription: "Imperial Conscription"
 nd_vjn_imperial_conscription_desc: "The amara-nayaka levies are reformed under uniform imperial command: standardized regiments, drilled in Frankish fashion, equipped from imperial arsenals, conscripted by lottery from the four-language districts. The Karnata army modernizes without losing its territorial roots."

 # ============================================================
 # Custom units
 # ============================================================
 a_nd_vjn_kuravar_archers: "Kuravar Archers"
 a_nd_vjn_kuravar_archers_desc: "Hill-people skirmishers from the Western and Eastern Ghats. Light-armored, mobile, and at home in jungle and hill terrain, the Kuravar archers screen and harry far ahead of the imperial cavalry."
 a_nd_vjn_arabian_warhorse: "Imperial Arabian Horse"
 a_nd_vjn_arabian_warhorse_desc: "Heavy cavalry mounted on Arabian and Persian war horses imported through Goa. The Karnata empire's signature shock arm under the Tuluva and Aravidu dynasties — fast, disciplined, and a counterweight to Sultanate cavalry."
 a_nd_vjn_imperial_war_elephant: "Gajadhwaja War Elephant"
 a_nd_vjn_imperial_war_elephant_desc: "Permanent regiments of armored elephants under the imperial gajadhwaja banner. Mahouts trained from childhood; howdahs reinforced against firearms; the elephant-banner of the south."

 # ============================================================
 # Custom levies
 # ============================================================
 levy_nd_vjn_kuravar_archers: "Kuravar Archer Levy"
 levy_nd_vjn_kuravar_archers_desc: "Levy of Kuravar and forest-caste archers from the southern hill country."

 # ============================================================
 # Custom buildings
 # ============================================================
 nd_vjn_dravidian_temple_complex: "Dravidian Temple Complex"
 nd_vjn_dravidian_temple_complex_desc: "Imperial Saiva-Vaishnava temple complex with monumental gopurams, pillared mantapas, sculpted yali-columns, and a sacred tank. The Hampi style — Vittala, Hazara Rama, Virupaksha — exported across the empire."
 nd_vjn_temple_maintenance: "Temple Endowment"
 nd_vjn_temple_maintenance_desc: "Imperial endowment of the temple's daily ritual: pottery vessels, masonry repair, beeswax for lamps, and incense for the sanctum."

 nd_vjn_amara_nayaka_estate: "Amara-Nayaka Estate"
 nd_vjn_amara_nayaka_estate_desc: "Fortified manorial seat of an amara-nayaka — a military lord holding territory in exchange for cavalry, infantry, elephants, and forts. The backbone of Karnata military organization."
 nd_vjn_nayaka_maintenance: "Nayaka Establishment"
 nd_vjn_nayaka_maintenance_desc: "Maintenance of the amara-nayaka's troop quota: war horses, weaponry, livestock for retinue and rations, cloth for uniforms and tents."

 nd_vjn_tungabhadra_anicut: "Tungabhadra Anicut"
 nd_vjn_tungabhadra_anicut_desc: "Earthen tank fed by an anicut diversion-dam. The Hiriya canal model: monsoon flows captured into reservoirs, channels feeding paddy and orchard. The imperial agricultural foundation."
 nd_vjn_anicut_maintenance: "Anicut Upkeep"
 nd_vjn_anicut_maintenance_desc: "Stone facing of the diversion-dam, lumber sluice-gates, and seasonal masonry repair after monsoon flood."

 nd_vjn_bhuvana_vijaya: "Bhuvana Vijaya"
 nd_vjn_bhuvana_vijaya_desc: "The Hall of World-Conquest. Imperial pillared hall housing the court of poets — the Ashtadiggajas — and the literary academies in Telugu, Sanskrit, Kannada, and Tamil. The Karnata court of letters."
 nd_vjn_court_maintenance: "Imperial Patronage"
 nd_vjn_court_maintenance_desc: "Imperial endowment of the literary academy: paper for manuscripts, books for the imperial library, fine cloth for court robes, and incense for ceremonial assemblies."

 nd_vjn_swarnakara_workshop: "Swarnakara Workshop"
 nd_vjn_swarnakara_workshop_desc: "Goldsmith and bronze-caster guild workshop continuing the Chola lost-wax tradition. Processional icons, ritual lamps, jewelry, and sword-fittings flow from Karnata workshops across the Indian Ocean."
 nd_vjn_bronze_casting: "Lost-Wax Bronze Casting"
 nd_vjn_bronze_casting_desc: "Copper and tin alloyed by the lost-wax method into tools, fittings, and ritual ware. The Dravidian metallurgical signature."
 nd_vjn_chola_bronzework_tradition: "Chola Bronzework Tradition"
 nd_vjn_chola_bronzework_tradition_desc: "The Chola lost-wax tradition that produced the Nataraja and the Tirupati bronzes is preserved in the imperial swarnakara workshops. Processional icons, royal jewelry, and ritual lamps now flow from Karnata workshops to courts and temples across the Indian Ocean."
 nd_vjn_pulicat_emporia: "Pulicat Emporia"
 nd_vjn_pulicat_emporia_desc: "Madras, Pulicat, Masulipatnam, Sadras, Pondicherry: the Coromandel coast emporia handle the empire's spice and textile trade. Imperial factors negotiate with European trading companies on Karnata terms."
 nd_vjn_imperial_cannon_doctrine: "Imperial Cannon Doctrine"
 nd_vjn_imperial_cannon_doctrine_desc: "The swarnakara workshops are reorganized as imperial cannon-foundries, casting bronze and iron field-pieces for the Karnata army. The Dravidian metallurgical tradition turns its skill from temple bell to siege gun."
 nd_vjn_modernized_garrisons: "Modernized Nayaka Garrisons"
 nd_vjn_modernized_garrisons_desc: "Amara-nayaka troop quotas modernize: firearms in place of swords and bows, drilled musketry, standardized uniforms. The feudal-military estate becomes a modern garrison without losing its territorial character."
 nd_vjn_pulicat_factory: "Pulicat Factory"
 nd_vjn_pulicat_factory_desc: "Karnata coastal trade factory and warehouse complex. Storehouses, customs posts, factor's quarters, and quayside loading docks for the Coromandel cotton, indigo, and spice trade."
 nd_vjn_pulicat_maintenance: "Factory Operations"
 nd_vjn_pulicat_maintenance_desc: "Maintenance of the factory's warehouses, dye-vats, and accounting offices: cloth bales, pottery containers, fine-cloth samples for buyers, and incense for the factor's reception hall."
 nd_vjn_chola_bronzework: "Chola Bronzework"
 nd_vjn_chola_bronzework_desc: "Premium lost-wax bronze casting: processional icons, jewelry, and ceremonial ware. The output of the Karnata swarnakara guilds at their imperial peak."
 nd_vjn_imperial_cannon_foundry: "Imperial Cannon Foundry"
 nd_vjn_imperial_cannon_foundry_desc: "The Karnata swarnakara guilds turned to imperial cannon-casting: bronze and iron field-pieces for the army of the south."
 nd_vjn_modernized_nayaka_garrison: "Modernized Nayaka Garrison"
 nd_vjn_modernized_nayaka_garrison_desc: "Firearm-equipped, drilled garrison troops sustaining the amara-nayaka quota in the modern age."

 # ============================================================
 # DESTINY TREE
 # ============================================================

 # ---- Destiny advance names and descriptions ----
 nd_vjn_destiny: "The Karnata Destiny"
 nd_vjn_destiny_desc: "Vijayanagara is restored: the imperial gopurams rise above Hampi and the southern peoples gather under the saffron Varaha. But what shall the empire become? Two long-term projects beckon — the great work of dharma in the north, and the great work of the Indian Ocean. Stability above all is required to undertake either."

 nd_vjn_dest_bahmani_frontier: "March on the Bahmani Frontier"
 nd_vjn_dest_bahmani_frontier_desc: "The successor sultanates of the Bahmani — Bidar and Bijapur first among them — sit across the Krishna and the Tungabhadra, the very gates of imperial expansion northward. The Karnata host must reclaim them before the Deccan plateau itself can be called Vijayanagara's."

 nd_vjn_dest_deccan_plateau: "Reclaim the Deccan Plateau"
 nd_vjn_dest_deccan_plateau_desc: "Beyond Bidar and Bijapur lie Gulbarga, Daulatabad, and Ahmednagar — the Bahmani heartland and the great Tughluq capital that once tried to swallow the south. To take them is to reverse the southward conquest of the fourteenth century and reset the imperial frontier on the Tapti."

 nd_vjn_dest_imperial_heartland: "The Imperial Heartland Restored"
 nd_vjn_dest_imperial_heartland_desc: "From Surat on the Gujarat coast to Agra in the Yamuna basin, from Golconda's diamond mines to Warangal's ancient citadel — the Karnata empire claims the imperial frontiers of an undivided dharma-raj. The Diwan-Khana of the south rises in Hampi, a chancery worthy of the heir of Bharata."

 nd_vjn_dest_konkan_thalassocracy: "The Konkan Thalassocracy"
 nd_vjn_dest_konkan_thalassocracy_desc: "The Konkan coast — Bombay's harbor, Goa's Portuguese-built quays — is the empire's first ocean. To control it is to set the dharma-banner over the Arabian Sea trade and to receive horse, silver, and ship-timber on the empire's own terms."

 nd_vjn_dest_lanka_maldives: "Lanka and the Maldive Atolls"
 nd_vjn_dest_lanka_maldives_desc: "Sri Lanka — Kotte, Kandy — and the long arc of Maldive atolls lie astride the trade lanes from East Africa to Sumatra. To plant the imperial banner there is to take the keys to the Indian Ocean. Global trade-knowledge must spread among the imperial merchants first."

 nd_vjn_dest_indian_ocean_apex: "Lord of the Indian Ocean"
 nd_vjn_dest_indian_ocean_apex_desc: "Malacca to the east, Hormuz to the west, Aden at the gate of the Red Sea: the three pivots of the Indian Ocean. To hold them is to be sovereign of the largest trade ocean on earth. The Coromandel Bourse rises at Pulicat to clear the world's silk and spice."

 # ---- Destiny event 7: root ----
 nd_vjn.7.t: "The Karnata Destiny"
 nd_vjn.7.d: "From the Tungabhadra granite, from the throne of Hampi, the empire surveys the work of generations to come. The Saluva, Tuluva, and Aravidu lines have founded a dharma-raj that no Sultanate's coalition can break; the matha pontiffs have blessed the imperial regalia; the swarnakara guilds have cast a Garuda-banner of bronze and gold. Now the long work begins. Two destinies open. One faces north — to reclaim the Deccan plateau and beyond, to undo the conquest of the fourteenth century, to restore the heartland of dharma in the imperial heart of Bharata. One faces seaward — to inherit the Indian Ocean, to plant the imperial banner on Lanka, the Maldives, Malacca, Hormuz, Aden, and to build the trade-empire that no European company can match. The court chooses; the empire commits."
 nd_vjn.7.a: "Let the destiny of Vijayanagara unfold."

 # ---- Destiny event 8: Bahmani Frontier ----
 nd_vjn.8.t: "The Krishna Crossed"
 nd_vjn.8.d: "Bidar's walls have fallen; Bijapur's nobles have surrendered the citadel. The Krishna has been crossed in force, and the imperial banners ride into the open Deccan plateau for the first time since the Tughluq invasions of the fourteenth century. Across the empire, temple bells ring; the Sringeri matha sends gold-leaf manuscripts to Hampi; the amara-nayakas swear new oaths on the dust of the conquered fortresses. The Bahmani frontier — the southern boundary of dharma's eclipse for two centuries — is no more."
 nd_vjn.8.a: "Onward to the Tapti and the Narmada."

 # ---- Destiny event 9: Reclaim the Deccan ----
 nd_vjn.9.t: "Daulatabad Restored"
 nd_vjn.9.d: "The great fortress of Daulatabad — Devagiri before the Tughluqs renamed it, the rock-citadel that Muhammad bin Tughluq tried to make the capital of his collapsing empire — is in Karnata hands. Gulbarga, the original Bahmani capital, has surrendered. Ahmednagar's nobles fly the Garuda. The Deccan plateau, from the Tapti to the Krishna, is restored to dharma. Two questions face the court: how to disburse the conquered wealth, and how to hold the new frontier."
 nd_vjn.9.a: "Distribute the Sultanate treasures: refill the imperial coffers"
 nd_vjn.9.b: "Garrison the Deccan: hold every fort, finance with war loans"

 STATIC_MODIFIER_NAME_nd_vjn_dest_sultanate_treasure: "Treasures of the Sultanate"
 STATIC_MODIFIER_DESC_nd_vjn_dest_sultanate_treasure: "The looted wealth of Daulatabad and Bidar floods the imperial treasury and the temple endowments. Prosperity rises across the empire; but the legitimacy-cost of plundering ancient cities weighs on the imperial conscience."

 STATIC_MODIFIER_NAME_nd_vjn_dest_deccan_garrisoned: "Deccan Garrisoned"
 STATIC_MODIFIER_DESC_nd_vjn_dest_deccan_garrisoned: "Every Bahmani fort holds a Karnata garrison, financed by imperial war-loans from Hampi's banking houses. The empire's logistical reach extends across the plateau and the casus belli of dharma-restoration carries new weight; the loan-interest is a price worth paying."

 # ---- Destiny event 10: Imperial Heartland ----
 nd_vjn.10.t: "The Empire of Bharata"
 nd_vjn.10.d: "From Surat on the Gujarati coast — where the Mughal emperor Akbar will not now sit — through Agra and the Yamuna basin, through Golconda's diamond country, to Warangal's old Kakatiya citadel: the imperial frontier has reached the high-water mark of every great south-Indian dynasty before. The Diwan-Khana rises at Hampi, a chancery whose vaulted halls speak Telugu, Sanskrit, Persian, and Marathi. The court must decide what kind of empire to be: an empire of dharma's peace, or the chakravartin's empire of universal sovereignty."
 nd_vjn.10.a: "Dharma Paramount: rule by the imperial peace"
 nd_vjn.10.b: "Chakravartin: claim universal sovereignty over Bharata"

 STATIC_MODIFIER_NAME_nd_vjn_dest_dharma_paramount: "Dharma Paramount"
 STATIC_MODIFIER_DESC_nd_vjn_dest_dharma_paramount: "The empire rules through dharma's peace: tolerant of every Hindu strand and every other strand, ruling by negotiation and example. The court is alive with purpose, and the empire's diplomacy carries the weight of moral authority."

 STATIC_MODIFIER_NAME_nd_vjn_dest_chakravartin: "Chakravartin"
 STATIC_MODIFIER_DESC_nd_vjn_dest_chakravartin: "The emperor takes the title chakravartin — universal monarch, wheel-turner, sovereign of the four directions. Subjects of every kind serve the imperial wheel; the prestige of the empire's name does not fade; new wars open before it as the wheel turns."

 # ---- Destiny event 11: Konkan Thalassocracy ----
 nd_vjn.11.t: "The Arabian Sea is Ours"
 nd_vjn.11.d: "Goa's quays — built by the Portuguese, repaired by Karnata craftsmen — and Bombay's deepwater harbor now fly the Garuda banner. Imperial squadrons of shallow-draft frigates patrol the Konkan coast from Sindhudurg to Bhatkal. Arabian horse, Persian silver, Yemeni coffee, and Aceh pepper now flow through Karnata factors at terms set in Hampi. The empire has become an ocean-power, and the long thalassocracy of the south begins."
 nd_vjn.11.a: "The Arabian Sea is the empire's first lake."

 # ---- Destiny event 12: Lanka and Maldives ----
 nd_vjn.12.t: "The Pearl of the South"
 nd_vjn.12.d: "Kotte's tooth-relic, Kandy's hill-citadel, and the long arc of the Maldive atolls — Male, Addu, Thiladhunmathi — are imperial possessions. The pearl-fisheries of Mannar and the cowrie-currency of the Maldives flow into the imperial economy. The Theravada sangha of Lanka has been honored at Hampi; the Maldive sultans serve as imperial vassals. Two strategies suggest themselves: rule Lanka as a directly-governed imperial province, or knit the atolls into a far-flung trading-factor network."
 nd_vjn.12.a: "Lanka as imperial province: direct rule, monumental rebuilding"
 nd_vjn.12.b: "Maldive trade factories: light-touch network of imperial agents"

 STATIC_MODIFIER_NAME_nd_vjn_dest_lanka_dominion: "The Lanka Dominion"
 STATIC_MODIFIER_DESC_nd_vjn_dest_lanka_dominion: "Sri Lanka is governed as a directly-administered imperial province. Imperial roads, monumental temple-rebuilding, and devastation-recovery brigades restore the island. The empire's colonial reach extends, and the inflation of conquered specie is checked by orderly administration."

 STATIC_MODIFIER_NAME_nd_vjn_dest_maldive_factor: "The Maldive Factor Network"
 STATIC_MODIFIER_DESC_nd_vjn_dest_maldive_factor: "Imperial factors are stationed across the Maldive atolls, Lanka's southern ports, and the Laccadive coast. Merchant-establishment costs collapse; merchant capacity grows; imperial squadrons enforce blockades against any rival who dares the southern seas."

 # ---- Destiny event 13: Lord of the Indian Ocean ----
 nd_vjn.13.t: "Lord of Three Oceans"
 nd_vjn.13.d: "Malacca, Hormuz, Aden: the three pivots of the Indian Ocean trade. Malacca on the strait that separates the Bay of Bengal from the South China Sea; Hormuz on the strait that gates the Persian Gulf; Aden at the bottleneck of the Red Sea. The empire that holds all three is sovereign of the trade-ocean, lord of the silk and spice that flows from Canton to Lisbon. The Coromandel Imperial Bourse rises at Pulicat — the largest customs-house and exchange in the Indian Ocean. The empire stands at its trade-empire zenith."
 nd_vjn.13.a: "The Karnata Pax of the Seas: imperial fleets enforce the order"
 nd_vjn.13.b: "Imperial trading companies: chartered factors run the network"

 STATIC_MODIFIER_NAME_nd_vjn_dest_sea_lords: "The Karnata Pax of the Seas"
 STATIC_MODIFIER_DESC_nd_vjn_dest_sea_lords: "The imperial fleet enforces the peace of three oceans. Heavy ships of the line and light frigates together; reinforced hulls; rigorously trained crews. No European company's squadron can match the empire's order of battle in the Indian Ocean."

 STATIC_MODIFIER_NAME_nd_vjn_dest_factory_companies: "Imperial Trading Companies"
 STATIC_MODIFIER_DESC_nd_vjn_dest_factory_companies: "Chartered Karnata trading companies — modeled on the European pattern, but answering to Hampi — run the Indian Ocean factory network. Imperial migration flows outward; exploration expands the network. The army at home grows expensive to reinforce as the best men find their fortunes overseas."

 # ---- Destiny path tooltip refinements (existing keys; restated for clarity) ----
 # nd_vjn_path_a_tt and nd_vjn_path_b_tt already defined above

 # ---- Destiny buildings ----
 nd_vjn_imperial_diwan_khana: "Imperial Diwan-Khana"
 nd_vjn_imperial_diwan_khana_desc: "The chancery of a restored empire. Vaulted halls in a Hindu-imperial register that echoes the Tughluq and Bahmani palaces of the north — a deliberate visual claim on the architectural inheritance of the Deccan plateau, now restored to dharma. Every imperial decree affecting Bharata passes through these halls."
 nd_vjn_diwan_maintenance: "Chancery Operations"
 nd_vjn_diwan_maintenance_desc: "Maintenance of the imperial chancery: paper for grants and farmans, fine cloth for ceremonial robes, furniture for the long councils, tools for the seal-cutters and scribes."

 nd_vjn_coromandel_bourse: "Coromandel Imperial Bourse"
 nd_vjn_coromandel_bourse_desc: "The grand customs-house and trading exchange of the Karnata Indian Ocean empire. A pillared coastal hall where imperial factors clear silk from Canton, spice from Malacca, horse from Hormuz, coffee from Aden, and Coromandel cotton bound for half the world. The financial heart of the southern thalassocracy."
 nd_vjn_bourse_maintenance: "Bourse Operations"
 nd_vjn_bourse_maintenance_desc: "Maintenance of the imperial bourse: paper for ledgers and bills of exchange, fine cloth for factor robes, cloth bales as standard exchange samples, tools for the assayers and customs-house officials."

 # === BUREAUCRACIES ===

 AUTO_MODIFIER_NAME_nd_vjn_bureaucracy_authority: "Karnata Imperial Authority"
 AUTO_MODIFIER_DESC_nd_vjn_bureaucracy_authority: "The restored Vijayanagara state inherits the institutional framework of the Sangama, Saluva, Tuluva, and Aravidu dynasties. Two bureaucracy slots are unlocked, with the imperial capital at Hampi adding a third by virtue of being the seat of the Sri-Virupaksha mandate."

 vjn_pampa_virupaksha_bureaucracy: "Pampa-Virupaksha Devasthanam"
 vjn_pampa_virupaksha_bureaucracy_desc: "The imperial Saiva temple complex at Hampi, where Virupaksha (a form of Shiva) was installed as tutelary deity of the empire. From Harihara I in 1336, royal grants and edicts were issued in the god's name -- the emperor styled himself merely the deity's deputy, and the Pampakshetra ritual centered the Tungabhadra valley as sacred geography. The devasthanam administered temple lands, brahmadeya grants, and the donative economy that bound the Sangama and Tuluva courts to the Saiva clerical establishment."

 vjn_diwan_kacheri_bureaucracy: "Diwan-Kacheri"
 vjn_diwan_kacheri_bureaucracy_desc: "The imperial chancery and revenue bureau formalized under Krishnadeva Raya (r. 1509-1529) and described in his Telugu political treatise the Amuktamalyada. The Pradhani (chief minister) headed eight ministerial portfolios; the Rayasam corps of royal scribes issued sasanas (copperplate edicts) across the realm in Kannada, Telugu, Tamil, and Sanskrit. The Diwan-Kacheri retained a strong oral-Sanskritic legal tradition alongside Telugu-language administration, distinguishing it from the contemporary Persianate chanceries of the Deccan sultanates."

 vjn_tirumala_devasthanam_bureaucracy: "Tirumala Devasthanam"
 vjn_tirumala_devasthanam_bureaucracy_desc: "The Vaishnava temple of Venkateswara on the Tirumala hills above Tirupati. Krishnadeva Raya's seven personal visits and lavish endowments (1513-1521) made the shrine the Vaishnava counterpart to the Saiva Pampa-Virupaksha at Hampi, balancing the empire's religious patronage. By the late sixteenth century Tirumala had become the wealthiest temple in early-modern South India through pilgrim hundi cash offerings, grain reserves, and a parallel temple-banking system that lent at favourable rates to merchants and Nayaka aristocrats."

 vjn_coromandel_customs_bureaucracy: "Coromandel Customs"
 vjn_coromandel_customs_bureaucracy_desc: "The eastern-coast revenue apparatus administering Pulicat, Negapatnam, San Thome (Mylapore), and Masulipatnam. The Vijayanagara state collected sungam (transit duties) through imperially-appointed Adhikari port-governors and licensed the Ayyavole 500 and Manigramam merchant guilds to handle long-distance Indian Ocean trade. Portuguese, Persian, and later Dutch factors paid customs in cash and bullion; Coromandel textiles reached as far as Aceh, Pegu, and the Spice Islands."
