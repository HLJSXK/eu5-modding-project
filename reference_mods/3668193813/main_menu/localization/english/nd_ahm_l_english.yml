l_english:
 # Formation Event
 nd_ahm.1.t: "The Swargadeo's Mandate Restored"
 nd_ahm.1.d: "Six centuries since Sukaphaa led his Tai band over the Patkai passes into the Brahmaputra valley, the Swargadeo's banner is raised again over Charaideo. The maidam mounds of seventeen kings stand untouched on the ridge above us. The paik bells ring across the valley calling every household to service. The seven Borgohain offices await their charters, the Borphukan rides out toward Guwahati, and the namghars of Sankardev's disciples are filling with gathered villagers. The Mughals battered themselves seventeen times against this kingdom and broke; now we choose what shape the unconquered realm will take.\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_ahm.1.a: "Restore the Swargadeo's Tai mandate"
 nd_ahm.1.b: "Embrace Sankardev's Vaishnava dharma"

 # DHE Battle of Saraighat
 nd_ahm.2.t: "Lachit Borphukan on the Brahmaputra"
 nd_ahm.2.d: "Ram Singh's Mughal armada lies anchored off Saraighat. Lachit Borphukan, dying of fever and carried in a litter, has refused to retreat. Tonight the Borphukan calls his commanders together: should the bachari fleet ambush the Mughal warships at the river bend where the Brahmaputra narrows, or should we burn our own villages, retreat into the hills, and let monsoon and jungle do the killing? The Mughals have never lost a campaign, but they have also never fought in our country."
 nd_ahm.2.a: "Strike at the river bend — let the Brahmaputra be their grave"
 nd_ahm.2.b: "Burn the valley — let the jungle and monsoon kill them"

 # DHE Sankardev's Vaishnavism
 nd_ahm.3.t: "The Bhakti of Srimanta Sankardev"
 nd_ahm.3.d: "Srimanta Sankardev has come down from the Mahapurusha pilgrimage with the Eka-Sarana — devotion to one God, accessible without Brahmin priests, sung in Assamese in the namghars of every village. The satras are filling with disciples. The Brahmin orthodoxy at our court calls it heresy. The Bodo and Kachari peoples find a path into our religion that does not require they abandon their gods. The Swargadeo must rule on what Eka-Sarana means for the kingdom."
 nd_ahm.3.a: "Make Eka-Sarana the kingdom's faith"
 nd_ahm.3.b: "Let the namghars stand beside the old shrines"

 # DHE Buranji Tradition
 nd_ahm.4.t: "The Buranjis of the Court"
 nd_ahm.4.d: "The court historians have completed the latest volume of the Buranji — chronicling the reigns of the Swargadeos, the embassies received, the wars fought, the lineages of the great offices. Written first in the Tai-Ahom script and now translated into Assamese, the Buranjis are the kingdom's memory. Few states in South Asia keep records as systematic as ours; few rulers can speak with the authority of six centuries of documented dynastic continuity. The court orders the chronicles formally codified and copies sent to every satra."
 nd_ahm.4.a: "The Buranjis preserve the realm's memory"

 # DHE Paik Codification
 nd_ahm.5.t: "The Paik Roll"
 nd_ahm.5.d: "Every adult man in the valley owes service. The Borgohain ministers have completed the great paik census: each household contributes one paik to the state, organized into got of three or four men, assigned to one of the great offices. Three paiks support the fourth in the field. The militia of the kingdom, its labor for road and dyke and dockyard, its tax base — all derive from this single institution. With the rolls codified, no Swargadeo will rule without knowing the strength of his realm to the man."
 nd_ahm.5.a: "The paik system is the spine of the kingdom"

 # Static Modifiers
 STATIC_MODIFIER_NAME_nd_ahm_swargadeo_mandate: "Swargadeo's Mandate"
 STATIC_MODIFIER_DESC_nd_ahm_swargadeo_mandate: "The Tai-Ahom restoration: paik corvee, Buranji court, the seven great offices, and the riding tradition of dragoon nobility — the unconquered realm of Sukaphaa's heirs."
 STATIC_MODIFIER_NAME_nd_ahm_eka_sarana_dharma: "Eka-Sarana Dharma"
 STATIC_MODIFIER_DESC_nd_ahm_eka_sarana_dharma: "Sankardev's neo-Vaishnavism as the kingdom's organizing principle: namghar in every village, satra at every district, devotion accessible to all castes and the hill peoples alike."
 STATIC_MODIFIER_NAME_nd_ahm_lachit_naval_doctrine: "Lachit's River Doctrine"
 STATIC_MODIFIER_DESC_nd_ahm_lachit_naval_doctrine: "The Brahmaputra is our wall. The bachari fleet patrols the bends; the riverine cannon answers from the fortified banks; no Mughal armada will pass."
 STATIC_MODIFIER_NAME_nd_ahm_jungle_resistance: "Jungle Resistance"
 STATIC_MODIFIER_DESC_nd_ahm_jungle_resistance: "Burnt villages, withdrawn population, hill ambushes, monsoon attrition — the invader fights mosquitoes and starvation more than soldiers."
 STATIC_MODIFIER_NAME_nd_ahm_official_vaishnavism: "Official Vaishnavism"
 STATIC_MODIFIER_DESC_nd_ahm_official_vaishnavism: "Eka-Sarana as state religion: namghar attendance compulsory, satra patronage central, the hill peoples drawn into the Sanskritized fold."
 STATIC_MODIFIER_NAME_nd_ahm_religious_pluralism: "Religious Pluralism"
 STATIC_MODIFIER_DESC_nd_ahm_religious_pluralism: "Tai shrines, Saiva temples, Vaishnava namghars, and tribal sacred groves all under the Swargadeo's protection — the religion of the realm is the religion of every village."
 STATIC_MODIFIER_NAME_nd_ahm_buranji_court: "Buranji Court"
 STATIC_MODIFIER_DESC_nd_ahm_buranji_court: "Six centuries of documented dynastic continuity, copied into every satra and quoted in every diplomatic exchange — a state with longer memory than any of its rivals."
 STATIC_MODIFIER_NAME_nd_ahm_paik_codified: "Paik Codified"
 STATIC_MODIFIER_DESC_nd_ahm_paik_codified: "Every adult male in the rolls, every got of four assigned to its office, every dyke and road and dockyard built by paik labor — the kingdom mobilized to the household."

 # Advances
 nd_ahm_paik_system: "The Paik System"
 nd_ahm_paik_system_desc: "The corvee labor institution that organized every adult Ahom male into a got of four and assigned each to one of the great offices. The kingdom's militia, its public works, and its tax base all derive from the paik."
 nd_ahm_buranji_tradition: "Buranji Chronicles"
 nd_ahm_buranji_tradition_desc: "The court chronicle tradition begun under Sukaphaa, written first in Tai-Ahom and later in Assamese — one of the great historiographies of South Asia and the documentary backbone of dynastic continuity."
 nd_ahm_charaideo_maidam: "Charaideo Maidams"
 nd_ahm_charaideo_maidam_desc: "The royal mound necropolis at Charaideo where Tai-derived burial tradition continued through six centuries of Ahom kings, the spiritual heart of the kingdom and the legitimating site of every coronation."
 nd_ahm_borgohain_offices: "The Seven Great Offices"
 nd_ahm_borgohain_offices_desc: "Burhagohain, Borgohain, Borpatrogohain, Borphukan, Borbarua and the lesser offices — a council nobility that balanced royal authority and administered the kingdom from Charaideo to Guwahati."
 nd_ahm_hill_auxiliaries: "Hill Auxiliaries"
 nd_ahm_hill_auxiliaries_desc: "Garo, Naga, Bodo, and Kachari fighters drawn into Ahom service through paid alliance and corvee exemption, masters of the jungle terrain that broke every invading army."
 nd_ahm_riverine_fleet: "The Brahmaputra Fleet"
 nd_ahm_riverine_fleet_desc: "Bachari and kosa — light gun-armed riverboats forming the patrol fleet that controlled the Brahmaputra's bends and choke points under the Borphukan's command."
 nd_ahm_namghar_network: "Namghar Network"
 nd_ahm_namghar_network_desc: "Sankardev's neo-Vaishnava prayer hall, the village-level institution of the Eka-Sarana religion that bound hill, valley, and river under shared devotional ritual."
 nd_ahm_eka_sarana_movement: "The Eka-Sarana Movement"
 nd_ahm_eka_sarana_movement_desc: "Srimanta Sankardev's bhakti reform: devotion to one God in vernacular Assamese, accessible without Brahmin priests, drawing in tribal and lower-caste worshippers alike."
 nd_ahm_tai_dragoons: "Tai Dragoons"
 nd_ahm_tai_dragoons_desc: "Mounted infantry of the Ahom court, descendants of the Tai cavalry tradition that crossed the Patkai with Sukaphaa, the elite striking arm of the realm."
 nd_ahm_saraighat_doctrine: "Saraighat Doctrine"
 nd_ahm_saraighat_doctrine_desc: "Lachit Borphukan's naval-and-land tactics that destroyed the Mughal fleet at Saraighat in 1671 — coordinated bachari ambush, riverbank artillery, and elite marine assault."
 nd_ahm_dolakharia_dockyard: "Dolakharia Dockyard"
 nd_ahm_dolakharia_dockyard_desc: "The Borphukan's naval headquarters at Guwahati, the river fortress and shipyard controlling the Brahmaputra mouth where the kingdom met the Mughal frontier."
 nd_ahm_satra_monasteries: "Satra Monasteries"
 nd_ahm_satra_monasteries_desc: "Sankardev's institutional successors — monastic complexes that became economic, cultural, and political powers in their own right, repositories of manuscript scholarship and Vaishnava reform."
 nd_ahm_seventeen_invasions: "Seventeen Invasions Repulsed"
 nd_ahm_seventeen_invasions_desc: "From Turbak's raid in 1532 through the Mughal campaigns of the 1660s and 1670s, every imperial expedition into Assam broke against jungle, monsoon, and the Borphukan's defenses."
 nd_ahm_brahmaputra_command: "Brahmaputra Command"
 nd_ahm_brahmaputra_command_desc: "The river as logistics highway and barrier, enabling rapid Ahom movement, denying enemies supply, and binding the valley together where roads could not reach."
 nd_ahm_jaibanmar_artillery: "Jaibanmar Artillery"
 nd_ahm_jaibanmar_artillery_desc: "The Ahom heavy gunnery corps, blending Indian and Persian designs into field and riverine artillery — swivel guns on warships, jaiban cannon in fortified positions."
 nd_ahm_ryotwari_paik: "Rudra Singha's Paik Reform"
 nd_ahm_ryotwari_paik_desc: "Rudra Singha's restructuring of the corvee system formalizing military service, public works obligation, and revenue assessment in a single integrated institution."
 nd_ahm_muga_silk: "Muga Silk Cultivation"
 nd_ahm_muga_silk_desc: "Assam's golden silk, produced from the Antheraea assamensis silkworm — a textile unique to the Brahmaputra valley and the kingdom's most distinctive luxury export."
 nd_ahm_chronicle_codification: "Chronicle Codification"
 nd_ahm_chronicle_codification_desc: "The court historians' formal codification of the Buranjis under Rudra Singha, fixing dynastic and administrative records as the legitimating documentary corpus of the realm."
 nd_ahm_modern_paltan: "Modern Paltan Drill"
 nd_ahm_modern_paltan_desc: "European-influenced infantry drill blended with paik recruitment, the modernizing reforms adopted in the late Ahom period to face firearm-equipped Burmese and British armies."
 nd_ahm_assam_tea: "Assam Tea Cultivation"
 nd_ahm_assam_tea_desc: "The singular crop that came to define the Brahmaputra valley's modern economy — tea plantations developed first under Ahom patronage and later expanded by colonial planters."
 nd_ahm_borphukan_office: "The Borphukan's Viceroyalty"
 nd_ahm_borphukan_office_desc: "The viceroyal governance of Lower Assam from Guwahati, balancing the Swargadeo's court at Rangpur and Charaideo and managing the Mughal frontier."
 nd_ahm_swargadeo_court: "Swargadeo's Court"
 nd_ahm_swargadeo_court_desc: "The absolutist evolution of Ahom kingship under Rudra Singha and Siva Singha, with formal court ceremony, codified law, and patronized Sanskritic high culture."
 nd_ahm_anti_burmese_resistance: "Anti-Burmese Resistance"
 nd_ahm_anti_burmese_resistance_desc: "The brutal Burmese occupation of 1817 to 1826 broke the kingdom but forged a vernacular Assamese identity in resistance, partisan defense binding hill and valley anew."
 nd_ahm_assamese_revival: "Assamese Cultural Revival"
 nd_ahm_assamese_revival_desc: "Vernacular literature, sattriya dance from the satras, and the synthesis of Tai, Bodo, Kachari, and Sanskritic traditions into a unified Assamese cultural identity."
 nd_ahm_brahmaputra_industry: "Brahmaputra Industry"
 nd_ahm_brahmaputra_industry_desc: "Late-period modernization of the river economy with mills, dockyards, and textile works on the Brahmaputra's banks."
 nd_ahm_modernized_levy: "Modernized Paltan Levy"
 nd_ahm_modernized_levy_desc: "The paik corvee system updated to raise European-drilled line infantry, the synthesis of six centuries of Ahom recruitment and modern military doctrine."

 # Buildings
 nd_ahm_paik_office: "Paik Office"
 nd_ahm_paik_office_desc: "Bureau of corvee labor under one of the great offices, organizing the village got of four into the militia, work crews, and revenue base of the kingdom."
 nd_ahm_paik_office_maintenance: "Paik Bureau Operation"
 nd_ahm_paik_office_maintenance_desc: "The clerks, scribes, and overseers maintaining the paik rolls and assigning households to service."
 nd_ahm_buranji_archive: "Buranji Archive"
 nd_ahm_buranji_archive_desc: "The court chronicle scriptorium where Tai-Ahom and Assamese-language histories of the kingdom are written, copied, and stored — the documentary memory of the realm."
 nd_ahm_buranji_maintenance: "Buranji Scriptorium"
 nd_ahm_buranji_maintenance_desc: "Scribes copying chronicle volumes onto sanchipat manuscripts using ink, beeswax, and bound paper covers."
 nd_ahm_maidam_complex: "Charaideo Maidam Complex"
 nd_ahm_maidam_complex_desc: "The royal mound necropolis where Tai-derived burial tradition continued through six centuries of Ahom kings, the spiritual heart of the kingdom."
 nd_ahm_maidam_maintenance: "Maidam Veneration"
 nd_ahm_maidam_maintenance_desc: "Stone-faced earthen mounds maintained with masonry repairs, periodic re-consecration, and the offerings of the royal lineage's living members."
 nd_ahm_namghar: "Namghar"
 nd_ahm_namghar_desc: "Sankardev's village prayer hall, the institutional core of the Eka-Sarana religion: open hall with central scripture stand, communal recitation, and no caste-restricted sanctum."
 nd_ahm_namghar_maintenance: "Namghar Worship"
 nd_ahm_namghar_maintenance_desc: "The daily naam-prasanga gathering, kirtan recitation, and the manuscripts of the Bhagavata Purana that anchor village devotional life."
 nd_ahm_dockyard: "Dolakharia Dockyard"
 nd_ahm_dockyard_desc: "The Borphukan's naval headquarters at Guwahati, the river fortress and shipyard from which the Brahmaputra fleet sallies to meet every Mughal incursion."
 nd_ahm_dockyard_maintenance: "River Fleet Operations"
 nd_ahm_dockyard_maintenance_desc: "Boatwrights, ropewalk laborers, and naval ordnance crews maintaining the bachari and kosa squadrons of the Brahmaputra fleet."
 nd_ahm_satra: "Satra"
 nd_ahm_satra_desc: "Vaishnava monastic complex of the Eka-Sarana lineage — manuscript scriptorium, devotional center, agricultural estate, and political constituency rolled into one institution."
 nd_ahm_satra_maintenance: "Satra Monastic Life"
 nd_ahm_satra_maintenance_desc: "The bhakats and adhikars of the satra at their devotional, scribal, and administrative duties under the satradhikar's authority."
 nd_ahm_muga_silk_processing: "Muga Silk Processing"
 nd_ahm_muga_silk_processing_desc: "The cultivation, reeling, and weaving of Muga silk from the Antheraea assamensis silkworm under satra-organized workshops, producing the kingdom's signature golden cloth."
 nd_ahm_tea_cultivation: "Tea Cultivation"
 nd_ahm_tea_cultivation_desc: "Wild Camellia sinensis assamica brought into satra-supervised cultivation, the first formal tea production in the Brahmaputra valley."
 nd_ahm_river_industry: "Brahmaputra Industrial Works"
 nd_ahm_river_industry_desc: "Modernized riverbank manufactories combining mill, dockyard, and textile works — late-Ahom and post-restoration industrial infrastructure on the Brahmaputra."
 nd_ahm_river_industry_maintenance: "Industrial Operations"
 nd_ahm_river_industry_maintenance_desc: "The carpenters, smiths, and millwrights maintaining the works and producing tools, lumber, and processed metalwork for the regional economy."
 nd_ahm_river_textile_works: "River Textile Works"
 nd_ahm_river_textile_works_desc: "Industrial-scale weaving of cotton and Muga silk fabric for export through the Brahmaputra trade network."

 # Units
 a_nd_ahm_paik_militia: "Paik Militia"
 a_nd_ahm_paik_militia_desc: "Corvee-conscripted footmen, the bulk of every Ahom army — armed with khanda blade, hide shield, and matchlock or bow depending on the era."
 a_nd_ahm_hill_auxiliary: "Hill Auxiliaries"
 a_nd_ahm_hill_auxiliary_desc: "Garo, Naga, Bodo, and Kachari fighters under Ahom command, masters of jungle ambush and the broken hill country surrounding the Brahmaputra valley."
 a_nd_ahm_dragoon: "Tai Dragoons"
 a_nd_ahm_dragoon_desc: "Mounted infantry of the Ahom court — descendants of the Tai cavalry tradition that crossed the Patkai with Sukaphaa, the elite striking arm of the realm."
 a_nd_ahm_borphukan_marines: "Borphukan's Marines"
 a_nd_ahm_borphukan_marines_desc: "Lachit Borphukan's elite naval infantry, victors at Saraighat in 1671 where they boarded and destroyed a Mughal armada on the Brahmaputra."
 a_nd_ahm_jaibanmar: "Jaibanmar Artillery"
 a_nd_ahm_jaibanmar_desc: "Ahom heavy artillery corps, manning the jaiban cannon and swivel guns that combined Indian and Persian gunnery influences."
 a_nd_ahm_paltan: "Modern Paltan"
 a_nd_ahm_paltan_desc: "European-drilled line infantry recruited through paik corvee, the modernizing reforms of the late Ahom period to face firearm-equipped foes."
 a_nd_ahm_assamese_paltan: "Assamese Paltan"
 a_nd_ahm_assamese_paltan_desc: "Modern line infantry raised through paik recruitment, the synthesis of six centuries of Ahom levy tradition and contemporary military drill."
 n_nd_ahm_river_warship: "Brahmaputra Warship"
 n_nd_ahm_river_warship_desc: "Bachari and kosa — light gun-armed riverboats forming the patrol fleet of the Brahmaputra under the Borphukan's command."

 # Variable tooltips (gate the destiny tree)
 nd_ahm_formed_tt: "Has formed the Ahom Kingdom"
 nd_ahm_path_a_tt: "Chose the Swargadeo's Tai mandate"
 nd_ahm_path_b_tt: "Chose Sankardev's Eka-Sarana dharma"

 # ===== DESTINY TREE =====

 # Destiny advances
 nd_ahm_destiny: "The Unconquered Realm"
 nd_ahm_destiny_desc: "Six centuries of Tai-Ahom rule, seventeen Mughal invasions repulsed. The Swargadeo's choice between imperial reach and devotional federation will define what this kingdom becomes."
 nd_ahm_dest_bengal_frontier: "Push to the Surma Valley"
 nd_ahm_dest_bengal_frontier_desc: "Cross the Brahmaputra delta and seize the lower Bengal frontier. Take Sylhet on the Surma and Mymensingh on the Old Brahmaputra to break out of the Assamese basin and into Bengal proper."
 nd_ahm_dest_bengal_core: "Seize Bengal's Capitals"
 nd_ahm_dest_bengal_core_desc: "The Husayn Shahi seats fall before the paik militia. Take Gaur on the Ganges and Sonargaon on the Meghna, the twin capitals of medieval Bengal, and raise an army of fifty regiments to hold the conquered country."
 nd_ahm_dest_imperial_court: "The Swargadeo's Imperium"
 nd_ahm_dest_imperial_court_desc: "Pandua bows, the Burmese frontier breaks at Pinya and Sagaing. The Tai mandate now reaches from the Patkai to the lower Ganges. Build the imperial court that fuses Charaideo dynastic legitimacy with Sanskritic Bengal high culture."
 nd_ahm_dest_satra_outreach: "The Satras Embraced"
 nd_ahm_dest_satra_outreach_desc: "Sankardev's reform crosses into the wider eastern world. With the Renaissance embraced and Muga silk traded through the kingdom's market, the satras become a network reaching beyond the valley."
 nd_ahm_dest_bay_pilgrimage: "The Bay-Coast Pilgrimage"
 nd_ahm_dest_bay_pilgrimage_desc: "Take Chittagong and Khulna, plant satras on the Sundarbans coast, and bind the river-mouths into the Vaishnava network. With the printing press and a treasury of two thousand gold, the devotional federation reaches the sea."
 nd_ahm_dest_pan_vaishnava: "The Pan-Vaishnava Commonwealth"
 nd_ahm_dest_pan_vaishnava_desc: "Mrauk-U, Chandrawip, and Pegu joined under the Swargadeo's protection. With global trade and three thousand gold in the treasury, the Mahapurusha Mahasattra becomes the seat of a maharaja-of-the-east, sovereign of a Bay-coast Vaishnava commonwealth."

 # Destiny event 6 — Root committed
 nd_ahm.6.t: "The Destiny Chosen"
 nd_ahm.6.d: "The Borgohain ministers gather at Charaideo to read the chronicles of the choice just made. The court historians prepare new Buranji volumes; the maidam priests consecrate fresh ground for the kings yet to come; the Borphukan rides east to sound the paik bells. The unconquered kingdom begins its second age."
 nd_ahm.6.a: "The Swargadeo's reign begins anew"

 # Destiny event 7 — Bengal Frontier
 nd_ahm.7.t: "The Surma and the Old Brahmaputra"
 nd_ahm.7.d: "Sylhet has fallen, Mymensingh fallen, the lower Bengal frontier is held by Ahom paiks for the first time in our history. The chronicle says no Tai-Ahom Swargadeo has ever ruled west of the Brahmaputra delta. The chronicle is now wrong. The Husayn Shahi governors retreat to Gaur, dispatching letters of alarm to Delhi. The kingdom has crossed into Bengal."
 nd_ahm.7.a: "The frontier moves west"

 # Destiny event 8 — Bengal Core
 nd_ahm.8.t: "Gaur Falls, Sonargaon Submits"
 nd_ahm.8.d: "Husayn Shahi authority breaks. Gaur, the great Ganges capital, is occupied; Sonargaon on the Meghna submits to Borgohain governance. The Buranji historians begin a new chapter: the kingdom of Sukaphaa now rules from the Patkai to the lower Ganges. The Borgohain council debates how to hold the conquest. Should the paik corvee be extended to the new districts, mobilizing every Bengali household into the imperial machine? Or should the Borgohain offices be transplanted whole, governing through the existing Bengali nobility?"
 nd_ahm.8.a: "Extend paik corvee — every household serves the imperium"
 nd_ahm.8.b: "Transplant Borgohain governance through the local nobility"

 # Destiny event 9 — Imperial Court capstone
 nd_ahm.9.t: "The Imperial Court at Charaideo"
 nd_ahm.9.d: "Pandua submits, Pinya falls, Sagaing's monasteries open their gates. The Swargadeo's banner now flies over a continental imperium reaching from the Burmese hills to the Ganges floodplain. The court at Charaideo is rebuilt as an imperial seat — Sanskritic ceremonial fused to Tai dynastic ritual, Buranji chronicles fused to Persian court historiography. The Borphukan asks the Swargadeo where the realm now turns: continental consolidation, or further into the eastern frontier?"
 nd_ahm.9.a: "Consolidate the Swargadeo's imperium"
 nd_ahm.9.b: "Push further east — break the Burmese frontier"

 # Destiny event 10 — Satra Outreach
 nd_ahm.10.t: "The Satras Reach Outward"
 nd_ahm.10.d: "Muga silk passes through the satra workshops and out to the markets of the wider world; the printing press carries the Bhagavata Purana in Assamese to lay readers across the eastern marches. Sankardev's bhakti reform — once a movement of the upper Brahmaputra — now reaches into the Sundarbans and the hill kingdoms beyond. The namghars are beginning to network."
 nd_ahm.10.a: "Let the Eka-Sarana flow outward"

 # Destiny event 11 — Bay Pilgrimage
 nd_ahm.11.t: "The Sundarbans Open to the Satra"
 nd_ahm.11.d: "Chittagong's port and Khulna's tidal forests now answer to the Swargadeo. The satras send their bhakats down the rivers to plant namghars among the Sundarban fisherfolk and the Chittagong rice planters. The satradhikars debate how the new network should be governed: as a council of equal satras meeting in pilgrimage on the coast, or as a popular Eka-Sarana movement spreading without hierarchy among ordinary villagers?"
 nd_ahm.11.a: "Form the satra council on the Bay coast"
 nd_ahm.11.b: "Let the namghar movement spread among the people"

 # Destiny event 12 — Pan-Vaishnava capstone
 nd_ahm.12.t: "The Maharaja of the East"
 nd_ahm.12.d: "Mrauk-U bows, Chandrawip joins, Pegu's Buddhist court accepts the protective sovereignty of the Swargadeo. The Mahapurusha Mahasattra is consecrated as the seat of a Vaishnava commonwealth stretching from the Sundarbans to the Irrawaddy delta. The Swargadeo is hailed as Maharaja of the East. The court asks how this commonwealth should be ordered: through coastal trade and diplomatic ties to the wider Indian Ocean, or through the satra network alone, an inward-facing federation of devotion?"
 nd_ahm.12.a: "Open the commonwealth to the Bay trade"
 nd_ahm.12.b: "Bind the federation through satra alone"

 # Variable tooltip already declared above

 # Destiny static modifiers
 STATIC_MODIFIER_NAME_nd_ahm_dest_paik_imperial: "Paik Imperium"
 STATIC_MODIFIER_DESC_nd_ahm_dest_paik_imperial: "Every household in conquered Bengal entered onto the paik rolls — the corvee system extended continentally, the imperial machine mobilized to the village."
 STATIC_MODIFIER_NAME_nd_ahm_dest_borgohain_governance: "Borgohain Governance"
 STATIC_MODIFIER_DESC_nd_ahm_dest_borgohain_governance: "The seven great offices transplanted into Bengal, ruling through the existing zamindari nobility — slower mobilization but smoother absorption of the conquered country."
 STATIC_MODIFIER_NAME_nd_ahm_dest_swargadeo_imperium: "Swargadeo's Imperium"
 STATIC_MODIFIER_DESC_nd_ahm_dest_swargadeo_imperium: "Charaideo rebuilt as an imperial seat, garrisons knit across the continent, the Buranjis revised to record a kingdom reaching from the Patkai to the lower Ganges."
 STATIC_MODIFIER_NAME_nd_ahm_dest_burmese_frontier: "Burmese Frontier"
 STATIC_MODIFIER_DESC_nd_ahm_dest_burmese_frontier: "The Patkai crossed in the other direction. Riverine fleets on the Irrawaddy, paik garrisons in the dry zone, the Tai dragoons riding the upper Burma plain."
 STATIC_MODIFIER_NAME_nd_ahm_dest_satra_diplomacy: "Satra Diplomacy"
 STATIC_MODIFIER_DESC_nd_ahm_dest_satra_diplomacy: "The bhakats serve as envoys; the satras as embassies. Sankardev's reform travels the trade routes of the Bay coast under the Swargadeo's seal."
 STATIC_MODIFIER_NAME_nd_ahm_dest_namghar_outreach: "Namghar Outreach"
 STATIC_MODIFIER_DESC_nd_ahm_dest_namghar_outreach: "The Eka-Sarana movement runs ahead of the satra hierarchy — namghars in every fishing village, lay devotion among the Sundarban rice planters and the Chittagong coast."
 STATIC_MODIFIER_NAME_nd_ahm_dest_eastern_maharaja: "Maharaja of the East"
 STATIC_MODIFIER_DESC_nd_ahm_dest_eastern_maharaja: "The Bay-coast commonwealth bound by trade — Chittagong, Mrauk-U, Pegu under the Swargadeo's protective sovereignty, the Indian Ocean envoys arriving at Charaideo."
 STATIC_MODIFIER_NAME_nd_ahm_dest_satra_commonwealth: "Satra Commonwealth"
 STATIC_MODIFIER_DESC_nd_ahm_dest_satra_commonwealth: "An inward-facing federation of namghars and satras stretching from the Brahmaputra to the Irrawaddy, bound by devotion rather than markets — the Mahapurusha lineage as the constitution of the realm."

 # Destiny buildings
 nd_ahm_imperial_court: "Imperial Court"
 nd_ahm_imperial_court_desc: "The capstone of Path A: a Tai-Hindu syncretic court combining Charaideo dynastic ritual with Sanskritic Bengal high culture, seat of the Swargadeo's continental imperium."
 nd_ahm_imperial_court_maintenance: "Imperial Court Ceremonial"
 nd_ahm_imperial_court_maintenance_desc: "Court silks, ceremonial paper, lacquered furniture, and ritual incense maintaining the imperial protocol of the Swargadeo's syncretic court."
 nd_ahm_mahapurusha_satra: "Mahapurusha Mahasattra"
 nd_ahm_mahapurusha_satra_desc: "The capstone of Path B: the great satra of the Mahapurusha lineage, seat of the satradhikar of the pan-Vaishnava commonwealth and node of the Bay-coast namghar network."
 nd_ahm_mahapurusha_maintenance: "Mahasattra Worship"
 nd_ahm_mahapurusha_maintenance_desc: "Manuscript copying, beeswax votive lamps, incense for the daily naam-prasanga, and printed books carried by the bhakats to the satras of the wider commonwealth."

 # Bureaucracy: institutional layers of the Tai-Ahom polity
 ahm_patro_mantri_sabha_bureaucracy: "Patro Mantri Sabha"
 ahm_patro_mantri_sabha_bureaucracy_desc: "The standing council of the Seven Great Offices -- the Burhagohain, Borgohain, Borpatrogohain, Borphukan, Borbarua, Bargohain, and the lesser officers. Codified under Suhungmung (r. 1497-1539) and enlarged under Pratap Singha, the Sabha confirmed succession to the Swargadeo's throne and could depose unfit kings. The Ahom polity's constitutional check distinguished it from its Mughal and Bengali neighbors: the Swargadeo ruled with the council, never above it."
 ahm_paik_khel_bureaucracy: "Paik-Khel Administration"
 ahm_paik_khel_bureaucracy_desc: "The standing corvee bureau under the Likchau paik-roll keepers. Codified under Momai Tamuli Borbarua (1609), every adult male was enrolled into a got of three or four paiks, each paik owing rotating service to a Khel office. Three paiks supported the fourth in militia or labor service. The system manned the bachari river fleet, built the Brahmaputra embankments, and constituted the standing levy that broke the Mughal armies seventeen times across the seventeenth century."
 ahm_buranji_likchau_bureaucracy: "Buranji Likchau"
 ahm_buranji_likchau_bureaucracy_desc: "The institutionalized court chronicle apparatus. The Buranjis -- the word means 'store of unprecedented things' -- were written first in the Tai-Ahom script, later in Assamese. A literate scribal corps attended every court session, every embassy, and every campaign, producing one of the great non-imperial chronicle traditions of South Asia. The Buranjis were consulted as legal precedent and diplomatic record into the nineteenth century, an institutional memory the kingdom's neighbors lacked."
 ahm_sattradhikar_mandali_bureaucracy: "Sattradhikar Mandali"
 ahm_sattradhikar_mandali_bureaucracy_desc: "The institutionalized assembly of Vaishnava monastic authorities, heads of the satras founded under Srimanta Sankardev (1449-1568) and codified by Madhabdev. The great satras -- Auniati, Dakhinpat, Garhmur, Kuruwabahi -- held crown grants of land in debottar and brahmottar tenure, administered their own cultivators, ran the namghar village congregations, and arbitrated disputes outside the Patra Mantri courts. Eka-Sarana devotion offered the Bodo, Kachari, and other valley peoples a path of integration that Brahmanical Hinduism withheld."

 # Auto-modifier: bureaucracy slot grant on formation
 AUTO_MODIFIER_NAME_nd_ahm_bureaucracy_authority: "Ahom Bureaucratic Authority"
 AUTO_MODIFIER_DESC_nd_ahm_bureaucracy_authority: "The Swargadeo's restored mandate confers institutional authority over the Patra Mantri offices. Two bureaucracy slots are granted; the Garhgaon court adds one more."
 nd_ahm_eka_sarana_workshop: "Eka-Sarana Workshop"
 nd_ahm_eka_sarana_workshop_desc: "The production-side complement to the satra. Where the monastery copies scripture and runs prayer, the workshop reels muga silk from cocoons gathered in upper-Assam groves and presses Brahmaputra-valley tea leaf into trade-grade chests. A satra-licensed manufactory under sattradhikar oversight."
 nd_ahm_workshop_muga_silk_pm: "Muga Silk Reeling"
 nd_ahm_workshop_muga_silk_pm_desc: "The golden Antheraea muga silkworms of upper Assam, fed on Som and Sualu trees. Reelers spin the cocoons into the Brahmaputra-valley's signature golden silk, prized in northern Indian and Bhutanese courts."
 nd_ahm_workshop_assam_tea_pm: "Assam Tea Cultivation"
 nd_ahm_workshop_assam_tea_pm_desc: "The Singpho-introduced wild tea of the Brahmaputra-Patkai foothills cultivated as plantation crop, processed in satra-licensed gardens. Brick and chest tea for the inland and Bay of Bengal trade."
