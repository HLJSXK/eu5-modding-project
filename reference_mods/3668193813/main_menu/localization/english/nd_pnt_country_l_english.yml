l_english:
 PNT: "Pintados"
 PNT_ADJ: "Pintados"
 PNT_f: "Pintados Confederation"
 PNT_f_desc: "When the warrior-aristocrats of Panay, Cebu, Samar, Leyte, Bohol, and Negros set aside their feuds and federate, the painted men of the islands rise as one civilization. Bound by the ink of their full-body tattoos, the prayers of their babaylan priestesses, and the long balangay hulls that carry their raid-fleets across the inner seas, the datus pool their honor under a single confederate banner: Kabisay-an, the Pintados, the painted ones of legend. The Spaniards who name them so will find no scattered chiefdoms to pick apart, but a maritime warrior nation forged from the shared blood of every Visayan island."
