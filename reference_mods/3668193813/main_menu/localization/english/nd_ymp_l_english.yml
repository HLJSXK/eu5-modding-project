l_english:
 # === Variable tooltips ===
 nd_ymp_formed_tt: "The Yamato Empire has been proclaimed"
 nd_ymp_path_a_tt: "The empire walks the path of Hideyoshi's continental conquest"
 nd_ymp_path_b_tt: "The empire is governed by the bakufu's continental bureaucracy"
 nd_ymp_path_c_tt: "The empire embodies the Sino-Japanese synthesis"

 # === Static modifier names and descriptions ===
 STATIC_MODIFIER_NAME_nd_ymp_continental_conquest: "Hideyoshi's Continental Conquest"
 STATIC_MODIFIER_DESC_nd_ymp_continental_conquest: "The bakufu rejects sakoku. Samurai armies that crushed Sengoku Japan now march on Korea, Liaodong and the Yangtze. The Imjin invasion of 1592 succeeds where the Taiko died trying."

 STATIC_MODIFIER_NAME_nd_ymp_imperial_bureaucracy: "Tokugawa Imperial Bureaucracy"
 STATIC_MODIFIER_DESC_nd_ymp_imperial_bureaucracy: "Edo administration, projected continentally. Han governors administer Korea and Manchuria. Confucian scholar-officials staff the imperial chancery. The chrysanthemum throne stands above all."

 STATIC_MODIFIER_NAME_nd_ymp_sino_japanese_synthesis: "Sino-Japanese Synthesis"
 STATIC_MODIFIER_DESC_nd_ymp_sino_japanese_synthesis: "Korean letters, Ming scholarship and Japanese ritual fuse into a single East Asian imperial civilization. Three Teachings, one empire. Scholars and samurai are the same caste."

 STATIC_MODIFIER_NAME_nd_ymp_invasion_logistics: "Imjin Invasion Logistics"
 STATIC_MODIFIER_DESC_nd_ymp_invasion_logistics: "Hideyoshi's lesson learned: an army that crosses the sea must be fed across the sea. Continental supply depots replace short-tempo raid logistics."

 STATIC_MODIFIER_NAME_nd_ymp_disciplined_columns: "Disciplined Columns"
 STATIC_MODIFIER_DESC_nd_ymp_disciplined_columns: "Three-rank rotating volley fire and ashigaru column drill, refined by years of campaigning on Korean ground."

 STATIC_MODIFIER_NAME_nd_ymp_yi_sun_sin_legacy: "Yi Sun-sin's Legacy"
 STATIC_MODIFIER_DESC_nd_ymp_yi_sun_sin_legacy: "The admiral defeated us at Hansando. We took his ships. His tactics now belong to the imperial fleet."

 STATIC_MODIFIER_NAME_nd_ymp_pacific_dominance: "Pacific Dominance"
 STATIC_MODIFIER_DESC_nd_ymp_pacific_dominance: "Geobukseon, atakebune and sekibune patrol every sea lane from Hokkaido to Macao."

 STATIC_MODIFIER_NAME_nd_ymp_sacred_sovereignty: "Sacred Sovereignty"
 STATIC_MODIFIER_DESC_nd_ymp_sacred_sovereignty: "The Mikado is no longer a captive priest in Kyoto. The chrysanthemum throne is the political center of the empire."

 STATIC_MODIFIER_NAME_nd_ymp_imperial_household: "Imperial Household Ministry"
 STATIC_MODIFIER_DESC_nd_ymp_imperial_household: "The kunaisho administers the emperor's continental estates as the bakufu administers the realm."

 STATIC_MODIFIER_NAME_nd_ymp_daimyo_protectorates: "Daimyo Protectorates"
 STATIC_MODIFIER_DESC_nd_ymp_daimyo_protectorates: "Korean and Manchurian provinces are granted as continental han to senior daimyo. Loyalty in exchange for land far from Edo."

 STATIC_MODIFIER_NAME_nd_ymp_direct_imperial_rule: "Direct Imperial Rule"
 STATIC_MODIFIER_DESC_nd_ymp_direct_imperial_rule: "The bakufu rules through prefects appointed in Edo, not through hereditary lords. Continental tax flows directly to the imperial treasury."

 STATIC_MODIFIER_NAME_nd_ymp_national_essence: "Kokutai: National Essence"
 STATIC_MODIFIER_DESC_nd_ymp_national_essence: "The empire is not a state with a ruler; it is the ruler with a state. Kokutai theology binds Korean and Chinese subjects into the imperial body."

 STATIC_MODIFIER_NAME_nd_ymp_pan_asian_emperorship: "Pan-Asian Emperorship"
 STATIC_MODIFIER_DESC_nd_ymp_pan_asian_emperorship: "The Yamato emperor claims the Mandate of Heaven once held by the Son of Heaven in Beijing. Korea, Ryukyu, Tonkin and Taiwan acknowledge him."

 STATIC_MODIFIER_NAME_nd_ymp_syncretic_clergy: "Three Teachings Clergy"
 STATIC_MODIFIER_DESC_nd_ymp_syncretic_clergy: "Buddhist monk, Confucian scholar and Shinto priest train at the same academies. The empire ordains them as one body."

 STATIC_MODIFIER_NAME_nd_ymp_scholar_priests: "Scholar-Priests"
 STATIC_MODIFIER_DESC_nd_ymp_scholar_priests: "The clergy of the empire reads Han classics, recites Mahayana sutras and performs Shinto rites. Literacy is a religious virtue."

 # === Formation event ===
 nd_ymp.1.t: "The Yamato Empire is Proclaimed"
 nd_ymp.1.d: "From Tsushima the long-feared news reaches Edo: Pyongyang is taken, Hanseong has fallen, the Yangtze cities have surrendered tribute. The Imjin invasion that Toyotomi Hideyoshi began in 1592 has at last succeeded. The bakufu rejects the old isolationist counsel; sakoku will not be sealed. Daimyo who fought from Pusan to the Yellow River return to Edo as continental governors. Korean scholars stand beside Buddhist abbots in the imperial chancery. The Mikado, freed from his gilded captivity in Kyoto, takes the chrysanthemum seal as ruler not of a small archipelago but of all East Asia.\n\nFrom Hokkaido to the Yangtze the empire stretches. The bakufu must now decide what kind of empire to become.\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_ymp.1.a: "Hideyoshi's Continental Conquest"
 nd_ymp.1.b: "The Bakufu's Continental Bureaucracy"
 nd_ymp.1.c: "Three Teachings, One Civilization"

 # === Advance DHE: Imjin Doctrine ===
 nd_ymp.2.t: "The Imjin Doctrine Codified"
 nd_ymp.2.d: "The lessons of Hideyoshi's failed first invasion have been reduced to manual. Generals who landed at Pusan in 1592 starved their way home in 1598 because the supply ships could not keep pace with the marching columns. The new doctrine is unsentimental: an army that crosses the sea must build its supply line first, fight its battles second. Castles rise on every chokepoint between Pusan and Pyongyang before a single ashigaru advances inland. The bakufu has decided how the second invasion will not fail."
 nd_ymp.2.a: "Build the supply roads first"
 nd_ymp.2.b: "Drill the columns until they march in their sleep"

 # === Advance DHE: Geobukseon Adoption ===
 nd_ymp.3.t: "The Turtle Ships Are Ours"
 nd_ymp.3.d: "Admiral Yi Sun-sin sank the first invasion fleet at Hansando with covered, iron-roofed warships our shipwrights had never imagined. Now those same shipwrights, brought from Joseon arsenals to Edo as paid masters of their craft, build geobukseon for the imperial navy. The irony is not lost on anyone: the ship that defeated Hideyoshi has become Hideyoshi's flagship. The Pacific's first iron-armored fleet flies the chrysanthemum."
 nd_ymp.3.a: "Honor Yi Sun-sin in the imperial naval shrine"
 nd_ymp.3.b: "Send the new fleet to dominate every Pacific lane"

 # === Advance DHE: Chrysanthemum Throne ===
 nd_ymp.4.t: "The Chrysanthemum Throne Ascends"
 nd_ymp.4.d: "For centuries the Mikado has been a sacred prisoner: confined to Kyoto, accorded ritual honors, drained of political power. The Yamato Empire ends that. The kiku-no-gomon, the sixteen-petal chrysanthemum, is no longer the seal of a captive priest. It is the imperial standard from Edo to Pyongyang to the Yangtze. The emperor's edicts go out in the same breath as the bakufu's, and Confucian scholars in Beijing are sworn to obey them both."
 nd_ymp.4.a: "The Mikado rules from sacred majesty"
 nd_ymp.4.b: "The imperial household administers as a great office"

 # === Advance DHE: Continental Bakufu ===
 nd_ymp.5.t: "The Bakufu Spans Continents"
 nd_ymp.5.d: "The shogunate that once governed only the home islands now administers Korean prefectures, Liaodong garrisons and Yangtze tax circuits. Daimyo holding fiefs in Pusan attend Edo as readily as those holding fiefs in Sendai. Imperial yamen, modeled on Ming bureaucratic offices but staffed by samurai-trained Confucians, handle the continental tax rolls. The question is whether to entrust governance to the great daimyo houses or pull all administration directly into the imperial chancery."
 nd_ymp.5.a: "Grant continental han to loyal daimyo"
 nd_ymp.5.b: "Govern through imperial prefects from Edo"

 # === Advance DHE: Kokutai Ideology ===
 nd_ymp.6.t: "The National Essence Doctrine"
 nd_ymp.6.d: "The kokutai theologians, drawing on Motoori Norinaga's revival of native scholarship and on the Confucian ideal of the sage-emperor, articulate something new: a doctrine of imperial sovereignty as cosmic principle. The empire is not a polity that happens to have an emperor. The empire is the emperor, and his subjects, Japanese or Korean or Chinese, share in his divine descent through loyalty alone. The doctrine simultaneously naturalizes Korean and Chinese subjects as imperial body and underwrites Yamato supremacy over them."
 nd_ymp.6.a: "Hold the doctrine close: the home islands' essence"
 nd_ymp.6.b: "Project the doctrine outward: a Pan-Asian emperor"

 # === Advance DHE: Three Teachings ===
 nd_ymp.7.t: "The Three Teachings Synthesized"
 nd_ymp.7.d: "At the new continental academies the curriculum fuses what other empires kept separate. A scholar-samurai studies Confucian classics in the morning, Mahayana sutras in the afternoon, Shinto liturgy at twilight. None of these traditions, the imperial chancery rules, contradicts the others. Buddha is a manifestation of the kami; the Confucian sage is a Buddhist bodhisattva; ritual observance and political administration are forms of one practice. Edo replaces Kyoto, Hanseong and Beijing as the seat of all three traditions at once."
 nd_ymp.7.a: "Train clergy in all three traditions together"
 nd_ymp.7.b: "Demand the literate elite master all three classics"

 # === Advance localization ===
 nd_ymp_imperial_heian_inheritance: "Imperial Heian Inheritance"
 nd_ymp_imperial_heian_inheritance_desc: "The Mikado, ritual sovereign since Heian-kyo, takes back temporal authority. The continental empire is grounded in the most ancient imperial line in East Asia."

 nd_ymp_wakou_maritime_tradition: "Wakou Maritime Tradition"
 nd_ymp_wakou_maritime_tradition_desc: "The pirate-traders of Tsushima and Goto raided the Korean and Chinese coasts for centuries. Their seamanship, transferred to the imperial navy, becomes Pacific power projection."

 nd_ymp_yamabushi_orders: "Yamabushi Orders"
 nd_ymp_yamabushi_orders_desc: "The mountain-ascetic warriors of Mt Hiei and Koyasan bring monastic discipline to imperial service. Soldiers as much as priests, priests as much as soldiers."

 nd_ymp_mahayana_state_patronage: "Mahayana State Patronage"
 nd_ymp_mahayana_state_patronage_desc: "The Tendai and Shingon schools become arms of the imperial state. Great pagodas rise in Edo, Hanseong and Yangzhou as sites of imperial-Buddhist legitimacy."

 nd_ymp_yamashiro_fortifications: "Yamashiro Fortifications"
 nd_ymp_yamashiro_fortifications_desc: "Mountain-castle architecture, refined for the home islands' broken terrain, is exported across the Korean and Manchurian frontiers."

 nd_ymp_continental_ambition: "Continental Ambition"
 nd_ymp_continental_ambition_desc: "From the moment the unified bakufu rises, Edo looks west across Tsushima. The continent is the natural object of Japanese power."

 nd_ymp_atakebune_doctrine: "Atakebune Doctrine"
 nd_ymp_atakebune_doctrine_desc: "Cannon-armed castle ships, tall-sided and slow, dominate the close-water battles that decide East Asian sea control."

 nd_ymp_tanegashima_firearms: "Tanegashima Firearms"
 nd_ymp_tanegashima_firearms_desc: "The matchlock arquebus, copied from Portuguese castaways at Tanegashima in 1543, is mass-produced in imperial arsenals at scales that dwarf Europe's."

 nd_ymp_daimyo_patronage: "Daimyo Patronage of Arts"
 nd_ymp_daimyo_patronage_desc: "Higashiyama refinement: tea ceremony, ink painting, no theater, sword polishing. The imperial dojo holds all of these as one martial-aesthetic tradition."

 nd_ymp_lacquerware_mastery: "Lacquerware Mastery"
 nd_ymp_lacquerware_mastery_desc: "Wajima and Echizen workshops, perfecting the application of urushi over decades of layering, produce vessels prized from Beijing to Lisbon."

 nd_ymp_ikko_suppression: "Ikko-ikki Suppression"
 nd_ymp_ikko_suppression_desc: "Oda and Hideyoshi broke the militant Pure Land confederations. The bakufu inherits a continent without independent religious armies."

 nd_ymp_concentric_castles: "Concentric Castle Architecture"
 nd_ymp_concentric_castles_desc: "Azuchi-style stone donjons with overlapping fields of arquebus fire become the standard imperial fortification, raised on every chokepoint between Pusan and Pyongyang."

 nd_ymp_nanban_trade: "Nanban Trade"
 nd_ymp_nanban_trade_desc: "Portuguese carracks bring Chinese silk, Indian spices and New World silver into the Pacific economy. Imperial brokers in Nagasaki control the flow."

 nd_ymp_imjin_doctrine: "The Imjin Doctrine"
 nd_ymp_imjin_doctrine_desc: "Hideyoshi failed because his supply lines could not match his ambition. The new doctrine is supply first, advance second. The continental armies of Yamato never starve."

 nd_ymp_ashigaru_musket_ranks: "Ashigaru Musket Ranks"
 nd_ymp_ashigaru_musket_ranks_desc: "Three-rank rotating volley fire, the imperial perfection of Oda's tactic, shatters cavalry charges from Manchuria to Yangzhou."

 nd_ymp_geobukseon_adoption: "Geobukseon Adoption"
 nd_ymp_geobukseon_adoption_desc: "The iron-roofed Korean turtle ship that defeated the first invasion is now built in imperial Edo and Tsushima yards. The flagship of the empire is a captured idea."

 nd_ymp_continental_cavalry: "Continental Cavalry"
 nd_ymp_continental_cavalry_desc: "Samurai who trained on the narrow paths of Honshu now charge across Manchurian steppe. The bushi adapt or die."

 nd_ymp_continental_castles: "Continental Castles"
 nd_ymp_continental_castles_desc: "Pyongyang, Hanseong, Liaoyang. Japanese stone donjons rise above Korean walls and Chinese mud-brick. The continent is being remade in Yamato architecture."

 nd_ymp_pacific_trade_routes: "Pacific Trade Routes"
 nd_ymp_pacific_trade_routes_desc: "Manila silver, Macao silk and Edo lacquerware move on imperial bottoms. The Pacific is no longer a Spanish lake."

 nd_ymp_diplomatic_reach: "Diplomatic Reach"
 nd_ymp_diplomatic_reach_desc: "Imperial envoys in Beijing, Hanseong, Manila, Lhasa and Bangkok carry the chrysanthemum seal. The empire speaks to all neighbors as an equal or superior."

 nd_ymp_chrysanthemum_throne: "The Chrysanthemum Throne"
 nd_ymp_chrysanthemum_throne_desc: "The kiku-no-gomon is no longer a courtly device of a captive emperor. It is the imperial seal of a continental empire. The Mikado rules in fact and in form."

 nd_ymp_continental_bakufu: "Continental Bakufu"
 nd_ymp_continental_bakufu_desc: "The bakufu administers Korean prefectures and Manchurian garrisons through han governors and imperial yamen. The shogunate has crossed the sea."

 nd_ymp_three_teachings: "The Three Teachings"
 nd_ymp_three_teachings_desc: "Mahayana Buddhism, Confucian classicism and Shinto ritual fuse into a single imperial orthodoxy. None of the three is allowed to claim primacy over the others."

 nd_ymp_samurai_officer_corps: "Samurai Officer Corps"
 nd_ymp_samurai_officer_corps_desc: "The hereditary warrior caste becomes the professional officer cadre of the imperial army. From Manchuria to Kyushu, samurai command at every level."

 nd_ymp_confucian_examinations: "Confucian Examinations"
 nd_ymp_confucian_examinations_desc: "The bakufu adopts the Ming examination system, modified for samurai status. Scholar-samurai who pass the imperial exams staff every continental yamen."

 nd_ymp_continental_garrisons: "Continental Garrisons"
 nd_ymp_continental_garrisons_desc: "Standing imperial regiments hold every major Korean and Manchurian city. The conquered provinces never become unconquerable again."

 nd_ymp_lacquerware_export: "Imperial Lacquerware Export"
 nd_ymp_lacquerware_export_desc: "Daimyo workshops in Wajima, Echizen and Hanseong scale to global trade volumes. Yamato lacquerware is a luxury good in every European court."

 nd_ymp_kokutai_ideology: "Kokutai Imperial Ideology"
 nd_ymp_kokutai_ideology_desc: "The doctrine of national essence: the imperial line is the source of Japanese identity, and the imperial body absorbs Korean and Chinese subjects into itself."

 nd_ymp_imperial_censorate: "Imperial Censorate"
 nd_ymp_imperial_censorate_desc: "Ming-style censors, but staffed by samurai-trained scholars and answering to Edo, audit every continental governor for corruption and disloyalty."

 nd_ymp_pacific_command: "Pacific Maritime Command"
 nd_ymp_pacific_command_desc: "The imperial navy, no longer a coastal defense fleet, exercises blue-water command from Hokkaido to the South China Sea."

 nd_ymp_population_integration: "Continental Population Integration"
 nd_ymp_population_integration_desc: "Korean and Chinese subjects are gradually assimilated into imperial citizenship. The empire is one body of subjects, by law and by ideology."

 nd_ymp_han_state_building: "Han State-Building"
 nd_ymp_han_state_building_desc: "Continental han, modeled on the home islands' han system but vastly larger, are systematically developed. Roads, markets, schools, granaries."

 nd_ymp_imperial_workshops: "Imperial Workshops"
 nd_ymp_imperial_workshops_desc: "Imperial silkworks and porcelain kilns absorb Korean and Ming techniques. The empire's monopoly products outcompete every Asian rival."

 nd_ymp_sankin_kotai_continentalized: "Continental Sankin-kotai"
 nd_ymp_sankin_kotai_continentalized_desc: "Daimyo from Korean and Manchurian han attend Edo on the same alternate-attendance schedule as home-island lords. The empire is bound together by the journey."

 nd_ymp_early_meiji_modernization: "Early Industrial Modernization"
 nd_ymp_early_meiji_modernization_desc: "The empire industrializes a generation before historical Japan. Steam mills, foundries and shipyards replace daimyo workshops."

 nd_ymp_imperial_army_modernization: "Imperial Army Modernization"
 nd_ymp_imperial_army_modernization_desc: "Conscript divisions on European model, drilled by samurai officers, fielded across the continent. The largest standing army in East Asia."

 nd_ymp_imperial_navy_modernization: "Imperial Navy Modernization"
 nd_ymp_imperial_navy_modernization_desc: "Steam-powered ironclads built at Edo and Yokosuka. The Pacific is patrolled by the most modern fleet east of Suez."

 nd_ymp_pan_asianism: "Pan-Asianism"
 nd_ymp_pan_asianism_desc: "The doctrine that East Asia must be led by Yamato becomes imperial policy. Diplomats in Bangkok, Hue, Manila and Lhasa carry the message."

 nd_ymp_continental_rail: "Continental Rail"
 nd_ymp_continental_rail_desc: "Edo to Hanseong to Pyongyang to Beijing, by iron and steam. The continent is bound by a single imperial railway grid."

 nd_ymp_imperial_schools: "Imperial Schools"
 nd_ymp_imperial_schools_desc: "Universal state schooling propagates kokutai doctrine, imperial loyalty and standardized literacy from Hokkaido to the Yangtze."

 nd_ymp_civilization_mission: "Yamato Civilization Mission"
 nd_ymp_civilization_mission_desc: "The empire takes upon itself the duty of civilizing East Asia in its own image. A doctrine that justifies the continental order to itself."

 # === Unit localization ===
 n_nd_ymp_sekibune: "Sekibune"
 n_nd_ymp_sekibune_desc: "Wakou raid galley. Light, fast, packed with marines for boarding actions and coastal landings."

 a_nd_ymp_yamabushi: "Yamabushi"
 a_nd_ymp_yamabushi_desc: "Mountain-ascetic warrior monks of Mt Hiei and Koyasan. Fearless in mountain combat, motivated by religious zeal."

 n_nd_ymp_imperial_atakebune: "Imperial Atakebune"
 n_nd_ymp_imperial_atakebune_desc: "Hideyoshi-class flagship. Tall-sided castle ship bristling with cannons, built to shatter Korean and Chinese fleets in close-water battle."

 a_nd_ymp_continental_ashigaru: "Continental Ashigaru"
 a_nd_ymp_continental_ashigaru_desc: "Musket-armed peasant infantry trained for continental campaigns. The shock of arquebus volleys at Manchurian range."

 n_nd_ymp_imperial_geobukseon: "Imperial Geobukseon"
 n_nd_ymp_imperial_geobukseon_desc: "The iron-roofed Korean turtle ship that defeated the first invasion. Now built in imperial yards and flying the chrysanthemum standard."

 a_nd_ymp_imperial_samurai_cavalry: "Imperial Samurai Cavalry"
 a_nd_ymp_imperial_samurai_cavalry_desc: "Bushi adapted to Manchurian steppe combat. Lance, bow and katana on hardy continental horseflesh."

 a_nd_ymp_imperial_musketeers: "Imperial Musketeers"
 a_nd_ymp_imperial_musketeers_desc: "Professional samurai-led musket regiments. The standing line infantry of the imperial continental army."

 n_nd_ymp_imperial_man_of_war: "Imperial Man-of-War"
 n_nd_ymp_imperial_man_of_war_desc: "Pacific-class blue-water warship. Heavy gun-deck design suited to long-range sea control from Hokkaido to Macao."

 a_nd_ymp_imperial_conscripts: "Imperial Conscripts"
 a_nd_ymp_imperial_conscripts_desc: "Modern conscript line infantry, equipped on European model and led by samurai-trained officers. The mass army of imperial industrial Yamato."

 # === Levy localization ===
 levy_nd_ymp_imperial_samurai: "Imperial Samurai Levy"
 levy_nd_ymp_imperial_samurai_desc: "Bushi cavalry summoned from continental han. The mounted backbone of the imperial army."

 levy_nd_ymp_yamabushi: "Yamabushi Levy"
 levy_nd_ymp_yamabushi_desc: "Monastic warriors raised from the great temple lands. Religious militants in imperial service."

 levy_nd_ymp_continental_ashigaru: "Continental Ashigaru Levy"
 levy_nd_ymp_continental_ashigaru_desc: "Musket-armed peasant conscripts raised across Korean, Manchurian and Chinese provinces for continental campaigns."

 # === Building localization ===
 nd_ymp_imperial_chancery: "Imperial Chancery"
 nd_ymp_imperial_chancery_desc: "The administrative seat of the Mikado's continental government, modeled on Heian-kyo precedents but staffed by Confucian-trained scholar-samurai."

 nd_ymp_great_pagoda: "Great Imperial Pagoda"
 nd_ymp_great_pagoda_desc: "Tendai and Shingon Buddhist complex of imperial scale. Site of state-Buddhist liturgy from Edo to Hanseong to the Yangtze."

 nd_ymp_continental_castle: "Continental Yamashiro Castle"
 nd_ymp_continental_castle_desc: "Japanese mountain-castle architecture exported across the continent. Stone donjon, overlapping arquebus fields, a permanent garrison."

 nd_ymp_arsenal_foundry: "Imperial Arsenal Foundry"
 nd_ymp_arsenal_foundry_desc: "Mass-production firearms works descended from the Tanegashima tradition, scaled to equip continental armies."

 nd_ymp_imperial_dojo: "Imperial Dojo"
 nd_ymp_imperial_dojo_desc: "Officer-training academy where samurai are drilled in sword, bow, lance, calligraphy and the Confucian classics as a single martial-aesthetic discipline."

 nd_ymp_lacquer_workshop: "Imperial Lacquer Workshop"
 nd_ymp_lacquer_workshop_desc: "Wajima and Echizen workshop tradition scaled for imperial export. Layered urushi vessels prized from Beijing to Lisbon."

 nd_ymp_atakebune_shipyard: "Atakebune Shipyard"
 nd_ymp_atakebune_shipyard_desc: "Imperial naval foundry built to produce atakebune, geobukseon and Pacific blue-water warships at industrial scale."

 nd_ymp_imperial_yamen: "Imperial Yamen"
 nd_ymp_imperial_yamen_desc: "Ming-style continental administrative office, staffed by samurai-trained Confucian scholars. The face of the bakufu in conquered provinces."

 nd_ymp_scholar_samurai_academy: "Scholar-Samurai Academy"
 nd_ymp_scholar_samurai_academy_desc: "Confucian examination institution where samurai students prepare for imperial exams. Bushi and bureaucrat trained as one caste."

 nd_ymp_kokutai_shrine: "Kokutai Imperial Shrine"
 nd_ymp_kokutai_shrine_desc: "National-essence shrine of imperial cult. Site where kokutai theology binds Korean, Chinese and Japanese subjects to the chrysanthemum throne."

 nd_ymp_imperial_arsenal: "Imperial Industrial Arsenal"
 nd_ymp_imperial_arsenal_desc: "Steam-age weapons works producing modern firearms, cannon and artillery for the imperial conscript army."

 # === Production method localization ===
 nd_ymp_chancery_upkeep: "Chancery Upkeep"
 nd_ymp_chancery_upkeep_desc: "Paper, ink-stones, lacquered furniture, books. The administrative apparatus of the imperial government."

 nd_ymp_pagoda_devotion: "Pagoda Devotion"
 nd_ymp_pagoda_devotion_desc: "Sutras copied on imperial paper, wax candles, incense and lumber for the worship halls."

 nd_ymp_castle_garrison: "Castle Garrison Upkeep"
 nd_ymp_castle_garrison_desc: "Weapons, mounts, uniforms and provisions for the standing castle garrison."

 nd_ymp_continental_garrison_pm: "Continental Garrison Standard"
 nd_ymp_continental_garrison_pm_desc: "Firearms-equipped continental garrison. Rice rations and arquebus stocks for the Korean and Manchurian frontier forts."

 nd_ymp_tanegashima_production: "Tanegashima Firearms Production"
 nd_ymp_tanegashima_production_desc: "Iron, coal and lumber feed the matchlock-arquebus production lines descended from the Tanegashima masters."

 nd_ymp_firearms_workshop: "Modernized Firearms Workshop"
 nd_ymp_firearms_workshop_desc: "Saltpeter-fueled imperial firearms manufacture, scaled for continental armies."

 nd_ymp_dojo_upkeep: "Dojo Upkeep"
 nd_ymp_dojo_upkeep_desc: "Polished swords, lacquered scabbards, formal robes and training manuals. The aesthetic-martial standard of imperial samurai."

 nd_ymp_lacquerware_production: "Lacquerware Production"
 nd_ymp_lacquerware_production_desc: "Layered urushi over wooden vessels, polished to depth. The standard imperial export grade."

 nd_ymp_export_lacquerware: "Imperial Export Lacquerware"
 nd_ymp_export_lacquerware_desc: "Silk-lined gilt lacquerware in pieces designed for European princely cabinets. The highest grade of imperial workshop output."

 nd_ymp_shipyard_upkeep: "Shipyard Upkeep"
 nd_ymp_shipyard_upkeep_desc: "Lumber, naval supplies, tar and iron for the imperial yards. The empire's wooden walls are built and repaired here."

 nd_ymp_yamen_upkeep: "Yamen Upkeep"
 nd_ymp_yamen_upkeep_desc: "Records, ledgers, lacquered furnishings and the Confucian classics. The administrative cost of governing a continental empire."

 nd_ymp_three_teachings_assembly: "Three Teachings Assembly"
 nd_ymp_three_teachings_assembly_desc: "Buddhist sutras, Confucian classics, Shinto liturgy and incense, all stocked together. The yamen as religious as well as civil center."

 nd_ymp_academy_upkeep: "Academy Upkeep"
 nd_ymp_academy_upkeep_desc: "Books, paper, lacquered desks and ceremonial robes for the scholar-samurai cadets."

 nd_ymp_kokutai_rites: "Kokutai Imperial Rites"
 nd_ymp_kokutai_rites_desc: "Imperial paper, beeswax candles, incense and rice offerings sustain the continental imperial cult."

 nd_ymp_imperial_silkworks: "Imperial Silkworks"
 nd_ymp_imperial_silkworks_desc: "Imperial silk dyed in court lacquer-tones for ceremonial robes worn from Edo to Hanseong to Beijing."

 nd_ymp_industrial_cannons: "Industrial Cannon Production"
 nd_ymp_industrial_cannons_desc: "Coal-smelted iron poured into modern artillery moulds. The empire's industrial firepower."

 nd_ymp_state_textbooks: "Imperial State Textbooks"
 nd_ymp_state_textbooks_desc: "Standardized kokutai-doctrine textbooks, imperial loyalty primers and continental geography. Distributed to every imperial school."

 # ===== BUREAUCRACIES =====
 ymp_tairiku_bakufu_bureaucracy: "Tairiku Bakufu"
 ymp_tairiku_bakufu_bureaucracy_desc: "The Edo roju's council and bugyo system, replicated as branch chambers at Hanseong and the conquered Ming capital. Standardized continental administration replaces military government. The crown gains direct administrative reach across the empire; daimyo find their clan autonomy circumscribed by a parallel apparatus answering only to the imperial court."

 ymp_sankin_kotai_bureaucracy: "Sankin-Kotai Continentalized"
 ymp_sankin_kotai_bureaucracy_desc: "The alternate-attendance system Iemitsu codified in 1635, scaled across an empire spanning the archipelago and the mainland. Daimyo of Korea and Liaodong attend at the imperial seat; their continental processions enrich post stations and drain clan treasuries while making coordinated rebellion logistically untenable. Burghers along the post-road network thrive; the nobility bleeds silver into ceremonial travel."

 ymp_kokudaka_governance_bureaucracy: "Kokudaka Governance"
 ymp_kokudaka_governance_bureaucracy_desc: "The kokudaka rice-yield assessment extended from the home islands to Korea and the Ming heartland. Daimyo become continental province governors, rated in koku of standardized revenue, owing levies and corvee proportional to their assessed yield. Nobles welcome the continuity of clan governance projected abroad; the crown trades direct fiscal reach for a manageable network of feudatories."

 ymp_sankyo_itchi_bureaucracy: "Sankyo Itchi"
 ymp_sankyo_itchi_bureaucracy_desc: "The Three Teachings Concord. The Edo intellectual program of Suzuki Shosan, Hayashi Razan, and Yamazaki Ansai, which synthesized Mahayana Buddhism, Confucianism, and Shinto into a single state ideology, here promoted from scholarly project to imperial doctrine. The Mahayana sangha, Korean Confucian academies, and Shinto priesthoods are bound into a unified imperial church spanning the continent."

 ymp_metsuke_censorate_bureaucracy: "Metsuke Censorate"
 ymp_metsuke_censorate_bureaucracy_desc: "A fusion of the bakufu's metsuke and ometsuke inspectors with the Yushitai Censorate inherited from the conquered Ming. Scholar-samurai trained in Confucian classics conduct surprise audits across the empire, reporting directly to the imperial court. A literate inspectorate class emerges, cutting across daimyo authority lines and answerable to no clan."

 ymp_suigun_bugyo_bureaucracy: "Suigun Bugyo"
 ymp_suigun_bugyo_bureaucracy_desc: "The unified naval command synthesizing Hideyoshi's atakebune flagship squadrons under Kuki Yoshitaka with the suigun sea-clan admirals of the Inland Sea. Rejecting sakoku, the bakufu licenses former wakou pirate lineages as state privateers under shuinjo red-seal letters of marque. Port cities of Setouchi, Pusan, and the Yangtze become naval entrepots."

 # ===== AUTO MODIFIER =====
 AUTO_MODIFIER_NAME_nd_ymp_bureaucracy_authority: "Continental Bureaucratic Authority"
 AUTO_MODIFIER_DESC_nd_ymp_bureaucracy_authority: "On the proclamation of the Yamato Empire, the bakufu gains the institutional capacity to host historical bureaucracies governing the continental realm."

 # ===== DESTINY TREE =====

 # --- Destiny advance names and descriptions ---
 nd_ymp_destiny: "The Chrysanthemum Throne Crowns an Empire"
 nd_ymp_destiny_desc: "The Yamato Empire is proclaimed and the Mikado wears the crown of an East Asian world power. The bakufu must now choose what kind of empire it will become."

 nd_ymp_dest_liaodong_subjugation: "The Liaodong Subjugation"
 nd_ymp_dest_liaodong_subjugation_desc: "Liaoyang and Shenyang must fall. The first stage of continental hegemony is to crush every Manchurian remnant that could menace the Korean rear."

 nd_ymp_dest_mongolia_amur: "The Steppe and the Amur"
 nd_ymp_dest_mongolia_amur_desc: "Karakorum and the Amur frontier. The empire pushes past the Great Wall, past the limits of Ming reach, and writes the imperial seal across Mongol grass."

 nd_ymp_dest_continental_empire: "The Continental Empire"
 nd_ymp_dest_continental_empire_desc: "Lhasa, Thang Long, Hue. From Tibet to the South China Sea, the chrysanthemum supplants every rival sovereign on the Asian mainland."

 nd_ymp_dest_taiwan_subjugation: "The Taiwan Frontier"
 nd_ymp_dest_taiwan_subjugation_desc: "Formosa is the empire's first oceanic conquest. The Pacific begins where the home islands end, and the imperial fleet must hold every passage south."

 nd_ymp_dest_manila_hijack: "The Manila Galleon Hijacked"
 nd_ymp_dest_manila_hijack_desc: "Maynila and Tondo seized. Acapulco silver no longer crosses the Pacific to Spanish vaults. The bullion of the New World now feeds Edo, not Madrid."

 nd_ymp_dest_pacific_thalassocracy: "Pacific Thalassocracy"
 nd_ymp_dest_pacific_thalassocracy_desc: "Hawaii, the Marianas, Kamchatka. The chrysanthemum standard flies on every shore of the Pacific, and the world's largest ocean is an imperial lake."

 # --- Destiny event titles, descriptions, and option text ---
 nd_ymp.8.t: "The Chrysanthemum Throne Crowns an Empire"
 nd_ymp.8.d: "The Mikado, freed from his ritual captivity, ascends a continental throne. The kiku-no-gomon flies over Edo, Hanseong, and the Yangtze. Yet a crowned empire is not yet a destiny. The bakufu must choose where to spend the next century of imperial energy: westward across the continent, or eastward across the Pacific. Either path will define the Yamato Empire forever."
 nd_ymp.8.a: "The empire's destiny begins"

 nd_ymp.9.t: "Liaodong Subjugated"
 nd_ymp.9.d: "Liaoyang and Shenyang submit. The Manchurian gateway is sealed under imperial garrison. Korean rear and Japanese supply line are now safe from any northern revanche. The samurai officer corps takes its first taste of governing a continental province directly, with Confucian-trained scholar-samurai filling the yamen and standing imperial regiments behind their walls."
 nd_ymp.9.a: "On to the steppe"

 nd_ymp.10.t: "Karakorum and the Amur"
 nd_ymp.10.d: "Mongol cavalry no longer raid; they ride under imperial banners. The old Yuan capital at Karakorum, the Amur basin held by Tungus and Russian scouts, the corridor between them — all fall to imperial expedition. The empire stretches further north and west than any Japanese sovereign has ever dared. The question is whether to absorb the steppe peoples as cavalry auxiliaries, or focus on the supply lines that hold a continental army together."
 nd_ymp.10.a: "Enlist the steppe lords as imperial marshals"
 nd_ymp.10.b: "Build the Amur supply network"

 nd_ymp.11.t: "The Continental Empire"
 nd_ymp.11.d: "Lhasa surrenders the Dalai Lama to imperial protection. Thang Long and Hue acknowledge the chrysanthemum as suzerain of all Vietnam. The empire now spans every great Asian civilization: Japanese, Korean, Han, Manchurian, Mongol, Tibetan, Vietnamese. The bakufu must now articulate what holds them together. Imperial mandate as cosmic legitimacy, or the standing legions that hold every continental capital."
 nd_ymp.11.a: "Proclaim the Mandate of Yamato over all Asia"
 nd_ymp.11.b: "The continental legions are the empire's spine"

 nd_ymp.12.t: "Taiwan Becomes Imperial"
 nd_ymp.12.d: "Paiwan and Siraya peoples submit to the imperial flag. The Pescadores and Taiwan strait are imperial waters. From Edo, the Ryukyu chain, and now Formosa, the empire forms a continuous arc across the western Pacific. The imperial navy has its first deep-water base south of the home islands, and the Spanish in Manila begin to rethink their grip on the archipelago."
 nd_ymp.12.a: "South to the Philippines"

 nd_ymp.13.t: "The Manila Galleon Is Ours"
 nd_ymp.13.d: "Maynila and Tondo fall to a combined fleet of atakebune, geobukseon, and sekibune raiders. The Spanish galleon trade — Acapulco silver to Manila silk — is at the empire's mercy. The bakufu must decide: redirect the silver flow into imperial coffers and trade through Edo, or grant the Philippine islands to imperial vassals as a system of tributary protectorates."
 nd_ymp.13.a: "Imperial monopoly on the galleon trade"
 nd_ymp.13.b: "Archipelago protectorates under daimyo viceroys"

 nd_ymp.14.t: "The Pacific Is Yamato"
 nd_ymp.14.d: "Hawaiian chiefs swear vassalage. The Mariana islands raise the chrysanthemum. Imperial ships make port at Kamchatka and Petropavlovsk, denying the Russian Pacific to the Romanovs forever. The Pacific Ocean is no longer Spanish, no longer English, no longer any European's; it is the imperial lake of Yamato. The bakufu's last task is to choose how to govern this oceanic empire."
 nd_ymp.14.a: "Patrol every sea lane: blue-water dominion"
 nd_ymp.14.b: "Crown a Pacific civilization under the chrysanthemum"

 # --- Variable tooltip alias for path_b (unused destiny branch) is reused above ---

 # --- Destiny timed modifier names and descriptions ---
 STATIC_MODIFIER_NAME_nd_ymp_dest_steppe_marshals: "Steppe Marshals"
 STATIC_MODIFIER_DESC_nd_ymp_dest_steppe_marshals: "Mongol khans serve as imperial cavalry marshals. Steppe horse stocks supply the imperial stables. The empire's auxiliary cavalry rides the steppe as if it were Honshu."

 STATIC_MODIFIER_NAME_nd_ymp_dest_amur_logistics: "Amur Frontier Logistics"
 STATIC_MODIFIER_DESC_nd_ymp_dest_amur_logistics: "Imperial depot chains run from Pusan up the Yalu and onto the Amur. The continental army never starves; the empire's silver burns to fund the granaries."

 STATIC_MODIFIER_NAME_nd_ymp_dest_mandate_of_yamato: "The Mandate of Yamato"
 STATIC_MODIFIER_DESC_nd_ymp_dest_mandate_of_yamato: "The chrysanthemum throne claims cosmic legitimacy over all East Asia. Wars of imperial mandate are easy to declare and easier to settle. The court grows complacent in its own supremacy."

 STATIC_MODIFIER_NAME_nd_ymp_dest_continental_legion: "The Continental Legion"
 STATIC_MODIFIER_DESC_nd_ymp_dest_continental_legion: "Standing imperial regiments hold every continental capital. Conscripts and contracted swords serve at imperial pay. The treasury bleeds for the privilege."

 STATIC_MODIFIER_NAME_nd_ymp_dest_galleon_traffic: "Galleon Traffic"
 STATIC_MODIFIER_DESC_nd_ymp_dest_galleon_traffic: "Acapulco silver, Manila silk and Edo lacquerware all move under imperial bottoms. The Pacific trade is an imperial monopoly, and imperial diplomats are everywhere it touches."

 STATIC_MODIFIER_NAME_nd_ymp_dest_archipelago_protectorates: "Archipelago Protectorates"
 STATIC_MODIFIER_DESC_nd_ymp_dest_archipelago_protectorates: "Philippine, Bornean, and Moluccan vassals administer their islands at their own cost. Imperial cloth bolts feed the spice trade. The empire turns its gaze outward across the seas."

 STATIC_MODIFIER_NAME_nd_ymp_dest_blue_water_dominion: "Blue-Water Dominion"
 STATIC_MODIFIER_DESC_nd_ymp_dest_blue_water_dominion: "Pacific lumber and naval stores keep the imperial fleet on patrol from Hokkaido to Hawaii. Wars against unbelievers across the ocean settle in the empire's favor."

 STATIC_MODIFIER_NAME_nd_ymp_dest_chrysanthemum_pacific: "Chrysanthemum Pacific"
 STATIC_MODIFIER_DESC_nd_ymp_dest_chrysanthemum_pacific: "Imperial paper and fine cloth dress every Pacific court that swears to the chrysanthemum. Mahayana karma flows from imperial patronage to Hawaiian, Polynesian, and Marianan subjects."

 # --- Destiny building names and descriptions ---
 nd_ymp_continental_garrison_command: "Imperial Continental Garrison Command"
 nd_ymp_continental_garrison_command_desc: "Standing imperial fortress and operational command for the continental army. Built only in the heart of the continental empire, it directs garrisons from Lhasa to Hue to the Amur."

 nd_ymp_pacific_naval_command: "Pacific Naval Command"
 nd_ymp_pacific_naval_command_desc: "Imperial deep-water naval headquarters. Coordinates the Pacific patrol fleets, the Manila galleon convoys, and the Hawaiian and Mariana stations under a single imperial flag."

 # --- Destiny production method localization ---
 nd_ymp_dest_garrison_command_upkeep: "Continental Garrison Upkeep"
 nd_ymp_dest_garrison_command_upkeep_desc: "Weapons, firearms, horses, uniforms and rice rations for the standing imperial regiments holding every continental capital."

 nd_ymp_dest_pacific_command_upkeep: "Pacific Naval Command Upkeep"
 nd_ymp_dest_pacific_command_upkeep_desc: "Naval stores, lumber, tar, weapons and salted fish — the unceasing supply needs of the Pacific patrol."
