l_english:
 TKT: "Knights of the Temple"
 TKT_ADJ: "Templar"
 TKT_f: "Knights of the Temple"
 TKT_f_desc: "Reconstitute the Pauperes Commilitones Christi Templique Salomonici as a sovereign religious-military order, refusing the dissolution of 1312 and inheriting the Iberian banking houses, Atlantic fleet, and Tomar convent that history allowed only the Order of Christ to keep. The Templar Sovereign State stands as the Catholic world's first international banking corporation made into a state, an Atlantic-facing knightly republic of treasurers, navigators, and quiet heretics whose secret chapter answers only to the pope who lifted Clement V's bull."
