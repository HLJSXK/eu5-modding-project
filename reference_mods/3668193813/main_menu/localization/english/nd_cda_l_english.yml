l_english:

# ============================================================================
# Static Modifiers (formation choices + advance event modifiers)
# ============================================================================
 STATIC_MODIFIER_NAME_nd_cda_mediterraneum_aragonense: "Mediterraneum Aragonense"
 STATIC_MODIFIER_DESC_nd_cda_mediterraneum_aragonense: "The crown looks east. Catalan consulates from Bruges to Constantinople, Almogavar mercenaries selling their billhooks to any prince who would pay them, and the four-bar Senyera Reial flying over a Mediterranean sea that has become an Aragonese lake. Naval primacy, mercenary depth, cosmopolitan culture and outward-looking diplomacy at the price of accepting the sea-divided polity rather than welding it inland."
 STATIC_MODIFIER_NAME_nd_cda_hispano_aragonese: "Hispano-Aragonese Crown"
 STATIC_MODIFIER_DESC_nd_cda_hispano_aragonese: "If Iberia must be unified, let it be unified eastward. The crown turns its administrative weight inland: integrating Castilian and Andalusian populations, professionalizing the levies, and using the inheritance machinery of Trastamara dynastic politics to do to Castile what Castile did to us in another timeline. Manpower depth, cheap annexations, control consolidation — at the price of belligerent posture and centralizing reform."
 STATIC_MODIFIER_NAME_nd_cda_compromise_legitimist: "Trastamara Legitimacy"
 STATIC_MODIFIER_DESC_nd_cda_compromise_legitimist: "Nine arbiters meeting at Caspe in 1412 chose Ferdinand of Antequera, the Castilian-born Trastamara prince, as legitimate heir to the Aragonese throne. The choice for dynastic continuity binds the crown into the Iberian succession network for centuries to come."
 STATIC_MODIFIER_NAME_nd_cda_compromise_pactist: "House of Urgell Vindicated"
 STATIC_MODIFIER_DESC_nd_cda_compromise_pactist: "The Compromise of Caspe goes the other way: Jaume II of Urgell, the native Catalan claimant, takes the throne. The pactist nobles and the great cities of the Crown declare their privileges affirmed against any future foreign succession."
 STATIC_MODIFIER_NAME_nd_cda_catalan_atlas: "Cresques Cartographic Project"
 STATIC_MODIFIER_DESC_nd_cda_catalan_atlas: "The Cresques family of Mallorca have set the world to parchment. Sea-kingdoms half a century ahead of their rivals in maritime presence and exploration."
 STATIC_MODIFIER_NAME_nd_cda_humanist_court: "Lorenzo Valla's Naples"
 STATIC_MODIFIER_DESC_nd_cda_humanist_court: "The Magnanimous court chooses humanism. Valla works on his Elegantiae, Beccadelli compiles the king's witty sayings, and royal scriptoria copy Greek manuscripts. Aragonese soft power radiates north into Tuscany and beyond."
 STATIC_MODIFIER_NAME_nd_cda_arms_of_naples: "Patronage of Arms"
 STATIC_MODIFIER_DESC_nd_cda_arms_of_naples: "The Magnanimous court patronizes condottieri, military engineers and the Italian Wars officer class. Aragonese gold flows to the era's best soldiers, and Naples becomes the proving ground of the Mediterranean profession of arms."

# ============================================================================
# Formation Event (nd_cda.1)
# ============================================================================
 nd_cda.1.t: "The Aragonese Empire"
 nd_cda.1.d: "From Barcelona's quay the king's galley flies the Senyera Reial — four red bars on gold that the chroniclers say were drawn in royal blood. Naples bows. Palermo bows. Cagliari, Palma, Valencia, Zaragoza all wait on the verdict. The Crown of Aragon, four kingdoms and three duchies bound only by a peripatetic sovereign and the Consolat de Mar, has reached a moment its rivals dread: a single ruler, a single court, a single project that is no longer postponed.\n\nThe royal council asks what the project shall be. The Catalan merchants want a Mediterranean lake — Athens recovered, Egypt courted, the consulates reinforced from Bruges to Trebizond, the Almogavars on retainer, the four bars flying over every harbour where bills of exchange are settled. The Aragonese nobility and the new Trastamara administrators see otherwise: westward, toward an Iberia unified on the crown's terms before Castile can do it on theirs. Both paths are real. Alfonso the Magnanimous truly did pivot east; the Compromise of Caspe truly did seat us in the Iberian dynastic web. The court must choose which Aragon survives.\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_cda.1.a: "Mediterraneum Aragonense — let the sea be ours"
 nd_cda.1.b: "Hispano-Aragonese — Iberia, on our terms"

# ============================================================================
# Advance DHE Events
# ============================================================================
# Catalan Atlas (nd_cda.2) — single option
 nd_cda.2.t: "The Cresques Atlas"
 nd_cda.2.d: "The Jewish cartographer Cresques Abraham of Mallorca and his son Jafuda have completed the world atlas commissioned by Pere III. Six folio panels of vellum show the Mediterranean in unprecedented portolan detail, the African gold caravans of Mansa Musa, and the silk routes east as far as Cathay. The work is a wedding gift to the king of France — diplomacy and reconnaissance in one. No other Christian court has anything comparable. Pilots from Genoa and Venice quietly request copies. The Crown's mariners have a head start of a generation."
 nd_cda.2.a: "The world is our chart."

# Compromise of Caspe (nd_cda.3) — branching
 nd_cda.3.t: "The Compromise of Caspe"
 nd_cda.3.d: "Marti the Humane has died at Poblet without a legitimate heir. The crown stands vacant and five claimants press their cases — among them Ferdinand of Antequera, Castilian-born Trastamara prince and victor over Granada, and Jaume of Urgell, the native Catalan candidate descended in the male line from Jaume II. Nine arbiters from Aragon, Catalonia and Valencia have gathered at Caspe to render a binding judgement. The court awaits the king's preference, knowing the arbiters' sentence is secretly malleable.\n\nFerdinand brings dynastic weight, Castilian alliance, and the prestige of the recent Granadan campaigns. Jaume brings the loyalty of the Catalan nobility and the unbroken line of the Casa d'Arago. The choice will define whether the crown faces inward toward Iberian dynastic politics, or outward toward Catalan particularism."
 nd_cda.3.a: "Crown Ferdinand of Antequera — dynasty above all"
 nd_cda.3.b: "Crown Jaume of Urgell — the line stays Catalan"

# Magnanimous Court (nd_cda.4) — branching
 nd_cda.4.t: "Alfonso the Magnanimous at Naples"
 nd_cda.4.d: "Naples has fallen, the Castel Nuovo flies the Senyera, and Alfonso V has installed his court in the city he fought five years to take. Lorenzo Valla — the philologist who proved the Donation of Constantine a forgery — sits in the king's pay. Antonio Beccadelli, called the Panormita, drafts the king's table-talk. Greek manuscripts arrive by the shipload from Constantinople in flight from the Ottomans. The court is suddenly the most brilliant on the Italian peninsula, more learned than Florence and more cosmopolitan than Rome.\n\nBut the same court hosts condottieri waiting for assignments, the king's military engineers studying gunpowder fortifications, and the bravos of the Italian Wars. Alfonso must decide where the patronage flows: into the humanist project that will outlast his name, or into the army of Mediterranean professionals that will keep his crown standing while he is alive."
 nd_cda.4.a: "The library of Naples — humanism above arms"
 nd_cda.4.b: "The arsenal of Naples — soldiers above scribes"

# Consolat de Mar (nd_cda.5) — single option
 nd_cda.5.t: "The Llibre del Consolat de Mar"
 nd_cda.5.d: "Centuries of Catalan maritime custom have been compiled into the Llibre del Consolat de Mar, the most comprehensive private law of shipping yet written in Christian Europe. Marseille adopts it. Pisa adopts it. Acre, Trapani, Famagusta, Bruges — wherever ships of the four bars dock, the Consolat is the law that decides who pays for jettison, who insures the cargo, who arbitrates between captain and merchant. The crown owns no monopoly on the trade itself — but every dispute brought before any consul anywhere is settled by Aragonese-Catalan rules."
 nd_cda.5.a: "Lex maritima nostra."

# Renaixenca (nd_cda.6) — single option
 nd_cda.6.t: "La Renaixenca"
 nd_cda.6.d: "Bonaventura Aribau publishes the Oda a la Patria. Jacint Verdaguer prepares the Atlantida. The Jocs Florals are restored at Barcelona, and Catalan begins its return from kitchen and tavern to printing press, university and parliament floor. What was for two centuries the regional dialect of a peripheral province becomes once more the language of a literature, a politics, a public sphere. The vernacular of the Consolat de Mar finds its modern voice — and behind it, a national project."
 nd_cda.6.a: "The voice of Catalonia returns."

# ============================================================================
# Advances (display names + descriptions)
# ============================================================================
# Age 1
 nd_cda_pacta_conventa: "Pacta Conventa"
 nd_cda_pacta_conventa_desc: "The Privilegio General of 1283 and the Aragonese coronation oath bind the crown to the constitutional pacts of the kingdom. The famous formula — 'we, who are worth as much as you and together more than you, accept you as our king and lord, provided you observe our liberties and laws; if not, no' — is unprecedented in Christian Europe."
 nd_cda_consolat_de_mar: "Llibre del Consolat de Mar"
 nd_cda_consolat_de_mar_desc: "The compiled Catalan maritime code is adopted from Marseille to Acre as the lex maritima of the Mediterranean. The Crown of Aragon owns no monopoly on the trade itself, yet every commercial dispute heard in any consulate is settled by Aragonese-Catalan rules."
 nd_cda_catalan_company: "Catalan Company in Greece"
 nd_cda_catalan_company_desc: "Roger de Flor's Almogavars take service with Byzantium in 1303, then carve out the Duchies of Athens and Neopatras for the Aragonese crown — the first Iberian power projection into the eastern Mediterranean and the model for two centuries of Catalan mercenary enterprise."
 nd_cda_almudin_tradition: "Almudín de Valencia"
 nd_cda_almudin_tradition_desc: "Valencia's great covered grain market, the Almudín, becomes the food spine of the Crown's Mediterranean campaigning. Centralized granary administration grants the kingdom an army-supply edge unmatched in 14th-century Iberia."
# Age 2
 nd_cda_catalan_atlas: "Catalan Atlas"
 nd_cda_catalan_atlas_desc: "The 1375 Catalan Atlas of the Cresques family makes Aragonese-Mallorcan cartography the most advanced of any Christian state. Pilots from Genoa and Venice quietly request copies; the kingdom's mariners hold a generation's lead in maritime intelligence."
 nd_cda_compromise_of_caspe: "Compromise of Caspe"
 nd_cda_compromise_of_caspe_desc: "The 1412 succession crisis is resolved when nine arbiters elect a new king in legal procedure rather than by sword. The settlement permanently changes how the Aragonese crown understands legitimacy — by pact, by election, by binding sentence."
 nd_cda_magnanimous_court_tradition: "Court of the Magnanimous"
 nd_cda_magnanimous_court_tradition_desc: "Alfonso V installs his peripatetic court at Naples (1442). Lorenzo Valla, Beccadelli, Pontano and Manetti enter the royal household; the first Renaissance court north of Florence funded by an Iberian crown projects Aragonese soft power across Italy."
 nd_cda_drassanes_tradition: "Drassanes Reials"
 nd_cda_drassanes_tradition_desc: "The Royal Shipyards of Barcelona — Gothic naval architecture able to lay down thirty galleys simultaneously under a single roof — become the industrial spine of Catalan-Aragonese sea power."
 nd_cda_catalan_galley: "Catalan Galley"
 nd_cda_catalan_galley_desc: "The signature warship of the Crown's Mediterranean dominance is standardized as a class. Faster than the Genoese galley, with reinforced hull for amphibious work, the Catalan galley protects the consulate convoys and lands the Almogavars on a hundred coasts."
# Age 3
 nd_cda_senyera_consulates: "Senyera Consulates"
 nd_cda_senyera_consulates_desc: "The Consols dels Catalans network covers every major Mediterranean port and stretches as far as Bruges and London. Each consulate flies the four-bar Senyera Reial and gives Catalan merchants extraterritorial protection under Aragonese commercial law."
 nd_cda_llotja_tradition: "Casa Llotja de Mar"
 nd_cda_llotja_tradition_desc: "Barcelona's Gothic Casa Llotja de Mar becomes the Mediterranean's first stock exchange — the contract court where bills of exchange, ship insurance, and maritime arbitration are settled. The institution is exported to Palma and Valencia."
 nd_cda_mediterranean_viticulture: "Mediterranean Viticulture"
 nd_cda_mediterranean_viticulture_desc: "The Penedès, Priorat, Sicilian, Campanian and Apulian wine regions all sit under the Aragonese crown. A continent-spanning wine economy unmatched by any single rival."
 nd_cda_neapolitan_humanism: "Neapolitan Humanism"
 nd_cda_neapolitan_humanism_desc: "After Alfonso V's death the cultural project he founded survives him: Pontano's Accademia, Sixtus Riessinger's Naples printing press (1471), and royal scriptoria sustain Aragonese humanism through the late 15th century."
# Age 4
 nd_cda_generalitat: "Generalitat"
 nd_cda_generalitat_desc: "The Diputació del General — the standing committee of the Catalan Corts founded 1359 — is institutionalized as a permanent representative council with tax-collecting and law-enforcing powers. The pactist constitutional model that has defined the Crown for two centuries gains an executive."
 nd_cda_tercio_de_napoles: "Tercio de Nápoles"
 nd_cda_tercio_de_napoles_desc: "Gonzalo de Córdoba's reforms during the Italian Wars (1495-1504) produce the tercio: a combined-arms heavy infantry square fielding pike, sword and arquebus together. In our timeline the innovation flowers under Catalan-Aragonese rather than Castilian sponsorship."
 nd_cda_royal_galiot: "Royal Galiot"
 nd_cda_royal_galiot_desc: "The Drassanes Reials adapt the rowed warship to early modern conditions: a faster, lighter galiot for coast defense, convoy escort and the running anti-Ottoman skirmishes of the 16th-century Mediterranean."
 nd_cda_consolat_supremacy: "Consolat Supremacy"
 nd_cda_consolat_supremacy_desc: "The Catalan maritime code has become embedded as the Mediterranean lex maritima even where Aragonese flags no longer fly. The crown leverages the legal infrastructure for trade primacy."
# Age 5
 nd_cda_pactist_resistance: "Pactist Resistance"
 nd_cda_pactist_resistance_desc: "Aragonese jurists like Lluís de Peguera articulate the doctrine that constitutional pacts cannot be unilaterally abrogated by an absolutist crown. Tested in the Catalan Revolt of 1640 and the War of Spanish Succession, the doctrine grants the kingdom an unusual capacity for legal — and armed — resistance to royal overreach."
 nd_cda_late_neapolitan_court: "Late Neapolitan Court"
 nd_cda_late_neapolitan_court_desc: "Naples becomes one of the largest cities in Europe under the late Aragonese persistence. The patronage of Vico, Pergolesi and Galiani sustains Aragonese cultural primacy in southern Italy throughout the Enlightenment."
 nd_cda_almadraba_fishery: "Almadraba Fishery"
 nd_cda_almadraba_fishery_desc: "The almadraba bluefin tuna trap — Phoenician in origin, perfected by Catalan-Sicilian fishermen — becomes the largest organized pre-modern fishery in the Mediterranean. Salted tuna export grows into a state-monopoly industry."
# Age 6
 nd_cda_renaixenca: "La Renaixença"
 nd_cda_renaixenca_desc: "The 19th-century Catalan literary, linguistic and political revival turns a regional vernacular back into a modern national language. Aribau's Oda a la Patria, Verdaguer's Atlàntida, the restoration of the Jocs Florals — a public sphere returns to the language of the Consolat de Mar."
 nd_cda_indianas_industry: "Indianas Industry"
 nd_cda_indianas_industry_desc: "Catalonia's printed-cotton industry — the indianas — scales into the first mechanized textile manufactories in Iberia. Barcelona becomes 'la fàbrica de Espanya,' the industrial workshop of the Aragonese crown."

# ============================================================================
# Custom Units
# ============================================================================
 n_nd_cda_catalan_galley: "Catalan Galley"
 n_nd_cda_catalan_galley_desc: "The standardized warship of the Crown's Mediterranean fleet. Reinforced for amphibious work, faster than its Genoese rivals, designed to convoy Catalan commerce and disembark Almogavars on hostile beaches."
 n_nd_cda_levy_galley: "Catalan Levy Galley"
 n_nd_cda_levy_galley_desc: "Coastal-burgher levy variant of the Catalan galley, raised from the port cities of Barcelona, Valencia, Palma, Naples and Palermo. Crewed by laborers and peasants from the Mediterranean shore."
 n_nd_cda_royal_galiot: "Royal Galiot"
 n_nd_cda_royal_galiot_desc: "The Drassanes Reials' early-modern evolution of the galley — a lighter, faster rowed vessel for coast defense and anti-Ottoman skirmishing in the late Mediterranean wars."
 a_nd_cda_tercio_de_napoles: "Tercio de Nápoles"
 a_nd_cda_tercio_de_napoles_desc: "The combined-arms infantry square forged in Aragonese Naples during the Italian Wars: pike, sword and arquebus integrated into a single tactical unit. The most disciplined heavy infantry in 16th-century Europe."

# ============================================================================
# Levy
# ============================================================================
 levy_nd_cda_catalan_galley: "Catalan Levy Galley"
 levy_nd_cda_catalan_galley_desc: "Burgher-financed, peasant-and-laborer-crewed galley levy raised from the Crown's Mediterranean port cities."

# ============================================================================
# Custom Buildings
# ============================================================================
 nd_cda_casa_llotja_de_mar: "Casa Llotja de Mar"
 nd_cda_casa_llotja_de_mar_desc: "The Gothic maritime exchange of Barcelona — the Mediterranean's first stock exchange. Bills of exchange, ship insurance and maritime arbitration are settled here. Expanded as the institutional model for the consulates of Palma and Valencia."
 nd_cda_generalitat_hall: "Generalitat Hall"
 nd_cda_generalitat_hall_desc: "The seat of the Diputació del General — the standing committee of the Catalan Corts. Permanent representative council, tax-collecting body, and constitutional check on royal absolutism."
 nd_cda_magnanimous_court: "Magnanimous Court"
 nd_cda_magnanimous_court_desc: "The peripatetic Renaissance court founded by Alfonso V at Naples in 1442. Lorenzo Valla, Beccadelli, Pontano and Manetti served here; royal scriptoria copied Greek manuscripts arriving in flight from the falling Eastern Empire."
 nd_cda_almudin: "Almudín"
 nd_cda_almudin_desc: "Valencia's great Gothic covered granary, expanded across the Crown's cities. Centralized food storage, fair-price grain markets, and supply infrastructure for Mediterranean campaigning."
 nd_cda_drassanes_reials: "Drassanes Reials"
 nd_cda_drassanes_reials_desc: "The Royal Shipyards of Barcelona — preserved Gothic naval architecture, capable of laying down up to thirty galleys simultaneously under a single covered roof. The industrial spine of Catalan-Aragonese sea power."
 nd_cda_senyera_consulate: "Senyera Consulate"
 nd_cda_senyera_consulate_desc: "A Catalan consulate of the Consols dels Catalans network, flying the four-bar Senyera Reial. Grants extraterritorial protection to the Crown's merchants and applies Aragonese commercial law in the host port."
 nd_cda_mediterranean_vineyard: "Mediterranean Vineyard"
 nd_cda_mediterranean_vineyard_desc: "Wine production from the Penedès, Priorat, Sicilian, Campanian or Apulian growing regions. The Crown's wines move along the Catalan trade network from Bruges to Constantinople."
 nd_cda_almadraba: "Almadraba"
 nd_cda_almadraba_desc: "The Catalan-Sicilian almadraba bluefin tuna trap. Industrial-scale fishery feeding the Mediterranean salted-tuna export market — one of the largest pre-modern protein industries in Europe."
 nd_cda_catalan_cotton_mill: "Catalan Cotton Mill"
 nd_cda_catalan_cotton_mill_desc: "Barcelona's printed-cotton manufactory. The indianas industry mechanized — la fàbrica de Espanya, the industrial workshop of the late Aragonese crown."

# ============================================================================
# Production Method Display Names
# ============================================================================
 nd_cda_llotja_maintenance: "Maritime Exchange Operations"
 nd_cda_llotja_maintenance_desc: "The contracts, ledgers, ship insurance bonds and arbitration registers of the Mediterranean's first stock exchange."
 nd_cda_generalitat_maintenance: "Council Operations"
 nd_cda_generalitat_maintenance_desc: "The records, sealed acts and ceremonial supplies of the Catalan parliamentary tradition."
 nd_cda_court_patronage: "Court Patronage"
 nd_cda_court_patronage_desc: "The salaries of humanist scholars, the books of the royal library, the silks and wines of a Renaissance court."
 nd_cda_almudin_maintenance: "Granary Operations"
 nd_cda_almudin_maintenance_desc: "The grain stocks, masonry repairs and timber works of Valencia's covered granary system."
 nd_cda_drassanes_maintenance: "Shipyard Operations"
 nd_cda_drassanes_maintenance_desc: "The lumber, naval supplies, tar and wrought iron consumed by the Royal Shipyards of Barcelona."
 nd_cda_consulate_maintenance: "Consulate Operations"
 nd_cda_consulate_maintenance_desc: "The paper, cloth, wax seals and table wines of a Catalan consul's establishment in a foreign port."
 nd_cda_vineyard_production: "Wine Production"
 nd_cda_vineyard_production_desc: "Mediterranean viticulture: the press, the cellar, the amphorae and the export casks of the Penedès, Priorat, Sicilian, Campanian and Apulian wine regions."
 nd_cda_almadraba_maintenance: "Tuna Trap Operations"
 nd_cda_almadraba_maintenance_desc: "The nets, masts, salt and cordage of the Catalan-Sicilian bluefin almadraba."
 nd_cda_indianas_production: "Indianas Production"
 nd_cda_indianas_production_desc: "Mechanized printed-cotton manufacture: cotton, fiber, dye, and the early industrial press of Catalan textile innovation."

 nd_cda_almoixerifat_reform: "Almoixerifat Reform"
 nd_cda_almoixerifat_reform_desc: "The medieval Aragonese customs and treasury offices (almoixerifats, originally Andalusi institutions adopted by the reconquista crown) are rationalized along late-absolutist Italianate lines, modernizing tax collection and construction administration."
 nd_cda_companyies_de_catalans: "Companyies de Catalans"
 nd_cda_companyies_de_catalans_desc: "The late-19th-century joint-stock companies — Banc de Barcelona, Companyia Trasatlàntica, La Maquinista Terrestre i Marítima — that finance Catalan industrial expansion and turn the crown's capital markets into the financial spine of southern European industrialization."
 nd_cda_modernisme: "Modernisme"
 nd_cda_modernisme_desc: "Gaudí, Domènech i Montaner, Puig i Cadafalch. The Renaixença's literary revival blossoms into a built civilization that defines Barcelona as one of the major centers of European modern art."

# Tooltip keys for hidden_effect set_variable lines
 nd_cda_formed_tt: "Aragonese Empire formed"
 nd_cda_path_a_tt: "Mediterraneum Aragonense path chosen"
 nd_cda_path_b_tt: "Hispano-Aragonese path chosen"
 nd_cda_catalan_galley_levy: "Catalan Galley Levy"
 nd_cda_catalan_galley_levy_desc: "The Crown's Mediterranean port cities raise their own galley levies. Burghers of Barcelona, Valencia, Palma, Naples and Palermo finance the hulls; peasants and laborers along the Mediterranean shore row them. Mass-mobilization sea power without a standing fleet's cost."

# ============================================================================
# DESTINY TREE
# ============================================================================
# Path tooltip keys (nd_cda_path_a_tt / nd_cda_path_b_tt) are defined earlier
# in the file with the formation-event variable tooltips.

# Destiny advances
 nd_cda_destiny: "Imperial Project"
 nd_cda_destiny_desc: "The crown that has been formed must now choose what kind of empire it intends to become. The road forks: an eastern Mediterranean thalassocracy, or an Atlantic colonial power. Stability above 75 keeps the kingdom united for the choice."

 nd_cda_dest_catalan_greece: "Recover Catalan Greece"
 nd_cda_dest_catalan_greece_desc: "Reclaim the Duchy of Athens, the Duchy of Neopatras, and the Aragonese county of Patras — the Catalan Company's eastern conquests of 1303-1311. Own Athens, Neopatras and Patras, and hold a thousand gold to fund the expedition."
 nd_cda_dest_aegean_empire: "Aegean Empire"
 nd_cda_dest_aegean_empire_desc: "Take the strategic island arc that severs the eastern Mediterranean: Crete (Candia), Rhodes, and Chios. Field an army of fifty regiments and develop the realm to three thousand to make the conquest stick."
 nd_cda_dest_mare_nostrum: "Mare Nostrum Aragonense"
 nd_cda_dest_mare_nostrum_desc: "The Mediterranean is the Crown's lake. Hold Famagusta on Cyprus, Alexandria in Egypt, and Tunis at the choke point of the inner sea. Three thousand gold, seventy-five prestige and a development total of forty-five hundred mark the apex. Unlocks the Drassanes Maxima."

 nd_cda_dest_atlantic_bridgehead: "Atlantic Bridgehead"
 nd_cda_dest_atlantic_bridgehead_desc: "Seize the Atlantic staging archipelagos: the Canaries (Teguise), Madeira (Funchal) and the Azores (Ponta Delgada). With a thousand gold in reserve, the Crown turns its sailing tradition outward through the Pillars of Hercules."
 nd_cda_dest_catalan_caribbean: "Catalan Caribbean"
 nd_cda_dest_catalan_caribbean_desc: "Plant the four bars over Hispaniola (Bohio) and Cuba (La Habana), embrace the New World institution, and grow the realm to three thousand development. The first Catalan-Aragonese plantation Atlantic."
 nd_cda_dest_atlantic_empire: "Catalan Atlantic Empire"
 nd_cda_dest_atlantic_empire_desc: "Reach the mainland: Tenochtitlan (the Mexica capital), Calamari (Cartagena de Indias) and Mayapan (Yucatan) all under Catalan-Aragonese sponsorship. Three thousand gold, seventy-five prestige and forty-five hundred development. Unlocks the Casa de Contratacio Catalana."

# Destiny event titles, descriptions, and option text
# nd_cda.7 — Destiny root acknowledgment
 nd_cda.7.t: "The Imperial Project"
 nd_cda.7.d: "The royal council in Barcelona has settled the question. The kingdom is one, the throne is one, the project is one — and the path forward will now be measured in concrete objectives, not in the abstractions of court rhetoric. The chronicle of what the Crown of Aragon shall become opens a new chapter, and the king's secretaries set their pens to it."
 nd_cda.7.a: "Let the work begin."

# nd_cda.8 — Path A Stage 1: Catalan Greece
 nd_cda.8.t: "The Duchies Restored"
 nd_cda.8.d: "Athens has fallen. Neopatras has bowed. The Aragonese banner flies once more over the Acropolis where the Catalan Company under Roger de Flor first raised it in 1311 — a claim two centuries old, dormant since the Florentine Acciaiuoli evicted the last Catalan duke in 1388, now made good with steel. The chronicle of Ramon Muntaner is reread aloud at court. The eastern frontier of the Crown has reopened."
 nd_cda.8.a: "Athens is ours again."

# nd_cda.9 — Path A Stage 2: Aegean Empire branching
 nd_cda.9.t: "The Aegean Garrisoned"
 nd_cda.9.d: "Candia, Rhodes, Chios — the strategic island chain of the eastern Mediterranean — all bow to the four bars. Venetian galleys must now ask permission to pass; Genoese factors petition the Crown for trade licenses; Mamluk envoys arrive in Naples to sound out terms. The kingdom has the islands. The question is what kind of empire to administer them as.\n\nThe military council wants strong garrisons in every island citadel — Aragonese soldiers, Catalan officers, the Acropolis at Athens turned back into a fortress as in the Catalan Company days. The chancellery prefers the Venetian model: bailiffs and consuls, hands-off rule, integration of the Greek and Latin populations through privilege rather than presence."
 nd_cda.9.a: "Garrison every citadel."
 nd_cda.9.b: "Bailiffs and bailiwicks — Venetian-style."

# nd_cda.10 — Path A Stage 3: Mare Nostrum branching
 nd_cda.10.t: "Mare Nostrum"
 nd_cda.10.d: "Famagusta, Alexandria, Tunis. The three terminals of the eastern Mediterranean trade triangle all fly the Senyera. The pilots of Genoa and Venice file their cargoes through Catalan consulates; the Mamluk sultanate has either fallen or come to terms; the Maghreb pays the Crown's tribute. There has not been a Mediterranean power of this scale since Rome.\n\nThe court must now decide what to do with such a position. The Pope offers a crusade title and the right to call any expedition against the Ottomans a holy war. The merchant houses of Barcelona prefer that the king consolidate the peace and turn the inner sea into a free Aragonese trading lake under a single administered customs system."
 nd_cda.10.a: "Take the crusader cross — finish the work."
 nd_cda.10.b: "The king's peace — Mare Pacatum."

# nd_cda.11 — Path B Stage 1: Atlantic Bridgehead
 nd_cda.11.t: "The Pillars Crossed"
 nd_cda.11.d: "The Canaries are Aragonese. Madeira is Aragonese. The Azores are Aragonese. Three archipelagos in a stepping-stone chain across the Atlantic — the same chain that in another timeline Castile used to reach the Indies — are now the Crown's bridgehead. Catalan sailors who have spent two centuries learning the Mediterranean carry that science out through the Strait of Gibraltar. The Western Ocean has become navigable space."
 nd_cda.11.a: "Westward."

# nd_cda.12 — Path B Stage 2: Catalan Caribbean branching
 nd_cda.12.t: "The Catalan Indies"
 nd_cda.12.d: "Hispaniola is the Crown's. Cuba is the Crown's. La Habana flies the four bars rather than the lions and castles. The first Aragonese-Catalan plantations are set out, Catalan emigrants disembark at the new docks, and the question of how to administer the Indies becomes urgent.\n\nThe military adventurers — the conquistadors — petition the king for charters to conquer mainland kingdoms in his name. The clergy and the chancellery want a more orderly system: encomiendas administered through licensed grants, missionary orders training a converted indigenous labor force, and the Crown holding a tighter rein on its colonial captains."
 nd_cda.12.a: "Charter the conquistadors."
 nd_cda.12.b: "License the encomienda system."

# nd_cda.13 — Path B Stage 3: Atlantic Empire branching
 nd_cda.13.t: "The Casa de Contratacio"
 nd_cda.13.d: "Tenochtitlan has fallen. The Yucatan is administered. Calamari sends its emerald and gold convoys up to Barcelona under Catalan flags. The Atlantic empire is now a fact — and the Crown founds in Barcelona the Casa de Contratacio Catalana, the trade administration that will license every voyage to the Indies, levy the royal fifth on every cargo, and adjudicate every colonial dispute under the Consolat de Mar.\n\nThe court debates how to run the system. The merchants of Barcelona, Valencia and Palma want a tightly licensed monopoly trade — Indies bullion flowing through a few designated ports under fixed customs schedules. The Trastamara administrators see otherwise: open the colonial system to Catalan migration, integrate the colonies into the realm as overseas kingdoms, raise their development the way Naples and Sicily were raised."
 nd_cda.13.a: "Monopoly trade — the Indies for the Crown."
 nd_cda.13.b: "Settlement and integration — overseas kingdoms."

# Destiny timed modifier names and descriptions
 STATIC_MODIFIER_NAME_nd_cda_dest_acropolis_garrison: "Acropolis Garrison"
 STATIC_MODIFIER_DESC_nd_cda_dest_acropolis_garrison: "Aragonese soldiers in every island citadel from Athens to Rhodes. Catalan officers, Aragonese sergeants, fortress garrisons drilled in the old Almogavar tradition. Hard to dislodge — but reinforcing them across the eastern Mediterranean costs a great deal more than reinforcing the home fronts."
 STATIC_MODIFIER_NAME_nd_cda_dest_catalan_bailiwick: "Catalan Bailiwicks"
 STATIC_MODIFIER_DESC_nd_cda_dest_catalan_bailiwick: "The Venetian model — light-touch rule through bailiffs, consuls, and locally co-opted Greek and Latin elites. The Senyera flies but does not garrison. Diplomacy substitutes for occupation."
 STATIC_MODIFIER_NAME_nd_cda_dest_crusader_aragon: "Crusader Aragon"
 STATIC_MODIFIER_DESC_nd_cda_dest_crusader_aragon: "The Pope grants the crusade title. Aragonese arms turn Mediterranean dominance into a holy war against the Ottomans, the Mamluks, and the Maghreb. Tactical edge against unbelievers — paid for in war exhaustion among the Crown's Christian subjects."
 STATIC_MODIFIER_NAME_nd_cda_dest_sea_kings_peace: "Sea King's Peace"
 STATIC_MODIFIER_DESC_nd_cda_dest_sea_kings_peace: "The Mediterranean becomes a single administered customs zone under Aragonese arbitration. The merchant houses of Barcelona prosper, the army costs less to keep, and peace settlements are negotiated from a position of unquestioned regional supremacy."
 STATIC_MODIFIER_NAME_nd_cda_dest_conquistadors_catalans: "Conquistadors Catalans"
 STATIC_MODIFIER_DESC_nd_cda_dest_conquistadors_catalans: "The Crown grants conquest charters to military adventurers from Catalonia, Valencia and Naples. The mainland indigenous kingdoms fall to small bands of cannon-bearing Catalan-Aragonese captains — at the price of the inflation that bullion shocks always bring."
 STATIC_MODIFIER_NAME_nd_cda_dest_encomienda_catalana: "Catalan Encomienda"
 STATIC_MODIFIER_DESC_nd_cda_dest_encomienda_catalana: "Licensed encomienda grants administered through missionary orders. Conversion of the indigenous population proceeds through schools and parishes; colonial subjects integrate into the Crown's realm under the same constitutional pacts that govern Catalonia, Valencia and Naples."
 STATIC_MODIFIER_NAME_nd_cda_dest_indies_trade: "Indies Trade Monopoly"
 STATIC_MODIFIER_DESC_nd_cda_dest_indies_trade: "The Casa de Contratacio licenses every voyage. Indies bullion flows through Barcelona, Valencia and Palma under tight customs control. Diplomatic capacity expands and wars become cheaper to declare — but the Crown's prestige decays slightly as the imperial project becomes a commercial enterprise rather than a chivalric one."
 STATIC_MODIFIER_NAME_nd_cda_dest_atlantic_dominion: "Atlantic Dominion"
 STATIC_MODIFIER_DESC_nd_cda_dest_atlantic_dominion: "The colonies are integrated as overseas kingdoms — like Naples or Sicily, only across the Ocean. Catalan emigrants raise plantations and cities; the Crown's standing among the great powers is recognized; population growth and colonial recovery are accelerated by the open settlement system."

# Destiny capstone buildings
 nd_cda_drassanes_maxima: "Drassanes Maxima"
 nd_cda_drassanes_maxima_desc: "The imperial-scale evolution of the Drassanes Reials. A grand Mediterranean naval headquarters constructed under the Mare Nostrum project, capable of laying down four warships at once and sustaining the Crown's eastern fleet from a single dockyard."
 nd_cda_drassanes_maxima_maintenance: "Imperial Shipyard Operations"
 nd_cda_drassanes_maxima_maintenance_desc: "The lumber, naval stores, tar, iron and weaponry consumed by the imperial-scale evolution of the Royal Shipyards."

 nd_cda_casa_contratacio: "Casa de Contratacio Catalana"
 nd_cda_casa_contratacio_desc: "Barcelona's parallel to the Castilian Casa de Contratacion. Licenses every voyage to the Indies, levies the royal fifth on bullion cargoes, registers Catalan emigrants, and adjudicates colonial commercial disputes under the Consolat de Mar — the Crown's imperial trade administration."
 nd_cda_casa_contratacio_maintenance: "Trade House Operations"
 nd_cda_casa_contratacio_maintenance_desc: "The paper, registers, fine cloth and chambered furniture of the Crown's imperial trade administration in Barcelona."

# ============================================================================
# Bureaucracies (4 institutions; 2 slots granted by auto_modifier + 1 capital = 3 effective)
# ============================================================================
 AUTO_MODIFIER_NAME_nd_cda_bureaucracy_authority: "Crown of Aragon Chanceries"
 AUTO_MODIFIER_DESC_nd_cda_bureaucracy_authority: "The Crown's pactist administration spans four kingdoms separated by sea. The royal council may sustain two standing institutions in addition to the establishment of the capital."

 cda_reial_cancelleria_bureaucracy: "Reial Cancelleria d'Aragó"
 cda_reial_cancelleria_bureaucracy_desc: "The Aragonese royal chancery, professionalized under Jaume II from c.1290 and codified by Pere III's 1344 Ordinacions de la Casa Reial. Staffed by university-trained letrats, it issues decrees in Catalan, Aragonese, Latin, and (from Alfonso V) Italian, maintaining one of medieval Europe's most disciplined diplomatic registries — the foundation of Catalan literary prose and the Crown's administrative coherence across four kingdoms separated by sea."

 cda_generalitat_bureaucracy: "Generalitat de Catalunya"
 cda_generalitat_bureaucracy_desc: "The standing committee of the Catalan Corts, born in 1359 at the Corts of Cervera as the Diputació del General to administer the donatiu (subsidy) granted to Pere III. Within a generation it has become the Principality's permanent political executive, levying the generalitats taxes from its Barcelona seat (the Palau de la Generalitat, begun 1403) and acting as the visible institutional embodiment of pactist constitutionalism — the king binds himself first, then his subjects obey."

 cda_consolat_de_mar_bureaucracy: "Consolat de Mar"
 cda_consolat_de_mar_bureaucracy_desc: "The Mediterranean's first maritime jurisdiction, chartered at Valencia in 1283 by Pere III the Great and codified in the Llibre del Consolat de Mar, whose articles govern shipowner liability, crew wages, and prize cases from Barcelona to Messina to Trapani. By the fifteenth century its Catalan-language jurisprudence is the lingua franca of Mediterranean commerce, cited in Genoese and Venetian courts and translated into every major Mediterranean language."

 cda_sommaria_bureaucracy: "Regia Camera della Sommaria"
 cda_sommaria_bureaucracy_desc: "The supreme accounting court of the Kingdom of Naples, expanded by Alfonso V the Magnanimous after his 1442 conquest from a thirteenth-century Angevin nucleus. Its luogotenenti and razionali audit every demesne revenue, customs duty, and feudal due from Abruzzo to Calabria, providing the fiscal backbone that funds Alfonso's humanist court at Castel Nuovo and his Italian wars — Naples becomes the workshop of late-medieval Aragonese statecraft."
