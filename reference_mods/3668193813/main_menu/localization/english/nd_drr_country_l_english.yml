l_english:
 DRR: "Durrani Empire"
 DRR_ADJ: "Durrani"
 DRR_f: "Durrani Empire"
 DRR_f_desc: "Forge a Pashtun-led empire spanning the crossroads of Persia, Central Asia, and Hindustan, in the tradition of Ahmad Shah Durrani's loya jirga at Kandahar in 1747. The Durrani Empire was the second-largest Muslim power of its day, binding the Afghan tribal confederation, Khorasan, Sindh, and Punjab into a single realm under the standard of the Abdali."
