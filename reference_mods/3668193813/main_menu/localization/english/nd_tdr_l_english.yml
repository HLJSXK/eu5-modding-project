l_english:
 # ============================================================
 # Country name overrides (set via change_country_name)
 # ============================================================
 TDR_REGNUM: "Regnum Bospori"
 TDR_REGNUM_ADJ: "Regnal Bosporan"
 TDR_CIMMERIAN: "Kingdom of the Cimmerian Bosporus"
 TDR_CIMMERIAN_ADJ: "Cimmerian"

 # ============================================================
 # Variable tooltips (referenced by hidden_effect set_variable lines)
 # ============================================================
 nd_tdr_formed_tt: "The Bosporan Kingdom has been formed"
 nd_tdr_path_a_tt: "Chose Regnum Bospori"
 nd_tdr_path_b_tt: "Chose Cimmerian Bosporus"

 # ============================================================
 # Formation event nd_tdr.1
 # ============================================================
 nd_tdr.1.t: "Heir to the Pontic Shore"
 nd_tdr.1.d: "After generations of holding the cliff fortress of Mangup against Genoese, Tatar, and Ottoman alike, our princes summon the council. Their domain has the bones of two states sleeping beneath it: the ancient Bosporan Kingdom of the Spartocids, the Greek polis founded on the Cimmerian Strait twenty centuries past, and the Crimean Gothic principality of Theodoro that has shielded Pontic Orthodoxy since the days of Justinian I.\n\nWhich heritage shall the new realm honour as its founding fiction? The court is split. The Greek archons argue for a Roman Regnum Bospori, an heir of Eupator and Mithridates that can speak with Constantinople and Venice as a peer. The Gothic primates and the cliff-village dynasts argue for the Cimmerian Bosporus of John of Gothia, a mountain kingdom of mixed peoples bound by Orthodox faith and the iron of Mangup.\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_tdr.1.a: "Regnum Bospori - heirs of Mithridates and Rome"
 nd_tdr.1.b: "Cimmerian Bosporus - kingdom of mountain peoples"

 # ============================================================
 # Formation timed modifiers
 # ============================================================
 STATIC_MODIFIER_NAME_nd_tdr_regnum_bospori: "Regnum Bospori"
 STATIC_MODIFIER_DESC_nd_tdr_regnum_bospori: "The court styles itself heir of the ancient Bosporan kings and of the late Roman protectorate over the Cimmerian shore. Mediterranean diplomats and Orthodox merchants gather at Mangup."

 STATIC_MODIFIER_NAME_nd_tdr_cimmerian_bosporus: "Cimmerian Bosporus"
 STATIC_MODIFIER_DESC_nd_tdr_cimmerian_bosporus: "Goth, Greek, Alan, and Cuman swear together on the cliff of Mangup. The mountain garrisons hold a frontier kingdom open to all who profess Pontic Orthodoxy."

 # ============================================================
 # DHE event nd_tdr.2 -- The Cliff of Mangup
 # ============================================================
 nd_tdr.2.t: "The Cliff of Mangup"
 nd_tdr.2.d: "Our masons climb the goat paths to the plateau above Choros and Tabana-Dere, marking the line of the great Justinianic curtain wall. The cyclopean stones are still in place where the engineers of the basileus Justinian I laid them in the 540s; whole generations of refugees have sheltered here since. The new fortifications double the curtain, raise the bastions of Tabana-Dere, and seat a permanent garrison in the Octagonal Citadel above the Karaim quarter.\n\nIn the cisterns and rock-cut barracks the question is asked: shall the cliff be a gate, holding the line where Goth and Greek meet steppe, or a hearth, a refuge whose gates open to anyone the raids drive uphill?"
 nd_tdr.2.a: "Hold the line - cliff fortifications and standing garrison"
 nd_tdr.2.b: "Open the gates - haven for refugees from steppe and sea"

 STATIC_MODIFIER_NAME_nd_tdr_cliff_garrison: "Cliff Garrison of Mangup"
 STATIC_MODIFIER_DESC_nd_tdr_cliff_garrison: "Standing garrisons in the cliff fortresses make the upland a deathtrap for any invader who tries to climb."

 STATIC_MODIFIER_NAME_nd_tdr_refugee_haven: "Cliff Refuge"
 STATIC_MODIFIER_DESC_nd_tdr_refugee_haven: "The plateau gathers refugees from raid and famine, mixing peoples and reseeding the lowland villages."

 # ============================================================
 # DHE event nd_tdr.3 -- The Komnenoid Inheritance
 # ============================================================
 nd_tdr.3.t: "The Komnenoid Inheritance"
 nd_tdr.3.d: "The Gabras court at Mangup commissions a genealogy traced through the Komnenodoukai: from Demetrios Palaiologos-Gabras the founder, back through the Pontic Komnenoi of Trebizond, back at last to Alexios I and the imperial house of Constantinople itself. Whether by blood or by adoption, the line stands written.\n\nThe court must decide how to wield it. Some argue for sealing the claim with imperial ceremonial, dressing the Mangup princes in purple as small-scale basileis, projecting prestige inward. Others argue the claim is currency, to be spent on cousinly marriages with the Trapezuntine Komnenoi, the Tocchi of Epirus, the Crimean Tatar nobility, and the Italian houses of the Pontic shore."
 nd_tdr.3.a: "Cloak the princes in imperial purple"
 nd_tdr.3.b: "Marry the line into every court of the Pontic shore"

 STATIC_MODIFIER_NAME_nd_tdr_purple_lineage: "Purple Lineage"
 STATIC_MODIFIER_DESC_nd_tdr_purple_lineage: "The Mangup court ritualises its descent from the Komnenoi as a small-scale Roman basileia."

 STATIC_MODIFIER_NAME_nd_tdr_dynastic_marriages: "Dynastic Marriages"
 STATIC_MODIFIER_DESC_nd_tdr_dynastic_marriages: "Theodorite princesses marry into Tatar, Italian, and Pontic Greek courts, knitting the kingdom into a web of cousins."

 # ============================================================
 # DHE event nd_tdr.4 -- The Tauric Emporion
 # ============================================================
 nd_tdr.4.t: "The Tauric Emporion"
 nd_tdr.4.d: "Cherson, Caffa, Soldaia, Avlita: the harbour towns of the Tauric coast hum again. Genoese galleys take on grain, Venetian carracks on caviar and beeswax, Tatar caravans on Russian furs and slaves bound for the markets of Cairo. The Bosporan king's customs officers sit in the funduq at Caffa with their Greek scribes and their Genoese counterparts, and the toll-books of Mangup grow fatter every season.\n\nWhich vein shall the kingdom plough deepest? The grain fleet to Constantinople and the Aegean, sustaining Pontic Orthodoxy with bread? Or the caravan road to the steppe and beyond, drawing Russian, Volga, and Persian goods through the Tauric markets?"
 nd_tdr.4.a: "Grain fleet to the Aegean"
 nd_tdr.4.b: "Caravans onto the steppe"

 STATIC_MODIFIER_NAME_nd_tdr_grain_fleet: "Tauric Grain Fleet"
 STATIC_MODIFIER_DESC_nd_tdr_grain_fleet: "Crimean wheat in volume sustains the Aegean Greek world; Bosporan ships sail with grain and return with silver."

 STATIC_MODIFIER_NAME_nd_tdr_steppe_caravans: "Steppe Caravans"
 STATIC_MODIFIER_DESC_nd_tdr_steppe_caravans: "The road from Caffa to Saray and beyond brings Russian and Persian goods through Bosporan customs houses."

 # ============================================================
 # DHE event nd_tdr.5 -- The Crimean Gothic Tongue
 # ============================================================
 nd_tdr.5.t: "The Crimean Gothic Tongue"
 nd_tdr.5.d: "An ambassador from the Habsburg court, the Flemish humanist Ogier Ghiselin de Busbecq, will one day record at the Sublime Porte a list of words gathered from two Crimean men. Reidi for father, mine for moon, baar for child: a late, half-strangled echo of Wulfila's Gothic Bible in the mouths of upland villagers eight centuries after Theodoric the Great rode west.\n\nFor now the Crimean Gothic speech persists in the cliff villages around Mangup, and the court must take its measure. Shall it be lifted up as a warrior heritage -- the Goths of John of Gothia, the foederati of Justinian -- or folded into a wider ecumenical court of Greek, Goth, Tatar, Alan, and Italian under the Pontic patriarch?"
 nd_tdr.5.a: "Lift up the Gothic warband"
 nd_tdr.5.b: "Fold all peoples into one Pontic court"

 STATIC_MODIFIER_NAME_nd_tdr_gothic_warband: "Gothic Warband"
 STATIC_MODIFIER_DESC_nd_tdr_gothic_warband: "The cliff-village retainers ride as a heavy warband under their old banners."

 STATIC_MODIFIER_NAME_nd_tdr_ecumenical_court: "Ecumenical Court"
 STATIC_MODIFIER_DESC_nd_tdr_ecumenical_court: "The Mangup court welcomes Greek, Goth, Alan, Tatar, and Italian alike under one Pontic Orthodox roof."

 # ============================================================
 # DHE event nd_tdr.6 -- The Cave Monasteries
 # ============================================================
 nd_tdr.6.t: "The Synod of the Caves"
 nd_tdr.6.d: "The hegumens of Inkerman, Eski-Kermen, and Chufut-Kale meet in the rock-cut church of the Holy Cliff at Mangup. They have inherited centuries of monastic life carved straight into the limestone -- chapels, cells, refectories all hewn by chisel from the bones of the plateau. Now, with the kingdom restored, the synod recognises a single Pontic Crimean metropolitanate, with the rock-cut see of Mangup at its head, in concord with the patriarch of Constantinople.\n\nIcons painted in the cave chapels are circulated as far as Trebizond and Moscow. The monks copy psalters in beeswax candlelight."
 nd_tdr.6.a: "Convene the synod under the patriarch"

 STATIC_MODIFIER_NAME_nd_tdr_pontic_synod: "Pontic Crimean Synod"
 STATIC_MODIFIER_DESC_nd_tdr_pontic_synod: "The cave monasteries preach a vigorous Pontic Orthodoxy that draws converts and steadies the realm's faithful."

 # ============================================================
 # Advances
 # ============================================================
 nd_tdr_mangup_citadel: "Cliff Fortress of Mangup"
 nd_tdr_mangup_citadel_desc: "Rebuild and re-garrison the Justinianic walls of the Mangup plateau. Unlocks the Mangup Cliff Citadel building."

 nd_tdr_drungaroi_levy: "Drungaroi of the Cliff Villages"
 nd_tdr_drungaroi_levy_desc: "The upland villages of Theodoro owe garrison service to the cliff fortresses. Unlocks the Mangup Drungaroi levy."

 nd_tdr_bosporan_liburnae: "Bosporan Liburnae"
 nd_tdr_bosporan_liburnae_desc: "Inherit the small fast escort galleys of the late Roman Pontus Euxinus. Unlocks the Bosporan Liburnian light ship."

 nd_tdr_pontic_icons: "Pontic Iconographic School"
 nd_tdr_pontic_icons_desc: "The cave chapels and cliff hermitages preserve a distinctive Crimean iconographic tradition descended from Cappadocian and Trapezuntine masters."

 nd_tdr_cherson_trade: "Tauric Emporion"
 nd_tdr_cherson_trade_desc: "Reopen the great Greek trading harbours of the Tauric coast. Unlocks the Tauric Emporion building and improves sea trade."

 nd_tdr_cave_monasteries: "Cave Monastic Tradition"
 nd_tdr_cave_monasteries_desc: "The rock-cut churches and cells of Inkerman, Eski-Kermen, and Chufut-Kale become centres of Pontic Orthodox literacy. Unlocks the Cave Monastery building."

 nd_tdr_gabras_inheritance: "The Gabras Inheritance"
 nd_tdr_gabras_inheritance_desc: "The Gabras princes assert descent from the Komnenoi of Trebizond and Constantinople, lifting the prestige and cultural reach of the Mangup throne."

 nd_tdr_caffa_factor: "Caffa Factor"
 nd_tdr_caffa_factor_desc: "Pontic sturgeon roe, salted and barreled at Caffa, becomes a luxury export prized in Constantinople, Genoa, and Cairo. Unlocks the Pontic Curing Works and its caviar production method."

 nd_tdr_tauric_stratiotes: "Tauric Stratiotes"
 nd_tdr_tauric_stratiotes_desc: "Coastal Greeks and Goth horsemen muster as light cavalry, late descendants of the Komnenian stratiotai. Unlocks the Tauric Stratiotes unit."

 nd_tdr_gothic_heritage: "Crimean Gothic Heritage"
 nd_tdr_gothic_heritage_desc: "The persistence of the Crimean Gothic tongue is celebrated, and the realm formally embraces a multiethnic identity of Greek, Goth, Alan, Cuman, and Italian."

 nd_tdr_komnenoid_court: "Komnenoid Court Culture"
 nd_tdr_komnenoid_court_desc: "Mangup patronises icon painters, hymnographers, and vernacular Greek poets in imitation of the Trapezuntine Komnenian court."

 nd_tdr_steppe_truces: "Steppe Truces"
 nd_tdr_steppe_truces_desc: "The Crimean Tatars, Nogai, and Volga successors of the Golden Horde all ride to Mangup under truce, and Bosporan princes act as honest brokers."

 nd_tdr_phanariot_links: "Phanariot Links"
 nd_tdr_phanariot_links_desc: "Bosporan diplomats join the Greek Orthodox merchant houses of Constantinople, Smyrna, and Venice."

 nd_tdr_mountain_warfare: "Mountain Warfare Doctrine"
 nd_tdr_mountain_warfare_desc: "Fortified passes, blockhouse chains, and depot logistics turn every campaign in the Crimean uplands into an attritional ordeal for the invader."

 nd_tdr_taurican_admiralty: "Taurican Admiralty"
 nd_tdr_taurican_admiralty_desc: "The descendants of the Pontic liburnae crews maintain a small but fast escort fleet built around galley tactics inherited from the late Roman Black Sea fleet."

 nd_tdr_pontic_iconography: "Pontic Iconography"
 nd_tdr_pontic_iconography_desc: "The Pontic icon-painting tradition reaches its mature form, with workshops at Inkerman and Mangup producing books and panels for the Orthodox world. Unlocks the icon scriptorium production method in the Cave Monastery."

 nd_tdr_pontic_revival: "Pontic Grain Revival"
 nd_tdr_pontic_revival_desc: "Crimean grain combines drive a coarse spirit trade across the Black Sea littoral and the steppe routes. Unlocks the grain-spirit production method in the Pontic Curing Works."

 nd_tdr_neo_byzantine_theology: "Neo-Byzantine Theology"
 nd_tdr_neo_byzantine_theology_desc: "The patriarchate of Constantinople and the metropolitans of Crimea reaffirm the spiritual centrality of the Tauric peninsula."

 nd_tdr_komnenoid_absolutism: "Komnenoid Absolutism"
 nd_tdr_komnenoid_absolutism_desc: "The Komnenoid dynasty centralises taxation in the Mangup chancery and organises a salaried palace bureaucracy on Roman lines."

 nd_tdr_grain_combine: "Tauric Grain Combine"
 nd_tdr_grain_combine_desc: "Customs reforms and centralised storage at Caffa and Cherson allow Bosporan wheat to dominate Black Sea grain markets."

 # ============================================================
 # Custom units
 # ============================================================
 a_nd_tdr_mangup_drungaroi: "Mangup Drungaroi"
 a_nd_tdr_mangup_drungaroi_desc: "Heavy infantry of the Theodorite cliff garrisons. Slow, attritional, and hard to dislodge from rocky ground."

 a_nd_tdr_tauric_stratiotes: "Tauric Stratiotes"
 a_nd_tdr_tauric_stratiotes_desc: "Skirmishing light cavalry recruited from coastal Greeks and Goth horsemen of the Crimean uplands."

 n_nd_tdr_bosporan_liburnian: "Bosporan Liburnian"
 n_nd_tdr_bosporan_liburnian_desc: "A small fast escort galley patterned on the late Roman liburnae of the Black Sea, ideal for grain convoy escort and coastal patrol."

 n_nd_tdr_pontic_galley: "Pontic Galley"
 n_nd_tdr_pontic_galley_desc: "A heavy Black Sea war galley, the late descendant of the Pontic liburnae crews. Faster than vanilla galleys and with a heavier hull suited to Black Sea conditions."

 # ============================================================
 # Custom levies
 # ============================================================
 levy_nd_tdr_mangup_drungaroi: "Mangup Drungaroi Levy"
 levy_nd_tdr_mangup_drungaroi_desc: "Heavy infantry levy raised from the upland villages of Theodoro."

 # ============================================================
 # Custom buildings
 # ============================================================
 nd_tdr_cliff_citadel: "Mangup Cliff Citadel"
 nd_tdr_cliff_citadel_desc: "The cyclopean curtain walls and the Octagonal Citadel of the Mangup plateau, rebuilt on Justinianic foundations."

 nd_tdr_cave_monastery: "Cave Monastery"
 nd_tdr_cave_monastery_desc: "Rock-cut chapels, cells, and refectories carved into the limestone cliffs of Inkerman and Eski-Kermen, centre of Pontic monastic learning."

 nd_tdr_tauric_emporion: "Tauric Emporion"
 nd_tdr_tauric_emporion_desc: "A fortified merchant quarter on the Tauric coast where Greek, Italian, Pontic, and Tatar traders converge under Bosporan custom."

 # ============================================================
 # Production methods (named so they don't show as auto-generated)
 # ============================================================
 nd_tdr_citadel_maintenance: "Cliff Garrison Upkeep"
 nd_tdr_citadel_maintenance_desc: "Stone, timber, and weaponry to keep the curtain walls and the standing garrison in fighting order."

 nd_tdr_cave_monastery_maintenance: "Cave Monastic Office"
 nd_tdr_cave_monastery_maintenance_desc: "Beeswax candles, paper, and books for the daily offices and the scriptorium."

 nd_tdr_icon_scriptorium: "Icon Scriptorium"
 nd_tdr_icon_scriptorium_desc: "Beeswax candles and parchment fuel the cave chapels' icon-painting and manuscript illumination workshops."

 nd_tdr_emporion_cooperage: "Tauric Cooperage"
 nd_tdr_emporion_cooperage_desc: "The cooperage quarter of the emporion prepares barrels and caulked hulls for the grain fleet, consuming salt fish and grain stores."

 nd_tdr_pontic_workshop: "Pontic Curing Works"
 nd_tdr_pontic_workshop_desc: "Coastal curing yards and grain distilleries on the Tauric shore. The Genoese factor at Caffa wired the Pontic peninsula into the Mediterranean luxury and victualling trades; this is the production-side complement to the trade-side Tauric Emporion."

 nd_tdr_caviar_works: "Pontic Caviar Works"
 nd_tdr_caviar_works_desc: "Pontic sturgeon roe is salted and barreled at Caffa for the luxury trade to Constantinople, Genoa, and Cairo."

 nd_tdr_grain_spirits: "Pontic Grain Spirits"
 nd_tdr_grain_spirits_desc: "A coarse grain spirit is distilled from Crimean wheat and shipped along the Black Sea littoral and into the steppe trade."

 # ============================================================
 # DESTINY TREE
 # ============================================================

 # ===== Destiny advances =====
 nd_tdr_destiny: "Destiny of the Cimmerian Shore"
 nd_tdr_destiny_desc: "The council of Mangup commits to the long project of the revived state. Two roads lie open before the basileus: a Pontic Hegemon striding the Black Sea ring, or a Tauric Imperium reaching deep into the steppe."

 nd_tdr_dest_pontic_reach: "The Pontic Reach"
 nd_tdr_dest_pontic_reach_desc: "Take the southern Black Sea entrepots of Sinope and Amasra to open the Mithridatic ring around the Pontus Euxinus."

 nd_tdr_dest_black_sea_mastery: "Black Sea Mastery"
 nd_tdr_dest_black_sea_mastery_desc: "Bring Trebizond and Varna under Bosporan customs, holding the eastern and western flanks of the Pontic littoral."

 nd_tdr_dest_mithridates_heir: "Heir of Mithridates"
 nd_tdr_dest_mithridates_heir_desc: "Sit at Constantinople and close the ancient ring of Mithridates Eupator. Unlocks the Mithridatic Admiralty building."

 nd_tdr_dest_steppe_frontier: "The Steppe Frontier"
 nd_tdr_dest_steppe_frontier_desc: "Take the Don and Volga gateways at Tana and Sarai al-Jadid, opening the caravan road from Crimea into the Horde lands."

 nd_tdr_dest_ruthenian_outreach: "Ruthenian Outreach"
 nd_tdr_dest_ruthenian_outreach_desc: "Reach Kyiv and the Dnieper road, drawing the Ruthenian grain network into the Mangup chancery."

 nd_tdr_dest_ecumenical_throne: "The Ecumenical Throne"
 nd_tdr_dest_ecumenical_throne_desc: "Stride the Volga and Dnieper roads as a multiethnic kingdom of Greek, Goth, Tatar, Alan, and Ruthenian. Unlocks the Mangup Imperial Chancery."

 # ===== Destiny event nd_tdr.7 -- root =====
 nd_tdr.7.t: "The Long Road from Mangup"
 nd_tdr.7.d: "The work of forming a kingdom is finished. The work of growing one begins. In the rock-cut hall of the basilica at Mangup the council of the realm meets in full: the cliff-village dynasts, the strategoi of Theodoro, the metropolitan and his hegumens, the Karaim and Italian merchants of the Tauric coast.\n\nTwo destinies are debated. The first, voiced by the Greek archons, is the Pontic Hegemon: a thalassocracy on the Mithridatic model, gathering the harbours of Sinope, Trebizond, Varna, and at last Constantinople itself, into a single Bosporan ring. The second, voiced by the Goth and Alan dynasts and the Phanariot grain-houses, is the Tauric Imperium: a multiethnic land kingdom striding from Mangup to Tana, Sarai, and Kyiv, weaving every people of the Pontic steppe into one realm under the patriarch.\n\nBoth roads are long. The kingdom commits to a destiny."
 nd_tdr.7.a: "The work of generations begins"

 # ===== Destiny event nd_tdr.8 -- A1 Pontic Reach =====
 nd_tdr.8.t: "The Mithridatic Ring"
 nd_tdr.8.d: "The grain-flag of the Bosporan king flies above the kastron of Sinope and the harbour of Amasra. The southern shore of the Pontus Euxinus, lost to Rome since the day Mehmed the Ottoman took the city of Trebizond, is once more a customs frontier of a Hellenic king. The fishermen of Sinope kiss the hand of the new strategos and pay their toll in silver and dried bonito.\n\nIn the council the strategoi mark the next reach: Trebizond in the east, Varna in the west, and after them Constantinople itself, where the ring closes."
 nd_tdr.8.a: "Mark the next harbours on the strategos's chart"

 # ===== Destiny event nd_tdr.9 -- A2 Black Sea Mastery =====
 nd_tdr.9.t: "Trebizond and Varna"
 nd_tdr.9.d: "The two flanks of the Mithridatic ring are taken. Trebizond, last redoubt of the Komnenian basileia, opens its gates to the Bosporan basileus as a kinsman by descent and not as a conqueror. The Megas Komnenos's nephew rides at the king's stirrup. At Varna the western harbour acknowledges the same crown and the customs-house of Caffa moves a clerk to oversee the new toll-books.\n\nNow the question is whether to pour the new revenue into the grain fleet that sails to the Aegean, or into the customs houses that tax the merchants who pass through. The merchants of Genoa lean toward both at once."
 nd_tdr.9.a: "Pour the silver into the grain fleet"
 nd_tdr.9.b: "Build the customs houses thick"

 STATIC_MODIFIER_NAME_nd_tdr_dest_grain_convoy: "Pontic Grain Convoy"
 STATIC_MODIFIER_DESC_nd_tdr_dest_grain_convoy: "The Bosporan grain run to the Aegean is escorted by light squadrons that double as a coastal blockade fleet. The militia complains the conscriptable men go to the oars."

 STATIC_MODIFIER_NAME_nd_tdr_dest_pontic_customs: "Pontic Customs"
 STATIC_MODIFIER_DESC_nd_tdr_dest_pontic_customs: "Bosporan customs houses sit at every great Black Sea harbour. The clerks grow rich and the warrior estates grow restless and bored."

 # ===== Destiny event nd_tdr.10 -- A3 Heir of Mithridates =====
 nd_tdr.10.t: "Heir of Mithridates Eupator"
 nd_tdr.10.d: "The basileus of the Cimmerian Shore enters the Augustaion of Constantinople. Two thousand years after Mithridates VI Eupator, last king of Pontus and master of the Black Sea, walked these stones, a basileus of his old country sits beneath the dome of Justinian's church. Hagia Sophia is sung in Greek again. The patriarch crowns the new emperor as basileus of the Romans and as king of the Bosporus together.\n\nWhat shape shall the new Pontic order take? A great war fleet to make the inner sea a Bosporan lake, by the model of the Mithridatic admirals; or a soft hegemony of treaties and peace congresses, knitting Trebizond, Athens, Smyrna, and Caffa into one trading commonwealth?"
 nd_tdr.10.a: "A war fleet to lock the inner sea"
 nd_tdr.10.b: "A peace among the Pontic harbours"

 STATIC_MODIFIER_NAME_nd_tdr_dest_mithridatic_fleet: "Mithridatic War Fleet"
 STATIC_MODIFIER_DESC_nd_tdr_dest_mithridatic_fleet: "Heavy galleys patrol the Pontic ring under the colours of the new Bosporan basileia, the late descendants of the Mithridatic admirals."

 STATIC_MODIFIER_NAME_nd_tdr_dest_pontic_basileia: "Pontic Basileia"
 STATIC_MODIFIER_DESC_nd_tdr_dest_pontic_basileia: "Treaties and peace congresses bind the Pontic harbours into a soft hegemony. The price is a slower but legitimate war, and the warrior estates wear out."

 # ===== Destiny event nd_tdr.11 -- B1 Steppe Frontier =====
 nd_tdr.11.t: "Tana and Sarai"
 nd_tdr.11.d: "The basileus of Mangup rides north and east, and the steppe roads bow to him. At Tana the Genoese factor pays his old toll into a new treasury. At Sarai al-Jadid, the new capital of the Volga ulus, a Bosporan resident sits in the bazaar with his Greek and Tatar scribes. The grain caravans from Caffa to the Volga move freely under one customs.\n\nFrom these gateways the road runs further: to Kyiv on the Dnieper, to Beljamen on the Don bend, and at last to a court that holds Greek and Goth and Tatar and Ruthenian under one crown."
 nd_tdr.11.a: "Mark the road north toward Kyiv"

 # ===== Destiny event nd_tdr.12 -- B2 Ruthenian Outreach =====
 nd_tdr.12.t: "The Dnieper Road"
 nd_tdr.12.d: "Kyiv on the Dnieper acknowledges the basileus of Mangup. The grain caravans that fed Constantinople in the days of Cherson and Tmutarakan run again. The Phanariot grain-houses of the Tauric coast send factors to the wharves of Kyiv, and the metropolitan of Kyiv sends a delegation to the patriarch of Constantinople through Mangup, restoring the old Pontic-Ruthenian church road.\n\nWhich vein shall the kingdom plough? Open contracts to steppe captains and Ruthenian Cossacks, drawing them into Bosporan service for the long campaigns ahead? Or a Phanariot chancery in Mangup, binding the grain-houses and the clergy of Kyiv into the kingdom's standing administration?"
 nd_tdr.12.a: "Open contracts to steppe and Cossack captains"
 nd_tdr.12.b: "Build the Phanariot chancery"

 STATIC_MODIFIER_NAME_nd_tdr_dest_dnieper_road: "Captains of the Dnieper Road"
 STATIC_MODIFIER_DESC_nd_tdr_dest_dnieper_road: "Steppe captains and Ruthenian Cossacks ride for the basileus on long contracts. The court at Mangup feels distant and provincial when the wars are fought far north."

 STATIC_MODIFIER_NAME_nd_tdr_dest_phanariot_chancery: "Phanariot Chancery"
 STATIC_MODIFIER_DESC_nd_tdr_dest_phanariot_chancery: "Greek merchant houses and Kyivan clergy serve the Mangup chancery. The price is a mood of restless ambition in the wealthier provinces."

 # ===== Destiny event nd_tdr.13 -- B3 Ecumenical Throne =====
 nd_tdr.13.t: "The Ecumenical Throne"
 nd_tdr.13.d: "Greek, Goth, Tatar, Alan, Cuman, Ruthenian, Italian: each people of the long Pontic steppe acknowledges the basileus of Mangup. In the cliff hall of the Octagonal Citadel the rite of acclamation is read in seven tongues, and the metropolitan blesses the throne in the old Pontic Greek of the cave monasteries.\n\nWhat character shall the imperium take? A Komnenoid chancery, a salaried palace bureaucracy on Roman lines, marshalling drilled foot regiments under the cliff banner of Theodoro? Or a steppe basileia, raising horse companies of Tatar and Cuman warriors under the old khans' banners and the new king's seal, and ruling as the heir of Mithridates and Genghis at once?"
 nd_tdr.13.a: "A Komnenoid chancery and drilled foot regiments"
 nd_tdr.13.b: "A steppe basileia of horse companies"

 STATIC_MODIFIER_NAME_nd_tdr_dest_komnenoid_chancery: "Komnenoid Chancery"
 STATIC_MODIFIER_DESC_nd_tdr_dest_komnenoid_chancery: "A salaried palace bureaucracy on the cliff at Mangup drills foot regiments and runs siegecraft on Roman lines."

 STATIC_MODIFIER_NAME_nd_tdr_dest_steppe_basileia: "Steppe Basileia"
 STATIC_MODIFIER_DESC_nd_tdr_dest_steppe_basileia: "Horse companies of Tatar and Cuman warriors ride under the basileus's seal, and the khans' banners are stitched into the cliff standard."

 # ===== Destiny capstone buildings =====
 nd_tdr_mithridatic_admiralty: "Mithridatic Admiralty"
 nd_tdr_mithridatic_admiralty_desc: "A fortified shipyard, sail loft, and rope-walk system on the late Roman Pontic model. The seat of the Bosporan war fleet that closes the Mithridatic ring."

 nd_tdr_imperial_chancery: "Mangup Imperial Chancery"
 nd_tdr_imperial_chancery_desc: "A salaried palace bureaucracy seated on the cliff of Mangup. Greek, Goth, Tatar, Alan, and Ruthenian elites are wound into a single chancery on Komnenoid lines."

 nd_tdr_admiralty_maintenance: "Pontic Fleet Maintenance"
 nd_tdr_admiralty_maintenance_desc: "Lumber, naval supplies, tar, and tools to keep the war fleet of the Mithridatic Admiralty in trim."

 nd_tdr_chancery_maintenance: "Chancery Office"
 nd_tdr_chancery_maintenance_desc: "Paper, fine cloth, furniture, books, and tools for the salaried clerks of the Mangup chancery."

 # ============================================================
 # Bureaucracies
 # ============================================================
 AUTO_MODIFIER_NAME_nd_tdr_bureaucracy_authority: "Bosporan Bureaucratic Authority"
 AUTO_MODIFIER_DESC_nd_tdr_bureaucracy_authority: "The reconstituted Bosporan Kingdom, heir to Theodoro and the late Komnenoi, exercises full administrative authority over its Crimean dominion and may host the historical institutions of the Tauric coast."

 tdr_komnenoid_chancery_bureaucracy: "Komnenoid Chancery"
 tdr_komnenoid_chancery_bureaucracy_desc: "From the late fourteenth century the lords of Mangup styled themselves Komnenodoukai, and their chancery dispensed Byzantine titulature -- sebastos, protostrator, eparch, megas doux -- to retainers, steppe intermediaries, and Genoese factors alike. Drafting Greek charters in the chancery hand of the late Palaiologan Empire, the household conducted the marriage diplomacy that tied the Crimean court to Trebizond, Wallachia, Moscow, and the surviving Komnenian lines. The dignity inflated faster than the polity grew, but it bound the realm into a single ceremonial pyramid descending from the Mangup throne."

 tdr_cliff_monastery_synod_bureaucracy: "Cliff-Monastery Synod"
 tdr_cliff_monastery_synod_bureaucracy_desc: "The Pontic Orthodox spiritual establishment of Crimea was organised around the cave-cut monasteries of Inkerman, Eski-Kermen, Chufut-Kale, and the rock-chapels of Mangup, descending from the Justinianic foundations of the sixth century. The synod arbitrated parish discipline, licensed the Crimean icon-painting school of Cappadocian and Trapezuntine descent, and housed the Greek schools that taught the upland villagers to read. The Karaite, Armenian, and Catholic Genoese communities of the coast lived under its de-facto religious tolerance even when the Constantinopolitan patriarchate forbade it."

 tdr_tauric_customs_house_bureaucracy: "Tauric Customs House"
 tdr_tauric_customs_house_bureaucracy_desc: "The port-customs apparatus regulating the cosmopolitan emporia of the Tauric coast: Cherson under the Byzantines, Caffa under the Genoese, Soldaia under Venice and then Genoa, Vosporo astride the Cimmerian strait. The Bosporan revival inherits the Genoese commerciaria and the Byzantine kommerkion in parallel, levying ad-valorem duties on grain, salt fish, caviar, slaves, wax, and silk in transit. The crown and the great Greek and Italian merchant houses prosper together; the upland peasants who feed the ports pay in food they do not eat."

 tdr_gothic_upland_council_bureaucracy: "Gothic Upland Council"
 tdr_gothic_upland_council_bureaucracy_desc: "The consultative assembly of the Crimean Gothic upland villages, the late descendants of Wulfila's Goths whose tongue Ogier de Busbecq still recorded at the Ottoman court in 1562. Village elders met seasonally on the Mangup plateau and at Eski-Kermen to apportion garrison service to the cliff fortresses, allocate transhumance pastures along the Crimean Mountains, and present grievances to the Greek-speaking court below. Recognition of the Gothic council bound the upland tenants and their petty lords into the realm as armed allies rather than subjects, but it tied the crown's hands on tax, conscription, and land tenure in half its hinterland."
