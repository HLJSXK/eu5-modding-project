l_english:
 # === Variable tooltips (required for hidden_effect set_variable lines) ===
 nd_bnh_formed_tt: "Beth Nahrain has been formed."
 nd_bnh_path_a_tt: "Following the Patriarch's Restoration."
 nd_bnh_path_b_tt: "Following the Tur Abdin Defenders."
 nd_bnh_path_c_tt: "Following the Edessene Renaissance."
 # === Formation Event Modifiers ===
 STATIC_MODIFIER_NAME_nd_bnh_patriarchs_restoration: "The Patriarch's Restoration"
 STATIC_MODIFIER_DESC_nd_bnh_patriarchs_restoration: "The Catholicos of the East is enthroned at Mosul, the patriarchal letters reach again from Trichur to Tabriz, and the rural Mesopotamian parishes are reorganized under royal patronage. The Aramaic-speaking clergy stand as the spine of the new state."
 STATIC_MODIFIER_NAME_nd_bnh_tur_abdin_defenders: "The Tur Abdin Defenders"
 STATIC_MODIFIER_DESC_nd_bnh_tur_abdin_defenders: "The deyrayoutho of Mor Gabriel and Deir al-Zafaran swear royal fealty. Highland militia from the Christian villages garrison the new kingdom's frontier; the monastic chapters quartermaster the troops they raise."
 STATIC_MODIFIER_NAME_nd_bnh_edessene_renaissance: "The Edessene Renaissance"
 STATIC_MODIFIER_DESC_nd_bnh_edessene_renaissance: "The kingdom revives the Crusader-era Latin-Syriac concord that the County of Edessa once embodied. Italian merchants are received at Mosul, Latin clerics teach alongside Aramaic schoolmen, and the kingdom is read as a respectable Christian peer in the western chanceries."
 # === DHE Modifiers ===
 STATIC_MODIFIER_NAME_nd_bnh_translators_mosul: "Translators of Mosul"
 STATIC_MODIFIER_DESC_nd_bnh_translators_mosul: "Bar Hebraeus' translation circle at Mosul renders Greek philosophy, Persian medicine, and Arabic astronomy into Syriac and Aramaic, supplying every Eastern Christian see with a usable corpus."
 STATIC_MODIFIER_NAME_nd_bnh_qanat_revival: "Qanat Revival"
 STATIC_MODIFIER_DESC_nd_bnh_qanat_revival: "The crown's qanat surveyors map every broken aquifer line in the lower Tigris and Euphrates lowlands. Sasanian-era hydraulic engineering is restored, and the Sawad fields fill with peasants returning from the highlands."
 STATIC_MODIFIER_NAME_nd_bnh_river_caravans: "River Caravans"
 STATIC_MODIFIER_DESC_nd_bnh_river_caravans: "The Mosul-Baghdad corridor is reopened under royal license. Aramaic-speaking caravan guilds tax the Tigris-Euphrates traffic, and Mesopotamian merchants reach the Persian Gulf, Aleppo, and the Anatolian highlands."
 STATIC_MODIFIER_NAME_nd_bnh_mor_gabriel_endowment: "Mor Gabriel Endowment"
 STATIC_MODIFIER_DESC_nd_bnh_mor_gabriel_endowment: "Royal endowment formalizes Mor Gabriel as a kingdom institution. Its scriptorium becomes the chancery's archive; its abbot sits on the royal council."
 STATIC_MODIFIER_NAME_nd_bnh_eastern_missions: "Eastern Missions"
 STATIC_MODIFIER_DESC_nd_bnh_eastern_missions: "The Patriarchate dispatches metropolitans to the Silk Road dioceses again. Samarkand, Tabriz, and the Malabar coast send acknowledgments back to Mosul; Aramaic prayer is heard from the Mediterranean to the South China Sea."
 STATIC_MODIFIER_NAME_nd_bnh_mesopotamian_consolidation: "Mesopotamian Consolidation"
 STATIC_MODIFIER_DESC_nd_bnh_mesopotamian_consolidation: "The kingdom turns its full administrative weight on its Mesopotamian heartland. Aramaic supplants Arabic and Kurdish in the Sawad villages, and the patriarchate's diocesan registers are reissued in Syriac."
 # === Formation Event ===
 nd_bnh.1.t: "The Council of Mosul"
 nd_bnh.1.d: "Beth Nahrain — the Land Between the Rivers — is proclaimed at Mosul. The Catholicos of the East, the abbots of Tur Abdin, the Latin chaplains who survive from the County of Edessa, and the Aramaic-speaking notables of the Sawad gather in the cathedral of the Old Town. The Mongol overlordship has finally fractured; the ancient Christian polity of Mesopotamia must now decide what character it will assume.\n\nThree visions stand on the council floor. The Catholicos argues for a kingdom rebuilt around the Patriarchate, the surviving institution that gives the Aramaic-speaking peoples a continuous identity. The abbots of Tur Abdin demand a militarized highland kingdom, monastic-fortress at its core, ready to outlast every overlord that comes after. The Edessene faction, heirs of the Crusader-Syriac condominium, urge engagement with the Latin west and the Italian merchant republics — the kingdom as a respectable Christian peer.\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_bnh.1.a: "The Catholicos shall lead — restore the Patriarchate."
 nd_bnh.1.b: "Tur Abdin shall guard us — fortify the highlands."
 nd_bnh.1.c: "Edessa shall trade with us — engage the Latin west."
 # === DHE 2: Translators of Mosul ===
 nd_bnh.2.t: "The Storehouse of Mysteries"
 nd_bnh.2.d: "Gregory Bar Hebraeus, Maphrian of the East, completes his Storehouse of Mysteries — a Syriac biblical commentary drawing on Greek, Persian, and Arabic scholarship — and his Chronicon, the universal history that anchors Beth Nahrain's identity. The translation house at Mosul renders Aristotle, Galen, and Ptolemy into the Aramaic vernacular, and from Aramaic into the Latin and Arabic that surround the kingdom. The Christian scholarly Mesopotamia thought lost in 1258 stands again, and its books are read from Trichur to Reims."
 nd_bnh.2.a: "Aramaic learning lives."
 # === DHE 3: Mongol-Broken Land ===
 nd_bnh.3.t: "The Broken Canals"
 nd_bnh.3.d: "The kingdom inherits a devastated countryside. The qanat networks south of Mosul, sustained by Sasanian and Abbasid administrations, were broken in the Mongol campaigns; whole tracts of the Sawad have reverted to scrubland. The crown's surveyors lay before the king two strategic responses. The first: rebuild the irrigation grid, recover the Mesopotamian agricultural heartland, and resettle the peasant villages that supplied the great cities. The second: write off the irrigation, channel the kingdom's labor and capital into the overland trade corridor that already connects Mosul to Baghdad and on to Basra."
 nd_bnh.3.a: "Restore the qanats. The land must feed the kingdom."
 nd_bnh.3.b: "Rebuild the trade roads. Caravans, not canals."
 # === DHE 4: Mor Gabriel Endowment ===
 nd_bnh.4.t: "The Saffron Crown"
 nd_bnh.4.d: "The royal court formalizes Mor Gabriel — the monastery founded in 397, the oldest functioning Christian monastery on earth — as a kingdom institution. Its abbot is granted the title of Royal Maphrian; its scriptorium is incorporated into the royal chancery; its judicial chamber is recognized as the apex of Syriac canon law. Beth Nahrain binds itself to the saffron-stoned monasteries that carried Christian Mesopotamia through nine centuries of overlordship."
 nd_bnh.4.a: "Mor Gabriel is the kingdom's heart."
 # === DHE 5: Eastern Missions ===
 nd_bnh.5.t: "The Far Dioceses"
 nd_bnh.5.d: "The Catholicos brings before the king the registers of the Eastern dioceses: Samarkand, Tabriz, Khanbaliq, the Malabar coast, the synodal letters of metropolitans whose flocks are still reciting Aramaic prayers from the Pamirs to the Bay of Bengal. The patriarchate proposes to dispatch new metropolitans, restore the missionary registers, and reactivate the network. But others argue the kingdom should focus its energy at home: the Mesopotamian heartland, not the distant frontiers."
 nd_bnh.5.a: "Send the metropolitans east. The Church of the East lives."
 nd_bnh.5.b: "Consolidate at home. Mesopotamia first."
 # === Heritage Advances ===
 nd_bnh_catholicate_of_seleucia: "Catholicate of Seleucia"
 nd_bnh_catholicate_of_seleucia_desc: "The patriarchal seat of the Church of the East is restored at Mosul, with formal jurisdiction reasserted over the diaspora dioceses. The Catholicos becomes the kingdom's spiritual prime minister."
 nd_bnh_mor_gabriel_network: "Mor Gabriel Network"
 nd_bnh_mor_gabriel_network_desc: "The Tur Abdin monasteries — Mor Gabriel, Deir al-Zafaran, Mor Hananyo — are recognized as a state network, with their scriptoria, judicial chambers, and rural land grants formalized in royal charter."
 nd_bnh_tur_abdin_highlanders: "Tur Abdin Highlanders"
 nd_bnh_tur_abdin_highlanders_desc: "The monastic-village militia of the highland Tur Abdin, the same fighters who held the region under Artuqid, Mongol, and Aq Qoyunlu overlords, are formalized as a kingdom levy."
 nd_bnh_sawad_irrigation: "Sawad Irrigation"
 nd_bnh_sawad_irrigation_desc: "The qanat and canal infrastructure of the Tigris-Euphrates lowlands is rebuilt under crown administration. Surveyors map the broken Mongol-era networks; royal corps repair the breaches."
 nd_bnh_hudaye_book: "Hudaye Book of Laws"
 nd_bnh_hudaye_book_desc: "Bar Hebraeus' codification of Christian Mesopotamian civil law (1276) — the Hudaye, the Book of Directions — is adopted as the kingdom's legal corpus, drawing on Roman, Sasanian, and Islamic precedent through a Syriac framework."
 nd_bnh_syriac_translation_movement: "Syriac Translation Movement"
 nd_bnh_syriac_translation_movement_desc: "The medieval translation programs are restored. Greek philosophy, Persian medicine, and Arabic astronomy enter Syriac in vast quantity, transmitted thence to Latin Christendom and the Arabic-speaking courts."
 nd_bnh_maphrianate: "Maphrianate of the East"
 nd_bnh_maphrianate_desc: "The Maphrian, the Patriarch's eastern vicar, governs Mesopotamian dioceses from Mosul while the Patriarch governs from Antioch. Two-headed religious administration extends the kingdom's diplomatic reach."
 nd_bnh_mosul_baghdad_caravans: "Mosul-Baghdad Caravans"
 nd_bnh_mosul_baghdad_caravans_desc: "The great corridor of Mesopotamian overland trade is reopened, linking the Anatolian highland routes to the Persian Gulf. Aramaic remains the lingua franca of the caravans."
 nd_bnh_edessene_schoolmen: "Edessene Schoolmen"
 nd_bnh_edessene_schoolmen_desc: "The inheritance of the School of Edessa, revived through the County of Edessa's Latin-Syriac academies. Greek and Latin scholarship fertilize the Syriac curriculum."
 nd_bnh_tur_abdin_wardens: "Tur Abdin Wardens"
 nd_bnh_tur_abdin_wardens_desc: "The monastic-chapter wardens of Mor Gabriel and the surrounding fortresses are professionalized into a buildable infantry guard, the regular formation that grew out of the highland militia."
 nd_bnh_mesopotamian_revival: "Mesopotamian Revival"
 nd_bnh_mesopotamian_revival_desc: "The systematic rebuilding of the canal grid south of Mosul. Royal engineers undertake what the Mongol catastrophe had broken: a Mesopotamian agricultural revival on Sasanian foundations."
 nd_bnh_silk_road_metropolitanate: "Silk Road Metropolitanate"
 nd_bnh_silk_road_metropolitanate_desc: "The Patriarchate's Silk Road dioceses — Samarkand, Khanbaliq, Malabar — are reactivated as state policy. The Church of the East's missionary network becomes a kingdom diplomatic instrument."
 nd_bnh_bar_hebraeus_court: "Bar Hebraeus' Court"
 nd_bnh_bar_hebraeus_court_desc: "The polymath Maphrian's circle of physicians, astronomers, and translators is constituted as the kingdom's academy. The Greek-Syriac-Arabic trilingual scholarship of his Mosul school becomes a state institution."
 nd_bnh_christian_diwan: "Christian Diwan"
 nd_bnh_christian_diwan_desc: "The kingdom adapts the Sasanian-Abbasid diwan model to Christian governance. Aramaic-script scribes administer revenue, military, and ecclesiastical accounts in parallel."
 nd_bnh_jundishapur_tradition: "Jundishapur Tradition"
 nd_bnh_jundishapur_tradition_desc: "The medical-academic tradition descended from the Sasanian academy of Gondeshapur, where Christian Nestorian physicians had preserved Galenic medicine, is restored as a kingdom institution."
 nd_bnh_patriarchal_diaspora: "Patriarchal Diaspora Network"
 nd_bnh_patriarchal_diaspora_desc: "The Patriarchate's correspondence with diaspora communities — from the Levant to Malabar — is converted into a formal diplomatic instrument under royal patronage."
 nd_bnh_highland_garrison: "Highland Garrison System"
 nd_bnh_highland_garrison_desc: "The Tur Abdin monastic-military system is extended into a kingdom-wide highland fort line answering to Mor Gabriel. Each fortress has its own monastic chapter."
 nd_bnh_riverine_pontoneers: "Riverine Pontoneers"
 nd_bnh_riverine_pontoneers_desc: "The kingdom's engineering corps specialize in Tigris-Euphrates bridge and pontoon work, the heirs of Sasanian and Abbasid riverine engineers."
 nd_bnh_crown_of_two_rivers: "Crown of the Two Rivers"
 nd_bnh_crown_of_two_rivers_desc: "The kingdom institutionalizes its Mesopotamian identity into a constitutional doctrine: the king as protector of the Two Rivers, of all who dwell between them — Syriac, Arabic, Kurdish, and Armenian alike."
 nd_bnh_aramaic_civil_service: "Aramaic Civil Service"
 nd_bnh_aramaic_civil_service_desc: "Bureaucratic Syriac is codified for kingdom-wide administration, parallel to the Arabic and Persian official languages of neighboring states. Aramaic-script scribes staff every diwan."
 nd_bnh_catholicate_constitutional: "Catholicate Constitutional"
 nd_bnh_catholicate_constitutional_desc: "The Catholicos of the East takes a formal advisory seat in the absolutist court, the Christian counterpart to Sunni and Shia ulema legal traditions."
 nd_bnh_mosul_foundries: "Mosul Foundries"
 nd_bnh_mosul_foundries_desc: "Iron from the Hakkari mountains and copper from the Diyarbakir hills feed the kingdom's late-era armaments industry, concentrated at Mosul."
 nd_bnh_syriac_print: "Syriac Print Revolution"
 nd_bnh_syriac_print_desc: "The kingdom adopts movable-type Syriac printing. Aramaic scripture, law, and chronicles finally have a printed life, transmitted across the diaspora."
 nd_bnh_mesopotamian_industry: "Mesopotamian Industry"
 nd_bnh_mesopotamian_industry_desc: "The riverine mills, foundries, and textile workshops of the lower Tigris are integrated into a single industrial base. Mesopotamia rejoins the productive economies of the modern world."
 nd_bnh_civic_synod: "Aramaic Civic Synod"
 nd_bnh_civic_synod_desc: "The patriarchal synod is converted into a civic chamber, giving Aramaic Christianity formal constitutional voice in the kingdom's late-era governance."
 # === Buildings ===
 nd_bnh_catholicate_palace: "Catholicate Palace"
 nd_bnh_catholicate_palace_desc: "The patriarchal seat at Mosul. The Catholicos of the East holds court here, administers diocesan justice, and maintains the Aramaic-script registry of the diaspora churches."
 nd_bnh_tur_abdin_monastery: "Tur Abdin Monastery"
 nd_bnh_tur_abdin_monastery_desc: "A hilltop monastic complex on the Mor Gabriel / Deir al-Zafaran model. Scriptorium, judicial chamber, and pilgrim hostel; the institution that held the Christian Mesopotamian population through every overlord change."
 nd_bnh_qanat_works: "Qanat Works"
 nd_bnh_qanat_works_desc: "Underground irrigation channels draining mountain aquifers into lowland fields, the engineering legacy of Sasanian and Abbasid Mesopotamia, restored under crown surveyors."
 nd_bnh_translation_house: "Syriac Translation House"
 nd_bnh_translation_house_desc: "Greek philosophy, Persian medicine, and Arabic astronomy enter Syriac here, then are forwarded westward through the Edessene channel into Latin. The institutional descendant of Bayt al-Hikma's Christian translators."
 nd_bnh_river_caravanserai: "River Caravanserai"
 nd_bnh_river_caravanserai_desc: "The great roadside hostels of the Mosul-Baghdad corridor, run by Aramaic-speaking Syriac-Christian guilds. The riverine artery of Mesopotamian commerce."
 nd_bnh_bar_hebraeus_library: "Bar Hebraeus Library"
 nd_bnh_bar_hebraeus_library_desc: "The great Mosul library of Maphrian Bar Hebraeus, inherited by his successors and rebuilt as the kingdom's flagship institution of learning. The Storehouse of Mysteries was first compiled here."
 nd_bnh_jundishapur_school: "Jundishapur Medical School"
 nd_bnh_jundishapur_school_desc: "The kingdom's restored medical academy, spiritual heir of the Sasanian Gondeshapur where Nestorian physicians had preserved Galenic medicine. Surgeons, herbalists, and astronomers train here."
 nd_bnh_highland_fortress: "Highland Fortress"
 nd_bnh_highland_fortress_desc: "The Tur Abdin model extended kingdom-wide. Each fortress combines a defensive stronghold with a small monastic chapter providing chaplaincy and judicial services to its garrison."
 nd_bnh_mosul_foundry: "Mosul Foundry"
 nd_bnh_mosul_foundry_desc: "Iron from the Hakkari mountains, copper from the Diyarbakir hills, all forged in the kingdom's central armaments works. Cannons cast here arm the late-era Beth Nahrain army."
 nd_bnh_river_manufactory: "Riverine Manufactory"
 nd_bnh_river_manufactory_desc: "Riverine mills powering textile and paper manufacture, the lower Tigris turned into an industrial corridor. Aramaic-language paper and book production for the diaspora."
 # === Building Production Methods ===
 nd_bnh_catholicate_upkeep: "Catholicate Upkeep"
 nd_bnh_catholicate_upkeep_desc: "Altar candles, registry paper, liturgical books, and incense for the patriarchal seat and its diocesan chancery."
 nd_bnh_tur_abdin_upkeep: "Monastery Upkeep"
 nd_bnh_tur_abdin_upkeep_desc: "Candles for the night office, manuscripts for the scriptorium, and incense for the sanctuary of the hilltop chapter."
 nd_bnh_qanat_upkeep: "Qanat Maintenance"
 nd_bnh_qanat_upkeep_desc: "Stone, timber shoring, and surveyors' tools to keep the underground channels clear and the lowland fields watered."
 nd_bnh_translation_books_pm: "Syriac Translation"
 nd_bnh_translation_books_pm_desc: "Greek philosophy, Persian medicine, and Arabic astronomy rendered into Syriac and bound for the schools of the East and the Latin West."
 nd_bnh_caravanserai_upkeep: "Caravanserai Upkeep"
 nd_bnh_caravanserai_upkeep_desc: "Cloth, fresh horses, timber, and candles to keep the roadside hostels of the Mosul-Baghdad corridor open to the caravans."
 nd_bnh_library_upkeep: "Library Upkeep"
 nd_bnh_library_upkeep_desc: "Paper, reference volumes, candles, and incense for the reading halls and copyists of the great Mosul library."
 nd_bnh_jundishapur_upkeep: "Medical School Upkeep"
 nd_bnh_jundishapur_upkeep_desc: "Paper, medical treatises, and compounded medicaments for the wards and lecture halls of the restored physicians' academy."
 nd_bnh_highland_fortress_upkeep: "Fortress Upkeep"
 nd_bnh_highland_fortress_upkeep_desc: "Quarried stone, dressed masonry, arms, and tools to hold and repair the highland strongholds and their monastic garrisons."
 nd_bnh_foundry_pm: "Cannon Foundry"
 nd_bnh_foundry_pm_desc: "Hakkari mountain iron, charcoal, and finished tools cast into the artillery of the late-era Beth Nahrain army."
 nd_bnh_river_paper_pm: "River Paper Mill"
 nd_bnh_river_paper_pm_desc: "Flax, rag, and grain sizing worked by the riverine mills into Aramaic-language paper for the kingdom's scribes and presses."
 nd_bnh_print_house_pm: "Aramaic Printing"
 nd_bnh_print_house_pm_desc: "Paper and binding worked into mass-printed Aramaic newspapers, Syriac textbooks, and vernacular law codes."
 # === Units & Levies ===
 a_nd_bnh_tur_abdin_highlander: "Tur Abdin Highlander"
 a_nd_bnh_tur_abdin_highlander_desc: "Levy infantry from the highland villages of Tur Abdin around Mor Gabriel, specialists in mountain defense. The militia that held the region under nine centuries of overlords."
 a_nd_bnh_tur_abdin_warden: "Tur Abdin Warden"
 a_nd_bnh_tur_abdin_warden_desc: "The professionalized monastic-chapter warden, recruited and drilled into a regular heavy-infantry formation. Disciplined defenders of the kingdom's northern flank."
 levy_nd_bnh_tur_abdin_highlanders: "Tur Abdin Highlander Levy"
 nd_bnh_aramaic_print_press: "Aramaic Print Press"
 nd_bnh_aramaic_print_press_desc: "The kingdom's industrial-era printing institution. Aramaic newspapers, Syriac textbooks, and vernacular law codes go from scriptorium technique to mass production."
 nd_bnh_aramaic_print_house: "Aramaic Print House"
 nd_bnh_aramaic_print_house_desc: "The industrial printing complex of the late kingdom, mass-producing Aramaic newspapers, Syriac textbooks, and vernacular law for the diaspora and the kingdom's domestic schools."
 # === Destiny Tree ===
 # Path tooltips: destiny path A (imperial) gates on the formation choice
 # nd_bnh_path_b (Tur Abdin Defenders); destiny path B (civilization)
 # gates on nd_bnh_path_a (Patriarch's Restoration).
 nd_bnh_dest_path_a_tt: "Chose the #bold Tur Abdin Defenders#! formation path -- the militarist foundation needed to march toward the Restoration of Aššur"
 nd_bnh_dest_path_b_tt: "Chose the #bold Patriarch's Restoration#! formation path -- the scholarly foundation needed to walk the Light of the East"
 # === Destiny Advance Names ===
 nd_bnh_destiny: "The Mandate of Mor Aššur"
 nd_bnh_destiny_desc: "Beth Nahrain stands. Now the kingdom must declare what kind of polity it intends to be: the militarist heir of Aššur whose road runs through Mosul, Baghdad, and Damascus toward the imperial restoration of Assyria; or the civilizational pole of Eastern Christendom, the Christian intermediary between Latin west and Silk Road east. The mandate of the Mor settles on the king."
 nd_bnh_dest_a1: "Sedra of the Two Cities"
 nd_bnh_dest_a1_desc: "The Maphrian-General's writ reaches Mosul and Baghdad. The Tigris twin cities are the kingdom's, and the imperial road begins."
 nd_bnh_dest_a2: "March of the Maphrian-General"
 nd_bnh_dest_a2_desc: "The kingdom's banners reach Tabriz and Basra. Tabriz, where the Ilkhans had once held a Christian-court memory, returns to the Mor; Basra, the Shatt al-Arab, opens the Gulf to Aššur."
 nd_bnh_dest_a3: "The Crown of Aššur"
 nd_bnh_dest_a3_desc: "Damascus, Cairo, and Isfahan acknowledge the Maphrian-General. The kingdom's prestige crowns it as the lawful Assyrian successor; the way to the imperial restoration is open. (Form ASR.)"
 nd_bnh_dest_b1: "Hudaye of the Diaspora"
 nd_bnh_dest_b1_desc: "The Hudaye is read at the old Antiochene see, and Urfa silk binds the patriarchal market to the Silk Road. The Christian-Syriac intermediary stands."
 nd_bnh_dest_b2: "Beth Hekma Restored"
 nd_bnh_dest_b2_desc: "The treasury endows the Translator-Patriarchs of Mosul. The printing press is embraced at Seleucia, and the diaspora dioceses send back acknowledgments in Syriac, Greek, and Latin."
 nd_bnh_dest_b3: "The Sees of the Mor"
 nd_bnh_dest_b3_desc: "Samarkand and Jerusalem return to the patriarchal register. Global trade is embraced; the kingdom is read across Eurasia as the lawful Christian intermediary, the lasting Light of the East."
 # === Destiny Event Texts ===
 nd_bnh.6.t: "The Mandate of Mor Aššur"
 nd_bnh.6.d: "The Catholicos and the abbot of Mor Gabriel come together before the king with a solemn proposition: that the kingdom's destiny is not yet written. Two paths stand open. Down the first lies the imperial restoration: the kingdom marches the Tigris road, takes Baghdad, takes Damascus, takes Cairo, until the Crown of Aššur passes from memory into law and the Assyrian Empire stands again. Down the second lies the civilizational vocation: the kingdom is the lasting Christian-Syriac pole between Latin Europe and Tang-memory Asia, the patriarchate that holds the Silk Road dioceses, the Translator-Patriarchs whose Beth Hekma reads in three languages."
 nd_bnh.6.a: "The mandate is taken. The destiny shall be written."
 nd_bnh.7.t: "The Twin Cities"
 nd_bnh.7.d: "Mosul and Baghdad are taken. The Tigris flows entirely under the kingdom's banner; the Aramaic-speaking villages along the river welcome the Maphrian-General; the old Abbasid administrative cores are reorganized under royal diwan. The first stage of the imperial road is walked."
 nd_bnh.7.a: "Onward to Aššur."
 nd_bnh.8.t: "March of the Maphrian-General"
 nd_bnh.8.d: "Tabriz and Basra fall. The Ilkhanid memory of Christian princes at Tabriz is invoked; the Shatt al-Arab opens the Gulf to royal commerce. The Maphrian-General's marching column is now strong enough to project across either the Levantine or the Iranian frontier. The royal council asks how it shall be supplied."
 nd_bnh.8.a: "Ride out under the Strategos banner."
 nd_bnh.8.b: "Build the river-pontoon corps."
 nd_bnh.9.t: "The Crown of Aššur"
 nd_bnh.9.d: "Damascus, Cairo, and Isfahan acknowledge the Maphrian-General. The Latin chanceries call him the Assyrian; the Persian courts call him Lord of Two Rivers; the Mamluk seat at Cairo sends back tribute. The Catholicos crowns him as Mor Aššur, lawful king of Assyria, in the cathedral of Mosul. The imperial restoration stands -- Beth Nahrain has prepared the way for the Assyrian Empire."
 nd_bnh.9.a: "Crown me protector of the Levant."
 nd_bnh.9.b: "Raise the Aššur levies from every conquered land."
 nd_bnh.10.t: "Hudaye of the Diaspora"
 nd_bnh.10.d: "Antioch is restored to the kingdom and the Hudaye book of laws is read at the old patriarchal see. Silk arrives again at Mosul through the Urfa caravans; the Silk Road dioceses recognize the Christian-Syriac intermediary as the lawful patriarchal seat. The Light of the East kindles."
 nd_bnh.10.a: "The Light of the East kindles."
 nd_bnh.11.t: "Beth Hekma Restored"
 nd_bnh.11.d: "The royal treasury endows the Translator-Patriarchs of Mosul. The printing press is embraced at Seleucia; Aramaic, Greek, and Arabic scripture are set in movable type at the patriarchal works. The diaspora dioceses send acknowledgments back from Trichur, Tabriz, and Reims. The kingdom must now decide how its civilizational machine shall be governed."
 nd_bnh.11.a: "Refound the House of Wisdom under the patriarchate."
 nd_bnh.11.b: "Convene the Seleucia synod and consolidate."
 nd_bnh.12.t: "The Sees of the Mor"
 nd_bnh.12.d: "Samarkand and Jerusalem return to the patriarchal register. Global trade is embraced. The Latin chanceries, the Persian courts, the Tang-memory ministries of the Mongol successor states all read Beth Nahrain as the lawful Christian intermediary, the lasting pole between west and east. The Light of the East stands; the kingdom is complete without imperial pretension."
 nd_bnh.12.a: "Dispatch the metropolitans to the far dioceses."
 nd_bnh.12.b: "Endow the Aramaic Academy and consolidate at home."
 # === Destiny Timed Modifier Names ===
 STATIC_MODIFIER_NAME_nd_bnh_dest_strategos_march: "Strategos March"
 STATIC_MODIFIER_DESC_nd_bnh_dest_strategos_march: "The Maphrian-General's column moves under the old Byzantine-Sasanian Strategos banner: heavy cavalry shock, plundering of every fallen city, and a kingdom paying the political price of permanent campaign."
 STATIC_MODIFIER_NAME_nd_bnh_dest_riverine_logistics: "Riverine Logistics Corps"
 STATIC_MODIFIER_DESC_nd_bnh_dest_riverine_logistics: "The royal pontoneers rebuild the Tigris-Euphrates pontoon network as a logistics spine. Every bridge, fort, and depot is laid out by Aramaic-script engineers; the realm's construction ministries hum at peacetime pace."
 STATIC_MODIFIER_NAME_nd_bnh_dest_crown_of_assur: "The Crown of Aššur"
 STATIC_MODIFIER_DESC_nd_bnh_dest_crown_of_assur: "The Maphrian-General is crowned protector of the Levant. The royal armies fight under the Crown's holy mandate; war against the surrounding heretic states is read as righteous; but every neighbor remembers Cairo and is slow to suffer further provocation."
 STATIC_MODIFIER_NAME_nd_bnh_dest_assyrian_levies: "Levies of Aššur"
 STATIC_MODIFIER_DESC_nd_bnh_dest_assyrian_levies: "Each conquered city sends its quota of levies under royal banners. The kingdom's mercenary registers swell, the casus belli ministries draft new provocations daily, and the imperial machine rolls forward."
 STATIC_MODIFIER_NAME_nd_bnh_dest_house_of_wisdom: "House of Wisdom"
 STATIC_MODIFIER_DESC_nd_bnh_dest_house_of_wisdom: "The Translator-Patriarchs of Mosul refound the Bayt al-Hikma under royal endowment. Diplomats are dispatched to every chancery from Reims to Cathay; the patriarchal trade centers swell; but the Mor's stipends and diaspora subsidies debase the coin."
 STATIC_MODIFIER_NAME_nd_bnh_dest_seleucia_synod: "The Seleucia Synod"
 STATIC_MODIFIER_DESC_nd_bnh_dest_seleucia_synod: "The patriarchate's synod convenes at the Sasanian-era seat of Seleucia. Subjects, allies, and metropolitan provinces all swear loyalty in the cathedral; the kingdom's development quietly compounds; royal envoys negotiate with surprising weight."
 STATIC_MODIFIER_NAME_nd_bnh_dest_metropolitanate: "Far Metropolitanate"
 STATIC_MODIFIER_DESC_nd_bnh_dest_metropolitanate: "The Patriarchate dispatches metropolitans to Samarkand, Trichur, and the Mediterranean ports. Sea trade swells; the kingdom hires diaspora mercenaries cheap; the burgher and clergy estates work in concert."
 STATIC_MODIFIER_NAME_nd_bnh_dest_aramaic_academy: "Aramaic Academy"
 STATIC_MODIFIER_DESC_nd_bnh_dest_aramaic_academy: "The kingdom endows the Aramaic Academy at Mosul as the highest civic institution. Spy networks, military tacticians, and patriarchal officers train here; but the kingdom's scholar-classes settle into the comfortable certainty of being the Light of the East."
 # === Destiny Buildings ===
 nd_bnh_ziggurat_of_assur: "Ziggurat of Aššur"
 nd_bnh_ziggurat_of_assur_desc: "A revived Assyrian-style imperial monument at the seat of the Maphrian-General. Half temple of state, half barracks of the imperial guard, the ziggurat announces the Assyrian restoration to every surrounding people and binds the conquered Mesopotamian core to the dynastic capital."
 nd_bnh_beth_hekma: "Beth Hekma"
 nd_bnh_beth_hekma_desc: "The kingdom's revived Bayt al-Hikma, rebuilt under the patriarchate at Seleucia-Ctesiphon. Translators, astronomers, physicians, and synodal jurists work in parallel; the institution that makes Beth Nahrain the lasting Light of the East."
 # === Destiny Building PM Loc ===
 nd_bnh_ziggurat_of_assur_upkeep: "Ziggurat Upkeep"
 nd_bnh_ziggurat_of_assur_upkeep_desc: "The masonry, weaponry, and tools needed to maintain the imperial monument and its garrison barracks."
 nd_bnh_beth_hekma_upkeep: "Beth Hekma Upkeep"
 nd_bnh_beth_hekma_upkeep_desc: "Paper, books, incense, and beeswax for the patriarchal academy of translators, astronomers, and physicians."
 # === Bureaucracies ===
 bnh_catholicate_of_the_east_bureaucracy: "Catholicate of the East"
 bnh_catholicate_of_the_east_bureaucracy_desc: "The Catholicos-Patriarch of the East presides from the cathedral of Mosul, his metropolitans appointed across Mesopotamia, Persia, and the surviving missions to Kerala and Khanbaliq. The patriarchal court adjudicates Christian marriage, inheritance, and synodal discipline as a parallel arm of the realm. When sustained, the church's reach magnifies royal devotion and conversion; when neglected, both the clergy and the rural notables resent the diversion of tithe to a court they no longer attend."
 bnh_maphrianate_of_tagrit_bureaucracy: "Maphrianate of Tagrit"
 bnh_maphrianate_of_tagrit_bureaucracy_desc: "The Maphrian of the East, ranking from Mor Mattai monastery and second only to the Patriarch of Antioch, holds the Syriac Orthodox dioceses east of the Euphrates. Bar Hebraeus held the office from 1264 and used it to write the Chronography. Sustained, the Maphrianate trains a literate clerical class and codifies Syriac canon law; neglected, the friction with Antioch fuels external antagonism and slow stability decay."
 bnh_tur_abdin_defenders_bureaucracy: "Tur Abdin Defenders"
 bnh_tur_abdin_defenders_bureaucracy_desc: "The cliff-monasteries of the Tur Abdin plateau -- Mor Gabriel (founded 397), Deir al-Zafaran, Mor Yaqub of Salah -- and their village-militia networks held the Mesopotamian highlands as a self-policing Christian frontier under successive Artuqid, Ilkhan, Aq Qoyunlu, and Ottoman overlords. Royal recognition formalizes the bishop-abbots as frontier governors. Sustained, light infantry fight harder and recover faster; neglected, the bishops keep their guns but stop sending revenue to Mosul."
 bnh_aramaic_chancery_bureaucracy: "Aramaic-Syriac Chancery"
 bnh_aramaic_chancery_bureaucracy_desc: "The scriptoria of Mor Mattai, Mor Gabriel, and Deir al-Zafaran trained scribes who served not only the church but the Sasanian, Abbasid, and Ilkhanid courts in Syriac and Aramaic. Bar Hebraeus's Cream of Wisdom and the bilingual Syriac-Arabic court correspondence of the 13th century document a literate clerical-bureaucratic class. Refounded as a permanent civil service, the chancery turns the burgher and clerical households of Mosul, Edessa, and Nusaybin into the kingdom's literate spine."
 # === Bureaucracy Authority Auto-Modifier ===
 AUTO_MODIFIER_NAME_nd_bnh_bureaucracy_authority: "Bureaucratic Authority of Beth Nahrain"
 AUTO_MODIFIER_DESC_nd_bnh_bureaucracy_authority: "On formation, [BNH.GetName] gains the ability to host historical Syriac Christian bureaucracies."
