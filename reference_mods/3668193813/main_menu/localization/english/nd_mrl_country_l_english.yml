l_english:
 MRL: "Maharlika"
 MRL_ADJ: "Maharlikan"
 MRL_f: "Maharlika"
 MRL_f_desc: "The maharlika were the warrior-noble class of Tagalog society, the freemen who bore arms beside their datus and rajahs. Their cognates, the timawa of the Visayas, the maginoo of Luzon's coastal polities, and the bagani of Mindanao, formed the martial backbone of every Filipino people from Aparri to Sulu. Maharlika is the pan-archipelago nation that history never produced: a unified indigenous polity binding Luzon, the Visayas, and Mindanao under the freeman ideal, before Spanish galleons could ever reach Cebu. Form Maharlika to forge the Filipino civilization that drove out, or simply outlasted, every European, Dutch, and Bruneian incursion."
