l_english:
 AEG: "Aegyptus"
 AEG_ADJ: "Aegyptian"
 AEG_f: "Aegyptus"
 AEG_f_desc: "Forge a restored empire of the Nile, fusing Mamluk military legitimacy with the Pharaonic dynastic continuity claimed by Cairo's sultans. Aegyptus binds the lower and upper Nile, the Levant, the Hijaz, Nubia, and Cyrenaica under a Sultan-as-Pharaoh ideology that traces its line from Memphis through Babylon-of-Egypt to the citadel of Salah ad-Din. From Cyrene to Mecca to Khartoum, the New Kingdom's reach is reborn under the banner of an Islamic Pharaoh."
