l_english:
 # ============================================================
 # Variables (tooltip strings shown when set_variable fires)
 # ============================================================
 nd_pnt_formed_tt: "The Pintados Confederation has been forged."
 nd_pnt_path_a_tt: "Founded as a Federation of the Datus."
 nd_pnt_path_b_tt: "Founded as the Kakarlong Brotherhood."
 nd_pnt_path_c_tt: "Founded as a Maritime Confederation."

 # ============================================================
 # Static Modifiers -- Formation Choices
 # ============================================================
 STATIC_MODIFIER_NAME_nd_pnt_federation_of_datus: "Federation of the Datus"
 STATIC_MODIFIER_DESC_nd_pnt_federation_of_datus: "Each datu of Panay, Cebu, Samar, Leyte, Bohol and Negros has surrendered a measure of his honor to the council banner. The council pools their authority into a single confederate vessel: the kingdoms feud no more, and the islands speak with one voice."
 STATIC_MODIFIER_NAME_nd_pnt_kakarlong_brotherhood: "Kakarlong Brotherhood"
 STATIC_MODIFIER_DESC_nd_pnt_kakarlong_brotherhood: "The tattoo masters have inked the founding marks on every datu's chest, sworn the warriors of the islands into one mangayaw brotherhood. The painted men hunger to test the new banner against the southern coasts and the northern seas."
 STATIC_MODIFIER_NAME_nd_pnt_maritime_confederation: "Maritime Confederation"
 STATIC_MODIFIER_DESC_nd_pnt_maritime_confederation: "Three hundred balangay hulls have been laid in the yards of Cebu, Iloilo and Tacloban. The inner seas of the Visayas now belong to a single people, and their merchants will carry pearl and gold from Sulu to Champa under the Pintados banner."

 # ============================================================
 # Static Modifiers -- Advance Event Choices
 # ============================================================
 STATIC_MODIFIER_NAME_nd_pnt_maragtas_law: "Codified Maragtas"
 STATIC_MODIFIER_DESC_nd_pnt_maragtas_law: "The chronicle of the ten datus and the laws of Sumakwel are committed to baybayin script and read aloud at every council. Custom becomes statute."
 STATIC_MODIFIER_NAME_nd_pnt_oral_memory: "The Binukot Sing the Past"
 STATIC_MODIFIER_DESC_nd_pnt_oral_memory: "The secluded high-born women preserve the chronicle as living chant. The Maragtas remains a memorized song rather than a fixed text, and every generation reshapes it for its own age."
 STATIC_MODIFIER_NAME_nd_pnt_mangayaw_southern_seas: "Southern Mangayaw"
 STATIC_MODIFIER_DESC_nd_pnt_mangayaw_southern_seas: "The raid fleets turn south, against the Sulu coast and the Bornean datus. Gold, slaves and brides flow back into the council houses."
 STATIC_MODIFIER_NAME_nd_pnt_mangayaw_northern_seas: "Northern Mangayaw"
 STATIC_MODIFIER_DESC_nd_pnt_mangayaw_northern_seas: "The raid fleets turn north, the way they did in 1169 when Visayan tattoo warriors fell on the Chinese coast. The chronicles of the Song dynasty will be re-read with new fear."
 STATIC_MODIFIER_NAME_nd_pnt_babaylan_order: "Order of the Babaylan"
 STATIC_MODIFIER_DESC_nd_pnt_babaylan_order: "The priestesses of the diwata are organized into a confederate order. Anito worship is now formally taught, with novices, masters, and a chant inheritance."
 STATIC_MODIFIER_NAME_nd_pnt_diwata_pluralism: "Diwata Pluralism"
 STATIC_MODIFIER_DESC_nd_pnt_diwata_pluralism: "Each barangay keeps its own ancestral diwata. No creed is imposed across the islands, and the strange faiths of foreign traders are tolerated alongside the local spirits."
 STATIC_MODIFIER_NAME_nd_pnt_balangay_merchants: "Balangay Merchants"
 STATIC_MODIFIER_DESC_nd_pnt_balangay_merchants: "Burgher captains run the inner-sea routes from Cebu to Iloilo to Tacloban, with branch lines into Mindoro and Mindanao. The pan-Visayan economy thickens."
 STATIC_MODIFIER_NAME_nd_pnt_pintados_trade_office: "Pintados Trade Office"
 STATIC_MODIFIER_DESC_nd_pnt_pintados_trade_office: "A single state-licensed merchant body at Cebu prices, weighs and tariffs every inter-island transaction. The merchants chafe at the levies, but the council treasury swells and credit flows from a single trusted hand."
 STATIC_MODIFIER_NAME_nd_pnt_defiance_of_mactan: "Defiance of Mactan"
 STATIC_MODIFIER_DESC_nd_pnt_defiance_of_mactan: "Lapu-Lapu's name is engraved on every coastal fort. The west may bring its sails and its iron, but the painted men will not kneel."
 STATIC_MODIFIER_NAME_nd_pnt_lessons_of_the_west: "Lessons of the West"
 STATIC_MODIFIER_DESC_nd_pnt_lessons_of_the_west: "The Pintados harbors trade with carabela captains. Cannons enter the council arsenals, and the karakoa shipwrights study foreign hulls."
 STATIC_MODIFIER_NAME_nd_pnt_three_tongues_flourish: "Three Tongues Flourish"
 STATIC_MODIFIER_DESC_nd_pnt_three_tongues_flourish: "Hiligaynon, Cebuano and Waray grammars are printed side by side, all three forms held correct. The painted islands keep three voices and call all three Pintados."
 STATIC_MODIFIER_NAME_nd_pnt_council_vernacular: "Council Vernacular"
 STATIC_MODIFIER_DESC_nd_pnt_council_vernacular: "A single Pintados speech is forged from the three Visayan tongues. Court, market and barangay alike learn the new vernacular; the painted men become one tongue as well as one banner."

 # ============================================================
 # Formation Event
 # ============================================================
 nd_pnt.1.t: "Painted Banner Over the Inner Seas"
 nd_pnt.1.d: "The datus of Panay have come to Araut. The rajahs of Cebu have sailed from Sugbo. The seafaring captains of Samar and Leyte have rowed in from the eastern coasts. Around the council fire sit the painted men of Negros and Bohol, and the babaylan priestesses chant the names of every diwata they will offend if this oath is broken.\n\nThe Spaniards already speak of the Visayans only as Los Pintados, the Painted Ones, as if the tattoos that record every battle, every raid, every enemy slain, were our only mark. Today we make those tattoos a banner. The kingdoms that fought one another for two centuries pool their honor under a single confederate seal: Kabisay-an, the painted islands, sovereign and joined.\n\nThe council debates how this new nation will speak its first word.\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_pnt.1.a: "Federation of the Datus -- bind the council with sworn law"
 nd_pnt.1.b: "Kakarlong Brotherhood -- forge the painted men into one mangayaw"
 nd_pnt.1.c: "Maritime Confederation -- let the balangay hulls carry our flag"

 # ============================================================
 # Advance Events
 # ============================================================
 nd_pnt.2.t: "The Maragtas in the Council House"
 nd_pnt.2.d: "Datu Sumakwel's customs survive in the chant of the binukot, the secluded high-born women whose voices preserve the laws. The council debates whether to fix the Maragtas in baybayin script as written law, or whether the chronicle's life is in the singing of it."
 nd_pnt.2.a: "Carve the laws into bamboo"
 nd_pnt.2.b: "Let the chant remain the law"

 nd_pnt.3.t: "The Mangayaw Council"
 nd_pnt.3.d: "The young warriors of Cebu, Bohol and Samar demand a great mangayaw, a sea raid worthy of inscription on every chest. The council must choose its ocean: south against the gold of Sulu and Borneo, or north against the rich shores of the Middle Kingdom, as the chronicles say our forefathers did in 1169."
 nd_pnt.3.a: "South -- the gold coasts of Sulu and Borneo"
 nd_pnt.3.b: "North -- where our forefathers raided the Song"

 nd_pnt.4.t: "The Babaylan Question"
 nd_pnt.4.d: "Across the islands the babaylan priestesses serve a thousand local diwatas, each barangay its own pantheon. The council must decide whether to formalize the priestesses into a single confederate order, with novices and masters and a fixed chant, or to leave each barangay free to keep its own ancestral spirits."
 nd_pnt.4.a: "Order of the Babaylan"
 nd_pnt.4.b: "Each barangay keeps its diwata"

 nd_pnt.5.t: "The Inner-Sea Treaty"
 nd_pnt.5.d: "Burgher captains from every Visayan port press the council to ratify their compact. The merchants want one inner-sea market; the council must decide how it shall be governed.\n\nThe traders of Cebu and Iloilo argue for a free-passage charter that lets every datu's balangay put in at any harbor under Pintados authority. The Cebu treasury argues for a single state-licensed Pintados Trade Office that prices, weighs and tariffs every transaction."
 nd_pnt.5.a: "A free-passage compact -- every datu's merchants free to trade"
 nd_pnt.5.b: "A Pintados Trade Office at Cebu -- one licensed merchant body"

 nd_pnt.6.t: "The Sails at Mactan"
 nd_pnt.6.d: "The strange ships have arrived. Their captain, Magalhaes, demands tribute from the rajah of Cebu and threatens fire on any datu who refuses. Lapu-Lapu of Mactan answers with steel.\n\nThe council must decide what the painted islands will be when the storm of the western sails breaks: an enemy that humbles them at every shore, or a learner that takes their cannons and their carabelas and turns them on their own coasts."
 nd_pnt.6.a: "Defiance -- harden every coast against them"
 nd_pnt.6.b: "Learn -- take their iron and their hulls"

 nd_pnt.7.t: "The Visayan Synthesis"
 nd_pnt.7.d: "Three peoples, one tongue at council: the Hiligaynon of Panay, the Cebuano of the central islands, and the Waray of Samar and Leyte have begun to share more than the painted banner. Songs cross. Cookpots cross. Dialects bend toward one another in the markets and on the rower's benches.\n\nThe printers in Cebu have set the type. The council debates whether to set three Visayan grammars side by side and let all three forms be called correct, or to forge a single council vernacular and call it Pintados speech."
 nd_pnt.7.a: "Print three grammars -- let the tongues flourish"
 nd_pnt.7.b: "Forge one council vernacular from all three"

 # ============================================================
 # Advances
 # ============================================================
 nd_pnt_balangay_shipwrights: "Balangay Shipwrights"
 nd_pnt_balangay_shipwrights_desc: "The plank-and-rib outrigger boat of the Visayan seafarers, the balangay, is the basic unit of identity in the islands: every coastal village can lay one and every captain can crew one. Specialized shipyards now turn out larger hulls capable of crossing the open seas."
 nd_pnt_datu_council: "Council of Datus"
 nd_pnt_datu_council_desc: "Each significant island sends its datus to the great council house. Authority is pooled, not surrendered: the council decides war and treaty, and its rulings carry the weight of every datu who attended."
 nd_pnt_maragtas_codex: "Maragtas Codex"
 nd_pnt_maragtas_codex_desc: "The chronicle of Datu Sumakwel and the ten datus of Borneo who fled north to Panay, who bought the lowlands from the Ati king Marikudo with a golden sadok, becomes the foundation myth of the confederation."
 nd_pnt_timawa_freemen: "Timawa Freemen"
 nd_pnt_timawa_freemen_desc: "Between the datus and the oripun stands the timawa: free warrior commoners who own their arms, owe service in war but not in agriculture, and form the spear arm of every barangay. The confederation regularizes the timawa as a recognized class across all the islands."
 nd_pnt_baybayin_visayan: "Visayan Baybayin"
 nd_pnt_baybayin_visayan_desc: "The Indic-derived baybayin script is adapted to the consonant clusters of Hiligaynon, Cebuano and Waray. Council scribes can record the ruling of the council, the marriage of a binukot, and the gold owed in a brideprice."
 nd_pnt_kakarlong_orders: "Kakarlong Orders"
 nd_pnt_kakarlong_orders_desc: "Tattooed warrior orders are formalized across the islands. Each tattoo records a deed: a slain enemy, a successful raid, a defended village. A fully tattooed warrior is a walking ledger of valor, and a council that musters such men musters fear itself."
 nd_pnt_mangayaw_fleets: "Mangayaw Raid Fleets"
 nd_pnt_mangayaw_fleets_desc: "The mangayaw, the great sea raid, is institutionalized as a confederate practice rather than a private datu's adventure. Whole fleets of balangay sail under the painted banner, and every successful return raids honor on the entire confederation."
 nd_pnt_babaylan_synod: "Babaylan Synod"
 nd_pnt_babaylan_synod_desc: "The priestesses of the diwata, healers and oracles of the islands, are gathered into a confederate synod. Anitism becomes a recognized faith with formal training, succession, and inter-island recognition of priestess seniority."
 nd_pnt_pearl_divers: "Sulu Pearl Divers"
 nd_pnt_pearl_divers_desc: "Visayan free-divers and Sulu pearling fleets work the reefs of the inner seas. The pearls feed the goldsmiths of Cebu and Iloilo and pay for the silk and porcelain the council buys from the Chinese junks."
 nd_pnt_inner_sea_trade: "Inner-Sea Trade Network"
 nd_pnt_inner_sea_trade_desc: "The parian markets of Cebu, Iloilo and Tacloban are linked under a common burgher compact. The Visayan Sea is no longer a series of independent local economies but a single circulation of cotton, rice, pearls, gold and silk."
 nd_pnt_lapu_lapu_legacy: "Legacy of Lapu-Lapu"
 nd_pnt_lapu_lapu_legacy_desc: "On the morning of the 27th of April 1521, the datu of Mactan met Magalhaes in the surf and killed him with a thousand of his timawa. The painted men have proven that the western iron is not invulnerable. Every coastal fort is rebuilt with that morning in mind."
 nd_pnt_visayan_goldsmiths: "Visayan Goldsmiths"
 nd_pnt_visayan_goldsmiths_desc: "The panday smiths of Cebu and Butuan inherit a thousand years of granulation, repousse and gold-thread weaving. Visayan jewelry of the high confederate period is recognized from Champa to Brunei to Macao."
 nd_pnt_visayan_synthesis: "Visayan Synthesis"
 nd_pnt_visayan_synthesis_desc: "Hiligaynon of Panay, Cebuano of the central islands, and Waray of Samar and Leyte begin to converge under the confederate banner. Trade pidgins fix into shared vocabulary, common festivals are kept across the islands, and a recognizable Pintados identity emerges that is no one of the three but all of them."
 nd_pnt_lipong_warriors: "Lipong Veterans"
 nd_pnt_lipong_warriors_desc: "Lipong is the warrior so covered in tattoos that no untouched skin remains. Each mark records a battle survived. The council reserves the lipong rank for veterans of three confederate campaigns and fields them as the shock arm of every army."
 nd_pnt_visayan_admiralty: "Visayan Admiralty"
 nd_pnt_visayan_admiralty_desc: "An admiralty office is established to coordinate the balangay and karakoa fleets of every island, route the great mangayaw, and assign blockade stations to every confederate squadron."
 nd_pnt_archipelagic_governance: "Archipelagic Governance"
 nd_pnt_archipelagic_governance_desc: "The confederate model scales: provincial councils mediate between the datus of an island and the great council, and a register of timawa and oripun is kept across the archipelago. The painted men learn to govern as a state, not a federation of feuds."
 nd_pnt_karakoa_fleets: "Karakoa Fleets"
 nd_pnt_karakoa_fleets_desc: "The karakoa is the great Visayan outrigger warship: 100 paddlers, raised plank fighting decks, a high prow, and a name shouted by the datu who commands it. Karakoa flagships lead each squadron of the confederate fleet."
 nd_pnt_visayan_militia: "Barangay Militia"
 nd_pnt_visayan_militia_desc: "Every coastal village becomes a defensive node, with watchtowers, signal fires, and trained timawa kept on alert. The painted islands defend themselves not from a single capital but from a thousand barangays at once."
 nd_pnt_visayan_diaspora: "Visayan Diaspora"
 nd_pnt_visayan_diaspora_desc: "Visayan settlers cross to Palawan, to the northern Mindanao coast, to Sabah and the Sulu archipelago. The painted banner becomes the standard of an emigrating people who carry their tattoos and their balangay wherever they put down a barangay."
 nd_pnt_pintados_arsenal: "Pintados Arsenal"
 nd_pnt_pintados_arsenal_desc: "A confederate arsenal complex spans Iloilo and Cebu, casting cannon, forging firearms, training cannoneers. The painted men, who first knew gunpowder from Chinese and Bornean traders, now make their own."
 nd_pnt_visayan_letters: "Visayan Letters"
 nd_pnt_visayan_letters_desc: "Hiligaynon and Cebuano vernacular printing flourishes. Maragtas editions, babaylan chant cycles, datu chronicles, and even a council legal code are widely read. The painted men become literate in their own three tongues."
 nd_pnt_modernised_kakarlong: "Modernised Kakarlong"
 nd_pnt_modernised_kakarlong_desc: "The tattoo-warrior tradition is reconciled with the musket and the disciplined line. Lipong veterans drill alongside young recruits, and the mark on a soldier's chest now records both ancient deeds and modern campaigns."
 nd_pnt_visayan_navy: "Pintados Navy"
 nd_pnt_visayan_navy_desc: "A regular confederate navy patrols the inner seas under one ensign rather than as a coalition of datu fleets. Karakoa flagships are joined by gun-frigates of European design, all flying the painted banner."
 nd_pnt_kabisayan_nation: "Kabisay-an Nation"
 nd_pnt_kabisayan_nation_desc: "In the age of national awakenings, the painted islands articulate themselves as a single Kabisay-an people: a civic nation joined by language, by tattoo tradition, by the Maragtas and by the long memory of the council."
 nd_pnt_island_industrialists: "Island Industrialists"
 nd_pnt_island_industrialists_desc: "The Visayan islands enter the industrial age as a federation of port cities. Iloilo's textile mills, Cebu's metalworks, and Tacloban's shipyards anchor an island industrial corridor that exports across Asia."
 nd_pnt_pintados_steam_navy: "Pintados Steam Navy"
 nd_pnt_pintados_steam_navy_desc: "The shipyards of Cebu lay down ironclads alongside the last karakoa. The painted banner now flies from steel hulls patrolling the inner seas, the South China Sea, and the long Visayan diaspora coasts."
 nd_pnt_kabisayan_universities: "Kabisayan Universities"
 nd_pnt_kabisayan_universities_desc: "Universities are founded at Cebu, Iloilo and Tacloban. The literate elite of the painted men, schooled in three Visayan tongues plus Spanish and English, become a bridge between Asian and European learning."

 # ============================================================
 # Units
 # ============================================================
 a_nd_pnt_timawa: "Timawa Freemen"
 a_nd_pnt_timawa_desc: "Free warrior commoners who own their arms and owe service in war but not in field. The mainstay of every barangay's spear and shield line."
 a_nd_pnt_kakarlong: "Kakarlong Warriors"
 a_nd_pnt_kakarlong_desc: "Tattoo-covered shock troops sworn into a confederate brotherhood. They charge with the shouted name of every diwata that will witness their deeds."
 a_nd_pnt_lipong: "Lipong Veterans"
 a_nd_pnt_lipong_desc: "Tattoo-covered to the soles of their feet, each mark a battle survived. The lipong are the shock arm of the confederate armies, and an enemy that sees them coming has reason to be afraid."
 n_nd_pnt_balangay_raider: "Balangay Raider"
 n_nd_pnt_balangay_raider_desc: "Long-keeled outrigger raid galley with a single mast, a stretched fighting deck, and rowers drawn from the timawa class. The mangayaw fleets ride on these hulls."
 n_nd_pnt_karakoa: "Karakoa"
 n_nd_pnt_karakoa_desc: "The great Visayan warship, a 100-paddler outrigger giant whose raised fighting decks and high prow turn it into a floating fort. Each karakoa is named for the datu who commands her."
 n_nd_pnt_ironclad: "Pintados Ironclad"
 n_nd_pnt_ironclad_desc: "Iron-plated steam frigate launched from the Cebu yards. The painted men carry the balangay tradition into the age of steam."
 n_nd_pnt_balangay: "Balangay"
 n_nd_pnt_balangay_desc: "The basic plank-and-rib outrigger of every Visayan coastal village. Cheap to build, swift, levied in great numbers from the burgher captains."

 # ============================================================
 # Levies
 # ============================================================
 levy_nd_pnt_kakarlong_warriors: "Kakarlong Levy"
 levy_nd_pnt_kakarlong_warriors_desc: "Tattoo-warrior brotherhood raised from the soldier class."
 levy_nd_pnt_timawa_freemen: "Timawa Levy"
 levy_nd_pnt_timawa_freemen_desc: "Free warrior commoners called up from the peasants and the soldier class."
 levy_nd_pnt_balangay: "Balangay Levy"
 levy_nd_pnt_balangay_desc: "Burgher-owned outrigger boats with peasant and laborer rowers, raised by the coastal villages of the confederation."

 # ============================================================
 # Buildings
 # ============================================================
 nd_pnt_balangay_yard: "Balangay Yard"
 nd_pnt_balangay_yard_desc: "Coastal shipyard specializing in the long-keeled Visayan outrigger. Builds and repairs the confederation's fleets."
 nd_pnt_council_house: "Datu Council House"
 nd_pnt_council_house_desc: "The great hall in which the datus of every island sit in council. The decisions made here bind the painted islands."
 nd_pnt_babaylan_shrine: "Babaylan Shrine"
 nd_pnt_babaylan_shrine_desc: "Center of anitist worship and babaylan training. Healers, oracles and priestesses ascend here through the orders of the synod."
 nd_pnt_parian_market: "Parian Market"
 nd_pnt_parian_market_desc: "Walled inner-sea exchange where Visayan, Chinese, Bornean and Sulu merchants trade pearl, gold, cotton and rice under common parian compact."
 nd_pnt_panday_workshop: "Panday Workshop"
 nd_pnt_panday_workshop_desc: "Goldsmith district producing granulation work, repousse plate, and gold-thread weaving in the long Cebu-Butuan tradition."
 nd_pnt_kabisayan_arsenal: "Kabisayan Arsenal"
 nd_pnt_kabisayan_arsenal_desc: "Pan-Visayan military arsenal complex casting cannon, forging firearms, and drilling the gun crews of the confederate armies."
 nd_pnt_kabisayan_university: "Kabisayan University"
 nd_pnt_kabisayan_university_desc: "Higher institution of learning in the Visayan vernacular, blending native legal tradition with European and Chinese letters."

 # ============================================================
 # Production methods
 # ============================================================
 nd_pnt_panday_jewelry: "Visayan Goldsmithing"
 nd_pnt_panday_jewelry_desc: "Granulation, repousse and gold-thread weaving in the panday tradition, using local pearl and gold."
 nd_pnt_balangay_yard_maintenance: "Yard Maintenance"
 nd_pnt_balangay_yard_maintenance_desc: "Lumber, naval supplies, tar and fiber to keep the yard cutting hulls."
 nd_pnt_council_house_maintenance: "Council Maintenance"
 nd_pnt_council_house_maintenance_desc: "Lumber, masonry, beeswax and paper to support the assembled datus and their scribes."
 nd_pnt_babaylan_shrine_maintenance: "Shrine Offerings"
 nd_pnt_babaylan_shrine_maintenance_desc: "Beeswax candles, incense, woven cloth and ritual pottery for the diwatas."
 nd_pnt_parian_market_maintenance: "Market Maintenance"
 nd_pnt_parian_market_maintenance_desc: "Cloth, pottery, rice and fish provisioned at the parian for the merchant compact."
 nd_pnt_kabisayan_arsenal_maintenance: "Arsenal Maintenance"
 nd_pnt_kabisayan_arsenal_maintenance_desc: "Weaponry, firearms, lumber and iron stockpiled to drill the gun crews of the confederation."
 nd_pnt_kabisayan_university_maintenance: "University Maintenance"
 nd_pnt_kabisayan_university_maintenance_desc: "Paper, books, beeswax candles and pottery for the schools, libraries and printing presses of the universities."

 # ============================================================
 # Destiny Tree
 # ============================================================

 # --- Destiny Advances ---
 nd_pnt_destiny: "The Painted Banner Apex"
 nd_pnt_destiny_desc: "The pan-Visayan confederation passes from founding to apex. The council banner now flies from Panay to Samar without question, and the painted men begin to argue over what their nation will be in the next century."

 nd_pnt_dest_united_council: "United Council of the Painted Isles"
 nd_pnt_dest_united_council_desc: "Bring all four of the secondary anchor islands -- Samar, Bohol, Negros and Masbate -- fully under council authority. With Basey, Bo-ol, Bago and Masbate seated at the council, the Visayan archipelago answers to one banner."

 nd_pnt_dest_visayan_renaissance: "Visayan Renaissance"
 nd_pnt_dest_visayan_renaissance_desc: "Embrace legalism, take Tondo on Luzon, and amass the gold (2000) and prestige (50) to fund a confederate cultural age. The painted men become patrons of letters, art and Indic learning."

 nd_pnt_dest_kabisayan_apex: "Kabisay-an Apex"
 nd_pnt_dest_kabisayan_apex_desc: "Embrace printing_press, hold both Butuan (Mindanao goldsmith heartland) and Maynila, and reach gold 3000, prestige 75. The civic Visayan nation stands fully formed: literate, mercantile, federated, painted. Unlocks the Grand Council Hall."

 nd_pnt_dest_sulu_mastery: "Sulu Sea Mastery"
 nd_pnt_dest_sulu_mastery_desc: "Conquer Maimbung and Bongao in the Sulu archipelago and field at least 30 regiments. The southern raid frontier opens, and the painted men replace the Sulu rajah as masters of the sea between."

 nd_pnt_dest_borneo_beachheads: "Borneo Beachheads"
 nd_pnt_dest_borneo_beachheads_desc: "Take Berune (the Brunei capital) and Surigao on the northern Mindanao coast. Field 50 regiments and hold 2000 gold. The mangayaw fleets land where the chronicles only let them raid."

 nd_pnt_dest_spice_talassocracy: "Spice Sea Talassocracy"
 nd_pnt_dest_spice_talassocracy_desc: "Hold both Ternate and Tidore, the Maluku spice islands. Field 75 regiments at prestige 75. A Pintados Sulu Zone reaches the spice islands; the painted banner flies over the inner sea, the Sulu Sea, and the Moluccas. Unlocks the Pintados Raid Anchorage."

 # --- Destiny Events ---

 nd_pnt.8.t: "The Painted Banner Apex"
 nd_pnt.8.d: "The council fire at Araut burns brighter than any in living memory. The datus of every island, the babaylan of every barangay, the timawa captains of every coastal village have come to declare that the painted nation is no longer a federation in formation: it is a federation in being.\n\nNow the council debates what the nation will become."
 nd_pnt.8.a: "The painted islands rise as one"

 nd_pnt.9.t: "Council of the Four Islands"
 nd_pnt.9.d: "Basey speaks for Samar. Bo-ol speaks for Bohol. Bago speaks for Negros. Masbate speaks for itself. With the Panay and Cebu rajahs already seated, every Visayan landfall now answers to a single council.\n\nNow the council must decide what shape its authority shall take. Some demand confederate law set down in baybayin: a written code that binds every datu by oath and statute. The elders argue instead for sandugo, the chronicled blood-compact: loyalty bound by ritual and personal honor, as the ten datus of Borneo bound themselves to Marikudo."
 nd_pnt.9.a: "Bind the datus to written confederate law"
 nd_pnt.9.b: "Bind the datus by sandugo blood-compact"

 nd_pnt.10.t: "The Renaissance of the Painted Men"
 nd_pnt.10.d: "Tondo's tribute caravans arrive at Cebu. The treasury holds enough to commission whatever the council wills. The babaylan synod meets the Hiligaynon scribes in a hall of three tongues, and a quarrel breaks out: shall this golden age be a court of patrons, or a literate confederate civic order?"
 nd_pnt.10.a: "Patron the binukot, the panday, the painter"
 nd_pnt.10.b: "Print three Visayan grammars and a council code"

 nd_pnt.11.t: "Kabisay-an, One Nation Painted"
 nd_pnt.11.d: "Maynila's silver, Butuan's gold, Cebu's pearls and Iloilo's cotton sit on the same council ledger. The printing presses run in Hiligaynon, Cebuano and Waray at once. The painted islands are no longer three peoples but one civic Kabisay-an nation, with a literate elite, a federated assembly, and merchant houses that reach Champa, Macao and Brunei.\n\nWhat shape shall this apex take?"
 nd_pnt.11.a: "A Visayan civic constitution"
 nd_pnt.11.b: "A pan-Asian mercantile federation"

 nd_pnt.12.t: "The Sulu Sea Falls Silent"
 nd_pnt.12.d: "The Sulu rajah's flag is hauled down at Maimbung. Bongao's pirate-datus row out under guard. The Pintados banner now flies over the southern sea.\n\nThe captured Iranun captains kneel before the council. They will sail again -- the only question is under whose order. Some councilors argue for letters of marque: leave the corsairs their crews and their fleets, and let them sail under Pintados commission. Others demand direct integration: their hulls broken up for council shipyards, their crews reassigned to standardized squadrons under royal pay."
 nd_pnt.12.a: "Issue corsair commissions to the Iranun captains"
 nd_pnt.12.b: "Integrate the Sulu fleets into the council admiralty"

 nd_pnt.13.t: "The Mangayaw Lands at Brunei"
 nd_pnt.13.d: "Berune burns under the painted banner. The Surigaonon coast of Mindanao bows to the council banner. The chronicles of the 1169 northern raid are recited at every campfire, but this time the fleets did not come back -- they stayed.\n\nHow shall the council institutionalize this conquest beyond the raid?"
 nd_pnt.13.a: "A standing kakarlong landing corps"
 nd_pnt.13.b: "Permanent karakoa raid lanes"

 nd_pnt.14.t: "The Spice Islands Bow"
 nd_pnt.14.d: "Ternate's sultan kneels at the prow of a Pintados karakoa. Tidore's spice warehouses stand under the painted banner. From Sulu to the Moluccas, every harbor pays tribute to one council. The Sulu Zone is now a Pintados Zone, and the chronicles of the southern reavers are written in Visayan ink.\n\nHow shall the spice empire be ordered?"
 nd_pnt.14.a: "Spice reaver lordship -- pepper, sugar, blade"
 nd_pnt.14.b: "Inner sea dominion -- tribute, fleets, banner"

 # --- Destiny Static Modifiers ---

 STATIC_MODIFIER_NAME_nd_pnt_dest_patron_arts: "Patrons of the Painted Arts"
 STATIC_MODIFIER_DESC_nd_pnt_dest_patron_arts: "The council houses become courts of patronage. Binukot song, panday gold, and Cebu painters draw migrants from across the archipelago, while the old timawa drill grounds quiet."

 STATIC_MODIFIER_NAME_nd_pnt_dest_three_tongues: "The Three Tongues Made Letters"
 STATIC_MODIFIER_DESC_nd_pnt_dest_three_tongues: "Printed grammars of Hiligaynon, Cebuano and Waray circulate in every council house. A literate civic class emerges, and the painted islands begin to speak as one people in three tongues."

 STATIC_MODIFIER_NAME_nd_pnt_dest_civic_nation: "The Civic Visayan Nation"
 STATIC_MODIFIER_DESC_nd_pnt_dest_civic_nation: "The council becomes a parliament. Datu seats are inherited but checked, timawa freemen send delegates, and the assembly governs the painted islands as a constitutional confederation."

 STATIC_MODIFIER_NAME_nd_pnt_dest_mercantile_federation: "Pintados Mercantile Federation"
 STATIC_MODIFIER_DESC_nd_pnt_dest_mercantile_federation: "Pintados merchant houses anchor in Macao, Malacca and Brunei. The painted banner becomes a credit mark across the maritime markets of Asia."

 STATIC_MODIFIER_NAME_nd_pnt_dest_kakarlong_landing_corps: "Kakarlong Landing Corps"
 STATIC_MODIFIER_DESC_nd_pnt_dest_kakarlong_landing_corps: "The tattoo brotherhoods are reorganized as a permanent landing corps for inter-island war. They drill harder, recover faster, and the council pays for their initiative -- but the diplomats are not consulted."

 STATIC_MODIFIER_NAME_nd_pnt_dest_karakoa_lanes: "Karakoa Raid Lanes"
 STATIC_MODIFIER_DESC_nd_pnt_dest_karakoa_lanes: "Permanent karakoa squadrons patrol Sulu, Borneo and Mindoro along fixed raid lanes. The galleys are cheaper to keep at sea, and the painted banner stains every chart of the southern waters."

 STATIC_MODIFIER_NAME_nd_pnt_dest_spice_reaver_lords: "Spice Reaver Lords"
 STATIC_MODIFIER_DESC_nd_pnt_dest_spice_reaver_lords: "Maluku pepper and sugar pour into Cebu. The painted hulls grow tougher with prize money. But the home islands' rice paddies thin as too many young men chase the spice-and-blade economy across the southern seas."

 STATIC_MODIFIER_NAME_nd_pnt_dest_inner_sea_dominion: "Inner Sea Dominion"
 STATIC_MODIFIER_DESC_nd_pnt_dest_inner_sea_dominion: "From Sulu to Maluku, every harbor pays tribute to the Pintados council. Foreign envoys recognize the painted banner as a major Asian power, and tribute fleets become a permanent feature of the inner seas."

 STATIC_MODIFIER_NAME_nd_pnt_dest_council_sworn_law: "Council Bound by Sworn Law"
 STATIC_MODIFIER_DESC_nd_pnt_dest_council_sworn_law: "The datus swear allegiance to a written confederate code, set down in baybayin and read aloud at every session. The council becomes a court of law as well as an assembly of chiefs."
 STATIC_MODIFIER_NAME_nd_pnt_dest_council_sandugo: "Council Bound by Sandugo"
 STATIC_MODIFIER_DESC_nd_pnt_dest_council_sandugo: "The datus bind themselves by sandugo, the chronicled blood-compact: a cup of wine mingled with each chief's blood, drunk in turn. Loyalty is personal, ritual, and inherited from father to son."
 STATIC_MODIFIER_NAME_nd_pnt_dest_iranun_commission: "Iranun Letters of Marque"
 STATIC_MODIFIER_DESC_nd_pnt_dest_iranun_commission: "The captured Sulu corsair captains sail again, this time under council letters of marque. Their plunder flows back to Cebu, but the Spanish, the Bornean and the Makassarese all log new grievances against the painted banner."
 STATIC_MODIFIER_NAME_nd_pnt_dest_sulu_admiralty: "Council Sulu Admiralty"
 STATIC_MODIFIER_DESC_nd_pnt_dest_sulu_admiralty: "The captured Sulu fleets are broken up; their hulls feed the Cebu and Iloilo yards, their crews are paid royal wages and reassigned to standardized squadrons. Discipline replaces plunder as the southern sea's law."

 # --- Destiny Buildings ---
 nd_pnt_dest_grand_council_hall: "Grand Council Hall"
 nd_pnt_dest_grand_council_hall_desc: "The apex council house of the federated Visayas. A constitutional assembly hall in stone and hardwood, where every datu, timawa delegate and burgher representative has a seat by federal right."

 nd_pnt_dest_raid_anchorage: "Pintados Raid Anchorage"
 nd_pnt_dest_raid_anchorage_desc: "Hardened naval base of the Pintados raid empire. Karakoa flagships winter here, kakarlong landing corps drill on the beach, and prize ships are graved and refit for the next mangayaw."

 nd_pnt_dest_grand_council_hall_maintenance: "Council Hall Maintenance"
 nd_pnt_dest_grand_council_hall_maintenance_desc: "Paper, fine cloth, beeswax candles and council pottery to keep the federated assembly in session year-round."

 nd_pnt_dest_raid_anchorage_maintenance: "Anchorage Maintenance"
 nd_pnt_dest_raid_anchorage_maintenance_desc: "Lumber, naval supplies, tar and weaponry to keep the raid fleet ready and the landing corps armed."

 # ===== BUREAUCRACIES =====
 pnt_datu_council_bureaucracy: "Datu Council of Madja-as"
 pnt_datu_council_bureaucracy_desc: "The paramount-datu confederation founded in legend by Datu Sumakwel binds the Visayan kedatuan into a single body that ratifies feuds, allocates raid spoils, and disciplines refractory chiefs. Maintained, the council answers to Aklan; neglected, every datu's longhouse becomes its own court."
 pnt_babaylan_order_bureaucracy: "Babaylan Spirit-Medium Order"
 pnt_babaylan_order_bureaucracy_desc: "The babaylan are anitist priestesses who heal the sick, sanction harvests, and intercede with diwata; in a datu's absence they take interim authority over the barangay. State-sponsored, the order forms a coherent ritual lineage; abandoned, splinter cults proliferate and the line between sorcery and worship dissolves."
 pnt_lipong_brotherhood_bureaucracy: "Lipong Tattooed Brotherhood"
 pnt_lipong_brotherhood_bureaucracy_desc: "The lipong are the most heavily tattooed binatakan warriors, each marking earned by deeds in mangayaw raids; facial tattoos belong only to the proven killers. As an institution the brotherhood sustains a permanent veteran corps; neglected, lipong drift into private warbands feuding over honor and spoils."
 pnt_mangayaw_fleet_bureaucracy: "Karakoa Mangayaw Fleet"
 pnt_mangayaw_fleet_bureaucracy_desc: "The abay is a coordinated fleet of karakoa and balangay that sails the Visayan seas each season to take captives, heads, and tribute. Funded, it returns with slaves and gold for the timawa captains; abandoned, idle crews turn pirate or sell themselves to rival datus, and the realm's name becomes a byword for raid."
 pnt_oripun_bondage_bureaucracy: "Council Oripun Registry"
 pnt_oripun_bondage_bureaucracy_desc: "Visayan customary law allowed debt to plunge a free man into uripon bondage, the obligation passing to his children. State registers kept in every datu's longhouse curb the most ruinous abuses by powerful chiefs and codify limits on what a creditor may demand, but they cannot abolish a system woven into pre-colonial wealth. Unenforced, oripun abscond into the forests, the buhis tribute fails, and rural strongmen settle disputes by raid."

 # The auto-modifier governing slot grant on formation
 AUTO_MODIFIER_NAME_nd_pnt_bureaucracy_authority: "Pintados Bureaucratic Authority"
 AUTO_MODIFIER_DESC_nd_pnt_bureaucracy_authority: "On formation, the [PNT.GetName] gains the right to host historical Pintados institutions. The paramount-datu seat at the capital provides one slot; this authority adds two more."
