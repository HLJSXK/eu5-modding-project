l_english:
 ANV: "Angevin Empire"
 ANV_ADJ: "Angevin"
 ANV_f: "Angevin Empire"
 ANV_f_desc: "Re-forge the cross-Channel dominion of Henry II Plantagenet, binding the Kingdom of England to the duchies of Normandy and Aquitaine and the county of Anjou under a single crown. A Catholic realm of Anglo-Norman, French, Norman and Occitan subjects, the Angevin Empire was the largest territorial polity of twelfth-century Western Europe — and its restoration would shatter the foundations of the modern French kingdom."
