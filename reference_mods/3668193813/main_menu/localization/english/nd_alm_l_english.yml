l_english:
 # === Variable Tooltips ===
 nd_alm_formed_tt: "Almohad Caliphate formed"
 nd_alm_path_a_tt: "Path of the Mu'minun chosen"
 nd_alm_path_b_tt: "Path of the Caliphal court chosen"

 # === Formation Modifiers ===
 STATIC_MODIFIER_NAME_nd_alm_mahdist_revolution: "Mahdist Revolution"
 STATIC_MODIFIER_DESC_nd_alm_mahdist_revolution: "Ibn Tumart's puritanical reform burns through the Caliphate. The Mu'minun bear arms with the certainty of the saved, and heretics know no quarter; but the watchful inquisitors of the Almohad creed leave little room for the older schools and their tolerated minorities."
 STATIC_MODIFIER_NAME_nd_alm_caliphal_civilization: "Caliphal Civilization"
 STATIC_MODIFIER_DESC_nd_alm_caliphal_civilization: "Yaqub al-Mansur's Marrakesh becomes a beacon of falsafa: Ibn Rushd commenting on Aristotle, Maimonides composing the Mishneh Torah at his court, paper mills humming and Andalusi scholars filling the libraries. The Caliphate rests easy in its grandeur, perhaps too easy."

 # === Advance Event Modifiers ===
 STATIC_MODIFIER_NAME_nd_alm_tinmel_zeal: "Zeal of Tinmel"
 STATIC_MODIFIER_DESC_nd_alm_tinmel_zeal: "The Mahdi's followers march down from the Atlas with the fervor of revelation. New recruits flock to the cause, drilled by the Mu'minun in the harsh discipline of the Almohad creed."
 STATIC_MODIFIER_NAME_nd_alm_tinmel_consolidation: "Consolidation of the Movement"
 STATIC_MODIFIER_DESC_nd_alm_tinmel_consolidation: "Rather than press the moment, the Caliph sinks roots: the council of fifty is formalized, the Berber tribes given their ranks, and the new orthodoxy quietly entrenched in administration."
 STATIC_MODIFIER_NAME_nd_alm_andalusi_legions: "Andalusi Legions"
 STATIC_MODIFIER_DESC_nd_alm_andalusi_legions: "Stung by defeat at the great battle, the Caliph calls every able man across the strait. Fresh Andalusi infantry and Berber jund pour into the Iberian field once more, the morale of the realm forged anew in vengeance."
 STATIC_MODIFIER_NAME_nd_alm_african_retreat: "African Bastion"
 STATIC_MODIFIER_DESC_nd_alm_african_retreat: "The Caliph withdraws to Marrakesh and refortifies the Maghreb. If al-Andalus must be lost, then at least the African heart will hold; revenues recover and garrisons swell."

 STATIC_MODIFIER_NAME_nd_alm_aristotelian_court: "Court of the Commentator"
 STATIC_MODIFIER_DESC_nd_alm_aristotelian_court: "Ibn Rushd's commentaries are read in the very court of the Caliph; Jewish, Christian, and Muslim philosophers speak as equals on metaphysics. Marrakesh becomes the lighthouse of falsafa, drawing scholars from Toledo to Baghdad."
 STATIC_MODIFIER_NAME_nd_alm_orthodox_purge: "The Orthodoxy Triumphant"
 STATIC_MODIFIER_DESC_nd_alm_orthodox_purge: "Ibn Rushd is exiled, his books burned in the souk of Cordoba. The Caliphate's preachers march behind purified doctrine; the conversion of subject peoples accelerates, the unity of the umma reaffirmed."

 STATIC_MODIFIER_NAME_nd_alm_ribat_al_fath: "Ribat al-Fath"
 STATIC_MODIFIER_DESC_nd_alm_ribat_al_fath: "Yaqub al-Mansur founds his vast new capital at the mouth of the Bou Regreg: a fortified city of conquest, with the Hassan Tower rising above it. Construction crews work with imperial speed across the realm."
 STATIC_MODIFIER_NAME_nd_alm_marrakesh_glory: "Glory of Marrakesh"
 STATIC_MODIFIER_DESC_nd_alm_marrakesh_glory: "Rather than build anew, the Caliph adorns the existing capital. The Koutoubia is finished in jewel-like elegance, the gates of the city rebuilt, and the Almohad name carries weight from Sevilla to Cairo."

 # === Formation Event ===
 nd_alm.1.t: "The Mu'minun Are Sovereign"
 nd_alm.1.d: "From the cliff-walled madrasa at Tinmel, where Ibn Tumart preached that there is one God and one umma, your soldiers have descended to break the murabit veil and topple the Almoravids. Marrakesh has fallen; the green-and-white Almohad standards fly above the kasbahs of the Maghreb. From here, the question of what your Caliphate is to be can no longer be deferred.\n\nWill you remain the Mahdi's avenging army, the Mu'minun who unite the umma by sword and sermon and brook no compromise? Or will you become a civilization in your own right, drawing the philosophers and scholars of al-Andalus into a court where Aristotle is read and Maimonides writes?\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_alm.1.a: "We are the army of the Mahdi: the umma will be one"
 nd_alm.1.b: "Marrakesh shall be the new Cordoba: a court of philosophers"

 # === DHE Events ===
 nd_alm.2.t: "The Mosque at Tinmel"
 nd_alm.2.d: "High in the Sus valley, on the saddle where Ibn Tumart first gathered the Masmuda tribes and proclaimed the Mahdiyya, Abd al-Mu'min has commissioned the great mosque of Tinmel. Its walls shelter the founder's tomb. The pilgrims who come to it are no ordinary worshippers: they are the recruits of an unfinished movement, and they ask whether the revolutionary moment is to be sustained or settled. The Council of Fifty awaits the Caliph's word."
 nd_alm.2.a: "Sustain the revolution: the sword has not yet finished"
 nd_alm.2.b: "Consolidate the movement: the foundations must be set"

 nd_alm.3.t: "Las Navas de Tolosa"
 nd_alm.3.d: "On the high meseta of Tolosa, the combined hosts of Castile, Aragon, and Navarre have broken the Caliphal army. Caliph al-Nasir flees south through the Sierra Morena; the camp tents and the green standards lie scattered. The very nucleus of Andalusi defense is hollowed. From Marrakesh, the question is sharp: do we cross the strait again with everything we have, or do we retrench in Africa and let al-Andalus fend for itself?"
 nd_alm.3.a: "Cross again: every man and every sword to Iberia"
 nd_alm.3.b: "Withdraw south: the African heart will not be lost"

 nd_alm.4.t: "Ibn Rushd of Cordoba"
 nd_alm.4.d: "Abu al-Walid Muhammad ibn Rushd, qadi of Cordoba and physician to the Caliph, has completed his Long Commentary on Aristotle's Metaphysics. In Cairo and Toledo and Paris, his name is spoken with awe. At your court, the Jewish philosopher Maimonides has just completed the Guide for the Perplexed. The fuqaha of Marrakesh are not pleased: they speak of the philosophers as foreign infiltrators, and demand a return to the pure creed of Ibn Tumart."
 nd_alm.4.a: "Defend the philosophers: the Caliphate must lead in thought"
 nd_alm.4.b: "Burn the books: orthodoxy must not be diluted"

 nd_alm.5.t: "The Hassan Tower"
 nd_alm.5.d: "On the bluff above the Bou Regreg, where Abd al-Mu'min once raised a kasbah, Caliph Yaqub al-Mansur has commanded a vast new capital: Ribat al-Fath, the Fortress of Victory. Its centerpiece is to be a mosque larger than any in the western lands, with a minaret to dwarf the Koutoubia. The masons quarry sandstone by the thousand and the imperial treasury bleeds. Some courtiers urge moderation: better to finish the Koutoubia and adorn the cities we have, than to build a new metropolis we may not need."
 nd_alm.5.a: "Build Ribat al-Fath: the Caliphate deserves a capital of conquest"
 nd_alm.5.b: "Adorn the existing cities: glory belongs to Marrakesh"

 # === Advances ===
 nd_alm_tinmel_foundation: "The Tinmel Foundation"
 nd_alm_tinmel_foundation_desc: "Ibn Tumart's mountain madrasa at Tinmel, in the Sus valley of the High Atlas, was the cradle of the Almohad movement. Here he proclaimed the Mahdiyya, taught the doctrine of divine unity (tawhid), and gathered the Masmuda tribes that would become the army of Abd al-Mu'min."
 nd_alm_masmuda_infantry: "Masmuda Infantry"
 nd_alm_masmuda_infantry_desc: "Unlike the Almoravids who drew on Saharan camel cavalry, the Almohad army was built around the dense infantry formations of the semi-nomadic Masmuda Berbers of the High Atlas: spearmen and javelin throwers organized by tribal hierarchy."
 nd_alm_zenata_horsemen: "Zenata Horsemen"
 nd_alm_zenata_horsemen_desc: "The Zenata Berbers of the high plateau provided the light cavalry of the Maghrebi armies: skirmishers and lancers who fought with the karr wa farr tactic of attack and feigned retreat, mounted on the swift North African horse."
 nd_alm_kasbah_tradition: "Kasbah Tradition"
 nd_alm_kasbah_tradition_desc: "Almohad governors ruled their cities from the kasbah, a fortified citadel rising above the medina with its own walls, gates, granaries, and barracks. Marrakesh, Fez, Sevilla and Rabat all received Almohad kasbahs."
 nd_alm_council_of_ten: "Council of Ten"
 nd_alm_council_of_ten_desc: "The Almohad state was governed by a hierarchy of councils descending from the Caliph: the Ahl al-dar (Council of Ten) of close kinsmen and trusted shaykhs, then the Council of Fifty, and below it the assemblies of the Masmuda tribes. This stratified council government bound the regime tightly to its Berber base."

 nd_alm_minaret_tradition: "Almohad Minaret Tradition"
 nd_alm_minaret_tradition_desc: "The square sandstone minaret of the Koutoubia in Marrakesh, copied at the Hassan Tower in Rabat and the Giralda in Sevilla, became the signature of Almohad religious architecture: monumental, austere, and visible across half the kingdom."
 nd_alm_falsafa: "Falsafa"
 nd_alm_falsafa_desc: "The Almohad Caliphs, Abu Yaqub Yusuf and Yaqub al-Mansur in particular, gathered around themselves the philosophers of al-Andalus: Ibn Tufayl, Ibn Rushd (Averroes), and the Jewish thinker Maimonides. Their Marrakesh court became the high point of medieval Aristotelian commentary."
 nd_alm_andalusi_crossbow: "Andalusi Crossbowmen"
 nd_alm_andalusi_crossbow_desc: "The cities of al-Andalus furnished the Caliphate with its missile infantry: townsmen trained on the foot crossbow, descendants of the Cordoban tradition, who supplemented the Berber spear with the steel-tipped bolt."
 nd_alm_caravan_economy: "Caravan Economy"
 nd_alm_caravan_economy_desc: "Sijilmasa and Wadan stood at the desert end of the trans-Saharan trade. Almohad governors built funduqs in the cities, organized caravan routes, and taxed the gold-and-salt traffic that bound the Sahel to the Mediterranean."
 nd_alm_maliki_revival: "Maliki Revival"
 nd_alm_maliki_revival_desc: "Although Ibn Tumart and the early Caliphs persecuted the Maliki fuqaha and burned copies of the Muwatta, by the reign of al-Mansur the older school had quietly reasserted itself. The fiqh of the qadis returned to Maliki precedent, anchoring the regime in the inherited jurisprudence of the Maghreb."

 nd_alm_jihad_andalus: "Jihad in al-Andalus"
 nd_alm_jihad_andalus_desc: "Each Caliph in turn crossed the strait at the head of a great army to wage jihad against the Christian kingdoms: at Alarcos in 1195, Yaqub al-Mansur shattered Castile, and the green-and-white standards reached as far as Toledo. The Almohad campaigns set the model for the long Iberian war."
 nd_alm_christian_mercenaries: "Christian Mercenary Brigades"
 nd_alm_christian_mercenaries_desc: "By the late twelfth century the Almohads, like the Andalusi taifa kings before them, had begun to recruit Iberian Christian mercenaries by the thousand: Castilian knights serving in the Caliph's guard, Norman foot soldiers garrisoning provincial towns, paid in silver and given houses in Marrakesh."
 nd_alm_ribat_tradition: "Ribat Tradition"
 nd_alm_ribat_tradition_desc: "The ribat was a fortified frontier monastery where lay volunteers performed military service alongside their devotions. Strung along the coast from Sale to Sus to Sfax, the ribats trained the murabitun: pious frontiersmen who answered the Caliph's call."
 nd_alm_marrakeshi_metalwork: "Marrakeshi Metalwork"
 nd_alm_marrakeshi_metalwork_desc: "The forges of the Almohad capital armed both the Berber jund and the Andalusi infantry, with Damascene-style steel from Iberian iron and brass-fitted scimitars copied from the eastern lands. The Caliphal armouries set the standard for the western Mediterranean."
 nd_alm_maghrebi_astronomy: "Maghrebi Astronomy"
 nd_alm_maghrebi_astronomy_desc: "The Andalusi astronomers Ibn Tufayl, al-Bitruji, and Jabir ibn Aflah worked at the Almohad court, refining the Ptolemaic system, building observatories, and producing the astronomical tables that would later feed Toledo and Paris."

 nd_alm_monumental_caliphate: "The Monumental Caliphate"
 nd_alm_monumental_caliphate_desc: "Yaqub al-Mansur made monumental architecture an instrument of legitimacy. Ribat al-Fath, the Hassan Tower, the great mosque at Sevilla with its Giralda, the Koutoubia in Marrakesh: across the Caliphate, the Almohad name was raised in stone, austere and immense."
 nd_alm_andalusi_silk: "Andalusi Silk Weaving"
 nd_alm_andalusi_silk_desc: "From Almeria to Granada, the silk workshops of al-Andalus, inheritors of the Cordoban tradition, wove the finest textiles in the western Mediterranean. The Caliph's tiraz workshops produced the embroidered robes of state worn from Marrakesh to Cairo."
 nd_alm_sufi_brotherhoods: "Sufi Brotherhoods"
 nd_alm_sufi_brotherhoods_desc: "Spreading from the zawiyas of the Maghreb, popular Sufi orders, the Shadhili and Qadiri among them, took root in city and village alike. Their saints (awliya) and spiritual genealogies bound peripheral peoples to the urban Islamic culture and assimilated newcomers to the Caliphal orthodoxy."
 nd_alm_caliphal_arsenals: "Caliphal Arsenals"
 nd_alm_caliphal_arsenals_desc: "Imperial arsenals at Marrakesh, Fez, and Sevilla supplied the Caliph's standing forces: jund cavalry, Andalusi infantry, and the imperial bodyguard. Centralized armament made it possible to field the largest armies in the western Islamic world."
 nd_alm_saharan_gold: "Trans-Saharan Gold"
 nd_alm_saharan_gold_desc: "The gold of the Wadi Sus and the salt of Taghaza moved through Almohad customs houses on its way to Mediterranean markets. The Caliphate's tax revenues swelled in proportion to the trans-Saharan flow."

 nd_alm_sharifian_legitimacy: "Sharifian Legitimacy"
 nd_alm_sharifian_legitimacy_desc: "The descendants of the Almohad Caliphs and the later Maghrebi dynasties claimed sharifian descent from the Prophet, lending their rule a legitimacy independent of the Abbasid caliphate or any external authority."
 nd_alm_maghrebi_corsairs: "Maghrebi Corsairs"
 nd_alm_maghrebi_corsairs_desc: "From Sale to Tetouan to Algiers, the corsair ports of the Maghreb sent fast xebecs and galleots into the western Mediterranean and the Atlantic, raiding European shipping and bringing slaves and silver back to the Caliphate."
 nd_alm_kharaj_reform: "Kharaj Reform"
 nd_alm_kharaj_reform_desc: "Reformed land taxation distinguished kharaj on conquered estates from ushr tithes on Muslim freeholds, regularizing the fiscal foundation of the Caliphate and stabilizing revenue across rural areas."
 nd_alm_mobile_court: "The Mahalla"
 nd_alm_mobile_court_desc: "The Caliph governed from a mobile encampment, the mahalla, that moved between Marrakesh, Fez, and the provinces. This itinerant rulership kept rebellious tribes in check and reasserted central authority by direct presence."

 nd_alm_modernization: "Caliphal Modernization"
 nd_alm_modernization_desc: "Following the example of the Ottoman nizam-i-cedid and the Egyptian reforms of Muhammad Ali, the Caliphate's officers drilled regular infantry in European fashion, importing instructors and modern muskets to face the new age of warfare."
 nd_alm_anti_colonial_resistance: "Anti-Colonial Resistance"
 nd_alm_anti_colonial_resistance_desc: "Where Algiers fell and Tunis became a protectorate, the Caliphate stood against European encroachment: diplomatic plays in the European courts, supply of irregular forces in the hinterland, and the doctrine that the Maghreb was not for sale."
 nd_alm_industrial_revival: "Industrial Revival"
 nd_alm_industrial_revival_desc: "Modern arsenals at Casablanca, shipyards at Sale, and printed schoolbooks in Fez signal the Caliphate's late embrace of industrial technique, an attempt to meet European powers as a peer rather than as a subject."
 nd_alm_maghrebi_press: "Maghrebi Printing Press"
 nd_alm_maghrebi_press_desc: "Late but determined, Arabic printing presses at Fez and Marrakesh produce schoolbooks, gazettes, and translated European works. Print culture penetrates the urban literate classes and reshapes the public sphere."

 # === Buildings ===
 nd_alm_kasbah_citadel: "Almohad Kasbah"
 nd_alm_kasbah_citadel_desc: "A fortified citadel built atop the city, with its own walls, granary, barracks, and the governor's palace. The Almohad kasbah projects imperial authority into every Maghrebi city."
 nd_alm_almohad_minaret: "Almohad Minaret"
 nd_alm_almohad_minaret_desc: "A vast square minaret in the Almohad style, of dressed sandstone with sebka panels and arched balcony: the model for the Koutoubia, Hassan Tower, and Giralda."
 nd_alm_house_of_wisdom: "House of Wisdom"
 nd_alm_house_of_wisdom_desc: "A scholarly institution combining madrasa, library, and translation bureau. Andalusi philosophers, Jewish physicians, and Maghrebi astronomers all serve under the Caliph's patronage."
 nd_alm_funduq_quarter: "Funduq Quarter"
 nd_alm_funduq_quarter_desc: "An urban district of caravanserais, warehouses, and merchant houses where trans-Saharan caravans terminate and Mediterranean shipping is unloaded. The funduq is the engine of Maghrebi urban wealth."
 nd_alm_coastal_ribat: "Coastal Ribat"
 nd_alm_coastal_ribat_desc: "A fortified frontier monastery on the coast, where lay volunteers do military service alongside their devotions. The ribats line the Atlantic and Mediterranean shores from Sale to Sfax."
 nd_alm_caliphal_armoury: "Caliphal Armoury"
 nd_alm_caliphal_armoury_desc: "An imperial arms workshop producing weaponry for the jund and the Andalusi infantry, equipped with forges, foundries, and the corps of armourers attached to the Caliph's standing forces."
 nd_alm_andalusi_silk_workshop: "Andalusi Silk Workshop"
 nd_alm_andalusi_silk_workshop_desc: "A tiraz workshop in the al-Andalus tradition, weaving the finest brocade and embroidered robes of state, exported from Almeria and Granada to all the courts of the Mediterranean."
 nd_alm_caliphal_academy: "Caliphal Academy"
 nd_alm_caliphal_academy_desc: "A modern military and scientific academy on the Ottoman nizam-i-cedid model, teaching artillery, fortification, geometry, and modern languages to a new generation of officers and bureaucrats."
 nd_alm_diwan_al_jund: "Diwan al-Jund"
 nd_alm_diwan_al_jund_desc: "The imperial muster office, barracks, and pay office for the standing army. The Caliph's standing forces, the jund, are paid and equipped from this institution rather than levied from estates."
 nd_alm_diwan_upkeep: "Diwan Upkeep"
 nd_alm_diwan_upkeep_desc: "Pay and provisions for the standing soldiery, weapons from the armouries, and the regiments' rations."

 # === Production Methods ===
 nd_alm_kasbah_upkeep: "Kasbah Upkeep"
 nd_alm_kasbah_upkeep_desc: "Stone walls, weapons, and the Caliphal garrison's daily provisions."
 nd_alm_minaret_upkeep: "Minaret Upkeep"
 nd_alm_minaret_upkeep_desc: "Stonework, lime mortar, and the wax candles that light the prayer hall."
 nd_alm_house_of_wisdom_upkeep: "House of Wisdom Upkeep"
 nd_alm_house_of_wisdom_upkeep_desc: "Paper from Fez and Jativa, books bound in tooled leather, and the modest needs of resident scholars."
 nd_alm_funduq_upkeep: "Funduq Upkeep"
 nd_alm_funduq_upkeep_desc: "Fodder, food, and storage for the caravans of merchants and their pack animals."
 nd_alm_ribat_upkeep: "Ribat Upkeep"
 nd_alm_ribat_upkeep_desc: "Stonework for walls, weapons for the murabitun, and naval supplies for the coastal lookout."
 nd_alm_armoury_upkeep: "Armoury Upkeep"
 nd_alm_armoury_upkeep_desc: "Iron, charcoal, and the toolmakers' gear that keep the forges running."
 nd_alm_armoury_workshop: "Caliphal Armoury Workshop"
 nd_alm_armoury_workshop_desc: "Iron and coal worked into the steel-tipped weapons of the jund and the Andalusi infantry."
 nd_alm_silk_workshop_upkeep: "Silk Workshop Upkeep"
 nd_alm_silk_workshop_upkeep_desc: "Looms, dyes, and the bookkeeping of the tiraz overseer."
 nd_alm_andalusi_tiraz: "Andalusi Tiraz"
 nd_alm_andalusi_tiraz_desc: "Embroidered robes of state and brocade silks woven in the al-Andalus tradition for export to all the Mediterranean courts."
 nd_alm_academy_upkeep: "Academy Upkeep"
 nd_alm_academy_upkeep_desc: "Imported books, paper for the cadets' notebooks, and the trial weapons of the artillery yard."

 # === Units ===
 a_nd_alm_masmuda_spearmen: "Masmuda Spearmen"
 a_nd_alm_masmuda_spearmen_desc: "Heavy infantry levied from the semi-nomadic Berbers of the High Atlas, organized by tribal hierarchy and fighting in dense formations."
 a_nd_alm_zenata_lancers: "Zenata Lancers"
 a_nd_alm_zenata_lancers_desc: "Light cavalry of the Maghrebi plateau, masters of the karr wa farr tactic of charge and feigned retreat."
 a_nd_alm_andalusi_crossbowmen: "Andalusi Crossbowmen"
 a_nd_alm_andalusi_crossbowmen_desc: "Urban militia of al-Andalus trained on the foot crossbow, providing the Caliphate's missile infantry alongside the Berber spear."
 a_nd_alm_christian_militia: "Christian Mercenary Militia"
 a_nd_alm_christian_militia_desc: "Iberian Christian mercenaries hired in regiments by the late Caliphate, paid in silver and quartered in Marrakesh: Castilian knights, Norman footmen, and adventurers from the Pyrenees."
 n_nd_alm_corsair_xebec: "Corsair Xebec"
 n_nd_alm_corsair_xebec_desc: "A swift Maghrebi galley with combined oar and lateen-rigged sail, raiding European shipping from Sale to Algiers and threading the Strait of Gibraltar."

 # === Levies ===
 levy_nd_alm_masmuda_spearmen: "Masmuda Levy"
 levy_nd_alm_masmuda_spearmen_desc: "Berber tribal infantry from the High Atlas."
 levy_nd_alm_zenata_lancers: "Zenata Cavalry Levy"
 levy_nd_alm_zenata_lancers_desc: "Light cavalry from the Zenata Berber nobility."
 levy_nd_alm_andalusi_crossbowmen: "Andalusi Crossbow Levy"
 levy_nd_alm_andalusi_crossbowmen_desc: "Urban crossbow militia from the cities of al-Andalus."

 # === Destiny Tree ===

 # --- Destiny advance names and descriptions ---
 nd_alm_destiny: "Destiny of the Caliphate"
 nd_alm_destiny_desc: "The choice made at Marrakesh sets the long course of the realm. Whether by the sword of Tinmel or the libraries of al-Andalus, the Almohad project must now be carried to its conclusion."

 nd_alm_dest_strait: "Cross the Strait"
 nd_alm_dest_strait_desc: "The Mahdist host crosses the Strait of Gibraltar in force. The first prizes are the Levante and the central Meseta: Valencia and Toledo. Every soldier sent across the strait is one more sword for the umma."

 nd_alm_dest_western_march: "The Western March"
 nd_alm_dest_western_march_desc: "The Atlantic shore beckons. Push the green-and-white standards through Coimbra to the mouth of the Tagus, taking Lisbon and the Portuguese coast for the Caliphate."

 nd_alm_dest_reconquista_reversed: "Reconquista Reversed"
 nd_alm_dest_reconquista_reversed_desc: "From Pamplona to Barcelona by way of Zaragoza, the last Christian kingdoms of Iberia are broken or absorbed. The umma is restored to Visigothic Spain. Ribat al-Fath rules from sea to sea."

 nd_alm_dest_salt_road: "The Salt Road"
 nd_alm_dest_salt_road_desc: "South of the Sahara, the salt-and-gold caravans wait at the desert wells of Wadan and Walata. Plant the Caliph's banner over the Adrar oases, and the trans-Saharan trade flows into Marrakesh's coffers."

 nd_alm_dest_bilad_al_sudan: "Bilad al-Sudan"
 nd_alm_dest_bilad_al_sudan_desc: "Beyond the desert lies the Land of the Blacks: Timbuktu of the libraries, Djenne of the mud-brick mosque. With banking embraced and a treasury that the world envies, the Caliphate joins the river-cities to the Maghreb."

 nd_alm_dest_two_shores: "The Two Shores"
 nd_alm_dest_two_shores_desc: "Niani submits, gold flows up through the capital market, and the Caliphate stands as the great economic power between the Mediterranean and the Niger. Marrakesh is the new Cordoba and the new Cairo at once."

 # --- Destiny event titles, descriptions, and option text ---
 nd_alm.6.t: "The Long Course"
 nd_alm.6.d: "The choice made on the day of formation has rippled out through the realm. Couriers ride south to the Sus, north to the strait, east to Tunis: the Caliphate has settled on its path, and the next generation of viziers will know what is asked of them. The destiny of the Almohad Caliphate is taking shape."
 nd_alm.6.a: "May our cause prosper"

 nd_alm.7.t: "The Sword Crosses the Strait"
 nd_alm.7.d: "The Mahdist army has crossed the Strait of Gibraltar in force, and the Levante and the central Meseta lie in your hand. Valencia is taken; the gates of Toledo open to the green-and-white standards. The Christian kingdoms reel from the shock. The Caliph's preachers ride ahead of the army, declaring the restoration of Islam to the lands the Visigoths once stole."
 nd_alm.7.a: "Onward: the umma is restored"

 nd_alm.8.t: "The Atlantic Shore"
 nd_alm.8.d: "Coimbra has fallen and Lisbon kneels beneath the Hassan Tower's lesser cousins. The Atlantic shore is yours from the Sus to the Douro. Now the question is how to hold what has been won: by raiding column and continuous campaign, hardening the army for the next push? Or by settling the new lands with Berber colonists and Andalusi qadis, to root the conquest in stable government?"
 nd_alm.8.a: "March on: the campaign must not slacken"
 nd_alm.8.b: "Settle the conquest: bring the qadis and the colonists"

 nd_alm.9.t: "The Caliphate Restored"
 nd_alm.9.d: "From Pamplona to Barcelona, the last crowned Christian heads have submitted, fled, or fallen. The Visigothic kingdom is undone; the Caliphate stretches from the Pyrenees to the Niger. Now the courtiers debate the meaning of the moment: is the Caliph the universal hammer of unbelief, who will press on into the Pyrenees and beyond? Or has the natural frontier been reached, and is it time to fortify the line and consolidate?"
 nd_alm.9.a: "We are the universal Caliphate of the West"
 nd_alm.9.b: "The Pyrenees are the frontier; we hold the line"

 nd_alm.10.t: "Wells of Wadan"
 nd_alm.10.d: "The wells of Wadan and Walata are now in Almohad hands. The salt slabs of Taghaza, the gold dust of the Wadi Sus, the date harvests of the Adrar: all flow upward to Marrakesh. The desert routes have a master, and the Caliph's customs houses bleed silver out of every passing caravan."
 nd_alm.10.a: "Marrakesh enriches itself by the desert"

 nd_alm.11.t: "The River of Black Gold"
 nd_alm.11.d: "Timbuktu and Djenne, the river-cities of the Niger, have come into the Caliphate's orbit. Their scholars copy Maliki fiqh from Andalusi exemplars; their gold dust flows up the salt route to Sijilmasa. The question of how to govern this new realm divides the diwan: rule lightly through native emirs, leveraging local prestige? Or pull the trade down to Marrakesh, and let the bankers of the capital take the profit?"
 nd_alm.11.a: "Govern through native emirs: the Caliph as suzerain"
 nd_alm.11.b: "Centralize the trade: Marrakesh is the bank of the Sahel"

 nd_alm.12.t: "The Caliphate of Two Shores"
 nd_alm.12.d: "Niani has submitted, gold flows through the capital market, and the Caliphate is a junction of trans-Saharan and Mediterranean wealth without equal. The diwan debates the next great project: shall the realm turn outward to the sea, building fleets to project Almohad power across the Mediterranean? Or shall Marrakesh become the new Cordoba in earnest, a cosmopolis of Andalusi philosophy and Sudani scholarship?"
 nd_alm.12.a: "Build the imperial fleet: command the western sea"
 nd_alm.12.b: "Make Marrakesh the cosmopolis of two continents"

 # --- Destiny timed modifier names and descriptions ---
 STATIC_MODIFIER_NAME_nd_alm_dest_atlantic_jihad: "Atlantic Jihad"
 STATIC_MODIFIER_DESC_nd_alm_dest_atlantic_jihad: "The army is kept on continuous campaign along the Atlantic shore. Loot is plentiful, supply trains run thick, and reinforcements move easily; but the constant war-spending stokes inflation in the cities."
 STATIC_MODIFIER_NAME_nd_alm_dest_levantine_settlement: "Settlement of the Levante"
 STATIC_MODIFIER_DESC_nd_alm_dest_levantine_settlement: "Berber colonists and Andalusi qadis are settled across the conquered lands. Cultures are integrated, separatism falls, and the realm becomes durably plural."

 STATIC_MODIFIER_NAME_nd_alm_dest_caliphate_of_the_west: "Caliphate of the West"
 STATIC_MODIFIER_DESC_nd_alm_dest_caliphate_of_the_west: "The Caliph claims universal authority over the western umma. New casus belli ripen quickly, war scores tilt favorably, and peace negotiations bend to imperial will. But the realm's people grow weary of endless campaign."
 STATIC_MODIFIER_NAME_nd_alm_dest_pyrenean_frontier: "The Pyrenean Frontier"
 STATIC_MODIFIER_DESC_nd_alm_dest_pyrenean_frontier: "The Pyrenees become the limes of the Caliphate. Auxiliaries hold the passes, the muster rolls grow fat, and the religious state hardens; the Caliph does not pick fights beyond the natural frontier."

 STATIC_MODIFIER_NAME_nd_alm_dest_sudani_emirates: "Sudani Emirates"
 STATIC_MODIFIER_DESC_nd_alm_dest_sudani_emirates: "Native emirs rule the Sahel under Caliphal suzerainty. Subjects are loyal, diplomatic ties multiply, and goodwill propagates from the Niger to the Atlas."
 STATIC_MODIFIER_NAME_nd_alm_dest_bankers_of_marrakesh: "Bankers of Marrakesh"
 STATIC_MODIFIER_DESC_nd_alm_dest_bankers_of_marrakesh: "The capital becomes the great clearing house of the western trade. Merchants are subsidized, building costs eased by abundant credit, and inflation tamed; but the diplomatic corps is starved as merchants run the embassies."

 STATIC_MODIFIER_NAME_nd_alm_dest_imperial_marketplace: "The Imperial Marketplace"
 STATIC_MODIFIER_DESC_nd_alm_dest_imperial_marketplace: "Almohad fleets command the western Mediterranean. Sea trade flourishes, sailors flock to the corsair ports, and naval traditions deepen by the season."
 STATIC_MODIFIER_NAME_nd_alm_dest_andalusi_intellect: "The Andalusi Cosmopolis"
 STATIC_MODIFIER_DESC_nd_alm_dest_andalusi_intellect: "Marrakesh becomes the new Cordoba: scholars from Tlemcen and Timbuktu, philosophers from Granada and Fez, recover the realm from the marks of war and weave a quiet web of agents across the Mediterranean. But the Caliphate looks inward, not outward to the open sea."

 # === Destiny Buildings ===
 nd_alm_caliphal_jihad_council: "Council of Jihad"
 nd_alm_caliphal_jihad_council_desc: "An imperial council of war and warden, fortified within the kasbah, where standing legions are mustered, frontier garrisons paid, and the unending campaigns of the western umma directed."
 nd_alm_jihad_council_upkeep: "Council Upkeep"
 nd_alm_jihad_council_upkeep_desc: "Weapons for the standing legions, leather for tents and harness, tools for the smiths, and remounts for the cavalry."

 nd_alm_caliphal_treasury: "Caliphal Treasury"
 nd_alm_caliphal_treasury_desc: "The imperial mint and bullion vault of Marrakesh, where Sudani gold is struck into dinars, fine silks brocaded with the Caliph's name leave for foreign courts, and the bankers of two continents render their accounts."
 nd_alm_treasury_upkeep: "Treasury Upkeep"
 nd_alm_treasury_upkeep_desc: "Paper for the ledgers, fine cloth for the robes of office, furniture for the bankers' counting halls, and the tools of the assayers."

 # === Bureaucracies ===
 alm_talaba_bureaucracy: "Talaba"
 alm_talaba_bureaucracy_desc: "The Almohad cadre of theological-administrative students, schooled in Ibn Tumart's tawhid doctrine at the great madrasa of the Kutubiyya and the lodge at Tinmel. Drawn first from the Masmuda chiefs of the High Atlas and later from the wider empire, the talaba supplied the qadis, governors, and tax assessors of the early Caliphate. They displaced the inherited Maliki ulama as the institutional clergy of the realm, training a literate class loyal to the Mu'minid dynasty rather than to the long-rooted Andalusi-Maghrebi fuqaha whose authority the Almohads had come to reform."
 alm_ahl_al_jamaa_bureaucracy: "Ahl al-Jama'a"
 alm_ahl_al_jamaa_bureaucracy_desc: "The Almohad inner council, descended from Ibn Tumart's original Council of Ten and the broader Council of Fifty. It comprised the chiefs of the Masmuda confederation -- Hintata, Tinmel, Ganfisa, Hargha -- alongside the dynastic Mu'minid kin. The jama'a confirmed succession, apportioned campaign commands, and held formal precedence over civil administrators. It made the Almohad state a tribal-aristocratic confederation in caliphal dress, with all the vigor and the brittleness that implied: the same chiefs whose levies broke the Castilians at Alarcos in 1195 abandoned the realm into civil war after Las Navas in 1212."
 alm_diwan_al_insha_bureaucracy: "Diwan al-Insha'"
 alm_diwan_al_insha_bureaucracy_desc: "The chancery of Marrakesh, organ of the caliphal secretariat. Its scribes drafted the dawawin: the proclamations of accession, the appointments of governors, and the ornate official correspondence in the alami script that became the visual signature of Almohad caliphal authority. Under viziers like Abu Ja'far ibn 'Atiyya the chancery developed a rigorous bilingual Arabic-Berber practice that bound the Maghreb and al-Andalus into a single administrative space."
 alm_sikka_almohad_bureaucracy: "Sikka Almohad"
 alm_sikka_almohad_bureaucracy_desc: "The imperial mint of Marrakesh, whose square-flan gold dinar -- the dobla almohade -- and silver dirham became the most trusted coinage of the western Mediterranean. The Christian crowns of Iberia minted millares in conscious imitation, and Almohad gold circulated as far as the fairs of Champagne. The mint's prestige rested on its purity, near 98% gold, and the Caliph's strict control of the assay; loosen that grip, and the coin debased itself into the inflation of the late Mu'minids."

 AUTO_MODIFIER_NAME_nd_alm_bureaucracy_authority: "Diwans of the Caliphate"
 AUTO_MODIFIER_DESC_nd_alm_bureaucracy_authority: "The administrative organs of the Mu'minid state -- the chancery, the talaba schools, the mint, and the council of the Almohad chiefs -- have matured into a permanent institutional apparatus. Marrakesh now governs the western umma not by the campaigning sword alone but through registers, decrees, and the assayed dinar."
