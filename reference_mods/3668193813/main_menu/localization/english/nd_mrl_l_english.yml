l_english:
 # ===== Static Modifiers =====
 STATIC_MODIFIER_NAME_nd_mrl_tagalog_datu_court: "Tagalog Datu Court"
 STATIC_MODIFIER_DESC_nd_mrl_tagalog_datu_court: "The court of Tondo and Maynila is raised to imperial dignity. The maginoo aristocracy administers the archipelago in the Tagalog mahayana-tinged tradition, and the rajah's writ runs from Aparri to Cotabato."
 STATIC_MODIFIER_NAME_nd_mrl_pan_filipino_federation: "Pan-Filipino Federation"
 STATIC_MODIFIER_DESC_nd_mrl_pan_filipino_federation: "Tagalog, Visayan, Tausug, Maguindanao, Kapampangan, Iranun, Bicolano: thirteen peoples, one constitutional compact. The maharlika ideal binds them all without forcing one to bow to another."
 STATIC_MODIFIER_NAME_nd_mrl_kris_and_bagani: "Sword of Maharlika"
 STATIC_MODIFIER_DESC_nd_mrl_kris_and_bagani: "The kris-bearing bagani of Mindanao and the maharlika of Tondo march under the same banner. The empire is forged in arms; the freeman bears them, the datu commands them, and no foreign fleet shall touch its shores."
 STATIC_MODIFIER_NAME_nd_mrl_baybayin_chancellery: "Baybayin Chancellery"
 STATIC_MODIFIER_DESC_nd_mrl_baybayin_chancellery: "The state writes to itself in the indigenous syllabary. Edicts, tax rolls, court records: all on palm-leaf and bamboo, all in baybayin."
 STATIC_MODIFIER_NAME_nd_mrl_baybayin_vernacular: "Baybayin Vernacular"
 STATIC_MODIFIER_DESC_nd_mrl_baybayin_vernacular: "Literacy in baybayin spreads from the court to the village. Children learn the syllabary on bamboo slats; women keep household accounts in their own hand."
 STATIC_MODIFIER_NAME_nd_mrl_anitist_continuity: "Anitist Continuity"
 STATIC_MODIFIER_DESC_nd_mrl_anitist_continuity: "The babaylan keeps her place beside the qadi and the bhikkhu. The ancestral spirits, the anito of the islands, are not displaced; they are respected by all."
 STATIC_MODIFIER_NAME_nd_mrl_concord_of_faiths: "Concord of Faiths"
 STATIC_MODIFIER_DESC_nd_mrl_concord_of_faiths: "Three traditions, one compact: anitist babaylan, Buddhist bhikkhu, Muslim qadi. None displaces the others; the empire stands above all of them."
 STATIC_MODIFIER_NAME_nd_mrl_archipelagic_admiralty: "Archipelagic Admiralty"
 STATIC_MODIFIER_DESC_nd_mrl_archipelagic_admiralty: "Balangay troopships, vinta lateen scouts, caracoa raiders, and lanong assault hulls coordinated under one admiralty. The Sulu Sea, the Sibuyan, and the Visayan Sea are interior waters of the empire."
 STATIC_MODIFIER_NAME_nd_mrl_freeman_estates: "Freeman Estates"
 STATIC_MODIFIER_DESC_nd_mrl_freeman_estates: "The maharlika code is codified into the laws of the realm. The freeman bears arms, owes service, and is heard in the assembly of his datu. The Filipino freeman is the empire's foundation."
 STATIC_MODIFIER_NAME_nd_mrl_warrior_aristocracy: "Warrior Aristocracy"
 STATIC_MODIFIER_DESC_nd_mrl_warrior_aristocracy: "The maharlika are formalized as the imperial officer corps. They serve in the bagani regiments, command the caracoa fleets, and govern the pueblos. War-honour binds them to the throne."
 STATIC_MODIFIER_NAME_nd_mrl_galleon_killers: "Galleon Killers"
 STATIC_MODIFIER_DESC_nd_mrl_galleon_killers: "Lanong and caracoa squadrons hunt the Spanish galleons in the Visayan straits. No foreign fleet that dares the archipelago survives unscathed."
 STATIC_MODIFIER_NAME_nd_mrl_archipelagic_fortress: "Archipelagic Fortress"
 STATIC_MODIFIER_DESC_nd_mrl_archipelagic_fortress: "Ring forts at every coastal pueblo. Tropical disease, monsoon storms, and warrior levies wait for any foreign army that dares to land. The archipelago itself becomes the wall."
 STATIC_MODIFIER_NAME_nd_mrl_silver_route: "Silver of the Pacific"
 STATIC_MODIFIER_DESC_nd_mrl_silver_route: "The Manila-Acapulco galleon is no longer Spanish. Filipino shipwrights at Cavite and Filipino navigators run the silver line themselves; New Spain pays the empire its due."
 STATIC_MODIFIER_NAME_nd_mrl_council_of_datus: "Council of Datus"
 STATIC_MODIFIER_DESC_nd_mrl_council_of_datus: "Paramount datus, the Sulu sultan, the rajah of Tondo: a constitutional body that adjudicates between the great houses. The maharlika compact has its parliament."
 STATIC_MODIFIER_NAME_nd_mrl_propagandist_circle: "Propagandist Circle"
 STATIC_MODIFIER_DESC_nd_mrl_propagandist_circle: "Rizal, Plaridel, del Pilar, Lopez Jaena: state-supported intellectuals codify the Filipino civic identity. The empire produces the books it once imported."

 # ===== Formation Event =====
 nd_mrl.1.t: "Maharlika Rises"
 nd_mrl.1.d: "From Aparri to Maimbung, from Vigan to Zamboanga, the islands bow as one. The thirteen peoples answer to a single banner. The maharlika of Luzon, the timawa of the Visayas, the bagani of Mindanao: one warrior-noble class with three names, now one nation. No Spanish galleon will reach Cebu before us, no Bruneian sultanate will claim Manila as suzerain, no Dutch fleet will plant its flag on Tidore through us. The question that remains is what kind of empire Maharlika shall be.\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_mrl.1.a: "The Tagalog rajah's court at Tondo speaks for the archipelago"
 nd_mrl.1.b: "A federation of all peoples under the maharlika compact"
 nd_mrl.1.c: "The kris and the bagani: an empire forged in arms"

 # ===== Advance Events =====
 nd_mrl.2.t: "Baybayin Becomes the Hand of the State"
 nd_mrl.2.d: "Three indigenous Philippine scripts survived the centuries: the baybayin of the Tagalogs, the surat Mangyan of Mindoro, the kulitan of Pampanga. The maharlika court chooses to elevate baybayin to the status of imperial hand. Edicts now travel from Tondo to Maimbung in palm-leaf packets, written in the round, looping characters that the Spanish friars in our world dismissed as devil-script. The court convenes to debate the script's reach."
 nd_mrl.2.a: "Use baybayin only for the chancellery and high government"
 nd_mrl.2.b: "Spread baybayin to every parish school in the archipelago"

 nd_mrl.3.t: "The Three-Faith Concord"
 nd_mrl.3.d: "The babaylan priestess from Cebu, the Buddhist bhikkhu from Butuan, and the Sulu qadi sit at the same imperial table. Each represents a faith that has lived on these islands for centuries: the anitist substrate that goes back to the Austronesian voyages, the Hindu-Buddhist trace from Indianized Srivijaya and Majapahit, the Sunni Islam carried up from Brunei. The maharlika court must decide whether to elevate all three as state-tolerated, or to keep the anitist tradition first among equals."
 nd_mrl.3.a: "Anitism remains the empire's first religion"
 nd_mrl.3.b: "All three faiths are co-equal under imperial law"

 nd_mrl.4.t: "The Combined Fleet Sails"
 nd_mrl.4.d: "From the harbour of Maynila, the great archipelagic fleet rows out for its first review. Tagalog balangay troopships rigged with abaca cordage, Mindanao vinta with their lateen sails, Visayan caracoa with two-hundred warriors at the oars, Iranun lanong fast-attack hulls bristling with brass lantaka. Four traditions, one navy.\n\nThe admiral debates doctrine with his captains. Some demand a unified four-tradition admiralty, every hull-type used in concert as a single combined fleet. Others demand specialization: the lanong fast-attack squadron as the empire's vanguard, hunting colonial galleons before they ever reach Cebu."
 nd_mrl.4.a: "A unified four-tradition admiralty -- one combined fleet"
 nd_mrl.4.b: "A lanong vanguard -- specialized fast-attack against the galleons"

 nd_mrl.5.t: "The Maharlika Code Made Law"
 nd_mrl.5.d: "Three Filipino warrior traditions: the Tagalog maharlika, the Visayan timawa, the Mindanao bagani. Three names, one ideal: the freeman who bears arms, swears service to his datu, and stands at his lord's shoulder in the assembly. The imperial chancellery now codifies the warrior-noble class as the spine of the state. The question is whether the maharlika are a broad citizen-class of armed freemen, or a narrow officer-aristocracy of imperial servants."
 nd_mrl.5.a: "A broad freeman class -- every armed citizen is maharlika"
 nd_mrl.5.b: "A narrow officer-aristocracy bound to the throne"

 nd_mrl.6.t: "No Galleon Reaches Cebu"
 nd_mrl.6.d: "A foreign fleet enters the archipelago. They expect to find squabbling rajahnates and tribute-paying datus to be played against each other. They find instead a unified empire with a unified fleet. The maharlika council convenes to decide doctrine: do we hunt them at sea with the lanong squadrons, or let them land and grind to dust against the fortified pueblos and the warrior-levies of the interior?"
 nd_mrl.6.a: "Hunt them at sea -- no galleon reaches our shores"
 nd_mrl.6.b: "Let them land -- the islands themselves are our wall"

 nd_mrl.7.t: "The Manila Galleon Becomes Filipino"
 nd_mrl.7.d: "For two and a half centuries in our world, the Manila-Acapulco galleon line carried New World silver to Asia and Asian silk to New Spain. Spanish-built, Spanish-crewed, Spanish-profited. In the Maharlika timeline, the great trans-Pacific traders are built at Cavite by Filipino shipwrights and navigated by Filipino pilots.\n\nThe imperial diwan must decide who shall ride the silver line. Some demand an imperial monopoly: the throne owns every hull, prices every cargo, and pays the silver into a single treasury. Others demand a free-trade compact: any merchant under imperial license may sail, and the trade itself draws Cantonese, Tagalog and Mexican capital into Manila."
 nd_mrl.7.a: "Run the galleon line as the empire's monopoly"
 nd_mrl.7.b: "Open the line to all merchants under imperial license"

 nd_mrl.8.t: "The Archipelagic Council Convenes"
 nd_mrl.8.d: "The paramount datus of every region, the Sultan of Sulu, the Rajah of Maynila, the Lakan of Tondo, the chiefs of the Cordillera highland peoples: all gather at the imperial council hall.\n\nThe deeper question of seating is now to settle. Shall the council be a chamber of paramount datus alone, with each great house holding one voice and the freemen represented through their lord? Or shall it be a unified parliament with seats also for elected freemen delegates from every region, the timawa and maharlika sitting beside the rajahs?"
 nd_mrl.8.a: "A council of paramount datus -- only the great houses sit"
 nd_mrl.8.b: "A unified parliament -- seats for freemen delegates beside the datus"

 nd_mrl.9.t: "The Filipino Enlightenment"
 nd_mrl.9.d: "In our world, the Propaganda Movement of the 1880s, with Rizal, Marcelo del Pilar, Graciano Lopez Jaena, was a movement of expatriates writing for La Solidaridad in Spain, smuggling their work back to a colonized homeland. Under Maharlika, the propagandists work from Manila itself, with state patronage and unhindered presses.\n\nThe imperial chancellery must decide what enlightenment shall be. Patronize the ilustrado circle: a court-tied intelligentsia writing in Spanish for the educated peer of Madrid and Paris. Or patronize the vernacular: pamphlets and chronicles in baybayin, Tagalog and Cebuano for the people, the village priest, the barangay schoolmaster. The empire's voice will be one or the other."
 nd_mrl.9.a: "Patronize the ilustrado circle -- court intelligentsia in Spanish"
 nd_mrl.9.b: "Patronize the vernacular -- pamphlets in baybayin and the regional tongues"

 # ===== Advances =====
 nd_mrl_maharlika_code: "Maharlika Code"
 nd_mrl_maharlika_code_desc: "The warrior-noble freeman class of every Filipino people: the maginoo of Tondo, the timawa of Cebu, the bagani of Mindanao. One ideal, three names. The state codifies them as its civic and military spine."
 nd_mrl_datu_federation: "Datu Federation"
 nd_mrl_datu_federation_desc: "Layered chiefdoms under a paramount rajah: the indigenous Filipino mode of polity. Tondo, Maynila, Pangasinan, Cebu, Butuan and Maimbung as semi-autonomous, mutually loyal lords."
 nd_mrl_balangay_craft: "Balangay Craftsmanship"
 nd_mrl_balangay_craft_desc: "The planked outrigger ship that bound Luzon, the Visayas, and Mindanao together for fifteen centuries before Magellan. Excavated balangay at Butuan date to the eleventh century."
 nd_mrl_anitist_syncretism: "Anitist Syncretism"
 nd_mrl_anitist_syncretism_desc: "The indigenous animist substrate that absorbed and softened every wave of Hindu-Buddhist and Islamic influence without ever being erased. The babaylan keeps her place at the village hearth."
 nd_mrl_pearl_and_gold: "Pearl and Gold Economy"
 nd_mrl_pearl_and_gold_desc: "Surigao gold, Sulu pearls, Butuan goldsmiths producing the kinnari and golden tara. The Filipino wealth that was here long before Spanish galleons arrived to redirect it."
 nd_mrl_baybayin_literacy: "Baybayin Literacy"
 nd_mrl_baybayin_literacy_desc: "The Filipino syllabary, used for civic and personal correspondence from Luzon to the Visayas. The first Tagalog book printed in 1593 used baybayin; under Maharlika, it is the hand of the state."
 nd_mrl_timawa_freemen: "Timawa Freemen"
 nd_mrl_timawa_freemen_desc: "The Visayan freeman warriors who fought as peers to their datu. An antecedent to the modern citizen-soldier ideal, two centuries before Europe rediscovered the concept."
 nd_mrl_caracoa_fleet: "Caracoa Raid Fleet"
 nd_mrl_caracoa_fleet_desc: "The great Visayan war canoe, capable of two hundred warriors per hull. The terror of inter-island warfare; in our world, used to raid Spanish encomiendas as far north as Camarines."
 nd_mrl_manila_trade: "Manila Trade Network"
 nd_mrl_manila_trade_desc: "Tondo and Maynila as nodes in the Brunei-China-Ryukyu trade network. The Mindoro porcelain hoards and the Chinese coin caches at Kalatagan are the archaeological proof."
 nd_mrl_datu_council: "Datu Council Statecraft"
 nd_mrl_datu_council_desc: "Formalized assemblies of paramount datus as deliberative bodies. The germ of the constitutional empire to come."
 nd_mrl_three_faith_concord: "Three-Faith Concord"
 nd_mrl_three_faith_concord_desc: "Anitism, syncretic Buddhism, and Sunni Islam coexisting under imperial law. Babaylan, bhikkhu, qadi: each acknowledged, none privileged above the empire itself."
 nd_mrl_combined_fleet_doctrine: "Combined Fleet Doctrine"
 nd_mrl_combined_fleet_doctrine_desc: "Balangay troopships, vinta lateen scouts, caracoa heavy raiders, and lanong fast-attack hulls coordinated as one archipelagic navy. Every shipbuilding tradition of the islands feeds one fleet."
 nd_mrl_bagani_code: "Bagani Warrior Code"
 nd_mrl_bagani_code_desc: "The Mindanao warrior caste who proved themselves through the pangayaw raid: a young man earns his bagani title only by feat of arms. Their code becomes the empire's elite military doctrine."
 nd_mrl_datu_congress: "Datu Congress"
 nd_mrl_datu_congress_desc: "Periodic gatherings of all paramount rulers, formalized into a constitutional body that adjudicates inter-datu disputes and binds the great houses."
 nd_mrl_surigao_goldsmithing: "Surigao Goldsmithing"
 nd_mrl_surigao_goldsmithing_desc: "The rediscovery of the lost-wax casting tradition that produced the Agusan Image and the golden tara of Butuan. A Filipino sacred metalwork that dates to the tenth century."
 nd_mrl_expulsion_doctrine: "Expulsion Doctrine"
 nd_mrl_expulsion_doctrine_desc: "Maharlika's foreign policy doctrine: every European fleet that lands is met with the combined arms of all archipelagic peoples. No Cebu, no Manila, no Sulu falls."
 nd_mrl_military_academy: "Maharlika Military Academy"
 nd_mrl_military_academy_desc: "The formal institution that turns the freeman ideal into a trained officer corps drawn from all three regions. Maginoo, timawa, and bagani in the same drill-yard."
 nd_mrl_archipelago_marketplace: "Pan-Archipelago Marketplace"
 nd_mrl_archipelago_marketplace_desc: "Tondo, Cebu, Butuan, and Maimbung as integrated trading nodes, with state-backed weights and measures. The empire becomes one market."
 nd_mrl_confluence_courts: "Confluence Courts"
 nd_mrl_confluence_courts_desc: "Judicial body integrating Tagalog Code, Sulu sharia, and Visayan customary law into a unified legal framework. Where the three legal traditions converge, imperial law decides."
 nd_mrl_cordillera_to_sulu: "From Cordillera to Sulu"
 nd_mrl_cordillera_to_sulu_desc: "The highland Igorot, the lowland Tagalog, and the seafaring Tausug bound under one civic identity. The maharlika compact reaches from the Cordillera mountain peoples to the Sulu pearl-divers."
 nd_mrl_manila_galleon: "Filipino Manila Galleon"
 nd_mrl_manila_galleon_desc: "The alt-history capture of the Acapulco-Manila silver route. Filipino seafarers replace the Spanish Crown as the brokers of New Spain silver, and the trans-Pacific trade becomes an imperial monopoly."
 nd_mrl_archipelagic_council: "Archipelagic Council"
 nd_mrl_archipelagic_council_desc: "A constitutional empire: paramount datus, the Sulu sultan, the rajah of Tondo, all bound by the maharlika compact. Every people has a seat; every seat is bound to the throne."
 nd_mrl_abaca_indigo_export: "Abaca and Indigo Exports"
 nd_mrl_abaca_indigo_export_desc: "Manila hemp for global cordage, Visayan indigo for the international dye markets. The empire's industrial cash crops, all under Maharlika monopoly."
 nd_mrl_fortified_pueblos: "Fortified Pueblos"
 nd_mrl_fortified_pueblos_desc: "The ring of stone-walled archipelagic towns, ready to repel any foreign incursion from Vigan in the north to Zamboanga in the south. The Filipino answer to the Spanish presidio."
 nd_mrl_unified_service: "Unified Service in Arms"
 nd_mrl_unified_service_desc: "The formal merger of timawa freemen, Mindanao bagani, and Tagalog maharlika into one imperial military, paid by one treasury, drilled to one standard."
 nd_mrl_filipino_enlightenment: "Filipino Enlightenment"
 nd_mrl_filipino_enlightenment_desc: "The alt-history Propaganda Movement realized as a state-supported intellectual flowering. Rizal, Marcelo del Pilar, and Graciano Lopez Jaena writing from Manila with imperial patronage instead of Madrid in exile."
 nd_mrl_katipunan_spirit: "Katipunan Civic Spirit"
 nd_mrl_katipunan_spirit_desc: "The Bonifacio brotherhood realized as state ideology. All citizens, all faiths, all islands, equal under the maharlika compact, bound by mutual obligation."
 nd_mrl_industrial_manila_bay: "Industrial Manila Bay"
 nd_mrl_industrial_manila_bay_desc: "Coal stations, modern shipyards, locomotive works at Tondo and San Fernando: the archipelago becomes the southeast Asian industrial axis the historical Philippines never managed to be."
 nd_mrl_pacific_naval_doctrine: "Pacific Naval Doctrine"
 nd_mrl_pacific_naval_doctrine_desc: "The modern Filipino fleet projecting from Cebu to Guam: the indigenous Pacific power that the Treaty of Paris never allowed to exist."
 nd_mrl_bayanihan_compact: "Bayanihan Compact"
 nd_mrl_bayanihan_compact_desc: "Communal labour and mutual aid as state organizing principle. The Filipino civic answer to the European nation-state: the bayanihan is the empire's social contract."

 # ===== Variable tooltips =====
 nd_mrl_formed_tt: "Maharlika has been formed."
 nd_mrl_path_a_tt: "Tagalog Datu Court path was chosen at formation."
 nd_mrl_path_b_tt: "Pan-Filipino Federation path was chosen at formation."
 nd_mrl_path_c_tt: "Sword of Maharlika path was chosen at formation."

 # ===== Units =====
 a_nd_mrl_maharlika_levy: "Maharlika Warriors"
 a_nd_mrl_maharlika_levy_desc: "The Tagalog warrior-noble freeman class, raised as a class privilege rather than a paid regiment. Bears arms beside the datu in council and in war."
 a_nd_mrl_timawa_levy: "Timawa Freemen"
 a_nd_mrl_timawa_levy_desc: "Visayan freemen with the bangkaw spear and budiak shield. Mobile light infantry whose freedom is bound to their willingness to fight."
 a_nd_mrl_bagani: "Bagani"
 a_nd_mrl_bagani_desc: "Mindanao warrior elite, kris-bearing shock troops who earned their title through the pangayaw raid. The empire's elite arm."
 a_nd_mrl_bagani_levy: "Bagani Levy"
 a_nd_mrl_bagani_levy_desc: "The bagani warrior caste raised through the levy system, called up from the soldier class of every Mindanao pueblo."
 n_nd_mrl_balangay: "Balangay"
 n_nd_mrl_balangay_desc: "The planked outrigger ship that bound the Filipino archipelago for fifteen centuries. Fast, shallow-draft, and capable of crossing open ocean between the islands."
 n_nd_mrl_balangay_levy: "Balangay Levy"
 n_nd_mrl_balangay_levy_desc: "The community balangay, raised by every coastal pueblo as part of its imperial obligation."
 n_nd_mrl_caracoa: "Caracoa"
 n_nd_mrl_caracoa_desc: "The great Visayan war canoe, double-outrigger, lateen-rigged, capable of two hundred warriors per hull. The terror of inter-island warfare."
 n_nd_mrl_caracoa_levy: "Caracoa Levy"
 n_nd_mrl_caracoa_levy_desc: "The community caracoa, raised by the burgher class of coastal Visayan pueblos with peasant and laborer crews."
 n_nd_mrl_lanong: "Lanong"
 n_nd_mrl_lanong_desc: "The Iranun-Tausug raid hull, fast, lateen-rigged, with mounted brass lantaka. The light fast-attack arm of the combined archipelagic fleet."
 n_nd_mrl_filipino_galleon: "Filipino Galleon"
 n_nd_mrl_filipino_galleon_desc: "The alt-history Manila galleon: built at Cavite by Filipino shipwrights, navigated by Filipino pilots, carrying the empire's silver across the Pacific."

 # ===== Buildings =====
 nd_mrl_panday_workshop: "Panday Workshop"
 nd_mrl_panday_workshop_desc: "The indigenous goldsmith and metalworker tradition. Producers of the Surigao kinnari, the Butuan tara, the kris of the south, and the bronze lantaka of the fleet."
 nd_mrl_panday_goldsmithing: "Panday Goldsmithing"
 nd_mrl_panday_goldsmithing_desc: "Gold and pearl worked by lost-wax casting into kinnari pendants, golden tara icons, and kris fittings. Filipino jewelry for the court and the sacred."
 nd_mrl_baybayin_archive: "Baybayin Archive"
 nd_mrl_baybayin_archive_desc: "Repository of palm-leaf manuscripts in the indigenous Filipino syllabary. The civic chancellery of an empire that writes to itself in baybayin."
 nd_mrl_baybayin_archive_maintenance: "Baybayin Scriptorium"
 nd_mrl_baybayin_archive_maintenance_desc: "Scribes copy edicts, court records, and liturgical texts onto palm-leaf and bamboo, in the round looping script of the islands."
 nd_mrl_pantalan: "Pantalan"
 nd_mrl_pantalan_desc: "The great Tagalog wharf complex, where Brunei junks, Ryukyu traders, and Chinese silk-bearers met at Tondo's mouth-of-the-Pasig market."
 nd_mrl_pantalan_brokerage: "Pantalan Brokerage"
 nd_mrl_pantalan_brokerage_desc: "Coastal merchants brokering pottery, pearls, and abaca cordage between the archipelago's trading peoples and foreign traders."
 nd_mrl_ginto_foundry: "Ginto Foundry"
 nd_mrl_ginto_foundry_desc: "The lost-wax casting facility producing the great gold images: the Agusan Image, the Surigao tara, the Butuan kinnari. A Filipino sacred metalwork at imperial scale."
 nd_mrl_ginto_casting: "Ginto Casting"
 nd_mrl_ginto_casting_desc: "Lost-wax gold casting at imperial scale: the Agusan Image, the Surigao tara, the Butuan kinnari. Produces jewelry of the highest Filipino sacred tradition."
 nd_mrl_maharlika_academy: "Maharlika Military Academy"
 nd_mrl_maharlika_academy_desc: "The formal institution turning the freeman ideal into a trained officer corps. Maginoo, timawa, and bagani in the same drill-yard, under one imperial standard."
 nd_mrl_academy_drill: "Academy Drill"
 nd_mrl_academy_drill_desc: "The combined drill of all three Filipino warrior traditions, taught from imperial manuals."
 nd_mrl_palengke_aguinaldo: "Palengke Aguinaldo"
 nd_mrl_palengke_aguinaldo_desc: "The great pan-archipelagic marketplace, with weights and measures standardized across Tondo, Cebu, Butuan, and Maimbung. The empire becomes one market."
 nd_mrl_palengke_brokerage: "Palengke Brokerage"
 nd_mrl_palengke_brokerage_desc: "Imperial market brokers in rice, abaca fiber, and Sulu pearls, under standardized weights and measures."
 nd_mrl_pueblo_kuta: "Pueblo Kuta"
 nd_mrl_pueblo_kuta_desc: "The fortified pueblo: a ring of stone-walled archipelagic towns. The Filipino domestic answer to the Spanish presidio, built by Filipinos on Filipino soil."
 nd_mrl_pueblo_garrison: "Pueblo Garrison"
 nd_mrl_pueblo_garrison_desc: "The fortified pueblo's garrison drill: timawa freemen and maharlika officers ready to repel any foreign landing."

 nd_mrl_babaylan_hall: "Babaylan Hall"
 nd_mrl_babaylan_hall_desc: "The state-recognized hall for the babaylan and katalonan: spirit-medium priestesses of the indigenous Filipino tradition. Anitism's house in the empire."
 nd_mrl_babaylan_rites: "Babaylan Rites"
 nd_mrl_babaylan_rites_desc: "Ceremonial offerings, smoke, and woven prayers in the indigenous Filipino spirit tradition."
 # ===== Levies =====
 levy_nd_mrl_maharlika_warriors: "Maharlika Warrior Levy"
 levy_nd_mrl_maharlika_warriors_desc: "The Tagalog warrior-noble class raised as a levy obligation. Soldiers and peasants of the maharlika tradition answer their datu's call."
 levy_nd_mrl_timawa_freemen: "Timawa Freeman Levy"
 levy_nd_mrl_timawa_freemen_desc: "The Visayan citizen-soldier levy. Every freeman of soldier or peasant class is bound by oath to muster at his datu's call."
 levy_nd_mrl_bagani: "Bagani Levy"
 levy_nd_mrl_bagani_levy_desc: "The Mindanao warrior-caste levy. Drawn exclusively from the soldier class, only those proven in the pangayaw raid are eligible."
 levy_nd_mrl_caracoa: "Caracoa Levy"
 levy_nd_mrl_caracoa_desc: "The Visayan war-canoe levy. Coastal burgher communities raise the caracoa hulls; peasants and laborers of the village serve as oarsmen-warriors."

 # ===== Destiny Advances =====
 nd_mrl_destiny: "The Maharlika Compact"
 nd_mrl_destiny_desc: "The empire stands. From Aparri to Maimbung, the maharlika compact holds. The throne now decides what kind of empire it shall become; the choice made at formation now blooms into a national destiny. Stability above 75 keeps the compact alive."
 nd_mrl_dest_compact_endures: "The Compact Endures"
 nd_mrl_dest_compact_endures_desc: "Institutionalize the Pan-Filipino Federation. Embrace Legalism, raise the empire to 1500 development total, and prove that thirteen peoples can govern themselves under a single legal compact."
 nd_mrl_dest_concord_codex: "Three-Faith Codex"
 nd_mrl_dest_concord_codex_desc: "Codify the concord of babaylan, qadi, and bhikkhu under banking-era institutions. Embrace Banking, hold 2000 development and 2000 gold, and ensure pearls trade in our markets. The empire becomes a maritime cosmopolis."
 nd_mrl_dest_bayanihan_empire: "Bayanihan Empire"
 nd_mrl_dest_bayanihan_empire_desc: "The constitutional archipelago at its apex. Embrace Global Trade, reach 2500 development and 3000 gold, hold stability at 75. The Bahay-Balangay council convenes; the empire becomes the southeast Asian civic standard. Unlocks the Bahay-Balangay capital council."
 nd_mrl_dest_kris_unsheathed: "Kris Unsheathed"
 nd_mrl_dest_kris_unsheathed_desc: "Take the war beyond the islands. Hold Berune (Brunei) and Sandakan (north Borneo); muster 30 regiments. The maharlika sword crosses the sea."
 nd_mrl_dest_lanong_ascendancy: "Lanong Ascendancy"
 nd_mrl_dest_lanong_ascendancy_desc: "Master the Sulu Sea and seize the Spice Arc. Hold Ternate, Tidore, and Manado; muster 50 regiments and 50 prestige. No European fleet enters the inner waters of the empire."
 nd_mrl_dest_kalayaan_pacific: "Kalayaan in the Pacific"
 nd_mrl_dest_kalayaan_pacific_desc: "Project from the Sakishima to the Spice Islands. Hold Tamsui, Miyakojima, and Jailolo; field 75 regiments, 3000 gold, and stability above 75. The Filipino fleet becomes a Pacific power. Unlocks the Kuta Admiralty."

 # ===== Destiny Events =====
 nd_mrl.10.t: "The Compact Holds"
 nd_mrl.10.d: "Word reaches every datu hall and every village pueblo: the empire stands. The Tagalog mother in Tondo, the Tausug pearl-diver at Maimbung, the Ifugao rice-terrace builder in Banaue: each hears the same imperial proclamation. From here, the path chosen at formation will bloom into a national destiny written across the centuries."
 nd_mrl.10.a: "Onward, then, under the maharlika banner."

 nd_mrl.11.t: "The Federation Made Permanent"
 nd_mrl.11.d: "The Pan-Filipino Federation is no longer a bargain at formation: it is the framework of the realm.\n\nThe imperial chancellery now debates how to anchor it. Codify the compact in baybayin imperial law, with edicts read aloud at every council and every market: the federation made statute. Or anchor it in cultural identity, a federation of shared festivals, shared songs, shared ancestors invoked at every lakaran -- the federation made tradition."
 nd_mrl.11.a: "Codify the compact in baybayin imperial law"
 nd_mrl.11.b: "Anchor the compact in shared culture and ancestry"

 nd_mrl.12.t: "The Three-Faith Codex"
 nd_mrl.12.d: "The babaylan, the qadi, and the bhikkhu meet in a single chamber and produce a concord codex bound in palm-leaf and silver. The empire's banks now lend across faith lines. The court must choose how to publish: as a chancellery instrument, or as a vernacular text in every village."
 nd_mrl.12.a: "A chancellery codex, sealed by three faith-clerks."
 nd_mrl.12.b: "A vernacular codex, read aloud in every pueblo."

 nd_mrl.13.t: "The Bayanihan Empire Convenes"
 nd_mrl.13.d: "The Bahay-Balangay council hall is raised in the capital, planked like the great voyaging ship that gave the empire its first metaphor. Every people, every faith, every datu and burgher and clergy delegate, sits beneath one roof. The maharlika compact is the southeast Asian civic standard. The court chooses its character: a constitutional concord of the great houses, or a publicistic state speaking to the world?"
 nd_mrl.13.a: "An archipelagic concord of the houses."
 nd_mrl.13.b: "A solidaridad state, publishing for the world."

 nd_mrl.14.t: "The Kris Crosses the Sea"
 nd_mrl.14.d: "The bagani of Cotabato and the Iranun of Lanao take the imperial banner across the Sulu Sea. Berune falls; Sandakan answers. The first foreign coasts kneel to the maharlika compact. The doctrine is proven: the empire's sword reaches across the water.\n\nThe imperial diwan must decide what comes next. Press the offensive across Sulawesi to the Moluccas, where Spanish, Dutch and Tidoran ships dispute the spice. Or hold the bagani as the empire's home guard, secure the archipelago first, and let the conquest of foreign coasts come later."
 nd_mrl.14.a: "Press the offensive -- onward to Sulawesi and the Moluccas"
 nd_mrl.14.b: "Hold the bagani as home guard -- secure the archipelago first"

 nd_mrl.15.t: "The Lanong Ascendancy"
 nd_mrl.15.d: "Ternate and Tidore, the legendary clove islands, fall under the empire's banner. Manado at the tip of Sulawesi is taken. The Sulu Sea, the Banda Sea, the Celebes: all are interior waters. The admiralty must choose: a doctrine of pangayaw raid honour written into the heavy regiments, or a doctrine of brass lantaka squadrons projecting from every coastal kuta?"
 nd_mrl.15.a: "The pangayaw doctrine: raid honour as state ideal."
 nd_mrl.15.b: "The lantaka squadrons: brass cannon at every coast."

 nd_mrl.16.t: "Kalayaan from Sakishima to Jailolo"
 nd_mrl.16.d: "Tamsui in Taiwan, Miyakojima in the Sakishima chain, Jailolo on Halmahera: the empire's banner now flies across the Pacific. The maharlika sword reaches further than any indigenous polity in the history of these seas. The court chooses its final doctrine: a war of the isles, in which every European fleet is hunted to extinction; or a Kalayaan admiralty, projecting Filipino power as the Pacific standard."
 nd_mrl.16.a: "A war of the isles -- no foreign hull leaves intact."
 nd_mrl.16.b: "A Kalayaan admiralty -- the Pacific is ours by right."

 # ===== Destiny Timed Modifiers =====
 STATIC_MODIFIER_NAME_nd_mrl_dest_three_chanceries: "Three Chanceries"
 STATIC_MODIFIER_DESC_nd_mrl_dest_three_chanceries: "The babaylan archive, the Sulu sharia office, and the Tondo court chancellery operate as three coequal organs of imperial state. Edicts cross-reference all three; foreign embassies are forwarded to all three."
 STATIC_MODIFIER_NAME_nd_mrl_dest_baybayin_universal: "Baybayin Universal"
 STATIC_MODIFIER_DESC_nd_mrl_dest_baybayin_universal: "Every parish school teaches baybayin alongside the local script. Burghers keep ledgers in the round looping characters from Aparri to Maimbung; the crown's direct-tax base shrinks as estate accountants gain a private hand."
 STATIC_MODIFIER_NAME_nd_mrl_dest_archipelagic_concord: "Archipelagic Concord"
 STATIC_MODIFIER_DESC_nd_mrl_dest_archipelagic_concord: "Paramount datus, the Sulu sultan, the rajah of Tondo, and elected burgher representatives sit in the Bahay-Balangay council. Every people has a constitutional voice; the empire builds at imperial scale."
 STATIC_MODIFIER_NAME_nd_mrl_dest_solidaridad_state: "Solidaridad State"
 STATIC_MODIFIER_DESC_nd_mrl_dest_solidaridad_state: "The empire publishes for the world: La Solidaridad in Manila, the Filipino enlightenment as imperial export. The empire fights its wars in print; foreign annexation grows costlier as imperial allies multiply."
 STATIC_MODIFIER_NAME_nd_mrl_dest_pangayaw_doctrine: "Pangayaw Doctrine"
 STATIC_MODIFIER_DESC_nd_mrl_dest_pangayaw_doctrine: "The Mindanao raid-tradition codified into imperial heavy doctrine. Bagani officers earn their command by feat of arms; bureaucrats are recruited by martial demonstration. The court loses cultural finesse as it sharpens its sword."
 STATIC_MODIFIER_NAME_nd_mrl_dest_lantaka_squadrons: "Lantaka Squadrons"
 STATIC_MODIFIER_DESC_nd_mrl_dest_lantaka_squadrons: "Brass lantaka cannon at every kuta and aboard every lanong, cast in archipelagic foundries from Sulu copper. The trade routes are protected; the empire's harbour-line is teeth."
 STATIC_MODIFIER_NAME_nd_mrl_dest_war_of_the_isles: "War of the Isles"
 STATIC_MODIFIER_DESC_nd_mrl_dest_war_of_the_isles: "Every coast is a garrison; every garrison is a fleet-base. The empire pours its treasure into ships and sailors; the noble estates feel the strain of perpetual mobilization."
 STATIC_MODIFIER_NAME_nd_mrl_dest_kalayaan_admiralty: "Kalayaan Admiralty"
 STATIC_MODIFIER_DESC_nd_mrl_dest_kalayaan_admiralty: "The Cebu-Cavite-Sulu admiralty network projects from the Sakishima to Jailolo. Defensive doctrine made imperial; logistics and food capacity make Filipino fleets sustainable across the Pacific."

 # ===== Destiny Buildings =====
 nd_mrl_dest_bahay_balangay: "Bahay-Balangay"
 nd_mrl_dest_bahay_balangay_desc: "The constitutional council hall of the Bayanihan Empire, planked like the great voyaging ship that gave the empire its first metaphor. Every people, every faith, every datu and burgher and clergy delegate sits beneath one roof."
 nd_mrl_dest_balangay_council: "Balangay Council"
 nd_mrl_dest_balangay_council_desc: "The constitutional council in session, with edicts copied in baybayin, Spanish, and jawi for distribution to every datu hall."
 nd_mrl_dest_kuta_admiralty: "Kuta Admiralty"
 nd_mrl_dest_kuta_admiralty_desc: "The fortified Pacific naval headquarters, a stone-walled kuta crowned with brass lantaka and lanong slipways. The Filipino answer to a colonial admiralty: built at Cavite, projecting from Cebu to Guam."
 nd_mrl_dest_admiralty_drill: "Admiralty Drill"
 nd_mrl_dest_admiralty_drill_desc: "Combined fleet exercises, lanong gun drills, and the codified Pacific naval doctrine taught from imperial manuals."

 # ===== BUREAUCRACIES =====
 mrl_datu_court_bureaucracy: "Datu Court of the Maharlika"
 mrl_datu_court_bureaucracy_desc: "Codification of the Tagalog and Visayan warrior-noble code that distinguished maginoo, maharlika, and timawa from the alipin commonality. Documented by Plasencia and Loarca in the 1580s, the maharlika bore arms for their datu in exchange for tax exemption on inherited land. As an imperial institution, the Court of the Maharlika ratifies fiefs across all thirteen Filipino cultures and standardizes the bagani-bayani warrior cult into a single hereditary service nobility."
 mrl_ruma_bichara_bureaucracy: "Ruma Bichara"
 mrl_ruma_bichara_bureaucracy_desc: "The deliberative council of fifteen datus that historically governed the Sultanate of Sulu alongside its sultan, with parallel Bichara Atas in Maguindanao. Composed of the raja muda, ladja laut admiral, bandahala treasurer, and other datu-portfolios, the council elected heirs apparent and bound the realm by consensus. Adopted as the upper chamber of Maharlika, the Ruma Bichara checks crown ambition with the federated voice of the datus."
 mrl_three_faith_concord_bureaucracy: "Three-Faith Concord"
 mrl_three_faith_concord_bureaucracy_desc: "The Pagsasanib settlement: anitist babaylan priestesses of Luzon and the Visayas, Muslim panditas of the Sulu and Maguindanao sultanates, and Buddhist bhikkhu inherited from the Butuan and Tondo polities all hold formal court rank simultaneously. No precolonial Filipino realm had yet codified this matrix, but the syncretic accommodation was lived practice from the 13th to the 16th century before colonial Christianization closed it. The empire formalizes what the barangays already knew."
 mrl_baybayin_chancellery_bureaucracy: "Baybayin Chancellery"
 mrl_baybayin_chancellery_bureaucracy_desc: "Pedro Chirino marvelled in 1604 that nearly every Tagalog could read and write in their native script. Surviving 17th-century baybayin land deeds at the University of Santo Tomas attest to administrative use; precolonial scribes signed contracts, recorded tributes, and inscribed temple rites in the Brahmic-derived alphabet. The Chancellery centralizes baybayin, jawi, and kawi clerks under one bureau, replacing the oral tradition of the datu's atubang sa datu privy counselor with written record."
 mrl_lanong_admiralty_bureaucracy: "Lanong Admiralty"
 mrl_lanong_admiralty_bureaucracy_desc: "Combined fleet doctrine fusing the Visayan karakoa warship, the Butuan-Tondo balangay voyaging hull, the Sulu-Iranun lanong raiding galley, and the Mindanao-Sulu vinta outrigger into one imperial naval establishment. The karakoa was the political instrument of the 16th-century archipelago: those who had them dominated those who did not. The Admiralty inherits the seasonal mangayaw raid economy and turns it outward into Pacific projection."

 # The auto-modifier governing slot grant on formation
 AUTO_MODIFIER_NAME_nd_mrl_bureaucracy_authority: "Bureaucratic Authority of Maharlika"
 AUTO_MODIFIER_DESC_nd_mrl_bureaucracy_authority: "On the proclamation of Maharlika, the empire inherits the institutional repertoire of every barangay, sultanate, and rajahnate it now subsumes. The crown may host historical bureaucracies."

# === POLISH PASS: NEW MODIFIER LOC ===
 STATIC_MODIFIER_NAME_nd_mrl_lanong_vanguard: "Lanong Vanguard"
 STATIC_MODIFIER_DESC_nd_mrl_lanong_vanguard: "The lanong fast-attack squadron is the empire's first answer to any colonial galleon that crosses the archipelago. Lateen-rigged, oared in calm water, lantaka-armed, drilled to intercept and board before any line of battle can form."
 STATIC_MODIFIER_NAME_nd_mrl_galleon_free_trade: "Manila Free-Trade Compact"
 STATIC_MODIFIER_DESC_nd_mrl_galleon_free_trade: "Any merchant under imperial license may sail the trans-Pacific line. Cantonese silk-houses, Tagalog gold-merchants, Mexican silver-syndicates: all converge on Manila under one set of weights and measures. The empire taxes the flow rather than owning the cargo."
 STATIC_MODIFIER_NAME_nd_mrl_unified_parliament: "Unified Maharlika Parliament"
 STATIC_MODIFIER_DESC_nd_mrl_unified_parliament: "Elected freemen delegates -- timawa, maharlika, urban burghers -- sit beside the paramount datus. The empire's voice is no longer the great houses' alone; the maharlika compact has its constitutional chamber."
 STATIC_MODIFIER_NAME_nd_mrl_vernacular_populist: "Vernacular Enlightenment"
 STATIC_MODIFIER_DESC_nd_mrl_vernacular_populist: "Pamphlets and chronicles flow in baybayin, Tagalog, Cebuano and Hiligaynon. The barangay schoolmaster reads them at the market post; the village priest preaches from them; the empire's enlightenment reaches the people without passing through Madrid first."
 STATIC_MODIFIER_NAME_nd_mrl_dest_compact_codified: "Compact in Baybayin Law"
 STATIC_MODIFIER_DESC_nd_mrl_dest_compact_codified: "The Pan-Filipino Federation is set down in baybayin and Spanish, edict by edict, treaty by treaty, ratified by every paramount council. The compact is now imperial law, with statute and precedent and a chancellery to enforce both."
 STATIC_MODIFIER_NAME_nd_mrl_dest_compact_cultural: "Compact in Shared Culture"
 STATIC_MODIFIER_DESC_nd_mrl_dest_compact_cultural: "The Pan-Filipino Federation is anchored not in statute but in shared festivals, shared songs, shared ancestors invoked at every lakaran. The compact lives in custom -- harder to codify, harder still to break."
 STATIC_MODIFIER_NAME_nd_mrl_dest_kris_offensive: "Kris Across the Sulu Sea"
 STATIC_MODIFIER_DESC_nd_mrl_dest_kris_offensive: "The bagani regiments march across the water. Berune to Sandakan, Manado to Ternate: every foreign coast within range of the imperial vinta becomes contested ground. The empire chooses expansion."
 STATIC_MODIFIER_NAME_nd_mrl_dest_kris_homeguard: "Kris of the Home Guard"
 STATIC_MODIFIER_DESC_nd_mrl_dest_kris_homeguard: "The bagani are held in their home regiments, drilling for any colonial fleet that might dare the archipelago. Foreign expansion waits; archipelagic security comes first. The empire chooses defense."
