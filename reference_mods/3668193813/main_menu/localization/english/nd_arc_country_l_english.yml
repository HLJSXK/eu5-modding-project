l_english:
 ARC: "Cilician Armenia"
 ARC_ADJ: "Cilician Armenian"
 ARC_f: "Cilician Armenia"
 ARC_f_desc: "Restore the Armenian Kingdom of Cilicia under the Hethumid crown, the Mediterranean realm that for two centuries bridged Apostolic Christendom and the Latin Crusader world from its capital at Sis. Where highland Bagratid Armenia looks east to the Caucasus, Cilician Armenia faces the sea: a kingdom of merchant ports, Italian trading concessions, and knights in eastern surcoats. Forge an Armenian thalassocracy along the Levantine coast, master Cyprus and the spice routes, and prove that the kingdom the Mamluks broke in 1375 could yet have outlasted them."
