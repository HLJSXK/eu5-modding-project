l_english:

 # Game Rule
 rule_nd_bureaucracies_rule: "National Destinies Bureaucracies"
 setting_nd_bureaucracies_enabled: "Enabled"
 setting_nd_bureaucracies_enabled_desc: "Each formable country gains 4-9 toggleable historical institutions on formation. Each is a slotted bureaucracy with a maintenance slider; the formed nation also gains the slots and authority needed to run them. This requires the [bureaucracies|e] base-game system."
 setting_nd_bureaucracies_disabled: "Disabled"
 setting_nd_bureaucracies_disabled_desc: "Formables do not gain bureaucracy authority on formation. The [bureaucracies|e] system remains entirely vanilla."
