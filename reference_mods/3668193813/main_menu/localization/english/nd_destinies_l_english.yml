l_english:

 # Game Rule
 rule_nd_destinies_rule: "National Destinies Destiny Trees"
 setting_nd_destinies_enabled: "Enabled"
 setting_nd_destinies_enabled_desc: "Every formable country gains a branching post-formation destiny tree (root advance plus two paths of three stages each) delivered through the [advances|e] system, with [dynamic_historical_event|e] popups and capstone buildings tied to specific advances."
 setting_nd_destinies_disabled: "Disabled"
 setting_nd_destinies_disabled_desc: "Destiny advances do not appear after forming. Formation events and timed modifiers still play; heritage advance trees, bureaucracies, and custom units/buildings/levies remain enabled."
