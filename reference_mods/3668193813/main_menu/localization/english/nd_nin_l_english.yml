l_english:

# === Static Modifiers ===
 STATIC_MODIFIER_NAME_nd_nin_sargonid_imperium: "Sargonid Imperium"
 STATIC_MODIFIER_DESC_nd_nin_sargonid_imperium: "The warrior-emperor template of Tiglath-Pileser, Sargon, and Esarhaddon restored. The kisir sharruti standing army campaigns annually; the qurubuti royal guard escorts the throne; the siege apparatus that broke Lachish and Memphis turns now upon the empire's frontiers. The doctrine is total: no enemy beyond reach, no winter ends a campaign, no rival mountain people lies safely Sapan Mati."
 STATIC_MODIFIER_NAME_nd_nin_pax_assyriaca: "Pax Assyriaca"
 STATIC_MODIFIER_DESC_nd_nin_pax_assyriaca: "The administrative-imperial template, the seventy provinces of Esarhaddon brought back to life. Aramaic chanceries replicate from the imperial capital to every provincial seat; the tab-rabuti corps of resettlement administrators move populations across the empire to break local resistance and remake regional loyalties; the Sargonid roads and pony-express posts knit together a continent. The empire does not merely conquer; it integrates."
 STATIC_MODIFIER_NAME_nd_nin_civilizational_synthesis: "The Cross and the Lamassu"
 STATIC_MODIFIER_DESC_nd_nin_civilizational_synthesis: "Patriarch and emperor crowned at the same Akitu altar. Lamassu cherubim flank the cathedral apse; the Library of Ashurbanipal sits beside the patriarchal scriptorium; ancient stelae inscribed in cuneiform, Aramaic, and Greek stand in the imperial gardens. The empire is not merely heir to Aššur or to Antioch but to both at once, a civilizational pole between Latin west and Persian east."

 STATIC_MODIFIER_NAME_nd_nin_aramaic_chancery_modifier: "The Aramaic Civil Service"
 STATIC_MODIFIER_DESC_nd_nin_aramaic_chancery_modifier: "Imperial correspondence, fiscal accounts, and judicial rolls all in Aramaic letters. The administrative spine of the Sargonid empire restored at imperial scale."
 STATIC_MODIFIER_NAME_nd_nin_library_restored_modifier: "The Library of Ashurbanipal"
 STATIC_MODIFIER_DESC_nd_nin_library_restored_modifier: "The largest systematic library since Alexandria, refounded at the imperial capital. Catalogue and class-catalogue, scribal series and tablet-shape conventions, all the Sargonid scholarly apparatus preserved."
 STATIC_MODIFIER_NAME_nd_nin_nile_campaign: "The Nile Campaign"
 STATIC_MODIFIER_DESC_nd_nin_nile_campaign: "The empire presses its claim to the Nile, in the manner of Esarhaddon at Memphis and Ashurbanipal at Thebes. Direct provincial rule over Egypt, garrisoned at Tanis and Memphis, paid for in Nubian gold."
 STATIC_MODIFIER_NAME_nd_nin_tributary_settlement: "The Tributary Settlement"
 STATIC_MODIFIER_DESC_nd_nin_tributary_settlement: "The wiser Sargonid lesson: collect tribute, install client kings, and march home before the empire overextends. The empire's reach is preserved without the cost of permanent garrison."
 STATIC_MODIFIER_NAME_nd_nin_lamassu_gates: "The Lamassu Gates"
 STATIC_MODIFIER_DESC_nd_nin_lamassu_gates: "Colossal bull-bodied cherubim stand at the imperial gates. Patriarchal homilies identify them with the cherubim of Genesis; the empire's stonemasons identify them with their Sargonid ancestors."
 STATIC_MODIFIER_NAME_nd_nin_akitu_imperial: "Akitu of the Crown"
 STATIC_MODIFIER_DESC_nd_nin_akitu_imperial: "The Akitu festival celebrated as imperial coronation rite. The emperor renews the divine mandate; the senior governors swear their annual oaths; the empire's continuity is reaffirmed."
 STATIC_MODIFIER_NAME_nd_nin_akitu_patriarchal: "Akitu of the Patriarch"
 STATIC_MODIFIER_DESC_nd_nin_akitu_patriarchal: "The Akitu festival celebrated as patriarchal blessing. The Catholicos consecrates the year, the emperor receives communion, and the lamassu cherubim flanking the altar witness the renewed covenant."

# === Formation Event ===
 nd_nin.1.t: "The Crowning at Nineveh"
 nd_nin.1.d: "The crown of Aššur is brought from the cathedral treasury to the restored Sargonid hall at Nineveh. The Catholicos of the East stands beside the emperor; the Maphrian-General waits at the door; the abbots of Mor Gabriel and Deir al-Zafaran have come down from Tur Abdin; the senior Aramaic scribes of the imperial chancery hold the new annal-stele blank. The world has not seen a power claim the imperial inheritance of Esarhaddon and Ashurbanipal in two thousand years.\n\nThree founding doctrines wait upon the new empire. The first is the warrior-emperor template of the Sargonids: the kisir sharruti standing army, the systematic siege doctrine, the empire of annual campaigns. The second is the administrative-imperial template: the seventy provinces, the Aramaic civil service, the integration administration that bound Babylon and Memphis under one crown. The third is the civilizational synthesis: ancient stelae and the Christian cross standing together, the Patriarch crowning the emperor at the Akitu festival, the empire as the lasting pole between Latin west and Persian east.\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_nin.1.a: "We are heirs to Sargon. The kisir marches."
 nd_nin.1.b: "Aramaic shall be the tongue of empire. Build the chanceries."
 nd_nin.1.c: "The Patriarch crowns the emperor. Cross and Lamassu together."

# === Advance DHE Events ===
 nd_nin.2.t: "The Aramaic Civil Service"
 nd_nin.2.d: "The imperial chancery is opened at the capital, and from this day all imperial correspondence, fiscal accounts, judicial rolls, and provincial directives are drafted in Aramaic letters. The Sargonids' great administrative innovation, the elevation of a non-imperial language to imperial use, is restored at scale. The empire's Aramaic-speaking peasants and burghers, from the Hakkari highlands to the Nile delta, can read the emperor's edicts in their own tongue. No empire of antiquity, save the Achaemenid Persians who borrowed the practice, governed in such a language."
 nd_nin.2.a: "Let the empire write in Aramaic."

 nd_nin.3.t: "The Library Restored"
 nd_nin.3.d: "The Library of Ashurbanipal is reconstituted at the imperial capital. The Patriarchate's translators come down from the Bar Hebraeus library at Mosul; the surviving cuneiform copyists from the Sasanian academies are summoned; the Greek and Arabic catalogues of the Patriarchate's scholastic schools are transcribed and indexed. Tablets are sorted by shape and content per the Sargonid convention: square for finance, round for agriculture, organized under the heads of History, Law, Science, Magic, Dogma, and Legend. The first systematic library since Alexandria, returned to its founding city."
 nd_nin.3.a: "The catalogue is opened. The empire reads again."

 nd_nin.4.t: "The Egyptian Question"
 nd_nin.4.d: "The empire stands at Damascus and surveys the Nile. Esarhaddon took Memphis in 671 BC and ruled it directly; Ashurbanipal sacked Thebes in 663 BC and pulled back to tribute. The same choice now presents itself. Direct provincial rule over Egypt is the Sargonid maximum, the empire stretched from the Hakkari to the Nubian border. Tributary settlement is the wiser Sargonid retreat, preserving reach without the cost of permanent garrison.\n\nThe imperial council is divided. The Maphrian-General favors the campaign; the chancery favors the tributary arrangement; the Patriarch warns against the long supply line."
 nd_nin.4.a: "Press the campaign. Memphis is ours."
 nd_nin.4.b: "Take the tribute. Garrison Damascus, not Thebes."

 nd_nin.5.t: "The Lamassu Gate"
 nd_nin.5.d: "The first new Lamassu gate in two thousand five hundred years rises at the imperial capital. Stonemasons from the Patriarchate's cathedral schools have worked beside the survivors of the old Akkadian carving traditions, recovered from the village shrines of Tur Abdin and the Hakkari foothills. The bull-bodied, human-headed guardian, identified by patriarchal homilies with the cherubim of Genesis, looms over the imperial gate. Visiting embassies from the Crusader successor states, the Mamluk sultanates, and the Persian khanates pass beneath them and remember that the empire is heir to a power older than their own."
 nd_nin.5.a: "Let the cherubim guard the empire."

 nd_nin.6.t: "The Akitu of the New Age"
 nd_nin.6.d: "The Akitu festival, the Babylonian-Assyrian new-year rite where the king's mandate was renewed before the assembled gods, is reconvened at the imperial capital after three millennia. The Catholicos crowns the emperor; the Maphrian-General consecrates the imperial sword; the lamassu cherubim flank the altar; the empire's senior governors swear their annual oaths.\n\nThe rite carries weight in two registers. As an imperial coronation, it asserts the crown's divine mandate. As a patriarchal blessing, it asserts the Church of the East's senior place at the imperial court. The chancery wishes one emphasis; the patriarchate wishes another."
 nd_nin.6.a: "The Akitu is the empire's day. The crown leads."
 nd_nin.6.b: "The Akitu is the patriarch's blessing. The church leads."

 nd_nin.7.t: "The Bull of Heaven"
 nd_nin.7.d: "The empire is formed. The crown of Aššur sits upon the emperor's head; the Aramaic chancery has begun its first set of provincial rolls; the abbots of Tur Abdin have descended to swear fealty; the Lamassu gates are planned for Nineveh, Mosul, and Baghdad. The path now is empire-building. The Bull of Heaven walks the earth again, and the world will measure itself against this restoration."
 nd_nin.7.a: "Let the empire fulfill its destiny."

# === Advance Display Names ===
 nd_nin_kisir_sharruti: "Kisir Sharruti"
 nd_nin_kisir_sharruti_desc: "The Sargonid standing army restored. Tiglath-Pileser III's 745 BC reform, the world's first paid year-round professional corps, refounded as the empire's military backbone."
 nd_nin_qurubuti: "Qurubuti Royal Guard"
 nd_nin_qurubuti_desc: "The empire's heavy mounted bodyguard, oath-bound at the Akitu festival, drawn from the noble houses of the patriarchal court. The closest of the close to the imperial throne."
 nd_nin_sapan_mati: "Sapan Mati Doctrine"
 nd_nin_sapan_mati_desc: "The Land of the Mountains frontier doctrine. Sargonid armies operated systematically beyond the imperial heartland into Urartu, the Zagros, and the Taurus; no enemy lay safely beyond reach."
 nd_nin_lamassu_monumentalism: "Lamassu Monumentalism"
 nd_nin_lamassu_monumentalism_desc: "Colossal bull-bodied human-headed gate guardians, identified by patriarchal homilies with the cherubim of Genesis, raised at every imperial residence. Sargonid monumental practice in Christian dress."
 nd_nin_tab_rabuti: "Tab-rabuti"
 nd_nin_tab_rabuti_desc: "The great resettlement administrators of the Sargonids. Conquered populations transferred and integrated, regional resistances broken by deliberate dispersal. The administrative instrument that bound the empire."
 nd_nin_imperial_siege_doctrine: "Imperial Siege Doctrine"
 nd_nin_imperial_siege_doctrine_desc: "The Sargonid siege apparatus, the most sophisticated of antiquity. Battering rams, mobile siege towers, undermining corps, ramp engineers, the world's first systematic siege school."
 nd_nin_aramaic_chancery: "Aramaic Imperial Chancery"
 nd_nin_aramaic_chancery_desc: "The Sargonid administrative innovation scaled to empire. Aramaic, the lingua franca of the Patriarchate, becomes the imperial civil service language."
 nd_nin_imperial_riverine_fleet: "Imperial Riverine Fleet"
 nd_nin_imperial_riverine_fleet_desc: "Sennacherib's military canals and Tigris-Euphrates fleet refounded. The Mosul-Basra corridor as combined military-and-commercial waterway."
 nd_nin_akitu_coronation: "Akitu Coronation"
 nd_nin_akitu_coronation_desc: "The Mesopotamian new-year festival refounded as Christian imperial coronation rite. The Patriarch crowns the emperor; the senior governors swear their annual oaths; the divine mandate is renewed."
 nd_nin_sargonid_provinces: "Sargonid Provincial System"
 nd_nin_sargonid_provinces_desc: "The seventy-province administrative template of Esarhaddon. Each province ruled by a sakin temi answering to the imperial chancery, with garrison, fiscal, and religious accounts kept in parallel."
 nd_nin_imperial_standing_army: "Imperial Standing Army"
 nd_nin_imperial_standing_army_desc: "The kisir sharruti scaled to empire. Every province furnishes a fixed quota of standing infantry; the core is paid year-round; the empire's professionalization matches the Sargonid model at imperial scale."
 nd_nin_library_restored: "Library of Ashurbanipal"
 nd_nin_library_restored_desc: "The greatest systematic library of antiquity refounded at the imperial capital. Sargonid catalog conventions and the Patriarchate's translator-corps fuse into a unified imperial archive."
 nd_nin_levantine_administration: "Levantine Administration"
 nd_nin_levantine_administration_desc: "The Sargonid template for the eastern Mediterranean: provincial governors at the great cities, vassal arrangements for the coastal trading kingdoms, tribute-and-garrison infrastructure across the Levant."
 nd_nin_annal_stelae: "Annal Stelae"
 nd_nin_annal_stelae_desc: "The Sargonid royal annal-stelae raised at the empire's borders to record campaigns, treaties, and tributary submissions. A formal diplomatic-and-prestige instrument refounded by the empire."
 nd_nin_imperial_khorsabad: "Imperial Khorsabad"
 nd_nin_imperial_khorsabad_desc: "The Dur-Sharrukin model: a planned imperial capital quarter with palace, temple, fortifications, and granaries laid out as a single project. The empire commissions one at the imperial seat."
 nd_nin_egyptian_province: "The Egyptian Province"
 nd_nin_egyptian_province_desc: "Esarhaddon's Memphis (671 BC), Ashurbanipal's Thebes (663 BC). The Sargonid integration of the Nile into the imperial system, restored as imperial doctrine: Egypt as province, garrisoned and taxed."
 nd_nin_imperial_tribute: "Imperial Tribute System"
 nd_nin_imperial_tribute_desc: "The Sargonid administration of vassal kings: annual tribute, fixed quotas, garrisoned overseers, the threat of provincialization for breaches. The empire's formal subject-management apparatus."
 nd_nin_royal_officer_corps: "Royal Officer Corps"
 nd_nin_royal_officer_corps_desc: "The empire's professional officers, trained at the imperial palace school. The medieval-era empire fuses the Sargonid eunuch-bureaucrat tradition with the cathedral school curriculum of Mosul and Baghdad."
 nd_nin_scribal_schools: "Scribal Schools"
 nd_nin_scribal_schools_desc: "The empire's network of palace and provincial scribal schools, descended from the Sargonid scribal academies and fused with the Patriarchate's cathedral schools. Aramaic, Greek, Latin, Persian, and the cuneiform corpus all taught."
 nd_nin_imperial_absolutism: "Imperial Absolutism"
 nd_nin_imperial_absolutism_desc: "The Sargonid concept of total imperial authority absorbed into the empire's absolutist constitution. The emperor as the unique earthly representative of divine order, with the Catholicos as chief consecrating prelate."
 nd_nin_lamassu_quarter: "Lamassu Royal Quarter"
 nd_nin_lamassu_quarter_desc: "The imperial palace quarter rebuilt at the Sargonid template: lamassu-gated, ziggurat-cathedraled, a continuous palace city stretching from the patriarchal seat to the imperial barracks."
 nd_nin_imperial_aramaic: "Imperial Aramaic"
 nd_nin_imperial_aramaic_desc: "The codification of Aramaic as the formal administrative language of the entire empire. The chancery, the courts, the imperial correspondence, the tax rolls, all in Aramaic letters."
 nd_nin_imperial_levies: "Imperial Levies"
 nd_nin_imperial_levies_desc: "The empire's standing levies drawn from every integrated province, descendants of the Sargonid corps of deportees and provincial conscripts. The empire's manpower base expands to imperial scale."
 nd_nin_annexation_doctrine: "Annexation Doctrine"
 nd_nin_annexation_doctrine_desc: "The Sargonid doctrine of escalation: tributary, then vassal, then province. The empire applies this consistently and absorbs subjects into direct rule on a fixed timeline."
 nd_nin_imperial_industry: "Imperial Industrial Base"
 nd_nin_imperial_industry_desc: "The empire's late-era industrial complex, built atop Sargonid riverine logistics, patriarchal scriptoria, and Mosul foundries. An industrial Mesopotamia centered on the imperial capital."
 nd_nin_lamassu_academy: "Lamassu Academy"
 nd_nin_lamassu_academy_desc: "The imperial military-and-administrative academy, named for the bull-cherubim guardians at its gates. General staff, civil service cadets, and senior clergy share an Aramaic-and-Greek curriculum."
 nd_nin_imperial_constitution: "Imperial Constitution"
 nd_nin_imperial_constitution_desc: "The late empire's formal constitutional settlement: crown, patriarch, senate of provincial governors, and Aramaic civil service codified into a single document modeled on the Sargonid royal annals."
 nd_nin_pan_aramaic_press: "Pan-Aramaic Press"
 nd_nin_pan_aramaic_press_desc: "The imperial press, descended from the Patriarchate's Aramaic-script printing house. Newspapers, official gazettes, and educational textbooks distributed across every imperial province."
 nd_nin_destiny: "Imperial Destiny"
 nd_nin_destiny_desc: "The Bull of Heaven walks the earth. The empire is formed; the path of imperial fulfillment lies open."

# === Building Display Names ===
 nd_nin_lamassu_gate: "Lamassu Gate"
 nd_nin_lamassu_gate_desc: "Colossal bull-bodied human-headed gate guardians at the imperial gates. The Sargonid monumental tradition restored, identified with the cherubim of Christian iconography."
 nd_nin_aramaic_chancery_building: "Imperial Chancery"
 nd_nin_aramaic_chancery_building_desc: "The empire's civil service headquarters, operating in Aramaic per Sargonid template. Provincial fiscal, judicial, and ecclesiastical accounts converge here."
 nd_nin_riverine_naval_yard: "Riverine Naval Yard"
 nd_nin_riverine_naval_yard_desc: "The Tigris-Euphrates fleet anchorage. Sennacherib's military canal infrastructure restored as a combined military and commercial waterway."
 nd_nin_akitu_square: "Akitu Festival Square"
 nd_nin_akitu_square_desc: "The great open square at the imperial capital where the Akitu new-year coronation rite is celebrated. The Patriarch crowns the emperor; the lamassu cherubim flank the altar."
 nd_nin_kisir_barracks: "Kisir Sharruti Barracks"
 nd_nin_kisir_barracks_desc: "The standing-army barracks of the imperial kisir, the year-round professional infantry the Sargonids pioneered."
 nd_nin_library_of_ashurbanipal: "Library of Ashurbanipal"
 nd_nin_library_of_ashurbanipal_desc: "The largest systematic library since Alexandria, refounded at the imperial capital. Sargonid catalog conventions, patriarchal translation corps, and the surviving cuneiform corpus all under one roof."
 nd_nin_annal_stele: "Annal Stele"
 nd_nin_annal_stele_desc: "A monumental inscribed stele recording campaigns, treaties, or tributary submissions. Sargonid royal annal practice as a formal diplomatic-and-prestige instrument."
 nd_nin_imperial_palace: "Imperial Palace at Khorsabad"
 nd_nin_imperial_palace_desc: "A planned imperial capital quarter on the Khorsabad / Dur-Sharrukin model. Palace, temple, fortifications, and granaries laid out together as a single imperial commission."
 nd_nin_scribal_school: "Scribal School"
 nd_nin_scribal_school_desc: "An imperial scribal academy fusing Sargonid and patriarchal traditions. Aramaic, Greek, Latin, and Persian instruction; the Sargonid cuneiform corpus preserved for advanced study."
 nd_nin_imperial_quarter: "Imperial Quarter"
 nd_nin_imperial_quarter_desc: "The late absolutist palace quarter at the imperial capital. Lamassu-gated, ziggurat-cathedraled, a continuous palace city from patriarchal seat to imperial barracks."
 nd_nin_imperial_arsenal: "Imperial Arsenal"
 nd_nin_imperial_arsenal_desc: "The late-era industrial armaments complex of the empire. Cannons, firearms, and steel for the imperial corps, drawing on the Mosul foundries and the riverine workshops."

# === Production Method Loc ===
 nd_nin_lamassu_gate_upkeep: "Lamassu Gate Upkeep"
 nd_nin_lamassu_gate_upkeep_desc: "Stone, masonry, and ritual goods to maintain the cherubic guardians and their flanking shrines."
 nd_nin_chancery_upkeep: "Chancery Operations"
 nd_nin_chancery_upkeep_desc: "Paper, ink-wax, books, and incense for the daily work of the imperial Aramaic civil service."
 nd_nin_naval_yard_upkeep: "Naval Yard Operations"
 nd_nin_naval_yard_upkeep_desc: "Lumber, tar, naval supplies, and tools for maintaining the imperial riverine fleet."
 nd_nin_akitu_upkeep: "Akitu Festival Upkeep"
 nd_nin_akitu_upkeep_desc: "Incense, beeswax, paper, and wine for the empire's coronation rite and its annual recurrences."
 nd_nin_kisir_upkeep: "Kisir Standing Army Upkeep"
 nd_nin_kisir_upkeep_desc: "Weaponry, cloth, horses, and grain to sustain the year-round professional corps."
 nd_nin_library_upkeep: "Library Operations"
 nd_nin_library_upkeep_desc: "Paper, books, beeswax, and incense for the work of the imperial archive."
 nd_nin_annal_stele_upkeep: "Stele Maintenance"
 nd_nin_annal_stele_upkeep_desc: "Stone, masonry, and ritual wax for maintaining the empire's monumental inscriptions."
 nd_nin_palace_upkeep: "Palace Operations"
 nd_nin_palace_upkeep_desc: "Stone, masonry, fine cloth, and incense for the imperial residence and its court."
 nd_nin_scribal_upkeep: "Scribal School Operations"
 nd_nin_scribal_upkeep_desc: "Paper, books, beeswax, and incense for the imperial scribal curriculum."
 nd_nin_imperial_quarter_upkeep: "Imperial Quarter Operations"
 nd_nin_imperial_quarter_upkeep_desc: "Stone, masonry, fine cloth, and weaponry for the absolutist palace city."
 nd_nin_arsenal_pm: "Imperial Arsenal Production"
 nd_nin_arsenal_pm_desc: "Iron, coal, and tools forged into weaponry for the imperial corps."

# === Unit Display Names ===
 a_nd_nin_kisir_sharruti: "Kisir Sharruti"
 a_nd_nin_kisir_sharruti_desc: "The empire's professional standing infantry, the world's first paid year-round corps. Sargonid template restored under the Patriarchate's banner."
 a_nd_nin_qurubuti: "Qurubuti"
 a_nd_nin_qurubuti_desc: "The royal guard cavalry of the empire. Heavy mounted bodyguard, oath-bound at the Akitu festival, drawn from the noble houses of the patriarchal court."
 a_nd_nin_siege_corps: "Imperial Siege Corps"
 a_nd_nin_siege_corps_desc: "The Sargonid siege apparatus restored at scale. Battering rams, mobile siege towers, undermining corps, and ramp engineers in a coordinated formation."
 a_nd_nin_aramean_auxiliary: "Aramean Auxiliary"
 a_nd_nin_aramean_auxiliary_desc: "Levy infantry from the Aramaic-speaking countryside of the empire. The descendants of the Sargonid corps of deportees, made into a standing auxiliary class."

# === Levy Display Names ===
 levy_nd_nin_aramean_auxiliary: "Aramean Auxiliary Levy"
 levy_nd_nin_aramean_auxiliary_desc: "Levy infantry raised from the empire's Aramaic-speaking peasant and soldier pops in Mesopotamia and the Levant."

# === Variable Tooltip Keys ===
 nd_nin_formed_tt: "The Assyrian Empire is formed."
 nd_nin_path_a_tt: "Founding doctrine: Sargonid Imperium."
 nd_nin_path_b_tt: "Founding doctrine: Pax Assyriaca."
 nd_nin_path_c_tt: "Founding doctrine: Cross and Lamassu."

# === Destiny Tree ===
 nd_nin_dest_kalhu_doctrine: "Kalḫu Doctrine"
 nd_nin_dest_kalhu_doctrine_desc: "Codify the universal-empire campaign practice at Tiglath-Pileser III's palace city of Kalḫu. Take Anatolia: Konya, Kayseri, and Ankara come under the imperial banner. The Sargonid westward doctrine extended to its Achaemenid limit."
 nd_nin_dest_zagros_throne: "The Zagros Throne"
 nd_nin_dest_zagros_throne_desc: "Cross the Zagros mountains and claim the Iranian plateau. Hamadan, the old Median Ecbatana, and Istakhr, the medieval heir of Persepolis, must be brought under direct imperial rule. The empire reaches further east than any Sargonid managed."
 nd_nin_dest_universal_empire: "Šar Kibrāt Erbetti"
 nd_nin_dest_universal_empire_desc: "The Sargonid title 'King of the Four Quarters' fulfilled at last. Reach Smyrna at the Lydian frontier, Samarkand at the Sogdian, Peshawar at the Gandharan. The Achaemenid maximum reclaimed under the Sargonid crown. Capstone: Bīt-Mātāti, the Hall of the Lands."
 nd_nin_dest_beth_hekma_imperial: "Beth Hekma at Empire Scale"
 nd_nin_dest_beth_hekma_imperial_desc: "Scale the Patriarchate's House of Wisdom to imperial reach. Embrace the institution of banking; have the silk corridor reach the imperial capital. The Aramaic civil service's accountancy makes banking intelligible to every imperial market."
 nd_nin_dest_aramaic_lingua_franca: "Aramaic as Lingua Franca"
 nd_nin_dest_aramaic_lingua_franca_desc: "Make Aramaic the standard correspondence language of the Old World market. Embrace global trade, accumulate imperial reserves, and grow the empire to the scale where its letters arrive in every distant court already legible."
 nd_nin_dest_imperial_silk_corridor: "The Imperial Silk Corridor"
 nd_nin_dest_imperial_silk_corridor_desc: "Restore Sennacherib's canal network and join it to the qanat works and caravanserai roads of the Old World. Embrace the scientific revolution; reach the Catholicate's old metropolitanate at Bukhara; secure the silk corridor in any imperial market. Capstone: the Imperial Canal of Sennacherib."

# === Destiny Event Loc ===
 nd_nin.8.t: "The Anatolian Frontier"
 nd_nin.8.d: "The kisir crosses the Cilician Gates and the great central plateau opens before the empire. Konya falls; Kayseri capitulates; Ankara accepts the Patriarchate's metropolitan and the imperial governor in turn. The Sargonid westward doctrine, last carried by Sargon II to the Halys two thousand five hundred years ago, has reached further than its founder ever managed.\n\nThe imperial chancery raises the new annal-stelae at the western frontier. The empire now stands at the gate of the old Achaemenid west."
 nd_nin.8.a: "The kisir holds the Anatolian throne."

 nd_nin.9.t: "The Iranian Crossing"
 nd_nin.9.d: "Hamadan falls. The Median throne-city, the Achaemenid Ecbatana, the summer capital of the Persian Great Kings, comes under the imperial governor. Istakhr, the medieval Persian heir of Persepolis, follows. The empire stands at the heart of the old Achaemenid throne-country.\n\nThe imperial council is divided. The Maphrian-General argues for a hard eastward push: the kisir is in the field, the campaign is paid for, the moment is unrepeatable. The chancery argues for absorption: the Iranian provinces must be staffed, taxed, and integrated, or they will rebel within a generation."
 nd_nin.9.a: "Press the campaign east. The kisir takes the field."
 nd_nin.9.b: "Consolidate. Integrate the Iranian throne."

 nd_nin.10.t: "The Four Quarters"
 nd_nin.10.d: "Smyrna at the Lydian frontier. Samarkand on the Sogdian highlands. Peshawar at the Gandharan gate. The Sargonid title šar kibrāt erbetti, King of the Four Quarters, claimed by Sargon II two and a half millennia ago, is fulfilled at last by the medieval-imperial heir of his throne. The empire's reach exceeds every Sargonid maximum and matches the Achaemenid peak.\n\nThe annal-stele blank carries the new inscription, and the imperial council debates the next move. Push further from every frontier? Or garrison the lines and let the empire's mass settle?"
 nd_nin.10.a: "World-emperor. From every frontier, push outward."
 nd_nin.10.b: "Garrison the lines. The empire holds what it has taken."

 nd_nin.11.t: "The Beth Hekma Refounded"
 nd_nin.11.d: "The Patriarchate's House of Wisdom, the translation institute of Bar Hebraeus, the medical tradition of Jundishapur scaled at last to empire. Every provincial seat now houses a Beth Hekma annex: scribes, translators, accountants, physicians, all drawing on the same Aramaic-Greek-Persian curriculum.\n\nThe accountancy of the Aramaic civil service has made the banking institutions of the Latin Mediterranean intelligible to the imperial markets. The Cross-and-Lamassu doctrine begins to bear its civilizational fruit."
 nd_nin.11.a: "Open the chancery doors. The empire reads."

 nd_nin.12.t: "The Aramaic Synod"
 nd_nin.12.d: "The empire's chanceries declare Aramaic the standard correspondence language for the Old World market. The Catholicos convenes a great synod at the imperial capital to coordinate the Church of the East's metropolitanates: from the Iberian counts of the Latin Mediterranean to the Khazar successor courts to the Tang-heir capitals of the eastern silk road.\n\nTwo emphases compete for the synod's outcome. The chancery's view: scale the imperial translators, build a Beth Hekma at every provincial seat. The patriarchate's view: keep the synod's coordination paramount, let the metropolitanates govern by collegial agreement."
 nd_nin.12.a: "Imperial translators. Beth Hekma at every seat."
 nd_nin.12.b: "The synod sits. Patriarchate and chancery in concert."

 nd_nin.13.t: "The Sennacherib Canal Restored"
 nd_nin.13.d: "Sennacherib's great riverine works at the Tigris are restored at imperial scale. The empire's engineers join the Mosul-Basra navigation to the qanat networks of the Iranian plateau, the caravanserai roads across the Levant, and the monastic way-stations of the Catholicate from the Iberian coast to Bukhara. The Old World's economic spine is rebuilt under Aramaic-imperial supervision.\n\nThe imperial council decides the corridor's emphasis. Open it as a trade corridor, with the empire's customs at every great waystation? Or build it as an internal infrastructure, with the imperial domain knit closer through the canal network?"
 nd_nin.13.a: "Open the corridor. Trade flows east and west."
 nd_nin.13.b: "Build the canals. The riverine empire is whole."

# === Destiny Static Modifier Loc ===
 STATIC_MODIFIER_NAME_nd_nin_dest_zagros_advance: "The Zagros Advance"
 STATIC_MODIFIER_DESC_nd_nin_dest_zagros_advance: "The kisir presses east through the Iranian plateau. Annual Zagros campaigns, plunder caravans returning to the imperial capital, the empire's traditional army doctrine carried to its operational maximum."
 STATIC_MODIFIER_NAME_nd_nin_dest_zagros_consolidation: "The Zagros Consolidation"
 STATIC_MODIFIER_DESC_nd_nin_dest_zagros_consolidation: "The Iranian provinces are integrated rather than raided. The Median and Persian noble houses are co-opted into the imperial levy system; the resettlement administrators move populations from the heartland to garrison the new throne-cities."
 STATIC_MODIFIER_NAME_nd_nin_dest_world_emperor: "Šar Kibrāt Erbetti"
 STATIC_MODIFIER_DESC_nd_nin_dest_world_emperor: "King of the Four Quarters. The empire pushes outward from every frontier: the Lydian coast, the Sogdian uplands, the Gandharan gate, the Nubian river. The reach exceeds the Sargonid maximum and the Achaemenid peak. The strain on imperial cohesion is permanent."
 STATIC_MODIFIER_NAME_nd_nin_dest_consolidation_throne: "The Imperial Garrison"
 STATIC_MODIFIER_DESC_nd_nin_dest_consolidation_throne: "The empire holds what it has taken. Frontier forts along the Cilician Gates, the Zagros passes, the Sogdian highlands, and the Indus crossings are manned year-round. The kisir consolidates rather than expands; the levies sharpen behind the walls."
 STATIC_MODIFIER_NAME_nd_nin_dest_imperial_translators: "The Imperial Translators"
 STATIC_MODIFIER_DESC_nd_nin_dest_imperial_translators: "The Patriarchate's translation corps scaled to empire. Every provincial seat houses a Beth Hekma annex; every chancery clerk reads Aramaic, Greek, Persian, and Latin. The empire's banking houses underwrite the imperial loan market on the strength of the chanceries' accountancy."
 STATIC_MODIFIER_NAME_nd_nin_dest_aramaic_synod: "The Aramaic Synod"
 STATIC_MODIFIER_DESC_nd_nin_dest_aramaic_synod: "The Catholicos's great synod sits at the imperial capital, coordinating the Church of the East's metropolitanates from the Latin coast to the Sogdian highlands. The provincial governors and the metropolitans share the imperial road system; the empire's reach into the countryside deepens."
 STATIC_MODIFIER_NAME_nd_nin_dest_silk_corridor_open: "The Silk Corridor"
 STATIC_MODIFIER_DESC_nd_nin_dest_silk_corridor_open: "The Imperial Canal of Sennacherib joined to the qanat works of Iran and the caravanserai roads of the Levant. The empire's customs at every waystation; silk caravans from Bukhara to Iberia paying imperial tolls. The luxury imports unsettle the imperial heartland's traditional disciplines."
 STATIC_MODIFIER_NAME_nd_nin_dest_canals_built: "The Riverine Empire"
 STATIC_MODIFIER_DESC_nd_nin_dest_canals_built: "The canals run from the Tigris source to the Persian Gulf. The empire's interior is knit by waterway and qanat; the chanceries integrate provincial estates onto the imperial rolls at unprecedented speed. The Sennacherib doctrine made literal at imperial scale."

# === Destiny Building Loc ===
 nd_nin_bit_matati: "Bīt-Mātāti"
 nd_nin_bit_matati_desc: "The Hall of the Lands. The Sargonid throne hall rebuilt for an empire of universal reach: cuneiform tribute lists from the four quarters, lamassu colossi from every conquered region, the great map of the Achaemenid maximum carved into the floor. Sargon II's title made literal."
 nd_nin_sennacherib_canal: "Imperial Canal of Sennacherib"
 nd_nin_sennacherib_canal_desc: "The great riverine engineering project of Sennacherib (704-681 BC), restored at imperial scale and joined to the qanat works and caravanserai roads of the Old World. The Old World's economic spine rebuilt under Aramaic-imperial supervision."

# === Destiny PM Loc ===
 nd_nin_bit_matati_upkeep: "Hall of the Lands Upkeep"
 nd_nin_bit_matati_upkeep_desc: "Stone, masonry, fine cloth, and ritual armaments for maintaining the empire's universal-throne hall."
 nd_nin_sennacherib_canal_upkeep: "Canal Maintenance"
 nd_nin_sennacherib_canal_upkeep_desc: "Lumber, stone, tar, and tools for keeping the riverine and qanat network operational."

# === BUREAUCRACIES ===
 nd_nin_kisir_sharruti_bureaucracy: "Kiṣir Šarrūti"
 nd_nin_kisir_sharruti_bureaucracy_desc: "Tiglath-Pileser III's mid-8th-century BC reform created the kisir sharruti, the world's first professional standing army: career soldiers paid in silver from the royal treasury, drilled year-round, garrisoned at Kalhu and Nineveh. Sargon II and Sennacherib expanded it into the empire's iron core. Restored under Mosul, it draws conscripts from across the empire and answers to the throne directly, bypassing noble levies."

 nd_nin_tab_rabuti_bureaucracy: "Ṭāb-Rabûti Bureau"
 nd_nin_tab_rabuti_bureaucracy_desc: "The Neo-Assyrian deportation administrators (literally 'the great ones over') who managed the empire's policy of mass population transfer. Defeated peoples were resettled across the empire, their elites integrated into imperial service, their lands repopulated with new subjects. Sargon II's Israelite deportations of 722 BC and the later Babylonian and Egyptian transfers worked through this corps. At imperial scale it dissolves regional resistance through forced relocation, but at appalling cost to rural pops."

 nd_nin_saknu_temi_bureaucracy: "Šaknu Ṭēmi Provinces"
 nd_nin_saknu_temi_bureaucracy_desc: "Sargon II's late-8th-century BC reorganization divided the empire into roughly seventy provinces, each under a saknu temi (provincial governor) reporting directly to the throne. Each province ran three parallel accounts -- fiscal, garrison, and religious -- which cross-checked one another. Restored at imperial scale, this triple-entry apparatus bypasses regional aristocrats with a direct pipeline from Mosul to every district seat."

 nd_nin_aramaic_chancery_bureaucracy: "Imperial Aramaic Chancery"
 nd_nin_aramaic_chancery_bureaucracy_desc: "Tiglath-Pileser III institutionalized Aramaic as the empire's administrative language alongside Akkadian in the 8th century BC. Bilingual scribes handled diplomatic correspondence, tax registers, and provincial dispatches in Aramaic on perishable parchment, while monumental Akkadian remained for stelae and royal inscriptions. The Syriac restoration revives it: a literate clerk class running the empire in a script every merchant from Edessa to Susa can read."

 nd_nin_bit_tuppate_bureaucracy: "Bīt Ṭuppāte Network"
 nd_nin_bit_tuppate_bureaucracy_desc: "The Library of Ashurbanipal at Nineveh (mid-7th century BC) was the capstone of an empire-wide network of bit tuppate ('tablet houses'): scribal schools at every provincial seat, copying Sumerian, Akkadian, and Aramaic texts, training imperial clerks, and maintaining the omen archives that legitimated royal decisions. The Syriac restoration absorbs this into the Patriarchate's scriptorium tradition: every metropolitan see houses a scriptorium annex."

 nd_nin_akitu_liturgy_bureaucracy: "Akītu Imperial Liturgy"
 nd_nin_akitu_liturgy_bureaucracy_desc: "The Akitu festival was the Mesopotamian New Year coronation rite, celebrated annually for over two millennia, in which the king ritually reaffirmed his sovereignty before the assembled gods and vassals. The Syriac restoration refounds it as a Christian imperial liturgy: the patriarch crowns the emperor each Nisan in the Mosul cathedral, the festal procession parades imperial authority through the city, and every metropolitanate is ritually bound to the throne."

# === Bureaucracy Authority Auto-Modifier ===
 AUTO_MODIFIER_NAME_nd_nin_bureaucracy_authority: "Sargonid Bureaucratic Authority"
 AUTO_MODIFIER_DESC_nd_nin_bureaucracy_authority: "On the empire's formation, the restored Sargonid administrative apparatus may host historical bureaucracies. The capital grants one slot; this authority grants two more."
