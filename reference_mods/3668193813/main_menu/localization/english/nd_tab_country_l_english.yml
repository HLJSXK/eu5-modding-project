l_english:
 TAB: "Tabor"
 TAB_ADJ: "Taborite"
 TAB_f: "Tabor Republic"
 TAB_f_desc: "Forge a sovereign Hussite commonwealth from the radical wing of the Hussite Wars: peasant-soldier brotherhood, vernacular chalice church, and the Four Articles of Prague made law. Where Bohemia compromised at Lipany, the Taborites institutionalize their war-wagon militia, married priesthood, and elective communal rule into a permanent state."
