l_english:
 TDR: "Bosporan Kingdom"
 TDR_ADJ: "Bosporan"
 TDR_f: "Bosporan Kingdom"
 TDR_f_desc: "Reforge the lost realm of the Pontic shore: a Greco-Gothic kingdom anchored at Mangup, heir to the Theodorite princes and to the ancient Bosporan dynasts before them. Whether it takes the form of a Romaic Regnum Bospori or a Cimmerian Bosporus of Gothic kings depends on which lineage its court chooses to honour."
