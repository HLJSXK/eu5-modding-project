l_english:
 MAP: "Wallmapu"
 MAP_ADJ: "Mapuche"
 MAP_f: "Wallmapu"
 MAP_f_desc: "Forge the scattered Lof, Rewe, and Aillarewe of the Mapuche people into a single sovereign confederation. From the forests of Ngulumapu to the steppes of Puelmapu, the Reche who turned back the Inca and broke the Spanish at Curalaba now claim a recognized kingdom over the whole land between the cordillera and the sea. The Toki shall lead the federation in war, the Machi shall keep its spirit, and no foreign crown shall set foot south of the Bío-Bío unbidden."
