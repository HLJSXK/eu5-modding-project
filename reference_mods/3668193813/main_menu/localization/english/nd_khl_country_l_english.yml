l_english:
 KHL: "Khilafah"
 KHL_ADJ: "Khilafan"
 KHL_f: "Khilafah"
 KHL_f_desc: "The universal Sunni Khilafah, restored after a millennium of dynastic fragmentation. From al-Andalus to Sindh, from the Atlas to the Indus, one Caliph commands the ummah; Mecca, Medina, Cairo, Damascus, Baghdad, and the seats of the old Umayyad and Abbasid worlds answer to a single throne. This is not the Caliphate of any one dynasty, Umayyad, Abbasid, Fatimid, Almohad, or Ottoman, but the Rashidun ideal made flesh: the universal community of believers under one banner. The black standard of the Prophet flies again over a world united in faith."
