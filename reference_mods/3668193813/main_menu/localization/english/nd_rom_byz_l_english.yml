l_english:
 # ===== FORMATION CHOICE MODIFIERS =====
 STATIC_MODIFIER_NAME_nd_rom_byz_romanitas_vincit: "Romanitas Vincit"
 STATIC_MODIFIER_DESC_nd_rom_byz_romanitas_vincit: "The latinization is complete. The court speaks Latin, the liturgy follows the Roman rite, and the eagle on our standard is the Roman eagle, not the Byzantine. The Greek heritage is the foundation, but the goal is unambiguous: to be Roman in the way Augustus and Constantine were Roman. The Pope blesses the imperial coronation. The West, long lost, returns to imperial communion. The cost is paid by the Greek-rite communities, who watch their familiar liturgy slowly disappear into Latin chant."
 STATIC_MODIFIER_NAME_nd_rom_byz_hellenikos_romaios: "Hellenikos Romaios"
 STATIC_MODIFIER_DESC_nd_rom_byz_hellenikos_romaios: "We will not pretend to be what we are not. The Romans of the East were Greek-speaking, and the Romans of the West are now bilingual. Greek liturgy in Latin churches. Eastern court ceremony in Roman halls. Plethon's heirs lecture beside Latin canonists. The empire is what it actually is: a synthesis. Bessarion was right, and Photius was right. The Pope must accommodate himself to a court that quotes both Cicero and Plato in the original."

 # ===== FORMATION EVENT =====
 nd_rom_byz.1.t: "The Eagle Returns to Rome"
 nd_rom_byz.1.d: "It is done. After centuries of exile, after the long shame of 1204 and the long terror of 1453, the Roman Empire has returned to Rome. The basileus stands in the basilica where Constantine once knelt. The forum is ours. The Tiber is ours. The seven hills, lost since the days of Augustulus, fly the eagle once more.\n\nBut what kind of empire have we become? The vanilla effect of formation is already pulling us westward, toward Latin, toward the rite of Rome, toward the identity of the old empire. Some at court welcome this drift: at last, they say, we can stop pretending to be Greeks. Others, the philosophers and the Mezzogiorno bishops and the surviving generation of the Constantinopolitan refugees, beg us to resist it.\n\nWhich Rome shall this be? The Latin Rome of Augustus, fully restored, the East as a memory? Or the bilingual, bicultural Romaiosyne that we actually are: a synthesis that owes as much to Plethon as to Petrarch?\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_rom_byz.1.a: "Romanitas Vincit. We are Latins now."
 nd_rom_byz.1.b: "Hellenikos Romaios. Greek and Latin together."

 # ===== HERITAGE ADVANCES =====

 # Variable tooltip
 nd_rom_byz_formed_tt: "The Italian Roman Restoration has been formed"
 nd_rom_byz_path_a_tt: "Chose the #bold Romanitas Vincit#! destiny"
 nd_rom_byz_path_b_tt: "Chose the #bold Hellenikos Romaios#! destiny"

 # Age 1
 nd_rom_byz_stratiotai_italici: "Stratiotai Italici"
 nd_rom_byz_stratiotai_italici_desc: "The Eastern thematic system, transplanted to southern Italy and Calabria, gives the empire a class of soldier-farmers it has not been able to recruit since the eleventh century. Albanian and Greek-Calabrian smallholders ride as imperial light cavalry."
 nd_rom_byz_bilingual_chancery: "Bilingual Chancery"
 nd_rom_byz_bilingual_chancery_desc: "Greek and Latin become co-official in the imperial chancery. Logothetes in Constantinople and notaries in Rome work in dual-language documents. The empire's administrative reach is finally consistent across both halves."
 nd_rom_byz_restored_themes: "Restored Themes"
 nd_rom_byz_restored_themes_desc: "The thematic system, the Eastern fusion of military and civil administration, is extended to southern Italy. Generals govern provinces; soldiers farm the land they defend. Levies grow, garrisons strengthen, control deepens."
 nd_rom_byz_filioque_reconciled: "Filioque Reconciled"
 nd_rom_byz_filioque_reconciled_desc: "The great theological wound between Constantinople and Rome closes at last. The councils of Florence and Ferrara are implemented this time, on Roman soil, by an emperor who can enforce them. Heretics are tolerated; conversion accelerates. The Christian commonwealth is whole."

 # Age 2
 nd_rom_byz_plethon_academy: "Plethon's Academy"
 nd_rom_byz_plethon_academy_desc: "Gemistos Plethon and the Greek diaspora bring Neoplatonist philosophy to Italian humanism. The Florentine Platonic Academy, but with the empire as patron. Knowledge flows from Constantinople through Florence to every imperial city."
 nd_rom_byz_mezzogiorno_greeks: "The Mezzogiorno Greeks"
 nd_rom_byz_mezzogiorno_greeks_desc: "Calabrian, Apulian and Sicilian Greek communities, marginalized for centuries under Norman and Angevin rule, become a privileged subject of imperial cultural policy. Their dialect is recognized; their churches are funded; their service is rewarded."
 nd_rom_byz_renaissance_pronoia: "Renaissance Pronoia"
 nd_rom_byz_renaissance_pronoia_desc: "The Eastern grant-for-service system adapts to the Italian condottiere economy. Land in exchange for cavalry, but administered through the latinized Italian feudal apparatus. The result is professional cavalry on Eastern terms in Western institutions."
 nd_rom_byz_bank_vestiarion: "Bank of the Vestiarion"
 nd_rom_byz_bank_vestiarion_desc: "The imperial treasury, the old Byzantine Vestiarion, adopts the double-entry bookkeeping of Florentine houses. Tax administration sharpens; loans become cheaper; the imperial fisc grows."

 # Age 3
 nd_rom_byz_mare_nostrum_renatum: "Mare Nostrum Renatum"
 nd_rom_byz_mare_nostrum_renatum_desc: "The unified imperial galley fleet, combining Italian galley tradition (Venetian, Genoese, Neapolitan) with Byzantine dromon doctrine, rules the Mediterranean as a single sea once more. The age of warring Italian admiralties is over."
 nd_rom_byz_imperial_studia: "Imperial Studia"
 nd_rom_byz_imperial_studia_desc: "The Greek diaspora, now flowing through Italy in its third generation, professionalizes in chartered imperial studia funded by the Vestiarion. Bessarion's library is multiplied tenfold across imperial cities."
 nd_rom_byz_greek_curial_reform: "Greek Curial Reform"
 nd_rom_byz_greek_curial_reform_desc: "The papal curia integrates Greek-rite cardinals and Constantinopolitan canonists. The pope advises the emperor; the emperor confirms the pope. Caesaropapism and papal supremacy uneasily fused into a single working ecclesiology."
 nd_rom_byz_tyrrhenian_spice: "Tyrrhenian Spice Stations"
 nd_rom_byz_tyrrhenian_spice_desc: "Imperial ships break Venetian and Mamluk brokerage by sailing the eastern routes themselves. Crete, Cyprus and Egyptian outposts re-establish direct linkage to the Indian Ocean. Roman markets are once again the world's spice clearinghouse."

 # Age 4
 nd_rom_byz_tridentine_synthesis: "Tridentine Synthesis"
 nd_rom_byz_tridentine_synthesis_desc: "The Council of Trent meets, but with Greek observers and emperor's legates. Reform without schism. Catholic orthodoxy stays unified, sparing Italy and the East the wars of religion that ravaged the rest of Europe."
 nd_rom_byz_imperial_vestiarion: "The Imperial Vestiarion"
 nd_rom_byz_imperial_vestiarion_desc: "The unified imperial treasury operates Italian banking principles at the scale of the Eastern fisc. Genoese and Florentine bankers find positions in the imperial cabinet beside the surviving descendants of the Komnenian logothetes."
 nd_rom_byz_greek_humanism: "Greek Renaissance Humanism"
 nd_rom_byz_greek_humanism_desc: "The Italian humanist tradition, fed by Byzantine emigres for two generations, becomes the official cultural program of the empire. Classical Greek is now a court accomplishment, alongside Latin and the imperial dialect."
 nd_rom_byz_imperial_ceremony: "Imperial Ceremony Restored"
 nd_rom_byz_imperial_ceremony_desc: "The elaborate Byzantine court ritual, with its silk vestments and acclamations and prokypsis, returns to Rome. The Book of Ceremonies becomes the protocol manual of European diplomacy. To stand before the basileus is once again to stand at the center of the world."

 # Age 5
 nd_rom_byz_new_justinianic_code: "The New Justinianic Code"
 nd_rom_byz_new_justinianic_code_desc: "The Corpus Iuris Civilis is updated with two centuries of post-restoration imperial constitutions. The product becomes the standard for civil law across the Mediterranean and Catholic Europe, with Roman jurists once again the arbiters of legal practice."
 nd_rom_byz_galley_schools: "Mediterranean Galley Schools"
 nd_rom_byz_galley_schools_desc: "Naval academies in Naples, Venice (subjugated), Constantinople and Genoa train officers in unified imperial doctrine. Mare Nostrum is patrolled as one fleet under one command, no longer a patchwork of city-state admiralties."
 nd_rom_byz_imperial_dragomanate: "Imperial Dragomanate"
 nd_rom_byz_imperial_dragomanate_desc: "The chief dragoman's office expands into a full imperial diplomatic corps. Greek and Italian polyglots, trained in Latin, Greek, Arabic and the Italic vernaculars, staff legations to every court in Europe and the Levant."
 nd_rom_byz_roman_greek_identity: "Roman-Greek Identity"
 nd_rom_byz_roman_greek_identity_desc: "After two centuries of fusion, 'Roman' no longer distinguishes Latin from Greek. A unified imperial subject identity binds the territories of two former empires under one civic conception."

 # Age 6
 nd_rom_byz_imperial_enlightenment: "Imperial Enlightenment"
 nd_rom_byz_imperial_enlightenment_desc: "The Greek-Italian humanist tradition, the Vestiarion's wealth and the Phanariote network combine into a particular Roman Enlightenment. Vico, Beccaria, but with imperial patronage and a Greek philosophical inheritance the rest of Europe lacks."
 nd_rom_byz_modern_navy: "Modern Imperial Navy"
 nd_rom_byz_modern_navy_desc: "The galley schools convert to ships of the line. The Mediterranean galley tradition, ten centuries old, gives way to blue-water imperial fleets out of Naples, Constantinople and Crete."
 nd_rom_byz_bilingual_education: "Bilingual Imperial Education"
 nd_rom_byz_bilingual_education_desc: "Public education in both Latin and Greek for all imperial subjects. Literacy as a tool of imperial unification. The Romaios of Athens and the Romanus of Milan read the same imperial gazette in two scripts."
 nd_rom_byz_imperial_codification: "Imperial Codification"
 nd_rom_byz_imperial_codification_desc: "Railways, telegraphs and modern bureaucracy applied across the imperial dominions. Justinian's codifying ambition meets steam-age administration. The empire is finally as legible to itself as Justinian dreamed it could be."

 # ===== HERITAGE EVENTS =====

 # nd_rom_byz.2 -- Filioque Reconciled
 nd_rom_byz.2.t: "The Filioque Reconciled"
 nd_rom_byz.2.d: "The deepest theological wound in Christendom, the Filioque controversy that split East from West for half a millennium, has been closed. The councils of Florence and Ferrara, attempted in our predecessors' time and repudiated by the Constantinopolitan crowd, are now implemented in Rome itself. Greek-rite and Latin-rite Christians acknowledge one creed, one communion, one emperor.\n\nBut who arbitrates the union? The pope insists his see is superior; the patriarchs insist on the conciliar tradition. As emperor, we must take a position."
 nd_rom_byz.2.a: "Papal concord. The pope is our chancellor in matters of faith."
 nd_rom_byz.2.b: "Caesaropapal revival. The emperor is senior; the pope subordinate."

 # nd_rom_byz.3 -- Plethon's Academy
 nd_rom_byz.3.t: "Plethon's Academy"
 nd_rom_byz.3.d: "Gemistos Plethon's intellectual legacy lives. The Greek philosophers who fled west when Constantinople fell are now patronized by an emperor who has fled east to retake it. Their academy, modeled on Cosimo de' Medici's Florentine Platonic Academy, is now an imperial institution. Neoplatonism, classical philology, comparative theology: the Renaissance gains a Greek backbone."
 nd_rom_byz.3.a: "Let philosophy serve the empire."

 # nd_rom_byz.4 -- The Bilingual Court
 nd_rom_byz.4.t: "The Bilingual Court"
 nd_rom_byz.4.d: "Greek and Latin are now co-official in the imperial chancery. Documents issue in dual-language form. The old Constantinopolitan logothetes, who had reduced their numbers to a handful in the years before the city's fall, find themselves restored alongside the Italian notaries of the Roman curia. The empire's administrative reach extends consistently from the Adriatic to the Aegean for the first time in five centuries."
 nd_rom_byz.4.a: "Restore the logothete offices."

 # nd_rom_byz.5 -- The Mezzogiorno Greeks
 nd_rom_byz.5.t: "The Italograecia Awakens"
 nd_rom_byz.5.d: "Communities we had thought lost are still there. Calabrian Greek villages where the liturgy never stopped being Greek. Apulian monasteries that preserved Constantinopolitan manuscripts through the Norman centuries. Sicilian fishing towns whose dialect retains Byzantine inflections beneath the Sicilian veneer.\n\nFor the first time in five hundred years, an emperor in Rome can speak to these Italograeci as countrymen. They flock to imperial service: as priests, as soldiers, as administrators of the new themes."
 nd_rom_byz.5.a: "Italograecia, my eldest brother, awake."

 # nd_rom_byz.6 -- Mediterranean Mastery
 nd_rom_byz.6.t: "Mare Nostrum, Truly"
 nd_rom_byz.6.d: "The unified imperial galley fleet, combining Italian and Byzantine doctrine, has demonstrated its mastery of the Mediterranean. The Venetian and Genoese admiralties have been folded into the imperial structure. The Mamluk fleet has been driven from Cyprus. The Maghrebi corsairs find no port that is willing to harbor them. From the Pillars of Hercules to the Bosphorus, every wave answers to one imperial commander."
 nd_rom_byz.6.a: "The sea is ours, as it was meant to be."

 # ===== HERITAGE TIMED MODIFIERS =====
 STATIC_MODIFIER_NAME_nd_rom_byz_papal_concord: "Papal Concord"
 STATIC_MODIFIER_DESC_nd_rom_byz_papal_concord: "The pope is the empire's chancellor in matters of faith and a senior diplomatic asset across Catholic Europe. Cardinals plead the imperial case in foreign courts. Devotion deepens through the alliance."
 STATIC_MODIFIER_NAME_nd_rom_byz_caesaropapal_revival: "Caesaropapal Revival"
 STATIC_MODIFIER_DESC_nd_rom_byz_caesaropapal_revival: "The Eastern model of the Christian commonwealth is restored: the emperor presides at synods, confirms patriarchs and pope alike, and arbitrates doctrinal disputes. The crown's authority over religious affairs grows; the clergy chafe; legitimacy soars."
 STATIC_MODIFIER_NAME_nd_rom_byz_neoplatonic_revival: "Neoplatonic Revival"
 STATIC_MODIFIER_DESC_nd_rom_byz_neoplatonic_revival: "Plethon's heirs teach in every imperial city. Neoplatonist philosophy, classical philology and comparative theology spread alongside the Italian humanist program. Literacy and institutional growth accelerate."
 STATIC_MODIFIER_NAME_nd_rom_byz_logothete_revival: "Logothete Revival"
 STATIC_MODIFIER_DESC_nd_rom_byz_logothete_revival: "The old Constantinopolitan bureaucratic offices, the logothetes of the various imperial departments, are restored alongside the Italian chancery. Advisor recruitment becomes cheaper, the cabinet sharper, control reaches further from the capital."
 STATIC_MODIFIER_NAME_nd_rom_byz_italograecia: "Italograecia"
 STATIC_MODIFIER_DESC_nd_rom_byz_italograecia: "The surviving Italian Greek communities of Calabria, Apulia and Sicily, long marginalized under Norman and Angevin rule, become a privileged subject of imperial cultural policy. Cultural tradition deepens; assimilation accelerates; separatism withers."
 STATIC_MODIFIER_NAME_nd_rom_byz_mediterranean_hegemony: "Mediterranean Hegemony"
 STATIC_MODIFIER_DESC_nd_rom_byz_mediterranean_hegemony: "The unified imperial galley fleet rules the Mediterranean. Italian and Byzantine doctrine fused in a single command. Galley combat is dominant, blockades bite hard, and imperial maritime presence extends to every shore."

 # ===== CUSTOM UNITS =====
 a_nd_rom_byz_stratiotai: "Stratiotai Italici"
 a_nd_rom_byz_stratiotai_desc: "Greek-Italian light cavalry of the restored thematic system. Albanian and Calabrian-Greek horsemen drawn from the Mezzogiorno Greek substrate and the empire's Adriatic provinces. Faster and more aggressive than the standard age 1 levy cavalry, well suited to the Italian terrain they grew up in."
 n_nd_rom_byz_imperial_galley: "Imperial Galley"
 n_nd_rom_byz_imperial_galley_desc: "An age 3 fusion warship combining Italian galley tradition (Venetian, Genoese, Neapolitan) with Byzantine dromon doctrine. The Mediterranean's queen of battle: capable of close engagement, boarding actions and blockade duty in equal measure."

 # ===== CUSTOM LEVIES =====
 levy_nd_rom_byz_stratiotai: "Stratiotai Italici Levy"
 levy_nd_rom_byz_stratiotai_desc: "Light cavalry from the restored thematic system in southern Italy and Calabria. Greek-Italian smallholders bound to imperial military service in the Eastern thematic style: land in exchange for the saddle."

 # ===== CUSTOM BUILDINGS =====
 nd_rom_byz_studium_graecum: "Studium Graecum"
 nd_rom_byz_studium_graecum_desc: "An imperial chartered academy combining the Constantinopolitan Pandidakterion with the Italian Renaissance studio. Plethon's Neoplatonist successors teach Greek, Latin and Arabic to the next generation of imperial clerks and bishops. A Studium Graecum in any sufficiently large city is one of the empire's most prestigious institutions."
 nd_rom_byz_basilica_imperialis: "Basilica Imperialis"
 nd_rom_byz_basilica_imperialis_desc: "A great imperial basilica in the joint Latin-Greek rite. Modeled on Hagia Sophia and St Peter's at once, it is the visible proof of the post-Tridentine compromise: Catholic in communion, Greek in liturgy where local communities prefer it. The emperor crowns himself and presides at synods here."

 # Production methods
 nd_rom_byz_studium_upkeep: "Studium Upkeep"
 nd_rom_byz_studium_upkeep_desc: "Paper, books, beeswax candles and cloth for academic vestments sustain the Studium's daily operation."
 nd_rom_byz_basilica_upkeep: "Basilica Upkeep"
 nd_rom_byz_basilica_upkeep_desc: "Marble for ongoing construction, beeswax for the candles and cloth for vestments and altar dressings, with gems for reliquaries and imperial regalia."

 # ===== DESTINY ADVANCES =====

 # Path tooltip already exists above (nd_rom_byz_path_a_tt, nd_rom_byz_path_b_tt)

 nd_rom_byz_destiny: "Imperial Destiny"
 nd_rom_byz_destiny_desc: "The empire is restored, the eagle flies again over Rome. But what kind of empire have we become? The destiny of the Roman state must be chosen now, before the foundations harden into stone. Requires #bold 75 stability#!."

 # Path A
 nd_rom_byz_dest_imperium_restitutum: "Imperium Restitutum"
 nd_rom_byz_dest_imperium_restitutum_desc: "The Latin imperium asserts itself beyond Italy. Aachen (where Charlemagne was crowned successor of the Caesars) and Toulouse (the gateway to the Catholic west) acknowledge Roman authority. The empire embraces the renaissance as the rebirth of classical Latinity. Requires #bold ownership of Aachen and Toulouse, embraced Renaissance institution, army size 30+#!."
 nd_rom_byz_dest_concordia_pontificia: "Concordia Pontificia"
 nd_rom_byz_dest_concordia_pontificia_desc: "Catholic monarchies bow to imperial primacy. Reims (the Capetian sacre, France's Catholic heart) and Toledo (the primatial see of Spain) come into the imperial orbit. Confessionalism cements the post-Tridentine compromise. Requires #bold ownership of Reims and Toledo, embraced Confessionalism, 2000 gold, 5500 development#!."
 nd_rom_byz_dest_imperium_occidentis: "Imperium Occidentis"
 nd_rom_byz_dest_imperium_occidentis_desc: "The western Mediterranean lobe of the old Roman world rejoins the empire. Lisbon, Cordoba and Tunis fly the eagle once more. The Latin imperium has consummated its reach. Unlocks the #bold Templum Pontificis Maximi#!. Requires #bold ownership of Lisbon, Cordoba and Tunis, 3000 gold, 75 prestige, army size 75+#!."

 # Path B
 nd_rom_byz_dest_aigaion_anaktethen: "Aigaion Anaktethen"
 nd_rom_byz_dest_aigaion_anaktethen_desc: "The Aegean is reclaimed. Athens (held since 1311 by Catalan and Florentine adventurers) and Candia (Venetian Crete) return to the empire. The Greek heartland is restored not by suppression of the West but by fusion of the two halves. Requires #bold ownership of Athens and Candia, embraced Renaissance institution, army size 30+#!."
 nd_rom_byz_dest_mesogeios_synkrasis: "Mesogeios Synkrasis"
 nd_rom_byz_dest_mesogeios_synkrasis_desc: "The Mediterranean is welded into one cosmopolitan economy. Cyprus and Smyrna become joint Greek-Italian imperial entrepots. Global trade spreads through the empire's harbors. Requires #bold ownership of Nicosia (Cyprus) and Smyrna, embraced Global Trade, 2000 gold, 5500 development#!."
 nd_rom_byz_dest_romaiosyne_pleroma: "Romaiosyne Pleroma"
 nd_rom_byz_dest_romaiosyne_pleroma_desc: "The Greek-Roman fullness is realized. Trebizond (the last Komnenian remnant), Antioch (the third see of the pentarchy) and Famagusta (the great Levantine entrepot) all rejoin the empire. The fusion civilization is whole. Unlocks the #bold Akademia Bilingualis#!. Requires #bold ownership of Trebizond, Antioch and Famagusta, 3000 gold, 75 prestige, 7000 development#!."

 # ===== DESTINY EVENTS =====

 nd_rom_byz.7.t: "An Imperial Destiny"
 nd_rom_byz.7.d: "The basileus walks the Forum at dawn, alone, before the daily ceremonies begin. Augustus and Constantine walked here too. So did Julian, who tried to undo the Christianization, and Theodoric, who ruled as a Roman without being one, and Justinian, whose reconquest collapsed within a generation of his death.\n\nWhat kind of empire shall this be? The choice we made on the day of formation echoes in every sphere now: the army, the coinage, the chancellery, the church. The destiny of the empire must now be hammered into law, brick and treaty before the next generation grows accustomed to its shape.\n\nThe Traditions tab opens. Three stages on the chosen path lie ahead. Choose well; the empire is watching."
 nd_rom_byz.7.a: "It begins."

 nd_rom_byz.8.t: "The Eagle Flies West"
 nd_rom_byz.8.d: "Charlemagne's old palace at Aachen, where Otto III once dreamed of restoring the Roman Empire and where Frederick Barbarossa was crowned, now hosts the imperial court for a season. Its restoration is symbolic: the Romanitas of the West, the unbroken Carolingian-Ottonian thread, has folded back into the Roman imperium it always claimed to continue.\n\nIn Toulouse, the seneschal of the southern marches receives the imperial commission. The Languedoc, long contested between France and Aragon, now answers to Roman law. Latin classical learning is the empire's official program. The renaissance has a Roman patron once again.\n\nThe Latin imperium has begun its march westward."
 nd_rom_byz.8.a: "Per Aspera ad Astra."

 nd_rom_byz.9.t: "Concord with the Pope"
 nd_rom_byz.9.d: "The Catholic kings have come to terms. The kings of France submit at Reims, where their predecessors were anointed; the king of Castile yields Toledo, the primatial see, into imperial communion. The post-Tridentine settlement holds: Catholic in faith, Roman in obedience.\n\nBut the relationship between emperor and pope must now be defined for an age. Some at court, the old Italian school of canonists, urge a true concordat: the pope as a sovereign chancellor of the faith, his moral authority preserved as a diplomatic asset. Others, the Greek and reformist faction, urge an imperial curia: cardinals as imperial officers, the pope as senior bishop subordinate to the imperial throne."
 nd_rom_byz.9.a: "Pax Imperialis. The pope reigns; the emperor rules."
 nd_rom_byz.9.b: "Curia Imperialis. The pope serves the imperium."

 nd_rom_byz.10.t: "Imperium Sine Fine"
 nd_rom_byz.10.d: "Lisbon, the western terminus of Iberia, kneels at last. Cordoba, the old caliphal seat, returns to Christian-imperial communion. Tunis, the inheritor of Carthage, joins the Roman dominion that ancient Rome could not hold for long. The Mediterranean's Western basin is once again Mare Nostrum. From the Pillars of Hercules to the Bosphorus, every coast pays imperial customs. The Romanitas Vincit destiny is fulfilled.\n\nWhat character shall this final triumph wear? The emperor's councilors are split. The military faction wants the imperium itself perpetuated as a martial enterprise: the western eagle ascendant, conquest as the empire's permanent mode. The diplomatic faction urges concord: a Catholic ecumene of consenting kings, the imperium as moral arbiter rather than perpetual conqueror."
 nd_rom_byz.10.a: "Aquila Occidentis. Conquest is our destiny."
 nd_rom_byz.10.b: "Concordia Orbis. The Catholic ecumene at peace."

 nd_rom_byz.11.t: "The Aegean Returns"
 nd_rom_byz.11.d: "The Acropolis is ours again. The Catalan Company, then the Acciaioli of Florence, ruled Athens for a century and a half; now the eagle flies above the Parthenon-cathedral once more. Candia, the great Venetian fortress on Crete, has surrendered with all its galleys and archives.\n\nGemistos Plethon's heirs hold lectures in the Studium Graecum and in the Athenian schools at once. Greek and Italian scholars compete for chairs in the same imperial university system. Renaissance humanism, fed simultaneously by classical Greek manuscripts and Italian Latin learning, is the official cultural program of the empire.\n\nThe Hellenikos Romaios path shows its first fruits."
 nd_rom_byz.11.a: "Romaios kai Hellen, hama."

 nd_rom_byz.12.t: "Mediterranean Cosmopolis"
 nd_rom_byz.12.d: "Famagusta and Nicosia, the great Lusignan ports of Cyprus, have been folded into the imperial system. Smyrna, contested for a century between the Aydin Turks, the Hospitallers and the Genoese, now flies the imperial standard. Greek and Italian merchants share warehouses; their accountants work in dual ledgers; their captains carry both rites in their cabin shrines.\n\nThis is the moment of choice. The cosmopolitan vision can be pursued as a merchant koinon: the empire as the great common emporium, every harbor an open port, the Greek-Italian commercial fusion driving wealth into the imperial fisc. Or it can be pursued as thalassokratia: imperial naval mastery as the precondition for the cosmopolis, the galleys as guarantors of a Mediterranean made safe by imperial dominion."
 nd_rom_byz.12.a: "Emporion Koinon. The common emporium."
 nd_rom_byz.12.b: "Thalassokratia. Sea-rule as the foundation of all."

 nd_rom_byz.13.t: "Romaiosyne Pleroma"
 nd_rom_byz.13.d: "Trebizond, the last Komnenian remnant, the empire-in-exile that outlived Constantinople, has rejoined its mother. Antioch, the third see of the apostolic pentarchy, returns to the imperial fold after seven centuries of Crusader, Mamluk and Mongol governance. Famagusta becomes the great clearinghouse of the Levantine trade, half Greek by tongue and half Italian by ledger.\n\nThe Greek-Roman fullness is realized. The empire is what Justinian dreamed of and could not achieve: a single imperium spanning Latin and Greek, Italy and Anatolia and Syria, the bilingual civilization standing as the heir of Augustus and Constantine alike.\n\nThe imperial council asks how to crown this culmination. The literary faction proposes the Polis Oikoumene: Constantinople and Rome jointly raised as cosmopolitan capitals, models of the inhabited world. The ecclesiastical faction proposes the Pentarchia Restored: the five ancient patriarchates reunited under imperial communion, the Christian East rejoined as one body."
 nd_rom_byz.13.a: "Polis Oikoumene. The cosmopolitan polis."
 nd_rom_byz.13.b: "Pentarchia Restored. The five sees, one church."

 # ===== DESTINY TIMED MODIFIERS =====

 STATIC_MODIFIER_NAME_nd_rom_byz_dest_pax_imperialis: "Pax Imperialis"
 STATIC_MODIFIER_DESC_nd_rom_byz_dest_pax_imperialis: "The pope governs souls, the emperor governs kingdoms; the two together are sufficient. Latin Christendom recognizes the imperial sword as the temporal arm of the universal church. Mercenary captains arrive cheaper, supplies stretch further, the imperial morale recovers swiftly from any reverse."
 STATIC_MODIFIER_NAME_nd_rom_byz_dest_curia_imperialis: "Curia Imperialis"
 STATIC_MODIFIER_DESC_nd_rom_byz_dest_curia_imperialis: "Cardinals become imperial officers. The papal curia is folded into the imperial civil service. Diplomats fan out through Catholic Europe carrying the emperor's writ, and religious wars are prosecuted with cardinal-legate efficiency."
 STATIC_MODIFIER_NAME_nd_rom_byz_dest_aquila_occidentis: "Aquila Occidentis"
 STATIC_MODIFIER_DESC_nd_rom_byz_dest_aquila_occidentis: "The western eagle is ascendant. Imperial armies move with classical Roman tactical discipline; siege trains crack any Catholic fortress; war is declared with imperial ease. The cost is monetary: relentless conquest pours looted bullion into the fisc, and the coinage debases under the strain."
 STATIC_MODIFIER_NAME_nd_rom_byz_dest_concordia_orbis: "Concordia Orbis"
 STATIC_MODIFIER_DESC_nd_rom_byz_dest_concordia_orbis: "The Catholic ecumene of kingdoms holds together as a peaceful concord under imperial arbitration. Estates settle into satisfaction with imperial governance; provincial prosperity climbs; new regiments form rapidly when called."
 STATIC_MODIFIER_NAME_nd_rom_byz_dest_emporion_koinon: "Emporion Koinon"
 STATIC_MODIFIER_DESC_nd_rom_byz_dest_emporion_koinon: "The empire becomes the great common emporium. Greek and Italian merchant houses operate as one. Inland trade routes hum with bilingual factors and joint ledgers; merchant capacity grows; the burgher estate rises in influence and prosperity."
 STATIC_MODIFIER_NAME_nd_rom_byz_dest_thalassokratia: "Thalassokratia"
 STATIC_MODIFIER_DESC_nd_rom_byz_dest_thalassokratia: "Sea-rule. The unified imperial fleet renders the Mediterranean a Roman lake. Naval combat is dominated, fleets operate cheaper, the corsair havens of the Maghreb wither. The land army, deprioritized in favor of the galleys, demands more upkeep to maintain its standards."
 STATIC_MODIFIER_NAME_nd_rom_byz_dest_polis_oikoumene: "Polis Oikoumene"
 STATIC_MODIFIER_DESC_nd_rom_byz_dest_polis_oikoumene: "The cosmopolitan polis as imperial capital. Rome and Constantinople become twin centers of the inhabited world, gathering scholars, artisans and notables of every nation. Maximum literacy ceilings rise, the noble estate flourishes in imperial service, devastated provinces recover swiftly under imperial patronage."
 STATIC_MODIFIER_NAME_nd_rom_byz_dest_pentarchia_restored: "Pentarchia Restored"
 STATIC_MODIFIER_DESC_nd_rom_byz_dest_pentarchia_restored: "The five ancient patriarchates restored: Rome, Constantinople, Alexandria, Antioch and Jerusalem reunited under imperial communion. The Christian East is rejoined. Imperial regiments draw on a deeper tradition of martial sanctity; assault parties press home with apostolic zeal; fortresses cost less to maintain across the unified ecclesiastical territory."

 # ===== DESTINY BUILDINGS =====

 nd_rom_byz_templum_pontificis: "Templum Pontificis Maximi"
 nd_rom_byz_templum_pontificis_desc: "The great basilica-palace of the Latin imperium. Built upon the Roman fora and over the older Constantinian basilicas, it fuses caesar's curia and pontifex maximus's see into one sacred-civic complex. The emperor crowns himself, presides at synods and arbitrates between Catholic kingdoms here. The monumental embodiment of Romanitas Vincit."
 nd_rom_byz_templum_upkeep: "Templum Upkeep"
 nd_rom_byz_templum_upkeep_desc: "Marble for the unending interior elaborations, gold for the imperial reliquaries, fine cloth for vestments, beeswax for the candles and incense for the daily liturgies in joint Latin and Greek rite."

 nd_rom_byz_akademia_bilingualis: "Akademia Bilingualis"
 nd_rom_byz_akademia_bilingualis_desc: "The polymath imperial academy of the Hellenikos Romaios destiny. Greek and Italian scholars share lecterns; mathematics is taught in Diophantine and Vietan notation alongside; medicine, astronomy, civil law and theology are conducted in two tongues. The graduating scholars staff the empire's chanceries and diplomatic posts across the inhabited world."
 nd_rom_byz_akademia_upkeep: "Akademia Upkeep"
 nd_rom_byz_akademia_upkeep_desc: "Paper, books, beeswax candles and cloth for academic vestments sustain the academy's daily teaching. Glass for lenses and laboratory work supports the new natural philosophy."

 # ===== BUREAUCRACIES =====
 # Six historically-grounded toggleable institutions of the BYZ-Italian
 # Roman restoration. Auto-modifier grants 3 slots; capital adds 1 = 4
 # effective. Player picks 4 of 6.

 rom_byz_senatus_bilinguis_bureaucracy: "Senatus Bilinguis Restitutus"
 rom_byz_senatus_bilinguis_bureaucracy_desc: "After 1453, the only court conducting business in both Latin and Greek was the imperial chancery in exile -- George of Trebizond's Vatican translation bureau and Bessarion's Roman household. Restored to imperial dignity, every decree issues in two tongues and embassies are received in either. Where the Latin-only Senatus Romanus Renovatus of 1144 was a citizens' commune, this is its bilingual imperial successor: a chancery whose dignity-of-office rests on mastery of both languages of romanitas."

 rom_byz_schola_graecorum_bureaucracy: "Schola Graecorum Romae"
 rom_byz_schola_graecorum_bureaucracy_desc: "Bessarion's palazzo on the Quirinal (1450s-1472) was the de facto Greek academy of Italy, sheltering Theodore Gaza, John Argyropoulos, George of Trebizond, and Janus Lascaris. His library of 482 Greek and 264 Latin manuscripts seeded Venice's Biblioteca Marciana in 1468. Under the restored basileus the scholar-class is no longer private patronage but an imperial institution -- stipended chairs with an obligation of imperial service, the post-Ottoman answer to what the Phanariotes became under the Sultan."

 rom_byz_collegium_italograecum_bureaucracy: "Collegium Italograecum"
 rom_byz_collegium_italograecum_bureaucracy_desc: "The Greek-rite communities of Calabria, Apulia and Sicily -- the Griko, the Grecanici, and the Italo-Albanian Arberesh who joined them after 1448 -- preserved Byzantine liturgy and Greek vernacular into the modern era despite the Norman conquest of 1071. Loosely administered under the Catepanate of Italy (965-1071) and afterwards left to local bishops, the Collegium now formalizes them at court, guarantees the Greek rite where it survives, and channels the Mezzogiorno villages' loyalty toward the throne rather than the Latin metropolitans."

 rom_byz_commissio_filioque_bureaucracy: "Commissio Filioque"
 rom_byz_commissio_filioque_bureaucracy_desc: "At the Council of Florence in 1439, after nine sessions on the Filioque, Bessarion's discourse of 13-14 April persuaded the Greek delegation that the Greek and Latin Fathers had taught the same doctrine in different words; the union decree Laetentur Caeli was signed on 6 July. Repudiated in Constantinople in 1484, it survives here as a permanent institution: a standing commission of Latin canonists and Greek hieromonks reconciles doctrinal language, hears appeals, and certifies legitimate teaching across both rites."

 rom_byz_magisterium_maris_bureaucracy: "Magisterium Maris Nostri"
 rom_byz_magisterium_maris_bureaucracy_desc: "The Venetian Arsenal (founded c. 1104) and the Genoese arsenale produced the medieval Mediterranean's most sophisticated naval-industrial administration -- standing boards, the Provveditori all'Armar and the Colleggio della Milizia da Mar, supervising provisioning, crewing, prize courts, and maritime customs across an entire trading empire. Fused with the surviving Byzantine dromon-corps tradition and made imperial, this is a standing Mare Nostrum inspectorate above the city-states, levying toll on the sea and certifying every captain who flies the imperial standard."

 rom_byz_aula_phoenicea_bureaucracy: "Aula Phoenicea"
 rom_byz_aula_phoenicea_bureaucracy_desc: "After 1453 the household of the basileus survived in exile -- the eunuchs of the bedchamber, the protovestiarios, the parakoimomenos, the imperial physicians, the Constantinopolitan refugee aristocracy who attached themselves to the Palaiologan court. Restored, this household becomes an inner court loyal directly to the emperor's person, parallel to and above the Italian baronage and the Roman curia: a Greek-staffed apparatus whose precedence the Latin nobility cannot challenge. The Phoenix is the Palaiologan symbol of restoration -- the institution names itself."

 # ===== AUTO-MODIFIER (slot grant on formation) =====
 AUTO_MODIFIER_NAME_nd_rom_byz_bureaucracy_authority: "Imperium Bilingue"
 AUTO_MODIFIER_DESC_nd_rom_byz_bureaucracy_authority: "On forming the BYZ-Italian Roman restoration, [ROOT.GetName] gains the institutional authority to host historical bureaucracies of the Latin-Greek imperium."
