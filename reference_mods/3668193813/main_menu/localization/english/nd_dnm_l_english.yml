 nd_dnm.30.a_tt: "Acknowledges the open question. Grants The Open Question modifier (perpetual until the succession crisis ends)"
 nd_dnm.31.a_tt: "Rally the diets -- removes Open Question, grants Rallying the Diets (perpetual), AND seeds +15 Crown Confidence when the disaster fires"
 nd_dnm.31.b_tt: "Royal silence -- removes Open Question, grants Royal Silence (perpetual). No counter seed"
 nd_dnm.32.a_tt: "Ratify by patent now -- one-shot stability cost, grants Drafting the Decree (perpetual), AND seeds +25 Crown Confidence when the disaster fires"
 nd_dnm.32.b_tt: "Postpone the decree -- grants The Decree Postponed (perpetual). No counter seed"
 # Strength path victory (nd_dnm.33)
 nd_dnm.33.a_tt: "Grants a large legitimacy bonus and a 20-year Indivisibiliter ac Inseparabiliter modifier"

