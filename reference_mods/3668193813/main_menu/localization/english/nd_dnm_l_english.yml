 # ===== CAN_END CLAUSE TOOLTIPS (drive the Situation panel End Requirements) =====
 # Three earnable exits, surfaced as friendly prose in the panel. The fail
 # escape (DNM no longer exists) is hidden by design -- vanilla pattern.
 nd_dnm_ps_resolved_end_tt: "The succession crisis has been settled by force and treaty. Whether the Pragmatic Sanction held or broke, Europe now recognises who rules the Danube -- and the Reich's pariah verdict is moot. (Resolve the [ShowDisasterName('nd_dnm_pragmatic_sanction_crisis')] disaster, either Upheld or Broken.)"
 nd_dnm_reich_humbled_end_tt: "The Reich's military verdict has been broken in the field. Reach 80% war score against the [GetUniqueInternationalOrganization('hre').GetLeaderTitle] and enforce the #Y Humble the Reich#! peace term."
 nd_dnm_pariah_endured_end_tt: "Fifty years have passed since the rupture and the realm has built a respected state -- the powers of Europe no longer treat the Danube as an apostate. (50 years post-formation, legitimacy >= 60, prestige >= 50.)"
 nd_dnm_dnm_gone_end_tt: "The Danubian Monarchy no longer exists. With the apostate state conquered or dissolved, the Reich's reaction has nothing left to judge."

 # ===== STRENGTH-PATH PEACE TREATY (peace_treaties/99_nd_dnm.txt) =====
 peace_nd_dnm_humble_reich: "Humble the Reich"
 peace_nd_dnm_humble_reich_entry: "Humble the [GetUniqueInternationalOrganization('hre').GetName]"
 peace_nd_dnm_humble_reich_entry_short: "Humble the Reich"
 peace_nd_dnm_humble_reich_desc: "Force the [GetUniqueInternationalOrganization('hre').GetLeaderTitle] to acknowledge the Danubian state as a power among powers. The imperial verdict is broken in the field, the [ShowCasusBelliName('cb_imperial_ban')] is voided, and the Reaction of the Reich ends on the Strength path. Requires #Y 80%#! war score against the Emperor."

