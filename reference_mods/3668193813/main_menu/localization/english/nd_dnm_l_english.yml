 nd_dnm.2.a_tt: "Frontier Spearhead -- the Grenzer line projected outward against the Ottomans"
 nd_dnm.2.b_tt: "Frontier Shield -- the Militaergrenze settled deep and self-sustaining"
 nd_dnm.3.a_tt: "Verneuerte Landesordnung -- re-Catholicize Bohemia by imperial patent"
 nd_dnm.3.b_tt: "Loyal Aristocracy -- bind a new service nobility with confiscated White Mountain estates"
 nd_dnm.4.a_tt: "The Pragmatic Sanction -- the Habsburg lands made one inseparable inheritance"
 nd_dnm.5.a_tt: "The Theresian Machine -- the cameralist reform, taxed and drilled state"
 nd_dnm.5.b_tt: "The Josephine Reach -- the enlightened reform, Toleranzpatent and one bureaucracy"
 # Destiny
 nd_dnm.6.a_tt: "Open the destiny tree -- accept the Danubian crown's strategic agenda"
 nd_dnm.7.a_tt: "The Sava-Drava-Danube line is held; the frontier campaign begins"
 nd_dnm.8.a_tt: "Breaker of Walls -- the Balkan campaign drives toward fortified Ottoman cities"
 nd_dnm.8.b_tt: "Grenzer Tide -- the Military Frontier rolls south as a settled wave"
 nd_dnm.9.a_tt: "Sword of Christendom -- the Eastern Crusade rebuilds the Christian east under Vienna"
 nd_dnm.9.b_tt: "Conquering Host -- the Balkan recovery as pure military conquest"
 nd_dnm.10.a_tt: "Lay the cameralist foundation -- the Hofkammer becomes the realm's spine"
 nd_dnm.11.a_tt: "Crown Fisc -- the treasury runs the state, gold and tax foremost"
 nd_dnm.11.b_tt: "Danube Market -- the realm becomes a riverine trade empire"
 nd_dnm.12.a_tt: "Cameralist Hand -- estate satisfaction tied to administrative control"
 nd_dnm.12.b_tt: "Enlightened State -- literacy and institutional reach across all peoples"
 # Nationalities Question disaster
 nd_dnm.13.a_tt: "The crisis is acknowledged; the empire enters the storm"
 nd_dnm.14.a_tt: "Suppress the defiant diet by force -- buys time but does not resolve"
 nd_dnm.14.b_tt: "Concede autonomy -- the fragmentation path"
 nd_dnm.15.a_tt: "Accept the Compromise -- the Ausgleich, Austria-Hungary; ends the crisis"
 nd_dnm.15.b_tt: "Refuse the Compromise -- the crisis continues"
 nd_dnm.16.a_tt: "Crush the nationalist leagues -- centralized reassertion; ends the crisis"
 nd_dnm.16.b_tt: "Not yet -- wait for stronger control before striking"
 nd_dnm.17.a_tt: "Grant the Austria-Hungary modifier -- the dual monarchy by consent"
 nd_dnm.18.a_tt: "Grant the Uniform State modifier -- strong central rule with lasting resentment"
 nd_dnm.19.a_tt: "A constituent crown is released as a sovereign kingdom; severe stability hit"
 # Pragmatic Sanction disaster
 nd_dnm.20.a_tt: "The succession war begins; vultures press their claims on the realm"
 nd_dnm.21.a_tt: "The Sanction held -- grant the Indivisibiliter ac Inseparabiliter modifier"
 nd_dnm.22.a_tt: "The Sanction broke -- grant the Broken Sanction penalty modifier"
 nd_dnm.23.a_tt: "Resist by arms -- stability cost and -3 Crown Confidence; the war continues"
 nd_dnm.23.b_tt: "Negotiate terms -- ends the disaster on the Broken branch via the cede flag"
 # Reaction-of-the-Reich situation events
 nd_dnm.25.a_tt: "Accept the pariah years -- the cost of breaking with the Reich"
 nd_dnm.26.a_tt: "The Reich and the Curia mark the Danubian state as an apostate"
 nd_dnm.27.a_tt: "Weather the imperial pressure -- applies a small 1-year pressure modifier; the Reaction continues until one of its three exits is met"
 nd_dnm.29.a_tt: "The reckoning is closed; relations normalize"
