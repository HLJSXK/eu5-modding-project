 nd_dnm_ps_upheld_tt: "The Pragmatic Sanction has been upheld"
 nd_dnm_ps_ceded_tt: "The realm chose to cede terms rather than fight the succession war to its end"
 nd_dnm_reich_humbled_tt: "The Reich's verdict against the Danubian state has been broken on the battlefield"
 nd_dnm_succession_groundwork_tt: "Groundwork has been laid with the diets for the indivisible succession"
 nd_dnm_decree_ratified_tt: "The decree of indivisibility has been ratified crown by crown"
