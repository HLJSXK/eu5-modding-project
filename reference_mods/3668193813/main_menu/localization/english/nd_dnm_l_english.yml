 # Formation event
 nd_dnm.1.a_tt: "Founding identity: Antemurale Christianitatis -- the bulwark of Christendom. Strong military and prestige bonuses; cost in court efficiency."
 nd_dnm.1.b_tt: "Founding identity: Gesamtmonarchie -- the centralized total monarchy. Strong administrative and fiscal bonuses; cost in diplomatic reputation."
