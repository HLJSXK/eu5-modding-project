l_english:
 BNH: "Beth Nahrain"
 BNH_ADJ: "Nahrain"
 BNH_f: "Beth Nahrain"
 BNH_f_desc: "Beth Nahrain — 'Land Between the Rivers' in Syriac — restores Mesopotamia under the Christian heirs of Nineveh and Edessa. The Patriarchs of the Church of the East still rule diaspora flocks from the Tigris to Cathay; the monasteries of Tur Abdin have weathered Mongol, Mamluk and Turkmen overlords with their autonomy intact; the County of Edessa proved that a Latin-Syriac state could hold the upper Jazira. Forming Beth Nahrain consolidates these threads into a single Aramaic-speaking Christian polity centered on Mosul, the ancient seat of the Patriarchate, with Tur Abdin and Edessa as its spiritual lungs."
