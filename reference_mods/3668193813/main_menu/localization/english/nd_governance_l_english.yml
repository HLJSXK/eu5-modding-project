l_english:

 # Shared National Destinies marker variable (set in every formation event).
 # One key covers all formables; tooltip text for the hidden set_variable.
 nd_formed_tt: "A National Destiny has been fulfilled"

 # === Governance advances ===
 nd_provincial_governance: "Provincial Governance"
 nd_provincial_governance_desc: "Delegate the administration of distant interior provinces to noble-staffed estates. Unlocks the Provincial Governance bureaucracy, which permits the construction of a Provincial Estate."
 nd_maritime_governance: "Maritime Governance"
 nd_maritime_governance_desc: "Extend royal authority across the water to overseas harbors through appointed port officials. Unlocks the Maritime Governance bureaucracy, which permits the construction of a Port Commandery."

 # === Governance bureaucracies ===
 nd_provincial_governance_bureaucracy: "Provincial Governance"
 nd_provincial_governance_bureaucracy_desc: "Noble-staffed provincial estates administer the distant interior on the crown's behalf, allowing one Provincial Estate to be built. Properly funded, the provinces are kept in hand; starved of resources, the nobility lets the interior slip its leash -- rural control collapses, separatism surges, and rebellion festers."
 nd_maritime_governance_bureaucracy: "Maritime Governance"
 nd_maritime_governance_bureaucracy_desc: "Port commanderies project royal authority across the water to overseas harbors, allowing one Port Commandery to be built. Well-kept, they enrich the treasury and man the fleet; left underfunded, the port governors turn smuggler and pirate, the coasts become ungovernable, and trade bleeds away."
