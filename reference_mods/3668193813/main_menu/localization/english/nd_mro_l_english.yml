l_english:

# === FORMATION EVENT ===
 nd_mro.1.t: "The Caliph of the Southern Sea"
 nd_mro.1.d: "Three centuries of Islam have remade Mindanao. From Maimbung to Kuta Watu, from the kris-foundries of Lanao to the vinta wharves of the Iranun coast, Sunni faith has bound together what no Spanish, Dutch, or English fleet has ever conquered.\n\nNow the impossible has happened. The rival Sultanates of Sulu and Maguindanao no longer war. The rajahs of Butuan and the datus of Buayan and Zamboanga kneel together. The pandita and ulama have spoken with one voice: Mindanao must speak with one voice as well.\n\nA single oath of fealty awaits. The vinta fleets are at sail. The kalis are unsheathed. The question is what kind of polity this Moro Sultanate will be.\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_mro.1.a: "The Sultan-Caliph of the Moros"
 nd_mro.1.b: "A Confederation of Datus"
 nd_mro.1.c: "By Sword and by Sail"

# === FORMATION CHOICE MODIFIERS ===
 STATIC_MODIFIER_NAME_nd_mro_sultan_caliph: "The Sultan-Caliph of the Moros"
 STATIC_MODIFIER_DESC_nd_mro_sultan_caliph: "One Sultan, one Caliph, one banner over Mindanao. The ulama swear fealty to a single throne; pandita schools teach the same fiqh from Sulu to Lanao; conversion of pagan and animist datus proceeds under royal sanction. Religious authority and political authority are made one."
 STATIC_MODIFIER_NAME_nd_mro_datu_confederation: "A Confederation of Datus"
 STATIC_MODIFIER_DESC_nd_mro_datu_confederation: "Power flows upward from the datus, not downward from the Sultan. Each rajah keeps his retainers, each chief his territory; the Caliph is first among equals, not master of all. The cost of unity is paid in centralized authority, but the gain is in the levies of every clan and the loyalty of every datu's house."
 STATIC_MODIFIER_NAME_nd_mro_sword_and_sail: "By Sword and by Sail"
 STATIC_MODIFIER_DESC_nd_mro_sword_and_sail: "The vinta fleets sail at the new moon and return laden with plunder. From the Visayan coasts to the Borneo straits, the lantakas roar. War is not the failure of statecraft but its instrument; jihad against the unbeliever is the discipline that holds the Moro nation together."

# === ADVANCE EVENT 2: SHARIF UL-HASHIM ===
 nd_mro.2.t: "The Foundation of Sharif ul-Hashim"
 nd_mro.2.d: "In the year 1457 of the Christian reckoning, the Johore-born scholar and missionary Sharif ul-Hashim came to Buansa on Jolo and was acclaimed Sultan. He had crossed the seas with the Quran, the chronicles of the Prophet, and the genealogies that traced his line back to the Hashemites. Where the datu-rajah hierarchy had once ruled by ancestry alone, now it ruled by ancestry sanctified through Islam.\n\nThe Sharif's first concern is the doctrine itself: which strand of the faith shall the Moro Sultanate plant in its soil? The orthodox jurists of Mecca, with their codified Shafi'i fiqh and their disciplined schools, send their books and their scholars. The Sufi tariqa brotherhoods, with their saints and their popular conversions, send their living teachers. The Sharif must choose."
 nd_mro.2.a: "Receive the orthodox Shafi'i fiqh from Mecca"
 nd_mro.2.b: "Plant the Sufi tariqa brotherhoods among the people"

# === ADVANCE EVENT 3: VINTA AND LANTAKA ===
 nd_mro.3.t: "The Vinta and the Lantaka"
 nd_mro.3.d: "The boats are everywhere now: outrigger hulls of nara wood, lateen sails painted in the okir patterns of Sulu, deck-mounted lantakas of bronze cast at Maguindanao foundries. They are smaller than the Spanish galleons, smaller even than the Brunei perahus, but they are faster than both, and they cluster like wasps.\n\nThe debate in the Sultan's diwan is sharp. The Iranun datus want letters of marque, raids on the Visayan coast, slaves and plunder for the warrior nobility. The royal admiralty wants a regular fleet, prahus organized into squadrons, lantakas standardized, the Sulu Sea made a Moro lake. Both visions promise the same vinta -- but very different uses for it."
 nd_mro.3.a: "Loose the Iranun corsairs upon the Visayas."
 nd_mro.3.b: "Build a royal admiralty for the Sulu Sea."
 STATIC_MODIFIER_NAME_nd_mro_iranun_corsairs: "The Iranun Corsairs"
 STATIC_MODIFIER_DESC_nd_mro_iranun_corsairs: "The Iranun raid by moonlight in fleets of forty vintas, ranging from the Visayas to the Strait of Malacca. They take slaves, silver, weapons, and reputation. The Spanish call it piracy; the Moros call it war."
 STATIC_MODIFIER_NAME_nd_mro_lateen_admiralty: "The Royal Admiralty"
 STATIC_MODIFIER_DESC_nd_mro_lateen_admiralty: "The Sultan's shipwrights work in standardized yards. Vinta hulls are measured to a single template, lantakas cast to a single bore. The Sulu Sea becomes a disciplined sea, patrolled in squadrons under the green banner."

# === ADVANCE EVENT 4: SULTAN KUDARAT ===
 nd_mro.4.t: "Sultan Kudarat and the Long Defiance"
 nd_mro.4.d: "He is the greatest sultan Mindanao has ever produced: Muhammad Dipatuan Kudarat, descendant of Sharif Kabungsuwan, ruler of nine modern provinces, the man who turned back the Spanish at Lamitan in 1637 with two thousand juramentado warriors and held them off for thirty more years.\n\nHis reign is the golden age of Maguindanao. His diwan receives ambassadors from Brunei, Aceh, and the Dutch. His vinta fleets dominate the Sulu Sea. His name is spoken in the same breath as Suleiman the Magnificent and Akbar the Great.\n\nNow Kudarat sends word: the Spanish have asked for terms. The choice is his to make, and his Sultanate's character will be decided by it."
 nd_mro.4.a: "Press the jihad of Lamitan to the gates of Manila."
 nd_mro.4.b: "Sign the Peace of Atienza and reopen the harbours."
 STATIC_MODIFIER_NAME_nd_mro_lamitan_jihad: "The Jihad of Lamitan"
 STATIC_MODIFIER_DESC_nd_mro_lamitan_jihad: "Two thousand juramentado, sworn before Allah to die for the faith, march under the Moro banner. The kalis are unsheathed; the kampilans flash; the vinta fleets blockade the Spanish ports. War, not peace, is the language of the Sultan-Caliph."
 STATIC_MODIFIER_NAME_nd_mro_kudarat_peace: "The Peace of Atienza"
 STATIC_MODIFIER_DESC_nd_mro_kudarat_peace: "In 1645 the treaty is signed. The Sultan opens his harbours; Maguindanao trade flourishes. Pearls, tortoise-shell, slaves, beeswax, and rice flow through Cotabato to Manila and Macao. Kudarat's golden age is born of restraint, not war."

# === ADVANCE EVENT 5: PANDITA SCHOOLS ===
 nd_mro.5.t: "The Pandita and the Ulama"
 nd_mro.5.d: "In every Moro town now there is a pandita -- a man who has studied with the great teachers of Sulu, who has perhaps made the hajj to Mecca, who can read the Arabic of the Quran and write the Tausug of the chronicles. Around him gather children -- but the diwan must decide which children.\n\nSome pandita teach all who can sit before them: the slave's son beside the datu's, the freeman beside the rajah's heir. Others reserve the deeper texts for the datu and ulama lines, the future judges and ambassadors of the Sultanate. Both visions promise the same scholarship -- but very different societies."
 nd_mro.5.a: "Open the schools to all -- slave and datu's son alike"
 nd_mro.5.b: "Reserve them for the datu and ulama lines"

# === ADVANCE EVENT 6: JURAMENTADO ===
 nd_mro.6.t: "The Way of the Juramentado"
 nd_mro.6.d: "He has shaved his head, bound his loins, and taken the oath before the imam: he will go forth alone or in small bands, kalis in hand, and he will not return. He believes that to fall in jihad is to enter Paradise; he believes that the colonizer's bullets cannot take from him what Allah has not willed.\n\nThe Spanish call him 'juramentado' -- 'one who has sworn.' They do not understand him, and they fear him.\n\nThe Sultan's diwan must decide what the throne's relation to him shall be. Sanction the juramentado as a Sultan-licensed warrior order, with imams sworn to the throne and a discipline that flows from the diwan. Or let him fight as folk resistance, beyond the throne, sworn only to Allah and his village's imam."
 nd_mro.6.a: "Sanction them as a Sultan-licensed warrior order"
 nd_mro.6.b: "Let them fight as folk resistance, beyond the throne"

# === ADVANCES (LOCALIZATION) ===
 nd_mro_sharif_ul_hashim: "Foundation of Sharif ul-Hashim"
 nd_mro_sharif_ul_hashim_desc: "The arrival of the Sunni missionary Sharif ul-Hashim at Buansa in 1457 founds the Sultanate of Sulu and binds the warrior nobility of the southern islands to the Hashemite genealogy and Sunni faith."
 nd_mro_kris_metallurgy: "Kris and Kalis Metallurgy"
 nd_mro_kris_metallurgy_desc: "The wavy-bladed kris and longer kalis are forged in the workshops of Mindanao with techniques passed from Java and Sulawesi -- pamor patterns hammered from layered iron, blades blessed by panditas, hilts inlaid with silver and ivory."
 nd_mro_datu_oath: "The Datu's Oath"
 nd_mro_datu_oath_desc: "The pre-Islamic system of datu, rajah, and timawa is fused with the new Sultanate. Each datu retains his retainers and his lands, but swears fealty to the Sultan-Caliph at the foundation of every reign."
 nd_mro_balangay_seafarers: "The Balangay Seafarers"
 nd_mro_balangay_seafarers_desc: "The plank-built balangay, ancestor of the vinta, has crossed the Sulu Sea since before recorded history. Its successors carry Moro warriors to every coast within a thousand leagues of Mindanao."
 nd_mro_pandita_schools: "Pandita Schools"
 nd_mro_pandita_schools_desc: "The pandita teaches Quran and law in his open-walled school. Around him gather the children of datus and slaves alike; from him come the next generation of clerks, judges, and imams of the Moro nation."
 nd_mro_vinta_fleets: "The Vinta Fleets"
 nd_mro_vinta_fleets_desc: "Lateen-rigged outrigger warships armed with deck-mounted lantakas. Faster than any Spanish galleon, harder to catch than any Dutch frigate. The vinta is the cornerstone of Moro maritime power."
 nd_mro_kalis_warriors: "Kalis Warriors"
 nd_mro_kalis_warriors_desc: "The wavy-bladed kalis is wielded by every Moro warrior of standing. In boarding actions and forest skirmishes alike, its serpentine edge inflicts wounds that resist healing."
 nd_mro_iranun_raiders: "The Iranun Raiders"
 nd_mro_iranun_raiders_desc: "The Iranun datus of the Illana Bay have raided since the Spaniards first set foot on Cebu. Their fleets range from Borneo to the Visayas, taking slaves, plunder, and reputation."
 nd_mro_kuta_fortifications: "Kuta Stockades"
 nd_mro_kuta_fortifications_desc: "The kuta is a ringed wooden stockade defended by lantakas, ditches, and bamboo spikes. Kuta Watu and dozens like it have stood against Spanish artillery for centuries."
 nd_mro_sultan_kudarat: "The Reign of Sultan Kudarat"
 nd_mro_sultan_kudarat_desc: "Muhammad Dipatuan Kudarat (r. 1619-71), the greatest sultan Mindanao has ever produced -- ruler of nine modern provinces, defender of the southern islands, the man whose name is still invoked when the Moro speak of resistance."
 nd_mro_lantaka_foundries: "Lantaka Foundries"
 nd_mro_lantaka_foundries_desc: "Bronze swivel guns cast in Maguindanao and Sulu workshops. The lantaka arms every vinta and kuta, and serves as currency in inter-datu marriages and tributes."
 nd_mro_sulu_brunei_axis: "The Sulu-Brunei Axis"
 nd_mro_sulu_brunei_axis_desc: "Royal marriages bind Sulu, Maguindanao, and Brunei into a single Islamic dynastic web stretching from northern Borneo to Mindanao. Tribute, trade, and shared genealogies hold the alliance together."
 nd_mro_court_administration: "The Sultan's Diwan"
 nd_mro_court_administration_desc: "The Sultan-Caliph receives datus, ambassadors, panditas, and ulama in a court patterned on the great diwans of the Islamic world. Decrees are recorded in Arabic and Tausug; embassies arrive from Aceh, Brunei, and the Mughal coast."
 nd_mro_pansacan_corsairs: "Pansacan Corsair Fleets"
 nd_mro_pansacan_corsairs_desc: "Organized squadrons of vintas under the Iranun and Samal datus dominate the Celebes Sea. They blockade Spanish ports, intercept Dutch shipping, and turn the strait between Mindanao and Borneo into a Moro highway."
 nd_mro_kampilan_warriors: "The Kampilan Bearers"
 nd_mro_kampilan_warriors_desc: "The two-handed kampilan, sword of the Maguindanao golden age, is wielded by elite shock troops in the Sultan's standing companies. Its weight crushes through helmets; its length keeps Spanish pikemen at bay."
 nd_mro_pearl_trade: "The Sulu Pearl Trade"
 nd_mro_pearl_trade_desc: "The pearl banks of Tawi-Tawi and Jolo yield gems that reach Beijing, Mecca, and Amsterdam. Sulu pearls are an instrument of Moro diplomacy and the fortune of the Tausug datus."
 nd_mro_madrasah_network: "The Madrasah Network"
 nd_mro_madrasah_network_desc: "Stone-walled madrasahs in every major Moro town teach Arabic, fiqh, and the chronicles of Islam. Graduates serve as judges, ambassadors, and panditas across the southern islands."
 nd_mro_garay_corsairs: "Garay Corsair Warships"
 nd_mro_garay_corsairs_desc: "The garay is the great Iranun raid warship of the late Sulu Zone -- larger than the vinta, carrying a dozen lantakas, oar-driven for windless conditions, designed for plunder and prisoner-taking on the great seasonal raids."
 nd_mro_juramentado: "The Way of the Juramentado"
 nd_mro_juramentado_desc: "The juramentado has sworn before the imam to die in jihad. He attacks alone or in small bands, kalis in hand, knowing he will not return. He is the answer of the Moro people to three centuries of colonial war."
 nd_mro_cotta_fortresses: "Cotta Stone Fortresses"
 nd_mro_cotta_fortresses_desc: "The cotta is the great stone fortress of the late Moro wars: walled, banner-flying, lantaka-armed citadels where the Sultan's banner flies long after the colonizer thinks the war is won."
 nd_mro_pearl_divers: "Tawi-Tawi Pearl Diveries"
 nd_mro_pearl_divers_desc: "Organized diving fleets of Sama-Bajau and Tausug divers harvest the great pearl banks. Their work, dangerous and underpaid, fuels the wealth of the late Sultanate and feeds the Sulu Zone economy."
 nd_mro_sulu_zone: "The Sulu Zone Economy"
 nd_mro_sulu_zone_desc: "At its height the Sulu Zone is the largest slaving and raiding economy in maritime Southeast Asia. Vinta and garay fleets harvest captives, pearls, and forest products from a thousand miles of coast and trade them to Canton, Batavia, and Manila."
 nd_mro_long_jihad: "The Long Jihad"
 nd_mro_long_jihad_desc: "Three centuries of colonial war have not broken the Moro. They fight on, in the kuta, in the cotta, in the back-country, in the jungle, in the way of the juramentado. The colonizer's empire rises and falls; the green banner remains."
 nd_mro_pan_moro_unity: "Pan-Moro Unity"
 nd_mro_pan_moro_unity_desc: "Tausug, Maguindanao, Iranun, Maranao, Sama-Bajau, and Yakan recognize themselves as one people, the Bangsa Moro, bound by faith, by the kalis, by the vinta, and by three centuries of shared resistance."

 nd_mro_steam_corsairs: "Steam-Powered Corsairs"
 nd_mro_steam_corsairs_desc: "The Moro shipwrights of Sandakan and Maimbung adopt the small steam launch as a successor to the vinta. Steam-driven raid craft, faster than any sail, harder to escape than any oared garay, carry the long jihad into the age of coal."
 nd_mro_bangsa_moro: "The Bangsa Moro"
 nd_mro_bangsa_moro_desc: "Tausug, Maguindanao, Maranao, Iranun, Sama-Bajau, Yakan, Sangil, Jama Mapun, Kalagan, Kalibugan, Palawani, Molbog, and Sangir all recognize themselves as one nation -- the Bangsa Moro, the Moro people, the southern alternative to colonial imposition that has lasted three centuries and will not break."

# === BUILDINGS ===
 nd_mro_kris_foundry: "Kris Foundry"
 nd_mro_kris_foundry_desc: "Traditional smithing workshop where layered iron is hammered into the wavy-bladed kris and longer kalis. Each blade carries the pamor pattern of its smith and the blessings of the pandita."
 nd_mro_kuta: "Kuta"
 nd_mro_kuta_desc: "Ringed wooden stockade defended by lantakas, ditches, and bamboo spikes. The kuta is the workhorse fortification of the southern islands -- cheaper than stone, faster to build, and remarkably resistant to colonial artillery in tropical terrain."
 nd_mro_lantaka_foundry: "Lantaka Foundry"
 nd_mro_lantaka_foundry_desc: "Bronze foundry casting the lantaka swivel-gun. Lantakas arm every vinta and every kuta, and serve as currency, dowry, and tribute among the datus."
 nd_mro_diwan: "Sultan's Diwan"
 nd_mro_diwan_desc: "The court of the Sultan-Caliph, patterned on the great diwans of the Islamic world. Datus, ambassadors, panditas, and ulama gather here; decrees are recorded in Arabic and Tausug."
 nd_mro_madrasah: "Mosque-Madrasah"
 nd_mro_madrasah_desc: "Stone-walled mosque and Quranic school in one. Children of datu and slave alike learn Arabic, fiqh, and the chronicles of Islam under the pandita's tutelage."
 nd_mro_cotta: "Cotta"
 nd_mro_cotta_desc: "Great stone fortress of the late Moro wars: walled, banner-flying, lantaka-armed. Where the kuta defies the colonizer's artillery, the cotta defies his armies."
 nd_mro_pearl_diver_camp: "Pearl Divers' Camp"
 nd_mro_pearl_diver_camp_desc: "Organized diving fleet of Sama-Bajau and Tausug divers working the pearl banks of Tawi-Tawi, Jolo, and the Sulu Archipelago."

# === BUILDING PRODUCTION METHODS ===
 nd_mro_kris_smithing: "Kris Smithing"
 nd_mro_kris_smithing_desc: "Hammered-pattern smithing of the wavy-bladed kris, the warrior's blade of every datu's house."
 nd_mro_kalis_blades: "Kalis Forging"
 nd_mro_kalis_blades_desc: "Forging of the longer kalis, the great wavy sword of the Moro warrior nobility."
 nd_mro_kris_foundry_maintenance: "Foundry Upkeep"
 nd_mro_kris_foundry_maintenance_desc: "Iron, charcoal, and timber for the smithing fires; tools for the smiths who keep the foundry running."
 nd_mro_kuta_garrison: "Kuta Garrison"
 nd_mro_kuta_garrison_desc: "Lumber to repair the stockade, weapons for the watchmen, and rice and fish to feed them."
 nd_mro_bronze_lantaka: "Bronze Lantaka Casting"
 nd_mro_bronze_lantaka_desc: "Casting of bronze swivel-guns from copper and iron, each lantaka sized to the vinta or the kuta wall it will defend."
 nd_mro_lantaka_foundry_maintenance: "Foundry Upkeep"
 nd_mro_lantaka_foundry_maintenance_desc: "Copper and iron for the molds, charcoal for the furnaces, and tools for the casters."
 nd_mro_diwan_court: "The Sultan's Court"
 nd_mro_diwan_court_desc: "Paper for decrees, fine cloth for ceremonies, tea and incense for the audience hall."
 nd_mro_madrasah_lessons: "The Pandita's Lessons"
 nd_mro_madrasah_lessons_desc: "Paper for the students, incense for the prayers, and fine cloth for the imam's robes."
 nd_mro_cotta_garrison: "Cotta Garrison"
 nd_mro_cotta_garrison_desc: "Weapons, masonry, and lumber for repair; rice and fish to sustain the long siege."
 nd_mro_pearl_harvest: "Pearl Harvest"
 nd_mro_pearl_harvest_desc: "Diving boats supplied with iron knives and naval rigging; fish to sustain the divers in the long days at the banks."
 nd_mro_pearl_camp_maintenance: "Camp Upkeep"
 nd_mro_pearl_camp_maintenance_desc: "Fish, lumber, and naval supplies to keep the diving fleet at sea."

# === UNITS ===
 n_nd_mro_vinta: "Vinta"
 n_nd_mro_vinta_desc: "Lateen-rigged outrigger warship armed with deck-mounted lantakas. Faster than any Spanish galleon, harder to catch than any Dutch frigate -- the cornerstone of Moro maritime power."
 n_nd_mro_garay: "Garay"
 n_nd_mro_garay_desc: "Great Iranun raid warship of the late Sulu Zone: larger than the vinta, oar-driven for windless conditions, carrying a dozen lantakas and a boarding party of kalis warriors."
 a_nd_mro_balangay_warriors: "Balangay Warriors"
 a_nd_mro_balangay_warriors_desc: "Coastal levy raised for raids and shore defense -- crews of the balangay, ancestor of the vinta, who fight on land as well as at sea."
 a_nd_mro_kalis_warriors: "Kalis Warriors"
 a_nd_mro_kalis_warriors_desc: "Moro warrior-nobles bearing the wavy-bladed kalis. In melee and on boarding actions their blades inflict wounds that resist healing -- the kalis is feared across maritime Southeast Asia."
 a_nd_mro_kampilan_warriors: "Kampilan Bearers"
 a_nd_mro_kampilan_warriors_desc: "Elite shock infantry wielding the two-handed kampilan, sword of the Maguindanao golden age. The kampilan crushes through helmets and clears the line for the kris-bearers behind."

 a_nd_mro_iranun_raiders: "Iranun Raiders"
 a_nd_mro_iranun_raiders_desc: "Coastal pirate-warriors of Illana Bay -- crews of vinta and garay who fight equally well as land levies, fast across coastal terrain and devastating on plunder raids."
 levy_nd_mro_iranun_raiders: "Iranun Raiders"
 levy_nd_mro_iranun_raiders_desc: "Coastal raid-levy from Illana Bay; fast, plunder-driven, and equally at home on land and sea."
# === LEVIES ===
 levy_nd_mro_balangay_warriors: "Balangay Warriors"
 levy_nd_mro_balangay_warriors_desc: "Coastal raid-fleet crews who fight equally well on land and at sea."
 levy_nd_mro_kalis_warriors: "Kalis Warriors"
 levy_nd_mro_kalis_warriors_desc: "Moro warrior-nobles raised for melee under the green banner."
 levy_nd_mro_kampilan_warriors: "Kampilan Bearers"
 levy_nd_mro_kampilan_warriors_desc: "Elite kampilan-bearing shock infantry of the Maguindanao golden age."

# === EVENT VARIABLE TOOLTIPS ===
 nd_mro_formed_tt: "Has formed the Moro Sultanate."
 nd_mro_path_a_tt: "Sultan-Caliph path: centralized Islamic monarchy."
 nd_mro_path_b_tt: "Confederation of Datus path: federal warrior nobility."
 nd_mro_path_c_tt: "Sword and Sail path: maritime jihad."

# === DESTINY TREE ===
 nd_mro_destiny: "The Banner of the Sultan-Caliph"
 nd_mro_destiny_desc: "The Moro polity is proclaimed: one Sultan, one banner, one ummah from Sulu to Surigao. The pandita read the khutba in the Sultan's name; the datus kiss the green flag at every harbour. The destiny of the Bangsa Moro is now to be chosen.\n\n#bold Requires:#! 75 stability."

# Path A: Sword of the Caliph
 nd_mro_dest_juramentado_corps: "The Juramentado Corps"
 nd_mro_dest_juramentado_corps_desc: "Standing companies of jurat-sworn warriors are raised and trained from boyhood. The kris is unsheathed in the Visayas; the Sulu vinta strikes at the Brunei coast. The southern islands learn the cost of crossing the Moro nation.\n\n#bold Requires:#! Sword and Sail destiny path; own Cebu (Singhapala); own Brunei (Berune); 30 army size."
 nd_mro_dest_lantaka_armada: "The Lantaka Armada"
 nd_mro_dest_lantaka_armada_desc: "The vinta and garay fleets patrol from Maluku to Sabah. Lantaka batteries close the Sulu and Celebes seas to colonial shipping. The Sultan-Caliph's banner flies over the spice approaches.\n\n#bold Requires:#! Own Ternate; own Brunei (Api Api); own Sandakan; 50 army size."
 nd_mro_dest_sulu_caliphate: "The Caliphate of the Southern Seas"
 nd_mro_dest_sulu_caliphate_desc: "Manila has fallen. Tondo prays five times a day. Gowa kneels to the Sultan-Caliph. The colonial age has been answered with sword and sail, and the southern seas are a Moro lake at last. Unlocks the Juramentado Brotherhood.\n\n#bold Requires:#! Own Maynila; own Tondo; own Gowa; 3000 gold."

# Path B: Sultan and Pandita
 nd_mro_dest_sharia_codification: "The Codification of Sharia"
 nd_mro_dest_sharia_codification_desc: "The qadi assemble in the Sultan's diwan. The fiqh of the southern islands is set down in writing for the first time, drawn from Shafi'i jurisprudence and Tausug custom alike. The legalist age of the Moro polity begins.\n\n#bold Requires:#! Sultan-Caliph destiny path; embraced Legalism; 1000 gold; 50 prestige."
 nd_mro_dest_pan_islamic_trade: "The Pan-Islamic Trade Network"
 nd_mro_dest_pan_islamic_trade_desc: "Moro pearl, beeswax, and tortoise-shell reach Aceh, Malacca, and Brunei. The Sultan's writ runs from the Sulu Sea to the Strait of Malacca, binding the Islamic trade circuits of maritime Southeast Asia under one banner.\n\n#bold Requires:#! Own Malacca; own Bandar Aceh; own Brunei (Berune); 2000 gold."
 nd_mro_dest_madrasah_civilization: "The Civilization of the Pandita"
 nd_mro_dest_madrasah_civilization_desc: "The southern islands have become a beacon of Sunni civilization. Madrasahs in every town, qadi in every diwan, ulama trained in Mecca returning to teach in Cotabato and Jolo. From Palembang of Sumatra to Demak of Java, the great Islamic seats of maritime Asia answer to one Caliph.\n\n#bold Requires:#! Own Palembang; own Demak; 75 prestige; 3000 gold. Unlocks the Grand Mosque."

# === DESTINY EVENT 7: ROOT ===
 nd_mro.7.t: "The Banner Unfurled"
 nd_mro.7.d: "On the steps of the Sultan's diwan, the green banner of the Moros is unfurled before the assembled datus, panditas, ulama, and ambassadors of the southern islands. The shahada is recited; the kris are kissed; the Sultan's name is proclaimed in the friday khutba from Maimbung to Lake Lanao.\n\nThe path of the Moro nation is now in the Sultan's hand, and the destiny of the Bangsa Moro is open to choose."
 nd_mro.7.a: "The banner has been raised."

# === DESTINY EVENT 8: PATH A STAGE 1 ===
 nd_mro.8.t: "The Juramentado Corps"
 nd_mro.8.d: "In the courtyard of the great kuta of Maimbung, the imam binds the loins of the first hundred. They have shaved their heads, made the wudu, and sworn before Allah and the Sultan to die in jihad rather than break ranks.\n\nThe diwan debates the corps's mission. Some demand a kris brotherhood drilled for the close-quarters shock that broke the Spanish at Lamitan. Others demand vinta corsair-juramentado, sworn to die in the boarding action against the colonial galleons. The Sultan's hand will weight the doctrine."
 nd_mro.8.a: "Train the kris brotherhood -- close-quarters shock"
 nd_mro.8.b: "Train the vinta corsair-juramentado -- naval boarding"

# === DESTINY EVENT 9: PATH A STAGE 2 ===
 nd_mro.9.t: "The Armada Takes the Inland Seas"
 nd_mro.9.d: "From the foundries of Maguindanao the lantakas come down by the hundreds. From the wharves of Sulu the vinta squadrons sail in fleets of forty. The Spanish galleon and the Dutch frigate are turned back at Ternate; the Brunei perahu falls in line at Sandakan. The southern seas are a Moro lake.\n\nThe Sultan's diwan debates the use to which this armada should be put. The Iranun datus call for the great raid -- a generation of plunder reaching to Mindoro and Borneo's western coast. The royal admiralty calls for the great blockade -- the closing of the Maluku spice approaches against every European flag."
 nd_mro.9.a: "Loose the Iranun corsairs upon the Visayas and Borneo."
 nd_mro.9.b: "Close the Maluku approaches in royal blockade."
 STATIC_MODIFIER_NAME_nd_mro_dest_armada_corsairs: "The Iranun Armada"
 STATIC_MODIFIER_DESC_nd_mro_dest_armada_corsairs: "The corsair fleets range from Mindoro to Borneo, taking slaves, silver, and reputation. Moro warbands move with the tides, supplied by raid and tribute, and earn fame in every campaign."
 STATIC_MODIFIER_NAME_nd_mro_dest_spice_blockade: "The Maluku Blockade"
 STATIC_MODIFIER_DESC_nd_mro_dest_spice_blockade: "Pearls and spice flow into the Sultan's coffers as the European companies are turned away from Ternate. The blockade enriches the treasury and bends the great powers to the negotiating table -- though the masons and carpenters of the home islands are pulled to the war yards."

# === DESTINY EVENT 10: PATH A STAGE 3 (CAPSTONE) ===
 nd_mro.10.t: "The Caliphate of the Southern Seas"
 nd_mro.10.d: "Manila has fallen to the kalis. Tondo's bells are silent; the friday khutba is read from the cathedral pulpit of the conquistadors. Gowa kneels. Brunei renews her oath. The Sultan-Caliph of the Moros is master of every shore from Sulawesi to Luzon.\n\nThe diwan now considers the form this dominion shall take. Some say the Moro nation must become a true caliphate -- a state of war and sharia, of disciplined corps and conquering armies, that shall not stop until every island flies the green banner. Others say the dominion is already won, and that the future lies in the ordered economy of the Sulu Zone -- a maritime imperium of pearls, slaves, and tributary trade."
 nd_mro.10.a: "Forge a true caliphate of sword and sharia."
 nd_mro.10.b: "Master the Sulu Zone economy at its peak."
 STATIC_MODIFIER_NAME_nd_mro_dest_southern_caliphate: "The Southern Caliphate"
 STATIC_MODIFIER_DESC_nd_mro_dest_southern_caliphate: "The Moro caliphate marches in disciplined corps. The military tactics of the kalis and kampilan are codified in the Sultan's manual; the besieger learns the kuta's ditch and the cotta's stone wall. The civil hand of the state is light, for the sword is the law."
 STATIC_MODIFIER_NAME_nd_mro_dest_corsair_empire: "The Sulu Zone at Peak"
 STATIC_MODIFIER_DESC_nd_mro_dest_corsair_empire: "Pearl, slave, beeswax, and forest product flow through the Sulu Zone in volumes never seen before. The treasury fills; the moneylenders of Canton offer their best rates. The southern islands grow rich on raid and trade -- but the conscience of the Muslim world looks askance at the chained captives in Jolo's market."

# === DESTINY EVENT 11: PATH B STAGE 1 ===
 nd_mro.11.t: "The Codification of Sharia"
 nd_mro.11.d: "The qadi gather under the Sultan's banner: scholars from Sulu, Maguindanao, Buayan, and Lake Lanao, each bringing his chronicles, his Shafi'i texts, and his customary law. For a year they argue.\n\nThe deeper question is theirs to settle: shall the new fiqh be pure Shafi'i orthodoxy, transplanted whole from the schools of Mecca, that the Moro nation may speak the same legal language as the wider ummah? Or shall it be a hybrid code that weaves the Quran and the Shafi'i school together with the customs of the datu, a Moro sharia answerable only to itself?"
 nd_mro.11.a: "Pure Shafi'i orthodoxy from Mecca"
 nd_mro.11.b: "A hybrid code blending Shafi'i with Tausug custom"

# === DESTINY EVENT 12: PATH B STAGE 2 ===
 nd_mro.12.t: "The Pan-Islamic Network"
 nd_mro.12.d: "Moro pearl reaches Mecca. Moro beeswax reaches Hadhramaut. Moro pilgrims, robed in the white ihram, walk the haram with hajjis from Aceh, Bengal, and the Mughal coast. The southern islands have entered the Indian Ocean Islamic world as full members.\n\nThe Sultan must choose how this network will be ordered. The merchant party calls for a hajj caravan system -- direct overland and overseas pilgrim routes, secured by tribute and treaty, drawing the wealth of the ummah through Maguindanao. The diplomatic party calls for a great compact with Aceh and Brunei -- a confederation of Sunni sultanates that shall stand against every Christian and Hindu power in the eastern seas."
 nd_mro.12.a: "Build the hajj caravans through Maguindanao."
 nd_mro.12.b: "Sign the Aceh-Sulu-Brunei compact."
 STATIC_MODIFIER_NAME_nd_mro_dest_hajj_caravans: "The Hajj Caravans"
 STATIC_MODIFIER_DESC_nd_mro_dest_hajj_caravans: "Pilgrim convoys move from Cotabato to Mecca and back along secured routes. Moro merchants ride with them; Moro coin is recognized in Aden and Surat; the Sultan's name is welcomed at every port of the ummah."
 STATIC_MODIFIER_NAME_nd_mro_dest_aceh_compact: "The Aceh Compact"
 STATIC_MODIFIER_DESC_nd_mro_dest_aceh_compact: "Aceh, Sulu, Brunei, and Maguindanao stand bound by a single compact: shared embassies, shared spies, shared shipwrights. No Christian power moves in the eastern seas without the Sultan-Caliph hearing of it."

# === DESTINY EVENT 13: PATH B STAGE 3 (CAPSTONE) ===
 nd_mro.13.t: "The Civilization of the Pandita"
 nd_mro.13.d: "The southern islands have become an Islamic civilization in their own right. Madrasahs stand in every town. The fiqh is taught in Tausug and Maguindanao Arabic alike. Pandita-judges arbitrate every dispute from Sandakan to Cebu. Pilgrims from Java and Brunei come north to study at Cotabato and Jolo.\n\nNow the Sultan-Caliph's diwan considers the apex of this civilization. Some hold that the future lies with the tariqa -- the Sufi brotherhoods that have penetrated even the most remote barrios, binding the Bangsa Moro through love and song. Others hold that the future lies with the legalists -- a Sultan-Solomon, ruling the southern seas in justice and order, the equal of any caliph in Islamic memory."
 nd_mro.13.a: "Empower the tariqa Sufi brotherhoods."
 nd_mro.13.b: "Reign as Sultan-Solomon, the legalist apex."
 STATIC_MODIFIER_NAME_nd_mro_dest_tariqa_brotherhood: "The Tariqa Brotherhoods"
 STATIC_MODIFIER_DESC_nd_mro_dest_tariqa_brotherhood: "Sufi orders penetrate every village. The dhikr is sung at every haflah; conversion proceeds not by sword but by song. The Bangsa Moro embraces a wider Islam, accommodating local custom -- though the legalist ulama complain of doctrinal looseness."
 STATIC_MODIFIER_NAME_nd_mro_dest_sultan_solomon: "Sultan-Solomon"
 STATIC_MODIFIER_DESC_nd_mro_dest_sultan_solomon: "The Sultan rules with the wisdom of Sulayman: every petition heard, every law enforced, every datu disciplined. The southern islands are governed as a single ordered realm. The civil discipline draws away from the martial; the kuta walls grow thinner as the diwan halls grow grander."

# === DESTINY BUILDINGS ===
 nd_mro_juramentado_brotherhood: "Juramentado Brotherhood"
 nd_mro_juramentado_brotherhood_desc: "Permanent chapterhouse of the jurat-sworn warriors. Boys are taken in young, trained for a decade in kalis and kampilan, and bound by oath to die before retreat. The brotherhood is the standing arm of the Sultan-Caliph and the terror of every colonial garrison."
 nd_mro_jurat_oath: "The Jurat Oath"
 nd_mro_jurat_oath_desc: "Weaponry and provisions for the brotherhood: kalis blades for every novice, kampilans for the corps, and the simple rations of the warrior in training."
 nd_mro_grand_mosque: "Grand Mosque"
 nd_mro_grand_mosque_desc: "The great congregational mosque of the southern islands. Its minaret rises over the Sultan's diwan; its mihrab points to Mecca; its friday khutba binds the Bangsa Moro into one ummah under one Sultan-Caliph."
 nd_mro_grand_mosque_upkeep: "The Mosque's Service"
 nd_mro_grand_mosque_upkeep_desc: "Fine cloth for the imam's robes, paper for the qadi's records, incense and beeswax for the friday prayers and the long nights of dhikr."

# ===== BUREAUCRACIES =====
 mro_ruma_bichara_bureaucracy: "Ruma Bichara"
 mro_ruma_bichara_bureaucracy_desc: "The advisory state council of the Sulu Sultanate (its Maguindanao counterpart called Bichara Atas), composed of the leading datus and resident sharifs. The Datu Raja Muda, Datu Maharaja Adenduk, Datu Ladja Laut, and other titled officers met in council; each held one vote, the Sultan two, and the Raja Muda two. Beyond advising, the Ruma Bichara elected the Sultan's heir-apparent from the male-line, which made it impossible for any sultan to disregard."

 mro_pandita_madrasah_bureaucracy: "Pandita Madrasah Network"
 mro_pandita_madrasah_bureaucracy_desc: "Islamic education organised through the houses of the pandita (Sanskrit-derived 'learned man') and the masjid, established across Mindanao and Sulu from the late thirteenth century onward by Arab missionaries. Every datu maintained his own pandita as religious advisor; together they constituted the Bangsa Moro ulama. Quranic instruction was conducted in pandita homes and mosques, producing the literate clerks the Sultan's chancery needed and policing the doctrinal cohesion that backed the Sultan-Caliph claim."

 mro_tarsila_chancery_bureaucracy: "Tarsila Chancery"
 mro_tarsila_chancery_bureaucracy_desc: "The keepers of the tarsila (from Arabic silsilah, 'chain'), the written genealogical records that traced the Sulu Sultans to Sayyid Abu Bakr and through him to the Prophet. Every leading datu kept his own tarsila; the Sultan's chancery curated the official lineages, validated rival claims, and arbitrated marriage alliances. Without these scrolls a claimant was just another raja; with them, he was the Caliph of the Southern Sea."

 mro_panglima_districts_bureaucracy: "Panglima District Administration"
 mro_panglima_districts_bureaucracy_desc: "The provincial reach of the Sultanate, organised under district panglima (the equivalent of mayors) who in turn governed barrio captains variously titled maharaja, orangkaya, and parukka. The panglima collected zakat and tribute, administered justice in the Sultan's name, and translated central edicts into local enforcement. When the offices became hereditary, however, panglima titles passed by inheritance and the barrio captains skimmed at every level."

 mro_parang_sabil_brotherhood_bureaucracy: "Parang Sabil Brotherhood"
 mro_parang_sabil_brotherhood_bureaucracy_desc: "The institution of the mag-sabil (Tausug: 'one who endures the pangs of death'), Moro warriors who took the Napi oath to die in the path of God against unbelievers. Candidates required parental consent and the Sultan's personal authorisation before being entrusted to imams for spiritual and martial preparation. The mag-sabil drew kris and barong against Spanish garrisons in attacks the Spanish themselves coined as 'juramentado' in 1876. When licensed by the Sultan it was the realm's most feared deterrent; when not, it became uncontrolled vendetta."

 mro_lanong_admiralty_bureaucracy: "Lanong Corsair Admiralty"
 mro_lanong_admiralty_bureaucracy_desc: "The naval establishment under the Datu Ladja Laut, which from roughly 1770 to 1870 launched between one and two hundred Iranun and Banguingui warships every year out of Maimbung, Malabang, and the Iranun coast. The lanong was a thirty-metre outrigger with up to three banks of oars and lantaka swivel-guns; the lighter garay raided faster. Captives sold at the Jolo and Tawi-Tawi markets supplied the labour force on which the Sultanate's economy substantially depended -- by the 1850s Bisaya captives may have made up half the population of Sulu."

# ===== AUTO-MODIFIER (slot grant on formation) =====
 AUTO_MODIFIER_NAME_nd_mro_bureaucracy_authority: "Sultanate Bureaucratic Authority"
 AUTO_MODIFIER_DESC_nd_mro_bureaucracy_authority: "Once the [MRO.GetName] is proclaimed, the Sultan-Caliph may host the historical institutions of the Bangsa Moro: the Ruma Bichara, the pandita network, the tarsila chancery, the panglima districts, the parang sabil brotherhood, and the lanong admiralty."

# ===== POLISH PASS: NEW MODIFIER LOC =====
 STATIC_MODIFIER_NAME_nd_mro_orthodox_fiqh: "Orthodox Shafi'i Fiqh"
 STATIC_MODIFIER_DESC_nd_mro_orthodox_fiqh: "The codified law of Mecca's Shafi'i school is transplanted whole to the southern islands. The qadi cite the same texts read in Cairo and Aceh; the imam preaches the same khutba; literacy in classical Arabic spreads through the ulama corps."
 STATIC_MODIFIER_NAME_nd_mro_sufi_tariqa: "Sufi Tariqa Brotherhoods"
 STATIC_MODIFIER_DESC_nd_mro_sufi_tariqa: "The Naqshbandi, Qadiri and Shadhili brotherhoods plant their saints in every major Moro town. Conversion happens through love rather than the sword, and the old anitist diwata are softened into Sufi pirs rather than denied outright."
 STATIC_MODIFIER_NAME_nd_mro_pandita_open: "Pandita Schools Open to All"
 STATIC_MODIFIER_DESC_nd_mro_pandita_open: "The slave's son sits beside the datu's at the pandita's mat. Talent rises where the throne could not predict; literacy reaches every barangay; the Moro corps of clerks, judges and ambassadors swells from beyond the noble line."
 STATIC_MODIFIER_NAME_nd_mro_pandita_elite: "Pandita Schools of the Lineages"
 STATIC_MODIFIER_DESC_nd_mro_pandita_elite: "Deep texts and the high jurisprudence are reserved for the datu and ulama lines. The Moro literati form a tighter, more disciplined caste; legitimacy and learning are bound to the noble inheritance."
 STATIC_MODIFIER_NAME_nd_mro_juramentado_sanctioned: "Sultan-Sworn Juramentado"
 STATIC_MODIFIER_DESC_nd_mro_juramentado_sanctioned: "The juramentado are sworn before the Sultan's imam, drilled in the kuta, and led by Sultan-appointed captains. Their oath binds them to throne and faith together; the diwan controls when they march."
 STATIC_MODIFIER_NAME_nd_mro_juramentado_folk: "Folk Juramentado of the Villages"
 STATIC_MODIFIER_DESC_nd_mro_juramentado_folk: "The juramentado swears before his village imam, beyond the throne's writ. The Sultan does not order him; the village does. Where the kuta falls and the diwan is silenced, the folk juramentado walks alone into the colonizer's camp, and the war goes on."
 STATIC_MODIFIER_NAME_nd_mro_dest_kris_brotherhood: "Kris Brotherhood Drilled"
 STATIC_MODIFIER_DESC_nd_mro_dest_kris_brotherhood: "Standing companies of kris- and kampilan-bearers train daily in the kuta courtyards. The wave-bladed close-quarters shock that broke Spanish lines at Lamitan is now a permanent doctrine of the Moro army."
 STATIC_MODIFIER_NAME_nd_mro_dest_corsair_juramentado: "Vinta Corsair-Juramentado"
 STATIC_MODIFIER_DESC_nd_mro_dest_corsair_juramentado: "The juramentado are taught the boarding action: kalis in hand, the leap from the lateen-rigged vinta onto the Spanish galleon's deck, the prayer recited as the colonial bullets begin. A naval doctrine of the willing dead."
 STATIC_MODIFIER_NAME_nd_mro_dest_shafii_orthodoxy: "Shafi'i Orthodoxy"
 STATIC_MODIFIER_DESC_nd_mro_dest_shafii_orthodoxy: "The new fiqh is pure Shafi'i, transplanted whole from Mecca. The Moro nation now speaks the same legal language as the wider ummah; the qadi cite the same texts in Sulu as in Cairo and Aceh."
 STATIC_MODIFIER_NAME_nd_mro_dest_hybrid_law: "Moro Sharia Code"
 STATIC_MODIFIER_DESC_nd_mro_dest_hybrid_law: "The new fiqh weaves the Quran and the Shafi'i school together with the customs of the datu. The Moro nation has its own sharia, answerable only to itself; legitimacy flows from the law as much as from the throne."
