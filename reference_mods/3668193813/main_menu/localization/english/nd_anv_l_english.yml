l_english:
 # === Formation Event ===
 nd_anv.1.t: "The Crown of Two Realms"
 nd_anv.1.d: "From the rough cliffs of Northumbria to the sun-warmed vineyards of the Garonne, the lions of the Plantagenets now reign over a single house of dominions. Henry's bequest, gathered by inheritance, marriage and conquest, defies every map of Christendom: an empire that knows no language and answers to no peer.\n\nYet the Angevin Empire is no kingdom in any received sense. London speaks the rough English of the Saxon shires; Rouen and Caen speak the langue d'oil of the Norman barons; Poitiers and Bordeaux sing in the Occitan of the troubadours; Angers obeys an angevin steward; Dublin and Wexford answer a Norman lord through Welsh marcher captains. To rule them all the King must choose how he shall rule.\n\nSome at court urge a kingdom of one law: the royal writ, the King's Bench, the Exchequer of Westminster reaching across the Channel — a crown that flattens custom into a single common right. Others, marshalled by the great barons of Normandy, Aquitaine and the Marches, urge a federation of fiefs: the King as the supreme suzerain among peers, his realm a tapestry of feudal courts, tournaments and homage given freely.\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_anv.1.a: "One king, one law, one writ across the Channel"
 nd_anv.1.b: "A confederacy of barons under a chivalric crown"

 # === Formation Static Modifiers ===
 STATIC_MODIFIER_NAME_nd_anv_common_law_crown: "Common Law of the Crown"
 STATIC_MODIFIER_DESC_nd_anv_common_law_crown: "Royal writs, justices in eyre and the Exchequer of Westminster bind the duchies into a single jurisdiction. Customs bow to the King's law."
 STATIC_MODIFIER_NAME_nd_anv_chivalric_confederation: "Chivalric Confederation"
 STATIC_MODIFIER_DESC_nd_anv_chivalric_confederation: "The King reigns as suzerain among magnates. Tournaments, oaths of homage and feudal hosts make the realm formidable in arms even as it remains a patchwork of custom."

 # === DHE Static Modifiers ===
 STATIC_MODIFIER_NAME_nd_anv_assize_clarendon: "Assize of Clarendon"
 STATIC_MODIFIER_DESC_nd_anv_assize_clarendon: "The royal courts circulate through the realm; juries of presentment reveal hidden malefactors. Order travels with the King's justices."
 STATIC_MODIFIER_NAME_nd_anv_constitutions_clarendon: "Constitutions of Clarendon"
 STATIC_MODIFIER_DESC_nd_anv_constitutions_clarendon: "Clergy who break the King's peace face the King's law. The crown asserts itself against the privileges of the Church."
 STATIC_MODIFIER_NAME_nd_anv_courts_of_love: "Courts of Love"
 STATIC_MODIFIER_DESC_nd_anv_courts_of_love: "Eleanor's court at Poitiers reshapes the manners of Christendom. Troubadours, romance and courtly love transform the chivalric ideal."
 STATIC_MODIFIER_NAME_nd_anv_great_charter: "The Great Charter"
 STATIC_MODIFIER_DESC_nd_anv_great_charter: "Runnymede has yielded a charter of liberties. The barons swear loyalty in exchange for written limits on royal arbitrariness."
 STATIC_MODIFIER_NAME_nd_anv_baronial_reaction: "Baronial Reaction"
 STATIC_MODIFIER_DESC_nd_anv_baronial_reaction: "The Crown holds firm against the barons' demands. Royal authority is preserved at the price of an aggrieved aristocracy."

 # === Advances: Age 1 Traditions ===
 nd_anv_exchequer_of_westminster: "Exchequer of Westminster"
 nd_anv_exchequer_of_westminster_desc: "The pipe rolls and the chequered cloth — Roger of Salisbury's exchequer turns royal accounts into the most sophisticated fiscal instrument in twelfth-century Europe."
 nd_anv_assize_courts: "Assize Courts and Royal Justices"
 nd_anv_assize_courts_desc: "Henry II's reforms send royal justices riding the realm. Disputes over land, homicide and theft now flow up to the crown rather than dissipating in seignorial halls."
 nd_anv_marcher_castles: "Marcher Castles"
 nd_anv_marcher_castles_desc: "The chains of stone keeps along the Welsh marches and the Norman frontier. Concentric fortification carried from the East by the Plantagenets and their Norman engineers."
 nd_anv_welsh_archers: "Welsh Archers in Royal Service"
 nd_anv_welsh_archers_desc: "The longbowmen of Gwent and Powys, kept on royal contract since the Welsh campaigns. The black-fletched arrows that pierced French mail at every Plantagenet field."
 nd_anv_norman_chivalry: "Norman Chivalry"
 nd_anv_norman_chivalry_desc: "Mounted men-at-arms in long mail hauberks, scions of the conquering Norman aristocracy. The shock arm of the Plantagenet host."
 nd_anv_forest_law: "Forest Law"
 nd_anv_forest_law_desc: "The royal forests — vast preserves under direct crown jurisdiction. Verderers, regarders and the harsh forest courts produce hated revenue and an unparalleled royal demesne."

 # === Advances: Age 2 Renaissance ===
 nd_anv_brabancons_routiers: "Brabançons and Routiers"
 nd_anv_brabancons_routiers_desc: "The Flemish and Lowland mercenary companies that fought for the highest Angevin bidder. Disciplined, professional, and feared — the standing edge of the Plantagenet army."
 nd_anv_gascon_crossbowmen: "Gascon Crossbowmen"
 nd_anv_gascon_crossbowmen_desc: "The crossbow militias of Bordeaux, Bayonne and the Gascon ports. Foot crossbowmen who shielded the wine fleets and held the southern marches."
 nd_anv_courtly_love: "Courtly Love and the Troubadours"
 nd_anv_courtly_love_desc: "Eleanor of Aquitaine's court at Poitiers — Marie de France, Bernart de Ventadorn, Chrétien de Troyes. The chivalric romance refined and exported across Christendom."
 nd_anv_winchester_assize: "Assize of Arms"
 nd_anv_winchester_assize_desc: "The Assize of Arms of 1181 — every freeman to be equipped according to his estate. The basis of a national militia three centuries before any peer."
 nd_anv_bordeaux_wine_trade: "Bordeaux Wine Trade"
 nd_anv_bordeaux_wine_trade_desc: "The fleets that carry Gascon claret from Bordeaux to London — a Channel-spanning trade that binds Aquitaine to the English crown by silver as much as by oath."
 nd_anv_cinque_ports: "Cinque Ports Confederation"
 nd_anv_cinque_ports_desc: "Hastings, Sandwich, Dover, Romney, Hythe — the towns sworn to provide ships for the King in exchange for charters of self-government. The Channel fleet by feudal contract."

 # === Advances: Age 3 Discovery ===
 nd_anv_charter_towns: "Charter Towns and Burgesses"
 nd_anv_charter_towns_desc: "Henry II and his sons grant borough charters across the realm. Self-governing communes of merchants under royal protection — the seedbed of urban liberty."
 nd_anv_long_bowmen: "Massed Longbow Tactics"
 nd_anv_long_bowmen_desc: "The doctrine of arrow storms over advancing cavalry — practised at Falkirk, perfected at Crécy. The disciplined longbow archer in deep ranks."
 nd_anv_aquitanian_estates: "Estates of Aquitaine"
 nd_anv_aquitanian_estates_desc: "Customary parlements of Bordeaux, Poitiers and Saintes, where Gascon nobles, prelates and townsmen consented to ducal taxation. A constitutional precedent."
 nd_anv_chancellors_writ: "The Chancellor's Writ"
 nd_anv_chancellors_writ_desc: "The standardised royal writ runs throughout England and the duchies. The bureaucracy of the King's Chancery becomes the spine of trans-Channel governance."
 nd_anv_anglo_norman_ships: "Cogs of the Angevin Channel"
 nd_anv_anglo_norman_ships_desc: "The clinker-built Channel cogs of Sandwich and Rouen — the workhorses of a thalassocratic merchant marine, carrying English wool, Gascon wine and Norman herring."
 nd_anv_writ_of_summons: "Writ of Summons"
 nd_anv_writ_of_summons_desc: "Magnates summoned by name to attend the King's council. The seed of a parliamentary tradition that would outlive the Angevin polity itself."

 # === Advances: Age 4 Reformation ===
 nd_anv_anglo_norman_law_schools: "Anglo-Norman Law Schools"
 nd_anv_anglo_norman_law_schools_desc: "The Inns of Court and the law faculties of Caen and Angers — a cross-Channel jurisprudence taught in Latin and Anglo-Norman, training the magistrates of two crowns."
 nd_anv_calais_staple: "The Wool Staple"
 nd_anv_calais_staple_desc: "All raw English wool funnelled through a single royal staple, sealed and taxed before reaching the looms of Flanders. The crown's most lucrative monopoly."
 nd_anv_garrisons_pale: "Garrisons of the Pale"
 nd_anv_garrisons_pale_desc: "Marcher captains and royal garrisons hold the Lordship of Ireland, the Welsh principality and the Norman frontier as a chain of fortified districts under viceroys."
 nd_anv_great_council: "The Great Council"
 nd_anv_great_council_desc: "The magnum concilium of magnates and prelates — the standing Angevin advisory body that, in time, gives birth to Parliament and the Estates-General both."

 # === Advances: Age 5 Absolutism ===
 nd_anv_admiralty_at_arms: "Admiralty at Arms"
 nd_anv_admiralty_at_arms_desc: "The unified Plantagenet admiralty — Channel squadrons, Bay of Biscay convoys, Irish Sea patrols. A single navy for two kingdoms separated by salt water."
 nd_anv_garde_du_roi: "Garde du Roi"
 nd_anv_garde_du_roi_desc: "The royal household troops — gentlemen pensioners, yeomen of the guard, household cavalry. A standing core of professional soldiers loyal to the crown alone."
 nd_anv_two_jurisdictions: "Two Jurisdictions, One Crown"
 nd_anv_two_jurisdictions_desc: "English common law in the island, written civil law in the duchies — a deliberate asymmetric jurisprudence that respects custom while preserving sovereign integrity."
 nd_anv_atlantic_woollens: "Atlantic Woollens"
 nd_anv_atlantic_woollens_desc: "English broadcloth woven, fulled and dyed at home, no longer exported raw. The vertical integration of the Plantagenet textile economy."

 # === Advances: Age 6 Revolutions ===
 nd_anv_redcoat_drill: "Redcoat Drill"
 nd_anv_redcoat_drill_desc: "The drilled musket-and-bayonet line in scarlet — the disciplined volley fire of the Angevin regulars, redoubled by Anglo-Norman officer schools."
 nd_anv_rule_at_sea: "Rule at Sea"
 nd_anv_rule_at_sea_desc: "Wooden walls of the Channel, Atlantic and Mediterranean — the line-of-battle ship doctrine that makes the Angevin flag the master of three seas at once."
 nd_anv_constitutional_fusion: "Constitutional Fusion"
 nd_anv_constitutional_fusion_desc: "A bicameral assembly of lords and commons, sitting alternately in Westminster and Rouen, ratifies a written constitution binding crown, peerage and people."

 # === DHE Events ===
 nd_anv.2.t: "The Assize of Clarendon"
 nd_anv.2.d: "At the council of Clarendon Henry has summoned bishops, barons and royal justices to a hunting lodge in Wiltshire. The chequered cloth of the Exchequer is unrolled. Justices in eyre are commissioned to ride the realm — to inquire by sworn juries of presentment into hidden murders, robberies and the receivers of malefactors. From this hour forward, the law of the King flows where the King's writ runs.\n\nFor a generation no royal court has reached so deep into the shires; for a century no royal justice has bound the duchies of the continent into a single jurisprudence. The judges depart for their circuits before the candles burn out."
 nd_anv.2.a: "Let the King's law ride into every shire"

 nd_anv.3.t: "The Constitutions of Clarendon"
 nd_anv.3.d: "Henry has summoned his bishops to set in writing the customs of his grandfather's reign. The Constitutions return to crown the trial of clerks who commit felony, the appeal of bishops to Rome only by royal leave, the King's voice in the election of prelates. Thomas Becket has affixed his seal — and then taken it back.\n\nThe quarrel between altar and throne is an old one in Latin Christendom, but no king before Henry has dared to codify the privileges of the crown so plainly against the immunities of the Church. Where now lies the King's edge?"
 nd_anv.3.a: "Press the crown's writ — the King makes prelates as he makes earls"
 nd_anv.3.b: "Strike a concordat — the King who wins the Church wins all"
 STATIC_MODIFIER_NAME_nd_anv_clarendon_press: "Erastian Crown"
 STATIC_MODIFIER_DESC_nd_anv_clarendon_press: "The crown asserts itself over the prelacy. Bishops are royal officers in mitre."
 STATIC_MODIFIER_NAME_nd_anv_clarendon_concord: "Concordat of Clarendon"
 STATIC_MODIFIER_DESC_nd_anv_clarendon_concord: "King and Church speak with one voice. The clergy preach for the crown."

 nd_anv.4.t: "The Court at Poitiers"
 nd_anv.4.d: "Eleanor — Queen of England, Duchess of Aquitaine, Countess of Poitou — has taken her household to her own city of Poitiers. About her gather the troubadours of the south: Bernart de Ventadorn, the polished Marie de France, the young Chrétien de Troyes. They sing of #italic fin amor#! — of an exalted, almost ritual love between knight and lady that subordinates feudal violence to courtly grace.\n\nThe knightly culture of Poitiers will travel back across the Channel with the Queen's chamberlains and minstrels. From this court will come the cycle of Arthur and the Holy Grail, the rules of the tournament, the very vocabulary of romance. The world of feudal Christendom is being courteously remade."
 nd_anv.4.a: "Refine our chivalry — knighthood as the Queen would have it"

 nd_anv.5.t: "Runnymede"
 nd_anv.5.d: "On the meadow at Runnymede, between Windsor and Staines, the King has met the assembled barons of the realm in arms. After Bouvines and the loss of Normandy the magnates will be forced no longer; they have drawn up a charter of liberties — sixty-three clauses guaranteeing baronial counsel, the privileges of the Church, the customs of London, the freedom of merchants and the lawful judgment of peers.\n\nWill the crown grant the charter, accept the limits of its prerogative and bind the magnates to faith? Or will it stake everything on royal arms, stand against the demand and put the empire to the test of war?"
 nd_anv.5.a: "Set the seal at Runnymede"
 nd_anv.5.b: "Reject the charter — the crown is its own measure"

 nd_anv.6.t: "The Battle of the Channel"
 nd_anv.6.d: "Off the cliffs of the South Foreland, the Angevin fleet of the Cinque Ports has met the foe in the narrow sea. Cogs of Sandwich and Hythe, sails black against the autumn sky, drive the longships of the enemy into the white surf of the chalk. The Channel henceforth belongs to the Angevin admiral.\n\nNo king of the West has held both shores of the narrow sea since the Romans. Now the salt water that once divided the Plantagenet realm becomes its inland highway."
 nd_anv.6.a: "Master the Channel — let the wool fleets sail unmolested"

 nd_anv.7.t: "The Wool Staple at Calais"
 nd_anv.7.d: "By royal proclamation, no fleece of English wool may pass to the looms of Flanders save through the King's staple. Sealed bales are taxed at the staple's chequer; the price of wool is set by the King's merchants; the crown's revenue from wool exceeds, in good years, all other royal income put together.\n\nThe Flemish weavers grumble. The Italian bankers extend further credit on the security of the staple. The English clothiers begin, slowly, to weave their wool at home. The Plantagenet purse has rarely been so heavy."
 nd_anv.7.a: "The wool of England, the silver of Flanders"

 # === Custom Buildings ===
 nd_anv_exchequer_hall: "Exchequer Hall"
 nd_anv_exchequer_hall_desc: "The chequered cloth, the pipe rolls and the writs of summons. Royal accounts are calculated by counters on a chequered table; sheriffs render their farms before the King's barons twice a year."
 nd_anv_concentric_castle: "Concentric Castle"
 nd_anv_concentric_castle_desc: "Concentric walls, mural towers, postern gates and a great donjon — the Plantagenet castle as perfected at Dover, Château Gaillard and Beaumaris. The most formidable fortifications in twelfth-century Europe."
 nd_anv_assize_court: "Assize Court"
 nd_anv_assize_court_desc: "A royal hall where the King's justices in eyre hear pleas of land, of homicide and of trespass. The crown's justice, brought to the shire by writ and seal."
 nd_anv_chivalric_tournament_field: "Chivalric Tournament Field"
 nd_anv_chivalric_tournament_field_desc: "The lists, the pavilions, the heralds in tabards. A licensed tournament ground where the chivalry of the realm trains in arms and competes for honour and ransom."
 nd_anv_chartered_borough: "Chartered Borough"
 nd_anv_chartered_borough_desc: "A self-governing town under royal charter, with its own merchant guild, court of pie-powder and farm of the borough. Burgesses pay the crown directly in lieu of seignorial dues."
 nd_anv_gascon_winery: "Gascon Winery"
 nd_anv_gascon_winery_desc: "The vineyards of the Garonne and Dordogne — Bordeaux, Saint-Émilion, Cahors. Claret and red wine pressed for the English Channel market and the courts of Western Christendom."
 nd_anv_cinque_port_yard: "Cinque Port Yard"
 nd_anv_cinque_port_yard_desc: "A chartered port of the Cinque Ports confederation, sworn to provide cogs and crews to the King in exchange for self-government and a court of admiralty."
 nd_anv_anglo_norman_law_school: "Anglo-Norman Law School"
 nd_anv_anglo_norman_law_school_desc: "An inn of court or law faculty teaching the common law of England and the customary law of Normandy in parallel. Magistrates of the Plantagenet dual realm trained under one roof."

 # === PM Loc ===
 nd_anv_exchequer_upkeep: "Pipe Roll Accounting"
 nd_anv_exchequer_upkeep_desc: "Counters, pipe rolls, parchment, wax and the salaries of clerks of the chequer."
 nd_anv_concentric_castle_upkeep: "Castle Garrison Maintenance"
 nd_anv_concentric_castle_upkeep_desc: "Stone for repair, weaponry for the watch, food for the garrison and salaries for constables and serjeants."
 nd_anv_assize_court_upkeep: "Assize Court Sittings"
 nd_anv_assize_court_upkeep_desc: "Wax for seals, paper for plea rolls, hospitality for the King's justices riding their circuit."
 nd_anv_tournament_upkeep: "Tournament Patronage"
 nd_anv_tournament_upkeep_desc: "Pavilions, banners, weaponry, fine cloth for surcoats and the heralds' livery — the upkeep of chivalric pageantry."
 nd_anv_chartered_borough_upkeep: "Borough Common Charges"
 nd_anv_chartered_borough_upkeep_desc: "The expenses of the burgesses' commune — paving, market regulation, watch and ward, and royal farm collection."
 nd_anv_gascon_wine_production: "Gascon Wine Vintage"
 nd_anv_gascon_wine_production_desc: "Pressing the Garonne grapes — wine for the Channel fleets and the courts of Christendom."
 nd_anv_cinque_port_yard_upkeep: "Yard Provisions and Cordage"
 nd_anv_cinque_port_yard_upkeep_desc: "Naval supplies, lumber and cordage for the cogs of the Cinque Ports squadron."
 nd_anv_law_school_upkeep: "Law School Stipendia"
 nd_anv_law_school_upkeep_desc: "Books, paper and the stipends of doctors of the common and customary laws."

 # === Custom Units ===
 a_nd_anv_welsh_archers: "Welsh Archers"
 a_nd_anv_welsh_archers_desc: "The longbowmen of Gwent and Powys, raised by Plantagenet contract. Their black-fletched yard-long arrows pierce mail and devastate cavalry charges."
 a_nd_anv_norman_chivalry: "Norman Knights"
 a_nd_anv_norman_chivalry_desc: "Mounted men-at-arms in long mail hauberks, descended from the Norman conquerors. The shock arm of the Plantagenet host."
 a_nd_anv_brabancons: "Brabançons"
 a_nd_anv_brabancons_desc: "Flemish and Brabantine mercenary infantry hired by the crown. Disciplined, professional and feared from Wales to Limousin."
 a_nd_anv_gascon_crossbowmen: "Gascon Crossbowmen"
 a_nd_anv_gascon_crossbowmen_desc: "The crossbow militias of Bordeaux, Bayonne and the Gascon ports. Disciplined urban infantry holding the southern marches."
 a_nd_anv_longbowmen: "Plantagenet Longbowmen"
 a_nd_anv_longbowmen_desc: "Massed longbow infantry trained under royal contract, the disciplined arrow storm of the Plantagenet host. The terror of French chivalry from Crécy onwards."
 a_nd_anv_household_cavalry: "Household Cavalry"
 a_nd_anv_household_cavalry_desc: "Gentlemen pensioners and yeomen of the guard — the King's standing household horse, mailed in the latest style and loyal to the crown alone."
 n_nd_anv_channel_cog: "Channel Cog"
 n_nd_anv_channel_cog_desc: "The clinker-built Channel cog of Sandwich and Rouen, broad of beam and tall of side. The workhorse of the Plantagenet merchant marine."
 n_nd_anv_great_ship: "Great Ship of the Line"
 n_nd_anv_great_ship_desc: "A first-rate ship of the line of the Angevin admiralty, broadside-armed and built to dominate the narrow seas and the Bay of Biscay."

 # === Levies ===
 levy_nd_anv_welsh_archers: "Welsh Archers"
 levy_nd_anv_welsh_archers_desc: "Longbow levy raised in the Welsh shires."
 levy_nd_anv_norman_chivalry: "Norman Knights"
 levy_nd_anv_norman_chivalry_desc: "Heavy cavalry levy from the Norman aristocracy of both shores of the Channel."
 levy_nd_anv_gascon_crossbowmen: "Gascon Crossbowmen"
 levy_nd_anv_gascon_crossbowmen_desc: "Urban crossbow levy from the Gascon ports and bastides."
 levy_nd_anv_longbowmen: "Plantagenet Longbowmen"
 levy_nd_anv_longbowmen_desc: "Trained massed longbow levy from the English shires."

 # === Variable tooltips ===
 nd_anv_formed_tt: "Angevin Empire formed"
 nd_anv_path_a_tt: "Path of Common Law of the Crown chosen"
 nd_anv_path_b_tt: "Path of Chivalric Confederation chosen"

 # === Age 6 industrial advance ===
 nd_anv_industrial_plantagenet: "Industrial Plantagenet"
 nd_anv_industrial_plantagenet_desc: "Iron of the Welsh marches, coal of the Black Country, water-powered mills along every river. The Plantagenet dominions enter the industrial age with iron and steam."

 # === Destiny Tree ===
 nd_anv_destiny: "The Plantagenet Long Path"
 nd_anv_destiny_desc: "The Crown of Two Realms is bound by inheritance, but its long destiny is not yet written. Will the Plantagenet realm turn west to the salt sea and the British Isles, or south and east into the heart of France? The choice made at formation now demands a programme."

 # Path A: Insular Atlantic Power
 nd_anv_dest_isles_pacified: "Pacification of the British Isles"
 nd_anv_dest_isles_pacified_desc: "The Common Law cannot reach where royal writ does not run. Bring Lothian and Munster within the Plantagenet jurisdiction — pacify Edinburgh and Cork, and bind the whole archipelago to a single crown."
 nd_anv_dest_narrow_seas: "Mistress of the Narrow Seas"
 nd_anv_dest_narrow_seas_desc: "Hold the Channel from the Cinque Ports to the Flemish coast: take Antwerp and Dunkirk, the two anchors of the cloth trade, and ensure that no fleet sails between them without paying the King of England's toll. Build the war chest and develop the realm's wealth."
 nd_anv_dest_atlantic_crown: "The Atlantic Crown"
 nd_anv_dest_atlantic_crown_desc: "Plant the leopards of England in the islands of the Atlantic. Take Madeira and the Azores, embrace the institutions of global trade, and raise an admiralty whose squadrons range the deep ocean from a Cinque-Ports nucleus to the Sargasso Sea."

 # Path B: Continental Plantagenet
 nd_anv_dest_lost_duchies: "Recover the Lost Duchies"
 nd_anv_dest_lost_duchies_desc: "Touraine and Maine were Henry's by right of his father, lost to the Capet at Bouvines. Recover Tours and Le Mans, and re-establish the heart of the Angevin patrimony."
 nd_anv_dest_empire_of_loire: "Empire of the Loire"
 nd_anv_dest_empire_of_loire_desc: "Take Paris itself and the royal city of Orléans. Field a host of fifty thousand knights, sergeants and routiers, and build the realm's strength to a level worthy of an emperor of the West."
 nd_anv_dest_crown_christendom: "Crown of Christendom"
 nd_anv_dest_crown_christendom_desc: "Toulouse, Dijon, Reims — the Languedoc, the Burgundian heartland, and the coronation city of the French kings. Field a Plantagenet host that no continental power can match. Crown a chivalric empire that humbles every neighbour."

 # === Destiny Events ===
 nd_anv.8.t: "The King's Long Programme"
 nd_anv.8.d: "The chancery has drawn up a long memorandum on the Plantagenet realm's prospects. The clerks of Westminster, the prelates of Rouen, the seneschals of Aquitaine — all have offered their counsel on the years to come.\n\nThe King retires with his closest advisers to weigh what the Crown of Two Realms shall pursue beyond the immediate cares of statecraft. A long programme, written in the King's own hand and sealed with the lions, takes its place in the chancery archive at Westminster."
 nd_anv.8.a: "Set the lions on a long path"

 nd_anv.9.t: "The Pacification of the Isles"
 nd_anv.9.d: "Lothian has bowed to the King's writ; the Lord Justiciar's circuit reaches now into Munster. From the cliffs of Cape Wrath to the Atlantic harbours of Cork, the same royal seal authenticates a charter, the same justices in eyre hear pleas of trespass, the same coin runs in the markets.\n\nThe British Isles are no longer a confused tangle of frontiers — they are one realm, bound by one common law beneath a single crown."
 nd_anv.9.a: "One archipelago, one crown"

 nd_anv.10.t: "The Narrow Seas"
 nd_anv.10.d: "From the South Foreland to the dunes of Flanders, from Sandwich to Antwerp, the narrow sea is now a Plantagenet lake. The Cinque-Ports cogs convoy the wool fleets unmolested; the King's admiral collects toll from every Hansa kogge that beats up the strait.\n\nThe Channel was once the salt-water frontier that divided the Plantagenet realm. It is now its inland highway. How shall the Crown order its admiralty?"
 nd_anv.10.a: "Build the King's Channel squadrons"
 nd_anv.10.b: "Raise the Calais staple to a royal monopoly"

 nd_anv.11.t: "Beyond the Western Approaches"
 nd_anv.11.d: "The leopards now flutter from the rigging of caravels lying in the harbour of Funchal; the silver-and-gold of the Azores trade rolls in to the Bristol custom-house. The institutions of global trade have taken root in Westminster and Rouen. The Plantagenet admiralty rules a sea-empire whose extent no medieval king could have imagined.\n\nWith such reach come hard choices. Shall the King build a deep-ocean battle fleet of the western approaches, or weave a network of trading factories along the Atlantic seaboard?"
 nd_anv.11.a: "A deep-ocean battle fleet"
 nd_anv.11.b: "A web of trading factories"

 nd_anv.12.t: "The Heart of Anjou Restored"
 nd_anv.12.d: "Tours, the city of Saint Martin; Le Mans, the city of Henry's birth. The Angevin patrimony — Touraine and Maine, the heart of the Plantagenet inheritance — is restored to the family line.\n\nThe King's herald reads the homage in three languages. The bells of every parish church ring out from Angers to Rennes. The chivalry of the realm rides north from Bordeaux and south from Caen to a tournament held in the King's own hand at Le Mans."
 nd_anv.12.a: "By right of inheritance and arms"

 nd_anv.13.t: "Paris and Orléans"
 nd_anv.13.d: "The Île-de-la-Cité, Notre-Dame de Paris, the Sainte-Chapelle. Orléans on the Loire, the heart of royal France. The Capetian patrimony is in Plantagenet hands; the King of France is the Plantagenet's prisoner, his vassal, or his fugitive.\n\nNo king of the West has held both crowns since Charlemagne. Shall the Plantagenet humble the Capet line forever, or hold the Loire valley as a chivalric court where the great vassals of the realm pay homage in Eleanor's manner?"
 nd_anv.13.a: "Humble the Capet — strip the Crown of France"
 nd_anv.13.b: "A Loire court of palatines and homage"

 nd_anv.14.t: "The Crown of Christendom"
 nd_anv.14.d: "From Toulouse in the Languedoc to Dijon in Burgundy and the coronation city of Reims, the King reigns as suzerain of the West. The leopards stand beside the eagle of the Empire as equals, perhaps as superiors. The chivalry of three crowns rides under the Plantagenet banner.\n\nIs this an empire of arms — a martial Plantagenet imperium that humbles every continental power — or a feudal lordship of palatine vassals, knit together by oaths of homage and tournaments held in the King's hand?"
 nd_anv.14.a: "An imperator of the West, by force of arms"
 nd_anv.14.b: "A feudal lordship of palatine homage"

 # === Destiny Static Modifiers ===
 STATIC_MODIFIER_NAME_nd_anv_dest_channel_admiralty: "Channel Admiralty"
 STATIC_MODIFIER_DESC_nd_anv_dest_channel_admiralty: "The unified squadrons of Sandwich, Portsmouth and Le Havre. The cogs and galleys of two coasts under one Lord High Admiral."
 STATIC_MODIFIER_NAME_nd_anv_dest_staple_monopoly: "Staple Monopoly"
 STATIC_MODIFIER_DESC_nd_anv_dest_staple_monopoly: "The wool of England, the wine of Gascony, the cloth of Flanders — all funnel through royal staples. The crown's merchants set the prices of three kingdoms."
 STATIC_MODIFIER_NAME_nd_anv_dest_western_approaches: "Western Approaches"
 STATIC_MODIFIER_DESC_nd_anv_dest_western_approaches: "Squadrons of the line range from Brest to the Bay of Biscay and beyond. The Plantagenet flag is the master of the deep ocean — though the army's marches grow longer."
 STATIC_MODIFIER_NAME_nd_anv_dest_atlantic_factories: "Atlantic Factories"
 STATIC_MODIFIER_DESC_nd_anv_dest_atlantic_factories: "Trading factories at Funchal, Ponta Delgada and the Cape Verdes. Plantagenet merchants tap the Atlantic supply of slaves, sugar and gold."
 STATIC_MODIFIER_NAME_nd_anv_dest_capet_humbled: "The Capet Humbled"
 STATIC_MODIFIER_DESC_nd_anv_dest_capet_humbled: "The royal fleur-de-lys lies in the dust at Westminster. The Plantagenet host moves with the momentum of a campaign that cannot be stopped."
 STATIC_MODIFIER_NAME_nd_anv_dest_loire_courts: "Courts of the Loire"
 STATIC_MODIFIER_DESC_nd_anv_dest_loire_courts: "The Loire valley becomes a court of palatine homage. The great vassals of the realm swear fealty in the manner of Poitiers — though the burghers grumble at being passed over."
 STATIC_MODIFIER_NAME_nd_anv_dest_western_imperator: "Imperator of the West"
 STATIC_MODIFIER_DESC_nd_anv_dest_western_imperator: "Anointed at Reims, the Plantagenet stands beside the Holy Roman Emperor as an equal. The chivalry of the West rides under his banner."
 STATIC_MODIFIER_NAME_nd_anv_dest_palatines_homage: "Palatines' Homage"
 STATIC_MODIFIER_DESC_nd_anv_dest_palatines_homage: "Counts palatine of Toulouse, Burgundy and the Languedoc bow at the King's court. Their levies and treasure flow to Westminster — at a slow but inexorable pace."

 # === Destiny Buildings ===
 nd_anv_dest_admiralty_house: "Admiralty House"
 nd_anv_dest_admiralty_house_desc: "The seat of the Lord High Admiral — drydocks, victualling yards, sail-lofts and the navy office. A unified Plantagenet admiralty with squadrons of the Channel, the Bay of Biscay and the Atlantic approaches."
 nd_anv_dest_admiralty_upkeep: "Admiralty Yard Operations"
 nd_anv_dest_admiralty_upkeep_desc: "Naval supplies, lumber, tar and tools for the King's drydocks and victualling yards."
 nd_anv_dest_chivalric_palatinate: "Chivalric Palatinate"
 nd_anv_dest_chivalric_palatinate_desc: "A great hall of palatine homage, modelled on the County Palatine of Chester and the Aquitanian ducal court at Bordeaux. Counts palatine swear fealty in the King's hand and ride out at the King's call with their full feudal hosts."
 nd_anv_dest_palatinate_upkeep: "Palatine Court Maintenance"
 nd_anv_dest_palatinate_upkeep_desc: "Fine cloth, weaponry, furniture and wax for the great hall of palatine homage and the chivalric ceremonies thereof."

 # === Bureaucracies ===
 nd_anv_bureaucracy_authority: "Plantagenet Administration"
 AUTO_MODIFIER_NAME_nd_anv_bureaucracy_authority: "Plantagenet Administration"
 AUTO_MODIFIER_DESC_nd_anv_bureaucracy_authority: "The administrative organs of the Angevin realm -- the itinerant Curia Regis, the chancery and exchequer of Westminster, the seneschalcy of Aquitaine, and the chartered Channel ports -- have hardened into a permanent institutional apparatus. The crown of two realms now governs not by dynastic presence alone but through writs, audits, and standing privileges renewed at each sovereign's coming."

 nd_anv_curia_regis_itinerant_bureaucracy: "Curia Regis Itinerant"
 nd_anv_curia_regis_itinerant_bureaucracy_desc: "The king's household-court of justices, constables, chamberlains and clerks travelled with the Plantagenet sovereigns between Westminster, Rouen, Caen, Le Mans, Angers, Chinon and Poitiers. The Dialogus de Scaccario of Richard FitzNeal (c. 1179) describes a curia that handled fiscal audit, royal pleas, foreign correspondence and dynastic business interchangeably from wherever the king lay. It was an institution of motion -- the antecedent of the sedentary Common Pleas and King's Bench that branched off only after the reforms of 1234. While well-funded the curia binds the cross-Channel realm into a single political body; when neglected, the king's household becomes a comfortable circuit and the great barons begin to resent every visitation."

 nd_anv_clarendon_apparatus_bureaucracy: "Constitutions of Clarendon Apparatus"
 nd_anv_clarendon_apparatus_bureaucracy_desc: "The bundle of administrative instruments codified at the Council of Clarendon in January 1164: the sixteen articles asserting royal jurisdiction over criminous clerks, the assize utrum drawing land cases into royal courts, the royal forest law administered by the King's foresters and verderers, and the chancery writ system that summoned subjects under the king's seal. The quarrel with Becket over the criminous-clerks article was bitter and ended in martyrdom at Canterbury, but the broader apparatus held: Plantagenet government became a writ-state. While maintained, royal authority reaches subjects directly through parchment rather than through the lord's intermediation; while neglected, the church remembers Becket and stability frays."

 nd_anv_aquitanian_curia_bureaucracy: "Cours Plenieres d'Aquitaine"
 nd_anv_aquitanian_curia_bureaucracy_desc: "The great curia of the duke-king at Poitiers and later Bordeaux, where the Aquitanian magnates -- the counts of Angouleme, Perigord, La Marche, Armagnac and the lord of Albret -- rendered counsel, heard appeals and confirmed the duchy's customary law. Eleanor of Aquitaine sustained the Poitiers court after 1168; Richard I, as count of Poitou, made it his political centre; under the later Angevins the seneschal of Gascony presided in the king's absence. Unlike the writ-state of England, ducal Aquitaine remained federal in temper: a Plantagenet province whose magnates spoke as peers rather than subjects, whose wines fed the king's host, and whose loyalty was contingent on the dignity of their consultation."

 nd_anv_cinque_ports_bureaucracy: "Cinque Ports Confederation"
 nd_anv_cinque_ports_bureaucracy_desc: "The Plantagenet bargain with the Channel naval towns of Hastings, New Romney, Hythe, Dover and Sandwich, joined later by the Antient Towns of Rye and Winchelsea. In return for the Ship Service of fifty-seven vessels for fifteen days each year, the ports received sweeping liberties under the Charter of 1278: their own admiralty court at Shepway, exemption from royal taxes and customs, the right to send Barons to bear the canopy at coronations, and effective immunity from the royal writ inside their walls. The Crown bought a standing fleet of the cheapest kind; the burghers got an autonomy no other English borough enjoyed. The bargain held until Henry VIII finally refitted the royal navy on different terms."
