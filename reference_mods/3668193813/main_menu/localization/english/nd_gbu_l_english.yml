l_english:
 # === Static Modifiers ===
 STATIC_MODIFIER_NAME_nd_gbu_frankish_imperial_kingdom: "Frankish-Imperial Kingdom"
 STATIC_MODIFIER_DESC_nd_gbu_frankish_imperial_kingdom: "The crown Charles the Bold sought at Trier is at last placed on a Burgundian brow. The compagnies d'ordonnance ride for a sovereign king, the Order of the Golden Fleece for a court of the most chivalric pretensions in Christendom. Burgundy strikes outward from a position of military prestige."
 STATIC_MODIFIER_NAME_nd_gbu_estates_kingdom: "Kingdom of the Estates"
 STATIC_MODIFIER_DESC_nd_gbu_estates_kingdom: "The Etats Generaux de Bourgogne are seated as a true partner to the crown. The cloth halls of Bruges and Ghent, the Brabantine merchants, the Walloon ironmasters all send deputies. The kingdom is governed jointly with its cities, and its wealth flows from their looms and counters."

 STATIC_MODIFIER_NAME_nd_gbu_toison_dor_elite: "Knights of the Golden Fleece"
 STATIC_MODIFIER_DESC_nd_gbu_toison_dor_elite: "The Toison d'Or is kept as Philip the Good designed it: thirty-one knights, the great houses of Burgundy bound by oath to the duke. A jewel-encrusted collar; an elite cavalry corps; the chivalric prestige of Christendom's most lavish court."
 STATIC_MODIFIER_NAME_nd_gbu_toison_dor_broad: "Broadened Fleece"
 STATIC_MODIFIER_DESC_nd_gbu_toison_dor_broad: "The Order is opened to lesser nobles and faithful captains. The fleece becomes a national chivalric institution rather than a closed dynastic circle, drawing the wider nobility into the king's service and projecting Burgundian honour across Europe."

 STATIC_MODIFIER_NAME_nd_gbu_flemish_cloth_charter: "Flemish Cloth Charter"
 STATIC_MODIFIER_DESC_nd_gbu_flemish_cloth_charter: "The drapers' guilds of Ghent, Bruges, and Ypres receive their privileges in writing: the right to inspect cloth, to set quality marks, to defend their monopoly. The looms double their output."

 STATIC_MODIFIER_NAME_nd_gbu_estates_general: "Estates General Convoked"
 STATIC_MODIFIER_DESC_nd_gbu_estates_general: "The Etats Generaux assemble in Bruges. Nobles, clergy, and burghers of every duchy and county speak with one voice to the duke. Tax grants flow more readily; the realm acquires a constitutional voice that no rival monarchy yet possesses."

 STATIC_MODIFIER_NAME_nd_gbu_trier_imperial: "Trier Concordat"
 STATIC_MODIFIER_DESC_nd_gbu_trier_imperial: "The Emperor crowns the Duke of Burgundy King at Trier. The royal title is recognized across the Empire and beyond. Christendom acknowledges the Burgundian Middle Kingdom restored."
 STATIC_MODIFIER_NAME_nd_gbu_trier_unilateral: "Crown of Brussels"
 STATIC_MODIFIER_DESC_nd_gbu_trier_unilateral: "The Emperor stalls; the Duke does not. The crown is forged in Brussels and placed without imperial leave. Sovereignty proclaimed by deed, not letter, and the Estates affirm what no foreign chancery dares challenge."

 STATIC_MODIFIER_NAME_nd_gbu_gendarme_reform: "Compagnies d'Ordonnance"
 STATIC_MODIFIER_DESC_nd_gbu_gendarme_reform: "Charles the Bold's standing army takes shape: paid companies of full-plate gendarmes, lance and barded horse, drilled in tactical formation. The most disciplined heavy cavalry of the age."
 STATIC_MODIFIER_NAME_nd_gbu_militia_mobilization: "Burgher Militias Mobilized"
 STATIC_MODIFIER_DESC_nd_gbu_militia_mobilization: "The cloth cities raise their pike militias in defence of the realm. Bruges, Ghent, Brussels, Liege send their burgher companies to the field. Numbers compensate for breeding."

 STATIC_MODIFIER_NAME_nd_gbu_croix_de_bourgogne: "Croix de Bourgogne"
 STATIC_MODIFIER_DESC_nd_gbu_croix_de_bourgogne: "The saltire of Saint Andrew, the rough red cross of knotted branches, becomes the field standard of every Burgundian battalion. The host marches under one banner and knows itself for one nation."

 # === Formation Event ===
 nd_gbu.1.t: "The Burgundian Crown"
 nd_gbu.1.d: "From Bruges to Dijon, from the Frisian dunes to the Jura watershed, the long arc of Burgundian power is at last consolidated under a single sovereign crown. The Duchy of Burgundy and the Free County, Flanders and Brabant, Picardy and Holland, Lorraine and Alsace -- all the lands that Philip the Good and Charles the Bold welded into a composite state now stand as one kingdom, answering to neither Paris nor the Empire. The Lotharingian middle kingdom is reborn.\n\nBut what kind of kingdom shall it be?\n\nCharles dreamed of a sovereign throne carved from Imperial dignity, a court of the most lavish chivalry in Europe, a standing army of gendarmes and bombards. The compagnies d'ordonnance, the Toison d'Or, the field standards of Saint Andrew -- these are the regalia of a Frankish-Imperial kingdom, a state of military prestige.\n\nYet the wealth of Burgundy was always its cities. Bruges and Ghent, Brussels and Antwerp, Mechelen and Liege -- the cloth halls, the kontors, the burgher militias of the great urban communes. The Etats Generaux already gather to grant or withhold the duke's funding. The kingdom could be governed jointly with its cities, a constitutional partnership unlike any other crown in Europe.\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_gbu.1.a: "Frankish-Imperial Kingdom: court, gendarme, and Imperial dignity"
 nd_gbu.1.b: "Kingdom of the Estates: cloth halls, burghers, and the urban commonwealth"

 # === DHE: Order of the Golden Fleece ===
 nd_gbu.2.t: "The Order of the Golden Fleece"
 nd_gbu.2.d: "On the tenth of January in the year 1430, in the great hall of his palace at Bruges, Philip the Good announces the founding of a new chivalric order on the day of his marriage to Isabella of Portugal. He names it the Toison d'Or, after the golden fleece of Jason and the Argonauts -- and after the wool that has made Burgundy rich. Twenty-four knights are admitted at the founding, the great houses of the realm bound by oath to the duke. They wear a collar of jewels and golden links: the fleece itself dangles from each.\n\nThe Order is the most exclusive in Christendom. It is also a political instrument: every great noble who joins it owes the dynasty a personal debt of chivalric loyalty. But the founding raises a question that will shape the kingdom. Shall the Fleece remain the closed circle of Philip's design, thirty-one knights only? Or shall it grow, become a broader institution drawing in the wider nobility, projecting Burgundian honour across Europe?"
 nd_gbu.2.a: "Hold to the founding charter -- thirty-one knights, an elite circle"
 nd_gbu.2.b: "Open the Order -- broaden the fleece into a national chivalric institution"

 # === DHE: Flemish Cloth Charter ===
 nd_gbu.3.t: "The Cloth Charter"
 nd_gbu.3.d: "The drapers of Ghent, Bruges, and Ypres petition the crown for charter. They have woven the wool of England and the dyes of Picardy for two centuries. They want the right in writing: to inspect cloth at the loom, to mark it with the city's quality stamp, to forbid foreign merchants from buying unstamped goods. The crown grants the charter. Across the Low Countries, the looms double their pace, the fulling mills run day and night, and Flemish cloth marked with the wool guild's seal commands the highest prices in Europe."
 nd_gbu.3.a: "The cloth halls thrive."

 # === DHE: Estates General Convocation ===
 nd_gbu.4.t: "The Estates General Convoke"
 nd_gbu.4.d: "Philip the Good summons the Etats Generaux for the first time in 1464, at Bruges: nobles, clergy, and burghers of every Burgundian land, gathered to grant taxes, hear grievances, and speak with one voice to the duke. It is the first such gathering in Europe to unite the deputies of so many distinct duchies and counties under a single crown. The Estates of Flanders and Brabant, Holland and Hainaut, Burgundy and Franche-Comte deliberate together. From this moment forward, the kingdom is governed not by ducal fiat alone but by negotiation between the crown and its constituent lands -- a constitutional principle that will outlast every dynasty that holds the throne."
 nd_gbu.4.a: "Let the Estates be heard."

 # === DHE: Trier Coronation ===
 nd_gbu.5.t: "The Crown at Trier"
 nd_gbu.5.d: "In the autumn of 1473 Charles the Bold rides to Trier with two thousand horse and a chest of gold to meet Emperor Frederick III. He demands the kingdom's recognition: a crown, a royal title, the elevation of the Burgundian state to sovereign equality with France and the Empire. Frederick is amenable; the negotiations are advanced; the crown itself is brought to the city. The marriage of Frederick's son Maximilian to Charles's daughter Mary is offered as the dynastic seal.\n\nIn the original course of events, Frederick fled Trier in the night and the deal collapsed. Here the deal does not collapse. But the king must still choose: shall the crown be received from imperial hands, an act of Christendom-wide recognition that binds Burgundy to the Empire by debt of dignity? Or shall it be claimed unilaterally, forged at home and placed by Burgundian hands alone, a sovereignty that owes nothing to any other prince?"
 nd_gbu.5.a: "Receive the crown from the Emperor's hand -- recognized across Christendom"
 nd_gbu.5.b: "Forge the crown at Brussels -- Burgundian sovereignty owes nothing"

 # === DHE: Burgundian Wars ===
 nd_gbu.6.t: "The Hour of the Burgundian Wars"
 nd_gbu.6.d: "The Swiss Confederacy strikes from the south; Lorraine rebels in the centre; King Louis of France gathers his standards on the western frontier. The Burgundian Wars are upon the kingdom. Charles musters his ordonnance companies at Nancy. Two paths lie open.\n\nThe first: deepen the standing-army reform. Pour gold into the gendarmes, the bombard train, the disciplined squadrons of paid horse. Charles's compagnies d'ordonnance are the most professional cavalry in Europe; let them be made invincible.\n\nThe second: raise the militias of the cloth cities. Bruges, Ghent, Brussels, Liege can put thousands of pikemen in the field at a season's notice. The pike-square, the urban communal levy, has bested feudal cavalry before -- at Courtrai, at Stiklestad, at Sempach. Let the cities defend the kingdom that grew from them."
 nd_gbu.6.a: "The gendarme reform -- pour all into the ordonnance companies"
 nd_gbu.6.b: "The militia mobilization -- raise the cloth cities under arms"

 # === DHE: Croix de Bourgogne ===
 nd_gbu.7.t: "The Saltire of Saint Andrew"
 nd_gbu.7.d: "Across every Burgundian battalion the same red cross is now raised: two rough branches knotted into a saltire, the cross of Saint Andrew. Where Habsburg captains will one day fly it across half the world, here it flies first for Burgundy. Every gendarme's lance, every pikeman's banner, every artillerist's smock bears the croix de Bourgogne. The host marches under one mark and knows itself for one nation."
 nd_gbu.7.a: "Let the saltire fly."

 # === Advance Names ===
 nd_gbu_flemish_weaving_guilds: "Flemish Weaving Guilds"
 nd_gbu_flemish_weaving_guilds_desc: "The drapers of Bruges, Ghent, and Ypres organize the wool trade into city-controlled guilds. Their cloth, woven from English fleece, dyed in Picard madder, stamped with the city's quality mark, dominates the markets of Europe."
 nd_gbu_burgundian_court_ceremonial: "Burgundian Court Ceremonial"
 nd_gbu_burgundian_court_ceremonial_desc: "The Coudenberg in Brussels, the Prinsenhof in Bruges -- the Burgundian dukes maintain the most spectacular court of fifteenth-century Europe. Banquets, tournaments, processions, and the Order of the Golden Fleece project the dynasty's prestige across Christendom."
 nd_gbu_bruges_kontor: "The Bruges Kontor"
 nd_gbu_bruges_kontor_desc: "The Hanseatic counter at Bruges sits on a footing of equality with Lubeck. Burgundian merchants negotiate as principals, not as suppliers; the Bruges market overtakes the Hanse staple at Bergen and Novgorod."
 nd_gbu_burgundian_crossbow: "Burgundian Crossbow Levies"
 nd_gbu_burgundian_crossbow_desc: "The cloth cities maintain crossbow guilds: the Sint-Joris and Sint-Sebastiaan brotherhoods of Bruges and Ghent. Their members shoot at the popinjay weekly and stand ready to take the wall in war."
 nd_gbu_order_of_the_golden_fleece: "Order of the Golden Fleece"
 nd_gbu_order_of_the_golden_fleece_desc: "The Toison d'Or, founded at Bruges in 1430 by Philip the Good, is the most exclusive chivalric order in Christendom. Thirty-one knights bound by oath to the dynasty, distinguished by a collar of jewelled fleeces."
 nd_gbu_flemish_pikeman: "Flemish Pikeman Levies"
 nd_gbu_flemish_pikeman_desc: "The urban militias of the cloth cities serve in pike formation. The same men who broke French chivalry at Courtrai now stand ready as a renaissance pike-square."
 nd_gbu_flemish_cloth_charter_advance: "The Cloth Charter"
 nd_gbu_flemish_cloth_charter_advance_desc: "The drapers' guilds win written privileges from the crown: the right to inspect cloth, to mark it, to defend their monopoly against foreign merchants. The Flemish loom becomes the standard of European textile production."
 nd_gbu_estates_general_advance: "Estates General Convocation"
 nd_gbu_estates_general_advance_desc: "The Etats Generaux de Bourgogne assemble: nobles, clergy, and burghers of every duchy and county speak with one voice. The first composite parliamentary institution in Europe."
 nd_gbu_compagnies_dordonnance: "Compagnies d'Ordonnance"
 nd_gbu_compagnies_dordonnance_desc: "Charles the Bold reforms the Burgundian host on the French model: standing companies of paid men-at-arms, drilled in formation, rotated through garrison and field, paid from the treasury rather than from feudal levy."
 nd_gbu_burgundian_gendarme: "The Burgundian Gendarme"
 nd_gbu_burgundian_gendarme_desc: "The heavy cavalry of the ordonnance companies: full plate, barded horse, lance, and tactical reform. Charles's gendarmes are the most professional shock cavalry in Christendom."
 nd_gbu_coulevrinier_corps: "Coulevrinier Corps"
 nd_gbu_coulevrinier_corps_desc: "Burgundian handgunners armed with the couleuvrine, the early gunpowder firearm. They are recruited from the urban militias and stand alongside crossbowmen on the battle line."
 nd_gbu_trier_crown: "The Trier Crown"
 nd_gbu_trier_crown_desc: "The kingdom secures the royal recognition Charles negotiated with Emperor Frederick III at Trier in 1473. Burgundy stands as a sovereign monarchy, recognized across Christendom."
 nd_gbu_croix_de_bourgogne_advance: "Croix de Bourgogne"
 nd_gbu_croix_de_bourgogne_advance_desc: "The saltire of Saint Andrew, the rough red cross of knotted branches, is adopted as the field standard of every Burgundian battalion. The host marches under one banner."
 nd_gbu_mechelen_foundry_advance: "The Mechelen Cannon Foundry"
 nd_gbu_mechelen_foundry_advance_desc: "Mechelen becomes the continental arms centre. The Burgundian artillery train, organized in the tradition of the great bombards of Charles the Bold, delivers cast bronze cannon to the king's armies."
 nd_gbu_grand_privilege: "The Grand Privilege"
 nd_gbu_grand_privilege_desc: "The Estates secure constitutional limits on the crown: the right to consent to taxes, to summon their own assembly, to refuse foreign appointments. The kingdom is governed by negotiation, not by fiat."
 nd_gbu_low_countries_urbanism: "Low Countries Urbanism"
 nd_gbu_low_countries_urbanism_desc: "The densest urbanization in northern Europe: Antwerp, Brussels, Ghent, Bruges, Amsterdam, Liege. The Burgundian Low Countries hold a third of all the cities of the kingdom and produce most of its wealth."
 nd_gbu_antwerp_exchange: "The Antwerp Exchange"
 nd_gbu_antwerp_exchange_desc: "The Bourse of Antwerp, founded as the world's first commodity exchange. Burgundian merchants set the European price of pepper, copper, silver, and bills of exchange. The bourse becomes the financial heart of European commerce."
 nd_gbu_burgundian_inheritance: "Burgundian Inheritance Diplomacy"
 nd_gbu_burgundian_inheritance_desc: "The Burgundian dynastic web reaches from Cleves to Habsburg, from Lorraine to England. The kingdom's marriage strategy makes it a dynastic linchpin of European politics."
 nd_gbu_embellished_court: "The Embellished Court"
 nd_gbu_embellished_court_desc: "The Coudenberg expanded into a true royal palace; the court ceremonial of fifteenth-century Burgundy carried into the baroque era as a sovereign tradition rather than a Spanish-Habsburg import."
 nd_gbu_lotharingian_industry: "Lotharingian Industry"
 nd_gbu_lotharingian_industry_desc: "The early industrial belt of the Belgian provinces: Wallonia coal, Liege metalworking, Charleroi iron. The kingdom industrializes earliest among the continental powers."
 nd_gbu_belgian_textile_revolution: "The Belgian Textile Revolution"
 nd_gbu_belgian_textile_revolution_desc: "Mechanized cotton mills at Ghent on the British model; mechanized wool at Verviers; the Industrial Revolution arrives in the Low Countries. The cloth halls of the medieval city now serve as galleries above mills running day and night."
 nd_gbu_constitutional_estates: "Constitutional Estates"
 nd_gbu_constitutional_estates_desc: "The Estates General fully institutionalized as the constitutional partner of the crown. Nineteenth-century parliamentarism on Burgundian terms: a continuous tradition reaching back to Philip the Good."

 # === Building Names ===
 nd_gbu_flemish_cloth_hall: "Flemish Cloth Hall"
 nd_gbu_flemish_cloth_hall_desc: "The great public hall of the wool guilds, modelled on the Lakenhalle of Ypres and the Cloth Hall of Bruges. Cloth is inspected, stamped, taxed, and traded under one roof."
 nd_gbu_court_palace: "Burgundian Court Palace"
 nd_gbu_court_palace_desc: "The ducal palace -- the Coudenberg, the Prinsenhof, the Hof ten Walle -- where the most spectacular court of fifteenth-century Europe holds its banquets, tournaments, and chivalric ceremonies."
 nd_gbu_hanseatic_counter: "Hanseatic Counter"
 nd_gbu_hanseatic_counter_desc: "A trading counter on the Bruges model, dealing with the Hanseatic League on equal footing. Burgundian merchants trade as principals across the North Sea and the Baltic."
 nd_gbu_toison_dor_chapter_house: "Toison d'Or Chapter House"
 nd_gbu_toison_dor_chapter_house_desc: "The chapter house of the Order of the Golden Fleece. Knights of the order assemble here for chapter meetings, oaths of fealty, and the great festivals of chivalry."
 nd_gbu_gendarme_drill_yard: "Gendarme Drill Yard"
 nd_gbu_gendarme_drill_yard_desc: "The training ground of the compagnies d'ordonnance: standing companies of paid men-at-arms, drilled in formation, ready for the field. The first true standing army of the continental west."
 nd_gbu_mechelen_foundry: "Mechelen Cannon Foundry"
 nd_gbu_mechelen_foundry_desc: "The bronze foundry of Mechelen, casting cannon for the Burgundian artillery train. Continental arms centre and supplier of bombards across Europe."
 nd_gbu_antwerp_bourse: "Antwerp Bourse"
 nd_gbu_antwerp_bourse_desc: "The world's first true commodity exchange. Bills of exchange, bonds, copper, pepper, and a thousand other goods are quoted here, setting the European price daily."
 nd_gbu_belgian_textile_mill: "Belgian Textile Mill"
 nd_gbu_belgian_textile_mill_desc: "Mechanized cotton or wool mill on the British model. Ghent, Verviers, and Roubaix lead the Industrial Revolution in the Low Countries."

 # === PM Names ===
 nd_gbu_chapter_house_upkeep: "Order Maintenance"
 nd_gbu_chapter_house_upkeep_desc: "The ceremonial upkeep of the Order: collars, cloaks, banquets, the regalia of chivalric oath."
 nd_gbu_cloth_hall_weaving: "Flemish Wool Weaving"
 nd_gbu_cloth_hall_weaving_desc: "Wool spun, dyed, and woven into the famed Flemish broadcloth, stamped with the guild seal."
 nd_gbu_cloth_hall_fine_weaving: "Fine Cloth Production"
 nd_gbu_cloth_hall_fine_weaving_desc: "The finest grades of Flemish broadcloth, woven with imported silk thread and the deepest dyes for Europe's nobility."
 nd_gbu_court_palace_upkeep: "Court Ceremonial"
 nd_gbu_court_palace_upkeep_desc: "The provisioning of banquets, tournaments, processions, and the daily ceremonial of the Burgundian court."
 nd_gbu_kontor_upkeep: "Kontor Operations"
 nd_gbu_kontor_upkeep_desc: "The daily operations of the Hanseatic counter: ledgers, packing, shipping, and warehouse stores."
 nd_gbu_drill_yard_upkeep: "Compagnie Maintenance"
 nd_gbu_drill_yard_upkeep_desc: "The pay, mounts, equipment, and field training of the standing compagnies d'ordonnance."
 nd_gbu_mechelen_cannons: "Bronze Cannon Casting"
 nd_gbu_mechelen_cannons_desc: "Casting bronze cannon for the Burgundian artillery train: bombards, serpentines, and falconets in the Mechelen pattern."
 nd_gbu_bourse_upkeep: "Bourse Clearing"
 nd_gbu_bourse_upkeep_desc: "The clearing of bills, bonds, and accounts at the Antwerp Bourse, where the European price of every traded good is set daily."
 nd_gbu_textile_mill_weaving: "Mechanized Cloth"
 nd_gbu_textile_mill_weaving_desc: "Mechanized cotton or wool spinning and weaving at industrial scale, in the Ghent and Verviers tradition."

 # === Unit Names ===
 a_nd_gbu_crossbowman: "Burgundian Crossbowman"
 a_nd_gbu_crossbowman_desc: "Urban crossbowman of the Sint-Joris guilds. The disciplined, well-equipped missile infantry of the cloth cities, drilled at the popinjay every Sunday and ready to take the wall in war."
 a_nd_gbu_flemish_pikeman: "Flemish Pikeman"
 a_nd_gbu_flemish_pikeman_desc: "Urban pike militia of the Low Countries. The same communal infantry that broke French chivalry at Courtrai, now drilled in the renaissance pike-square."
 a_nd_gbu_gendarme: "Burgundian Gendarme"
 a_nd_gbu_gendarme_desc: "Heavy cavalry of the compagnies d'ordonnance: full plate, barded horse, couched lance. Charles the Bold's pride and the most professional shock cavalry of the late fifteenth century."
 a_nd_gbu_coulevrinier: "Coulevrinier"
 a_nd_gbu_coulevrinier_desc: "Burgundian handgunner armed with the couleuvrine: an early arquebus on a long stock. Recruited from the urban militias, the bridge between crossbow and musket."

 # === Levy Names ===
 levy_nd_gbu_crossbowman: "Crossbow Levy"
 levy_nd_gbu_crossbowman_desc: "Levy from the urban crossbow guilds of the cloth cities."
 levy_nd_gbu_flemish_pikeman: "Pikeman Levy"
 levy_nd_gbu_flemish_pikeman_desc: "Levy from the burgher pike militias of the Low Countries."

 # === Variable Tooltip Localization ===
 nd_gbu_formed_tt: "Greater Burgundy formed"
 nd_gbu_path_a_tt: "Frankish-Imperial Kingdom path"
 nd_gbu_path_b_tt: "Estates Kingdom path"

 # === Additional advance loc ===
 nd_gbu_burgundian_painting: "Flemish Painting"
 nd_gbu_burgundian_painting_desc: "Van Eyck's Ghent Altarpiece, Van der Weyden's portraits, Memling and Bouts -- the Flemish Primitives establish a continental school of art whose realism, oil technique, and devotional intensity become the standard of European painting."
 nd_gbu_dunkirk_privateers: "Burgundian Channel Privateers"
 nd_gbu_dunkirk_privateers_desc: "Letters of marque issued from Dunkirk, Ostend, and Nieuwpoort. Burgundian corsairs harry English and French shipping in the Channel and the North Sea, screening the kingdom's trade in war."

 # === Walloon Coal Basin ===
 nd_gbu_walloon_coal: "Walloon Coal Basin"
 nd_gbu_walloon_coal_desc: "The Sambre-Meuse coal belt -- Charleroi, Mons, the Borinage. The richest coalfield of continental Europe and the foundation of Belgian heavy industry."
 nd_gbu_walloon_coalworks: "Sambre-Meuse Coalworks"
 nd_gbu_walloon_coalworks_desc: "An industrial-era pit mine extracting coal from the Walloon basin. Charleroi, Mons, and the Borinage drive the kingdom's industrialization."
 nd_gbu_walloon_coal_mining: "Coal Extraction"
 nd_gbu_walloon_coal_mining_desc: "Pit mining of bituminous coal from the Sambre-Meuse seams, the heart of continental industrial fuel."

 # === Destiny Tree ===
 nd_gbu_destiny: "The Lotharingian Question"
 nd_gbu_destiny_desc: "The crown is placed; the kingdom is formed. But the long arc of Burgundian power admits two destinies. Restore the Lotharingian Middle Kingdom as a Frankish-Imperial successor state, contesting the Imperial title across the Rhine -- or extend the kingdom seaward as the financial pivot of Atlantic Europe, the bourse of bourses. Maintain stability while the realm chooses its course."

 nd_gbu_dest_rhineland_frontier: "The Rhineland Frontier"
 nd_gbu_dest_rhineland_frontier_desc: "Hold the spine of Lothair's old Middle Kingdom. Trier, where Constantine's purple was once raised; Aachen, where Charlemagne is buried and where the Holy Roman kings are crowned. Two cities, one project: the Carolingian heartland reclaimed by the Burgundian crown."
 nd_gbu_dest_imperial_march: "The Imperial March"
 nd_gbu_dest_imperial_march_desc: "Drive the Burgundian standards deeper into Imperial soil. Cologne, the great free city of the Rhine; Mainz, the elector-archbishop's seat; Kleve, holding the Lower Rhine to the sea. The kingdom becomes the dominant Rhenish power."
 nd_gbu_dest_imperial_title: "The Crown of Caesar Lotharius"
 nd_gbu_dest_imperial_title_desc: "Hold the cities where the Empire is made: Frankfurt the election seat, Worms the diet-city, Nuremberg keeper of the Reichskleinodien. The Burgundian crown is no longer a kingdom among kingdoms but the heir to the Frankish Imperium itself. Caesar Lotharius rides at the head of the host, and the printing presses sing his praises across Christendom."

 nd_gbu_dest_channel_mastery: "The Channel Mastery"
 nd_gbu_dest_channel_mastery_desc: "Contest the western waters. Dover commands the strait; Rouen the Seine; Portsmouth the Solent. The Burgundian sea-fleet asserts dominion over the routes that carry the cloth of the Low Countries to every market of Atlantic Europe."
 nd_gbu_dest_atlantic_outposts: "The Atlantic Outposts"
 nd_gbu_dest_atlantic_outposts_desc: "Plant the Burgundian flag on the islands beyond the western horizon. The Azores in mid-ocean; Madeira on the African coast. The kingdom takes its first ocean-facing colonies and joins the Age of Discovery on its own terms, with cloth halls behind it and Antwerp as its bourse."
 nd_gbu_dest_world_bourse: "The World Bourse"
 nd_gbu_dest_world_bourse_desc: "Antwerp emerges as the financial heart of Atlantic Europe. Pepper from the Indies and silk from the East both clear at the Burgundian bourse; bills of exchange written in Genoa and Florence are honoured here at Burgundian rates. The kingdom has become what it always wanted to be: the merchant of merchants, the clearing house of the world."

 # === Destiny DHE Events ===
 nd_gbu.8.t: "The Crown of Lothair Restored"
 nd_gbu.8.d: "The accession ceremonies are concluded; the crown rests at last on a Burgundian brow. Across every cloth hall and every gendarme barracks, across the burgher markets of Antwerp and the wine cellars of Beaune, the realm takes stock of itself. A century of patient assembly -- by Philip the Bold, John the Fearless, Philip the Good, Charles the Bold -- has at last produced a sovereign state.\n\nThe long road, though, branches now. The realm must choose its destiny."
 nd_gbu.8.a: "Let the chosen path unfold."

 nd_gbu.9.t: "The Carolingian Heartland"
 nd_gbu.9.d: "Trier and Aachen are taken. Constantine the Great once held court in the Porta Nigra; the bones of Charlemagne lie under the dome of the Palatine Chapel. The Burgundian standards fly above both cities. The chronicle of the realm now reads as the chronicle of the old Middle Kingdom: Lothair I's lands restored, the Imperial mantle fitted to the Burgundian shoulder. The compagnies d'ordonnance ride east on the Roman roads."
 nd_gbu.9.a: "The Lotharingian crown rises."

 nd_gbu.10.t: "The Imperial March"
 nd_gbu.10.d: "Cologne, Mainz, and Kleve fall to the Burgundian advance. The free city of the Rhine, the elector-archbishop's seat, and the Lower Rhine bishopric are all gathered into the kingdom. The Imperial diet sits in panic; Habsburg envoys ride between courts seeking allies; the College of Electors trembles.\n\nThe king must decide how to govern this conquered march. Pour gold into the war chest -- press the campaign deeper, take the Empire by storm. Or open negotiations with the diet -- offer the conquered princes seats at a Burgundian high court, integrate them by political bargain rather than the sword."
 nd_gbu.10.a: "The war chest -- press the campaign east."
 nd_gbu.10.b: "The diet overture -- bind the conquered princes by bargain."

 nd_gbu.11.t: "Caesar Lotharius Crowned"
 nd_gbu.11.d: "Frankfurt, Worms, and Nuremberg fly the Burgundian saltire. The free cities of the Empire are held; the election seat where the Holy Roman kings are chosen is Burgundian; the Reichskleinodien -- the imperial regalia -- rest in Burgundian hands. Caesar Lotharius is the new style: the Burgundian-Lotharingian heir to Charlemagne, the Caesar of the restored Frankish Middle Kingdom.\n\nThe coronation is the work of months. Will it be commemorated as a triumph of arms, the gendarme companies riding through cheering Frankfurt streets? Or as a triumph of office, the palatine chapel raised at Aachen and the Burgundian court installed as the new Imperial seat?"
 nd_gbu.11.a: "Triumph of arms -- the host parades through Frankfurt."
 nd_gbu.11.b: "Triumph of office -- the palatine court is installed at Aachen."

 nd_gbu.12.t: "The Channel Mastery"
 nd_gbu.12.d: "Dover, Rouen, and Portsmouth are taken. The strait of Dover, the mouth of the Seine, the Solent and the western Channel: the Burgundian fleet rides at anchor in all three. Cloth, wine, fish, and bills of exchange now move under Burgundian convoy from the Channel to the North Sea. The kingdom has become a sea power."
 nd_gbu.12.a: "The Burgundian Channel."

 nd_gbu.13.t: "The Atlantic Outposts"
 nd_gbu.13.d: "The Azores and Madeira fly the saltire of Saint Andrew. Burgundian factors keep books at Ponta Delgada; Burgundian sugar mills crush cane at Funchal. The kingdom has joined the Age of Discovery, with the cloth halls behind it and Antwerp as its bourse.\n\nHow shall the new outposts be governed? As royal expeditions -- the Burgundian Argonauts under crown command, naval explorers in the king's service. Or as chartered trading concerns -- bourgeois investors in the Estates' hands, free to expand the kingdom's reach as far as the wind will carry their ships."
 nd_gbu.13.a: "The Argonauts -- naval expeditions under the crown."
 nd_gbu.13.b: "The charters -- bourgeois trading concerns under the Estates."

 nd_gbu.14.t: "The Bourse of the World"
 nd_gbu.14.d: "Antwerp is the clearing house of the Atlantic. Pepper, silk, silver, copper, sugar, and bills of exchange clear at the Burgundian bourse. The Italian banking houses keep counting offices on the Meir; the Fugger correspondents in Augsburg follow Antwerp prices; the Spanish silver fleets remit to Burgundian factors.\n\nA final question: shall the bourse be made a true clearing house of all Europa -- the dependable settlement engine for every prince's debts and merchant's bills -- or shall it be the headquarters of an Atlantic floribunda, the kingdom expanding its colonial reach as far as the navy's wake will carry it?"
 nd_gbu.14.a: "The clearing house -- the bourse settles the debts of Europa."
 nd_gbu.14.b: "The Atlantic floribunda -- the colonial reach grows seaward."

 # === Destiny Timed Modifiers ===
 STATIC_MODIFIER_NAME_nd_gbu_dest_rhineland_war_chest: "Rhineland War Chest"
 STATIC_MODIFIER_DESC_nd_gbu_dest_rhineland_war_chest: "Treasury, mint, and tax-gatherers all bent to the Imperial campaign. The gendarme companies ride to fresh musters; the bombard train rolls east. The realm pays for the war in coin and inflation, but the war is being won."
 STATIC_MODIFIER_NAME_nd_gbu_dest_imperial_diet_overture: "Imperial Diet Overture"
 STATIC_MODIFIER_DESC_nd_gbu_dest_imperial_diet_overture: "The conquered princes are summoned to a Burgundian high court. Garrisons hold the cities; charters and oaths integrate the local nobility by bargain rather than the sword. The march is bound to the kingdom by political ligature, not military weight alone."

 STATIC_MODIFIER_NAME_nd_gbu_dest_caesar_lotharius: "Caesar Lotharius"
 STATIC_MODIFIER_DESC_nd_gbu_dest_caesar_lotharius: "The Burgundian king bears the Imperial dignity. The host parades through Frankfurt under the saltire; the bombards announce victory at every electoral seat; the chronicles write of Caesar Lotharius as Charlemagne reborn."
 STATIC_MODIFIER_NAME_nd_gbu_dest_palatine_court: "The Palatine Court"
 STATIC_MODIFIER_DESC_nd_gbu_dest_palatine_court: "The Aachen palatine chapel is restored as the new Imperial seat. The Burgundian court installs itself among the bones of Charlemagne; the construction yards across the realm raise palaces to match."

 STATIC_MODIFIER_NAME_nd_gbu_dest_burgundian_argonauts: "The Burgundian Argonauts"
 STATIC_MODIFIER_DESC_nd_gbu_dest_burgundian_argonauts: "Royal expeditions sail under the saltire: explorers in the king's service, naval squadrons charting the Atlantic. The fleet trains, the dockyards run, the kingdom turns its face to the western horizon."
 STATIC_MODIFIER_NAME_nd_gbu_dest_atlantic_charters: "Atlantic Charters"
 STATIC_MODIFIER_DESC_nd_gbu_dest_atlantic_charters: "Bourgeois investors of Antwerp and Bruges purchase royal charters and outfit their own ventures. Trade range stretches; merchant houses keep books across three oceans. The kingdom's reach grows by private capital, though distant outposts strain the bonds of loyalty."

 STATIC_MODIFIER_NAME_nd_gbu_dest_clearing_house_europa: "The Clearing House of Europa"
 STATIC_MODIFIER_DESC_nd_gbu_dest_clearing_house_europa: "Antwerp settles the debts of Europe. Italian banking houses, Augsburg merchants, Spanish silver fleets, English drapers all keep accounts here. The bourse is the dependable settlement engine for every prince's bills."
 STATIC_MODIFIER_NAME_nd_gbu_dest_atlantic_floribunda: "Atlantic Floribunda"
 STATIC_MODIFIER_DESC_nd_gbu_dest_atlantic_floribunda: "The kingdom blossoms across the Atlantic. Burgundian sails crowd the colonial routes; native populations in the outposts are absorbed into the kingdom's commerce. The new lands consume armies, but the wealth they return is past counting."

 # === Destiny Buildings ===
 nd_gbu_carolingian_palatium: "Carolingian Palatium"
 nd_gbu_carolingian_palatium_desc: "The palatine chapel and royal seat in the Carolingian style: octagonal nave, marble columns, mosaics in the Byzantine pattern. Modelled on Charlemagne's palace at Aachen and raised as the architectural seal of the restored Lotharingian Imperium."
 nd_gbu_world_bourse: "World Bourse"
 nd_gbu_world_bourse_desc: "The expansion of the Antwerp Bourse into a true global clearing house. Bills of exchange, bonds, commodities, and silver remittances from three oceans clear here daily. The bourse is the financial pivot of the Atlantic world."

 # === Destiny PMs ===
 nd_gbu_palatium_upkeep: "Palatine Upkeep"
 nd_gbu_palatium_upkeep_desc: "The ceremonial upkeep of the imperial palatine chapel: candles, vestments, processional regalia, and the daily liturgy of the Burgundian Caesar."
 nd_gbu_world_bourse_upkeep: "World Clearing"
 nd_gbu_world_bourse_upkeep_desc: "The clearing of bills, bonds, and accounts at the World Bourse, where the European price of every traded good and every prince's debt is settled."

 # === Bureaucracies ===
 AUTO_MODIFIER_NAME_nd_gbu_bureaucracy_authority: "Burgundian Composite Administration"
 AUTO_MODIFIER_DESC_nd_gbu_bureaucracy_authority: "The Burgundian state binds seventeen provinces under one magisterial chancery. The royal council may sustain two standing institutions in addition to the establishment of the capital."

 gbu_etats_generaux_bureaucracy: "Etats Generaux de Bourgogne"
 gbu_etats_generaux_bureaucracy_desc: "The standing representative diet of the Burgundian arc, first convoked at Bruges by Philip the Good in January 1464 as a single assembly of the Three Estates of all his lands. Where the French Estates General sat at the king's summons and dispersed at his pleasure, the Burgundian Etats Generaux became a permanent constitutional partner: the king could levy no aide without their consent, and the Grand Privilege of 1477 codified their right to convoke themselves. The institution was the direct ancestor of the States General of the Dutch Republic."

 gbu_toison_dor_bureaucracy: "Ordre de la Toison d'Or"
 gbu_toison_dor_bureaucracy_desc: "The Order of the Golden Fleece, founded at Bruges on 10 January 1430 by Philip the Good on the day of his marriage to Isabella of Portugal. Twenty-four knights at the founding (raised to thirty-one in 1432, fifty-one under Charles V), each great house of the Burgundian inheritance bound to the dynasty by personal chivalric oath. The Sovereign-King of Arms maintains the armorial register; the Statutes regulate chapters, expulsions, and the inheritance of stalls. Simultaneously a chivalric corps, a diplomatic instrument, and a political mechanism for tying the high nobility to the magisterial house."

 gbu_chambre_des_comptes_bureaucracy: "Chambre des Comptes de Lille"
 gbu_chambre_des_comptes_bureaucracy_desc: "The Burgundian financial accounting chamber, established at Lille in 1386 by Philip the Bold (a Brussels chamber was added in 1404 for the Brabantine domain, and from 1473 the audit work was progressively centralized at Mechelen under Charles the Bold). Its auditeurs and treasurers review every demesne revenue, customs farm, and feudal aide across the king's lands; the Burgundian gros silver coin sets a kingdom-wide monetary standard. By the mid-fifteenth century one of the most disciplined treasury bureaucracies in Latin Europe."

 gbu_grand_conseil_malines_bureaucracy: "Grand Conseil de Malines"
 gbu_grand_conseil_malines_bureaucracy_desc: "The supreme judicial council and chancery of the Burgundian Netherlands, established by Charles the Bold's edict of 8 December 1473 at Mechelen as the central tribunal of last resort for the seventeen provinces. It hears appeals from the provincial councils of Holland, Brabant, Flanders, and Hainaut; seals magisterial decrees; and bypasses the seigneurial courts of the high nobility. The institutional ancestor of the Brussels central councils of the Habsburg Netherlands."
