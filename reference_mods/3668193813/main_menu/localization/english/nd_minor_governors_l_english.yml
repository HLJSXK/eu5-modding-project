l_english:

 # Buildings
 nd_provincial_estate: "Provincial Estate"
 nd_provincial_estate_desc: "A noble-staffed seat of provincial government in a distant city, extending the crown's reach into the realm at the cost of conceding local influence to the nobility. Weaker than a full Local Governor."
 nd_port_commandery: "Port Commandery"
 nd_port_commandery_desc: "A noble-staffed administrative post in an overseas port beyond the capital's land reach, projecting royal authority across the water at the cost of conceding local influence to the nobility. Weaker than a full Naval Governor."

 # Production methods
 nd_provincial_estate_maintenance: "Provincial Estate Upkeep"
 nd_port_commandery_maintenance: "Port Commandery Upkeep"

 # Build allow tooltips
 nd_provincial_estate_tt: "If there is less than [SCOPE.sCountry('actor').GetModifierValue('num_nd_provincial_estates')] [ShowBuildingTypeName('nd_provincial_estate')] in [SCOPE.sCountry('actor').GetNameWithNoTooltip] (Currently [SCOPE.sCountry('actor').GetTotalBuildingLevelsIncudingUnderConstruction('nd_provincial_estate')|V])."
 nd_port_commandery_tt: "If there is less than [SCOPE.sCountry('actor').GetModifierValue('num_nd_port_commanderies')] [ShowBuildingTypeName('nd_port_commandery')] in [SCOPE.sCountry('actor').GetNameWithNoTooltip] (Currently [SCOPE.sCountry('actor').GetTotalBuildingLevelsIncudingUnderConstruction('nd_port_commandery')|V])."

 # Modifier names
 MODIFIER_TYPE_NAME_num_nd_provincial_estates: "Number of Provincial Estates"
 MODIFIER_TYPE_DESC_num_nd_provincial_estates: "This determines how many [ShowBuildingTypeName('nd_provincial_estate')] a country can build."
 MODIFIER_TYPE_NAME_num_nd_port_commanderies: "Number of Port Commanderies"
 MODIFIER_TYPE_DESC_num_nd_port_commanderies: "This determines how many [ShowBuildingTypeName('nd_port_commandery')] a country can build."
