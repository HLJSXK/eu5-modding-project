l_english:
 # ===== TOOLTIP HOOKS FOR EVENT VARIABLES =====
 nd_aeg_formed_tt: "Aegyptus has been forged."
 nd_aeg_path_a_tt: "Following the path of the Mamluk Sultan-Pharaoh."
 nd_aeg_path_b_tt: "Following the path of the Caliph of Egypt."
 nd_aeg_path_c_tt: "Following the path of the Coptic-Islamic Synthesis."

 # ===== STATIC MODIFIERS — FORMATION CHOICES =====
 STATIC_MODIFIER_NAME_nd_aeg_sultan_pharaoh: "The Mamluk Sultan-Pharaoh"
 STATIC_MODIFIER_DESC_nd_aeg_sultan_pharaoh: "The slave-aristocracy of the citadel rules from Cairo as heir to the Pharaohs. The Nile is the throne; the lance, the bow, and the sword are the regalia. Mamluk hegemony is the new dynastic order."
 STATIC_MODIFIER_NAME_nd_aeg_caliph_of_egypt: "The Caliph of Egypt"
 STATIC_MODIFIER_DESC_nd_aeg_caliph_of_egypt: "Cairo restores the Abbasid line that survived Baghdad's fall. The Sultan as Protector of the Caliph. The ulama of al-Azhar set the law of the realm. Sunni jurisprudence is the spine of statecraft."
 STATIC_MODIFIER_NAME_nd_aeg_coptic_synthesis: "The Coptic-Islamic Synthesis"
 STATIC_MODIFIER_DESC_nd_aeg_coptic_synthesis: "Pharaonic, Coptic, and Islamic threads woven into one Egyptian identity. The clerks of the diwan are Copts; the soldiers of the citadel are Muslim; the monuments of the desert are everyone's. Egypt apart from the umma."

 # ===== STATIC MODIFIERS — ADVANCE EVENTS =====
 STATIC_MODIFIER_NAME_nd_aeg_dynastic_legitimacy: "Pharaonic Dynastic Legitimacy"
 STATIC_MODIFIER_DESC_nd_aeg_dynastic_legitimacy: "The Sultan stands in the line of Memphis and Thebes. Court chroniclers write the genealogy back to Menes."
 STATIC_MODIFIER_NAME_nd_aeg_imperial_centralization: "Imperial Centralization"
 STATIC_MODIFIER_DESC_nd_aeg_imperial_centralization: "Cairo absorbs the diwans, the iqta system, and the provincial governors into a single court."

 STATIC_MODIFIER_NAME_nd_aeg_azhar_jurisprudence: "Azhari Jurisprudence"
 STATIC_MODIFIER_DESC_nd_aeg_azhar_jurisprudence: "The four Sunni schools of law converge at al-Azhar. The fatawa of Cairo carry weight from Andalusia to Aceh."
 STATIC_MODIFIER_NAME_nd_aeg_azhar_outreach: "Azhari Outreach"
 STATIC_MODIFIER_DESC_nd_aeg_azhar_outreach: "Students arrive from every corner of the Sunni world to study at the academy. They return as missionaries of Cairene authority."

 STATIC_MODIFIER_NAME_nd_aeg_pilgrim_revenue: "Hajj Caravan Revenue"
 STATIC_MODIFIER_DESC_nd_aeg_pilgrim_revenue: "Pilgrims pay tolls, bring goods, and trade through Cairo. The mahmal procession to Mecca is a fiscal cornerstone."
 STATIC_MODIFIER_NAME_nd_aeg_protector_of_holy_cities: "Protector of the Two Holy Cities"
 STATIC_MODIFIER_DESC_nd_aeg_protector_of_holy_cities: "Cairo guarantees the safety of Mecca and Medina. The Sharif of Mecca acknowledges the Sultan's suzerainty."

 STATIC_MODIFIER_NAME_nd_aeg_arsenal_of_cairo: "The Arsenal of Cairo"
 STATIC_MODIFIER_DESC_nd_aeg_arsenal_of_cairo: "The cannon-foundries of the citadel cast bronze siege guns and field artillery. The Mamluks no longer disdain the new fire."
 STATIC_MODIFIER_NAME_nd_aeg_mamluk_continuity: "Mamluk Cavalry Continuity"
 STATIC_MODIFIER_DESC_nd_aeg_mamluk_continuity: "The lance, bow, and sword retain their place. Slaves of the citadel still decide the field. The horse remains the throne of war."

 STATIC_MODIFIER_NAME_nd_aeg_caliphal_authority: "Caliphal Authority"
 STATIC_MODIFIER_DESC_nd_aeg_caliphal_authority: "The Sultan presents the Caliph at every Friday prayer. The khutba is read in his name across the realm."
 STATIC_MODIFIER_NAME_nd_aeg_caliphal_diplomacy: "Caliphal Diplomacy"
 STATIC_MODIFIER_DESC_nd_aeg_caliphal_diplomacy: "Foreign Sunni rulers seek the Caliph's investiture. Ambassadors from Delhi to Granada bow at Cairo's court."

 STATIC_MODIFIER_NAME_nd_aeg_canal_revenue: "Suez Canal Revenue"
 STATIC_MODIFIER_DESC_nd_aeg_canal_revenue: "The cut between the seas turns Egypt into the toll-keeper of world trade."
 STATIC_MODIFIER_NAME_nd_aeg_world_crossroads: "Crossroads of the World"
 STATIC_MODIFIER_DESC_nd_aeg_world_crossroads: "Cairo and Alexandria become the entrepots between Europe, Africa, and the Indian Ocean."

 STATIC_MODIFIER_NAME_nd_aeg_national_renaissance: "Egyptian National Renaissance"
 STATIC_MODIFIER_DESC_nd_aeg_national_renaissance: "Pharaonic, Coptic, and Arab strands recognized as one shared inheritance. The nahda flowers in Cairo's bookshops and presses."
 STATIC_MODIFIER_NAME_nd_aeg_khedival_reform: "Khedival Reform"
 STATIC_MODIFIER_DESC_nd_aeg_khedival_reform: "European-style ministries, schools, and rail networks. Egypt modernizes without surrendering its sovereignty."

 # ===== FORMATION EVENT =====
 nd_aeg.1.t: "The Throne of the Two Lands"
 nd_aeg.1.d: "Cairo's banners now fly over Memphis, Damascus, Mecca, Dongola, and Cyrene. The crown of the Two Lands has been placed upon a sultan's head, and the world watches the citadel of Salah ad-Din with both reverence and fear.\n\nThe ulama of al-Azhar speak of caliphal restoration. The amirs of the Bahriyya speak of unbroken Mamluk continuity. The Coptic patriarchs and Muslim merchants of Alexandria speak, more quietly, of an Egypt distinct from any wider umma — a land older than every empire that has ever claimed it.\n\nWhat shall the new Aegyptus be?\n\n#bold This choice unlocks a destiny path in the Traditions tab.#!"
 nd_aeg.1.a: "We rule as Mamluk Sultans, heirs of the Pharaohs"
 nd_aeg.1.b: "Cairo shall be the seat of the Caliphate"
 nd_aeg.1.c: "Pharaonic, Coptic, and Islamic — one Egypt"

 # ===== ADVANCE EVENT 2: Pharaonic Dynastic Claim =====
 nd_aeg.2.t: "The Crown of the Two Lands"
 nd_aeg.2.d: "Court chroniclers, working in Cairo's libraries, trace the Sultan's lineage backward through the Ayyubids, the Fatimids, the Tulunids, the Roman Augusti, the Ptolemies, and the Saite kings — and still further, through the priest-historians of Memphis to the unification of Upper and Lower Egypt under Menes.\n\nThe pharaonic uraeus and the Mamluk turban appear together on coins struck in the citadel. The genealogy is a fiction, but a useful one: it makes the Sultan unique among Muslim rulers, the only one whose line reaches back five thousand years."
 nd_aeg.2.a: "Make the Sultan a sacred figure of the dynasty"
 nd_aeg.2.b: "Centralize the diwans and the provincial governors at Cairo"

 # ===== ADVANCE EVENT 3: al-Azhar =====
 nd_aeg.3.t: "The Lamp of al-Azhar"
 nd_aeg.3.d: "Founded in 970 by the Fatimid general Jawhar al-Siqilli, restored as a Sunni academy by Salah ad-Din, al-Azhar is now the foremost juridical institution of the Sunni world. The four madhhabs each have their iwan; students arrive from West Africa, India, the Caucasus, and Andalusia, and return home as judges, preachers, and missionaries of Cairo's authority.\n\nThe Shaykh al-Azhar is, in practice, the chief jurist of Sunni Islam. His fatwas carry weight where no army can reach."
 nd_aeg.3.a: "Codify Sunni law from al-Azhar's iwans"
 nd_aeg.3.b: "Send Azhari graduates abroad as missionaries of Cairo"

 # ===== ADVANCE EVENT 4: Hajj Custodianship =====
 nd_aeg.4.t: "Servant of the Two Holy Mosques"
 nd_aeg.4.d: "The mahmal procession leaves Cairo each year, the kiswa folded inside its palanquin: the embroidered black silk that drapes the Kaaba, woven in Egypt and renewed annually. The Sharif of Mecca, descendant of the Prophet, rides out to meet it; he holds his throne by the Sultan's leave.\n\nTo guard the hajj is to guard Islam itself. To bear the title #bold Khadim al-Haramayn ash-Sharifayn#! — Servant of the Two Noble Sanctuaries — is to claim primacy over every Muslim ruler from Andalusia to Aceh."
 nd_aeg.4.a: "Take revenue from pilgrim caravans and tolls"
 nd_aeg.4.b: "Take the title Khadim al-Haramayn"

 # ===== ADVANCE EVENT 5: Gunpowder Transition =====
 nd_aeg.5.t: "The Bronze Cannons of the Citadel"
 nd_aeg.5.d: "The amirs of the citadel have long despised the firearm: it is the weapon of footmen, unworthy of the slave-aristocracy that fights from horseback with the lance. At Marj Dabiq in 1516, this contempt cost the Mamluks their state.\n\nThis time, history bends. Bronze is cast in the citadel's foundries. Cairo's arsenal pours out artillery for the field and the siege. The argument among the amirs is not whether to adopt the new weapons, but whether the Mamluk way of war must be remade entirely — or whether the cannon can serve the cavalry without replacing it."
 nd_aeg.5.a: "Build the new arsenal and field artillery train"
 nd_aeg.5.b: "Keep the Mamluk cavalry at the heart of war"

 # ===== ADVANCE EVENT 6: Cairo Caliphate =====
 nd_aeg.6.t: "The Successor of the Prophet, in Cairo"
 nd_aeg.6.d: "When Hulagu's Mongols sacked Baghdad in 1258, a fugitive of the Abbasid line was brought to Cairo. The Mamluk sultans hosted this shadow caliphate for two and a half centuries: the Caliph blessed the Sultan's accession, the Sultan kept the Caliph in dignified obscurity. After the Ottomans, the line was meant to end.\n\nIt does not end. Cairo proclaims the Caliph in his own right. The black banners of the Abbasids fly again over the citadel. The khutba in every mosque of Aegyptus invokes him by name."
 nd_aeg.6.a: "Wield the Caliph's spiritual authority"
 nd_aeg.6.b: "Use the Caliphate as a tool of diplomacy"

 # ===== ADVANCE EVENT 7: Suez Ambitions =====
 nd_aeg.7.t: "The Cut Between the Seas"
 nd_aeg.7.d: "The Pharaohs built canals from the Nile to the Red Sea — Necho II, Darius the Persian, Ptolemy II, Trajan, Amr ibn al-As. The cuts silted up; the dream did not. Egyptian engineers walk the Bitter Lakes again with theodolites and excavation diagrams.\n\nA full canal between the Mediterranean and the Red Sea would shorten the world. Goods that round the Cape would instead pass through Egyptian customs houses. Whoever holds the canal would hold the meeting-point of three continents."
 nd_aeg.7.a: "Charge tolls on every ship between the seas"
 nd_aeg.7.b: "Make Cairo the crossroads of world commerce"

 # ===== ADVANCE EVENT 8: Pan-Egyptian Identity =====
 nd_aeg.8.t: "The Three Threads of Egypt"
 nd_aeg.8.d: "In the printing presses of Bulaq and the lecture halls of al-Azhar, scholars of the nahda articulate a new account of who the Egyptians are. They are the people of Pharaoh: the same hands that built the pyramids still till the Nile valley. They are the people of the Coptic patriarchs, who preserved the Egyptian language in the liturgy of Saint Mark. They are the people of Amr ibn al-As, who brought Arabic and Islam without erasing what was already there.\n\nNot Arab, not African, not Mediterranean — but all of these and uniquely none. The new Aegyptian must learn what the new Aegyptus has always been."
 nd_aeg.8.a: "Renaissance — letters, archaeology, presses"
 nd_aeg.8.b: "Modernization — ministries, schools, factories"

 # ===== ADVANCES =====
 nd_aeg_pharaonic_claim: "Pharaonic Dynastic Claim"
 nd_aeg_pharaonic_claim_desc: "The Sultan is enthroned not only as commander of the Mamluk amirs but as heir to a dynastic line traced through the Ptolemies and Saite kings to the unification of the Two Lands. Court genealogists fuse Islamic and pre-Islamic legitimacy."
 nd_aeg_coptic_islamic_synthesis: "Coptic-Islamic Synthesis"
 nd_aeg_coptic_islamic_synthesis_desc: "The Egyptian populace — Muslim, Coptic Christian, Jewish — is treated as one civilizational continuity rather than a conqueror and conquered. Coptic feasts, Islamic festivals, and ancient Egyptian agricultural seasons share the calendar."
 nd_aeg_nile_irrigation: "Nile Irrigation Engineering"
 nd_aeg_nile_irrigation_desc: "Shaduf, basin irrigation, and canal-clearing corvée elevated to a state science. The Nilometer at Roda calibrates taxes to the flood. Famine is a political failure, not an act of God."
 nd_aeg_bedouin_auxiliaries: "Bedouin Auxiliary Cavalry"
 nd_aeg_bedouin_auxiliaries_desc: "The Banu Sulaym, Banu Hilal, and Hejazi tribes provide light horse to the imperial army in exchange for desert autonomy and grazing rights."
 nd_aeg_citadel_doctrine: "Citadel of Saladin Doctrine"
 nd_aeg_citadel_doctrine_desc: "The fortress on Mokattam, raised by Salah ad-Din against the Crusaders, becomes the template of a fortification doctrine for every Aegyptian city — overlooking the urban quarter, garrisoned by Mamluks, the seat of the governor."

 nd_aeg_al_azhar_scholarship: "al-Azhar Scholarship"
 nd_aeg_al_azhar_scholarship_desc: "Cairo's millennium-old academy becomes the supreme juridical institution of the Sunni world. The four madhhabs, hadith sciences, kalam, and Arabic grammar are taught at scale to scholars from every quarter of the umma."
 nd_aeg_khan_al_khalili: "Khan al-Khalili"
 nd_aeg_khan_al_khalili_desc: "The vast bazaar quarter of Cairo, founded under Sultan Barquq in 1382 and continuously expanded. Spice merchants, silversmiths, perfumers, and silk weavers occupy the wikalat and qaysariyyat clustered around the Hussein mosque."
 nd_aeg_mamluk_lancer: "Mamluk Lancer Revival"
 nd_aeg_mamluk_lancer_desc: "The slave-aristocracy is restored as the elite arm. Lance, composite bow, and saif are mastered in the maydan; the furusiyya treatises are studied as living doctrine."
 nd_aeg_damascus_silk: "Damascus Silk Axis"
 nd_aeg_damascus_silk_desc: "Damascus and Aleppo, drawn into the Aegyptian state, supply silk and damask fabrics that pass through Cairo to the Mediterranean. The Levantine inland capital is a second pole of imperial commerce."
 nd_aeg_hajj_custodianship: "Hajj Custodianship"
 nd_aeg_hajj_custodianship_desc: "The Sultan, as Servant of the Two Holy Mosques, organizes and protects the annual mahmal caravan. Pilgrim safety becomes a state monopoly; the kiswa of the Kaaba is woven in Egypt."
 nd_aeg_mamluk_maydan: "Mamluk Maydan"
 nd_aeg_mamluk_maydan_desc: "The open training-grounds where Mamluks practice horsemanship, archery, swordsmanship, and lance-charges according to the furusiyya manuals. Rituals of military aristocracy reinforced into the Renaissance era."

 nd_aeg_pharaonic_monumentalism: "Pharaonic Monumental Architecture"
 nd_aeg_pharaonic_monumentalism_desc: "Public works on the New Kingdom scale — colossal mosques, water-clocks, grand gateways, axial avenues. The Sultan as Pharaoh leaves stone testimony in every major city."
 nd_aeg_red_sea_trade: "Red Sea Pilgrim Trade"
 nd_aeg_red_sea_trade_desc: "The route from Suez to Jeddah, and beyond to the Indian Ocean, dominated by Egyptian and Yemeni merchants. Spice, coffee, and textiles pass through Cairo's customs en route to Alexandria."
 nd_aeg_nubian_gold: "Nubian Gold"
 nd_aeg_nubian_gold_desc: "The Dongola goldfields and the Saharan trans-shipment routes funnel bullion through Aswan to Cairo's mints. The dirham of Aegyptus circulates from Genoa to Calicut."
 nd_aeg_coptic_monasticism: "Coptic Monastic Continuity"
 nd_aeg_coptic_monasticism_desc: "The desert monasteries of Wadi Natrun, Saint Catherine's, and Saint Anthony's preserve manuscript traditions, agricultural learning, and Coptic literacy. Integrated into the imperial library system."
 nd_aeg_bahriyya_marines: "Bahriyya Marines"
 nd_aeg_bahriyya_marines_desc: "The original Bahri Mamluks took their name from the Nile barracks on Roda island. The doctrine returns as a riverine and amphibious infantry — Nile fleets, Red Sea galleys, Mediterranean coastal patrols."

 nd_aeg_gunpowder_transition: "Gunpowder Transition"
 nd_aeg_gunpowder_transition_desc: "The historical reluctance of the Mamluks to embrace artillery is overcome. Cairo's foundries cast bronze cannon; field artillery trains accompany the imperial army; sieges are conducted with reduction batteries instead of long blockades."
 nd_aeg_cairo_caliphate: "Cairo Caliphate Restored"
 nd_aeg_cairo_caliphate_desc: "The Abbasid line preserved at Cairo since 1261 is elevated from honorary shadow to functioning Caliph. The Sultan becomes Protector; the Caliph confers legitimacy; together they speak for Sunni Islam."
 nd_aeg_cyrenaica_frontier: "Cyrenaica Frontier"
 nd_aeg_cyrenaica_frontier_desc: "The Libyan littoral from Benghazi to Ajdabiya, long a borderland between Egypt and the Maghreb, is administered through fortified caravan stations and tribal compacts with the Sanusi-style brotherhoods."
 nd_aeg_sultan_pharaoh_dynasty: "Sultan-Pharaoh Dynasty"
 nd_aeg_sultan_pharaoh_dynasty_desc: "The Mamluk principle of slave-soldier elevation is fused with hereditary dynastic claim. The dynasty holds because both the citadel and the priesthood acknowledge the same ruler."
 nd_aeg_burji_guard: "Burji Imperial Guard"
 nd_aeg_burji_guard_desc: "The Circassian household troops of the citadel — the Burjiyya, named for the towers (burj) where they were quartered — become the disciplined infantry core of the imperial army."

 nd_aeg_pharaonic_administration: "Pharaonic Civil Administration"
 nd_aeg_pharaonic_administration_desc: "Diwan bureaucracy, Coptic clerks, and Hellenistic-style record offices fused into a comprehensive administration. The kashifs answer to Cairo; Cairo answers to the Sultan-Pharaoh."
 nd_aeg_modernized_cavalry: "Modernized Mamluk Cavalry"
 nd_aeg_modernized_cavalry_desc: "The slave-aristocracy adapts: horse pistols, dragoon tactics, combined-arms with artillery. The lance and bow do not disappear, but they share the saddle with the carbine."
 nd_aeg_nile_state_irrigation: "Nile State Irrigation"
 nd_aeg_nile_state_irrigation_desc: "Corvée labor, mobilized by the Pharaoh-Sultans of old, is mobilized again under absolutist rule. Canals are dredged, dams are raised, and basin agriculture is extended into Upper Egypt and Nubia."
 nd_aeg_coptic_bureaucracy: "Coptic Bureaucratic Class"
 nd_aeg_coptic_bureaucracy_desc: "The diwan al-mal and the revenue offices are dominated by Coptic Christian families — literate, multilingual, and dependent on the Sultan rather than the ulama. A counterweight to the citadel and the mosque alike."
 nd_aeg_imperial_cairo: "Imperial Cairo"
 nd_aeg_imperial_cairo_desc: "Al-Qahira, the Victorious, becomes the metropolis of three continents. Population approaches a million. Embassies of every Sunni and Christian power crowd the Citadel quarter."

 nd_aeg_suez_ambitions: "Suez Ambitions"
 nd_aeg_suez_ambitions_desc: "The Pharaonic dream of cutting between the seas is revived. Engineers survey the route, the Bitter Lakes are excavated, and the canal from Port Said to Suez is opened — Egyptian-owned, Egyptian-administered, Egyptian-tolled."
 nd_aeg_khedival_modernization: "Khedival Modernization"
 nd_aeg_khedival_modernization_desc: "European-style ministries, conscript armies, normal schools, and railroads — all undertaken without surrendering sovereignty. Cairo learns from Paris and Istanbul without becoming subject to either."
 nd_aeg_industrial_spring: "Egyptian Industrial Spring"
 nd_aeg_industrial_spring_desc: "Nile Delta cotton mills, Cairo arsenals, sugar refineries at Minya, and shipyards at Alexandria. Egyptian industry begins to feed Egyptian armies and Egyptian markets."
 nd_aeg_pan_egyptian_identity: "Pan-Egyptian Identity"
 nd_aeg_pan_egyptian_identity_desc: "Pharaonic, Coptic, and Arab heritage articulated as a single national inheritance. The Egyptian is neither merely Arab nor merely African nor merely Mediterranean — Egypt is its own civilization, older and larger than any successor."

 # ===== UNITS =====
 a_nd_aeg_bedouin_horse: "Bedouin Auxiliary"
 a_nd_aeg_bedouin_horse_desc: "Light horse drawn from the Banu Sulaym, Banu Hilal, and Hejazi tribes. Fast raiders and scouts; lightly armored, immune to desert attrition."
 a_nd_aeg_bedouin_horse_levy: "Bedouin Auxiliary"
 a_nd_aeg_bedouin_horse_levy_desc: "Tribal cavalry levies raised from the desert frontier nobles."
 a_nd_aeg_mamluk_lancer: "Mamluk Lancer"
 a_nd_aeg_mamluk_lancer_desc: "The slave-aristocracy of the citadel: armored cavalry trained from boyhood in lance, composite bow, and saif. The shock arm of the imperial army."
 a_nd_aeg_mamluk_lancer_levy: "Mamluk Lancer"
 a_nd_aeg_mamluk_lancer_levy_desc: "Mamluk household cavalry of the amirs, raised through the slave-aristocracy levy system."
 a_nd_aeg_bahriyya: "Bahriyya Marines"
 a_nd_aeg_bahriyya_desc: "Riverine and amphibious infantry quartered in the Nile barracks. Trained to cross water, board ships, and outflank from the river."
 a_nd_aeg_bahriyya_levy: "Bahriyya Marines"
 a_nd_aeg_bahriyya_levy_desc: "Riverine infantry raised from the Nile-fleet population."
 a_nd_aeg_burji_guard: "Burji Imperial Guard"
 a_nd_aeg_burji_guard_desc: "Circassian household troops of the citadel — the Burjiyya, named for the towers where they were quartered. Heavily armored, disciplined, the defensive backbone of the imperial army."
 a_nd_aeg_burji_guard_levy: "Burji Imperial Guard"
 a_nd_aeg_burji_guard_levy_desc: "Citadel garrison troops raised from the soldier estate."
 a_nd_aeg_khedival_nizam: "Khedival Nizam"
 a_nd_aeg_khedival_nizam_desc: "European-drilled line infantry of the Khedival reform — uniformed, conscripted, equipped with rifled muskets. The new Egyptian way of war."

 # ===== LEVIES =====
 levy_nd_aeg_bedouin_horse: "Bedouin Auxiliary Levy"
 levy_nd_aeg_mamluk_lancer: "Mamluk Lancer Levy"
 levy_nd_aeg_bahriyya: "Bahriyya Marine Levy"
 levy_nd_aeg_burji_guard: "Burji Guard Levy"

 # ===== BUILDINGS =====
 nd_aeg_citadel_of_saladin: "Citadel of Saladin"
 nd_aeg_citadel_of_saladin_desc: "The fortress on the Mokattam ridge, raised by Salah ad-Din against the Crusaders. Garrisoned by the Burjiyya and seat of the Sultan-Pharaoh, it overlooks Cairo as both palace and arsenal."
 nd_aeg_shaduf_network: "Nile Shaduf Network"
 nd_aeg_shaduf_network_desc: "Lever-and-counterweight irrigation systems, basin canals, and dyke maintenance. The Nilometer governs the tax season; the corvée maintains the canals; the harvest feeds three continents."
 nd_aeg_al_azhar: "al-Azhar"
 nd_aeg_al_azhar_desc: "The supreme Sunni juridical academy, founded in 970 in Cairo. The four madhhabs each have their iwan; students arrive from every corner of the umma; Azhari fatwas carry weight from Andalusia to Aceh."
 nd_aeg_khalili_bazaar: "Khan al-Khalili Bazaar"
 nd_aeg_khalili_bazaar_desc: "The vast bazaar quarter of Cairo. Spice merchants, silversmiths, perfumers, silk weavers, coffee houses, and pilgrim caravan stations cluster around the Hussein mosque."
 nd_aeg_maydan: "Mamluk Maydan"
 nd_aeg_maydan_desc: "The open training-ground where Mamluks practice horsemanship, archery, swordsmanship, and lance-charges according to the furusiyya manuals. The forge of the slave-aristocracy."
 nd_aeg_pharaonic_monument: "Pharaonic Monument"
 nd_aeg_pharaonic_monument_desc: "Colossal architecture in the New Kingdom mode — grand mosques, axial avenues, water-clocks, sphinx-flanked gateways. The Sultan as Pharaoh writes his name on the stone of his cities."
 nd_aeg_coptic_monastery: "Coptic Monastery"
 nd_aeg_coptic_monastery_desc: "Desert hermitages and walled foundations of the Coptic Orthodox Church — Wadi Natrun, Saint Anthony's, Saint Catherine's. Preserve manuscripts, agricultural learning, and Coptic literacy under imperial patronage."
 nd_aeg_cairo_arsenal: "Cairo Arsenal"
 nd_aeg_cairo_arsenal_desc: "Bronze cannon foundries of the citadel. Imperial mosques become artillery proving-grounds; the master-founders of Cairo are the rivals of Istanbul and Venice."
 nd_aeg_nubian_mint: "Nubian Mint"
 nd_aeg_nubian_mint_desc: "The mint complex at Aswan that turns Dongola gold and Saharan bullion into the dirhams and dinars of Aegyptus. Stamps the Sultan-Pharaoh's name into circulation from Genoa to Calicut."

 # ===== DESTINY ADVANCES =====
 nd_aeg_destiny: "Destiny of Aegyptus"
 nd_aeg_destiny_desc: "The crown of the Two Lands has been placed. The path now opens — whether the empire reaches outward in conquest, or inward as a civilization that need not move to be felt."
 nd_aeg_dest_maghreb_reach: "Maghreb Reach"
 nd_aeg_dest_maghreb_reach_desc: "Push west of Cyrenaica into the Ifriqiyan littoral. Take Tripoli and Kairouan — the old Aghlabid and Hafsid heartland — and place Aegyptian governors on the African coast that no Mamluk ever held. Requires army of 30 regiments and ownership of Tripoli and Kairouan."
 nd_aeg_dest_mesopotamian_push: "Mesopotamian Eastward Push"
 nd_aeg_dest_mesopotamian_push_desc: "Cross the Syrian desert and seize Baghdad and Mosul — the cities the Mongols broke. The Tigris valley becomes an Aegyptian province; the City of Peace, an Aegyptian garrison. Requires Baghdad, Mosul, total development 6000, and an army of 50."
 nd_aeg_dest_pharaonic_empire: "Pharaonic Empire of Three Continents"
 nd_aeg_dest_pharaonic_empire_desc: "Push south past Nubia into the Ethiopian highlands and the Horn frontier. Gondar and Harar fall under the Pharaonic crown. Requires Gondar, Harar, army of 75, prestige 75, and total development 8000. Unlocks the Pharaonic Obelisk."
 nd_aeg_dest_cairo_culture: "Cairo as Cultural Capital"
 nd_aeg_dest_cairo_culture_desc: "The presses of Bulaq, the libraries of the citadel, the lecture halls of al-Azhar. Cairo becomes the city where knowledge is made, copied, and exported. Requires the Printing Press, full ownership of Alexandria province, and 1000 gold."
 nd_aeg_dest_azhar_world: "al-Azhar as World Academy"
 nd_aeg_dest_azhar_world_desc: "Cairo emerges as the intellectual center of the Sunni world — the city that took Baghdad's place. Requires Scientific Revolution, silk in the capital market, and total development 6000."
 nd_aeg_dest_suez_canal: "The Suez Canal Cut"
 nd_aeg_dest_suez_canal_desc: "The Pharaonic dream of cutting between the seas, completed at last. Aegyptian engineers, Aegyptian capital, Aegyptian tolls. Requires Global Trade, ownership of Suez, 3000 gold, prestige 75, and total development 8000. Unlocks the Suez Canal."

 # ===== DESTINY EVENTS =====
 nd_aeg.9.t: "The Path of Destiny"
 nd_aeg.9.d: "The crown rests. The choice is made. The amirs of the citadel and the ulama of al-Azhar have spoken; the merchants of Khan al-Khalili and the Coptic patriarchs have offered their counsel. Whatever Aegyptus is to become, the road now opens before it.\n\nIn the chronicles of Cairo, this is the year that ends one history and begins another."
 nd_aeg.9.a: "Forward, then, into our destiny"
 nd_aeg.10.t: "Banners over Kairouan"
 nd_aeg.10.d: "Aegyptian cavalry crests the dunes west of Sirte and rides into the Ifriqiyan plain. Tripoli's gates open without siege; the Hafsid garrison of Kairouan negotiates surrender within a week. The Mahdist mosque, the Aghlabid ribat, and the great Ummayad cisterns now answer to Cairo. The Maghreb has not seen Egyptian rule since the Fatimids."
 nd_aeg.10.a: "The west is ours"
 nd_aeg.11.t: "Baghdad, City of Peace"
 nd_aeg.11.d: "Aegyptian columns ford the Tigris and accept the surrender of Baghdad — the city Hulagu broke, the city the Jalayirids and Aq Qoyunlu and Safavids held in turn. The black banners of the Abbasids fly again over the round walls. Mosul falls a season later. The amirs of Cairo debate what to do with the Mesopotamian heartland: restore it as the seat of legitimacy, or hold it as a hard frontier?"
 nd_aeg.11.a: "Restore Baghdad as a second imperial seat"
 nd_aeg.11.b: "Hold Mesopotamia as a militarized eastern march"
 nd_aeg.12.t: "An Empire of Three Continents"
 nd_aeg.12.d: "Aegyptian troops crest the Ethiopian escarpment. Gondar's Solomonid emperor accepts vassalage; Harar's Adali walls fall. The reach of Cairo now spans Africa from the Maghreb to the Horn, Asia from the Levant to the Tigris, and the seas between. The court astrologers compute that no power since Rome has held this much of the world. The amirs ask: is this a Pharaonic empire of stone, or a universal monarchy of legitimacy?"
 nd_aeg.12.a: "Raise obelisks across three continents"
 nd_aeg.12.b: "Project the Pharaoh-Sultan as universal monarch"
 nd_aeg.13.t: "The Presses of Bulaq"
 nd_aeg.13.d: "Cairo is no longer merely the seat of armies and the citadel of pharaohs — it is the city where books are made. The Bulaq presses run day and night; copyists of the great libraries are matched by Arabic typesetters who can produce a Quran in a week. The Coptic monasteries, al-Azhar's iwans, and the medical school of Mansoura all draw scholars from every quarter of the umma."
 nd_aeg.13.a: "Cairo writes the books the world will read"
 nd_aeg.14.t: "Cairo Surpasses Baghdad"
 nd_aeg.14.d: "For five centuries Sunni learning has measured itself against the lost glory of Baghdad — the House of Wisdom, the translation movement, the great chain of caliphs and viziers. With Aegyptian conquest, Aegyptian wealth, and Aegyptian patronage, that ghost is finally laid to rest. The Shaykh al-Azhar is now, in fact and in name, the chief jurist of Sunni Islam. The amirs ask: is al-Azhar to be a seat of learning, or a successor to Baghdad's full civilizational authority?"
 nd_aeg.14.a: "al-Azhar as the world's seat of learning"
 nd_aeg.14.b: "Cairo as the new Baghdad — civilization itself"
 nd_aeg.15.t: "The Two Seas Joined"
 nd_aeg.15.d: "After eight years of corvée labor, dredging, and stone-cutting, the cut between the seas is open. The first ship — an Aegyptian galley flying the Pharaoh-Sultan's banner — sails from Suez to Port Said in a single voyage. Trade that once rounded Africa now passes through Aegyptian customs houses; the world's commerce flows across Aegyptian land.\n\nThe amirs ask: is the canal a fiscal mechanism — tolls and taxes — or a civilizational achievement — Cairo and Alexandria as the entrepots of all peoples?"
 nd_aeg.15.a: "The world pays its toll to Aegyptus"
 nd_aeg.15.b: "Cairo as the meeting-point of all peoples"

 # ===== DESTINY TIMED MODIFIERS =====
 STATIC_MODIFIER_NAME_nd_aeg_dest_baghdad_restored: "Baghdad Restored"
 STATIC_MODIFIER_DESC_nd_aeg_dest_baghdad_restored: "The City of Peace flies the banners of Cairo. The Caliph blesses Aegyptian arms; the dīwāns of Mesopotamia answer to Egyptian kashifs."
 STATIC_MODIFIER_NAME_nd_aeg_dest_eastern_marches: "The Eastern Marches"
 STATIC_MODIFIER_DESC_nd_aeg_dest_eastern_marches: "Mesopotamia held as a hard frontier — fortified caravan stations, mobile garrisons, and tribal compacts. The desert wastes erode the soldier as much as the enemy."
 STATIC_MODIFIER_NAME_nd_aeg_dest_three_continents: "Empire of Three Continents"
 STATIC_MODIFIER_DESC_nd_aeg_dest_three_continents: "Aegyptian power projected from the Maghreb to the Horn to Mesopotamia. Levies are raised across continents; war exhaustion is borne over a wider base."
 STATIC_MODIFIER_NAME_nd_aeg_dest_universal_pharaoh: "The Universal Pharaoh"
 STATIC_MODIFIER_DESC_nd_aeg_dest_universal_pharaoh: "Cairo's diplomats serve at every court; new provinces integrate quickly; the imperial roll is filled. But feeding a universal court strains the Nile's harvests."
 STATIC_MODIFIER_NAME_nd_aeg_dest_seat_of_learning: "Seat of Learning"
 STATIC_MODIFIER_DESC_nd_aeg_dest_seat_of_learning: "Scholars rise faster, cultural radiance flows outward, devastated lands rebuild faster under Cairene patronage."
 STATIC_MODIFIER_NAME_nd_aeg_dest_cairo_baghdad: "The New Baghdad"
 STATIC_MODIFIER_DESC_nd_aeg_dest_cairo_baghdad: "Cairo claims the civilizational title that Baghdad lost. The estates accept Cairene leadership; religious authority radiates from al-Azhar. Patronage at this scale is expensive."
 STATIC_MODIFIER_NAME_nd_aeg_dest_world_tollkeeper: "Toll-keeper of the World"
 STATIC_MODIFIER_DESC_nd_aeg_dest_world_tollkeeper: "Every ship between the seas pays Aegyptian tolls. Trade routes through Aegyptian land cost less; gold flows in monthly."
 STATIC_MODIFIER_NAME_nd_aeg_dest_meeting_of_seas: "Meeting of Seas"
 STATIC_MODIFIER_DESC_nd_aeg_dest_meeting_of_seas: "Cairo and Alexandria become the entrepots of three continents. Sailors and migrants flow in; shipyards work at full capacity; Aegyptian fleets ride high morale."

 # ===== DESTINY BUILDINGS =====
 nd_aeg_pharaonic_obelisk: "Pharaonic Obelisk"
 nd_aeg_pharaonic_obelisk_desc: "Towering granite stelae, raised in the conquered cities by Aegyptian masons in the New Kingdom mode. The hieroglyphic cartouche of the Sultan-Pharaoh marks the limit of his reach. Tripoli, Baghdad, Gondar — each city a stela, each stela a claim."
 nd_aeg_suez_canal: "The Suez Canal"
 nd_aeg_suez_canal_desc: "The cut between the seas, completed under Aegyptian engineers and Aegyptian capital. Mediterranean and Red Sea joined; world trade passes through Aegyptian customs; Cairo collects tolls from a hundred flags."

 # ===== DESTINY BUILDING MAINTENANCE PMs =====
 nd_aeg_obelisk_maintenance: "Obelisk Stoneworks"
 nd_aeg_obelisk_maintenance_desc: "Granite quarried at Aswan, hauled by Nile barge, cut and dressed by Aegyptian masons in the New Kingdom mode."
 nd_aeg_suez_canal_maintenance: "Canal Maintenance"
 nd_aeg_suez_canal_maintenance_desc: "The Bitter Lakes silt continually; dredgers, masons, and lock-keepers maintain the cut between the seas."

 # ===== BUREAUCRACIES =====
 # Slot grant on formation
 AUTO_MODIFIER_NAME_nd_aeg_bureaucracy_authority: "Sultan-Pharaoh's Diwan"
 AUTO_MODIFIER_DESC_nd_aeg_bureaucracy_authority: "On formation, [AEG.GetName] inherits the institutional apparatus of the Mamluk-Pharaonic state and may host historical Aegyptian bureaucracies."

 # 1. Iqta-Halqa System
 aeg_iqta_halqa_bureaucracy: "Iqta wa-Halqa"
 aeg_iqta_halqa_bureaucracy_desc: "Standardized by Baybars and Qalawun in the late thirteenth century, the iqta linked an emir's rank to the size of his tax-grant; beneath the mamluk regiments the ajnad al-halqa enrolled native Egyptian and freedmen cavalry under the sultan's direct command. Together the two registers manned every campaign from Ayn Jalut to the Hejaz frontier."

 # 2. Diwan al-Mal
 aeg_diwan_al_mal_bureaucracy: "Diwan al-Mal"
 aeg_diwan_al_mal_bureaucracy_desc: "The fiscal heart of Mamluk Egypt. Coptic Christian scribes dominated the dawawin from the late Fatimid period through the entire Mamluk era, their tax-assessment and bookkeeping expertise passed through family secretarial dynasties such as that of Hibat Allah al-Sadid, mustawfi al-suhba under Qalawun. Whenever popular pressure expelled them, the bureau called them back -- no one else could keep the books."

 # 3. Mashyakhat al-Azhar
 aeg_mashyakhat_azhar_bureaucracy: "Mashyakhat al-Azhar"
 aeg_mashyakhat_azhar_bureaucracy_desc: "Founded by the Fatimids in 970 and converted to Sunni teaching after Saladin's takeover in 1171, al-Azhar became the supreme institution of Sunni jurisprudence after Baghdad fell to the Mongols in 1258. The Hay'at Kibar al-Ulama gathered eminent jurists of all four madhhabs and issued fatwas binding from Morocco to Indonesia; the Sheikh of al-Azhar served as the realm's highest religious office."

 # 4. Khidmat al-Haramayn
 aeg_khidmat_haramayn_bureaucracy: "Khidmat al-Haramayn"
 aeg_khidmat_haramayn_bureaucracy_desc: "From the mid-fourteenth century the Mamluk sultans claimed the title Khadim al-Haramayn al-Sharifayn -- Servant of the Two Noble Sanctuaries. The mahmal, an ornate ceremonial litter dispatched annually with the Egyptian pilgrim caravan, asserted Cairo's sovereignty over the Hejaz road. Sultan al-Ashraf Barsbay used the custodianship to legitimize a foreign-born military caste against rival Muslim claims."

 # 5. Karimi Tujjar al-Khan
 aeg_karimi_tujjar_bureaucracy: "Karimi Tujjar al-Khan"
 aeg_karimi_tujjar_bureaucracy_desc: "The Karimi were the great spice-and-luxury merchants of medieval Egypt, attested from the Fatimid tenth century and consolidated as a commercial corporation by the thirteenth, with Muslim, Jewish, and Coptic members. Khan al-Khalili, founded in 1382 by amir Jaharkas al-Khalili, became their headquarters; by the early sixteenth century the district held twenty-one khans and wikalas in active commercial use."
