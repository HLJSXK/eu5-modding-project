l_english:
 iv2_hist_idea_flag_tt_title_BYZ: "Historic National Idea of $BYZ$"
 iv2_hist_idea_flag_tt_desc_BYZ: "This is a Historic National Idea of $BYZ$."
 
 iv2_historic_idea_BYZ_1: "Repopulation of the Countryside"
 iv2_ga_select_historic_BYZ_1_desc: "Plague, war and civil war have taken their toll on the countryside, leaving it devastated and not suitable for use. We need to encourage settlers into the countryside to rebuild it as a base for our economy."
 iv2_historic_idea_BYZ_2: "Modernize the Corpus Iuris Civilis"
 iv2_ga_select_historic_BYZ_2_desc: "Corpus Iuris Civilis was a codex of laws. Issued by Justinian, it has long been replaced by newer works, but its name could be reutilized as a prestigious title for a brand-new codex."
 iv2_historic_idea_BYZ_3: "$BYZ$ Court"
 iv2_ga_select_historic_BYZ_3_desc: "The $BYZ$ court is always up to surprise you."
 iv2_historic_idea_BYZ_4: ""
 iv2_ga_select_historic_BYZ_4_desc: ""
 iv2_historic_idea_BYZ_5: ""
 iv2_ga_select_historic_BYZ_5_desc: ""
 iv2_historic_idea_BYZ_11: "Restore the Ecumenical Patriarch"
 iv2_ga_select_historic_BYZ_11_desc: "Our Holy Church has long fallen into decay. Let us restore the office to its former glory and so invigorate the Church "
 iv2_historic_idea_BYZ_12: "The Impending Doom"
 iv2_ga_select_historic_BYZ_12_desc: "The Empire is at the brink of destruction. Every Roman citizen is silently aware that the end is nigh, and the days of Roman glory are already numbered. But is there really no hope for the crumbling empire? With the emperors struggling to make alliances with the west and seeking support, there might still be a chance for recovery."
 iv2_historic_idea_BYZ_13: "Basileia Rhomaion"
 iv2_ga_select_historic_BYZ_13_desc: "It has been over a millennium since the two Roman Empires were still united. Split in 395, there were hopes that the act would help stop the decline of the Empire and its political system. Instead, the western half would fall in 476 and eastern half would almost fall to the Ottomans in 15th century. Nobody back then would have believed that the heirs of the Eastern monarchs would rule an Empire whole again. The proclamation of the restored Roman Empire is deserving of a great Triumph in Rome itself."
 iv2_historic_idea_BYZ_14: ""
 iv2_ga_select_historic_BYZ_14_desc: ""
 iv2_historic_idea_BYZ_15: ""
 iv2_ga_select_historic_BYZ_15_desc: ""
 iv2_historic_idea_BYZ_21: "Reverse the Downfall"
 iv2_ga_select_historic_BYZ_21_desc: "The Roman Empire has been consistently declining for about a millennium now. With small periods of recovery from time to time, today we may be lying at the definitive end of our journey. With the Ottoman encroaching and lusting for the city of world's desire, the end is looming. While the Ottomans are still occupied, let us strike and bolster our hold in Greece - our most core territory."
 iv2_historic_idea_BYZ_22: "Protect the Frontiers"
 iv2_ga_select_historic_BYZ_22_desc: "As our empire sees a restoration, so do our frontiers. Let us take an example from the past and properly fortify the border, utilizing the themes as a medium."
 iv2_historic_idea_BYZ_23: "The Strategikon"
 iv2_ga_select_historic_BYZ_23_desc: "Over the centuries, many military manuals have been compiled in order to increase the military prowess of Byzantine monarchs and generals, while also passing expertise through generations."
 iv2_historic_idea_BYZ_24: ""
 iv2_ga_select_historic_BYZ_24_desc: ""
 iv2_historic_idea_BYZ_25: ""
 iv2_ga_select_historic_BYZ_25_desc: ""
 iv2_historic_idea_BYZ_31: "Repulse the Republics"
 iv2_ga_select_historic_BYZ_31_desc: "As our state expands and finds itself in a stronger position, the presence of the Latin Republics in our vicinity turns to be more of an impediment than support. It is time to end our lip service to the merchants. The Aegean islands belong to us and our Burghers."
 iv2_historic_idea_BYZ_32: "Greek Fire"
 iv2_ga_select_historic_BYZ_32_desc: "Its a secret, but its effective!"
 iv2_historic_idea_BYZ_33: ""
 iv2_ga_select_historic_BYZ_33_desc: ""
