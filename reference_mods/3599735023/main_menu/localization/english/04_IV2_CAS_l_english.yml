l_english:
 iv2_hist_idea_flag_tt_title_CAS: "Historic National Idea of Castille"
 iv2_hist_idea_flag_tt_desc_CAS: "This is a Historic National Idea of Castille."
 
 iv2_historic_idea_CAS_1: "Cabildos"
 iv2_ga_select_historic_CAS_1_desc: "Representing the interests of the cities, the 'Cabildos' councils have a wide variety of functions and duties. They are responsible for both advocating the interests of the city to the Crown and for many aspects of local governance. We must continue to establish Cabildos in newly-founded or newly-conquered cities, particularly in the New World where the need for Castilian institutions is felt most severely."
 iv2_historic_idea_CAS_2: "School of Salamanca"
 iv2_ga_select_historic_CAS_2_desc: "Based in the University of Salamanca, the School's interests lie in fields as diverse as theology, economics, and political philosophy. As one of the leading schools of thought in the Catholic world, its entrenched presence in Castile ensures that our nation is always at the forefront of intellectual affairs."
 iv2_historic_idea_CAS_3: "Nueva Planta"
 iv2_ga_select_historic_CAS_3_desc: "It is time to assert true royal authority in the realm; under a single set of laws and a common language, a renewed and centralized Castile will directly appoint officials and enshrine the absolute rule of the monarch."
 iv2_historic_idea_CAS_4: ""
 iv2_ga_select_historic_CAS_4_desc: ""
 iv2_historic_idea_CAS_5: ""
 iv2_ga_select_historic_CAS_5_desc: ""
 iv2_historic_idea_CAS_11: "Spanish Inquisition"
 iv2_ga_select_historic_CAS_11_desc: "No one expected it."
 iv2_historic_idea_CAS_12: "Inter Caetera"
 iv2_ga_select_historic_CAS_12_desc: "On the 4th of May 1493 His Holiness granted us a papal bull granting us all lands west and south of a line 100 leagues west of the islands of the Azores. We will naturally enforce His Holiness's will."
 iv2_historic_idea_CAS_13: "Infantas"
 iv2_ga_select_historic_CAS_13_desc: "The Princes and Princesses of the Crown are among our most valuable assets. They can be sent as royal envoys, married off to secure alliances, or appointed as regents when the need arises. It is important that we ensure that our monarch's loins continue to bear fruit."
 iv2_historic_idea_CAS_14: ""
 iv2_ga_select_historic_CAS_14_desc: ""
 iv2_historic_idea_CAS_15: ""
 iv2_ga_select_historic_CAS_15_desc: ""
 iv2_historic_idea_CAS_21: "The Reconquista"
 iv2_ga_select_historic_CAS_21_desc: "For long years we have waged war against the Moor. This has given us a sturdy discipline that not many can boast. Arise men of Castile and show the world your determination."
 iv2_historic_idea_CAS_22: "Against the Infidels"
 iv2_ga_select_historic_CAS_22_desc: "We have the will to fight the infidels!"
 iv2_historic_idea_CAS_23: ""
 iv2_ga_select_historic_CAS_23_desc: ""
 iv2_historic_idea_CAS_24: ""
 iv2_ga_select_historic_CAS_24_desc: ""
 iv2_historic_idea_CAS_25: ""
 iv2_ga_select_historic_CAS_25_desc: ""
 iv2_historic_idea_CAS_31: "Go for the Colonies!"
 iv2_ga_select_historic_CAS_31_desc: "We have found great wealth in the colonies. Time to exploit it all!"
 iv2_historic_idea_CAS_32: "Mediterranean Ambitions"
 iv2_ga_select_historic_CAS_32_desc: "Lets conquer the Mediterranean and Italy!"
 iv2_historic_idea_CAS_33: "High Seas Fleet"
 iv2_ga_select_historic_CAS_33_desc: "Our colonial ambitions make it necessary that we built a great fleet."
 iv2_historic_idea_CAS_34: ""
 iv2_ga_select_historic_CAS_34_desc: ""
