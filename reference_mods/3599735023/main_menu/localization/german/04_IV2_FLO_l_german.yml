l_german:
 iv2_hist_idea_flag_tt_title_FLO: "Historisch Nationale Idee von Florenz"
 iv2_hist_idea_flag_tt_desc_FLO: "Das sind die Historisch-Nationalen Ideen von Florenz."
 
 iv2_historic_idea_FLO_1: "Geburtsort der Renaissance"
 iv2_ga_select_historic_FLO_1_desc: "Florenz ist schon seit langer Zeit die kulturelle Hauptstadt der Toskana. Angesichts des erneuten Interesses an der klassischen Welt könnte ein kluger Prinz die neuen Denker vielleicht zum Wohle aller anlocken."
 iv2_historic_idea_FLO_2: "Toskanische Bankhäuser"
 iv2_ga_select_historic_FLO_2_desc: "Unsere Bankiers sind von England bis nach Neapel bekannt. Unsere goldenen Florin haben vom Hundertjährigen Krieg bis hin zu neuen Industrien alles finanziert."
 iv2_historic_idea_FLO_3: "Medici Renaissance"
 iv2_ga_select_historic_FLO_3_desc: "Die Medici haben Florenz in ein Goldenes Zeitalter geführt."
 iv2_historic_idea_FLO_4: ""
 iv2_ga_select_historic_FLO_4_desc: ""
 iv2_historic_idea_FLO_5: ""
 iv2_ga_select_historic_FLO_5_desc: ""
 iv2_historic_idea_FLO_11: "Kunstmäzen"
 iv2_ga_select_historic_FLO_11_desc: "Nach der Abschaffung der Republik und der Einführung des Erbherzogtums müssen wir die Größe der Toskana zeigen. Viele große Werke werden zum Ruhme Gottes und des Herzogs in Auftrag gegeben werden."
 iv2_historic_idea_FLO_12: "Porto Franco"
 iv2_ga_select_historic_FLO_12_desc: "Zur Ankurblung des Handels haben wir den Hafen von Livorno zum Freihafen erklärt. Auf die hier gehandelten Güter werden keine Abgaben erhoben und die Einwohner genießen Religionsfreiheit."
 iv2_historic_idea_FLO_13: "Großherzogtum Toskana"
 iv2_ga_select_historic_FLO_13_desc: "Der Heilige Vater selbst hat erklärt, dass die Toskana nicht mehr ein bloßes Herzogtum, sondern ein Großherzogtum sein soll. Zur Vereinigung der Regionen Zentralitaliens werden wir aus unseren Gemeinen stehende Heere ausheben müssen."
 iv2_historic_idea_FLO_14: ""
 iv2_ga_select_historic_FLO_14_desc: ""
 iv2_historic_idea_FLO_15: ""
 iv2_ga_select_historic_FLO_15_desc: ""
 iv2_historic_idea_FLO_21: "Condottieri"
 iv2_ga_select_historic_FLO_21_desc: "Aufgrund der Streitigkeiten zwischen den Stadtstaaten gibt es nun weitaus mehr Söldnertrupps. Wir sollten dafür sorgen, dass unser Geldsäckel immer prall gefüllt ist und sie in Notzeiten um uns scharen."
 iv2_historic_idea_FLO_22: "Krieg gegen den heiligen Vater"
 iv2_ga_select_historic_FLO_22_desc: "Manchmal müssen wir auch gegen den heiligen Vater unsere Interessen mit Gewalt durchsetzen."
 iv2_historic_idea_FLO_23: "Italienische Kriege"
 iv2_ga_select_historic_FLO_23_desc: "Florenz hat eine wichtige Rolle in den Italienischen Kriegen gespielt."
 iv2_historic_idea_FLO_24: ""
 iv2_ga_select_historic_FLO_24_desc: ""
 iv2_historic_idea_FLO_25: ""
 iv2_ga_select_historic_FLO_25_desc: ""
 iv2_historic_idea_FLO_31: "Konkurrenz im Handel"
 iv2_ga_select_historic_FLO_31_desc: "Es wird Zeit für uns in Kokurrenz zu den mächtigen Handelsrepubliken zu treten."
 iv2_historic_idea_FLO_32: ""
 iv2_ga_select_historic_FLO_32_desc: ""
