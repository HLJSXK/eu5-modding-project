l_german:
 iv2_hist_idea_flag_tt_title_cas: "Historic National Idea of Castille"
 iv2_hist_idea_flag_tt_desc_cas: "This is a Historic National Idea of Castille."
 
 iv2_historic_idea_CAS_1: "Cabildos"
 iv2_ga_select_historic_CAS_1_desc: "Die "Cabildo"-Räte vertreten die Interessen der Städte und haben eine Vielzahl von Funktionen und Pflichten. Sie sind dafür verantwortlich sowohl die Interessen der Stadt gegenüber der Krone zu vertreten, als auch für viele Aspekte der lokalen Verwaltung zuständig. Wir müssen weiterhin Cabildos in neu gegründeten oder neu eroberten Städten etablieren, insbesondere in der Neuen Welt, wo der Bedarf an kastilischen Institutionen am stärksten spürbar ist."
 iv2_historic_idea_CAS_2: "Schule von Salamanca"
 iv2_ga_select_historic_CAS_2_desc: "Die Schule ist an der Universität von Salamanca angesiedelt und behandelt unterschiedliche Bereiche wie Theologie, Wirtschaft und politische Philosophie. Als eine der führenden Denkschulen in der katholischen Welt sorgt die fest verankerte Präsenz in Kastilien dafür, dass unsere Nation in intellektuellen Angelegenheiten stets an vorderster Front steht."
 iv2_historic_idea_CAS_3: "Nueva Planta"
 iv2_ga_select_historic_CAS_3_desc: "Es ist an der Zeit, echte königliche Autorität im Reich geltend zu machen. Unter einem einzigen Satz von Gesetzen und einer gemeinsamen Sprache wird ein erneuertes und zentralisierte Kastilien direkt Beamte ernennen und die absolute Herrschaft des Monarchen festigen."
 iv2_historic_idea_CAS_4: ""
 iv2_ga_select_historic_CAS_4_desc: ""
 iv2_historic_idea_CAS_5: ""
 iv2_ga_select_historic_CAS_5_desc: ""
 iv2_historic_idea_CAS_11: "Spanische Inquisition"
 iv2_ga_select_historic_CAS_11_desc: "Niemand hat dies kommen sehen."
 iv2_historic_idea_CAS_12: "Inter Caetera"
 iv2_ga_select_historic_CAS_12_desc: "Am 4. Mai 1493 übertrug uns eine päpstliche Bulle alles Land südlich und westlich einer Linie, die 100 Meilen westlich der Azoren verläuft. Selbstverständlich werden wir dem Willen Seiner Heiligkeit entsprechen."
 iv2_historic_idea_CAS_13: "Infanten"
 iv2_ga_select_historic_CAS_13_desc: "Die Fürsten und Prinzessinnen der Krone gehören zu unseren wertvollsten Gütern. Sie können als königliche Gesandte geschickt werden, verheiratet werden, um Allianzen zu sichern, oder bei Bedarf als Regenten ernannt werden. Es ist wichtig, dass wir sicherstellen, dass die Lenden unseres Monarchen weiterhin Früchte tragen."
 iv2_historic_idea_CAS_14: ""
 iv2_ga_select_historic_CAS_14_desc: ""
 iv2_historic_idea_CAS_15: ""
 iv2_ga_select_historic_CAS_15_desc: ""
 iv2_historic_idea_CAS_21: "Die Reconquista"
 iv2_ga_select_historic_CAS_21_desc: "Viele Jahre lang haben wir gegen die Mauren gekämpft. Das Ergebnis ist eine eiserne Disziplin, wie sie nicht viele vorweisen können. Erhebt euch, ihr Männer Kastiliens, und offenbart dieser Welt, wie entschlossen ihr seid!"
 iv2_historic_idea_CAS_22: "Gegen die Ungläubigen"
 iv2_ga_select_historic_CAS_22_desc: "Wir kämpfen gegen die Ungläubigen und werden die iberische Halbinsel zurückerobern."
 iv2_historic_idea_CAS_23: ""
 iv2_ga_select_historic_CAS_23_desc: ""
 iv2_historic_idea_CAS_24: ""
 iv2_ga_select_historic_CAS_24_desc: ""
 iv2_historic_idea_CAS_25: ""
 iv2_ga_select_historic_CAS_25_desc: ""
 iv2_historic_idea_CAS_31: "Drängt in die Kolonien"
 iv2_ga_select_historic_CAS_31_desc: "Wir haben großen Reichtum in Übersee entdeckt. Zeit sich ihn zu nehmen!"
 iv2_historic_idea_CAS_32: "Mittelmeer-Ambitionen"
 iv2_ga_select_historic_CAS_32_desc: "Wir drängen ins Mittelmeer und nach Italien!"
 iv2_historic_idea_CAS_33: "Hochseeflotte"
 iv2_ga_select_historic_CAS_33_desc: "Unsere Ambitionen in den Kolonien machen es notwendig, dass wir eine große Flotte aufbauen."
 iv2_historic_idea_CAS_34: ""
 iv2_ga_select_historic_CAS_34_desc: ""
 iv2_historic_idea_CAS_35: ""
 iv2_ga_select_historic_CAS_35_desc: ""
 
