l_german:
 iv2_hist_idea_flag_tt_title_BYZ: "Historisch Nationale Idee von Florenz"
 iv2_hist_idea_flag_tt_desc_BYZ: "Das sind die Historisch-Nationalen Ideen von Florenz."
 
 iv2_historic_idea_BYZ_1: "Wiederbesiedelung der ländlichen Bezirke"
 iv2_ga_select_historic_BYZ_1_desc: "Seuchen, Kriege und Bürgerkrieg haben in den ländlichen Gebieten einen hohen Preis gefordert. Sie sind verwüstet und liegen seit Langem brach. Wir müssen Siedler dazu ermutigen, zum Wiederaufbau des Landes beizutragen, um unsere Wirtschaft zu stärken."
 iv2_historic_idea_BYZ_2: "Modernisiert das Corpus Iuris Civilis"
 iv2_ga_select_historic_BYZ_2_desc: "Das Corpus Iuris Civilis war ein Gesetzeskodex. Es wurde ursprünglich von Justinian herausgegeben und ist längst durch neuere Werke ersetzt, doch sein Name ließe sich als prestigeträchtiger Titel für einen brandneuen Kodex wiederverwenden."
 iv2_historic_idea_BYZ_3: "$BYZ$ Hof"
 iv2_ga_select_historic_BYZ_3_desc: "Der $BYZ$ Hof ist immer für eine Überraschung gut!"
 iv2_historic_idea_BYZ_4: ""
 iv2_ga_select_historic_BYZ_4_desc: ""
 iv2_historic_idea_BYZ_5: ""
 iv2_ga_select_historic_BYZ_5_desc: ""
 iv2_historic_idea_BYZ_11: "Restauriert den Ökumenischen Patriarchen"
 iv2_ga_select_historic_BYZ_11_desc: "Unsere Heilige Kirche befindet sich seit Langem im Niedergang. Lasst uns dieses Amt in seiner früheren Herrlichkeit restaurieren und der Kirche neue Lebenskraft geben."
 iv2_historic_idea_BYZ_12: "Herannahender Untergang"
 iv2_ga_select_historic_BYZ_12_desc: "Das Reich steht am Rand des Untergangs. Jeder römische Bürger ist sich im Stillen bewusst, dass das Ende naht und die Tage der römischen Herrlichkeit gezählt sind. Doch gibt es wirklich keine Hoffnung für das untergehende Reich? Wenn es der Kaiser schaffen würde, Unterstützung aus dem Westen zu erhalten, könnte es noch eine Aussicht auf Erholung geben."
 iv2_historic_idea_BYZ_13: "Basileia Rhomaion"
 iv2_ga_select_historic_BYZ_13_desc: "Es ist über ein Jahrtausend vergangen, seit die beiden Römischen Reiche vereint waren. Mit der Teilung im Jahr 395 hoffte man, den Niedergang des Reichs und seines politischen Systems aufhalten zu können. Stattdessen fiel das Westreich bereits im Jahr 476, und auch das Ostreich wurde durch das Osmanische Reich im 15. Jahrhundert beinahe vernichtet. Niemand hätte damals geglaubt, dass die Erben der östlichen Monarchen je wieder über ein heiles Reich regieren würden. Die Wiederherstellung des Römischen Reichs zu verkünden, verdient einen großen Triumphzug in Rom selbst."
 iv2_historic_idea_BYZ_14: ""
 iv2_ga_select_historic_BYZ_14_desc: ""
 iv2_historic_idea_BYZ_15: ""
 iv2_ga_select_historic_BYZ_15_desc: ""
 iv2_historic_idea_BYZ_21: "Umkehrung des Untergangs"
 iv2_ga_select_historic_BYZ_21_desc: "Das Römische Reich befindet sich nunmehr seit etwa einem Jahrtausend in einem stetigen Niedergang. Es gab zwar von Zeit zu Zeit kleinere territoriale Rückeroberungen, doch heute stehen wir womöglich am endgültigen Ende unserer Reise. Mit dem Einmarsch der Osmanen, die es auf die Stadt der Begierde abgesehen haben, ist unser Ende unausweichlich. Solange die Osmanen noch beschäftigt sind, sollten wir zuschlagen und unsere Stellung in Griechenland - unserem wichtigsten Territorium - festigen."
 iv2_historic_idea_BYZ_22: "Beschützt die Grenzen"
 iv2_ga_select_historic_BYZ_22_desc: "Nach der Wiederherstellung unseres Reichs müssen auch unsere alten Grenzen wiederhergestellt werden. Wir sollten uns ein Beispiel an der Vergangenheit nehmen und unsere Grenze ordentlich befestigen, indem wir die Themen als Mittler nutzen."
 iv2_historic_idea_BYZ_23: "Strategikon"
 iv2_ga_select_historic_BYZ_23_desc: "Im Lauf der Jahrhunderte wurden zahlreiche militärische Handbücher verfasst, die den byzantinischen Monarchen und Generälen dabei halfen, ihre eigenen militärischen Fähigkeiten zu verbessern und gleichzeitig ihr Wissen über Generationen hinweg weiterzugeben."
 iv2_historic_idea_BYZ_24: ""
 iv2_ga_select_historic_BYZ_24_desc: ""
 iv2_historic_idea_BYZ_25: ""
 iv2_ga_select_historic_BYZ_25_desc: ""
 iv2_historic_idea_BYZ_31: "Vertreibt die Republiken"
 iv2_ga_select_historic_BYZ_31_desc: ""Während unser Reich sich ausweitet und eine beständig stärker werdende Position einnimmt, erweisen sich die Lateinischen Republiken in unserer Nähe zunehmend als Hindernis. Es ist an der Zeit, unsere Lippenbekenntnisse gegenüber den Händlern zu brechen. Die Inseln der Ägäis gehören uns und unserem Bürger-Stand.""
 iv2_historic_idea_BYZ_32: "Griechisches Feuer"
 iv2_ga_select_historic_BYZ_32_desc: "Es ist ein Geheimnis und es ist sehr effektiv!"
