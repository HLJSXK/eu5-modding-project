 game_concept_spring: "Wiosna"
 game_concept_summer: "Lato"
 game_concept_autumn: "Jesień"
 game_concept_winter_season: "Zima"
 game_concept_spring_desc: "Natura budzi się do życia, a wraz z nadejściem odwilży kwitną kwiaty i rozkwitają drzewa. W większości [locations|e] ustąpiły już [winter|e] przymrozki, a [armies|e] znów maszerują bez przeszkód.\n\nnRozpoczął się sezon monsunowy – ogromna sezonowa zmiana kierunków wiatrów i prądów oceanicznych spowodowana różnicami temperatur lądu i morza. Przynosi on obfite opady w regionie [ShowRegionName('indian_ocean_region')], docierając do wybrzeży $india$ w czerwcu."
 game_concept_summer_desc: "Długie, słoneczne dni niosą ze sobą ciepło oraz porę wzrostu i obfitości.\n\nMaj oznacza początek cyklogenezy, czyli powstania i gwałtownego nasilenia się układu niskiego ciśnienia [weather_system|e] nad [ShowRegionName('north_atlantic_ocean_region')]. W XVII wieku proces ten był kluczowym czynnikiem powodującym zawirowania środowiskowe i geopolityczne, które charakteryzowały [ShowSituationName('little_ice_age')]."
 game_concept_autumn_desc: "Wraz z nadejściem chłodów liście przybierają złote i szkarłatne barwy, malując lasy i pola bogatymi kolorami jesieni.\n\nNatura i [nations|e] przygotowują się na nadchodzącą [winter|e]."
 game_concept_winter_season_desc: "$game_concept_winter_desc$\n\nnWiry polarne można zaobserwować w regionie [ShowRegionName('north_atlantic_islands_region')]. Są to rozległe obszary niskiego ciśnienia i wirującego, mroźnego powietrza, które nieustannie otaczają bieguny Ziemi. Czasami odrywają się od swojego zwykłego przebiegu i niosą mróz oraz niskie temperatury na południe."
 game_concept_seasons: "Pory roku"
 game_concept_seasons_desc: "[locations|e] na całym świecie mogą odczuwać skutki tych zjawisk przez cały rok, a każda pora roku niesie ze sobą własne wyzwania. Od cyklonów i monsunów latem po mrozy [winter|e] – mądry [nation|e] planuje swoje kampanie z uwzględnieniem pór roku.\n\n[spring|e] (luty – kwiecień)\n[summer|e] (maj – lipiec)\n[autumn|e] (sierpień – październik)\n[winter_season|e] (listopad – styczeń)"
