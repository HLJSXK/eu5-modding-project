 game_concept_spring: "Primavera"
 game_concept_summer: "Verano"
 game_concept_autumn: "Otoño"
 game_concept_winter_season: "Invierno"
 game_concept_spring_desc: "La naturaleza despierta a medida que el deshielo hace brotar flores y árboles en flor. La mayoría de [locations|e] ya no sufren las heladas [winter|e] y [armies|e] vuelven a marchar sin obstáculos.\n\nnHa comenzado la temporada del monzón, un cambio estacional masivo de los vientos y las corrientes oceánicas impulsado por las diferencias de temperatura entre la tierra y el mar. Transporta una gran cantidad de humedad a través de la [ShowRegionName('indian_ocean_region')], llegando a las costas de $india$ en junio."
 game_concept_summer_desc: "Los días largos y soleados traen consigo calor y una estación de crecimiento y abundancia.\n\nEl mes de mayo marca el inicio de la ciclogénesis, es decir, el nacimiento y la rápida intensificación de un [weather_system|e] de baja presión sobre la [ShowRegionName('north_atlantic_ocean_region')]. Durante el siglo XVII, este proceso fue un factor determinante de la agitación medioambiental y geopolítica que caracterizó la [ShowSituationName('little_ice_age')]."
 game_concept_autumn_desc: "Las hojas se tiñen de dorado y carmesí a medida que el aire se enfría, pintando los bosques y los campos con los intensos colores del otoño.\n\n naturaleza y [nations|e] se preparan para la llegada [winter|e]."
 game_concept_winter_season_desc: "$game_concept_winter_desc$\n\nnLos vórtices polares pueden observarse en la [ShowRegionName('north_atlantic_islands_region')]. Se trata de grandes zonas de baja presión y aire gélido en remolino que rodean permanentemente los polos de la Tierra. De vez en cuando, se desvían de lo habitual y traen heladas y temperaturas bajas hacia el sur."
 game_concept_seasons: "Estaciones"
 game_concept_seasons_desc: "[locations|e] de todo el mundo pueden sufrir las consecuencias a lo largo del año, ya que cada estación trae consigo sus propios retos. Desde los ciclones y los monzones del verano hasta las heladas del [winter|e], una [nation|e] prudente planifica sus campañas en función de las estaciones.\n\n[spring|e] (feb-abr)\n[summer|e] (may-jul)\n[autumn|e] (ago-oct)\n[winter_season|e] (nov-ene)"
 GLORP_UI_CURRENT_SEASON_DESC: "[Player.Custom('GetCurrentSeasonDesc')]"
 GLORP_UI_CURRENT_SEASON_ICON: "[Player.Custom('GetCurrentSeasonIcon')]"
