 game_concept_spring: "Весна"
 game_concept_summer: "Лето"
 game_concept_autumn: "Осень"
 game_concept_winter_season: "Зима"
 game_concept_spring_desc: "Природа пробуждается: с оттепелью распускаются цветы и зацветают деревья. В большинстве [locations|e] уже не бывает [winter|e] заморозков, и [armies|e] вновь беспрепятственно движутся в поход.\n\nnНачался сезон муссонов — масштабная сезонная смена направлений ветров и океанических течений, вызванная разницей температур суши и моря. Муссоны несут с собой обильную влагу через [ShowRegionName('indian_ocean_region')] и в июне достигают побережья $india$$."
 game_concept_summer_desc: "Длинные, солнечные дни приносят тепло и знаменуют начало сезона роста и изобилия.\n\nМай знаменует начало циклогенеза — зарождения и быстрого усиления области низкого давления [weather_system|e] над [ShowRegionName('north_atlantic_ocean_region')]. В XVII веке этот процесс стал одной из ключевых причин экологических и геополитических потрясений, определивших [ShowSituationName('little_ice_age')]."
 game_concept_autumn_desc: "С понижением температуры листья приобретают золотистый и багряный оттенок, окрашивая леса и поля в насыщенные осенние цвета.\n\nПрирода и [nations|e] готовятся к наступающей [winter|e]."
 game_concept_winter_season_desc: "$game_concept_winter_desc$\n\nnПолярные вихри можно наблюдать в [ShowRegionName('north_atlantic_islands_region')]. Это обширные области пониженного давления и завихренного ледяного воздуха, постоянно окружающие полюса Земли. Иногда они отрываются от основного потока и приносят мороз и низкие температуры на юг."
 game_concept_seasons: "Времена года"
 game_concept_seasons_desc: "[locations|e] по всему миру могут сталкиваться с различными явлениями в течение всего года, причем каждый сезон несет с собой свои собственные трудности. От циклонов и муссонов летом до заморозков [winter|e] — мудрая [nation|e] планирует свои кампании с учётом смены сезонов.\n\n[spring|e] (февраль — апрель)\n[summer|e] (май — июль)\n[autumn|e] (август — октябрь)\n[winter_season|e] (ноябрь — январь)"
 GLORP_UI_CURRENT_SEASON_DESC: "[Player.Custom('GetCurrentSeasonDesc')]"
 GLORP_UI_CURRENT_SEASON_ICON: "[Player.Custom('GetCurrentSeasonIcon')]"
