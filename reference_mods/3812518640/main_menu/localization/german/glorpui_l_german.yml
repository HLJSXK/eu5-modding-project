 game_concept_spring: "Frühling"
 game_concept_summer: "Sommer"
 game_concept_autumn: "Herbst"
 game_concept_winter_season: "Winter"
 game_concept_spring_desc: "Die Natur erwacht, während die Schneeschmelze blühende Blumen und blühende Bäume hervorbringt. An [locations|e] ist der [winter|e]-Frost vorbei, und [armies|e] marschieren wieder ungehindert.\n\nnDie Monsunzeit hat begonnen – eine massive saisonale Umkehrung der Wind- und Meeresströmungen, die durch Temperaturunterschiede zwischen Land und Meer angetrieben wird. Sie transportiert große Mengen an Feuchtigkeit über die [ShowRegionName('indian_ocean_region')] und erreicht im Juni die Küsten von $india$$."
 game_concept_summer_desc: "Lange, sonnendurchflutete Tage bringen Wärme und eine Zeit des Wachstums und des Überflusses mit sich.\n\nDer Mai läutet den Beginn der Zyklogenese ein, also die Entstehung und rasche Verstärkung eines Tiefdruckgebiets [weather_system|e] über der [ShowRegionName('north_atlantic_ocean_region')]. Im 17. Jahrhundert war dieser Prozess ein entscheidender Faktor für die ökologischen und geopolitischen Umwälzungen, die die [ShowSituationName('little_ice_age')] prägten."
 game_concept_autumn_desc: "Wenn die Luft kühler wird, färben sich die Blätter gold- und purpurrot und tauchen die Wälder und Felder in die satten Farben des Herbstes.\n\nDie Natur und [nations|e] bereiten sich auf den kommenden [winter|e] vor."
 game_concept_winter_season_desc: "$game_concept_winter_desc$\n\nnIn der [ShowRegionName('north_atlantic_islands_region')] können Polarwirbel auftreten. Dabei handelt es sich um ausgedehnte Tiefdruckgebiete mit wirbelnder, eisiger Luft, die die Pole der Erde permanent umgeben. Gelegentlich weichen sie von ihrem üblichen Verlauf ab und bringen Frost und kalte Temperaturen in den Süden."
 game_concept_seasons: "Jahreszeiten"
 game_concept_seasons_desc: "[locations|e] auf der ganzen Welt können das ganze Jahr über von den Auswirkungen betroffen sein, wobei jede Jahreszeit ihre eigenen Herausforderungen mit sich bringt. Von den Zyklonen und Monsunen des Sommers bis hin zum Frost des [winter|e] – eine kluge [nation|e] plant ihre Feldzüge entsprechend den Jahreszeiten.\n\n[spring|e] (Feb – Apr)\n[summer|e] (Mai – Jul)\n[autumn|e] (Aug – Okt)\n[winter_season|e] (Nov – Jan)"
