 game_concept_spring: "春天"
 game_concept_summer: "夏天"
 game_concept_autumn: "秋天"
 game_concept_winter_season: "冬天"
 game_concept_spring_desc: "随着冰雪消融，百花盛开，树木抽芽，大自然苏醒了。大多数[locations|e]已不再有[winter|e]的霜冻，[armies|e]再次畅通无阻地行军。\n\nn季风季节已经开始，这是由陆地与海洋温差驱动的、风向和洋流的大规模季节性逆转。它将大量水汽带过[ShowRegionName('indian_ocean_region')]，并于六月抵达$india$的海岸。"
 game_concept_summer_desc: "漫长而阳光明媚的日子带来温暖，也迎来了一个生机勃勃、物产丰饶的季节。\n\n五月标志着气旋生成期的开始，即在[ShowRegionName('north_atlantic_ocean_region')]上空，一个低压[weather_system|e]的形成及其迅速增强。 在17世纪，这一过程是导致[ShowSituationName('little_ice_age')]这一时期环境与地缘政治动荡的关键驱动力。"
 game_concept_autumn_desc: "随着气温转凉，树叶渐染金黄与深红，将森林和田野装点成秋日里浓郁的色彩。\n\nn大自然和[nations|e]都在为即将到来的[winter|e]做准备。"
 game_concept_winter_season_desc: "$game_concept_winter_desc$\n\nn在[ShowRegionName('north_atlantic_islands_region')]地区可能会出现极地涡旋。它们是永久环绕地球两极的大片低压区，其中充斥着旋转的严寒空气。 偶尔，它们会脱离常规路径，将霜冻和严寒向南蔓延。"
 game_concept_seasons: "季节"
 game_concept_seasons_desc: "世界各地[locations|e]可能全年都会受到气候影响，每个季节都带来各自的挑战。从夏季的气旋和季风到[winter|e]的霜冻，一个明智的[nation|e]会根据季节来规划其军事行动。\n\n[spring|e]（2月至4月）\n[summer|e]（5月至7月）\n[autumn|e]（8月至10月）\n[winter_season|e]（11月至1月）"
