 game_concept_spring: "봄"
 game_concept_summer: "여름"
 game_concept_autumn: "가을"
 game_concept_winter_season: "겨울"
 game_concept_spring_desc: "눈이 녹으며 꽃이 피고 나무에 꽃이 피어나자 자연이 깨어납니다. 대부분의 [locations|e]에서는 [winter|e] 서리가 사라졌고, [armies|e]는 다시 한 번 아무런 방해 없이 행군하고 있습니다.\n\nn몬순 시즌이 시작되었습니다. 이는 육지와 바다의 온도 차이에 의해 일어나는 바람과 해류의 대규모 계절적 역전 현상입니다. [ShowRegionName('indian_ocean_region')] 전역에 걸쳐 풍부한 수분을 실어 나르며, 6월에 $india$ 해안에 도달합니다."
 game_concept_summer_desc: "햇살이 가득한 긴 낮에는 따스함이 찾아오고, 성장과 풍요의 계절이 시작됩니다.\n\nn5월은 [ShowRegionName('north_atlantic_ocean_region')] 상공에서 저기압 [weather_system|e]이 발생하고 급속히 강해지는 ‘저기압 발생(Cyclogenesis)’의 시작을 알립니다. 1600년대, 이 과정은 [ShowSituationName('little_ice_age')]를 특징짓는 환경적·지정학적 혼란의 핵심적인 원인이었습니다."
 game_concept_autumn_desc: "공기가 차가워지면서 나뭇잎은 황금빛과 진홍빛으로 물들며, 숲과 들판을 가을의 풍요로운 색채로 물들입니다.\n\nn자연과 [nations|e] 다가올 [winter|e]을 맞이할 준비를 합니다."
 game_concept_winter_season_desc: "$game_concept_winter_desc$\n\nn[ShowRegionName('north_atlantic_islands_region')]에서는 극소용돌이를 볼 수 있습니다. 이는 지구의 극을 영구적으로 둘러싸고 있는, 저기압과 소용돌이치는 극한의 찬 공기로 이루어진 광대한 지역입니다. 때때로 이 소용돌이가 평소 궤도에서 벗어나 남쪽 지역으로 서리와 한파를 몰고 오기도 합니다."
 game_concept_seasons: "계절"
 game_concept_seasons_desc: "전 세계의 [locations|e] 일 년 내내 다양한 기상 현상의 영향을 받을 수 있으며, 계절마다 각기 다른 어려움이 따릅니다. 여름의 사이클론과 몬순부터 [winter|e]의 서리까지, 현명한 [nation|e]는 계절에 맞춰 작전을 계획합니다.\n\n[spring|e] (2월 - 4월)\n[summer|e] (5월 - 7월)\n[autumn|e] (8월 - 10월)\n[winter_season|e] (11월 - 1월)"
