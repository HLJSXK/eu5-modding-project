 game_concept_winter_season: "Winter"
 game_concept_spring_desc: "Nature awakens as the thaw brings forth blooming flowers and blossoming trees. Most [locations|e] have lost their [winter|e] frosts and [armies|e] march unimpeded once again.\n\nMonsoon season has begun, a massive seasonal reversal of wind and ocean currents driven by land and sea temperature differences. Carrying heavy moisture across the [ShowRegionName('indian_ocean_region')], arriving to the coasts of $india$ in June."
 game_concept_summer_desc: "Long, sunlit days bring warmth, and a season of growth and abundance.\n\nMay signals the beginning of Cyclogenesis, the birth and rapid intensification of a low-pressure [weather_system|e] over the [ShowRegionName('north_atlantic_ocean_region')]. During the 1600s, this process was a crucial driver of the environmental and geopolitical turmoil defining the [ShowSituationName('little_ice_age')]."
 game_concept_autumn_desc: "Leaves turn gold and crimson as the air cools, painting the forests and fields in the rich colours of autumn.\n\nNature and [nations|e] prepare for the coming [winter|e]."
 game_concept_winter_season_desc: "$game_concept_winter_desc$\n\nPolar Vortexes may be seen in the [ShowRegionName('north_atlantic_islands_region')]. They are large areas of low pressure and swirling, frigid air that permanently encircle Earth’s poles. Occasionally, they separate from the norm and bring frost and cold temperatures south."
 game_concept_seasons: "Seasons"
 game_concept_seasons_desc: "[locations|e] around the world may experience effects throughout the year, each season bringing its own challenges. From the Cyclones and Monsoons of Summer to the frosts of [winter|e], a wise [nation|e] plans its campaigns around the seasons.\n\n[spring|e] (Feb - Apr)\n[summer|e] (May - Jul)\n[autumn|e] (Aug - Oct)\n[winter_season|e] (Nov - Jan)"
 GLORP_UI_CURRENT_SEASON: "[Player.Custom('GetCurrentSeasonName')]"
 GLORP_UI_CURRENT_SEASON_DESC: "[Player.Custom('GetCurrentSeasonDesc')]"
 GLORP_UI_CURRENT_SEASON_ICON: "[Player.Custom('GetCurrentSeasonIcon')]"
 GLORP_UI_CURRENT_SEASON_TAG: "[Player.Custom('GetCurrentSeasonTag')]"
