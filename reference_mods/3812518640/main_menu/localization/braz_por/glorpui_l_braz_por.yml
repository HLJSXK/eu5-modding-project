 game_concept_spring: "Primavera"
 game_concept_summer: "Verão"
 game_concept_autumn: "Outono"
 game_concept_winter_season: "Inverno"
 game_concept_spring_desc: "A natureza desperta à medida que o degelo faz com que as flores desabrochem e as árvores floresçam. A maioria [locations|e] já não enfrenta mais as geadas do [winter|e] e [armies|e] voltam a marchar sem obstáculos.\n\nnA estação das monções começou, uma grande inversão sazonal dos ventos e das correntes oceânicas impulsionada pelas diferenças de temperatura entre a terra e o mar. Transportando grande umidade pela [ShowRegionName('indian_ocean_region')], chegando às costas da $india$ em junho."
 game_concept_summer_desc: "Os dias longos e ensolarados trazem calor e marcam uma estação de crescimento e abundância.\n\n mês de maio sinaliza o início da ciclogênese, o nascimento e a rápida intensificação de um sistema de baixa pressão [weather_system|e] sobre a [ShowRegionName('north_atlantic_ocean_region')]. Durante o século XVII, esse processo foi um fator determinante da turbulência ambiental e geopolítica que caracterizou a [ShowSituationName('little_ice_age')]."
 game_concept_autumn_desc: "As folhas ficam douradas e vermelhas à medida que o ar esfria, pintando as florestas e os campos com as cores intensas do outono.\n\nA natureza e [nations|e] se preparam para o [winter|e] que se aproxima."
 game_concept_winter_season_desc: "$game_concept_winter_desc$\n\nnOs vórtices polares podem ser observados na [ShowRegionName('north_atlantic_islands_region')]. Trata-se de grandes áreas de baixa pressão e ar gélido em movimento circular que circundam permanentemente os pólos da Terra. Ocasionalmente, eles se afastam do padrão e trazem geadas e temperaturas baixas para o sul."
 game_concept_seasons: "Estações do ano"
 game_concept_seasons_desc: "[locations|e] em todo o mundo podem sofrer os efeitos ao longo do ano, com cada estação trazendo seus próprios desafios. Dos ciclones e monções do verão às geadas do [winter|e], uma [nation|e] sensata planeja suas campanhas de acordo com as estações.\n\n[spring|e] (fevereiro a abril)\n[summer|e] (maio a julho)\n[autumn|e] (agosto a outubro)\n[winter_season|e] (novembro a janeiro)"
 GLORP_UI_CURRENT_SEASON_DESC: "[Player.Custom('GetCurrentSeasonDesc')]"
 GLORP_UI_CURRENT_SEASON_ICON: "[Player.Custom('GetCurrentSeasonIcon')]"
 GLORP_UI_CURRENT_SEASON_TAG: "[Player.Custom('GetCurrentSeasonTag')]"
