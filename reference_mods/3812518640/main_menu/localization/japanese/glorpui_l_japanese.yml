 game_concept_spring: "春"
 game_concept_summer: "夏"
 game_concept_autumn: "秋"
 game_concept_winter_season: "冬"
 game_concept_spring_desc: "雪解けとともに自然が目を覚まし、花々が咲き、木々も芽吹き始めます。ほとんどの[locations|e]では[winter|e]霜が消え、[armies|e]は再び妨げられることなく行軍しています。\n\nnモンスーンの季節が始まった。これは、陸と海の温度差によって引き起こされる、風や海流の巨大な季節的な逆転現象である。大量の湿気を[ShowRegionName('indian_ocean_region')]全域に運び、$india$到達する。"
 game_concept_summer_desc: "日差しが降り注ぐ長い日々は暖かさをもたらし、成長と豊穣の季節を告げます。\n\n5月は「サイクロジェネシス」の始まりを告げる月であり、[ShowRegionName('north_atlantic_ocean_region')]上空で低気圧[weather_system|e]が発生し、急速に勢力を強めます。 1600年代、この過程は、[ShowSituationName('little_ice_age')]を特徴づける環境的・地政学的な混乱の重要な要因となりました。"
 game_concept_autumn_desc: "空気が冷たくなるにつれて、葉は黄金色や深紅色に色づき、森や野原を豊かな秋の色で彩ります。\n\nも[nations|e]も、迫り来る[winter|e]に備えています。"
 game_concept_winter_season_desc: "$game_concept_winter_desc$\n\nn極渦は、[ShowRegionName('north_atlantic_islands_region')]で見られることがあります。これは、地球の極を常に取り囲んでいる、広範囲にわたる低気圧と渦巻く極寒の空気の領域です。 時折、この渦が通常の状態から外れ、南の地域に霜や寒波をもたらすことがあります。"
 game_concept_seasons: "季節"
 game_concept_seasons_desc: "世界中の[locations|e]では、年間を通じてさまざまな影響を受ける可能性があり、季節ごとに特有の課題が生じます。夏のサイクロンやモンスーンから[winter|e]の霜に至るまで、賢明な[nation|e]は季節に合わせて作戦を計画します。\n\n[spring|e]（2月～4月）\n[summer|e]（5月～7月）\n[autumn|e]（8月～10月）\n[winter_season|e]（11月～1月）"
