 game_concept_spring: "Bahar"
 game_concept_summer: "Yaz"
 game_concept_autumn: "Sonbahar"
 game_concept_winter_season: "Kış"
 game_concept_spring_desc: "Buzların erimesiyle çiçekler açmaya ve ağaçlar çiçeklenmeye başlayınca doğa uyanır. Çoğu [locations|e] artık [winter|e] donlarından kurtulmuştur ve [armies|e] yeniden engelsiz bir şekilde ilerlemektedir.\n\nnMuson mevsimi başladı; bu, kara ve deniz sıcaklık farklarının yol açtığı, rüzgâr ve okyanus akıntılarında meydana gelen büyük bir mevsimsel tersine dönüş. Yoğun nemi [ShowRegionName('indian_ocean_region')] bölgesine taşıyan muson, Haziran ayında $india$ kıyılarına ulaşır."
 game_concept_summer_desc: "Güneşli uzun günler sıcaklık getirir; bu, büyüme ve bolluk mevsiminin habercisidir.\n\nMayıs ayı, [ShowRegionName('north_atlantic_ocean_region')] üzerinde bir alçak basınç [weather_system|e] sisteminin oluşumu ve hızla güçlenmesiyle karakterize edilen “Siklogenez”in başlangıcını işaret eder. 1600'lü yıllarda bu süreç, [ShowSituationName('little_ice_age')] dönemini tanımlayan çevresel ve jeopolitik kargaşanın en önemli itici gücüydü."
 game_concept_autumn_desc: "Hava soğudukça yapraklar altın sarısı ve koyu kırmızıya bürünür; ormanları ve tarlaları sonbaharın zengin renkleriyle süsler.\n\nDoğa ve [nations|e] yaklaşan [winter|e] hazırlanıyor."
 game_concept_winter_season_desc: "$game_concept_winter_desc$\n\nnKutup Girdapları, [ShowRegionName('north_atlantic_islands_region')] bölgesinde görülebilir. Bunlar, Dünya’nın kutuplarını sürekli olarak çevreleyen, alçak basınçlı ve dönen, dondurucu soğuk havadan oluşan geniş alanlardır. Zaman zaman normal durumdan saparak güney bölgelere don ve soğuk hava getirirler."
 game_concept_seasons: "Mevsimler"
 game_concept_seasons_desc: "Dünyanın dört bir yanındaki [locations|e] yıl boyunca çeşitli etkilerle karşılaşabilir; her mevsim kendine özgü zorluklar getirir. Yazın siklonlarından ve muson yağmurlarından [winter|e] aylarındaki donlara kadar, akıllı bir [nation|e] kampanyalarını mevsimlere göre planlar.\n\n[spring|e] (Şubat - Nisan)\n[summer|e] (Mayıs - Temmuz)\n[autumn|e] (Ağustos - Ekim)\n[winter_season|e] (Kasım - Ocak)"
