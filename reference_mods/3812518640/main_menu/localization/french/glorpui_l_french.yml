 game_concept_spring: "Printemps"
 game_concept_summer: "Été"
 game_concept_autumn: "Automne"
 game_concept_winter_season: "Hiver"
 game_concept_spring_desc: "La nature se réveille alors que le dégel fait éclore les fleurs et les arbres. La plupart [locations|e] ont vu disparaître les gelées [winter|e] et [armies|e] peuvent à nouveau marcher sans entrave.\n\nnLa saison de la mousson a commencé, un renversement saisonnier massif des vents et des courants océaniques provoqué par les différences de température entre la terre et la mer. Transportant une forte humidité à travers la [ShowRegionName('indian_ocean_region')], elle arrive sur les côtes de $india$ en juin."
 game_concept_summer_desc: "Les longues journées ensoleillées apportent de la chaleur et marquent le début d'une saison de croissance et d'abondance.\n\nLe mois de mai marque le début de la cyclogenèse, c'est-à-dire la naissance et l'intensification rapide d'un [weather_system|e] de basse pression au-dessus de la [ShowRegionName('north_atlantic_ocean_region')]. Au cours du XVIIe siècle, ce processus a été un facteur déterminant des bouleversements environnementaux et géopolitiques qui ont caractérisé le [ShowSituationName('little_ice_age')]."
 game_concept_autumn_desc: "À mesure que l'air se rafraîchit, les feuilles se teintent d'or et de cramoisi, peignant les forêts et les champs des riches couleurs de l'automne.\n\nLa nature et [nations|e] se préparent à l'arrivée de [winter|e]."
 game_concept_winter_season_desc: "$game_concept_winter_desc$\n\nnOn peut observer des vortex polaires dans la [ShowRegionName('north_atlantic_islands_region')]. Il s’agit de vastes zones de basse pression et d’air glacial tourbillonnant qui encerclent en permanence les pôles de la Terre. De temps à autre, ils s'écartent de leur trajectoire habituelle et apportent du gel et des températures glaciales vers le sud."
 game_concept_seasons: "Les saisons"
 game_concept_seasons_desc: "[locations|e] du monde entier peuvent subir ces effets tout au long de l'année, chaque saison apportant son lot de défis. Des cyclones et moussons de l'été aux gelées de [winter|e], une [nation|e] avisée planifie ses campagnes en fonction des saisons.\n\n[spring|e] (févr. - avr.)\n[summer|e] (mai - juil.)\n[autumn|e] (août - oct.)\n[winter_season|e] (nov. - janv.)"
 GLORP_UI_CURRENT_SEASON_DESC: "[Player.Custom('GetCurrentSeasonDesc')]"
 GLORP_UI_CURRENT_SEASON_ICON: "[Player.Custom('GetCurrentSeasonIcon')]"
 GLORP_UI_CURRENT_SEASON_TAG: "[Player.Custom('GetCurrentSeasonTag')]"
