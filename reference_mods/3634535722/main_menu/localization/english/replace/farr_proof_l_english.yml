l_english:
 # ============================================================
 # Farr Proof of Fortune — the wager under examination
 # ============================================================
 # Flavor below is placeholder-mechanical-narrative. The keys
 # exist so the disaster and events display readably in-game
 # during testing. Polish in a later pass.
 the_boast_about_fortune_tt: "To declare farr-i-izadi, a concept that is both dormant as a sole basis of legitimacy and yet well understood, is to make an audacious boast. A disaster will trigger, acting as the verification of your claim. The disaster will track the realm's legitimacy and the world's recognition of it, and will resolve in one of several ways — vindication, quiet endurance, or a broken claim. The wager is not decided on the battlefield alone; every battle is an argument, every city lost or won is an argument, every Friday sermon is an argument. The world reads the wager as it unfolds, and the chronicles will remember how it went."
 # --- Disaster ---------------------------------------------------
 farr_proof_of_fortune: "The Farr Under Examination"
 farr_proof_of_fortune_desc: "You have declared farr-i īzadī — heaven's favor settled on this house — but the weekly rituals of recognition continue to belong to someone else. The mints stamp the Ilkhan's name where yours should be. The qāḍī of the great mosque reads the Friday khutba for a sovereign who is not you. The bazaar accepts the foreign coin as the lawful tender. The amīrs send stewards to your court, not themselves. Each silence is a verdict in metal, in parchment, in absence — and the realm bleeds legitimacy as long as they stand. Bring each ritual into line and the bleed stops, slice by slice. Conquest is the one argument the realm reads unambiguously in your favor; everything else is the world declining, week after week, to write your name where it should be."

 # --- Disaster gate tooltips (custom_tooltip wraps in can_start / can_end) ---
 farr_proof_not_yet_completed_tt: "This dynasty has not yet declared and resolved a Farr Proof of Fortune"
 farr_proof_not_yet_fired_tt: "The Farr Proof of Fortune is not already running"
 # One key per end branch — each renders as a separate line in the can_end tooltip.
 farr_proof_end_vindicated_tt: "Vindicated — sixty cumulative months at legitimacy ≥ 90, the houses have sworn"
 farr_proof_end_broken_formal_tt: "Broken (formal) — legitimacy collapsed to 0, the amīrs have seized the throne"
 farr_proof_end_broken_lapse_tt: "Broken (lapse) — sixty cumulative months at legitimacy ≤ 25, the doctrine has been dropped quietly"
 farr_proof_end_endured_tt: "Endured — twenty-five years elapsed with the realm intact, the claim stands in a smaller key"
 farr_proof_end_abandoned_tt: "The farr-i īzadī reform has been abandoned, the claim withdrawn"

 # ============================================================
 # ANNOUNCE
 # ============================================================
 farr_proof.1.title: "The Wager Begins"
 farr_proof.1.desc: "The decree has gone out; the chancery has stamped it; the great mosque of the capital has been notified. By declaring farr-i īzadī you have made a public claim that heaven's favor has settled on this house. The world has now to answer.\n\nThe answer, this Friday, is silence. The mints have not yet recut their dies — the dirham in every hand still carries the Ilkhan's name. The khutba in the great mosques of the realm has not yet been read for you — the qāḍīs are waiting to see what the other qāḍīs do. The amīrs have written elaborate congratulations and sent none of their persons. The bazaar prices the foreign coin at par with yours, and the burghers cannot be made to do otherwise by decree.\n\nUntil each of these continues to belong to someone else, the boast stands unanswered, and the realm reads the silence. The bleed will run until the rituals come into line — one by one, as the threshold of recognition is crossed, you will claim them. Or the wager will be lost on the absence of recognition, not on the field of battle."
 farr_proof.1.a: "Let the wager run."
 farr_proof.1.a.tt: "Being at war will now give monthly legitimacy. Battlefield victories, defeats, and lost or won cities and wars will now move the ledger. The world will read the wager as it unfolds; the chronicles will remember how it went."

 # ============================================================
 # APPARATUS EVENTS (upward thresholds, irreversible rewards)
 # ============================================================

 # --- .50 Sikka
 farr_proof.50.title: "The Sikka in Your Name"
 farr_proof.50.desc: "The dār al-ḍarb has cut the new dies. The first dirham bearing your name and titles is struck at the capital; within months it travels by yām post to every mint of the realm. The bazaar accepts the coin; the Genoese factor at Sulṭāniyya assays it and finds it sound.\n\nThe two penalties the disaster levied for unrecognition by mint and burghers — minting income suppressed because the world reads your dies as illegitimate, and the burgher estate's quiet disapproval at being made to handle a coin no one outside the realm trusts — both end with this striking. The bleed against your legitimacy from those two sources stops here.\n\nAnd even if the wager later turns against you, the dār al-ḍarb infrastructure remains. Coinage is the hardest of the three Friday rights to undo: the Muzaffarids kept their sikka long after their fortunes turned, and so will this house."
 farr_proof.50.a: "The coin runs in our name."

 # --- .65 Khutba
 farr_proof.65.title: "The Khutba in Your Name"
 farr_proof.65.desc: "The qāḍī of the great mosque of the capital has read the khutba in your name this Friday past. By the following week, the imams of Sulṭāniyya, Yazd, Iṣfahān, and Herāt have followed. The institutional church of Iran has accepted the formula: the sermon is read for the sovereign of the realm, and the sovereign of the realm is you.\n\nThe disaster's penalty against the clergy estate — its silent withholding while the great pulpits would not pronounce your name — ends with this Friday. The bleed from that source stops here.\n\nThe Caliph in Cairo will protest; the muḥtasibs will not care. And the precedent of a qāḍī reading your name is the kind of institutional fact that does not easily reverse: future protests against this dynasty will have to overcome the formula that has now been spoken aloud."
 farr_proof.65.a: "The sermon names us."

 # --- .80 Hunt + Nawrūz
 farr_proof.80.title: "The Royal Hunt and the Nawrūz Court"
 farr_proof.80.desc: "The shikār has been called — not the ordinary hunting party of an amīr, but the great royal hunt of the Sasanian and Ilkhanid kings, with beaters from every district and the standing army drawn up at the rendezvous. The amīrs who had sent stewards in your early years now ride behind your standard themselves; the ranks are kept; the kill is offered to the king. Nawrūz follows: the chancery has restored the pre-Islamic festival of kingship, Islamized in Niẓām al-Mulk's frame, with the amīrs presenting tribute and the qāḍīs proclaiming the just king.\n\nThe disaster's penalty against the amīr estate — the slow attrition of assent withheld through every year the great houses sent representatives instead of their persons — ends here. The Türks read the hunt; the Tāziks read the festival; both have now, in the same week, seen kingship enacted in the form their fathers recognized.\n\nThe ceremonial precedent will outlast the wager itself."
 farr_proof.80.a: "Let the hunt ride. Let the court convene."

 # --- .90 Pādishāh
 farr_proof.90.title: "Pādishāh"
 farr_proof.90.desc: "The chancery has rewritten every protocol. The coinage epigraphy now reads pādishāh-i Īrān. Foreign rulers' letters, when they arrive, will use the new title — or they will not be answered. You are no longer a malik among maliks; you are the shadow of God on earth.\n\nThis is the largest of the four refunds: the remaining slice of the standing legitimacy bleed — the portion that survived the sikka, the khutba, and the hunt because the title itself had not yet been claimed — is cancelled now. With all four refunds standing, the disaster's bleed is fully offset; the boast has caught up to the world's recognition of it.\n\nThe mirror-for-princes literature your court reads — Niẓām al-Mulk, Ṭūsī, Ghazālī — has been written about you, in advance, by men long dead. It only remains to live up to it."
 farr_proof.90.a: "Pādishāh-i Īrān."

 # ============================================================
 # EROSION EVENTS (downward thresholds)
 # ============================================================

 # --- .35 Amīrs absent
 farr_proof.35.title: "The Amīrs Are Absent From Court"
 farr_proof.35.desc: "The Nawrūz feast was thin this year. Three of the great amīrs sent stewards with apologies; two sent nothing at all. The chamberlain reports — quietly — that the missing names are talking among themselves, in their pasture-camps, about what the coin and the khutba in your name actually mean. The doctrine has reached a place where it costs them. They are noticing."
 farr_proof.35.a: "Send envoys with gifts. We will mend this."
 farr_proof.35.b: "Let them stay away. The doctrine is not negotiable."

 # --- .20 Khutba dropped
 farr_proof.20.title: "A Province Has Dropped the Khutba"
 farr_proof.20.desc: "The qāḍī of one of the southern cities did not read the Friday sermon in your name last week. The first week was — he claims — an oversight. The second week was not. The omission is small enough to deny and large enough to spread. Other qāḍīs are watching."
 farr_proof.20.a: "Have the qāḍī replaced. The sermon will be read."
 farr_proof.20.b: "Pay the mosque a generous endowment. Let next week's sermon be unambiguous."

 # --- .10 Bī-farr
 farr_proof.10.title: "Bī-farr"
 farr_proof.10.desc: "The whispered word has reached the chamberlain through three intermediaries: bī-farr. The glory has left him. It is not yet shouted; it is not yet written. But the formula by which Bayhaqī wrote of the last days of Masʿūd of Ghazna is now being applied — quietly, by the men closest to your throne — to you."
 farr_proof.10.a: "Stage the greatest hunt in living memory. Let them see what kingship looks like."
 farr_proof.10.b: "Endure the whisper. The wager has not yet been decided."

 # ============================================================
 # OMEN EVENTS
 # ============================================================

 # --- .100 Comet
 farr_proof.100.title: "A Comet Stands Above the Throne"
 farr_proof.100.desc: "The astrologers of the court report a long-tailed star, visible for the seventh consecutive night, standing in the constellation associated with the dynasty. The reading is contested: Naṣīr al-Dīn al-Ṭūsī's school would call it a sign of renewal; the older Iraqi traditions would call it a portent of upheaval. The interpretation that travels is the interpretation that matters."
 farr_proof.100.a: "Publish the reading broadly. The reading is renewal."
 farr_proof.100.b: "Keep the interpretation within the court. Let the bazaars guess."

 # --- .101 Earthquake
 farr_proof.101.title: "The Earth Itself Has Spoken"
 farr_proof.101.desc: "An earthquake has destroyed half of a small town in the central plateau. The mosque stands; the citadel does not. The qāḍīs will need a reading — the earth in mirror-for-princes literature does not move without cause. Whether the cause is your kingship or the sins of the townspeople is a propaganda question now."
 farr_proof.101.a: "Ride to the ruins ourselves. Distribute grain. The king grieves with his subjects."
 farr_proof.101.b: "Have the ʿulamāʾ read it as a test, not a verdict."

 # --- .102 Plague
 farr_proof.102.title: "Plague in the Realm"
 farr_proof.102.desc: "The wabāʾ has reached the great cities. Mustawfī himself has written on the plague years; the ʿulamāʾ are reading him aloud. The court must show itself — or withdraw — and either choice will be read by the realm as evidence of what kind of king you are."
 farr_proof.102.a: "Lead the public prayers ourselves. The king prays with his subjects."
 farr_proof.102.b: "Open the granaries. Material relief, fiscal cost."
 farr_proof.102.c: "Withdraw to the citadel. Preserve the dynasty. Lose the city."

 # --- .103 The rains withheld
 farr_proof.103.title: "The Rains Are Withheld"
 farr_proof.103.desc: "The spring rains did not come. The qanāts run low, the assessors are already arguing over what the villages can bear, and in the bazaars they are saying what the mirror-books say: when the king is just, the rains fall. The sky has opened a case against your kingship, and the realm is the jury."
 farr_proof.103.a: "Remit the kharāj for the year. If heaven has a debt against us, the king pays it himself."
 farr_proof.103.b: "The rains fell — the assessors stole the difference. Open THEIR books."

 # --- .104 The conjunction
 farr_proof.104.title: "The Stars Incline"
 farr_proof.104.desc: "The munajjims have finished their tables and asked for an audience, which they never do when the news is bad. A conjunction of the two felicities approaches — Jupiter and Saturn in a royal sign — and by every canon of the science it inclines toward this throne. A king may put such a reading on his coins and in his khuṭba. He should first ask what happens to a king whom the stars endorsed and events did not."
 farr_proof.104.a: "Strike it on the dirhams. Let heaven cosign in silver."
 farr_proof.104.b: "Reward the astrologers and file the tables. Credit, quietly."

 # --- .105 The hunt marvel
 farr_proof.105.title: "The King Takes the Lion"
 farr_proof.105.desc: "On the third day of the hunt the beaters started a lion — and before the amīrs could close, the king had ridden in alone and killed it with the short spear, in the old way, witnessed by every man whose opinion of the dynasty matters. The Bahrām Gūr stories are being retold at the fires tonight. Fortune has performed. The question is how loudly to applaud."
 farr_proof.105.a: "Parade the skin through the bazaars. Fortune on a cart, for every quarter to see."
 farr_proof.105.b: "Feast the amīrs on the kill. The old rite, kept in the right room."

 # --- .106 The generous rains
 farr_proof.106.title: "The Rains Are Generous"
 farr_proof.106.desc: "The spring came early and stayed long. The qanāts run full, the assessors are quietly revising their registers upward, and the same mirror-books that would have blamed you for a drought are being read aloud in your favor: when the king is just, the rains fall. They fell. Every preacher in the realm has noticed on whose head."
 farr_proof.106.a: "Let the khuṭba say what the qanāts already say."
 farr_proof.106.b: "Tax the surplus and say little. Heaven's gift, the treasury's year."

 # --- .107 The Homay lands
 farr_proof.107.title: "The Homay Lands on the King's Shoulder"
 farr_proof.107.desc: "Every child of this land knows the bird: the Homāy, whose passing shadow makes kings, and which never, ever lands. At the reviewing of the hunt this morning, before the assembled amīrs, the falconers, two qāḍīs, and several hundred soldiers who will repeat this story for the rest of their lives, a wild Homāy came down out of an empty sky and sat upon the king's shoulder.\n\nIt stayed while a man could count to thirty. No one breathed. Then it rose and was gone.\n\nThere is nothing to decide. There is only what everyone saw."
 farr_proof.107.a: "God has spoken in the oldest language this land knows. Write down the names of the witnesses."

 # ============================================================
 # RESOLUTION EVENTS
 # ============================================================

 # --- .200 Vindicated
 farr_proof.200.title: "Farr Manifest"
 farr_proof.200.desc: "Sixty months at high favor. The houses that watched you win have begun, one by one, to swear. The chancery's correspondence with the rival amīrs has shifted register: where they once wrote 'malik', they now write 'pādishāh-i Īrān'. The bleed that defined this reign is over. The doctrine has been proved. The houses of the region have noted it — and the Matter that will follow has its first contender already named."
 farr_proof.200.a: "Heaven has spoken. Let the chancery record it."

 # --- .201 Broken-formal — Türk usurpation
 farr_proof.201.title: "The Amīrs Have Taken the Throne"
 farr_proof.201.desc: "The legitimacy floor was breached weeks ago; the act was only the timing. A coalition of Türk amīrs, with at least two clergy lineages signing the fatwā of necessity, has come to court — not as petitioners, but as the new authority. The old ruler is dead. The reform that bound this dynasty to the doctrine of farr is gone. The realm remains; the doctrine does not. The amīrs have won this round."
 farr_proof.201.a: "The realm endures, under new authority."

 # --- .202 Endured
 farr_proof.202.title: "The Claim Stands"
 farr_proof.202.desc: "Twenty-five years have passed since the wager began. The realm is intact: no capital lost permanently, no decisive war ended in tributary status. The legitimacy was never high; it was never crushed. The doctrine has not been proved in any decisive battle, nor disproved in any catastrophic one. The chronicles will record this as a quieter kind of fortune — survival itself, in the post-Mongol Iranian world, is no small claim. The claim stands, in a smaller key."
 farr_proof.202.a: "The claim stands. The bleed ends."

 # --- .203 Broken-lapse — quiet lapse
 farr_proof.203.title: "The Doctrine Has Lapsed"
 farr_proof.203.desc: "Five years cumulative of legitimacy too low to sustain the claim. There has been no usurpation; there has been no decisive battle; there has been no public renunciation. The doctrine of farr has simply ceased to be applied. The qāḍīs no longer cite it in the khutba; the chancery has quietly stopped using pādishāh in correspondence; the coinage of the next strike returns to malik. The prestige scar will be visible to the chronicles for generations. The cousins remember."
 farr_proof.203.a: "Let the chronicles record what they will."

 # ============================================================
 # MODIFIER DISPLAY NAMES
 # ============================================================

 # --- Battle/war event modifiers
 STATIC_MODIFIER_NAME_farr_conquest_glory: "Conquest in the Light of Heaven"
 STATIC_MODIFIER_DESC_farr_conquest_glory: "Heaven has visibly favored the realm with conquest. The bleed is more than offset; the doctrine is being proved with every captured city."
 STATIC_MODIFIER_NAME_farr_defeat_shame: "Defeat in the Light of Heaven"
 STATIC_MODIFIER_DESC_farr_defeat_shame: "The realm has been defeated under the doctrine of farr. Every chronicle will record that heaven was watching, and chose not to favor the dynasty."
 STATIC_MODIFIER_NAME_farr_capital_lost: "The Capital Lost"
 STATIC_MODIFIER_DESC_farr_capital_lost: "The seat of the realm is in enemy hands. No mirror-for-princes literature can paint over a king who has lost his own throne."

 # --- Apparatus REFUNDS (in-run cancellations of specific deficits)
 # These exist only for the duration of the disaster — they cancel
 # the corresponding penalty in the standing modifier. When the
 # disaster resolves, both the penalty and its refund are gone.
 STATIC_MODIFIER_NAME_farr_sikka_refund: "The Sikka Cuts Your Name"
 STATIC_MODIFIER_DESC_farr_sikka_refund: "The dār al-ḍarb has finished recutting the dies. From this striking onward, the dirham of the realm carries your name, not the Ilkhan's; the bazaar's reluctance to accept the coin has ended. The unrecognition by mint and bazaar has been brought into line."
 STATIC_MODIFIER_NAME_farr_khutba_refund: "The Khutba Reads Your Name"
 STATIC_MODIFIER_DESC_farr_khutba_refund: "The qāḍīs of the great mosques are reading the Friday sermon in your name. The ʿulamāʾ's silent withholding has been brought into line."
 STATIC_MODIFIER_NAME_farr_hunt_and_nawruz_refund: "The Amīrs Bow at the Hunt"
 STATIC_MODIFIER_DESC_farr_hunt_and_nawruz_refund: "The great hunt rode under your standard and the amīrs rode behind you in their proper ranks. The amīrs' assent — withheld through the early years of the boast — has been brought into line."
 STATIC_MODIFIER_NAME_farr_padishah_refund: "The Title Brought Into Line"
 STATIC_MODIFIER_DESC_farr_padishah_refund: "The chancery now writes pādishāh; foreign correspondence answers in kind or is not answered; the coinage epigraphy reads what the throne has always claimed. The largest remaining slice of the bleed is cancelled — the boast is no longer outrunning the world's recognition of it."

 # --- Apparatus LEGACIES (institutional traces, persist past resolution)
 # These are the historical memory of having held the recognition.
 # They survive Vindicated, Endured, and Broken-lapse. Only
 # Broken-formal (Türk amīr usurpation) strips them — the doctrine
 # dies with the dynasty.
 STATIC_MODIFIER_NAME_farr_sikka_granted: "The Dār al-Ḍarb of Our House"
 STATIC_MODIFIER_DESC_farr_sikka_granted: "The mint infrastructure built during the wager — the assayers, the die-cutters, the chain of authorized dār al-ḍarb in every great city — endures. The Muzaffarids kept their sikka long after their fortunes turned, and so will this house."
 STATIC_MODIFIER_NAME_farr_khutba_in_your_name: "The Khutba Precedent"
 STATIC_MODIFIER_DESC_farr_khutba_in_your_name: "Every great mosque of the realm has, at least once, read the Friday sermon for this dynasty. The precedent shapes the posture of the ʿulamāʾ for generations: a house whose name has been pronounced by the qāḍīs cannot easily be erased from the institutional church of Iran."
 STATIC_MODIFIER_NAME_farr_hunt_and_nawruz: "The Hunt and the Nawrūz Court"
 STATIC_MODIFIER_DESC_farr_hunt_and_nawruz: "The synthesis of Sasanian, steppe, and Islamic kingship has been institutionalized — the royal hunt as Bahrām Gūr rode it, the Nawrūz court as Khusraw Anūshīrvān held it. The tribes and amīrs read the ceremony as binding; the dampener on dissent persists past the wager itself."
 STATIC_MODIFIER_NAME_farr_padishah: "Pādishāh-i Īrān"
 STATIC_MODIFIER_DESC_farr_padishah: "The dynasty is no longer a malik among maliks. Foreign chanceries that have once written pādishāh-i Īrān will write it again; the titular weight endures in the diplomatic correspondence of the post-Mongol Iranian world."

 # --- Resolution modifiers
 STATIC_MODIFIER_NAME_farr_manifest: "Farr Manifest"
 STATIC_MODIFIER_DESC_farr_manifest: "The wager has been proved. The amīrs who watched the dynasty win have sworn; the bleed has become a stream. The doctrine of heaven's favor has been read by the realm as standing on this house, and recognized."
 STATIC_MODIFIER_NAME_farr_endured: "Farr Endured"
 STATIC_MODIFIER_DESC_farr_endured: "The claim stood through twenty-five years. The realm survived; the doctrine survived with it. This is the smaller vindication — quieter than Farr Manifest, but the claim stands."
 STATIC_MODIFIER_NAME_attempted_farr_and_failed: "An Unproved Boast"
 STATIC_MODIFIER_DESC_attempted_farr_and_failed: "This house once declared farr-i īzadī and failed to prove it. The chronicles remember; the rival amīrs remember; the cousins remember. The doctrine cannot be re-declared by this dynasty."

 # --- Auto-modifier
 AUTO_MODIFIER_NAME_farr_proof_at_war_bonus: "The Doctrine Tested in War"
 AUTO_MODIFIER_DESC_farr_proof_at_war_bonus: "A king at war under the doctrine of farr is reading the war as evidence. The bleed is partially offset while the army marches."

 # ============================================================
 # DISASTER PANEL — progress track headers
 # ============================================================
 FARR_PROOF_VINDICATION_TRACK: "Months at Legitimacy ≥ 95 (Vindication)"
 FARR_PROOF_LAPSE_TRACK: "Months at Legitimacy ≤ 40 (Lapse)"
 FARR_PROOF_ENDURANCE_TRACK: "Months Elapsed (Endurance, year 25)"

 # ============================================================
 # APPARATUS ACTIONS — buttons on the disaster panel
 # Player claims each at the legitimacy threshold; each grants
 # an irreversible permanent modifier (the historical memory of
 # having held the favor persists even if later lost).
 # ============================================================
 claim_sikka: "Strike the Sikka"
 claim_sikka_desc: "Order the dies recut. From this day the dirham in every hand carries your name where the khan's was, where the sultan's was. Available once the realm's legitimacy passes 50 — the chancery will not engrave a name in metal that the houses do not yet recognize."

 claim_khutba: "Claim the Khutba"
 claim_khutba_desc: "The Friday sermon names you — not the caliph alone, not the puppet khan, not your suzerain. Every qadi who reads it under his own roof has taken your part in the eyes of God and the congregation. Available once the realm's legitimacy passes 65 — fewer pulpits than that and the silence speaks against you."

 proclaim_hunt_and_nawruz: "Proclaim the Royal Hunt and Nawrūz Court"
 proclaim_hunt_and_nawruz_desc: "The full Sasanian-steppe synthesis: the king rides at the head of the great hunt as Bahrām Gūr rode, and holds the Nawrūz court as Khusraw Anūshīrvān held it, with the amīrs in their proper ranks and the dīwān in its proper hall. Available once the realm's legitimacy passes 80 — the doctrine has begun to wear its full ceremony."

 assume_padishah: "Assume the Title of Pādishāh"
 assume_padishah_desc: "Malik to pādishāh — the title-jump the Saljuqs made, that the Ilkhanate confirmed, that the Timurids claimed and the Safavids took. The boast is now public, irrevocable, written into the throne-name itself. Available once the realm's legitimacy passes 90 — at that pitch the chronicles can no longer demur."

 # ============================================================
 # INDICATOR EVENTS — fire whenever their hook applies, until the
 # player silences them. Option (b) silences only this notification
 # type; option (c) silences every remaining indicator for the run.
 # ============================================================

 # --- .300 Battle won
 farr_proof.300.title: "A Battle Won — and Counted"
 farr_proof.300.desc: "Word reaches the dīwān: your captains have broken the enemy in the field. Heralds will read the dispatch in the bazaar by Friday. The chancery notes a small but real gain in the realm's legitimacy — every battle is now an argument in your wager, and you have just made one in your favor."
 farr_proof.300.a: "Read the dispatch aloud."
 farr_proof.300.b: "Stop showing me battle-win notifications."
 farr_proof.300.c: "Stop showing me any of these notifications."

 # --- .301 Battle lost
 farr_proof.301.title: "A Battle Lost — and Counted"
 farr_proof.301.desc: "An exhausted courier brings word: your captains were broken. The ledger of the wager registers the loss before the bazaar does — a small but real bite of legitimacy is gone. Every defeat in the field while the farr is under examination is read as a verdict, however small."
 farr_proof.301.a: "Acknowledge the loss."
 farr_proof.301.b: "Stop showing me battle-loss notifications."
 farr_proof.301.c: "Stop showing me any of these notifications."

 # --- .302 War won
 farr_proof.302.title: "A War Concluded — Conquest as Argument"
 farr_proof.302.desc: "The peace is sealed; the realm has won its war. The dīwān posts a substantial legitimacy gain, and the realm now wears the Conquest Glory modifier for the next twelve months — a stacking bonus to monthly legitimacy that pays the wager forward. Win another war before this expires and the bonus compounds. This is the only mechanism that pushes your monthly legitimacy reliably positive while the wager runs."
 farr_proof.302.a: "Order the conquest read in the khutba."
 farr_proof.302.b: "Stop showing me war-victory notifications."
 farr_proof.302.c: "Stop showing me any of these notifications."

 # --- .303 War lost
 farr_proof.303.title: "A War Concluded — Defeat as Verdict"
 farr_proof.303.desc: "The terms are agreed; the realm has lost its war. The flat legitimacy hit is heavy, and the realm now wears Defeat Shame for the next six months — a bleed of monthly legitimacy on top of the disaster's standing drain. Lose another war before this expires and the shame extends. Few houses survive two such verdicts in succession with the doctrine intact."
 farr_proof.303.a: "Receive the envoy."
 farr_proof.303.b: "Stop showing me war-defeat notifications."
 farr_proof.303.c: "Stop showing me any of these notifications."

 # --- .304 Capital lost
 farr_proof.304.title: "The Capital Has Fallen"
 farr_proof.304.desc: "The seat of the realm is in enemy hands. The dīwān staff who could flee have fled; the rest are now interpreting the khutba for a new sovereign. This is the public humiliation Bayhaqī describes when Masʿūd lost Ghazna — every house in the region marks the date. A heavy flat legitimacy loss is applied, and the realm wears the Capital Lost modifier until that seat is recovered or the disaster ends."
 farr_proof.304.a: "We will retake it."
 farr_proof.304.b: "Stop showing me capital-loss notifications."
