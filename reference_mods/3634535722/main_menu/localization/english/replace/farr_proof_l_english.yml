 farr_proof.305.title: "A Province Lost"
 farr_proof.305.desc: "A province has changed hands — not the seat, but a piece of the realm. The chancery enters the loss in the registers; the chronicles will record it. While the farr is under examination, every territorial loss is a small erosion of the legitimacy ledger. The bite is modest, but the chronicles remember."
 farr_proof.305.a: "Note it and move on."
 farr_proof.305.b: "Stop showing me province-loss notifications."
 farr_proof.305.c: "Stop showing me any of these notifications."

