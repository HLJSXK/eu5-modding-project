 # ----- The mutaṭawwiʿa lodge -----
 mutatawwia: "Mutaṭawwiʿa Lodge"
 mutatawwia_desc: "The recruitment lodge of the volunteer holy warrior — al-mutaṭawwiʿūn, \"those who present themselves\" for the frontier. A ribāṭ-mosque-lodge hybrid where preachers fire the resolve, ribāṭ-shaykhs feed and clothe the volunteer, and the muezzin's call marks the rotation of muraābiṭūn who live at the lodge for a season before riding out. Ribāṭs of Khurasan, Transoxiana, the Caucasus marches, the Anatolian thughūr — the institutions that turned pious unemployment into a frontier muster.\n\nThis is the building behind the dar al-jihad reform's recruitment ledger: the place the ledger is kept, the cadre that keeps it, the standing rotation that gives the muster a permanent core. Clergy here are not contemplatives; they are recruiters, quartermasters, and battlefield preachers. Their power in the locality rises accordingly — armed clerics are powerful clerics."
 mutatawwia_maintenance: "Recruitment Lodge"
 mutatawwia_maintenance_desc: "The lodge's daily round: paper for the muster roll and the shaykh's correspondence with neighboring lodges, books of the ḥadīth of jihād and the futuwwa manuals the preacher draws on, banners and standard-issue cloaks in fine cloth for the rotating cohort, and the rack of weapons from which arriving volunteers arm themselves before the season's ride."

 # ----- The zurkhāna -----
 zurkhanah: "Zūrkhāna"
 zurkhanah_desc: "The \"house of strength\" — the wrestling pit, the training floor, the brotherhood. Persian gymnasia bound by the futuwwa oath and the javānmardī code: the pahlavān at the center of the gowd, the murshid on the sardam beating the zarb and reciting from Shāhnāma, the cohort moving the mils and the kabādeh in unison. The institutional form of the ʿayyārān — the urban militia tradition that rose with the Sarbedars of Sabzavar, that armed the bāzāris of Tabriz against the tax-farmer, that later furnished the Safavid order its qizilbāsh cadres.\n\nA quarter institution: every bazaar of any standing has a zūrkhāna, and the pahlavān is a man known by name to the muḥtasib, the ʿulamāʾ, and the amīr alike. The futuwwa oath mediates the quarter's disputes before they reach the qāḍī, and the prosperity of the bazaar is bound up with the prosperity of the gymnasium that drinks from its rents."
 zurkhanah_maintenance: "House of Strength"
 zurkhanah_maintenance_desc: "A modest establishment: fine cloth for the pahlavān's tunbān and the murshid's robe, the wooden mils and the iron kabādeh that furnish the training floor, and the benches of the sardam from which the cohort is judged."
