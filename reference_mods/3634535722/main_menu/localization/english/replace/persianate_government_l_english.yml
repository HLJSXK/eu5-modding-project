l_english:
 # Government Type
 persianate_sultanate: "Persianate Sultanate"
 persianate_sultanate_desc: "A post-Seljuk political form weaving together Sasanian administrative inheritance, Islamic juridical legitimacy, and Turco-Mongol military aristocracy. The sultan rules through a dual settlement: the [Concept('diwan_estate', 'Diwan')|E] manages taxation, irrigation, and the chancery; the [Concept('amirs_estate', 'Amirs')|E] raise tribal cavalry hosts in exchange for [iqta_law|E] grants. Succession follows the [favorite_son_elective_succession|E] norm rather than primogeniture — the strongest son, blessed by the late ruler and acclaimed by the amirs, takes the throne, with civil war if the question is not settled."

 # Government Power
 GOV_POWER_NAME_legitimacy_persianate_sultanate: "Legitimacy"
 GOV_POWER_NAME_legitimacy_persianate_sultanate_desc: "The sultan's recognized standing as a rightful ruler."

 # Templates
 persianate_sultanate_tazik_dominant: "Persianate Sultanate (Tazik-Dominant)"
 persianate_sultanate_tazik_dominant_desc: "A Persianate state in which the men of the pen prevail — the [Concept('diwan_estate', 'Diwan')|E] regulates land, taxes, and waqf, the [Concept('amirs_estate', 'umara')|E] are curtailed and serve as commissioned commanders rather than territorial lords. Strong fiscal penetration, refined Persianate court culture, professional but small mounted forces. The Kartids, Muzaffarids, and Injuids exemplify this configuration."
 persianate_sultanate_tork_dominant: "Persianate Sultanate (Tork-Dominant)"
 persianate_sultanate_tork_dominant_desc: "A Persianate state in which the men of the sword prevail — the [Concept('amirs_estate', 'umara')|E] hold hereditary tuyul, raise tribal hosts at will, and treat the sultan as first among equals. Weaker fiscal extraction is compensated by a larger and harder-hitting cavalry levy. The Chobanids, Jalayirids, and Eretnids exemplify this configuration."

 # =========================================================
 # GOVERNMENT REFORMS — Persianate Sultanate
 # See in_game/common/government_reforms/01_persian_reforms.txt
 # =========================================================

 # Age 1 — Baseline
 persianate_bureaucracy_reform: "Persianate Bureaucracy"
 persianate_bureaucracy_reform_desc: "The settled chancery is the spine of the realm — a tax-collecting, register-keeping, qāḍī-appointing apparatus that turns the sultan's writ into the daily fact of rule. The countryside is demilitarized: the peasant pays, the dīwān administers, the tribal cavalry alone fights."

 # Age 1 — Legitimacy Triad
 chinggisid_regency: "Chinggisid Regency"
 chinggisid_regency_desc: "You rule as regent for a Chinggisid puppet — the Chobanid, Jalayirid, and Timurid solution to the problem that you, a non-Chinggisid, cannot legitimately be khan. The fiction stabilizes the realm. The chancery, ruling in another's name, cannot reach its full stride."

 farr_i_izadi: "Farr-i Īzadī"
 farr_i_izadi_desc: "You claim the farr-i īzadī — the divine royal fortune, the kingship doctrine the ʿulamāʾ themselves teach in every mirror-for-princes book from Niẓām al-Mulk to Ṭūsī. The Turco-Mongol warlord becomes shāh, ẓill Allāh in the line of Anūshīrvān. The diwan and the burghers rejoice, for this is the doctrine of their own books; the amirs have no place in a settled shāh's court; the jurists ask quietly by what right you crown yourself when the only sanctioning authority is the ʿAbbāsid in Cairo, and you have just bypassed him."

 ghazi_sultanate: "Ghāzī Sultanate"
 ghazi_sultanate_desc: "Your legitimacy is the defense and expansion of the dār al-Islām — the frontier holy-warrior's claim. Manpower flows easily, the ʿulamāʾ bless your wars, and the realm orients itself toward the marches."

 amir_sultanate: "Amīr Sultanate"
 amir_sultanate_desc: "You rule as a sultan by the sword — the Ghaznavid template, Sebüktigin and Mahmūd's regime, the post-Saljuq atabegate. The army is the legitimating body; the dīwān runs the revenue and the chancery in the language and forms it always has, but the political weight has shifted to the umarāʾ, who now take their seat at the table. No farr is claimed; no Chinggisid puppet is needed; the sword and the caliph's diploma suffice. Bayhaqī, the Persian secretary at the Türkic sultan's court, is the chronicler of this arrangement."

 # Age 1 — Settled-State Theory
 circle_of_equity_reform: "Circle of Justice"
 circle_of_equity_reform_desc: "The dāʾira-yi ʿadālat — Ṭūsī's and Davānī's circle: no army without treasury, no treasury without prosperity, no prosperity without justice, no justice without the king. The ideological substrate of every settled, taxed, bureaucratic realm in the Persianate world."

 # Age 2 — Trifurcation
 timurid_synthesis: "Timurid Synthesis"
 timurid_synthesis_desc: "Shāhrukh's settlement: drop the puppet khan, move the capital to Herat, subordinate the yasa to the sharīʿa. The amīrs and the dīwān, the steppe inheritance and the Persian chancery, no longer at war with themselves. The renaissance has its political form."

 turkmen_confederation: "Türkmen Confederation"
 turkmen_confederation_desc: "You rule as a tribal federation in the manner of the Aq Qoyunlu and Qara Qoyunlu — the ulus structure unaltered, the boys held together by the strongest sword. The cavalry is irresistible; the chancery is an afterthought."

 iranian_kingship: "Iranian Kingship"
 iranian_kingship_desc: "A compact Persian dynasty of the kind the Karts ran at Herat, the Muzaffarids at Shiraz, the Injuids at Fars. No Turco-Mongol military aristocracy on top — just the shāh, the chancery, and the high culture they inherit. Requires that you have already declared farr-i īzadī."

 dar_al_jihad: "Sword of The Sharia"
 dar_al_jihad_desc: "The verified ghaza claim — what the Ghāzī Sultanate was reaching for, now institutionalized. The corps no longer waits for the muster; the akıncı are a vocational estate, the ribats are tax-exempt waqfs with mustering halls, the dervish lodge keeps a recruitment ledger. The qāḍī reads the khutba without flinching. From Cairo to Delhi the chanceries write your style. This is the Anatolian beyliks' institutional crystallization (Kafadar's reading of the early Ottomans), and equally the Ghaznavid-Ghūrid pattern of the polity that exists for the ghaza and is held together by it. Requires that you have already declared ghāzī and that the wager closed in your favor — Sword of Islam or Guardian of the Thughur."

 # Age 2 — Heterodox Axis
 mushasha_messianism: "Mushaʿshaʿ Messianism"
 mushasha_messianism_desc: "Apocalyptic Islam — Muḥammad b. Falāḥ's Mushaʿshaʿiyya in Khūzistān, Fażlallāh Astarābādī's Ḥurūfism, the Sarbadār dervish-soldiers of Sabzevār. The orthodox ʿulamāʾ hate it; the believers fight like men with nothing to lose."

 # Age 2 — Universalist Overlay
 sahib_qiran: "Ṣāḥib-Qirān"
 sahib_qiran_desc: "Lord of the Auspicious Conjunction — Timur's astrological claim to universal rule. A cosmic mandate distinct from both töre and farr, sitting on top of whichever state-form you have chosen."

 # Age 3 — Military Dilemma
 qizilbash_aristocracy: "Qizilbāsh Aristocracy"
 qizilbash_aristocracy_desc: "The cavalry aristocracy of the early Safavid state — the red-cap Türkmen khans of Anatolia and Azerbaijan, devoted to the shāh as their murshid. The hardest-hitting cavalry in the Persianate world; and the most centrifugal political force in it."

 tofangchi_topchi_corps: "Tofangchī and Topchī Corps"
 tofangchi_topchi_corps_desc: "Musket-and-cannon infantry, paid and centralized. The bloody lesson of Chaldirān (1514) finally heeded — the gunpowder answer to a battlefield the qizilbāsh charge can no longer carry. Expensive, and resented by the cavalry."

 ghulam_system: "Ghulām Corps"
 ghulam_system_desc: "Abbas I's Caucasian slave-corps — Georgian, Circassian, and Armenian converts loyal to the shāh alone, raised explicitly to break qizilbāsh power. A salaried standing army; the cavalry aristocracy's gravedigger."

 # Age 3 — Religious Settlement
 imami_tashayyu: "Imāmī Tashayyuʿ"
 imami_tashayyu_desc: "The forced imposition of Twelver Shiʿism, from 1501. You import jurists from Jabal ʿĀmil to staff an establishment that does not yet exist, and your majority-Sunni population learns the new creed by force. Long-term unity at the cost of a generation of disruption."

 sunni_orthodoxy: "Sunnī Orthodoxy"
 sunni_orthodoxy_desc: "Institutionalized Ḥanafī orthodoxy — the Timurid and Shaybanid road. The Sunnī ʿulamāʾ are state-backed, the qāḍīs appointed, the madrasas endowed; the realm answers to a single juridical tradition."

 sadr_judiciary: "Ṣadr Judiciary"
 sadr_judiciary_desc: "The ṣadr office is established to administer the state church — supervising waqf, appointing qāḍīs, paying the ʿulamāʾ from the treasury. The clergy are happy and tamed; the dīwān grows another arm."

 # Age 3 — Messianic Fusion
 murshid_i_kamil: "Murshid-i Kāmil"
 murshid_i_kamil_desc: "The shāh as Perfect Spiritual Guide, commanding qizilbāsh murīds bound to him by oath. Ismāʿīl I's Khaṭāʾī dīvān is the testament — semi-divine claims, apocalyptic charisma, and an army that follows the shāh because it follows the shaykh. Volatile by design."

 # Age 3 — Land Politics
 soyurghal_grants_reform: "Soyurghal Grants"
 soyurghal_grants_reform_desc: "Hereditary, tax-immune, administratively-immune land grants to amīrs and clergy — the drift toward feudal fragmentation. The state's writ ends at the soyurghal's boundary stone, and the chancery is not welcome past it."

 khassa_crown_demesne: "Khāṣṣa Crown Demesne"
 khassa_crown_demesne_desc: "Abbas I's conversion of provincial mamālik land into khāṣṣa — crown demesne administered directly by ghulām officials. The countryside the qizilbāsh held is taken back into the central fisc, and the throne's rural reach grows."

 # The chancery flag (apparatus gate)
 MODIFIER_TYPE_NAME_has_nizam_ul_mulk_chancery: "Niẓām al-Mulk Chancery"
 MODIFIER_TYPE_DESC_has_nizam_ul_mulk_chancery: "The polity runs the classical Persianate apparatus: a chancery class keeping the registers, an iqṭāʿ military fisc, and the diwan and amir estates that staff them. Iran, Cairo, and Delhi each wear it in their own dress; the frontier does not wear it at all."

 # Delhi breakaway correction (fires silently; loc for safety)
 periphery.1.title: "The Governor's Khutba"
 periphery.1.desc: "The Friday sermon in the provincial capital is read in a new name — the governor's own. The registers, the iqṭāʿ rolls, and the Persian of the chancery all continue exactly as before; only the sovereign has changed. Every amputation of Delhi is performed with Delhi's own instruments."
 periphery.1.a: "The dispensation continues."

 # The Khusraw Khan protocol (periphery.2)
 periphery.2.title: "The Faith of the Realm"
 periphery.2.desc: "The khutba has faltered. The throne of the sultanate no longer stands in the faith the dispensation was built for, and every amīr in the realm remembers what that means, because the ruling house itself was founded on the answer. In 1320 a convert-usurper sat this same kind of throne and dreamed of restoration; within the year the men of the sword had killed him and his line and found a believer. The registers, the iqṭāʿ rolls, the qāḍī courts, and truly, the whole apparatus rests on the dispensation. Either the dispensation ends, honestly and whole, or the amīrs write the old answer again in blood."
 periphery.2.a: "The dispensation is ended. Let the realm be what its people are."
 periphery.2.b: "The amīrs remember Khusraw Khan. Kill the apostate; find a believer."

 # Periphery starter reforms
 indian_sultanate_reform: "The Delhi Dispensation"
 indian_sultanate_reform_desc: "The subcontinent's Persianate order: a Turco-Persian cavalry elite paid through iqṭāʿ, a chancery whose revenue registers reach further than any in the Islamic world, and garrison cities holding down a countryside that has never fully consented. Harder extraction than the Iranian norm — the fiscal delta that keeps the sultanates coming."
