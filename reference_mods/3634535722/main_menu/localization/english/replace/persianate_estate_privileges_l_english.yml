l_english:
 # =========================================================
 # BURGHERS — Persianate additions (05_persianate_burghers.txt)
 # =========================================================
 asnaf_futuwwa_compact: "Asnāf–Futuwwa Compact"
 asnaf_futuwwa_compact_desc: "The bazaar guilds (asnāf) are formally tied to the futuwwa lodges that govern the chivalric brotherhoods of the artisans. Production flourishes under guild discipline, but the same lodges carry the mystical currents that flow through every Persianate city."

 ayyar_militia_recognition: "ʿAyyār Militia Recognition"
 ayyar_militia_recognition_desc: "The urban tough-bands of the ʿayyārūn are licensed as civic guards. They watch the walls cheaply and turn out in numbers, but their loyalties are to the quarter, the lodge, and the bazaar — not to the throne."

 caravan_capitulation_charter: "Caravan Capitulation Charter"
 caravan_capitulation_charter_desc: "Long-distance caravan merchants of the Karīmī and Tabrīzī houses receive formal capitulations from the chancery: protection on the road, predictable tolls, recognized contracts. The Silk Road learns to pay through us."

 malik_al_tujjar: "Malik al-Tujjār"
 malik_al_tujjar_desc: "The state appoints a Malik al-Tujjār — King of the Merchants — to head the bazaar as a chartered officer of the realm. The merchant houses route their capital through him, and through him into the politics of the court. Few offices grow more dangerous more quickly."

 # =========================================================
 # CLERGY — Persianate additions (06_persianate_clergy.txt)
 # =========================================================
 naqib_al_ashraf: "Naqīb al-Ashrāf"
 naqib_al_ashraf_desc: "The Naqīb al-Ashrāf — registrar of the descendants of the Prophet — is formally recognized. Sayyid lineages receive tax exemption and judicial precedence. The dynasty borrows their lineage's legitimacy, and pays for the privilege in foregone clerical revenue."

 sufi_tariqa_patronage: "Sufi Tariqa Patronage"
 sufi_tariqa_patronage_desc: "Khānqāhs of the Suhrawardī, Kubrawī, and Khalwatī orders are endowed and protected. The lodges become a recruiting network across the realm, deepening the cultural soil and tilting the country toward mystical currents — the same currents that, taken too far, eventually produced the Safavīya."

 madrasa_endowment: "Madrasa Endowment"
 madrasa_endowment_desc: "Great madrasas — heirs of the Niẓāmiyya and Mustanṣiriyya — are founded and sustained from the public treasury. The pipeline of literate jurists feeds both the qāḍī benches and the chancery, training the cadre on which a Persianate state runs."

 hajj_caravan_patronage: "Hajj Caravan Patronage"
 hajj_caravan_patronage_desc: "The state assumes the cost of the pilgrim caravan to the Ḥaramayn — provisioning, escort, subsidy. The pious recognize the throne's authority over the road to Mecca; the treasury, however, recognizes the cost."

 mazalim_sanction: "Maẓālim Sanction"
 mazalim_sanction_desc: "The sovereign's maẓālim court — the parallel jurisdiction by which the ruler hears grievances above and around the qāḍīs — is formally sanctioned. Control sharpens, the cabinet sharpens, the ʿulamāʾ grumble at being bypassed."

 # =========================================================
 # PEASANTS — Persianate additions (07_persianate_peasants.txt)
 # =========================================================
 qanat_maintenance_compact: "Qanāt Maintenance Compact"
 qanat_maintenance_compact_desc: "The villages hold formal responsibility for the upkeep of the qanāts that water their fields — the underground channels that turn arid land into productive smallholdings. Where the water flows, the harvest swells."

 iqta_cultivator_protections: "Iqtāʿ Cultivator Protections"
 iqta_cultivator_protections_desc: "The chancery sets bounds on what the iqtāʿ-holder may extract from the cultivators on his grant. Tenants gain shelter from over-extraction, the amīrs lose their freer hand, and the state's writ runs further into the village."

 # =========================================================
 # AMIRS — base privilege (02_amir_privileges.txt)
 # =========================================================
 amirs_iqta_grant: "Iqtāʿ Grant"
 amirs_iqta_grant_desc: "The classical iqtāʿ — a service-conditioned, theoretically revocable revenue grant on land, Buyid in origin and systematized under the Seljuqs. The amīr draws his pay from the harvest, owes the throne his horsemen, and holds the grant only as long as the throne tolerates him. The basic frame of the Persianate land-army bargain."

 # =========================================================
 # AMIRS — Persianate additions (08_amir_persianate_additions.txt)
 # =========================================================
 soyurghal_grants: "Soyurghal Grants"
 soyurghal_grants_desc: "Hereditary grants of land and revenue with immunity from chancery audit. The classic instrument of the late Timurid, Aq Qoyunlu, and early Safavid orders — the holder pockets the taxes, and the diwan cannot follow him into the countryside."

 amir_al_umara: "Amīr al-Umarāʾ"
 amir_al_umara_desc: "The senior-most amīr is recognized as chief of all military commanders — a Buyid survival, recycled by Seljuq atabegs, Ilkhanid noyans, and Timurid emirs. Command concentrates in one grandee; the cavalry sharpens, the chancery loses its grip on the camp."

 yarligh_tarkhan: "Yarligh-Tarkhan"
 yarligh_tarkhan_desc: "Tarkhan yarlighs — Mongol chancery patents conferring personal and fiscal immunity. The Ilkhans handed them out lavishly, and the Timurids and Aq Qoyunlu kept the practice. The state writes itself out of the revenue stream household by household."

 universal_tarkhan: "Universal Tarkhan"
 universal_tarkhan_desc: "The tarkhan principle generalized to a class. Not the yarligh granted household by household, but the standing fiction — Aq Qoyunlu, early Safavid — that the amīr caste as a body lies beyond the assessor's reach. The qizilbāsh khan does not produce a patent when the muḥtasib's man rides up; he laughs, and the muḥtasib's man rides away. The cavalry aristocracy passes out of the tax base entirely. What revenue the realm still gathers it gathers from peasants, burghers, and its own chancery — and the chancery does not forgive the arrangement."

 quriltai_convocation: "Quriltai Convocation"
 quriltai_convocation_desc: "The senior amīrs convene in the Mongol manner — the assembly that acclaimed khans, and lingered as the legitimating instrument of Ilkhanid, Chaghatayid, and Timurid succession. Legitimacy and levies flow up from the gathering; the centralizing project slows."

 amirs_umara_at_the_diwan: "Umarāʾ at the Dīwān"
 amirs_umara_at_the_diwan_desc: "Türk amīrs are formally admitted to the chancery and the cabinet — sitting in judgment on registers, revenues, and appointments alongside the men of the pen. Niẓām al-Mulk warned in the Siyāsatnāma that when the sword takes up the pen, the kingdom's affairs are ruined; the Aq Qoyunlu and Qara Qoyunlu disregarded him, and the late-Timurid Herat dīwān slid the same way under umarāʾ pressure. The mirror of the Tāzīk Command of Arms — and the dīwānīs hate it as bitterly as Ṭoghā Temür hated a tāzīk in the saddle."

 amirs_tribal_urf_jurisdiction: "Tribal ʿUrf Jurisdiction"
 amirs_tribal_urf_jurisdiction_desc: "Tribal country is carved out of the maẓālim court and the qāḍī benches. The amīr judges his own ulūs by ʿurf and ʿādat — Türk: töre — and the chancery's legal uniformity ends at the city wall. Mutually exclusive with the dīwān's Qānūn Codification: a realm can have one legal order, not two."

 # =========================================================
 # DIWAN — Persianate additions (09_diwan_persianate_additions.txt)
 # =========================================================
 sahib_diwan_plenipotentiary: "Ṣāḥib-Dīwān Plenipotentiary"
 sahib_diwan_plenipotentiary_desc: "The chief minister is invested with delegated executive authority over the realm. The Juvaynī brothers under Hülegü and Abaqa, Rashīd al-Dīn under Ghazan and Öljaitü — the chancery runs the state, the throne legitimates it, and the amīrs grumble."

 mustawfi_al_mamalik: "Mustawfī al-Mamālik"
 mustawfi_al_mamalik_desc: "The chief accountant of the realm — Ḥamdallāh Mustawfī of Qazvīn under the late Ilkhans is the eponymous practitioner. The office runs the registers, audits the provinces, and tracks every dīnār with the chancery's signature obsessiveness."

 persianate_mint_administration: "Persianate Mint Administration"
 persianate_mint_administration_desc: "State-monopoly minting after the manner of Rashīd al-Dīn's reform of 1297. The chancery, not the bazaar, sets the silver standard and the run of the coin. The burghers lose mintage as an estate prerogative; the treasury picks up the seigniorage."

 mongol_persian_documentary_synthesis: "Mongol-Persian Documentary Synthesis"
 mongol_persian_documentary_synthesis_desc: "The Juvaynī and Rashīdian synthesis — Mongol yarligh forms and Persian inshāʾ chancery style fused into a single documentary culture. The Jāmiʿ al-Tawārīkh is the monument; the working output is a chancery that can write to anyone in the steppe or the bazaar and be understood."

 diwan_mavajib_cash_pay: "Mavājib Cash Pay"
 diwan_mavajib_cash_pay_desc: "The cavalry is paid in coin from the central treasury — mavājib, drawn through ḥawāla drafts on provincial revenue out of the dīwān-i istīfāʾ. The Sasanian-Abbasid model that under-girded the ghulām corps and, in time, the Ottoman kapikulu. Cash pay keeps the countryside in the state's hands instead of ceding it to land-grant horsemen. Mutually exclusive with the amīrs' Hereditary Tuyūl: a realm can fund its army one way or the other."

 diwan_barid_intelligence: "Dīwān al-Barīd"
 diwan_barid_intelligence_desc: "The chancery's intelligence-courier service — Sasanian and Abbasid in origin, revived as the Mongol yam and the Safavid chapar. The ṣāḥib al-barīd reports to the throne over the heads of provincial elites, buying control through surveillance rather than cadastre. Mutually exclusive with the amīrs' Audit Exemption."

 diwan_musadara_confiscation: "Muṣādara Right"
 diwan_musadara_confiscation_desc: "The chancery is licensed to claw back the estates of dead, disgraced, or fallen officials into the treasury. Niẓām al-Mulk denounced the practice as corrosive — short-term revenue and grip at the cost of any official ever again improving the land he holds. The dīwān's answer to Soyurghal: the state denies heritability outright."

 mulk_protection_charter: "Mulk Protection Charter"
 mulk_protection_charter_desc: "The chancery formally renounces the prerogative of muṣādara and codifies the inviolability of mulk as positive law. The institution Niẓām al-Mulk listed as the chief suppressor of long-run prosperity in the Persianate realm — finally taken off the books. Every late-Safavid and Qajar reformist wanted to be rid of it; the Constitutional Revolution of 1906 finally codified it out of existence in Iran. Anti-thetical to the political DNA of a 14th-century Persianate sultanate — available only in the Reformation onwards. Comes with notable prosperity and development gains (the long-run dividend the chancery had always known was on the table) and a steady drain on the throne's legitimacy (the shāh who cannot seize is hardly a shāh). Mutually exclusive with the Muṣādara Right."

 diwan_tazik_command_of_arms: "Tāzīk Command of Arms"
 diwan_tazik_command_of_arms_desc: "The chancery is licensed to put its own men at the head of the field armies — the affront that Ṭoghā Temür famously hurled in the Kartid Muʿizz al-Dīn Ḥusayn's direction: what business has a tāzīk leading horsemen? Niẓām al-Mulk had ridden on campaign, Rashīd al-Dīn had fought the Chaghatayids on the Ilkhanid frontier, and now the throne acknowledges in writing what the Türco-Mongol military aristocracy has been gnashing its teeth at for a generation. The amirs hate it accordingly."

 diwan_qanun_codification: "Qānūn Codification"
 diwan_qanun_codification_desc: "The dynastic-sultanic law is codified into a qānūn-nāma, administered by the Persian chancery pen — the heritage of the Chinggisid yasa run through Persian forms, the same instrument that the Ottomans and Mughals would later sharpen. The qāḍī finds himself outranked. Mutually exclusive with Tribal ʿUrf Jurisdiction."
