 # Buildings
 dervish_khanaqah: "Dervish Khānaqāh"
 dervish_khanaqah_desc: "The lodge of the armed brotherhood — recruiting hall, armory, and indoctrination house of the Shaykhī order, in the tradition of Shaykh Ḥasan Jūrī's network. The salaried soldiers of the commonwealth muster here, where confiscation revenue meets the martyrdom vow."
