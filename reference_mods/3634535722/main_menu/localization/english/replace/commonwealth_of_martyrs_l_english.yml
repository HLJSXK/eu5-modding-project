 a_dervish_corps: "Dervish Corps"

 # Heir selection
 martyrs_dyarchic_election: "Dyarchic Election"
 martyrs_dyarchic_election_desc: "The succession of the Commonwealth: the council elects from the two wings — the [Concept('sufyani_notables_estate', 'Sufyānī notables')|E] and the [Concept('shaykhi_dervishes_estate', 'Shaykhī dervishes')|E]. War elevates the dervish shaykh; peace favors the malik; every transition is a trial of the dyarchy. Twelve rulers in forty-five years is the historical record, and few of them died in bed."
 HEIR_SELECTION_SHAYKHI_SWORD: "The lodges weigh the sword"
 HEIR_SELECTION_SUFYANI_LEDGER: "The notables weigh the ledger"
 HEIR_SELECTION_SHAYKHI_WAR: "War calls for a shaykh"
 HEIR_SELECTION_SUFYANI_PEACE: "Peace calls for a malik"

 # Intro event (martyrs.1)
 martyrs.1.title: "Heads Pledged to the Gallows"
 martyrs.1.desc: "In the village of Bāshtīn in Bayhaq, the Mongol tax collector demanded his due once too often, and the men of the village killed him where he stood. 'We would rather see our heads on the gallows' — sar be-dār — 'than submit.' The vow became a name, the name became a state.\n\nThe commonwealth that rose from that killing is like nothing else in Erānzamīn. There is no king: coin is struck in the name of the Hidden Imām, whose throne is held in trust until His return. Rule is shared — and contested — between two wings: the Sufyānī notables, who hold the cities, the courts, and the ledgers; and the Shaykhī dervishes of Ḥasan Jūrī's khānaqāh network, sworn craftsmen and villagers who ARE the army and preach the Imām's imminent coming. The expropriated estates of the Mongol amīrs pay a salaried soldiery no three-district state has any right to field.\n\nAround Sabzavār, the wolves are already circling: Togha Temür's ordu in Gurgān styles itself the Īlkhānate's heir; the Jauni Qurbān hold Ṭūs and Nishapur; the Kartid malik sits in Herat. Every one of them has hanged men for less than what we are.\n\nThe brethren are mustering at Sabzavār. The gallows is patient."
 martyrs.1.a: "The amīrs' hoards will pay the men who hanged them. Muster the brethren."

 # Conquest events (martyrs.2 Mashhad, martyrs.3 Nishapur)
 martyrs.2.title: "The Threshold of the Eighth Imam"
 martyrs.2.desc: "Mashhad is ours. The golden dome over the tomb of ʿAlī al-Riḍā — the eighth Imam, poisoned by a caliph, the only one of the Twelve who sleeps in Iranian earth — now stands within the commonwealth's walls.\n\nNo conquest could mean more to us. We mint our coin in the name of his descendant, the Hidden Imām whose throne we keep in trust; now we keep his ancestor's Threshold too. The pilgrims will come through our gates, the vows will be sworn at our shrine, and every dinar of pious offering will pass through hands we appoint.\n\nAnd there the quarrel begins. The notables see a waqf to administer — the greatest endowment in Khurāsān, wanting only honest ledgers. The brethren see the proof of the mission — the Imām's own house, in the keeping of those who wait for His son. And some in the council whisper a third counsel: write to the great jurist of Jabal ʿĀmil, in far Syria, and ask him for a book of law worthy of the Threshold — for a state that guards the Imām's tomb should judge by the Imām's jurisprudence, rightly derived."
 martyrs.2.a: "The Threshold needs ledgers, not ecstasies. The notables will administer it."
 martyrs.2.b: "The brethren guarded the vow; they will guard the tomb."
 martyrs.2.c: "Write to Muḥammad b. Makkī. Ask him for the law."
 martyrs.3.title: "The Old Metropolis"
 martyrs.3.desc: "Nishapur has opened its gates. The Mongols wasted it and the earth itself has shaken it down more than once, but the old metropolis of Khurāsān is still a name of names — the city of Niẓām al-Mulk and ʿAṭṭār, of madrasas and qāḍī courts and quarters that remember being the center of the world.\n\nIt is, above all, a notables' city. Its surviving great families kept their ledgers under the Mongols, kept their courts under the Jauni Qurbān, and will keep them under anyone. The Sufyānī wing already speaks of Nishapur as the commonwealth's proper seat of administration.\n\nThe brethren remember differently: these same families billeted the ordu's tax-farmers and read the khuṭba for every khan who asked. There are men in Nishapur with much to answer for — and estates worth the answering."
 martyrs.3.a: "Seat the notables. The old capital will teach us administration."
 martyrs.3.b: "Convene the tribunal. Nishapur's collaborators owe the gallows a debt."

 # Conquest static modifiers
 STATIC_MODIFIER_NAME_martyrs_custodian_of_threshold: "Custodian of the Threshold"
 STATIC_MODIFIER_DESC_martyrs_custodian_of_threshold: "The shrine of the eighth Imam at Mashhad lies within the commonwealth — the pilgrims, the vows, and the standing proof of the mission."
 STATIC_MODIFIER_NAME_martyrs_nishapur_chancery: "The Nishapur Chancery"
 STATIC_MODIFIER_DESC_martyrs_nishapur_chancery: "The old metropolis administers — its surviving families keep the commonwealth's ledgers with the habits of an imperial capital."

 # Maẓālim cases against the Sufyānī notables (parliament agendas)
 pa_sufyani_case_grain_hoarding: "Case: Engrossment of the Grain Supply"
 pa_sufyani_case_grain_hoarding_desc: "Notable houses bought the harvest cheap and locked the granaries until the price of bread trebled."
 pa_sufyani_case_sheltered_amir_estates: "Case: Sheltered Amīr Estates"
 pa_sufyani_case_sheltered_amir_estates_desc: "Confiscated Mongol lands quietly bought back through intermediaries, their old-regime clients shielded from the tribunals."
 pa_sufyani_case_bought_verdicts: "Case: Verdicts Bought in the Qāḍī Courts"
 pa_sufyani_case_bought_verdicts_desc: "The notable families staff the bench and the bench remembers its patrons."
 pa_sufyani_case_waqf_embezzlement: "Case: Embezzlement of the Endowments"
 pa_sufyani_case_waqf_embezzlement_desc: "Family-administered waqfs paying stipends to the founders' kin while the mosques and madrasas go unrepaired."
 pa_sufyani_case_secret_correspondence: "Case: Secret Correspondence with the Enemy"
 pa_sufyani_case_secret_correspondence_desc: "Letters under notable seals found in the saddlebags of riders bound for the enemy's camp."

 # Maẓālim cases against the Shaykhī dervishes (parliament agendas)
 pa_shaykhi_case_bazaar_extortion: "Case: Extortion in the Bazaar"
 pa_shaykhi_case_bazaar_extortion_desc: "Alms for the Imām's war, collected stall by stall with a hand on the knife."
 pa_shaykhi_case_street_takfir: "Case: Killings Without Trial"
 pa_shaykhi_case_street_takfir_desc: "Men denounced as hypocrites and hanged by dervish bands before any qāḍī heard their names."
 pa_shaykhi_case_commandeered_harvest: "Case: The Commandeered Harvest"
 pa_shaykhi_case_commandeered_harvest_desc: "Villagers marched from the fields to jihād drills at the lodges while the grain stood rotting."
 pa_shaykhi_case_spoils_of_the_imam: "Case: Spoils Taken in the Imām's Name"
 pa_shaykhi_case_spoils_of_the_imam_desc: "Shops and houses of accused enemies of the cause seized as war spoils inside the commonwealth's own walls."
 pa_shaykhi_case_shrine_desecration: "Case: The Desecrated Shrines"
 pa_shaykhi_case_shrine_desecration_desc: "Tombs of rival shaykhs broken open and scholars of the law harassed in the street as men of half-faith."

 # Revolutionary Zeal (the opening clock)
 STATIC_MODIFIER_NAME_revolutionary_zeal: "Revolutionary Zeal"
 STATIC_MODIFIER_DESC_revolutionary_zeal: "The generation that swore the vow at Bāshtīn is young, armed, and certain. Everyone contributes to the cause; no locks are needed on the doors. It cannot last forever — one generation is what you have."
 AUTO_MODIFIER_NAME_zeal_defensive_surge: "The Vow Besieged"
 AUTO_MODIFIER_DESC_zeal_defensive_surge: "They have come to hang us at last. Every man who swore the vow remembers what it was sworn against — the commonwealth at bay fights like 1337 again."

 # Devotion engine privileges — Shaykhī
 shaykhi_saddled_horse_vigil: "The Saddled Horse Vigil"
 shaykhi_saddled_horse_vigil_desc: "Every dawn a saddled, bridled white horse is led out of the gate, so that when the Imām appears He shall not wait a single hour for His mount. The city lives on the edge of the eschaton."
 shaykhi_martyrs_rolls: "The Martyrs' Rolls"
 shaykhi_martyrs_rolls_desc: "The lodges keep the register of the fallen, read aloud at the vigils. Every field against the ordu enters names, and the names feed the cause. A lost field fills more pages than a won one."
 shaykhi_common_table: "The Common Table"
 shaykhi_common_table_desc: "The malik eats what the brethren eat, at the same board, in the same wool. There is no high seat at the table of the Imām's servants — and the notables choke on every shared loaf."

 # Entrenchment privileges — Sufyānī
 sufyani_chancery_of_the_vow: "Chancery of the Vow"
 sufyani_chancery_of_the_vow_desc: "Nishapur has taught us administration. The ledger serves the trust now: a chancery of the commonwealth, keeping accounts in the name of a sovereign who is absent."
 sufyani_fixed_tax_register: "The Fixed Tax Register"
 sufyani_fixed_tax_register_desc: "The assessment is fixed, written, and read aloud in the bazaar. No farmer of taxes may demand a dinar beyond it. This is the justice the villages will remember of Sabzavār."
 sufyani_collaborator_scribes: "The Collaborators' Pens"
 sufyani_collaborator_scribes_desc: "The families who kept the ordu's ledgers keep ours now. The chancery hums with borrowed skill — and the brethren ask, quietly, what exactly was fought for."

 # Mission of the Liberated (building)
 mission_of_the_liberated: "Mission of the Liberated"
 mission_of_the_liberated_desc: "The dawa in the open: a lodge, a soup-kitchen, and a preacher for the quarters the vow has freed. The lower orders come first — the laborer hears the Imām's claim before the notable does."

 # Charter of the Liberated (cabinet action)
 charter_of_the_liberated: "Charter of the Liberated"
 charter_of_the_liberated_desc: "A province that recites with us is not a conquest but a homecoming. The council issues its charter and the land enters the commonwealth at a pace no sultanate could match."
 charter_of_the_liberated_select_province: "Charter a liberated province"
 charter_of_the_liberated_no_provinces: "No owned province is both Shia-majority and still unintegrated."

 # ʿĀshūrāʾ (martyrs.10)
 martyrs.10.title: "The Tenth of Muḥarram"
 martyrs.10.desc: "The drums begin before dawn. Today the commonwealth mourns its first martyr and patron — Ḥusayn at Karbalāʾ, thirsty among his dead — and in mourning him it explains itself to itself: this is what power does to the Imām's house, and this is why the throne stands empty in trust.\n\nThe question, as every year, is who owns the day. The brethren would take the streets — the procession, the chains, the names of the fallen read from the rolls until grief becomes vow. The notables would sponsor a seemly majlis — the elegies sung indoors, the bazaar shuttered in dignity, the passion honored without the fire."
 martyrs.10.a: "The streets. Read the rolls until grief becomes vow."
 martyrs.10.b: "The majlis. Grief with its collar straight."

