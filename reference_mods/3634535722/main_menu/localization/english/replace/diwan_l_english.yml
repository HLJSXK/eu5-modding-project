 # --- The Waqf pathology: buildings and the deceptively-good charters ---
 ayyan_waqf: "Aʿyān Waqf"
 ayyan_waqf_desc: "A family endowment of the chancery class — bazaar rows and orchards dedicated to a pious purpose, with the founder's own line named as its salaried administrators. The dīwān grows quietly richer; the wealth is sheltered from the tax collector and from confiscation, and what is locked into the dead hand can no longer back the treasury's credit."
 grand_ayyan_waqf: "Grand Aʿyān Waqf"
 grand_ayyan_waqf_desc: "With the endowments declared inviolable, the chancery class freezes wealth on a grand scale. The same shelter, twice as deep: a richer dīwān, a thinner fisc, and a credit market starved of the realm's own capital."
 urban_waqf: "Urban Waqf"
 urban_waqf_desc: "The bazaar, the caravanserai, the merchant dynasty's real estate made inalienable as endowment. The burghers prosper; the urban tax base and the realm's borrowing power both quietly recede behind the dead hand."
 grand_urban_waqf: "Grand Urban Waqf"
 grand_urban_waqf_desc: "Whole quarters of the great cities pass into inalienable endowment. The merchant houses flourish, untaxable and unconfiscatable — and the commercial wealth that should stand behind the state's credit is frozen out of reach."
 clerical_waqf: "Clerical Waqf"
 clerical_waqf_desc: "Madrasa, shrine, and village land endowed under the ulama's own administration — the most legitimate and least touchable of endowments. The religious establishment's autonomous wealth swells beyond the state's reach, sheltered from tax and from credit alike."
 grand_clerical_waqf: "Grand Clerical Waqf"
 grand_clerical_waqf_desc: "The sanctified endowments multiply without limit. The ulama command a parallel economy the crown can neither tax nor borrow against — pious, untouchable, and a permanent drag on the fisc."

 ayyan_waqf_charter: "Inviolable Endowments"
 ayyan_waqf_charter_desc: "Declare the chancery's pious endowments inviolable. The dīwān is grateful and loyal, the ulama bless your piety, and your legitimacy as a just and generous sovereign grows — for only a modest concession of influence. (Permits the Grand Aʿyān Waqf.)"
 urban_waqf_charter: "Charter of the Bazaar Awqāf"
 urban_waqf_charter_desc: "Grant the merchant houses the right to endow their commercial wealth as inviolable charity. The burghers are devoted, the ulama approve, and your name is read as a patron of the public good — at a small cost in influence. (Permits the Grand Urban Waqf.)"
 clerical_waqf_charter: "Sanctity of the Endowments"
 clerical_waqf_charter_desc: "Recognize the ulama's endowments as sacrosanct and beyond the crown's hand. The clergy are devoted and your legitimacy as Defender of the Faith grows, for only a small concession of influence. (Permits the Grand Clerical Waqf.)"

 # --- The Vizierate: diwan cabinet-composition auto-modifiers ---
 AUTO_MODIFIER_NAME_diwan_excluded_from_cabinet: "The Chancery Locked Out"
 AUTO_MODIFIER_DESC_diwan_excluded_from_cabinet: "Not one of the dīwān sits in the cabinet. The administration runs on amateurs and royal favourites, the registers go unkept, and the chancery class is incensed at its exclusion from its own government."
 AUTO_MODIFIER_NAME_diwan_not_at_cabinet_head: "No Vizier of the Pen"
 AUTO_MODIFIER_DESC_diwan_not_at_cabinet_head: "The dīwān serve in the cabinet, but the vizierate — the head of government — is held by an outsider. The chancery class expects one of their own at the head, as is proper in a well-ordered realm."
 AUTO_MODIFIER_NAME_diwan_at_cabinet_head: "A Vizier of the Pen"
 AUTO_MODIFIER_DESC_diwan_at_cabinet_head: "A man of the dīwān holds the vizierate, the head of the cabinet — the proper order of a Persianate realm. The chancery is honoured and the administration hums."
 AUTO_MODIFIER_NAME_diwan_crowded_in_cabinet: "Crowded Vizierate"
 AUTO_MODIFIER_DESC_diwan_crowded_in_cabinet: "A dīwān vizier heads the cabinet, but too many outsiders sit alongside him. One colleague the chancery will abide; a cabinet packed with amirs and royal kin it will not."
 CIVILWAR_FACTION_diwan_estate_NAME: "Pretender"
 STATIC_MODIFIER_NAME_diwan_waqf_damage: "Tax Lost to Waqf Exemptions"
 STATIC_MODIFIER_DESC_diwan_waqf_damage: "The Waqf are Religious Endowments that are exempt from taxation."
 waqf_tax_erosion: "Waqf endowments are exempt from taxation, reducing the state's revenue and limiting its ability to fund public works and military campaigns."