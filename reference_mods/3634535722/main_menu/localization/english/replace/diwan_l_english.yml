 STATIC_MODIFIER_NAME_decree_renew_khutba_mod: "Renewed Khuṭba"
 STATIC_MODIFIER_NAME_decree_caravanserai_mod: "Caravanserai Network"
 STATIC_MODIFIER_NAME_decree_shahnameh_mod: "Shāhnāma Patronage"
 STATIC_MODIFIER_NAME_decree_pardon_mod: "Yarligh-i ʿAfv"
 STATIC_MODIFIER_NAME_decree_audit_mod: "Imperial Audit"


 # Units
 a_nomadic_skirmisher_cavalry: "Nomadic Skirmishers"
 a_nomadic_skirmisher_cavalry_desc: "Horse archers from the steppes, relying on speed and range to harass the enemy."
 a_turkoman_light_cavalry: "Turkoman Light Cavalry"
 a_turkoman_light_cavalry_desc: "The backbone of the Turkoman confederations, balancing archery with light melee capability."
 a_qizilbash_cavalry: "Qizilbash Cavalry"
 a_qizilbash_cavalry_desc: "Fanatical warriors of the Safavid order, known for their distinctive red caps and aggressive charges."
 a_amir_cavalry: "Amir Cavalry"
 a_amir_cavalry_desc: "The retinues of the Amirs, emphasizing mobility and shock over heavy armor."
 a_reformed_amir_cavalry: "Reformed Amir Cavalry"
 a_reformed_amir_cavalry_desc: "Modernized tribal cavalry incorporating better equipment while maintaining traditional tactics."

 # Map
 qanat_farmland: "Qanat Farmlands"
 qanat_farmland_desc: "These lands are irrigated using ancient underground qanat systems, allowing for stable agriculture in arid regions."
 seasonal_irrigated: "Seasonal Irrigation"
 seasonal_irrigated_desc: "Irrigation systems that rely on seasonal water flow, supporting moderate agricultural output."
 crumbling_qanat: "Crumbling Qanats"
 crumbling_qanat_desc: "Once fertile qanat-irrigated lands that have fallen into disrepair, now barely supporting subsistence farming."
 
 # Council
 diwan_council: "Majlis-e Mazalim"
 diwan_council_desc: "The Majlis-e Mazalim is not a parliament of peers, but a court of royal justice. Here, the Shadow of God sits in judgment over his servants, hearing the grievances of the oppressed and curbing the tyranny of the powerful. It is through the performance of Absolute Justice (Adl)—not consensus—that the Shah asserts his authority over the Men of the Sword and the Men of the Pen."
 
 sarbadar_council: "Sarbadar Council"
 sarbadar_council_desc: "The Sarbadars convnene to decide the direction of the Revolution. They are a council of the people, representing the interests of the common folk against the tyranny of the powerful. Their decisions are guided by principles of justice and equity, seeking to balance the needs of the many against the ambitions of the few."
 # Issues
 commission_cadastre: "Commission Cadastre"
 commission_cadastre_desc: "The Diwan demands a new survey of taxable lands to update the Deftar and reduce local graft."
 expand_the_secretariat: "Expand the Secretariat"
 expand_the_secretariat_desc: "Hiring more scribes will increase our administrative capacity, though the Nobles fear the growing reach of the pen."
 audit_iqta_holders: "Audit Iqta Holders"
 audit_iqta_holders_desc: "Many Amirs are withholding revenue. A forceful audit will recover funds but anger the military aristocracy."
 a_frontier_amir_cavalry: "Frontier Amir Cavalry"
 a_frontier_amir_cavalry_desc: "Cavalry units raised from the frontier regions, skilled in border skirmishes and rapid response."

 # Amirs Events
 amirs_estate_events.1.title: "Demands of the Sword"
 amirs_estate_events.1.desc: "The Amirs are becoming increasingly vocal about their role in the state. They argue that as the defenders of the realm, they alone should be entrusted with leading our armies into battle."
 amirs_estate_events.1.a: "Entrust the command to them."
 amirs_estate_events.1.b: "The Shah chooses his own generals."
 amirs_estate_events.2.title: "Contented Amirs"
 amirs_estate_events.2.desc: "The tribal leaders are pleased with the current state of affairs. Our military traditions are respected, and the Amirs feel their place in the sun is secure."
 amirs_estate_events.2.a: "A strong army is the foundation of the state."
 amirs_estate_events.3.title: "Amir Encroachment"
 amirs_estate_events.3.desc: "One of our frontier Amirs has begun exercising authority beyond his mandate in a local province, asserting his right to collect dues and administer justice directly."
 amirs_estate_events.3.a: "Allow the local warrior his due."
 amirs_estate_events.3.b: "The central authority must be maintained."

 # Diwan Events
 diwan_estate_events.1.title: "The Supremacy of the Pen"
 diwan_estate_events.1.desc: "The scribes of the Diwan are demanding more influence over the state's appointments. They argue that merit and mastery of the registers should be the only criteria for high office."
 diwan_estate_events.1.a: "Efficiency is the lifeblood of the state."
 diwan_estate_events.1.b: "We will not be ruled by clerks."
 diwan_estate_events.2.title: "A Harmonious Bureaucracy"
 diwan_estate_events.2.desc: "The Diwan is functioning with remarkable efficiency. Our records are clear, our scribes are loyal, and the machinery of state hums with precision."
 diwan_estate_events.2.a: "Long live the masters of the Deftar."
 diwan_estate_events.3.title: "Local Audit"
 diwan_estate_events.3.desc: "Our provincial auditors have identified significant discrepancies in a local jurisdiction. They propose a rigorous reassessment of the land and its yields to ensure the Shah receives his full due."
 diwan_estate_events.3.a: "Let the audit proceed."
 diwan_estate_events.3.b: "Avoid unnecessary friction."
 
