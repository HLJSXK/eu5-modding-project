 # Modifiers
 AUTO_MODIFIER_NAME_diwan_base_values: "Persianate Estate Base Influence" 
 consolidate_the_diwan_tt: "Integrates the Province immediately by incorporating existing Ilkhanate-era land registers and local legal ammendments and privileges into our own Daftar."
