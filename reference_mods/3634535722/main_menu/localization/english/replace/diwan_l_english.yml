 AUTO_MODIFIER_DESC_diwan_persian_court_language: "The Diwan's use of Persian as the court language reinforces its cultural prestige and administrative cohesion, but may alienate non-Persian subjects."
 AUTO_MODIFIER_NAME_amirs_war_auto_modifier: "Amirs With a Mission"
 AUTO_MODIFIER_DESC_amirs_war_auto_modifier: "The Amirs estate thrives on war — the loot, the glory, the tribal prestige. They are more satisfied when the realm is at war"
 AUTO_MODIFIER_NAME_ghazi_lord_has_yasa_law: "Ghazi Lord with Yasa Law"
 AUTO_MODIFIER_DESC_ghazi_lord_has_yasa_law: "A Ghazi lord who has adopted the Yasa code of law, a contradiction that makes a mockery of his claim to be a champion of Islam and justice. The very word law flinches at the association with the Yasa, and the Ghazi's legitimacy suffers accordingly."
 # Privileges (Diwan)
 diwan_land_registers: "Land Registers"
 diwan_land_registers_desc: "Detailed surveys of land ownership ensure efficient taxation."
 diwan_tax_farming: "Tax Farming"
 diwan_tax_farming_desc: "Auctioning the right to collect taxes guarantees immediate revenue but empowers local administrators."
 diwan_merit_examinations: "Merit Examinations"
 diwan_merit_examinations_desc: "Recruiting officials based on knowledge rather than birth improves competence."
 diwan_provincial_auditors: "Provincial Auditors"
 diwan_provincial_auditors_desc: "Direct oversight of provincial governors reduces corruption."
 diwan_office_sinecures: "Office Sinecures"
 diwan_office_sinecures_desc: "Granting lifetime appointments ensures loyalty but hinders removal of the incompetent."
 diwan_state_monopolies: "State Monopolies"
 diwan_state_monopolies_desc: "State control over key industries secures revenue but stifles private enterprise."
 diwan_persian_bureaucratic_tradition: "Persian Bureaucratic Tradition"
 diwan_persian_bureaucratic_tradition_desc: "The ancient traditions of statecraft ensure a highly centralized and stable administration."
 diwan_waqf_administration: "Waqf Administration"
 diwan_waqf_administration_desc: "State oversight of religious endowments ensures revenue is not lost to clerical corruption."
 # diwan_ghulam_administration loc moved to eranzamin_matters_l_english.yml
 # (privilege now lives in 08_ghulam_privileges.txt as "Dīwān al-ʿArḍ")
 diwan_royal_workshops: "Royal Workshops (Karkhana)"
 diwan_royal_workshops_desc: "State-run manufactories produce high-quality goods for the court and export, bypassing the guilds."
 diwan_collective_responsibility: "Collective Responsibility"
 diwan_collective_responsibility_desc: "The state holds the entire village responsible for tax quotas, bypassing local intermediaries. It increases revenue and central authority but alienates the peasantry and entrenched nobility."
 boneh_system: "Boneh System"
 boneh_system_desc: "The village acts as a collective fiscal unit, distributing land and tax burdens internally. This ensures reliable revenue for the Iqta holders but limits the state's direct control."
 turk_vs_tazik: "Turk vs Tazik"
 turk_vs_tazik_desc: "The eternal struggle between the Men of the Pen (Tazik bureaucracy) and the Men of the Sword (Turkic military aristocracy)."
 turk_vs_tazik_left: "Turkic Military Tradition"
 turk_vs_tazik_right: "Tazik Administration"
 tazik_focus: "Tazik Dominance"
 turk_focus: "Turkic Dominance"
 # Privileges (Amirs)
 amirs_tuyul_grants: "Tuyul Grants"
 amirs_tuyul_grants_desc: "Land assignments that combine fiscal rights with administrative jurisdiction, effectively creating a military fiefdom."
 amirs_tribal_hosts: "Tribal Hosts (Yurt)"
 amirs_tribal_hosts_desc: "Recognizing the grazing rights of the military tribes ensures a steady supply of cavalry but damages settled agriculture."
 amirs_hereditary_governorship: "Hereditary Governorship"
 amirs_hereditary_governorship_desc: "Allowing the Amirs to pass their governorships to their sons ensures loyalty but erodes central authority."
 amirs_right_of_plunder: "Right of Plunder"
 amirs_right_of_plunder_desc: "The army feeds itself on war. Formalizing the distribution of loot keeps the tribes happy."
 amirs_fortify_borders: "Fortify Borders"
 amirs_fortify_borders_desc: "The Amirs demand resources to strengthen the frontier fortresses against nomadic incursions."
 amirs_expand_cavalry: "Expand Cavalry"
 amirs_expand_cavalry_desc: "The tribal chiefs call for an expansion of the cavalry corps."
 amirs_hereditary_tuyul: "Hereditary Tuyul"
 amirs_hereditary_tuyul_desc: "Assignments drift toward property - the cycle of centralization and decay."
 amirs_frontier_autonomy: "Frontier Governorship"
 amirs_frontier_autonomy_desc: "Autonomous military administration on the borders, like Sipahis holding the line."
 amirs_open_muster_rolls: "The Open Muster Rolls"
 amirs_open_muster_rolls_desc: "The corps takes any creed: military men of the protected faiths enter the service rolls as cavalry of the realm, holding revocable assignments like any amīr — not as hereditary lords outside the system. The recruitment pool widens beyond anything the ʿulamāʾ can approve of."
 amirs_personal_retinues: "Right to Retinue"
 amirs_personal_retinues_desc: "Personal military households loyal to the Amir, not the Shah."
 amirs_audit_exemption: "Exemption from Audit"
 amirs_audit_exemption_desc: "Direct resistance to Diwan oversight, hiding revenue from the central coffers."
 amirs_conquest_assignments: "Revenue from Conquest"
 amirs_conquest_assignments_desc: "New conquests are assigned directly to Amirs to administer, speeding integration but losing revenue."
 amirs_tribal_autonomy_rights: "Tribal Autonomy Rights"
 amirs_tribal_autonomy_rights_desc: "Guaranteed protection for the nomadic way of life, preventing settlement or conversion."

 # Agendas
 pa_diwan_grant_privilege: "Grant Diwan Privilege"
 pa_diwan_grant_privilege_desc: "The Bureaucracy demands formal recognition of its rights."
 pa_diwan_centralize: "Centralize Administration"
 pa_diwan_centralize_desc: "The Diwan demands we tighten control over the provinces."
 pa_diwan_money: "Fund the Secretariat"
 pa_diwan_money_desc: "The scribes are unpaid and restless."
 pa_diwan_contain_banking: "Contain Banking"
 pa_diwan_contain_banking_desc: "The rise of private finance threatens the state's fiscal sovereignty."
 pa_diwan_free_subjects: "Demand Free Subjects"
 pa_diwan_free_subjects_desc: "Serfdom inefficiently locks labor away from the tax collector."
 pa_diwan_build_counting_house: "Build Counting House"
 pa_diwan_build_counting_house_desc: "We need better facilities to track local revenue."
 pa_diwan_build_chancery: "Build Chancery"
 pa_diwan_build_chancery_desc: "The central administration requires a dedicated headquarters."
 pa_diwan_build_customs_house: "Build Customs House"
 pa_diwan_build_customs_house_desc: "Trade flows must be monitored and taxed."
 pa_amirs_grant_privilege: "Grant Amir Privilege"
 pa_amirs_grant_privilege_desc: "The Amirs demand formal recognition of their rights."
 pa_amirs_decentralize: "Decentralize Authority"
 pa_amirs_decentralize_desc: "The Amirs resist the encroachments of the central Diwan."
 pa_amirs_loot: "Right of Plunder"
 pa_amirs_loot_desc: "The tribes demand the right to keep the spoils of war."
 
 # Mazalim Agendas (Amirs Cases)
 pa_amirs_case_land_seizure: "Case: Seizure of Peasant Holdings"
 pa_amirs_case_land_seizure_desc: "Amirs are converting tax-paying farms into personal iqta."
 pa_amirs_case_caravan_theft: "Case: Illegal Caravan Exactions"
 pa_amirs_case_caravan_theft_desc: "Military governors demanding protection fees beyond tariffs."
 pa_amirs_case_enslavement: "Case: Enslavement of Free Subjects"
 pa_amirs_case_enslavement_desc: "Commanders selling free Muslims into slavery."
 pa_amirs_case_price_fixing: "Case: Refusal to Pay Market Prices"
 pa_amirs_case_price_fixing_desc: "Requisitioning goods at below-market rates."
 pa_amirs_case_urban_garrison: "Case: Tribal Horsemen in Cities"
 pa_amirs_case_urban_garrison_desc: "Tribal garrisons harassing urban merchants."
 
 # Mazalim Agendas (Diwan Cases)
 pa_diwan_case_embezzlement: "Case: Embezzlement of Provincial Revenues"
 pa_diwan_case_embezzlement_desc: "Tax collectors retaining portions of assessed revenues."
 pa_diwan_case_sale_of_offices: "Case: Sale of Offices"
 pa_diwan_case_sale_of_offices_desc: "High officials selling appointments to incompetent bidders."
 pa_diwan_case_falsified_surveys: "Case: Falsified Cadastral Surveys"
 pa_diwan_case_falsified_surveys_desc: "Assessors inflating productive capacity to over-tax villages."
 pa_diwan_case_inflated_costs: "Case: Inflated Public Works Costs"
 pa_diwan_case_inflated_costs_desc: "Officials skimming from infrastructure budgets."
 pa_diwan_case_assessment_bribes: "Case: Accepting Assessment Bribes"
 pa_diwan_case_assessment_bribes_desc: "Officials reducing assessments for bribes."
 pa_diwan_case_fictional_positions: "Case: Creation of Fictional Positions"
 pa_diwan_case_fictional_positions_desc: "Inventing sinecures for relatives."

 # Mazalim Agendas (Clergy Cases)
 pa_clergy_case_illegal_waqf: "Case: Illegal Waqf Expansion"
 pa_clergy_case_illegal_waqf_desc: "Religious foundations claiming productive lands as tax-exempt."
 pa_clergy_case_judicial_bribery: "Case: Judicial Bribery"
 pa_clergy_case_judicial_bribery_desc: "Qadis accepting payment to rule in favor of the wealthy."
 pa_clergy_case_grain_hoarding: "Case: Grain Hoarding in Trusts"
 pa_clergy_case_grain_hoarding_desc: "Waqf administrators stockpiling 'charity' grain to inflate prices."
 pa_clergy_case_false_heresy: "Case: False Heresy Accusations"
 pa_clergy_case_false_heresy_desc: "Declaring rivals heretics to confiscate property."
 pa_clergy_case_excessive_fees: "Case: Excessive Legal Fees"
 pa_clergy_case_excessive_fees_desc: "Charging exorbitant rates for marriage and contracts."
 pa_clergy_case_criminal_sanctuary: "Case: Sanctuary for Criminals"
 pa_clergy_case_criminal_sanctuary_desc: "Sheltering tax evaders and fugitives."

 # Mazalim Agendas (Burgher Cases)
 pa_burghers_case_price_gouging: "Case: Price Gouging"
 pa_burghers_case_price_gouging_desc: "Hoarding grain during shortages."
 pa_burghers_case_adulteration: "Case: Adulteration of Goods"
 pa_burghers_case_adulteration_desc: "Mixing sand with grain and base metals with coins."
 pa_burghers_case_usury: "Case: Usurious Lending"
 pa_burghers_case_usury_desc: "Charging excessive interest and seizing children."
 pa_burghers_case_customs: "Case: Customs Evasion"
 pa_burghers_case_customs_desc: "Smuggling and bribing officials to avoid tariffs."
 pa_burghers_case_monopoly: "Case: Monopolistic Practices"
 pa_burghers_case_monopoly_desc: "Preventing competitors from trading."
 pa_burghers_case_counterfeiting: "Case: Counterfeiting Royal Seals"
 pa_burghers_case_counterfeiting_desc: "Forging documents to avoid taxes."

 # Mazalim Agendas (Peasant Cases)
 pa_peasants_case_tax_evasion: "Case: Village Tax Evasion"
 pa_peasants_case_tax_evasion_desc: "Villages concealing harvests."
 pa_peasants_case_irrigation_damage: "Case: Irrigation Damage"
 pa_peasants_case_irrigation_damage_desc: "Upstream villages damaging qanats."
 pa_peasants_case_squatting: "Case: Squatting on State Land"
 pa_peasants_case_squatting_desc: "Farming land without authorization."
 pa_peasants_case_banditry: "Case: Banditry"
 pa_peasants_case_banditry_desc: "Peasants turning to brigandage."
 
 # Mazalim Decrees (Issues)
 decree_centralize_administration: "Decree: Centralization of Administration"
 decree_centralize_administration_desc: "The Shah commands the tightening of control over all provinces."
 decree_reform_army: "Decree: Reform of the Army"
 decree_reform_army_desc: "The Shah commands the modernization of the military."
 decree_fiscal_overhaul: "Decree: Fiscal Overhaul"
 decree_fiscal_overhaul_desc: "The Shah commands a rigorous audit of the treasury."
 decree_infrastructure_expansion: "Decree: Infrastructure Expansion"
 decree_infrastructure_expansion_desc: "The Shah commands the building of roads and caravanserais."
 decree_royal_justice: "Decree: Royal Justice"
 decree_royal_justice_desc: "The Shah commands the redress of all grievances."
 decree_royal_progress: "Decree: Royal Progress"
 decree_royal_progress_desc: "The Shadow of God moves between his capitals with the ordu — the Sasanian eshteghāl, the Mongol moveable court, the Timurid itinerary. Subjects see him; petitions are heard on the road; the throne's presence is felt in the provinces."
 decree_renew_the_khutba: "Decree: Renew the Khuṭba"
 decree_renew_the_khutba_desc: "The Friday sermon is renewed in the Shah's name at every minbar of the realm. The Islamic act of legitimation par excellence — the ʿulamāʾ are confirmed in their place, and the throne in the name of which they preach."
 decree_caravanserai_network: "Decree: Network of Caravanserais"
 decree_caravanserai_network_desc: "Royal caravanserais are commissioned along the great roads — Khorasan to Fars, Tabriz to Herat, Isfahan to Hormuz. The Ilkhanid yam and the Safavid chāpārkhāna in their state form: infrastructure of commerce, of pilgrimage, and of surveillance."
 decree_sponsor_shahnameh: "Decree: Patronage of the Shāhnāma"
 decree_sponsor_shahnameh_desc: "Poets are stipended, illuminators commissioned, court chroniclers endowed. A great Shāhnāma is copied, painted, and presented; the dīvāns of the court poets are gathered. The shāh becomes patron of the Persianate high tradition, and the chancery's idiom is raised to state policy."
 decree_yarligh_of_pardon: "Decree: Yarligh-i ʿAfv"
 decree_yarligh_of_pardon_desc: "The throne issues the ritual pardon — prisoners released, fines remitted, sentences commuted. A Mongol chancery form turned to Persianate sovereign mercy: the Shadow of God dispensing clemency in the manner of the just king."
 decree_imperial_audit: "Decree: Imperial Audit (Istimsāḥ)"
 decree_imperial_audit_desc: "The mustawfī al-mamālik is dispatched into the provinces to audit the governors' books. The Diwan's signature instrument: revenue is recovered, the registers are corrected, and the amirs are reminded who keeps the records of the realm."
 purge_illegal_waqf: "Decree: Reclaim the Illegal Waqf"
 purge_illegal_waqf_desc: "The qāḍīs are set to comb the deeds, and the endowments that shelter the wealth of the living behind the names of the dead are dissolved — a fifth of the realm's waqf clawed back into taxable hands. The dead hand loosens. Possible only while the crown keeps the right of muṣādara and no charter has made the endowments inviolable: once inviolability is granted, even this is foreclosed."
