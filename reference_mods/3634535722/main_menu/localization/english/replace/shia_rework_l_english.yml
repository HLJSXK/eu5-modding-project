 # The khurūj in arms (tariqa.2.b rework, reforms, coronation)
 tariqa_khuruj_muster_tt: "Every #bold five#! risen lodges muster #bold two regiments#! of the devotee army at the shrine-seat. The order becomes an #bold army#! — landless, at war with its whole neighborhood — and will not be a settled state again until it takes a great city and crowns its pir."
 khuruj_rising_reform: "The Khurūj"
 khuruj_rising_reform_desc: "The rising in arms. The order has poured itself out of the lodges and into the field: an army of sworn devotees who eat little, march far, and believe the age itself fights beside them. Every town the brethren ever preached in holds bread for the column. It cannot last — a rising is not a state, and every month without a crown bleeds the claim — but while it lasts, nothing in Erānzamīn charges like it."
 crowned_murshid_reform: "The Crowned Murshid"
 crowned_murshid_reform_desc: "The pir, crowned. The disciple owes the master obedience; the master owes the disciple the Truth; and the master now sits a throne, so the army is a brotherhood and the kingdom is an order writ large. It holds only while the age itself reads mystically — let the jurists claw the schools back and the crown loses the Path, keeping merely the throne."
 tariqa.6.title: "The Khuṭba of the Twelve"
 tariqa.6.desc: "The city has opened its gates and the murīds fill it like water filling a cistern — bazaars shuttered, garrison fled, the great families waiting behind their doors to learn what has conquered them.\n\nOn Friday the young pir rides to the congregational mosque. He climbs the pulpit of a metropolis that has heard the khuṭba read for caliphs, for sultans, for il-khans — and has it read in the names of the Twelve Imams. To the packed and silent hall he says only this: that the recitation is changed, and whoever objects may look to the sword.\n\nNo one objects. Outside, the murīds are weeping and firing their bows into the sky. What entered the city was an order. What comes down from the pulpit is a king."
 tariqa.6.a: "The vow has a throne now. God save the Murshid."
