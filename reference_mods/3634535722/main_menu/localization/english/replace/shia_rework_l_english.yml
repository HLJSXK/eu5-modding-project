 # --- Modifier types (boolean unlocks; MODIFIER_TYPE_NAME_ prefix) ---
 MODIFIER_TYPE_NAME_allows_tariqa_buildings: "Can Plant Tariqa Lodges"
 MODIFIER_TYPE_NAME_allows_tariqa_tribal_devotions: "Can Raise Tribal Devotion Circles"
 MODIFIER_TYPE_NAME_allows_tariqa_rural_zawiyas: "Can Raise Rural Zāwiyas"
 MODIFIER_TYPE_NAME_allows_tariqa_urban_waqfs: "Can Endow Urban Waqfs"

 # --- Tariqa orders (building-countries) ---
 tariqa_order: "Tariqa Order"
 tariqa_order_desc: "This polity is not a realm but an order: a shaykh's house, its shrine-seat, and a web of lodges planted in other princes' cities. Its khalīfas carry allegiance across every border; its wealth is reverence; its power is reach. Princes host its lodges gladly — for now."
 tariqa_khanaqah: "Tariqa Lodge"
 tariqa_khanaqah_desc: "A lodge of the order in a foreign city — resident dervishes, a kitchen, a tomb or two, and a khalīfa who answers to the shrine-seat, not the governor. The order's reach is measured in lodges; whatever the order becomes, the lodges become with it."
 tariqa_khanaqah_maintenance: "Lodge Maintenance"
 grand_tariqa_khanaqah: "Grand Khānaqāh"
 grand_tariqa_khanaqah_desc: "The order's great lodge in a patron's capital — endowed by the throne itself, and repaying it in baraka: the shaykh's standing blessing on the dynasty, read from the minbar every Friday. The richest single house of the network."

 # --- The three bases (reforms) ---
 tariqa_tribal_base: "The Tribal Base"
 tariqa_tribal_base_desc: "The order sends its khalīfas to the pastoral confederations: devotion circles among the camps, dhikr at the wells, marriages and arbitrations that bind the oymaqs to the pīr. No swords yet — but this is the road that ends, if it ends anywhere, at a red-hatted army."
 tariqa_popular_base: "The Popular Base"
 tariqa_popular_base_desc: "The order roots itself in the villages: the zāwiya as shrine, granary of last resort, and court of disputes. The peasants love it — and a network the peasants love is a network no landlord can safely strike. Ask Kiyā Afrāsiyāb of Māzandarān, who struck too late."
 tariqa_urban_base: "The Urban Base"
 tariqa_urban_base_desc: "The order goes to court: endowed madrasas, litterateurs, copyists, and money. No swords at all — the endgame of this road is not a rising but a conversion: the throne itself, won from within."

 # --- Chapter buildings (the respectable tier: unarmed, Islamizing) ---
 tariqa_tribal_devotions: "Tribal Devotion Circle"
 tariqa_tribal_devotions_desc: "The khalīfa's circle among the pastoral tents: dhikr, wrestling, marriages, and the quiet arbitration of clan feuds. The men who gather here own swords, as all tribesmen do — but they have not been asked for them. Yet."
 tariqa_tribal_devotions_maintenance: "Devotion Circle Upkeep"
 tariqa_rural_zawiya: "Rural Zāwiya"
 tariqa_rural_zawiya_desc: "The village lodge: a shrine, a kitchen that never closes, a shaykh who settles disputes the qāḍī never hears of. The countryside's loyalty flows quietly toward the order — and away from everyone else."
 tariqa_rural_zawiya_maintenance: "Zāwiya Upkeep"
 tariqa_urban_waqf: "Endowed Waqf"
 tariqa_urban_waqf_desc: "The order's endowment in a great city — madrasa, scriptorium, and rents. It produces scholars, poems, and money, and its friends sit closer to the host's throne every year."
 tariqa_urban_waqf_maintenance: "Waqf Upkeep"

 # --- The radical lodge (post-declaration) ---
 radical_khanaqah: "Ghulāt Khānaqāh"
 radical_khanaqah_desc: "The lodge after the recitation changed: the same kitchen, the same tomb, and a quarter that now openly recites for the murshid against every pulpit in the city. It converts, fast, and the host knows exactly what it is."
 radical_khanaqah_maintenance: "Ghulāt Lodge Maintenance"

 # --- The militant tier (Two Pirs completion: ten times the men) ---
 qizilbash_lodge: "Qizilbash Lodge"
 qizilbash_lodge_desc: "The devotion circle with the tāj on its head: oymaq by oymaq the disciples are mustered, armed, and sworn to the murshid unto death. The census of these lodges is the khurūj itself — one sword-column per lodge when the pīr proclaims."
 qizilbash_lodge_maintenance: "Qizilbash Upkeep"
 dervish_takiya: "Dervish Takiya"
 dervish_takiya_desc: "The zāwiya militarized: the granary is also an armory now, and the wandering dervishes who lodge there are sworn men between wars. The village fed by the order will fight for the order."
 dervish_takiya_maintenance: "Takiya Upkeep"
 futuwwa_brotherhood: "Futuwwa Brotherhood"
 futuwwa_brotherhood_desc: "The waqf's money buys the quarter's young men: the futuwwa sworn to the murshid, the zurkhāna as drill-yard, the guilds as regiments-in-waiting. The richest militia in the city — and the best-read."
 futuwwa_brotherhood_maintenance: "Brotherhood Upkeep"

 # --- ilkhanate_flavor.1 option H (the order's answer) ---
 ilkhanate_flavor.1.h: "We claim no throne. Every man who does will need our blessing — and blessings are not free."

 # --- The Two Pirs (disaster + tariqa.1) ---
 two_pirs: "The Two Pirs"
 two_pirs_desc: "The prayer rug is contested: the quietist establishment of the shrine holds the lodges and the ledgers, but a militant claimant holds the young men of the outer circles, who did not swear themselves to an order so that it could stay respectable. If the recitation changes, it does not end there — it BEGINS there: the passage out of the sunna is years of forged genealogies, seeded quarters, and unveiled lodges, paid for month by month out of the order's own standing. Junayd or Jaʿfar; the manifestation or the rent-rolls."
 two_pirs_census_tt: "The order has at least five chapters of its base (devotion circles, zawiyas, or waqfs) — enough of a network to be worth fighting over."
 two_pirs_can_end_tt: "The succession is resolved: the passage completed, the quietist upheld, or the order settled on land."
 two_pirs_chapters_tt: "Twenty chapters of the order's base stand across the lands."
 two_pirs_area_share_tt: "At least 15% of the shrine-seat's wider area recites with us."
 two_pirs_aspects_tt: "The confession is claimed: the Twelve Imams and the Manifestation, or the Zaydi Imamate and Qiyām bi'l-Sayf."
 TWO_PIRS_CHAPTERS_TRACK: "The Chapter Census"
 TWO_PIRS_PROVINCE_TRACK: "The Shrine-Seat Province Recites"
 TWO_PIRS_AREA_TRACK: "The Wider Area Recites"
 TWO_PIRS_CHAPTERS_TT: "Chapters of the order's base — devotion circles, zāwiyas, or waqfs — standing anywhere in the world.\n\nTen chapters license the Claim of the Age; twenty are required to complete the passage. Raise more with Send Forth the Khalifas, or build them by hand."
 TWO_PIRS_PROVINCE_TT: "'Recites with us': the share of the shrine-seat province's population that is Shia — the people of the order's own home country, won to the confession.\n\nHalf the province must recite before the Claim of the Age (the midpoint) can be made. Raise it with Plant the Seed and by unveiling lodges (Proclaim the Mystery) — unveiled lodges convert far faster."
 TWO_PIRS_AREA_TT: "The share of the shrine-seat's wider area — the whole surrounding country, not just the home province — that is Shia.\n\nFifteen percent must recite for the passage to complete. Deep penetration at home comes first (the province, for the midpoint); breadth comes second."
 tariqa.1.title: "The Two Pirs"
 tariqa.1.desc: "The old pir is contested. In the shrine's inner court sits the establishment's man: learned, landed, beloved of the princes who endow us — and certain that an order which draws swords will lose everything three generations built. In the guest-house sits the claimant: young, burning, back from the outer lodges where the devotees already call him the Perfect Guide — and certain that an order which only takes rents has already died.\n\nThe lodges are waiting to hear whose name to recite. The princes who host our houses are waiting too — and their patience is part of the inheritance."
 tariqa.1.a: "The young men are right. Let the recitation change."
 tariqa.1.b: "The order is the work of generations. The claimant can burn somewhere else."
 tariqa.1.c: "Enough of networks. Petition for land, and be a small, real thing."
 tariqa_radicalizing_process_tt: "The passage begins, not ends: the order is Shia now, but the branch is unclaimed, the genealogy unforged, the network still veiled — and the order's legitimacy bleeds every month until the manifestation is complete. The disaster panel holds the ladder: chapters, seeds, the nasab, the midpoint claim, the aspect pair."
 STATIC_MODIFIER_NAME_tariqa_militant_zeal: "Militant Zeal"
 STATIC_MODIFIER_DESC_tariqa_militant_zeal: "The militant claimant holds the prayer rug: the order is now a movement wearing an order's clothes — feared abroad, aflame within."
 STATIC_MODIFIER_NAME_tariqa_militant_exile: "The Exile's Wound"
 STATIC_MODIFIER_DESC_tariqa_militant_exile: "The militant wing rode away with its young men. The order is respectable, and smaller."
 STATIC_MODIFIER_NAME_sayyid_nasab_mod: "House of the Prophet"
 STATIC_MODIFIER_DESC_sayyid_nasab_mod: "The genealogy is in circulation: in every lodge's recitation the murshid's line now runs to ʿAlī and Fāṭima. The copyists were paid; the disciples believe; the claim is licensed."
 STATIC_MODIFIER_NAME_tariqa_proofs_mod: "The Proofs Multiply"
 STATIC_MODIFIER_DESC_tariqa_proofs_mod: "Half the shrine-seat's province recites, ten chapters stand, and the roads carry the murshid's name further every month. What the passage costs in standing, the proofs now partly repay."

 # --- Two Pirs completion (tariqa.2) + banners (tariqa.3) ---
 tariqa.2.title: "The Manifestation"
 tariqa.2.desc: "It is done. Twenty chapters stand, the shrine-seat's country recites, the genealogy is believed by everyone who matters and doubted only in private, and the claim has been made in the open with no one able to answer it. The order that existed a decade ago — respectable, endowed, welcome at court — is gone. In its place stands something no prince has a word for yet: a confession with a network, a treasury, and a census of sworn men that grows every Friday.\n\nThe khalīfas are asking one question, from every lodge at once: now?"
 tariqa.2.a: "Now the circles become musters. Sharpen everything — and wait for OUR hour."
 tariqa.2.b: "The hour is THIS one. Every lodge, every province, every sword: rise."
 tariqa_militant_unlock_tt: "The militant tier unlocks: every chapter of the base upgrades to its armed twin — ten times the sworn men — and the last veiled lodges recite openly. The khurūj, the rising, or the court: the endgames are open, on your schedule."
 tariqa_rise_now_tt: "The rising, today: every militant lodge's province comes over to the order, which lands as a state with sworn columns mustered at the shrine-seat — and half the war chest a prepared khurūj would have gathered."
 STATIC_MODIFIER_NAME_tariqa_manifest_mod: "The Manifest Order"
 STATIC_MODIFIER_DESC_tariqa_manifest_mod: "A confession with a census: sworn devotees muster where a prince would get grumbling tenants."
 tariqa.3.title: "The Banners Seek a Pir"
 tariqa.3.desc: "Word from the lodges: a rising. Shia men under arms have thrown out their governor and proclaimed — and having proclaimed, they have looked around for someone worthy of the proclamation. They have settled on us. Their riders are at the shrine-seat's gate with an offer that is also a question: take command of the banners, or watch them die.\n\nThe khalīfas are divided. If we take them, their war becomes ours — against a state we may not be ready to fight. If we refuse, the Shia die alone while the murshid's men watch from the lodge windows — and every quarter that recites for us will remember which we chose."
 tariqa.3.a: "The banners are ours. Their war is ours. God is sufficient for us."
 tariqa.3.b: "Not yet. The proofs are not complete — and martyrs keep."
 tariqa_banners_war_tt: "The rebels' lands and men come over to the order, which lands as a state — inheriting the rising's war, ready or not."

 # --- Endgame actions ---
 proclaim_khuruj: "Proclaim the Khuruj"
 proclaim_khuruj_desc: "The rising. The qizilbash lodges declare for the pīr, their lands come over, and the sworn cavalry musters at the shrine-seat. The order ends; the dynasty begins."
 rise_against_patron: "Rise Against the Patron"
 rise_against_patron_desc: "The patron struck the zawiyas — too late. The villages rise with their lodges, and the order inherits what the patron could not hold. Ask Kiyā Afrāsiyāb how this ends."
 rise_against_patron_select: "Choose the patron"
 rise_against_patron_no_target: "No realm hosts enough of our zawiyas to rise against."
 capture_the_court: "Capture the Court"
 capture_the_court_desc: "No swords at all: the endowments, the poets, and the murshid's men placed near the prince — until the prince himself recites. The throne converts; the order becomes its church."
 capture_the_court_select: "Choose the court"
 capture_the_court_no_target: "No court hosts enough of our endowments to be ripe."
 PRICE_capture_the_court: "The Price of a Throne's Soul"

 # --- Network actions ---
 dispatch_dervish_preacher: "Dispatch a Preacher"
 dispatch_dervish_preacher_desc: "Send one of the sworn brethren down the caravan roads to plant a cell in a chosen city. The network answers only to the pulpit: the Shaykhī wing must hold real power to command it — and every preacher sent abroad is a man of the wing gone from home. Spread the revolution and you hollow it."
 dispatch_preacher_select_city: "Choose the city"
 dispatch_preacher_no_cities: "No suitable foreign city — the cell needs a Muslim quarter and an unclaimed pulpit."
 patronize_tariqa_order: "Patronize An Order"
 patronize_tariqa_order_desc: "Endow the order whose lodge stands in your city. The gold flows to the shrine-seat; the shaykh's blessing, read from the minbar, flows back — and in this age of unowned thrones, a blessing is worth more than a garrison."
 patronize_order_select: "Choose the order"
 patronize_order_no_orders: "No order keeps a lodge in our realm."
 PRICE_patronize_tariqa_order: "Endowment"
 patronize_offer_tt: "The offer travels to the shrine-seat. The order will answer — and an order that hates this throne may answer publicly."
 tariqa.4.title: "The Patron's Endowment"
 tariqa.4.desc: "A throne has sent to the shrine-seat: deeds of endowment, a purse that would keep the langar burning for six years, and a petition wrapped inside the gift — that the shaykh's blessing on this dynasty be read from the minbar, every Friday, in every quarter where the order's name carries.\n\nThe khalīfas know exactly what this is. It is how the order got rich, and how every order gets rich: reverence flowing one way, legitimacy the other. The only question a pīr ever asks of such a gift is whether this particular hand is one the order can afford to be seen kissing."
 tariqa.4.a: "The blessing is given. Let the minbars say his name kindly."
 tariqa.4.b: "Return the purse. Tell every lodge WHY."

 # --- The rebel fork (tariqa.5, D.3) ---
 tariqa.5.title: "In Whose Name Is the Coin Minted"
 tariqa.5.desc: "The governor is dead or fled, the garrison has changed its shout, and the men who did it are standing in the mint asking the only question a rising cannot postpone. A state must strike coin, and coin bears a name.\n\nThe craftsmen and the sworn brethren know the Sabzavār answer: no king at all — the coin struck for the Hidden Imām, the state held in trust by His deputies, a commonwealth with a gallows where the throne should be. And the dervishes down from the hills know the other answer, older than any of us and newer than tomorrow: that the waiting is OVER, that the man who led us was led himself, and that the age has a Lord who is presently cleaning his sword.\n\nThe die-cutter is waiting."
 tariqa.5.a: "No name but the Imām's. Let there be a commonwealth, and let it keep a gallows."
 tariqa.5.b: "The waiting is over. Strike his name; the age belongs to him."

 # --- The radicalization ladder (Two Pirs disaster actions) ---
 send_forth_the_khalifas: "Send Forth the Khalifas"
 send_forth_the_khalifas_desc: "A khalīfa down the roads with letters, men, and an endowment: raise a new chapter of the base in a chosen quarter. Twenty chapters complete the passage; ten license the midpoint claim."
 khalifas_select_location: "Choose the quarter"
 khalifas_no_locations: "No suitable quarter — the chapter needs Muslims and an unclaimed courtyard."
 PRICE_send_forth_the_khalifas: "The Khalifa's Purse"
 plant_the_seed: "Plant the Seed"
 plant_the_seed_desc: "The dāʿī's work: a safe house, a wedding, three converted families in a chosen quarter. Small — and it compounds: the shrine-seat's province must recite before the age can be claimed."
 seed_select_location: "Choose the quarter"
 seed_no_locations: "No quarter within reach holds Muslims who do not already recite."
 PRICE_plant_the_seed: "The Daʿi's Purse"
 proclaim_the_mystery: "Proclaim the Mystery"
 proclaim_the_mystery_desc: "Unveil a lodge ahead of its time: the quarter's khānaqāh drops the taqiyya and recites openly for the murshid. It converts faster — and every unveiling spends the order's respectability."
 mystery_select_location: "Choose the lodge"
 mystery_no_locations: "No veiled lodge remains to unveil."
 spread_sayyid_genealogy: "Spread the Sayyid Genealogy"
 spread_sayyid_genealogy_desc: "Commission the nasab: genealogists paid, copyists set to work, and the redacted lineage — murshid to Mūsā al-Kāẓim to ʿAlī — circulated through every lodge at once. Without it, no claim to the Imamate is licensed. With it, the order is a house of the Prophet, and always was."
 PRICE_spread_sayyid_genealogy: "The Copyists' Bill"
 sayyid_genealogy_tt: "The genealogy is established: the order may now claim the Manifestation (Twelver road) or Qiyām bi'l-Sayf (Zaydi road) from the religious aspects panel."
 claim_of_the_age: "Claim the Age"
 claim_of_the_age_desc: "Ten chapters stand and half the shrine-seat's province recites: let the claim be made from the minbar. The bleeding of the passage halves, the conversions quicken — and the region's risings now know whose name to proclaim."
 claim_of_the_age_chapters_tt: "At least ten chapters of the order's base stand."
 claim_of_the_age_province_tt: "At least half the shrine-seat's province recites with us."
 known_murshid_tt: "The order is a regionally known murshid: Shia risings in the region will now offer the pīr their banners (a decision, not a gift — their war comes with them)."

 # --- Sufyani takeover (martyrs.4) + modifiers ---
 martyrs.4.title: "The Notables Take the Council"
 martyrs.4.desc: "The ledgers have outlasted the ecstasies. Year by year the best of the brethren went down the roads — to Nishapur, to Rayy, to farther cities whose quarters now listen to our preachers — and year by year the council chamber filled with men who keep accounts, endow madrasas, and wince at the word 'imminent.' Now the Sufyānī notables hold every office that matters, and they are asking, politely, in writing, whether a state must forever be a vow.\n\nThe dervishes who remain are old, or young and unsworn. The white horse is still saddled at the gate twice a day. Fewer men each year stop to watch it."
 martyrs.4.a: "The vow was kept as long as men could keep it. Let there be a sultanate."
 martyrs.4.b: "Saddle the horse. Summon the brethren home. The council will remember what we are."
 STATIC_MODIFIER_NAME_preachers_dispatched_mod: "Preachers Sent Abroad"
 STATIC_MODIFIER_DESC_preachers_dispatched_mod: "The network's best men are planting cells in other princes' cities — and are therefore not at home, holding the wing's place in the council."
 STATIC_MODIFIER_NAME_shaykhi_last_purge_mod: "The Last Purge"
 STATIC_MODIFIER_DESC_shaykhi_last_purge_mod: "The vow renewed in blood: a hollowed dervish wing propped up by terror, devotion, and the memory of the gallows."
 sarbadar_phenomenon_alert: "The Sarbadar Phenomenon spreads"
 sarbadar_phenomenon.1.title: "The Word from Bashtin"
 sarbadar_phenomenon.1.desc: "In Bayhaq, in Khurāsān, the men of a village called Bāshtīn have killed the Mongol tax collector and sworn — 'we would rather see our heads on the gallows than submit' — and the thing has not ended there. A state now stands at Sabzavār with no king, coin struck in the Hidden Imām's name, and an army of sworn dervishes.\n\nThat would be Khurāsān's problem, except for the roads. The brethren of Shaykh Ḥasan Jūrī's network are already moving along them — preachers who arrive with the caravans, find the wrestling-houses and the craft brotherhoods, and leave behind sworn circles that answer to no governor. Merchants repeat the story in every bazaar between Tabriz and Samarqand.\n\nWhere the quarters are restless and the futuwwa is strong, the word will find dry tinder."
 sarbadar_phenomenon.1.a: "Watch the wrestling-houses."

