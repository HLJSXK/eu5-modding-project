l_english:
 # =========================================================
 # SHATTERED RUM — situation rename + Anatolian legitimacy arc
 # =========================================================
 rise_of_the_ottomans: "Shattered Rum"
 rise_of_the_ottomans_desc: "The House of Seljuk has been gone since 1308, and the Ilkhans who kept its corpse in order stopped answering two years ago. What remains is a land of marches. Begs hold their valleys by the sword, ghazis raid the shrinking Roman coast, and in Konya the khutba is read over an empty throne.\n\nEvery beylik in [ShowRegionName('anatolia_region')] runs the same race of muster, tax and subjugation, yet swords alone have never crowned anyone here. Since Köse Dağ, every ruler of this land has needed a warrant: the Ilkhan's diploma, the Caliph's robe, or the name of Seljuk. The frontier begs seek theirs in the ghaza, fighting until Cairo confirms the title. The lords of the interior look to Konya, where the old capital, the old coin and the old registers wait for a hand strong enough to take them up.\n\nWhoever finds no warrant will end as somebody's vassal, and the tents will not mourn him."
 
 # ----- reforms -----
 seljuk_claimant: "Claimant of the Seljuk Inheritance"
 seljuk_claimant_desc: "In 1277 Karamanoğlu Mehmed Beg rode into Konya, raised a pretender over the city, and decreed that his divan would speak Turkish. The city threw him out within the year, and the lesson has been studied in every march since: taking Konya is easy. Keeping what Konya means requires the coin, the roads, and the registers of a working sultanate. Whoever declares for the inheritance will be measured against Kayqubad himself, and every beg in Anatolia will pray to watch him fail."
 sultanate_of_rum: "Sultanate of Rum"
 sultanate_of_rum_desc: "The coin bears your name and the bazaars accept it. The caravans move under your protection, the diwan keeps its registers in Konya as it did under Kayqubad, and the begs who swore to watch you fail have knelt instead. The tombs on the citadel hill have a keeper again. What the House of Seljuk left, your house has taken up."
 
 # ----- disaster -----
 seljuk_inheritance: "The Seljuk Inheritance"
 seljuk_inheritance_desc: "The claim of Konya has been spoken, and the whole of Anatolia now watches to see whether it holds. A sultanate is coin the bazaars trust, roads the caravans trust, and registers kept by a chancery that answers to one man. Until those stand, the claim is a boast, and every month of boasting costs."
 rum_inheritance_not_completed_tt: "The Seljuk Inheritance has not yet run its course"
 rum_inheritance_not_fired_tt: "The Seljuk Inheritance has not yet begun"
 rum_inheritance_end_vindicated_tt: "#G Vindicated#!: complete all #Y 4#! program steps (Proclaim Custody of the Old Capital, Strike the Sikka, Restore the Diwan, Reopen the Trunk Road), keep [legitimacy|e] at #Y 60+#! for a total of #Y 36 months#!, and dominate Anatolia (#Y 60+#! [locations|e] with your capital in Anatolia, OR #Y 3+#! [subjects|e]). Reward: the Sultanate of Rum reform and Kingdom rank."
 rum_inheritance_end_broken_tt: "#R Broken#!: your [legitimacy|e] falls to #R 5#! or below. The claim is stripped and your dynasty may NEVER declare it again."
 rum_inheritance_end_abandoned_tt: "Abandoned: you no longer hold the Claimant of the Seljuk Inheritance reform"
 
 # ----- disaster actions -----
 rum_strike_the_sikka: "Strike the Sikka"
 rum_strike_the_sikka_desc: "Withdraw the Ilkhanid dirhams and strike coin in your own name at Konya, on the old sultanate's weight standard. Every moneychanger in Anatolia will read the inscription before he reads anything else."
 rum_reopen_trunk_road: "Reopen the Trunk Road"
 rum_reopen_trunk_road_desc: "Garrison the great caravanserais between Konya and Sivas, the Sultan Hans that Kayqubad raised a day's ride apart. Merchants paid the old sultans gladly, because a caravan robbed on the trunk road was repaid from the treasury."
 rum_restore_the_diwan: "Restore the Diwan of Rum"
 rum_restore_the_diwan_desc: "Recall the scribes and reopen the registers in the Persian manner of the old chancery. Requires a #Y Regional Diwan#! and #Y two Local Diwans#! standing; costs #R -30#! [legitimacy|e], #R -5#! [stability|e], and one year's income. If your court already keeps a Persian chancery, the scribes need only new orders: #R -10#! [legitimacy|e] and the year's income, nothing more. The begs know exactly what a register means for them."
 
 # ----- situation actions (ghazi road) -----
 endow_chancery_of_rum: "Endow a Chancery"
 endow_chancery_of_rum_desc: "The sword has conquered more than the tent can govern. Hire the scribes, buy the registers, and pay the full price of an apparatus built in a hurry: #R three years' income#!, #R -40#! [legitimacy|e], #R -20#! [stability|e], with a #Y Regional Diwan#! already standing."
 petition_caliph_for_rum: "Petition the Caliph for Rum"
 petition_caliph_for_rum_desc: "Send an embassy to the Abbasid Caliph in Cairo with gifts worthy of an investiture, and ask for the title the frontier already grants you in song: Sultan of Rum. The Caliph's secretaries will want to see a chancery behind the request before the robe is cut."
 rum_petition_strongest_tt: "You must be the strongest power of Shattered Rum"
 rum_two_doors_tt: "You hold a completed claim to Rum: the vindicated Seljuk Inheritance, or the Caliph's investiture"
 
 # ----- static modifiers -----
 STATIC_MODIFIER_NAME_rum_sikka_struck_mod: "The Sikka of Konya"
 STATIC_MODIFIER_DESC_rum_sikka_struck_mod: "Coin struck in the ruler's own name at the old capital. Sikka and khutba are the two ancient rights of a sovereign, and one of them now travels in every purse."
 STATIC_MODIFIER_NAME_rum_trunk_road_mod: "The Trunk Road Reopened"
 STATIC_MODIFIER_DESC_rum_trunk_road_mod: "The caravanserais between Konya and Sivas are garrisoned and the caravans pay their tolls at our gates."
 STATIC_MODIFIER_NAME_rum_diwan_restored_mod: "The Diwan of Rum"
 STATIC_MODIFIER_DESC_rum_diwan_restored_mod: "The chancery keeps registers as the sultans kept them, and what is written down can be taxed."
 STATIC_MODIFIER_NAME_rum_old_capital_mod: "The Old Capital"
 STATIC_MODIFIER_DESC_rum_old_capital_mod: "Konya is held: the citadel, the Alaeddin Mosque, the tombs of eight sultans. Lose the city and the claim stands naked until it is retaken."
 STATIC_MODIFIER_NAME_rum_program_relief_mod: "The Claim Advances"
 STATIC_MODIFIER_DESC_rum_program_relief_mod: "Another proof of custody stands complete, and for a while the doubters find smaller audiences."
 STATIC_MODIFIER_NAME_rum_conquest_glory: "Glory of the Claimant's Arms"
 STATIC_MODIFIER_DESC_rum_conquest_glory: "A war won under the claim. Victories persuade Anatolia faster than any jurist."
 STATIC_MODIFIER_NAME_rum_defeat_shame: "Shame of the Claimant's Arms"
 STATIC_MODIFIER_DESC_rum_defeat_shame: "A war lost under the claim. Every tent in Anatolia has heard by now."
 
 # ----- events -----
 rum.1.title: "The Khutba at Konya"
 rum.1.desc: "In the Alaeddin Mosque on the citadel hill, the khatib pauses where a sultan's name belongs. Since 1308 that pause has been filled with the Ilkhan's name, then with silence. Today he reads ours.\n\nThe congregation includes qadis who remember the old chancery, merchants who remember safe roads, and at least three men who will ride tonight to tell their begs what was said. Our fathers held their patents from the Ilkhan's governors, and we have just declared that whole order dead. Until we strike coin, guard roads, and keep registers, we are a beylik that has said a very large word."
 rum.1.a: "The word is spoken. Now we make it true."
 rum.10.title: "The Sikka Struck"
 rum.10.desc: "The first dirhams come off the dies at Konya, bearing our name and the old sultanate's weight. The moneychangers of the bazaar test them against the Ilkhanid coin, shrug, and accept them at par. That shrug is worth more than any ceremony. From today, every purse that crosses Anatolia carries our claim in it."
 rum.10.a: "Let it pass from hand to hand."
 rum.11.title: "The Road Holds"
 rum.11.desc: "A caravan out of Tabriz has crossed to Konya by the trunk road, slept in the Sultan Hans under our garrisons, paid our tolls, and lost nothing on the way. The merchants are telling the story in three bazaars already. The old sultans built their throne on exactly this: a road where the toll was cheaper than the robbery."
 rum.11.a: "Safer under one hand."
 rum.12.title: "The Diwan of Rum"
 rum.12.desc: "The chancery is constituted, and scribes trained in the Persian manner take custody of the registers: the tax rolls, the land grants, the muster lists that the begs have kept in their own houses since the sultanate fell. A holding that has been measured and written down can be summoned, taxed, and reassigned. The begs understood this before we did, which is why the registers had to come early."
 rum.12.a: "What is written can be ruled."
 rum.13.title: "The Old Capital"
 rum.13.desc: "Konya is ours. The citadel, the Alaeddin Mosque, the tombs of the eight sultans whose inheritance we claim, all of it sits under our garrison, and the khutba on the hill now carries our name.\n\nIn 1277 the Karamanoğlu held this city for a season and lost it, and men still tell the story. The first proof of custody is possession. The second proof is keeping it."
 rum.13.a: "The seat is taken. Now the work."
 rum.14.title: "The Old Capital Lost"
 rum.14.desc: "Konya has fallen out of our hands, and with it the first proof of everything we claimed. The begs tell each other the news across their tent fires, the qadis keep a careful silence, and the coin we struck there passes with a smirk attached.\n\nThe claim survives. It will stand naked until the city is ours again."
 rum.14.a: "Retake it. Nothing else repairs this."
 rum.20.title: "The Inheritance Proven"
 rum.20.desc: "The coin passes, the road holds, the diwan keeps the registers, and the begs who swore we would break have knelt, some at sword point and some at the sight of the others kneeling. In the Alaeddin Mosque the khatib reads the name of a Sultan of Rum, and this time no one in Anatolia laughs.\n\nWhat the House of Seljuk left, our house has taken up."
 rum.20.a: "The Sultanate of Rum lives again, and it is ours."
 rum.21.title: "The Claim Breaks"
 rum.21.desc: "It is finished, and it has finished us. The word we spoke in the Alaeddin Mosque could not be made true. Somewhere among the coin, the roads, the registers and the obedience, the apparatus failed, and all of Anatolia watched it fail.\n\nThe begs will tell this story to their sons: the house that reached for Kayqubad's crown and dropped it. No one of our name will speak that khutba again."
 rum.21.a: "We reached too far. It will be remembered."
 rum.2.title: "The Marches Without a Master"
 rum.2.desc: "The couriers no longer come. The Ilkhan's chancery, which confirmed our fathers in their marches and took its tithe of our raids, has stopped existing. Every beg in Anatolia holds today exactly what his sword holds.\n\nThe begs of the frontier say the answer is written on the border itself: press the ghaza, and let Cairo confirm what the sword has already proven. The old qadi families of the interior say that Anatolia has been a sultanate before, that the registers and the roads remember Konya, and that whoever takes up that inheritance takes up a crown. The oldest men in the tents say what they have always said: a beg who reaches past his march loses the march too."
 rum.2.a: "The frontier is our patent. Press the ghaza."
 rum.2.b: "The inheritance of the House of Seljuk waits at Konya. We claim it."
 rum.2.c: "Our fathers were begs. Their tents are enough."
 RUM_INHERITANCE_PROGRAM_TRACK: "The Program of the Inheritance"
 # ----- base start events, reframed (the .1 desc is shared by .2) -----
 rise_of_the_ottomans.1.title: "The Strongest of the Marches"
 rise_of_the_ottomans.1.desc: "The Ilkhan's order is dead and Rum lies masterless, a land of marches where every beg holds what his sword holds. No crown sits over Anatolia. The question of who will forge one is open, and every muster roll and every tax register is an argument in that dispute.\n\nToday the strongest of the marches is [target_country.GetName], under [target_character.GetName]. Today. The begs keep their own count, and the count changes with every campaign season.\n\nStrength decides who is feared. It has never yet decided who is sultan. Whichever house wants more than a march must find a warrant the land will accept, and the land has watched warrants fail before."
 rise_of_the_ottomans.1.a: "A beg is not a sultan. Someone should remind them of that."
 rise_of_the_ottomans.2.title: "Primacy Among the Marches"
 rise_of_the_ottomans.2.a: "Primacy today. The crown when we have earned one."
 RUM_INHERITANCE_HIGH_TRACK: "The Vindication Clock"
 # Base string uses Country.GetTownsAndCities, a data promote removed in
 # 1.2.0 (it throws "FetchData failed" whenever the end conditions render).
 # Overridden without the dead promote.
 strongest_beylik_has_over_75_locations: "[SituationView.GetActiveSituation.GetSituation.MakeScope.GetVariable('strongest_beylik_variable').GetCountry.GetName] owns at least 500 [locations|e] (currently: [SituationView.GetActiveSituation.GetSituation.MakeScope.GetVariable('strongest_beylik_variable').GetCountry.GetOwnedLocationCount]) and 50 [towns_or_cities|e]."
 # ----- panel track tooltips (plain language) -----
 RUM_INHERITANCE_PROGRAM_TRACK_TT: "#T The four proofs of custody#!\nComplete all four to be eligible for victory. Each is a button on this panel. The [legitimacy|e] price rises with every step, and each step pays back over time:\n#Y 1.#! #b Proclaim Custody of the Old Capital#! (#R -10#! [legitimacy|e]): requires owning #Y Konya#!. If you lose Konya later, this step is #R revoked#! until you retake it and proclaim again.\n#Y 2.#! #b Strike the Sikka#! (#R -20#!): mint coins in your own name. Requires step 1.\n#Y 3.#! #b Restore the Diwan of Rum#! (#R -30#!, #R -5#! [stability|e], one year's income): founds your Persian-style chancery. Requires step 2, plus a #Y Regional Diwan#! and #Y two Local Diwans#! built in your lands.\n#Y 4.#! #b Reopen the Trunk Road#! (#R -40#!): requires step 3 and owning #Y Konya#! and #Y Sivas#!."
 RUM_INHERITANCE_HIGH_TRACK_TT: "#T How long the realm has believed you#!\nCounts every month your [legitimacy|e] is at #Y 60 or higher#! (total, not consecutive). At #Y 36 months#! this requirement for victory is met.\n\nYour claim bleeds [legitimacy|e] every month. Being #b at war#! offsets the bleed, and #b winning wars#!, #b winning battles#! and #b taking land#! add more. Each completed program step also adds a permanent recovery."
 # ----- proclamation action -----
 rum_proclaim_old_capital: "Proclaim Custody of the Old Capital"
 rum_proclaim_old_capital_desc: "Stand in the Alaeddin Mosque at Konya and have the khutba name you keeper of the House of Seljuk's seat. Requires owning Konya and costs [legitimacy|e] when spoken. Unlocks the Summon to Obedience action against the other beyliks."
 # ----- summons action + CB -----
 rum_summon_to_obedience: "Summon to Obedience"
 rum_summon_to_obedience_desc: "The keeper of the Old Capital demands the obedience of a neighboring march, and gains the right to take it by the sword when refused. Costs #R 5#! [legitimacy|e]; grants a conquest [casus_belli|e] limited to Anatolia."
 rum_summon_select_country: "Summon which march?"
 rum_summon_no_countries: "No neighboring beylik can be summoned."
 cb_rum_custody: "Custody of Rum"
 cb_rum_custody_desc: "This march was summoned to obedience by the keeper of the Old Capital and refused. The claim of Konya carries the sword with it, inside Anatolia and nowhere else."
 RUM_CUSTODY_WAR_NAME: "$ORDER$$ATTACKER.GetAdjectiveWithFlag$ Summons of $DEFENDER.GetNameWithFlagNoTooltip$"
 # ----- hook notifications (rum.30-36) -----
 rum.30.title: "Victory Under the Claim"
 rum.30.desc: "The field is ours, and Anatolia was watching. The qadis will mention it after Friday prayers, and the begs who doubted us will spend the evening recounting their horsemen."
 rum.30.a: "Let it be told in the bazaars."
 rum.30.b: "Note such victories silently henceforth."
 rum.30.c: "Silence all such notices henceforth."
 rum.31.title: "Defeat Under the Claim"
 rum.31.desc: "The field is lost, and Anatolia was watching that too. Tonight every doubter in every tent has his argument served to him for free."
 rum.31.a: "We will answer this in the field."
 rum.31.b: "Note such defeats silently henceforth."
 rum.31.c: "Silence all such notices henceforth."
 rum.32.title: "A War Won Under the Claim"
 rum.32.desc: "The war is won and the terms are ours. The claimant of Konya defended what he claimed and took what he was owed, and no jurist in Anatolia can argue with a treaty. For a season the doubters hold their tongues."
 rum.32.a: "Let the khutba mention it."
 rum.32.b: "Note won wars silently henceforth."
 rum.32.c: "Silence all such notices henceforth."
 rum.33.title: "A War Lost Under the Claim"
 rum.33.desc: "The war is lost. A keeper who cannot defend his own claim keeps very little, and that sentence is being spoken tonight in every bazaar on the trunk road."
 rum.33.a: "Endure it. Rebuild."
 rum.33.b: "Note lost wars silently henceforth."
 rum.33.c: "Silence all such notices henceforth."
 rum.34.title: "The Seat Itself Is Lost"
 rum.34.desc: "Our own capital has fallen to the enemy. The begs no longer whisper their doubts in their tents. They say them aloud, at our expense, in verse."
 rum.34.a: "We are not finished."
 rum.34.b: "Note such losses silently henceforth."
 rum.34.c: "Silence all such notices henceforth."
 rum.35.title: "Ground Lost Under the Claim"
 rum.35.desc: "A province has slipped from our hands, and the land keeps count. Small losses make small arguments, and the doubters collect them the way misers collect coppers."
 rum.35.a: "It will be recovered."
 rum.35.b: "Note such losses silently henceforth."
 rum.35.c: "Silence all such notices henceforth."
 rum.36.title: "Ground Taken Under the Claim"
 rum.36.desc: "A province has come under our hand, and the land keeps count of that too. The old sultanate was assembled exactly this way the first time, one valley's obedience after another."
 rum.36.a: "One more valley obeys."
 rum.36.b: "Note such gains silently henceforth."
 rum.36.c: "Silence all such notices henceforth."
 # ----- program v2: requirement tooltips, integrate action, mandate bleed -----
 rum_diwan_buildings_tt: "You have built a #Y Regional Diwan#! and at least #Y two Local Diwans#!"
 rum_chancery_building_tt: "You have built a #Y Regional Diwan#!"
 rum_consolidate_the_conquest: "Consolidate the Conquest"
 rum_consolidate_the_conquest_desc: "Fully integrate a conquered Anatolian province at a stroke: the qadis appointed, the registers opened, the begs' sons taken to court as guests. Moving qadis around will impact our own stability and legitimacy though."
 rum_consolidate_select_province: "Consolidate which province?"
 rum_consolidate_no_provinces: "No conquered Anatolian province to consolidate."
 AUTO_MODIFIER_NAME_rum_march_without_mandate: "March Without a Mandate"
 AUTO_MODIFIER_DESC_rum_march_without_mandate: "The Ilkhan who confirmed this house in its march is gone, and the house has claimed nothing in his place: no ghaza, no Konya. Every month without an answer, the begs' oaths mean a little less. Adopt the Ghazi Sultanate or declare the Seljuk claim to stop the bleeding."
