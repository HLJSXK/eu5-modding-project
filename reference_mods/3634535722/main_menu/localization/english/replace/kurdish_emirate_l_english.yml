l_english:
 iranic_tribal_polity: "Iranic Tribal Polity"
 iranic_tribal_polity_desc: "A hereditary mountain principality on a tribal-confederate base — the [Concept('amirs_estate', 'mîr')|E] rules through the tribal aghas and valley lords beneath him, who keep their own autonomy. Persianate in culture — chancery Persian, the etiquette of the court — but not in structure: there is no dīwān, no surveyed fisc, no [iqta_law|E] apparatus. Such polities endured for centuries by being unconquerable in their mountains and useless beyond them, selling nominal vassalage to whichever empire was ascendant. Should a mîr seize a great seat of empire, the road to the chancery — and the [Concept('diwan_estate', 'Dīwān')|E] — opens before him."
 GOV_POWER_NAME_tribal_cohesion_iranic_tribal_polity: "Tribal Cohesion"
 GOV_POWER_NAME_tribal_cohesion_iranic_tribal_polity_desc: "The mîr's standing among the aghas and valley lords who actually hold the guns — sustained by lineage, the distribution of plunder, and the binding force of shared defense against the lowland empires."
 kurdish_emirate: "Kurdish Emirate"
 kurdish_emirate_desc: "The mîrnishîn proper: a Persianate-cultured, tribal-confederate principality. No chancery, no surveyed tax base — revenue is the mîr's own domain plus the tribute and levies of the constituent tribes. Devastating in defense of its mountains, inert on the attack. These emirates were the most durable polities of the Kurdish and Jaziran highlands precisely because they could not be taken and would not expand."
 AUTO_MODIFIER_NAME_kurdish_emirate_defensive_levy: "Defense of the Mountains"
 AUTO_MODIFIER_DESC_kurdish_emirate_defensive_levy: "The tribal host turns out in full to defend the emirate's own ground. (When the emirate is the aggressor, the aghas stay home — this applies only while not the attacker.)"
 kurdish_emirate.1.t: "The Chancery Within Reach"
 kurdish_emirate.1.d: "The great city is ours. Its bazaars, its registers, its scribes bowing in the dīwān-khāna — all the apparatus of settled empire, the very machinery our mountain forefathers never possessed nor wanted. The mustawfīs await a word. To take up the pen is to become a sultan in fact and not only in the field — to trade the freedom of the highlands for the reach of the chancery. The aghas watch to see which way the mîr will turn."
 kurdish_emirate.1.a: "Take up the chancery — let the dīwān rise."
 kurdish_emirate.1.b: "We remain the mîr of the mountains."
