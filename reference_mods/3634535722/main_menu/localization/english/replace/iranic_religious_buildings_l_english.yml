 # ============================================================
 # Iranic religious building set — 1337
 # See in_game/common/building_types/05_Iranic_religious_buildings.txt
 # ============================================================

 # ----- The astāna: mother lodge / saint-shrine complex -----
 astana_complex: "Āstāna"
 astana_complex_desc: "The mother-lodge of a Sufi order — the threshold (āstāna) of the principal living shaykh and the tomb-shrine of its founder. Ardabīl under Shaykh Ṣadr al-Dīn (Safaviyya), Chisht in Khurasan (Chishtiyya), Turbat-i Jām (Aḥmad-i Jām), Basṭām (Bāyazīd), Yasi (Aḥmad Yasawī), Konya (Mevleviyya) — each a waqf-endowed pilgrimage economy with a resident population of dervishes, sayyids, and shrine servitors that no ordinary lodge could sustain.\n\nThe Persianate state did not build āstānas; āstānas built the Persianate state. From them came the conversion of the steppe, the consolation of the urban poor, the prestige of charismatic Islam against the orthodox jurists. One per province — the order's center is, by definition, one place. Built on top of an existing Sufi lodge — the order matures in its place rather than appearing from nowhere."
 astana_maintenance: "Shrine-Lodge Establishment"
 astana_maintenance_desc: "The lodge's daily round: paper for the order's registers and the silsila that traces its lineage back to ʿAlī, books of the founder's discourses and hagiographies, fine cloth for the khirqa robes of initiation and the drapery of the shrine, and the modest furnishings of an audience hall where the shaykh receives pilgrims and disciples."

 astana_one_per_province_tt: "Only one Āstāna may exist per province."

 # ----- The madrasa: orthodox legalist seminary -----
 madrasa: "Madrasa"
 madrasa_desc: "Niẓām al-Mulk's invention, ubiquitous by 1337 — the orthodox legal seminary, dedicated to a single madhhab's fiqh and to the production of qāḍīs, kātibs, and muftis. The Niẓāmiyya of Baghdad still taught when Ibn Baṭṭūṭa passed through; the Mustanṣiriyya nearby; the great madrasa-mausoleum complexes of Ilkhanid Tabriz and Saljuq Iṣfahān; Mamluk Cairo and Damascus dotted with them.\n\nThe madrasa is the counter-institution to the āstāna on the orthodoxy/heterodoxy axis. Where the lodge cultivates charisma, the madrasa cultivates law; where the lodge converts through devotion, the madrasa converts through doctrine. Its graduates staff both the qāḍī's bench and the chancery's secretariat — the qāḍī-kātib overlap is why a madrasa lifts noble literacy as well as clergy literacy."
 madrasa_maintenance: "Seminary Operations"
 madrasa_maintenance_desc: "Paper above all — the madrasa is a copying economy, the master dictating from the standard manual and the students inscribing it for their own future libraries. Books of the madhhab for the curriculum, a modest fine-cloth load for the mudarris's robe of office and the seal of the institution."

 # ----- The ḥisba office: the muḥtasib's jurisdiction -----
 hisba_office: "Ḥisba Office"
 hisba_office_desc: "The seat of the muḥtasib — the magistrate of the market, the weights, the prices, and the public morals. His office checks the bazaar's scales, polices wine and gambling, supervises Friday prayer attendance, and enforces the dress codes of the dhimmī communities. Mubāriz al-Dīn Muẓaffar of Yazd made the institution famous by closing the wine-shops and music-halls of Shiraz on his conquest of the city in 1353 — Ḥāfiẓ spent a divan complaining about him.\n\nA small institution by comparison with the madrasa or the lodge, but a decisive one for the orthodox-state path: the muḥtasib is how religious law reaches into commerce. Burgher unrest is a feature, not a bug — the bazaar resents enforcement, and a din-panāh ruler accepts that resentment as the cost of order."
 hisba_maintenance: "Muḥtasib's Office"
 hisba_maintenance_desc: "A modest paper load for the registers of complaints, denunciations, and fines; a small library of fiqh manuals on market law (the Maʿālim al-Qurba and its cousins). No more than that — the muḥtasib's authority comes from his deputies on the ground, not from a great household."

 # ----- The ḥawza ʿilmiyya: Shia scholarly center -----
 hawza_ilmiyya: "Ḥawza ʿIlmiyya"
 hawza_ilmiyya_desc: "The scholarly circle of the Twelver Shīʿa mujtahids. In 1337 this means Ḥilla above all — twelve years after the death of ʿAllāma al-Ḥillī, the systematizer of Shia ijtihād and the architect of Öljaytü's conversion. His son Fakhr al-Muḥaqqiqīn still teaches; the Jabal ʿĀmil scholars import his curriculum into Lebanon; the Hilla–Najaf axis supplies mujtahids for centuries.\n\nThe ḥawza is the intellectual pipeline of Twelver Shīʿism — the building from which the doctrinal idiom of Usūlī jurisprudence emerges and from which, in a later age, mujtahid_establishment will draw its mujtahids and imāmī_tashayyuʿ will draw its ʿulamāʾ. Locked to locations with a real Shia community (10% or more) — the lodge has no constituency below that."
 hawza_maintenance: "Scholarly Circle"
 hawza_maintenance_desc: "The heaviest paper load of any building in the religious set — the ḥawza runs on transcription. The student copies the master's treatise (al-Mukhtalaf, Mabādiʾ al-Wuṣūl) in his own hand, annotates the margins, presents the fair copy back for ijāza. Books of the ḥadīth, the rijāl, the great mukhtaṣarāt; a single robe for the marjaʿ."

 hawza_requires_shia_population_tt: "Location must have a Shia population share of at least 10%."

 # ----- The imām-shrine: the atabāt and the great mashhads -----
 imam_shrine: "Mashhad of the Imām"
 imam_shrine_desc: "The shrine of an Infallible — Najaf (Imām ʿAlī), Karbalāʾ (Imām Ḥusayn), Kāẓimayn (Imāms Mūsā al-Kāẓim and Muḥammad al-Jawād), Sāmarrāʾ (Imāms al-Hādī and al-ʿAskarī, and the occultation-house of the Twelfth), Mashhad-i Rezā (Imām al-Riḍā in Ṭūs), Qom (Fāṭima al-Maʿṣūma, sister of al-Riḍā). The four atabāt of Iraq and the two great Iranian shrines.\n\nThese exist or they do not — Twelver imām-shrines are not a thing a state seats by fiat. They are pilgrimage economies of a different magnitude than any āstāna, drawing zāʾirīn across confessional lines (Sunni Ilkhans rebuilt Najaf; Mongol amirs endowed Karbalāʾ; Öljaytü, before his conversion, undertook the haj to ʿAlī's tomb). The clergy population the shrine supports is immense, and the moral authority of the shrine's mutawallī rivals the local amir's."
 imam_shrine_maintenance: "Shrine Establishment"
 imam_shrine_maintenance_desc: "The mutawallī's office: shrine registers and pilgrimage records on paper, books of ziyāra-manuals and the imām's hadith, and the heaviest textile load of any building in the set — drapery for the ḍarīḥ, robes of the khuddām, banners for the ʿalams. Marble for the ongoing maintenance of the dome and the iwans; modest furniture for the shrine's appointments."
 a_ghazi_volunteers: "Ghazi Volunteers"
 a_ghazi_volunteers_desc: "The mutatawwi'a: students of the madrasa, pious townsmen, and seekers of the frontier, who ride a season of holy war as an act of devotion and a claim on Paradise. They come in numbers and they do not break, for a man who has accepted martyrdom does not flee. But they ride lightly armored and lightly provisioned, and against a patient enemy in close ranks their ardor spends itself. They are the fervor of the faith on horseback, not its iron."
 
 # --- The Ghazis (levy type) ---
 levy_ghazi_volunteers: "Call the Ghazis"
 levy_ghazi_volunteers_desc: "Where a ribat stands on the marches and the realm has raised the banner of holy war, the volunteers gather of their own accord. They serve while the ghaza lasts and melt back to their books and their bazaars when it ends."
 
 # --- The Shahr Militia (unit type) ---
 a_shahr_militia: "Shahr Militia"
 a_shahr_militia_desc: "The young men of the city, organized in the zurkhana and the futuwwa brotherhoods, taking up spear and shield to hold their own quarters. In the open field, cavalry rides them down. But behind their walls and in the tangle of their own streets, they are a different proposition: the horse is useless among the lanes, and these men, sworn to one another and fighting before their own doors, hold ground that trained soldiers would yield. They do not march far and they do not win battles in the plain. They make a city cost more to take than it is worth."
 
 # --- The Shahr Militia (levy type) ---
 levy_shahr_militia: "Raise the Quarters"
 levy_shahr_militia_desc: "Where a zurkhana anchors the futuwwa of a town, its brotherhoods can be called to arms as urban infantry: a defensive levy, formidable in siege and street, of little use in a war of maneuver."