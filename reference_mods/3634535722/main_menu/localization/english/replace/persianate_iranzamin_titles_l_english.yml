l_english:
 # ===== Erānzamīn persianate_sultanate titles =====
 # Selected by in_game/common/customizable_localization/country_ranks.txt
 # for any persianate_sultanate whose capital sits in the Iran-zamīn
 # region (persia/khorasan/caucasus/anatolia regions + iraq_arabi/jazira
 # areas). Each rank provides: base realm name, ruler (male/female), ADJ.

 # ----- Empire rank -----
 rank_empire_persianate_iranzamin: "Pādshāhī"
 rank_empire_persianate_iranzamin_ruler_male: "Pādshāh"
 rank_empire_persianate_iranzamin_ruler_female: "Pādshāh-Bānū"
 rank_empire_persianate_iranzamin_ADJ: "Pādshāhī"

 # ----- Kingdom rank (Erānzamīn contender — succession unresolved) -----
 # No one is Sulṭān until someone wins. Jalayirids, Chobanids, Injuids did
 # not claim the title during the contest; they ruled as amirs in the name
 # of puppet/absent Ilkhans. "Faction / Regent" makes that contest legible.
 rank_kingdom_persianate_iranzamin_contender: "Faction"
 rank_kingdom_persianate_iranzamin_contender_ruler_male: "Regent"
 rank_kingdom_persianate_iranzamin_contender_ruler_female: "Regent"
 rank_kingdom_persianate_iranzamin_contender_ADJ: "Faction"
 rank_tariqa_iranzamin: "Tariqa"
 # ----- Kingdom rank (post-succession — a Sulṭān has emerged) -----
 rank_kingdom_persianate_iranzamin: "Sultanate"
 rank_kingdom_persianate_iranzamin_ruler_male: "Sulṭān"
 rank_kingdom_persianate_iranzamin_ruler_female: "Sulṭāna"
 rank_kingdom_persianate_iranzamin_ADJ: "Sultanate"

 # ----- Duchy rank (Tāzīk-leaning) -----
 rank_duchy_persianate_iranzamin_tazik: "Vilāyat"
 rank_duchy_persianate_iranzamin_tazik_ruler_male: "Vālī"
 rank_duchy_persianate_iranzamin_tazik_ruler_female: "Vālīya"
 rank_duchy_persianate_iranzamin_tazik_ADJ: "Vilāyat"

 # ----- Duchy rank (Türk-leaning) -----
 rank_duchy_persianate_iranzamin_turk: "Amirate"
 rank_duchy_persianate_iranzamin_turk_ruler_male: "Amīr"
 rank_duchy_persianate_iranzamin_turk_ruler_female: "Amīra"
 rank_duchy_persianate_iranzamin_turk_ADJ: "Amirate"

 # ----- County rank (Tāzīk-leaning) -----
 rank_county_persianate_iranzamin_tazik: "Ḥukūmat"
 rank_county_persianate_iranzamin_tazik_ruler_male: "Ḥākim"
 rank_county_persianate_iranzamin_tazik_ruler_female: "Ḥākima"
 rank_county_persianate_iranzamin_tazik_ADJ: "Ḥukūmat"

 # ----- County rank (Türk-leaning) -----
 rank_county_persianate_iranzamin_turk: "Tūmān"
