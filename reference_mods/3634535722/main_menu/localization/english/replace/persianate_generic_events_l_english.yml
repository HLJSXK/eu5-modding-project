l_english:
 # ============================================================
 # G1. The Tazkira Compiled
 # ============================================================
 persianate_generic.1.title: "A Tazkira of the Poets"
 persianate_generic.1.desc: "A scholar has compiled a tazkira — a biographical dictionary — of every poet, sufi, and qadi of consequence from the past century. Some are flattered. Some are libelled. Some are missing entirely. The scholar asks our patronage to publish copies. The court asks what to do with him."
 persianate_generic.1.a: "Adopt it as the court reference. Every prince should know his men."
 persianate_generic.1.b: "Reward him quietly. The work need not circulate widely."
 persianate_generic.1.c: "Reject it. The court has no need of clerks' opinions about clerks."

 # ============================================================
 # G2. The New Madrasa Endowment
 # ============================================================
 persianate_generic.2.title: "A Pious Endowment"
 persianate_generic.2.desc: "A merchant of long-distance trade has died without sons. His daughters' husbands have already inherited the trade; the estate now offers a great waqf to the Sultan, to direct as the Sultan sees fit. The ulama suggest a madrasa. The sufis suggest a khanqah. The caravan-masters suggest a caravanserai on the Khurasan road."
 persianate_generic.2.a: "A madrasa. The realm needs jurists, not wanderers and not freight."
 persianate_generic.2.b: "A khanqah. The realm has jurists enough."
 persianate_generic.2.c: "A caravanserai. The realm is rich in clerics and poor in shelter."

 # ============================================================
 # G3. The Pen and the Sword
 # ============================================================
 persianate_generic.3.title: "The Pen and the Sword"
 persianate_generic.3.desc: "The chief vizier and the senior amir-i-lashkar will not be in the same room. Each has prepared a memorandum against the other. Each has clients in the divan and the army respectively. The dispute is over a tax assessment, a marriage, a slight at a banquet — the records are unclear and probably all three. They have made it our problem."
 persianate_generic.3.a: "The vizier is correct. The amir may keep his rank — and his silence."
 persianate_generic.3.b: "The amir is correct. The vizier may keep his head — for now."
 persianate_generic.3.c: "They will reconcile, or both will lose their posts. We have decided."

 # ============================================================
 # G4. The Year of Plague
 # ============================================================
 persianate_generic.4.title: "The Sweating Sickness"
 persianate_generic.4.desc: "The plague has come again. The first cases in the bazaar, the next in the madrasas, the next in the qasaba quarters. The kotwal asks whether to close the gates, the ulama whether to call a public procession, the merchants whether the Sultan understands what closing the bazaar will cost. None of the answers will be the right one."
 persianate_generic.4.a: "Close the bazaar. Whatever the cost — the cost of inaction is worse."
 persianate_generic.4.b: "A great procession. The disease is from God; the petition must be to God."
 persianate_generic.4.c: "There is no answer to plague. We will endure as our fathers endured."

 # ============================================================
 # G5. The Caravanserai Project
 # ============================================================
 persianate_generic.5.title: "The Khurasan Road"
 persianate_generic.5.desc: "The caravan-masters' guild proposes a royal caravanserai on the great road — fortified, watered, with a Friday mosque attached. The cost would be considerable. The returns, if Khurasan trade resumes its old volume, would be great. The local amirs have asked, separately, whether they might 'manage' the project themselves."
 persianate_generic.5.a: "Build it. Every Sultan worth the name has left a road behind him."
 persianate_generic.5.b: "Build it cheap. Tax the merchants annually to pay it back."
 persianate_generic.5.c: "Let the local amirs do it. The treasury has other priorities."

 # ============================================================
 # G6. The Pilgrim Caravan
 # ============================================================
 persianate_generic.6.title: "The Pilgrim Caravan"
 persianate_generic.6.desc: "A great hajj caravan has assembled at the eastern frontier — pilgrims from Khurasan, Mawarannahr, even Kashgar. They ask passage through our realm to Mecca. They number in the thousands. The amir of the caravan asks an escort. The treasurer asks for the customs."
 persianate_generic.6.a: "Royal escort. We are servant of the two Holy Cities, even at distance."
 persianate_generic.6.b: "Standard customs duty. The hajj is a holy thing; the kharaj is a state thing."
 persianate_generic.6.c: "No passage. We do not need foreign mullahs preaching in our bazaars."
