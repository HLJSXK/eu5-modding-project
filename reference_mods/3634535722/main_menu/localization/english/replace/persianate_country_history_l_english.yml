l_english:

 country_history_JAL: "Of all the great houses of the ulus, none reached higher than the Jalayir. [GetCountry('JAL').GetGovernment.GetRuler.GetName] governed Rum for the late Khans, married the great Chupan's daughter, and has outlived the Khan who took her from him. Now he rules from [ShowLocationName('baghdad')], the city of the old caliphs, with a Chinggisid of his own choosing enthroned above him and the real power held firmly below. The scribes of Baghdad keep the finest chancery school in Erānzamīn and will draft for whoever feeds them, but the great registers of the realm sit in [ShowLocationName('tabriz')] with the house of Chupan, and two regents cannot share one charade forever. Whether the [GetCountry('JAL').GetGovernment.GetEstateName('diwan_estate')] is won back by the sword or rebuilt at home, and whether the khan above remains a convenience or becomes a cage, the master of Baghdad must decide; the [GetCountry('JAL').GetGovernment.GetEstateName('amirs_estate')] are watching, and so is every rival seat from [ShowLocationName('shiraz')] to [ShowLocationName('herat')]."

 country_history_CHB: "Amir Chupan was the greatest servant the Ilkhanate ever had, and it killed him for it. His grandson [GetCountry('CHB').GetGovernment.GetRuler.GetName] has gathered what the family was owed: [ShowLocationName('tabriz')] itself, the Dīwān al-Mamālik with its registers and its mint, and a supply of Borjigin princes and princesses to reign while the house of Chupan rules. It is the strangest inheritance in Erānzamīn, every instrument of empire and no right to any of it. The pen is theirs but the name on the coin is borrowed, and each new puppet is a little less convincing than the last. The [GetCountry('CHB').GetGovernment.GetEstateName('diwan_estate')] will keep the books for whoever holds the capital; the [GetCountry('CHB').GetGovernment.GetEstateName('amirs_estate')] follow the family that pays them. How long the charade can be made to continue, and what replaces it when it cannot, is the question Tabriz asks every Friday when the khuṭba is read."

 country_history_INJ: "The family takes its name from the ledgers: the injü, the crown estates of Fars, which Sharaf al-Din Mahmud Shah administered for the Khans until the Khans were gone and the administering became ruling. He paid for the promotion with his head, and his sons now hold [ShowLocationName('shiraz')] uneasily among themselves. Theirs is a Tāzīk inheritance, a province of gardens, poets, and a working chancery, with no tribal host behind it and no appetite for one. A distant khan's name in the khuṭba costs little and shelters much; but Fars remembers older kings, the ruins of Persepolis stand a morning's ride from the city, and a bold Inju might one day claim the farr itself and build like Khusraw to prove it. The [GetCountry('INJ').GetGovernment.GetEstateName('diwan_estate')] would rejoice. The lords of [ShowLocationName('yazd')] are watching, and they are not poets."

 country_history_KRT: "Herat died in the Mongol storm and the Karts taught it to live again: the walls rebuilt, the citadel raised, the bazaars filled, the one city of Khurasan that came back. The malik [GetCountry('KRT').GetGovernment.GetRuler.GetName] inherited it young, the third son of his father to hold the throne, with two dead brothers behind him, no heir before him, and the amirs of his minority still speaking loudly in his court. Every Friday his preachers read the khuṭba for Ṭoghā Temür, the last Chinggisid of any consequence, camped far away in Gorgan; it is cheap rent for legitimacy, and it buys peace with the steppe. But rent is not ownership. To the west the dervishes of [ShowLocationName('sabzavar')] have sworn to see their heads on gallows sooner than obey, and Khurasan will not stay quiet. Whether the house of Kart remains the magnificent vassal of a fading khan or one day strikes the coin in its own name is the whole question of its second century."

 country_history_MZF: "[GetCountry('MZF').GetGovernment.GetRuler.GetName] holds [ShowLocationName('yazd')] as his father held it, by service and by the sword, and he won his spurs young against the Nikudari raiders whose Islam sits as loosely on them as their saddles. He is pious the way other men are ambitious, which is to say completely, and in him the two are the same thing. The Khans are gone and he owes their memory nothing; his road runs not through the steppe but through Cairo, where a caliph in exile will gladly trade investiture for recognition. Holy war is an awkward banner in the middle of Iran, where every neighbor prays toward the same qibla, but a jurist can always be found to explain which Muslims have ceased to deserve the name. The desert lords of Yazd are patient, frugal, and watching [ShowLocationName('shiraz')] very carefully. When the wine-soaked Inju court stumbles, the muḥtasib will be waiting, and the poets of Shiraz will have a great deal to complain about."

 country_history_ERE: "[GetCountry('ERE').GetGovernment.GetRuler.GetName] began as another man's officer, an Uyghur soldier in the service of Timurtash son of Chupan, and when his master fell he quietly kept what he had been given to govern. From [ShowLocationName('sivas')] he now holds the Anatolian marches of the dead Ilkhanate, a realm of caravan cities wedged between the Mamluk sultan, the Turkmen beys, and the wreckage of the ulus. His subjects call him just; some call him the Beardless Prophet, and only half in jest. Justice, however, is not legitimacy. The sultan in Cairo keeps a caliph who will bless any ruler who asks properly, the steppe offers its puppets to any regent who can feed them, and a patient man between empires can sometimes outlast them all. Eretna has spent a lifetime serving greater names. What remains to be seen is the name he leaves behind."

 country_history_KRM: "The house of Karaman has been the sword of the Turkmen in the old lands of Rum for three generations, and by its own telling it is the rightful heir of the Seljuk sultans whose capital at [ShowLocationName('konya')] it has taken more than once. These are lords of the marches in the oldest style: tribal cavalry, mountain strongholds, a chancery that has been known to issue its decrees in plain Turkish, and a fine contempt for anyone who rules from behind a desk. The Ilkhanate that humbled them is gone, and it owes them an inheritance. To the east the regents quarrel over a dead empire's registers; to the west a small house of frontier ghazis called the sons of Osman grows less small every year. The [GetCountry('KRM').GetGovernment.GetEstateName('amirs_estate')] want war, and history suggests they will get it. Whether Karaman is remembered as the last of the Seljuks or the first of something else is not yet written."

 country_history_SRV: "The Shirvanshahs were old when the Seljuks came, old when the Mongols came, and they intend to be old when whatever comes next has gone. Arab in distant origin, Persian in everything that has mattered since, the dynasty long ago instructed its genealogists to write Bahram Gur into the family tree, and after centuries of repetition even the neighbors half believe it. From [ShowLocationName('shamakhi')] they have survived every overlord by bending precisely as far as necessary and not a finger further; Khāqānī sang for this court when it was already ancient. Now the Ilkhanate is gone, and the lowlands south of the Kura have become a battlefield of regents and puppets. A small realm can wait, pay its tribute, and outlive them all; that is the family craft. Or it can decide that the blood of the Sasanians its poets have claimed for so long deserves, at last, to be tested."

 country_history_SUT: "Amir Sutay governed Diyār Bakr for three Khans and died in his bed, which in the late Ilkhanate counted as a triumph. His sons hold the inheritance: the marcher country around [ShowLocationName('mosul')] and [ShowLocationName('amid')], facing the Mamluk sultan across the most fought-over frontier in Islam. This is an amir's state in its purest form, all sword and pasture and almost no register, where the [GetCountry('SUT').GetGovernment.GetEstateName('amirs_estate')] are not an estate of the realm so much as the realm itself. The Turkmen of the Black Sheep drift through Sutayid pastures in numbers that grow with every season, useful as levies, dangerous as guests. A house of soldiers can rent its sword to Baghdad or Tabriz, carve a kingdom from the quarrels of regents, or discover too late that the tribes it summoned have stopped taking orders. The Sutayids know how empires end. They watched one do it."

 country_history_SRB: "It began this very year in the village of Bāshtīn, when the agents of a dying empire demanded one exaction too many and were killed for it by men who swore they would sooner see their heads on the gallows than endure another day. From that oath the Sarbadārs take their name, the gallows-heads, and from [ShowLocationName('sabzavar')] they now defy every power in Khurasan. Theirs is a state unlike any other in Erānzamīn: part commune of landowners and townsmen, part army of dervishes who preach that the Mahdi's justice is coming and the order of kings is ending. They read no khan's name in the khuṭba and beg no caliph's blessing; some among them would mint the coin for the Hidden Imam himself. Every malik, regent, and jurist in Iran agrees the experiment is an abomination, which is the surest sign that it threatens them. Heaven's kingdom has been announced before. It has never before had cavalry."