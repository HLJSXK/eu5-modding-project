l_english:

 # ============================================================
 # Ghazi: Burden of the Sword — localization
 # Register: concrete-withheld-recognitions (per design guide §14).
 # Each refund's description names the silence it ends.
 # ============================================================

 # ----- Disaster header -----
 ghazi_burden_of_sword: "The Burden of the Sword"
 ghazi_burden_of_sword_desc: "You have taken the khutba in the name of holy war. The volunteers gather; the Friday preachers wait to hear what you have done about it. The qāḍīs are watching which wars are credited and which are not. The Sufis of the frontier ribats keep their counsel. Until the sword is seen working — and seen working in the right places — the realm's credibility bleeds at peace."

 # ----- Disaster action buttons -----
 claim_jihad_within: "Establish the Hisba"
 claim_jihad_within_desc: "Plant the muhtasib's office under your sikka. The censor walks the bazaar in your name; the jurists, withholding endorsement until the ruler cleans his own house, concede the first step. Available at legitimacy ≥ 50 with the sharīʿa unblocked. Costs 10 legitimacy — the doctrine's first apparatus is paid for from the bank of credibility."

 claim_ribat_network: "Endow the Frontier Lodges"
 claim_ribat_network_desc: "Stones laid at the marches: ribats at the river fords, khanqahs at the passes. The mutaṭawwiʿa have a hearth at the frontier; the corps the doctrine promised has somewhere to sleep. Available at legitimacy ≥ 60 with 100 gold in the treasury. Costs 15 legitimacy."

 claim_caliphal_investiture: "Seek the Caliph's Diploma"
 claim_caliphal_investiture_desc: "Send envoys to Cairo. The shadow-caliph's diploma is not free — a thread of public deference to the Mamluks — but it covers the doctrine until your own name suffices. Available at legitimacy ≥ 60. Costs 15 legitimacy."

 claim_sultan_of_ghazis: "Assume the Style of Sultan of the Ghazis"
 claim_sultan_of_ghazis_desc: "On the sikka, on the khutba, in the address of envoys: Sulṭān al-Ghuzāt, Sword of the Faith. The doctrine speaks in its own name now. Available at legitimacy ≥ 90, or ≥ 75 if the caliphal diploma is already in hand. Costs 25 legitimacy — the largest silence ends here."

 launch_internal_campaign: "Launch an Internal Campaign"
 launch_internal_campaign_desc: "Set the muhtasib's apparatus to the realm itself: vice, heterodoxy, or the other branch. The chronicles will read it as proof that ghaza is not merely for distant frontiers. The first campaign is loud; the third is theater the poets mock. Requires the hisba apparatus, the strict-hisba or muhtasib_regime law, and at least one hisba office. Costs 50 gold and 3 legitimacy. Capped at three campaigns per reign."


 ghazi_declare_holy_war: "Ask Ulemma for a Jihad Ruling."
 ghazi_declare_holy_war_desc: "Gain justification for war against an enemy of the faith."

 ghazi_holy_war_target: "Select a Country to target for purification."
 ghazi_no_holy_war_target_countries: "There are no valid targets for this declaration."
 # ----- can_start / can_end tooltips -----
 ghazi_burden_not_yet_completed_tt: "The wager of ghaza has not yet been resolved by this dynasty."
 ghazi_burden_not_yet_fired_tt: "The ghazi claim has not yet been put to the umma's test."
 ghazi_burden_can_end_tt: "Ends when the doctrine is vindicated, lapses, endures, or is overtaken by a dervish rising — or when the ghazi reform is abandoned."

 # ============================================================
 # HISBA LAW — enforcement of public morals. The axis is
 # mobilized vs monetized piety: the stick converts religiosity
 # into manpower; the open bazaar converts it into custom and
 # tax. Wired to the ghazi disaster: only a ghazi_sultanate can
 # adopt the muhtasib-regime, and lax enforcement makes the
 # realm a legitimate ghaza target for din-panah neighbors.
 # ============================================================
 hisba_law: "Hisba — Enforcement of Public Morals"
 hisba_law_desc: "How strictly the muhtasib walks the bazaar. The office checks weights, fines the wine-seller, examines the qāḍī's piety, drives the unveiled women home. A serious enforcement converts the population's religiosity into levy and zeal; a lax one frees the bazaar and the diwan, but demobilizes the same energy and exposes the throne to neighbors who claim the title of din-panāh."

 lax_hisba_enforcement: "Lax Enforcement — The Open Bazaar"
 lax_hisba_enforcement_desc: "The wine-shops stand open; the muhtasib is a joke the poets tell. The bazaar, the diwan, and the treasury flourish; the pious seethe and nobody musters for anything. The posture of Abu Ishaq Inju's Shiraz — and the standing invitation that brought Mubariz al-Din down upon it. The realm reads as legitimate ghaza ground to any din-panāh neighbor who cares to claim the pretext."

 customary_enforcement: "Customary Enforcement — The Qāḍī's Discretion"
 customary_enforcement_desc: "The qāḍī enforces what the quarter expects: ʿurf and discretion. Wine-shops in the side alleys, not on the great street; an unveiled woman fined when the neighbors complain, otherwise not. The default posture of most Muslim courts, and the one that gives the fewest enemies."

 strict_hisba_enforcement: "Strict Enforcement — The Stick in the Bazaar"
 strict_hisba_enforcement_desc: "The muhtasib walks the markets with a stick and a notebook. Piety runs hot and converts to manpower; the mutaṭawwiʿa pool fills. The merchants pay for it twice — in fines and in custom that flees to a quieter city. A court can run on this, but it cannot grow rich on it."

 muhtasib_regime: "The Muhtasib-King"
 muhtasib_regime_desc: "Not enforcement as policy but enforcement as the throne's own identity. Mubariz al-Din Muḥammad sealing the taverns of Shiraz with his own hand — the king himself the censor, the censor himself the king. Only a ruler who has staked his legitimacy on guarding the faith can govern like this; everyone else lacks the standing. The bazaar pays its full price, and Hafez writes his complaint, but the levy musters before the order is finished. Requires the Ghazi Sultanate reform."

 zill_allah_regime: "Ẓill Allāh — The Shadow of God"
 zill_allah_regime_desc: "Enforcement dissolved into the person of the murshid. The wine-shop and the khanqah stand on the same street; the ghulāt drink at the same table as the jurist who would have called them heretics in any other reign. The murīds die for the murshid, not for the muhtasib. Available only to a Shia throne whose societal preference has tilted firmly toward mysticism — the Safavid posture, before the jurists arrived to enforce a different orthodoxy."

 # ============================================================
 # STATIC MODIFIERS — name + desc require the STATIC_MODIFIER_
 # prefix to display. Bare keys silently fail.
 # ============================================================

 # --- battle / war pulse ---
 STATIC_MODIFIER_NAME_ghazi_conquest_glory: "The Banner Carried Forward"
 STATIC_MODIFIER_DESC_ghazi_conquest_glory: "A war prosecuted against the dar al-harb, and won. The volunteers send word home; the next muster will be larger."

 STATIC_MODIFIER_NAME_ghazi_defeat_shame: "The Sword Failed in the Field"
 STATIC_MODIFIER_DESC_ghazi_defeat_shame: "Heaven's reward, which the doctrine promised, has visibly withheld itself. The preachers note the result; the volunteers remember."

 STATIC_MODIFIER_NAME_ghazi_capital_lost: "The Seat of the Ghazi Fallen"
 STATIC_MODIFIER_DESC_ghazi_capital_lost: "The capital itself, taken. The court of the holy warrior cannot be a borrowed roof for long."

 STATIC_MODIFIER_NAME_ghazi_frontier_caucasus: "Designated Frontier: the Caucasus Gate"
 STATIC_MODIFIER_DESC_ghazi_frontier_caucasus: "Volunteers stream toward Georgia and the steppe beyond. The realm's manpower is bent toward the northern frontier."

 STATIC_MODIFIER_NAME_ghazi_frontier_rum: "Designated Frontier: the Road to Rum"
 STATIC_MODIFIER_DESC_ghazi_frontier_rum: "The corps musters facing west — Anatolia, Trebizond, the Byzantine rump. The Ottoman niche, contested from the east."

 STATIC_MODIFIER_NAME_ghazi_frontier_hindustan: "Designated Frontier: the Ghaznavid Road"
 STATIC_MODIFIER_DESC_ghazi_frontier_hindustan: "Hindustan: the oldest, richest precedent. The corps assembles facing the passes."

 STATIC_MODIFIER_NAME_ghazi_designation_failed_scar: "The Volunteers Disbanded"
 STATIC_MODIFIER_DESC_ghazi_designation_failed_scar: "The corps was summoned and given garrison duty. Word travels: this ghazi's promises do not become wars."

 # --- apparatus refunds (cleared on disaster end) ---
 STATIC_MODIFIER_NAME_ghazi_jihad_within_refund: "The Censor's House Cleaning"
 STATIC_MODIFIER_DESC_ghazi_jihad_within_refund: "The muhtasib walks the bazaar in your name. The jurists concede, at least, that the house is being cleaned."

 STATIC_MODIFIER_NAME_ghazi_ribat_network_refund: "The Lodges of the Frontier"
 STATIC_MODIFIER_DESC_ghazi_ribat_network_refund: "The khanqahs of the marches are endowed. The mutaṭawwiʿa have somewhere to muster; the corps has a wall."

 STATIC_MODIFIER_NAME_ghazi_investiture_refund: "The Caliph's Diploma"
 STATIC_MODIFIER_DESC_ghazi_investiture_refund: "From Cairo, the robes; on the seal, your name. The pulpits warm; the umma hears that you are spoken of as deputy."

 STATIC_MODIFIER_NAME_ghazi_sultan_of_ghazis_refund: "Sultan of the Ghazis"
 STATIC_MODIFIER_DESC_ghazi_sultan_of_ghazis_refund: "The sikka and the khutba now name YOU sword of the faith. The largest silence ends; with the four refunds standing, the bleed is fully cancelled."

 # --- apparatus legacies (persist past resolution; stripped only by Dervish Rising) ---
 STATIC_MODIFIER_NAME_ghazi_hisba_apparatus: "The Hisba Apparatus"
 STATIC_MODIFIER_DESC_ghazi_hisba_apparatus: "The censor's office is now a permanent organ of the realm. The bazaar knows whose name is read at the inspection."

 STATIC_MODIFIER_NAME_ghazi_the_lodges_endowed: "The Lodges Stand"
 STATIC_MODIFIER_DESC_ghazi_the_lodges_endowed: "The frontier khanqahs, endowed in your dynasty's name. A small permanent levy trace; the corps remembers where its lodgings were built."

 STATIC_MODIFIER_NAME_ghazi_caliphal_diploma: "The Diploma Exists"
 STATIC_MODIFIER_DESC_ghazi_caliphal_diploma: "Foreign chanceries have seen the seal. You are spoken of as deputy; the title travels with the dynasty whether or not Cairo still cares."

 STATIC_MODIFIER_NAME_ghazi_sultan_of_ghazis_in_protocol: "The Title in the Protocol"
 STATIC_MODIFIER_DESC_ghazi_sultan_of_ghazis_in_protocol: "The chanceries write the style. Where once you were addressed as malik, the inkstand now writes Sultan of the Ghazis as a matter of routine."

 # --- resolutions ---
 STATIC_MODIFIER_NAME_ghazi_sword_of_islam: "Sword of Islam"
 STATIC_MODIFIER_DESC_ghazi_sword_of_islam: "The doctrine, paid for. The Ghazi Corps is constitutionalized; the realm's identity is locked as dar al-harb's neighbor. The volunteers come now without being called."

 STATIC_MODIFIER_NAME_ghazi_guardian_of_thughur: "Guardian of the Thughur"
 STATIC_MODIFIER_DESC_ghazi_guardian_of_thughur: "The murābiṭ's answer: ghaza by holding the wall. The frontier did not give way; survival itself was the proof."

 STATIC_MODIFIER_NAME_ghazi_doctrine_lapsed_scar: "The Doctrine Furniture"
 STATIC_MODIFIER_DESC_ghazi_doctrine_lapsed_scar: "The court keeps the word \"ghazi\" in the protocol and everyone knows it is furniture. The chronicles will record the title; the chroniclers will not believe it."

 STATIC_MODIFIER_NAME_ghazi_dervish_rising_scar: "After the Rising"
 STATIC_MODIFIER_DESC_ghazi_dervish_rising_scar: "The ribat network defected to a shaykh. The court survived; the constituency did not return. The frontier khanqahs no longer answer to the throne."

 # --- internal-campaign scars (tier-1) ---
 STATIC_MODIFIER_NAME_ghazi_vice_campaign_scar: "The Taverns Sealed"
 STATIC_MODIFIER_DESC_ghazi_vice_campaign_scar: "By the muhtasib's hand: wine jars broken, gambling cellars shut, the unveiled women of the bazaar driven home. The poets compose elegies for the city's lost air; the customs collectors record the bazaar's narrower take."

 STATIC_MODIFIER_NAME_ghazi_heterodoxy_campaign_scar: "The Shaykhs Dispersed"
 STATIC_MODIFIER_DESC_ghazi_heterodoxy_campaign_scar: "The ghulat circles broken up, the suspect khanqahs visited at dawn. The jurists at court approve; the rural devotees count their losses and remember the shaykh's last words."

 STATIC_MODIFIER_NAME_ghazi_sectarian_campaign_scar: "The Other Branch Quieted"
 STATIC_MODIFIER_DESC_ghazi_sectarian_campaign_scar: "The other branch's preachers escorted out, their mosques transferred, their pious endowments redirected. The conversion-ledger moves; the quarters that lost their preachers do not soon forget."

 # ============================================================
 # GUI track headers
 # ============================================================
 GHAZI_BURDEN_SWORD_TRACK: "Sword of Islam (months at legitimacy ≥ 75)"
 GHAZI_BURDEN_TIER3_TRACK: "Wars won against dar al-harb"
 GHAZI_BURDEN_LAPSE_TRACK: "Lapse / Rising (months at legitimacy ≤ 25)"
 GHAZI_BURDEN_FAILURES_TRACK: "Frontier expectations failed"
 GHAZI_BURDEN_GUARDIAN_TRACK: "Endurance (total disaster months)"

 # ============================================================
 # EVENTS
 # ============================================================

 # ----- .1 ANNOUNCE -----
 ghazi_burden.1.title: "The Khutba Names You Ghazi"
 ghazi_burden.1.desc: "In the Friday sermon, the preacher names your dynasty sword of the faith. The qāḍīs in the audience exchange glances; the volunteers in the back of the mosque sit up. The boast has been made publicly. The umma is now waiting to see what you have done about it. From this moment, the credibility of the ghaza is your legitimacy, and credit comes only with wars in the right places."
 ghazi_burden.1.a: "Let the sword be seen, then."
 ghazi_burden.1.a.tt: "Wars against other religions will now give major legitimacy and count towards the Dar-al-Harb indicator. \n\n Wars against Nations with the Mongol Yasa Law legal basis with give medium amounts of legitimacy, but will not count as ghaza for the purposes of the wager. \n\n Wars against muslims with Lax Hisba / Sharia enforcement law will give minor legitimacy bonus, but will not count as ghaza for the purposes of the wager. "


 # ----- .50 JIHAD WITHIN -----
 ghazi_burden.50.title: "The Censor Walks the Bazaar"
 ghazi_burden.50.desc: "The muhtasib's office is established under your sikka. The censor walks the markets in your name, weighing the merchants' measures, checking the qāḍī's piety, fining the wine seller. The jurists who had withheld endorsement now concede, at least, that the ruler is cleaning his own house before he reaches for the wider sword."
 ghazi_burden.50.a: "The doctrine's first step is taken in the bazaar."

 # ----- .65 RIBAT NETWORK -----
 ghazi_burden.65.title: "The Frontier Lodges Endowed"
 ghazi_burden.65.desc: "Stones are laid on the marches: ribats at the river fords, khanqahs at the mountain passes. The mutaṭawwiʿa now have a hearth at the frontier, a place to muster, a sufi shaykh to read them the Qurʾān before the column moves. The corps the doctrine promised has, at last, somewhere to assemble."
 ghazi_burden.65.a: "The wall begins where the volunteers can sleep."

 # ----- .80 INVESTITURE -----
 ghazi_burden.80.title: "The Diploma from Cairo"
 ghazi_burden.80.desc: "An envoy arrives in livery, the robes of investiture folded over his arm. The shadow-caliph in Egyptian custody has named you deputy. The diploma is read; the foreign chanceries will hear of it. The robes are not free — there is now, between your dynasty and the Mamluks, a thread of public deference. The doctrine borrows from Cairo what it has not yet built for itself."
 ghazi_burden.80.a: "Accept the robes."

 # ----- .90 SULTAN OF THE GHAZIS -----
 ghazi_burden.90.title: "Sultan of the Ghazis"
 ghazi_burden.90.desc: "On the sikka, on the khutba, in the address of envoys, the new style is written: Sulṭān al-Ghuzāt, Sword of the Faith. The doctrine no longer borrows the caliph's name; it speaks in its own. If Cairo still holds your investiture in its archive, it is a leaf in a forgotten ledger. The court of Tabrīz mints its own coin now."
 ghazi_burden.90.a: "Assume the title."

 # ----- .35 EROSION -----
 ghazi_burden.35.title: "The Preacher Cools"
 ghazi_burden.35.desc: "In the largest mosque of the capital, the Friday preacher praises holy war in the abstract — as a virtue, as an obligation, as a station of the believer. The name of the realm's ghazi is mentioned, but in the same breath as other names. The pulpits know which way the wind is blowing."
 ghazi_burden.35.a: "Endow the mosque generously. Buy the warmth back."
 ghazi_burden.35.b: "Let the sermon stand. The doctrine is not for sale."

 # ----- .20 EROSION -----
 ghazi_burden.20.title: "The Friday Khutba Turns Colder"
 ghazi_burden.20.desc: "In a provincial city, the qāḍī reads the sermon without naming the ghazi at all. The omission is heard; word travels. If the silence is not corrected, others will copy it."
 ghazi_burden.20.a: "Summon the qāḍī. Remind him whose realm this is."
 ghazi_burden.20.b: "Endow a new madrasa in that city. Buy back the pulpit's warmth."

 # ----- .10 EROSION -----
 ghazi_burden.10.title: "Bī-Ghazā"
 ghazi_burden.10.desc: "The word is heard at the muster: bī-ghazā — without ghaza. A whispered slur. The volunteers who came expecting holy war now mutter that the doctrine the realm proclaims and the wars the realm fights are two different things. The chroniclers, of course, hear everything."
 ghazi_burden.10.a: "Stage a great muster. Theatre will not be mistaken for doctrine, but it buys patience."
 ghazi_burden.10.b: "Endure the whisper. Let the wager run."

 # ----- .40 DESIGNATION EXPECTATION FAILED -----
 ghazi_burden.40.title: "The Volunteers Came for War"
 ghazi_burden.40.desc: "The corps mustered for the designated frontier. They billeted in the lodges, drilled, sharpened blades, sang the appropriate verses. And for years, nothing moved. The captains complain through the qāḍīs; the qāḍīs complain through the chroniclers; the chroniclers, who are paid by you, complain politely."
 ghazi_burden.40.a: "Disband the muster honorably. Eat the loss."
 ghazi_burden.40.b: "Redirect the corps. Promise them a new theater."

 # ----- .100 OMEN: PREACHER'S SERMON TURNS -----
 ghazi_burden.100.title: "A Famous Preacher's Sermon Turns"
 ghazi_burden.100.desc: "In a major city, a famous preacher — the kind whose Friday sermon is copied and circulated — gives a sermon in which the word ghazi is heard but the ruler's name is not. The omission is studied."
 ghazi_burden.100.a: "Patronize him. Buy the next sermon's warmth."
 ghazi_burden.100.b: "Ignore the slight. Let pulpits speak as they will."

 # ----- .101 OMEN: VOLUNTEERS DRIFT -----
 ghazi_burden.101.title: "The Volunteers Drift"
 ghazi_burden.101.desc: "Word reaches the lodges: there is another banner, in another realm, that is also called ghazi, and that banner is at war. A trickle of volunteers leaves. Credibility, among rival claimants, is zero-sum."
 ghazi_burden.101.a: "Send qāḍīs to the lodges. Recall the volunteers."
 ghazi_burden.101.b: "Let them drift. Call them back by being seen at war."

 # ----- .102 OMEN: FATWA-QUESTIONING -----
 ghazi_burden.102.title: "A Fatwa Arrives Questioning Your Wars"
 ghazi_burden.102.desc: "A scholar — a respected one, paid by no one or paid by an enemy, the difference cannot be quickly determined — has circulated a fatwa noting that recent wars were against Muslims, not infidels. The doctrine you proclaim, he writes, does not cover this. The qāḍīs at court read the fatwa carefully."
 ghazi_burden.102.a: "Pay the scholars. Buy the dissent into silence."
 ghazi_burden.102.b: "Stand by the wars. Take the hit."

 # ----- .103 OMEN: INFIDEL VICTORY -----
 ghazi_burden.103.title: "News of Infidel Victory"
 ghazi_burden.103.desc: "From somewhere on the umma's edge — a Georgian raid on a Muslim caravan, a Delhi reverse, a Cypriot fleet at a Levantine port — the enemy has won. The news reaches your court; it will reach every court. The umma's eyes turn briefly. The surge window opens: a response within four years will count for double."
 ghazi_burden.103.a: "Answer the call. Direct the corps."
 ghazi_burden.103.b: "The realm has its own wars. The world will turn its eyes elsewhere."

 # ----- .104 OMEN: MUHTASIB TURNS -----
 ghazi_burden.104.title: "The Muhtasib Turns on the Court"
 ghazi_burden.104.desc: "The censor's apparatus, established by the doctrine, has run out of bazaar to inspect. It must strike something. The court — your court — is the nearest sin. Reports arrive: the chamberlain's table, the vizier's wine, the prince's hounds. The regime devours its master."
 ghazi_burden.104.a: "Submit to the audit. The doctrine demands consistency."
 ghazi_burden.104.b: "Curb the muhtasib. Remind the office whose realm it serves."

 # ----- .105 OMEN: THE RETURNED GHAZI -----
 ghazi_burden.105.title: "The Returned Ghazi"
 ghazi_burden.105.desc: "He came back from the frontier with two scars, one banner taken with his own hands, and a following of young men who repeat his stories in every zurkhāna in the city. The doctrine is standing in your audience hall, waiting to be honored. Whatever you give him, the young men are watching what ghaza is worth at this court — and they will price their own swords accordingly."
 ghazi_burden.105.a: "Robe him. Land him. Seat him at the right hand, where the young men can see."
 ghazi_burden.105.b: "A polite audience and a small purse. Heroes are expensive to keep."

 # ----- .106 OMEN: THE NEGLECTED RIBAT -----
 ghazi_burden.106.title: "The Neglected Ribat"
 ghazi_burden.106.desc: "Word from the frontier, ten days stale: the ribāṭ at the edge of the realm was overrun in the night — its dervishes dead or carried off, its granary burned. No one says aloud that the garrison had been unpaid since winter, or that the court was feasting when the letters asking for men went unanswered. No one needs to. The thughūr is the sultan's burden; everyone at the frontier can count the days between the letter and the feast."
 ghazi_burden.106.a: "Rebuild it twice as strong, endowed in our own name. The frontier will know we heard."
 ghazi_burden.106.b: "Mourn publicly. The frontier is far, and the treasury is near."

 # ----- .108 OMEN: THE BANNERS FLOCK (positive) -----
 ghazi_burden.108.title: "The Banners Flock"
 ghazi_burden.108.desc: "A frontier shaykh whose word carries from the ribāṭs to the wrestling-houses has preached it in the open: THIS court is the true seat of ghaza in the age — its wars real wars, its designations kept, its sultan a sultan of the thughūr and not of the banquet. And the young men believed him. They are arriving now, in bands of ten and twenty, dusty, armed, and expecting to be fed. Credibility among the ghazis is zero-sum; today the flow runs toward you."
 ghazi_burden.108.a: "Feast them and enroll them. Let every rival court hear where the volunteers went."
 ghazi_burden.108.b: "Bless them and point them at the frontier. Grace, at cost price."

 # ----- .109 OMEN: THE CAPTIVES RETURN (positive) -----
 ghazi_burden.109.title: "The Captives Return"
 ghazi_burden.109.desc: "Two years of the qāḍīs' collections, the merchants' sureties, and a border negotiation conducted in three languages have done it: the column came through the pass this morning — Muslim captives, ransomed home, some of them men given up for dead since before your reign began. The balance of the ransom is still owed. Whoever pays it owns the story, and the story will be told in every mosque in the realm on Friday."
 ghazi_burden.109.a: "The treasury pays the balance. The sultan ransoms his own."
 ghazi_burden.109.b: "The families and the qāḍīs have carried it this far. Let them finish."

 # ----- .150 FATWA CHAIN -----
 ghazi_burden.150.title: "The Scholar Proposes a Ruling"
 ghazi_burden.150.desc: "A scholar at court — Damascene-trained, sharp, ambitious — proposes a ruling: a Muslim prince who governs by the yasa rather than the sharīʿa has not entered the law. Fighting him is not only permitted but obligatory. The ruling, if adopted, would name your tier-2 wars as ghaza in full."
 ghazi_burden.150.a: "Endorse the ruling. The clergy will not love it, but the doctrine will."
 ghazi_burden.150.b: "Patronize the scholar handsomely. Pay gold instead of clergy."
 ghazi_burden.150.c: "Refuse the doctrine. Keep the broader order."

 # ----- .160 FRONTIER DESIGNATION -----
 ghazi_burden.160.title: "The Volunteers Are Gathered — Where?"
 ghazi_burden.160.desc: "The corps stands in muster; the captains await orders. Three theaters are spoken of in the lodges. Each promises a different empire."
 ghazi_burden.160.a: "The Caucasus Gate — Georgia, Derbent, the steppe."
 ghazi_burden.160.b: "The Road to Rum — Anatolia, Trebizond, the rump of Constantinople."
 ghazi_burden.160.c: "The Ghaznavid Road — Hindustan."
 ghazi_burden.160.d: "Send them home. The realm has its own ground."

 # ----- .200 SWORD OF ISLAM -----
 ghazi_burden.200.title: "Sword of Islam"
 ghazi_burden.200.desc: "The doctrine, paid for in full. The volunteers no longer wait for the muster; they arrive ahead of it. The Friday khutba names you sword of the faith without hesitation. The dar al-harb knows it shares a border with a ghazi state, and a frontier so designated does not easily go quiet."
 ghazi_burden.200.a: "The wager has been won. (Unlock Dar-al-Jihad Government Reform)"

 # ----- .201 DERVISH RISING -----
 ghazi_burden.201.title: "The Dervish Rising"
 ghazi_burden.201.desc: "The corps that mustered for your wars no longer marches under your banner. A charismatic shaykh — barefoot, eyes blazing, claiming visions — has gathered the ribat network around himself. The lodges read him now; the volunteers swear to him; the chroniclers, with practiced phrasing, record that the dynasty's ghazi project has been overtaken. The throne survives. The doctrine — and the constituency that gave it body — has gone to another vessel."
 ghazi_burden.201.a: "The realm holds. The faith has chosen another."

 # ----- .202 GUARDIAN OF THE THUGHUR -----
 ghazi_burden.202.title: "Guardian of the Thughur"
 ghazi_burden.202.desc: "A quarter-century has passed. The dynasty did not win the dazzling wars; it did not lose its frontier. The murābiṭ's answer is read as ghaza: holding the wall is service to the faith. The chronicles will record it so. The bonuses are modest; the verdict is honorable."
 ghazi_burden.202.a: "Hold the wall, then."

 # ----- .203 DOCTRINE LAPSES -----
 ghazi_burden.203.title: "The Doctrine Lapses"
 ghazi_burden.203.desc: "No usurpation, no rising, no catastrophic loss — only that the years passed and the wars did not come, or came against the wrong enemies, or came and were not credited. The court keeps the word ghazi in the protocol; everyone knows it is furniture. The cousins remember; the chronicles record."
 ghazi_burden.203.a: "Let it be furniture, then."

 # ----- .300 INDICATOR: BATTLE WON -----
 ghazi_burden.300.title: "A Battle Won"
 ghazi_burden.300.desc: "While the ghaza doctrine is under audit, battle outcomes feed the ledger. Wins against dar al-harb credit the realm; ordinary battles are noted but pass without remark."
 ghazi_burden.300.a: "Understood."
 ghazi_burden.300.b: "Stop showing me battle-win notifications."
 ghazi_burden.300.c: "Stop showing me any of these notifications."

 # ----- .301 INDICATOR: BATTLE LOST -----
 ghazi_burden.301.title: "A Battle Lost"
 ghazi_burden.301.desc: "Defeats while the doctrine is under audit do not pass unnoticed. The volunteers note who left the field; the chroniclers note who paid the wages."
 ghazi_burden.301.a: "Understood."
 ghazi_burden.301.b: "Stop showing me battle-loss notifications."
 ghazi_burden.301.c: "Stop showing me any of these notifications."

 # ----- .302 INDICATOR: WAR WON -----
 ghazi_burden.302.title: "A War Won"
 ghazi_burden.302.desc: "War outcomes are credited by tier: dar al-harb wars are the doctrine's native food (full credit, tier-3 counter); Muslim-in-name wars credit half without the fatwa, full with it; ordinary Sunni wars are not credit at all, only complaint."
 ghazi_burden.302.a: "Understood."
 ghazi_burden.302.b: "Stop showing me war-victory notifications."
 ghazi_burden.302.c: "Stop showing me any of these notifications."

 # ----- .303 INDICATOR: WAR LOST -----
 ghazi_burden.303.title: "A War Lost"
 ghazi_burden.303.desc: "A losing war while ghaza is under audit is the doctrine's nightmare: the sword failed in the field; heaven's reward, which the doctrine promised, has visibly withheld itself."
 ghazi_burden.303.a: "Understood."
 ghazi_burden.303.b: "Stop showing me war-defeat notifications."
 ghazi_burden.303.c: "Stop showing me any of these notifications."

 # ----- .304 INDICATOR: CAPITAL LOST -----
 ghazi_burden.304.title: "The Capital Lost"
 ghazi_burden.304.desc: "The seat itself, taken. The court of the ghazi cannot be a borrowed roof for long; the doctrine assumes a throne in a city, and that city has changed hands."
 ghazi_burden.304.a: "Understood."
 ghazi_burden.304.b: "Stop showing me capital-loss notifications."
 ghazi_burden.304.c: "Stop showing me any of these notifications."

 # ----- .305 INDICATOR: PROVINCE LOST -----
 ghazi_burden.305.title: "A Province Lost"
 ghazi_burden.305.desc: "Land that the ghazi promised to hold has been taken. Each such loss feeds the chroniclers' quiet judgment; the failure of small things is what discredits doctrines."
 ghazi_burden.305.a: "Understood."
 ghazi_burden.305.b: "Stop showing me province-loss notifications."
 ghazi_burden.305.c: "Stop showing me any of these notifications."

 # ----- .306 INDICATOR: PROVINCE GAINED -----
 ghazi_burden.306.title: "A Province Gained"
 ghazi_burden.306.desc: "Lands taken in war while the doctrine runs are read by the chronicles as credit. Lands taken from dar al-harb count double."
 ghazi_burden.306.a: "Understood."
 ghazi_burden.306.b: "Stop showing me province-gained notifications."
 ghazi_burden.306.c: "Stop showing me any of these notifications."

 # ----- .307 INDICATOR: CONSOLIDATION -----
 ghazi_burden.307.title: "A Mosque on Conquered Ground"
 ghazi_burden.307.desc: "On ground taken from dar al-harb, the doctrine's consolidation is now visible: a mosque, a ribat, a madrasa. This is what the ghaza is FOR, and the umma hears of it."
 ghazi_burden.307.a: "Understood."
 ghazi_burden.307.b: "Stop showing me consolidation notifications."
 ghazi_burden.307.c: "Stop showing me any of these notifications."

 # ----- .500 INTERNAL CAMPAIGN -----
 ghazi_burden.500.title: "The Muhtasib Awaits His Orders"
 ghazi_burden.500.desc: "The censor's apparatus stands ready. The lodges have been counted; the bazaar inventoried; the suspect quarters mapped. The muhtasib's notebooks are open in front of you; the senior jurists have come at your call. A campaign in the realm itself — internal ghaza — will read in the chronicles as proof that the doctrine is not merely for distant frontiers. The first such campaign will be loud; the third will be theater the poets mock. Choose, then, the kind of sin to be purged."
 ghazi_burden.500.a: "Close the taverns. Smash the wine jars. The bazaar's vice will be the first lesson."
 ghazi_burden.500.b: "Disperse the suspect shaykhs. The ghulat circles, the unsanctioned khanqahs, will not be permitted."
 ghazi_burden.500.c: "Move on the other branch. Their mosques transferred, their preachers escorted out, their endowments redirected."
