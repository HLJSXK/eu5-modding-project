l_english:
 # ============================================================
 # Matter of Tork / Matter of Tazik — consolidation disasters
 # ============================================================
 # Flavor text below is PLACEHOLDER-MECHANICAL. The user produces
 # narrative text and art in a parallel branch; these strings exist
 # so the disasters and events display readably in-game during
 # mechanics testing. Keys cover: disaster names, threshold events
 # 25/50/75, firing event 100, resolution events 500/501/502, plus
 # Tazik's 200 Safavid synthesis override.

 # --- Disasters ---------------------------------------------------
 matter_of_tork: "The Matter of Tork"
 matter_of_tork_desc: "Your legitimacy is settled — but it answered a question the Türk military constituency never asked. Their world ran on proximity to the golden line, and your crown has made that line irrelevant. They did not evaporate. They stand in the realm, armed, a third of the land and most of the cavalry, waiting to be told their place. Five answers exist. Twenty years to give one."

 # ============================================================
 # CUSTODY OF THE ULUS — the regency's fiction under audit
 # ============================================================
 custody_of_the_ulus: "The Borrowed Mandate"
 custody_of_the_ulus_desc: "Your legitimacy is borrowed, cheap, and high — the khan's name on your coins, the khan's seal on your decrees, the khan himself in your palace. What is under audit is not you but the FICTION: rival courts hold rival khans and call you usurper, and khans die, each replacement less credible than the last. One ulus, one khan, one steward. Make it true, ride it to the end, or watch the mask come off in public."

 custody_not_yet_fired_tt: "The Custody has not yet come under audit"
 custody_not_yet_completed_tt: "The Custody has not already been settled in this realm's history"
 custody_end_quiet_crown_tt: "The Quiet Crown — the fiction dropped on your own terms, from Sole Custody. You need sole custody for 24 months, and then the First option in the Kurultai decision."
 custody_end_yarliq_tt: "The Restored Yarliq — the khanate made real; the khan is your house now. You need sole custody for 24 months, and then the Second option in the Kurultai decision."
 custody_end_endured_tt: "Endured — three hundred months and two successions survived with the fiction intact"
 custody_end_expired_tt: "The Fiction Expired — the mask came off in public, and what stood behind it was an army"
 custody_kuriltai_gate_tt: "Sole Custody held for 24 months — no rival regency and no Borjigin sovereign standing in Erānzamīn"

 CUSTODY_RIVALS_TRACK: "Rival custodies standing"
 CUSTODY_SOLE_TRACK: "Sole Custody — months held"
 CUSTODY_CHARADE_TRACK: "The charade — successions survived"

 custody.31.title: "A Demand of Fealty"
 custody.31.desc: "[scope:custody_demanding_lord.GetName] sends riders to our court — and behind them, mules laden with robes of honor, silver, and a stipend pledged in writing. The message beneath the gifts is plain: read their khan's name in our khutbah, enter their house as a governor of the ulus, and these favors are the first of many. Refuse, and we keep our corner — and our quarrel."
 custody.31.a: "We accept. Their khan is our khan now; their gifts, our due."
 custody.31.b: "We refuse. Abu Saʿīd made us governors — we need no borrowed khan."

 custody.32.title: "A Governorate Sworn"
 custody.32.desc: "[scope:custody_sworn_gov.GetName] has read our khan's name in its khutbah and entered our house as a governorate of the ulus. The khalʿat is sent, the registers amended — and one more banner stands beneath ours, where before it stood alone."
 custody.32.a: "Let the registers show it. The ulus gathers."

 custody.33.title: "Fealty Refused"
 custody.33.desc: "[scope:custody_sworn_gov.GetName] has sent our robes back unworn and our silver uncounted. They keep their corner and their own name — and the slight is noted. A steward who must ask, and is refused, is a steward not yet sole."
 custody.33.a: "Noted. There are other roads to a governorate's oath."

 custody_demand_fealty: "Demand Fealty"
 custody_demand_fealty_desc: "Send robes and gifts to a non-subject Ilkhanate governorate and call it to swear. If it accepts, it becomes our ulus governorate — at the cost of gold, and of the legitimacy that asking betrays; the prestige of a steward whose name draws oaths is the recompense."
 custody_drop_khan: "Drop the Khan from the Khutbah"
 custody_drop_khan_desc: "Cease reading the custodian's khan in our Friday khutbah. The oath lapses, the subjecthood ends, and we stand alone again — for better or worse, our corner is our own."
 custody_press_claim: "Press the Custody"
 custody_press_claim_desc: "Name the pretenders and choose one to break. The roll of rival stewards — every court in Erānzamīn that holds a khan, puppet or Borjigin — is laid before you; pressing the claim against one grants the Erānzamīn succession casus belli, and the war is yours to declare."
 custody_proclaim_gate_tt: "Either a rival custody already put down, or no more than three left standing — a denunciation needs a winning hand"
 custody_sikka_gate_tt: "Either two rival custodies already put down, or no more than two left standing — the coinage cannot carry a contested name"
 custody_proclaim_true: "Proclaim the True Custody"
 custody_proclaim_true_desc: "Denounce the rival khans from minbar and chancery alike: theirs are captives dressed as sovereigns; ours is the khan. Five years of louder legitimacy — and the rivals hear every word."
 custody_secure_household: "Secure the Khan's Household"
 custody_secure_household_desc: "Tutors, guards, physicians, and an heir already identified. Khans die — the fiction does not have to die with them. The Endure path's insurance, bought once."
 custody_sikka_everywhere: "The Khan's Name on Every Coin"
 custody_sikka_everywhere_desc: "A coinage cycle in the khan's name through every mint you hold. The fiction maintained in silver, where everyone can read it."
 custody_summon_kuriltai: "Summon the Kuriltai of Confirmation"
 custody_summon_kuriltai_desc: "With no rival custody standing for two years, the assembly can be called — and what it confirms is YOUR choice: drop the fiction on your own terms (the Quiet Crown), or marry into the line and make the khanate real (the Restored Yarliq)."

 custody.1.title: "The Borrowed Mandate"
 custody.1.desc: "The khan signs what is put before him, and the realm runs in his name and your hand. But the mandate you hold is borrowed, and it is contested. Two truths now govern our fate:\n\nThe mandate is INDIVISIBLE. In other courts, other stewards seat other khans and call ours the puppet. While even one rival custody stands, our legitimacy bleeds — every khan but ours an argument that ours is false. We must break them: Press the Custody to take the field against a rival, or Demand Fealty of the lesser governorates who have sworn to no one, and bring them under our khan. When no rival is left and the realm has been ours alone for two years, we may Summon the Kuriltai — and there choose what we become: drop the fiction and take a crown of our own (and the door to Iran opens behind it), or wed the golden line and make the khanate real.\n\nThe mandate is MORTAL. Khans die, and each one we enthrone after is a thinner reproduction of the last — a prince, then a child, then a cousin of a cousin. Secure the Khan's Household to steady the succession; keep the Khan's Name on Every Coin to hold the fiction firm. Endure long enough across enough deaths and the regency can be made permanent as a gūrkān's throne. Run out of credible khans, and the mask comes off in public — and we are left only what we always were beneath it: an army, holding a realm.\n\nThe panel tracks all three: the rivals standing, the months we have ruled alone, the deaths the fiction has survived."
 custody.1.a: "One ulus. One khan. One steward — and it will be us."

 custody.30.title: "In Whose Name Do We Govern?"
 custody.30.desc: "We hold our corner well enough — but a governor governs in someone's name, and the registers grow uneasy with a blank where the khan's should be. Riders bring word of who is strong this season: the great stewards counting their musters, each minting his own khan, each willing to take our oath. We may read one of their names in our khutbah and shelter under his banner — or wait, as we have waited, and answer to no one yet."
 custody.30.a: "We swear to [scope:steward_1.GetName] — the strongest banner standing."
 custody.30.b: "We swear to [scope:steward_2.GetName]."
 custody.30.c: "We swear to [scope:steward_3.GetName]."
 custody.30.d: "Not yet. We were made governors by Abu Saʿīd, you know — not by these horse-thieves with their borrowed khans."

 custody.40.title: "The Kuriltai of Confirmation"
 custody.40.desc: "No rival khan signs anything anywhere in Erānzamīn. The begs and the bitikchis assemble on the plain as their grandfathers did, and what they have come to confirm is whatever you tell them. The custody war is won, and victory has bought exactly one thing: the right to decide what the regency becomes."
 custody.40.a: "The Quiet Crown — the khan's name comes off the coins. Ours goes on."
 custody.40.b: "The Restored Yarliq — marry into the line. The khanate is real, and it is ours."

 custody.50.title: "The Long Regency"
 custody.50.desc: "Twenty-five years. Two khans buried with honor, a third signing what is put before him. No court in Erānzamīn remembers a time before your custody, and the fiction has acquired the dignity of furniture. It can be institutionalized — the gurkan's way, a son-in-law's throne, stable and lesser — or dropped at a survivor's price, or ridden onward toward the place where all fictions end."
 custody.50.a: "Institutionalize it. The Gurkani throne — lesser, and ours forever."
 custody.50.b: "Drop it. A survivor's price is still a price worth paying."
 custody.50.c: "Ride on. The charade has carried us this far."

 custody.90.title: "The Fiction Expires"
 custody.90.desc: "There is no one left to enthrone. The line of credible khans has run out — a child, a girl, a cousin of a cousin, each tried, each spent — and the realm watched the mask come off in public. What stands behind it is what always stood behind it: an army holding a realm, and the army's assent as the only writ that runs."
 custody.90.a: "Then rule by the sword's assent, in our own name."

 STATIC_MODIFIER_NAME_custody_proclaimed_mod: "The True Custody Proclaimed"
 STATIC_MODIFIER_DESC_custody_proclaimed_mod: "The rival khans denounced from minbar and chancery: captives dressed as sovereigns. Ours is the khan."
 STATIC_MODIFIER_NAME_custody_household_mod: "The Khan's Household Secured"
 STATIC_MODIFIER_DESC_custody_household_mod: "Tutors, guards, physicians, and an heir identified. Khans die; the fiction need not die with them."
 STATIC_MODIFIER_NAME_custody_sikka_mod: "The Khan's Name in Silver"
 STATIC_MODIFIER_DESC_custody_sikka_mod: "A coinage cycle in the khan's name through every mint — the fiction maintained where everyone can read it."
 STATIC_MODIFIER_NAME_custody_restored_yarliq_mod: "The Restored Yarliq"
 STATIC_MODIFIER_DESC_custody_restored_yarliq_mod: "The throne bound to the Borjigin line by marriage and enthronement. The fiction consummated into fact — the khan is your house now."
 STATIC_MODIFIER_NAME_custody_expired_scar: "The Mask Came Off"
 STATIC_MODIFIER_DESC_custody_expired_scar: "Every chancery from Cairo to Delhi watched the fiction die in public. What stood behind it was an army holding a realm."
 STATIC_MODIFIER_NAME_custody_contested: "The Duel of Khans"
 STATIC_MODIFIER_DESC_custody_contested: "Rival courts hold rival khans, and each calls the other's a captive in robes. Every rival custody standing makes the mandate more argument and less fact — the drag deepens with each one."

 gurkani_regime: "The Gurkani Regime"
 gurkani_regime_desc: "The fiction institutionalized: rule as gūrkān — son-in-law of the line — with a tame khan whose name adorns and obliges nothing. No more successions to survive, no more rivals to outbid. Lesser than a crown, and stable forever: the Timurid bargain."

 # --- The deferral: Ilkhanate Governorate ---------------------------
 ilkhanate_governorate: "Ilkhanate Governorate"
 ilkhanate_governorate_desc: "You make no claim to the ulus. You administer your corner of it — defensible, solvent, and unthreatening — as the Injuid did at Fars and the Karts did at Herat, and you wait to see who wins. A governor may declare fealty for a steward and become his ulus governorate, the peaceful submission the Chinggisid contest absorbs. No legitimacy pump, no reach: a governor is not a king."

 custody_declare_fealty: "Declare Fealty"
 custody_declare_fealty_desc: "Choose a steward from the roll of those who hold a khan — regency, Borjigin, or contender in earnest — and submit as his ulus governorate. You keep your house and your corner; he gets your levies, your loyalty in his wars, and your weight behind his claim."

 ulus_governorate: "Ilkhanate Governorate"
 ulus_governorate_desc: "A governorate that has decided to pretend everything is fine in the state, swearing fealty to a Khan and obeying him or his loyal regent."

 # --- Forming Persia (IRA_f) gates ---------------------------------
 ira_f_legitimacy_tt: "The question of right is settled in your favor: the farr-i īzadī vindicated or endured, the ghazi's wager won (Sword of Islam) or held (Guardian of the Thughur), or the murid bond sworn"
 ira_f_matter_tt: "The Place of the Sword is settled: the Matter of Tork resolved (and not by the hosts founding a rival on your flank) — or never posed, in a realm without a Türk military constituency"

 # --- Matter of Tork: trigger & end tooltips ----------------------
 matter_tork_not_borjigin_tt: "The ruler is not of the Borjigin line (a Borjigin has no Matter — his right to the ulus runs through the blood)"
 matter_tork_tribal_base_tt: "The Türk hosts are a real presence in the realm (a substantial tribesmen population) — no Matter without a constituency to ask the question"
 matter_tork_not_yet_fired_tt: "The Matter of Tork has not yet been faced"
 matter_tork_not_yet_completed_tt: "The Matter of Tork has not already been settled in this realm's history"
 matter_tork_end_resolved_tt: "A disposition has run its course — the Türk's place is settled"
 matter_tork_end_synthesis_tt: "The murid bond has been sworn — the question is dissolved in the vilayat"
 matter_tork_end_lost_realm_tt: "The realm has fallen from contention for Erānzamīn"

 # --- Matter of Tork: explainer tooltips & GUI tracks -------------
 matter_tork_iranization_explainer_tt: "The cabinet turns to the long work. Run cultural assimilation through the cabinet; completion needs 240 months AND the realm fully Iranized (Türk-Tazik axis at +90 or beyond — the whole reform stack must cooperate, not just this program)."
 matter_tork_expulsion_explainer_tt: "Ten years of grim work. The hosts will be moved on in tranches; the cavalry arm goes with them; what coalesces beyond the border will not love you."
 matter_tork_aftermath_explainer_tt: "The payoff is applied now — and suppressed for fifty years by the aftermath. When the gap expires, the post-tribal state stands alone."
 MATTER_TORK_HORIZON_TRACK: "Months without an answer"
 MATTER_TORK_IRANIZATION_TRACK: "Iranization — the long work"
 MATTER_TORK_EXPULSION_TRACK: "Expulsion — the hosts moved on"

 # --- Matter of Tork: created tags --------------------------------
 MATTER_TORK_MARCH: "Uç Beylik"
 MATTER_TORK_EXILE_HOST: "The Exiled Hosts"

 # --- Matter of Tork: disposition claim buttons --------------------
 claim_iranization: "Dissolve Them Into Us"
 claim_iranization_desc: "Co-optation, the historical default. Amirs onto iqtaʿ rolls, cavalry onto provincial registers, villages up the pasture margins — Türk becomes Tazik over a generation. The cabinet does this and nothing else for twenty years; completion needs the realm actually Iranized. Risk: low. Cost: time, and the cavalry tradition."
 claim_marcher_compact: "Point Them Outward"
 claim_marcher_compact_desc: "The hosts become marcher-lords on the dar al-harb frontier — a March of huge tribal strength: militarily formidable, fiscally poor, and unruly by construction. The ghazi can swear them to the holy war; a king of the farr can only hire them. Risk: medium, deferred — strong marches have founded dynasties before."
 claim_murid_bond: "Bind Them to the Guide"
 claim_murid_bond_desc: "The murid-murshid bond replaces the khan-bond: the hosts enter the throne's own order as disciples, cavalry kept whole and bound stronger than blood. Requires the realm steeped in mysticism. The jurists will name it heresy — and for a ghazi of the law, swearing it means weathering their full fury."
 claim_expulsion: "Remove Them From the Realm"
 claim_expulsion_desc: "Drive the hosts out — steppe, Anatolia, Hindustan. Ten years of grim work buys an interior with no tribal question; the cavalry arm goes with them, and what coalesces beyond the border will not love you. Risk: high."
 claim_eradication: "End Them as a Class"
 claim_eradication_desc: "Not moved, not bound, not bought — ended. The class being destroyed defects entire, at once: a civil war against your own sword arm, NOW, followed by fifty years without one. Survive both, and no Persianate realm in memory has stood so unanswerable. Risk: extreme, front-loaded; reward back-loaded."
 matter_of_tazik: "The Matter of Tazik"
 matter_of_tazik_desc: "The cities are restive. Sayyids preach against the throne in the bāzārs; dervish lodges multiply on the road from Ardabīl. The urban realm and the tribal court do not see one another, and the divan begs the sovereign to choose."

 # --- Trigger tooltips -------------------------------------------
 safavid_synthesis_polarity_tt: "Spiritualism ≥ 75, Mysticism ≥ 75, Religious Unity ≥ 80% (polarity triggers TBD)"

 # --- Rebel breakaway names (used as `name` in create_rebel) -----
 matter_of_tork_breakaway: "The Türkmen Confederation"
 matter_of_tork_breakaway_desc: "A breakaway of the tribal hosts, formed in revolt against the Tazik-leaning throne."
 matter_of_tazik_breakaway: "The Urban Realm"
 matter_of_tazik_breakaway_desc: "A breakaway of the cities, the divan, and the dervish lodges, formed in revolt against the Türk-leaning throne."

 # ============================================================
 # MATTER OF TORK EVENTS — the five dispositions
 # ============================================================

 # --- .1 Announcement
 matter_of_tork.1.title: "The Place of the Sword"
 matter_of_tork.1.desc: "The realm is yours, and the khutba says so without flinching. But riders return from the pasturelands with a question no khutba answers. The amirs of the hosts — whose grandfathers ranked themselves by the distance of their blood from the golden line — sit in their encampments with nothing above them but you, and no reason written anywhere that they should kneel. They have not rebelled. They are waiting. What is their place now?"
 matter_of_tork.1.a: "Convene the council. They will have an answer."

 # --- .2 The Council on the Hosts (approach choice)
 matter_of_tork.2.title: "The Council on the Hosts"
 matter_of_tork.2.desc: "The viziers, the qadi, and the master of the muster stand before the throne, and each has brought a memorandum. Four roads are laid on the carpet. None is the answer itself — each is a direction of preparation, and the realm can change its mind later, though the years spent will not return. The hosts wait outside the door, and the door is theirs to break, given time."
 matter_of_tork.2.a: "We must reduce our reliance on these barbarians."
 matter_of_tork.2.b: "Iran is the Beacon of Civilization. Even these half-men can be illuminated by its light."
 matter_of_tork.2.c: "We must forge a new Identity to bind everyone into a greater whole."
 matter_of_tork.2.d: "Why tame what we can unleash upon our enemies?"
 matter_of_tork.2.e: "The council adjourns. We will decide later."

 # --- Approach tooltips
 matter_tork_approach_ghulam_tt: "We want to be rid of them — but we are too reliant. Begin building the ghulam corps: the slave-army answerable to no estate. Prepares Expulsion and Eradication above all, though a realm may build the corps and still keep the Türks. Unlocks the corps actions; the amirs will notice."
 matter_tork_approach_beacon_tt: "The long work of Iranization: amirs onto iqtaʿ rolls, their sons into the chancery, villages up the pasture margins. Unlocks the assimilation privileges and actions. The amirs must first be seated at the diwan — Niẓām al-Mulk's nightmare as the price of his solution."
 matter_tork_approach_vilayat_tt: "Court the lodges. The realm tilts toward the mystical pole (+0.2/month toward Mysticism) and the jurists seethe. Unlocks the lodge endowments and the shaykhs' invitation — and, for the committed, the road to the Hidden Imam. The Murid Bond needs Mysticism at −50."
 matter_tork_approach_unleash_tt: "The hosts are for war — use them. Tribal levies ride larger and prouder while you carve out the frontier zone their March will hold. The March must be real land: big enough, rich enough, and bordering someone who is not us."

 # --- Change Approach button
 matter_tork_change_approach: "Change Approach"
 matter_tork_change_approach_desc: "Re-convene the Council on the Hosts. The horizon clock does not reset — years spent are years lost — but everything earned (privileges granted, corps built, axis moved, land conquered) is kept. Only the ambient direction swaps."

 # --- Approach 1: ghulam actions & events --------------------------
 matter_tork_purchase_ghulams: "Purchase Ghulam Levies"
 matter_tork_purchase_ghulams_desc: "Buy boys from the Caucasus markets and raise them in the fostering households: salaried, converted, loyal to the stipend and the throne. One corps tier per purchase. Needs an administrator (a ghulam administration privilege, or the ghulam reform), the fostering households, and the physical plant: barracks levels totaling 1 for the first tier, 3 for the second, 6 for the third — with the slave caravans institutionalized for tiers beyond the first."
 matter_tork_barracks_ladder_tt: "Barracks levels: tier I needs 1, tier II needs 3 plus the slave caravans, tier III needs 6 plus the slave caravans"
 matter_tork_declare_inju: "Declare Royal Inju"
 matter_tork_declare_inju_desc: "Declare a tribal zone the crown's own demesne — the inju of the Ilkhans, turned against the hosts who invented it. The pasture is broken, the herds moved off, the registers extended to land that never knew them. Cheap in gold; the cost is political. Eradication needs five of these declared; Expulsion needs two."
 matter_tork_institutionalize_caravans: "Institutionalize the Slave Caravans"
 matter_tork_institutionalize_caravans_desc: "Found the Caucasus road as an institution: three caravanserais on the route, and a fortified door onto the infidel frontier — your castle facing their fort-less land. Conquer their forts or demand their destruction at the peace table. Unlocks corps tiers II and III."
 matter_tork_caravanserai_tt: "Caravanserai levels totaling at least three across the realm (one level-3 caravanserai qualifies)"
 matter_tork_inju_target_tt: "An owned location with a tribal pasture not yet declared inju — the declaration covers its whole province"
 matter_tork_slave_frontier_tt: "A castle or fortress of ours adjacent to unfortified land of a non-Muslim realm — the door the caravans come through"
 matter_tork_expulsion_inju_tt: "At least two zones declared Royal Inju — the hosts cannot be marched off land that still feeds them"
 matter_tork_eradication_inju_tt: "At least five zones declared Royal Inju — you cannot end a class whose economic base still stands"

 matter_of_tork.66.title: "An Amir's Open Protest"
 matter_of_tork.66.desc: "The zone the crown has just written into its own registers wintered his clients' herds for three generations, and he has come to court to say so — publicly, in front of the envoys, with the deed of an old yarliq in his hand. The word 'inju' does not impress him. His grandfather took this land FROM an inju."
 matter_of_tork.66.a: "Compensate him — grazing rights written elsewhere, and a robe."
 matter_of_tork.66.b: "The inju stands. He may petition the registers like anyone else."

 STATIC_MODIFIER_NAME_matter_royal_inju: "Royal Inju"
 STATIC_MODIFIER_DESC_matter_royal_inju: "Crown demesne, declared and registered. The pasture is broken; the herds are gone; the assessor rides where the herdsman rode."
 STATIC_MODIFIER_NAME_matter_slave_caravans: "The Slave Caravans"
 STATIC_MODIFIER_DESC_matter_slave_caravans: "The Caucasus road, franchised: caravanserais staffed, the border castle garrisoned, the contracts sealed. The corps grows by purchase, not by levy."
 matter_tork_anger_explainer_tt: "The amirs and the tribes can see what the parade ground means. If either estate stays below 30% satisfaction, the plot is realized within two further years — the hosts will defect en masse rather than wait to be replaced."

 matter_of_tork.62.title: "The First Muster"
 matter_of_tork.62.desc: "Three hundred purchased men stand in ranks on the new parade ground — Georgian and Circassian boys grown into soldiers who own nothing, owe everything, and answer to no amir. The drillmasters present them for review. What the realm sees today will be told in every encampment by spring."
 matter_of_tork.62.a: "Let them march past."

 matter_of_tork.63.title: "The Amirs Watch the Parade Ground"
 matter_of_tork.63.desc: "A delegation of amirs attends the corps' review uninvited. They watch in silence — the salaried ranks, the new barracks, the muster rolls kept by clerks. On leaving, their eldest asks the chamberlain, politely, what the throne intends to do with so many soldiers who have no tribe."
 matter_of_tork.63.a: "Honor them at the review stand. The corps guards them too."
 matter_of_tork.63.b: "The corps is not their business. Show them out."

 matter_of_tork.64.title: "A Georgian Officer"
 matter_of_tork.64.desc: "The corps has produced its first commander worth the name — a Georgian convert who came north in a slave caravan twenty years ago and now drills three regiments with a precision no tribal levy ever knew. He kneels to the throne alone. There is no uncle, no pasture, no lineage behind him to be negotiated with."
 matter_of_tork.64.a: "Give him the command. This is what the corps is FOR."

 matter_of_tork.60.title: "The Amirs Smell the Plot"
 matter_of_tork.60.desc: "A captain of the hosts was found drunk and talking: 'the throne buys Georgians so it can be rid of us.' He was not wrong, and everyone in the bazaar knows it. The encampments are quiet in the way a steppe is quiet before weather. If the hosts are left this unhappy much longer, they will not wait to be replaced."
 matter_of_tork.60.a: "Watch the encampments. And hurry."

 matter_of_tork.61.title: "The Plot Realized"
 matter_of_tork.61.desc: "They did not wait. The hosts have read the parade ground correctly and drawn the conclusion the throne hoped to schedule for a more convenient decade: the standards are up, the levies ride against us, and the new corps — half-built, half-drilled — is all that stands on our side of the question."
 matter_of_tork.61.a: "Then the corps fights its first war early."

 # --- .10 Iranization claimed
 matter_of_tork.10.title: "The Long Work Begins"
 matter_of_tork.10.desc: "The decision is taken in the chancery, not the camp: the hosts will be dissolved into the realm. Amirs onto the iqtaʿ rolls — landed, registered, taxed in honor. Tribal cavalry onto provincial registers. Qanat-settlement creeping up the pasture margins, one village at a time. No decree will announce it; in two generations the Türk will be a Tazik gentleman who keeps fine horses."
 matter_of_tork.10.a: "Set the cabinet to it. Everything else can wait."

 # --- .11 Iranization complete
 matter_of_tork.11.title: "Türk Into Tazik"
 matter_of_tork.11.desc: "The work of a generation is done. The amirs hold deeds where their fathers held herds; their sons read Persian and compete for chancery posts; the pasture margins are fields, and the fields pay tax. The hosts were not broken — they were absorbed, and what absorbed them is richer for it. The cavalry tradition thins. The state deepens."
 matter_of_tork.11.a: "The registers run from city to steppe, unbroken."

 # --- .20 Marcher Compact
 matter_of_tork.20.title: "The Marches of the Sword"
 matter_of_tork.20.desc: "The answer is the frontier. The hosts ride out — not in exile but in commission: marcher-lords on the edge of the dar al-harb, armed, pastoral, useful, and far from the capital. Their restlessness is now the realm's sword-edge, pointed outward. Their strength is now their own problem — and, one day, perhaps ours."
 matter_of_tork.20.a: "Let the marches stand. Let them burn outward."

 # --- .30 Murid Bond
 matter_of_tork.30.title: "The Bond of the Vilāyat"
 matter_of_tork.30.desc: "The khan-bond is dead; long live the murid-bond. What ran to the golden line now runs to the throne itself — not as sultan but as murshid, the perfect guide, whose order the hosts enter as disciples. Their rank is their devotion. The cavalry is kept whole, undiminished, and bound by something older than salary and stronger than blood. The jurists understand precisely what has been claimed, and they will not forgive it."
 matter_of_tork.30.a: "The hosts kneel — not to the crown, but to the guide who wears it."

 # --- .40 Expulsion claimed
 matter_of_tork.40.title: "The Hosts Will Go"
 matter_of_tork.40.desc: "The decision is final: the realm will be clean of them. Steppe, Anatolia, Hindustan — the direction is theirs; the departure is not. Ten years of columns on the roads, of pastures emptied and watch-posts built, of grim work that the chronicles will write down quietly. The cavalry arm goes with them, every horse of it."
 matter_of_tork.40.a: "Begin. The realm will be one thing, finally."

 # --- .41 First tranche
 matter_of_tork.41.title: "The Eastern Hosts Move On"
 matter_of_tork.41.desc: "The first columns have crossed out of the realm — herds, households, standards furled. The pastures behind them stand empty in a way no one alive remembers. Those who remain watch the roads and understand."
 matter_of_tork.41.a: "Continue."

 # --- .42 Second tranche
 matter_of_tork.42.title: "The Pastures Empty"
 matter_of_tork.42.desc: "The second wave is larger and angrier. There are burnings now, and reprisals, and amirs who swore loyalty last year riding east with their levies intact. The muster rolls thin with every season. The interior, behind it all, grows quiet."
 matter_of_tork.42.a: "Continue. It is too late for any other answer."

 # --- .43 Expulsion complete
 matter_of_tork.43.title: "Beyond the Border, a Confederation"
 matter_of_tork.43.desc: "The last hosts have crossed — and stopped. Just past the frontier the exiles have done what expelled hosts have always done: found each other, found a khan, and founded a state. The realm within is homogeneous, governable, and clean. The realm without has a new neighbor that remembers every road it was marched down."
 matter_of_tork.43.a: "We knew. We chose it anyway."

 # --- .50 Eradication confirm
 matter_of_tork.50.title: "The Final Answer"
 matter_of_tork.50.desc: "What is proposed has no precedent and no name the chancery will write down: the Türk military class, ended — not moved, not bound, not bought. Ended as a class. The moment the first iqtaʿ is voided they will know, all of them, at once; and the cavalry that is to be destroyed will defect entire, to a rival, to a breakaway, to some shaykh of the failed ribats. The sword arm must be cut off and survived before anything is gained. The gain, if the realm lives to see it: no tribal question, ever again."
 matter_of_tork.50.a: "End them. The realm will be answerable to no estate."
 matter_of_tork.50.b: "No. Not this. The question stands."

 # --- .51 Revolt survived
 matter_of_tork.51.title: "A Realm Without Tribes"
 matter_of_tork.51.desc: "The standards are down, the encampments burned, the class that rode against the realm broken in the field and finished in the registers. What remains is something no Persianate state has been in living memory: a realm with no tribal question at all. It remains only to survive what comes next — fifty years without a sword arm, while the slave-army is bought, trained, and bound, and every neighbor counts our horses."
 matter_of_tork.51.a: "Begin the rebuilding. Tell the frontier commanders to dig in."

 # --- .90 Horizon: the tribes answer
 matter_of_tork.90.title: "They Stopped Waiting"
 matter_of_tork.90.desc: "Twenty years without an answer was the answer. A non-khan who offers neither war, nor devotion, nor a place is not worth following — and the hosts have stopped following. The standards going up in the pastures are not a petition. They are a departure, armed."
 matter_of_tork.90.a: "Then it will be settled the old way."

 # --- .91 Defection war lost
 matter_of_tork.91.title: "The Flank Bleeds"
 matter_of_tork.91.desc: "The war is over and the confederation stands — carved out of our pastures, mounted on our horses, ruled by amirs who learned our weaknesses from the inside. The realm is maimed, and the chronicles will say it was maimed by silence: the question stood for twenty years, and no one answered it."
 matter_of_tork.91.a: "Hold what remains."

 # --- .92 Defection war won
 matter_of_tork.92.title: "An Answer Written in Blood"
 matter_of_tork.92.desc: "The defection is crushed. The hosts that rode out lie under the grass they wanted, and the question is answered — by a sword we did not choose to draw, at a price no disposition would have asked. The realm holds. It is less than it could have been, and it knows it."
 matter_of_tork.92.a: "Bury them. Bury the question with them."

 # --- .99 Eradication failed
 matter_of_tork.99.title: "The Class That Would Not Die"
 matter_of_tork.99.desc: "The attempt has failed in the worst of the foreseen ways. The class marked for ending has carved its state out of ours instead, and every horseman between here and the frontier knows what was attempted and who attempted it. The realm is maimed, the name is stained, and the new confederation on the flank does not forget."
 matter_of_tork.99.a: "Survive it. Nothing else is left to do."

 # ============================================================
 # MATTER OF TAZIK EVENTS
 # ============================================================

 # --- .1 Announcement
 matter_of_tazik.1.title: "The Matter of Tazik"
 matter_of_tazik.1.desc: "The cities are murmuring. The sayyids of the great mosques will not look the chamberlain in the eye. The bāzārī close their shutters when the tax-rider passes. The Matter of Tazik has begun."
 matter_of_tazik.1.a: "Acknowledged. We will weather this."

 # --- .25 Petition from the bāzār
 matter_of_tazik.25.title: "A Petition from the Bāzār"
 matter_of_tazik.25.desc: "The guild-masters of the central bāzār have submitted a formal grievance — taxes too heavy, the qāḍī's writ too thin, the Türk garrison too rough. Hear, delay, or punish?"
 matter_of_tazik.25.a: "Hear them in open court. Concede where we can."
 matter_of_tazik.25.b: "Refer to the qāḍī. Let the slow law settle them."
 matter_of_tazik.25.c: "Confiscate the shops of the loudest. The bāzār will learn."

 # --- .50 Sayyid preaches against the throne
 matter_of_tazik.50.title: "A Sayyid Preaches Against the Throne"
 matter_of_tazik.50.desc: "A descendant of the Prophet has begun to preach in the Friday mosques that our rule is unrighteous. The crowds gather. The chamberlain awaits orders — kill, invite, or endow?"
 matter_of_tazik.50.a: "Have him quietly removed. The pulpit is the sword's enemy."
 matter_of_tazik.50.b: "Invite him to court. Honor — and silence — through proximity."
 matter_of_tazik.50.c: "Endow a madrasa in his name. Make him our patron-saint."

 # --- .75 Cities shut their gates
 matter_of_tazik.75.title: "The Cities Have Shut Their Gates"
 matter_of_tazik.75.desc: "Word from the road: the gates of Isfahān, of Shīrāz, of Tabrīz have closed against our tax-rider. The dervishes preach openly in the squares. March, open the gates ourselves, or settle through the vizier-regent if a path has been kept open."
 matter_of_tazik.75.a: "March in and break the rebellion. Cities answer to swords."
 matter_of_tazik.75.b: "Open the gates to the dervishes — concede the streets."
 matter_of_tazik.75.c: "Convene the Vizier-Regent. The sovereignty of the divan will hold us together."

 # --- .100 Disaster fires
 matter_of_tazik.100.title: "The Urban Realm Breaks Free"
 matter_of_tazik.100.desc: "Within a fortnight a new realm has been proclaimed in the great cities — vizier-led, sayyid-blessed, dervish-protected. The treasuries of the bāzār have closed to us. The civil war is on."
 matter_of_tazik.100.a: "So be it. We will retake the cities."

 # --- .200 Safavid synthesis override
 matter_of_tazik.200.title: "The Qizilbash Synthesis"
 matter_of_tazik.200.desc: "The dervish and the divan, the pole of mysticism and the pole of spirit, have aligned beneath the throne. What threatened to break the realm has instead remade it. The Matter resolves itself in the new synthesis."
 matter_of_tazik.200.a: "A new realm. A new order."

 # --- .500 Suppress
 matter_of_tazik.500.title: "Praetorian Erānzamīn"
 matter_of_tazik.500.desc: "The cities are broken open. The sayyids are silenced, the dervish lodges scattered, the bāzārī taxed at sword-point. The realm holds — but the divan now answers to the captains, not the captains to the divan."
 matter_of_tazik.500.a: "Let the garrisons stand."

 # --- .501 Concede
 matter_of_tazik.501.title: "A Dual Realm"
 matter_of_tazik.501.desc: "The urban breakaway has been recognized in white peace. The realm of Erānzamīn is two now — court and city, throne and bāzār."
 matter_of_tazik.501.a: "We will live with this. For now."

 # --- .502 Co-opt — Investiture at the City
 matter_of_tazik.502.title: "The Investiture at the City"
 matter_of_tazik.502.desc: "The war drags on; the path of co-option remains open. The vizier-regent of the breakaway offers an oath of investiture — to serve the throne, in exchange for the sovereignty of the divan being formally recognized. Accept?"
 matter_of_tazik.502.a: "Accept. The cities fold peacefully back into the realm."
 matter_of_tazik.502.b: "Refuse. The war will be settled by arms."

 # ============================================================
 # MATTER OF TORK — DISPOSITION MODIFIERS
 # ============================================================

 # --- Transient: the answer given
 STATIC_MODIFIER_NAME_matter_answer_given: "An Answer Given"
 STATIC_MODIFIER_DESC_matter_answer_given: "The hosts have been told their place. The dread of silence ends; the work itself remains."

 # --- A. Iranization
 STATIC_MODIFIER_NAME_matter_iranization_underway: "The Long Work"
 STATIC_MODIFIER_DESC_matter_iranization_underway: "The cabinet is dissolving the hosts into the realm — amirs onto iqtaʿ rolls, cavalry onto provincial registers, villages up the pasture margins. It is doing nothing else."
 STATIC_MODIFIER_NAME_matter_iranized_realm: "Türk Into Tazik"
 STATIC_MODIFIER_DESC_matter_iranized_realm: "The hosts were absorbed, not broken. The amirs hold deeds; their sons compete for chancery posts; the cavalry tradition thins and the state deepens."

 # --- B. Frontier Confederation
 STATIC_MODIFIER_NAME_matter_marcher_compact: "The Marcher Compact"
 STATIC_MODIFIER_DESC_matter_marcher_compact: "The hosts ride the dar al-harb frontier as sworn marchers of the holy war — armed, distant, and pointed outward."
 STATIC_MODIFIER_NAME_matter_marcher_compact_mercenary: "Hired Marches"
 STATIC_MODIFIER_DESC_matter_marcher_compact_mercenary: "The hosts hold the frontier for pay, not for faith. A king of the farr can exile them to the edge; he cannot give them a mission there."

 # --- C. Sufi Synthesis
 STATIC_MODIFIER_NAME_matter_murid_bond: "The Murid Bond"
 STATIC_MODIFIER_DESC_matter_murid_bond: "Loyalty that ran to the golden line runs to the murshid on the throne. The cavalry is whole, undiminished, and bound stronger than blood. The jurists will not forgive it."
 STATIC_MODIFIER_NAME_matter_zandaqa_storm: "The Cry of Zandaqa"
 STATIC_MODIFIER_DESC_matter_zandaqa_storm: "The orthodox apparatus the throne itself built condemns the claim the throne has just made. The qadis preach against their patron; the muhtasib's stick points at the palace."

 # --- D. Expulsion
 STATIC_MODIFIER_NAME_matter_expulsion_underway: "The Hosts Moved On"
 STATIC_MODIFIER_DESC_matter_expulsion_underway: "Columns on the roads, pastures emptying, muster rolls thinning. Grim work, written down quietly."
 STATIC_MODIFIER_NAME_matter_expelled_hosts: "A Realm Made One"
 STATIC_MODIFIER_DESC_matter_expelled_hosts: "The interior is homogeneous, governable, and clean. The registers run unbroken from city to pasture-turned-field."
 STATIC_MODIFIER_NAME_matter_cavalry_gap: "The Missing Arm"
 STATIC_MODIFIER_DESC_matter_cavalry_gap: "The cavalry left with the hosts — every horse of it. Until a new army stands, the realm fights short-handed."
 STATIC_MODIFIER_NAME_matter_exiled_confederation: "Forged in Eviction"
 STATIC_MODIFIER_DESC_matter_exiled_confederation: "A confederation of the expelled — riding with nothing to lose and a long memory of the roads it was marched down."

 # --- E. Eradication
 STATIC_MODIFIER_NAME_matter_eradication_underway: "The Ending of a Class"
 STATIC_MODIFIER_DESC_matter_eradication_underway: "The realm is fighting its own sword arm. The class marked for ending defects entire, and what it cannot take it burns."
 STATIC_MODIFIER_NAME_matter_post_tribal_state: "The Post-Tribal State"
 STATIC_MODIFIER_DESC_matter_post_tribal_state: "No tribal question, no amir bargain, no estate behind the army. A realm answerable to nothing but its own registers."
 STATIC_MODIFIER_NAME_matter_eradication_aftermath: "The Fifty-Year Gap"
 STATIC_MODIFIER_DESC_matter_eradication_aftermath: "The sword arm is amputated; the slave-army is being bought, trained, and bound from nothing. Every neighbor counts our horses. Survive this, and the post-tribal state stands alone."

 # --- Ghulam corps tiers & muster quality
 STATIC_MODIFIER_NAME_matter_ghulam_corps_1: "Palace Ghulam Corps"
 STATIC_MODIFIER_DESC_matter_ghulam_corps_1: "A few hundred purchased men — drilled, salaried, loyal to the stipend and the household."
 STATIC_MODIFIER_NAME_matter_ghulam_corps_2: "Ghulam Regiments"
 STATIC_MODIFIER_DESC_matter_ghulam_corps_2: "A standing force with its own barracks and registers. The muster no longer depends on anyone's goodwill."
 STATIC_MODIFIER_NAME_matter_ghulam_corps_3: "The Army Within the Army"
 STATIC_MODIFIER_DESC_matter_ghulam_corps_3: "Three corps of men with no tribe, no pasture, and no uncle to negotiate with. The amirs know which army the throne trusts."
 STATIC_MODIFIER_NAME_matter_ghulam_drilled: "Drilled to the Drum"
 STATIC_MODIFIER_DESC_matter_ghulam_drilled: "The first muster marched like a wall. The realm noticed."
 STATIC_MODIFIER_NAME_matter_ghulam_teething: "Teething Troubles"
 STATIC_MODIFIER_DESC_matter_ghulam_teething: "Bad drillmasters, sold-on equipment, two desertions before dawn. The corps will learn — expensively."

 # --- Approach 4: the march, earned ---------------------------------
 matter_tork_release_march: "Release the March"
 matter_tork_release_march_desc: "Cut the conquest loose as a march of the sword. Requires a proclaimed Great Raid, a fifth of the theater and no fewer than 25 locations under your banner, half a million tribesmen settled in your holdings there, peace, and a seat whose area is nearly all yours. Every holding in the theater rides out with the seat: the hosts you sent, the begs who lead them, and the land they took, a tributary sultanate under a beg of their own greatest people, free to wage its own wars, pointed away from you. Militarily formidable, fiscally poor, unruly by construction. Releasing it seals the compact and settles the Matter."

 matter_of_tork.85.title: "The Begs Quarrel Over the Vanguard"
 matter_of_tork.85.desc: "Word of the coming march has reached every encampment, and the begs have begun to position themselves — gifts to the court, raids to advertise prowess, a knife-fight at a wedding. Whoever leads the march will found a house. They all know it. So do we."
 matter_of_tork.85.a: "Note the ablest of them. The march will need him — and watching."

 # --- Dehqan revival (the amirs estate, refounded) -------------------
 dehqan_revival: "The Dehqan Revival"
 dehqan_revival_desc: "The Sasanian-descended gentry — the class that kept the Shāhnāma alive and that the iqtaʿ system destroyed — rearmed from above: gentry horsemen on service tenure, mustered through the chancery's rolls. The asvārān, six centuries late. Slower and politically dearer than slave-soldiers; native."
 dehqan_service_tenure_registers: "Service Tenure Registers"
 dehqan_service_tenure_registers_desc: "The gentry's land is conditional — held against the registers, not against memory. The leash, and the gentry know it is a leash."
 dehqan_shahnama_endowment: "The Shāhnāma Endowment"
 dehqan_shahnama_endowment_desc: "Recitations in the garrison towns, illustrated copies for the tenure-holders, the asvār past as living genealogy. The new class needs a self-image, and Ferdowsī wrote it three centuries early."

 # --- Approach 3: khanqah & dhikr actions ----------------------------
 matter_tork_endow_khanqah: "Endow a Khanqah"
 matter_tork_endow_khanqah_desc: "Build a lodge at the crown's expense — dormitories, a kitchen, a tomb to gather around. The murid bond needs four lodges standing: a devotion requires somewhere to BE."
 matter_tork_dhikr_festivals: "Sponsor the Dhikr Festivals"
 matter_tork_dhikr_festivals_desc: "A season of public devotion — drums, circles, the names of God in the squares. The realm tilts toward the mystical pole; the camps love it; the jurists keep a register."
 matter_tork_lodge_network_tt: "At least four sufi lodges standing in the realm — the bond needs a network for the murids to be in"

 # --- Approach 2: madrasa & shahnama actions -------------------------
 matter_tork_endow_madrasa: "Endow the Madrasa of the Registers"
 matter_tork_endow_madrasa_desc: "A school for the amir sons and the new assessors — revenue law, survey method, chancery Persian. For ten years the cabinet teaches instead of administering: the long work is paid for in the coin of government itself."
 matter_tork_shahnama_recension: "Commission the Shāhnāma Recension"
 matter_tork_shahnama_recension_desc: "A great illustrated recension — the court binding itself into the Iranian kingly past in pigment and gold, for every envoy to see. Once per realm; the book outlives the dynasty either way."

 # --- Approach 4: raid & charter actions -----------------------------
 matter_tork_great_raid: "Proclaim the Great Raid"
 matter_tork_great_raid_desc: "Name the theater and point the hosts at it. The proclamation grants a decade of license, a war claim against every ruler holding land there, and sets the hosts in motion: once you hold ground in the theater, tribesmen from your greatest pasturelands begin riding to it every month. Conquer a fifth of the theater and you may release your holdings there as a march. The lands of the Prophet's community are no theater for a raid; nearly everywhere else is."
 matter_tork_yurt_charters: "Grant the Yurt"
 matter_tork_yurt_charters_desc: "Move a whole il by yarligh. Your richest tribal reservoir sends three quarters of its hosts to your largest holding in the raid theater, a year on the road, and the begs ride with their people. Pasture rights are written into the registers where they arrive. The homeland quiets by exactly as much as the frontier hardens."

 STATIC_MODIFIER_NAME_matter_madrasa_registers: "The Madrasa of the Registers"
 STATIC_MODIFIER_DESC_matter_madrasa_registers: "The cabinet is teaching, not administering. The long work, paid for in the coin of government."
 matter_tork_yurt_beachhead_tt: "You hold at least one location in the designated raid theater"
 matter_tork_release_need_tt: "At least a fifth of the theater's locations fly your banner"
 matter_tork_release_size_tt: "You hold at least #Y 25 locations#! in the theater"
 matter_tork_release_tribes_tt: "At least #Y 500,000 tribesmen#! live in your theater holdings"
 STATIC_MODIFIER_NAME_matter_raid_designated: "Theater of the Great Raid"
 STATIC_MODIFIER_DESC_matter_raid_designated: "The hosts of a distant throne are pointed here. Conquest in this region feeds their migration, and enough of it lets their ruler release his holdings here as a march. While the banner stands, the tribes of this land keep their tents, their tongue, and their rite: no settling, no melting into the villages, no new prayers."
 cb_great_raid: "The Great Raid"
 cb_great_raid_desc: "The raid was proclaimed and this realm holds land in its theater. The hosts do not ask twice."
 GREAT_RAID_WAR_NAME: "$ORDER$$ATTACKER.GetAdjectiveWithFlag$ Great Raid on $DEFENDER.GetNameWithFlagNoTooltip$"
 STATIC_MODIFIER_NAME_matter_great_raid: "The Great Raid"
 STATIC_MODIFIER_DESC_matter_great_raid: "The hosts ride outward under the throne's blessing — larger, prouder, and pointed away."
 STATIC_MODIFIER_NAME_matter_yurt_charter: "Yurt Charter"
 STATIC_MODIFIER_DESC_matter_yurt_charter: "Pasture rights, written and sealed. The land the hosts are promised quiets."

 # --- Approach 2: beacon action, privileges, reform & events --------
 matter_tork_sponsor_qanat: "Sponsor Qanat Settlement"
 matter_tork_sponsor_qanat_desc: "Pay the muqannis to drive a channel up a pasture margin. A village takes root where the herds wintered; the registers follow the water; the assimilation runs faster where the wheat grows. One sponsorship per five years."
 iqta_commutation: "Iqtaʿ Commutation"
 iqta_commutation_desc: "Tribal levy obligations commuted into landed military service. The amir trades the host's muster for a deed and a salary schedule — what a tribal elite in decline actually wants is land security, and the chancery knows it."
 chancery_commissions: "Chancery Commissions for Amir Sons"
 chancery_commissions_desc: "The amirs' sons sit the examinations and enter the diwan — with honor, with stipends, and with Persian. The generational mechanism of every Iranization that ever worked."
 salaried_pastoral_levies: "Salaried Pastoral Levies"
 salaried_pastoral_levies_desc: "The tribes keep the herds and the pasture-roads; the fighting men ride for pay, not for the lineage. Identity Iranizes. The pastoralism stays."
 ilat_compact: "The Īlāt Compact"
 ilat_compact_desc: "The tribes as a part of the realm's economy: herds taxed and counted, pasture-roads in the registers, wool and horses in the bazaar. Pastoral, prosperous, and no longer a separate political order — Iranization of identity without sedentarization."

 matter_of_tork.80.title: "The Amir's Son Takes the Examination"
 matter_of_tork.80.desc: "The eldest son of a frontier amir has sat the chancery examination — in Persian, on the revenue law, beside the sons of scribes. He passed third of his year. His father pretends displeasure and tells every encampment on the road home. In a generation this is how the question answers itself."
 matter_of_tork.80.a: "Commission him. Let the encampments hear THAT, too."

 matter_of_tork.81.title: "The Qanat Reaches the Pasture"
 matter_of_tork.81.desc: "The channel the crown paid for has reached the winter pasture at last, and a village is already growing around the outlet — mud walls, a mill, a registered headman. The herders who wintered there for six generations are watching the wheat come up on their ground."
 matter_of_tork.81.a: "Celebrate the village. The settled order is the realm's order."
 matter_of_tork.81.b: "Compensate the herders — grazing rights written elsewhere."

 matter_of_tork.82.title: "Resistance in the Margins"
 matter_of_tork.82.desc: "A surveyor dead in a dry streambed; a new village's mill burned; herds driven deliberately across young wheat. The margins have understood what the program is, and some of them have decided what they think of it."
 matter_of_tork.82.a: "Suppress it. The program does not slow for arson."
 matter_of_tork.82.b: "Accommodate — write the grazing corridors into the registers."

 STATIC_MODIFIER_NAME_matter_qanat_settlement: "Qanat Settlement"
 STATIC_MODIFIER_DESC_matter_qanat_settlement: "A crown-paid channel and a village taking root where the herds wintered. The registers follow the water."

 # --- Approach 3: vilayat action, privilege & events ----------------
 matter_tork_invite_shaykhs: "Invite the Shaykhs of the Order"
 matter_tork_invite_shaykhs_desc: "Bring the masters of the great lodges to court — honored, housed, and listened to. A shaykh joins the court, and a door opens that the jurists would prefer stayed shut: with the realm leaning far enough toward the mystical pole, the claim of the Hidden Imam can be made."
 dervish_lodge_endowments: "Lodge Endowments"
 dervish_lodge_endowments_desc: "Waqf revenue committed to the dervish orders — khanqahs roofed, kitchens stocked, silsilas honored. The lodges flourish beyond the crown's fiscal reach, and the realm tilts toward the pole they preach."

 matter_of_tork.70.title: "The Claim of the Hidden Imam"
 matter_of_tork.70.desc: "The shaykh has stopped speaking in courtesies. What the lodges offer is not advice but a theory of the throne itself: the realm aligned to the House of the Prophet, the ruler as the Imam's shadow until the Hidden One returns, the hosts re-sworn not to a khan's line but to a living guide. It is conversion — of the dynasty, then of the realm, by every minbar and every lodge. The jurists will call it the end of everything they guard. They will be correct."
 matter_of_tork.70.a: "Make the claim. The realm turns to the House of the Prophet."
 matter_of_tork.70.b: "Not this. The lodges may preach; the throne keeps its creed."

 matter_of_tork.71.title: "A Shaykh Preaches in the Camps"
 matter_of_tork.71.desc: "Reports from the pastures: a shaykh of the order has been preaching among the encampments, and the hosts — who never once filled a Friday mosque — crowd his circle by the hundred. The old loyalty ran to a bloodline. What he offers runs to a living man. The camps have always known how to follow one of those."
 matter_of_tork.71.a: "Note it well. THIS is what the bond will be made of."

 matter_of_tork.72.title: "The Jurists' Ultimatum"
 matter_of_tork.72.desc: "The chief qadi comes to court with the heads of the law schools behind him, and what they carry is not a petition. The throne's courtship of the lodges has a name in their books, and the books prescribe its remedy. Abandon it — or be named from every minbar that still answers to the law."
 matter_of_tork.72.a: "Cave. The courtship ends; the lodges are left to their dhikr."
 matter_of_tork.72.b: "Defy them. The realm needs what the lodges have."

 matter_of_tork.73.title: "Red Headgear"
 matter_of_tork.73.desc: "It began in one lodge and is now in every bazaar between here and the frontier: the young men of the orders have taken to a red cap, wound twelve times. It marks a devotion that drills, marches, and waits to be called. No one ordered it. That is exactly what makes it worth watching."
 matter_of_tork.73.a: "Let them wear it. We may yet give it something to do."

 STATIC_MODIFIER_NAME_matter_jurists_fury: "The Jurists' Fury"
 STATIC_MODIFIER_DESC_matter_jurists_fury: "The law schools preach against the throne's new friends, from every minbar that still answers to the law."
 STATIC_MODIFIER_NAME_matter_red_headgear: "The Red Headgear"
 STATIC_MODIFIER_DESC_matter_red_headgear: "A devotion that drills and marches. No one ordered it — that is what makes it formidable."

 # --- Ghulam barracks building & production method
 ghulam_barracks: "Ghulam Barracks"
 ghulam_barracks_desc: "Purpose-built barracks for the new corps: dormitories, drill grounds, a mosque, and the salary office. Where the mamluk barracks of the old powers were inherited, these are designed — and it shows."
 ghulam_barracks_maintenance: "$ghulam_barracks$"

 # --- Ghulam privileges (estate privilege names use base registry)
 diwan_ghulam_administration: "Dīwān al-ʿArḍ"
 diwan_ghulam_administration_desc: "The army ministry: muster rolls, salary registers, the corps as a column in the chancery's books. The CORRECT ghulam system — salaried, registered, answerable to no estate — and the amirs' monopoly on violence, broken by accountants."
 amirs_ghulam_administration: "Amir-Held Commands"
 amirs_ghulam_administration_desc: "The amirs supervise the new corps as they have supervised everything military. Politically painless — and the Saljuq failure mode: slave soldiers administered by amirs become amir households within a generation."
 ghulam_fostering_households: "Fostering Households"
 ghulam_fostering_households_desc: "Village households paid to raise and school the purchased boys before palace service — the layer every ghulam system actually ran on."

 # --- Cultural-weight rebalance auto-modifiers (05_cultural_weight_auto)
 AUTO_MODIFIER_NAME_mongol_thin_stratum: "A Thin Stratum"
 AUTO_MODIFIER_DESC_mongol_thin_stratum: "A military elite with no urban base and no literary corpus of its own — already Persianizing at court and Turkicizing in the saddle. The empire is vast; the culture is thin."
 AUTO_MODIFIER_NAME_iranian_civilizational_weight: "The Persianate Continuum"
 AUTO_MODIFIER_DESC_iranian_civilizational_weight: "The corpus, the chancery language, the cities — a civilization that absorbs its conquerors regardless of who sits the throne."
 AUTO_MODIFIER_NAME_han_civilizational_weight: "The Sinic Continuum"
 AUTO_MODIFIER_DESC_han_civilizational_weight: "The examination classics, the bureaucratic register, the demographic mass — dynasties pass through it; it remains."
 AUTO_MODIFIER_NAME_mashriqi_civilizational_weight: "The Arabic Continuum"
 AUTO_MODIFIER_DESC_mashriqi_civilizational_weight: "The language of revelation and law, the scholarly belt of Baghdad and Basra — weight that no conquest dislodges."
 AUTO_MODIFIER_NAME_iranian_core_city_native: "Heart of the Persianate"
 AUTO_MODIFIER_DESC_iranian_core_city_native: "A city of the Persian literary world under a throne of its own civilization. The corpus, the chancery, and the crown speak the same language."
 AUTO_MODIFIER_NAME_iranian_core_city_foreign: "The Conqueror's Bargain"
 AUTO_MODIFIER_DESC_iranian_core_city_foreign: "A city of the Persian literary world under a foreign throne. The court learns the chancery's language, not the other way around — whoever holds this city is being absorbed by it."
 AUTO_MODIFIER_NAME_han_core_city_native: "Heart of the Sinic World"
 AUTO_MODIFIER_DESC_han_core_city_native: "A city of the examination classics under a throne of its own civilization."
 AUTO_MODIFIER_NAME_han_core_city_foreign: "The Conqueror's Bargain"
 AUTO_MODIFIER_DESC_han_core_city_foreign: "A city of the examination classics under a foreign throne. Dynasties pass through this civilization; it remains — and it keeps the dynasty's children."
 AUTO_MODIFIER_NAME_mashriqi_core_city_native: "Heart of the Arabic World"
 AUTO_MODIFIER_DESC_mashriqi_core_city_native: "A city of the scholarly belt under a throne of its own civilization."
 AUTO_MODIFIER_NAME_mashriqi_core_city_foreign: "The Conqueror's Bargain"
 AUTO_MODIFIER_DESC_mashriqi_core_city_foreign: "A city of the scholarly belt under a foreign throne. The language of revelation does not bend to the court; the court bends."

