 STATIC_MODIFIER_DESC_matter_approach_vilayat: "The court courts the lodges. The realm tilts toward the mystical pole, and the jurists keep a register of every tilt."
 STATIC_MODIFIER_NAME_matter_approach_unleash: "The Hosts Unleashed"
 STATIC_MODIFIER_DESC_matter_approach_unleash: "The tribes ride larger and prouder — they are being used for the thing they are for, and they know it."

