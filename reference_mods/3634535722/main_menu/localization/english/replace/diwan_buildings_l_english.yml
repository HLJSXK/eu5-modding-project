l_english:
 central_diwan: "Dīwān of the Realms"
 central_diwan_desc: "The Dīwān al-Mamālik — the realm-grand chancery. From its archives the cadastres, registers, and audit rolls of the entire kingdom run; from its halls the ṣāḥib-dīwān's writ goes out under the throne's seal. Niẓām al-Mulk under Alp Arslan and Malikshāh, the Juvaynī brothers under Hülegü and Abaqa, Rashīd al-Dīn under Ghazan, Mustawfī of Qazvīn auditing the late Ilkhans — every great Persianate state has rested on the dīwān that Buyid Iraq and Sāmānid Bukhara first systematized.\n\nThe throne legitimates; the dīwān governs. Nobles staff its benches, burghers promote up to fill out its scribal ranks, and the realm picks up administrative reach in exchange for the standing of the ʿulamāʾ-bureaucratic class. One per realm, in the capital of a kingdom-rank realm, and only once the country either drifts toward the Tāzīk pole on its own or pays for the chancery class through the Restoration of the Persian Bureaucracy. Supersedes the Regional Dīwān when built."
 central_diwan_maintenance: "Chancery Operations"
 central_diwan_maintenance_desc: "The ṣāḥib-dīwān's office consumes paper by the bale, books for its scribal training, and fine cloth for the khilʿa robes that mark its dignitaries — the material idiom of the chancery class, kept loyal to the seal rather than to the amīrs."

 regional_diwan: "Regional Dīwān"
 regional_diwan_desc: "The chancery seat of a duchy-rank Persianate sultanate, or the regional chancery of a major Persian or Arab urban capital under a Türk-led realm too small to seat the Dīwān al-Mamālik proper. A real Persian secretariat — registers, audits, qāḍī's records, the postal chain into the surrounding regions — but not yet the realm-grand chancery.\n\nThe Injuids ran exactly this kind of office from Shiraz: a serious Persian dīwān, but they were amirs of Fars, not Pādshāhs. The Jalayirid administration of Baghdad is its Türk-led counterpart, where the chancery persisted because the city could not be governed without it. One per realm, in the capital, at duchy rank or higher — no axis test; this is the historical baseline of any Persianate state in the iran-zamīn region. Upgraded into the Dīwān of the Realms once the realm reaches kingdom rank and qualifies for it."
 regional_diwan_maintenance: "Regional Chancery"
 regional_diwan_maintenance_desc: "The duchy-rank chancery's working office — paper for the registers, books for precedent and procedure, fine cloth for the secretariat's modest dignities. Lighter than the imperial chancery's bale-counts, heavier than a single provincial branch."

 persianate_court: "Royal Court"
 persianate_court_desc: "The Bārgāh — the sultan's audience hall and the seat of his household. The ḥājib announces; the cup-bearers, the standard-bearer, the keeper of the seal, the master of the wardrobe each hold their hereditary office; the khilʿa robes of honor are distributed from this hall, and from it the Friday khuṭba is read in the sultan's name. The Persianate court does not govern — the dīwān governs — but it legitimates: it is where the realm sees its ruler, and where its great men receive their standing from his hand.\n\nFrom Ghaznavid Lashkari Bāzār through Saljuq Iṣfahān and Ilkhanid Tabrīz, the great Persianate states built their courts as the physical idiom of royal authority. One per realm, in the capital, in any persianate sultanate."
 persianate_court_maintenance: "Court Establishment"
 persianate_court_maintenance_desc: "The ḥājib's office and the sultan's household consume the full register of court materials — fine cloth for the khilʿa, glass and marble for the audience hall, paper and books for the chancery's flow through the throne, and a measure of coin for the salaries of the chamberlains and the office-holders."

 local_diwan: "Local Dīwān"
 local_diwan_desc: "The provincial dīwān — a chancery branch in the province's chief town. The walī's secretariat: tax rolls, land registers, qāḍī's records of waqf and contract, audits of bazaar weights and measures. Where it sits, the state writes — and its proximity carries the throne's authority outward, into the surrounding countryside, much further than the capital's reach alone could project.\n\nThe Persianate state extends through paper and seal, not through cavalry. The local dīwān is the iqṭāʿ's mirror image: that grant was a Tāzīk *instrument* with Türk consequences; this is a Tāzīk *institution* proper. Nobles staff it — the local secretariat — and burghers promote into the noble layer to fill the scribal ranks behind them. One per province, in a town or larger, and only buildable where the chancery already has a grip on the place (local control above 50%)."
 local_diwan_maintenance: "Provincial Chancery"
 local_diwan_maintenance_desc: "The walī's scribal office: paper for the registers, books for the law and the precedent, fine cloth for the office's dignitaries, and a small purse of coin for the clerks' monthly wage."

 local_diwan_one_per_province_tt: "Only one Local Dīwān may exist per province."
 regional_diwan_tooltip: "The Regional Dīwān can only be built in the capital of a duchy-rank or Kingdom rank Persianate Sultanate, or once per Area for an Empire rank Persianate Sultanate."