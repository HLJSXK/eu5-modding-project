 # ----- The Ilkhanid mint: dirham-i Ghāzānī and the silver standard -----
 ilkhanid_mint: "Ilkhanid Mint"
 ilkhanid_mint_desc: "The dār al-ḍarb of the imperial silver standard. Ghazan's coinage reform of 1297 — promulgated under his vizier Rashīd al-Dīn — unified the chaotic post-conquest currency of Iran around the dirham-i Ghāzānī: a silver coin of fixed weight (one mithqāl), uniform purity, and a uniform bilingual epigraphy struck the same way from Tabrīz to Kirmān. The yām post carried the new dies; the muḥtasib of every market enforced the new rate; the bullion of Badakhshān and Kirmān flowed into the dies of the imperial mints and out as a single currency that the Genoese and the Gujaratis alike accepted at sight.\n\nThe mint is more than a coinage factory — it is the fiscal-administrative spine of the post-Mongol Iranian polity. Six houses anchored the system in 1337: Tabrīz (the imperial capital and the largest mint of the realm), Sulṭāniyya (Öljaytü's new capital and its companion mint), Baghdad (the Iraqi metropolis and the inheritor of the ʿAbbāsid dār al-ḍarb), Herāt (the Khurāsānī gateway and the bullion-sink for the Indus trade), Yazd (the silver of the central plateau and the entrepôt of the Kirmān route), and Kirmān itself (the great copper source of the Iranian east). One mint per city — the dies, the assayer, and the muḥtasib's stamp are not duplicated. For gameplay reasons, I have moved them a bit from their historical locations, but the mint's role as a fiscal-administrative institution remains the same."
 ilkhanid_mint_maintenance: "Mint Operations"
 ilkhanid_mint_maintenance_desc: "The mint's daily round: paper for the strike-registers and the assayer's weights, books of the great fiscal manuals (Naṣīr al-Dīn al-Ṭūsī's risāla on assaying, the Risāla-yi Falakiyya of ʿAbd Allāh ibn Muḥammad al-Māzandarānī), silver bullion from Badakhshān and Kirmān as the substance of the dirham, and copper from Anārak and the Kirmānī mines for the subsidiary fulūs that lubricate the bazaar's small change."

 # ----- The kāshī guild: Persian fritware, the chīnī of the Islamic world -----
 kashi_guild: "Kāshī Guild"
 kashi_guild_desc: "The fritware workshop — Iran's engineered answer to Chinese porcelain. Abū'l-Qāsim of Kāshān, writing in 1301 from a family that had supplied the Ilkhanid court for three generations, set down the recipe in his ʿArāʾis al-Jawāhir: ten parts ground quartz, one part glass frit, one part white clay, fired twice, the lustre painted on in a reducing atmosphere of dung-smoke. The result is chīnī — that is what the makers called it, that is what the buyers called it, that is what the market for it was: the substitute for the Song and Yuan porcelains the Indian Ocean trade brought to Hormuz.\n\nKāshān gave the industry its name (kāshī, the Kāshānī tile); the Abū Ṭāhir dynasty of potters gave it its dynasty; the great mihrab-tiles of Qom, Mashhad-i Rezā, and Naṭanz gave it its public face. Saveh, Sulṭānābād, and the Mamluk Fusṭāṭ kilns gave it its provincial reach. The lajvardīna and the mīnāʾī wares of the 13th–14th centuries are the luxury tier; the everyday stonepaste bowl is the bulk tier. A pottery_guild handles the earthenware below; the kāshī_guild handles the chīnī above."
 kashi_guild_maintenance: "Kāshī Workshop"
 kashi_guild_maintenance_desc: "The stonepaste recipe at workshop scale: sand from the quartz pits as the body of the paste, clay as the binder fraction, glass for the frit (ground and remelted to the recipe's specification — frit is glass before it is anything else), coal for the double firing (the lustre demands a second pass in a reducing kiln, and the kāshī kiln runs hotter than the Chinese porcelain kiln), and a modest tools load for the wheels, the moulds, and the painters' brushes."

 # ----- The kāshī manufactory: the Safavid blue-and-white industry -----
 kashi_manufactory: "Kāshī Manufactory"
 kashi_manufactory_desc: "The Safavid blue-and-white industry — the heir of the kāshī guild, scaled up for the seventeenth-century world market. When the Ming-Qing transition (1644 onward) shut down the Jingdezhen kilns for a generation, the VOC's Persian factor at Bandar ʿAbbās redirected the European porcelain trade to Kirmān and Mashhad. Persian potters, working from Ming exemplars and from the kāshī tradition's own command of stonepaste, supplied the Dutch, the English, and the Portuguese with blue-and-white in the Chinese taste for forty years.\n\nThe manufactory is the workshop in industrial form — larger kilns, division of labour between throwers, painters, and glazers, a body recipe adjusted toward Chinese ratios (less frit, more clay, a whiter paste), and the cobalt under-glaze blue that became the chīnī of the Safavid age. Obsoletes the kāshī guild as the manufactory tier of the chain — the workshop becomes the shop floor."
 kashi_manufactory_maintenance: "Kāshī Manufactory Operations"
 kashi_manufactory_maintenance_desc: "The bulk-production recipe: a larger sand load for the quartz body at manufactory scale, more clay for the whiter Safavid paste, less frit per unit (the recipe adjusts toward the Chinese ratio), and the coal and tools loads scaled to a kiln complex rather than a single workshop. The output is porcelain — by market niche if not by petrology, the chīnī of the Indian Ocean and the European table."

 # ----- The naqshband chain: the Persian drawloom -----
 naqshband_guild: "Naqshband Guild"
 naqshband_guild_desc: "The kārgāh-i nāqshband at guild scale — the master pattern-binder, two or three apprentices on the figure-harness, a handful of drawboys, and a single drawloom under the muḥtasib's quality stamp. Naqshband means pattern-binder: the craftsman who ties the figure-harness of the drawloom, encoding the design into the loom's mechanics before a single weft is thrown. The shaykh Bahā' al-Dīn Naqshband (d. 1389), eponym of the great Sufi order, took his name from this trade — his family were drawloom masters in a village outside Bukhārā.\n\nThe craft is centuries old in Iran — Sasanian in its first form, ʿAbbāsid in its tirāz workshops, Saljuq in its brocade industry, and by 1337 fully operational across Yazd, Kāshān, Tabrīz, Mosul, and the Khurāsānī cities. Mustawfī names Yazdi brocade explicitly in the Nuzhat al-Qulūb (c. 1340). The output is zarbāf, kamkhā, dībā, mukhmal — the figured silks that travel as diplomatic gifts, khilʿa-robes of investiture, and the foreign-trade tonnage of the Persianate ports."
 naqshband_guild_maintenance: "Drawloom Weaving"
 naqshband_guild_maintenance_desc: "The drawloom at guild scale. The figure-harness is tied to the pattern — often after a paper draft from a court naqshshābāz or a copybook of the workshop's own — and the drawboys lift the figured warp threads on the naqshband's call while the weaver throws the weft below. Silk comes from the worm-rearing districts of Gīlān, Māzandarān, and Jurjān; the output is fine_cloth with the drawloom premium over the standard silk_weavers."
 naqshband_workshop: "Naqshband Workshop"
 naqshband_workshop_desc: "The kārgāh-i nāqshband at workshop scale — the Safavid century's expansion of a centuries-old craft. Where the guild had one drawloom under a master, the workshop runs several side by side, with division of labour between the naqshband (who ties the figure-harness), the bāf (who throws the weft), the drawboys (who lift the figured warp on the naqshband's call), and the ustādh-kār (who runs the floor).\n\nThis is the silk-luxury infrastructure that supplied the Polish kontusz sashes, the Mughal khilʿa-robes, the Ottoman caftans of state, and the brocaded vestments of the Catholic clergy of Italy and Iberia — all woven on Iranian drawlooms, often by Iranian hands carried to the workshops of Bursa and Venice. The craft does not industrialize in this period; the workshop is its ceiling. Greater output is the work of more drawlooms in more cities — the naqshband does not become a factory. The Safavid kārkhāna scale-up of the seventeenth century is the same workshop run by the state at the state's scale, not a new building type."
 naqshband_workshop_maintenance: "Drawloom Weaving"
 naqshband_workshop_maintenance_desc: "The drawloom at workshop scale. Multiple drawlooms run in parallel under the ustādh-kār, the naqshband-masters coordinating across pattern-cycles; the figured warp is dressed in standardised lifts and the polychrome silks come off the loom faster than the guild can match. Same silk input as the standard silk_weavers workshop, higher fine_cloth output — the drawloom premium compounds with workshop scale."


