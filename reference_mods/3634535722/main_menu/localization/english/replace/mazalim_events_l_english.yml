l_english:
 mazalim_events.1.title: "The Silent Realm"
 mazalim_events.1.desc: "For months, you have asked [traitor_vizier.GetFullName] to prepare the army for the campaigning season and to gather the funds needed for the state's works. Each time, the Grand Vizier returns with empty hands and a mournful face. 'The peasants have fled,' [traitor_vizier.GetSheHe] says. 'The land is poor, the harvest failed, and the people are rebellious. There is no gold in the treasury, and no men for the levies.'\n\nYou look out from the palace. The city seems quiet. Too quiet. The 'famous men'—the wealthy merchants and notables—are nowhere to be seen. The Vizier assures you that he is doing all he can to maintain order in these dark times, but a unease settles in your heart."
 mazalim_events.1.a: "Where have all the people gone?"
 mazalim_events.2.title: "The Shepherd and the Dog"
 mazalim_events.2.desc: "Troubled by the state of the realm, you ride out into the desert to hunt and clear your mind. Miles from the capital, in the heat of the day, you encounter a lone shepherd sitting by a tent. Nearby, hanging from a dry tree, is a large sheepdog, dead and swaying in the wind.\n\nYou ask the man: 'Why hang your only protector?'\n\nThe shepherd replies: 'This dog was my amin, my trusted one. I fed him and let him sleep by my fire. But I noticed my flock shrinking day by day. One afternoon, I watched from the hill and saw a wolf approach. My dog did not bark. He went to the wolf, and they played together. The wolf took a sheep, and the dog returned to sleep. He had made a pact: safety for himself, in exchange for my livelihood.'\n\nThe realization hits you like a lightning bolt. The subjects are the flock. The Vizier is the dog."
 mazalim_events.2.a: "I must return to the capital at once."
 mazalim_events.3.title: "The Gates of Hell"
 mazalim_events.3.desc: "You return to the capital not with pomp, but in secret. You bypass the Diwan and go straight to the state prisons. You order the gates opened and demand to see the 'criminals' [traitor_vizier.GetFullName] has locked away.\n\nIt is a house of horrors. One man cries out: 'I had a fine garden, and the Vizier wanted it. When I refused, he accused me of treason.' Another says: 'I am a merchant who refused to pay the Vizier's private tax.' A third: 'I am an auditor who found the missing gold.'\n\nThere is no poverty in the land. The wealth has simply been stolen by the one you trusted to guard it. The silence of the realm is the silence of fear."
 mazalim_events.3.a: "This ends today. Summon the people!"
 mazalim_events.3.b: "The web is too thick... I cannot cut it."
 mazalim_events.4.title: "The Seven Day Execution"
 mazalim_events.4.desc: "For seven days, the heralds have cried out the crimes of [traitor_vizier.GetFullName]. The people have gathered in the square to see the 'dog' brought to justice. The Vizier stands in chains, surrounded by the 'wolves'—the corrupt officers and scribes who fed on the people.\n\nThe sword is in your hand. But how deep will you cut? To purge the entire rot would leave the state administration and military crippled for years. To spare some would be to compromise justice for stability. The people watch, waiting to see if you are truly the Shadow of God."
 mazalim_events.4.a: "Absolute Justice: Purge them ALL."
 mazalim_events.4.b: "Blame the Bureaucrats: Protect the Warriors."
 mazalim_events.4.c: "Blame the Enforcers: Protect the Administrators."
 mazalim_call_tooltip: "This will initiate a special Mazalim Session where all pending grievances will be heard."
