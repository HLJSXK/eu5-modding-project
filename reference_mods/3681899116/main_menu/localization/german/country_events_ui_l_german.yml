l_german:
 COUNTRY_EVENTS_HEADER: "Country Events"
 COUNTRY_EVENTS_LIST_HELP: "Browse your country's own dynamic historical events. Events are grouped by historical window when available. Select one to inspect its description, documented requirements, and what happens."
 COUNTRY_EVENTS_LIST_TITLE: "Event List"
 COUNTRY_EVENTS_NOT_CURATED_DESC: "No own dynamic historical country events were found for the current tag inside the game's event files. Some formable countries simply do not have native DHE content in the base game; that is a game-content limitation, not a mod failure."
 COUNTRY_EVENTS_NOT_CURATED_TITLE: "No own dynamic historical events were detected for this country"
 COUNTRY_EVENTS_NO_NATIVE_TAG_DESC: "Europa Universalis V's base game does not assign its own dynamic historical events directly to this tag. Paradox did not create a native DHE set for it. If events appear here, they are inherited or lineage-compatible content, so the system is working as intended."
 COUNTRY_EVENTS_NO_NATIVE_TAG_TITLE: "This formed country has no native DHE events"
 COUNTRY_EVENTS_OUTCOMES_LABEL: "Effekt"
 COUNTRY_EVENTS_PERIODS_LABEL: "Historical periods"
 COUNTRY_EVENTS_REQUIREMENTS_LABEL: "Documented requirements"
 COUNTRY_EVENTS_SELECT_EVENT_DESC: "Choose an event from the list on the left to load its readable summary."
 COUNTRY_EVENTS_SELECT_EVENT_TITLE: "Select an event"
 COUNTRY_EVENTS_STATIC_REFERENCE_NOTE: "Readable sections are generated automatically from the event script and its historical metadata."
 COUNTRY_EVENTS_TEXT: "Events"
 TAB_TOOLTIP_COUNTRY_EVENTS_LEFT_CLICK: "Open or close the events tab"
 TAB_TOOLTIP_COUNTRY_EVENTS_TEXT: "Open the automatically generated event reference for your current country."
 TAB_TOOLTIP_COUNTRY_EVENTS_TITLE: "Country Events"
