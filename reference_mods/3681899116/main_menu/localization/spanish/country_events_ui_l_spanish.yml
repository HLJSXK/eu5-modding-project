l_spanish:
 COUNTRY_EVENTS_HEADER: "Eventos del pais"
 COUNTRY_EVENTS_LIST_HELP: "Consulta los eventos historicos dinamicos propios de tu pais. Se agrupan por ventana historica cuando existe. Selecciona uno para ver su descripcion, sus requisitos documentados y lo que ocurre."
 COUNTRY_EVENTS_LIST_TITLE: "Lista de eventos"
 COUNTRY_EVENTS_NOT_CURATED_DESC: "No se encontraron country_event historicos dinamicos propios para el tag actual dentro de los ficheros de eventos del juego. Algunos paises formables simplemente no tienen DHE propios en el juego base; eso es una limitacion del contenido de Paradox, no un fallo del mod."
 COUNTRY_EVENTS_NOT_CURATED_TITLE: "No se detectaron eventos historicos dinamicos propios para este pais"
 COUNTRY_EVENTS_NO_NATIVE_TAG_DESC: "Europa Universalis V no asigna eventos historicos dinamicos propios directamente a este tag en el juego base. Paradox no creo un set DHE nativo para el. Si aqui aparecen eventos, son contenido heredado o compatible con tu linaje, asi que el sistema esta funcionando correctamente."
 COUNTRY_EVENTS_NO_NATIVE_TAG_TITLE: "Este pais formado no tiene eventos DHE propios"
 COUNTRY_EVENTS_OUTCOMES_LABEL: "Efecto"
 COUNTRY_EVENTS_PERIODS_LABEL: "Periodos historicos"
 COUNTRY_EVENTS_REQUIREMENTS_LABEL: "Requisitos actuales"
 COUNTRY_EVENTS_SELECT_EVENT_DESC: "Elige un evento de la lista de la izquierda para cargar su resumen legible."
 COUNTRY_EVENTS_SELECT_EVENT_TITLE: "Selecciona un evento"
 COUNTRY_EVENTS_STATIC_REFERENCE_NOTE: "Las secciones legibles se generan automaticamente a partir del script del evento y de sus metadatos historicos."
 COUNTRY_EVENTS_TEXT: "Eventos"
 TAB_TOOLTIP_COUNTRY_EVENTS_LEFT_CLICK: "Abrir o cerrar la pestana de eventos"
 TAB_TOOLTIP_COUNTRY_EVENTS_TEXT: "Abre la referencia automatica de eventos para tu pais actual."
 TAB_TOOLTIP_COUNTRY_EVENTS_TITLE: "Eventos del pais"
