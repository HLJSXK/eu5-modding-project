# north america
C_CAN:
  name: "Canada"
  adjective: "Canadian"
  geography_triggers:
    - region = region:canada_region
  overlord_triggers:
    - any_primary_or_accepted_culture ?= { has_culture_group = culture_group:british_group }

C_QBC:
  name: "Québec"
  adjective: "Québécois"
  geography_triggers:
    - region = region:canada_region
  overlord_triggers:
    - any_primary_or_accepted_culture ?= { has_culture_group = culture_group:french_group }

C_NWE:
  name: "New England"
  adjective: "New English"
  geography_triggers:
    - region = region:east_coast_region
  overlord_triggers:
    - or = { tag = ENG tag = GBR }

C_NWF:
  name: "New France"
  adjective: "New French"
  geography_triggers:
    - region = region:east_coast_region
  overlord_triggers:
    - tag = FRA

C_LOU:
  name: "Louisiana"
  adjective: "Louisianan"
  geography_triggers:
    - region = region:great_plains_region
  overlord_triggers:
    - any_primary_or_accepted_culture ?= { has_culture_group = culture_group:french_group }

# central america
C_CUB:
  name: "Cuba"
  adjective: "Cuban"
  geography_triggers:
    - area = area:cuba_area
  overlord_triggers:
    - any_primary_or_accepted_culture ?= { has_culture_group = culture_group:iberian_group }

C_JAM:
  name: "Jamaica"
  adjective: "Jamaican"
  geography_triggers:
    - province_definition = province_definition:xaymaca_province
  overlord_triggers:
    - any_primary_or_accepted_culture ?= { has_culture_group = culture_group:british_group }

C_BHM:
  name: "Bahamas"
  adjective: "Bahamas"
  geography_triggers:
    - province_definition = province_definition:bahamas_province
  overlord_triggers:
    - any_primary_or_accepted_culture ?= { has_culture_group = culture_group:british_group }

C_HSP:
  name: "Hispaniola"
  adjective: "Hispaniolan"
  geography_triggers:
    - area = area:hispaniola_area
  overlord_triggers:
    - any_primary_or_accepted_culture ?= { has_culture_group = culture_group:iberian_group }

C_HAI:
  name: "Haiti"
  adjective: "Haitian"
  geography_triggers:
    - area = area:hispaniola_area
  overlord_triggers:
    - any_primary_or_accepted_culture ?= { has_culture_group = culture_group:french_group }

C_GUA:
  name: "Guatemala"
  adjective: "Guatemalan"
  geography_triggers:
    - region = region:central_america_region
  overlord_triggers:
    - any_primary_or_accepted_culture ?= { has_culture_group = culture_group:iberian_group }

# south america
C_NGN:
  name: "New Granada"
  adjective: "New Granadine"
  geography_triggers:
    - region = region:colombia_region
  overlord_triggers:
    - has_or_had_tag = CAS

C_COL:
  name: "Colombia"
  adjective: "Colombian"
  geography_triggers:
    - region = region:colombia_region
  overlord_triggers:
    - any_primary_or_accepted_culture ?= { has_culture_group = culture_group:iberian_group }

C_BRA:
  name: "Brazil"
  adjective: "Brazilian"
  geography_triggers:
    - region = region:brazil_region
  overlord_triggers:

C_PLA:
  name: "Platina"
  adjective: "Platinean"
  geography_triggers:
    - region = region:la_plata_region
  overlord_triggers:
    - any_primary_or_accepted_culture ?= { has_culture_group = culture_group:iberian_group }

C_PER:
  name: "Peru"
  adjective: "Peruvian"
  geography_triggers:
    - region = region:andes_region
  overlord_triggers:
    - any_primary_or_accepted_culture ?= { has_culture_group = culture_group:iberian_group }

C_NSP:
  name: "New Spain"
  adjective: "New Spanish"
  geography_triggers:
    - region = region:aridoamerica_region
    - region = region:mesoamerica_region
  overlord_triggers:
    - OR = { tag = SPA AND = { tag = CAS c:ARA ?= { is_subject_of = c:CAS } } }

# east africa

C_MOZ:
  name: "Mozambique"
  adjective: "Mozambiquean"
  geography_triggers:
    - region = region:swahili_coast_region
    - region = region:zimbabwe_region
  overlord_triggers:
    - tag = POR

