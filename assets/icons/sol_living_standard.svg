<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- SOL Standard of Living icon: a terracotta bowl heaped with bread, cheese and apples.
       Drawn by hand to match vanilla EU5 icon style (single object, transparent background,
       soft top-left light). Rendered by scripts/render_sol_icon.py.
       Elements with class="detail" are dropped for the 20px inline text icon. -->
  <defs>
    <linearGradient id="bowlBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7e3316"/>
      <stop offset="0.2" stop-color="#d47a43"/>
      <stop offset="0.4" stop-color="#c4642f"/>
      <stop offset="0.8" stop-color="#883717"/>
      <stop offset="1" stop-color="#561f0c"/>
    </linearGradient>
    <linearGradient id="bowlShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#000" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#2a0d04" stop-opacity="0.6"/>
    </linearGradient>
    <radialGradient id="bowlGloss" cx="0.28" cy="0.3" r="0.3">
      <stop offset="0" stop-color="#ffd8b0" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#ffd8b0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a84e24"/>
      <stop offset="0.28" stop-color="#f0a676"/>
      <stop offset="0.65" stop-color="#c8683a"/>
      <stop offset="1" stop-color="#6e2a12"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3e1a0a"/>
      <stop offset="0.28" stop-color="#6e3a1c"/>
      <stop offset="1" stop-color="#2e1206"/>
    </linearGradient>
    <linearGradient id="foot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5e240e"/>
      <stop offset="0.35" stop-color="#ad552a"/>
      <stop offset="1" stop-color="#421808"/>
    </linearGradient>
    <radialGradient id="bread" cx="0.34" cy="0.26" r="0.8">
      <stop offset="0" stop-color="#f2c06a"/>
      <stop offset="0.3" stop-color="#cf7f2e"/>
      <stop offset="0.7" stop-color="#9a4e18"/>
      <stop offset="1" stop-color="#6a330e"/>
    </radialGradient>
    <linearGradient id="crumb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff1c8"/>
      <stop offset="1" stop-color="#e8c07a"/>
    </linearGradient>
    <linearGradient id="cheeseTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff2a8"/>
      <stop offset="1" stop-color="#efc548"/>
    </linearGradient>
    <linearGradient id="cheeseSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f0c040"/>
      <stop offset="1" stop-color="#c08418"/>
    </linearGradient>
    <radialGradient id="apple" cx="0.34" cy="0.3" r="0.78">
      <stop offset="0" stop-color="#ff9070"/>
      <stop offset="0.28" stop-color="#e03a2a"/>
      <stop offset="0.72" stop-color="#a01a1a"/>
      <stop offset="1" stop-color="#560c0e"/>
    </radialGradient>
    <radialGradient id="apple2" cx="0.4" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#e86a48"/>
      <stop offset="0.4" stop-color="#b8261e"/>
      <stop offset="1" stop-color="#4e0a0c"/>
    </radialGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a6d452"/>
      <stop offset="1" stop-color="#3c7a1c"/>
    </linearGradient>
    <linearGradient id="wheat" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6d37a"/>
      <stop offset="1" stop-color="#b9802c"/>
    </linearGradient>
  </defs>

  <!-- back rim + warm interior -->
  <ellipse cx="256" cy="312" rx="178" ry="50" fill="url(#rim)"/>
  <ellipse cx="256" cy="315" rx="160" ry="39" fill="#4a1d0a"/>

  <!-- wheat ears behind the loaf, breaking the silhouette top-right -->
  <g class="detail" stroke="#9a6420" stroke-width="7" stroke-linecap="round" fill="none">
    <path d="M300,250 C318,190 340,140 370,96"/>
    <path d="M318,262 C346,210 378,172 414,140"/>
  </g>
  <g class="detail" fill="url(#wheat)" stroke="#8a5418" stroke-width="2">
    <ellipse cx="370" cy="100" rx="11" ry="22" transform="rotate(32 370 100)"/>
    <ellipse cx="356" cy="114" rx="10" ry="19" transform="rotate(-10 356 114)"/>
    <ellipse cx="378" cy="124" rx="10" ry="19" transform="rotate(62 378 124)"/>
    <ellipse cx="346" cy="136" rx="10" ry="18" transform="rotate(-10 346 136)"/>
    <ellipse cx="366" cy="146" rx="10" ry="18" transform="rotate(62 366 146)"/>
    <ellipse cx="414" cy="140" rx="11" ry="21" transform="rotate(50 414 140)"/>
    <ellipse cx="398" cy="148" rx="10" ry="18" transform="rotate(10 398 148)"/>
    <ellipse cx="414" cy="164" rx="10" ry="18" transform="rotate(80 414 164)"/>
    <ellipse cx="384" cy="168" rx="10" ry="17" transform="rotate(10 384 168)"/>
    <ellipse cx="400" cy="184" rx="10" ry="17" transform="rotate(80 400 184)"/>
  </g>

  <!-- round loaf (boule) with three slashes opening onto the crumb -->
  <path d="M100,350 C86,220 156,124 250,120 C346,116 404,210 396,350 C330,372 170,372 100,350 Z" fill="url(#bread)"/>
  <path d="M100,350 C102,318 114,296 128,284 C196,310 320,310 384,282 C394,300 398,326 396,350 C330,372 170,372 100,350 Z" fill="#4e2208" opacity="0.35"/>
  <g class="detail" opacity="0.22" fill="#5a2a0a">
    <ellipse cx="300" cy="170" rx="9" ry="6"/><ellipse cx="150" cy="240" rx="8" ry="5"/>
    <ellipse cx="340" cy="240" rx="10" ry="6"/><ellipse cx="230" cy="290" rx="9" ry="5"/>
  </g>
  <g>
    <!-- each slash: dark lip, light crumb lens -->
    <path d="M150,212 C186,166 236,140 290,134 C252,160 206,190 160,226 Z" fill="#5e2c0a" opacity="0.6"/>
    <path d="M156,214 C192,170 240,146 288,140 C252,170 204,196 162,220 Z" fill="url(#crumb)"/>
    <path d="M168,272 C214,214 280,182 352,176 C304,212 238,248 178,288 Z" fill="#5e2c0a" opacity="0.6"/>
    <path d="M174,274 C220,220 284,190 350,182 C302,220 236,254 180,282 Z" fill="url(#crumb)"/>
    <path d="M214,320 C254,276 310,250 372,246 C330,276 274,306 222,334 Z" fill="#5e2c0a" opacity="0.6"/>
    <path d="M220,322 C260,282 314,256 370,252 C328,284 272,310 226,328 Z" fill="url(#crumb)"/>
  </g>
  <ellipse cx="200" cy="160" rx="38" ry="16" fill="#fff3cf" opacity="0.35" transform="rotate(-30 200 160)"/>

  <!-- cheese wedge, front left -->
  <path class="detail" d="M70,318 L178,252 L222,316 L110,362 Z" fill="url(#cheeseSide)"/>
  <path class="detail" d="M70,318 L178,252 L222,316 Z" fill="url(#cheeseTop)"/>
  <path class="detail" d="M70,318 L178,252" stroke="#c8861c" stroke-width="5" stroke-linecap="round"/>
  <ellipse class="detail" cx="156" cy="300" rx="12" ry="7" fill="#d6a12e"/>
  <ellipse class="detail" cx="122" cy="310" rx="7" ry="4.5" fill="#d6a12e"/>
  <ellipse class="detail" cx="184" cy="284" rx="8" ry="5" fill="#d6a12e"/>
  <ellipse class="detail" cx="160" cy="340" rx="9" ry="7" fill="#b07614"/>
  <ellipse class="detail" cx="196" cy="328" rx="6" ry="5" fill="#b07614"/>

  <!-- apples, front right -->
  <circle class="detail" cx="420" cy="292" r="42" fill="url(#apple2)"/>
  <circle cx="362" cy="306" r="56" fill="url(#apple)"/>
  <path d="M362,256 C358,266 358,272 364,276" stroke="#5a1010" stroke-width="5" fill="none" opacity="0.6"/>
  <path d="M362,262 C364,246 370,234 380,226" stroke="#5a3418" stroke-width="7" stroke-linecap="round" fill="none"/>
  <path d="M376,236 C394,218 424,218 436,228 C420,246 394,250 376,236 Z" fill="url(#leaf)"/>
  <path class="detail" d="M378,236 C398,230 416,228 432,229" stroke="#2f5e14" stroke-width="2.5" fill="none"/>
  <ellipse cx="338" cy="284" rx="15" ry="10" fill="#fff" opacity="0.55" transform="rotate(-30 338 284)"/>

  <!-- front lip of the rim -->
  <path d="M78,312 A178,50 0 0 0 434,312 L416,315 A160,39 0 0 1 96,315 Z" fill="url(#rim)"/>
  <!-- bowl body -->
  <path id="b" d="M84,322 C92,414 164,470 256,470 C348,470 420,414 428,322 C380,352 322,362 256,362 C190,362 132,352 84,322 Z" fill="url(#bowlBody)"/>
  <path d="M84,322 C92,414 164,470 256,470 C348,470 420,414 428,322 C380,352 322,362 256,362 C190,362 132,352 84,322 Z" fill="url(#bowlShade)"/>
  <path d="M92,352 C160,384 352,384 420,352 L414,372 C346,404 166,404 98,372 Z" fill="url(#band)"/>
  <path class="detail" d="M96,362 C164,394 348,394 416,362" stroke="#eab676" stroke-width="4" fill="none" opacity="0.75" stroke-dasharray="12 10"/>
  <path d="M84,322 C92,414 164,470 256,470 C348,470 420,414 428,322 C380,352 322,362 256,362 C190,362 132,352 84,322 Z" fill="url(#bowlGloss)"/>
  <!-- foot -->
  <path d="M196,460 C226,470 286,470 316,460 L324,482 C294,494 218,494 188,482 Z" fill="url(#foot)"/>
</svg>
