l_simp_chinese:
 STATIC_MODIFIER_NAME_sol_living_standard_migration_modifier: "SOL生活水平：移民吸引力"
 STATIC_MODIFIER_DESC_sol_living_standard_migration_modifier: "当地生活水平每增加1点，移民吸引力增加0.02点；生活水平达到25时封顶为+0.5点。"
 STATIC_MODIFIER_NAME_sol_living_standard_low_growth_modifier: "SOL生活水平：人口增长减缓"
 STATIC_MODIFIER_DESC_sol_living_standard_low_growth_modifier: "当地生活水平低于0.1时，人口增长率降低0.1个百分点。"
 STATIC_MODIFIER_NAME_sol_living_standard_high_growth_modifier: "SOL生活水平：人口增长加快"
 STATIC_MODIFIER_DESC_sol_living_standard_high_growth_modifier: "当地生活水平高于10时，人口增长率提高0.1个百分点。"
