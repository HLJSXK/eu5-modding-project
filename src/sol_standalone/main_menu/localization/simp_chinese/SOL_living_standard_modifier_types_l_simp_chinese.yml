l_simp_chinese:
 MODIFIER_TYPE_NAME_local_sol_living_standard: "本地生活水平"
 MODIFIER_TYPE_DESC_local_sol_living_standard: "为各阶层增加固定生活水平，单位为每千人每年。生活水平 = 固定值之和 +（1 + 百分比之和）× 千人均年流动资金，最低为0。只影响移民吸引力、人口增长和排行；不增加资金，不改变购买力或需求。"
 MODIFIER_TYPE_NAME_local_sol_living_standard_modifier: "本地生活水平比例修正"
 MODIFIER_TYPE_DESC_local_sol_living_standard_modifier: "百分比修正相加后只乘千人均年流动资金，乘数最低为0，再加固定生活水平修正。只影响移民吸引力、人口增长和排行；不增加资金，不改变购买力或需求。"
