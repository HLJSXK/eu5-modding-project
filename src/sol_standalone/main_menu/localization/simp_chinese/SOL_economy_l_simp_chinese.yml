 # === SOL Core: Situation Panel Strings ===
 global_living_standard: "SOL-生活水平"
 global_living_standard_desc: "打开生活水平统计面板。\\n\\n系统每年刷新市场人口支出映射，并每月向每个地点施加local_pop_demand。"
