l_english:
 MODIFIER_TYPE_NAME_local_sol_living_standard: "Local Living Standard"
 MODIFIER_TYPE_DESC_local_sol_living_standard: "Adds a fixed amount to each estate's living standard, in annual units per thousand people. Living standard = fixed bonuses + (1 + summed percentage bonuses) * annual liquid funds per thousand, floored at zero. Affects migration attraction, population growth and rankings; adds no funds and does not change purchasing power or demand."
 MODIFIER_TYPE_NAME_local_sol_living_standard_modifier: "Local Living Standard Modifier"
 MODIFIER_TYPE_DESC_local_sol_living_standard_modifier: "Percentage bonuses add together and multiply only annual liquid funds per thousand, with a minimum multiplier of zero. Fixed living-standard bonuses are added afterward. Affects migration attraction, population growth and rankings; adds no funds and does not change purchasing power or demand."
