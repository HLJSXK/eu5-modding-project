l_english:
 # === SOL Base: Location Panel ===
 STATIC_MODIFIER_NAME_sol_local_pop_demand_modifier: "SOL Local Pop Demand"
 STATIC_MODIFIER_DESC_sol_local_pop_demand_modifier: "Monthly location demand coefficient sized as liquid funds divided by market-filtered base pop spending. Development-based demand scaling and per-good development gates are disabled."
 LOCATION_SOL_GUI_TITLE: "SOL-Standard of Living in [Location.GetNameWithNoTooltip]"
 LOCATION_SOL_GUI_SUMMARY: "#E Overview#!    GDP [Location.MakeScope.ScriptValue('local_wealth_display')|+2]  ×  [Location.MakeScope.ScriptValue('local_effective_control')|+=1%] control  =  tax base [Location.MakeScope.ScriptValue('local_tax_base_display')|+2]"
 LOCATION_SOL_GUI_FOOTER: "#R Demand is applied through a monthly location modifier. Market effects may still lag behind the displayed location values. #!"

 # === SOL Core: Situation Panel Strings ===
 global_living_standard: "SOL-Living Standard"
 global_living_standard_desc: "Opens the Living Standard statistics panel.\\n\\nThe system updates market pop-spending maps yearly and applies local_pop_demand to each location monthly."
 global_living_standard_recalculate: "Refresh Living Standard Cache"
 global_living_standard_recalculate_desc: "Immediately refresh the country cache pipeline for this situation."
 global_living_standard_recalculate_specific: "Refresh Living Standard Cache"
 global_living_standard_recalculate_specific_desc: "Immediately refresh the country cache pipeline for this situation."
 vote_in_global_living_standard_recalculate: "Select Living Standard Situation"
 vote_in_global_living_standard_recalculate_desc: "Select which Living Standard situation this action applies to."

