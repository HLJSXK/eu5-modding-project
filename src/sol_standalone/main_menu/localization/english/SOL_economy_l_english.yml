l_english:
 # === SOL Base: Location Panel ===
 STATIC_MODIFIER_NAME_sol_local_pop_demand_modifier: "SOL Local Pop Demand"
 STATIC_MODIFIER_DESC_sol_local_pop_demand_modifier: "Monthly location demand coefficient sized as liquid funds divided by market-filtered base pop spending. Development-based demand scaling and per-good development gates are disabled."
 LOCATION_SOL_GUI_TITLE: "SOL-Standard of Living in [Location.GetNameWithNoTooltip]"
 LOCATION_SOL_GUI_SUMMARY: "#E Overview#!    GDP [Location.MakeScope.ScriptValue('local_wealth_display')|+2]  ×  [Location.MakeScope.ScriptValue('local_effective_control')|+=1%] control  =  tax base [Location.MakeScope.ScriptValue('local_tax_base_display')|+2]"
 LOCATION_SOL_GUI_FOOTER: "#R Demand is applied through a monthly location modifier. Market effects may still lag behind the displayed location values. #!"

 # === SOL Core: Situation Panel Strings ===
 global_living_standard: "SOL-Living Standard"
 global_living_standard_desc: "Opens the Living Standard statistics panel.\\n\\nThe system updates market pop-spending maps yearly and applies local_pop_demand to each location monthly."
 global_living_standard_recalculate: "Refresh Living Standard Cache"
 global_living_standard_recalculate_desc: "Immediately refresh the country cache pipeline for this situation."
 global_living_standard_recalculate_specific: "Refresh Living Standard Cache"
 global_living_standard_recalculate_specific_desc: "Immediately refresh the country cache pipeline for this situation."
 vote_in_global_living_standard_recalculate: "Select Living Standard Situation"
 vote_in_global_living_standard_recalculate_desc: "Select which Living Standard situation this action applies to."

 # === CMF Log: Living Standard Solver ===
 CMF_LOG_SOL_DEMAND_REFRESH_START: "SOL demand refresh: start"
 CMF_LOG_SOL_DEMAND_REFRESH_SUCCESS_4: "SOL demand refresh: solved with 4 anchors"
 CMF_LOG_SOL_DEMAND_REFRESH_SUCCESS_5: "SOL demand refresh: solved with 5 anchors"
 CMF_LOG_SOL_DEMAND_REFRESH_SUCCESS_CLASS: "SOL demand refresh: solved with 4 classes"
 CMF_LOG_SOL_DEMAND_REFRESH_SUCCESS_APPROX: "SOL demand refresh: nonnegative approximation selected"
 CMF_LOG_SOL_DEMAND_FALLBACK_RAW: "SOL demand refresh: raw fallback (four-stratum gate rejected)"
 CMF_LOG_SOL_DEMAND_DETAIL_APPROX_STATUS_ACTION: "SOL approximation status:"
 CMF_LOG_SOL_DEMAND_DETAIL_APPROX_STATUS: "mode [GetVariableFromGlobalVariableMap('sol_cmf_demand_log_solve_mode', CMFLogKey(PdxGuiWidget.GetIndexInDataModel)).GetValue|0] size [GetVariableFromGlobalVariableMap('sol_cmf_demand_log_solver_size', CMFLogKey(PdxGuiWidget.GetIndexInDataModel)).GetValue|0] exact diagnostic [GetVariableFromGlobalVariableMap('sol_cmf_demand_log_exact_status', CMFLogKey(PdxGuiWidget.GetIndexInDataModel)).GetValue|0] selected strategy [GetVariableFromGlobalVariableMap('sol_cmf_demand_log_selected_strategy', CMFLogKey(PdxGuiWidget.GetIndexInDataModel)).GetValue|0]"
 CMF_LOG_SOL_DEMAND_DETAIL_APPROX_PREFILTER_ACTION: "SOL approximation entry:"
 CMF_LOG_SOL_DEMAND_DETAIL_APPROX_PREFILTER: "raw gate possible [GetVariableFromGlobalVariableMap('sol_cmf_demand_log_gate_possible', CMFLogKey(PdxGuiWidget.GetIndexInDataModel)).GetValue|0] nonempty classes [GetVariableFromGlobalVariableMap('sol_cmf_demand_log_anchor_count', CMFLogKey(PdxGuiWidget.GetIndexInDataModel)).GetValue|0] attempts [GetVariableFromGlobalVariableMap('sol_cmf_demand_log_candidate_attempt_count', CMFLogKey(PdxGuiWidget.GetIndexInDataModel)).GetValue|0] valid [GetVariableFromGlobalVariableMap('sol_cmf_demand_log_candidate_count', CMFLogKey(PdxGuiWidget.GetIndexInDataModel)).GetValue|0]"
 CMF_LOG_SOL_DEMAND_DETAIL_APPROX_REASON_ACTION: "SOL approximation reason:"
 CMF_LOG_SOL_DEMAND_DETAIL_APPROX_REASON: "reason code [GetVariableFromGlobalVariableMap('sol_cmf_demand_log_approx_reason', CMFLogKey(PdxGuiWidget.GetIndexInDataModel)).GetValue|0] (0=selected, 1=raw threshold, 2=too few classes, 3=no candidate entry, 4=all numeric candidates invalid, 5=all four-stratum gates rejected, 6=not run)"
 CMF_LOG_SOL_DEMAND_DETAIL_APPROX_RAW_TOTAL_ACTION: "SOL raw total residual:"
 CMF_LOG_SOL_DEMAND_DETAIL_APPROX_RAW_TOTAL: "raw minus target [GetVariableFromGlobalVariableMap('sol_cmf_demand_log_raw_total_residual', CMFLogKey(PdxGuiWidget.GetIndexInDataModel)).GetValue|5]"
 CMF_LOG_SOL_DEMAND_DETAIL_APPROX_METRICS_ACTION: "SOL approximation metrics:"
 CMF_LOG_SOL_DEMAND_DETAIL_APPROX_METRICS: "candidates [GetVariableFromGlobalVariableMap('sol_cmf_demand_log_candidate_count', CMFLogKey(PdxGuiWidget.GetIndexInDataModel)).GetValue|0]/gate [GetVariableFromGlobalVariableMap('sol_cmf_demand_log_candidate_gate_count', CMFLogKey(PdxGuiWidget.GetIndexInDataModel)).GetValue|0] mean ratio [GetVariableFromGlobalVariableMap('sol_cmf_demand_log_selected_average_ratio', CMFLogKey(PdxGuiWidget.GetIndexInDataModel)).GetValue|3] mean abs [GetVariableFromGlobalVariableMap('sol_cmf_demand_log_selected_average_absolute', CMFLogKey(PdxGuiWidget.GetIndexInDataModel)).GetValue|3]"
