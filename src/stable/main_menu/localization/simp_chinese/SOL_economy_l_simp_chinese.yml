 # === SOL Base: GDP-to-Development Modifier & Location Panel ===
 STATIC_MODIFIER_NAME_gdp_to_development_modifier: "SOL-税基->发展度"
 STATIC_MODIFIER_DESC_gdp_to_development_modifier: "每100本地财富提供0.002月发展度增长，每年更新。"
